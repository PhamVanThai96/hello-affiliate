- id: m01_fifo_cogs
  module: m01
  name_vi: Giá vốn theo FIFO (hai lô)
  name_en: COGS under FIFO (two lots)
  expression_latex: \text{COGS}_{FIFO}=\min(q_s,q_1)\,p_1+\max(q_s-q_1,0)\,p_2
  expression_python: min(q_sold, q1) * p1 + max(q_sold - q1, 0) * p2
  excel: =MIN(SLBan;SL1)*G1+MAX(SLBan-SL1;0)*G2
  variables:
  - q_sold
  - q1
  - p1
  - p2
  when_to_use: Giá nhập đổi theo lô và cần tính giá vốn khi bán; mở rộng nhiều lô bằng cách trừ dần lô cũ nhất.
- id: m01_weighted_avg_cogs
  module: m01
  name_vi: Giá vốn theo bình quân gia quyền (hai lô)
  name_en: COGS under Weighted Average (two lots)
  expression_latex: \bar p=\frac{q_1p_1+q_2p_2}{q_1+q_2};\ \text{COGS}=q_s\,\bar p
  expression_python: q_sold * (q1 * p1 + q2 * p2) / (q1 + q2)
  excel: =SLBan*(SL1*G1+SL2*G2)/(SL1+SL2)
  variables:
  - q_sold
  - q1
  - p1
  - q2
  - p2
  when_to_use: Muốn san bằng biến động giá, đơn giản; phổ biến ở SME và phần mềm kế toán.
