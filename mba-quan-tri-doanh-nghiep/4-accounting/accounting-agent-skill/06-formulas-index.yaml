- id: m01_dep_straight_line
  module: m01
  name_vi: Khấu hao đường thẳng
  name_en: Straight-line depreciation
  expression_latex: \text{Dep}=\frac{\text{Cost}-\text{Salvage}}{\text{Useful life}}
  expression_python: (cost - salvage) / life
  excel: =SLN(cost, salvage, life)
  variables:
  - cost
  - salvage
  - life
  when_to_use: Mặc định cho phần lớn TSCĐ có lợi ích đều theo thời gian; dễ giải trình thuế.
- id: m01_dep_declining_balance
  module: m01
  name_vi: Khấu hao số dư giảm dần (một năm)
  name_en: Declining balance depreciation (one year)
  expression_latex: \text{Dep}_t=\min\big(NBV_{t-1}\cdot r,\ NBV_{t-1}-\text{Salvage}\big)
