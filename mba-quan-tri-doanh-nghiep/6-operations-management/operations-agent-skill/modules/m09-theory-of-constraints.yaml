  - {metric: "Chi phí đào tạo/tư vấn TOC cho SME", value: "5-20 triệu VNĐ", context: "Ước tính tham khảo, cần cập nhật báo giá", confidence: "low"}
  - {metric: "Phần mềm CCPM", value: "hàng chục triệu VNĐ/năm", context: "Ước tính, cần cập nhật", confidence: "low"}
  - {metric: "Phần mềm APS", value: "hàng trăm triệu đến hàng tỷ VNĐ", context: "Ước tính, cần cập nhật", confidence: "low"}

pitfalls:
  - "Xác định ràng buộc theo cảm tính (máy cũ nhất, khâu bận nhất) thay vì dữ liệu năng lực thực và nơi hàng chờ tích tụ."
  - "Nhảy thẳng đến Elevate bỏ qua Exploit; đầu tư sai công đoạn (Delta T = 0)."
  - "Không đồng bộ các bộ phận khác theo ràng buộc: tồn kho tăng ở công đoạn không-ràng-buộc."
  - "Dừng sau khi giải quyết một ràng buộc; không Repeat, không chống quán tính."
  - "Bỏ qua ràng buộc thị trường/chính sách; mua năng lực thừa."
  - "Đo OEE/hiệu suất ở mọi máy và thưởng theo hiệu suất cục bộ."
  - "Dùng công suất danh nghĩa thay vì năng lực thực."
  - "Ưu tiên sản phẩm theo % lãi gộp hay giá thành phân bổ thay vì T/CU."
  - "Dùng T/CU khi ràng buộc không phải vật lý hoặc quên khách hàng chiến lược."
  - "Quên kiểm tải công đoạn khác sau khi đổi mix (chấn gấp 91,7% ở case inox)."
  - "Thiếu cam kết lãnh đạo, không đổi chỉ tiêu thưởng nên nhân viên phản đối nhàn rỗi có chủ đích."
  - "CCPM: phạt người báo trễ làm họ giấu dự phòng như cũ; vẫn giám sát từng nhiệm vụ thay vì buffer."
  - "Tính T/OE/I ở kỳ khác nhau, hoặc coi tồn kho là tài sản để làm đẹp lợi nhuận."
  - "Giảm kiểm tra chất lượng để tăng năng lực mà không có dữ liệu lỗi."
  - "Tin số liệu giả định minh họa là số thật; số liệu quốc tế (Ford/Boeing/Amazon) chỉ minh họa nguyên lý."

sme_vn_guidance:
  - "Khởi đầu miễn phí: quan sát, bảng Excel/Google Sheets năng lực từng công đoạn và T/CU (chi phí 0). Tăng trưởng: đào tạo/tư vấn TOC 5-20 triệu VNĐ (ước tính, cần cập nhật báo giá)."
  - "Phần mềm: CCPM chuyên dụng (ví dụ Realization/Concerto) hàng chục triệu VNĐ/năm; mô phỏng (Simul8, FlexSim) hàng chục triệu/năm; APS (SAP APO/Oracle APS) hàng trăm triệu đến hàng tỷ - chỉ cần khi ràng buộc dịch chuyển nhiều lần, nhiều kho/điểm bán, nhiều dự án song song (giá cần xác nhận báo giá hiện hành)."
  - "SME tập trung Exploit; doanh nghiệp lớn dùng đủ 5 bước kèm APS. Lợi thế SME: ít tầng quản lý, thay đổi nhanh."
  - "Việc đầu tiên cho chủ SME: đổi chỉ tiêu thưởng quản đốc từ 'hiệu suất máy' sang 'giao đúng nhịp'; giải thích bằng ví dụ của chính xưởng; cho nhân viên không ở ràng buộc hỗ trợ ràng buộc (đào tạo chéo)."
  - "Dịch vụ/bán lẻ: ngân hàng (quầy hồ sơ vay phức tạp), phòng khám (máy xét nghiệm/phòng mổ/chẩn đoán hình ảnh), bán lẻ (thanh toán giờ cao điểm), nhà hàng (bếp trưởng/quầy bar)."
  - "Lãi vay 11%/năm trong các ví dụ là giả định minh họa; cần thay bằng lãi suất thực tế của doanh nghiệp (cần xác nhận)."
  - "Module này không có số liệu thuế/pháp lý VN; chi phí phần mềm/đào tạo đều là ước tính tham khảo."

case_lessons:
  - name: "Ford - dây chuyền lắp ráp, ràng buộc ở máy sơn (minh họa nguyên lý)"
    type: "success"
    setup: "Dây chuyền 5 công đoạn (dập 70, hàn 60, sơn 42, lắp ráp 55, kiểm tra 65 xe/giờ), nhu cầu 50 xe/giờ; đầu tư rải rác nhưng sản lượng không tăng. Số liệu minh họa, không phải số liệu công bố của Ford."
    key_calculations:
      - "Đầu ra = min(70,60,42,55,65) = 42 < 50 -> sơn là ràng buộc."
      - "Tối ưu cục bộ: (10 + 18) x 8 = 224 xe dở dang/ca; x 2.500 USD = 560.000 USD/ca vốn chết."
      - "Exploit: sơn 42 -> 46; Delta T = 4 x 8 x 4.000 = 128.000 USD/ca."
      - "DBR: buffer 2 giờ x 46 = 92 xe thay vì +224 xe/ca; sử dụng dập 65,7%, hàn 76,7%."
    lesson: "Tìm nơi hàng chờ tích tụ trước khi duyệt đầu tư; DBR biến WIP tăng liên tục thành mức cố định; sau Exploit ràng buộc kế tiếp có thể là lắp ráp (55)."
    data_reliability: "illustrative"
  - name: "Nhà máy dệt-nhuộm-may Việt Nam - ràng buộc ở nhuộm (minh họa)"
    type: "success"
    setup: "Dệt 20, nhuộm 12, may 16 tấn/ngày; dệt vẫn chạy 20 vì thưởng quản đốc gắn 'hiệu suất máy dệt 95%'. Không nêu tên doanh nghiệp."
    key_calculations:
      - "Đầu ra = min(20,12,16) = 12 tấn/ngày; tích lũy 8 tấn/ngày x 20 ngày = 160 tấn."
      - "Little: LT = 160/12 = 13,3 ngày; DBR buffer 1,5 ngày x 12 = 18 tấn -> LT 1,5 ngày."
      - "Giải phóng (160-18) x 60 triệu = 8.520 triệu; lãi 11% -> ~937 triệu/năm."
    lesson: "Dệt cố ý chạy chậm làm chỉ số cục bộ giảm nhưng tiền cả doanh nghiệp tăng; phải đổi chỉ tiêu thưởng sang 'giao đủ đúng nhịp cho nhuộm'."
    data_reliability: "illustrative"
  - name: "Xưởng in TP.HCM - Exploit máy in offset cũ (SME)"
    type: "sme"
    setup: "1 máy in offset là ràng buộc, 480 phút/ca, 22 ngày/tháng, 8 đơn/ngày, OE 340 triệu/tháng, T/CU 60.000 VNĐ/phút. Chủ định mua máy mới hàng tỷ (ngoài khả năng tài chính)."
    key_calculations:
      - "Thời gian in thực 480 - 160 - 20 = 300 -> sau Exploit 480 - 96 - 15 = 369 phút (+23%)."
      - "T: 396 -> 487,08 triệu/tháng (+91,08); NP: 56 -> 147,08 triệu (~+163%)."
    lesson: "Gộp đơn, chuẩn bị khuôn/giấy khi máy đang chạy (SMED), duyệt mẫu trước: chi phí đầu tư gần 0; OE cố định nên T tăng chảy gần hết xuống NP. Chỉ Elevate khi Exploit hết dư địa."
    data_reliability: "illustrative"
  - name: "Doanh nghiệp đồ gỗ đầu tư CNC sai chỗ (thất bại)"
    type: "failure"
    setup: "Cắt 120, lắp ráp 150, sơn 90, đóng gói 140 bộ/ngày; mua CNC 3,2 tỷ vì 'cắt gỗ cũ nhất' mà không đo năng lực. T 1,2 triệu/bộ, 26 ngày, OE 2.100, I 12.000 (triệu)."
    key_calculations:
      - "Trước: đầu ra 90; T = 90 x 1,2 x 26 = 2.808; NP = 708; ROI 5,9%/tháng."
      - "Sau CNC: vẫn 90; OE = 2.100 + 53,3 + 10 = 2.163,3; NP = 644,7; ROI = 644,7/15.200 = 4,24%."
      - "Buồng sơn thứ hai 900 triệu: sơn 130 -> đầu ra 120; T = 3.744; OE 2.155; NP = 1.589; hoàn vốn 900/881 ~ 1,02 tháng."
    lesson: "Ba lỗi: quyết định cảm tính, không đo năng lực từng công đoạn, nhảy thẳng Elevate. Quy trình đúng: vẽ dòng chảy -> đo -> quan sát hàng chờ -> chỉ đầu tư ràng buộc kèm Delta T và hoàn vốn."
    data_reliability: "illustrative"
  - name: "Phòng khám đa khoa - ràng buộc ở máy xét nghiệm (SME dịch vụ)"
    type: "sme"
    setup: "1 máy 10 mẫu/giờ (80/ngày); nhu cầu 16/giờ trong 3 giờ cao điểm và 6/giờ trong 5 giờ còn lại (78/ngày)."
    key_calculations:
      - "Hàng chờ cao điểm (16-10) x 3 = 18 mẫu; chờ cuối cao điểm 18/10 = 1,8 giờ = 108 phút; trung bình ~52 phút."
      - "Hẹn lịch đều 78/8 = 9,75 mẫu/giờ < 10; thêm buffer ~3 mẫu (~18 phút) -> chờ TB dưới ~10-18 phút."
    lesson: "Ràng buộc dịch vụ thường nằm ở phân bố tải theo giờ chứ không ở tổng năng lực; điều chỉnh lịch (miễn phí) là giải pháp đầu tiên."
    data_reliability: "illustrative"
  - name: "Boeing - CCPM (minh họa nguyên lý)"
    type: "success"
    setup: "Chuỗi tới hạn 4 nhiệm vụ an toàn 20,16,24,12 ngày. Nguồn nói rõ không có số liệu công bố chính thức được kiểm chứng."
    key_calculations:
      - "An toàn 72; cắt 50% = 36; Project Buffer 18 (RSS sqrt(344) ~ 18,5); lịch 54 (-25%)."
      - "Sau 3 nhiệm vụ dùng 38 so với kế hoạch 30: 8/18 = 44% Vàng; 12/18 = 67% Đỏ."
    lesson: "Quản trị bằng mức tiêu hao buffer chung, không ép từng nhiệm vụ đúng hạn; relay-race; rủi ro nếu văn hóa vẫn phạt báo trễ."
    data_reliability: "unverified"
  - name: "Chuỗi nhà hàng Hà Nội - bếp trưởng là ràng buộc"
    type: "sme"
    setup: "3 chi nhánh, cao điểm 150 phút; món đặc biệt 185.000 - 78.000 = T 107.000 VNĐ/món, chỉ bếp trưởng hoàn thiện, nhu cầu 55 món/chi nhánh."
    key_calculations:
      - "Năng lực 150/4 = 37,5 món < 55; Exploit chuyển sơ chế và trình bày cho người khác: 2,5 phút -> 60 món (> 55)."
      - "Delta T = 17,5 x 107.000 = 1.872.500/ngày = 56,175 triệu/tháng/chi nhánh; trừ phụ bếp 8 -> 48,175; 3 chi nhánh ~144,5 triệu/tháng."
    lesson: "Ràng buộc là người có kỹ năng hiếm: Exploit = dồn việc không cần kỹ năng đó ra khỏi tay họ; rẻ hơn nhiều so với tuyển bếp trưởng thứ hai; sau đó ràng buộc chuyển sang thị trường."
    data_reliability: "illustrative"
  - name: "Trung tâm hoàn tất đơn hàng kiểu Amazon - trạm đóng gói (minh họa)"
    type: "success"
    setup: "Picking 1.200, sorting 1.100, đóng gói 800 (16 trạm x 50) đơn/giờ; nhu cầu 1.000. Không phải số liệu công bố của Amazon."
    key_calculations:
      - "Đầu ra 800 < 1.000; Exploit 50 -> 58 đơn/trạm: 16 x 58 = 928 (+16%)."
      - "Nếu picking vẫn 1.200: tồn 1.200 - 928 = 272 đơn/giờ, ca 10 giờ 2.720 đơn dở dang; Rope: phát đúng 928."
      - "Elevate: thêm 2 trạm (72/58 ~ 1,24 -> 2): 18 x 58 = 1.044 > 1.000."
    lesson: "Mùa cao điểm cho thấy giá trị Subordinate: không chạy nhanh khâu lấy hàng; Elevate chỉ sau Exploit."
    data_reliability: "illustrative"
  - name: "Bao bì carton Bình Dương - ràng buộc thị trường"
    type: "sme"
    setup: "Công suất 1.500 nghìn m2/tháng, bán 960 (64%); giá 9.000, NVL 6.300 -> T 2.700 VNĐ/m2; OE 2.200 triệu. Chủ định mua máy sóng 4,5 tỷ."
    key_calculations:
      - "T = 960.000 x 2.700 = 2.592 triệu; NP = 392 triệu."
      - "Phương án B: 3 sales + công cụ OE +55 triệu; giảm giá 2% -> T/m2 = 8.820 - 6.300 = 2.520; +270 nghìn m2 -> Delta T = 680,4; NP = 1.017,4 triệu (gấp ~2,6); sử dụng 82%."
    lesson: "Phân biệt ràng buộc thị trường và vật lý; mua máy khi chưa có đơn là lãng phí; Repeat: khi sử dụng gần 100% ràng buộc quay lại vật lý."
    data_reliability: "illustrative"
  - name: "Công ty logistics - ràng buộc ở bến bốc xếp"
    type: "sme"
    setup: "3 bến x 780 phút, mỗi xe chiếm bến 60 phút; đội xe đủ 50 chuyến/ngày; T 2,4 triệu/chuyến."
    key_calculations:
      - "Năng lực bến 3 x 780/60 = 39 chuyến < 50 xe."
      - "Exploit 60 -> 52 phút: 3 x 780/52 = 45 chuyến (+6, +15,4%); Delta T = 6 x 2,4 x 26 = 374,4 triệu/tháng."
    lesson: "Mua thêm xe ở trạng thái ban đầu chỉ tăng chi phí vì cổng kho chặn ở 39; sau Exploit ràng buộc kế tiếp có thể là đội xe."
    data_reliability: "illustrative"
  - name: "Nhà máy linh kiện điện tử Bắc Ninh - ràng buộc ở QC"
    type: "sme"
    setup: "6 nhân viên QC kiểm 100% mỗi sp 90 giây; lắp ráp 320 sp/giờ."
    key_calculations:
      - "Năng lực 6 x 3.600/90 = 240 sp/giờ."
      - "Kiểm theo rủi ro: 0,8 x 90 + 0,2 x 45 = 81 giây; đào tạo chéo 2 người x 4/8 -> 7 người; năng lực 7 x 3.600/81 = 311,1 (+29,6%)."
    lesson: "Kiểm theo rủi ro + đào tạo chéo; giảm kiểm tra cần dữ liệu tỷ lệ lỗi và thỏa thuận khách hàng, nếu không hàng trả về vượt lợi ích; ràng buộc sắp chuyển về lắp ráp."
    data_reliability: "illustrative"
  - name: "Chuỗi cửa hàng tiện lợi 40 cửa hàng - Replenishment"
    type: "sme"
    setup: "Hết hàng 8,5%, tồn 14 ngày bán; doanh thu 800 triệu/ngày, giá vốn 600 triệu/ngày, T ~25% doanh thu."
    key_calculations:
      - "Buffer nước suối 18 x 1 x 2 = 36; DBM 36 x 4/3 = 48."
      - "Sau 6 tháng: OOS 3,2%, tồn 9 ngày; vốn giải phóng 600 x 5 = 3.000 triệu, lãi 11% = 330 triệu/năm."
      - "Doanh thu thu hồi: (8,5% - 3,2%) x 40% = 2,12% -> 16,96 triệu/ngày; T 25% ~ 4,24 triệu/ngày ~ 1.548 triệu/năm."
    lesson: "Gom buffer ở kho trung tâm, bổ sung theo tiêu thụ thực, điều chỉnh buffer bằng dữ liệu."
    data_reliability: "illustrative"
  - name: "Xưởng inox Thành Phát (Biên Hòa) - product mix quanh máy laser (SME, case tổng hợp)"
    type: "sme"
    setup: "3 sản phẩm (Kệ, Chậu, Bàn) dùng chung laser 2.400 phút/tuần; OE 55 triệu/tuần; chủ ưu tiên Bàn vì lãi gộp 60%. Tên và số liệu hoàn toàn hư cấu."
    key_calculations:
      - "Tải laser nếu làm đủ: 1.000 + 1.600 + 2.700 = 5.300 phút = 220,8% (ràng buộc); chấn 91,7%; hàn 66,7%; đánh bóng 65,6%."
      - "T/CU: Kệ 44,0; Chậu 30,0; Bàn 26,67. Mix theo lãi gộp: T = 64,04 triệu, NP 9,04. Mix TOC (100 Kệ + 70 Chậu): T = 86, NP = 31 triệu/tuần (gấp ~3,4)."
      - "Elevate laser 2 (600 triệu, +3,5 triệu OE): T = 149,6; Delta T ròng 60,1/tuần; hoàn vốn ~10 tuần."
    lesson: "Quyết định theo % lãi gộp làm mất ~22 triệu/tuần; có thể tăng giá Bàn lên >= 2.150k hoặc chỉ nhận khi laser rảnh; kiểm tải công đoạn khác; Elevate sau khi tối ưu mix; lưu ý khách chiến lược."
    data_reliability: "illustrative"

worked_examples:
  - name: "Nhận diện ràng buộc và chi phí của tối ưu cục bộ (A-B-C-D)"
    inputs: {capacities: "A 120, B 90, C 75, D 100 sp/giờ", demand: 80, hours: 8}
    steps:
      - "Đầu ra = min(120, 90, 75, 100) = 75 < 80 -> C là ràng buộc."
      - "Tỷ lệ sử dụng khi dòng chảy 75: A 62,5%, B 83,3%, C 100%, D 75%."
      - "Nếu mọi công đoạn chạy tối đa: trước B 30 x 8 = 240, trước C 15 x 8 = 120, tổng 360 bán thành phẩm/ca."
      - "Exploit nâng C lên 82 -> đầu ra min(120,90,82,100,80) = 80; Delta T = 5 x 40.000 x 8 x 26 = 41,6 triệu/tháng."
    result: "C ràng buộc; Exploit cho +41,6 triệu/tháng; sau đó ràng buộc là thị trường (80 sp/giờ)."
  - name: "Product mix xưởng inox theo T/CU (Thành Phát)"
    inputs: {laser_minutes: 2400, OE_per_week_million: 55}
    steps:
      - "T/CU: Kệ 440/10 = 44,0; Chậu 600/20 = 30,0; Bàn 1.200/45 = 26,67."
      - "Kệ 100 chiếc dùng 1.000 phút; Chậu min(80, 1.400/20 = 70) = 70 dùng 1.400 phút; Bàn 0."
      - "T = 100 x 440 + 70 x 600 = 86.000 k = 86 triệu; NP = 86 - 55 = 31 triệu/tuần."
      - "So sánh mix lãi gộp: Bàn 53 + Kệ 1: T = 64.040 k; NP = 9,04 triệu."
    result: "TOC hơn 21,96 triệu T/tuần; NP gấp ~3,4 lần."
  - name: "So sánh đầu tư sai chỗ và đúng chỗ (đồ gỗ)"
    inputs: {T_per_set_million: 1.2, days: 26, OE: 2100, I: 12000}
    steps:
      - "Hiện trạng: 90 bộ -> T = 90 x 1,2 x 26 = 2.808; NP = 708; ROI = 5,9%."
      - "CNC 3,2 tỷ: đầu ra vẫn 90; OE = 2.100 + 3.200/60 + 10 = 2.163,3; NP = 644,7; ROI = 644,7/15.200 = 4,24%."
      - "Buồng sơn 900 triệu: đầu ra 120; T = 3.744; OE = 2.155; NP = 1.589; hoàn vốn 900/881 ~ 1,02 tháng."
    result: "Đúng chỗ NP 1.589 triệu/tháng so với sai chỗ 644,7."
  - name: "CCPM chuỗi 5 nhiệm vụ và theo dõi buffer"
    inputs: {safe_estimates: [8, 6, 10, 12, 4]}
    steps:
      - "Tổng an toàn = 40; cắt 50% = 4,3,5,6,2 = 20 ngày."
      - "Project Buffer 50% = 10 ngày; lịch = 30 ngày (-25%); RSS = sqrt(90) ~ 9,5."
      - "Chuỗi thực tế 24 ngày: tiêu hao 24 - 20 = 4 ngày -> 4/10 = 40% Vàng; nếu 27 ngày: 7/10 = 70% Đỏ."
    result: "Lịch 30 ngày; 24 ngày thực tế = Vàng."
  - name: "OEE tại ràng buộc và ưu tiên cải thiện"
    inputs: {plan_min: 480, downtime: 60, ideal_rate: 1.2, actual: 441, good: 427}
    steps:
      - "Chạy 420 phút -> A = 420/480 = 87,5%."
      - "Lý tưởng 420 x 1,2 = 504; P = 441/504 = 87,5%; Q = 427/441 = 96,8%."
      - "OEE = 0,875 x 0,875 x 0,968 = 74,1% (kiểm: 427/576)."
    result: "OEE 74,1%; ưu tiên giảm dừng máy/chuyển đổi (A) và chạy chậm (P), rồi Q."
  - name: "Chọn Exploit hay Elevate theo hoàn vốn"
    inputs: {T_now_million: 150, exploit_gain: 0.10, exploit_cost: 2, elevate_capex: 800, elevate_gain: 0.20, delta_oe: 5}
    steps:
      - "Exploit: +10% x 150 = 15 triệu/tháng; hoàn vốn 2/15 = 0,13 tháng (~4 ngày)."
      - "Elevate: +20% x 150 = 30 - 5 = 25 triệu/tháng; hoàn vốn 800/25 = 32 tháng."
    result: "Exploit trước; Elevate chỉ khi còn thiếu và nhu cầu xác nhận."

practice_questions:
  - q: "Dây chuyền Cắt 60, Hàn 45, Sơn 38, Đóng gói 50 (sp/giờ), nhu cầu 48. (a) Ràng buộc? (b) Tỷ lệ sử dụng? (c) Nếu Sơn nâng lên 44?"
    a: "(a) min = 38 < 48 -> Sơn. (b) Cắt 63,3%, Hàn 84,4%, Sơn 100%, Đóng gói 76%. (c) Đầu ra 44 (vẫn < 48), Sơn vẫn là ràng buộc; nâng lên 45+ thì Hàn (45) là ràng buộc kế tiếp."
  - q: "Ba sản phẩm chung ràng buộc 900 phút/tuần: X giá 500k, NVL 200k, 15 phút, cầu 30; Y 420k, 150k, 10 phút, cầu 40; Z 300k, 60k, 6 phút, cầu 50. Tính T/CU, mix, T; so với xếp theo T/đơn vị."
    a: "T/CU: X 20, Y 27, Z 40 -> Z, Y, X. Z 50 (300 phút), Y 40 (400), X 13 (195). T = 12.000 + 10.800 + 3.900 = 26.700k. Theo T/đơn vị: X 30, Y 40, Z 8 -> 21.720k. Chênh 4.980k (~23%)."
  - q: "Doanh thu 2.000, NVL 800, OE 900, I 3.600 (triệu/tháng). Tính T, NP, ROI, T/OE, T/I; giảm OE 10% hay tăng T 10%?"
    a: "T 1.200; NP 300; ROI 8,33%/tháng; T/OE 1,33; T/I 0,333. Giảm OE 10% -> NP 390 (+30%); tăng T 10% -> NP 420 (+40%)."
  - q: "Ràng buộc tạo T 150 triệu/tháng. Exploit: +10% T, chi phí 2 triệu. Elevate: máy 800 triệu, +20% T, OE +5 triệu/tháng. Hoàn vốn và thứ tự?"
    a: "Exploit hoàn vốn 2/15 ~ 0,13 tháng; Elevate 800/(30-5) = 32 tháng. Exploit trước."
  - q: "Ca 480 phút, dừng 60 phút, tốc độ lý tưởng 1,2 sp/phút, thực làm 441, đạt 427. Tính A, P, Q, OEE."
    a: "A 87,5%; P 441/504 = 87,5%; Q 96,8%; OEE 74,1%. Ưu tiên A và P."
  - q: "Chuỗi 5 nhiệm vụ an toàn 8,6,10,12,4 ngày: lịch theo quy tắc 50%, buffer RSS, vùng buffer nếu thực tế 24 ngày."
    a: "Cắt 20 ngày; buffer 10; lịch 30 (giảm 25%); RSS sqrt(90) ~ 9,5; 24 ngày -> 4/10 = 40% Vàng (27 ngày -> 70% Đỏ)."
  - q: "Buffer mỗi đơn 4 ngày, ba đơn đã tiêu hao 1; 2,2; 3,4 ngày. Phân vùng và hành động."
    a: "25% Xanh (không can thiệp); 55% Vàng (tìm nguyên nhân, chuẩn bị); 85% Đỏ (hành động ngay)."
  - q: "WIP trước ràng buộc 90 tấn, ràng buộc 15 tấn/ngày. Lead time chờ? Nếu WIP 30?"
    a: "LT = 90/15 = 6 ngày; WIP 30 -> 2 ngày (giảm 4 ngày, đầu ra vẫn 15 tấn/ngày)."
  - q: "Công suất 10.000 sp/tháng, bán 7.000, T 50.000/sp, OE 280 triệu. (A) mua máy 900 triệu +30% công suất; (B) 2 sales 40 triệu/tháng, mỗi người +1.200 sp. NP?"
    a: "Hiện tại NP = 350 - 280 = 70 triệu. (A) Delta T = 0, OE tăng khấu hao -> NP giảm. (B) +2.400 sp -> Delta T 120; Delta NP 80 -> NP 150 triệu (~2,14 lần); sử dụng 94%."
  - q: "Vì sao Exploit phải làm trước Elevate? Vì sao dừng sau khi giải quyết một ràng buộc là sai lầm?"
    a: "Exploit gần như miễn phí và có thể đủ (vd xưởng in +23%); Elevate tốn vốn và rủi ro nếu sai ràng buộc. Ràng buộc dịch chuyển (có thể sang thị trường) và quán tính chính sách nên phải Repeat."
  - q: "Xây CRT cho 'nhân viên thường xuyên trễ deadline' và Evaporating Cloud cho 'giảm chi phí' và 'tăng chất lượng dịch vụ'."
    a: "CRT: trễ deadline <- nhận việc đột xuất <- không có quy tắc ưu tiên và đa nhiệm <- gốc: chính sách 'ai cũng phải đáp ứng mọi yêu cầu ngay'. Cloud: mục tiêu 'dịch vụ bền vững có lợi nhuận'; B giữ chi phí thấp - D cắt người; C chất lượng cao - D' thêm nhân sự/đào tạo; phá giả định 'chất lượng chỉ từ thêm người' bằng chuẩn hóa quy trình tại khâu ràng buộc."

checklist:
  - "Chuẩn bị: có dữ liệu năng lực thực tế (không phải công suất danh nghĩa) từng công đoạn?"
  - "Chuẩn bị: lãnh đạo cấp cao cam kết bảo vệ nguyên lý 'nhàn rỗi có chủ đích'?"
  - "Chuẩn bị: có kế hoạch truyền thông và đổi chỉ tiêu thưởng khỏi hiệu suất cục bộ?"
  - "Chuẩn bị: đã chọn công cụ theo dõi Buffer Management phù hợp quy mô?"
  - "Identify: ràng buộc xác định bằng dữ liệu và kiểm chứng bằng nơi hàng chờ tích tụ?"
  - "Đã phân loại ràng buộc: vật lý, thị trường, chính sách, nguồn lực?"
  - "Exploit: đã thử tối ưu miễn phí trước khi cân nhắc đầu tư (Elevate)?"
  - "Đã xếp ưu tiên sản phẩm theo T/CU khi chung ràng buộc, và kiểm tải các công đoạn khác sau khi đổi mix?"
  - "Đã thiết lập Drum, Buffer, Rope và giải thích lý do công đoạn khác giảm tốc?"
  - "Đã giám sát tiêu hao buffer thay vì từng công đoạn riêng lẻ?"
  - "Đã tính Delta T, chi phí, hoàn vốn trước mọi khoản Elevate?"
  - "Đã lên kế hoạch Repeat định kỳ và theo dõi ràng buộc chính sách do quán tính?"
  - "KPI: T, tỷ lệ sử dụng ràng buộc, Buffer Penetration, lead time, OEE tại ràng buộc (> 85% tham khảo), giao đúng hạn (> 95% tham khảo)."
  - "Rủi ro: xác định sai ràng buộc, ràng buộc dịch chuyển, nhân viên phản đối, Elevate quá sớm, thiếu cải tiến liên tục đều có biện pháp giảm thiểu?"
  - "Mức trưởng thành: Cấp 1 nhận thức; 2 áp dụng đơn lẻ; 3 hệ thống hóa (5 bước + Buffer Management); 4 văn hóa tổ chức."
  - "Số liệu giả định minh họa đã được gắn nhãn; số liệu thực của doanh nghiệp được thay vào trước khi kết luận."

excel_google_sheets_templates:
  - name: "Bảng phân tích năng lực xác định ràng buộc"
    layout: "Cột: Công đoạn | Năng lực tối đa (đơn vị/giờ) | Nhu cầu/dòng chảy thực tế | Tỷ lệ sử dụng = dòng chảy/năng lực | Là ràng buộc? (gần 100%)"
    formulas: "Tỷ lệ = C2/B2; Đầu ra hệ thống = MIN(B2:B5, nhu cầu)"
  - name: "Báo cáo Buffer Management hằng ngày"
    layout: "Cột: Ngày | Đơn hàng | Buffer tiêu hao (ngày) | % tiêu hao | Vùng (Xanh/Vàng/Đỏ/Vượt) | Hành động. Ví dụ buffer 3 ngày: DH-101 20% Xanh; DH-102 50% Vàng; DH-103 80% Đỏ; DH-104 110% vượt."
    formulas: "% = tiêu hao/tổng buffer; vùng bằng IF: <=33% Xanh, <=66% Vàng, <=100% Đỏ, còn lại Vượt buffer"
  - name: "Mẫu tính T/CU và product mix"
    layout: "A Sản phẩm | B Giá bán | C NVL | D Phút ràng buộc | E Nhu cầu tối đa | F T | G T/CU | H Thứ hạng | I Số lượng | J Tổng T; ô K1 = tổng phút ràng buộc/kỳ. Sắp xếp theo T/CU giảm dần trước khi phân bổ."
    formulas: "F2=B2-C2; G2=F2/D2; H2=RANK(G2,$G$2:$G$4,0); I (hạng 1)=MIN(E2,ROUNDDOWN($K$1/D2,0)); các hạng sau trừ phút đã dùng (SUMPRODUCT); NP = SUM(J) - OE; thêm bảng kiểm tải công đoạn khác (không vượt 100%)."
  - name: "Bảng so sánh Elevate"
    layout: "Phương án | Vốn | Delta T | Delta OE | Hoàn vốn = Vốn/(Delta T - Delta OE) | NP kỳ | ROI"
    formulas: "=B2/(C2-D2)"
  - name: "Công cụ khác"
    layout: "Phần mềm CCPM (Realization/Concerto), APS (SAP APO/Oracle APS), mô phỏng (Simul8, FlexSim); SME dùng Excel/Google Sheets (miễn phí)."
    formulas: "-"
