  - {metric: "Tỷ lệ lưu kho H/giá vốn", value: "15-30%/năm; hàng dễ hỏng cao hơn", context: "Ước tính tham khảo trong nguồn", confidence: "medium"}
  - {metric: "Tỷ trọng ABC", value: "A 10-20% mã (70-80% giá trị); B 20-30% mã (15-25%); C 50-70% mã (5-10%)", context: "Nguyên lý Pareto", confidence: "medium"}
  - {metric: "Hệ số Z theo mức phục vụ", value: "90% 1.28; 95% 1.65; 97.5% 1.96; 99% 2.33; 99.9% 3.09", context: "Bảng chuẩn thống kê", confidence: "high"}
  - {metric: "Tần suất kiểm kê", value: "A tháng/tuần; B quý; C nửa năm/năm", context: "Cycle counting khuyến nghị", confidence: "medium"}
  - {metric: "Tỷ lệ hết hàng", value: "< 5%", context: "Mục tiêu KPI tham khảo", confidence: "medium"}
