pitfalls:
  - "Áp dụng cùng một chính sách tồn kho cho mọi SKU (lãng phí nguồn lực quản trị) - phân ABC."
  - "Không tính biến động nhu cầu/lead time khi tính SS, hoặc SS dựa hoàn toàn vào cảm tính - dùng Z và sigma, đo cả sigma_L."
  - "Copy EOQ máy móc, bỏ MOQ/sức chứa/quy cách đóng gói."
  - "Không kiểm kê định kỳ: số hệ thống lệch thực tế (garbage in, garbage out)."
  - "Theo đuổi JIT tuyệt đối mà không đánh giá rủi ro chuỗi cung ứng; không giữ buffer cho hàng quan trọng."
  - "Chạy theo chiết khấu số lượng mà không tính tổng chi phí; ứ vốn, hàng hỏng/lỗi thời."
  - "Doanh nghiệp lớn: SS đặt một lần không cập nhật (tính lại hằng quý); đầu tư IT/RFID/IoT khi dữ liệu không chuẩn hoặc thiếu tích hợp, không tính ROI."
  - "Nhầm cycle service level với fill rate; chọn mức phục vụ cao cho mọi mã."
  - "Chỉ tối ưu EOQ mới mà không thanh lý hàng chậm: vốn nằm ở hàng cũ vẫn kéo lùi hiệu quả."
  - "Quên trừ hàng đang về khi tính lượng đặt order-up-to; dùng SS liên tục cho hệ thống định kỳ."

sme_vn_guidance:
  - "Khởi nghiệp: sổ sách/Excel (0-5 triệu, ước tính); tăng trưởng: phần mềm bán hàng có module tồn kho như KiotViet, Sapo (3-10 triệu/năm ước tính, nên kiểm tra bảng giá hiện hành); Odoo Inventory 50-150 triệu/năm gồm triển khai (ước tính); SAP EWM/Oracle WMS hàng tỷ/năm cho doanh nghiệp lớn."
  - "SME: ABC thủ công trên Excel 1-2 lần/năm, EOQ/SS công thức cơ bản, định kỳ (periodic review) phổ biến, kiểm kê toàn bộ 1-2 lần/năm tiến tới cycle counting."
  - "Barcode (máy quét + phần mềm) 5-20 triệu; RFID 100 triệu-vài tỷ; IoT cảm biến từ ~200 triệu (ước tính, cần xác nhận)."
  - "Hàng ký gửi giảm rủi ro nhập hàng cho hàng mới/thời trang/mỹ phẩm."
  - "Nhập khẩu lead time dài ở VN: sigma_L thường lớn (tàu biển trễ, thời tiết): ký hợp đồng cam kết giao đúng hạn, đa dạng NCC."
  - "Dược phẩm: tuân thủ quy định chuyên ngành khi xử lý thuốc cận date/tiêu hủy."
  - "Kế toán: trích lập dự phòng giảm giá hàng tồn kho (nguồn nhắc Thông tư 48/2019/TT-BTC; cần đối chiếu văn bản hiện hành)."
  - "Sàn TMĐT: dùng phần mềm đồng bộ đa kênh, trừ kho ngay, đệm 1-2 đơn vị mỗi sàn."
  - "Thời trang online: đặt lô thử nhỏ, bán thử qua livestream/pre-order, rồi đặt lô lớn cho mẫu bán chạy."
  - "Lãi vay giả định 12%/năm trong các case chỉ minh họa; thay bằng lãi vay thực của doanh nghiệp."

case_lessons:
  - name: "Toyota - Kanban, JIT và bài học đệm chiến lược"
    type: "success"
    setup: "TPS do Taiichi Ohno xây dựng từ thập niên 1950 (Nhật hậu chiến thiếu vốn, nhà xưởng chật, nhiều mẫu xe); pull bằng Kanban, SMED giảm setup, giao hàng sát dây chuyền. Phần định lượng là giả định minh họa về cách tính số thẻ."
    key_calculations:
      - "N = 400 x 0.5 x 1.1 / 20 = 11 thẻ, tối đa 220 chi tiết"
      - "L = 0.25 ngày: N = 5.5 làm tròn 6 thẻ, 120 chi tiết (giảm 45%)"
      - "1,000 vòng kéo tương tự giảm 100 chi tiết/vòng = 100,000 chi tiết ít hơn phải đầu tư vốn"
    lesson: "JIT tối ưu chi phí tồn kho nhưng không tối ưu rủi ro gián đoạn: phân biệt linh kiện dễ thay (JIT) với độc quyền/khó thay (đệm JIC). Giảm tồn kho là cách phát hiện vấn đề, không phải mục đích. SME áp dụng nguyên tắc lô nhỏ, giao nhiều lần với NCC gần. Theo các nguồn tin kinh tế Toyota xây chiến lược đệm cho linh kiện quan trọng sau 2011 nên chịu tác động nhẹ hơn trong khủng hoảng chip 2020-2022 (ước tính theo báo chí, cần đối chiếu nguồn)."
    data_reliability: "unverified"
  - name: "Vinamilk - tồn kho nguyên liệu sữa (vận dụng phương pháp)"
    type: "success"
    setup: "Sữa tươi dễ hư, sữa bột nhập khẩu lead time dài. Chỉ nêu cách vận dụng khái quát (ABC cho hàng nghìn SKU, ERP, SS tính theo biến động nhu cầu và lead time); mọi số liệu là giả định minh họa, không phải dữ liệu nội bộ."
    key_calculations:
      - "d=50 tấn/ngày, sigma_d=8, L=50, Z=1.65: SS = 1.65 x 8 x sqrt(50) = 93.3 tấn; ROP = 2,593 tấn; 99% -> SS ~131.8"
      - "sigma_L=7 ngày: SS = 1.65 x sqrt(50x64 + 2500x49) = 1.65 x 354.5 = ~585 tấn; ROP ~3,085 tấn (gấp hơn 6 lần)"
    lesson: "Với lead time dài, biến động thời gian giao hàng mới là nguồn rủi ro chính; phải tính SS bằng công thức, dùng ABC để áp mức phục vụ khác nhau theo nhóm (A 97.5-99%, B 95%, C 90%) và đầu tư quản trị NCC (đa dạng hóa, theo dõi lịch tàu, hợp đồng giao ổn định)."
    data_reliability: "illustrative"
  - name: "VLXD Hậu Giang (Cần Thơ) - ABC + EOQ + ROP"
    type: "sme"
    setup: "Cửa hàng >500 mã, quản lý sổ sách; COGS 10.8 tỷ/năm, tồn bình quân 2.4 tỷ; hết xi măng/sắt nhóm A 15% nhưng ~30% giá trị tồn (720 triệu) là gạch mẫu/thiết bị vệ sinh ít bán. Toàn bộ giả định minh họa."
    key_calculations:
      - "Vòng quay = 10.8/2.4 = 4.5; DIO = 81 ngày"
      - "ABC: A 75 mã (75% doanh thu), B 125 mã (18%), C 300 mã (7%); lượt đếm 75x12+125x4+300 = 1,700/năm = 5.7 mã/ngày"
      - "Xi măng: D=36,000; S=300,000; H=0.25x90,000=22,500: EOQ=sqrt(960,000)=980 bao, N=36.7, chu kỳ 9.8 ngày"
      - "Lô cũ 2,000: 5.4+22.5 = 27.9 triệu; EOQ: ~22.05 triệu; tiết kiệm 5.85 triệu; tồn chu kỳ 1,000 -> 490 bao, giải phóng 45.9 triệu"
      - "SS = 1.65 x 25 x sqrt(2) = 58.3; ROP = 258 bao (gọi đại lý khi còn ~260, đặt 980)"
      - "Thanh lý nhóm C: 720 -> 576 triệu, giải phóng 144 triệu; tồn mới = 2,400 - 144 - (45.9 - 5.22) = 2,215.3; vòng quay 4.88; DIO ~75"
      - "Lợi ích ~5.85 + 144 x 12% = 23.1 triệu/năm"
    lesson: "ABC + EOQ + ROP + phần mềm bán hàng giá rẻ đủ để SME cải thiện rõ; EOQ để tránh hai thái cực lô quá lớn/nhỏ, không phải đặt chính xác; phải đi kèm thanh lý hàng chậm."
    data_reliability: "illustrative"
  - name: "Thời trang truyền thống vs Zara - newsvendor"
    type: "failure"
    setup: "Hàng thời trang đặt trước cả mùa (~6 tháng) sai số dự báo lớn, cuối mùa giảm sâu (thường nhắc 50-70%, ước tính theo báo chí ngành); Zara (Inditex) được phân tích như mô hình ngược (lô nhỏ, phản hồi nhanh). Số liệu là giả định minh họa."
    key_calculations:
      - "Cu = 300,000; Co = 50,000; CR = 0.857; Z = 1.068"
      - "sigma=4,000 (sai số 40%): Q* ~14,270; dư ~4,563 -> 228 triệu; thiếu -> 88 triệu; tổng ~316 triệu"
      - "sigma=1,500 (15%): Q* ~11,601; dư ~1,711 -> 86 triệu; thiếu -> 33 triệu; tổng ~119 triệu (giảm ~62%)"
    lesson: "Tốc độ phản hồi (rút ngắn lead time tới lúc biết rõ nhu cầu) có giá trị hơn dự báo giỏi hơn; thương lượng quyền đổi/trả để giảm Co; SME online: lô thử nhỏ, livestream/pre-order rồi đặt lô lớn."
    data_reliability: "illustrative"
  - name: "Chuỗi nhà thuốc An Khang (Hà Nội) - FEFO và order-up-to"
    type: "sme"
    setup: "8 nhà thuốc; tồn bình quân 4.8 tỷ; tiêu hủy hết hạn 4%/năm = 192 triệu. Giả định minh họa."
    key_calculations:
      - "Thuốc A: d=15, sigma_d=5, R=7, L=2, Z=1.65: SS = 24.75; S = 15x9 + 24.75 ~ 160 hộp"
      - "R=30: SS ~46.7; S ~527 hộp; tồn bình quân tuần ~77.3 hộp so với tháng ~271.7 (ít hơn ~3.5 lần)"
      - "Tiêu hủy 4% -> 0.8%: 38.4 triệu; tiết kiệm 192 - 38.4 = 153.6 triệu/năm"
    lesson: "Hàng hạn dùng: FEFO và kiểm tra định kỳ chu kỳ ngắn quan trọng hơn EOQ; cảnh báo 3 tháng đổi tiêu hủy thành khuyến mãi/điều chuyển; lưu ý quy định dược khi xử lý thuốc cận date."
    data_reliability: "illustrative"
  - name: "Hòa Phát Parts (Biên Hòa) - chính sách theo nhóm ABC"
    type: "sme"
    setup: "~600 mã, 4 nhân viên; COGS 1,643 triệu; tồn bình quân 410.75 triệu (vòng quay 4.0; DIO 91). Dùng 10 nhóm hàng đại diện. Toàn bộ giả định minh họa."
    key_calculations:
      - "ABC: tổng 1,643 triệu; A (nhớt 420, lốp 420, nhông sên dĩa 225, bố thắng 176) = 75.5%; B (bugi, ắc quy 120 mỗi) = 14.6%; C = 9.9%"
      - "Nhớt: D=6,000; S=150,000; H=14,000: EOQ=sqrt(128,571)=359 chai; SS=1.65x6xsqrt(5)=22.1; ROP=122; tổng 7.9 -> 5.02 triệu"
      - "Lốp (99%): EOQ=104; SS=9.3; ROP=29; tổng 9.4 -> ~5.8 triệu; giải phóng 27.3 triệu"
      - "Ốc vít (C, R=14, L=3, Z=1.28): SS=15.8; S=129 bộ"
      - "Tồn 410.75 -> 328.6 triệu; vòng quay 5.0; DIO 73; lợi ích ~10.9 triệu/năm"
    lesson: "Mỗi nhóm một chính sách (A: EOQ+ROP, C: định kỳ đặt gộp); mức phục vụ theo hậu quả thiếu hàng (lốp 99%, ốc vít 90%); lợi ích lớn nhất đến từ giải phóng vốn và giảm hết hàng hơn là tiết kiệm chi phí đặt hàng."
    data_reliability: "illustrative"

worked_examples:
  - name: "EOQ, N*, T*, TC* và độ nhạy (cửa hàng bán lẻ)"
    inputs: {D: 12000, S: 500000, price: 100000, i: 0.2, working_days: 360}
    steps:
      - "H = 0.2 x 100,000 = 20,000"
      - "EOQ = sqrt(2 x 12,000 x 500,000 / 20,000) = sqrt(600,000) = 774.6"
      - "N* = 12,000/774.6 = 15.49 lần; T* = 360/15.49 = 23.2 ngày"
      - "Đặt hàng = 15.49 x 500,000 = 7.746 triệu; lưu kho = 387.3 x 20,000 = 7.746 triệu; TC* = 15.49 triệu"
      - "Q=500 -> 17.0 triệu (+9.7%); Q=2,000 -> 23.0 triệu (+48.5%)"
    result: "EOQ ~775; TC* = 15,491,934 VNĐ/năm"
  - name: "SS, ROP và đổi mức phục vụ"
    inputs: {d: 40, sigma_d: 8, L: 9, H: 20000}
    steps:
      - "d x L = 360; sigma_d x sqrt(L) = 24"
      - "90%: SS 30.7, ROP 390.7, chi phí giữ SS 614,400"
      - "95%: SS 39.6, ROP 399.6, 792,000"
      - "99%: SS 55.9, ROP 415.9, 1,118,400"
      - "Thêm sigma_L=2 ngày: SS = 1.65 x sqrt(576+6,400) = 137.8 (gấp 3.5 lần)"
    result: "ROP 95% = 399.6; có sigma_L thì SS ~138"
  - name: "Chiết khấu số lượng"
    inputs: {D: 12000, S: 500000, i: 0.2}
    steps:
      - "Giá 100,000 (Q<500): EOQ 775 vượt khoảng, dùng 499: TC = 1,217,014,048"
      - "Giá 97,000 (500-999): EOQ 786 hợp lệ: TC = 1,179,257,785"
      - "Giá 95,000 (>=1,000): EOQ 795 thấp hơn ngưỡng, nâng lên 1,000: TC = 1,155,500,000"
      - "Chọn Q=1,000, tiết kiệm ~23.8 triệu so với giá 97,000; kiểm tra kho và hạn dùng"
    result: "Mua 1,000 đơn vị/lần giá 95,000: 1,155.5 triệu/năm"
  - name: "Newsvendor bánh trung thu"
    inputs: {price: 150000, cost: 90000, salvage: 40000, mu: 1000, sigma: 200}
    steps:
      - "Cu = 60,000; Co = 50,000; CR = 0.545"
      - "Z = 0.114; Q* = 1,000 + 0.114 x 200 = 1,022.8"
      - "Nếu giá bán 200,000: Cu = 110,000, CR = 0.6875 -> đặt nhiều hơn dự báo"
    result: "Đặt ~1,023 hộp"
  - name: "Vòng quay, DIO, CCC và vốn giải phóng"
    inputs: {COGS: 2400, inv_begin: 380, inv_end: 420, DSO: 25, DPO: 30}
    steps:
      - "Tồn bình quân = 400; vòng quay = 6; DIO = 60.8"
      - "CCC = 60.8 + 25 - 30 = 55.8"
      - "Giảm DIO 10 ngày: 2,400 x 10/365 = 65.8 triệu; CCC còn 45.8"
    result: "Vòng quay 6; DIO 60.8; CCC 55.8; giải phóng 65.8 triệu"
  - name: "Risk pooling 3 kho"
    inputs: {sigma: 30, L: 4, Z: 1.65, n: 3}
    steps:
      - "Riêng: 1.65 x 30 x 2 = 99 mỗi kho; 3 kho = 297"
      - "Gộp rho=0: 30 x sqrt(3) = 51.96; SS = 171.5 (-42%)"
      - "Gộp rho=0.5: phương sai = 3x900 + 6x0.5x900 = 5,400; sigma = 73.5; SS = 242.5 (-18%)"
      - "rho=1: SS = 297 (không giảm)"
    result: "SS gộp 171.5 (rho=0), 242.5 (rho=0.5), 297 (rho=1)"
  - name: "Kanban số thẻ"
    inputs: {d: 400, alpha: 0.1, C: 20}
    steps: ["L=0.5: N = 400x0.5x1.1/20 = 11 thẻ, tồn tối đa 220", "L=0.25: N = 5.5 làm tròn 6, tồn tối đa 120 (giảm 45%)"]
    result: "11 thẻ giảm còn 6 thẻ"
  - name: "Order-up-to nhà thuốc"
    inputs: {d: 15, sigma_d: 5, R: 7, L: 2, Z: 1.65}
    steps: ["SS = 1.65 x 5 x 3 = 24.75", "S = 15 x 9 + 24.75 = 159.75 ~ 160 hộp", "R=30: SS = 46.7; S = 527 hộp"]
    result: "S = 160 hộp (kiểm tra tuần)"

practice_questions:
  - q: "Bài 1: Xưởng mắm D=9,000 chai/năm, S=240,000, giá 40,000, tỷ lệ lưu kho 25%. Tính EOQ, số lần đặt, chu kỳ (360 ngày), TC*."
    a: "H=10,000; EOQ = sqrt(432,000) ~ 657 chai; N* ~ 13.7 lần/năm; T* ~ 26.3 ngày; TC* ~ 6.57 triệu VNĐ/năm."
  - q: "Bài 2: d=30, sigma_d=6, L=4, H=10,000. SS, ROP, chi phí giữ SS cho 90/95/99%."
    a: "sigma_d sqrt(L) = 12. 90%: SS 15.4, ROP 135.4, 153,600; 95%: 19.8, 139.8, 198,000; 99%: 28.0, 148.0, 279,600. 95% -> 99% thêm ~8.2 đơn vị (~81,600 VNĐ/năm); đáng hay không tùy lãi biên mất khi hết hàng."
  - q: "Bài 3: ABC 12 mã (nhu cầu x đơn giá), A đến 70%, B đến 90%."
    a: "Tổng 300.3 triệu. Nhóm A: A, B, D, G (4 mã, 33% số mã, 68.4% giá trị); nhóm B: C, F, E (3 mã, 19.3%); nhóm C: H, I, J, K, L (5 mã, 12.3%)."
  - q: "Bài 4: Hoa hồng Valentine, giá bán 120,000, vốn 50,000, thanh lý 10,000, mu=500, sigma=100. Đặt bao nhiêu?"
    a: "Cu=70,000; Co=40,000; CR=0.636; Z ~ 0.349; Q* ~ 535 bó."
  - q: "Bài 5: Chiết khấu D=6,000; S=100,000; i=20%; giá <300: 50,000; 300-799: 48,000; >=800: 46,000."
    a: "Giá 50,000: Q=299, TC 303,501,689; 48,000: Q=354, TC ~291,394,113; 46,000: Q=800, TC 280,430,000 -> chọn Q=800 (tiết kiệm ~10.96 triệu so với giá 48,000), kiểm tra kho và hạn dùng."
  - q: "Bài 6: 4 kho, sigma_d=20, L=9, 95%, độc lập. So sánh tổng SS riêng với gộp."
    a: "Riêng 99 x 4 = 396; gộp sigma=40, SS=198 (giảm 50%, quy luật 1/sqrt(n)). Tương quan càng cao mức giảm càng ít."
  - q: "Bài 7: COGS 2,400; tồn đầu 380, cuối 420; DSO 25; DPO 30. Vòng quay, DIO, CCC; giảm DIO 10 ngày giải phóng bao nhiêu?"
    a: "Tồn bình quân 400; vòng quay 6; DIO 60.8; CCC 55.8; giải phóng 65.8 triệu."
  - q: "Bài 8: Kanban d=600, L=0.25 ngày, alpha=20%, thùng 30."
    a: "N = 600x0.25x1.2/30 = 6 thẻ; tồn tối đa 180 chi tiết."
  - q: "Bài 9: Order-up-to d=40, sigma_d=10, R=14, L=6, 95%."
    a: "R+L=20; SS=73.8; S ~ 874; nếu tồn + đang về = 310 thì đặt 564."
  - q: "Bài 10: RFID (120 triệu/cửa hàng, thẻ 900 triệu/năm) vs mã vạch (12 triệu/cửa hàng), 20 cửa hàng; tiết kiệm nhân công 30 giờ x 12 x 20 x 40,000; tăng 2% doanh thu chuỗi 120 tỷ, biên gộp 35%."
    a: "Chênh đầu tư 2,160 triệu; lợi ích 288 + 840 = 1,128; trừ thẻ 900 -> ròng 228 triệu/năm; hoàn vốn ~9.5 năm: không hấp dẫn."
  - q: "Bài 11: Phân tích một trường hợp hết hàng bạn từng gặp."
    a: "Gợi ý: thu thập nhu cầu/lead time 3 tháng, tính sigma_d và sigma_L, tính SS có sigma_L (m04_safety_stock_demand_leadtime), so với mức đã dùng."
  - q: "Bài 12-13: Thiết kế cycle counting cho danh mục bài 3, FEFO cho ngành hạn dùng; làm Excel cảnh báo chạm ROP."
    a: "Gợi ý: tần suất A tháng, B quý, C năm; người đếm độc lập; điều tra nguyên nhân gốc; Excel dùng các hàm trong mục excel_google_sheets_templates, cảnh báo =IF(Tồn<=ROP,'ĐẶT HÀNG','OK')."
  - q: "Bài 14: Đánh đổi JIT thuần túy và đệm chiến lược; giải pháp bán ảo TMĐT; lộ trình chuyển định kỳ sang liên tục cho SME."
    a: "Gợi ý: Kraljic chọn linh kiện cần đệm; tồn kho hợp nhất + đệm 1-2 đơn vị/sàn + trừ kho ngay; lộ trình theo chi phí giai đoạn trong sme_vn_guidance."

checklist:
  - "Đã có danh mục SKU với nhu cầu 12 tháng và đơn giá/giá vốn"
  - "Đã ước lượng S và H (tỷ lệ % giá vốn)"
  - "Đã đo lead time thực tế và độ lệch chuẩn của nó (không chỉ lead time hứa hẹn)"
  - "Đã tính sigma_d từ dữ liệu bán hàng theo ngày/tuần"
  - "Đã phân loại ABC (và cân nhắc XYZ/hàng nhạy cảm/dễ hỏng)"
  - "Mức phục vụ chọn theo hậu quả thiếu hàng, khác nhau theo nhóm"
  - "Nhóm A có EOQ, SS, ROP; nhóm C dùng kiểm tra định kỳ đặt gộp"
  - "Đã kiểm tra MOQ, sức chứa kho, quy cách đóng gói, hạn sử dụng"
  - "Đã so tổng chi phí khi có chiết khấu số lượng"
  - "Có bảng ROP/cảnh báo tự động tại kho hoặc phần mềm"
  - "Có lịch cycle counting theo ABC và quy trình điều tra sai lệch"
  - "Áp dụng FEFO cho hàng hạn dùng; cảnh báo cận date 3 tháng"
  - "Hàng thời vụ: đã dùng newsvendor; đã thương lượng quyền đổi/trả hoặc đặt bổ sung"
  - "Tồn kho đa kênh đồng bộ, có đệm chống bán ảo"
  - "Theo dõi KPI: vòng quay, DIO, tỷ lệ hết hàng, độ chính xác tồn, hàng lỗi thời"
  - "Cập nhật EOQ, SS hằng quý hoặc khi nhu cầu/lead time đổi"
  - "Thanh lý hàng chậm theo quy tắc (ví dụ quá 6 tháng)"
  - "Đã đánh giá rủi ro chuỗi cung ứng trước khi áp JIT; giữ đệm cho linh kiện quan trọng"
  - "Phối hợp kế toán: dự phòng giảm giá hàng tồn kho, đánh giá CCC"
  - "Risk register: dự báo sai lệch, NCC giao trễ, hàng hết hạn, lệch số liệu, oversell, biến động giá đầu vào (hợp đồng giá cố định ngắn hạn)"

excel_google_sheets_templates:
  - name: "Bảng tính EOQ + SS + ROP (D ở B1, S ở B2, H ở B3, L ở B4, sigma_d ở B5, mức phục vụ ở B6, ngày làm việc ở B7)"
    formulas:
      - "EOQ: =SQRT(2*B1*B2/B3)"
      - "Số lần đặt/năm: =B1/EOQ"
      - "Nhu cầu ngày d: =B1/B7"
      - "Z: =NORM.S.INV(B6)"
      - "Safety stock: =Z*B5*SQRT(B4)"
      - "ROP: =d*B4+SS"
      - "Newsvendor Q*: =NORM.INV(Cu/(Cu+Co), mu, sigma)"
      - "Vòng quay: =COGS/AVERAGE(tồn đầu, tồn cuối)"
      - "Cảnh báo ROP: =IF(Tồn_hiện_tại<=ROP,\"ĐẶT HÀNG\",\"OK\")"
    fields: "SKU, D, S, H, L, EOQ, N, d, sigma_d, mức phục vụ, Z, SS, ROP"
  - name: "Bảng ABC trên Excel"
    formulas: ["Giá trị = Nhu cầu x Đơn giá", "Sắp giảm dần", "% = giá trị / tổng", "% tích lũy = cộng dồn", "Nhóm = IF(tích lũy<=0.8,\"A\",IF(tích lũy<=0.95,\"B\",\"C\"))"]
    fields: "Mã, nhu cầu, đơn giá, giá trị, %, % tích lũy, nhóm"
  - name: "Sơ đồ chọn hệ thống kiểm soát"
    formulas: ["Có IT thời gian thực? Không -> định kỳ; Có và nhóm A -> liên tục; Có nhưng không nhóm A -> giữ định kỳ tần suất cao hơn"]
    fields: "Nhóm hàng, IT, hệ thống chọn"
