  - {metric: "Tỷ lệ hàng lỗi thời (tồn > 6-12 tháng)", value: "< 5%", context: "Mục tiêu KPI tham khảo", confidence: "medium"}
  - {metric: "Fill rate", value: "> 95%", context: "Mục tiêu KPI tham khảo", confidence: "medium"}
