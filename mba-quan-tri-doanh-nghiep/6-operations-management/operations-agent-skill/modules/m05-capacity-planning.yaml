pitfalls:
  - "Chỉ dựa vào dự báo lạc quan để đầu tư: xây best/base/worst, tính EMV và NPV xấu nhất."
  - "Không xác định đúng nút thắt: đầu tư sai chỗ, sản lượng không tăng."
  - "Vận hành 100% công suất liên tục: thời gian chờ tăng vọt, không buffer cho sự cố; giữ 75-90% tùy ngành."
  - "Bỏ qua ramp-up khi mở rộng: tính learning curve vào kế hoạch."
  - "Không có kế hoạch dự phòng khi cam kết dài hạn (bài học COVID-19): đàm phán điều khoản linh hoạt, kịch bản ứng phó rủi ro."
  - "Đầu tư vì một đơn hàng lớn duy nhất: đơn 4 tháng, đầu tư lỗ 635 triệu; tính điểm giao theo số tháng đơn hàng kéo dài và yêu cầu cam kết."
  - "Chỉ nhìn EMV, bỏ qua kịch bản xấu: luôn báo cáo kịch bản xấu nhất và xác suất lỗ."
  - "Quên nút thắt dịch chuyển sau khi nâng cấp: tính lại năng lực toàn hệ thống."
  - "Đánh đồng năng lực trung bình bằng nhu cầu trung bình là đủ: hàng đợi vẫn sụp đổ khi rho = 1."
  - "Dùng break-even tĩnh cho quyết định lớn mà không kèm NPV/dòng tiền chiết khấu."
  - "Nhầm thời gian chờ tăng 'theo cấp số mũ': đúng là hyperbol (tiến ra vô cực khi rho -> 1), nhưng hệ quả thực tế như nhau."
  - "Chase thuần mà quên chi phí ẩn (tinh thần, đào tạo, đường cong học tập)."
  - "Thuê ngoài mà không kiểm soát chất lượng/SLA (hương vị là tài sản thương hiệu) và chuyển được chi phí nhưng không chuyển được trách nhiệm với khách hàng cuối."
  - "Dùng số liệu 'giả định minh họa' của nguồn như số thật của Amazon, Highlands, FPT Software, hãng hàng không."

sme_vn_guidance:
  - "SME thường chọn Match/Lag do hạn chế vốn; chỉ Lead khi có cam kết đơn hàng dài hạn rõ ràng (hợp đồng take-or-pay/đặt cọc)."
  - "Công cụ rẻ: Excel/Google Sheets cho break-even, hàng đợi, NPV, Monte Carlo 1,000 dòng (miễn phí); Google Sheets + Power BI theo dõi KPI (miễn phí - vài triệu/tháng); Arena, Simul8 ước 50-200 triệu/license; SAP APO/IBP, Oracle Demantra hàng tỷ/năm cho DN lớn (ước tính, cần kiểm tra báo giá hiện hành)."
  - "Thuê ngoài/gia công và năng lực linh hoạt phù hợp SME: gia công rang, thầu phụ may, cloud kitchen, fulfillment bên thứ ba (Amazon FBA là mô hình tham chiếu), lao động tự do/bán thời gian giờ cao điểm; hợp đồng cần SLA, chất lượng, điều khoản hủy/hoãn."
  - "Giai đoạn khởi nghiệp: ước lượng thủ công, thuê ngoài linh hoạt (0-50 triệu); tăng trưởng: máy móc/nhân sự cơ bản theo Match (200 triệu - 2 tỷ); mở rộng: cơ sở mới, tự động hóa một phần (5-30 tỷ) - khoảng tham khảo thay đổi theo ngành, cần xác nhận."
  - "Phòng khám/quán dịch vụ: dùng đặt lịch hẹn và nhân sự bán thời gian giờ cao điểm trước khi mở rộng cơ sở; theo dõi lambda theo giờ và tăng trưởng 20%/năm."
  - "Xưởng sản xuất nhỏ: đàm phán cam kết sản lượng tối thiểu (take-or-pay) hoặc đặt cọc trước khi mua máy; xây SOP, đào tạo, kèm cặp để rút ngắn ramp-up."
  - "Khả năng vay vốn giới hạn (ví dụ giả định xưởng may chỉ vay 2-2.5 tỷ) là ràng buộc thực: so sánh phương án trong giới hạn vốn, tính tác động dòng tiền với bộ phận tài chính."
  - "Thuế, khấu hao, lãi vay, giá máy móc và chi phí nhân công thực tế cần xác nhận theo quy định/báo giá hiện hành; các số trong module là giả định minh họa."
  - "SME ưu tiên: đo năng lực thật -> hòa vốn đơn giản -> Match/Lag -> thuê ngoài như quyền chọn chờ đợi -> công cụ mô phỏng khi đủ lớn (lộ trình 5 bước của nguồn)."

case_lessons:
  - name: "Amazon - năng lực kho vận mùa cao điểm"
    type: "success"
    setup: "Nhu cầu tăng nhiều lần vào mùa cuối năm (theo mô tả công khai); Amazon kết hợp Lead (xây trung tâm fulfillment trước mùa), Chase cho lao động thời vụ 2-3 tháng, và tự động hóa bằng robot (Kiva, mua lại 2012, theo nguồn). Phần tính toán dùng trung tâm giả định, KHÔNG phải số liệu Amazon."
    key_calculations:
      - "Nhân sự ngày thường 100,000/100 = 1,000; cao điểm 500,000/100 = 5,000; cần thêm 4,000 người"
      - "Level (thuê cố định cả năm, nhàn rỗi 275 ngày): 4,000 x 500,000 x 275 = 550 tỷ VNĐ"
      - "Chase 90 ngày: 4,000 x (550,000 x 90 + 3,000,000) = 210 tỷ VNĐ"
      - "Chase + robot (160 đơn/người/ngày): thêm 2,500 người x 52,500,000 = 131.25 tỷ; tiết kiệm 78.75 tỷ/mùa"
    lesson: "Không có chiến lược thuần cho nhu cầu cực đoan: kết hợp Lead (nền tảng, tự động hóa) và năng lực linh hoạt (Chase). Level đắt gấp 2.6 lần Chase; Chase có chi phí ẩn (chất lượng, an toàn, đào tạo) nên cần tự động hóa; robot chỉ đáng khi tiết kiệm bù được đầu tư trong vài mùa."
    data_reliability: "illustrative"
  - name: "Highlands Coffee - xếp ca theo giờ cao/thấp điểm"
    type: "success"
    setup: "Chuỗi dùng dữ liệu lượng khách theo khung giờ để xếp ca linh hoạt (định tính). Mô hình giả định một cửa hàng 16 giờ/ngày (6 giờ cao điểm lambda = 120, 10 giờ thấp điểm lambda = 45), mu = 30 khách/giờ/người, 30,000 VNĐ/giờ, mục tiêu Wq <= 1 phút. KHÔNG phải dữ liệu nội bộ Highlands."
    key_calculations:
      - "Cao điểm: c = 4 rho 100% sụp đổ; c = 5 Wq 1.11 phút (không đạt); c = 6 Wq 0.28 phút (đạt)"
      - "Thấp điểm: c = 2 Wq 2.57 phút (không đạt); c = 3 Wq 0.32 phút (đạt); c = 4 dư"
      - "Lịch cố định 6 người x 16 giờ = 96 giờ = 2,880,000 VNĐ; linh hoạt 6 x 6 + 3 x 10 = 66 giờ = 1,980,000 VNĐ"
      - "Tiết kiệm 30 giờ x 30,000 = 900,000 VNĐ/ngày (328.5 triệu/năm/cửa hàng, 31% giờ công)"
    lesson: "Với dịch vụ không lưu kho năng lực, đồ thị nhu cầu theo giờ là đầu vào của bài toán: đo lambda theo khung, đặt mục tiêu chờ, dùng Erlang C tìm c nhỏ nhất. Lịch 4 người cố định rẻ nhất nhưng sụp đổ ở cao điểm. Cân nhắc ảnh hưởng ca ngắn tới tuyển dụng và giữ chân."
    data_reliability: "illustrative"
  - name: "Xưởng may gia công Bình Dương - mở rộng năng lực"
    type: "sme"
    setup: "Xưởng 150 công nhân, 10 áo/người/ngày = 1,500 áo/ngày, 26 ngày/tháng; khách đặt 3,000 áo/ngày trong 4 tháng đầu, có thể ký thêm 24 tháng (chưa chắc). P = 50,000; VC tự may 40,000 (góp 10,000); VC thầu phụ 48,000 (góp 2,000); đầu tư cho 60 công nhân + máy 2,000 triệu, thu hồi 40%; FC thêm 50 triệu/tháng; chiết khấu 1%/tháng. Giả định minh họa (đã viết lại đơn hàng gấp 2 lần để số nhất quán)."
    key_calculations:
      - "Thiếu 1,500 áo/ngày = 39,000 áo/tháng"
      - "X (thầu phụ toàn bộ): 39,000 x 2,000 = 78.0 triệu/tháng"
      - "Y (tự may 15,600 + thầu phụ 23,400): 15,600 x 10,000 - 50 triệu = 106.0; 23,400 x 2,000 = 46.8; tổng 152.8 triệu/tháng"
      - "Z (tự may hết): 39,000 x 10,000 - 125 triệu = 265.0 triệu/tháng; vốn 5,000 triệu"
      - "Hòa vốn phần tự may của Y: 50 triệu/10,000 = 5,000 áo/tháng (192 áo/ngày, 32% năng lực); hoàn vốn giản đơn 2,000/106 = 18.9 tháng"
      - "NPV 4 tháng: X 304.4, Y -635.0, Z -2,044.0; 12 tháng: 877.9, 429.7, -242.5; 24 tháng: 1,657.0, 1,876.0, 2,204.6; 36 tháng: 2,348.4, 3,159.6, 4,376.3; 48 tháng: 2,962.0, 4,298.6, 6,303.6 (triệu VNĐ)"
    lesson: "Quyết định tự đầu tư hay thầu phụ phụ thuộc thời gian kéo dài của nhu cầu (điểm giao khoảng 20 tháng), không phải quy mô đơn hàng. Đơn 4 tháng: thầu phụ thắng, mua máy lỗ 635 triệu. Z thắng về lâu dài nhưng vượt giới hạn vốn; Y là Match trong giới hạn vốn. Lợi thế Y so với X ở 24 tháng chỉ 219 triệu nên cần cam kết (take-or-pay/đặt cọc). Giả định ramp-up 2-3 tháng cho công nhân mới."
    data_reliability: "illustrative"
  - name: "Ngành hàng không - Lead quá mức trước COVID-19"
    type: "failure"
    setup: "Nhiều hãng mở rộng đội bay mạnh 2015-2019 theo dự báo tăng trưởng du lịch; COVID-19 năm 2020 làm nhu cầu giảm đột ngột (theo nhiều báo cáo công khai có lúc hơn 90%) trong khi cam kết thuê/mua máy bay dài hạn. Mô hình hãng giả định đơn vị tương đối: doanh thu 1,000; FC 400; VC 450; lợi nhuận 150. KHÔNG phải số liệu một hãng cụ thể."
    key_calculations:
      - "Nhu cầu giảm 90%: doanh thu 100, VC 45: 100 - 400 - 45 = -345"
      - "Doanh thu hòa vốn cứng: 400/(1 - 0.45) = 727.3 (72.7% doanh thu bình thường)"
      - "Cấu trúc linh hoạt (200 cố định + 200 cắt được): giảm 90% còn 100 - 45 - 20 - 200 = -165 (48% mức lỗ cứng)"
      - "Hòa vốn linh hoạt: 200/(1 - 0.45 - 0.20) = 571.4 (57.1%)"
    lesson: "Đòn bẩy hoạt động cao khuếch đại lỗ khi gián đoạn (black swan). Dùng kịch bản (scenario planning), stress test điểm hòa vốn và giữ linh hoạt hợp đồng dài hạn (điều khoản hủy/hoãn, thuê ngắn hạn)."
    data_reliability: "illustrative"
  - name: "Phòng khám tư nhân TP.HCM - mở rộng năng lực khám"
    type: "sme"
    setup: "Lượng bệnh nhân tăng 20%/năm, cuối tuần quá tải, chờ 2-3 giờ. Giả định: ca sáng 8 giờ, mu = 6 bệnh nhân/giờ/bác sĩ, 3 bác sĩ, lambda = 22/giờ (đến không hẹn)."
    key_calculations:
      - "Năng lực 3 x 6 = 18/giờ; rho = 22/18 = 1.22 (không ổn định); tồn 4/giờ x 8 = 32 bệnh nhân; chờ 32/18 = 1.78 giờ (~107 phút)"
      - "Thêm bác sĩ (c = 4): rho 91.7%, Pw 82.2%, Wq 24.7 phút"
      - "Thêm bác sĩ + đặt lịch (lambda đỉnh 22 -> 18): rho 75%, Pw 50.9%, Wq 5.1 phút"
      - "Mở rộng c = 5, lambda 22: rho 73.3%, Wq 3.2 phút (chỉ tốt hơn ~2 phút so với kết hợp nhưng vốn lớn)"
      - "Tăng trưởng 20%/năm: sau 2 năm lambda ≈ 18 x 1.44 = 25.9 > 24 (năng lực c = 4)"
    lesson: "Trước khi đầu tư năng lực vật lý hãy điều tiết nhu cầu (đặt lịch, giá theo khung giờ) và mua năng lực linh hoạt (bác sĩ bán thời gian). Dùng rho để phát hiện hệ thống sắp vỡ (rho > 85%) và chuẩn bị bước tăng năng lực tiếp theo vì tăng trưởng 20%/năm."
    data_reliability: "illustrative"
  - name: "FPT Software - năng lực nhân sự công nghệ (bench)"
    type: "success"
    setup: "Phần định tính theo mô tả chung: bench làm vùng đệm, đào tạo nội bộ (FPT University, FPT Academy), mạng lưới đối tác/freelancer, dự báo nhân sự theo pipeline hợp đồng. Số liệu: 6,000 kỹ sư, 25 triệu VNĐ/kỹ sư/tháng, utilization mục tiêu 82% - giả định minh họa, không phải số nội bộ."
    key_calculations:
      - "Billable 6,000 x 82% = 4,920; bench 18% = 1,080 người"
      - "Mỗi 1 điểm % utilization = 60 người chuyển từ bench sang billable = 60 x 25 triệu x 12 = 18 tỷ VNĐ/năm"
    lesson: "Bench 18% là bảo hiểm để nhận dự án gấp mà không tuyển ồ ạt; đào tạo chéo tăng utilization an toàn; đẩy utilization > 90% làm mất khả năng đáp ứng và kiệt sức nhân sự. Ba đòn bẩy tương ứng sản xuất: cushion = safety stock, đào tạo = rút ngắn ramp-up, đối tác = thuê ngoài."
    data_reliability: "illustrative"
  - name: "Cà phê rang xay Đất Đỏ (SME mới) - máy rang: mua, thuê hay chờ"
    type: "sme"
    setup: "Xưởng rang xay Đắk Lắk, 1 ca 8 giờ, 26 ngày/tháng (208 giờ), sản lượng 7,000 kg/tháng. Công đoạn: sàng 120, rang 45, xay 90, đóng gói 60, dán nhãn 100 kg/giờ; hiệu quả 85% thiết kế. Giá 220,000, VC 180,000 (góp 40,000/kg). Máy rang mới +20 kg/giờ, 480 triệu, khấu hao 5 năm, FC thêm 90 triệu/năm; chiết khấu 12%/năm, 5 năm. Nhu cầu 10,000 (0.3) / 8,800 (0.5) / 7,500 (0.2). Toàn bộ giả định minh họa."
    key_calculations:
      - "Năng lực thiết kế = rang 45 x 208 = 9,360; hiệu quả 7,956; Hiệu suất 7,000/7,956 = 88.0%; Mức sử dụng 7,000/9,360 = 74.8%"
      - "Khoảng thiếu: Cao 2,044; Trung bình 844; Thấp 0 kg/tháng"
      - "Thêm máy rang: rang 65, nút thắt mới là đóng gói 60 x 208 = 12,480 (+33%); hiệu quả 10,608"
      - "Hòa vốn kế toán: (90 + 96)/40,000 = 4,650 kg/năm (387.5 kg/tháng); hòa vốn tiền mặt 2,250 kg/năm"
      - "NPV A: +2,732.3 / +655.9 / -804.4; EMV(A) = 986.8; NPV B: 1,768.4 / 730.2 / 0; EMV(B) = 895.6; EMV(C) = 0"
      - "Phương án D (thuê ngoài năm 1 rồi quyết): Cao 2,426.1, Trung bình 606.9, Thấp 0; EMV(D) = 1,031.3, xấu nhất 0"
      - "Monte Carlo (tam giác 7,000/8,800/11,000, 10,000 lần): A trung bình 951 triệu, P(NPV<0) = 27.7%, p5 = -804; B trung bình 878 triệu, 0%"
    lesson: "Đừng mua máy vì 'gần quá tải'. A có EMV cao hơn B 91 triệu nhưng 20% khả năng lỗ 804 triệu (~28% trong mô phỏng). D (thuê ngoài rồi quyết) thắng cả kỳ vọng lẫn rủi ro vì chi phí chờ nhỏ hơn giá trị thông tin (real option). Trigger mua máy: hai quý liên tiếp nhu cầu vượt 8,500 kg/tháng hoặc có hợp đồng sản lượng tối thiểu; kiểm soát chất lượng/SLA với xưởng gia công; lập kế hoạch nâng cấp đóng gói (nút thắt tiếp theo)."
    data_reliability: "illustrative"

worked_examples:
  - name: "Ba loại năng lực, Hiệu suất, Mức sử dụng (dây chuyền 1,000/850/750)"
    inputs: {design: 1000, effective: 850, actual: 750}
    steps: ["Năng lực hiệu quả/thiết kế = 850/1,000 = 85%", "Hiệu suất = 750/850 = 88.2%", "Mức sử dụng = 750/1,000 = 75.0%", "Diễn giải: vận hành tốt nhưng chỉ khai thác 75% tài sản; kiểm tra bán thêm 100 sp/ngày (đến 850) không cần vốn trước khi mua dây chuyền mới"]
    result: "Hiệu suất 88.2%; Mức sử dụng 75.0%; dư địa 100 sản phẩm/ngày ở mức hiệu quả"
  - name: "Điểm hòa vốn lò nướng (giả định minh họa)"
    inputs: {fc: 360000000, price: 120000, vc: 70000, capacity: 9000, demand: 8400}
    steps: ["P - VC = 50,000", "Q* = 360,000,000/50,000 = 7,200 đv/năm", "% công suất tại hòa vốn = 7,200/9,000 = 80% (rủi ro cao)", "Biên an toàn = 1,200/8,400 = 14.3%", "Lợi nhuận tại 8,400 = 1,200 x 50,000 = 60 triệu/năm"]
    result: "Q* = 7,200; hòa vốn ở 80% công suất; lợi nhuận 60 triệu/năm"
  - name: "M/M/1 quầy thu ngân và bảng phi tuyến"
    inputs: {lam: 30, mu: 40}
    steps: ["rho = 0.75", "Wq = 30/(40 x 10) = 0.075 giờ = 4.5 phút; Lq = 2.25; W = 6 phút", "lambda = 38: rho 95%, Wq = 38/(40 x 2) = 0.475 giờ = 28.5 phút (nhu cầu +27%, chờ gấp 6.3 lần)", "lambda = 39: Wq = 39/(40 x 1) = 58.5 phút"]
    result: "Wq = 4.5 phút ở rho 75%; 28.5 phút ở rho 95%"
  - name: "Số nhân viên pha chế giờ cao điểm (Erlang C)"
    inputs: {lam: 120, mu: 30}
    steps: ["a = 4 Erlang; c = 4: rho = 1 không ổn định", "c = 5: Pw = 55.4%, Wq = 0.554/30 giờ = 1.11 phút (không đạt mục tiêu 1 phút)", "c = 6: Pw = 28.5%, Wq = 0.28 phút (đạt)", "c = 7: Wq = 0.09 phút (dư)"]
    result: "Chọn c = 6"
  - name: "Đường cong học tập 90%"
    inputs: {t1: 10, r: 0.9}
    steps: ["b = log2(0.9) = -0.1520", "T2 = 9.00; T4 = 8.10; T8 = 7.29; T50 = 5.52; T100 = 4.97 giờ", "Tổng 50 đơn vị = 321.4 giờ; 100 đơn vị = 581.4 giờ (không phải 1,000)"]
    result: "Đơn vị thứ 100 mất ~một nửa đơn vị đầu; 100 đơn vị cần 581.4 giờ"
  - name: "Cân bằng chuyền 8 công việc"
    inputs: {task_times: [0.8, 0.6, 0.9, 0.5, 0.7, 1.1, 0.6, 0.4], available: 480, required: 200}
    steps: ["Tổng = 5.6 phút; C = 480/200 = 2.4; N_min = ceil(2.333) = 3", "Chia tham lam: T1 = 2.3, T2 = 2.3, T3 = 1.0 -> 5.6/(3 x 2.4) = 77.8%", "Chia cân hơn: 1.4 / 2.1 / 2.1 -> 5.6/(3 x 2.1) = 88.9%; sản lượng tối đa 480/2.1 = 228.6", "Yêu cầu 240/ngày: C = 2.0, N_min = 3 nhưng thực tế 4 trạm (1.4/1.4/1.8/1.0) -> 5.6/(4 x 2.0) = 70%"]
    result: "3 trạm hiệu suất 88.9% (yêu cầu 200); 4 trạm hiệu suất 70% (yêu cầu 240)"
  - name: "Aggregate Planning Chase vs Level vs Mixed"
    inputs: {demand: [400, 500, 700, 900, 800, 600]}
    steps: ["Chase: tuyển 25 x 4 + sa thải 15 x 3 = 145 triệu + 195 triệu sản xuất = 340 triệu", "Level 650/tháng: tồn kho cuối tháng 350, 500, 450, 200, 50, 100 = 1,650 đv-tháng x 2,000 = 3.3 triệu; tổng 198.3 triệu", "Mixed 600 + tăng ca 200 ở T5: 180 + 15 + 2 = 197 triệu (tồn 300, 400, 300, 0, 0, 0)", "Nếu lưu kho 20,000/đv/tháng: Level 228, Mixed 215, Chase 340"]
    result: "Rẻ nhất: Mixed (197 triệu; 215 triệu khi lưu kho đắt)"
  - name: "Tự làm hay thuê ngoài"
    inputs: {fc_own: 480000000, vc_own: 40000, vc_out: 52000}
    steps: ["Q* = 480,000,000/12,000 = 40,000 đv/năm", "30,000 đv: tự làm 480 + 1,200 = 1,680 triệu; thuê 1,560 triệu (rẻ hơn 120)", "50,000 đv: tự làm 480 + 2,000 = 2,480 triệu; thuê 2,600 triệu (tự làm rẻ hơn 120)"]
    result: "Tự đầu tư khi khối lượng bền vững > 40,000 đv/năm"
  - name: "Cây quyết định EMV đơn giản (mua máy vs thuê ngoài)"
    inputs: {probs: [0.4, 0.6], A: [600, -200], B: [250, 50]}
    steps: ["EMV(A) = 0.4 x 600 + 0.6 x (-200) = 120", "EMV(B) = 0.4 x 250 + 0.6 x 50 = 130", "B cao hơn và không có kịch bản lỗ"]
    result: "Chọn B (thuê ngoài)"
  - name: "Cây quyết định NPV và phương án chờ - Đất Đỏ"
    inputs: {probs: [0.3, 0.5, 0.2], extra_kg_per_year: [24528, 10128, 0], r: 0.12, n: 5, capex: 480}
    steps: ["Hệ số niên kim 5 năm 12% = 3.6048", "A: Cao 891.1 x 3.6048 - 480 = 2,732.3; TB 315.1 x 3.6048 - 480 = 655.9; Thấp -90 x 3.6048 - 480 = -804.4; EMV = 986.8", "B: Cao 490.6 x 3.6048 = 1,768.4; TB 202.6 x 3.6048 = 730.2; Thấp 0; EMV = 895.6", "D: Cao 2,426.1; TB 606.9; Thấp 0; EMV = 1,031.3"]
    result: "D (thuê ngoài rồi quyết) tốt nhất: EMV 1,031.3 triệu, NPV xấu nhất 0"
  - name: "Phòng khám: số bác sĩ và đặt lịch"
    inputs: {mu: 6, c: 3, lam: 22}
    steps: ["rho = 22/18 = 1.22; tồn 4/giờ x 8 = 32 bệnh nhân; chờ 32/18 = 1.78 giờ", "c = 4, lambda = 22: Pw 82.2%, Wq 24.7 phút", "c = 4, lambda = 18: Pw 50.9%, Wq 5.1 phút", "c = 5, lambda = 22: Wq 3.2 phút"]
    result: "Đặt lịch + 1 bác sĩ đưa chờ từ ~107 phút xuống 5.1 phút"
  - name: "Hàng không: stress test hòa vốn"
    inputs: {fc: 400, v_ratio: 0.45}
    steps: ["Cứng: 400/0.55 = 727.3 (72.7%)", "Linh hoạt (FC 200, f 0.20): 200/0.35 = 571.4 (57.1%)", "Doanh thu 100: -345 vs -165"]
    result: "Linh hoạt giảm lỗ còn 48% và hạ hòa vốn 15.6 điểm %"

practice_questions:
  - q: "Xưởng bánh: thiết kế 1,500, hiệu quả 1,200, thực tế 1,000 bánh/ngày. Tính Hiệu suất, Mức sử dụng; nên cải tiến vận hành hay mua thêm lò?"
    a: "Hiệu suất 83.3%, Mức sử dụng 66.7%, hiệu quả/thiết kế 80%; còn dư 200 bánh/ngày ở mức hiệu quả nên cải thiện vận hành (lên ~90%+) trước khi đầu tư."
  - q: "FC 600 triệu/năm, giá 150,000, VC 90,000, năng lực mới 15,000 đv/năm, dự báo bán thêm 13,000. Tính Q*, % công suất tại hòa vốn, lợi nhuận."
    a: "Q* = 10,000 đv/năm (833/tháng); 66.7% công suất; lợi nhuận (13,000 - 10,000) x 60,000 = 180 triệu/năm."
  - q: "Quầy tư vấn lambda = 24, mu = 30. Tính rho, Wq, Lq, W; nếu lambda = 28 thì Wq?"
    a: "rho 0.8; Wq 8 phút; Lq 3.2; W 10 phút. lambda = 28: Wq = 28/(30 x 2) = 0.467 giờ = 28 phút (nhu cầu +17%, chờ gấp 3.5 lần)."
  - q: "Quán lambda = 90/giờ, mu = 30/giờ/nhân viên. Cần bao nhiêu nhân viên để Wq <= 1 phút?"
    a: "c = 3: rho = 1 (không ổn định). c = 4: Pw 50.9%, Wq 1.02 phút (hơi vượt). c = 5: Pw 23.6%, Wq 0.24 phút. Chọn c = 5 (hoặc 4 nếu chấp nhận 1.02 phút)."
  - q: "So sánh Lead/Lag/Match cho một tình huống (quán mở chi nhánh, xưởng nhận đơn mới) theo CAPEX, rủi ro nhàn rỗi, chi phí cơ hội."
    a: "Dùng bảng 2.13.1; SME ít vốn và nhu cầu bất định thường chọn Match/Lag; chứng minh bằng EMV ba kịch bản."
  - q: "Quy trình 4 công đoạn 80, 50, 70, 90 sp/giờ, 8 giờ/ngày, hiệu quả 85%. Nút thắt? Nếu nâng công đoạn 2 lên 75?"
    a: "Nút thắt công đoạn 2: thiết kế 50 x 8 = 400, hiệu quả 340 sp/ngày. Nâng lên 75: nút thắt chuyển sang công đoạn 3 (70) -> thiết kế 560 (+40%, không phải +50%)."
  - q: "Aggregate Planning mục 2.7 với lưu kho 20,000 VNĐ/đv/tháng: phương án nào rẻ nhất?"
    a: "Chase 340 triệu; Level 195 + 33 = 228; Mixed 180 + 15 + 20 = 215 -> Mixed rẻ nhất."
  - q: "T1 = 20 giờ, tỷ lệ học tập 85%. Thời gian đơn vị thứ 50 và 100?"
    a: "b = log2(0.85) = -0.2345; T50 = 7.99 giờ; T100 = 6.79 giờ (bằng 85% của T50)."
  - q: "Hàng không: tính doanh thu hòa vốn khi FC = 400, VC = 45% doanh thu; nếu chuyển một nửa FC thành linh hoạt (tương đương 20% doanh thu bình thường)?"
    a: "727.3 (72.7%); linh hoạt: 200/(1 - 0.45 - 0.20) = 571.4 (57.1%); doanh thu còn 100: lỗ -345 và -165."
  - q: "Quán trà sữa lambda cao điểm 60, thấp điểm 20, mu = 20/người; mục tiêu Wq <= 1.6 phút cao điểm, <= 1 phút thấp điểm. Cần mấy người?"
    a: "Cao điểm: c = 3 rho = 1 (loại); c = 4 Wq 1.53 phút (đạt); c = 5 0.35. Thấp điểm: c = 2 Wq 1.0 phút (đúng ngưỡng); c = 3 0.14. Lịch gợi ý 4 người cao điểm, 2 người thấp điểm."
  - q: "FC_own = 480 triệu, VC_own = 40,000, VC_out = 52,000. Q*? So chi phí tại 30,000 và 50,000 đv/năm."
    a: "Q* = 40,000. Tại 30,000: tự làm 1,680 vs thuê 1,560 triệu (thuê rẻ hơn 120). Tại 50,000: 2,480 vs 2,600 (tự làm rẻ hơn 120)."
  - q: "Nhà máy bao bì ổn định mức sử dụng 92%. So với mức tham khảo 10-15%; cần tăng năng lực bao nhiêu để về 90% hoặc 85%?"
    a: "Cushion = 8% < 10-15%. Về 90%: +2.2%; về 85%: +8.2% so với năng lực hiện có."
  - q: "Tính EMV hai phương án mục 2.10 và ước lượng P(NPV<0) mua máy bằng Monte Carlo 1,000 dòng với số liệu Đất Đỏ."
    a: "EMV(A) = 120; EMV(B) = 130 -> chọn B. P(NPV<0) kỳ vọng khoảng 25-30% (nguồn 27.7% với 10,000 lần; tái chạy numpy seed 42 ra ~28.6%); mỗi lần Excel chênh nhẹ vì RAND()."
  - q: "Tổng thời gian công việc 8.4 phút, 480 phút/ngày, yêu cầu 160 sp/ngày. Nhịp, N_min, hiệu suất với 3 trạm?"
    a: "C = 3 phút; N_min = ceil(2.8) = 3; hiệu suất 8.4/(3 x 3) = 93.3% (nếu chia được để trạm nào cũng <= 3 phút)."
  - q: "SME tăng trưởng 30%/năm trong 3 năm: đề xuất lộ trình Lag/Match/Lead, chi phí theo giai đoạn, 3 chỉ số cảnh báo sớm; thiết kế lịch ca linh hoạt."
    a: "Tình huống thảo luận: dùng mục 4.4 (khoảng chi phí tham khảo), sơ đồ quyết định 4.6; chỉ số cảnh báo gợi ý: rho > 85%, Mức sử dụng > 90%, nhu cầu vượt ngưỡng hai quý liên tiếp; lịch ca dùng Erlang C theo khung giờ."

checklist:
  - "Đã đo năng lực thiết kế và hiệu quả của quy trình cốt lõi; đã tính Hiệu suất và Mức sử dụng và biết khoảng cách không tránh được / cải thiện được?"
  - "Đã xác định nút thắt hiện tại và nút thắt kế tiếp?"
  - "Có dữ liệu lịch sử nhu cầu và ít nhất ba kịch bản (cao/trung/thấp) có xác suất?"
  - "Đã tính điểm hòa vốn từng phương án mở rộng và so với năng lực mới (hòa vốn ở bao nhiêu % công suất)?"
  - "Đã tính EMV/NPV và kịch bản xấu nhất (kèm P(NPV<0) nếu có Monte Carlo)?"
  - "Có phương án dự phòng (thuê ngoài, lao động linh hoạt) cho nhu cầu tăng đột biến ngắn hạn; đã xét phương án chờ-quan-sát (real option)?"
  - "Đã đánh giá rủi ro cam kết đầu tư/hợp đồng dài hạn trước sự kiện bất ngờ và có kịch bản dự phòng khi nhu cầu sụt giảm?"
  - "Đã chọn capacity cushion phù hợp ngành; đã cân nhắc sở hữu vs thuê ngoài (Q* hòa vốn)?"
  - "Đội ngũ quản lý hiểu nút thắt và 5 bước TOC?"
  - "Với dịch vụ: đã đo lambda theo khung giờ và xác định số quầy/nhân viên để Wq đạt chuẩn?"
  - "Đã tính ramp-up (learning curve) của người/máy mới trong kế hoạch giao hàng?"
  - "Có kế hoạch giám sát định kỳ (ít nhất hàng quý) và đã trao đổi với tài chính về dòng tiền?"
  - "KPI theo dõi: Hiệu suất > 85%; Mức sử dụng 75-90%; Downtime < 10%; thời gian chờ theo chuẩn ngành; tỷ lệ tăng trưởng năng lực theo kế hoạch."
  - "Mọi số 'giả định minh họa' được gắn nhãn khi báo cáo; số thật cần xác nhận từ dữ liệu DN."

excel_google_sheets_templates:
  - "Template hòa vốn: Phương án, FC (VNĐ/năm), P, VC; Q* = FC/(P-VC) = ... đv/năm; so với dự báo năm 1-3 -> [ ] Đầu tư [ ] Không [ ] Đầu tư từng phần. Excel: =FC/(P-VC)."
  - "Template đánh giá năng lực hiện tại (9 cột): Công đoạn | a năng lực/giờ | b giờ/ngày x ngày/tháng | c = a x b thiết kế/tháng | d hiệu quả % | e = c x d | f thực tế/tháng | f/e hiệu suất | f/c mức sử dụng; công đoạn có c nhỏ nhất = nút thắt."
  - "Đường cong học tập: =T1*n^(LOG(r,2))."
  - "M/M/1 thời gian chờ (giờ): =lambda/(mu*(mu-lambda))."
  - "Erlang C: =(POISSON.DIST(c,a,FALSE)/(1-a/c))/((POISSON.DIST(c,a,FALSE)/(1-a/c))+POISSON.DIST(c-1,a,TRUE)) với a = lambda/mu; Wq (giờ) =Pw/(c*mu-lambda)."
  - "NPV niên kim: =-CAPEX+PV(rate,n,-NetCashflow) hoặc =NPV(rate, dòng tiền năm 1..n)-CAPEX."
  - "Nhu cầu tam giác ngẫu nhiên (u = RAND() ở ô riêng): =IF(u<(m-a)/(b-a), a+SQRT(u*(b-a)*(m-a)), b-SQRT((1-u)*(b-a)*(b-m)))."
  - "Monte Carlo Excel: 1,000 dòng, mỗi dòng rút nhu cầu và tính NPV; xác suất lỗ =COUNTIF(cột NPV,\"<0\")/1000."
  - "Công cụ theo dõi KPI: Google Sheets + Power BI (miễn phí - vài triệu/tháng); mô phỏng nâng cao: Arena, Simul8 (ước 50-200 triệu/license)."
