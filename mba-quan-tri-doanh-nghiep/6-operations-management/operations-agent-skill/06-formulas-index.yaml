  - takt
  when_to_use: Ước tính số người/máy tối thiểu mỗi công đoạn để không vượt Takt.
- id: m01_stage_capacity
  module: m01
  name_vi: Năng lực công đoạn
  name_en: Stage Capacity
  expression_latex: \text{Cap}_i = \frac{n_i \times T_{khadung}}{CT_i}
  expression_python: n * t_avail / ct
  excel: =C2*23400/D2
  variables:
