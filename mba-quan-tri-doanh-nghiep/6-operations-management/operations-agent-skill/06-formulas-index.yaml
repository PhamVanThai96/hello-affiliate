- id: m05_aggregate_cost
  module: m05
  name_vi: Tổng chi phí Aggregate Planning (Chase/Level/Mixed)
  name_en: Aggregate Plan Total Cost
  expression_latex: TC = c_{reg} Q_{reg} + c_{ot} Q_{ot} + c_{inv} \sum_t I_t + c_{hire} H + c_{fire} F
  expression_python: c_reg*q_reg + c_ot*q_ot + c_inv*inv_months + c_hire*hires + c_fire*fires
  excel: null
  variables:
  - c_reg
  - q_reg
  - c_ot
  - q_ot
  - c_inv
  - inv_months
  - c_hire
  - hires
  - c_fire
  - fires
  when_to_use: So sánh các kế hoạch tổng hợp trong 3-18 tháng khi nhu cầu theo mùa; kiểm tra độ nhạy theo chi phí lưu kho.
- id: m05_operating_leverage_breakeven
  module: m05
  name_vi: Doanh thu hòa vốn với chi phí cố định và biến đổi theo tỷ lệ
  name_en: Break-Even Revenue (Operating Leverage)
  expression_latex: R^{*} = \frac{FC}{1 - v_{ratio} - f_{ratio}}
  expression_python: fc / (1 - v_ratio - f_ratio)
  excel: null
  variables:
  - fc
  - v_ratio
  - f_ratio
  when_to_use: Stress test cấu trúc chi phí trước sụt giảm nhu cầu; so sánh cấu trúc cứng với linh hoạt.
- id: m05_emv
  module: m05
  name_vi: Giá trị tiền tệ kỳ vọng
  name_en: Expected Monetary Value (EMV)
  expression_latex: EMV = \sum_i p_i V_i
  expression_python: sum(p * v for p, v in zip(probs, values))
  excel: =SUMPRODUCT(probs, values)
  variables:
  - probs
  - values
  when_to_use: So sánh phương án năng lực (mua máy/thuê ngoài/chờ) dưới bất định.
- id: m05_annuity_npv
  module: m05
  name_vi: NPV dự án năng lực với dòng tiền đều hằng năm
  name_en: Annuity NPV for a Capacity Investment
  expression_latex: NPV = CF \times \sum_{t=1}^{n}\frac{1}{(1+r)^t} - I_0
  expression_python: cf * sum(1 / (1 + r) ** t for t in range(1, n + 1)) - i0
  excel: =-CAPEX+PV(rate,n,-NetCashflow)
  variables:
  - cf
  - r
  - n
  - i0
  when_to_use: Biến mỗi nhánh cây quyết định thành NPV; so sánh mua máy/thuê ngoài.
- id: m05_staged_option_npv
  module: m05
  name_vi: NPV phương án chờ rồi quyết (real option)
  name_en: Staged / Wait-then-Invest NPV
  expression_latex: NPV_D = \frac{CF^{out}}{1+r} + \sum_{t=2}^{5}\frac{CF^{own}}{(1+r)^t} - \frac{I_0}{1+r}
  expression_python: cf_out/(1+r) + sum(cf_own/(1+r)**t for t in range(2, 6)) - i0/(1+r)
  excel: null
  variables:
  - cf_out
  - cf_own
  - i0
  - r
  when_to_use: 'Nhu cầu bất định, chi phí chờ nhỏ: thuê ngoài năm đầu để quan sát nhu cầu rồi mới quyết mua máy.'
- id: m05_triangular_sample
  module: m05
  name_vi: Rút mẫu phân phối tam giác (Monte Carlo)
  name_en: Triangular Distribution Sampling
  expression_latex: D = \begin{cases} a + \sqrt{u(b-a)(m-a)} & u < \frac{m-a}{b-a} \\ b - \sqrt{(1-u)(b-a)(b-m)} & \text{otherwise}\end{cases}
  expression_python: a + math.sqrt(u*(b-a)*(m-a)) if u < (m-a)/(b-a) else b - math.sqrt((1-u)*(b-a)*(b-m))
  excel: =IF(u<(m-a)/(b-a), a+SQRT(u*(b-a)*(m-a)), b-SQRT((1-u)*(b-a)*(b-m)))
  variables:
  - a
  - m
  - b
  - u
  when_to_use: Mô phỏng nhu cầu liên tục từ 3 con số dễ ước lượng; ước lượng P(NPV < 0).
- id: m05_little_law
  module: m05
  name_vi: Định luật Little
  name_en: Little's Law
  expression_latex: L = \lambda W
  expression_python: lam * w
  excel: null
  variables:
  - lam
  - w
  when_to_use: Kiểm tra chéo kết quả hàng đợi (Lq = lambda x Wq; Ls = lambda x W). Chi tiết ở m01.
- id: m06_cpm_forward_backward
  module: m06
  name_vi: 'CPM: Forward/Backward pass (ES, EF, LS, LF, Float)'
  name_en: CPM early/late times and float
  expression_latex: ES_j=\max_{i\in pred(j)}EF_i,\; EF_j=ES_j+d_j,\; LF_i=\min_{j\in succ(i)}LS_j,\; LS_i=LF_i-d_i,\; Float_i=LS_i-ES_i
  expression_python: '[max(EF_pred), ES + d, min(LS_succ), LF - d, LS - ES]'
  excel: 'ES: =MAX(EF các việc trước); EF: =ES+d; LF: =MIN(LS các việc sau); LS: =LF-d; Float: =LS-ES'
  variables:
  - d
  - ES/EF
  - LS/LF
  when_to_use: Xác định tổng thời gian tối thiểu, đường găng và float của từng việc.
- id: m06_pert_te
  module: m06
  name_vi: Thời gian kỳ vọng PERT
  name_en: PERT expected time
  expression_latex: t_e=\frac{t_o+4t_m+t_p}{6}
  expression_python: (to + 4*tm + tp)/6
  excel: =(to+4*tm+tp)/6
  variables:
  - to
  - tm
  - tp
  when_to_use: Việc có độ bất định cao, chưa có dữ liệu lịch sử chắc chắn.
- id: m06_pert_sigma
  module: m06
  name_vi: Độ lệch chuẩn và phương sai công việc (PERT)
  name_en: PERT activity standard deviation
  expression_latex: \sigma=\frac{t_p-t_o}{6},\; Var=\sigma^2
  expression_python: (tp - to)/6
  excel: =(tp-to)/6
  variables:
  - to
  - tp
  when_to_use: Đo độ bất định của từng việc để cộng phương sai trên đường găng.
- id: m06_project_sigma
  module: m06
  name_vi: Độ lệch chuẩn toàn dự án
  name_en: Project standard deviation
  expression_latex: \sigma_{project}=\sqrt{\sum_{i\in CP}\sigma_i^2}
  expression_python: sum(v**2 for v in sigmas_cp)**0.5
  excel: =SQRT(SUMSQ(sigma_cp))
  variables:
  - sigmas_cp
  when_to_use: Tính xác suất kịp hạn.
- id: m06_prob_on_time
  module: m06
  name_vi: Xác suất hoàn thành trước hạn
  name_en: Probability of on-time completion
  expression_latex: z=\frac{D-T_e}{\sigma_{project}},\; P=\Phi(z)
  expression_python: 0.5*(1+math.erf(((D - Te)/sigma_project)/math.sqrt(2)))
  excel: =NORM.S.DIST((D-Te)/sigma,TRUE)
  variables:
  - D
  - Te
  - sigma_project
  when_to_use: 'Trước khi cam kết ngày giao với khách; tìm hạn đạt độ tin cậy 95%: T = Te + 1,645σ.'
- id: m06_crash_cost_slope
  module: m06
  name_vi: Chi phí crash mỗi ngày
  name_en: Crash cost slope
  expression_latex: CS=\frac{C_{crash}-C_{normal}}{T_{normal}-T_{crash}}
  expression_python: (C_crash - C_normal)/(T_normal - T_crash)
  excel: =(Ccrash-Cnormal)/(Tnormal-Tcrash)
  variables:
  - C_crash
  - C_normal
  - T_normal
  - T_crash
  when_to_use: Xếp hạng việc găng để crash từ rẻ đến đắt; so với lợi ích/ngày (phạt trễ, doanh thu mất).
- id: m06_crash_net_benefit
  module: m06
  name_vi: Lợi ròng của crashing
  name_en: Net benefit of crashing
  expression_latex: NB=\text{ngày rút}\times B_{day}-\sum(\text{ngày rút}_i\times CS_i)
  expression_python: sum(days)*benefit_per_day - sum(d*s for d,s in zip(days,slopes))
  excel: =SUM(days)*benefit - SUMPRODUCT(days,slopes)
  variables:
  - days
  - slopes
  - benefit_per_day
  when_to_use: Chốt gói crashing tối ưu.
- id: m06_fasttrack_duration
  module: m06
  name_vi: Thời lượng sau fast-tracking (chồng lấn)
  name_en: Fast-tracked duration
  expression_latex: T=\sum d_i-\sum overlap_i
  expression_python: sum(d) - sum(overlap)
  excel: null
  variables:
  - d
  - overlap
  when_to_use: Ước tính mức rút ngắn khi chạy song song.
- id: m06_ev_variances
  module: m06
  name_vi: Chênh lệch chi phí và tiến độ (CV, SV)
  name_en: Cost and schedule variance
  expression_latex: CV=EV-AC,\; SV=EV-PV
  expression_python: (EV - AC, EV - PV)
  excel: =EV-AC ; =EV-PV
  variables:
  - PV
  - EV
  - AC
  when_to_use: Báo cáo tiến độ định kỳ bằng tiền.
- id: m06_cpi_spi
  module: m06
  name_vi: Chỉ số hiệu suất chi phí và tiến độ (CPI, SPI)
  name_en: CPI and SPI
  expression_latex: CPI=\frac{EV}{AC},\; SPI=\frac{EV}{PV}
  expression_python: (EV/AC, EV/PV)
  excel: =EV/AC ; =EV/PV
  variables:
  - EV
  - AC
  - PV
  when_to_use: Theo dõi hằng tuần (dự án từ vài trăm triệu); cảnh báo đỏ nếu <0,9, vàng 0,9-0,95 (mẫu trong nguồn).
- id: m06_eac_cpi
  module: m06
  name_vi: EAC theo xu hướng CPI
  name_en: EAC (typical performance)
  expression_latex: EAC=\frac{BAC}{CPI}
  expression_python: BAC/CPI
  excel: =BAC/CPI
  variables:
  - BAC
  - CPI
  when_to_use: Nếu hiệu suất hiện tại kéo dài đến hết dự án.
- id: m06_eac_onetime
  module: m06
  name_vi: EAC khi sai lệch chỉ một lần
  name_en: EAC (atypical variance)
  expression_latex: EAC=AC+(BAC-EV)
  expression_python: AC + (BAC - EV)
  excel: =AC+(BAC-EV)
  variables:
  - AC
  - BAC
  - EV
  when_to_use: 'Kịch bản lạc quan: phần còn lại đúng kế hoạch.'
- id: m06_eac_cpi_spi
  module: m06
  name_vi: EAC kịch bản bi quan (CPI x SPI)
  name_en: EAC (cost and schedule indices)
  expression_latex: EAC=AC+\frac{BAC-EV}{CPI\times SPI}
  expression_python: AC + (BAC - EV)/(CPI*SPI)
  excel: null
  variables:
  - AC
  - BAC
  - EV
  - CPI
  - SPI
  when_to_use: Kịch bản xấu khi cả chi phí và tiến độ đều lệch.
- id: m06_etc_vac
  module: m06
  name_vi: ETC và VAC
  name_en: Estimate to complete and Variance at completion
  expression_latex: ETC=EAC-AC,\; VAC=BAC-EAC
  expression_python: (EAC - AC, BAC - EAC)
  excel: null
  variables:
  - EAC
  - AC
  - BAC
  when_to_use: Biết còn phải chi bao nhiêu và vượt/tiết kiệm bao nhiêu.
- id: m06_tcpi
  module: m06
  name_vi: Chỉ số hiệu suất cần đạt (TCPI)
  name_en: To-Complete Performance Index
  expression_latex: TCPI=\frac{BAC-EV}{BAC-AC}
  expression_python: (BAC - EV)/(BAC - AC)
  excel: =(BAC-EV)/(BAC-AC)
  variables:
  - BAC
  - EV
  - AC
  when_to_use: Kiểm tra mục tiêu giữ nguyên BAC có thực tế không.
- id: m06_emv
  module: m06
  name_vi: Giá trị tiền tệ kỳ vọng của rủi ro (EMV)
  name_en: Expected Monetary Value
  expression_latex: EMV=P\times I
  expression_python: P*I
  excel: =P*I
  variables:
  - P
  - I
  when_to_use: Xếp hạng rủi ro và lập quỹ dự phòng bằng tổng EMV.
- id: m06_contingency_reserve
  module: m06
  name_vi: Quỹ dự phòng từ EMV
  name_en: Contingency reserve
  expression_latex: Reserve=\sum_i P_iI_i,\; ratio=\frac{Reserve}{BAC}
  expression_python: sum(p*i for p,i in zip(P,I))
  excel: null
  variables:
  - P
  - I
  when_to_use: Chốt dự phòng ngân sách.
- id: m06_velocity_forecast
  module: m06
  name_vi: Dự báo số sprint còn lại theo velocity
  name_en: Velocity-based forecast
  expression_latex: N=\frac{Backlog}{\bar v},\; \bar v=\frac{1}{k}\sum v_i
  expression_python: backlog_left/(sum(v)/len(v))
  excel: =backlog/AVERAGE(v)
  variables:
  - backlog_left
  - v
  when_to_use: Dự đoán ngày xong khi backlog biết; chạy thêm biến thể với 3 sprint gần nhất khi velocity đang tăng.
- id: m06_resource_utilization
  module: m06
  name_vi: Hiệu suất sử dụng nguồn lực
  name_en: Resource utilization
  expression_latex: U=\frac{\sum demand}{\sum capacity}
  expression_python: sum(demand)/sum(capacity)
  excel: =SUM(demand)/SUM(capacity)
  variables:
  - demand
  - capacity
  when_to_use: Kiểm tra tải đa dự án; phát hiện ngày vượt công suất.
- id: m06_late_cost
  module: m06
  name_vi: Chi phí trễ hạn tích lũy
  name_en: Cost of delay
  expression_latex: Cost=days\times c_{day}
  expression_python: days*c_day
  excel: null
  variables:
  - days
  - c_day
  when_to_use: So chi phí trễ với chi phí tránh trễ.
- id: m06_defect_cost_stage
  module: m06
  name_vi: Chi phí sửa lỗi theo giai đoạn phát hiện
  name_en: Cost of change by stage
  expression_latex: C=\sum_s n_s c_s
  expression_python: sum(n*c for n,c in zip(counts,unit_costs))
  excel: null
  variables:
  - counts
  - unit_costs
  when_to_use: Chứng minh lợi ích kiểm tra sớm.
- id: m06_wait_time
  module: m06
  name_vi: Thời gian chờ phụ thuộc chéo (tính năng-tuần)
  name_en: Cross-team dependency wait
  expression_latex: W=n\times share\times wait
  expression_python: n*share*wait
  excel: null
  variables:
  - n
  - share
  - wait
  when_to_use: Chứng minh giá trị phối hợp Scrum of Scrums.
- id: m07_moving_average
  module: m07
  name_vi: Trung bình động n kỳ
  name_en: Moving Average (MA_n)
  expression_latex: MA_n=\frac{\sum_{i=1}^{n}Y_{t-i+1}}{n}
  expression_python: sum(y[-n:])/n
  excel: =AVERAGE(B2:B4)
  variables:
  - y
  - n
  when_to_use: Nhu cầu ổn định, đi ngang, không xu hướng, không mùa vụ; muốn lọc nhiễu nhanh và đơn giản.
- id: m07_weighted_moving_average
  module: m07
  name_vi: Trung bình động có trọng số
  name_en: Weighted Moving Average (WMA)
  expression_latex: WMA=\sum_i w_i\,Y_{t-i+1},\quad \sum_i w_i=1
  expression_python: sum(w[i]*y[-1-i] for i in range(len(w)))
  excel: =SUMPRODUCT(B2:B4, D2:D4)
  variables:
  - y
  - w
  when_to_use: Giống MA nhưng muốn tin dữ liệu mới hơn; hoặc tách chuỗi theo ngày trong tuần (WMA riêng các ngày thứ Bảy).
- id: m07_ses
  module: m07
  name_vi: San bằng số mũ đơn
  name_en: Simple Exponential Smoothing (SES)
  expression_latex: F_{t+1}=\alpha Y_t+(1-\alpha)F_t = F_t+\alpha(Y_t-F_t)
  expression_python: alpha*y_t + (1-alpha)*f_t
  excel: =$J$1*B2+(1-$J$1)*C2
  variables:
  - alpha
  - y_t
  - f_t
  when_to_use: Nhu cầu đi ngang có nhiễu; hàng nghìn mã hàng cần tự động hoá (chỉ nhớ 1 số mỗi mã).
- id: m07_holt
  module: m07
  name_vi: San bằng số mũ điều chỉnh xu hướng (Holt)
  name_en: Holt linear trend (double exponential smoothing)
  expression_latex: L_t=\alpha Y_t+(1-\alpha)(L_{t-1}+T_{t-1});\; T_t=\beta(L_t-L_{t-1})+(1-\beta)T_{t-1};\; F_{t+h}=L_t+hT_t
  expression_python: '(lambda Ln: (Ln, beta*(Ln-L)+(1-beta)*T, Ln+(beta*(Ln-L)+(1-beta)*T)))(alpha*y_t+(1-alpha)*(L+T))'
  excel: =B2*alpha+(1-alpha)*(L_prev+T_prev) ; FORECAST.ETS cho phiên bản có mùa vụ
  variables:
  - alpha
  - beta
  - y_t
  - L
  - T
  when_to_use: Chuỗi có xu hướng tăng/giảm, chưa có mùa vụ.
- id: m07_holt_winters
  module: m07
  name_vi: Holt-Winters nhân (ba tham số)
  name_en: Holt-Winters multiplicative
  expression_latex: L_t=\alpha\frac{Y_t}{s_{t-p}}+(1-\alpha)(L_{t-1}+T_{t-1});\; T_t=\beta(L_t-L_{t-1})+(1-\beta)T_{t-1};\;
    s_t=\gamma\frac{Y_t}{L_t}+(1-\gamma)s_{t-p};\; F_{t+h}=(L_t+hT_t)s_{t+h-p}
  expression_python: '(lambda Ln: (Ln, beta*(Ln-L)+(1-beta)*T, gamma*y_t/Ln+(1-gamma)*s))(alpha*y_t/s+(1-alpha)*(L+T))'
  excel: FORECAST.ETS(target_date, values, timeline, seasonality)
  variables:
  - alpha, beta, gamma
  - y_t
  - L, T
  - s
  - p
  when_to_use: Chuỗi có cả xu hướng và mùa vụ với biên độ tỷ lệ quy mô, đã có 2-3 chu kỳ đầy đủ (24-36 tháng).
- id: m07_ols_regression
  module: m07
  name_vi: Hồi quy tuyến tính đơn (OLS) / hồi quy xu hướng
  name_en: Simple linear regression (Ordinary Least Squares)
  expression_latex: Y=a+bX;\quad b=\frac{n\sum XY-\sum X\sum Y}{n\sum X^2-(\sum X)^2};\quad a=\bar Y-b\bar X
  expression_python: '(lambda b: (b, sum(y)/n - b*sum(x)/n))((n*sum(xi*yi for xi,yi in zip(x,y)) - sum(x)*sum(y))/(n*sum(xi*xi
    for xi in x) - sum(x)**2))'
  excel: =SLOPE(Y,X) ; =INTERCEPT(Y,X) ; =FORECAST.LINEAR(13,B2:B13,A2:A13) ; =TREND(...)
  variables:
  - x
  - y
  - n
  - b
  - a
  when_to_use: Dự báo xu hướng theo thời gian, hoặc mô hình nhân quả để trả lời câu hỏi nếu tăng quảng cáo/giảm giá thì doanh
    số đổi bao nhiêu.
- id: m07_r_squared
  module: m07
  name_vi: Hệ số xác định R2, sai số chuẩn hồi quy và khoảng dự báo
  name_en: Coefficient of determination, standard error of regression
  expression_latex: R^2=1-\frac{SSE}{SST};\; SSE=\sum(Y_t-\hat Y_t)^2;\; SST=\sum(Y_t-\bar Y)^2;\; s_e=\sqrt{\frac{SSE}{n-2}}
  expression_python: (1 - sse/sst, (sse/(n-2))**0.5)
  excel: =RSQ(Y,X) ; =STEYX(Y,X)
  variables:
  - sse
  - sst
  - n
  when_to_use: Đo mức mô hình hồi quy giải thích biến động; ước khoảng dự báo +-2 s_e.
- id: m07_multiple_regression
  module: m07
  name_vi: Hồi quy đa biến
  name_en: Multiple linear regression
  expression_latex: Y=a+b_1X_1+b_2X_2+\dots+b_kX_k;\quad R^2_{adj}=1-(1-R^2)\frac{n-1}{n-k-1}
  expression_python: a + b1*x1 + b2*x2
  excel: =LINEST(Y, X1:X2, TRUE, TRUE)
  variables:
  - a
  - b1, b2
  - x1, x2
  when_to_use: Khi có yếu tố nhân quả rõ (giá, quảng cáo, thời tiết, khuyến mãi) và cần trả lời câu hỏi nếu... thì...
- id: m07_seasonal_index
  module: m07
  name_vi: Chỉ số mùa vụ (phương pháp trung bình đơn giản)
  name_en: Seasonal index
  expression_latex: S_q=\frac{\bar Y_q}{\bar Y};\quad \sum_q S_q=p
  expression_python: '[sum(col)/len(col)/(sum(map(sum, data))/(len(data)*len(data[0]))) for col in zip(*data)]'
  excel: =AVERAGE(quý q các năm)/AVERAGE(toàn bộ)
  variables:
  - data
  - S_q
  - p
  when_to_use: 'Tách mùa khỏi tăng trưởng: quý 3 cao hơn quý 1 là do doanh nghiệp lớn hay chỉ do mùa?'
- id: m07_decomposition_forecast
  module: m07
  name_vi: 'Dự báo bằng phân rã: gỡ mùa vụ, hồi quy xu hướng, nhân lại chỉ số'
  name_en: Decomposition forecast (deseasonalize, trend, reseasonalize)
  expression_latex: Y^{adj}_t=\frac{Y_t}{S};\;\hat Y^{adj}_t=a+bt;\;F_t=(a+bt)\times S
  expression_python: (a + b*t)*S
  excel: =FORECAST.LINEAR(t, Y_adj, t_range) * S
  variables:
  - a, b
  - t
  - S
  when_to_use: Chuỗi có xu hướng và mùa vụ nhưng chỉ có 24-36 tháng; muốn giải thích được với chủ DN và làm trong Excel.
- id: m07_mad
  module: m07
  name_vi: Sai số tuyệt đối trung bình (MAD)
  name_en: Mean Absolute Deviation (MAD)
  expression_latex: MAD=\frac{\sum|Y_t-F_t|}{n}
  expression_python: sum(abs(a-f) for a,f in zip(y,fc))/len(y)
  excel: =AVERAGE(E2:E13) (cột E = |sai số|)
  variables:
  - y
  - fc
  when_to_use: Đo độ lớn sai số theo đơn vị hàng; dễ giải thích nhất.
- id: m07_mse_rmse
  module: m07
  name_vi: MSE và RMSE
  name_en: Mean Squared Error / Root MSE
  expression_latex: MSE=\frac{\sum(Y_t-F_t)^2}{n};\quad RMSE=\sqrt{MSE}
  expression_python: (sum((a-f)**2 for a,f in zip(y,fc))/len(y))**0.5
  excel: =SQRT(AVERAGE(F2:F13)) (cột F = sai số bình phương)
  variables:
  - y
  - fc
  when_to_use: Phạt nặng sai số lớn; RMSE liên hệ trực tiếp độ lệch chuẩn sai số nên dùng trong công thức Safety Stock.
- id: m07_mape
  module: m07
  name_vi: Sai số phần trăm tuyệt đối trung bình (MAPE) và Forecast Accuracy
  name_en: Mean Absolute Percentage Error (MAPE)
  expression_latex: MAPE=\frac{1}{n}\sum\left|\frac{Y_t-F_t}{Y_t}\right|\times100\%;\quad Accuracy=1-MAPE
  expression_python: sum(abs(a-f)/a for a,f in zip(y,fc))/len(y)*100
  excel: =AVERAGE(G2:G13) (cột G = |e|/Y)
  variables:
  - y
  - fc
  when_to_use: So sánh độ chính xác giữa sản phẩm/quy mô khác nhau.
- id: m07_bias
  module: m07
  name_vi: Độ lệch trung bình (Bias)
  name_en: Forecast Bias (Mean Error)
  expression_latex: Bias=\frac{\sum(Y_t-F_t)}{n}
  expression_python: sum(a-f for a,f in zip(y,fc))/len(y)
  excel: =AVERAGE(D2:D13)
  variables:
  - y
  - fc
  when_to_use: Phát hiện dự báo thừa/thiếu có hệ thống (không chỉ độ lớn).
- id: m07_wape
  module: m07
  name_vi: WAPE (sai số % có trọng số theo doanh số)
  name_en: Weighted Absolute Percentage Error
  expression_latex: WAPE=\frac{\sum|e_t|}{\sum Y_t}
  expression_python: sum(abs(a-f) for a,f in zip(y,fc))/sum(y)
  excel: =SUMPRODUCT(ABS(B2:B13-C2:C13))/SUM(B2:B13)
  variables:
  - y
  - fc
  when_to_use: Hàng bán rời rạc, nhiều kỳ bằng 0 nên MAPE không xác định.
- id: m07_tracking_signal
  module: m07
  name_vi: Tín hiệu theo dõi (Tracking Signal)
  name_en: Tracking Signal (TS)
  expression_latex: TS=\frac{\sum(Y_t-F_t)}{MAD}
  expression_python: sum(e)/(sum(abs(x) for x in e)/len(e))
  excel: =SUM(D2:D13)/AVERAGE(E2:E13)
  variables:
  - e
  when_to_use: Giám sát hằng tháng để phát hiện mô hình lệch hoặc thị trường đổi cấu trúc.
- id: m07_safety_stock_from_error
  module: m07
  name_vi: Tồn kho an toàn từ sai số dự báo
  name_en: Safety stock from forecast error
  expression_latex: SS=z\,\sigma_e\sqrt{L}
  expression_python: z*sigma_e*L**0.5
  excel: =NORM.S.INV(service_level)*sigma_e*SQRT(L)
  variables:
  - z
  - sigma_e
  - L
  when_to_use: 'Nối dự báo với tồn kho (m04): đặt đệm theo sai số thay vì +10-20% cố định.'
- id: m07_cost_asymmetry_threshold
  module: m07
  name_vi: Ngưỡng xác suất để tăng tồn kho (bất đối xứng chi phí thiếu/dư)
  name_en: Stocking threshold from under/over cost
  expression_latex: p\,C_u>(1-p)\,C_o\;\Rightarrow\;p>\frac{C_o}{C_u+C_o}
  expression_python: co/(cu+co)
  excel: =Co/(Cu+Co)
  variables:
  - cu
  - co
  when_to_use: Quyết định có điều chỉnh tồn kho theo dự báo sự kiện bất định (bão, khuyến mãi, lễ).
- id: m07_demand_growth_capacity
  module: m07
  name_vi: Tăng trưởng nhu cầu và thời điểm cần thêm công suất
  name_en: Demand growth via income elasticity and capacity trigger time
  expression_latex: g=\varepsilon\cdot g_{GDP}+g_{pop};\quad n=\frac{\ln(U_{max}\cdot C/D_0)}{\ln(1+g)}
  expression_python: math.log(umax*cap/d0)/math.log(1+g)
  excel: =LN(Umax*Cap/D0)/LN(1+g)
  variables:
  - g
  - umax
  - cap
  - d0
  when_to_use: Dự báo dài hạn theo vĩ mô để xác định mốc đầu tư công suất; kèm độ nhạy theo kịch bản.
- id: m07_early_sales_extrapolation
  module: m07
  name_vi: Dự báo nhu cầu vòng đời từ tốc độ bán sớm
  name_en: Life-cycle demand from early-sales share
  expression_latex: D_{life}=\frac{S_{3d}}{\rho},\quad \rho=0.35
  expression_python: s3d/rho
  excel: =Doanh_so_3_ngay/0.35
  variables:
  - s3d
  - rho
  when_to_use: Mẫu mới mỗi tháng, không có lịch sử từng mẫu (thời trang online, đồ theo trend).
- id: m08_layout_total_cost
  module: m08
  name_vi: Tổng chi phí của một layout
  name_en: Layout total cost
  expression_latex: TC = FC + VC \times Q
  expression_python: fc + vc * q
  excel: =FC + VC*Q
  variables:
  - fc
  - vc
  - q
  when_to_use: So sánh tổng chi phí hai phương án layout ở một mức sản lượng cụ thể.
- id: m08_layout_breakeven
  module: m08
  name_vi: Sản lượng hoà vốn giữa Process và Product layout
  name_en: Process vs Product layout break-even volume
  expression_latex: Q^* = \frac{FC_{product} - FC_{process}}{VC_{process} - VC_{product}}
  expression_python: (fc_product - fc_process) / (vc_process - vc_product)
  excel: =(FC_product-FC_process)/(VC_process-VC_product)
  variables:
  - fc_product
  - fc_process
  - vc_process
  - vc_product
  when_to_use: Quyết định có đầu tư dây chuyền chuyên dụng (product) thay máy đa năng (process) hay không.
- id: m08_rel_tcr
  module: m08
  name_vi: Tổng điểm gần kề (TCR) trong REL Chart
  name_en: Total Closeness Rating
  expression_latex: TCR_i = \sum_{j \ne i} score(rel_{ij}),\quad A=4,E=3,I=2,O=1,U=0,X=-1
  expression_python: sum(scores)
  excel: =SUM(range_diem_quan_he)
  variables:
  - scores
  when_to_use: Xếp hạng mức 'trung tâm' của từng bộ phận trước khi vẽ Block Layout (SLP bước 3-5).
- id: m08_material_handling_cost
  module: m08
  name_vi: Tổng chi phí vận chuyển nội bộ
  name_en: Total Material Handling Cost
  expression_latex: \text{Total Cost} = \sum_i \sum_j X_{ij} \cdot C_{ij} \cdot D_{ij}
  expression_python: sum(x * c * d for x, c, d in zip(X, C, D))
  excel: =SUMPRODUCT(X, C, D)
  variables:
  - X
  - C
  - D
  when_to_use: Quy tải x quãng đường ra tiền để so sánh phương án và tính hoàn vốn di dời.
- id: m08_load_distance
  module: m08
  name_vi: Load-Distance (khoảng cách có trọng số)
  name_en: Load-Distance / Weighted Distance
  expression_latex: LD = \sum_i \sum_j f_{ij} \times d_{ij}
  expression_python: sum(f * d for f, d in zip(loads, dists))
  excel: =SUMPRODUCT(Tải, Khoảng_cách)
  variables:
  - loads
  - dists
  when_to_use: Đánh giá và so sánh phương án bố trí theo quy trình; dùng làm hàm mục tiêu cho Pairwise Exchange.
- id: m08_rectilinear_distance
  module: m08
  name_vi: Khoảng cách rectilinear (Manhattan)
  name_en: Rectilinear distance
  expression_latex: d = |x_i - x_j| + |y_i - y_j|
  expression_python: abs(x1 - x2) + abs(y1 - y2)
  excel: =ABS(x1-x2)+ABS(y1-y2)
  variables:
  - x1
  - y1
  - x2
  - y2
  when_to_use: Tính d_ij trong Load-Distance cho xưởng/kho có lối đi vuông góc.
- id: m08_center_of_gravity
  module: m08
  name_vi: Phương pháp trọng tâm (vị trí kho trung tâm)
  name_en: Center of Gravity
  expression_latex: C_x = \frac{\sum_i x_i W_i}{\sum_i W_i},\quad C_y = \frac{\sum_i y_i W_i}{\sum_i W_i}
  expression_python: (sum(x * w for x, w in zip(xs, ws)) / sum(ws), sum(y * w for y, w in zip(ys, ws)) / sum(ws))
  excel: =SUMPRODUCT(x,W)/SUM(W) ; =SUMPRODUCT(y,W)/SUM(W)
  variables:
  - xs
  - ys
  - ws
  when_to_use: Chọn điểm xuất phát cho kho/DC phục vụ nhiều cửa hàng/khách có sản lượng khác nhau.
- id: m08_takt_time
  module: m08
  name_vi: Takt time
  name_en: Takt time
  expression_latex: \text{Takt time} = \frac{\text{Thời gian khả dụng mỗi ngày}}{\text{Nhu cầu mỗi ngày}}
  expression_python: available_time / demand
  excel: =Thời_gian_khả_dụng/Nhu_cầu
  variables:
  - available_time
  - demand
  when_to_use: Xác định nhịp chuyền và chu kỳ C tối đa khi cân bằng chuyền.
- id: m08_min_stations
  module: m08
  name_vi: Số trạm tối thiểu lý thuyết
  name_en: Theoretical minimum number of stations
  expression_latex: N_{min} = \left\lceil \frac{\sum t_i}{C} \right\rceil
  expression_python: math.ceil(sum_t / c)
  excel: =ROUNDUP(SUM(Thời_gian)/Chu_kỳ,0)
  variables:
  - sum_t
  - c
  when_to_use: Chặn dưới số trạm trước khi phân bổ task.
- id: m08_line_efficiency
  module: m08
  name_vi: Hiệu suất chuyền và độ trễ cân bằng
  name_en: Line efficiency and balance delay
  expression_latex: E = \frac{\sum t_i}{N \times C} \times 100\%,\quad \text{Balance Delay} = 100\% - E
  expression_python: sum_t / (n * c)
  excel: =SUM(Thời_gian)/(Số_trạm*Chu_kỳ)
  variables:
  - sum_t
  - n
  - c
  when_to_use: Đánh giá mức độ cân bằng; so sánh phương án phân bổ.
- id: m08_line_idle
  module: m08
  name_vi: Thời gian nhàn rỗi mỗi chu kỳ
  name_en: Idle time per cycle
  expression_latex: \text{Idle} = N \times C - \sum t_i
  expression_python: n * c - sum_t
  excel: =Số_trạm*Chu_kỳ-SUM(Thời_gian)
  variables:
  - n
  - c
  - sum_t
  when_to_use: Biết tổng thời gian đứng chờ để giao việc phụ hoặc xem có bỏ được một trạm.
- id: m08_rpw
  module: m08
  name_vi: Trọng số vị trí (RPW)
  name_en: Ranked Positional Weight
  expression_latex: RPW_i = t_i + \sum_{j \in \text{task theo sau } i} t_j
  expression_python: t_i + sum(t_after)
  excel: =t_i+SUM(thời_gian_các_task_theo_sau)
  variables:
  - t_i
  - t_after
  when_to_use: Xếp thứ tự ưu tiên khi phân bổ task vào trạm (Helgeson-Birnie 1961).
- id: m08_line_output
  module: m08
  name_vi: Sản lượng chuyền theo chu kỳ thực
  name_en: Line output at actual cycle
  expression_latex: \text{Output} = \frac{\text{Thời gian khả dụng}}{\text{Chu kỳ thực}}
  expression_python: available_time / cycle
  excel: =Thời_gian_khả_dụng/Chu_kỳ
  variables:
  - available_time
  - cycle
  when_to_use: 'Kiểm tra nhạy cảm: nếu trạm nút cổ chai chậm đi thì mất bao nhiêu sản lượng.'
- id: m08_roc_binary_value
  module: m08
  name_vi: Giá trị nhị phân hàng/cột (ROC)
  name_en: ROC binary value
  expression_latex: V = \sum_k a_k \cdot 2^{n-k}
  expression_python: int(''.join(map(str, row)), 2)
  excel: =BIN2DEC(chuỗi_nhị_phân)
  variables:
  - row
  when_to_use: 'Mỗi vòng ROC: tính giá trị nhị phân rồi sắp xếp giảm dần, lặp đến khi hàng và cột không đổi.'
- id: m08_batch_lead_time
  module: m08
  name_vi: Lead time theo lô (batch-and-queue)
  name_en: Batch lead time
  expression_latex: T_{batch} = n \times Q \times t
  expression_python: n_ops * batch * t
  excel: =n*Q*t
  variables:
  - n_ops
  - batch
  - t
  when_to_use: Cơ sở so sánh với one-piece flow khi cân nhắc chuyển sang cell.
- id: m08_onepiece_lead_time
  module: m08
  name_vi: Lead time dòng chảy từng chi tiết (cell)
  name_en: One-piece flow lead time
  expression_latex: T_{cell} = n \times t + (Q - 1) \times t
  expression_python: n_ops * t + (batch - 1) * t
  excel: =n*t+(Q-1)*t
  variables:
  - n_ops
  - batch
  - t
  when_to_use: Ước lượng lợi ích lead time khi chuyển process layout sang cell.
- id: m08_littles_law
  module: m08
  name_vi: Định luật Little
  name_en: Little's Law
  expression_latex: WIP = Throughput \times Lead\ Time
  expression_python: throughput * lead_time
  excel: =Throughput*LeadTime
  variables:
  - throughput
  - lead_time
  when_to_use: Quy đổi giảm lead time thành giảm WIP và vốn lưu động giải phóng.
- id: m08_sales_per_m2
  module: m08
  name_vi: Doanh thu trên mét vuông
  name_en: Sales per square meter
  expression_latex: \text{Sales per m}^2 = \frac{\text{Doanh thu tháng}}{\text{Diện tích trưng bày}}
  expression_python: revenue / display_area
  excel: =Doanh_thu/Diện_tích_trưng_bày
  variables:
  - revenue
  - display_area
  when_to_use: KPI chính cho layout bán lẻ; so với chính mình theo thời gian và giữa cửa hàng cùng chuỗi.
- id: m08_space_utilization
  module: m08
  name_vi: Hệ số sử dụng không gian
  name_en: Space Utilization
  expression_latex: \text{Space Utilization} = \frac{\text{Diện tích hữu ích}}{\text{Tổng diện tích}}
  expression_python: useful_area / total_area
  excel: =Diện_tích_hữu_ích/Tổng_diện_tích
  variables:
  - useful_area
  - total_area
  when_to_use: Đo hiệu quả dùng mặt bằng, phát hiện diện tích chết.
- id: m08_aisle_capacity
  module: m08
  name_vi: Sức chứa kho theo thiết kế lối đi
  name_en: Warehouse capacity by aisle design
  expression_latex: Capacity = \left\lfloor \frac{W}{D + A} \right\rfloor \times 2 \times \left\lfloor \frac{L}{p} \right\rfloor
    \times levels
  expression_python: int(width // (rack_depth + aisle)) * 2 * int(length // pallet_w) * levels
  excel: =INT(W/(D+A))*2*INT(L/p)*Tầng
  variables:
  - width
  - rack_depth
  - aisle
  - length
  - pallet_w
  - levels
  when_to_use: So sánh lối đi rộng (xe nâng thường) và lối hẹp (xe chuyên dụng) về sức chứa.
- id: m08_labor_cost_per_worker
  module: m08
  name_vi: Chi phí lao động một công nhân mỗi năm
  name_en: Annual labor cost per worker
  expression_latex: C_{worker} = w \times 12 \times (1 + r_{ins})
  expression_python: monthly_wage * 12 * (1 + ins_rate)
  excel: =Lương*12*(1+Tỷ_lệ_bảo_hiểm)
  variables:
  - monthly_wage
  - ins_rate
  when_to_use: Đầu vào cho payback tự động hoá và tiết kiệm cân bằng chuyền.
- id: m08_automation_payback
  module: m08
  name_vi: Thời gian hoàn vốn tự động hoá
  name_en: Automation payback
  expression_latex: \text{Payback (năm)} = \frac{\text{Đầu tư}}{\text{Lao động tiết kiệm/năm} - \text{Chi phí vận hành/bảo
    trì/năm}}
  expression_python: capex / (n_workers * cost_per_worker - opex)
  excel: =Đầu_tư/(Số_CN*Chi_phí_CN-Vận_hành)
  variables:
  - capex
  - n_workers
  - cost_per_worker
  - opex
  when_to_use: Quyết định đầu tư AGV/robot kho.
- id: m08_resource_capacity_per_hour
  module: m08
  name_vi: Năng lực một nguồn lực theo giờ
  name_en: Resource capacity per hour
  expression_latex: \text{Năng lực} = \frac{3600}{t}
  expression_python: 3600 / t_sec
  excel: =3600/t
  variables:
  - t_sec
  when_to_use: Tìm nút cổ chai ở quán, quầy, trạm.
- id: m08_utilization
  module: m08
  name_vi: Mức sử dụng so với nhu cầu
  name_en: Utilization (demand / capacity)
  expression_latex: U = \frac{\text{Nhu cầu}}{\text{Năng lực}}
  expression_python: demand / capacity
  excel: =Nhu_cầu/Năng_lực
  variables:
  - demand
  - capacity
  when_to_use: Kiểm tra ổn định hàng đợi và mục tiêu thiết kế.
- id: m08_system_capacity
  module: m08
  name_vi: Năng lực hệ thống = nguồn lực hẹp nhất
  name_en: System capacity as min of resources
  expression_latex: Cap = \min\left(\frac{n_c T e_c}{t_c},\ \frac{n_d T e_d}{t_d}\right)
  expression_python: min(n_chairs * T * eff_c / t_c, n_docs * T * eff_d / t_d)
  excel: =MIN(n_ghe*T*hs_ghe/t_ghe, n_bs*T*hs_bs/t_bs)
  variables:
  - n_chairs
  - T
  - eff_c
  - t_c
  - n_docs
  - eff_d
  - t_d
  when_to_use: Trước khi chi tiền mở rộng một nguồn lực (thêm ghế) để biết có thực sự tăng năng lực.
- id: m08_impulse_value
  module: m08
  name_vi: Giá trị mua bốc phát kỳ vọng theo số khu đi qua
  name_en: Expected impulse purchase value
  expression_latex: E = n_{zone} \times p \times v
  expression_python: n_zones * p * v
  excel: =n_khu*p*v
  variables:
  - n_zones
  - p
  - v
  when_to_use: Minh hoạ lợi ích Loop layout so với Free-flow.
- id: m08_walk_hours
  module: m08
  name_vi: Giờ đi bộ lấy hàng mỗi ngày
  name_en: Daily picking walk hours
  expression_latex: H = \frac{N_{lines} \times \bar d}{v \times 3600}
  expression_python: lines * avg_dist / (speed * 3600)
  excel: =Dòng*KC_TB/(V*3600)
  variables:
  - lines
  - avg_dist
  - speed
  when_to_use: Đánh giá lợi ích slotting theo ABC (đưa SKU nhóm A gần khu đóng gói).
- id: m08_standardization_payback
  module: m08
  name_vi: Hoàn vốn chuẩn hoá layout chuỗi
  name_en: Layout standardization payback
  expression_latex: T = \frac{Capex}{(S_{std} - S_{non}) \times A \times GM}
  expression_python: capex / ((s_std - s_non) * area * gm)
  excel: =Chi_phí/((S_chuẩn-S_không)*Diện_tích*Biên_gộp)
  variables:
  - capex
  - s_std
  - s_non
  - area
  - gm
  when_to_use: Quyết định nhân rộng layout chuẩn trong chuỗi.
- id: m08_pct_reduction
  module: m08
  name_vi: Mức giảm tương đối
  name_en: Relative reduction
  expression_latex: \Delta\% = \frac{before - after}{before}
  expression_python: (before - after) / before
  excel: =(Trước-Sau)/Trước
  variables:
  - before
  - after
  when_to_use: Báo cáo hiệu quả layout trước/sau.
- id: m09_throughput
  module: m09
  name_vi: Throughput (T)
  name_en: Throughput
  expression_latex: T = \text{Doanh thu bán hàng} - \text{Chi phí hoàn toàn biến đổi (TVC)}
  expression_python: revenue - tvc
  excel: =B2-C2
  variables:
  - revenue
  - tvc
  when_to_use: Mọi phân tích TOC; thay cho 'lãi gộp sau phân bổ nhân công/chi phí chung'.
- id: m09_net_profit_roi
  module: m09
  name_vi: Lợi nhuận ròng và ROI theo T-I-OE
  name_en: Net Profit and ROI (TOC)
  expression_latex: NP = T - OE, \qquad ROI = \frac{T - OE}{I}
  expression_python: (T - OE, (T - OE) / I)
  excel: =B2-B3 ; =(B2-B3)/B4
  variables:
  - T
  - OE
  - I
  when_to_use: 'Đánh giá hiệu quả hệ thống và so sánh ba đòn bẩy: tăng T, giảm OE, giảm I.'
- id: m09_productivity_turns
  module: m09
  name_vi: Năng suất T/OE và vòng quay đầu tư T/I
  name_en: Throughput productivity and investment turns
  expression_latex: \text{Năng suất} = \frac{T}{OE}, \qquad \text{Vòng quay} = \frac{T}{I}
  expression_python: (T / OE, T / I)
  excel: =B2/B3 ; =B2/B4
  variables:
  - T
  - OE
  - I
  when_to_use: Chỉ số phụ để theo dõi hiệu quả dùng chi phí vận hành và vốn.
- id: m09_utilization
  module: m09
  name_vi: Tỷ lệ sử dụng công đoạn (nhận diện ràng buộc)
  name_en: Resource utilization
  expression_latex: \text{Tỷ lệ sử dụng} = \frac{\text{Dòng chảy thực tế}}{\text{Năng lực tối đa}}
  expression_python: flow / capacity
  excel: =B2/C2
  variables:
  - flow
  - capacity
  when_to_use: 'Bước Identify: lập bảng năng lực từng công đoạn; công đoạn tiến tới 100% khi dòng chảy bằng đầu ra hệ thống
    là ràng buộc.'
- id: m09_system_output
  module: m09
  name_vi: Đầu ra hệ thống và đầu ra tối đa theo ràng buộc
  name_en: System output = min of capacities and demand
  expression_latex: \text{Đầu ra} = \min(C_1, C_2, \dots, C_n, D)
  expression_python: min(capacities + [demand])
  excel: =MIN(B2:B5, D1)
  variables:
  - capacities
  - demand
  when_to_use: Xác định ràng buộc (vật lý nếu min là một công đoạn, thị trường nếu min là nhu cầu) và tính đầu ra sau khi
    Exploit/Elevate.
- id: m09_wip_accumulation
  module: m09
  name_vi: Tồn đọng WIP do công đoạn nhanh chạy hết công suất
  name_en: WIP build-up before a slower step
  expression_latex: \text{WIP tích lũy} = (C_{truoc} - C_{sau}) \times h
  expression_python: (c_up - c_down) * hours
  excel: null
  variables:
  - c_up
  - c_down
  - hours
  when_to_use: Định lượng cái giá của tối ưu cục bộ trước khi đề xuất Subordinate/DBR.
- id: m09_tcu
  module: m09
  name_vi: Throughput trên mỗi đơn vị ràng buộc (T/CU)
  name_en: Throughput per Constraint Unit
  expression_latex: T/CU = \frac{\text{Giá bán} - \text{NVL trực tiếp}}{\text{Thời gian xử lý tại ràng buộc (phút)}}
  expression_python: (price - material) / minutes
  excel: =(B2-C2)/D2
  variables:
  - price
  - material
  - minutes
  when_to_use: Nhiều sản phẩm dùng chung một ràng buộc và cần xếp ưu tiên product mix.
- id: m09_product_mix_allocation
  module: m09
  name_vi: Phân bổ product mix theo T/CU (greedy)
  name_en: Product mix allocation by T/CU
  expression_latex: q_i = \min\left(D_i,\ \left\lfloor \frac{M_{con\,lai}}{m_i} \right\rfloor\right),\ \text{theo thứ tự }
    T/CU \text{ giảm dần}
  expression_python: "def product_mix(products, minutes):\n    # products: list of dict(name, price, material, mins, demand)\n\
    \    rows = sorted(products, key=lambda p: (p['price'] - p['material']) / p['mins'], reverse=True)\n    left, out, total\
    \ = minutes, [], 0\n    for p in rows:\n        q = min(p['demand'], int(left // p['mins']))\n        out.append((p['name'],\
    \ q)); left -= q * p['mins']; total += q * (p['price'] - p['material'])\n    return out, total\n"
  excel: Sắp bảng theo T/CU giảm dần; I2 =MIN(E2,ROUNDDOWN($K$1/D2,0)); các dòng sau trừ phút đã dùng bằng SUMPRODUCT
  variables:
  - products
  - minutes
  when_to_use: Chọn số lượng mỗi sản phẩm khi năng lực ràng buộc không đủ cho toàn bộ nhu cầu.
- id: m09_breakeven_price_tcu
  module: m09
  name_vi: Giá tối thiểu để một sản phẩm đạt T/CU mục tiêu
  name_en: Minimum price to reach target T/CU
  expression_latex: P_{min} = M + (T/CU)_{muc\,tieu} \times m
  expression_python: material + target_tcu * minutes
  excel: null
  variables:
  - material
  - target_tcu
  - minutes
  when_to_use: 'Khi sản phẩm T/CU thấp vẫn có khách: tăng giá đến mức đáng làm, hoặc chỉ nhận khi ràng buộc còn rảnh.'
- id: m09_exploit_capacity_gain
  module: m09
  name_vi: Mức tăng năng lực nhờ Exploit và tác động T
  name_en: Capacity gain from Exploit
  expression_latex: \Delta C\% = \frac{C_{sau}}{C_{truoc}} - 1, \qquad \Delta T = \Delta q \times t
  expression_python: (c_after / c_before - 1, (c_after - c_before) * t_unit)
  excel: null
  variables:
  - c_before
  - c_after
  - t_unit
  when_to_use: Định lượng Exploit (giảm chuyển đổi, chờ vật tư, nghỉ trưa luân phiên, kiểm tra trước khi vào ràng buộc).
- id: m09_little
  module: m09
  name_vi: Định luật Little (WIP - lead time)
  name_en: Little's Law
  expression_latex: WIP = T_h \times LT \;\Rightarrow\; LT = \frac{WIP}{T_h}
  expression_python: wip / throughput_rate
  excel: =B2/B3
  variables:
  - wip
  - throughput_rate
  when_to_use: Chứng minh giảm WIP bằng DBR rút ngắn lead time mà đầu ra không đổi; tính lead time chờ trước ràng buộc.
- id: m09_buffer_size
  module: m09
  name_vi: Kích thước buffer khởi đầu của DBR
  name_en: Initial DBR buffer size
  expression_latex: B_0 \approx 50\% \times LT_{hien\,tai} \quad (\text{và buffer lượng} = B \times \text{tốc độ ràng buộc})
  expression_python: (0.5 * lead_time, 0.5 * lead_time * rate)
  excel: null
  variables:
  - lead_time
  - rate
  when_to_use: Thiết lập ban đầu buffer trước ràng buộc, rồi chỉnh theo dữ liệu Buffer Management.
- id: m09_buffer_penetration
  module: m09
  name_vi: Mức tiêu hao buffer và vùng Xanh/Vàng/Đỏ
  name_en: Buffer Penetration
  expression_latex: \text{Buffer Penetration} = \frac{\text{Thời gian buffer đã tiêu hao}}{\text{Tổng thời gian buffer}} \times
    100\%
  expression_python: consumed / total * 100
  excel: =B2/C2
  variables:
  - consumed
  - total
  when_to_use: Theo dõi hằng ngày từng lệnh sản xuất/đơn hàng/dự án thay vì từng công đoạn.
- id: m09_project_buffer_50
  module: m09
  name_vi: Project Buffer theo quy tắc 50% (CCPM)
  name_en: CCPM project buffer, 50% rule
  expression_latex: B = 50\% \times \sum_i \tfrac{1}{2} s_i, \qquad \text{Lịch} = \sum \tfrac{1}{2}s_i + B
  expression_python: (sum(s) * 0.5, sum(s) * 0.5 * 0.5, sum(s) * 0.5 * 1.5)
  excel: null
  variables:
  - s
  when_to_use: 'Thiết lập lịch dự án CCPM: cắt ước lượng 50%, gom dự phòng thành một buffer cuối chuỗi.'
- id: m09_project_buffer_rss
  module: m09
  name_vi: Project Buffer theo căn bậc hai tổng bình phương (RSS)
  name_en: CCPM buffer, Root Sum of Squares
  expression_latex: B = \sqrt{\sum_i d_i^2}, \quad d_i = \text{phần cắt của nhiệm vụ } i
  expression_python: sum(d_i ** 2 for d_i in d) ** 0.5
  excel: null
  variables:
  - d
  when_to_use: Cách tính chặt chẽ hơn quy tắc 50%, đặc biệt chuỗi dài nhiều nhiệm vụ.
- id: m09_oee
  module: m09
  name_vi: Hiệu suất tổng thể thiết bị (OEE)
  name_en: Overall Equipment Effectiveness
  expression_latex: OEE = A \times P \times Q, \quad A = \frac{t_{chay}}{t_{kehoach}},\ P = \frac{q_{thuc}}{q_{lytuong}},\
    Q = \frac{q_{dat}}{q_{thuc}}
  expression_python: (t_run / t_plan) * (q_actual / q_ideal) * (q_good / q_actual)
  excel: =B1*B2*B3
  variables:
  - t_run
  - t_plan
  - q_actual
  - q_ideal
  - q_good
  when_to_use: 'Chỉ đo TẠI RÀNG BUỘC để tìm dư địa Exploit (A: dừng máy; P: chạy chậm; Q: lỗi).'
- id: m09_elevate_payback
  module: m09
  name_vi: Thời gian hoàn vốn của quyết định Elevate
  name_en: Payback of an Elevate investment
  expression_latex: \text{Hoàn vốn} = \frac{\text{Vốn đầu tư}}{\Delta T - \Delta OE}
  expression_python: capex / (delta_t - delta_oe)
  excel: =B1/(B2-B3)
  variables:
  - capex
  - delta_t
  - delta_oe
  when_to_use: Trước mọi khoản Elevate; so với Exploit và với phương án đầu tư sai chỗ.
- id: m09_inventory_release_value
  module: m09
  name_vi: Vốn giải phóng và tiết kiệm lãi do giảm tồn kho
  name_en: Capital released by WIP/inventory reduction
  expression_latex: \text{Vốn giải phóng} = \Delta WIP \times v, \qquad \text{Tiết kiệm lãi} = \text{Vốn giải phóng} \times
    r
  expression_python: (d_wip * unit_value, d_wip * unit_value * rate)
  excel: null
  variables:
  - d_wip
  - unit_value
  - rate
  when_to_use: Định lượng lợi ích tài chính của Subordinate/DBR hoặc Replenishment.
- id: m09_dbm_replenishment_buffer
  module: m09
  name_vi: Buffer bổ sung và điều chỉnh động (DBM)
  name_en: Replenishment buffer and DBM adjustment
  expression_latex: B = d \times L \times k, \qquad B_{moi} \approx \tfrac{4}{3} B \ (\text{khi liên tiếp vùng Đỏ})
  expression_python: (d * L * k, d * L * k * 4 / 3)
  excel: null
  variables:
  - d
  - L
  - k
  when_to_use: Thiết lập buffer cho từng mặt hàng/điểm bán; chia vùng 1/3 (Xanh >= 2/3 buffer, Vàng 1/3-2/3, Đỏ < 1/3 buffer).
