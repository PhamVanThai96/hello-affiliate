  expression_latex: \sigma_{pool} = \sigma\sqrt{n + n(n-1)\rho}, \quad SS_{pool} = Z\,\sigma_{pool}\sqrt{L}
  expression_python: Z*sigma*sqrt(n + n*(n-1)*rho)*sqrt(L)
