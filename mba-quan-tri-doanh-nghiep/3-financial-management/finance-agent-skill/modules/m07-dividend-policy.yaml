  - {metric: "Interest coverage an toàn", value: "Trên 3 lần", context: "Quy tắc thực hành", confidence: "medium"}

pitfalls:
  - "Chia cổ tức dựa trên lợi nhuận kế toán mà không xét tiền mặt/FCF; cạn tiền, phải vay trả lương và nhà cung cấp."
  - "Chia hết 'cho cổ đông vui' khi còn dự án NPV > 0, bỏ cơ hội tăng trưởng."
  - "Giữ tiền nhàn rỗi vô thời hạn: chi phí cơ hội và xung đột cổ đông (ví dụ mất 66 triệu/năm cho 600 triệu)."
  - "Cam kết cổ tức cao rồi cắt đột ngột (bài học GE); nên dùng nền + bổ sung."
  - "Vay ngân hàng để chia cổ tức: rò rỉ thuế + phí + tăng rủi ro."
  - "Không có văn bản chính sách cổ tức: tranh chấp giữa cổ đông lớn và nhỏ."
  - "Bỏ qua covenant ngân hàng."
  - "Tin 'buyback làm EPS tăng nên giá tăng'; giá không đổi vì vốn hóa giảm."
  - "Cho rằng cổ tức bằng cổ phiếu làm cổ đông giàu thêm."
  - "Dùng homemade dividend/M&M cho SME chưa niêm yết, trong khi chi phí giao dịch và chiết khấu thanh khoản rất lớn."
  - "Dùng Gordon khi g gần hoặc lớn hơn Ke."
  - "Lẫn đơn vị triệu đồng và đồng khi tính EPS/DPS."
  - "Quên khấu trừ thuế TNCN 5% tại nguồn khi chia cổ tức cá nhân."
  - "Trả lời tư vấn tuyệt đối về thuế/pháp lý mà không nhắc xác nhận lại với kế toán thuế/luật sư (quy định thay đổi)."

sme_vn_guidance:
  - "SME chưa niêm yết: thanh khoản cổ phần rất thấp nên homemade dividend gần như không thực tế; cổ tức tiền mặt có giá trị với cổ đông nhỏ/hưu trí."
  - "Chủ và quản lý thường trùng: agency cost nhỏ nhưng có xung đột cổ đông lớn/nhỏ; vốn khó huy động nên giữ lại thường hợp lý."
  - "Thuế TNCN cổ tức 5% khấu trừ tại nguồn; chuyển nhượng cổ phần CTCP 0,1%, phần vốn góp TNHH 20% trên chênh lệch; pháp nhân nhận cổ tức thường được miễn TNDN; cổ tức bằng cổ phiếu thường chưa chịu thuế khi nhận. Tất cả cần xác nhận quy định hiện hành."
  - "Điều kiện chia: LN sau thuế sau bù lỗ, trích quỹ theo điều lệ, hoàn thành nghĩa vụ thuế và vẫn thanh toán nợ đến hạn; ĐHĐCĐ quyết định mức, HĐQT đề xuất (đối chiếu Luật Doanh nghiệp hiện hành)."
  - "Kiểm tra covenant hợp đồng vay trước mỗi lần chia."
  - "Mô hình khuyến nghị cho SME lợi nhuận biến động: cổ tức nền bằng văn bản + thưởng một % lợi nhuận."
  - "Dữ liệu tham chiếu: payout/yield DN niêm yết cùng ngành trên HOSE/HNX, CafeF, Vietstock, SSI iBoard; Damodaran Online cho bảng ngành toàn cầu; BCTC xuất từ MISA, Fast để lấy NI, khấu hao, capex, vốn lưu động."
  - "Cổ tức cổ phiếu giúp tăng vốn điều lệ (có thể tăng quy mô vay) mà không chi tiền."
  - "Soạn đề xuất theo mẫu: căn cứ, nhu cầu đầu tư, mức đề xuất, hình thức, thời điểm, kiểm tra điều kiện, stress test, phê duyệt."

case_lessons:
  - name: "Berkshire Hathaway: không cổ tức, tối đa giá trị"
    type: "success"
    setup: >
      Buffett chưa trả cổ tức tiền mặt kể từ khi kiểm soát (1965; ngoại lệ 0,10 USD/CP khoảng 1967). Lập luận: bất lợi thuế (cổ tức tối đa khoảng 23,8%), cơ hội tái đầu tư vượt thị trường, homemade dividend bằng bán cổ phiếu, linh hoạt.
      Gần đây dùng buyback khi tiền mặt dư và ít cơ hội.
    key_calculations:
      - "Giữ lại 100% với ROE tương đương 19,8%/năm 59 năm: 1000 x 1,198^59 = khoảng 42,56 triệu USD."
      - "S&P 500 10,2%/năm: 1000 x 1,102^59 = khoảng 308 nghìn USD."
      - "Payout 30% (sau thuế 23,8% tái đầu tư S&P): vốn chủ 2,12 triệu + danh mục S&P 2,24 triệu = khoảng 4,36 triệu (15,3%/năm)."
      - "Payout 50%: khoảng 1,41 triệu (13,1%/năm)."
      - "Tăng trưởng lõi giảm từ 19,8% còn 13,86% (= 19,8% x 70%) khi payout 30%."
    lesson: >
      Giữ lại thắng vì suất sinh lời tái đầu tư (19,8%) cao hơn nhiều mức cổ đông tự kiếm (10,2%) cộng bất lợi thuế; nếu chỉ 8% thì nên chia. Chỉ hiệu quả khi DN thực sự tái đầu tư tốt (đa số không làm được: Agency Theory);
      hết cơ hội thì phải trả lại (buyback), buyback tốt hơn cổ tức khi giá thấp hơn giá trị nội tại.
    data_reliability: "illustrative"
  - name: "General Electric: cắt cổ tức phá hủy niềm tin"
    type: "failure"
    setup: >
      GE là dividend aristocrat được quỹ hưu trí ưa chuộng; yield 3-4%. Cắt ba lần: 2009 (~1,24 -> ~0,40 USD, -68%, lần đầu sau gần 7 thập kỷ), cuối 2017 (~-50%), cuối 2018 (~-92%, còn khoảng 0,04 USD/năm). Số liệu làm tròn từ nguồn công khai, cần kiểm chứng.
    key_calculations:
      - "Nhà đầu tư 10.000 CP: thu nhập từ 12.400 USD/năm xuống 4.000 USD (-8.400 USD, -68%) nên bị ép bán (clientele)."
      - "Cơ chế xoắn ốc: cắt -> quỹ bán -> giá giảm -> hạ bậc tín nhiệm -> tài trợ đắt -> xấu hơn -> cắt tiếp."
      - "Root cause: tổn thất GE Capital (thiếu hụt dự phòng bảo hiểm hơn 15 tỷ USD, công bố đầu 2018), M&A phá giá trị (Alstom, Baker Hughes), earnings management; cổ tức trả từ lợi nhuận không bền vững."
    lesson: >
      Bền vững hơn mức cao (FCF coverage trên 1,5 lần); đừng hứa cổ tức 'an toàn' rồi cắt; cổ tức là cam kết; hiểu cơ cấu cổ đông; sửa DN trước rồi mới cổ tức. Không có chính sách tốt tuyệt đối, chỉ có chính sách phù hợp cổ đông, dòng tiền và nhất quán.
    data_reliability: "unverified"
  - name: "Hương Quê (SME VN): chia bao nhiêu cổ tức năm 2024"
    type: "sme"
    setup: >
      CTCP thực phẩm sấy Long An, chưa niêm yết, NI 3.000 triệu, 1.000.000 CP, vốn chủ 12.000 (ROE 25%), giá trị 20.000đ/CP, Ke 15%, nợ 2.000 lãi 10%, thuế TNDN 20%, FCF 3.000.
      Cổ đông: ông Hùng 60% (muốn mở rộng), bà Lan 25% (cần 140 triệu/năm sau thuế), anh Minh 15%. Dự án vốn 2.400, lợi nhuận +432/năm. Ba phương án: P1 payout 70%, P2 0%, P3 20%.
    key_calculations:
      - "Dự án: ROIC = 432/2400 = 18% lớn hơn Ke 15%; NPV = 432/0,15 - 2400 = +480 triệu."
      - "Tiền sẵn có = FCF - cổ tức: P1 900 (thiếu 1.500), P2 3.000 (thừa 600), P3 2.400 (khớp)."
      - "g = 25% x b: P1 7,5%, P2 25%, P3 20%."
      - "P1 vay 1.500 lãi 11%: lãi 165/năm; rò rỉ = (2.100-600) x 5% = 75 thuế thêm + phí 1% x 1.500 = 15, tổng 90 triệu; ICR 12,3 lần (xấu: 9,05), P3 22,45 (16,5)."
      - "P2 idle 600: Ke 90 - lãi gửi sau thuế 24 = mất 66 triệu/năm; bỏ qua nhu cầu bà Lan."
      - "Bà Lan P3: 25% x 600 = 150, thuế 5% = 7,5, ròng 142,5 (đáp ứng 140). Tự bán cổ phần giá 20.000 cần 7.500 CP, chiết khấu 25% (giá 15.000) cần 10.000 CP, mất thêm 2.500 CP khoảng 50 triệu."
      - "Stress test NI -30% = 2.100: payout 70% cổ tức 2.100 -> 1.470 (-30%, coverage 1,43); cố định 600 payout lên 28,6%; nền 300 + 10% NI: 510 (-15%, coverage 4,1)."
      - "Cổ tức cổ phiếu 10%: 1.100.000 CP, EPS 2.727, giá 18.182, ông Hùng 660.000 CP vẫn 12.000 triệu, vốn điều lệ +1.000 triệu."
    lesson: >
      Khuyến nghị P3 dạng nền 300đ/CP + 10% NI (tổng 600 triệu, payout 20%): giữ 2.400 cho dự án NPV +480, đáp ứng bà Lan, không vay để chia, không dư tiền. Văn bản hóa cam kết nền; rà soát hằng năm và nâng payout khi hết dự án NPV>0.
      Giả định 432 triệu vĩnh viễn là đơn giản hóa; thực tế chiết khấu theo vòng đời.
    data_reliability: "illustrative"

worked_examples:
  - name: "Bộ chỉ số cổ tức cơ bản"
    inputs: {ni: 5000, div: 2000, shares: 2000000, price: 25000, roe: 0.18}
    steps:
      - "EPS = 5000e6/2e6 = 2.500; DPS = 2000e6/2e6 = 1.000"
      - "Payout = 1000/2500 = 40%; b = 60%"
      - "Yield = 1000/25000 = 4,0%; P/E = 25000/2500 = 10"
      - "g = 18% x 60% = 10,8%"
    result: "EPS 2.500; DPS 1.000; Payout 40%; b 60%; Yield 4%; P/E 10; g 10,8%"
  - name: "Cổ tức tự chế (M&M)"
    inputs: {price: 20000, dps: 3000, shares_held: 100}
    steps:
      - "Giá ex = 17.000"
      - "Tài sản: 300.000 tiền + 1.700.000 = 2.000.000 (giống không chia 2.000.000)"
      - "Nếu không muốn tiền: mua thêm 300.000/17.000 = 17,6 CP"
    result: "Tổng tài sản 2.000.000đ cả hai chính sách, cổ tức irrelevant"
  - name: "Thuế cổ tức vs bán cổ phiếu"
    inputs: {net_needed: 190}
    steps:
      - "Cổ tức: 190/0,95 = 200 triệu"
      - "Bán CP: 190/0,999 = 190,19 triệu"
      - "Chênh lệch tiết kiệm thuế khoảng 9,8 triệu, mất khi cổ phần khó bán"
    result: "Cổ tức gộp 200 triệu vs bán 190,19 triệu"
  - name: "Lintner 3 năm"
    inputs: {target_payout: 0.5, c: 0.4, d0: 1200, eps: [4000, 5000, 2800]}
    steps:
      - "D1 = 1200 + 0,4*(2000-1200) = 1.520 (payout 38,0%)"
      - "D2 = 1520 + 0,4*(2500-1520) = 1.912 (38,2%)"
      - "D3 = 1912 + 0,4*(1400-1912) = 1.707,2 (61,0%)"
    result: "EPS -44% nhưng cổ tức chỉ -11%, payout 61%"
  - name: "Buyback vs cổ tức (Bài 5)"
    inputs: {ni: 4000, shares: 2000000, price: 40000, return_cash: 2000}
    steps:
      - "Cổ tức: DPS = 2000e6/2e6 = 1.000; giá ex = 39.000; tổng = 40.000"
      - "Buyback: mua 2000e6/40000 = 50.000 CP, còn 1.950.000; EPS = 4000e6/1.950.000 = 2.051,3"
      - "Giá = (80.000 - 2.000) triệu/1.950.000 = 40.000; P/E = 40000/2051,3 = 19,5"
    result: "Cả hai trả 2.000 triệu; buyback EPS tăng nhưng giá 40.000 không đổi; P/E từ 20 xuống 19,5"
  - name: "Residual dividend 3 năm"
    inputs: {ni: 3000, debt_share: 0.4, capex: [2400, 4000, 1000]}
    steps:
      - "Năm 1: vốn chủ 1.440, cổ tức 1.560 (52%)"
      - "Năm 2: vốn chủ 2.400, cổ tức 600 (20%)"
      - "Năm 3: vốn chủ 600, cổ tức 2.400 (80%)"
    result: "Payout dao động 20-80%; thực tế dùng nền + thưởng để làm mượt"
  - name: "Bát Tràng Xanh (mini case)"
    inputs: {ni: 1800, shares: 600000, equity: 9000, fcf: 1700, ke: 0.16, invest: 1200, dni: 240}
    steps:
      - "ROIC = 240/1200 = 20%; NPV = 240/0,16 - 1200 = +300"
      - "Cổ tức tối đa không vay = 1700 - 1200 = 500 triệu"
      - "DPS = 500e6/600000 = 833; payout = 500/1800 = 27,8%; thuế 5% = 25 triệu; coverage = 1700/500 = 3,4"
      - "ROE = 1800/9000 = 20%; g = 20% x (1 - 27,8%) = 14,4%"
      - "Stress NI -30% = 1.260: đề xuất nền 300 + 11% NI: bình thường 498, xấu 438,6 (-11,9%, trong ngưỡng 15%)"
    result: "NPV +300; chia tối đa 500 triệu (DPS 833, payout 27,8%, coverage 3,4); g 14,4%; nền 300 + 11% NI cắt chỉ 11,9%"
  - name: "Tăng trưởng bền vững theo payout"
    inputs: {roe: 0.20, payouts: [0.3, 0.5, 0.8, 1.0]}
    steps: ["g = 20% x b: 14%; 10%; 4%; 0%"]
    result: "Chia 100% thì g = 0"

practice_questions:
  - q: "NI 5.000 triệu, cổ tức 2.000 triệu, 2.000.000 CP, giá 25.000, ROE 18%. Tính EPS, DPS, payout, retention, yield, P/E, g."
    a: "EPS 2.500; DPS 1.000; payout 40%; b 60%; yield 4%; P/E 10; g 10,8%."
  - q: "Giá 20.000, cổ tức 3.000/CP, nhà đầu tư 100 CP. Tính giá sau, tổng tài sản, nếu không muốn tiền thì làm gì?"
    a: "Giá 17.000; tổng tài sản 300.000 + 1.700.000 = 2.000.000; mua thêm 300.000/17.000 khoảng 17,6 CP; kết quả giống nhau nên M&M đúng."
  - q: "Cổ đông cần 190 triệu ròng. Lấy từ cổ tức (5%) cần gộp bao nhiêu? Bán cổ phiếu (0,1%) cần bán bao nhiêu? Khi nào lợi thế thuế mất?"
    a: "Cổ tức gộp 200 triệu; bán 190,19 triệu; lợi thế mất khi cổ phần chưa niêm yết/thanh khoản thấp vì chiết khấu và chi phí tìm người mua lớn hơn khoảng 9,8 triệu tiết kiệm thuế."
  - q: "Lintner: payout mục tiêu 50%, c 0,4, D0 1.200, EPS 4.000/5.000/2.800. Tính cổ tức và payout năm 3."
    a: "1.520; 1.912; 1.707; payout năm 3 khoảng 61% (cổ tức dính)."
  - q: "NI 4.000 triệu, 2.000.000 CP, giá 40.000. Trả 2.000 triệu: DPS, giá ex; buyback: CP mua, EPS, giá, P/E?"
    a: "DPS 1.000, giá ex 39.000; mua 50.000 CP, còn 1.950.000, EPS 2.051,3, giá 40.000, P/E 19,5; EPS tăng nhưng giá không đổi vì vốn hóa cũng giảm 2.000 triệu."
  - q: "Bát Tràng Xanh: NI 1.800, 600.000 CP, vốn chủ 9.000, FCF 1.700, Ke 16%, dự án 1.200 lợi nhuận +240/năm. ROIC, NPV, cổ tức tối đa không vay, DPS, payout, thuế, coverage, g, và cấu trúc nền + thưởng khi NI -30% mà cắt không quá 15%?"
    a: "ROIC 20%, NPV +300; tối đa 500; DPS 833; payout 27,8%; thuế 25 triệu; coverage 3,4; g 14,4%; ví dụ nền 300 + 11% NI: 498 -> 438,6 (-11,9%)."
  - q: "Hương Quê: vì sao P3 tốt hơn P1 và P2?"
    a: "P3 giữ đúng 2.400 cho dự án NPV +480; P1 thiếu 1.500 phải vay, rò rỉ khoảng 90 triệu, g chỉ 7,5%; P2 dư 600 nhàn rỗi mất khoảng 66 triệu/năm và bỏ qua nhu cầu tiền mặt bà Lan."
  - q: "EPS có thể mua lại cổ phiếu tăng giá không?"
    a: "Chỉ khi mua dưới giá trị nội tại hoặc ngăn lãng phí tiền dư; còn nếu mua đúng giá thì EPS tăng, giá không đổi."
  - q: "Tại sao chính sách cổ tức vẫn quan trọng dù M&M nói irrelevant?"
    a: "Vì giả định bị vi phạm: thuế, chi phí giao dịch/thanh khoản, thông tin bất cân xứng, agency cost; mỗi lý thuyết (Tax, Clientele, Signaling, Agency) gỡ một giả định."

checklist:
  - "Payout hiện tại so với DN cùng ngành?"
  - "Cổ tức có bền vững (FCF coverage trên 1,5 lần)?"
  - "Có dự án NPV > 0 cần vốn không?"
  - "Tiền mặt dự trữ đủ sau khi chia?"
  - "Đã hiểu cơ cấu cổ đông (ai cần tiền, ai cần tăng trưởng)?"
  - "Đã tính thuế (5% VN) lên từng nhóm cổ đông?"
  - "Giai đoạn vòng đời của DN? Tín hiệu mong muốn?"
  - "Mức cam kết duy trì được 3-5 năm?"
  - "Cổ tức hay mua lại cổ phiếu phù hợp hơn?"
  - "Tần suất (quý/nửa năm/năm); cần cổ tức đặc biệt?"
  - "Đã stress test NI giảm 20-30%?"
  - "Đã bù lỗ, trích quỹ, hoàn thành nghĩa vụ thuế theo điều lệ?"
  - "Sau chia vẫn thanh toán nợ đến hạn? Không vi phạm covenant?"
  - "Có nghị quyết ĐHĐCĐ/HĐQT, ngày chốt, ngày thanh toán; đã khấu trừ và nộp thuế TNCN?"
  - "Theo dõi: xu hướng payout, coverage, phản ứng đối thủ và cổ đông, rà soát hằng năm."

excel_google_sheets_templates:
  - name: "Mô phỏng chính sách cổ tức SME (5 tab)"
    structure: >
      TAB1 INPUTS (NI, số CP, mệnh giá, vốn chủ, Ke, FCF = NI + khấu hao - capex duy trì - Δ vốn lưu động, ngân sách và lợi nhuận dự án, thuế cổ tức 5%, lãi vay, danh sách cổ đông %/nhu cầu);
      TAB2 ĐÁNH GIÁ DỰ ÁN (ROIC = LN dự án/vốn; NPV = LN/Ke - vốn; cảnh báo NPV>0);
      TAB3 SO SÁNH CHÍNH SÁCH P1..P5 (cổ tức, DPS, giữ lại, g, tiền sẵn có, thiếu/thừa, thuế, thực nhận, ICR; conditional formatting đỏ khi thiếu hụt > 0 hoặc coverage < 1,5);
      TAB4 STRESS TEST (NI -10/-20/-30%); TAB5 DASHBOARD (biểu đồ, khuyến nghị IF).
    formulas:
      - "Cổ tức: =B2*B3"
      - "Lợi nhuận giữ lại: =B2-B2*B3"
      - "Tiền sẵn có đầu tư: =B4-B2*B3"
      - "Thiếu hụt: =MAX(0,B5-(B4-B2*B3))"
      - "Tiền thừa: =MAX(0,(B4-B2*B3)-B5)"
      - "Tăng trưởng bền vững: =ROE*(1-B3)"
  - name: "Mẫu đề xuất chính sách cổ tức (văn bản)"
    structure: >
      Căn cứ (LN sau thuế, FCF, quỹ đã trích); nhu cầu đầu tư (dự án, vốn, NPV); mức đề xuất (nền đ/CP + % LN); hình thức (tiền mặt/cổ phiếu/kết hợp); thời điểm (ngày chốt, ngày thanh toán);
      kiểm tra điều kiện (bù lỗ, trích quỹ, thanh toán nợ, covenant); stress test (-30% còn bao phủ ... lần); phê duyệt HĐQT/ĐHĐCĐ.
