pitfalls:
  - "Bỏ qua ΔOWC khi định giá DCF: định giá quá cao DN tăng trưởng."
  - "Trộn mẫu số: DSO dùng doanh thu, DIO và DPO dùng COGS."
  - "Đánh đồng lợi nhuận với tiền mặt; luôn lập báo cáo dòng tiền song song P&L."
  - "Cùng một chính sách tín dụng cho mọi khách: nên phân nhóm theo chất lượng tín dụng."
  - "JIT không có kế hoạch dự phòng: cú sốc chuỗi cung ứng gây đình trệ."
  - "Kéo AP quá mức: mất chiết khấu (tới 37%) và hỏng quan hệ NCC."
  - "Chỉ nhìn NWC tuyệt đối, bỏ sót CCC và vòng quay."
  - "Chỉ lập ngân sách năm: bỏ sót đỉnh mùa vụ; cần dự báo tháng/tuần."
  - "Nhập số lượng lớn vì giá tốt mà không tính chi phí lưu kho và vốn chôn."
  - "Bán chịu không kiểm tra tín dụng khách mới."
  - "Dùng vay ngắn hạn tài trợ tài sản dài hạn (lệch kỳ hạn)."
  - "Cắt giảm vốn lưu động quá sâu phá hủy dịch vụ khách hàng (bài học Toys R Us)."
  - "Áp benchmark ngành minh họa máy móc; cần đối chiếu đối thủ cùng quy mô."
  - "Lệch đơn vị khi dùng Baumol (triệu và đồng)."
sme_vn_guidance:
  - "Khách B2B trả chậm, DSO dài: hợp đồng ghi kỳ hạn và phạt chậm, đặt cọc."
  - "NCC ít cho nợ SME nhỏ (DPO ngắn): xây uy tín trả đúng hạn, tăng quy mô mua, đàm phán theo quý."
  - "Tín dụng khó và lãi cao: ưu tiên giải phóng vốn nội bộ trước khi vay."
  - "Tách tài khoản công ty và cá nhân để biết nhu cầu vốn thực."
  - "Mùa vụ (Tết, du lịch): lập kế hoạch vốn theo tháng, vay ngắn hạn đúng mùa."
  - "Mô hình nhận cọc/thanh toán trước, nhập theo đơn, đàm phán công nợ NCC (tinh thần Dell ở quy mô nhỏ)."
  - "Lộ trình 90 ngày: tháng 1 đo lường (CCC, AR aging, ABC, dự báo 13 tuần); tháng 2 quick wins (hóa đơn ngay, nhắc nợ trước hạn 5 ngày, xả hàng chậm >90 ngày, đàm phán 3 NCC lớn); tháng 3 chuẩn hóa (chính sách 5C, EOQ/ROP nhóm A, KPI hằng tháng)."
  - "Công cụ (cần xác nhận bảng giá hiện hành): MISA SME, Fast Accounting (từ vài triệu/năm) cho sổ công nợ và tuổi nợ; KiotViet, Sapo (vài trăm nghìn đến vài triệu/tháng) cho tồn kho và công nợ; Excel/Google Sheets cho dự báo 13 tuần."
  - "Tài chính: hạn mức tín dụng, ứng vốn theo hóa đơn/bao thanh toán tại BIDV, VPBank, Vietcombank... (lãi và phí hỏi trực tiếp)."
  - "Kiểm tra tín dụng khách mới bằng CIC và thông tin DN công khai (theo biểu phí, cần xác nhận)."
case_lessons:
  - name: "Dell - CCC âm nhờ Build-to-Order"
    type: "success"
    setup: >
      Dell (thành lập 1984) lắp ráp sau khi có đơn, bán trực tiếp, khách trả trước, kéo giãn thanh toán linh kiện.
      Đối thủ (HP, Compaq, IBM) sản xuất theo dự báo qua nhà phân phối.
    key_calculations:
      - "CCC Dell = 30 + 4 - 70 = -36; HP = 49 + 29 - 42 = +36; Apple = 25 + 3 - 54 = -26 (số minh họa)"
      - "Chênh lệch Dell - HP = 72 ngày"
      - "Giả định COGS 35.000 triệu USD/năm: 95,9 triệu USD/ngày x 72 = 6.904 triệu USD vốn không phải bỏ ra"
      - "Với chi phí vốn 3%: tiết kiệm khoảng 207 triệu USD/năm"
    lesson: >
      CCC âm là kết quả đổi mới mô hình kinh doanh (BTO, thu tiền trước, bán trực tiếp, sức mạnh đàm phán NCC),
      làm mẫu số ROIC rất nhỏ và tự tài trợ tăng trưởng. Rủi ro: phụ thuộc quan hệ NCC, thiếu linh kiện thì đứt hàng.
      SME áp dụng: nhận cọc, nhập theo đơn, đàm phán công nợ.
    data_reliability: "unverified"
  - name: "Toys R Us - vòng xoáy nợ và vốn lưu động"
    type: "failure"
    setup: >
      LBO 2005 bởi KKR, Bain Capital, Vornado; dòng tiền chủ yếu trả lãi, không tái đầu tư cửa hàng, e-commerce, tồn kho.
      Phá sản Chapter 11 năm 2017, thanh lý 2018.
    key_calculations:
      - "Current Ratio 1,5 (2005) xuống 0,9 (2015) xuống 0,7 (2017); CCC 45 lên 70+ ngày (số minh họa)"
      - "Giả định COGS 8.000 triệu USD/năm: 21,9 triệu USD/ngày x 25 ngày = 548 triệu USD vốn bị giam thêm"
      - "Cơ chế CCC tăng: DIO tăng do nhập sai, DPO giảm do NCC rút tài trợ"
      - "Khoảng 40% doanh thu dồn Q4"
    lesson: >
      Quản lý WC không chỉ là cắt giảm; Current Ratio dưới 1,0 là cảnh báo; mất niềm tin NCC mất quyền tiếp cận hàng hot;
      kế hoạch vốn phải tính đỉnh mùa vụ; đòn bẩy cao cộng WC mỏng là tổ hợp chết người (xem m04).
    data_reliability: "illustrative"
  - name: "Công ty TNHH Thương mại Bình Minh - tăng trưởng 30% nhưng cạn tiền"
    type: "sme"
    setup: >
      Nhà phân phối vật tư vệ sinh công nghiệp TP.HCM (số liệu tự thiết kế). 2024: doanh thu 24.000 triệu, COGS 18.000,
      LNST 960 (biên ròng 4%), DSO 65, DIO 75, DPO 28, lãi vay 11%. Kế hoạch 2025: tăng trưởng 30%.
    key_calculations:
      - "2024: AR 4.274,0; Tồn 3.698,6; AP 1.380,8; OWC 6.591,8; CCC 112; OWC/Doanh thu 27,5%"
      - "Vòng quay AR 5,62; Tồn 4,87; AP 13,04"
      - "2025 không đổi chính sách: doanh thu 31.200, COGS 23.400, OWC 8.569,3, ΔOWC +1.977,5"
      - "LNST 2025 = 31.200 x 4% = 1.248; Gap = 1.977,5 - 1.248 = 729,5; lãi vay 80,2/năm"
      - "Mục tiêu DSO 50, DIO 55, DPO 40: CCC 65; OWC 5.235,6 (16,8% doanh thu)"
      - "Giải phóng: AR 1.282,2 + Tồn 1.282,2 + AP 769,3 = 3.333,7; tiết kiệm lãi 366,7/năm"
      - "OWC mục tiêu thấp hơn 2024 là 1.356,2 dù doanh thu +30%"
      - "NCC A 2/10 net 30 (mua 6.000): k = 37,2% lớn hơn 11%, lợi ròng 84,6 triệu/năm"
      - "Chiết khấu cho khách 1,5/10 net 40: 18,5% lớn hơn 11%, không nên dùng làm công cụ chính"
      - "Máy chà sàn nhóm A: EOQ 894, SS 42, ROP 371; TC tối thiểu 10,7 triệu/năm"
      - "Baumol 109,5 triệu/lần (khoảng 11 lần/năm)"
    lesson: >
      Mỗi 100 đồng doanh thu tăng thêm chôn 27,5 đồng vốn lưu động nên lợi nhuận không đủ nuôi tăng trưởng.
      Phải tính trước ΔOWC và gap, giảm CCC thay vì vay; nhận chiết khấu NCC, hạn chế chiết khấu cho khách.
      Mục tiêu DPO và DSO giả định đối tác đồng ý; cần chạy kịch bản xấu (DSO 58, DIO 62).
    data_reliability: "illustrative"
worked_examples:
  - name: "Từ báo cáo tài chính sang DSO, DIO, DPO, CCC, OWC"
    inputs: {Revenue: 12000, COGS: 9000, AR: 1500, Inventory: 1800, AP: 900}
    steps:
      - "DSO = 1500/12000 x 365 = 45,625"
      - "DIO = 1800/9000 x 365 = 73,0"
      - "DPO = 900/9000 x 365 = 36,5"
      - "CCC = 45,625 + 73 - 36,5 = 82,125"
      - "OWC = 1500 + 1800 - 900 = 2400; OWC/Revenue = 20%"
    result: "DSO 45,6; DIO 73; DPO 36,5; CCC 82,1 ngày; OWC 2.400 triệu"
  - name: "Chi phí chiết khấu 3/10 net 45 và quyết định vay"
    inputs: {d: 0.03, N: 45, n: 10, loan_rate: 0.12}
    steps:
      - "d/(1-d) = 0,03/0,97 = 0,030928"
      - "365/(45-10) = 10,4286"
      - "k = 0,030928 x 10,4286 = 32,25%"
      - "EAR = (1,030928)^10,4286 - 1 = 37,4%"
      - "32,25% lớn hơn 12% nên vay để trả sớm và lấy chiết khấu"
    result: "k = 32,3% năm; nên lấy chiết khấu"
  - name: "EOQ và số lần đặt hàng"
    inputs: {D: 4800, S: 250000, H: 40000}
    steps:
      - "EOQ = căn(2x4800x250000/40000) = căn(60000) = 244,9"
      - "Số lần = 4800/244,9 = 19,6"
      - "Chu kỳ = 365/19,6 = 18,6 ngày"
    result: "EOQ 245 đơn vị, 19,6 lần/năm"
  - name: "Bẫy tăng trưởng 8 tỷ lên 12 tỷ"
    inputs: {Rev0: 8, Rev1: 12, owc_pct: 0.20, net_margin: 0.05}
    steps:
      - "ΔOWC = 20% x (12 - 8) = 0,8 tỷ"
      - "Lợi nhuận = 12 x 5% = 0,6 tỷ"
      - "Gap = 0,8 - 0,6 = 0,2 tỷ"
      - "Tỷ lệ OWC hòa vốn x: x.12 - 1,6 = 0,6 suy ra x = 18,33%"
    result: "Gap 0,2 tỷ; cần OWC/doanh thu không quá 18,3% để Gap = 0"
  - name: "Cửa hàng nội thất Gỗ Việt: nhận cọc 30%"
    inputs: {Revenue: 18000, COGS: 12600, AR: 3000, Inventory: 2800, AP: 1100, loan_rate: 0.12}
    steps:
      - "DSO = 3000/18000x365 = 60,8; DIO = 2800/12600x365 = 81,1; DPO = 1100/12600x365 = 31,9"
      - "CCC = 60,8 + 81,1 - 31,9 = 110,0 ngày"
      - "Giả sử cọc 30% giảm AR 30%: giải phóng 900 triệu"
      - "Tiết kiệm lãi = 900 x 12% = 108 triệu/năm"
    result: "CCC khoảng 110 ngày; tiết kiệm lãi 108 triệu/năm (rủi ro khách hủy cần bàn thêm)"
  - name: "Bình Minh: OWC kịch bản tăng trưởng và mục tiêu"
    inputs: {Revenue2025: 31200, COGS2025: 23400, DSO: 65, DIO: 75, DPO: 28, DSO_t: 50, DIO_t: 55, DPO_t: 40, r: 0.11}
    steps:
      - "OWC cũ = 5556,2 + 4808,2 - 1795,1 = 8569,3"
      - "OWC mục tiêu = 4274,0 + 3526,0 - 2564,4 = 5235,6"
      - "Giải phóng = 3333,7; lãi tiết kiệm = 366,7"
    result: "OWC 8.569,3 xuống 5.235,6; tiết kiệm lãi 366,7 triệu/năm"
  - name: "Dell: quy đổi CCC thành tiền (minh họa)"
    inputs: {COGS_usd_m: 35000, gap_days: 72, cost_of_capital: 0.03}
    steps:
      - "COGS/ngày = 35000/365 = 95,89"
      - "Vốn không phải bỏ ra = 95,89 x 72 = 6904"
      - "Lãi tiết kiệm = 6904 x 3% = 207"
    result: "Khoảng 6.904 triệu USD vốn, 207 triệu USD/năm (số minh họa)"
  - name: "Tăng trưởng startup 50%/năm"
    inputs: {Rev: [10, 15, 22.5], AR_days: 30, inv_pct: 0.15, ap_pct: 0.08}
    steps:
      - "OWC năm 1 = 0,822 + 1,5 - 0,8 = 1,52"
      - "OWC năm 2 = 1,233 + 2,25 - 1,2 = 2,28"
      - "OWC năm 3 = 1,849 + 3,375 - 1,8 = 3,42"
      - "ΔOWC năm 2 = 0,76; năm 3 = 1,14 (nguồn làm tròn 1,15)"
    result: "Tăng trưởng 50%/năm cần thêm khoảng 0,8-1,1 tỷ vốn lưu động mỗi năm"
practice_questions:
  - {q: "DSO 40, DIO 55, DPO 35: CCC là bao nhiêu?", a: "60 ngày"}
  - {q: "Doanh thu 12.000, COGS 9.000, AR 1.500, tồn 1.800, AP 900: tính DSO, DIO, DPO, CCC, OWC.", a: "45,6; 73; 36,5; 82,1; 2.400 triệu"}
  - {q: "Chiết khấu 3/10 net 45: chi phí năm hóa? Lãi vay 12% có nên vay trả sớm?", a: "32,3% lớn hơn 12%, nên vay để lấy chiết khấu"}
  - {q: "D = 4.800, S = 250.000, H = 40.000: EOQ và số lần đặt?", a: "245 đơn vị; 19,6 lần"}
  - {q: "Doanh thu 8 tỷ lên 12 tỷ, OWC 20% doanh thu, biên ròng 5%, giữ lại hết: ΔOWC, lợi nhuận, gap?", a: "0,8 tỷ; 0,6 tỷ; gap 0,2 tỷ; OWC dưới 18,3% doanh thu thì gap = 0"}
  - {q: "Gỗ Việt: CCC và tiết kiệm nếu nhận cọc giảm AR 30%, lãi 12%?", a: "CCC khoảng 110 ngày; giải phóng 900 triệu, tiết kiệm 108 triệu/năm; xem xét rủi ro hủy đơn"}
  - {q: "Vì sao DSO dùng doanh thu còn DIO và DPO dùng COGS?", a: "AR ghi theo giá bán, tồn kho và AP ghi theo giá mua"}
  - {q: "Vì sao tăng trưởng nhanh có thể làm DN cạn tiền dù có lãi?", a: "ΔOWC dương làm tiền giảm; nếu ΔOWC lớn hơn lợi nhuận giữ lại thì có funding gap"}
  - {q: "Tính SS và ROP: d=32,9/ngày, L=10, sigma=8, mức phục vụ 95%.", a: "SS 41,7; ROP 370,5"}
  - {q: "Baumol: T 600 triệu, F 200.000 đồng, r 8%.", a: "C* = 54,8 triệu/lần"}
  - {q: "Thực hành: lấy 12 tháng số liệu DN, tính CCC từng quý, so với đối thủ, lập kế hoạch 90 ngày.", a: "Theo procedures m06_proc_ccc_diagnosis và m06_proc_ccc_target"}
checklist:
  - "NWC và CCC đã tính, so xu hướng và ngành?"
  - "DSO, DIO, DPO đúng mẫu số (doanh thu và COGS)?"
  - "Current Ratio lớn hơn 1,5 và Quick Ratio lớn hơn 1,0?"
  - "Đã tính ΔOWC và funding gap cho kế hoạch tăng trưởng?"
  - "Chính sách tín dụng 5C văn bản hóa; hạn mức từng khách; phạt chậm trong hợp đồng?"
  - "AR aging theo dõi hằng tuần; dự phòng nợ khó đòi đủ; quy trình thu hồi tự động?"
  - "Đã phân loại ABC; EOQ/ROP nhóm A; xử lý hàng chậm luân chuyển; safety stock theo mức phục vụ?"
  - "Điều khoản AP đã đàm phán; đã so chiết khấu sớm với chi phí vốn; quan hệ NCC duy trì?"
  - "Dự báo dòng tiền 13 tuần cuốn chiếu; mức tiền tối thiểu; hạn mức dự phòng; tiền nhàn rỗi được đầu tư ngắn hạn?"
  - "WC thường xuyên tài trợ dài hạn; vay ngắn hạn chỉ cho nhu cầu tạm thời?"
excel_google_sheets_templates:
  - name: "Bảng theo dõi vốn lưu động hằng tháng"
    columns: "Doanh thu (A), COGS (B), AR (C), Tồn kho (D), AP (E); DSO =C/A*30; DIO =D/B*30; DPO =E/B*30; CCC =DSO+DIO-DPO; OWC =C+D-E; ΔOWC =OWC_t-OWC_t-1; OWC/Doanh thu năm =OWC/(A*12); Cảnh báo =IF(CCC>Target,\"CẢNH BÁO\",\"OK\") với tô màu có điều kiện"
  - name: "Dự báo dòng tiền 13 tuần"
    columns: "Hàng thu (AR theo tuổi nợ, bán mặt), hàng chi (NCC, lương, thuế, thuê, trả nợ); 13 cột tuần; tiền cuối = đầu + thu - chi; cảnh báo khi dưới mức tối thiểu"
