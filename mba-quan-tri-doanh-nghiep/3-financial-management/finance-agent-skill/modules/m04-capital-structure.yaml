procedures:
- id: p_wacc
  name: Tính WACC từ đầu
  steps:
  - 'Xác định D, E theo giá trị thị trường (SME: ước lượng E từ định giá gần nhất/multiple); V=D+E'
  - Tính D/V, E/V
  - Kd = lãi vay thực tế (bình quân có trọng số nếu nhiều khoản); Kd sau thuế = Kd×(1-T)
  - 'Ke: CAPM = rf+beta×(rm-rf); SME chưa niêm yết: lấy beta ngành, unlever rồi re-lever theo D/E của
    mình (Hamada), cộng illiquidity/size premium'
  - WACC = D/V×Kd×(1-T)+E/V×Ke
  - So sánh ROIC dự án với WACC
  outputs: WACC (%), bảng tỷ trọng và chi phí từng nguồn
- id: p_compare_financing
  name: So sánh phương án tài trợ (vay/cổ phần/kết hợp)
  steps:
  - Liệt kê vốn cần huy động, EBIT dự kiến (base) và kịch bản xấu (-20-30%), T, Kd, giá phát hành, số
    cổ phần hiện có
  - 'Với mỗi phương án: lãi vay = Kd×nợ mới; cổ phần mới = vốn cổ phần/giá; N=N0+mới'
  - 'Lập P&L: EBIT-lãi=EBT; thuế; NI; EPS=NI/N; ROE=NI/vốn chủ sổ sách (vốn chủ cũ + vốn góp mới)'
  - Tính WACC mỗi phương án (E = vốn chủ thị trường + vốn góp mới; V=D+E; nêu rõ giả định Ke cố định hay
    đổi)
  - Tính EBIT* hòa vốn giữa các cặp phương án và biên an toàn so với EBIT dự kiến
  - 'Stress test: EBIT kịch bản xấu -> ICR, DSCR, EPS'
  - Loại phương án có ICR_stress<3 (hoặc <ngưỡng covenant); trong phần còn lại chọn WACC thấp/EPS cao
    với mức pha loãng chấp nhận được
  - 'Kiểm tra phi định lượng: kiểm soát, kỳ hạn, tài sản thế chấp, dư địa vay'
  outputs: Bảng so sánh EPS/ROE/WACC/ICR + khuyến nghị có giải thích Trade-Off
- id: p_ebit_indiff
  name: Tìm EBIT hòa vốn
  steps:
  - Tính I (phương án vay) và N_eq=N0+F_eq/P, N_debt=N0
  - EBIT*=I×N_eq/(N_eq-N_debt)
  - 'Kiểm chứng: EPS hai phía bằng nhau tại EBIT*'
  - 'So EBIT dự kiến với EBIT*: lớn hơn thì vay cho EPS cao hơn'
  - Tính biên an toàn=(EBIT-EBIT*)/EBIT và ICR tại EBIT thấp
  outputs: EBIT*, kết luận EPS, biên an toàn
- id: p_pick_theory
  name: Chọn lý thuyết tư vấn theo bối cảnh
  steps:
  - DN trưởng thành, lãi ổn định, tài sản hữu hình -> Trade-Off (tìm D/E*)
  - DN tăng trưởng/công nghệ/startup/SME -> Pecking Order (nội lực -> nợ -> vốn cổ phần)
  - DN FCF cao, tăng trưởng thấp -> Agency/Jensen (dùng nợ hoặc trả cổ tức/mua lại)
  - Cân nhắc IPO/phát hành -> Market timing
  - M&M chỉ làm benchmark giải thích
  outputs: Khung lập luận tư vấn
- id: p_bank_loan
  name: Chuẩn bị đàm phán vay ngân hàng (SME VN)
  steps:
  - Chuẩn bị BCTC 2-3 năm (ưu tiên kiểm toán/soát xét)
  - Tính trước ICR (>2-3x) và DSCR (>=1,2-1,5x), dự phóng 3-5 năm có stress
  - Chuẩn bị tài sản thế chấp, định giá độc lập
  - 'So sánh >=3 ngân hàng: lãi suất cố định/thả nổi, phí trả nợ trước hạn, phí quản lý'
  - Khớp kỳ hạn vay với vòng đời tài sản (máy 7-10 năm)
  - Hỏi rõ covenant; giữ dư địa vay cho vốn lưu động
  outputs: Hồ sơ vay và điều khoản đã thương lượng
- id: p_leverage_sensitivity
  name: Lập bảng độ nhạy ROE theo ROIC và D/E
  steps:
  - Chọn lưới ROIC (3-15%), D/E (0,1,2), Kd tương ứng
  - ROE=(ROIC+(ROIC-Kd)×D/E)×(1-T)
  - Đánh dấu ô ROE<ROE không nợ (đòn bẩy âm)
  - Tìm ROIC hòa vốn = Kd
  outputs: Bảng độ nhạy và ngưỡng ROIC an toàn
decision_rules:
- Nếu giả định thị trường hoàn hảo (không thuế, không distress) thì cơ cấu vốn không ảnh hưởng giá trị
  (M&M I); dùng chỉ làm benchmark, không tư vấn thực hành.
- Nếu có thuế nhưng chưa tính distress cost thì nợ luôn tăng giá trị (V_L=V_U+T×D); kết luận '100% nợ'
  là sai vì bỏ qua distress - phải dùng Trade-Off.
- Nếu D/E hiện tại < D/E* thì vay thêm làm tăng giá trị; nếu > D/E* thì giảm nợ/tăng vốn chủ.
- Nếu ROIC (dự án) > Kd (sau thuế) thì vay khuếch đại ROE/EPS; nếu ROIC < Kd thì đòn bẩy phá hủy giá trị
  cổ đông.
- Nếu EBIT dự kiến > EBIT* thì vay cho EPS cao hơn; nếu EBIT < EBIT* thì phát hành cổ phần an toàn hơn
  về EPS.
- Nếu ICR trong kịch bản xấu (EBIT -30%) < 3x thì loại phương án đó cho SME dù EPS base case cao nhất.
- Nếu DN có lãi cao, ổn định, tài sản hữu hình, thuế suất cao thì có thể vay nhiều (Trade-Off, tax shield
  đáng kể); nếu doanh thu biến động, tài sản vô hình, tăng trưởng cao thì giữ nợ thấp.
- 'Nếu cần vốn thì thứ tự: lợi nhuận giữ lại -> vay (người quen, ngân hàng) -> phát hành cổ phần (Pecking
  Order).'
- Nếu FCF cao nhưng ít cơ hội đầu tư NPV>0 thì dùng nợ/cổ tức/mua lại cổ phiếu để kỷ luật quản lý (Jensen).
- 'Nếu vốn dài hạn cho tài sản dài hạn: tài trợ tài sản dài hạn bằng nợ trung-dài hạn/vốn chủ; không dùng
  nợ ngắn hạn đảo nợ (maturity mismatch).'
- Nếu D/E > 3 lần (DN phi tài chính) và nợ ngắn hạn lớn thì xếp vùng nguy hiểm.
- Nếu DN chưa niêm yết thì Ke qua CAPM cần beta ngành + re-lever + illiquidity premium; kiểm tra Ke >=
  Kd sau thuế + phần bù hợp lý.
- Nếu so sánh WACC giữa các phương án mà giữ Ke cố định thì nêu rõ đây là giả định đơn giản hóa (thực
  tế Ke tăng theo D/E); khi D/E chênh lớn, tính lại Ke bằng Hamada/M&M II.
- Nếu thay đổi chính sách pháp lý ảnh hưởng ngành (như Ba vạch đỏ) thì debt capacity giảm - đưa rủi ro
  chính sách vào stress test.
benchmarks:
- metric: D/E tối ưu tham khảo theo ngành (tỷ lệ nợ)
  value: Utilities 60-70%; BĐS 50-60%; Sản xuất 30-50%; Công nghệ 0-20%; Biotech/startup 0-5%
  context: Bảng Trade-Off trong nguồn (hiểu là % nợ trong vốn)
  confidence: low
- metric: D/E khuyến nghị SME VN
  value: Thương mại 0,3-0,8; Sản xuất 0,5-1,2; Dịch vụ 0,1-0,5; Xây dựng 0,8-1,5 (lần)
  context: Benchmark tham khảo ban đầu, cần stress test
  confidence: low
- metric: Interest coverage tối thiểu
  value: '>3 lần (ngân hàng VN thường 2-3 lần)'
  context: Covenant, stress test
  confidence: medium
- metric: DSCR tối thiểu
  value: 1,2-1,5 lần
  context: Ngân hàng VN
  confidence: medium
- metric: Debt/EBITDA
  value: <3-4 lần
  context: Checklist nguồn
  confidence: medium
- metric: Lãi vay SME VN (tham khảo, biến động)
  value: Thế chấp BĐS trung-dài hạn 8-11%; tín chấp/lưu động 7-10% (DN tốt) đến 12-15%; gói ưu đãi giảm
    1-3%; tổng quát 9-14%
  context: Cần xác nhận theo thời điểm và chính sách NHNN
  confidence: low
- metric: Giá cổ phiếu giảm khi thông báo phát hành
  value: 2-3%
  context: Bằng chứng Pecking Order
  confidence: medium
- metric: Distress cost
  value: Trực tiếp 3-5%, gián tiếp 10-20%, đại diện 5-10% giá trị DN
  context: Ước lượng minh họa
  confidence: low
- metric: D/E nguy hiểm DN phi tài chính
  value: '>3 lần'
  context: Bài học Evergrande
  confidence: medium
- metric: Ba vạch đỏ
  value: Nợ/tổng tài sản (loại trừ trả trước) <70%; nợ ròng/vốn chủ <100%; tiền >= nợ ngắn hạn
  context: Chính sách Trung Quốc 2020
  confidence: medium
pitfalls:
- 'Nhầm ''nợ rẻ hơn nên WACC luôn giảm'': bỏ qua Ke tăng theo D/E (M&M II) và distress cost.'
- Dùng giá trị sổ sách thay vì thị trường cho tỷ trọng WACC.
- Giữ Ke cố định giữa các phương án D/E khác nhau mà không nêu giả định.
- Chỉ chọn theo EPS/ROE base case, bỏ qua stress test và ICR.
- Quên pha loãng khi phát hành cổ phần; quên đơn vị (triệu đồng vs đồng).
- Quên (1-T) trong chi phí vay hoặc dùng thuế cho DN đang lỗ (không có tax shield).
- Áp D/E tối ưu của công ty niêm yết lớn cho SME.
- Tài trợ tài sản dài hạn bằng nợ ngắn hạn.
- Nhầm D/E với D/V; bảng nguồn 'Optimal D/E' thực chất là % nợ.
- Bảng nguồn Financial Leverage Effect là ROE trước thuế; ô (ROIC 6%, D/E=2, Kd 7%) ghi 5% nhưng đúng
  4%.
- Số WACC Microsoft trong nguồn (8,0% và 7,3%) không khớp công thức (tính lại 8,25% và 7,69%).
- Bỏ qua rủi ro chính sách và rủi ro tái cấp vốn (rollover).
sme_vn_guidance:
- 'Pecking Order đặc biệt đúng với SME VN: kênh vốn cổ phần gần đóng, đi theo lợi nhuận giữ lại -> vay
  người quen -> vay ngân hàng có thế chấp -> hiếm khi gọi vốn.'
- Lãi vay SME VN 9-14%/năm, thấp hơn khi có gói ưu đãi (xuất khẩu, công nghệ, nông nghiệp) 1-3% - cần
  xác nhận lãi suất theo thời điểm và chính sách NHNN.
- Ngân hàng VN thường yêu cầu ICR >2-3x và DSCR 1,2-1,5x; chuẩn bị BCTC 2-3 năm, tài sản thế chấp (sổ
  đỏ, máy móc), dự phóng 3-5 năm có stress.
- Thuế TNDN phổ thông 20% (cần xác nhận hiện hành; có ưu đãi cho DNNVV, quy định giới hạn chi phí lãi
  vay Nghị định 132/2020 - cần xác nhận).
- 'Tra cứu: lãi suất TPCP 10 năm (HNX/Bộ Tài chính) làm rf; beta ngành Damodaran (Emerging Markets); VN-Index
  10-20 năm cho rm; Excel/Google Sheets 4 tab.'
- 'Với SME chưa niêm yết: re-lever beta ngành (Hamada) theo D/E của mình và cộng illiquidity premium;
  Ke có thể quy định bằng mức kỳ vọng nhà đầu tư (Thành Phát 15%).'
- Khớp kỳ hạn vay với vòng đời tài sản; hỏi covenant; giữ debt capacity reserve cho vốn lưu động.
- Startup công nghệ khó vay do tài sản vô hình; có thể thế chấp BĐS cá nhân của founder hoặc vay tín chấp
  gói SME.
case_lessons:
- name: Microsoft thêm nợ chiến lược
  type: success
  setup: Gần như không nợ trước 2009, phát hành trái phiếu từ 2009; 2024 nợ khoảng 80 tỷ USD, D/E khoảng
    0,35, giữ AAA.
  key_calculations:
  - Tax shield ≈ 80B×3%×21% = 0,504 tỷ USD/năm (tính lại đúng)
  - 'WACC nguồn: 10% (D/E 0) -> 8,0% (20%) -> 7,3% (35%); tính lại theo công thức: 8,25% và 7,69% (nguồn
    lệch)'
  - Nguồn ước tính giá trị DN tăng 30-40% do WACC giảm (không kiểm chứng)
  lesson: Không nợ chưa chắc tối ưu; DN tín nhiệm cao vay rẻ, tăng đòn bẩy có kiểm soát, vẫn xa vùng distress.
  data_reliability: unverified
- name: Evergrande sụp đổ do đòn bẩy
  type: failure
  setup: Vay ồ ạt mua đất, đa ngành; nợ khoảng 30B(2010)->300B+ USD; D/E 2x->6-8x; nợ ngắn hạn tài trợ
    dự án dài hạn; vi phạm cả ba vạch đỏ 2020; 2021 vỡ nợ, 2024 thanh lý.
  key_calculations:
  - D/E vượt 3x (vùng nguy hiểm), nợ/tài sản có lúc 80-90%
  - 'Ba vạch đỏ: nợ/TS<70%, nợ ròng/vốn chủ<100%, tiền>=nợ ngắn hạn - vi phạm cả 3'
  - 'Maturity mismatch: dự án 5-10 năm nhưng vay vài tháng-1 năm'
  lesson: Tồn tại mức đòn bẩy tối ưu; đòn bẩy là dao hai lưỡi; dòng tiền quan trọng hơn giá trị tài sản;
    rủi ro chính sách; theo Pecking Order phải tích lũy nội lực trước.
  data_reliability: unverified
- name: Cơ khí Thành Phát mở rộng nhà xưởng
  type: sme
  setup: SME Bình Dương, cần 3.000 triệu; vốn chủ sổ sách 4.000, 400.000 cp, giá trị thị trường 15.000đ/cp
    (6.000 triệu), không nợ, EBIT dự kiến 1.200, T=20%, Kd=11%, Ke=15%. Ba phương án A vay 100%, B cổ
    phần 100%, C 50/50.
  key_calculations:
  - EPS A/B/C=1.740/1.600/1.656đ; ROE 17,40%/13,71%/15,05%
  - WACC 12,93%/15,00%/13,97%
  - EBIT* A vs B=990 triệu
  - 'Stress EBIT 840: ICR A=2,55 (<3), C=5,09; EPS 1.020/1.120/1.080'
  lesson: Base case nghiêng về vay 100% nhưng stress test làm lộ rủi ro; chọn kết hợp C - cân bằng tax
    shield và debt capacity thấp của SME.
  data_reliability: illustrative
- name: Startup SaaS VN huy động 500 triệu
  type: sme
  setup: 'Thứ tự tài trợ thực tế theo Pecking Order: tiền founder/lợi nhuận giữ lại -> friends & family
    loan -> vay NH (khó vì tài sản vô hình) -> angel/VC.'
  key_calculations:
  - Không có phép tính định lượng; thứ tự ưu tiên 1-4
  lesson: Bootstrapping càng lâu càng tốt trước khi pha loãng; nhà đầu tư thận trọng do adverse selection.
  data_reliability: illustrative
worked_examples:
- name: WACC và CAPM quán cà phê
  inputs:
    D: 400
    E: 600
    Kd: 0.1
    Ke_given: 0.15
    T: 0.2
    rf: 0.04
    rm: 0.12
    beta: 1.2
  steps:
  - D/V=40%, E/V=60%
  - Kd sau thuế=8%
  - WACC=0,4×8%+0,6×15%=12,2%
  - 'CAPM tham chiếu: Ke=4%+1,2×8%=13,6% (<15% yêu cầu của chủ quán); nếu dùng 13,6%: WACC=0,4×8%+0,6×13,6%=11,36%'
  result: WACC 12,2% (Ke 15%) hoặc 11,36% (Ke CAPM 13,6%); ROIC dự án phải > WACC
- name: 'Thành Phát: 3 phương án tài trợ 3.000 triệu'
  inputs:
    EBIT: 1200
    T: 0.2
    Kd: 0.11
    Ke: 0.15
    N0: 400000
    P: 15000
    E_mkt: 6000
    E_book: 4000
  steps:
  - 'A: lãi=330, N=400.000; NI=(1200-330)×0,8=696; EPS=1.740đ; ROE=696/4000=17,4%; WACC=3000/9000×8,8%+6000/9000×15%=12,93%'
  - 'B: cổ phần mới=3e9/15000=200.000, N=600.000; NI=960; EPS=1.600đ; ROE=960/7000=13,71%; WACC=15%'
  - 'C: nợ 1.500, lãi=165, cổ phần mới 100.000, N=500.000; NI=828; EPS=1.656đ; ROE=828/5500=15,05%; WACC=0,1667×8,8%+0,8333×15%=13,97%'
  - EBIT* (A vs B)=330×600000/200000=990 triệu; biên an toàn (1200-990)/1200=17,5%
  - 'Stress EBIT=840: ICR A=840/330=2,55; C=840/165=5,09; EPS A=1.020, B=1.120, C=1.080'
  - 'Quyết định: ICR_A<3 => loại A; chọn C'
  result: Chọn phương án C (WACC 13,97%, ICR stress 5,09x) dù A có EPS/ROE cao nhất base case
- name: Xưởng may Việt Tiến Nhỏ (Bài 5) có stress
  inputs:
    N0: 250000
    P: 12000
    F: 2000
    Kd: 0.12
    T: 0.2
    EBIT: 800
  steps:
  - Lãi vay=2000×12%=240; cổ phần mới=2e9/12000=166.667; N_eq=416.667
  - EPS vay=(800-240)×0,8/250.000=1.792đ; EPS cổ phần=800×0,8/416.667=1.536đ
  - EBIT*=240×416.667/166.667=600 triệu
  - ICR tại EBIT 800=3,33; tại 500=2,08
  - 'Tại EBIT 500: EPS vay=832đ < EPS cổ phần=960đ, ICR 2,08<3'
  - 'Kết luận: base case vay hơn, nhưng nếu EBIT có thể về 500 (< EBIT*) thì phát hành an toàn hơn; cân
    nhắc kết hợp'
  result: EBIT*=600 triệu; vay chỉ tốt khi EBIT > 600 và ICR >= 3
- name: Đòn bẩy ROE sau thuế (T=20%)
  inputs:
    T: 0.2
  steps:
  - 'ROIC 15%: toàn vốn chủ 12.0%; D/E=1,Kd=6% 19.2%; D/E=2,Kd=7% 24.8%'
  - 'ROIC 10%: toàn vốn chủ 8.0%; D/E=1,Kd=6% 11.2%; D/E=2,Kd=7% 12.8%'
  - 'ROIC 6%: toàn vốn chủ 4.8%; D/E=1,Kd=6% 4.8%; D/E=2,Kd=7% 3.2%'
  - 'ROIC 3%: toàn vốn chủ 2.4%; D/E=1,Kd=6% 0.0%; D/E=2,Kd=7% -4.0%'
  result: 'Đòn bẩy có lợi khi ROIC>Kd; ROE âm khi ROIC rất thấp (3%, D/E=2: âm)'
- name: Tax shield M&M
  inputs:
    EBIT: 100
    T: 0.2
    D: 500
    Kd: 0.08
  steps:
  - 'Toàn vốn chủ: NI=80'
  - 'Có nợ: lãi=40, EBT=60, thuế=12, NI=48; tổng cho nhà đầu tư=88'
  - Chênh 8 = 0,2×40; PV=8/0,08=100=T×D
  result: PV tax shield=100 tỷ
- name: Re-lever beta ngành
  inputs:
    beta_L_peer: 1.4
    DE_peer: 0.5
    DE_target: 1.0
    T: 0.2
    rf: 0.04
    MRP: 0.08
  steps:
  - beta_U=1,4/(1+0,8×0,5)=1,0
  - beta mục tiêu=1,0×(1+0,8×1)=1,8
  - Ke=4%+1,8×8%=18,4%
  result: Ke 18,4% tại D/E=1
practice_questions:
- q: Nợ thị trường 5.000, vốn chủ 7.000 (triệu), Kd 9,5%, Ke 16%, T 20%. WACC?
  a: D/V 41,67%, E/V 58,33%; WACC=0,4167×7,6%+0,5833×16%=12,50% (verified)
- q: rf 4,5%, rm 13%, beta 1,3. Ke? Vì sao beta>1 thì Ke cao hơn thị trường?
  a: Ke=4,5%+1,3×8,5%=15,55%; beta>1 rủi ro hệ thống cao hơn nên đòi phần bù lớn hơn.
- q: Vay vĩnh viễn 10.000 triệu, T 20%. PV tax shield? Vì sao không phụ thuộc Kd?
  a: 2.000 triệu; Kd triệt tiêu giữa tử và mẫu của perpetuity.
- q: 300.000 cp; vay 2.000 triệu lãi 10% hoặc phát hành cp giá 20.000đ. EBIT*?
  a: Lãi 200; cp mới 100.000, N_eq 400.000; EBIT*=200×400000/100000=800 triệu; EPS tại đó=1.600đ.
- q: 'Xưởng may: vốn chủ 3.000, 250.000 cp giá 12.000đ, cần 2.000, Kd 12%, T 20%, EBIT 800. EPS hai phương
    án, EBIT*, nếu EBIT 500?'
  a: 'EPS vay 1.792 vs 1.536; EBIT*=600; EBIT 500 < EBIT*: phát hành (EPS 960 vs 832) và ICR vay 2,08
    <3.'
- q: 'Thành Phát phương án C: tính ICR stress.'
  a: 840/165=5,09.
- q: Beta ngành 1,4 ở D/E 0,5, T 20%. DN mục tiêu D/E=1. Beta?
  a: beta_U=1,0; beta_L=1,8.
- q: 'ROIC 3%, Kd 6%, D/E=1, T 20%: ROE?'
  a: NI=(30-30)×0,8=0 => ROE 0%, trong khi không nợ ROE 2,4%.
- q: 'Bài 6: áp 6 bước Thành Phát cho DN của bạn.'
  a: Tự thực hiện theo procedure p_compare_financing, bắt buộc stress -20-30%.
checklist:
- D/E, D/V dùng giá trị thị trường (hoặc nêu rõ giả định)
- Tỷ trọng WACC cộng =100%
- Đã trừ (1-T) cho Kd; Ke > Kd sau thuế
- Beta đã unlever/relever nếu mượn ngành
- 'Ke giữa các phương án: nêu giả định cố định hay đổi'
- EPS đã tính pha loãng, đơn vị nhất quán
- Tính EBIT* và biên an toàn
- 'Stress test EBIT -30%: ICR>=3, DSCR>=1,2-1,5'
- Debt/EBITDA <3-4x; lịch đáo hạn không có cliff
- Kỳ hạn vay khớp vòng đời tài sản
- Covenant được kiểm tra; còn dư địa vay
- 'Pecking Order: đã dùng nội lực trước?'
- Debt capacity và rủi ro chính sách đã xét
- Số liệu được verify bằng Python
excel_google_sheets_templates:
- 'Tab INPUTS: EBIT base và stress, T, Kd, vốn chủ/cổ phần/giá, Ke, vốn cần huy động'
- 'Tab CAPM: rf, beta, rm, Ke=rf+beta*(rm-rf), Hamada re-lever'
- 'Tab KỊCH BẢN 3-5 cột: %vay/%vốn, lãi, EBT, thuế, NI, EPS, ROE, WACC, ICR; conditional formatting đỏ
  nếu ICR<3'
- 'Tab DASHBOARD: biểu đồ WACC, EPS/ROE base vs stress; IF cảnh báo ICR_stress<3'
- 'Excel: =D/V*Kd*(1-T)+E/V*Ke ; EBIT*=I*Neq/(Neq-Ndebt)'
