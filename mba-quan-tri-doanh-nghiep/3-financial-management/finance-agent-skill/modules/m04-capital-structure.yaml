id: m04
name_vi: Cơ cấu vốn (Modigliani-Miller, Trade-Off, Pecking Order)
name_en: Capital Structure
purpose: Giúp quyết định vay bao nhiêu và góp vốn bao nhiêu để tối thiểu WACC, tối đa giá trị DN mà vẫn
  đủ an toàn; so sánh phương án tài trợ (vay/cổ phần/kết hợp) bằng WACC, EPS, ROE và stress test.
when_to_use:
- Hỏi D/E tối ưu, nên vay hay gọi vốn cổ phần
- Tính WACC, Ke (CAPM), beta Hamada
- Tính tax shield, EBIT-EPS indifference point
- So sánh phương án tài trợ mở rộng
- Giải thích M&M, Trade-Off, Pecking Order, Agency
- Đàm phán vay ngân hàng, covenant, ICR/DSCR
- Đánh giá rủi ro đòn bẩy (Evergrande)
prerequisites:
- m01
- m03
related_modules:
- m02 (WACC làm suất chiết khấu)
- m03 (Kd, Ke, WACC chi tiết)
- m05 (ICR, D/E, ROE từ BCTC)
- m07 (cổ tức/mua lại và Jensen FCF)
- m08 (CAPM, beta)
- m09 (LBO, tài trợ M&A)
- m10 (WACC trong DCF)
concepts:
- term_vi: Cơ cấu vốn
  term_en: Capital Structure
  definition: 'Tỷ lệ phối hợp giữa nợ (Debt) và vốn chủ sở hữu (Equity) dùng tài trợ hoạt động và đầu
    tư. Câu hỏi cốt lõi: có D/E tối ưu làm WACC thấp nhất và giá trị DN cao nhất không.'
  why_it_matters: Trước 1958 giới thực hành tin nợ rẻ nên càng vay càng giảm chi phí vốn; M&M chứng minh
    điều đó không đúng trong thế giới lý tưởng và chỉ ra những ma sát thực tế nào làm cơ cấu vốn quan
    trọng.
- term_vi: Nợ vs vốn chủ
  term_en: Debt vs Equity
  definition: 'Nợ: bắt buộc trả gốc lãi, lãi khấu trừ thuế, không pha loãng, rủi ro phá sản cao, Kd<Ke,
    được trả trước khi thanh lý. Vốn chủ: không bắt buộc trả, cổ tức không khấu trừ thuế, pha loãng quyền
    kiểm soát, nhận phần dư sau cùng (residual claim), Ke>Kd.'
  why_it_matters: 'Là cơ sở của mọi đánh đổi: nợ rẻ và có lá chắn thuế nhưng tạo nghĩa vụ cứng; vốn chủ
    đắt nhưng linh hoạt.'
- term_vi: Định lý Modigliani-Miller
  term_en: Modigliani-Miller theorem
  definition: 'Trong thị trường hoàn hảo (không thuế, không chi phí phá sản, thông tin đối xứng, không
    chi phí đại diện) giá trị DN không phụ thuộc cơ cấu vốn (1958). Có thuế (1963): V_L=V_U+T×D.'
  why_it_matters: MM không nói 'cơ cấu vốn không quan trọng' mà chỉ ra CHÍNH XÁC yếu tố nào làm nó quan
    trọng (thuế, distress, bất cân xứng thông tin, agency). Dùng lập luận arbitrage, nền móng định giá
    no-arbitrage. Miller Nobel 1990, Modigliani Nobel 1985.
- term_vi: Homemade leverage
  term_en: Homemade leverage
  definition: Nhà đầu tư tự vay cá nhân để tái tạo đòn bẩy của DN.
  why_it_matters: 'Là cơ chế arbitrage chứng minh M&M I: DN không thể tạo giá trị bằng việc làm điều nhà
    đầu tư tự làm được.'
- term_vi: Rủi ro tài chính
  term_en: Financial risk
  definition: Rủi ro bổ sung cho cổ đông do nghĩa vụ nợ cố định, cộng vào rủi ro kinh doanh (business
    risk).
  why_it_matters: Giải thích Ke tăng tuyến tính theo D/E (M&M II) và beta tăng (Hamada).
- term_vi: Lá chắn thuế
  term_en: Interest tax shield
  definition: 'Khoản thuế tiết kiệm nhờ lãi vay được trừ trước thuế: hàng năm T×Kd×D; PV (nợ vĩnh viễn)
    = T×D.'
  why_it_matters: Lý do nợ tạo giá trị; trong WACC thể hiện qua (1-T).
- term_vi: Chi phí kiệt quệ tài chính
  term_en: Financial distress costs
  definition: Trực tiếp (pháp lý, tòa án, kế toán ~3-5% giá trị), gián tiếp (mất khách, nhà cung cấp siết,
    mất nhân tài ~10-20%), đại diện (risk shifting, underinvestment, asset stripping ~5-10%). Các tỷ lệ
    là ước lượng tham khảo độ tin cậy thấp.
  why_it_matters: Là lực đối trọng với tax shield, tạo ra D/E tối ưu; tăng nhanh hơn tuyến tính khi nợ
    vượt ngưỡng.
- term_vi: Lý thuyết đánh đổi
  term_en: Trade-Off Theory
  definition: V_L=V_U+PV(TS)-PV(FDC). D/E* nơi tax shield biên = distress biên (đỉnh V, đáy WACC).
  why_it_matters: Giải thích vì sao DN trưởng thành, lãi ổn định, tài sản hữu hình vay nhiều; dữ liệu
    chéo ủng hộ.
- term_vi: Lý thuyết trật tự phân hạng
  term_en: Pecking Order Theory (Myers & Majluf, 1984)
  definition: 'Do bất cân xứng thông tin, DN ưu tiên: nội lực (lợi nhuận giữ lại) > nợ > vốn cổ phần.
    Phát hành cổ phần bị hiểu là tín hiệu cổ phiếu overvalued (adverse selection), giá giảm khoảng 2-3%
    (bằng chứng thực nghiệm).'
  why_it_matters: Dự đoán DN lãi cao ít nợ hơn (ngược Trade-Off) - đúng với DN tăng trưởng, công nghệ,
    startup, SME VN do kênh vốn cổ phần gần đóng.
- term_vi: Lý thuyết dòng tiền tự do / đại diện
  term_en: Agency theory & Free Cash Flow (Jensen, 1986)
  definition: 'Nợ là công cụ kỷ luật: buộc trả lãi định kỳ nên hết tiền nhàn rỗi cho empire building.
    DN FCF cao, ít cơ hội tăng trưởng nên dùng nhiều nợ. LBO là dạng cực đoan.'
  why_it_matters: 'Quản lý muốn mở rộng dù NPV thấp (quyền lực, danh tiếng); nợ là cam kết đáng tin cậy.
    Chi phí đại diện của nợ: risk shifting, underinvestment; giải pháp covenant.'
- term_vi: Thời điểm thị trường
  term_en: Market Timing Theory (Baker & Wurgler, 2002)
  definition: Phát hành vốn chủ khi cổ phiếu đắt, nợ khi cổ phiếu rẻ; cơ cấu vốn là tích lũy các quyết
    định timing.
  why_it_matters: Bằng chứng thực nghiệm ở mức vừa (một số bằng chứng); liên quan quyết định IPO.
- term_vi: Đòn bẩy tài chính dương/âm
  term_en: Positive/negative financial leverage
  definition: 'ROIC>Kd: ROE được khuếch đại; ROIC<Kd: ROE bị kéo xuống, có thể âm.'
  why_it_matters: Đòn bẩy là con dao hai lưỡi - nền tảng stress test.
- term_vi: Phân tích EBIT-EPS
  term_en: EBIT-EPS analysis
  definition: Tìm EBIT hòa vốn giữa phương án vay và phát hành cổ phần theo EPS/ROE.
  why_it_matters: 'Trả lời câu hỏi thực tế của chủ DN: huy động thêm vốn bằng vay hay cổ phần thì EPS
    cao hơn.'
- term_vi: Khả năng vay nợ
  term_en: Debt capacity
  definition: Mức nợ tối đa trước khi distress; SME thấp hơn do dòng tiền tập trung, thiếu xếp hạng tín
    nhiệm, ít vốn cổ phần dự phòng.
  why_it_matters: Điểm D/E* của SME nằm bên trái (ít nợ hơn) so với tập đoàn lớn.
- term_vi: Lệch kỳ hạn
  term_en: Maturity mismatch
  definition: Tài trợ tài sản dài hạn bằng nợ ngắn hạn, buộc đảo nợ (rollover).
  why_it_matters: Nguyên nhân sụp đổ Evergrande; khớp kỳ hạn vay với vòng đời tài sản.
- term_vi: Covenant
  term_en: Debt covenants
  definition: Điều khoản ràng buộc trong hợp đồng vay (D/E<2x, DSCR>1,5x, ICR tối thiểu).
  why_it_matters: Vi phạm có thể gây ngân hàng siết tín dụng; là giải pháp cho agency cost của nợ.
- term_vi: Ba vạch đỏ
  term_en: Three Red Lines policy (China 2020)
  definition: Nợ phải trả/tổng tài sản (không tính tiền trả trước) <70%; nợ ròng/vốn chủ <100%; tiền mặt
    >= nợ ngắn hạn.
  why_it_matters: 'Ví dụ rủi ro chính sách làm sụp đổ năng lực vay: debt capacity phụ thuộc môi trường
    pháp lý.'
formulas:
- id: m04_mm1_no_tax
  name_vi: M&M Mệnh đề I không thuế (1958)
  name_en: MM Proposition I (no taxes)
  expression_latex: V_L = V_U = \frac{EBIT}{K_0}
  expression_python: EBIT/K0
  excel: =EBIT/K0
  variables:
  - symbol: V_L
    meaning: Giá trị DN có nợ
    unit: tiền
  - symbol: V_U
    meaning: Giá trị DN không nợ
    unit: tiền
  - symbol: EBIT
    meaning: Lợi nhuận hoạt động bình quân vĩnh viễn
    unit: tiền/năm
  - symbol: K0
    meaning: Chi phí vốn của DN toàn vốn chủ (unlevered)
    unit: '%/năm'
  when_to_use: 'Benchmark lý thuyết: chứng minh cơ cấu vốn chỉ chia dòng tiền, không tạo/phá giá trị khi
    thị trường hoàn hảo.'
  why_it_works: Giá trị do tài sản hoạt động (dòng tiền EBIT) quyết định, giống cái bánh pizza cố định;
    vay nhiều hay ít chỉ là cách chia bánh giữa chủ nợ và cổ đông. Nếu V_L khác V_U, nhà đầu tư dùng homemade
    leverage (tự vay/cho vay cá nhân) để arbitrage cho tới khi hai giá trị bằng nhau.
  assumptions:
  - Không thuế
  - Không chi phí phá sản
  - Không chi phí giao dịch
  - Thông tin đối xứng
  - Cá nhân vay cùng lãi suất với DN
  - Không chi phí đại diện
  pitfalls:
  - 'Dùng như lời khuyên thực hành: sai, chỉ là baseline'
  - Quên rằng kết luận sụp đổ khi có thuế (xem m04_mm1_tax)
  interpretation: Nếu tính ra V_L khác V_U trong thực tế, phần chênh lệch đến từ ma sát thị trường (thuế,
    distress, agency, thông tin), không phải từ 'cơ cấu vốn' tự thân.
  example:
    inputs:
      EBIT: 80
      K0: 0.12
    steps:
    - V_U = 80/0.12 = 666.67
    - V_L = V_U (mọi D/E) = 666.67
    result: V_L = V_U = 666.67 (đơn vị tiền) với mọi D/E
- id: m04_mm2_no_tax
  name_vi: M&M Mệnh đề II không thuế
  name_en: MM Proposition II (no taxes)
  expression_latex: K_e = K_0 + (K_0 - K_d)\times\frac{D}{E}
  expression_python: K0+(K0-Kd)*D/E
  excel: =K0+(K0-Kd)*D/E
  variables:
  - symbol: Ke
    meaning: Chi phí vốn chủ khi có đòn bẩy
    unit: '%/năm'
  - symbol: K0
    meaning: Chi phí vốn tài sản (unlevered)
    unit: '%/năm'
  - symbol: Kd
    meaning: Chi phí nợ
    unit: '%/năm'
  - symbol: D/E
    meaning: Tỷ lệ nợ trên vốn chủ (giá trị thị trường)
    unit: lần
  - symbol: D
    meaning: Giá trị thị trường nợ
    unit: ''
  - symbol: E
    meaning: Giá trị thị trường vốn chủ
    unit: ''
  when_to_use: Giải thích vì sao Ke tăng khi vay thêm và vì sao WACC phẳng trong thế giới không thuế.
  why_it_works: 'Vay thêm tạo rủi ro tài chính (financial risk) cộng vào rủi ro kinh doanh: chủ nợ được
    trả trước nên dòng tiền cổ đông biến động mạnh hơn. Cổ đông đòi bù đúng phần chênh (K0-Kd) trên mỗi
    đơn vị D/E, nên Ke tăng tuyến tính và triệt tiêu lợi ích ''nợ rẻ'', WACC=K0 không đổi.'
  assumptions:
  - Các giả định M&M I
  - Kd không đổi theo D/E (nợ phi rủi ro hoặc rủi ro thấp)
  pitfalls:
  - Nhầm D/E với D/V
  - Nghĩ Ke không đổi khi vay thêm
  interpretation: Ke tăng tuyến tính theo D/E, độ dốc = K0-Kd. WACC = K0 phẳng.
  example:
    inputs:
      K0: 0.12
      Kd: 0.06
      D: 50
      E: 100
    steps:
    - D/E = 0.5
    - Ke = 0.12 + (0.12-0.06)*0.5 = 0.15
    - WACC = 100/150*0.15 + 50/150*0.06 = 12% = K0
    result: Ke = 0.1500 (15%)
- id: m04_mm1_tax
  name_vi: M&M Mệnh đề I có thuế (1963)
  name_en: MM Proposition I (with corporate taxes)
  expression_latex: V_L = V_U + T\times D
  expression_python: VU+T*D
  excel: =VU+T*D
  variables:
  - symbol: VL
    meaning: Giá trị DN có nợ
    unit: ''
  - symbol: VU
    meaning: Giá trị DN không nợ
    unit: ''
  - symbol: T
    meaning: Thuế suất TNDN
    unit: '%'
  - symbol: D
    meaning: Nợ vĩnh viễn
    unit: ''
  when_to_use: Định giá giá trị tạo ra từ nợ nhờ lá chắn thuế; minh họa vì sao nợ có giá trị.
  why_it_works: 'Lãi vay trừ trước thuế, cổ tức thì không: Nhà nước ''trợ cấp'' T×Kd×D mỗi năm. Chiết
    khấu dòng vĩnh viễn ở Kd thì Kd triệt tiêu, còn T×D. MM tự sửa kết luận 1958 năm 1963.'
  assumptions:
  - Nợ vĩnh viễn, D không đổi
  - Chiết khấu tax shield ở Kd (rủi ro như nợ)
  - Doanh nghiệp luôn có lãi đủ để dùng hết khoản khấu trừ
  - Chưa có chi phí phá sản
  pitfalls:
  - Kết luận '100% nợ là tối ưu' là hệ quả của việc bỏ qua distress cost, không phải lời khuyên
  - Bỏ qua thuế cá nhân (Miller 1977) và việc không đủ lãi để dùng tax shield
  interpretation: Mỗi đồng nợ vĩnh viễn thêm T đồng giá trị. Là cận trên giá trị lợi ích; thực tế bị trừ
    distress cost.
  example:
    inputs:
      VU: 666.67
      T: 0.2
      D: 500
    steps:
    - Tax shield = 0.2*500 = 100
    - V_L = 666.67+100 = 766.67
    result: V_L = 766.67
- id: m04_pv_tax_shield
  name_vi: Giá trị hiện tại lá chắn thuế (nợ vĩnh viễn)
  name_en: PV of interest tax shield (perpetual debt)
  expression_latex: PV(TS)=\frac{T\times K_d\times D}{K_d}=T\times D
  expression_python: T*Kd*D/Kd
  excel: =T*D
  variables:
  - symbol: T
    meaning: Thuế suất TNDN
    unit: '%'
  - symbol: Kd
    meaning: Lãi suất vay
    unit: '%/năm'
  - symbol: D
    meaning: Nợ vĩnh viễn
    unit: tiền
  when_to_use: Tính nhanh giá trị tiết kiệm thuế của một khoản nợ dài hạn (xấp xỉ).
  why_it_works: Tiết kiệm hàng năm T×Kd×D là perpetuity chiết khấu ở Kd => Kd triệt tiêu, nên kết quả
    không phụ thuộc lãi suất (lãi cao tiết kiệm nhiều hơn/năm nhưng chiết khấu cũng mạnh hơn).
  assumptions:
  - Nợ vĩnh viễn
  - Chiết khấu ở Kd
  - Đủ EBIT để khấu trừ hết lãi
  pitfalls:
  - Với nợ có kỳ hạn hữu hạn, PV nhỏ hơn T×D (dùng annuity)
  - 'Lãi vay VN bị khống chế khấu trừ (Nghị định 132/2020: tối đa 30% EBITDA với giao dịch liên kết) -
    cần xác nhận'
  interpretation: Tax shield hàng năm = T×Kd×D; tổng giá trị hiện tại = T×D.
  example:
    inputs:
      T: 0.2
      Kd: 0.08
      D: 500
    steps:
    - Tiết kiệm/năm = 0.2*0.08*500 = 8
    - PV = 8/0.08 = 100 = 0.2*500
    result: PV(Tax Shield) = 100.0 tỷ
- id: m04_mm2_tax
  name_vi: M&M Mệnh đề II có thuế
  name_en: MM Proposition II (with taxes)
  expression_latex: K_e = K_0 + (K_0-K_d)(1-T)\frac{D}{E}
  expression_python: K0+(K0-Kd)*(1-T)*D/E
  excel: =K0+(K0-Kd)*(1-T)*D/E
  variables:
  - symbol: K0
    meaning: Chi phí vốn unlevered
    unit: '%'
  - symbol: Kd
    meaning: Chi phí nợ trước thuế
    unit: '%'
  - symbol: T
    meaning: Thuế suất
    unit: '%'
  - symbol: D/E
    meaning: Nợ/vốn chủ thị trường
    unit: lần
  when_to_use: Tính Ke khi có đòn bẩy và có thuế; kết hợp để thấy WACC giảm khi D/V tăng.
  why_it_works: 'Giống M&M II nhưng nợ rẻ sau thuế nên phần bù rủi ro tài chính được nhân (1-T): Ke tăng
    chậm hơn so với lợi ích nợ => WACC giảm dần theo D.'
  assumptions:
  - Các giả định M&M có thuế
  - Beta nợ ~0 (Kd không đổi)
  pitfalls:
  - Quên (1-T)
  - Dùng D/E sổ sách thay vì thị trường
  interpretation: Ke tăng theo D/E nhưng chậm hơn trường hợp không thuế.
  example:
    inputs:
      K0: 0.12
      Kd: 0.08
      T: 0.2
      D: 500
      E: 266.67
    steps:
    - D/E=500/266.67=1.875
    - Ke = 0.12+0.04*0.8*1.875 = 0.18
    result: Ke = 0.1800
- id: m04_wacc_mm_tax
  name_vi: WACC theo M&M có thuế
  name_en: WACC under MM with taxes
  expression_latex: WACC = K_0\left(1 - T\frac{D}{V}\right)
  expression_python: K0*(1-T*D/V)
  excel: =K0*(1-T*D/V)
  variables:
  - symbol: K0
    meaning: Chi phí vốn unlevered
    unit: '%'
  - symbol: T
    meaning: Thuế suất
    unit: '%'
  - symbol: D/V
    meaning: Tỷ trọng nợ trên tổng giá trị
    unit: ''
  when_to_use: Chứng minh WACC giảm đơn điệu theo đòn bẩy khi có thuế và chưa có distress cost.
  why_it_works: 'Thay Ke (m04_mm2_tax) vào WACC: lợi ích duy nhất còn lại là tax shield, giảm WACC tuyến
    tính theo D/V.'
  assumptions:
  - M&M có thuế, nợ vĩnh viễn
  pitfalls:
  - Thực tế distress cost đẩy WACC tăng ở D/V cao
  interpretation: D/V càng cao WACC càng thấp (lý thuyết); điểm đáy thực tế do distress cost tạo ra.
  example:
    inputs:
      K0: 0.12
      T: 0.2
      D: 500
      V: 766.67
    steps:
    - D/V=500/766.67=0.652
    - WACC = 0.12*(1-0.2*0.652)=0.1043
    result: WACC = 0.1043
- id: m04_trade_off
  name_vi: Giá trị theo Trade-Off Theory
  name_en: Trade-off value of levered firm
  expression_latex: V_L = V_U + PV(TS) - PV(FDC)
  expression_python: VU+PV_TS-PV_FDC
  excel: =VU+PV_TS-PV_FDC
  variables:
  - symbol: VU
    meaning: Giá trị không nợ
    unit: ''
  - symbol: PV_TS
    meaning: PV lá chắn thuế
    unit: ''
  - symbol: PV_FDC
    meaning: PV chi phí kiệt quệ tài chính (trực tiếp+gián tiếp+đại diện)
    unit: ''
  when_to_use: 'Tìm D/E tối ưu: nơi lợi ích biên tax shield = chi phí biên distress.'
  why_it_works: 'Gỡ giả định cuối của MM: nợ càng cao xác suất default càng lớn, chi phí distress (pháp
    lý, mất khách, nhà cung cấp siết, mất nhân tài, risk shifting) tăng nhanh hơn tuyến tính vượt một
    ngưỡng. Tối ưu = đỉnh của V_L = đáy của WACC.'
  assumptions:
  - Có thể ước lượng PV(FDC) = xác suất × chi phí
  - Mục tiêu D/E ổn định
  pitfalls:
  - PV(FDC) rất khó đo, chỉ ước lượng thô
  - 'Ước lượng nguồn: direct 3-5%, indirect 10-20%, agency 5-10% giá trị DN (độ tin cậy thấp)'
  interpretation: Nếu D/E hiện tại < D/E*, vay thêm tăng giá trị; nếu > D/E*, giảm nợ.
  example:
    inputs:
      VU: 1000
      PV_TS: 150
      PV_FDC: 60
    steps:
    - V_L = 1000+150-60
    result: V_L = 1090
- id: m04_wacc
  name_vi: Chi phí sử dụng vốn bình quân gia quyền (WACC)
  name_en: Weighted Average Cost of Capital
  expression_latex: WACC=\frac{D}{V}K_d(1-T)+\frac{E}{V}K_e
  expression_python: D/V*Kd*(1-T)+E/V*Ke
  excel: =D/V*Kd*(1-T)+E/V*Ke
  variables:
  - symbol: D
    meaning: Nợ (giá trị thị trường)
    unit: tiền
  - symbol: E
    meaning: Vốn chủ (giá trị thị trường)
    unit: tiền
  - symbol: V
    meaning: D+E
    unit: tiền
  - symbol: Kd
    meaning: Chi phí vay trước thuế
    unit: '%'
  - symbol: Ke
    meaning: Chi phí vốn chủ
    unit: '%'
  - symbol: T
    meaning: Thuế suất TNDN
    unit: '%'
  when_to_use: Suất chiết khấu dự án/định giá DN; so sánh phương án cơ cấu vốn; ngưỡng ROIC tối thiểu.
  why_it_works: Mỗi nhà cung cấp vốn đòi lợi suất khác nhau; WACC là bình quân gia quyền theo tỷ trọng
    giá trị thị trường. (1-T) phản ánh lãi vay được khấu trừ. ROIC > WACC mới tạo giá trị kinh tế.
  assumptions:
  - Tỷ trọng theo giá trị thị trường (hoặc mục tiêu)
  - Ke và Kd phản ánh đúng rủi ro hiện tại
  - Kd < lợi suất kỳ vọng nợ
  pitfalls:
  - Dùng giá trị sổ sách làm tỷ trọng
  - 'Giữ Ke cố định khi D/E thay đổi (sai về lý thuyết: Ke tăng theo D/E); chỉ chấp nhận khi chủ ý như
    case Thành Phát, ghi rõ giả định'
  - Quên (1-T) hoặc dùng thuế suất biên sai
  - 'SME chưa niêm yết: E thị trường không quan sát, phải ước lượng'
  interpretation: WACC là tỷ suất sinh lời tối thiểu trên tổng vốn; WACC 12,2% nghĩa là ROIC phải > 12,2%.
  example:
    inputs:
      D: 400
      E: 600
      Kd: 0.1
      Ke: 0.15
      T: 0.2
      V: 1000
    steps:
    - D/V=0.4, E/V=0.6
    - Kd sau thuế=10%*0.8=8%
    - WACC=0.4*8%+0.6*15%=3.2%+9%
    result: WACC = 0.1220 (12,2%)
- id: m04_kd_after_tax
  name_vi: Chi phí vay sau thuế
  name_en: After-tax cost of debt
  expression_latex: K_d^{AT}=K_d(1-T)
  expression_python: Kd*(1-T)
  excel: =Kd*(1-T)
  variables:
  - symbol: Kd
    meaning: Lãi suất vay
    unit: '%'
  - symbol: T
    meaning: Thuế suất
    unit: '%'
  when_to_use: Bước con của WACC, so sánh với ROIC.
  why_it_works: Mỗi đồng lãi giảm thuế T nên chi phí thực còn (1-T).
  assumptions:
  - DN có lãi chịu thuế
  pitfalls:
  - DN lỗ thì không có tax shield => dùng Kd chưa trừ thuế
  interpretation: Chi phí vay thực thấp hơn lãi niêm yết.
  example:
    inputs:
      Kd: 0.1
      T: 0.2
    steps:
    - 10%*(1-0.2)
    result: Kd sau thuế = 0.080
- id: m04_capm
  name_vi: Chi phí vốn chủ theo CAPM
  name_en: CAPM cost of equity
  expression_latex: K_e = r_f + \beta (r_m - r_f)
  expression_python: rf+beta*(rm-rf)
  excel: =rf+beta*(rm-rf)
  variables:
  - symbol: rf
    meaning: Lãi suất phi rủi ro (TPCP 10 năm)
    unit: '%'
  - symbol: beta
    meaning: Beta rủi ro hệ thống
    unit: '-'
  - symbol: rm
    meaning: Lợi suất kỳ vọng thị trường
    unit: '%'
  - symbol: rm-rf
    meaning: Phần bù rủi ro thị trường
    unit: '%'
  when_to_use: Ước lượng Ke khi không có lãi suất cam kết với cổ đông.
  why_it_works: 'Sharpe (1964, Nobel 1990): lợi suất kỳ vọng = thưởng chờ đợi (rf) + thưởng rủi ro hệ
    thống (beta × MRP). Chỉ rủi ro hệ thống được thưởng vì rủi ro riêng đa dạng hóa được.'
  assumptions:
  - Thị trường hiệu quả
  - Nhà đầu tư đa dạng hóa
  - Beta ổn định
  pitfalls:
  - 'SME chưa niêm yết: cần beta ngành rồi re-lever (Hamada) và cộng illiquidity/size premium'
  - Dùng rm ngắn hạn biến động
  - Nhầm rm với MRP
  interpretation: Beta 1 = như thị trường; >1 rủi ro hơn (BĐS, công nghệ); <1 phòng thủ (điện, nước, y
    tế). Dự án có lợi suất < Ke bị cổ đông từ chối.
  example:
    inputs:
      rf: 0.04
      beta: 1.2
      rm: 0.12
    steps:
    - MRP = 12%-4% = 8%
    - Ke = 4%+1.2*8% = 13,6%
    result: Ke = 0.1360
- id: m04_hamada
  name_vi: Phương trình Hamada (re-lever beta)
  name_en: Hamada equation
  expression_latex: \beta_L=\beta_U\left[1+(1-T)\frac{D}{E}\right]
  expression_python: beta_u*(1+(1-T)*D/E)
  excel: =beta_u*(1+(1-T)*D/E)
  variables:
  - symbol: beta_u
    meaning: Beta không nợ (asset beta)
    unit: '-'
  - symbol: beta_L
    meaning: Beta có nợ
    unit: '-'
  - symbol: T
    meaning: Thuế suất
    unit: '%'
  - symbol: D/E
    meaning: Nợ/vốn chủ
    unit: lần
  when_to_use: Chuyển beta ngành sang cơ cấu vốn của DN mình; tính Ke theo D/E mới.
  why_it_works: Beta phản ánh rủi ro kinh doanh + rủi ro tài chính. Nợ khuếch đại biến động lợi nhuận
    cổ đông nên beta vốn chủ tăng theo D/E (cùng cơ chế M&M II); loại D/E ngành để lấy beta_u, rồi gắn
    D/E của mình.
  assumptions:
  - Beta nợ = 0
  - Nợ ổn định, tỷ lệ D/E không đổi
  - Thuế suất không đổi
  pitfalls:
  - Dùng beta ngành có D/E khác mà không unlever
  - Beta nợ ≠ 0 ở D/E rất cao làm Hamada phóng đại
  interpretation: D/E 0,5, T=20% => beta tăng 40%.
  example:
    inputs:
      beta_u: 1.0
      T: 0.2
      D: 0.5
      E: 1.0
    steps:
    - 1+(0.8)(0.5)=1.4
    - Ke = 4%+1.4*8% = 15,2%
    result: beta_L = 1.40
- id: m04_unlever_beta
  name_vi: Beta không đòn bẩy (un-lever)
  name_en: Unlevered beta
  expression_latex: \beta_U=\frac{\beta_L}{1+(1-T)\frac{D}{E}}
  expression_python: beta_L/(1+(1-T)*D/E)
  excel: =beta_L/(1+(1-T)*D/E)
  variables:
  - symbol: beta_L
    meaning: Beta quan sát được
    unit: '-'
  - symbol: T
    meaning: Thuế suất
    unit: ''
  - symbol: D/E
    meaning: Nợ/vốn chủ của công ty so sánh
    unit: lần
  when_to_use: Bước 1 khi mượn beta ngành.
  why_it_works: Đảo công thức Hamada để tách rủi ro kinh doanh thuần.
  assumptions:
  - Như Hamada
  pitfalls:
  - Quên trung bình beta_u các công ty rồi mới re-lever
  interpretation: Dùng beta_u trung bình ngành để re-lever.
  example:
    inputs:
      beta_L: 1.4
      T: 0.2
      D: 0.5
      E: 1.0
    steps:
    - 1.4/(1+0.8*0.5)=1.0
    result: beta_U = 1.00
- id: m04_eps
  name_vi: EPS theo phương án vay / phát hành cổ phần
  name_en: EPS under debt vs equity financing
  expression_latex: EPS=\frac{(EBIT-I)(1-T)}{N},\quad I=K_d D,\ N=N_0+\frac{F_{eq}}{P}
  expression_python: (EBIT-I)*(1-T)/N
  excel: =(EBIT-I)*(1-T)/N
  variables:
  - symbol: EBIT
    meaning: Lợi nhuận trước lãi và thuế
    unit: triệu
  - symbol: I
    meaning: Lãi vay = Kd×D
    unit: triệu
  - symbol: T
    meaning: Thuế suất
    unit: ''
  - symbol: N
    meaning: Số cổ phần sau phát hành
    unit: cổ phần
  when_to_use: So sánh phương án tài trợ theo EPS tại một mức EBIT.
  why_it_works: Vay làm giảm EBT nhưng không tăng số cổ phần; phát hành làm không có lãi nhưng pha loãng.
    EPS cho biết ai có lợi ở mức EBIT cụ thể.
  assumptions:
  - EBIT độc lập với phương án
  - Giá phát hành công bằng
  pitfalls:
  - Chỉ nhìn EPS kịch bản cơ sở, bỏ qua rủi ro (phải stress test)
  - Quên pha loãng khi tính N
  - 'Đơn vị: triệu đồng × 1e6 / cổ phần'
  interpretation: EPS cao hơn chưa chắc tốt hơn nếu coverage rớt dưới ngưỡng.
  example:
    inputs:
      EBIT: 1200
      I: 330
      T: 0.2
      N: 400000
    steps:
    - NI=(1200-330)*0.8=696 triệu
    - EPS=696e6/400000
    result: EPS (triệu/cổ phần x1) = 0.001740; nhân 1e6 = 1740 đ
- id: m04_ebit_indiff
  name_vi: EBIT điểm hòa vốn (indifference point)
  name_en: EBIT-EPS indifference point
  expression_latex: EBIT^{*}=\frac{I\times N_{eq}}{N_{eq}-N_{debt}}
  expression_python: I*N_eq/(N_eq-N_debt)
  excel: =I*N_eq/(N_eq-N_debt)
  variables:
  - symbol: I
    meaning: Lãi vay của phương án vay
    unit: triệu
  - symbol: N_eq
    meaning: Số cổ phần sau phát hành (phương án vốn chủ)
    unit: ''
  - symbol: N_debt
    meaning: Số cổ phần hiện hữu (phương án vay)
    unit: ''
  when_to_use: Xác định EBIT mà trên đó vay có EPS cao hơn.
  why_it_works: 'Đặt (EBIT-I)(1-T)/N_debt = EBIT(1-T)/N_eq: (1-T) triệt tiêu nên EBIT* không phụ thuộc
    thuế.'
  assumptions:
  - Hai phương án so sánh chỉ khác nhau ở nợ/phát hành
  pitfalls:
  - EBIT* chỉ là điểm cân bằng EPS, không phải ngưỡng an toàn
  - 'Trường hợp phương án kết hợp: dùng công thức đối xứng với (I, N) của từng cặp'
  interpretation: EBIT thực tế > EBIT* => vay tốt hơn về EPS; < EBIT* => phát hành an toàn hơn. Đo biên
    an toàn (EBIT-EBIT*)/EBIT.
  example:
    inputs:
      I: 330
      N_eq: 600000
      N_debt: 400000
    steps:
    - EBIT*=330*600000/200000=990
    - Kiểm tra EPS hai phía = 1320 đ
    result: EBIT* = 990 triệu
- id: m04_roe_leverage
  name_vi: ROE khuếch đại bởi đòn bẩy
  name_en: Financial leverage effect on ROE
  expression_latex: ROE=\left[ROIC+(ROIC-K_d)\frac{D}{E}\right](1-T)
  expression_python: (roic+(roic-kd)*de)*(1-T)
  excel: =(ROIC+(ROIC-Kd)*DE)*(1-T)
  variables:
  - symbol: roic
    meaning: Tỷ suất sinh lời trên vốn đầu tư trước thuế (EBIT/Invested Capital)
    unit: '%'
  - symbol: kd
    meaning: Lãi vay
    unit: '%'
  - symbol: de
    meaning: D/E
    unit: lần
  - symbol: T
    meaning: Thuế
    unit: ''
  when_to_use: Hiểu đòn bẩy dương/âm; tìm ngưỡng ROIC mà vay có lợi.
  why_it_works: Chủ nợ chỉ nhận Kd; phần dôi (ROIC-Kd) trên số nợ thuộc cổ đông; nếu ROIC<Kd cổ đông phải
    bù lỗ. Đòn bẩy là con dao hai lưỡi.
  assumptions:
  - ROIC cố định không đổi theo D
  - Kd không đổi theo D/E
  pitfalls:
  - Bảng nguồn (24%,31%...) là ROE trước thuế (bỏ (1-T)); ô D/E=2,Kd=7%,ROIC=6% ghi 5% nhưng đúng là 4%
  - Kd tăng theo D/E ở thực tế
  interpretation: 'ROIC>Kd: ROE>ROIC(1-T); ROIC<Kd: ROE bị kéo xuống, có thể âm.'
  example:
    inputs:
      roic: 0.1
      kd: 0.06
      de: 1
      T: 0.2
    steps:
    - 'Không nợ: ROE=10%*0.8=8%'
    - 'D/E=1: EBIT=100, lãi=30, NI=56, vốn chủ=500 => 11,2%'
    result: ROE = 0.1120
- id: m04_dfl
  name_vi: Độ lớn đòn bẩy tài chính (DFL)
  name_en: Degree of Financial Leverage
  expression_latex: DFL=\frac{\%\Delta EPS}{\%\Delta EBIT}=\frac{EBIT}{EBIT-I}
  expression_python: EBIT/(EBIT-I)
  excel: =EBIT/(EBIT-I)
  variables:
  - symbol: EBIT
    meaning: ''
    unit: ''
  - symbol: I
    meaning: Lãi vay
    unit: ''
  when_to_use: Đo độ nhạy EPS với biến động EBIT.
  why_it_works: Lãi vay là chi phí cố định nên 1% đổi của EBIT làm EPS đổi DFL%.
  assumptions:
  - Lãi vay cố định
  pitfalls:
  - 'Cận EBIT≈I: DFL tiến vô cùng'
  interpretation: DFL=1,38 nghĩa EBIT -10% thì EPS -13,8%.
  example:
    inputs:
      EBIT: 1200
      I: 330
    steps:
    - 1200/870
    result: DFL = 1.379
- id: m04_icr
  name_vi: Hệ số bao phủ lãi vay
  name_en: Interest Coverage Ratio
  expression_latex: ICR=\frac{EBIT}{I}
  expression_python: EBIT/I
  excel: =EBIT/I
  variables:
  - symbol: EBIT
    meaning: ''
    unit: ''
  - symbol: I
    meaning: Lãi vay
    unit: ''
  when_to_use: Stress test, kiểm covenant.
  why_it_works: Số lần lợi nhuận hoạt động bao phủ lãi.
  assumptions:
  - EBIT ổn định
  pitfalls:
  - Chỉ nhìn kịch bản cơ sở
  interpretation: Ngân hàng VN thường yêu cầu >3 lần (hoặc 2-3 lần); <1,5 nguy hiểm.
  example:
    inputs:
      EBIT: 840
      I: 330
    steps:
    - 840/330
    result: ICR = 2.55
- id: m04_dscr
  name_vi: Hệ số khả năng trả nợ (DSCR)
  name_en: Debt Service Coverage Ratio
  expression_latex: DSCR=\frac{CFO}{Principal+Interest}
  expression_python: cfo/(principal+interest)
  excel: =CFO/(Gốc+Lãi)
  variables:
  - symbol: cfo
    meaning: Dòng tiền hoạt động có sẵn trả nợ
    unit: ''
  - symbol: principal
    meaning: Gốc phải trả kỳ
    unit: ''
  - symbol: interest
    meaning: Lãi phải trả kỳ
    unit: ''
  when_to_use: Thẩm định khả năng trả nợ gốc+lãi.
  why_it_works: Lãi mới chỉ là một phần nghĩa vụ; gốc cũng phải trả bằng tiền.
  assumptions:
  - Dòng tiền ổn định
  pitfalls:
  - Dùng lợi nhuận thay vì dòng tiền
  interpretation: Ngân hàng VN thường yêu cầu 1,2-1,5 lần (nguồn bài, cần xác nhận).
  example:
    inputs:
      cfo: 900
      principal: 300
      interest: 120
    steps:
    - 900/420
    result: DSCR = 2.14
- id: m04_debt_ebitda
  name_vi: Nợ trên EBITDA
  name_en: Debt/EBITDA
  expression_latex: \frac{Debt}{EBITDA}
  expression_python: debt/ebitda
  excel: =Nợ/EBITDA
  variables:
  - symbol: debt
    meaning: ''
    unit: ''
  - symbol: ebitda
    meaning: ''
    unit: ''
  when_to_use: Đo số năm EBITDA để trả hết nợ.
  why_it_works: Thước đo đòn bẩy theo dòng tiền.
  assumptions:
  - EBITDA ổn định
  pitfalls:
  - Nợ ròng vs nợ gộp
  interpretation: 'Checklist nguồn: < 3-4 lần.'
  example:
    inputs:
      debt: 3000
      ebitda: 1000
    steps:
    - 3000/1000
    result: Debt/EBITDA = 3.0x
- id: m04_new_shares
  name_vi: Số cổ phần phát hành mới
  name_en: New shares issued
  expression_latex: N_{new}=\frac{F_{eq}}{P}
  expression_python: F_eq/P
  excel: =F_eq/P
  variables:
  - symbol: F_eq
    meaning: Vốn cần huy động bằng cổ phần
    unit: đồng
  - symbol: P
    meaning: Giá phát hành
    unit: đồng/cổ phần
  when_to_use: Tính pha loãng khi so sánh phương án.
  why_it_works: Số tiền chia giá.
  assumptions:
  - Giá phát hành = giá thị trường
  pitfalls:
  - Giá phát hành thấp hơn giá trị thực gây pha loãng giá trị
  interpretation: Tỷ lệ pha loãng = N_new/(N0+N_new).
  example:
    inputs:
      F_eq: 3000000000.0
      P: 15000
    steps:
    - 3e9/15000
    result: N_new = 200000
- id: m04_stress_ebit
  name_vi: EBIT kịch bản xấu
  name_en: Stress-test EBIT
  expression_latex: EBIT_{stress}=EBIT\times(1-s)
  expression_python: EBIT*(1-s)
  excel: =EBIT*(1-s)
  variables:
