pitfalls:
  - "Dùng book value thay market value / target structure cho trọng số"
  - "Dùng lãi vay (hoặc lãi dự án) làm discount rate, bỏ qua chi phí vốn chủ"
  - "Coi vốn chủ và lợi nhuận giữ lại là miễn phí"
  - "Chỉ so với lãi tiết kiệm 6-7%, bỏ phần bù rủi ro kinh doanh"
  - "Dùng historical beta không điều chỉnh; quên unlever/relever"
  - "Bỏ Country Risk Premium hoặc size premium; hoặc cộng CRP hai lần"
  - "Dùng Rf ngắn hạn thay TPCP 10 năm"
  - "Dùng WACC hằng số cho LBO / cơ cấu vốn thay đổi"
  - "Dùng một WACC cho mọi dự án"
  - "Trộn VNĐ-USD, danh nghĩa-thực, FCFF-Ke"
  - "Dùng coupon lịch sử thay lãi suất thị trường hiện hành (YTM)"
  - "Tưởng vay nhiều giảm WACC mãi; bỏ qua chi phí kiệt quệ"
  - "Không cập nhật WACC khi lãi suất/cơ cấu vốn đổi"
  - "Trình bày một con số định giá không sensitivity"
  - "CAPM giả định thị trường hoàn hảo, beta không ổn định, MRP gây tranh cãi, vòng tròn E-WACC, khó ước lượng ở mới nổi"

sme_vn_guidance:
  - "Không có giá cổ phiếu/beta riêng: dùng beta ngành (Damodaran Emerging Markets hoặc 3-5 công ty niêm yết) qua Hamada."
  - "Không có thị giá vốn chủ: dùng D/E mục tiêu hoặc ước từ P/E, EV/EBITDA ngành."
  - "Vốn chủ là tiền chủ DN: quy đổi chi phí cơ hội, Ke tối thiểu >= lợi suất kinh doanh thay thế + premium."
  - "Kd: lấy báo giá vay mới từ >=3 ngân hàng, tính cả phí và chi phí tài sản bảo đảm."
  - "Dòng tiền mùa vụ/phụ thuộc khách: thêm size/company premium 2-5%."
  - "Chuẩn hóa BCTC 2-3 năm + dự phóng dòng tiền để thuyết phục ngân hàng/nhà đầu tư."
  - "Nguồn dữ liệu: HNX/Bộ Tài chính (Rf), Damodaran (beta, ERP/CRP, spread; miễn phí), HOSE/HNX/SSI/VNDirect/Vietstock/CafeF (beta, P/E, VN-Index), FiinPro/Bloomberg/Refinitiv (trả phí)."
  - "Lãi vay khấu trừ giới hạn 30% EBITDA (Nghị định 132/2020/NĐ-CP) và thuế TNDN 20%: cần xác nhận với kế toán/tư vấn thuế theo văn bản mới nhất."
  - "Hurdle rate nhanh: thay thế/bảo trì thiết bị WACC-1%; mở rộng cùng ngành WACC; sản phẩm mới +2-3%; thị trường mới +3-5%; mô hình mới +5-8% hoặc VC method."
  - "Đừng ám ảnh giảm WACC bằng vay thêm khi ROIC còn thấp: nâng ROIC (giá, biên, vòng quay vốn) trước."
  - "Cập nhật WACC mỗi năm và trước mỗi quyết định đầu tư lớn; thương lượng giảm lãi vay (Tâm An: mỗi 1 điểm % ~ +46 triệu NPV)."

case_lessons:
  - name: "Apple - WACC gần bằng Ke, ROIC vượt xa WACC"
    type: "success"
    setup: "Apple ít nợ so với vốn hóa, ROIC rất cao nhờ thương hiệu/hệ sinh thái. Số liệu xấp xỉ 2023 mang tính minh họa."
    key_calculations:
      - "E=3.000B, D=110B -> E/V=96,46%, D/V=3,54%"
      - "Ke = 4,5% + 1,2 x 5% = 10,5%; Kd sau thuế = 3,5% x 0,79 = 2,765%"
      - "WACC = 0,9646 x 10,5% + 0,0354 x 2,765% = 10,23% (nợ chỉ đóng góp 0,098 điểm %)"
      - "Beta 1,0 -> WACC 9,26%; beta 1,4 -> 11,19% (0,2 beta ~ 0,95 điểm % WACC)"
      - "ROIC 55% so WACC 10,23%; EVA trên 100B vốn ~ 44,8B/năm"
    lesson: "Giá trị quyết định bởi spread ROIC - WACC, không phải giảm WACC 1 điểm; với SME nâng ROIC trước, đừng vay thêm để giảm WACC."
    data_reliability: "illustrative"
  - name: "Toys R Us - LBO không giảm WACC, tăng nguy cơ vỡ nợ"
    type: "failure"
    setup: "LBO 2005 bởi KKR, Bain, Vornado (~6,6 tỷ USD, phần lớn nợ); lãi vay ~400 triệu USD/năm; Chapter 11 năm 2017, thanh lý 2018. Bảng cơ cấu vốn là ước tính minh họa cơ chế."
    key_calculations:
      - "Trước LBO: 0,30 x 4% + 0,70 x 12% = 9,6%"
      - "Sau LBO: 0,85 x 7,5% + 0,15 x 25% = 10,125%"
      - "Kỳ vọng ngây thơ (Ke giữ 12%): 0,85 x 7,5% + 0,15 x 12% = 8,175%"
      - "D/E tăng từ 0,43 lên 5,67"
    lesson: "Ke và Kd cùng tăng khi đòn bẩy tăng (M&M II) nên lợi ích nợ rẻ bị xóa; WACC hình chữ U; chi phí kiệt quệ nằm ngoài WACC. Kết hợp stress test, Interest Coverage, DSCR."
    data_reliability: "illustrative"
  - name: "Tâm An (Bình Dương) - Nội thất, WACC khi không có dữ liệu thị trường"
    type: "sme"
    setup: "Dự án A: vốn 6.000, FCFF 1.800/năm x 5 năm, cùng lĩnh vực; bank cho vay 100% lãi 10,5%. Dự án B: vốn 4.000, FCFF 1.200/năm x 5, xuất khẩu EU rủi ro hơn. Rf 3,2%, MRP 8%, beta ngành 1,15 (D/E 0,5), T 20%, size 3%, D/E mục tiêu 0,6."
    key_calculations:
      - "D/V=37,5%, E/V=62,5% (E 10.000, D 6.000)"
      - "beta_U = 1,15/1,4 = 0,8214; beta_L = 0,8214 x 1,48 = 1,2157"
      - "Ke = 3,2% + 1,2157 x 8% + 3% = 15,93%; Kd sau thuế = 8,4%"
      - "WACC = 0,625 x 15,93% + 0,375 x 8,4% = 13,10% (nếu dùng sổ sách vốn chủ 5.000 thì 11,82%)"
      - "NPV_A @13,10% = +315,0; IRR_A = 15,24%; biên an toàn ~2,1 điểm %"
      - "NPV_A @8,4% = +1.111,7; @10,5% = +737,1; @Ke 15,93% = -96,0"
      - "B: NPV @13,10% = +210,0 nhưng @16,10% = -80,3; IRR_B = 15,24%"
      - "Sensitivity NPV_A: MRP 7% +433,7; MRP 9% +199,9; size 0% +614,5; size 5% +127,4; Rf 4% +238,9; Kd 9,5% +361,5; Kd 12% +246,4"
      - "WACC 15,10% -> NPV ~ +19,1; 16,10% -> -120,5"
      - "ROIC = 2.400/11.000 = 21,82%; EVA = 2.400 - 11.000 x 13,10% = +958,6"
      - "FCFF B = 1.250 -> IRR 17%, NPV @16,1% ~ +83"
    lesson: "Dùng lãi vay làm hurdle thổi NPV 2,3-3,5 lần; chỉ dùng Ke thì từ chối dự án tốt; cùng IRR 15,24% nhưng A (rủi ro bằng DN) nhận, B (rủi ro cao hơn) từ chối. Size premium là giả định nhạy nhất."
    data_reliability: "illustrative"
  - name: "Doanh nghiệp ABC - ví dụ WACC cơ bản"
    type: "sme"
    setup: "E=600 tỷ, D=400 tỷ, Ke 14%, Kd 9%, T 20%."
    key_calculations: ["WACC = 8,4% + 2,88% = 11,28%"]
    lesson: "Mỗi 100 đồng vốn cần tạo tối thiểu 11,28 đồng; dự án IRR < 11,28% (cùng rủi ro) phá hủy giá trị."
    data_reliability: "illustrative"
  - name: "Vinamilk vs FPT - cùng thị trường, Ke khác nhau theo beta"
    type: "success"
    setup: "Rf 3,5%, MRP 8%; VNM beta 0,75, FPT beta 1,3."
    key_calculations: ["VNM: 3,5% + 0,75 x 8% = 9,5%", "FPT: 3,5% + 1,3 x 8% = 13,9%", "Chênh 4,4 điểm %"]
    lesson: "Dự án công nghệ phải vượt rào cao hơn dự án thực phẩm vì dòng tiền nhạy chu kỳ hơn; beta là số minh họa."
    data_reliability: "illustrative"

worked_examples:
  - name: "WACC cơ bản (Bài 1)"
    inputs: {E: 8000, D: 2000, Ke: 0.14, Kd: 0.10, T: 0.2}
    steps: ["E/V = 80%, D/V = 20%", "Kd sau thuế = 8%", "WACC = 0,8 x 14% + 0,2 x 8% = 11,2% + 1,6%"]
    result: "WACC = 12,8%"
  - name: "Beta qua Hamada (Bài 3)"
    inputs: {beta_L_comp: 1.0, DE_comp: 0.25, DE_target: 0.5, T: 0.2}
    steps: ["beta_U = 1,0/(1+0,8x0,25) = 0,8333", "beta_L = 0,8333 x (1+0,8x0,5) = 1,1667"]
    result: "beta_L = 1,1667"
  - name: "Trà sữa Mây Xanh - cửa hàng thứ 6 (Bài 6)"
    inputs: {Rf: 0.033, MRP: 0.08, Size: 0.03, beta_comp: 1.1, DE_comp: 0.4, DE_target: 0.5, Kd: 0.11, T: 0.2, CF: [-1200, 380, 380, 380, 380, 380]}
    steps:
      - "beta_U = 1,1/(1+0,8x0,4) = 0,8333; beta_L = 0,8333 x 1,4 = 1,1667"
      - "Ke = 3,3% + 1,1667 x 8% + 3% = 15,63%"
      - "Wd = 0,5/1,5 = 33,3%; Kd sau thuế = 8,8%"
      - "WACC = 0,6667 x 15,63% + 0,3333 x 8,8% = 13,36%"
      - "NPV @13,36% = +125,0; IRR = 17,57%"
      - "NPV @Ke 15,63% = +54,9; NPV @11% = +204,4 (thổi phồng 1,6 lần)"
    result: "Chấp nhận (IRR 17,57% > 13,36%); dùng lãi vay 11% làm NPV phình ~1,6 lần"
  - name: "MCC theo bậc (Bài 5)"
    inputs: {We: 0.5, Wd: 0.5, T: 0.2, retained: 1500, Ke_ret: 0.14, Ke_new: 0.15, cheap_debt: 1000, Kd_cheap: 0.09, Kd_high: 0.11}
    steps:
      - "Điểm gãy nợ rẻ = 1.000/0,5 = 2.000; điểm gãy lợi nhuận giữ lại = 1.500/0,5 = 3.000"
      - "0-2.000: 0,5x14% + 0,5x9%x0,8 = 10,6%"
      - "2.000-3.000: 0,5x14% + 0,5x11%x0,8 = 11,4%"
      - ">3.000: 0,5x15% + 0,5x11%x0,8 = 11,9%"
    result: "MCC 10,6% / 11,4% / 11,9%"
  - name: "Ke theo Gordon (Bài 4) và CAPM + size (Bài 2)"
    inputs: {D0: 1800, g: 0.06, P0: 30000, Rf: 0.035, beta: 0.9, MRP: 0.08, Size: 0.02}
    steps: ["D1 = 1.908; Ke = 6,36% + 6% = 12,36%", "CAPM = 3,5% + 0,9x8% = 10,7%; + size 2% = 12,7%"]
    result: "Gordon 12,36%; CAPM 10,7% (12,7% có size)"
  - name: "Quy đổi USD sang VNĐ và EV theo WACC"
    inputs: {K_usd: 0.10, pi_vn: 0.045, pi_us: 0.02, FCF1: 700, g: 0.04}
    steps: ["K_VND = 1,10 x 1,045/1,02 - 1 = 12,70%", "EV @10% = 700/0,06 = 11.667; @12% = 8.750 (-25%)"]
    result: "K_VND = 12,70%; EV giảm 25% khi WACC +2 điểm"

practice_questions:
  - {q: "DN có vốn chủ thị trường 8.000 triệu, nợ 2.000 triệu, Ke 14%, Kd 10%, T 20%. Tính WACC.", a: "12,8%"}
  - {q: "Rf 3,5%, MRP 8%, beta 0,9. Tính Ke; nếu cộng size premium 2% thì Ke? Vì sao cần premium?", a: "10,7%; 12,7%. DN nhỏ có lợi suất kỳ vọng cao hơn CAPM dự đoán (khó huy động vốn, phụ thuộc ít khách hàng/chủ)."}
  - {q: "Comparable beta 1,0, D/E 0,25, T 20%. DN bạn D/E mục tiêu 0,5. Beta?", a: "beta_U = 0,8333; beta_L = 1,1667"}
  - {q: "D0=1.800đ, g=6%, P0=30.000đ. Tính Ke; vì sao không dùng cho DN không trả cổ tức?", a: "Ke = 12,36%. Mô hình dựa trên dòng cổ tức; D=0 không suy ra được Ke."}
  - {q: "Cơ cấu mục tiêu 50/50, T 20%. Lợi nhuận giữ lại 1.500 (Ke 14%), vốn mới Ke 15%; nợ 1.000 đầu tiên 9%, vượt 11%. Điểm gãy và MCC?", a: "Điểm gãy 2.000 và 3.000; MCC 10,6%, 11,4%, 11,9%."}
  - {q: "Mây Xanh: vốn 1.200, FCFF 380 x 5 năm, Rf 3,3%, MRP 8%, size 3%, beta comp 1,1 (D/E 0,4), D/E mục tiêu 0,5, Kd 11%, T 20%. Tính WACC, NPV, IRR; so với dùng lãi vay.", a: "WACC 13,36%; NPV +125,0; IRR 17,57%; NPV @11% = +204,4 (thổi phồng ~1,6 lần), @Ke 15,63% = +54,9."}
  - {q: "Vì sao chỉ Kd nhân (1-T) mà Ke thì không?", a: "Lãi vay trừ trước thuế nên tiết kiệm T đồng thuế/đồng lãi; cổ tức chi từ lợi nhuận sau thuế, không được hoàn thuế."}
  - {q: "Trái phiếu mệnh giá 1.000, coupon 10%, còn 5 năm, giá 950. Kd?", a: "YTM = 11,37%, không phải 10%."}
  - {q: "K_USD 10%, lạm phát VN 4,5%, Mỹ 2%. K_VND?", a: "12,70%"}
  - {q: "NOPAT 900, IC 6.000, WACC 12%. ROIC và EVA?", a: "ROIC 15%; EVA +180."}
  - {q: "Vì sao LBO với 85% nợ không làm WACC giảm như kỳ vọng?", a: "Ke tăng 12% -> 25%, Kd tăng; WACC 9,6% -> 10,125% thay vì 8,175%; thêm chi phí kiệt quệ ngoài công thức."}
  - {q: "Tâm An dự án A tại các r: 8,4%, 10,5%, 13,10%, 15,93%. Kết luận?", a: "NPV +1.111,7; +737,1; +315,0; -96,0. Đúng là 13,10% (chấp nhận); lãi vay thổi phồng, chỉ Ke quá khắt khe."}

checklist:
  - "Đã dùng market value hoặc cơ cấu vốn mục tiêu (không sổ sách) cho E, D?"
  - "Đã tính We, Wd?"
  - "Ke qua CAPM: Rf = TPCP 10 năm; beta unlever/relever đúng; nguồn MRP rõ; CRP và size premium đã cân nhắc (không cộng đôi)?"
  - "Kd = lãi vay mới hoặc YTM; sau thuế Kd(1-T); DN đủ lợi nhuận chịu thuế và trong giới hạn khấu trừ lãi vay?"
  - "Ke > Kd, WACC < Ke, WACC trong khoảng hợp lý (SME 11-18%, DN lớn 8-15%)?"
  - "Đã so với WACC comparable?"
  - "Đã chạy sensitivity ±1-2% (MRP, size, Kd, Rf)?"
  - "Dòng tiền và tỷ lệ nhất quán: danh nghĩa/thực, VNĐ/USD, FCFF-WACC, FCFE-Ke?"
  - "Dự án rủi ro khác DN đã dùng project rate? Không dùng lãi vay làm hurdle?"
  - "Cơ cấu vốn đổi lớn: đã dùng APV? Huy động nhiều: đã dùng MCC?"
  - "ROIC > WACC? Đã báo biên an toàn (IRR - r)?"
  - "Đã đặt lịch cập nhật WACC hàng năm hoặc khi lãi suất/cơ cấu vốn đổi?"

excel_google_sheets_templates:
  - "TAB1 INPUTS (ô xanh nhập tay): Rf, MRP, beta_L comps, D/E comps, T, size premium, Kd, D/E mục tiêu"
  - "TAB2 BETA: BetaU = BetaL_comps/(1+(1-T)*DE_comps); BetaL = BetaU*(1+(1-T)*DE_target)"
  - "TAB3 WACC: Ke = Rf+BetaL*MRP+Size; Kd_at = Kd*(1-T); Wd = DE_target/(1+DE_target); We = 1-Wd; WACC = We*Ke+Wd*Kd_at"
  - "TAB4 PROJECT: FCFF, r = WACC + premium; =NPV(r,CF1:CF5)+CF0; =IRR(CF0:CF5)"
  - "TAB5 SENSITIVITY: Data Table 2 chiều WACC (±3%) x size premium/MRP -> NPV"
  - "Hàm hữu ích: =RATE(5,100,-950,1000) cho YTM; =SLOPE(ret_stock, ret_market) cho beta"
