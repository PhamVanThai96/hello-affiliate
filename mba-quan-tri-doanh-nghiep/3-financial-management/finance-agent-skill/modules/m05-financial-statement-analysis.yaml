# m05 - Phân tích báo cáo tài chính (distill từ 05-financial-statement-analysis.md)
id: "m05"
name_vi: "Phân tích báo cáo tài chính"
name_en: "Financial Statement Analysis"
purpose: >
  Đọc hiểu 3 báo cáo tài chính (Balance Sheet, Income Statement, Cash Flow Statement), tính và diễn giải các nhóm tỷ số
  (sinh lời, thanh khoản, đòn bẩy, hiệu quả hoạt động), phân rã ROE bằng DuPont, phát hiện red flag và chất lượng lợi nhuận,
  để trả lời: doanh nghiệp kiếm tiền thế nào, có đủ tiền sống sót và trả nợ không, dùng vốn hiệu quả và tăng trưởng bền vững không.
when_to_use:
  - "Chủ SME hỏi 'quán/công ty tôi có khỏe về tài chính không?', 'có lãi mà sao hết tiền?'"
  - "Cần tính/diễn giải tỷ số (margin, ROE, ROA, ROIC, Current/Quick/Cash Ratio, D/E, Interest Coverage, DIO/DSO/DPO/CCC)."
  - "Cần phân rã ROE (DuPont 3 hoặc 5 thành phần) để biết ROE đến từ biên lợi nhuận, vòng quay tài sản hay đòn bẩy."
  - "Rà soát BCTC của đối tác, đối thủ, mục tiêu M&A hoặc hồ sơ vay/gọi vốn: red flags, quality of earnings, off-balance sheet."
  - "Lập khung theo dõi tài chính hàng tháng/quý trên Excel/Google Sheets cho SME."
  - "So sánh qua thời gian (trend), cơ cấu (common-size) hoặc với ngành (cross-sectional)."
prerequisites: []
related_modules:
  - "m06 - Quản trị vốn lưu động: DIO/DSO/DPO/CCC chi tiết, tối ưu công nợ và tồn kho"
  - "m04 - Cấu trúc vốn: D/E, Interest Coverage, đòn bẩy tài chính và ROE"
  - "m03 - Chi phí vốn: so ROIC với WACC để xét tạo giá trị"
  - "m10 - Định giá doanh nghiệp: dữ liệu BCTC (EBIT, NOPAT, FCF) là đầu vào của DCF/multiples"
  - "m02 - Thẩm định dự án: dùng BCTC/dòng tiền lịch sử để dự phóng"
  - "m09 - M&A: due diligence BCTC, quality of earnings"
  - "m07 - Chính sách cổ tức: rút/chia lợi nhuận ảnh hưởng thanh khoản"
  - "m11 - Integrated guide: ghép phân tích BCTC vào bài toán tổng hợp"

concepts:
  - term_vi: "Phân tích báo cáo tài chính"
    term_en: "Financial Statement Analysis"
    definition: "Dùng BCTC đã lập để trả lời 3 câu hỏi: kiếm tiền thế nào (profitability), đủ tiền sống và trả nợ không (liquidity và solvency), dùng vốn hiệu quả và tăng trưởng bền vững không (efficiency và growth quality)."
    why_it_matters: "Buffett: 'kế toán là ngôn ngữ của kinh doanh'. Không đọc được BCTC thì đàm phán, vay, đầu tư mà không hiểu con số mình chấp nhận."
  - term_vi: "Lợi nhuận khác tiền mặt"
    term_en: "Profit is not Cash"
    definition: "Income Statement theo nguyên tắc dồn tích (accrual): ghi doanh thu khi giao hàng, không phải khi thu tiền. Một DN có lãi vẫn có thể âm tiền mặt và phá sản (insolvency, 'growing broke')."
    why_it_matters: "Là lý do phải đọc cả 3 báo cáo. Ví dụ Nội Thất Gỗ Việt: bán chịu 500tr, COGS 350, opex 80 thì NI +70 nhưng tiền ròng -430 (chưa thu 90 ngày); nếu tiền đầu kỳ 200 thì tiền cuối kỳ -230 (không đủ trả lương/nợ)."
  - term_vi: "Bảng cân đối kế toán"
    term_en: "Balance Sheet"
    definition: "Ảnh chụp (snapshot) tại một thời điểm: Assets = Liabilities + Equity. Chia Current/Non-current theo mốc 12 tháng."
    why_it_matters: "Phương trình luôn đúng vì mọi tài sản đều có nguồn gốc: vay (nợ) hoặc chủ sở hữu (vốn góp, lợi nhuận giữ lại) - nguyên tắc kế toán kép. Ranh giới 12 tháng là nền tảng của nhóm tỷ số thanh khoản."
  - term_vi: "Báo cáo kết quả kinh doanh"
    term_en: "Income Statement"
    definition: "Dòng chảy (flow) theo kỳ, dồn tích: Revenue - COGS = Gross Profit; - SG&A, R&D, D&A = EBIT; - Interest +/- Other = EBT; - Tax = Net Income. EPS = NI / số cổ phiếu lưu hành."
    why_it_matters: "Tách nhiều tầng lợi nhuận để chẩn đoán đúng bệnh: Gross = sản phẩm có lời không; EBIT = hoạt động cốt lõi, so sánh công bằng giữa DN vay nợ khác nhau (chưa trừ lãi); Net = cổ đông thực nhận."
  - term_vi: "Báo cáo lưu chuyển tiền tệ"
    term_en: "Cash Flow Statement"
    definition: "Dòng tiền thật theo 3 nhóm: Operating (OCF), Investing, Financing; tổng = thay đổi tiền (ΔCash). Phương pháp gián tiếp (indirect) bắt đầu từ Net Income rồi điều chỉnh."
    why_it_matters: "Cho thấy khoảng cách lợi nhuận kế toán và tiền thật. Điều chỉnh: cộng khấu hao (non-cash); tăng AR hoặc Inventory thì trừ (tiền kẹt); tăng AP hoặc chi phí phải trả thì cộng (chiếm dụng tạm). DN khỏe lý tưởng: OCF dương mạnh, Investing âm (đang đầu tư), Financing linh hoạt theo giai đoạn."
  - term_vi: "Liên kết 3 báo cáo"
    term_en: "Articulation of statements"
    definition: "(1) Net Income chảy vào Retained Earnings: RE cuối = RE đầu + NI - cổ tức/rút vốn. (2) NI là dòng đầu của OCF. (3) Cash cuối kỳ trên CFS phải khớp tuyệt đối Cash trên Balance Sheet."
    why_it_matters: "Là phép thử tính nhất quán nhanh nhất: không khớp là có sai sót hoặc gian lận. Báo cáo bổ sung: Statement of Changes in Equity và Notes (thuyết minh) - nơi 'sự thật' thường ẩn."
  - term_vi: "Đối tượng sử dụng và mục đích phân tích"
    term_en: "Stakeholders of analysis"
    definition: "Nhà đầu tư (profitability, growth, valuation), chủ nợ/ngân hàng (leverage, liquidity, interest coverage), quản lý (efficiency, margin trend, chi phí bất thường), đối thủ (competitive intelligence), nhà cung cấp (khả năng trả đúng hạn), cơ quan thuế (doanh thu, chi phí hợp lệ), nhân viên (độ ổn định)."
    why_it_matters: "Cùng BCTC nhưng mỗi bên đặt câu hỏi khác; chọn nhóm tỷ số theo người đọc. Ngân hàng VN thường yêu cầu BCTC 2-3 năm gần nhất cộng dòng tiền dự kiến."
  - term_vi: "Tỷ số tài chính"
    term_en: "Ratio Analysis"
    definition: "Chia số tuyệt đối cho một mẫu số phù hợp để so sánh giữa kỳ, giữa quy mô, giữa ngành."
    why_it_matters: "'Lợi nhuận 2 tỷ' vô nghĩa nếu không biết quy mô; tỷ số đo hiệu suất trên mỗi đồng đầu vào (như km trên mỗi lít xăng)."
  - term_vi: "ROE, ROA, ROIC"
    term_en: "Return ratios"
    definition: "ROA đo hiệu quả toàn bộ tài sản bất kể nguồn vốn; ROE đo lợi nhuận trên vốn chủ; ROIC đo lợi nhuận hoạt động sau thuế (NOPAT) trên vốn đầu tư hoạt động (loại tiền thừa, nợ phi hoạt động)."
    why_it_matters: "ROE >= ROA khi vay có lãi suất thấp hơn ROA (đòn bẩy có lợi). ROIC là thước nghiêm khắc nhất, so thẳng với WACC để biết có tạo giá trị thực (ROIC > WACC)."
  - term_vi: "Thanh khoản"
    term_en: "Liquidity"
    definition: "Khả năng trả nợ đến hạn trong 12 tháng bằng tài sản chuyển thành tiền nhanh."
    why_it_matters: "Dùng tỷ lệ (CA/CL) thay vì hiệu số (CA-CL) vì phản ánh biên an toàn tương đối: dư 100tr trên CL 1000tr (10%) mong manh, trên CL 100tr (100%) an toàn. Quick Ratio (acid test) loại Inventory vì tồn kho là tài sản chậm hóa tiền nhất (phải bán được, thành AR, rồi mới thành tiền) - tránh 'ảo tưởng thanh khoản'."
  - term_vi: "Đòn bẩy và khả năng trả lãi"
    term_en: "Leverage and solvency"
    definition: "D/E và Debt/Assets đo rủi ro cấu trúc (mức phụ thuộc nợ); Interest Coverage và Debt/EBITDA đo rủi ro dòng tiền trả nợ hiện tại."
    why_it_matters: "Nợ tạo 2 loại rủi ro khác nhau nên cần cả hai: DN có D/E thấp vẫn có thể mất khả năng trả lãi nếu EBIT sụt mạnh."
  - term_vi: "Chu kỳ chuyển đổi tiền mặt"
    term_en: "Cash Conversion Cycle (CCC)"
    definition: "CCC = DSO + DIO - DPO: số ngày DN phải tự ứng vốn từ lúc chi tiền mua hàng đến lúc thu lại tiền bán hàng."
    why_it_matters: "Mô tả hành trình 1 đồng vốn lưu động: bị đóng băng trong kho (DIO), rồi trong công nợ phải thu (DSO), được giảm bớt nhờ trì hoãn trả nhà cung cấp (DPO, vốn miễn phí nên TRỪ). CCC ngắn hoặc âm (bán lẻ, F&B thu tiền ngay) nghĩa là cần ít vốn lưu động tự có. Dùng 'số ngày' thay 'số vòng quay' vì trực quan hơn cho vận hành."
  - term_vi: "Phân rã DuPont"
    term_en: "DuPont Analysis"
    definition: "ROE = Net Margin x Asset Turnover x Equity Multiplier (3 thành phần); mở rộng 5 thành phần: Tax Burden x Interest Burden x Operating Margin x Asset Turnover x Equity Multiplier."
    why_it_matters: "Phát triển 1920 bởi Donald Brown (kỹ sư DuPont Corporation) để so sánh công bằng hiệu quả giữa các mảng kinh doanh khác quy mô, đặc thù của tập đoàn - không phải cho nhà đầu tư ngoài. ROE tổng như 'triệu chứng sốt', 3 thành phần là 'chẩn đoán nguyên nhân'. Cùng ROE nhưng chất lượng khác nhau: Equity Multiplier là thành phần dễ 'làm đẹp' nhất vì tăng đòn bẩy luôn làm ROE tăng về toán học."
  - term_vi: "Ba mô hình ROE điển hình"
    term_en: "DuPont business archetypes"
    definition: "Luxury (margin 20% x turnover 0.5 x EM 1.5 = 15%): sức mạnh định giá. Retail kiểu Walmart (3% x 2.5 x 2.5 = 18.75%): quay vòng nhanh. Ngân hàng (25% x 0.08 x 10 = 20%): đòn bẩy cực lớn."
    why_it_matters: "ROE tương đương nhưng chất lượng và rủi ro khác nhau: ROE luxury bền vững hơn; ROE ngân hàng phụ thuộc đòn bẩy 10 lần nên Equity có thể bị 'thổi bay' khi tài sản mất giá nhẹ (khủng hoảng 2008)."
  - term_vi: "Phương pháp so sánh"
    term_en: "Trend / Common-size / Cross-sectional"
    definition: "Trend: cùng chỉ số của cùng DN qua 3-5 năm. Common-size: IS chia Revenue, BS chia Total Assets. Cross-sectional: so với đối thủ/trung bình ngành."
    why_it_matters: "Bắt đầu bằng Trend nội bộ (dễ nhất, không cần dữ liệu đối thủ); Common-size hữu ích khi DN tăng trưởng nhanh; Cross-sectional cần cùng ngành (so Current Ratio ngân hàng với quán cà phê là vô nghĩa)."
  - term_vi: "Chất lượng lợi nhuận"
    term_en: "Quality of Earnings"
    definition: "Mức độ lợi nhuận kế toán được hậu thuẫn bởi tiền thật và bền vững: OCF > NI liên tục, doanh thu tăng đi kèm thu tiền, ít khoản một lần, chính sách kế toán nhất quán, khấu hao hợp lý, working capital lành mạnh, kiểm toán sạch."
    why_it_matters: "OCF thấp hơn NI nhiều năm là dấu hiệu thao túng accrual hoặc doanh thu ảo (bài học Enron)."
  - term_vi: "Red flags"
    term_en: "Red flags"
    definition: "Revenue tăng nhưng OCF giảm; AR tăng nhanh hơn Revenue; Inventory tăng bất thường; chi phí 'một lần' lặp lại; Gross margin giảm dần; OCF < NI kéo dài; D/E tăng nhanh; đổi chính sách kế toán; giao dịch bên liên quan; off-balance sheet; nhân sự cấp cao nghỉ bất thường; BCTC phức tạp cố ý."
    why_it_matters: "Là tín hiệu để đào sâu (không phải kết luận gian lận); mỗi dấu hiệu gắn một hướng kiểm tra cụ thể."
  - term_vi: "VAS và IFRS"
    term_en: "VAS vs IFRS"
    definition: "VAS đơn giản hơn: fair value hạn chế, lease ít chặt chẽ, doanh thu ít chi tiết, công cụ tài chính đơn giản, thuyết minh ít. IFRS: fair value rộng, IFRS 16 (hầu hết thuê lên Balance Sheet), IFRS 15 (doanh thu 5 bước), IFRS 9 (công cụ tài chính), thuyết minh sâu."
    why_it_matters: "SME gọi vốn quỹ nước ngoài thường bị yêu cầu quy đổi gần IFRS; hiểu khác biệt tránh so sánh khập khiễng số liệu VAS với công ty quốc tế (ví dụ nợ thuê tài chính làm D/E IFRS cao hơn)."
  - term_vi: "Đòn bẩy từ chiếm dụng vốn nhà cung cấp"
    term_en: "Supplier financing as free leverage"
    definition: "AP tăng cao (DPO dài) làm Total Assets tăng mà không tốn lãi, nâng Equity Multiplier và ROE."
    why_it_matters: "Giải thích vì sao bán lẻ margin 1.3-1.5% vẫn ROE cao: turnover cao cộng đòn bẩy từ nhà cung cấp, không phải margin dày."

formulas:
  - id: "m05_balance_identity"
    name_vi: "Phương trình kế toán"
    name_en: "Accounting equation"
    expression_latex: '\text{Assets} = \text{Liabilities} + \text{Equity}'
    expression_python: 'assets - (liabilities + equity)'
    excel: "=Assets-(Liabilities+Equity)"
    variables:
      - {symbol: "assets", meaning: "Tổng tài sản", unit: "triệu VNĐ"}
      - {symbol: "liabilities", meaning: "Tổng nợ phải trả", unit: "triệu VNĐ"}
      - {symbol: "equity", meaning: "Vốn chủ sở hữu", unit: "triệu VNĐ"}
    when_to_use: "Kiểm tra Balance Sheet có cân (chênh lệch phải = 0) trước mọi phân tích; dùng khi tự dựng case."
    why_it_works: "Mỗi đồng tài sản được tài trợ bởi nợ hoặc vốn chủ (kế toán kép)."
    assumptions: ["Số liệu cùng một thời điểm, cùng đơn vị"]
    pitfalls: ["Cân không có nghĩa số đúng (có thể sai cả hai vế); vẫn phải đối chiếu Cash với CFS"]
    interpretation: "Kết quả 0 là cân. Khác 0 là lỗi nhập hoặc thiếu khoản mục."
    example:
      inputs: {assets: 900, liabilities: 430, equity: 470}
      steps: ["900 - (430 + 470) = 0"]
      result: "0 (cân đối, Làn Gió Mới cuối kỳ)"
  - id: "m05_retained_earnings"
    name_vi: "Lợi nhuận giữ lại cuối kỳ"
    name_en: "Retained earnings roll-forward"
    expression_latex: 'RE_{end} = RE_{begin} + NI - \text{Dividends/Rút vốn}'
    expression_python: 're_begin + ni - dividends'
    excel: "=RE_dau + NI - CoTuc"
    variables:
      - {symbol: "re_begin", meaning: "Lợi nhuận giữ lại đầu kỳ", unit: "triệu VNĐ"}
      - {symbol: "ni", meaning: "Lợi nhuận ròng kỳ", unit: "triệu VNĐ"}
      - {symbol: "dividends", meaning: "Cổ tức hoặc lợi nhuận chủ rút", unit: "triệu VNĐ"}
    when_to_use: "Nối Income Statement với Balance Sheet; suy ra khoản chủ rút khi biết RE hai kỳ."
    why_it_works: "Lợi nhuận chưa chia ở lại DN làm tăng Equity."
    assumptions: ["Không có điều chỉnh kỳ trước hay khoản trực tiếp vào equity khác"]
    pitfalls: ["Chủ rút tiền không ghi sổ làm RE sai"]
    interpretation: "RE âm là lỗ lũy kế; cuối kỳ tăng nghĩa là DN giữ lại lợi nhuận."
    example:
      inputs: {re_begin: -112, ni: 208, dividends: 126}
      steps: ["-112 + 208 - 126 = -30"]
      result: "-30 (khớp Balance Sheet Làn Gió Mới)"
  - id: "m05_ocf_indirect"
    name_vi: "Dòng tiền kinh doanh (phương pháp gián tiếp)"
    name_en: "Operating Cash Flow (indirect)"
    expression_latex: 'OCF = NI + D\&A - \Delta AR - \Delta Inv - \Delta Prepaid + \Delta AP + \Delta Accrued'
    expression_python: 'ni + dep - d_ar - d_inv - d_prepaid + d_ap + d_accrued'
    excel: "=NI+KhauHao-(AR_cuoi-AR_dau)-(Inv_cuoi-Inv_dau)-(Prepaid_cuoi-Prepaid_dau)+(AP_cuoi-AP_dau)+(Accrued_cuoi-Accrued_dau)"
    variables:
      - {symbol: "ni", meaning: "Lợi nhuận ròng", unit: "triệu VNĐ"}
      - {symbol: "dep", meaning: "Khấu hao và phân bổ (non-cash)", unit: "triệu VNĐ"}
      - {symbol: "d_ar", meaning: "Thay đổi phải thu (cuối - đầu)", unit: "triệu VNĐ"}
      - {symbol: "d_inv", meaning: "Thay đổi tồn kho", unit: "triệu VNĐ"}
      - {symbol: "d_prepaid", meaning: "Thay đổi chi phí trả trước", unit: "triệu VNĐ"}
      - {symbol: "d_ap", meaning: "Thay đổi phải trả nhà cung cấp", unit: "triệu VNĐ"}
      - {symbol: "d_accrued", meaning: "Thay đổi chi phí phải trả", unit: "triệu VNĐ"}
    when_to_use: "Dựng hoặc kiểm tra CFS từ IS và hai Balance Sheet; giải thích vì sao lãi mà tiền giảm."
    why_it_works: "Chuyển lợi nhuận dồn tích về tiền thật: tài sản vận hành tăng thì tiền bị kẹt (trừ), nợ vận hành tăng thì tạm giữ tiền (cộng), khấu hao không chi tiền (cộng)."
    assumptions: ["Mọi khoản vận hành đều thể hiện qua working capital; không có lãi/lỗ bán tài sản"]
    pitfalls: ["Nhầm dấu: tăng tài sản thì TRỪ, tăng nợ thì CỘNG", "Quên khoản trả trước/phải trả"]
    interpretation: "OCF > NI là lành mạnh; OCF < NI kéo dài là cảnh báo chất lượng lợi nhuận."
    example:
      inputs: {ni: 208, dep: 100, d_ar: 10, d_inv: 15, d_prepaid: 2, d_ap: 20, d_accrued: 5}
      steps: ["208 + 100 - 10 - 15 - 2 + 20 + 5 = 306"]
      result: "OCF = 306 triệu (Làn Gió Mới, lớn hơn NI 208)"
  - id: "m05_net_cash_change"
    name_vi: "Thay đổi tiền ròng và tiền cuối kỳ"
    name_en: "Net change in cash"
    expression_latex: '\Delta Cash = OCF + ICF + FCF_{fin}; \quad Cash_{end} = Cash_{begin} + \Delta Cash'
    expression_python: 'cash_begin + ocf + icf + fin_cf'
    excel: "=Tien_dau+OCF+ICF+FinCF"
    variables:
      - {symbol: "cash_begin", meaning: "Tiền đầu kỳ", unit: "triệu VNĐ"}
      - {symbol: "ocf", meaning: "Dòng tiền kinh doanh", unit: "triệu VNĐ"}
      - {symbol: "icf", meaning: "Dòng tiền đầu tư (thường âm)", unit: "triệu VNĐ"}
      - {symbol: "fin_cf", meaning: "Dòng tiền tài chính (vay, trả nợ, cổ tức, buyback)", unit: "triệu VNĐ"}
    when_to_use: "Đối chiếu tiền cuối kỳ CFS với Cash trên Balance Sheet; dự báo thanh khoản."
    why_it_works: "Tiền chỉ thay đổi qua ba loại hoạt động."
    assumptions: ["Không có chênh lệch tỷ giá hoặc tương đương tiền chưa phân loại"]
    pitfalls: ["Quên phân loại trả nợ gốc và cổ tức vào Financing (không phải chi phí)", "Phân loại sai OCF sang Financing để che giấu (Enron)"]
    interpretation: "Phải bằng Cash cuối kỳ trên Balance Sheet; lệch là lỗi hoặc gian lận."
    example:
      inputs: {cash_begin: 90, ocf: 306, icf: -40, fin_cf: -206}
      steps: ["90 + 306 - 40 - 206 = 150"]
      result: "Cash cuối kỳ = 150 (khớp Balance Sheet; ΔCash = +60)"
  - id: "m05_eps"
    name_vi: "Lợi nhuận trên mỗi cổ phiếu"
    name_en: "Earnings per Share (EPS)"
    expression_latex: 'EPS = \frac{NI}{\text{Shares Outstanding}}'
    expression_python: 'ni / shares'
    excel: "=NI/SoCoPhieu"
    variables:
      - {symbol: "ni", meaning: "Lợi nhuận ròng", unit: "triệu VNĐ"}
      - {symbol: "shares", meaning: "Số cổ phiếu lưu hành", unit: "triệu cổ phiếu"}
    when_to_use: "Công ty cổ phần, so lợi nhuận trên mỗi cổ phần; đầu vào của P/E (m10)."
    why_it_works: "Quy lợi nhuận về một đơn vị sở hữu."
    assumptions: ["Dùng số cổ phiếu bình quân gia quyền nếu thay đổi trong kỳ"]
    pitfalls: ["Buyback làm EPS tăng mà không cải thiện kinh doanh"]
    interpretation: "So qua các kỳ và với giá cổ phiếu (P/E)."
    example:
      inputs: {ni: 84, shares: 10}
      steps: ["84 / 10 = 8.4"]
      result: "EPS = 8.4 triệu VNĐ/cổ phiếu (số liệu IS mẫu của nguồn, giả định 10 triệu cp)"
  - id: "m05_gross_margin"
    name_vi: "Biên lợi nhuận gộp"
    name_en: "Gross Margin"
    expression_latex: '\text{Gross Margin} = \frac{\text{Gross Profit}}{\text{Revenue}}'
    expression_python: 'gross_profit / revenue'
    excel: "=LoiNhuanGop/DoanhThu"
    variables:
      - {symbol: "gross_profit", meaning: "Lợi nhuận gộp = Revenue - COGS", unit: "triệu VNĐ"}
      - {symbol: "revenue", meaning: "Doanh thu thuần", unit: "triệu VNĐ"}
    when_to_use: "Đánh giá sức mạnh định giá và kiểm soát giá vốn, trước chi phí vận hành."
    why_it_works: "Chia cho doanh thu để đo hiệu suất trên mỗi đồng bán ra, so được giữa quy mô khác nhau."
    assumptions: ["Cùng cách phân loại COGS giữa các kỳ/DN"]
    pitfalls: ["F&B hay đưa nhân công bếp/thuê vào COGS hay opex khác nhau, so ngành phải cùng định nghĩa"]
    interpretation: "Benchmark chung >30% tốt; quán cà phê specialty 65-75%. Giảm dần là mất pricing power hoặc giá đầu vào tăng."
    example:
      inputs: {gross_profit: 1680, revenue: 2400}
      steps: ["1680 / 2400 = 0.70"]
      result: "70%"
  - id: "m05_operating_margin"
    name_vi: "Biên lợi nhuận hoạt động"
    name_en: "Operating Margin"
    expression_latex: '\text{Operating Margin} = \frac{EBIT}{Revenue}'
    expression_python: 'ebit / revenue'
    excel: "=EBIT/DoanhThu"
    variables:
      - {symbol: "ebit", meaning: "Lợi nhuận trước lãi vay và thuế", unit: "triệu VNĐ"}
      - {symbol: "revenue", meaning: "Doanh thu thuần", unit: "triệu VNĐ"}
    when_to_use: "So hiệu quả vận hành giữa DN có cơ cấu vốn/thuế khác nhau."
    why_it_works: "EBIT chưa trừ lãi vay và thuế nên loại ảnh hưởng cấu trúc vốn."
    assumptions: ["EBIT đã trừ khấu hao"]
    pitfalls: ["Lẫn EBIT với EBITDA"]
    interpretation: ">15% tốt (chung). Với quán: thuê mặt bằng 20% + nhân sự 22.5% = 42.5% doanh thu là hai khoản cần theo dõi nhất."
    example:
      inputs: {ebit: 300, revenue: 2400}
      steps: ["300 / 2400 = 0.125"]
      result: "12.5%"
  - id: "m05_net_margin"
    name_vi: "Biên lợi nhuận ròng"
    name_en: "Net Margin"
    expression_latex: '\text{Net Margin} = \frac{NI}{Revenue}'
    expression_python: 'ni / revenue'
    excel: "=NI/DoanhThu"
    variables:
      - {symbol: "ni", meaning: "Lợi nhuận ròng", unit: "triệu VNĐ"}
      - {symbol: "revenue", meaning: "Doanh thu thuần", unit: "triệu VNĐ"}
    when_to_use: "Bottom line sau mọi chi phí, lãi vay, thuế; thành phần 1 của DuPont."
    why_it_works: "Cho biết mỗi đồng doanh thu còn lại bao nhiêu cho chủ sở hữu."
    assumptions: ["Không có khoản bất thường làm lệch"]
    pitfalls: ["Biên thấp không có nghĩa xấu nếu vòng quay cao (bán lẻ 1-3%)"]
    interpretation: ">10% tốt (chung); quán cà phê độc lập 5-10%; bán lẻ siêu thị 1.3-1.5% vẫn ổn nhờ turnover."
    example:
      inputs: {ni: 208, revenue: 2400}
      steps: ["208 / 2400 = 0.08667"]
      result: "8.67%"
  - id: "m05_roe"
    name_vi: "Tỷ suất sinh lời trên vốn chủ"
    name_en: "Return on Equity (ROE)"
    expression_latex: 'ROE = \frac{NI}{Equity}'
    expression_python: 'ni / equity'
    excel: "=NI/VonCSH"
    variables:
      - {symbol: "ni", meaning: "Lợi nhuận ròng", unit: "triệu VNĐ"}
      - {symbol: "equity", meaning: "Vốn chủ sở hữu (cuối hoặc bình quân kỳ)", unit: "triệu VNĐ"}
    when_to_use: "Đo lợi nhuận trên vốn của cổ đông/chủ sở hữu."
    why_it_works: "Chỉ đồng vốn chủ (không tính phần đi vay)."
    assumptions: ["Equity dương; nhất quán dùng cuối kỳ hay bình quân"]
    pitfalls: ["Equity nhỏ do buyback/lỗ lũy kế làm ROE ảo cao (Apple 171%)", "Equity âm thì ROE vô nghĩa", "Nguồn dùng Equity cuối kỳ"]
    interpretation: ">15% tốt. Luôn hỏi ROE đến từ đâu bằng DuPont; so với ROIC để lọc ảnh hưởng đòn bẩy."
    example:
      inputs: {ni: 208, equity: 470}
      steps: ["208 / 470 = 0.4426"]
      result: "ROE = 44.3%"
  - id: "m05_roa"
    name_vi: "Tỷ suất sinh lời trên tổng tài sản"
    name_en: "Return on Assets (ROA)"
    expression_latex: 'ROA = \frac{NI}{Total\ Assets}'
    expression_python: 'ni / total_assets'
    excel: "=NI/TongTaiSan"
    variables:
      - {symbol: "ni", meaning: "Lợi nhuận ròng", unit: "triệu VNĐ"}
      - {symbol: "total_assets", meaning: "Tổng tài sản", unit: "triệu VNĐ"}
    when_to_use: "Đo hiệu quả dùng toàn bộ tài sản bất kể tài trợ bằng nợ hay vốn."
    why_it_works: "ROA = Net Margin x Asset Turnover; ROE = ROA x Equity Multiplier."
    assumptions: ["Dùng NI sau lãi vay nên hơi thiên lệch với DN vay nhiều"]
    pitfalls: ["So ROA giữa ngành nặng tài sản và ngành nhẹ tài sản"]
    interpretation: ">5% tốt (chung). ROE > ROA khi dùng nợ có lợi."
    example:
      inputs: {ni: 208, total_assets: 900}
      steps: ["208 / 900 = 0.2311"]
      result: "ROA = 23.1%"
  - id: "m05_roic"
    name_vi: "Tỷ suất sinh lời trên vốn đầu tư"
    name_en: "Return on Invested Capital (ROIC)"
    expression_latex: 'ROIC = \frac{NOPAT}{Invested\ Capital},\quad NOPAT = EBIT(1-T),\quad IC = Equity + Debt - Excess\ Cash'
    expression_python: 'ebit * (1 - tax_rate) / (equity + debt - excess_cash)'
    excel: "=EBIT*(1-Thue)/(VonCSH+NoVay-TienThua)"
    variables:
      - {symbol: "ebit", meaning: "Lợi nhuận hoạt động", unit: "triệu VNĐ"}
      - {symbol: "tax_rate", meaning: "Thuế suất", unit: "tỷ lệ"}
      - {symbol: "equity", meaning: "Vốn chủ", unit: "triệu VNĐ"}
      - {symbol: "debt", meaning: "Nợ vay có lãi", unit: "triệu VNĐ"}
      - {symbol: "excess_cash", meaning: "Tiền mặt thừa không phục vụ vận hành", unit: "triệu VNĐ"}
    when_to_use: "Xét có tạo giá trị thật không: ROIC so với WACC; so DN có đòn bẩy khác nhau."
    why_it_works: "Loại tiền nhàn rỗi và nợ phi hoạt động, tách hiệu quả kinh doanh khỏi cấu trúc vốn."
    assumptions: ["Xác định đúng phần tiền thừa (ước lượng chủ quan)", "Nguồn chỉ nêu định nghĩa, công thức chi tiết là cách tính chuẩn bổ sung"]
    pitfalls: ["Định nghĩa Invested Capital không thống nhất giữa nguồn", "Lấy lãi suất danh nghĩa chưa xét thuế suất thực"]
    interpretation: "ROIC > WACC: tạo giá trị; ROIC < WACC: phá hủy giá trị. Apple ~55-60% so với WACC ~10%."
    example:
      inputs: {ebit: 300, tax_rate: 0.2, equity: 470, debt: 320, excess_cash: 150}
      steps: ["NOPAT = 300 x 0.8 = 240", "IC = 470 + 320 - 150 = 640", "ROIC = 240/640 = 0.375"]
      result: "ROIC = 37.5% (minh họa, giả định toàn bộ tiền 150 là thừa)"
  - id: "m05_current_ratio"
    name_vi: "Tỷ số thanh toán hiện hành"
    name_en: "Current Ratio"
    expression_latex: 'CR = \frac{Current\ Assets}{Current\ Liabilities}'
    expression_python: 'ca / cl'
    excel: "=TSNH/NoNganHan"
    variables:
      - {symbol: "ca", meaning: "Tài sản ngắn hạn", unit: "triệu VNĐ"}
      - {symbol: "cl", meaning: "Nợ ngắn hạn", unit: "triệu VNĐ"}
    when_to_use: "Đánh giá khả năng trả nợ 12 tháng tổng quát."
    why_it_works: "Tỷ lệ phản ánh biên an toàn tương đối, hiệu số thì không."
    assumptions: ["Tài sản ngắn hạn chuyển thành tiền đúng hạn"]
    pitfalls: ["Tồn kho ế hoặc AR khó đòi làm CR đẹp giả", "Ngành bán lẻ CR thấp vẫn bình thường vì CCC âm"]
    interpretation: "1.5-2.5 là tốt; <1.0 nguy hiểm; quá cao có thể là tiền/tồn kho nằm im."
    example:
      inputs: {ca: 250, cl: 190}
      steps: ["250 / 190 = 1.316"]
      result: "1.32x (hơi thấp hơn lý tưởng 1.5-2.5)"
  - id: "m05_quick_ratio"
    name_vi: "Tỷ số thanh toán nhanh"
    name_en: "Quick Ratio (Acid-test)"
    expression_latex: 'QR = \frac{CA - Inventory}{CL}'
    expression_python: '(ca - inventory) / cl'
    excel: "=(TSNH-TonKho)/NoNganHan"
    variables:
      - {symbol: "ca", meaning: "Tài sản ngắn hạn", unit: "triệu VNĐ"}
      - {symbol: "inventory", meaning: "Hàng tồn kho", unit: "triệu VNĐ"}
      - {symbol: "cl", meaning: "Nợ ngắn hạn", unit: "triệu VNĐ"}
    when_to_use: "Thử thách khắc nghiệt hơn Current Ratio, nhất là khi tồn kho lớn (thời trang, bán lẻ)."
    why_it_works: "Loại Inventory vì chậm và bất định hóa tiền nhất."
    assumptions: ["Phần còn lại (tiền, AR) hóa tiền nhanh"]
    pitfalls: ["Nguồn chỉ loại Inventory, không loại thêm Prepaid"]
    interpretation: ">1.0 an toàn tối thiểu. Khoảng cách CR - QR lớn nghĩa là phụ thuộc tồn kho (thời trang tồn 70% CA thì QR thấp hơn nhiều)."
    example:
      inputs: {ca: 250, inventory: 60, cl: 190}
      steps: ["(250 - 60) / 190 = 1.0"]
      result: "1.0x (đúng ngưỡng tối thiểu)"
  - id: "m05_cash_ratio"
    name_vi: "Tỷ số tiền mặt"
    name_en: "Cash Ratio"
    expression_latex: 'Cash\ Ratio = \frac{Cash}{CL}'
    expression_python: 'cash / cl'
    excel: "=TienMat/NoNganHan"
    variables:
      - {symbol: "cash", meaning: "Tiền và tương đương tiền", unit: "triệu VNĐ"}
      - {symbol: "cl", meaning: "Nợ ngắn hạn", unit: "triệu VNĐ"}
    when_to_use: "Thước đo khắt khe nhất, khi lo nợ đến hạn gấp."
    why_it_works: "Chỉ tiền thật mới trả nợ ngay."
    assumptions: ["Tiền không bị hạn chế sử dụng"]
    pitfalls: ["Quá cao là tiền nằm im, chi phí cơ hội"]
    interpretation: ">0.2 là đủ; 0.79 là dư dả, cân nhắc đầu tư marketing/mở rộng."
    example:
      inputs: {cash: 150, cl: 190}
      steps: ["150 / 190 = 0.789"]
      result: "0.79x"
  - id: "m05_ocf_ratio"
    name_vi: "Tỷ số dòng tiền kinh doanh trên nợ ngắn hạn"
    name_en: "Operating Cash Flow Ratio"
    expression_latex: 'OCFR = \frac{OCF}{CL}'
    expression_python: 'ocf / cl'
    excel: "=OCF/NoNganHan"
    variables:
      - {symbol: "ocf", meaning: "Dòng tiền từ kinh doanh", unit: "triệu VNĐ"}
      - {symbol: "cl", meaning: "Nợ ngắn hạn", unit: "triệu VNĐ"}
    when_to_use: "Xem dòng tiền thực có tự đủ trả nợ ngắn hạn, không dựa vào bán tài sản."
    why_it_works: "Dựa trên dòng tiền chứ không phải số dư tại một thời điểm."
    assumptions: ["OCF kỳ này đại diện cho kỳ tới"]
    pitfalls: ["OCF biến động theo mùa vụ"]
    interpretation: ">1.0 tốt."
    example:
      inputs: {ocf: 306, cl: 190}
      steps: ["306 / 190 = 1.61"]
      result: "1.61x (tính bổ sung từ số liệu case)"
  - id: "m05_debt_to_equity"
    name_vi: "Tỷ số nợ trên vốn chủ"
    name_en: "Debt-to-Equity (D/E)"
    expression_latex: 'D/E = \frac{Total\ Debt}{Equity}'
    expression_python: 'debt / equity'
    excel: "=NoVay/VonCSH"
    variables:
      - {symbol: "debt", meaning: "Nợ vay có lãi (case dùng ngắn hạn đến hạn + dài hạn)", unit: "triệu VNĐ"}
      - {symbol: "equity", meaning: "Vốn chủ", unit: "triệu VNĐ"}
    when_to_use: "Đo mức phụ thuộc nợ (rủi ro cấu trúc)."
    why_it_works: "So 'tiền người khác' với 'tiền của mình'."
    assumptions: ["Thống nhất định nghĩa Total Debt (có lãi hay toàn bộ nợ phải trả)"]
    pitfalls: ["Nguồn dùng 2 định nghĩa: D/E case SME dùng nợ có lãi (0.68) còn Debt/Assets dùng tổng nợ phải trả; luôn nêu rõ", "Thuê tài chính IFRS 16 làm tăng nợ"]
    interpretation: ">2.0 thận trọng. D/E tăng nhanh là red flag."
    example:
      inputs: {debt: 320, equity: 470}
      steps: ["(80 + 240) = 320", "320 / 470 = 0.681"]
      result: "0.68x"
  - id: "m05_debt_to_assets"
    name_vi: "Tỷ số nợ trên tổng tài sản"
    name_en: "Debt-to-Assets"
    expression_latex: 'D/A = \frac{Total\ Debt}{Total\ Assets}'
    expression_python: 'debt / total_assets'
    excel: "=Tongno/TongTaiSan"
    variables:
      - {symbol: "debt", meaning: "Tổng nợ (case dùng tổng nợ phải trả gồm AP)", unit: "triệu VNĐ"}
      - {symbol: "total_assets", meaning: "Tổng tài sản", unit: "triệu VNĐ"}
    when_to_use: "% tài sản tài trợ bằng nợ."
    why_it_works: "Đo rủi ro cấu trúc theo tài sản."
    assumptions: ["Định nghĩa nợ nhất quán"]
    pitfalls: ["Nợ gồm AP không lãi làm tỷ số cao hơn mức rủi ro thực"]
    interpretation: ">60% rủi ro."
    example:
      inputs: {debt: 430, total_assets: 900}
      steps: ["430 / 900 = 0.478"]
      result: "47.8%"
  - id: "m05_interest_coverage"
    name_vi: "Khả năng thanh toán lãi vay"
    name_en: "Interest Coverage (TIE)"
    expression_latex: 'ICR = \frac{EBIT}{Interest\ Expense}'
    expression_python: 'ebit / interest'
    excel: "=EBIT/ChiPhiLaiVay"
    variables:
      - {symbol: "ebit", meaning: "Lợi nhuận hoạt động", unit: "triệu VNĐ"}
      - {symbol: "interest", meaning: "Chi phí lãi vay", unit: "triệu VNĐ"}
    when_to_use: "Đánh giá lợi nhuận hoạt động có đủ trả lãi ngay kỳ này; ngân hàng hay dùng khi duyệt vay."
    why_it_works: "Đo rủi ro dòng tiền trả lãi hiện tại, bổ sung cho D/E."
    assumptions: ["EBIT ổn định"]
    pitfalls: ["EBIT biến động mạnh theo chu kỳ", "Lãi vốn hóa không nằm trong chi phí lãi"]
    interpretation: "<3x nguy hiểm; 7.5x rất an toàn."
    example:
      inputs: {ebit: 300, interest: 40}
      steps: ["300 / 40 = 7.5"]
      result: "7.5x"
  - id: "m05_debt_to_ebitda"
    name_vi: "Nợ trên EBITDA"
    name_en: "Debt/EBITDA"
    expression_latex: 'Debt/EBITDA = \frac{Total\ Debt}{EBIT + D\&A}'
    expression_python: 'debt / (ebit + dep)'
    excel: "=NoVay/(EBIT+KhauHao)"
    variables:
      - {symbol: "debt", meaning: "Nợ vay có lãi", unit: "triệu VNĐ"}
      - {symbol: "ebit", meaning: "EBIT", unit: "triệu VNĐ"}
      - {symbol: "dep", meaning: "Khấu hao và phân bổ", unit: "triệu VNĐ"}
    when_to_use: "Ước số năm cần trả hết nợ nếu dùng toàn bộ EBITDA."
    why_it_works: "Quy nợ thành số năm dòng tiền hoạt động thô."
    assumptions: ["EBITDA = EBIT + D&A"]
    pitfalls: ["Bỏ qua capex, thuế, lãi nên lạc quan"]
    interpretation: ">4x rủi ro."
    example:
      inputs: {debt: 320, ebit: 300, dep: 100}
      steps: ["EBITDA = 400", "320 / 400 = 0.8"]
      result: "0.8x (tính bổ sung từ số liệu case)"
  - id: "m05_inventory_turnover"
    name_vi: "Vòng quay hàng tồn kho"
    name_en: "Inventory Turnover"
    expression_latex: 'IT = \frac{COGS}{Avg\ Inventory}'
    expression_python: 'cogs / ((inv_begin + inv_end) / 2)'
    excel: "=COGS/AVERAGE(TonDau,TonCuoi)"
    variables:
      - {symbol: "cogs", meaning: "Giá vốn hàng bán", unit: "triệu VNĐ"}
      - {symbol: "inv_begin", meaning: "Tồn kho đầu kỳ", unit: "triệu VNĐ"}
      - {symbol: "inv_end", meaning: "Tồn kho cuối kỳ", unit: "triệu VNĐ"}
    when_to_use: "Đo tốc độ bán hết tồn kho."
    why_it_works: "Dùng COGS (cùng giá vốn với tồn kho, không dùng doanh thu có lãi) và tồn kho bình quân để tránh lệch thời điểm."
    assumptions: ["Tồn kho bình quân đại diện cho cả kỳ"]
    pitfalls: ["Mùa vụ làm bình quân hai điểm sai lệch"]
    interpretation: "Cao là bán nhanh; quá cao có thể thiếu hàng."
    example:
      inputs: {cogs: 720, inv_begin: 45, inv_end: 60}
      steps: ["avg = 52.5", "720 / 52.5 = 13.71"]
      result: "13.7 vòng/năm"
  - id: "m05_dio"
    name_vi: "Số ngày tồn kho"
    name_en: "Days Inventory Outstanding (DIO)"
    expression_latex: 'DIO = \frac{365}{Inventory\ Turnover}'
    expression_python: '365 / inventory_turnover'
    excel: "=365/VongQuayTonKho"
    variables:
      - {symbol: "inventory_turnover", meaning: "Vòng quay tồn kho", unit: "lần/năm"}
    when_to_use: "Diễn đạt tồn kho nằm kho bao lâu."
    why_it_works: "Số ngày gắn với vận hành hàng ngày hơn số vòng."
    assumptions: ["365 ngày/năm; kỳ quý dùng 90"]
    pitfalls: ["Làm tròn trung gian gây lệch CCC (nguồn 27 ngày so với 26.6 chưa làm tròn)"]
    interpretation: "F&B nguyên liệu tươi nên ngắn (~27 ngày là hợp lý)."
    example:
      inputs: {inventory_turnover: 13.714285714285714}
      steps: ["365 / 13.714 = 26.61"]
      result: "26.6 ngày"
  - id: "m05_ar_turnover"
    name_vi: "Vòng quay phải thu"
    name_en: "AR Turnover"
    expression_latex: 'ART = \frac{Revenue}{Avg\ AR}'
    expression_python: 'revenue / ((ar_begin + ar_end) / 2)'
    excel: "=DoanhThu/AVERAGE(ARdau,ARcuoi)"
    variables:
      - {symbol: "revenue", meaning: "Doanh thu (lý tưởng là doanh thu bán chịu)", unit: "triệu VNĐ"}
      - {symbol: "ar_begin", meaning: "Phải thu đầu kỳ", unit: "triệu VNĐ"}
      - {symbol: "ar_end", meaning: "Phải thu cuối kỳ", unit: "triệu VNĐ"}
    when_to_use: "Tốc độ thu hồi công nợ khách."
    why_it_works: "Doanh thu trên công nợ bình quân."
    assumptions: ["Doanh thu đa phần bán chịu; nếu tiền mặt lẫn lộn, tỷ số phình"]
    pitfalls: ["Quán thu tiền ngay: 96 lần chỉ phản ánh mẫu số nhỏ"]
    interpretation: "Cao là thu tiền nhanh."
    example:
      inputs: {revenue: 2400, ar_begin: 20, ar_end: 30}
      steps: ["avg = 25", "2400 / 25 = 96"]
      result: "96 vòng/năm"
  - id: "m05_dso"
    name_vi: "Số ngày thu tiền bình quân"
    name_en: "Days Sales Outstanding (DSO)"
    expression_latex: 'DSO = \frac{365}{AR\ Turnover}'
    expression_python: '365 / ar_turnover'
    excel: "=365/VongQuayPhaiThu"
    variables:
      - {symbol: "ar_turnover", meaning: "Vòng quay phải thu", unit: "lần/năm"}
    when_to_use: "Số ngày chờ thu tiền sau bán."
    why_it_works: "Quy vòng quay về ngày."
    assumptions: ["365 ngày"]
    pitfalls: ["DSO tăng nhanh hơn doanh thu là bán chịu quá đà hoặc doanh thu ảo"]
    interpretation: "Càng ngắn càng tốt trừ khi bán chịu là chiến lược; F&B ~3.8 ngày."
    example:
      inputs: {ar_turnover: 96}
      steps: ["365 / 96 = 3.80"]
      result: "3.8 ngày"
  - id: "m05_ap_turnover"
    name_vi: "Vòng quay phải trả"
    name_en: "AP Turnover"
    expression_latex: 'APT = \frac{COGS}{Avg\ AP}'
    expression_python: 'cogs / ((ap_begin + ap_end) / 2)'
    excel: "=COGS/AVERAGE(APdau,APcuoi)"
    variables:
      - {symbol: "cogs", meaning: "Giá vốn hàng bán (xấp xỉ mua hàng)", unit: "triệu VNĐ"}
      - {symbol: "ap_begin", meaning: "Phải trả NCC đầu kỳ", unit: "triệu VNĐ"}
      - {symbol: "ap_end", meaning: "Phải trả NCC cuối kỳ", unit: "triệu VNĐ"}
    when_to_use: "Tốc độ thanh toán nhà cung cấp."
    why_it_works: "COGS thay mua hàng khi không có số mua."
    assumptions: ["COGS xấp xỉ giá trị mua"]
    pitfalls: ["Tăng tồn kho làm mua hàng khác COGS"]
    interpretation: "Thấp nghĩa là trả chậm (DPO dài)."
    example:
      inputs: {cogs: 720, ap_begin: 60, ap_end: 80}
      steps: ["avg = 70", "720 / 70 = 10.29"]
      result: "10.3 vòng/năm"
  - id: "m05_dpo"
    name_vi: "Số ngày trả nhà cung cấp"
    name_en: "Days Payable Outstanding (DPO)"
    expression_latex: 'DPO = \frac{365}{AP\ Turnover}'
    expression_python: '365 / ap_turnover'
    excel: "=365/VongQuayPhaiTra"
    variables:
      - {symbol: "ap_turnover", meaning: "Vòng quay phải trả", unit: "lần/năm"}
    when_to_use: "Đo vốn miễn phí từ nhà cung cấp."
    why_it_works: "Trì hoãn trả tiền là nguồn vốn không lãi."
    assumptions: ["365 ngày"]
    pitfalls: ["Kéo DPO quá dài có thể phạt phí, mất chiết khấu, hỏng quan hệ NCC"]
    interpretation: "Dài hơn thì CCC ngắn hơn nhưng phải giữ uy tín."
    example:
      inputs: {ap_turnover: 10.285714285714286}
      steps: ["365 / 10.2857 = 35.49"]
      result: "35.5 ngày"
  - id: "m05_ccc"
    name_vi: "Chu kỳ chuyển đổi tiền mặt"
    name_en: "Cash Conversion Cycle (CCC)"
    expression_latex: 'CCC = DSO + DIO - DPO'
    expression_python: 'dso + dio - dpo'
    excel: "=DSO+DIO-DPO"
    variables:
      - {symbol: "dso", meaning: "Số ngày thu tiền", unit: "ngày"}
      - {symbol: "dio", meaning: "Số ngày tồn kho", unit: "ngày"}
      - {symbol: "dpo", meaning: "Số ngày trả NCC", unit: "ngày"}
    when_to_use: "Đo số ngày DN tự ứng vốn lưu động; ước nhu cầu vốn lưu động; so sánh mô hình."
    why_it_works: "Tổng thời gian tiền bị đóng băng trong kho và công nợ phải thu trừ thời gian dùng vốn NCC."
    assumptions: ["DSO, DIO, DPO cùng cơ sở 365 ngày"]
    pitfalls: ["Làm tròn trung gian: nguồn ghi -4.6 ngày (3.8 + 27 - 35.4), tính chính xác là -5.07", "DPO kéo dài quá mức làm hại quan hệ"]
    interpretation: "Ngắn/âm là tốt (bán lẻ, F&B thu tiền ngay); mỗi ngày CCC giảm giải phóng một ngày chi phí hoạt động tiền mặt."
    example:
      inputs: {dso: 3.8020833333333335, dio: 26.614583333333336, dpo: 35.486111111111114}
      steps: ["3.80 + 26.61 - 35.49 = -5.07"]
      result: "CCC = -5.07 ngày (nguồn làm tròn -4.6)"
  - id: "m05_asset_turnover"
    name_vi: "Vòng quay tổng tài sản"
    name_en: "Asset Turnover"
    expression_latex: 'AT = \frac{Revenue}{Total\ Assets}'
    expression_python: 'revenue / total_assets'
    excel: "=DoanhThu/TongTaiSan"
    variables:
      - {symbol: "revenue", meaning: "Doanh thu", unit: "triệu VNĐ"}
      - {symbol: "total_assets", meaning: "Tổng tài sản", unit: "triệu VNĐ"}
    when_to_use: "Hiệu quả dùng tài sản tạo doanh thu; thành phần 2 DuPont."
    why_it_works: "Mỗi đồng tài sản sinh bao nhiêu đồng doanh thu."
    assumptions: ["Có thể dùng tài sản bình quân; nguồn dùng cuối kỳ"]
    pitfalls: ["Ngành nặng tài sản (BĐS 0.1-0.5) so với bán lẻ (5-10) không so được"]
    interpretation: "Cao là quay vòng nhanh (bán lẻ); thấp là biên dày (BĐS, luxury, ngân hàng)."
    example:
      inputs: {revenue: 2400, total_assets: 900}
      steps: ["2400 / 900 = 2.667"]
      result: "2.67x"
  - id: "m05_equity_multiplier"
    name_vi: "Hệ số nhân vốn chủ"
    name_en: "Equity Multiplier"
    expression_latex: 'EM = \frac{Total\ Assets}{Equity}'
    expression_python: 'total_assets / equity'
    excel: "=TongTaiSan/VonCSH"
    variables:
      - {symbol: "total_assets", meaning: "Tổng tài sản", unit: "triệu VNĐ"}
      - {symbol: "equity", meaning: "Vốn chủ", unit: "triệu VNĐ"}
    when_to_use: "Đo đòn bẩy tài chính trong DuPont."
    why_it_works: "EM = 1 + (Liabilities/Equity): tài sản gấp bao nhiêu lần vốn chủ."
    assumptions: ["Equity dương"]
    pitfalls: ["Buyback làm EM phình (Apple 5.87)", "Gồm cả AP không lãi, khác D/E"]
    interpretation: "EM cao khuếch đại ROE nhưng cũng khuếch đại rủi ro."
    example:
      inputs: {total_assets: 900, equity: 470}
      steps: ["900 / 470 = 1.915"]
      result: "1.915x"
  - id: "m05_dupont3"
    name_vi: "DuPont 3 thành phần"
    name_en: "3-Component DuPont"
    expression_latex: 'ROE = \frac{NI}{Rev}\times\frac{Rev}{Assets}\times\frac{Assets}{Equity}'
    expression_python: '(ni / revenue) * (revenue / total_assets) * (total_assets / equity)'
    excel: "=(NI/DT)*(DT/TTS)*(TTS/VCSH)"
    variables:
      - {symbol: "ni", meaning: "Lợi nhuận ròng", unit: "triệu VNĐ"}
      - {symbol: "revenue", meaning: "Doanh thu", unit: "triệu VNĐ"}
      - {symbol: "total_assets", meaning: "Tổng tài sản", unit: "triệu VNĐ"}
      - {symbol: "equity", meaning: "Vốn chủ", unit: "triệu VNĐ"}
    when_to_use: "Chẩn đoán ROE đến từ biên lợi nhuận (giá/chi phí), vòng quay (vận hành) hay đòn bẩy."
    why_it_works: "Các mẫu số và tử số triệt tiêu thành NI/Equity; tách ra để xem nguồn gốc."
    assumptions: ["Dùng cùng cơ sở (cuối kỳ hay bình quân) cho Assets và Equity"]
    pitfalls: ["Chỉ nhìn ROE tổng; không kiểm tra EM", "Apple: ROE 171% đến từ buyback, dùng ROIC để đánh giá vận hành"]
    interpretation: "Phân loại: margin cao (luxury), turnover cao (retail), EM cao (ngân hàng). ROE chất lượng cao nếu EM vừa phải."
    example:
      inputs: {ni: 208, revenue: 2400, total_assets: 900, equity: 470}
      steps: ["0.0867 x 2.667 x 1.915 = 0.4426"]
      result: "ROE = 44.3% (khớp 208/470)"
  - id: "m05_dupont5"
    name_vi: "DuPont 5 thành phần"
    name_en: "5-Component DuPont"
    expression_latex: 'ROE = \frac{NI}{EBT}\times\frac{EBT}{EBIT}\times\frac{EBIT}{Rev}\times\frac{Rev}{Assets}\times\frac{Assets}{Equity}'
    expression_python: '(ni / ebt) * (ebt / ebit) * (ebit / revenue) * (revenue / total_assets) * (total_assets / equity)'
    excel: "=(NI/EBT)*(EBT/EBIT)*(EBIT/DT)*(DT/TTS)*(TTS/VCSH)"
    variables:
      - {symbol: "ni", meaning: "Lợi nhuận ròng", unit: "triệu VNĐ"}
      - {symbol: "ebt", meaning: "Lợi nhuận trước thuế", unit: "triệu VNĐ"}
      - {symbol: "ebit", meaning: "Lợi nhuận hoạt động", unit: "triệu VNĐ"}
      - {symbol: "revenue", meaning: "Doanh thu", unit: "triệu VNĐ"}
      - {symbol: "total_assets", meaning: "Tổng tài sản", unit: "triệu VNĐ"}
      - {symbol: "equity", meaning: "Vốn chủ", unit: "triệu VNĐ"}
    when_to_use: "So 2 DN cùng hiệu quả vận hành nhưng khác cơ cấu vay hoặc ưu đãi thuế."
    why_it_works: "Tách Tax Burden (NI/EBT = 1 - T), Interest Burden (EBT/EBIT), Operating Margin, Turnover, Leverage."
    assumptions: ["EBT > 0, EBIT > 0"]
    pitfalls: ["Nguồn viết nhân thêm (1-T) trong biểu thức, thực chất Tax Burden = NI/EBT = 1-T đã nằm trong phân rã (không nhân hai lần)"]
    interpretation: "Làn Gió Mới: Tax Burden 0.8, Interest Burden 0.867, Op Margin 12.5%, AT 2.667, EM 1.915."
    example:
      inputs: {ni: 208, ebt: 260, ebit: 300, revenue: 2400, total_assets: 900, equity: 470}
      steps: ["0.8 x 0.8667 x 0.125 x 2.667 x 1.915 = 0.4426"]
      result: "ROE = 44.3%"
  - id: "m05_growth_rate"
    name_vi: "Tốc độ tăng trưởng giữa các kỳ"
    name_en: "Period-over-period growth (Trend analysis)"
    expression_latex: 'g = \frac{X_t}{X_{t-1}} - 1'
    expression_python: 'x_t / x_prev - 1'
    excel: "=Xt/Xtruoc-1"
    variables:
      - {symbol: "x_t", meaning: "Giá trị kỳ này", unit: "tùy chỉ tiêu"}
      - {symbol: "x_prev", meaning: "Giá trị kỳ trước", unit: "tùy chỉ tiêu"}
    when_to_use: "Phân tích xu hướng; so tốc độ tăng của AR, Inventory, OCF với Revenue, NI."
    why_it_works: "Tốc độ so sánh lệch pha giữa các khoản mục là tín hiệu chất lượng tăng trưởng."
    assumptions: ["Kỳ so sánh tương đương (cùng mùa vụ)"]
    pitfalls: ["Giá trị tuyệt đối nhỏ làm % lớn nhưng không đáng lo (AR 20 sang 30)"]
    interpretation: "AR/Inventory tăng nhanh hơn Revenue kéo dài là red flag."
    example:
      inputs: {x_t: 55, x_prev: 28}
      steps: ["55 / 28 - 1 = 0.964"]
      result: "AR tăng 96.4% (Công ty Y năm 3 trong khi Revenue chỉ +30.8%)"
  - id: "m05_common_size"
    name_vi: "Phân tích cơ cấu (Common-size)"
    name_en: "Common-size percentage"
    expression_latex: '\%_i = \frac{Item_i}{Base}\ (Base = Revenue\ hoặc\ Total\ Assets)'
    expression_python: 'item / base'
    excel: "=Khoanmuc/CoSo"
    variables:
      - {symbol: "item", meaning: "Khoản mục cần quy đổi", unit: "triệu VNĐ"}
      - {symbol: "base", meaning: "Doanh thu (IS) hoặc Tổng tài sản (BS)", unit: "triệu VNĐ"}
    when_to_use: "So cơ cấu chi phí/tài sản giữa các kỳ hoặc giữa DN khác quy mô; DN tăng trưởng nhanh."
    why_it_works: "Quy về % loại hiệu ứng quy mô."
    assumptions: ["Cùng cơ sở"]
    pitfalls: ["Không cho biết tốc độ tăng tuyệt đối"]
    interpretation: "Quán: thuê 20%, nhân sự 22.5%, tiện ích 4%, marketing 5%, khấu hao 4.2%, khác 1.8%."
    example:
      inputs: {item: 480, base: 2400}
      steps: ["480 / 2400 = 0.20"]
      result: "Chi phí thuê = 20% doanh thu"
  - id: "m05_ocf_to_ni"
    name_vi: "Tỷ lệ OCF trên lợi nhuận ròng"
    name_en: "OCF / Net Income (earnings quality)"
    expression_latex: '\text{Cash Conversion of Earnings} = \frac{OCF}{NI}'
    expression_python: 'ocf / ni'
    excel: "=OCF/NI"
    variables:
      - {symbol: "ocf", meaning: "Dòng tiền kinh doanh", unit: "triệu VNĐ"}
      - {symbol: "ni", meaning: "Lợi nhuận ròng", unit: "triệu VNĐ"}
    when_to_use: "Kiểm tra chất lượng lợi nhuận (checklist Quality of Earnings); phát hiện thao túng accrual."
    why_it_works: "Lợi nhuận thật phải biến thành tiền theo thời gian; khoảng cách OCF - NI chính là accruals."
    assumptions: ["NI > 0; DN tăng trưởng nhanh có thể OCF < NI hợp lý do working capital"]
    pitfalls: ["Chỉ số bổ sung (nguồn dùng so sánh OCF với NI, không định danh tỷ lệ)", "Một năm lệch chưa kết luận, cần chuỗi nhiều năm"]
    interpretation: ">1.0 liên tục là tốt; giảm dần xa dưới 1 (Công ty Y: 0.9, 0.53, 0.14) là red flag."
    example:
      inputs: {ocf: 3, ni: 22}
      steps: ["3 / 22 = 0.136"]
      result: "0.14 (Công ty Y năm 3: chỉ 14% lợi nhuận thành tiền)"

procedures:
  - id: "m05_proc_full_analysis"
    name: "Phân tích BCTC toàn diện 5 bước (A-Z)"
    steps:
      - "Bước 0 - Intake: xác định đối tượng dùng (chủ DN, ngân hàng, nhà đầu tư), kỳ, đơn vị, VAS hay IFRS, có kiểm toán không, dữ liệu 2 kỳ Balance Sheet (để lấy bình quân và thay đổi)."
      - "Bước 1 - Đọc 3 báo cáo và kiểm tra tính nhất quán: Assets = Liabilities + Equity (m05_balance_identity); RE cuối = RE đầu + NI - rút (m05_retained_earnings); dựng hoặc kiểm tra OCF gián tiếp, ΔCash = OCF + ICF + Fin; Cash cuối kỳ khớp Balance Sheet. Không khớp thì dừng và hỏi lại số."
      - "Bước 2 - Tính 4 nhóm tỷ số: Profitability (Gross/Operating/Net Margin, ROE, ROA, ROIC); Liquidity (Current, Quick, Cash, OCF ratio); Leverage (D/E, Debt/Assets, Interest Coverage, Debt/EBITDA); Efficiency (Inventory Turnover/DIO, AR Turnover/DSO, AP Turnover/DPO, CCC, Asset Turnover). Nêu rõ định nghĩa mẫu số (cuối kỳ hay bình quân, nợ có lãi hay tổng nợ)."
      - "Bước 3 - DuPont: tách ROE = Net Margin x Asset Turnover x Equity Multiplier (hoặc 5 thành phần); xác định nguồn sức mạnh ROE và độ bền (ROE nhờ margin hay nhờ đòn bẩy); kiểm tra tích khớp ROE trực tiếp."
      - "Bước 4 - Rà red flags và Quality of Earnings: OCF vs NI, AR/Inventory vs Revenue, Gross margin xu hướng, D/E xu hướng, khoản một lần, đổi chính sách kế toán, off-balance sheet, giao dịch bên liên quan."
      - "Bước 5 - So sánh: Trend nội bộ 3-5 kỳ trước; Common-size nếu quy mô thay đổi; Cross-sectional nếu có dữ liệu ngành cùng loại."
      - "Bước 6 - Kết luận và hành động: đánh giá tổng thể, điểm cần cải thiện, cơ hội, lịch theo dõi, hành động cụ thể (ví dụ giữ lại lợi nhuận tăng đệm thanh khoản, đàm phán hạn mức vay dựa trên Interest Coverage)."
    outputs: "Bảng tỷ số kèm công thức, kết quả, diễn giải; phân rã DuPont; bảng red flag có/không và lý do; kết luận 3-5 hành động."
  - id: "m05_proc_profit_vs_cash"
    name: "Chẩn đoán lợi nhuận khác tiền mặt"
    steps:
      - "Lập IS kỳ: Revenue - COGS - Opex = NI."
      - "Lập dòng tiền thật: tiền thu thực tế (trừ phần AR chưa thu) - tiền chi thực tế (COGS đã trả, lương, thuê)."
      - "So NI với ΔCash; chênh lệch giải thích bằng ΔAR, ΔInventory, ΔAP, khấu hao."
      - "Tính tiền cuối kỳ = tiền đầu kỳ + ΔCash; nếu âm hoặc < nghĩa vụ ngắn hạn thì cảnh báo thanh khoản."
      - "Khuyến nghị: thu nợ nhanh/đòi tạm ứng, chiết khấu thanh toán sớm, kéo DPO hợp lý, hạn mức vay vốn lưu động, hạn chế chủ rút tiền."
    outputs: "Bảng so sánh NI và dòng tiền, tiền cuối kỳ, danh sách biện pháp."
  - id: "m05_proc_dupont_diag"
    name: "Chẩn đoán ROE bằng DuPont"
    steps:
      - "Tính Net Margin, Asset Turnover, Equity Multiplier; nhân lại kiểm tra bằng NI/Equity."
      - "Xác định thành phần nổi trội: margin (pricing power), turnover (volume/quay vốn), EM (đòn bẩy)."
      - "Đánh giá chất lượng: ROE nhờ margin/turnover là bền; nhờ EM cao là rủi ro (kiểm tra Interest Coverage, D/E)."
      - "Nếu EM bị phình do buyback hoặc lỗ lũy kế, dùng ROIC để đánh giá vận hành và so với WACC."
      - "Nếu cần tách lãi vay/thuế, dùng 5 thành phần."
      - "So sánh với mô hình chuẩn (luxury, retail, ngân hàng) hoặc đối thủ cùng ngành."
    outputs: "Phân rã ROE, kết luận ROE đến từ đâu, độ bền, khuyến nghị cải thiện thành phần yếu."
  - id: "m05_proc_red_flags"
    name: "Rà soát red flags và chất lượng lợi nhuận"
    steps:
      - "Lập chuỗi 3 kỳ: Revenue, NI, OCF, AR, Inventory, Gross margin, D/E."
      - "Tính tăng trưởng từng khoản mục (m05_growth_rate) và OCF/NI."
      - "Đối chiếu từng dòng bảng Red Flag và Quality of Earnings Checklist (OCF > NI; thu tiền tương ứng doanh thu; không có khoản một lần lặp lại; chính sách kế toán nhất quán; khấu hao hợp lý; WC lành mạnh; không ghi nhận doanh thu sớm; MD&A khớp số; kiểm toán sạch; nội bộ bán cổ phiếu)."
      - "Đọc Thuyết minh: off-balance sheet (SPE, thuê, bảo lãnh), giao dịch bên liên quan, nợ tiềm tàng."
      - "Phân loại: nghiêm trọng (OCF-NI phân kỳ cộng AR vọt), cần theo dõi nhẹ (giá trị tuyệt đối nhỏ), không phát hiện; nêu giả thuyết và việc cần kiểm tra thêm (không kết luận gian lận)."
    outputs: "Bảng red flag, mức nghiêm trọng, giả thuyết, kế hoạch kiểm tra."
  - id: "m05_proc_sme_monitor"
    name: "Thiết lập theo dõi tài chính định kỳ cho SME"
    steps:
      - "Mức 1 - hàng tháng 5 phút: tiền cuối tháng so đầu tháng; doanh thu so tháng trước và cùng kỳ; nợ sắp đến hạn đã đủ tiền chưa."
      - "Mức 2 - hàng quý 30 phút: Net Margin xu hướng; Current Ratio còn > 1.0; Inventory và AR có tăng nhanh hơn doanh thu."
      - "Mức 3 - hàng năm hoặc khi vay/gọi vốn: bộ tỷ số đầy đủ, DuPont, so benchmark hoặc năm trước."
      - "Phân tần suất theo quy mô: hộ/startup <2 tỷ tự làm; SME 2-20 tỷ kế toán chuẩn bị số liệu, chủ đọc; SME lớn chuẩn bị gọi vốn cần kế toán trưởng hoặc fractional CFO."
      - "Dựng Google Sheet 5 tab: Input BS, Input IS, Cash Flow tự tính, Ratios Dashboard (conditional formatting xanh/vàng/đỏ), DuPont và Trend chart."
    outputs: "Lịch kiểm tra, bảng dashboard, quy tắc cảnh báo."
  - id: "m05_proc_compare"
    name: "Chọn phương pháp so sánh"
    steps:
      - "Luôn bắt đầu với Trend nội bộ (3-5 kỳ)."
      - "Khi quy mô thay đổi nhanh hoặc so DN khác cỡ: Common-size."
      - "Khi có dữ liệu ngành đáng tin cậy và cùng loại hình: Cross-sectional; không so chéo ngành."
      - "Ghi rõ nguồn và độ tin cậy benchmark."
    outputs: "Bảng so sánh có nhãn phương pháp và hạn chế."

decision_rules:
  - "Nếu NI dương nhưng OCF âm hoặc ΔCash âm thì kiểm tra AR, Inventory, chu kỳ CCC; cảnh báo thanh khoản và khuyên thu nợ/giữ lại lợi nhuận, không rút tiền chia."
  - "Nếu OCF < NI nhiều kỳ liên tiếp thì nghi vấn chất lượng lợi nhuận, đọc thuyết minh, kiểm tra ghi nhận doanh thu."
  - "Nếu AR (hoặc Inventory) tăng nhanh hơn Revenue kéo dài thì cảnh báo bán chịu quá đà/doanh thu ảo/tồn ế; nếu giá trị tuyệt đối nhỏ so doanh thu thì chỉ theo dõi."
  - "Nếu Current Ratio < 1.0 thì thanh khoản nguy hiểm, xem Quick Ratio và OCF ratio; ngoại lệ bán lẻ CCC âm (cần xác nhận)."
  - "Nếu Quick Ratio < 1.0 nhưng Current Ratio cao thì tài sản dồn ở tồn kho; xem DIO và khả năng thanh lý."
  - "Nếu Cash Ratio > 0.5 và Current Ratio dư thì cân nhắc dùng tiền thừa đầu tư/trả nợ; nếu < 0.2 thì dự phòng tiền mặt."
  - "Nếu Interest Coverage < 3x thì nguy hiểm, không nên tăng vay; nếu > 5x thì còn dư địa vay thêm."
  - "Nếu D/E > 2.0 hoặc Debt/Assets > 60% hoặc Debt/EBITDA > 4x thì rủi ro đòn bẩy cao; đề xuất giảm nợ/tăng vốn chủ."
  - "Nếu ROE cao nhưng Equity Multiplier cao thì ROE chất lượng thấp; dùng ROIC và Interest Coverage để đánh giá."
  - "Nếu ROIC > WACC thì tạo giá trị; nếu ROIC < WACC thì phá hủy giá trị dù có lãi kế toán."
  - "Nếu Net Margin thấp nhưng Asset Turnover cao và CCC âm (bán lẻ) thì vẫn là mô hình tốt; không đánh giá chỉ bằng margin."
  - "Nếu Gross Margin giảm dần thì kiểm tra pricing power, giá đầu vào, khuyến mãi."
  - "Nếu CCC dài thì tối ưu: thu nợ nhanh hơn (DSO), giảm tồn kho (DIO), đàm phán DPO (không phá quan hệ)."
  - "Nếu cần so sánh DN khác cấu trúc vốn thì dùng EBIT/Operating Margin hoặc ROIC thay vì Net Margin/ROE."
  - "Nếu so ngành khác nhau thì không dùng benchmark chéo; chỉ so cùng ngành/loại hình."
  - "Nếu người đọc là ngân hàng thì nhấn Interest Coverage, D/E, OCF, thanh khoản; nếu nhà đầu tư thì ROE, ROIC, growth; nếu chủ DN thì efficiency và chi phí."
  - "Nếu SME trộn lẫn tiền cá nhân và công ty hoặc không trích khấu hao thì dặn tách bạch/chuẩn hóa sổ sách trước khi tin các tỷ số."
  - "Nếu BCTC quá phức tạp, nhiều SPE/giao dịch bên liên quan, hoặc kiểm toán đồng thời tư vấn thì tăng mức hoài nghi."
  - "Nếu DN gọi vốn quốc tế hoặc so với công ty IFRS thì lưu ý khác biệt VAS/IFRS (lease, doanh thu, fair value)."

benchmarks:
  - {metric: "Gross Margin", value: ">30% tốt; quán cà phê specialty 65-75%", context: "Chung và F&B", confidence: "medium"}
  - {metric: "Operating Margin", value: ">15% tốt", context: "Chung", confidence: "medium"}
  - {metric: "Net Margin", value: ">10% tốt; quán độc lập 5-10%; bán lẻ siêu thị 1.3-1.5%", context: "Chung, F&B, bán lẻ", confidence: "medium"}
  - {metric: "ROE", value: ">15% tốt", context: "Chung", confidence: "medium"}
  - {metric: "ROA", value: ">5% tốt", context: "Chung", confidence: "medium"}
  - {metric: "ROIC", value: "> WACC (Apple ~55-60% vs WACC ~10%)", context: "Tạo giá trị", confidence: "medium"}
  - {metric: "Current Ratio", value: "1.5-2.5", context: "Chung", confidence: "medium"}
  - {metric: "Quick Ratio", value: ">1.0", context: "Chung", confidence: "medium"}
  - {metric: "Cash Ratio", value: ">0.2", context: "Chung", confidence: "medium"}
  - {metric: "Operating CF Ratio", value: ">1.0", context: "Chung", confidence: "medium"}
  - {metric: "D/E", value: ">2.0 thận trọng", context: "Chung", confidence: "medium"}
  - {metric: "Debt/Assets", value: ">60% rủi ro", context: "Chung", confidence: "medium"}
  - {metric: "Interest Coverage", value: "<3x nguy hiểm", context: "Chung", confidence: "medium"}
  - {metric: "Debt/EBITDA", value: ">4x rủi ro", context: "Chung", confidence: "medium"}
  - {metric: "DIO F&B", value: "~27 ngày", context: "Quán cà phê nguyên liệu tươi (case minh họa)", confidence: "low"}
  - {metric: "DSO bán lẻ/F&B", value: "2-4 ngày", context: "Thu tiền mặt/thẻ ngay (minh họa)", confidence: "low"}
  - {metric: "CCC bán lẻ hiện đại", value: "âm (ví dụ -8 ngày: DSO 2 + DIO 25 - DPO 35)", context: "Chuỗi siêu thị giả định", confidence: "low"}
  - {metric: "Asset Turnover", value: "Bán lẻ 5-10x; BĐS/luxury 0.1-0.5x; ngân hàng ~0.08x", context: "Theo mô hình", confidence: "low"}
  - {metric: "Chi phí dịch vụ kế toán trọn gói", value: "~2-5 triệu VNĐ/tháng", context: "SME vừa VN, cần xác nhận", confidence: "low"}
  - {metric: "Phần mềm kế toán", value: "MISA SME.NET ~3-8 triệu VNĐ/năm; Fast ~5-10 triệu VNĐ/năm; Excel/Google Sheets miễn phí", context: "VN, cần xác nhận giá hiện hành", confidence: "low"}

pitfalls:
  - "Nhầm lợi nhuận với tiền mặt; thấy lãi trên sổ liền rút tiền chia khi tiền đang kẹt trong AR/Inventory."
  - "Chỉ nhìn một con số ROE (Apple 171%) mà không phân rã DuPont; ROE phình do buyback/đòn bẩy."
  - "So benchmark chéo ngành (Current Ratio ngân hàng với quán cà phê); so DN IFRS với VAS khập khiễng."
  - "Dùng không nhất quán định nghĩa nợ (nợ có lãi hay tổng nợ phải trả) và mẫu số (cuối kỳ hay bình quân)."
  - "Làm tròn trung gian làm lệch CCC (nguồn -4.6, chính xác -5.07)."
  - "Quên trích khấu hao hoặc ghi thẳng tài sản vào chi phí một lần, làm lợi nhuận và xu hướng méo."
  - "Không ghi nhận công nợ phải trả/phải thu ('nợ miệng', khách ghi sổ), BCTC không phản ánh thực."
  - "Không tách chi phí cá nhân và công ty; chủ lấy hàng về nhà không ghi sổ."
  - "Chỉ tổng kết cuối năm nên không phát hiện tháng thiếu tiền theo mùa vụ."
  - "Kết luận gian lận chỉ từ một red flag; red flag chỉ là tín hiệu cần đào sâu."
  - "Bỏ qua Thuyết minh BCTC, nơi giấu off-balance sheet và giao dịch bên liên quan."
  - "Coi nợ NCC là xấu: AP không lãi có thể là đòn bẩy miễn phí, nhưng kéo dài quá mức làm hại quan hệ."
  - "Ghi chú nguồn: Apple 'ROE giả định' dùng nhầm đơn vị (1.15% thay 1.15x); số liệu quốc tế (Apple, Enron) chỉ để minh họa."

sme_vn_guidance:
  - "SME thường không kiểm toán, sổ sách đơn giản, trộn lẫn tiền cá nhân và công ty: độ tin cậy dữ liệu phụ thuộc ý thức ghi chép; việc đầu tiên là tách bạch tài chính và trích khấu hao."
  - "Mục đích SME: quyết định vận hành hằng ngày (có nên mở rộng, có lãi thật không, đủ tiền trả lương tháng sau không) hơn là định giá."
  - "Chủ SME không cần đủ 20+ tỷ số: Mức 1 hằng tháng (dòng tiền ròng, doanh thu so tháng trước/cùng kỳ, nợ sắp đến hạn), Mức 2 hằng quý (Net Margin, Current Ratio > 1.0, tồn kho và AR so doanh thu), Mức 3 hằng năm hoặc khi vay."
  - "Ngân hàng (như Vietcombank) thường yêu cầu BCTC 2-3 năm cộng dòng tiền dự kiến: chuẩn bị Interest Coverage, D/E, OCF, thanh khoản (cần xác nhận với từng ngân hàng)."
  - "Phần mềm: Excel/Google Sheets (miễn phí), MISA SME.NET (~3-8 triệu/năm), Fast Accounting (~5-10 triệu/năm); tham khảo cong-cu-quan-tri-doanh-nghiep-sme.md. Giá cần xác nhận."
  - "Kế toán dịch vụ trọn gói ~2-5 triệu/tháng cho SME vừa (2-20 tỷ doanh thu); SME lớn gọi vốn cần kế toán trưởng hoặc fractional CFO."
  - "Chủ nên tự đọc ít nhất Mức 1 và 2, không phó mặc hoàn toàn cho kế toán."
  - "F&B thu tiền ngay có CCC ngắn hoặc âm, tận dụng để mở rộng chi nhánh ít vốn, nhưng giữ đệm tiền cho mùa thấp điểm (mùa mưa, Tết); chi phí thuê cộng nhân sự thường 40%+ doanh thu."
  - "Gọi vốn nước ngoài có thể yêu cầu quy đổi gần IFRS (lease IFRS 16, doanh thu IFRS 15); thuế TNDN trong case 20% (cần xác nhận quy định hiện hành)."

case_lessons:
  - name: "Nội Thất Gỗ Việt - có lãi nhưng âm tiền"
    type: "failure"
    setup: "Bán 500tr nội thất cho chuỗi khách sạn, trả chậm 90 ngày; COGS 350tr đã trả trước; opex 80tr trả ngay; tiền đầu kỳ 200tr."
    key_calculations:
      - "NI = 500 - 350 - 80 = +70tr"
      - "Dòng tiền ròng = 0 - 350 - 80 = -430tr; OCF theo gián tiếp = NI 70 - ΔAR 500 = -430"
      - "Tiền cuối kỳ = 200 - 430 = -230tr (không đủ trả lương, nợ)"
    lesson: "Lợi nhuận dồn tích không phải tiền; bán chịu dài làm AR phình, DN lãi vẫn có thể phá sản (growing broke). Cần CFS và theo dõi thanh khoản, chính sách tín dụng và hạn mức vốn lưu động."
    data_reliability: "illustrative"
  - name: "Apple FY2023 - ROE 171% không phải tốt nhất"
    type: "success"
    setup: "Mô hình capital-light; Revenue 383B, NI 97B, Total Assets ~333B, Equity ~57B sau hơn 600B USD buyback; ROIC 55-60%; WACC ~10%."
    key_calculations:
      - "Net Margin = 97/383 = 25.3%"
      - "Asset Turnover = 383/333 = 1.15x"
      - "Equity Multiplier = 333/57 = 5.84x (nguồn ghi 5.87)"
      - "ROE = 25.3% x 1.15 x 5.87 = ~171%"
      - "Nếu Equity 150B: EM = 333/150 = 2.22; ROE giả định = 25.3% x 1.15 x 2.22 = 64.6%"
    lesson: "Phần chênh lớn giữa 171% và 64.6% đến từ buyback làm co Equity (đòn bẩy), không phải cải thiện vận hành. Dùng ROIC để đánh giá năng lực vận hành; luôn hỏi 'ROE đến từ đâu'."
    data_reliability: "unverified"
  - name: "Enron - gian lận BCTC (2001)"
    type: "failure"
    setup: "Công ty năng lượng Mỹ phá sản 12/2001; Arthur Andersen sụp đổ; ra đời Sarbanes-Oxley 2002. Số liệu theo nguồn (chưa kiểm chứng): doanh thu 2000 báo cáo $101B, nợ trên BS $13B vs thực $38B+, NI báo cáo $979 triệu nhưng thực lỗ nặng."
    key_calculations:
      - "Mark-to-market: ghi nhận lợi nhuận ước tính cả hợp đồng 20-30 năm ngay năm ký, dựa dự báo giá tự đưa ra."
      - ">3,000 SPE đưa $30B+ nợ ra ngoài Balance Sheet (cần bên thứ ba góp tối thiểu 3% vốn để không hợp nhất); CFO Fastow hưởng lợi cá nhân."
      - "Phí Arthur Andersen: $25 triệu kiểm toán + $27 triệu tư vấn (độc lập bị nghi ngờ)."
    lesson: "Red flags: Revenue tăng mạnh nhưng OCF đi ngang/âm; BCTC phức tạp khó hiểu; off-balance sheet; giao dịch bên liên quan; thưởng gắn giá cổ phiếu; né câu hỏi; nhân sự cấp cao nghỉ đột ngột; kiểm toán đồng thời tư vấn. Bài học: OCF so NI, đọc Thuyết minh, hỏi ai hưởng lợi, độc lập kiểm toán, quản trị với HĐQT độc lập."
    data_reliability: "unverified"
  - name: "Masan/Bách Hóa Xanh - vòng quay nhanh, biên mỏng"
    type: "success"
    setup: "Chuỗi siêu thị mini giả định: vốn chủ 10 tỷ, nợ NCC 10 tỷ, Total Assets 20 tỷ, Net Margin 1.5%, Asset Turnover 9."
    key_calculations:
      - "Revenue = 20 x 9 = 180 tỷ"
      - "NI = 180 x 1.5% = 2.7 tỷ"
      - "ROE = 2.7/10 = 27%; DuPont: 1.5% x 9 x 2 = 27%"
      - "CCC = DSO 2 + DIO 25 - DPO 35 = -8 ngày"
    lesson: "Bán lẻ kiếm lời nhờ quay vòng (turnover) và đòn bẩy miễn phí từ nhà cung cấp, không nhờ margin dày; CCC âm là lợi thế cấu trúc. So sánh với mô hình biên dày vòng quay chậm (BĐS, luxury) có rủi ro thanh khoản và lãi vay. Số liệu giả định minh họa; margin 1.3-1.5% của Masan/WinCommerce chưa xác minh."
    data_reliability: "illustrative"
  - name: "Làn Gió Mới Coffee - SME Việt Nam A-Z"
    type: "sme"
    setup: "Quán cà phê specialty Q.3 TP.HCM, năm thứ 2: Revenue 2,400, COGS 720, EBIT 300, lãi vay 40, thuế 20%, NI 208; Total Assets 900, Equity 470, nợ vay 320; chủ rút 126. Đơn vị triệu VNĐ, số liệu minh họa nhưng nhất quán (BS cân, CFS khớp)."
    key_calculations:
      - "Gross 1680/2400 = 70%; Operating 300/2400 = 12.5%; Net 208/2400 = 8.67%; ROE 208/470 = 44.3%; ROA 208/900 = 23.1%"
      - "Current 250/190 = 1.32x; Quick (250-60)/190 = 1.0x; Cash 150/190 = 0.79x"
      - "D/E (80+240)/470 = 0.68x; Debt/Assets 430/900 = 47.8%; Interest Coverage 300/40 = 7.5x"
      - "Inventory Turnover 720/52.5 = 13.7 (DIO ~26.6); DSO ~3.8; DPO ~35.5; CCC ~ -5.07 (nguồn -4.6); Asset Turnover 2.67x"
      - "DuPont: 8.67% x 2.67 x 1.915 = 44.3%"
      - "OCF = 208 + 100 - 10 - 15 - 2 + 20 + 5 = 306; ΔCash = 306 - 40 - 206 = +60; Cash 90 -> 150"
      - "RE: -112 + 208 - 126 = -30"
    lesson: "Sức khỏe tốt, ROE chất lượng (cân bằng ba thành phần, Interest Coverage 7.5x, OCF 306 > NI 208). Cải thiện: Current Ratio 1.32 hơi thấp, nên giữ lại lợi nhuận thay vì rút 126; CCC âm cho phép mở chi nhánh ít vốn; theo dõi AR (+50%) và Inventory (+33%) mỗi quý dù tuyệt đối nhỏ; dùng Interest Coverage đàm phán vay, ROE thu hút nhà đầu tư."
    data_reliability: "illustrative"
  - name: "Công ty Y - mini case phát hiện red flags"
    type: "failure"
    setup: "Doanh thu 100/130/170 tỷ; NI 10/15/22; OCF 9/8/3; AR 15/28/55; Inventory 10/12/14."
    key_calculations:
      - "Revenue +30%, +30.8%; NI +50%, +46.7%; AR +86.7%, +96.4%"
      - "OCF/NI = 0.90, 0.53, 0.14"
    lesson: "OCF giảm khi NI tăng và AR vọt gấp 2-3 lần tốc độ doanh thu: nghi bán chịu quá mức/channel stuffing/ghi nhận doanh thu sớm; cần điều tra chất lượng AR trước khi tin lợi nhuận."
    data_reliability: "illustrative"

worked_examples:
  - name: "Tính bộ tỷ số thanh khoản cho cửa hàng"
    inputs: {current_assets: 300, inventory: 100, current_liabilities: 200}
    steps:
      - "Current Ratio = 300 / 200 = 1.5"
      - "Quick Ratio = (300 - 100) / 200 = 1.0"
    result: "CR 1.5x (ở ngưỡng tốt 1.5-2.5), QR 1.0x (đạt tối thiểu an toàn); thanh khoản ổn nhưng phụ thuộc 1/3 tài sản ngắn hạn là tồn kho."
  - name: "DuPont ngược từ Net Margin, Turnover, Total Assets, Equity"
    inputs: {net_margin: 0.05, asset_turnover: 1.2, total_assets: 1000, equity: 500}
    steps:
      - "EM = 1000 / 500 = 2"
      - "Revenue = 1.2 x 1000 = 1200"
      - "NI = 5% x 1200 = 60"
      - "ROE = 5% x 1.2 x 2 = 12% (kiểm: 60/500 = 12%)"
    result: "Revenue 1,200 triệu; NI 60 triệu; EM 2x; ROE 12%."
  - name: "CCC trước và sau đàm phán DPO"
    inputs: {dio: 45, dso: 30, dpo_old: 20, dpo_new: 50}
    steps:
      - "CCC cũ = 30 + 45 - 20 = 55 ngày"
      - "CCC mới = 30 + 45 - 50 = 25 ngày"
      - "Giảm 30 ngày vốn lưu động phải tự ứng"
    result: "CCC từ 55 xuống 25 ngày; nhu cầu vốn lưu động tự có giảm, giải phóng tiền cho mở rộng/trả nợ. Lưu ý rủi ro quan hệ NCC."
  - name: "Phân tích ROE Làn Gió Mới từ Balance Sheet và IS"
    inputs: {ni: 208, revenue: 2400, total_assets: 900, equity: 470, ebit: 300, interest: 40}
    steps:
      - "Net Margin = 208/2400 = 8.67%"
      - "Asset Turnover = 2400/900 = 2.667"
      - "EM = 900/470 = 1.915"
      - "ROE = 8.67% x 2.667 x 1.915 = 44.3% (=208/470)"
      - "Interest Coverage = 300/40 = 7.5x nên đòn bẩy 1.915 an toàn"
    result: "ROE 44.3% chất lượng cao: cân bằng margin, turnover và đòn bẩy vừa phải."
  - name: "Dựng CFS Làn Gió Mới và đối chiếu tiền"
    inputs: {ni: 208, dep: 100, d_ar: 10, d_inv: 15, d_prepaid: 2, d_ap: 20, d_accrued: 5, capex: 40, debt_repay: 80, owner_draw: 126, cash_begin: 90}
    steps:
      - "OCF = 208 + 100 - 10 - 15 - 2 + 20 + 5 = 306"
      - "Investing = -40"
      - "Financing = -80 - 126 = -206"
      - "ΔCash = 306 - 40 - 206 = +60; Cash cuối = 150 khớp BS"
      - "Kiểm RE: -112 + 208 - 126 = -30; kiểm BS: 900 = 430 + 470"
    result: "Tiền 90 -> 150; OCF 306 > NI 208; 3 báo cáo nhất quán."
  - name: "Phát hiện red flag Công ty Y"
    inputs: {revenue: [100, 130, 170], ni: [10, 15, 22], ocf: [9, 8, 3], ar: [15, 28, 55]}
    steps:
      - "Revenue growth: 30%, 30.8%"
      - "NI growth: 50%, 46.7%"
      - "AR growth: 86.7%, 96.4%"
      - "OCF/NI: 0.90, 0.53, 0.14"
    result: "Cảnh báo nghiêm trọng: lợi nhuận tăng nhưng tiền không về, AR vọt; cần kiểm tra bán chịu, ghi nhận doanh thu, khả năng thu hồi AR."
  - name: "Bán lẻ ROE 27% từ margin 1.5%"
    inputs: {equity: 10, supplier_credit: 10, net_margin: 0.015, asset_turnover: 9}
    steps:
      - "Total Assets = 20; Revenue = 20 x 9 = 180"
      - "NI = 180 x 1.5% = 2.7"
      - "ROE = 2.7/10 = 27%; DuPont 1.5% x 9 x 2 = 27%"
    result: "ROE 27% (tỷ VNĐ) nhờ turnover 9x và đòn bẩy 2x từ vốn nhà cung cấp."

practice_questions:
  - {q: "Cửa hàng: CA 300tr, Inventory 100tr, CL 200tr. Tính Current và Quick Ratio, nhận xét.", a: "CR = 1.5x, QR = 1.0x; thanh khoản ở ngưỡng an toàn."}
  - {q: "Giải thích vì sao Quick Ratio loại Inventory. Cửa hàng thời trang tồn kho 70% CA thì khoảng cách CR và QR thế nào?", a: "Inventory chậm và bất định hóa tiền nhất; khoảng cách CR - QR rất lớn, QR thấp hơn nhiều so với CR nên thanh khoản thực tế yếu hơn vẻ ngoài."}
  - {q: "Công ty X: Net Margin 5%, Asset Turnover 1.2x, Total Assets 1,000tr, Equity 500tr. Tính Revenue, NI, EM, ROE.", a: "EM = 2x; Revenue = 1,200tr; NI = 60tr; ROE = 12%."}
  - {q: "DIO 45, DSO 30, DPO 20. Tính CCC; nếu DPO lên 50 thì sao?", a: "CCC = 55 ngày; sau đó 25 ngày, giảm 30 ngày, cần ít vốn lưu động hơn."}
  - {q: "Công ty Y (Revenue 100/130/170, NI 10/15/22, OCF 9/8/3, AR 15/28/55): tính tăng trưởng, red flag, giả thuyết.", a: "Revenue +30%/+30.8%; NI +50%/+46.7%; AR +86.7%/+96.4%. Red flag: OCF giảm khi NI tăng, AR vọt. Giả thuyết: bán chịu quá mức/ghi nhận doanh thu sớm/channel stuffing."}
  - {q: "Net Income 70tr nhưng tiền ròng -430tr: giải thích.", a: "Doanh thu 500tr là AR chưa thu 90 ngày, COGS 350 và opex 80 đã chi tiền; lãi dồn tích khác dòng tiền."}
  - {q: "Làn Gió Mới có cần lo về đòn bẩy không?", a: "Không: D/E 0.68, Interest Coverage 7.5x, nợ vay đang giảm (320 xuống 240 dài hạn)."}
  - {q: "Tại sao chuỗi bán lẻ với Net Margin 1.5% vẫn ROE 27%?", a: "Asset Turnover 9x và Equity Multiplier 2x (vốn NCC miễn phí): 1.5% x 9 x 2 = 27%."}
  - {q: "Apple ROE 171% có nghĩa Apple giỏi hơn 8.5 lần DN ROE 20% không?", a: "Không: phần lớn do buyback giảm Equity (EM ~5.9); ROE giả định với Equity 150B chỉ 64.6%; nên dùng ROIC ~55-60% so WACC ~10%."}
  - {q: "Tự thực hành: thực hiện 5 bước như Làn Gió Mới cho DN của bạn và nêu 3 hành động quý tới.", a: "Gợi ý: kiểm tra cân Balance Sheet và CFS khớp tiền; tính 4 nhóm tỷ số; DuPont; red flags; 3 hành động ưu tiên (ví dụ thu nợ, giảm tồn kho, giữ lại lợi nhuận)."}

checklist:
  - "Balance Sheet cân (Assets = Liabilities + Equity)? Cash cuối CFS khớp BS? RE roll-forward đúng?"
  - "Xu hướng Revenue, Gross, Operating, Net Margin; OCF dương và OCF > NI?"
  - "Đã đọc Thuyết minh: khoản bất thường, bên liên quan, nợ tiềm tàng, off-balance sheet?"
  - "Profitability (Gross/Operating/Net, ROE, ROA, ROIC); Liquidity (Current > 1.5, Quick > 1, Cash, OCF ratio); Leverage (D/E, Debt/Assets, Interest Coverage > 3x, Debt/EBITDA); Efficiency (turnover, DIO/DSO/DPO, CCC, Asset Turnover)?"
  - "Đã phân rã DuPont (3 hoặc 5 thành phần) và đánh giá chất lượng ROE?"
  - "Đã nêu định nghĩa mẫu số (bình quân hay cuối kỳ, nợ có lãi hay tổng nợ) và đơn vị?"
  - "Trend 3-5 kỳ, common-size, so ngành cùng loại (nếu có dữ liệu)?"
  - "Red flags: OCF-NI phân kỳ, AR và Inventory vs Revenue, chính sách kế toán đổi, ghi nhận doanh thu sớm?"
  - "Quality of Earnings checklist 10 mục đã rà?"
  - "Số liệu đã tính lại bằng Python và tự nhất quán trước khi báo cáo?"
  - "Đã kèm disclaimer: đây là phân tích tham khảo, không phải tư vấn đầu tư/tài chính có giấy phép?"

excel_google_sheets_templates:
  - "Tab 1 Input Balance Sheet theo tháng: Cash, AR, Inventory, Prepaid, Fixed Assets net, AP, Short-term Debt, Accrued, Long-term Debt, Paid-in Capital, Retained Earnings."
  - "Tab 2 Input Income Statement theo tháng: Revenue, COGS, Gross Profit, Opex từng khoản, Depreciation, EBIT, Interest, EBT, Tax, Net Income."
  - "Tab 3 Cash Flow tự tính: OCF = NI + Depreciation +/- ΔAR/ΔInventory/ΔAP (hiệu giá trị tháng này trừ tháng trước), Investing, Financing, ΔCash."
  - "Tab 4 Ratios Dashboard: Profitability, Liquidity, Leverage, Efficiency; conditional formatting xanh/vàng/đỏ theo benchmark."
  - "Tab 5 DuPont và Trend chart: Net Margin x Asset Turnover x Equity Multiplier theo tháng; xu hướng ROE, Current Ratio, CCC."
  - "Công thức: =D3/D2 (Current Ratio), =(CA-Inv)/CL, =EBIT/Interest, =365/(COGS/AVERAGE(Inv_dau,Inv_cuoi)) (DIO), =DSO+DIO-DPO. Mẫu đầy đủ hơn xem templates/financial-model-excel-guide.md."

