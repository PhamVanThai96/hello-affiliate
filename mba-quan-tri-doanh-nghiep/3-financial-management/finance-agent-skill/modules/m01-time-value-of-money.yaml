pitfalls:
  - "Nhầm đơn vị thời gian: r năm dùng với n tháng (hoặc ngược lại); chia 14%/12 cho EAR."
  - "Đặt sai thời điểm dòng tiền (đầu/cuối kỳ) - nguồn gốc 90% sai sót; vẽ timeline trước khi tính."
  - "Trộn danh nghĩa/thực giữa dòng tiền và tỷ lệ chiết khấu."
  - "Tính sunk cost; dùng lợi nhuận kế toán thay dòng tiền tăng thêm."
  - "Chọn tỷ lệ chiết khấu cảm tính; dùng r không đổi mãi mãi."
  - "Dự báo CF lạc quan; chỉ dùng một con số NPV; không làm sensitivity/scenario."
  - "Quên thay đổi vốn lưu động (dòng tiền chi thực) và giá trị thanh lý/salvage cuối dự án."
  - "Chỉ dùng IRR/Payback một mình; IRR có multiple IRR, scale-blind, giả định tái đầu tư sai."
  - "So tổng nominal các phương án trả góp; dùng lãi suất ghi hợp đồng không quy EAR; quên phí phụ (bảo hiểm, thẩm định)."
  - "Excel: NPV() không tính kỳ 0; dấu PV và PMT phải ngược nhau."
  - "Dùng Gordon với g >= r; coi Terminal Value như số chắc chắn."
  - "Bỏ qua giá trị chiến lược và quyền chọn (real options) mà NPV không đo."
  - "Không đánh giá sau đầu tư (post-investment audit)."
  - "Lỗi nguồn cần lưu ý: bài tập 4 nguồn ghi NPV ~23,54 là sai (đúng 86,28); bài 6c lãi ẩn đúng 9,90%, không phải 10,1% (xem practice_questions)."

sme_vn_guidance:
  - "Chọn r cho SME: lãi vay NH bình quân (10-12%) làm sàn + phần bù rủi ro theo mức bất định; cân nhắc lợi suất thay thế (gửi tiết kiệm ~5-6%, vàng, trả bớt nợ). Số liệu lãi suất cần cập nhật/xác nhận theo thời điểm."
  - "Mua máy móc: luôn quy PV các phương án trả góp và tính lãi ẩn trước khi chọn; đừng chọn theo tổng nominal."
  - "Vay NH/công ty tài chính: yêu cầu bảng khấu hao nợ, quy lãi sang EAR, kiểm tra lãi flat (thường gặp ở trả góp tiêu dùng/mua xe/máy), cộng phí bảo hiểm/thẩm định; kiểm tra bằng Excel =RATE(36,-11.0833,300)*12."
  - "Thuê vs mua mặt bằng: so PV tiền thuê với giá mua; thuê trả trước dùng annuity due."
  - "Chiết khấu thanh toán sớm với nhà cung cấp: tính chi phí hàm ý (2/10 net 30 = 37,2%/năm) rồi so với lãi vay/lợi suất tiền nhàn rỗi."
  - "Công cụ: Excel/Google Sheets (NPV, IRR, MIRR, PMT, RATE, EFFECT, NPER, IPMT, PPMT); máy tính tài chính (HP 12C, TI BA II Plus); Python numpy_financial; MISA/Fast để xuất dữ liệu doanh thu-chi phí thực tế cho dự báo dòng tiền. Phần mềm và giá cần xác nhận."
  - "Luôn làm bảng độ nhạy 3x3 và kiểm chứng doanh thu năm 1 (khảo sát, thử nghiệm điểm bán nhỏ) trước khi mở chi nhánh; đặt lịch post-investment audit 6-12 tháng."
  - "Thuế TNDN, khấu hao và tác động thuế lên dòng tiền chưa nằm trong nguồn này - cần xác nhận khi áp dụng (xem m02)."

case_lessons:
  - name: "Grab - mô hình NPV dài hạn và network effects"
    type: "success"
    setup: >
      Grab (thành lập 2012, MyTeksi) đốt tiền khuyến mãi 2014-2018 để giành thị phần; IPO NASDAQ 12/2021 qua SPAC với vốn hóa khoảng 40 tỷ USD (số liệu công khai, cần đối chiếu nguồn). Bảng dòng tiền dưới đây là mô hình minh họa của tác giả, không phải số liệu nội bộ Grab. Con số huy động 2 tỷ USD năm 2017 và IRR kỳ vọng ~28% là ước tính từ bản cũ, chưa kiểm chứng.
    key_calculations:
      - "FCF (triệu USD) năm 0-10: -2000, -800, -800, -500, -200, 200, 500, 900, 1300, 1700, 2100; r=15%"
      - "Tổng PV chưa có TV = -1.662,4 -> dự án bị loại nếu không có giá trị cuối kỳ"
      - "PV(TV) = TV x 0,2472 (năm 10). TV=8.000 -> PV 1.977,5 -> NPV = +315,1; TV=12.000 -> NPV ~ +1.303,8"
      - "TV hòa vốn = 1.662,4 / 0,2472 ~ 6.725 triệu USD"
      - "IRR khi TV=8.000 ~ 16,1% (> 15% nên vừa đủ có lời)"
      - "Độ nhạy r với TV=8.000: r=12% -> NPV +1.328,9; 15% -> +315,1; 18% -> -445,9"
    lesson: >
      Giá trị đến từ tương lai xa (PV TV > 100% NPV) nên NPV cực nhạy với r và TV; chấp nhận lỗ ban đầu chỉ khi có lợi thế mạng lưới
      (network effects), vốn đủ dài để chịu lỗ và kịch bản thoát vốn. Quán cà phê đốt tiền khuyến mãi không có lợi thế mạng lưới chỉ là đốt tiền thật.
    data_reliability: "illustrative"
  - name: "WeWork - NPV sai vì đầu vào sai"
    type: "failure"
    setup: >
      Thuê dài hạn 10-15 năm, cho thuê lại ngắn hạn; định giá đỉnh khoảng 47 tỷ USD (đầu 2019), hoãn IPO 9/2019, phá sản Chapter 11 11/2023. Số liệu theo thông tin công khai phổ biến, cần đối chiếu nguồn.
    key_calculations:
      - "Cam kết thuê 60 triệu USD/năm x 10 năm: PV ở r=6% = 441,6; ở r=12% = 339,0 -> chênh 102,6 (30% so với PV ở 12%) chỉ vì chọn r"
      - "Lệch kỳ hạn: nghĩa vụ ra dài hạn cố định vs thu vào ngắn hạn biến mất khi suy thoái"
    lesson: >
      NPV chỉ tốt khi đầu vào đúng (GIGO): dự báo tăng trưởng 50%+ mãi, r 10-12% cho công ty lỗ nặng (đúng ~20%+), bỏ qua unit economics, không stress-test, dùng 'Community Adjusted EBITDA' tự chế.
      Kiểm tra NPV trên đơn vị cơ sở (từng địa điểm) trước khi nhân bản; xem cấu trúc kỳ hạn dòng tiền; cảnh giác chỉ số điều chỉnh.
    data_reliability: "unverified"
  - name: "Cà Phê Nhà Vườn Tây Nguyên - mở chi nhánh, chọn mua máy rang và vay vốn"
    type: "sme"
    setup: >
      DN rang xay + quán cà phê tại Buôn Ma Thuột; r yêu cầu 14% (vay ~11% + 3% rủi ro thị trường mới), lạm phát 4%.
      Ba quyết định: (1) chi nhánh TP.HCM vốn 800tr; (2) chọn phương án thanh toán máy rang; (3) vay 300tr.
    key_calculations:
      - "CF: -800; 180; 230; 280; 300; 420 (320 hoạt động + 100 thanh lý). PV = 157,89 + 176,98 + 188,99 + 177,62 + 218,13 = 919,61 -> NPV = +119,62"
      - "IRR = 19,27% (NPV 18% = +26,46; 20% = -14,78); MIRR (tái đầu tư 14%) = 17,22% với FV+ = 1.770,66"
      - "Payback 3,37 năm; Discounted Payback 4,45 năm"
      - "Độ nhạy NPV (CF 100/90/80% x r 12/14/16%): 172,3/119,6/71,1; 75,1/27,7/-16,0; -22,1/-64,3/-103,1"
      - "r thực = 1,14/1,04 - 1 = 9,62%"
      - "Máy rang ở 14%: A=540; B=150xAF(14%,5)=514,96; C=19xAF(1,0979%,36)=562,49. Lãi ẩn B=12,05% (< 14% nên trả góp), C: 1,338%/tháng, EAR 17,29% (> 14% nên tránh)"
      - "Vay 300tr/36 tháng/11%: PMT=9,8216; tổng lãi=53,58; EAR=11,57%; lãi Năm 1/2/3 = 28,59/18,26/6,73; PV ở 14% của 36 khoản = 290,77 < 300 (vay rẻ hơn chi phí vốn ~9,23tr)"
    lesson: >
      Chi nhánh đáng làm có điều kiện vì NPV mỏng (CF thấp hơn 10% và r=16% thì lỗ nhẹ; ở 80% dự báo lỗ ở mọi r): kiểm chứng doanh thu năm 1 >= 90% dự báo.
      Máy rang chọn B dù tổng nominal cao nhất (750). Khoản vay chấp nhận nếu vốn dùng sinh lời > 11,57%; ưu tiên trả sớm ở năm đầu.
    data_reliability: "illustrative"

worked_examples:
  - name: "NPV, IRR, Payback dự án quán cà phê (bản chiết khấu 12%)"
    inputs: {cfs: [-500, 120, 150, 180, 200, 250], r: 0.12}
    steps:
      - "DF: 0.8929; 0.7972; 0.7118; 0.6355; 0.5674"
      - "PV: 107.14 + 119.58 + 128.12 + 127.10 + 141.84 = 623.78 (chính xác 623.80)"
      - "NPV = 623.80 - 500 = 123.80"
      - "NPV tại 18% = 31.4; tại 22% = -19.0 -> IRR = 20.42%"
      - "Biên an toàn = 20.42% - 12% = 8.42 điểm %"
    result: "NPV = +123,80 triệu; IRR = 20,42% > 12% -> chấp nhận"
  - name: "Dự án chi nhánh: NPV, IRR, MIRR, payback, độ nhạy (r = 14%)"
    inputs: {cfs: [-800, 180, 230, 280, 300, 420], r: 0.14}
    steps:
      - "PV: 157.89, 176.98, 188.99, 177.62, 218.13 -> tổng 919.61"
      - "NPV = 919.61 - 800 = 119.62"
      - "IRR = 19.27%; MIRR = (1770.66/800)^(1/5) - 1 = 17.22%"
      - "Payback = 3 + 110/300 = 3.37; DPB = 4 + 98.51/218.13 = 4.45"
      - "Độ nhạy 90% CF, r=16%: NPV = -16.0"
    result: "NPV +119,62; IRR 19,27%; MIRR 17,22%; payback 3,37; DPB 4,45; dự án mỏng biên an toàn"
  - name: "So sánh 3 phương án thanh toán máy rang (r = 14% EAR)"
    inputs: {A: "540 ngay", B: "150 x 5 năm", C: "19 x 36 tháng", r_ear: 0.14}
    steps:
      - "A = 540.00"
      - "B = 150 * (1 - 1.14^-5)/0.14 = 150 * 3.4331 = 514.96"
      - "r_month = 1.14^(1/12) - 1 = 1.0979%; C = 19 * (1 - 1.010979^-36)/0.010979 = 562.49"
      - "Lãi ẩn B: RATE(5,-150,540) = 12.05%/năm; C: 1.338%/tháng -> EAR 17.29%"
    result: "Chọn B (PV 514,96) vì lãi ẩn 12,05% < 14%; tránh C"
  - name: "Khoản vay 300 triệu, 36 tháng, 11%/năm"
    inputs: {L: 300, apr: 0.11, n: 36}
    steps:
      - "i = 0.11/12 = 0.9167%"
      - "PMT = 300*i/(1 - (1+i)^-36) = 9.8216"
      - "Tổng lãi = 9.8216*36 - 300 = 53.58"
      - "EAR = (1 + 0.11/12)^12 - 1 = 11.57%"
      - "Tháng 1: lãi 2.750, gốc 7.072, dư nợ 292.928"
      - "Lãi theo năm: 28.59, 18.26, 6.73"
      - "Flat 11% cùng khoản vay: PMT 11.0833; APR 19.57%; EAR 21.42%"
    result: "PMT 9,8216 triệu/tháng; tổng lãi 53,58 triệu; EAR 11,57%; flat đắt gần gấp đôi"
  - name: "Tiết kiệm định kỳ và quỹ tái đầu tư"
    inputs: {PMT: 20, r_month: 0.005, n: 60, target: 800}
    steps:
      - "Hệ số = (1.005^60 - 1)/0.005 = 69.77"
      - "FV = 20 * 69.77 = 1395.40; gốc 1200 -> lãi 195.40"
      - "PMT cho mục tiêu 800 = 800/69.77 = 11.47"
    result: "FV = 1.395,40 triệu; cần 11,47 triệu/tháng để đạt 800 triệu"
  - name: "Định giá perpetuity, Gordon, annuity due và Fisher"
    inputs: {PMT_year: 144, r: 0.12, CF1: 60, g: 0.04, r_g: 0.14, annuity_PMT: 150}
    steps:
      - "Perpetuity: 144/0.12 = 1200"
      - "Gordon: 60/(0.14-0.04) = 600"
      - "Annuity due 150 x 5 năm ở 10%: 568.62 * 1.10 = 625.48"
      - "Fisher: 1.14/1.04 - 1 = 9.62%"
    result: "1.200; 600; 625,48; 9,62%"
  - name: "Mô hình Grab: tìm TV hòa vốn"
    inputs: {fcf: [-2000, -800, -800, -500, -200, 200, 500, 900, 1300, 1700, 2100], r: 0.15}
    steps:
      - "Tổng PV (chưa có TV) = -1662.43"
      - "DF năm 10 = 1/1.15^10 = 0.2472"
      - "TV hòa vốn = 1662.43/0.2472 = 6725"
      - "Với TV=8000: NPV = -1662.43 + 1977.48 = 315.05"
    result: "TV hòa vốn ~6.725 triệu USD; TV=8.000 cho NPV +315,05"

practice_questions:
  - q: "Gửi 200tr lãi 9%/năm ghép hằng năm 8 năm. FV? Rule 72 so với chính xác?"
    a: "FV = 398,51tr; Rule 72 = 8 năm; chính xác 8,04 năm."
  - q: "Khách đề nghị (a) trả ngay 1.000tr hoặc (b) 1.400tr sau 4 năm; chi phí vốn 8%. Chọn?"
    a: "PV(b) = 1.400/1,08^4 = 1.029,04 > 1.000 nên chọn (b), cân nhắc rủi ro khách không trả."
  - q: "Mặt bằng thuê 12tr/tháng mãi mãi, lợi suất 12%/năm; nếu thuê tăng 4%/năm với r=14% (CF1=60) thì sao?"
    a: "Perpetuity: 144/0,12 = 1.200tr; Gordon: 60/(0,14-0,04) = 600tr."
  - q: "Dự án vốn 300tr, CF năm 1-4 lần lượt 100,120,140,160; r=12%. NPV, IRR, quyết định?"
    a: "NPV = +86,28tr (nguồn ghi 23,54 sai: đó là PMT của bài 5); IRR = 23,96% > 12% -> chấp nhận."
  - q: "Vay 500tr, lãi 12%/năm ghép tháng, 24 tháng. PMT và EAR?"
    a: "PMT = 23,54tr/tháng; EAR = 12,68%."
  - q: "Dự án A vốn 600tr, CF 200,250,300,350, r=10%: NPV, IRR; CF giảm 15% thì sao; trả góp 4 x 170tr thay vì trả ngay 540?"
    a: "NPV = +252,88tr, IRR = 26,43%. Với 85% CF: NPV = +124,95tr (vẫn dương). PV 4x170 ở 10% = 538,88 ~ 540; lãi ẩn thực = 9,90% (nguồn ghi 10,1% là xấp xỉ sai) -> hai phương án gần như ngang nhau, chọn trả góp nếu chi phí cơ hội > 9,90%."
  - q: "Lạm phát 7%/năm, bao lâu sức mua tiền mặt giảm nửa? Nợ lãi 18% bao lâu gấp đôi?"
    a: "72/7 = 10,3 năm; 72/18 = 4 năm."
  - q: "Chiết khấu 2/10 net 30: chi phí vốn khi bỏ qua chiết khấu?"
    a: "2/98 x 365/20 = 37,2%/năm."
  - q: "14% danh nghĩa, lạm phát 4%: lãi thực? Và CF thực + r danh nghĩa gây lỗi gì?"
    a: "9,62%. NPV bị đánh giá thấp một cách hệ thống."
  - q: "Bài thực hành: chọn quyết định thực tế (mua máy, mở điểm bán, vay vốn) và lập timeline, r theo mục IV.3, NPV/IRR/Payback, bảng 3x3, khuyến nghị 1 trang."
    a: "Bài tự thực hành; dùng procedure m01_proc_project_npv."

checklist:
  - "Đã vẽ timeline (dấu + thời điểm đầu/cuối kỳ)?"
  - "Dòng tiền là incremental, không tính sunk cost?"
  - "Đã tính thay đổi vốn lưu động và giá trị thanh lý?"
  - "Đơn vị thời gian của r và n nhất quán (tháng/năm)?"
  - "Danh nghĩa/thực nhất quán giữa CF và r?"
  - "r dựa trên WACC/CAPM hoặc lãi vay + phần bù rủi ro; đã thử ±2 điểm %?"
  - "Đã tính NPV (chính), IRR/MIRR (biên an toàn), Payback và Discounted Payback?"
  - "So phương án trả góp bằng PV + lãi ẩn, không so tổng nominal?"
  - "Lãi vay đã quy EAR; xác định flat hay dư nợ giảm dần; đã tính phí phụ?"
  - "Đã lập bảng khấu hao nợ cho khoản vay lớn?"
  - "Đã làm bảng độ nhạy (CF x r) và kịch bản Best/Base/Worst?"
  - "Đã kiểm tra NPV trên đơn vị cơ sở trước khi nhân bản?"
  - "Đã kiểm chứng giả định dự báo độc lập?"
  - "Đã cân nhắc giá trị chiến lược/quyền chọn mà NPV không đo?"
  - "Đã ghi toàn bộ giả định và lên lịch post-investment audit 6-12 tháng?"

excel_google_sheets_templates:
  - name: "Hàm TVM Excel/Sheets"
    description: |
      FV =FV(rate,nper,pmt,[pv],[type]); PV =PV(...); NPV =NPV(rate,CF1:CFn)+CF0; IRR =IRR(CF0:CFn);
      MIRR =MIRR(values,finance_rate,reinvest_rate); PMT =PMT(rate,nper,pv); RATE =RATE(nper,pmt,pv);
      EAR =EFFECT(nominal,npery); NPER; IPMT/PPMT. Lưu ý dấu PV/PMT ngược nhau, NPV() không tính kỳ 0, đổi lãi năm sang tháng nhất quán.
  - name: "Bảng tính NPV/IRR đơn giản"
    description: |
      Sheet Assumptions: B1 r=14%, B2 lạm phát=4%, B3 vốn=800.
      Sheet Cashflow: A năm 0..5; B dòng tiền; C =1/(1+Assumptions!$B$1)^A2; D =B2*C2; E =SUM($B$2:B2); F =SUM($D$2:D2).
      NPV =SUM(D2:D7); IRR =IRR(B2:B7); Payback = năm cuối lũy kế âm + |lũy kế âm|/CF năm kế.
  - name: "Sheet Sensitivity"
    description: "Data Table 2 chiều: hàng r (10%..20%), cột %CF (70%..110%) cho NPV."

