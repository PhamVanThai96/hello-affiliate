  when_to_use: Tổng hợp KPI thành điểm của từng viễn cảnh.
- id: m06_overall_score
  module: m06
  name_vi: Điểm BSC tổng thể
  name_en: Overall BSC score
  expression_latex: BSC = \sum_j W_j P_j,\ \sum_j W_j = 1
  expression_python: sum(W[j]*P[j] for j in W)
  excel: =SUMPRODUCT(W_range, P_range)
  variables:
  - W_j
  - P_j
  when_to_use: Báo cáo một con số tổng cho Ban lãnh đạo, liên kết thưởng.
- id: m06_nps
  module: m06
  name_vi: Chỉ số NPS
  name_en: Net Promoter Score
  expression_latex: NPS = \%Promoters - \%Detractors
  expression_python: pct_promoters - pct_detractors
  excel: =P - D
  variables:
  - Promoters
  - Detractors
  when_to_use: 'KPI lòng trung thành viễn cảnh Khách hàng (chỉ tiêu ví dụ trong nguồn: NPS >= 50).'
- id: m06_retention
  module: m06
  name_vi: Tỷ lệ giữ chân khách hàng
  name_en: Customer Retention Rate
  expression_latex: CRR = \frac{E - N}{S}
  expression_python: (end_customers - new_customers) / start_customers
  excel: =(E-N)/S
  variables:
  - E
  - N
  - S
  when_to_use: KPI giữ chân (chỉ tiêu ví dụ >= 90% trong nguồn).
- id: m06_turnover
  module: m06
  name_vi: Tỷ lệ nghỉ việc
  name_en: Employee Turnover Rate
  expression_latex: TR = \frac{L}{(H_0 + H_1)/2}
  expression_python: leavers / ((headcount_start + headcount_end) / 2)
  excel: =L/AVERAGE(H0,H1)
  variables:
  - L
  - H0, H1
  when_to_use: 'KPI Học hỏi (chỉ tiêu ví dụ trong nguồn: < 20%/năm cho chuỗi cà phê).'
- id: m06_okr_score
  module: m06
  name_vi: Điểm OKR
  name_en: OKR Score
  expression_latex: OKR = \frac{1}{n}\sum_k KR_k
  expression_python: sum(kr_scores)/len(kr_scores)
  excel: =AVERAGE(KR_range)
  variables:
  - KR_k
  when_to_use: Chấm Objective hàng quý (3-5 Objectives, mỗi cái 3-5 KR).
- id: m06_initiative_roi
  module: m06
  name_vi: ROI sáng kiến (kiểm chứng giả thuyết nhân quả)
  name_en: Initiative ROI
  expression_latex: ROI = \frac{\Delta Rev \cdot GM - Cost}{Cost}
  expression_python: (delta_rev * gross_margin - cost) / cost
  excel: =(dRev*GM-Cost)/Cost
  variables:
  - dRev
  - GM
  - Cost
  when_to_use: Chứng minh chuỗi nhân quả Học hỏi/Quy trình/Khách hàng ra tiền, xếp ưu tiên sáng kiến.
- id: m06_rag_status
  module: m06
  name_vi: Trạng thái xanh-vàng-đỏ
  name_en: RAG Status
  expression_latex: Status = \begin{cases} Green & S \ge 0.9 \\ Amber & 0.7 \le S < 0.9 \\ Red & S < 0.7 \end{cases}
  expression_python: '''Green'' if s >= 0.9 else (''Amber'' if s >= 0.7 else ''Red'')'
  excel: =IF(S>=0.9,"Xanh",IF(S>=0.7,"Vàng","Đỏ"))
  variables:
  - S
  when_to_use: Dashboard cho lãnh đạo, ưu tiên chú ý.
- id: m07_impact_uncertainty_score
  module: m07
  name_vi: Điểm ưu tiên yếu tố (Tác động x Bất định)
  name_en: Impact x Uncertainty priority score
  expression_latex: S_i = I_i \times U_i
  expression_python: I * U
  excel: =B2*C2
  variables:
  - I
  - U
  when_to_use: 'Bước 3 của quy trình: xếp hạng 10-15 driving forces để chọn ứng viên làm trục kịch bản.'
- id: m07_joint_scenario_weight
  module: m07
  name_vi: Trọng số kịch bản từ hai trục (giả định độc lập)
  name_en: Scenario weight from two axes
  expression_latex: P(A_i, B_j) = P(A_i)\times P(B_j)
  expression_python: pa * pb
  excel: =B1*B2
  variables:
  - pa
  - pb
  when_to_use: Chỉ khi cần gán trọng số để tính giá trị kỳ vọng hoặc phân bổ ngân sách dự phòng; không dùng để 'dự báo kịch
    bản thắng'.
- id: m07_expected_value
  module: m07
  name_vi: Giá trị kỳ vọng của chiến lược qua các kịch bản
  name_en: Scenario-weighted expected value
  expression_latex: EV_s = \sum_{k} w_k \, X_{s,k}
  expression_python: sum(w_k * x for w_k, x in zip(w, payoffs))
  excel: =SUMPRODUCT(B2:E2,$B$7:$E$7)
  variables:
  - w
  - payoffs
  when_to_use: So sánh phương án khi chấp nhận rủi ro lặp lại và có trọng số tạm tin được.
- id: m07_maximin
  module: m07
  name_vi: Tiêu chí Maximin (kết quả xấu nhất tốt nhất)
  name_en: Maximin / worst-case criterion
  expression_latex: \max_s \min_k X_{s,k}
  expression_python: max(min(row) for row in matrix)
  excel: =MAX(F2:F5) với F = MIN(B:E) mỗi hàng
  variables:
  - matrix
  when_to_use: DN mỏng vốn, vay nhiều, hoặc quyết định có thể dẫn đến mất khả năng thanh toán.
- id: m07_regret
  module: m07
  name_vi: Regret lớn nhất (Minimax regret, Savage)
  name_en: Minimax regret
  expression_latex: R_{s,k}=\max_{s'}X_{s',k}-X_{s,k};\; \min_s \max_k R_{s,k}
  expression_python: min(max(max(col) - row[k] for k, col in enumerate(zip(*matrix))) for row in matrix)
  excel: Bảng regret = MAX(cột) - ô; rồi MIN của MAX theo hàng
  variables:
  - matrix
  when_to_use: Quyết định một lần, khó đảo ngược, nỗi sợ lớn nhất là 'chọn sai khi đáng lẽ chọn khác'.
- id: m07_robustness_share
  module: m07
  name_vi: Tỷ lệ kịch bản sống sót (độ vững)
  name_en: Robustness share
  expression_latex: 'Rb_s=\frac{\#\{k: X_{s,k}\ge T\}}{K}'
  expression_python: sum(1 for x in payoffs if x >= T) / len(payoffs)
  excel: =COUNTIF(B2:E2,">="&T)/COUNT(B2:E2)
  variables:
  - payoffs
  - T
  when_to_use: 'Bước wind-tunnel: đo định lượng thế nào là ''robust'' (không cần xác suất).'
- id: m07_cash_runway
  module: m07
  name_vi: Thời gian chịu đựng tiền mặt trong kịch bản xấu
  name_en: Cash runway under a scenario
  expression_latex: Runway=\frac{Cash}{MonthlyOutflow-MonthlyInflow}
  expression_python: cash / (outflow - inflow)
  excel: =B1/(B2-B3)
  variables:
  - cash
  - outflow
  - inflow
  when_to_use: 'Đánh giá kịch bản xấu: DN sống được bao tháng; xác định quỹ dự phòng (nguồn nêu 6 tháng vận hành cho DN XNK).'
- id: m07_signal_score
  module: m07
  name_vi: Điểm tín hiệu của một kịch bản
  name_en: Weighted early-warning signal score
  expression_latex: SS=\frac{\sum_j w_j s_j}{\sum_j w_j}
  expression_python: sum(w * s for w, s in zip(weights, signals)) / sum(weights)
  excel: =SUMPRODUCT(B2:B5,C2:C5)/SUM(B2:B5)
  variables:
  - weights
  - signals
  when_to_use: Gộp nhiều tín hiệu rời rạc thành một con số để quyết định kích hoạt phương án contingent.
- id: m08_weighted_score
  module: m08
  name_vi: Điểm có trọng số để xếp hạng lựa chọn chiến lược
  name_en: Weighted scoring model
  expression_latex: S_j = \sum_{i} w_i \, x_{ij},\quad \sum_i w_i = 1
  expression_python: sum(w[i]*x[i] for i in range(len(w)))
  excel: =SUMPRODUCT(w_range, x_range)
  variables:
  - w_i
  - x_ij
  when_to_use: Chọn giữa 3-5 hướng đi (Ansoff, concept mới, kênh) khi không có đủ số liệu NPV; cũng dùng để tổng hợp điểm
    áp lực 5 Forces.
- id: m08_store_closure_rule
  module: m08
  name_vi: Quy tắc đóng cửa hàng theo EBITDA cấp cửa hàng
  name_en: Store-level (4-wall) closure rule and payback
  expression_latex: ClosePayback = \dfrac{\sum_k C_k}{\sum_k |E_k|},\quad \text{đóng nếu } E_k < 0 \ \text{và } L_k > 6
  expression_python: sum(closing_costs)/sum(-e for e in monthly_losses)
  excel: =SUM(closing_costs)/-SUM(monthly_losses)
  variables:
  - E_k
  - L_k
  - C_k
  when_to_use: 'Giai đoạn Cắt tỉa của lộ trình: chọn cửa hàng đóng cửa theo tiêu chí lỗ > 6 tháng (ngưỡng 6 tháng lấy từ giải
    pháp đề xuất trong case).'
- id: m09_swot_weighted
  module: m09
  name_vi: Điểm SWOT có trọng số theo từng góc
  name_en: Weighted SWOT quadrant score
  expression_latex: Q = \sum_{i} w_i s_i,\ \sum_i w_i = 1
  expression_python: 'sum(w*s for w, s in items)  # items=[(trọng số, điểm 1-5)], tổng trọng số trong góc = 1'
  excel: =SUMPRODUCT(w_range, s_range)
  variables:
  - w_i
  - s_i
  when_to_use: Khắc phục chỉ trích 'SWOT chỉ liệt kê, mọi yếu tố ngang nhau, không định lượng'.
- id: m09_tows_priority
  module: m09
  name_vi: Điểm ưu tiên cặp TOWS
  name_en: TOWS pair priority
  expression_latex: P_{ij} = (w_i s_i)(w_j s_j)
  expression_python: (wi*si)*(wj*sj)
  excel: =(w_i*s_i)*(w_j*s_j)
  variables:
  - w_i s_i
  - w_j s_j
  when_to_use: Xếp hạng nhiều chiến lược SO/ST/WO/WT để chọn 2-3 chiến lược khả thi nhất (bước 5 nguồn).
- id: m09_relative_share
  module: m09
  name_vi: Thị phần tương đối (BCG)
  name_en: Relative market share
  expression_latex: RMS = \frac{MS_{own}}{MS_{largest\ competitor}}
  expression_python: own_share / top_competitor_share
  excel: =own/competitor
  variables:
  - own_share
  - top_competitor_share
  when_to_use: Xếp từng SBU/sản phẩm vào ô BCG.
- id: m10_ge_axis_score
  module: m10
  name_vi: Điểm trục GE-McKinsey với bảng trọng số mẫu của nguồn
  name_en: GE-McKinsey axis score (source weight templates)
  expression_latex: IA = \sum_{i=1}^{7} w_i s_i,\quad CS = \sum_{j=1}^{8} v_j t_j,\quad \sum w_i = \sum v_j = 1
  expression_python: sum(w*s for w, s in zip(weights, scores))
  excel: =SUMPRODUCT(weights, scores)
  variables:
  - w_i
  - v_j
  - s_i, t_j
  when_to_use: 'Bước 4-5 quy trình GE-McKinsey 8 bước: chấm điểm từng SBU rồi ra điểm hai trục (đặt ô bằng m04_ge_zone).'
- id: m10_portfolio_cash_balance
  module: m10
  name_vi: Cân đối dòng tiền danh mục (Cow nuôi Star và Question Mark)
  name_en: Portfolio cash balance
  expression_latex: N = \sum_{k \in Cow} F_k - \sum_{k \in Star \cup QM} I_k
  expression_python: sum(cow_surplus) - sum(star_need) - sum(qm_need)
  excel: =SUM(cow_range)-SUM(star_range)-SUM(qm_range)
  variables:
  - F_k
  - I_k
  when_to_use: 'Kiểm tra logic nền của BCG: danh mục có Cash Cow đủ nuôi các đơn vị tiêu tiền không. Công thức là quy ước
    của skill, nguồn chỉ nêu nguyên tắc ''bò sữa nuôi sao và dấu hỏi''.'
- id: m10_wind_tunnel_score
  module: m10
  name_vi: Điểm hầm gió (chất lượng chiến lược qua các kịch bản)
  name_en: Wind-tunnel score from qualitative grades
  expression_latex: W_s = \sum_{k=1}^{K} g_{s,k},\quad g \in \{0,1,2\}
  expression_python: sum(grades)
  excel: =SUM(B2:E2)
  variables:
  - g_{s,k}
  when_to_use: Chuyển bảng 'Robust?' bằng biểu tượng của nguồn (Bước 6-7 BĐS VN) thành số để so sánh. Là quy ước của skill,
    nguồn chỉ dùng biểu tượng.
- id: m10_pct_change
  module: m10
  name_vi: Phần trăm thay đổi (kiểm tra số trong case)
  name_en: Percentage change (case-number sanity check)
  expression_latex: \Delta\% = \frac{new - old}{old}\times 100
  expression_python: (new - old) / old * 100
  excel: =(new-old)/old
  variables:
  - old, new
  when_to_use: Mọi lần trích 'tăng X%' trong case, đặc biệt các mệnh đề về giá dầu, doanh thu, thị phần.
