      PESTEL tìm ra cơ hội chính sách (IRA) -> quyết định xây nhà máy tại Mỹ; nhưng doanh số thấp hơn kỳ vọng vì đánh giá quá lạc quan yếu tố Xã hội/nhận diện thương hiệu.
