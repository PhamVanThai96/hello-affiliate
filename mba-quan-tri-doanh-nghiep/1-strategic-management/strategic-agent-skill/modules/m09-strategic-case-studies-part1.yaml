# m09 - Cẩm nang case study chiến lược tích hợp (phần 1)
# Nguồn: 09-comprehensive-strategic-case-studies-manual.md, dòng 1-1500 (mở đầu, Module 1 PESTEL/5 Forces, Module 2 SWOT/VRIO/Value Chain,
# Module 3 Generic Strategies, Module 4 phần Ansoff + mở đầu BCG). Phần dòng 1501+ nằm ở m10.
# Framework nền (PESTEL, 5 Forces, VRIO, Value Chain, Generic, Ansoff) có chi tiết ở m01-m04; file này chỉ chứa framework MỚI/khác biệt
# (trường phái I/O vs RBV, SWOT, TOWS, CHIP, Hybrid, BCG, quy trình tích hợp) + case_lessons + worked_examples. Số trong worked_examples đã chạy python3 verify.
id: "m09"
name_vi: "Cẩm nang case study chiến lược tích hợp (phần 1)"
name_en: "Integrated Strategic Case Studies Manual (Part 1)"
purpose: >-
  Cho Strategist một thư viện case mẫu và quy trình tích hợp: bài toán chiến lược thực tế luôn đa chiều (môi trường vĩ mô -> ngành -> nguồn lực
  nội bộ -> chiến lược cạnh tranh -> tăng trưởng/danh mục), nên cần biết đi qua framework nào, theo thứ tự nào, và rút bài học từ case
  (VinFast, Grab, Vinamilk, Samsung, Zara, Vietjet, Apple/Xiaomi/Nokia, Rolls-Royce, Vingroup, cà phê VN). Cũng cung cấp SWOT/TOWS, BCG,
  hai trường phái I/O và RBV mà m01-m07 chưa có hoặc chưa tích hợp.
when_to_use:
  - "Bài toán chiến lược cần nhiều framework cùng lúc (vd: có nên vào thị trường mới, định vị thế nào, tăng trưởng ra sao) - cần chuỗi framework và thứ tự."
  - "Cần SWOT có chấm điểm và chuyển thành chiến lược hành động bằng TOWS."
  - "Cần phân bổ nguồn lực giữa nhiều sản phẩm/đơn vị kinh doanh (BCG)."
  - "Người dùng hỏi 'công ty X đã làm gì và vì sao thành/bại' - dùng case_lessons làm khuôn so sánh (nhớ cờ data_reliability)."
  - "Cần giải thích Outside-In (I/O) vs Inside-Out (RBV) hoặc 'Stuck in the Middle' và các ngoại lệ Hybrid."
prerequisites: [m01, m02, m03, m04]
related_modules:
  - "m01 - PESTEL và 5 Forces đầy đủ (quy trình, thang điểm); m09 chỉ dùng lại trong case VinFast và cà phê VN."
  - "m02 - Value Chain, VRIO, năng lực cốt lõi đầy đủ; m09 có thêm CHIP (4 lý do khó bắt chước) và bảng VRIO case."
  - "m03 - Generic Strategies đầy đủ; m09 thêm Hybrid, Stuck in the Middle với case Apple/Xiaomi/Nokia."
  - "m04 - Ansoff đầy đủ; m09 có case Vingroup đối chiếu Ansoff và BCG."
  - "m05, m06, m07 - Blue Ocean, BSC, Scenario: nằm ở phần sau của cẩm nang (m10); chuỗi tích hợp ở đây dẫn tới chúng ở bước cuối."
  - "m10 - phần sau cẩm nang: GE-McKinsey/phần còn lại của BCG, Netflix, Spotify, S-Tech, R-Estate."

concepts:
  - term_vi: "Trường phái Tổ chức Ngành"
    term_en: "Industrial Organization school (I/O, Outside-In)"
    definition: >-
      Quan điểm cho rằng cấu trúc ngành quyết định lợi nhuận; doanh nghiệp thành công nhờ chọn ngành hấp dẫn và định vị phòng thủ tốt.
      Giả định nguồn lực trong ngành tương đối đồng nhất và dịch chuyển tự do. Gắn với Mason, Bain, Michael Porter.
      Công cụ: PESTEL, 5 Forces, Generic Strategies.
    why_it_matters: >-
      Trả lời câu hỏi 'chơi ở đâu' trước khi 'chơi thế nào'. Một doanh nghiệp giỏi đến mấy trong ngành kém hấp dẫn vẫn bị bào mòn lợi nhuận.
      Điểm yếu: bỏ qua sự khác biệt nội tại giữa các công ty cùng ngành.
  - term_vi: "Trường phái Nguồn lực"
    term_en: "Resource-Based View (RBV, Inside-Out)"
    definition: >-
      Quan điểm cho rằng doanh nghiệp là tập hợp nguồn lực dị biệt, khó dịch chuyển; lợi thế đến từ nguồn lực/năng lực độc đáo và tốc độ đối thủ
      sao chép. Gắn với Penrose, Wernerfelt, Jay Barney (1991, VRIO). Công cụ: VRIO, Value Chain, Core Competencies.
    why_it_matters: >-
      Giải thích vì sao hai công ty cùng ngành lại lãi khác nhau (vd Vinamilk so với các hãng sữa khác): khác ở nguồn lực khó copy. Điểm yếu: có thể
      mải xây năng lực mà quên ngành đang thoái trào.
  - term_vi: "Tích hợp I/O và RBV"
    term_en: "Integrated outside-in and inside-out view"
    definition: >-
      Dùng năng lực nội tại độc đáo (RBV) để chống đỡ và khai thác áp lực môi trường ngoài (I/O). Hai trường phái là hai mặt của một đồng xu.
    why_it_matters: >-
      Là nguyên tắc dựng thứ tự quy trình tích hợp: phân tích ngoài (PESTEL, 5 Forces) -> trong (SWOT, VRIO, Value Chain) -> chọn chiến lược -> đo và
      phòng thủ. Chiến lược không phải kế hoạch tĩnh mà là sự dung hòa liên tục hai chiều.
  - term_vi: "Kẹt ở giữa"
    term_en: "Stuck in the Middle"
    definition: >-
      Cảnh báo của Porter (1980): theo đuổi đồng thời chi phí thấp và khác biệt hóa trên thị trường rộng mà không giỏi cái nào thì lợi nhuận kém.
      Ngoại lệ có thật (Toyota, IKEA, Uniqlo, Xiaomi) nhờ một năng lực tạo cả hai (lean, thiết kế để sản xuất, R&D vải, hệ sinh thái).
    why_it_matters: >-
      Nokia, BlackBerry là minh họa kinh điển (theo nguồn): không đủ rẻ như Android, không đủ trải nghiệm như iPhone. Với SME, nguyên tắc vẫn
      đúng: bắt đầu bằng Focus.
  - term_vi: "Nguồn gốc khó bắt chước (CHIP)"
    term_en: "Sources of inimitability (Causal ambiguity, Historical conditions, Imperfect imitability, Patents)"
    definition: >-
      4 lý do một nguồn lực khó copy: C - Mơ hồ nhân quả (đối thủ không biết tại sao nó hiệu quả, vd văn hóa Southwest); H - Hoàn cảnh lịch sử
      (vd vị trí đất vàng); I - Không thể sao chép hoàn hảo/cần thời gian dài (vd thương hiệu 130+ năm); P - Bằng sáng chế/pháp lý.
      (Ghi chú: nguồn dùng chữ I cho 'Imperfect imitability'; trong lý thuyết Barney thường là 'social complexity' - dùng như nguồn trình bày.)
    why_it_matters: "Giúp trả lời câu 'I' của VRIO bằng lý do cụ thể thay vì cảm tính, và chọn nguồn lực nào đáng bảo vệ."
  - term_vi: "Thị phần tương đối"
    term_en: "Relative market share"
    definition: "Thị phần của đơn vị chia cho thị phần của đối thủ lớn nhất trong cùng thị trường. Trên 1.0 nghĩa là đang dẫn đầu."
    why_it_matters: >-
      Henderson (BCG, 1970) dựa trên đường cong kinh nghiệm: thị phần tương đối cao thì khối lượng tích lũy lớn, chi phí đơn vị thấp, sinh dòng tiền
      nhiều hơn. Vì thế trục ngang BCG là thị phần tương đối chứ không phải thị phần tuyệt đối.
  - term_vi: "Chiến lược lai"
    term_en: "Hybrid / integrated cost-differentiation strategy"
    definition: "Kết hợp chi phí thấp và khác biệt hóa nhờ một động cơ vận hành chung (IKEA: thiết kế để rẻ; Toyota: TPS + chất lượng; Uniqlo: R&D vải + quy mô; Xiaomi: bán online + hệ sinh thái IoT)."
    why_it_matters: "Là ngoại lệ có điều kiện của Stuck in the Middle: chỉ khả thi khi có quy mô và một năng lực tạo ra cả hai lợi thế; không dành cho doanh nghiệp nhỏ chưa có nền."

formulas:
  - id: "m09_swot_weighted"
    name_vi: "Điểm SWOT có trọng số theo từng góc"
    name_en: "Weighted SWOT quadrant score"
    expression_latex: "Q = \\sum_{i} w_i s_i,\\ \\sum_i w_i = 1"
    expression_python: "sum(w*s for w, s in items)  # items=[(trọng số, điểm 1-5)], tổng trọng số trong góc = 1"
    excel: "=SUMPRODUCT(w_range, s_range)"
    variables:
      - {symbol: "w_i", meaning: "trọng số quan trọng của yếu tố i trong góc (S/W/O/T)", unit: "tỷ lệ, tổng góc = 1"}
      - {symbol: "s_i", meaning: "điểm tác động/mức độ của yếu tố i", unit: "thang 1-5"}
    when_to_use: "Khắc phục chỉ trích 'SWOT chỉ liệt kê, mọi yếu tố ngang nhau, không định lượng'."
    why_it_works: >-
      Bước 3 của quy trình nguồn là 'cho điểm mức tác động 1-5'. Thêm trọng số buộc người phân tích chọn cái nào quan trọng hơn thay vì liệt kê ngang nhau,
      và cho phép so sánh góc với góc.
    assumptions: ["Thang điểm 1-5 chủ quan, nên lấy đồng thuận nhóm", "Giữ 5-7 yếu tố mỗi góc (nguồn)"]
    pitfalls: ["Trọng số không cộng đến 1 làm điểm các góc không so sánh được", "Chấm điểm một mình = chủ quan, nên workshop nhóm"]
    interpretation: "Điểm cao ở S/O với W/T thấp: nghiêng chiến lược SO (tấn công); W và T cao: nghiêng WT (sinh tồn/co cụm). Đây là gợi ý, không phải quy tắc cứng."
    example:
      inputs: {S: "[(0.4,5),(0.35,4),(0.25,4)]", W: "[(0.5,5),(0.2,3),(0.3,4)]"}
      steps: ["S = 0.4*5 + 0.35*4 + 0.25*4 = 2.0 + 1.4 + 1.0 = 4.4", "W = 0.5*5 + 0.2*3 + 0.3*4 = 2.5 + 0.6 + 1.2 = 4.3"]
      result: "S = 4.4; W = 4.3"
  - id: "m09_tows_priority"
    name_vi: "Điểm ưu tiên cặp TOWS"
    name_en: "TOWS pair priority"
    expression_latex: "P_{ij} = (w_i s_i)(w_j s_j)"
    expression_python: "(wi*si)*(wj*sj)"
    excel: "=(w_i*s_i)*(w_j*s_j)"
    variables:
      - {symbol: "w_i s_i", meaning: "đóng góp có trọng số của yếu tố nội bộ (S hoặc W)", unit: "điểm"}
      - {symbol: "w_j s_j", meaning: "đóng góp có trọng số của yếu tố ngoại cảnh (O hoặc T)", unit: "điểm"}
    when_to_use: "Xếp hạng nhiều chiến lược SO/ST/WO/WT để chọn 2-3 chiến lược khả thi nhất (bước 5 nguồn)."
    why_it_works: "Một chiến lược TOWS chỉ mạnh khi cả hai yếu tố ghép đều quan trọng; tích hai đóng góp phạt cặp có một vế yếu. Đây là quy ước đề xuất của skill, KHÔNG phải công thức chuẩn trong nguồn."
    assumptions: ["Dùng cùng thang điểm trọng số cho mọi yếu tố"]
    pitfalls: ["Điểm so được trong cùng một lần phân tích, không so xuyên công ty", "Điểm cao chưa chứng minh khả thi về nguồn lực/vốn"]
    interpretation: "Xếp giảm dần; chọn top 2-3; kiểm tra thêm khả thi và rủi ro bằng định tính."
    example:
      inputs: {S3: "(0.35,4)", O1: "(0.5,5)"}
      steps: ["P(S3,O1) = (0.35*4)*(0.5*5) = 1.4*2.5 = 3.5"]
      result: "3.5"
  - id: "m09_relative_share"
    name_vi: "Thị phần tương đối (BCG)"
    name_en: "Relative market share"
    expression_latex: "RMS = \\frac{MS_{own}}{MS_{largest\\ competitor}}"
    expression_python: "own_share / top_competitor_share"
    excel: "=own/competitor"
    variables:
      - {symbol: "own_share", meaning: "thị phần của đơn vị/sản phẩm đang xét", unit: "%"}
      - {symbol: "top_competitor_share", meaning: "thị phần của đối thủ lớn nhất", unit: "%"}
    when_to_use: "Xếp từng SBU/sản phẩm vào ô BCG."
    why_it_works: "Đường cong kinh nghiệm: ai tích lũy khối lượng nhiều nhất thì chi phí thấp nhất; so với đối thủ số 1 mới biết có đang dẫn đầu chi phí không."
    assumptions: ["Ngưỡng cao/thấp thường lấy 1.0 trên trục ngang (quy ước thông dụng); ngưỡng tăng trưởng thường 10% (nguồn đồ họa không nêu số, ghi 'cao/thấp' - cần chọn ngưỡng và nói rõ)"]
    pitfalls: ["Định nghĩa thị trường quá hẹp làm thị phần tương đối ảo", "Khi chính mình là số 1 thì mẫu số là đối thủ số 2 và RMS > 1"]
    interpretation: "RMS >= 1: dẫn đầu (Star hoặc Cash Cow tùy tăng trưởng); RMS < 1: theo sau (Question Mark hoặc Dog)."
    example:
      inputs: {own: 30, top_competitor: 12}
      steps: ["30/12 = 2.5"]
      result: "RMS = 2.5 (dẫn đầu)"

frameworks:
  - id: "m09_swot"
    name_vi: "Phân tích SWOT"
    name_en: "SWOT Analysis"
    origin: >-
      Nguồn ghi: Albert Humphrey, Stanford Research Institute, thập niên 1960 (xuất xứ này còn tranh cãi trong giới học thuật - tạm ghi theo nguồn,
      độ tin cậy trung bình). Ra đời để gom cả nội bộ và bên ngoài vào một khung đơn giản cho workshop.
    components:
      - "S - Strengths (nội bộ, tích cực): làm gì tốt hơn đối thủ"
      - "W - Weaknesses (nội bộ, tiêu cực)"
      - "O - Opportunities (ngoại cảnh, tích cực)"
      - "T - Threats (ngoại cảnh, tiêu cực)"
    when_to_use: "Khởi động mọi phân tích chiến lược trong 1-2 giờ workshop; sau PESTEL/5 Forces (cho O, T) và trước VRIO (kiểm chứng S)."
    how_to_apply:
      - "Bước 1 Brainstorm: liệt kê hết S, W, O, T. S/W lấy từ nội bộ, O/T lấy từ kết quả PESTEL và 5 Forces (không bịa lại)."
      - "Bước 2 Sàng lọc: giữ 5-7 yếu tố quan trọng nhất mỗi góc."
      - "Bước 3 Đánh giá: cho trọng số và điểm tác động 1-5 (xem m09_swot_weighted)."
      - "Bước 4 TOWS: ghép S/W với O/T thành chiến lược SO, ST, WO, WT."
      - "Bước 5 Ưu tiên: chọn 2-3 chiến lược khả thi nhất (xem m09_tows_priority) rồi chuyển cho BSC/kế hoạch hành động."
    how_to_read_results: "Hai trục: nội bộ/ngoại cảnh và tích cực/tiêu cực. Phân biệt nội bộ (kiểm soát được) với ngoại cảnh (chỉ thích ứng được) là điểm hay bị lẫn."
    pitfalls:
      - "Chỉ liệt kê, không ưu tiên, không định lượng, chủ quan, bỏ sót điểm mù - đây là 6 nhược điểm nêu trong nguồn."
      - "Bỏ qua TOWS thì SWOT không ra hành động."
      - "Đưa yếu tố ngoại cảnh vào S/W hoặc ngược lại."
    example: "Grab (xem case_lessons): SWOT giúp nhận ra phải chuyển từ 'tăng trưởng bằng mọi giá' sang 'tăng trưởng có lãi'."
  - id: "m09_tows"
    name_vi: "Ma trận TOWS"
    name_en: "TOWS Matrix"
    origin: "Heinz Weihrich (1982), 'The TOWS Matrix'. Ra đời vì SWOT chỉ liệt kê mà không dẫn tới hành động."
    components:
      - "SO (Maxi-Maxi): dùng điểm mạnh để tận dụng cơ hội - chiến lược tấn công"
      - "ST (Maxi-Mini): dùng điểm mạnh để giảm đe dọa - phòng thủ"
      - "WO (Mini-Maxi): khắc phục điểm yếu để nắm cơ hội - cải thiện"
      - "WT (Mini-Mini): giảm thiểu điểm yếu để né đe dọa - sinh tồn"
    when_to_use: "Ngay sau khi có SWOT đã chấm điểm."
    how_to_apply:
      - "Lập lưới 2x2, mỗi ô ghép từng cặp yếu tố cụ thể (S3+O1 chứ không ghép chung chung)."
      - "Mỗi cặp viết một câu hành động cụ thể có chủ thể, hành động, chỉ số."
      - "Xếp hạng bằng điểm cặp; chọn 2-3."
    how_to_read_results: "Nếu phần lớn điểm cao nằm ở WT, doanh nghiệp đang ở thế sinh tồn - ưu tiên dòng tiền hơn tăng trưởng (như Grab 2023)."
    pitfalls: ["Ghép mơ hồ, không chỉ tên yếu tố", "Chọn quá nhiều chiến lược (>3) làm phân tán nguồn lực"]
    example: "Grab: SO = dữ liệu 300M+ user + mạng merchant -> fintech; WT = giảm phụ thuộc nhà đầu tư trước lãi suất tăng -> cắt giảm chi phí, sa thải 1,000+ nhân sự (2023)."
  - id: "m09_bcg"
    name_vi: "Ma trận BCG"
    name_en: "BCG Growth-Share Matrix"
    origin: "Bruce Henderson, Boston Consulting Group, 1970. Dựa trên đường cong kinh nghiệm; ra đời để công ty đa ngành biết bơm tiền cho đơn vị nào và rút tiền từ đơn vị nào."
    components:
      - "Trục ngang: thị phần tương đối. Trục dọc: tốc độ tăng trưởng thị trường."
      - "Star (thị phần cao, tăng trưởng cao): đầu tư mạnh để giữ/tăng vị thế; dòng tiền xấp xỉ 0; sẽ thành Cash Cow khi thị trường chậm lại. Ví dụ nguồn: iPhone 2010-2015."
      - "Cash Cow (cao, thấp): thu hoạch dòng tiền dư để nuôi Star và Question Mark. Ví dụ: Microsoft Office/Windows, Coca-Cola Classic."
      - "Question Mark (thấp, cao): tiêu thụ nhiều tiền; đầu tư chọn lọc đơn vị triển vọng nhất, loại phần còn lại. Ví dụ: Google Cloud 2020."
      - "Dog (thấp, thấp): dòng tiền xấp xỉ 0; cân nhắc thu hẹp/thoái vốn (nguồn đoạn Dog nằm sau dòng 1500; nguyên tắc chuẩn của BCG)."
    when_to_use: "Doanh nghiệp có từ 2 sản phẩm/SBU trở lên cần phân bổ vốn; bổ sung cho SWOT (SWOT không nói ưu tiên thị trường nào - nguồn ghi ở case Grab)."
    how_to_apply:
      - "Xác định đơn vị phân tích (SBU/sản phẩm) và định nghĩa thị trường đúng."
      - "Tính thị phần tương đối (m09_relative_share) và tăng trưởng thị trường."
      - "Chọn ngưỡng (RMS = 1.0; tăng trưởng 10% là quy ước, nói rõ khi báo cáo) và xếp vào ô."
      - "Gán chiến lược: Star = đầu tư, Cash Cow = thu hoạch, Question Mark = chọn lọc, Dog = thu hẹp/thoái."
      - "Kiểm tra vòng đời lý tưởng: Question Mark -> Star -> Cash Cow; danh mục cần cân bằng."
    how_to_read_results: "Danh mục toàn Question Mark thì sắp cạn tiền; toàn Cash Cow thì tương lai khô cạn. Cần Cash Cow đủ nuôi Question Mark triển vọng."
    pitfalls:
      - "Dùng thị phần tuyệt đối thay vì tương đối."
      - "Chỉ dùng 2 trục, bỏ qua hiệp lực giữa các đơn vị và khả năng tiếp cận vốn bên ngoài."
      - "Phần còn lại của mục BCG và GE-McKinsey nằm ở m10."
    example: "Vingroup (case_lessons): VinFast kiểu Question Mark tiêu tiền lớn, Vinhomes kiểu Cash Cow - nhưng phân loại này là suy luận của skill, nguồn chưa xếp."
  - id: "m09_hybrid_strategy"
    name_vi: "Chiến lược lai chi phí - khác biệt"
    name_en: "Hybrid cost/differentiation strategy"
    origin: "Phản biện hiện đại với 'Stuck in the Middle' của Porter, dựa trên IKEA, Toyota, Uniqlo, Xiaomi."
    components:
      - "IKEA: flat-pack, tự lắp ráp (rẻ) + thiết kế Scandinavian"
      - "Toyota: Toyota Production System (chi phí) + TQM, Kaizen (chất lượng)"
      - "Uniqlo: quy mô (giá phải chăng) + HEATTECH, AIRism (vải công nghệ)"
      - "Xiaomi: bán online, biên lợi nhuận bị 'chặn' ~5% + hệ sinh thái IoT"
    when_to_use: "Doanh nghiệp lớn có quy mô và một năng lực lõi vừa giảm chi phí vừa nâng chất lượng."
    how_to_apply:
      - "Xác định 'động cơ chung' tạo cả hai lợi thế (lean, thiết kế để sản xuất, R&D vải, bán trực tiếp + ecosystem)."
      - "Kiểm tra bằng VRIO rằng động cơ đó khó bắt chước."
      - "Nếu không có quy mô: quay về Focus."
    how_to_read_results: "Hybrid hợp lệ khi giá thấp hơn mà vẫn có đặc điểm khác biệt đo được; nếu chỉ nói 'vừa rẻ vừa tốt' mà không có cơ chế, đó là Stuck in the Middle."
    pitfalls: ["Dùng Hybrid làm lý do để dàn trải", "Chưa đủ quy mô"]
    example: "Bài học VN theo nguồn: DN nhỏ -> Focus; DN vừa -> Focus rồi Differentiation; DN lớn -> Cost Leadership hoặc Hybrid; startup -> Focus + Differentiation."

procedures:
  - id: "m09_proc_integrated_flow"
    name: "Quy trình tích hợp: bài toán chiến lược đa chiều đi qua framework nào, theo thứ tự nào"
    steps:
      - "Bước 0 - Chọn lăng kính: xác định có đang ở khâu 'chọn ngành/thị trường' (I/O: ưu tiên bước 1-2) hay 'vì sao hơn đối thủ' (RBV: ưu tiên bước 3-4). Thường cần cả hai."
      - "Bước 1 - Vĩ mô: PESTEL (m01). Mỗi yếu tố ghi cấp độ tác động (cực cao/cao/trung bình) và hành động ứng phó cụ thể. Tránh đánh giá quá lạc quan yếu tố Xã hội/thương hiệu (bài học VinFast)."
      - "Bước 2 - Ngành: 5 Forces (m01). Kết luận hấp dẫn hay kém hấp dẫn, lực nào đe dọa nhất; dự báo xu hướng thủ công vì mô hình không tự bắt được xu hướng mới (Katinat take-away)."
      - "Bước 3 - Doanh nghiệp: SWOT (m09) với O, T lấy từ bước 1-2; chấm điểm có trọng số."
      - "Bước 4 - Kiểm chứng điểm mạnh: VRIO (m02) cho từng S. Chỉ nguồn lực đạt V-R-I-O mới bảo vệ lâu dài; dùng CHIP để lý giải 'I'."
      - "Bước 5 - Nguồn gốc lợi thế: Value Chain (m02) chỉ ra hoạt động nào tạo ra lợi thế (Zara: tối ưu cả chuỗi, không từng khâu)."
      - "Bước 6 - Chọn chiến lược cạnh tranh: Generic (m03) / Hybrid; dùng checklist 3 câu (quy mô-chi phí? độc đáo? hiểu sâu phân khúc?). Chạy kiểm tra Stuck in the Middle."
      - "Bước 7 - Tăng trưởng và danh mục: Ansoff (m04) rồi BCG (m09) để chọn hướng tăng trưởng và phân bổ vốn. Diversification không liên quan = rủi ro cao nhất."
      - "Bước 8 - Chuyển sang thực thi/phòng thủ: Blue Ocean (m05) nếu muốn thoát cạnh tranh, BSC (m06) để đo, Scenario (m07) cho bất định."
      - "Bước 9 - Tổng hợp: viết 1 trang kết luận, mỗi framework 1-2 dòng, nêu khuyến nghị, rủi ro lớn nhất, chỉ số theo dõi."
    outputs: "Bản tổng hợp chiến lược 1 trang kèm bảng điểm SWOT/TOWS, kết quả VRIO, lựa chọn Generic/Ansoff, khuyến nghị và rủi ro."
  - id: "m09_proc_swot_tows"
    name: "SWOT có chấm điểm sang TOWS ưu tiên"
    steps:
      - "Lấy O/T từ PESTEL/5 Forces; S/W từ phân tích nội bộ."
      - "Giữ 3-7 yếu tố mỗi góc; gán trọng số (tổng mỗi góc = 1) và điểm 1-5."
      - "Tính điểm 4 góc (m09_swot_weighted) để biết thế chiến lược."
      - "Ghép cặp SO/ST/WO/WT, tính điểm cặp (m09_tows_priority), xếp hạng."
      - "Chọn 2-3 cặp điểm cao, viết hành động cụ thể (ai, làm gì, KPI), đối chiếu khả thi nguồn lực."
    outputs: "Bảng xếp hạng chiến lược và 2-3 hành động ưu tiên."
  - id: "m09_proc_case_analysis"
    name: "Phân tích một case theo chuỗi 'tại sao thành/bại'"
    steps:
      - "Tóm tắt bối cảnh (ngành, thời điểm, quy mô) và gắn cờ độ tin cậy số liệu."
      - "Chạy chuỗi framework phù hợp, ghi mỗi framework dẫn tới quyết định gì."
      - "Tách nhân tố cấu trúc (ngành/vĩ mô) khỏi nhân tố nội bộ (nguồn lực/năng lực)."
      - "Nêu bài học có thể chuyển cho SME và điều kiện áp dụng; ghi hạn chế của framework."
    outputs: "Bảng 'framework - phát hiện - quyết định' và 3 bài học."

decision_rules:
  - "Nếu 5 Forces cho thấy ngành kém hấp dẫn (cạnh tranh cao, người mua mạnh) thì người mới nên chọn Differentiation/Focus mạnh hoặc tìm ngách, thay vì cạnh tranh giá trực diện (case cà phê VN, VinFast vs Tesla)."
  - "Nếu một điểm mạnh trong SWOT không đạt đủ V-R-I-O thì không coi là lợi thế bền vững; không dồn nguồn lực bảo vệ nó."
  - "Nếu nguồn lực V và R nhưng không I thì chỉ là lợi thế tạm thời: khai thác nhanh và liên tục đổi mới; nếu V nhưng không R thì chỉ là ngang bằng (Competitive Parity), như thiết bị mua được từ GEA/Tetra Pak."
  - "Nếu V-R-I nhưng chưa O thì lợi thế chưa khai thác: sửa tổ chức/quy trình trước khi đầu tư thêm."
  - "Nếu doanh nghiệp nhỏ thì bắt đầu bằng Focus; chỉ cân nhắc Cost Leadership khi có economies of scale; chỉ cân nhắc Hybrid khi có một năng lực chung tạo cả hai lợi thế."
  - "Nếu đang theo đuổi cả rẻ lẫn cao cấp mà không có cơ chế thì dừng lại: nguy cơ Stuck in the Middle (Nokia, BlackBerry)."
  - "Nếu đa dạng hóa không liên quan đến năng lực cốt lõi (BĐS -> smartphone) thì xếp rủi ro CAO NHẤT trong Ansoff; nếu có related synergy (VinSchool/VinMec với hệ sinh thái Vinhomes) thì rủi ro thấp hơn."
  - "Nếu thị phần tương đối >= 1 và thị trường tăng trưởng cao thì Star: đầu tư mạnh; nếu thị phần tương đối < 1 và tăng trưởng cao thì Question Mark: chọn lọc, đừng rải đều."
  - "Nếu SWOT cho nhiều điểm cao ở góc W và T thì ưu tiên chiến lược sinh tồn (WT): cắt chi phí, giữ dòng tiền (Grab 2023)."
  - "Nếu điều kiện chính sách là động lực đầu tư (IRA với VinFast) thì phải kiểm tra điều kiện hưởng lợi có còn đúng khi chính sách đổi (nội địa hóa, xuất xứ pin)."
  - "Nếu PESTEL cho điểm lạc quan ở yếu tố Xã hội/thương hiệu thì cần dữ liệu hành vi khách hàng thật trước khi quyết định vốn lớn."

benchmarks:
  - {metric: "Vietjet: giá vé thấp hơn Vietnam Airlines", value: "30-50% (theo nguồn)", context: "Cost Leadership hàng không nội địa", confidence: "low"}
  - {metric: "Vietjet: thời gian quay đầu / giờ bay mỗi ngày", value: "25 phút so 45-60 phút; 13-14 giờ so 10-11 giờ (theo nguồn)", context: "Lean operations", confidence: "low"}
  - {metric: "Vietjet: ancillary / tổng doanh thu", value: "25-30% (theo nguồn)", context: "Bù giá vé thấp", confidence: "low"}
  - {metric: "Zara: chi quảng cáo / doanh thu", value: "~0.3% so với H&M 3-4% (theo nguồn)", context: "Marketing bằng vị trí cửa hàng", confidence: "low"}
  - {metric: "Zara: thời gian thiết kế đến cửa hàng", value: "2-3 tuần so 6 tháng (theo nguồn)", context: "Fast fashion", confidence: "medium"}
  - {metric: "Biên lợi nhuận gộp phần cứng: Apple và Xiaomi", value: "Apple 60-65%, Xiaomi 5-8% (theo nguồn)", context: "Differentiation và Cost Leadership; số này có nhiều khả năng bị nhầm giữa biên gộp toàn công ty và biên phần cứng", confidence: "low"}
  - {metric: "Rolls-Royce: sản lượng / giá", value: "~6,000 xe/năm; từ $350,000 (theo nguồn)", context: "Differentiation Focus", confidence: "medium"}
  - {metric: "Thang điểm SWOT", value: "Điểm 1-5; giữ 5-7 yếu tố mỗi góc", context: "Nguồn mục SWOT bước 2-3", confidence: "high"}

pitfalls:
  - "Coi mọi 'điểm mạnh' là lợi thế cạnh tranh: chỉ nguồn lực đạt V-R-I-O mới bền vững (bài học Samsung)."
  - "Tin PESTEL là điểm kết thúc: PESTEL chỉ là điểm khởi đầu; phải kết hợp 5 Forces, SWOT và dữ liệu hành vi khách hàng (bài học VinFast)."
  - "Đánh giá quá lạc quan yếu tố Xã hội/nhận diện thương hiệu khi vào thị trường mới."
  - "Dùng một framework độc lập mà không ghép chuỗi (SWOT không cho biết ưu tiên thị trường nào - cần BCG)."
  - "Nhầm Cost Leadership là 'rẻ tiền': Vietjet vẫn giữ an toàn bay; mô hình doanh thu phụ trợ bù giá vé thấp."
  - "Khi dùng số liệu trong case nguồn, quên rằng nhiều số là minh họa hoặc chưa kiểm chứng (xem lỗi nguồn bên dưới)."
  - "LỖI NGUỒN 1 (không sửa): Module 1 trình bày VinFast/PESTEL hai lần với số liệu khác nhau (đoạn cũ: 'thị trường xe điện Mỹ tăng 65% 2022'; đoạn mới: IRA siết điều kiện, lãi suất FED 5.25-5.5%). Hai đoạn không mâu thuẫn trực tiếp nhưng lặp; cẩm nang cũng đánh số 'Case Study 1' cho đoạn thứ hai và không cho đoạn đầu."
  - "LỖI NGUỒN 2: Tiêu đề file ghi 'CẨM NĂNG' (có lẽ là 'CẨM NANG'); câu 'Thực Thực Chiến Lược' ở mục lục Module 6; 'thuẩ suất' ở Grab T5; 'Trùng khơi định vị' ở tiêu đề case 3 (có lẽ 'Tương phản/Đối đầu')."
  - "LỖI NGUỒN 3: Tiêu đề mục 'Mục tiêu' và cấu trúc lặp lại ở đầu mỗi module (khối '> Mục tiêu' xuất hiện không có heading), và mã 'Case Study 1/2/3' trùng với các mục '### 5/6 Case Study' của bản cũ (có 2 bộ case cho PESTEL/VRIO/Generic: bản cũ + bản 'THẢO LUẬN CHUYÊN SÂU')."
  - "LỖI NGUỒN 4: Số 'Xiaomi biên lợi nhuận gộp 5-8%' trong bảng case 3 không khớp với phần Hybrid ('Xiaomi margin capped 5%'): cam kết 5% của Xiaomi là về lợi nhuận ròng phần cứng, không phải biên gộp. Cần xác minh trước khi dùng."
  - "LỖI NGUỒN 5: 'Samsung đầu tư R&D $230B trong 20 năm' và 'Samsung chiếm 80% thị phần AMOLED', 'chỉ 3 công ty làm được dưới 5nm' là số khó kiểm chứng/đã cũ; 'Apple chiếm 85%+ lợi nhuận ngành smartphone', '92% user iPhone trung thành' cũng là ước tính, không nêu nguồn."
  - "LỖI NGUỒN 6: Case Vinamilk nêu '14 siêu trang trại', '13 nhà máy', '200,000 điểm bán', 'trang trại hữu cơ lớn nhất châu Á' - mỗi con số chưa có nguồn trong file; không dùng làm số thật."
  - "LỖI NGUỒN 7: Bảng Vingroup phân loại 'BĐS cao cấp Hà Nội/HCM 2004-2010' là Market Penetration và 'Hàng không (VinPearl Air)' là Related Diversification: phân loại Ansoff gượng (khởi nghiệp Vinhomes là bắt đầu thị trường, không hẳn thâm nhập thị trường hiện có); 'VinPearl Air' và 'Hủy kế hoạch' cần xác minh. Cũng ghi 'Related Diversification' nhưng bảng nhóm sau đó giải thích VinSchool/VinMec là 'Unrelated' ở bảng và 'related synergy' ở lời bài học - mâu thuẫn nhãn."
  - "LỖI NGUỒN 8: Case VinFast nói sẽ 'cho thuê pin' như khuyến nghị 'Niche Differentiation' nhưng thực tế cũng như điều kiện IRA nêu trong cẩm nang (hơn 4 tỷ USD nhà máy North Carolina) là kế hoạch/đã điều chỉnh nhiều lần; coi là minh họa, không phải hiện trạng. Mục 'Cạnh tranh trong 5 Forces: sức mạnh nhà cung cấp pin' dùng CATL, Panasonic nhưng khẳng định 'giá bán sỉ' chưa kiểm chứng."
  - "LỖI NGUỒN 9: Case Nokia/BlackBerry mô tả BlackBerry là 'bán tống bộ phận di động' và Nokia 'bán tháo' - đơn giản hóa; Nokia bán mảng thiết bị cho Microsoft 2013-2014, BlackBerry chuyển sang phần mềm/bảo mật và licensing. Dùng làm minh họa, không dùng làm sự kiện chi tiết."
  - "LỖI NGUỒN 10: Phần Grab ghi 'Lên sàn NASDAQ (SPAC merger 2021)' và 'Q4/2023 lần đầu có lãi' - độ chính xác cần xác minh (Grab công bố điều chỉnh EBITDA dương từ 2023; lãi ròng GAAP chưa chắc). Ghi 'sa thải 1,000+ NV (2023)' theo nguồn (thực tế ~1,000 là con số công bố 2023)."

sme_vn_guidance:
  - "Quy trình tích hợp rút gọn cho SME (1-2 buổi): PESTEL 6 dòng -> 5 Forces chấm 1-5 -> SWOT 4x5 yếu tố -> VRIO cho 3 điểm mạnh nhất -> chọn Focus hay Differentiation -> 3 hành động TOWS ưu tiên -> 3 KPI theo dõi."
  - "SME mới vào ngành cà phê/F&B: ngành kém hấp dẫn theo 5 Forces nên bắt buộc phải có khác biệt rõ (trải nghiệm, không gian, sản phẩm); kênh phân phối/hệ sinh thái (Phúc Long - Masan/WinMart) và thương hiệu mạnh (Highlands 700+ cửa hàng) là lý do thắng của chuỗi lớn."
  - "SME có nhiều sản phẩm nên chạy BCG đơn giản bằng Google Sheets: thị phần tương đối (so đối thủ lớn nhất trong khu vực) và tăng trưởng doanh số ngành; dùng để chọn cắt giảm hoặc dồn vốn."
  - "Phân khúc tập trung (Focus) cho SME VN: ví dụ trong nguồn Phở Thìn, L'angfarm Đà Lạt; chi phí công cụ/phần mềm không có trong phần này nên không nêu giá."
  - "Mọi nhận định pháp lý/thuế khi áp dụng cho SME VN trong bài này cần xác nhận với chuyên gia hiện hành."

case_lessons:
  - name: "VinFast thâm nhập thị trường Mỹ (PESTEL + 5 Forces)"
    type: "failure"
    setup: >-
      VinFast (Vingroup) xây nhà máy xe điện ở North Carolina (quyết định 2022) để hưởng IRA; vào thị trường có Tesla, Ford, GM, Toyota, đối thủ Trung Quốc.
      Cẩm nang có hai lớp: bản PESTEL đơn giản (6 dòng) và bản 'động' kèm 5 Forces chấm mức.
    key_calculations:
      - "IRA: xe điện không lắp ráp nội địa Bắc Mỹ mất trợ cấp thuế $7,500/xe -> giá tương đối cao hơn $7,500 so với xe lắp ráp tại Mỹ. Giải pháp: nhà máy North Carolina (nguồn nêu >4 tỷ USD)."
      - "Lãi suất FED 5.25-5.5%, lãi vay mua xe 7-9% -> người mua trì hoãn; giải pháp: leasing giảm chi phí ban đầu."
      - "Bảo hành đề xuất: 10 năm hoặc 125,000 dặm so với mặt bằng 3-5 năm của đối thủ -> bù rào cản lòng tin thương hiệu mới."
      - "5 Forces: Rivalry cực khốc liệt; Buyers cực cao; Suppliers trung bình-cao; Substitutes trung bình; New Entrants trung bình. Không có điểm số trong nguồn nên chấm lại bằng m01 nếu cần."
