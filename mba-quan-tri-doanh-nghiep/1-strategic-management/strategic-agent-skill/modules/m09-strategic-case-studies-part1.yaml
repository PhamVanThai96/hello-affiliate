worked_examples:
  - id: "m09_we_swot_tows"
    title: "SWOT có trọng số và xếp hạng TOWS (giả định minh họa dựa trên case Grab)"
    inputs:
      S: "S1 thương hiệu (w=0.40, s=5); S3 dữ liệu (0.35, 4); S4 merchant (0.25, 4)"
      W: "W1 lỗ (0.50, 5); W2 phụ thuộc nhà đầu tư (0.20, 3); W5 chi phí khuyến mãi (0.30, 4)"
      O: "O1 fintech (0.50, 5); O5 quảng cáo (0.30, 4); O4 grocery (0.20, 3)"
      T: "T1 Gojek-Tokopedia (0.40, 4); T3 đối thủ địa phương (0.30, 3); T4 lãi suất (0.30, 4)"
    steps:
      - "S = 0.40*5 + 0.35*4 + 0.25*4 = 2.0 + 1.4 + 1.0 = 4.4"
      - "W = 0.50*5 + 0.20*3 + 0.30*4 = 2.5 + 0.6 + 1.2 = 4.3"
      - "O = 0.50*5 + 0.30*4 + 0.20*3 = 2.5 + 1.2 + 0.6 = 4.3"
      - "T = 0.40*4 + 0.30*3 + 0.30*4 = 1.6 + 0.9 + 1.2 = 3.7"
      - "Điểm cặp P = (w*s nội bộ)*(w*s ngoại cảnh): S1xO1 = (0.4*5)*(0.5*5) = 2.0*2.5 = 5.0; S3xO1 = 1.4*2.5 = 3.5; WxO: W1xO5 = (0.5*5)*(0.3*4) = 2.5*1.2 = 3.0; S1xT3 = 2.0*0.9 = 1.8; W2xT4 = (0.2*3)*(0.3*4) = 0.6*1.2 = 0.72"
      - "Xếp hạng: S1xO1 (5.0) > S3xO1 (3.5) > W1xO5 (3.0) > S1xT3 (1.8) > W2xT4 (0.72)"
    result: >-
      Nội bộ mạnh (S 4.4) nhưng yếu tố W cũng lớn (4.3), cơ hội cao (4.3): ưu tiên SO (fintech từ thương hiệu/dữ liệu), kế đó WO (quảng cáo để vá lỗ). WT điểm thấp nhưng vẫn cần làm
      (cắt chi phí) vì ảnh hưởng dòng tiền - điểm thấp không có nghĩa bỏ qua rủi ro sinh tồn. Trọng số/điểm là giả định của skill.
  - id: "m09_we_vrio"
    title: "Phân loại VRIO cho 4 nguồn lực Vinamilk"
    inputs:
      vinamilk_resources: "trang trại (1,1,1,1); phân phối GT (1,1,1,1); thương hiệu (1,1,1,1, 'Khó'); dây chuyền tiệt trùng (1,0,0,1)"
      rule: "Kiểm tra theo thứ tự V->R->I->O, dừng ở tiêu chí đầu tiên Không đạt"
    steps:
      - "def vrio(v,r,i,o): V=0 -> disadvantage; R=0 -> parity; I=0 -> temporary; O=0 -> unused; còn lại -> sustained"
      - "vrio(1,1,1,1) = sustained (trang trại, phân phối, thương hiệu)"
      - "vrio(1,0,0,1) = parity (dây chuyền): dừng ở R=0, bất kể I"
      - "Ví dụ thêm: vrio(1,1,0,1) = temporary (mạng lưới sản xuất VN của Samsung); vrio(1,1,1,0) = unused; vrio(0,0,0,0) = disadvantage (Tizen)"
    result: "3 nguồn lực bền vững, 1 ngang bằng. Bảo vệ 3 nguồn lực đầu bằng đầu tư dài hạn; dây chuyền tiệt trùng chỉ cần duy trì ngang chuẩn."
  - id: "m09_we_5forces"
    title: "Chấm điểm hấp dẫn ngành cà phê VN bằng 5 Forces có trọng số (giả định của skill)"
    inputs:
      forces: "Rivalry (w=0.30, đe dọa 5); Entrants (0.15, 3); Suppliers (0.15, 2); Buyers (0.25, 4); Substitutes (0.15, 3)"
      mapping_from_source: "Rất cao=5; Cao=4; Trung bình=3; Thấp=2"
    steps:
      - "Tổng trọng số = 0.30+0.15+0.15+0.25+0.15 = 1.00"
      - "Điểm đe dọa = 0.30*5 + 0.15*3 + 0.15*2 + 0.25*4 + 0.15*3 = 1.5 + 0.45 + 0.30 + 1.0 + 0.45 = 3.70"
      - "Mức hấp dẫn = 6 - 3.70 = 2.30 (thang đảo 1-5, 5 là hấp dẫn nhất)"
    result: "Hấp dẫn 2.3/5 -> ngành kém hấp dẫn cho người mới, khớp kết luận của nguồn. Khuyến nghị: Differentiation/Focus rõ rệt hoặc tận dụng hệ sinh thái. Trọng số là giả định."
  - id: "m09_we_apple_xiaomi"
    title: "Cơ chế lợi nhuận của hai cực Generic: Apple và Xiaomi"
    inputs:
      apple: "ASP 1,200 USD (giữa dải 1,000-1,600 chọn tròn); biên gộp 62.5% (giữa 60-65%)"
      xiaomi: "ASP 225 USD (giữa 150-300); biên gộp 6.5% (giữa 5-8%)"
    steps:
      - "Lãi gộp Apple / máy = 1,200 * 0.625 = 750 USD"
      - "Lãi gộp Xiaomi / máy = 225 * 0.065 = 14.625 USD"
      - "Tỷ lệ = 750 / 14.625 = 51.28 máy Xiaomi bù 1 máy Apple về lãi gộp"
      - "Ví dụ 100 triệu máy Apple -> lãi gộp 75 tỷ USD; để bằng, Xiaomi cần 75e9/14.625 = 5,128 triệu máy (~5.1 tỷ), vượt xa quy mô thị trường"
    result: >-
      Cost Leadership cần khối lượng và chi phí cực thấp, phần cứng chỉ là cửa ngõ (lợi nhuận bù bằng hệ sinh thái/dịch vụ - Hybrid). Differentiation sống bằng biên cao. Số liệu là giả định ở giữa dải
      từ nguồn chưa kiểm chứng; dùng để minh họa logic, không để kết luận về công ty thật.
  - id: "m09_we_bcg"
    title: "Xếp danh mục 5 sản phẩm vào ma trận BCG (giả định minh họa)"
    inputs:
      products: "A (thị phần 30%, đối thủ lớn nhất 12%, tăng trưởng 15%); B (20%, 40%, 12%); C (5%, 25%, 14%); D (3%, 18%, 2%); E (25%, 10%, 3%)"
      thresholds: "RMS = 1.0; tăng trưởng thị trường 10% (quy ước chọn, cần nêu rõ)"
    steps:
      - "RMS_A = 30/12 = 2.50; tăng trưởng 15% -> cao -> Star"
      - "RMS_B = 20/40 = 0.50; 12% -> cao -> Question Mark"
      - "RMS_C = 5/25 = 0.20; 14% -> cao -> Question Mark"
      - "RMS_D = 3/18 = 0.17; 2% -> thấp -> Dog"
      - "RMS_E = 25/10 = 2.50; 3% -> thấp -> Cash Cow"
    result: >-
      A = Star (đầu tư), E = Cash Cow (thu hoạch nuôi A và Question Mark), D = Dog (thu hẹp/thoái), B và C = Question Mark: B (RMS 0.50) triển vọng hơn C (0.20) nên đầu tư chọn lọc B,
      cân nhắc rút C. Kiểm tra sau: nếu B vẫn không nâng RMS, hạ xuống Dog.

practice_questions:
  - q: "Phân biệt I/O và RBV; khi nào ưu tiên cái nào?"
    a: "I/O là Outside-In (ngành quyết định lợi nhuận, công cụ PESTEL/5 Forces/Generic); RBV là Inside-Out (nguồn lực độc đáo, công cụ VRIO/Value Chain). Chọn thị trường mới -> bắt đầu I/O; giải thích vì sao ta hơn đối thủ -> RBV. Thực hành: dùng cả hai theo chuỗi tích hợp."
  - q: "Một nguồn lực V=Có, R=Có, I=Không, O=Có thì kết quả VRIO là gì và hành động gì?"
    a: "Lợi thế tạm thời (Temporary Advantage). Khai thác nhanh, tái đầu tư đổi mới, và tìm cách nâng khả năng khó bắt chước (CHIP) hoặc chuyển sang nguồn lực khác."
  - q: "Vì sao SWOT cần TOWS?"
    a: "SWOT chỉ liệt kê, không ưu tiên, không dẫn tới hành động. TOWS (Weihrich 1982) ghép S/W với O/T thành 4 loại chiến lược SO, ST, WO, WT để chọn 2-3 hành động cụ thể."
  - q: "Tính thị phần tương đối và ô BCG: thị phần 8%, đối thủ lớn nhất 24%, thị trường tăng 18%."
    a: "RMS = 8/24 = 0.33 (<1), tăng trưởng 18% cao -> Question Mark: chọn lọc đầu tư nếu có lợi thế đặc thù, nếu không thì rút."
  - q: "Vì sao Nokia/BlackBerry bị coi là Stuck in the Middle theo nguồn?"
    a: "Không rẻ được như Android (Cost) và không tạo trải nghiệm cao cấp như iPhone (Differentiation); R&D phân mảnh; BlackBerry giữ định vị thiết bị công sở B2B trong khi thị trường chuyển sang giải trí tiêu dùng. Lưu ý: chi tiết sự kiện là minh họa."
  - q: "Vì sao Vsmart thất bại còn VinSchool/VinMec tương đối ổn theo cẩm nang?"
    a: "Vsmart: Diversification không liên quan (BĐS -> smartphone), thiếu năng lực công nghệ lõi. VinSchool/VinMec: có related synergy với hệ sinh thái Vinhomes/smart city. Theo Ansoff, rủi ro Diversification cao nhất và giảm khi liên quan đến năng lực hiện có."
  - q: "Chấm Điểm: weights (0.6, 0.4), scores (5, 3) -> điểm góc?"
    a: "0.6*5 + 0.4*3 = 3.0 + 1.2 = 4.2."
  - q: "Vì sao PESTEL của VinFast tại Mỹ lạc quan nhưng kết quả thực tế yếu?"
    a: "Đánh giá quá lạc quan yếu tố Xã hội/nhận diện thương hiệu; ngoài ra điều kiện IRA cần nội địa hóa. PESTEL phải kết hợp 5 Forces, SWOT, dữ liệu hành vi khách hàng."
  - q: "Hybrid khác Stuck in the Middle ở đâu?"
    a: "Hybrid có một cơ chế chung tạo cả hai lợi thế (TPS cho Toyota, thiết kế flat-pack cho IKEA); Stuck in the Middle thì không có cơ chế, chỉ mong muốn cả hai, nên R&D và chi phí phân mảnh."
  - q: "SME 5 nhân sự bán đồ ăn vặt online nên theo Generic nào?"
    a: "Focus (nguồn: DN nhỏ bắt đầu bằng Focus). Chọn một nhóm khách cụ thể, hiểu sâu, rồi mới mở rộng sang Differentiation khi đủ năng lực."

checklist:
  - "[ ] Đã xác định bài toán thuộc 'chọn chơi ở đâu' (I/O) hay 'vì sao hơn đối thủ' (RBV), và dùng cả hai?"
  - "[ ] PESTEL: mỗi yếu tố có cấp độ tác động và hành động ứng phó; yếu tố Xã hội/thương hiệu có dữ liệu khách hàng thật?"
  - "[ ] 5 Forces: có kết luận hấp dẫn/kém hấp dẫn và lực đe dọa nhất; đã bổ sung xu hướng mà mô hình không tự bắt được?"
  - "[ ] SWOT: 5-7 yếu tố mỗi góc, có trọng số tổng = 1, có điểm 1-5, O/T lấy từ PESTEL/5 Forces?"
  - "[ ] TOWS: chọn tối đa 2-3 chiến lược, hành động cụ thể?"
  - "[ ] VRIO: mỗi điểm mạnh kiểm theo V->R->I->O, lý giải I bằng CHIP?"
  - "[ ] Value Chain: biết lợi thế đến từ hoạt động nào?"
  - "[ ] Generic: kiểm tra Stuck in the Middle; nếu Hybrid, nêu cơ chế chung?"
  - "[ ] Ansoff/BCG: hướng tăng trưởng và phân bổ vốn; Diversification không liên quan có lý do thật mạnh?"
  - "[ ] Số liệu case: gắn cờ độ tin cậy (verified/illustrative/unverified), không nói như sự thật?"
  - "[ ] Có bước chuyển sang đo lường (BSC), đổi mới (Blue Ocean), kịch bản (Scenario) nếu cần?"

excel_google_sheets_templates:
  - name: "SWOT chấm điểm + TOWS"
    layout: "Sheet 1: 4 bảng S/W/O/T (yếu tố, trọng số, điểm 1-5, =SUMPRODUCT). Sheet 2: lưới ghép cặp, ô điểm = (w_i*s_i)*(w_j*s_j), xếp hạng bằng =RANK()."
  - name: "BCG danh mục"
    layout: "Cột: sản phẩm, doanh số, thị phần, thị phần đối thủ lớn nhất, RMS = thị phần / đối thủ, tăng trưởng thị trường, ô BCG = IF(AND(RMS>=1,g>=10%),\"Star\",...). Biểu đồ bong bóng với kích thước = doanh số."
  - name: "VRIO tracker"
    layout: "Cột: nguồn lực, V, R, I (lý do CHIP), O, kết quả = IF(V=0,\"Bất lợi\",IF(R=0,\"Ngang bằng\",IF(I=0,\"Tạm thời\",IF(O=0,\"Chưa khai thác\",\"Bền vững\"))))."

