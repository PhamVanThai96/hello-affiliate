# m03 - Chiến lược cạnh tranh (distill từ 03-chien-luoc-canh-tranh.md)
id: "m03"
name_vi: "Chiến lược cạnh tranh chung của Porter"
name_en: "Competitive Strategy: Cost Leadership, Differentiation, Focus"
purpose: >
  Giúp doanh nghiệp chọn và triển khai MỘT con đường tạo lợi thế cạnh tranh bền vững (chi phí thấp, khác biệt hóa, hoặc tập trung
  vào phân khúc hẹp), tránh bị "kẹt ở giữa", và kiểm tra bằng số: lợi thế chi phí có thật không, premium có bù được chi phí khác biệt không,
  niche có đủ hấp dẫn không. Đầu ra là quyết định chiến lược kèm điều kiện thành công, rủi ro và chỉ số theo dõi.
when_to_use:
  - "Chủ SME/startup hỏi 'nên cạnh tranh bằng giá rẻ hay chất lượng/khác biệt?', 'tôi nhỏ thì đánh vào đâu?'."
  - "Cần chọn/định vị chiến lược cạnh tranh sau khi đã phân tích môi trường (m01) và nội bộ (m02)."
  - "Đối thủ đang phá giá hoặc bắt chước, cần quyết định đáp trả hay đổi cách chơi."
  - "Muốn biết chiến lược hiện tại có bị 'stuck in the middle' không (giá không rẻ nhất, cũng không khác biệt rõ)."
  - "Đánh giá khả thi Cost Leadership (quy mô, công suất, đường cong kinh nghiệm) hoặc Differentiation (premium vs chi phí)."
  - "Chọn niche (Focus) và quyết định Cost Focus hay Differentiation Focus; xét lai (Hybrid) như IKEA, Toyota, Uniqlo."
prerequisites:
  - "m01 - Phân tích môi trường bên ngoài (Porter's 5 Forces cho biết sức hấp dẫn ngành và áp lực để chọn chiến lược)"
  - "m02 - Phân tích nội bộ (Value Chain xác định nguồn chi phí/khác biệt; VRIO kiểm tra khó bắt chước)"
related_modules:
  - "m01 - 5 Forces: mỗi chiến lược chống lại các lực khác nhau (cost leadership chống rivalry và substitutes, differentiation giảm buyer power)"
  - "m02 - Value Chain và VRIO: nguồn của chi phí thấp và của khác biệt bền vững"
  - "m04 - Chiến lược tăng trưởng (Ansoff): sau khi có lợi thế cạnh tranh mới chọn hướng mở rộng"
  - "m05 - Blue Ocean: lối thoát khi Cost vs Differentiation trade-off bị phá bằng value innovation (vừa giảm chi phí vừa tăng giá trị)"
  - "m06 - Balanced Scorecard: biến chiến lược đã chọn thành KPI"
  - "m07 - Scenario planning: kiểm tra chiến lược dưới các kịch bản (phá giá, công nghệ mới)"
  - "m08 - Case The Coffee House: ví dụ định vị khác biệt/Hybrid trong F&B Việt Nam"
  - "Module Marketing (STP, Pricing) và Finance (break-even, NPV) ngoài bộ skill này khi cần định giá và tính hiệu quả tài chính"

concepts:
  - term_vi: "Lợi thế cạnh tranh bền vững"
    term_en: "Sustainable Competitive Advantage"
    definition: "Khả năng DN tạo ra giá trị cho khách hàng vượt trội hơn đối thủ và duy trì được theo thời gian, thể hiện bằng lợi nhuận cao hơn mức trung bình ngành."
    why_it_matters: "Porter (1980, Competitive Strategy; 1985, Competitive Advantage) cho rằng lợi nhuận trên trung bình chỉ đến từ một trong hai nguồn: chi phí thấp hơn hoặc giá bán cao hơn nhờ khác biệt. Mọi chiến lược chung chỉ là tổ hợp của hai nguồn này với phạm vi thị trường rộng hay hẹp."
  - term_vi: "Ma trận 3 chiến lược chung (2 trục: nguồn lợi thế x phạm vi thị trường)"
    term_en: "Generic Strategies Matrix"
    definition: "Trục ngang: nguồn lợi thế (chi phí thấp hoặc khác biệt hóa). Trục dọc: phạm vi (thị trường rộng hoặc phân khúc hẹp). Ra 3 chiến lược: Cost Leadership (rộng, chi phí), Differentiation (rộng, khác biệt), Focus (hẹp) tách 2 biến thể Cost Focus và Differentiation Focus."
    why_it_matters: "Ép DN trả lời 2 câu hỏi nền tảng: 'Thắng bằng cái gì?' và 'Phục vụ ai?'. Thiếu câu trả lời rõ thì nguồn lực bị dàn trải."
  - term_vi: "Kẹt ở giữa"
    term_en: "Stuck in the Middle"
    definition: "Tình trạng DN theo đuổi đồng thời chi phí thấp và khác biệt hóa trên thị trường rộng nhưng không đạt vượt trội nào: không rẻ nhất, không đặc sắc nhất, thường lợi nhuận dưới trung bình."
    why_it_matters: "Hai chiến lược đòi hỏi tổ chức, văn hóa, đầu tư khác nhau (kỷ luật chi phí vs sáng tạo, chấp nhận chi phí cao). Trộn lẫn thì không bên nào đủ sâu. Phản biện: Toyota, Apple, IKEA, Uniqlo kết hợp được nhờ năng lực đặc biệt (lean, hệ sinh thái, thiết kế-sản xuất). Với DN nhỏ nguyên tắc vẫn gần như luôn đúng."
  - term_vi: "Dẫn đầu chi phí khác với giá thấp nhất"
    term_en: "Cost Leadership is not Lowest Price"
    definition: "Cost Leadership là chi phí đơn vị thấp nhất ngành ở chất lượng chấp nhận được. Giá bán là quyết định riêng: bán ngang thị trường để hưởng margin cao hơn, hoặc bán thấp hơn để giành thị phần."
    why_it_matters: "Nhầm hai khái niệm khiến DN phá giá khi chưa có lợi thế chi phí và tự giết margin. Chỉ phá giá khi có khoảng cách chi phí và đối thủ không chịu nổi."
  - term_vi: "Nguồn lợi thế chi phí (7 nguồn)"
    term_en: "Cost Drivers"
    definition: "Economies of Scale, Learning Curve, Technology, Product Design, Input Costs, Capacity Utilization, Organizational Efficiency."
    why_it_matters: "Biết nguồn nào áp dụng được thì mới đầu tư đúng chỗ. SME hiếm khi thắng bằng scale nên thường chỉ khai thác được utilization, design, organizational efficiency, input cục bộ."
  - term_vi: "Nguồn khác biệt hóa (7 nguồn)"
    term_en: "Differentiation Drivers"
    definition: "Sản phẩm, Dịch vụ, Thương hiệu, Công nghệ, Nhân sự, Kênh phân phối, Mối quan hệ (ecosystem)."
    why_it_matters: "Khác biệt phải là thứ khách cảm nhận và trả tiền; càng gắn với tài sản khó sao chép (thương hiệu, hệ sinh thái, tri thức tích lũy) càng bền (liên kết VRIO ở m02)."
  - term_vi: "Chi phí chuyển đổi"
    term_en: "Switching Cost"
    definition: "Chi phí (tiền, công sức, rủi ro, cảm xúc) khách chịu khi đổi sang nhà cung cấp khác."
    why_it_matters: "Là cơ chế giữ premium bền vững: hệ sinh thái Apple, bespoke của Rolls-Royce tạo switching cost cao nên khách ít chạy theo giá rẻ. Cost Leadership thì khách ít trung thành do switching cost thấp."
  - term_vi: "Phân khúc ngách"
    term_en: "Niche Segment"
    definition: "Nhóm khách hàng hẹp có nhu cầu đặc thù, đủ lớn để sinh lời nhưng đủ nhỏ để đối thủ lớn không ưu tiên."
    why_it_matters: "Focus cho phép DN nhỏ thắng đối thủ lớn nhờ hiểu sâu và dồn nguồn lực; rủi ro là niche co lại hoặc bị 'niche within niche'."
  - term_vi: "Chiến lược lai"
    term_en: "Hybrid Strategy"
    definition: "Kết hợp chi phí thấp và khác biệt: IKEA (thiết kế đẹp + flat-pack), Toyota (TPS lean + chất lượng cao), Uniqlo (R&D vải + sản xuất quy mô), Xiaomi (cam kết lãi ròng phần cứng tối đa 5% + hệ sinh thái IoT)."
    why_it_matters: "Khả thi khi chính năng lực lõi vừa giảm chi phí vừa nâng giá trị (lean, thiết kế để sản xuất, quy mô cực lớn). Nếu không có năng lực này mà cố làm cả hai thì rơi vào stuck in the middle."

formulas:
  - id: "m03_experience_curve"
    name_vi: "Đường cong kinh nghiệm (chi phí/thời gian đơn vị thứ n)"
    name_en: "Experience / Learning Curve (Wright)"
    expression_latex: "C_n = C_1 \\cdot n^{b},\\quad b=\\log_2(r)"
    expression_python: "c1 * n ** math.log(rate, 2)"
    excel: "=C1*n^(LOG(rate,2))"
    variables:
      - {symbol: "c1", meaning: "Chi phí (hoặc giờ công) của đơn vị đầu tiên", unit: "VNĐ hoặc giờ"}
      - {symbol: "n", meaning: "Thứ tự đơn vị sản xuất (số lượng tích lũy)", unit: "đơn vị"}
      - {symbol: "rate", meaning: "Tỷ lệ học tập: mỗi lần SẢN LƯỢNG TÍCH LŨY GẤP ĐÔI, chi phí đơn vị còn rate (0.8 = đường cong 80%)", unit: "0-1"}
    when_to_use: "Ước lượng lợi thế chi phí của DN đi trước/quy mô tích lũy lớn hơn; lập kế hoạch giá và điểm hòa vốn khi sản xuất lặp lại (lắp ráp, may, bán dẫn)."
    why_it_works: >
      Theodore Wright (1936, ngành chế tạo máy bay Mỹ) quan sát giờ công mỗi máy bay giảm đều theo cấp số nhân khi số máy bay đã sản xuất gấp đôi.
      BCG (Bruce Henderson, thập niên 1960) khái quát hóa thành 'đường cong kinh nghiệm' cho tổng chi phí. Lý do: công nhân thạo hơn, quy trình tối ưu hơn,
      thiết kế đơn giản hơn, mua nguyên liệu rẻ hơn. DN sản xuất nhiều hơn đi xuống đường cong nhanh hơn nên có chi phí thấp hơn, đó là cơ sở của Cost Leadership theo quy mô tích lũy.
    assumptions:
      - "Hoạt động lặp lại, sản phẩm ổn định (không đổi thiết kế liên tục)."
      - "Tỷ lệ học tập r hằng số (thực tế phải ước lượng từ dữ liệu lịch sử của chính DN)."
    pitfalls:
      - "Nhầm 'gấp đôi sản lượng tích lũy' với 'gấp đôi sản lượng năm'."
      - "Đường cong chững lại ở mức trưởng thành; công nghệ mới có thể phá lợi thế đã tích lũy."
      - "Dùng r của ngành khác (ví dụ 80%) khi chưa có dữ liệu của mình."
    interpretation: "r càng nhỏ (70-80%) học càng nhanh. Chênh lệch chi phí với đối thủ có tích lũy gấp 4 lần: chi phí thấp hơn khoảng 1-r^2 (r=0.8 thì còn 64%)."
    example:
      inputs: {c1: 100, n: 8, rate: 0.8}
      steps:
        - "b = log2(0.8) = -0.3219"
        - "8 = 2^3, tức gấp đôi 3 lần: 100 x 0.8^3 = 51.2"
        - "Kiểm tra: 100 x 8^(-0.3219) = 51.2"
      result: "Đơn vị thứ 8 tốn 51.2 giờ công (đơn vị thứ 16 còn 40.96)."
  - id: "m03_unit_cost_utilization"
    name_vi: "Chi phí đơn vị theo công suất sử dụng"
    name_en: "Unit Cost vs Capacity Utilization"
    expression_latex: "c = \\frac{F}{Cap\\cdot u} + v"
    expression_python: "fixed / (capacity * utilization) + var_cost"
    excel: "=F/(Cap*u)+v"
    variables:
      - {symbol: "fixed", meaning: "Tổng chi phí cố định kỳ (thuê, khấu hao, lương cố định)", unit: "VNĐ/kỳ"}
      - {symbol: "capacity", meaning: "Công suất tối đa trong kỳ", unit: "sản phẩm/kỳ"}
      - {symbol: "utilization", meaning: "Tỷ lệ sử dụng công suất", unit: "0-1"}
      - {symbol: "var_cost", meaning: "Chi phí biến đổi mỗi đơn vị", unit: "VNĐ/sp"}
    when_to_use: "Đánh giá nguồn Capacity Utilization (xưởng, quán, đội xe, hàng không). Nguồn lợi thế chi phí dễ khai thác nhất của SME."
    why_it_works: "Chi phí cố định không đổi nên chia cho nhiều đơn vị hơn thì phần cố định/đơn vị giảm. Đây là cách Vietjet bay 13-14 giờ/ngày thay vì 10-11 giờ: cùng chi phí cố định của chiếc máy bay trải trên nhiều chuyến."
    assumptions:
      - "Chi phí cố định không đổi trong dải sản lượng xét (không vượt công suất, không nhảy bậc)."
    pitfalls:
      - "Đẩy utilization bằng giảm giá sâu có thể làm margin âm dù chi phí/đơn vị giảm."
      - "Quên bậc chi phí cố định khi vượt công suất (thêm máy, thêm ca)."
    interpretation: "So sánh với giá thị trường: lợi thế chi phí = (giá - c) / giá. Đối thủ utilization thấp bị chi phí đơn vị cao hơn nên chịu giá kém."
    example:
      inputs: {fixed: 600000000, capacity: 20000, var_cost: 90000, utilization: 0.5}
      steps:
        - "u=50%: 600,000,000/(20,000x0.5) + 90,000 = 60,000 + 90,000 = 150,000"
        - "u=85%: 600,000,000/(20,000x0.85) + 90,000 = 35,294 + 90,000 = 125,294"
      result: "Tăng utilization 50% lên 85% giảm chi phí/sp từ 150,000 xuống 125,294 (giảm 16.5%)."
  - id: "m03_cost_advantage"
    name_vi: "Lợi thế chi phí tương đối và margin tại giá thị trường"
    name_en: "Relative Cost Advantage"
    expression_latex: "ADV = \\frac{c_{rival}-c_{own}}{c_{rival}},\\quad margin=\\frac{P-c_{own}}{P}"
    expression_python: "(c_rival - c_own) / c_rival"
    excel: "=(c_rival-c_own)/c_rival"
    variables:
      - {symbol: "c_rival", meaning: "Chi phí đơn vị của đối thủ/trung bình ngành", unit: "VNĐ/sp"}
      - {symbol: "c_own", meaning: "Chi phí đơn vị của DN", unit: "VNĐ/sp"}
    when_to_use: "Bước benchmark (Bước 2 của Cost Leadership) để xác nhận có thực sự là 'lowest cost' hay không."
    why_it_works: "Lợi thế chi phí chỉ có nghĩa so với đối thủ gần nhất. ADV cho biết biên an toàn khi phá giá: có thể giảm giá tối đa tới mức mà đối thủ lỗ nhưng mình vẫn lãi."
    assumptions:
      - "Chi phí đối thủ ước lượng đủ tin cậy (từ BCTC, benchmark ngành, mystery shopping)."
    pitfalls:
      - "So chi phí khác chất lượng/phạm vi dịch vụ; dùng giá bán thay cho chi phí."
    interpretation: "ADV từ 10% trở lên là đáng kể, có thể phá giá; dưới 5% dễ bị san bằng. ADV âm nghĩa là DN không thể đi con đường Cost Leadership."
    example:
      inputs: {c_rival: 100, c_own: 90}
      steps: ["ADV = (100-90)/100 = 10%", "Nếu giá thị trường 120: margin mình = 30/120 = 25%, đối thủ = 20/120 = 16.7%"]
      result: "Lợi thế chi phí 10%; ở giá 120 margin hơn đối thủ 8.3 điểm %."
  - id: "m03_price_war_volume"
    name_vi: "Sản lượng cần tăng bù cho giảm giá (phá giá có đáng không)"
    name_en: "Required Volume Uplift for a Price Cut"
    expression_latex: "\\Delta Q\\% = \\frac{d}{m-d}"
    expression_python: "d / (m - d)"
    excel: "=d/(m-d)"
    variables:
      - {symbol: "m", meaning: "Contribution margin đơn vị hiện tại = giá - chi phí biến đổi", unit: "VNĐ/sp"}
      - {symbol: "d", meaning: "Mức giảm giá tuyệt đối trên mỗi sản phẩm", unit: "VNĐ/sp"}
    when_to_use: "Khi đối thủ phá giá hoặc DN tính giảm giá để theo Cost Leadership: cần biết phải bán thêm bao nhiêu % mới hòa lợi nhuận."
    why_it_works: "Lợi nhuận gộp đóng góp = m x Q. Sau giảm giá còn (m-d) x Q'. Cân bằng: Q'/Q = m/(m-d), nên tăng thêm d/(m-d). Margin càng mỏng, giá giảm nhỏ cũng đòi tăng sản lượng rất lớn."
    assumptions:
      - "Chi phí cố định không đổi, chi phí biến đổi/đơn vị không đổi, đủ công suất để bán thêm."
    pitfalls:
      - "Chỉ tính cầu tăng mà quên đối thủ đáp trả, làm sản lượng không tăng nhưng giá đã giảm."
      - "Không áp dụng khi m <= d (giảm giá xóa hết biên)."
    interpretation: "Nếu mức tăng cần thiết vượt khả năng tăng cầu/công suất thực tế (ví dụ >25-30%) thì không nên giảm giá; đổi sang Differentiation hoặc Focus."
    example:
      inputs: {m: 30000, d: 3000}
      steps: ["d/(m-d) = 3,000/27,000 = 11.1%"]
      result: "Giảm 3,000 trên biên 30,000 cần bán thêm 11.1% mới hòa lợi nhuận đóng góp."
  - id: "m03_premium_breakeven"
    name_vi: "Premium tối thiểu để khác biệt hóa có lời"
    name_en: "Break-even Price Premium"
    expression_latex: "x_{min}=\\frac{m_0}{1-L}-m_0+e"
    expression_python: "m0 / (1 - L) - m0 + e"
    excel: "=m0/(1-L)-m0+e"
    variables:
      - {symbol: "m0", meaning: "Contribution margin/đơn vị của sản phẩm thường (trước khác biệt hóa)", unit: "VNĐ"}
      - {symbol: "L", meaning: "Tỷ lệ khách/sản lượng mất đi vì giá cao hơn", unit: "0-1"}
      - {symbol: "e", meaning: "Chi phí biến đổi tăng thêm/đơn vị để tạo khác biệt", unit: "VNĐ"}
    when_to_use: "Kiểm tra điều kiện thành công #5: chi phí khác biệt < premium thu được, có tính đến mất khách."
    why_it_works: "Lợi nhuận đóng góp sau = (m0 + x - e) x (1-L) x Q phải >= m0 x Q. Giải theo x. Nếu x_min lớn hơn mức khách chịu trả thì khác biệt đó không đáng đầu tư."
    assumptions:
      - "Chi phí cố định cho khác biệt (R&D, đào tạo) chưa tính: phải trừ riêng hoặc quy đổi theo sản lượng."
      - "L là ước lượng từ khảo sát/thử nghiệm giá."
    pitfalls:
      - "Quên e dạng cố định (marketing, nhượng quyền thiết kế)."
      - "Tự cho rằng khách chấp nhận premium mà không kiểm tra Willingness to Pay."
    interpretation: "Premium dự kiến > x_min và nằm trong Willingness to Pay của phân khúc mục tiêu thì Differentiation khả thi; biên dư càng lớn càng an toàn."
    example:
      inputs: {m0: 21000, L: 0.2, e: 6000}
      steps: ["m0/(1-L) = 21,000/0.8 = 26,250", "x_min = 26,250 - 21,000 + 6,000 = 11,250"]
      result: "Cần tăng giá tối thiểu 11,250 mỗi sản phẩm (nếu e=6,000 và mất 20% khách)."
  - id: "m03_weighted_score"
    name_vi: "Điểm có trọng số (chọn niche/chiến lược)"
    name_en: "Weighted Scoring"
    expression_latex: "S=\\sum_i w_i s_i,\\ \\sum w_i=1"
    expression_python: "sum(w * s for w, s in zip(weights, scores))"
    excel: "=SUMPRODUCT(weights,scores)"
    variables:
      - {symbol: "weights", meaning: "Trọng số từng tiêu chí, tổng bằng 1", unit: "0-1"}
      - {symbol: "scores", meaning: "Điểm 1-5 từng tiêu chí", unit: "điểm"}
    when_to_use: "Chấm điểm hấp dẫn của phân khúc cho Focus (đủ lớn, đủ nhỏ, nhu cầu khác biệt, có rào cản, tăng trưởng) hoặc mức phù hợp giữa năng lực DN và từng chiến lược."
    why_it_works: "Biến phán đoán định tính thành thang so sánh được giữa nhiều lựa chọn; ép làm rõ trọng số tiêu chí trước khi chọn."
    assumptions: ["Tiêu chí độc lập tương đối; trọng số phản ánh đúng ưu tiên của DN."]
    pitfalls: ["Chấm điểm cảm tính không có dữ liệu; trọng số chỉnh để ra kết quả mong muốn."]
    interpretation: "Thang 5: >=3.5 hấp dẫn, 2.5-3.5 cân nhắc/thử nghiệm nhỏ, <2.5 loại. Phân tích độ nhạy: đổi trọng số +-10% xem thứ hạng có đổi không."
    example:
      inputs: {weights: [0.3, 0.25, 0.25, 0.2], scores: [4, 3, 5, 2]}
      steps: ["0.3x4 + 0.25x3 + 0.25x5 + 0.2x2 = 1.2 + 0.75 + 1.25 + 0.4 = 3.6"]
      result: "Điểm 3.6/5: niche hấp dẫn, nên thử nghiệm."

frameworks:
  - id: "m03_generic_strategies"
    name_vi: "Ma trận 3 chiến lược chung của Porter"
    name_en: "Porter's Generic Strategies"
    origin: >
      Michael Porter (Harvard Business School), cuốn Competitive Strategy (1980) và Competitive Advantage (1985). Ra đời để trả lời vì sao có DN trong
      cùng ngành lãi hơn hẳn: ông phản bác quan niệm 'cứ lớn là tốt' bằng ý tưởng DN phải chọn rõ lợi thế (chi phí hoặc khác biệt) và phạm vi (rộng hoặc hẹp).
    components:
      - "Cost Leadership: chi phí thấp nhất ngành, thị trường rộng."
      - "Differentiation: sản phẩm/dịch vụ độc đáo, khách trả premium, thị trường rộng."
      - "Cost Focus: chi phí thấp nhất trong niche."
      - "Differentiation Focus: khác biệt tốt nhất cho niche."
      - "Nguyên tắc Stuck in the Middle (cảnh báo)."
    when_to_use: "Mở đầu mọi bài toán 'cạnh tranh thế nào' để định khung lựa chọn."
    how_to_apply:
      - "1. Xác định ranh giới ngành và đối thủ chính (m01)."
      - "2. Xác định năng lực/nguồn lực thực của DN (m02: Value Chain, VRIO)."
      - "3. Hỏi 2 câu: thắng bằng chi phí hay khác biệt? phục vụ toàn thị trường hay niche?"
      - "4. Chạy checklist chọn chiến lược (procedure m03_choose_strategy) và đối chiếu điều kiện thành công từng chiến lược."
      - "5. Kiểm tra bằng số (chi phí, premium, niche score)."
      - "6. Cam kết một chiến lược chính, thiết kế hoạt động nhất quán với nó, định KPI (m06)."
    how_to_read_results: "Chiến lược tốt là chiến lược mà mọi hoạt động trong chuỗi giá trị nhất quán với lựa chọn đó. Nếu hoạt động mâu thuẫn (ví dụ tuyên bố giá rẻ nhưng cho thiết kế tốn kém) thì cảnh báo stuck in the middle."
    pitfalls:
      - "Cố làm cả hai chiến lược chung trên thị trường rộng khi không có năng lực lai."
      - "Chọn chiến lược theo mong muốn của chủ chứ không theo năng lực thực."
      - "Quên rằng lợi thế bị bắt chước; không có kế hoạch duy trì."
    example: "Quán cà phê nhỏ ở Q.1: không có scale nên không chọn Cost Leadership; chọn Differentiation Focus (cà phê specialty cho Gen Z/dân văn phòng quanh khu) như case Specialty Sài Gòn."
  - id: "m03_cost_leadership"
    name_vi: "Chiến lược dẫn đầu về chi phí"
    name_en: "Cost Leadership"
    origin: "Porter (1980). Gốc từ quan sát đường cong kinh nghiệm của BCG và mô hình Walmart/Ford: ai có chi phí thấp nhất có thể sống sót khi giá giảm và hưởng margin cao nhất."
    components:
      - "7 nguồn lợi thế chi phí: Economies of Scale (Walmart), Learning Curve (Samsung chip yield), Technology (robot kho Amazon), Product Design (IKEA flat-pack), Input Costs, Capacity Utilization (hàng không low-cost), Organizational Efficiency (Costco 3,700+ SKU vs Walmart 100,000+)."
      - "Chất lượng 'đủ tốt' (parity) không cắt quá tay."
      - "Ưu điểm: margin cao, linh hoạt giá, rào cản gia nhập, chống supplier power, chống substitutes."
      - "Nhược điểm: dễ bắt chước, chiến tranh giá tận cùng, mù quáng cắt chi phí, công nghệ phá lợi thế, khách không trung thành, cần quy mô lớn."
    when_to_use: "Thị trường rộng, sản phẩm khá đồng nhất, khách nhạy giá, DN có/có thể có quy mô hoặc cấu trúc chi phí vượt trội."
    how_to_apply:
      - "1. Phân tích Value Chain: tính chi phí từng hoạt động (m02)."
      - "2. Benchmark từng hoạt động với đối thủ (công thức m03_cost_advantage)."
      - "3. Chọn nguồn lợi thế phù hợp (scale? technology? design? utilization?)."
      - "4. Đầu tư vào nguồn đã chọn để giảm chi phí có hệ thống (m03_experience_curve, m03_unit_cost_utilization)."
      - "5. Giữ chất lượng đủ tốt, không cắt vào thứ khách coi trọng/an toàn."
      - "6. Theo dõi liên tục; chuẩn bị mô hình doanh thu bù đắp (ancillary) và cải tiến liên tục vì đối thủ bắt chước."
    how_to_read_results: "Thành công khi chi phí đơn vị thấp hơn đối thủ >=10% (ADV) và giữ được ở mức đó sau khi đối thủ đáp trả; margin bền khi giá thị trường giảm."
    pitfalls:
      - "Chỉ một DN trong ngành thực sự là 'leader': nhiều DN cùng theo thì thành chiến tranh giá."
      - "Nhầm Cost Leadership với bán giá rẻ nhất khi chưa có cấu trúc chi phí."
      - "SME khó theo vì thiếu scale: chỉ nên theo trong niche (Cost Focus)."
    example: >
      Vietjet Air (gia nhập 2011): đội bay đồng nhất Airbus A320/A321 (giảm ~30% chi phí bảo trì, đào tạo); bay 13-14 giờ/ngày so với VNA 10-11 giờ;
      quay đầu 25 phút so với 45-60 phút; bán trực tiếp qua web/app >70%; tuổi máy bay 3-5 năm; ancillary 25-30% doanh thu bù vé rẻ. Giá vé thấp hơn VNA 30-50%.
  - id: "m03_differentiation"
    name_vi: "Chiến lược khác biệt hóa"
    name_en: "Differentiation"
    origin: "Porter (1980). Nền tảng: khách không chỉ mua giá; nếu cảm nhận giá trị độc đáo họ sẵn lòng trả premium, và DN có thể thoát khỏi cạnh tranh giá."
    components:
      - "7 nguồn: Sản phẩm (iPhone), Dịch vụ (Singapore Airlines), Thương hiệu (Nike), Công nghệ (Tesla), Nhân sự (McKinsey), Kênh (Dell trước đây), Mối quan hệ (Salesforce)."
      - "5 điều kiện thành công: khách cảm nhận được; khách sẵn sàng trả; khó bắt chước; bền vững; chi phí khác biệt < premium."
      - "Ưu điểm: premium, brand loyalty, rào cản gia nhập, giảm buyer power, chống substitutes."
      - "Nhược điểm: chi phí cao, bị bắt chước, giá trị khác biệt phai theo thời gian, premium quá cao, over-differentiation."
    when_to_use: "Khách trả tiền cho thứ độc đáo (chất lượng, thương hiệu, trải nghiệm), DN có năng lực R&D/brand/dịch vụ nổi trội."
    how_to_apply:
      - "1. Xác định phân khúc khách và tiêu chí mua hàng (Purchase Criteria) quan trọng nhất."
      - "2. Xếp hạng DN so với đối thủ từng tiêu chí; tìm khoảng trống mà khách coi trọng."
      - "3. Chọn 1-2 nguồn khác biệt giá trị cao, khó bắt chước (VRIO m02)."
      - "4. Tính premium tối thiểu (m03_premium_breakeven) và kiểm tra Willingness to Pay."
      - "5. Truyền thông để khách cảm nhận; xây switching cost (hệ sinh thái, loyalty, cá nhân hóa)."
      - "6. Theo dõi bắt chước và liên tục đổi mới."
    how_to_read_results: "Premium thực nhận > x_min; tỷ lệ giữ chân và NPS cao; ít nhạy giá. Nếu khách chuyển sang đối thủ rẻ khi tăng giá nhẹ thì khác biệt chưa đủ giá trị."
    pitfalls:
      - "Tự cho là khác biệt nhưng khách không thấy."
      - "Over-differentiation: thêm tính năng khách không cần."
      - "Premium quá cao, bỏ ngỏ phân khúc giá giữa."
    example: >
      Apple: khác biệt nằm ở hệ sinh thái (iPhone, Mac, iPad, AirPods, Watch tích hợp), thiết kế, iOS tối ưu, quyền riêng tư, Apple Store, thương hiệu, chip tự phát triển (A/M series).
      iPhone được báo cáo chiếm phần lớn (~85%) lợi nhuận ngành smartphone (số liệu chưa kiểm chứng đầy đủ). Rủi ro: thị trường bão hòa, cần động lực mới.
  - id: "m03_focus"
    name_vi: "Chiến lược tập trung (Cost Focus và Differentiation Focus)"
    name_en: "Focus Strategy"
    origin: "Porter (1980). Giải thích vì sao DN nhỏ vẫn thắng đối thủ lớn: dồn nguồn lực phục vụ sâu một nhóm hẹp mà đối thủ rộng phục vụ chưa tối ưu."
    components:
      - "Cost Focus: chi phí thấp nhất trong niche."
      - "Differentiation Focus: sản phẩm tốt nhất cho niche."
      - "5 tiêu chí chọn niche: đủ lớn để có lời; đủ nhỏ để đối thủ lớn không quan tâm; nhu cầu khác biệt; có rào cản; tăng trưởng/ổn định."
      - "Ưu điểm: hợp DN nhỏ, hiểu khách sâu, ít cạnh tranh trực tiếp, loyalty cao, uy tín chuyên gia."
      - "Nhược điểm: niche thu hẹp, đối thủ lớn xâm nhập, tăng trưởng hạn chế, phụ thuộc một nhóm khách, niche within niche."
    when_to_use: "DN nhỏ/vừa, startup, nguồn lực hạn chế, có hiểu biết sâu về một nhóm khách."
    how_to_apply:
      - "1. Liệt kê các phân khúc (địa lý, nhóm khách, kênh, nhu cầu)."
      - "2. Chấm điểm hấp dẫn 5 tiêu chí, có trọng số (m03_weighted_score)."
      - "3. Chọn Cost Focus nếu khách niche nhạy giá và DN có lợi thế chi phí cục bộ; chọn Differentiation Focus nếu khách trả thêm cho nhu cầu đặc thù."
      - "4. Dồn nguồn lực cho niche, từ chối khách ngoài niche."
      - "5. Theo dõi dấu hiệu đối thủ lớn nhòm ngó hoặc niche co lại; mở rộng sang niche kế cận khi vững."
    how_to_read_results: "Niche tốt khi biên lợi nhuận cao hơn thị trường chung, tỷ lệ khách quay lại cao, đối thủ lớn chưa phục vụ tốt. Cảnh báo khi tăng trưởng niche chậm hơn lạm phát hoặc đối thủ lớn ra sản phẩm tương tự."
    pitfalls:
      - "Chọn niche quá nhỏ không đủ sinh lời."
      - "Chọn niche quá lớn bị đối thủ lớn nhắm tới."
      - "Phụ thuộc vài khách hàng lớn."
    example: >
      Rolls-Royce Motor Cars (Differentiation Focus): khách UHNWI (tài sản ròng >30 triệu USD); ~6,000 xe/năm (2023: 6,032) vs BMW ~2.5 triệu; giá 350 nghìn USD đến 28 triệu USD (Boat Tail);
      gần như toàn bộ bespoke, thủ công, backlog 1-2 năm. Đối thủ thực sự là chi tiêu xa xỉ (du thuyền, nghệ thuật, BĐS), không phải BMW. Rủi ro: xe điện (Spectre, 2023).
  - id: "m03_hybrid"
    name_vi: "Chiến lược lai"
    name_en: "Hybrid / Integrated Cost Leadership-Differentiation"
    origin: "Phản biện Porter từ thập niên 1980-90 qua thực tế Toyota (TPS), Nhật Bản; sau đó IKEA, Uniqlo, Xiaomi."
    components:
      - "IKEA: giá thấp (flat-pack, tự lắp) + thiết kế Scandinavian."
      - "Toyota: chi phí thấp (TPS) + chất lượng cao (TQM, Kaizen)."
      - "Uniqlo: quy mô + vải công nghệ (HEATTECH, AIRism)."
      - "Xiaomi: margin phần cứng giới hạn ~5% + hệ sinh thái IoT, bán online."
    when_to_use: "DN có năng lực đặc biệt khiến giảm chi phí cũng nâng giá trị (lean, thiết kế tích hợp sản xuất, quy mô cực lớn, nền tảng/hệ sinh thái); thường là DN lớn."
    how_to_apply:
      - "1. Xác định năng lực lõi vừa giảm chi phí vừa tăng giá trị."
      - "2. Chọn 1 lợi thế chính (ví dụ giá), dùng lợi thế phụ (ví dụ thiết kế) ở mức đủ khác biệt."
      - "3. Thiết kế hoạt động nhất quán xuyên suốt chuỗi giá trị."
      - "4. Kiểm tra bằng số: chi phí đơn vị vẫn thấp hơn đối thủ và premium/khối lượng vẫn đủ."
    how_to_read_results: "Lai thành công khi chi phí thấp hơn đối thủ cùng lúc khách đánh giá chất lượng/thiết kế cao hơn. Nếu cả hai đều chỉ ngang trung bình thì đã stuck in the middle."
    pitfalls:
      - "Lai khi không có năng lực lõi tương ứng."
      - "Gửi thông điệp mâu thuẫn (rẻ nhưng cao cấp)."
    example: "Uniqlo: R&D vải HEATTECH + sản xuất quy mô lớn nên giá phải chăng mà vẫn khác biệt công nghệ."
  - id: "m03_strategy_fit_checklist"
    name_vi: "Checklist chọn chiến lược 3 câu hỏi"
    name_en: "Strategy Selection Checklist"
    origin: "Công cụ tổng hợp trong tài liệu nguồn dựa trên điều kiện tiên quyết của từng chiến lược chung."
    components:
      - "Q1: có lợi thế quy mô/chi phí?"
      - "Q2: có sản phẩm/dịch vụ độc đáo?"
      - "Q3: hiểu sâu một phân khúc?"
    when_to_use: "Sàng lọc nhanh khi chưa có nhiều dữ liệu."
    how_to_apply:
      - "1. Q1 = CÓ thì xem xét Cost Leadership (kèm xác minh bằng ADV)."
      - "2. Q1 = KHÔNG, Q2 = CÓ thì xem xét Differentiation (kèm premium_breakeven)."
      - "3. Cả hai KHÔNG, Q3 = CÓ thì xem xét Focus (kèm weighted_score niche)."
      - "4. Cả ba KHÔNG thì quay lại xây dựng năng lực cốt lõi trước khi chọn."
    how_to_read_results: "Có thể trả lời CÓ nhiều câu; khi đó chọn chiến lược mà DN mạnh nhất và phù hợp quy mô: DN nhỏ ưu tiên Focus."
    pitfalls: ["Trả lời CÓ theo cảm tính, không bằng chứng số."]
    example: "Xưởng mộc 15 người: Q1 KHÔNG (không scale), Q2 CÓ (thiết kế tay nghề), Q3 CÓ (khách biệt thự) nên chọn Differentiation Focus."

procedures:
  - id: "m03_choose_strategy"
    name: "Chọn chiến lược cạnh tranh cho một doanh nghiệp (end-to-end)"
    steps:
      - "Bước 0 - Hỏi bối cảnh: ngành/sản phẩm, quy mô (doanh thu, nhân sự, vốn), thị trường mục tiêu hiện tại, khách hàng chính, đối thủ chính, biên lợi nhuận hiện tại, chi phí cố định/biến đổi, công suất."
      - "Bước 1 - Kiểm tra môi trường (m01): sức ép 5 Forces mạnh nhất là gì (giá, thay thế, quyền lực khách)."
      - "Bước 2 - Kiểm tra năng lực (m02): Value Chain hoạt động nào mạnh/yếu; VRIO tài nguyên nào hiếm, khó bắt chước."
      - "Bước 3 - Chạy checklist 3 câu hỏi (framework m03_strategy_fit_checklist)."
      - "Bước 4 - Kiểm tra Cost: tính chi phí/đơn vị của mình và của đối thủ (m03_cost_advantage), tác động utilization (m03_unit_cost_utilization), đường cong kinh nghiệm nếu có."
      - "Bước 5 - Kiểm tra Differentiation: tính premium tối thiểu (m03_premium_breakeven) và so với Willingness to Pay thu được từ khảo sát/thử nghiệm giá; đánh giá 5 điều kiện thành công."
      - "Bước 6 - Kiểm tra Focus: chấm điểm niche (m03_weighted_score), xác định Cost Focus hay Differentiation Focus."
      - "Bước 7 - So sánh các lựa chọn khả thi theo margin kỳ vọng, vốn cần, rủi ro lớn nhất (chiến tranh giá, bị bắt chước, niche biến mất)."
      - "Bước 8 - Chọn 1 chiến lược chính; liệt kê các hoạt động phải nhất quán và những thứ phải KHÔNG làm (tránh stuck in the middle)."
      - "Bước 9 - Đặt KPI (chi phí/đơn vị, premium %, tỷ lệ khách quay lại, thị phần niche) và tín hiệu cảnh báo (m06); lên kịch bản đối thủ phản ứng (m07)."
    outputs: "Bản khuyến nghị: chiến lược chính + lý do dựa trên số, điều kiện thành công, 3 rủi ro lớn nhất và biện pháp, KPI theo dõi, lộ trình 6-12 tháng."
  - id: "m03_cost_advantage_check"
    name: "Kiểm tra DN có thể theo Cost Leadership không"
    steps:
      - "1. Lập bảng chi phí đơn vị theo hoạt động (mua nguyên liệu, sản xuất, logistics, bán hàng, quản lý) cho mình và 2-3 đối thủ."
      - "2. Tính ADV tổng và từng hoạt động; xác định hoạt động nào tạo lợi thế."
      - "3. Xác định nguồn (scale, learning, utilization, design, tech, input, organization) và xem có bền vững không (đối thủ có thể bắt chước trong bao lâu?)."
      - "4. Tính kịch bản phá giá: giá giảm d, volume cần tăng (m03_price_war_volume), chi phí mới với utilization cao hơn."
      - "5. Kết luận: ADV >= 10% và nguồn bền thì đi tiếp; nếu không thì chuyển sang Focus/Differentiation."
    outputs: "Bảng so sánh chi phí, ADV, nguồn lợi thế, kết luận đi/không đi Cost Leadership."
  - id: "m03_differentiation_check"
    name: "Kiểm tra khác biệt hóa có lời không"
    steps:
      - "1. Phỏng vấn/khảo sát 15-30 khách: tiêu chí mua quan trọng nhất, đánh giá mình vs đối thủ, mức giá sẵn sàng trả (Willingness to Pay)."
      - "2. Chọn khác biệt cụ thể, tính e (chi phí tăng thêm/đơn vị) và chi phí cố định đầu tư."
      - "3. Ước lượng L (khách mất do giá cao) từ thử nghiệm giá hoặc khảo sát."
      - "4. Tính x_min (m03_premium_breakeven); so với premium khách chịu trả."
      - "5. Đánh giá khó bắt chước (VRIO) và thời gian đối thủ sao chép."
      - "6. Quyết định: premium dự kiến lớn hơn x_min với biên an toàn >=20% và khó bắt chước thì làm."
    outputs: "Bảng premium, x_min, biên an toàn, đánh giá bắt chước, quyết định."
  - id: "m03_select_niche"
    name: "Chọn niche cho Focus"
    steps:
      - "1. Liệt kê 3-6 phân khúc ứng viên (theo nhóm khách, địa lý, nhu cầu, kênh)."
      - "2. Đặt trọng số tiêu chí (ví dụ: nhu cầu khác biệt 0.3, rào cản 0.25, quy mô đủ lớn 0.25, đủ nhỏ với đối thủ lớn 0.2) và chấm điểm 1-5 có dẫn chứng."
      - "3. Ước lượng quy mô niche (số khách x tần suất x giá) để chắc đủ lớn."
      - "4. Chọn Cost Focus hay Differentiation Focus."
      - "5. Phân tích độ nhạy trọng số; chọn niche dẫn đầu ổn định."
      - "6. Lập kế hoạch bảo vệ: switching cost, quan hệ cộng đồng, theo dõi đối thủ lớn."
    outputs: "Bảng điểm niche, quy mô niche, định vị Cost/Differentiation Focus, kế hoạch bảo vệ."
  - id: "m03_diagnose_stuck"
    name: "Chẩn đoán 'stuck in the middle'"
    steps:
      - "1. So giá/chi phí với đối thủ: có thấp hơn đáng kể không (ADV)?"
      - "2. So giá trị khách cảm nhận: có đạt premium so với đối thủ không?"
      - "3. Cả hai đều không, margin dưới trung bình ngành, thông điệp chung chung, thì chẩn đoán là stuck."
      - "4. Chọn hướng thoát: thu hẹp sang Focus, chọn 1 điểm khác biệt, hoặc cắt chi phí có chủ đích."
    outputs: "Kết luận stuck hay không + hướng thoát + KPI."

decision_rules:
  - "Nếu DN nhỏ (doanh thu dưới vài chục tỷ) và không có scale thì chọn Focus, không cạnh tranh trực diện bằng giá với DN lớn."
  - "Nếu ADV >= 10% so với đối thủ gần nhất và nguồn lợi thế khó bắt chước thì có thể theo Cost Leadership; nếu ADV < 5% thì không phá giá."
  - "Nếu mức tăng sản lượng cần bù giảm giá (d/(m-d)) vượt xa khả năng tăng cầu hoặc công suất thì không giảm giá; chuyển sang khác biệt."
  - "Nếu premium dự kiến <= x_min thì khác biệt đó không đáng đầu tư; chọn khác biệt khác hoặc giảm e."
  - "Nếu khách chuyển sang đối thủ rẻ khi tăng giá nhẹ thì khác biệt chưa đủ giá trị hoặc chưa được cảm nhận."
  - "Nếu nhiều đối thủ cùng theo Cost Leadership thì cạnh tranh giá khốc liệt; chỉ theo nếu bạn thực sự là chi phí thấp nhất, không thì đổi hướng."
  - "Nếu khách trong niche nhạy giá thì Cost Focus; nếu khách trả thêm cho nhu cầu đặc thù thì Differentiation Focus."
  - "Nếu niche co lại hoặc đối thủ lớn bước vào thì mở rộng sang niche kế cận hoặc đào sâu khác biệt (niche within niche)."
  - "Nếu không có năng lực lõi vừa giảm chi phí vừa tăng giá trị thì không theo Hybrid; chọn một chiến lược."
  - "Nếu hoạt động trong chuỗi giá trị mâu thuẫn với chiến lược đã chọn (ví dụ tuyên bố giá rẻ nhưng chi tiêu thiết kế xa xỉ) thì sửa hoạt động hoặc đổi chiến lược."
  - "Nếu ngành dùng chiến tranh giá và DN có biên mỏng thì đừng đáp trả bằng giá; củng cố khác biệt hoặc niche."
  - "Nếu công nghệ mới có thể phá lợi thế chi phí hiện tại thì lập kịch bản (m07) và đầu tư vào công nghệ mới sớm."

benchmarks:
  - {metric: "Lợi thế chi phí (ADV) đủ để theo Cost Leadership", value: ">= 10% so với đối thủ gần nhất", context: "Quy tắc thực hành của module; không phải chuẩn ngành", confidence: "low"}
  - {metric: "Điểm niche hấp dẫn (thang 5)", value: ">= 3.5 hấp dẫn; < 2.5 loại", context: "Quy tắc thực hành", confidence: "low"}
  - {metric: "Vietjet ancillary revenue", value: "25-30% tổng doanh thu", context: "Số trong tài liệu nguồn; kiểm chứng với báo cáo thường niên", confidence: "medium"}
  - {metric: "Vietjet utilization máy bay", value: "13-14 giờ/ngày vs VNA 10-11 giờ", context: "Tài liệu nguồn", confidence: "medium"}
  - {metric: "Rolls-Royce sản lượng 2023", value: "6,032 xe", context: "Công bố của hãng (kỷ lục)", confidence: "high"}
  - {metric: "Costco SKU vs Walmart SKU", value: "~3,700+ vs 100,000+", context: "Tài liệu nguồn", confidence: "medium"}
  - {metric: "Đường cong kinh nghiệm điển hình", value: "70-85% mỗi lần gấp đôi sản lượng tích lũy", context: "Tùy ngành; phải ước lượng từ dữ liệu của DN", confidence: "medium"}

pitfalls:
  - "Nhầm Cost Leadership với bán giá rẻ nhất khi chưa có lợi thế chi phí."
  - "Cố theo cả chi phí thấp và khác biệt trên thị trường rộng mà không có năng lực lai (stuck in the middle)."
  - "Tin lợi thế là vĩnh viễn: đối thủ bắt chước, công nghệ thay đổi, sở thích khách thay đổi."
  - "Khác biệt hóa mà khách không cảm nhận hoặc không muốn trả tiền."
  - "Over-differentiation hoặc cắt chi phí làm hỏng chất lượng khách coi trọng (hoặc an toàn)."
  - "Chọn niche quá nhỏ hoặc quá lớn; phụ thuộc một nhóm khách."
  - "Bỏ qua mối liên hệ với 5 Forces và Value Chain: chiến lược không dựa trên phân tích."
  - "Lấy ví dụ doanh nghiệp lớn (Apple, Vietjet) áp thẳng cho SME mà không điều chỉnh quy mô."
  - "Dùng số liệu chưa kiểm chứng (thị phần, tỷ lệ loyalty) làm căn cứ quyết định."

sme_vn_guidance:
  - "SME nhỏ: bắt đầu bằng Focus (niche theo địa bàn/nhóm khách), tránh đấu giá với chuỗi lớn (Highlands, Phúc Long, Thế Giới Di Động...)."
  - "SME vừa: từ Focus mở rộng sang Differentiation khi có thương hiệu và quy trình ổn định; dùng Cost Focus nếu có nguồn cung trực tiếp (nông sản, hải sản, đặc sản địa phương)."
  - "Nguồn chi phí SME khai thác được: utilization (khung giờ trống, ca thấp điểm), thiết kế sản phẩm/menu đơn giản, mua trực tiếp từ nhà cung cấp, quy trình gọn. Scale thường không có."
  - "Công cụ đo chi phí/đơn vị: Excel/Google Sheets (miễn phí), phần mềm bán hàng POS (Sapo, KiotViet, iPos: giá cần xác nhận với nhà cung cấp), phần mềm kế toán (MISA, Fast: cần xác nhận giá)."
  - "Khảo sát giá sẵn sàng trả: Google Forms (miễn phí), thử nghiệm giá A/B trên menu/Shopee/TikTok Shop với nhóm nhỏ."
  - "Ví dụ VN trong nguồn: Vietjet, Thế Giới Di Động (Cost); Vinamilk, FPT Software (Differentiation); Phở Thìn, L'angfarm Đà Lạt (Focus). Số liệu chi tiết cần xác nhận trước khi trích dẫn."
  - "Thuế/pháp lý khi thay đổi mô hình (mở thêm kênh, bán sỉ B2B, nhập hàng trực tiếp): kiểm tra với kế toán/tư vấn thuế, cần xác nhận quy định hiện hành."
  - "Kết hợp với case-studies/: Specialty Sài Gòn (Differentiation Focus), Phở Ơi (đổi giá/mô hình), Biển Xanh Đà Nẵng (Cost Focus)."

case_lessons:
  - name: "Vietjet Air - Cost Leadership"
    type: "success"
    setup: "Gia nhập 2011 khi Vietnam Airlines gần độc quyền; chọn mô hình low-cost carrier."
    key_calculations:
      - "Fleet đồng nhất A320/A321: giảm ~30% chi phí bảo trì và đào tạo."
      - "Utilization 13-14 giờ/ngày vs 10-11 giờ: cùng chi phí cố định/máy bay trải trên nhiều chuyến hơn (+~30%)."
      - "Quay đầu 25 phút vs 45-60 phút; bán trực tiếp >70%; ancillary 25-30% doanh thu; giá vé thấp hơn VNA 30-50%."
    lesson: "Cost Leadership là hệ thống nhiều nguồn chi phí cùng lúc cộng thêm mô hình doanh thu bù đắp; không phải cắt giá hay cắt an toàn. Rủi ro: đối thủ low-cost khác (AirAsia, Bamboo...) làm cạnh tranh gay gắt, cần cải tiến liên tục."
    data_reliability: "illustrative"
  - name: "Apple - Differentiation"
    type: "success"
    setup: "Cạnh tranh smartphone với Samsung, Xiaomi, Huawei bằng hệ sinh thái và thương hiệu."
    key_calculations:
      - "Giá tham khảo: iPhone 15 Pro Max 1,199 USD vs Samsung S24 Ultra 1,299 USD (Apple không rẻ hơn mọi nơi; lợi thế là margin/loyalty)."
      - "iPhone ~85% lợi nhuận ngành smartphone (báo cáo thị trường, chưa kiểm chứng đầy đủ); loyalty ~90%+ (chưa kiểm chứng)."
    lesson: "Khác biệt hóa bền khi tạo switching cost cao (ecosystem) và khách thực sự cảm nhận giá trị; không chỉ từng sản phẩm riêng lẻ. Rủi ro: thị trường bão hòa."
    data_reliability: "unverified"
  - name: "Rolls-Royce - Differentiation Focus"
    type: "success"
    setup: "Phân khúc UHNWI (tài sản ròng >30 triệu USD), sản lượng thấp, bespoke."
    key_calculations:
      - "~6,000 xe/năm (2023: 6,032) so với BMW ~2.5 triệu xe/năm: hơn 400 lần nhỏ hơn về sản lượng."
      - "Giá 350 nghìn USD đến 28 triệu USD; margin ước tính 25-30% (ước tính, cần kiểm chứng); backlog 1-2 năm nên không cần giảm giá."
    lesson: "Focus thắng nhờ hiểu sâu khách và coi đối thủ thực sự là chi tiêu xa xỉ khác, không phải xe cùng hạng. Customization tạo switching cost cảm xúc."
    data_reliability: "illustrative"
  - name: "IKEA, Toyota, Uniqlo, Xiaomi - Hybrid"
    type: "success"
    setup: "DN kết hợp chi phí thấp và khác biệt nhờ năng lực lõi (design-to-cost, lean, R&D vải, hệ sinh thái)."
    key_calculations:
      - "Xiaomi cam kết lãi ròng phần cứng tối đa 5% để giữ giá thấp, kiếm thêm từ dịch vụ/hệ sinh thái."
    lesson: "Hybrid khả thi khi năng lực lõi vừa giảm chi phí vừa nâng giá trị; không phải cho DN nhỏ không có năng lực đó."
    data_reliability: "illustrative"
  - name: "Xưởng may gia công Bình Dương (SME giả định) - nâng utilization"
    type: "sme"
    setup: "Chi phí cố định 600 triệu/tháng, công suất 20,000 sp/tháng, chi phí biến đổi 90,000/sp, giá bán thị trường 180,000/sp. Đang chạy 50% công suất."
    key_calculations:
      - "u=50%: c = 600,000,000/10,000 + 90,000 = 150,000; margin = (180,000-150,000)/180,000 = 16.7%."
      - "u=85%: c = 600,000,000/17,000 + 90,000 = 125,294; margin = 54,706/180,000 = 30.4%."
      - "Lợi thế vs đối thủ có c=150,000: ADV = (150,000-125,294)/150,000 = 16.5%."
    lesson: "Utilization là nguồn Cost Leadership dễ khai thác nhất cho SME sản xuất; nhưng đạt 85% cần đơn hàng ổn định (khách B2B dài hạn), không phải giảm giá lẻ."
    data_reliability: "illustrative"

worked_examples:
  - name: "Ví dụ 1 - Xưởng may: lợi thế chi phí từ utilization (Cost Focus theo đơn hàng B2B)"
    inputs: {fixed: 600000000, capacity: 20000, var_cost: 90000, price: 180000, util_now: 0.5, util_target: 0.85}
    steps:
      - "c_now = 600,000,000/(20,000x0.5) + 90,000 = 150,000; margin = 30,000/180,000 = 16.7%."
      - "c_target = 600,000,000/(20,000x0.85) + 90,000 = 125,294; margin = 54,706/180,000 = 30.4%."
      - "ADV so với đối thủ c=150,000: (150,000-125,294)/150,000 = 16.5%."
      - "Giá phá giá khả thi: đối thủ hòa vốn tại 150,000; mình hòa vốn tại 125,294 nên có biên 24,706 để giảm giá mà vẫn lãi."
    result: "Với utilization 85% xưởng có lợi thế chi phí 16.5% và có thể chào giá thấp hơn đối thủ ~10% (162,000) vẫn lãi 36,706/sp (22.7%). Chiến lược: Cost Focus cho đơn hàng B2B ổn định, ký hợp đồng 6-12 tháng."
  - name: "Ví dụ 2 - Quán cà phê specialty: premium tối thiểu"
    inputs: {price_base: 35000, var_cost_base: 14000, extra_cost: 6000, lost_share: 0.2, price_new: 50000}
    steps:
      - "m0 = 35,000 - 14,000 = 21,000."
      - "x_min = 21,000/0.8 - 21,000 + 6,000 = 11,250 nên giá tối thiểu = 46,250."
      - "Giá mới 50,000: m1 = 50,000 - (14,000+6,000) = 30,000; 30,000 x 0.8 = 24,000 vs 21,000 (cũ) nên +14.3% lợi nhuận đóng góp."
      - "Biên an toàn: (50,000-46,250)/46,250 = 8.1%."
    result: "Differentiation có lời nếu khách chỉ bỏ đi <=20%. Rủi ro: biên an toàn mới 8.1% nên cần khảo sát Willingness to Pay trước khi chốt giá 50,000; chi phí cố định (đào tạo barista, thiết bị) chưa tính."
  - name: "Ví dụ 3 - Shop online: phản ứng khi đối thủ phá giá 3,000"
    inputs: {price: 100000, var_cost: 70000, d: 3000}
    steps:
      - "m = 100,000 - 70,000 = 30,000."
      - "ΔQ% = 3,000/(30,000-3,000) = 11.1%."
      - "Doanh số hiện tại 1,000 đơn/tháng: lợi nhuận đóng góp = 30,000,000. Sau giảm giá cần 1,111 đơn để giữ nguyên (27,000 x 1,111 ≈ 30,000,000)."
      - "Kênh online đang tăng ~5%/tháng nên cần khoảng 2-3 tháng mới bù, nếu đối thủ không phản ứng."
    result: "Không đáng phá giá theo; nên giữ giá và củng cố khác biệt (bảo hành, giao nhanh, tư vấn) hoặc chỉ giảm giá có chọn lọc cho nhóm nhạy giá."
  - name: "Ví dụ 4 - Đường cong kinh nghiệm: xưởng lắp ráp tủ điện"
    inputs: {c1: 100, rate: 0.8}
    steps:
      - "n=2: 100x0.8 = 80 giờ; n=4: 64; n=8: 51.2; n=16: 40.96 giờ."
      - "Với giờ công 60,000 VNĐ/giờ: tủ thứ 1 = 6,000,000; tủ thứ 16 = 2,457,600."
      - "Đối thủ đã làm 4x nhiều tủ hơn (tích lũy gấp đôi 2 lần): chi phí giờ công của họ thấp hơn mình 36% ở cùng điểm."
    result: "DN nhỏ muốn theo Cost Leadership phải chấp nhận lỗ giai đoạn đầu để tích lũy sản lượng (hoặc nhận đơn gia công thêm); nếu đối thủ lớn đã xuống xa đường cong, lợi thế đó khó đuổi kịp, nên chọn Differentiation/Focus."
  - name: "Ví dụ 5 - Chọn niche bằng điểm có trọng số"
    inputs: {weights: [0.3, 0.25, 0.25, 0.2]}
    steps:
      - "Tiêu chí: nhu cầu khác biệt (0.3), có rào cản (0.25), đủ lớn (0.25), đối thủ lớn ít quan tâm (0.2)."
      - "Niche A (phòng khám thú cưng cao cấp cho dân văn phòng): điểm [4,3,5,2] nên 3.6."
      - "Niche B (đồ cho thú cưng giá rẻ): [2,2,5,1] nên 0.6+0.5+1.25+0.2 = 2.55."
      - "Niche C (dịch vụ spa cho chó lớn): [5,4,2,4] nên 1.5+1+0.5+0.8 = 3.8."
    result: "C (3.8) và A (3.6) hấp dẫn; B (2.55) loại. Với C cần kiểm tra quy mô (điểm 2 'đủ lớn'): nếu khu vực không đủ khách thì chọn A. Chạy độ nhạy trọng số +-10% xem thứ hạng có đổi không."

practice_questions:
  - q: "Phân biệt Cost Leadership và 'giá thấp nhất'. Một DN có chi phí thấp nhất có nhất thiết phải bán giá thấp nhất không?"
    a: "Không. Cost Leadership là chi phí đơn vị thấp nhất. DN có thể bán ngang giá thị trường để có margin cao nhất hoặc bán thấp hơn để giành thị phần. Phá giá khi chưa có lợi thế chi phí chỉ làm lỗ."
  - q: "Tính chi phí/đơn vị: cố định 600 triệu/tháng, công suất 20,000 sp, biến đổi 90,000/sp, ở utilization 60%."
    a: "600,000,000/(20,000x0.6) + 90,000 = 50,000 + 90,000 = 140,000 VNĐ/sp."
  - q: "Đường cong 85%, đơn vị đầu 200 giờ. Đơn vị thứ 8 tốn bao nhiêu giờ?"
    a: "8 = 2^3 nên 200 x 0.85^3 = 200 x 0.614125 = 122.8 giờ."
  - q: "Biên đóng góp 25,000/sp, cần giảm giá 2,500. Phải bán thêm bao nhiêu % để hòa lợi nhuận?"
    a: "2,500/(25,000-2,500) = 11.1%."
  - q: "Khác biệt hóa tăng chi phí biến đổi 8,000/sp, biên đóng góp cũ 22,000, ước tính mất 25% khách. Premium tối thiểu?"
    a: "x_min = 22,000/0.75 - 22,000 + 8,000 = 29,333 - 22,000 + 8,000 = 15,333 VNĐ/sp."
  - q: "Vì sao Porter cảnh báo 'stuck in the middle', và Toyota/IKEA có phản ví dụ không?"
    a: "Hai chiến lược đòi hỏi tổ chức, văn hóa, đầu tư khác nhau nên trộn lẫn thì không bên nào đủ sâu. Toyota/IKEA có năng lực lõi (lean, design-to-cost) làm đồng thời giảm chi phí và nâng giá trị, nên là phản ví dụ hợp lệ, nhưng chỉ cho DN có năng lực đó."
  - q: "Phân biệt Cost Focus và Differentiation Focus; mỗi loại cho 1 ví dụ SME VN."
    a: "Cost Focus: chi phí thấp nhất trong niche, ví dụ quán hải sản bình dân giá gốc + 30% cho dân địa phương Đà Nẵng. Differentiation Focus: tốt nhất cho niche, ví dụ cà phê specialty rang tại chỗ cho Gen Z Q.1."
  - q: "Tiệm bánh nhỏ 8 nhân viên nên theo chiến lược nào và vì sao?"
    a: "Focus (Differentiation Focus nếu có tay nghề/độc đáo, Cost Focus nếu có nguồn nguyên liệu rẻ riêng): không có scale để Cost Leadership, không đủ ngân sách thương hiệu cho Differentiation rộng. Dồn nguồn lực vào niche (ví dụ bánh healthy/đặt riêng cho văn phòng)."
  - q: "Điểm niche: trọng số [0.4,0.3,0.3], điểm [3,5,4]. Tính điểm và kết luận."
    a: "0.4x3+0.3x5+0.3x4 = 1.2+1.5+1.2 = 3.9: niche hấp dẫn (>=3.5)."
  - q: "Đối thủ lớn bắt đầu ra sản phẩm giống bạn trong niche. Làm gì?"
    a: "Xác định khác biệt họ chưa sao chép được (quan hệ, cá nhân hóa, chuyên môn); đào sâu niche (niche within niche) hoặc xây switching cost; không đua giá; cân nhắc coexist (phục vụ nhóm khách họ không phục vụ)."

checklist:
  - "□ Đã xác định ngành, đối thủ chính, khách hàng mục tiêu và tiêu chí mua hàng."
  - "□ Đã đối chiếu với 5 Forces (m01) và Value Chain/VRIO (m02) trước khi chọn chiến lược."
  - "□ Đã trả lời 3 câu hỏi checklist (quy mô/chi phí, độc đáo, hiểu sâu phân khúc) bằng bằng chứng."
  - "□ Nếu Cost: đã tính chi phí/đơn vị của mình và đối thủ; ADV >= 10%; nguồn lợi thế bền."
  - "□ Nếu Differentiation: premium dự kiến > x_min; đã kiểm tra Willingness to Pay; 5 điều kiện thành công đạt."
  - "□ Nếu Focus: niche đã chấm điểm, đủ lớn, có rào cản, chọn đúng Cost Focus hay Differentiation Focus."
  - "□ Mọi hoạt động trong chuỗi giá trị nhất quán với chiến lược; không bị stuck in the middle."
  - "□ Có kế hoạch cho rủi ro lớn nhất (phá giá, bắt chước, niche co lại) và kịch bản đối thủ."
  - "□ Có KPI theo dõi (chi phí/đơn vị, premium %, tỷ lệ khách quay lại, thị phần niche)."
  - "□ Số liệu ví dụ/benchmark chưa kiểm chứng đã được ghi rõ độ tin cậy."

excel_google_sheets_templates:
  - "Sheet Cost Benchmark: cột hoạt động, chi phí mình, chi phí đối thủ, ADV = (đối thủ - mình)/đối thủ."
  - "Sheet Utilization: nhập Fixed, Capacity, Var; bảng 40%-100% utilization tính c = F/(Cap*u)+v và margin tại giá thị trường."
  - "Sheet Learning Curve: =C1*n^(LOG(rate,2)) cho n=1..32; vẽ biểu đồ."
  - "Sheet Premium Break-even: m0, L, e, tính x_min =m0/(1-L)-m0+e; so với giá dự kiến."
  - "Sheet Price War: m, d, =d/(m-d); bảng nhạy d từ 1% đến 10% giá."
  - "Sheet Niche Scoring: bảng phân khúc x 5 tiêu chí, trọng số, =SUMPRODUCT; phân tích nhạy trọng số."

