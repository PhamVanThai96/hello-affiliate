# m06 - Hành vi người tiêu dùng (distill từ 06-consumer-behavior.md)
id: "m06"
name_vi: "Hành vi người tiêu dùng"
name_en: "Consumer Behavior"
purpose: >
  Hiểu khách hàng (cá nhân, nhóm, tổ chức) chọn, mua, dùng và loại bỏ sản phẩm thế nào: quy trình ra quyết định mua (5 giai đoạn Kotler),
  hành trình khách hàng số (5A), các yếu tố ảnh hưởng (văn hóa, xã hội, cá nhân, tâm lý), tháp nhu cầu Maslow và các thiên kiến nhận thức
  (cognitive biases), rồi chuyển insight thành persona, customer journey map và thiết kế tác động hành vi (giá, thông điệp, kênh, gamification).
  Là nền tảng để mọi quyết định STP, 4P, giá, truyền thông đều xuất phát từ khách hàng thay vì từ sản phẩm.
when_to_use:
  - "Chủ SME hỏi 'khách của tôi quyết định mua thế nào / vì sao họ không mua / vì sao mua rồi không quay lại'."
  - "Cần xây buyer persona, customer journey map, tìm touchpoint, pain point, moment of delight."
  - "Cần chẩn đoán phễu 5A (Aware-Appeal-Ask-Act-Advocate) hoặc 5 giai đoạn mua để biết khâu nào rò rỉ."
  - "Thiết kế thông điệp/khuyến mãi dựa trên cognitive bias (anchoring, social proof, scarcity, loss aversion, reciprocity, authority, bandwagon, framing)."
  - "Chọn kênh tìm kiếm thông tin của khách (Google, review, KOL/KOC, nhóm Facebook, Zalo) và nội dung theo từng giai đoạn."
  - "Phân tích case Shopee (điều khiển hành vi mua sắm), Spotify Wrapped (khai thác bản sắc, FOMO, hoài niệm)."
  - "Cân nhắc rủi ro đạo đức, pháp lý và 'nghiện khuyến mãi' khi dùng kỹ thuật tác động hành vi."
prerequisites: []
related_modules:
  - "m01 - STP: persona và insight hành vi là đầu vào để phân khúc, chọn mục tiêu, định vị"
  - "m02 - Marketing mix 4P/7P: hiểu hành vi để thiết kế sản phẩm, giá, kênh, truyền thông"
  - "m03 - Customer Lifetime Value: giai đoạn hành vi sau mua, loyalty, advocacy quyết định retention và CLV"
  - "m04 - Brand management: nhận biết, ưa thích, bản sắc cá nhân gắn thương hiệu"
  - "m05 - Digital marketing và growth hacking: AARRR, UGC, referral, gamification triển khai các bias"
  - "m07 - Marketing research: phương pháp thu thập insight (survey, phỏng vấn, quan sát) để dựng persona"
  - "m08 - IMC: chọn thông điệp/kênh theo giai đoạn hành trình"
  - "m10 - Pricing strategies: anchoring, framing, perceived value, price sensitivity"
  - "m11 - Marketing mix 4C và UGC content: góc nhìn khách hàng và nội dung do người dùng tạo"

concepts:
  - term_vi: "Hành vi người tiêu dùng"
    term_en: "Consumer Behavior"
    definition: >
      Nghiên cứu cách cá nhân, nhóm và tổ chức lựa chọn, mua, sử dụng và loại bỏ sản phẩm, dịch vụ, trải nghiệm để thỏa mãn nhu cầu.
    why_it_matters: >
      Kotler: marketing là nghệ thuật hiểu khách hàng chứ không chỉ bán hàng. Hiểu hành vi giúp thiết kế sản phẩm đúng nhu cầu, định giá theo giá trị cảm nhận
      (perceived value) và độ nhạy giá (price sensitivity), chọn kênh đúng nơi khách mua, truyền thông đúng cảm xúc/thông điệp, và dự đoán xu hướng trước đối thủ.
  - term_vi: "Quy trình ra quyết định mua 5 giai đoạn"
    term_en: "Five-Stage Buying Decision Process"
    definition: >
      Nhận biết vấn đề, tìm kiếm thông tin, đánh giá phương án, quyết định mua, hành vi sau mua.
    why_it_matters: >
      Cho biết khách đang ở đâu để đặt đúng nội dung/ưu đãi (không đẩy khuyến mãi cho người chưa nhận ra nhu cầu). Giai đoạn 5 quyết định loyalty hay churn,
      và là đầu vào của CLV.
  - term_vi: "Hành trình khách hàng 5A"
    term_en: "5A Customer Path (Aware-Appeal-Ask-Act-Advocate)"
    definition: >
      Biết, Thích, Tìm hiểu, Mua, Ủng hộ/giới thiệu. Bản địa hóa lại phễu truyền thống cho thời kỳ kết nối số.
    why_it_matters: >
      Phễu tuyến tính cũ (AIDA) không mô tả được việc khách hỏi bạn bè/đọc review rồi mới mua và sau đó thành người giới thiệu. 5A thêm vòng Ask (tham vấn cộng đồng)
      và Advocate (khách thành kênh truyền thông). Nguồn gốc: Kotler, Kartajaya, Setiawan, Marketing 4.0 (2016); Marketing 5.0 (2021) dùng lại.
  - term_vi: "Điểm chạm"
    term_en: "Touchpoint"
    definition: "Mọi điểm khách tiếp xúc với thương hiệu trên hành trình (quảng cáo, cửa hàng, website, review, chat, giao hàng, hậu mãi)."
    why_it_matters: "Là đơn vị để đo cảm xúc, tìm pain point và gán trách nhiệm cải thiện cho từng phòng ban."
  - term_vi: "Điểm đau và khoảnh khắc hài lòng"
    term_en: "Pain Point and Moment of Delight"
    definition: "Pain point: chỗ khách khó chịu/cản trở hành trình. Moment of delight: chỗ trải nghiệm vượt kỳ vọng, tạo gắn bó."
    why_it_matters: "Sửa pain point để giảm rò rỉ phễu; khuếch đại moment of delight để tạo advocacy (khách tự giới thiệu)."
  - term_vi: "Các nhóm yếu tố ảnh hưởng"
    term_en: "Influencing Factors: Cultural, Social, Personal, Psychological"
    definition: >
      Văn hóa (culture, subculture, social class); xã hội (reference groups, family, roles); cá nhân (tuổi, thu nhập, lifestyle, personality, self-concept);
      tâm lý (motivation, perception, learning, beliefs, attitudes). Văn hóa, xã hội, cá nhân đi qua lăng kính tâm lý rồi mới thành quyết định mua.
    why_it_matters: >
      Giải thích vì sao cùng một sản phẩm, thông điệp lại hiệu quả khác nhau giữa các nhóm khách; là khung checklist khi dựng persona để không bỏ sót chiều nào.
  - term_vi: "Tháp nhu cầu Maslow"
    term_en: "Maslow's Hierarchy of Needs"
    definition: "5 cấp: sinh lý, an toàn, xã hội, tôn trọng, tự thực hiện. Nhu cầu cấp thấp được thỏa mãn tương đối thì nhu cầu cấp cao mới nổi lên."
    why_it_matters: "Xác định sản phẩm chạm cấp nhu cầu nào để chọn lời hứa thương hiệu (giá rẻ mỗi ngày, an toàn gia đình, thuộc về cộng đồng, địa vị, phát triển bản thân)."
  - term_vi: "Thiên kiến nhận thức"
    term_en: "Cognitive Biases"
    definition: "Lối tắt tư duy hệ thống khiến quyết định lệch khỏi 'người duy lý' (homo economicus)."
    why_it_matters: >
      Con người không phải rational actor (Kahneman, Thinking Fast and Slow 2011: System 1 nhanh-cảm tính vs System 2 chậm-lý trí; Cialdini, Influence 1984: các nguyên tắc thuyết phục).
      Biết bias giúp thiết kế giá/thông điệp hiệu quả hơn, và cũng giúp tránh thao túng phi đạo đức.
  - term_vi: "Tiền tệ xã hội và bản sắc"
    term_en: "Social Currency and Self-Identity"
    definition: "Thứ khách dùng để thể hiện 'tôi là ai' và nâng hình ảnh trước bạn bè (gu nhạc, thành tích, thuộc cộng đồng fan)."
    why_it_matters: "Sản phẩm cho khách một thứ đáng khoe sẽ khiến khách tự quảng cáo miễn phí (Spotify Wrapped)."
  - term_vi: "Hội chứng sợ bỏ lỡ"
    term_en: "FOMO (Fear Of Missing Out) và hành vi bầy đàn (Herd Behavior)"
    definition: "Lo bị lạc lõng khi số đông cùng làm/bàn một điều; muốn tham gia hội thoại chung."
    why_it_matters: "Là động lực mạnh của flash sale, trend, viral; cần dùng có trách nhiệm vì thúc đẩy mua bốc đồng và hối hận sau mua."
  - term_vi: "Hiệu ứng hoài niệm"
    term_en: "Nostalgia Effect"
    definition: "Ký ức cảm xúc gắn với trải nghiệm (bài hát, mùa hè, mốc cuộc đời) được kích hoạt tạo liên kết cảm xúc bền."
    why_it_matters: "Kỷ niệm cuối năm / sinh nhật khách / kỷ niệm mua hàng là thời điểm khách nhạy cảm với việc nhìn lại; dùng để tăng gắn kết."
  - term_vi: "Mua bốc đồng và bất hòa nhận thức sau mua"
    term_en: "Impulse Buying and Post-purchase Dissonance"
    definition: "Mua không có kế hoạch do kích thích cảm xúc; sau đó khách hối hận/nghi ngờ quyết định (cognitive dissonance)."
    why_it_matters: "Gây tỷ lệ trả hàng cao, review xấu, giảm CLV; phải thiết kế trải nghiệm sau mua (xác nhận, hướng dẫn, đổi trả) để giảm."
  - term_vi: "Cá nhân hóa"
    term_en: "Personalization / Hyper-Personalization"
    definition: "Điều chỉnh sản phẩm, thông điệp, trải nghiệm theo dữ liệu hành vi từng khách."
    why_it_matters: "Tăng conversion và CLV; nhưng cần dữ liệu hành vi và tuân thủ quyền riêng tư (GDPR, ATT; ở VN là Nghị định bảo vệ dữ liệu cá nhân, cần xác nhận hiện hành)."

formulas:
  - id: "m06_stage_conversion"
    name_vi: "Tỷ lệ chuyển đổi giữa các giai đoạn hành trình"
    name_en: "Stage-to-stage Conversion Rate"
    expression_latex: 'CR_{i \to i+1} = \frac{N_{i+1}}{N_i}'
    expression_python: "n_next / n_cur"
    excel: "=C3/C2"
    variables:
      - {symbol: "n_cur", meaning: "Số khách ở giai đoạn hiện tại (vd Aware)", unit: "người"}
      - {symbol: "n_next", meaning: "Số khách đi tiếp sang giai đoạn kế (vd Appeal)", unit: "người"}
    when_to_use: "Bổ sung của agent (không có trong nguồn): định lượng khâu rò rỉ của phễu 5A hoặc 5 giai đoạn mua."
    why_it_works: "Phễu nhiều tầng: tổng chuyển đổi là tích các tỷ lệ từng tầng; cải thiện tầng thấp nhất thường có đòn bẩy lớn nhất (nút cổ chai)."
    assumptions:
      - "Đo được số khách từng giai đoạn trong cùng một kỳ/cohort (lead time giữa giai đoạn được tính đến)."
      - "Định nghĩa mỗi giai đoạn rõ (vd Appeal = tương tác/lưu/follow, Ask = vào trang, nhắn tin, đọc review)."
    pitfalls:
      - "Mỗi kênh định nghĩa giai đoạn khác nhau; trộn số khác nguồn gây so sánh sai."
      - "Phễu không tuyến tính: khách có thể nhảy cóc hoặc quay lại (vd mua bốc đồng bỏ qua Ask)."
    interpretation: "So sánh tỷ lệ các tầng với nhau và với kỳ trước; tầng thấp bất thường là nơi điều tra pain point. Không có ngưỡng chuẩn chung (low)."
    example:
      inputs: {aware: 10000, appeal: 4000, ask: 2000, act: 400, advocate: 120}
      steps:
        - "Aware->Appeal = 4000/10000 = 40%"
        - "Appeal->Ask = 2000/4000 = 50%"
        - "Ask->Act = 400/2000 = 20%"
        - "Act->Advocate = 120/400 = 30%"
      result: "Tầng yếu nhất theo tỷ lệ là Ask->Act (20%): khách tìm hiểu nhiều nhưng ít chốt, cần xem trust, giá, thanh toán, giao hàng."
  - id: "m06_par"
    name_vi: "Tỷ lệ hành động mua (PAR)"
    name_en: "Purchase Action Ratio"
    expression_latex: 'PAR = \frac{N_{Act}}{N_{Aware}}'
    expression_python: "n_act / n_aware"
    excel: "=Act/Aware"
    variables:
      - {symbol: "n_act", meaning: "Số khách đã hành động mua", unit: "người"}
      - {symbol: "n_aware", meaning: "Số khách biết đến thương hiệu", unit: "người"}
    when_to_use: "Chỉ số bổ sung (Marketing 4.0, Kotler et al. 2016, không có trong nguồn): đo hiệu quả chuyển từ biết đến mua."
    why_it_works: "Tỷ lệ thấp cho thấy thương hiệu biết nhiều nhưng không đủ thuyết phục hoặc mua khó; so sánh PAR giữa các thương hiệu cùng ngành."
    assumptions: ["Cùng kỳ đo và cùng thị trường mục tiêu."]
    pitfalls: ["Aware đo bằng reach quảng cáo có thể bị thổi phồng so với aware thực sự (đã nhớ tên)."]
    interpretation: "Dùng so sánh theo thời gian/đối thủ; ngưỡng tuyệt đối thay đổi lớn theo ngành (low)."
    example:
      inputs: {n_act: 400, n_aware: 10000}
      steps: ["PAR = 400/10000 = 0.04"]
      result: "PAR = 4%."
  - id: "m06_bar"
    name_vi: "Tỷ lệ ủng hộ thương hiệu (BAR)"
    name_en: "Brand Advocacy Ratio"
    expression_latex: 'BAR = \frac{N_{Advocate}}{N_{Aware}}'
    expression_python: "n_advocate / n_aware"
    excel: "=Advocate/Aware"
    variables:
      - {symbol: "n_advocate", meaning: "Số khách sẵn sàng giới thiệu/ủng hộ", unit: "người"}
      - {symbol: "n_aware", meaning: "Số khách biết đến thương hiệu", unit: "người"}
    when_to_use: "Chỉ số bổ sung (Marketing 4.0): đo sức mạnh truyền miệng/advocacy trên tổng người biết đến."
    why_it_works: "Trong thời đại kết nối, advocate là kênh truyền thông chi phí thấp, đáng tin hơn quảng cáo; BAR cao hơn PAR báo hiệu thương hiệu được yêu mến."
    assumptions: ["Advocate đo bằng hành vi (review, share, referral) hoặc NPS promoter, nhất quán giữa các kỳ."]
    pitfalls: ["Chỉ đếm khảo sát ý định mà không đếm hành vi thật sẽ phóng đại."]
    interpretation: "Theo dõi xu hướng; BAR/PAR cao nghĩa là nhiều người sẵn sàng giới thiệu so với số mua (low)."
    example:
      inputs: {n_advocate: 120, n_aware: 10000}
      steps: ["BAR = 120/10000 = 0.012"]
      result: "BAR = 1.2%; tỷ lệ Advocate/Act = 120/400 = 30%."
  - id: "m06_displayed_discount"
    name_vi: "Mức giảm giá hiển thị (neo giá)"
    name_en: "Displayed Discount from Anchor"
    expression_latex: 'd = \frac{P_{anchor} - P_{sale}}{P_{anchor}}'
    expression_python: "(p_anchor - p_sale) / p_anchor"
    excel: "=(Anchor-Sale)/Anchor"
    variables:
      - {symbol: "p_anchor", meaning: "Giá gốc/giá tham chiếu hiển thị gạch ngang", unit: "VND"}
      - {symbol: "p_sale", meaning: "Giá bán thực tế", unit: "VND"}
    when_to_use: "Đánh giá độ mạnh hiệu ứng neo giá (Anchoring) và kiểm tra tính trung thực của giá gạch."
    why_it_works: "Con người đánh giá giá theo mốc tham chiếu đầu tiên nhìn thấy, nên % giảm hiển thị tạo cảm giác 'deal tốt' bất kể giá trị thật."
    assumptions: ["Giá gốc là giá đã được bán thực tế trong một thời gian hợp lý."]
    pitfalls:
      - "Nâng giá gốc ảo để tăng % giảm là lừa dối khách hàng, rủi ro pháp lý (Luật Bảo vệ quyền lợi người tiêu dùng, quy định quảng cáo khuyến mại; cần xác nhận hiện hành) và mất niềm tin."
      - "Chỉ nhìn % giảm mà quên margin còn lại sau giảm."
    interpretation: "So % giảm hiển thị với % giảm so với giá bán thực đã giao dịch gần nhất; chênh lớn là dấu hiệu neo ảo."
    example:
      inputs: {p_anchor: 500000, p_sale: 299000}
      steps: ["d = (500000-299000)/500000 = 0.402"]
      result: "Hiển thị giảm 40.2%. Nếu giá bán thật trước đó là 350000 thì giảm thật chỉ (350000-299000)/350000 = 14.6%."
  - id: "m06_breakeven_uplift"
    name_vi: "Mức tăng sản lượng cần để hòa vốn khuyến mãi"
    name_en: "Break-even Volume Uplift for a Discount"
    expression_latex: 'U = \frac{d}{m - d}'
    expression_python: "d / (m - d)"
    excel: "=d/(m-d)"
    variables:
      - {symbol: "d", meaning: "Mức giảm giá theo % giá bán gốc (0-1)", unit: "tỷ lệ"}
      - {symbol: "m", meaning: "Biên lợi nhuận gộp trên giá gốc (contribution margin %, 0-1), m > d", unit: "tỷ lệ"}
    when_to_use: "Bổ sung của agent: kiểm tra flash sale/voucher/scarcity có sinh lời không, liên hệ rủi ro 'nghiện khuyến mãi' của case Shopee."
    why_it_works: >
      Lợi nhuận hòa vốn: Q0 x (P x m) = Q1 x (P x (m - d)) suy ra Q1/Q0 - 1 = d/(m-d). Giảm giá cắt biên mỗi đơn vị nên phải bán nhiều hơn rất nhiều để bù.
    assumptions: ["Chi phí biến đổi trên đơn vị không đổi; chi phí cố định không đổi; không tính hiệu ứng kéo mua chéo hay CLV."]
    pitfalls:
      - "Bỏ qua cannibalization (khách vốn mua giá đầy nay mua giá giảm) và pull-forward (mua sớm thay vì sau)."
      - "Nếu d >= m thì giảm giá làm lỗ trên mỗi đơn vị; công thức không còn ý nghĩa."
    interpretation: "U = 100% nghĩa là phải gấp đôi sản lượng để hòa vốn. Biên mỏng thì giảm giá nhỏ cũng đòi tăng sản lượng rất lớn."
    example:
      inputs: {d: 0.2, m: 0.4}
      steps: ["U = 0.2/(0.4-0.2) = 1.0", "Kiểm: giá 100, giá vốn 60, bán 200 đơn vị lãi 8000; giảm 20% bán 400 đơn vị lãi (80-60) x 400 = 8000 (hòa vốn)."]
      result: "Cần tăng sản lượng 100%."

frameworks:
  - id: "m06_five_stage_buying"
    name_vi: "Mô hình 5 giai đoạn ra quyết định mua"
    name_en: "Five-Stage Buying Decision Process (Kotler)"
    origin: >
      Philip Kotler (Marketing Management) hệ thống hóa mô hình quyết định mua dựa trên truyền thống nghiên cứu hành vi người tiêu dùng (Engel-Kollat-Blackwell, Howard-Sheth) nhằm giúp
      nhà làm marketing biết khách ở đâu trong tiến trình để can thiệp đúng lúc, thay vì chỉ tập trung khoảnh khắc thanh toán.
    components:
      - "1. Nhận biết vấn đề (Problem Recognition): khoảng cách giữa trạng thái hiện tại và mong muốn; digital: social media tạo nhu cầu mới (FOMO, trending)."
      - "2. Tìm kiếm thông tin (Information Search): nội bộ (trí nhớ) và bên ngoài (Google, review, bạn bè); digital: Google, YouTube review, KOL/KOC, Reddit."
      - "3. Đánh giá phương án (Evaluation of Alternatives): so sánh theo tiêu chí giá, chất lượng, thương hiệu; digital: website so sánh, Shopee vs Tiki."
      - "4. Quyết định mua (Purchase Decision): chọn sản phẩm, nơi mua, thanh toán; digital: 1-click, BNPL, flash sale urgency."
      - "5. Hành vi sau mua (Post-purchase Behavior): hài lòng thì loyalty/referral, bất mãn thì complaint/churn; digital: review online, post mạng xã hội, đổi trả."
    when_to_use: "Khi cần hiểu quy trình mua, đặc biệt với sản phẩm cân nhắc cao (giá trị lớn, rủi ro cao) hoặc khi chẩn đoán vì sao khách không mua / không quay lại."
    how_to_apply:
      - "Chọn 1 persona và 1 sản phẩm cụ thể."
      - "Với mỗi giai đoạn, ghi khách làm gì, hỏi gì, ở đâu, cảm xúc ra sao (phỏng vấn 5-10 khách thật hoặc dùng dữ liệu bán hàng)."
      - "Xác định điểm ma sát (thiếu thông tin, thiếu bằng chứng, thanh toán khó, giao hàng chậm)."
      - "Gán hành động marketing cho từng giai đoạn: nội dung gợi vấn đề, SEO/review cho tìm kiếm, so sánh/bảo chứng cho đánh giá, ưu đãi/thanh toán dễ cho quyết định, chăm sóc/xin review cho sau mua."
      - "Đo bằng tỷ lệ chuyển đổi từng giai đoạn."
    how_to_read_results: "Giai đoạn có drop-off lớn hoặc cảm xúc tiêu cực là ưu tiên. Hài lòng sau mua cao nhưng không giới thiệu: thiếu cơ chế advocate. Hối hận sau mua cao: kỳ vọng bị thổi phồng ở giai đoạn trước."
    pitfalls:
      - "Giả định khách đi tuần tự và duy lý; thực tế có nhảy cóc, mua bốc đồng bỏ qua giai đoạn 2-3."
      - "Bỏ giai đoạn 5, chỉ chăm quảng cáo thu hút."
    example: "Chủ shop đồ dùng cho bé: khách (mẹ Lan) nhận ra nhu cầu khi con bắt đầu ăn dặm, tìm trong nhóm Facebook mẹ bỉm và review Shopee, so sánh 3 shop theo giá/chứng nhận an toàn, chốt vì có freeship và COD, sau mua xem hướng dẫn dùng và để lại review."
  - id: "m06_5a_path"
    name_vi: "Hành trình khách hàng 5A"
    name_en: "5A Customer Path (Aware-Appeal-Ask-Act-Advocate)"
    origin: >
      Philip Kotler, Hermawan Kartajaya, Iwan Setiawan, Marketing 4.0 (2016), nhằm thay phễu AIDA tuyến tính trước kỳ kết nối số (khách hỏi cộng đồng và tự thành người truyền thông).
      Nguồn markdown ghi nhầm là 'Marketing 5.0'; Marketing 5.0 (2021) chỉ dùng lại 5A.
    components:
      - "Aware: biết; offline TV, billboard, word-of-mouth; digital social ads, SEO, influencer, viral content."
      - "Appeal: thích; offline brand image, showroom; digital Instagram aesthetic, TikTok review, UGC."
      - "Ask: tìm hiểu, hỏi; offline hỏi bạn bè/nhân viên; digital Google, review, so sánh, chatbot."
      - "Act: mua; offline đến cửa hàng; digital e-commerce, social commerce, 1-click, BNPL."
      - "Advocate: ủng hộ, giới thiệu; offline truyền miệng; digital review, referral link, share mạng xã hội."
    when_to_use: "Thiết kế và đo hành trình omnichannel của thương hiệu, nhất là bán online / social commerce."
    how_to_apply:
      - "Liệt kê kênh và nội dung hiện có theo 5A (offline và digital)."
      - "Thu số liệu mỗi tầng (reach, tương tác, truy cập/nhắn tin, đơn hàng, review/giới thiệu)."
      - "Tính stage conversion, PAR, BAR (xem formulas)."
      - "Xác định tầng yếu nhất và giả thuyết nguyên nhân (Aware thấp: ngân sách/kênh; Appeal thấp: thông điệp/hình ảnh; Ask thấp: thiếu nội dung/review; Act thấp: thanh toán/giao hàng/giá; Advocate thấp: không có ưu đãi giới thiệu/trải nghiệm kém)."
      - "Thử nghiệm A/B một thay đổi mỗi lần, đo lại."
    how_to_read_results: "Nút cổ chai ở tầng nào thì dồn nguồn lực vào tầng đó thay vì tăng ngân sách Aware chung chung. BAR thấp so với PAR: khách mua nhưng không yêu, cần cải thiện trải nghiệm và cơ chế giới thiệu."
    pitfalls:
      - "Chỉ đo Act (doanh thu), không đo Ask và Advocate."
      - "Coi mọi khách đi đủ 5A; có khách mua ngay không qua Ask."
    example: "Shopee: Aware qua TikTok ads, KOL, TV ads 9.9/10.10/11.11; Appeal giảm giá sốc, freeship, celeb; Ask đọc review, hỏi qua Shopee Live chat; Act flash sale countdown với ShopeePay, BNPL, COD; Advocate đánh giá kèm ảnh nhận xu, chia sẻ deal."
  - id: "m06_influence_factors"
    name_vi: "Mô hình các yếu tố ảnh hưởng đến quyết định mua"
    name_en: "Factors Influencing Consumer Behavior"
    origin: "Từ khung hành vi người mua của Kotler: yếu tố văn hóa, xã hội, cá nhân, tâm lý tác động theo thứ tự rộng đến hẹp. Ra đời để tránh giải thích hành vi mua chỉ bằng giá hoặc sản phẩm."
    components:
      - "Văn hóa (Cultural): culture, subculture, social class."
      - "Xã hội (Social): nhóm tham chiếu (reference groups), gia đình, vai trò và địa vị."
      - "Cá nhân (Personal): tuổi, thu nhập, lifestyle, personality, self-concept."
      - "Tâm lý (Psychological): motivation, perception, learning, beliefs, attitudes. Ba nhóm trên đi qua tâm lý rồi tạo quyết định mua."
    when_to_use: "Dựng persona, giải thích khác biệt giữa các nhóm khách, lập kế hoạch nghiên cứu insight."
    how_to_apply:
      - "Lập bảng 4 nhóm x yếu tố, ghi dữ kiện về khách mục tiêu cho từng ô."
      - "Xác định yếu tố nào chi phối nhất với sản phẩm này (vd mẹ bỉm: nhóm tham chiếu và niềm tin về an toàn)."
      - "Chuyển thành giả thuyết thông điệp, kênh, giá, và kiểm chứng bằng nghiên cứu."
    how_to_read_results: "Yếu tố chi phối cho biết đòn bẩy marketing (ví dụ nhóm tham chiếu mạnh thì đầu tư KOC, cộng đồng, referral)."
    pitfalls:
      - "Áp mô hình phương Tây nguyên xi cho thị trường Á Đông (cultural bias; vd văn hóa tập thể, gia đình ảnh hưởng mạnh)."
      - "Suy diễn từ nhân khẩu học (demographics) thay vì hành vi thực."
    example: "Quán cà phê specialty Q.1 nhắm Gen Z: văn hóa đô thị trẻ, xã hội (check-in cùng bạn bè), cá nhân (thu nhập 10-20 triệu/tháng, lifestyle), tâm lý (nhu cầu thuộc về và bản sắc) dẫn tới thiết kế không gian chụp ảnh và nội dung UGC."
  - id: "m06_maslow"
    name_vi: "Tháp nhu cầu Maslow ứng dụng marketing"
    name_en: "Maslow's Hierarchy of Needs"
    origin: "Abraham Maslow, bài 'A Theory of Human Motivation' (1943), tâm lý học nhân văn: giải thích động lực con người theo thứ bậc nhu cầu; marketing mượn để định vị lời hứa thương hiệu theo cấp nhu cầu."
    components:
      - "1. Sinh lý: thực phẩm, nước, nhà ở; appeal 'giá rẻ mỗi ngày'."
      - "2. An toàn: bảo hiểm, khóa cửa, Volvo; appeal 'an toàn cho gia đình'."
      - "3. Xã hội: Facebook, Starbucks; appeal 'kết nối, thuộc về cộng đồng'."
      - "4. Tôn trọng: Louis Vuitton, BMW; appeal 'bạn xứng đáng'."
      - "5. Tự thực hiện: Coursera, Apple; appeal 'Think Different', 'Just Do It'."
    when_to_use: "Chọn định vị cảm xúc, thông điệp quảng cáo và phân biệt nhu cầu thực với nhu cầu tạo bởi marketing."
    how_to_apply:
      - "Xác định sản phẩm thỏa mãn cấp nhu cầu nào (có thể nhiều cấp: cà phê = sinh lý + xã hội + tôn trọng)."
      - "Xác định cấp nhu cầu ưu tiên của persona mục tiêu theo thu nhập/giai đoạn đời."
      - "Viết value proposition và thông điệp khớp cấp đó."
    how_to_read_results: "Cấp nhu cầu càng cao thì khách trả giá premium cho ý nghĩa, địa vị; cấp thấp thì nhạy giá và tiện lợi."
    pitfalls:
      - "Thứ bậc không cứng nhắc; nhiều nhu cầu cùng tồn tại và thay đổi theo văn hóa."
      - "Đối xử Maslow như khoa học chính xác thay vì khung gợi ý."
    example: "Quán phở bình dân nhắm cấp 1-2 (no, sạch, giá rõ); quán cà phê specialty nhắm cấp 3-4 (cộng đồng, gu); khóa học online nhắm cấp 5."
  - id: "m06_cognitive_biases"
    name_vi: "Bộ 8 thiên kiến nhận thức dùng trong marketing"
    name_en: "Cognitive Biases Toolkit"
    origin: >
      Từ kinh tế học hành vi và tâm lý thuyết phục: Kahneman và Tversky (Prospect Theory 1979; loss aversion, anchoring, framing), Kahneman, Thinking Fast and Slow (2011);
      Cialdini, Influence (1984: reciprocity, social proof, authority, scarcity). Ra đời vì mô hình người duy lý không giải thích được hành vi mua thực tế.
    components:
      - "Anchoring: bám vào con số đầu tiên; gạch giá gốc 500K sang 299K."
      - "Social Proof: làm theo đám đông; '50,000 người đã mua', 'Bán chạy #1'."
      - "Scarcity: khan hiếm làm tăng giá trị; 'Chỉ còn 3 sản phẩm', 'Flash sale 2 giờ'."
      - "Loss Aversion: sợ mất hơn thích được; 'Đừng bỏ lỡ', 'Ưu đãi kết thúc hôm nay'."
      - "Reciprocity: được cho thì muốn trả; free sample, free trial, ebook miễn phí."
      - "Authority: tin người có thẩm quyền; 'bác sĩ khuyên dùng', chuyên gia endorsement."
      - "Bandwagon: đi theo trend; 'Trend TikTok', '#1 Seller'."
      - "Framing: cách trình bày đổi quyết định; '95% fat-free' vs '5% fat'."
    when_to_use: "Thiết kế trang bán hàng, bảng giá, khuyến mãi, thông điệp, chương trình loyalty; phân tích vì sao một chiến dịch hiệu quả."
    how_to_apply:
      - "Xác định giai đoạn hành trình đang tắc (vd Ask thiếu niềm tin: dùng social proof, authority; Act chần chừ: scarcity, loss aversion)."
      - "Chọn 1-2 bias phù hợp, ghép với bằng chứng THẬT (số bán thật, tồn kho thật, thời hạn thật)."
      - "Thiết kế biến thể A/B (vd có/không countdown; giá gạch/không gạch)."
      - "Đo conversion, AOV, tỷ lệ trả hàng và điểm hài lòng sau mua, không chỉ tỷ lệ chốt."
      - "Kiểm tra đạo đức và pháp lý: không bịa tồn kho, giá gốc, số lượng đã bán."
    how_to_read_results: "Conversion tăng nhưng return rate và review xấu cũng tăng nghĩa là bias đã đẩy mua bốc đồng; lợi ích ngắn hạn, hại CLV."
    pitfalls:
      - "Lạm dụng/giả mạo (đếm ngược ảo, tồn kho ảo, giá gốc ảo) làm mất niềm tin và vi phạm quy định quảng cáo, bảo vệ người tiêu dùng."
      - "Dồn mọi bias cùng lúc gây cảm giác bị thao túng."
      - "Quên khác biệt văn hóa: bandwagon, authority hoạt động khác nhau giữa thị trường."
    example: "Shop thời trang online VN: bài đăng 'đã bán 1.200 đơn tuần này' (social proof, số thật từ hệ thống), flash sale 2 giờ có tồn kho thật (scarcity), tặng mã freeship cho đơn đầu (reciprocity)."
  - id: "m06_journey_mapping"
    name_vi: "Lập bản đồ hành trình khách hàng"
    name_en: "Customer Journey Mapping"
    origin: "Phát triển từ service design / trải nghiệm khách hàng (CX) cuối thế kỷ 20 để thấy toàn bộ trải nghiệm xuyên phòng ban thay vì từng điểm rời rạc; được Kotler và các tác giả marketing số đưa vào phương pháp chuẩn."
    components:
      - "Persona (đại diện khách)."
      - "Giai đoạn hành trình (5 giai đoạn mua hoặc 5A)."
      - "Touchpoints."
      - "Emotions tại mỗi touchpoint."
      - "Pain points và moments of delight."
      - "Giải pháp cải thiện và chỉ số đo."
    when_to_use: "Khi muốn cải thiện trải nghiệm tổng thể, tăng conversion hoặc retention, hoặc khi nhiều bộ phận cùng chạm khách."
    how_to_apply:
      - "Bước 1: Xác định persona đại diện khách mục tiêu."
      - "Bước 2: Liệt kê touchpoints trên hành trình."
      - "Bước 3: Ghi nhận cảm xúc (emotions) tại mỗi touchpoint (dựa trên phỏng vấn, khảo sát, review, chat log)."
      - "Bước 4: Xác định pain points và moments of delight."
      - "Bước 5: Thiết kế giải pháp cải thiện tại mỗi touchpoint, gán chủ sở hữu."
      - "Bước 6: Triển khai và đo lường (stage conversion, CSAT/NPS, thời gian xử lý)."
    how_to_read_results: "Đường cảm xúc trũng sâu là nơi ưu tiên sửa. Moment of delight nên được nhân rộng và biến thành nội dung/giới thiệu."
    pitfalls:
      - "Vẽ từ tưởng tượng của nội bộ, không dựa khách thật."
      - "Map xong để đó, không có chủ sở hữu và KPI."
      - "Quá nhiều touchpoint, không ưu tiên."
    example: "Shop mẹ và bé: pain point là 'quá nhiều lựa chọn, khó quyết định' tại Ask/Evaluate; giải pháp: bộ lọc 'theo độ tuổi bé' và tư vấn Zalo trong 5 phút; moment of delight: tư vấn tận tình, nhanh."
  - id: "m06_buyer_persona"
    name_vi: "Chân dung khách hàng mục tiêu"
    name_en: "Buyer Persona"
    origin: "Alan Cooper đưa persona vào thiết kế phần mềm (The Inmates Are Running the Asylum, 1998); marketing dùng để biến dữ liệu phân khúc thành hình mẫu người cụ thể để cả đội cùng nhắm tới."
    components:
      - "Demographics (nhân khẩu học)."
      - "Goals (mục tiêu)."
      - "Pain Points (điểm đau)."
      - "Moment of Delight."
      - "Information Sources (nguồn thông tin)."
      - "Preferred Channels (kênh ưa thích)."
    when_to_use: "Trước khi viết nội dung, chọn kênh, làm khuyến mãi; dùng làm đầu vào STP và journey map."
    how_to_apply:
      - "Thu thập dữ liệu: phỏng vấn khách thật, khảo sát, dữ liệu đơn hàng, comment/review."
      - "Gom nhóm các khách giống nhau, đặt tên và tuổi cho persona đại diện."
      - "Điền 6 mục mẫu; mục goals/pain points phải trích dẫn lời khách."
      - "Dùng persona để duyệt mọi chiến dịch: 'Lan có hiểu, có thích, có tìm thấy ở kênh này không?'"
      - "Cập nhật mỗi 6-12 tháng."
    how_to_read_results: "Persona tốt cho phép dự đoán khách sẽ phản ứng thế nào với một ưu đãi hay kênh; nếu không dự đoán được, persona quá chung chung."
    pitfalls:
      - "Persona bịa theo giả định, thiếu dữ liệu."
      - "Quá nhiều persona (chọn 1-3 chính)."
      - "Chỉ nhân khẩu học, thiếu động cơ và hành vi."
    example: "Persona 'Lan, working mom': 32 tuổi, Hà Nội, thu nhập 25-35 triệu/tháng, 1 con 3 tuổi; mục tiêu cân bằng công việc-gia đình, mua đồ tốt cho con nhanh; điểm đau thiếu thời gian, lo chất lượng, quá nhiều lựa chọn; nguồn thông tin nhóm Facebook mẹ bỉm sữa, review Shopee/Lazada, bác sĩ nhi; kênh Shopee/Lazada để mua, Facebook/TikTok để khám phá, Zalo nhận promotion."
  - id: "m06_shopee_behavior_design"
    name_vi: "Thiết kế hành vi mua sắm kiểu Shopee (phân tích case)"
    name_en: "Shopee Behavior-Design Playbook"
    origin: "Rút từ case Shopee (Sea Group): đi sau Lazada nhưng thắng nhờ hiểu hành vi mua sắm châu Á (nhạy giá, mua giải trí, cần freeship, COD)."
    components:
      - "Scarcity: Flash Sale 12:00 và 0:00, 'Sắp hết hàng', countdown."
      - "Social Proof: 'Đã bán 10K+', rating, review, 'X người đang xem'."
      - "Anchoring: giá gốc gạch, 'giảm 60%'."
      - "Loss Aversion: voucher hết hạn trong 2 giờ."
      - "Gamification: Shopee Farm, Shopee Shake, Lắc Xu, Quay số -> thói quen mở app hàng ngày."
      - "Reciprocity: freeship, voucher miễn phí, coins."
      - "Bandwagon: Trending, #1 Seller, celeb endorsement."
      - "Variable Reward: phần thưởng ngẫu nhiên mỗi lần lắc (cơ chế như slot machine)."
    when_to_use: "Khi muốn học cách ghép nhiều cơ chế hành vi thành hệ thống tạo thói quen và mega-campaign."
    how_to_apply:
      - "Chọn rào cản địa phương #1 (VN: phí ship, ngại thanh toán online) và gỡ bằng freeship, COD."
      - "Tạo thói quen hàng ngày bằng cơ chế nhỏ (check-in, điểm thưởng, mini game) với phần thưởng có giá trị thật."
      - "Tạo sự kiện văn hóa (ngày đôi 9.9, 10.10, 11.11) để cô đọng nhu cầu vào một thời điểm."
      - "Tích hợp giải trí và mua sắm (live, video ngắn) cho Gen Z."
      - "Đặt ngưỡng quản trị: kiểm soát phụ thuộc khuyến mãi, kiểm soát chất lượng để giữ niềm tin."
    how_to_read_results: "Tăng trưởng GMV và DAU nhưng lợi nhuận thấp, return cao là dấu hiệu discount addiction; cần cân bằng bằng retention và chất lượng."
    pitfalls:
      - "Bắt chước cơ chế mà SME không có ngân sách trợ giá, dẫn đến lỗ."
      - "Phụ thuộc khuyến mãi: khách chỉ mua khi có sale, biên mỏng."
      - "Chất lượng không đồng đều gây trust issue; mua bốc đồng sinh hối hận, return cao."
    example: "Shop nhỏ có thể áp dụng bản nhẹ: mini flash sale cuối tuần có tồn kho thật, tích điểm Zalo OA, mã freeship đơn đầu, kèm kiểm tra lợi nhuận bằng công thức m06_breakeven_uplift."
  - id: "m06_spotify_wrapped"
    name_vi: "Spotify Wrapped: từ dữ liệu hành vi sang trải nghiệm lan truyền"
    name_en: "Spotify Wrapped Behavioral Framework"
    origin: "Chiến dịch tổng kết cuối năm của Spotify, dùng dữ liệu nghe của chính người dùng để tạo nội dung cá nhân đáng chia sẻ."
    components:
      - "3 động lực tâm lý: Self-Identity và Social Currency; FOMO / hành vi bầy đàn; Nostalgia Effect."
      - "Quy trình 3 bước: Thu thập behavioral data, Cá nhân hóa (hyper-personalization, nhóm tính cách nghe nhạc như Vampire, Time Traveler, Alchemist), Tối ưu chia sẻ (frictionless sharing: slide dọc kiểu Story, nút Share 1 chạm sang Instagram, Zalo, Facebook)."
      - "Cơ chế lan truyền: logo Spotify xuất hiện ở góc như bảo chứng; khách tự quảng cáo cho chính họ."
    when_to_use: "Khi có dữ liệu sử dụng của khách và muốn tạo nội dung do khách tự chia sẻ (UGC), tăng retention và nhận diện."
    how_to_apply:
      - "Xác định dữ liệu hành vi thật bạn đã có (đơn hàng, điểm, lượt ghé, món yêu thích)."
      - "Chọn khoảnh khắc nhìn lại (cuối năm, sinh nhật khách, kỷ niệm 1 năm)."
      - "Đóng gói thành bản tổng kết cá nhân hóa, gán danh hiệu/nhóm tính cách vui, đẹp, dễ chia sẻ."
      - "Giảm ma sát chia sẻ: một chạm, định dạng chuẩn mạng xã hội, kèm nhận diện thương hiệu."
      - "Đo share rate, lượt khách mới từ chia sẻ, retention."
    how_to_read_results: "Share rate và lượng khách mới tự nhiên cao cho thấy sản phẩm trao 'tiền tệ xã hội'. Retention tăng khi khách thấy mất giá trị tích lũy nếu rời đi."
    pitfalls:
      - "Thiếu đủ dữ liệu hành vi hoặc xử lý dữ liệu cá nhân khi chưa có đồng ý (rủi ro quyền riêng tư)."
      - "Kết quả xấu/ngại ngùng (khách không muốn khoe) mà vẫn ép chia sẻ."
      - "Sao chép format mà không có insight bản sắc phù hợp ngành."
    example: "Quán cà phê có app tích điểm: cuối năm gửi 'Coffee Wrapped' (món uống nhiều nhất, số lần ghé, danh hiệu 'Người bắt đầu ngày mới sớm nhất'), nút chia sẻ Zalo/Instagram, tặng voucher cho bạn mới."

procedures:
  - id: "m06_proc_customer_insight"
    name: "Quy trình phân tích hành trình quyết định mua và insight khách hàng"
    steps:
      - "1. Làm rõ bài toán: sản phẩm nào, khách nào, vấn đề (doanh thu thấp, ít khách quay lại, CAC cao, ít review). Hỏi: mục tiêu số liệu là gì, đang bán ở kênh nào, có dữ liệu đơn hàng không?"
      - "2. Thu thập dữ liệu: dữ liệu bán hàng (RFM nếu có), analytics website/fanpage, review, chat log, khảo sát/phỏng vấn 5-10 khách (qua m07)."
      - "3. Phân khúc và chọn persona 1-3 (qua m01); điền Buyer Persona 6 mục dựa trên dữ liệu."
      - "4. Dựng 5 giai đoạn mua và 5A cho persona: hành động, câu hỏi, nguồn thông tin, tiêu chí đánh giá, rào cản tại mỗi giai đoạn."
      - "5. Phân tích yếu tố ảnh hưởng (văn hóa, xã hội, cá nhân, tâm lý) và cấp nhu cầu Maslow chi phối."
      - "6. Lập journey map: touchpoints, emotions, pain points, moments of delight."
      - "7. Đo phễu: tính stage conversion, PAR, BAR (m06_stage_conversion, m06_par, m06_bar); tìm tầng rò rỉ."
      - "8. Chọn đòn bẩy hành vi: bias phù hợp (chỉ với bằng chứng thật) và gỡ ma sát (thanh toán, giao hàng, thông tin)."
      - "9. Kiểm tra kinh tế khuyến mãi (m06_breakeven_uplift) và rủi ro đạo đức/pháp lý."
      - "10. Lập kế hoạch thử nghiệm A/B, chủ sở hữu, KPI, thời gian; đo lại sau 2-4 tuần."
    outputs: "Persona, journey map có pain points, phễu 5A với tỷ lệ chuyển đổi, 3-5 hành động ưu tiên kèm KPI, đánh giá rủi ro."
  - id: "m06_proc_journey_map"
    name: "Dựng Customer Journey Map (6 bước)"
    steps:
      - "Xác định persona."
      - "Liệt kê touchpoints theo từng giai đoạn."
      - "Ghi cảm xúc từng touchpoint (thang -2 đến +2 hoặc biểu tượng)."
      - "Đánh dấu pain points và moments of delight."
      - "Đề xuất giải pháp, chủ sở hữu, ngân sách."
      - "Triển khai, đo (stage conversion, CSAT/NPS) và lặp."
    outputs: "Bảng journey map (giai đoạn x touchpoint x cảm xúc x giải pháp) và backlog cải thiện có thứ tự ưu tiên."
  - id: "m06_proc_bias_campaign"
    name: "Thiết kế chiến dịch khuyến mãi dựa trên hành vi một cách có trách nhiệm"
    steps:
      - "Xác định mục tiêu (khách mới, tăng AOV, xả tồn, giữ chân) và giai đoạn hành trình."
      - "Chọn 1-2 bias phù hợp và nguồn bằng chứng thật (số đơn, tồn kho, hạn ưu đãi)."
      - "Tính hòa vốn khuyến mãi: m06_breakeven_uplift, ước lượng uplift thực tế từ lịch sử."
      - "Thiết kế biến thể và nhóm đối chứng."
      - "Chạy, theo dõi conversion, AOV, tỷ lệ trả hàng, review sau mua."
      - "Quyết định tiếp tục/ngừng/điều chỉnh; ghi bài học."
    outputs: "Kế hoạch chiến dịch, bảng kinh tế khuyến mãi, kết quả thử nghiệm và khuyến nghị."
  - id: "m06_proc_post_purchase"
    name: "Thiết kế trải nghiệm sau mua để giảm hối hận và tăng advocacy"
    steps:
      - "Xác nhận đơn và đặt kỳ vọng rõ (thời gian giao, cách dùng)."
      - "Giao hàng đúng hẹn; theo dõi sự cố sớm."
      - "Sau 3-7 ngày: tin nhắn chăm sóc, hướng dẫn sử dụng, hỏi hài lòng."
      - "Nếu bất mãn: xử lý khiếu nại nhanh, đổi trả không ma sát."
      - "Nếu hài lòng: mời đánh giá kèm ảnh (nhận ưu đãi), mã giới thiệu."
      - "Đo return rate, rating, tỷ lệ review, BAR."
    outputs: "Chuỗi kịch bản CSKH hậu mãi và dashboard return rate, rating, advocacy."

decision_rules:
  - "Nếu khách tìm hiểu (Ask) nhiều nhưng ít chốt (Act) thì kiểm tra rào cản niềm tin và ma sát: review, bảo chứng, giá, phí ship, thanh toán, thời gian giao."
  - "Nếu Aware cao nhưng Appeal thấp thì sửa thông điệp/hình ảnh/định vị (kết nối m01, m04), đừng tăng ngân sách quảng cáo."
  - "Nếu mua rồi nhưng ít review/giới thiệu (BAR thấp) thì tạo moment of delight, xin review đúng lúc và có cơ chế referral."
  - "Nếu sản phẩm cân nhắc cao (giá trị lớn, rủi ro) thì đầu tư vào Ask và đánh giá phương án: nội dung chuyên gia, so sánh, bảo hành, dùng thử."
  - "Nếu khách thiếu niềm tin thì dùng social proof và authority bằng bằng chứng thật (review có ảnh, chứng nhận, chuyên gia thật)."
  - "Nếu cần thúc đẩy quyết định có hạn chót thì dùng scarcity và loss aversion chỉ khi tồn kho/hạn ưu đãi thật; nếu không có thật thì không dùng."
  - "Nếu khuyến mãi làm biên mỏng thì tính m06_breakeven_uplift trước; nếu uplift cần thiết vượt khả năng thực tế thì giảm mức giảm hoặc chuyển sang quà tặng, combo, freeship có điều kiện."
  - "Nếu khách chỉ mua khi có sale (discount addiction) thì chuyển giá trị sang loyalty, gamification, bộ sưu tập, trải nghiệm và giảm tần suất sale."
  - "Nếu tỷ lệ trả hàng/hối hận sau mua cao thì giảm kỳ vọng thổi phồng, bổ sung mô tả/kích thước/hướng dẫn, thêm bước xác nhận cho đơn bốc đồng."
  - "Nếu rào cản địa phương là phí ship hoặc ngại thanh toán online thì cung cấp freeship có điều kiện và COD trước (học từ Shopee)."
  - "Nếu nhắm Gen Z / mua giải trí thì dùng video ngắn, live commerce, UGC thay vì quảng cáo tĩnh."
  - "Nếu sản phẩm gắn bản sắc cá nhân hoặc có dữ liệu sử dụng thì cân nhắc 'Wrapped' (tiền tệ xã hội, hoài niệm) để tạo UGC."
  - "Nếu thu thập dữ liệu hành vi thì xin đồng ý rõ ràng và minh bạch mục đích (privacy), chỉ thu thập đủ dùng."
  - "Nếu persona dựa trên giả định chưa kiểm chứng thì gắn nhãn giả thuyết và lên kế hoạch kiểm chứng bằng 5-10 phỏng vấn trước khi đầu tư lớn."
  - "Nếu ngân sách hạn chế thì ưu tiên sửa pain point lớn nhất tại tầng rò rỉ nhất và kênh khách đang thật sự dùng, không dàn trải."

benchmarks:
  - {metric: "GMV Shopee/Sea ĐNÁ (2023)", value: "~75 tỷ USD (nguồn ghi)", context: "Chỉ để minh họa quy mô; con số xấp xỉ, cần đối chiếu báo cáo Sea Limited", confidence: "low"}
  - {metric: "Đơn hàng trong chiến dịch 11.11 của Shopee (2023)", value: "850 triệu+ (nguồn ghi)", context: "Chưa kiểm chứng độc lập; dùng như minh họa quy mô", confidence: "low"}
  - {metric: "Thời gian trung bình trên app Shopee", value: "30+ phút/ngày (nguồn ghi)", context: "Số liệu nguồn không rõ năm/phương pháp", confidence: "low"}
  - {metric: "Tỷ lệ mua bốc đồng trên Flash Sale Shopee", value: "60% (nguồn ghi)", context: "Không rõ khảo sát/nguồn; chỉ dùng chiều hướng", confidence: "low"}
  - {metric: "Stage conversion Aware-Appeal-Ask-Act-Advocate", value: "Không có ngưỡng chuẩn chung", context: "Phụ thuộc ngành/kênh; tự xây baseline và so sánh theo kỳ", confidence: "low"}
  - {metric: "Số đơn vị sản lượng tăng để hòa vốn giảm giá", value: "d/(m-d)", context: "Vd giảm 20% khi biên 40% cần +100% sản lượng", confidence: "high"}

pitfalls:
  - "Coi khách là người duy lý; bỏ qua cảm xúc, bias, bối cảnh xã hội."
  - "Dựng persona từ giả định và nhân khẩu học, không có phỏng vấn/dữ liệu thật."
  - "Chỉ đo doanh thu (Act), bỏ qua Ask, Advocate và hành vi sau mua."
  - "Dùng bias một cách giả tạo (đếm ngược ảo, tồn kho ảo, giá gốc ảo): mất niềm tin, vi phạm quy định quảng cáo/bảo vệ người tiêu dùng."
  - "Lạm dụng khuyến mãi tạo 'discount addiction': khách chỉ mua khi có sale, biên mỏng."
  - "Mua bốc đồng gây hối hận, trả hàng cao, review xấu."
  - "Áp nguyên mô hình phương Tây cho thị trường Việt/Á Đông mà không điều chỉnh (cultural bias)."
  - "Thu thập dữ liệu hành vi không minh bạch/không có đồng ý (privacy)."
  - "Map hành trình xong không gắn chủ sở hữu và KPI."
  - "Sao chép case lớn (Shopee, Spotify) mà không có ngân sách/dữ liệu/quy mô tương đương."
  - "Ghi chú lỗi nguồn: markdown ghi 5A là của 'Marketing 5.0' (thực ra Marketing 4.0, 2016); các số liệu Shopee (75B USD, 850M đơn, 30 phút/ngày, 60% impulse) và Spotify ('hàng chục triệu lượt chia sẻ') không có trích dẫn nên không nên coi là đã xác thực; tiêu đề mục VII và các mục sau của Spotify Wrapped không đánh số chuẩn; ASCII tháp Maslow trong nguồn lệch số thứ tự."

sme_vn_guidance:
  - "Công cụ nghiên cứu hành vi miễn phí/rẻ: Google Forms (miễn phí) khảo sát; Google Analytics 4 (miễn phí) theo dõi hành vi web; Meta Business Suite / Insights (miễn phí) xem hành vi người xem; TikTok Analytics (miễn phí); Zalo OA (có gói, giá cần xác nhận). Phỏng vấn trực tiếp 5-10 khách tốn gần như 0 đồng nhưng giá trị insight cao."
  - "Phần mềm bán hàng/CRM cho dữ liệu hành vi: KiotViet, Sapo, Haravan, MISA eShop, iPOS (giá khoảng vài trăm nghìn đến vài triệu đồng/tháng, confidence low, cần xác nhận bảng giá hiện hành)."
  - "Công cụ journey map/persona: Miro, FigJam, Canva, Google Sheets/Slides (gói miễn phí hoặc vài trăm nghìn/tháng; confidence low)."
  - "Kênh tìm kiếm thông tin của khách VN: nhóm Facebook cộng đồng, review Shopee/TikTok Shop, TikTok video review, Google Maps (quán ăn, dịch vụ), Zalo; ưu tiên có mặt và quản trị đánh giá tại các nơi này."
  - "Rào cản địa phương: phí ship, ngại thanh toán online (nên hỗ trợ COD, QR chuyển khoản nhanh VietQR, ví điện tử), tin vào truyền miệng và review ảnh thật."
  - "Áp dụng bias an toàn cho SME: social proof bằng review/ảnh khách thật có sự đồng ý; scarcity bằng suất giới hạn thật (số món/ngày, slot đặt chỗ); reciprocity bằng dùng thử/topping tặng; framing bằng cách nói đúng giá trị (vd 'dưới 20 nghìn/ngày')."
  - "Pháp lý cần xác nhận hiện hành: quy định quảng cáo và khuyến mại (Luật Thương mại, Luật Quảng cáo, nghị định về khuyến mại), Luật Bảo vệ quyền lợi người tiêu dùng, quy định bảo vệ dữ liệu cá nhân (Nghị định về bảo vệ dữ liệu cá nhân), niêm yết giá. Không dùng giá gốc ảo hay tồn kho ảo."
  - "Quy tắc 80/20 cho SME: tập trung vào 1 persona chủ lực, 2-3 kênh khách thật sự dùng, sửa 1 pain point lớn nhất trước khi mở rộng."
  - "Gamification nhẹ chi phí thấp: thẻ tích điểm, bốc thăm may mắn tại quầy, mini game Zalo OA; luôn tính lại biên lợi nhuận và uplift hòa vốn."
  - "Dữ liệu thị trường (quy mô thương mại điện tử VN, hành vi Gen Z) nên lấy từ báo cáo mới nhất (e-Conomy SEA của Google/Temasek/Bain, Metric, Nielsen); không dùng số cũ cho quyết định đầu tư (confidence low)."

case_lessons:
  - name: "Shopee: hiểu và điều khiển hành vi mua sắm ĐNÁ"
    type: "success"
    setup: >
      Shopee (Sea Group) đi sau Lazada nhưng vươn lên #1 e-commerce ĐNÁ (vượt Lazada từ 2019 theo nguồn) nhờ khai thác 8 cơ chế hành vi:
      scarcity, social proof, anchoring, loss aversion, gamification, reciprocity, bandwagon, variable reward; thiết kế journey 5A trọn vẹn.
    key_calculations:
      - "Quy mô theo nguồn: GMV ~75 tỷ USD (2023, ĐNÁ); 850 triệu+ đơn trong 11.11 (2023); 30+ phút/ngày trên app; 60% mua bốc đồng (đều chưa xác thực)."
      - "Gạch giá 500K thành 199K hiển thị giảm 60% (đúng: (500-199)/500 = 60.2%)."
      - "Lợi nhuận: giảm giá đòi uplift sản lượng d/(m-d); ví dụ biên 40%, giảm 20% thì +100% sản lượng (nguyên lý giải thích vì sao 'discount addiction' khó có lãi)."
    lesson: >
      (1) Gamification tạo thói quen hàng ngày, rẻ hơn mua lại quảng cáo. (2) Cảm xúc mạnh hơn lý trí: flash sale khai thác FOMO. (3) Insight địa phương quyết định: freeship và COD gỡ rào cản số 1 ở VN/ĐNÁ.
      (4) Mega campaign (9.9, 10.10, 11.11, 12.12) thành sự kiện văn hóa, khách chờ sale. (5) Entertainment commerce (Live, Video) hợp Gen Z. Hạn chế: discount addiction, chất lượng không đồng đều, mua bốc đồng gây hối hận và trả hàng cao.
    data_reliability: "unverified"
  - name: "Spotify Wrapped: biến dữ liệu hành vi thành hiện tượng văn hóa"
    type: "success"
    setup: >
      Cuối mỗi năm Spotify tổng kết dữ liệu nghe của từng người dùng thành slide dọc cá nhân hóa, chia sẻ 1 chạm lên mạng xã hội; khai thác 3 động lực: bản sắc/tiền tệ xã hội, FOMO, hoài niệm.
    key_calculations:
      - "Quy trình 3 bước: thu thập hành vi, cá nhân hóa (nhóm tính cách nghe nhạc), tối ưu chia sẻ (1 chạm)."
      - "Kết quả theo nguồn: hàng chục triệu lượt chia sẻ tự nhiên mỗi năm; app lọt top tải về tháng 12; retention cao vì mất bản tổng kết nếu chuyển nền tảng (không kèm số cụ thể)."
    lesson: >
      Đừng bắt khách quảng cáo cho app; hãy cho khách một công cụ đẹp để họ quảng cáo cho chính họ, logo thương hiệu đi kèm như bảo chứng. Dữ liệu khô thành trải nghiệm cảm xúc khi gắn bản sắc, FOMO, hoài niệm.
    data_reliability: "unverified"
  - name: "SME Việt Nam: Shop mẹ và bé 'Bé Khỏe' (case giả định, hành vi mua và sau mua)"
    type: "sme"
    setup: >
      Shop online đồ dùng ăn dặm, Hà Nội, bán qua Shopee, Facebook và Zalo. Persona Lan (32 tuổi, working mom). Phễu tháng: Aware 10,000 người, Appeal 4,000, Ask 2,000, Act 400, Advocate 120.
      Giá trung bình đơn 300,000đ, biên gộp 40%. Ý tưởng: flash sale giảm 20%.
    key_calculations:
      - "Stage conversion: 40% / 50% / 20% / 30%; PAR = 400/10000 = 4%; BAR = 120/10000 = 1.2%."
      - "Tầng yếu nhất: Ask->Act (20%). Pain point: nhiều lựa chọn khó quyết định, lo chất lượng cho con."
      - "Flash sale giảm 20% khi biên 40% cần uplift d/(m-d) = 0.2/0.2 = +100% sản lượng (từ 400 lên 800 đơn) mới hòa vốn."
    lesson: >
      Thay vì giảm sâu, sửa Ask->Act: bộ lọc theo độ tuổi bé, chứng nhận an toàn, tư vấn Zalo, review có ảnh (social proof, authority thật), COD/freeship có điều kiện; chỉ giảm nhẹ hoặc tặng quà khi cần.
      Tăng Ask->Act từ 20% lên 25% thì Act từ 400 lên 500 mà không hy sinh biên.
    data_reliability: "illustrative"

worked_examples:
  - id: "m06_ex_funnel"
    title: "Chẩn đoán phễu 5A của shop mẹ và bé"
    situation: "Shop có số liệu tháng: Aware 10,000, Appeal 4,000, Ask 2,000, Act 400, Advocate 120. Chủ shop hỏi nên tăng quảng cáo hay làm gì khác?"
    inputs: {aware: 10000, appeal: 4000, ask: 2000, act: 400, advocate: 120}
    steps:
      - "Stage conversion: 4000/10000 = 40%; 2000/4000 = 50%; 400/2000 = 20%; 120/400 = 30%."
      - "PAR = 400/10000 = 4%; BAR = 120/10000 = 1.2%."
      - "Tầng thấp nhất: Ask->Act 20%. Giả thuyết: thiếu bằng chứng chất lượng, giá không rõ, phí ship, thanh toán."
      - "Kiểm chứng: xem chat log/lý do không chốt, phỏng vấn 5-10 khách bỏ giỏ."
      - "Hành động: review ảnh thật, chứng nhận, COD, freeship đơn từ 299k, tư vấn nhanh qua Zalo."
      - "Kỳ vọng: nếu Ask->Act lên 25% thì Act = 2000 x 0.25 = 500 (+25%)."
    result: "Không tăng Aware; ưu tiên Ask->Act. PAR hiện 4%, BAR 1.2%, mục tiêu Act 500."
  - id: "m06_ex_anchoring"
    title: "Kiểm tra neo giá trung thực và biên lợi nhuận"
    situation: "Shop định gạch giá 500,000 và bán 299,000; giá vốn 200,000; giá bán thật gần nhất 350,000."
    inputs: {p_anchor: 500000, p_sale: 299000, cost: 200000, last_price: 350000}
    steps:
      - "Giảm hiển thị: (500000-299000)/500000 = 40.2%."
      - "Giảm so với giá bán thật gần nhất: (350000-299000)/350000 = 14.6%."
      - "Biên gộp tại 299k: (299000-200000)/299000 = 33.1%."
      - "Biên gộp tại giá 350k trước đó: (350000-200000)/350000 = 42.9%."
      - "Kết luận: gạch 500k khi chưa từng bán giá đó là neo ảo, rủi ro pháp lý và mất niềm tin."
    result: "Nên neo ở 350k (giảm 14.6%) hoặc tạo combo giá trị; không dùng 500k ảo."
  - id: "m06_ex_discount_breakeven"
    title: "Flash sale có sinh lời không?"
    situation: "Quán bán hộp snack: giá 100, giá vốn 60, bán 200 hộp/tuần. Định giảm 20% trong flash sale."
    inputs: {price: 100, cost: 60, q0: 200, d: 0.2}
    steps:
      - "Biên m = (100-60)/100 = 40%."
      - "Lợi nhuận gốc: 40 x 200 = 8000."
      - "Giảm 20%: giá 80, lãi/đơn 20; nếu vẫn bán 200 hộp lãi 4000 (giảm 50%)."
      - "Uplift hòa vốn: U = 0.2/(0.4-0.2) = 100%, tức 400 hộp: lãi 20 x 400 = 8000."
      - "Cân nhắc cannibalization và pull-forward; nếu khả năng uplift chỉ +40% thì không nên giảm 20%."
    result: "Cần gấp đôi sản lượng mới hòa vốn; nếu uplift kỳ vọng thấp hơn thì chọn ưu đãi khác (combo, quà tặng)."
  - id: "m06_ex_persona_journey"
    title: "Dựng persona và journey map cho quán cà phê specialty"
    situation: "Quán cà phê specialty Q.1 muốn tăng khách Gen Z."
    steps:
      - "Phỏng vấn 8 khách trẻ, quan sát tại quán, phân tích hashtag check-in."
      - "Persona 'Minh, 24 tuổi, nhân viên văn phòng, thu nhập 12-15 triệu': mục tiêu có nơi làm việc/hẹn bạn đẹp; điểm đau chỗ ngồi/ổ cắm, giá cao; nguồn thông tin TikTok, Google Maps, bạn bè; kênh Instagram, Zalo."
      - "Maslow: cấp xã hội và tôn trọng (thuộc về cộng đồng, gu)."
      - "Journey: Aware TikTok video; Appeal ảnh không gian; Ask Google Maps review, hỏi bạn; Act ghé quán, thanh toán QR; Advocate check-in, tag quán."
      - "Pain point: chờ chỗ giờ cao điểm; moment of delight: barista nhớ tên và món."
      - "Hành động: đặt chỗ trước qua Zalo, thẻ tích điểm, góc check-in có hashtag, 'Coffee Wrapped' cuối năm."
    result: "Persona 1, journey map 5A có pain point và 4 hành động có KPI (tỷ lệ tag, lượt đặt chỗ, retention)."

practice_questions:
  - q: "Phân biệt mô hình 5 giai đoạn mua của Kotler và 5A? Khi nào dùng cái nào?"
    a: "5 giai đoạn mô tả quy trình ra quyết định cá nhân (nhận biết vấn đề, tìm thông tin, đánh giá, mua, sau mua). 5A (Aware-Appeal-Ask-Act-Advocate) mô tả hành trình thương hiệu-khách hàng thời kết nối, có vòng Ask (tham vấn cộng đồng) và Advocate (khách thành người giới thiệu). Dùng 5 giai đoạn để hiểu tâm lý quyết định; 5A để đo và quản trị phễu marketing số."
  - q: "Phễu: Aware 8,000, Appeal 2,400, Ask 1,200, Act 180, Advocate 36. Tính stage conversion, PAR, BAR và chỉ ra điểm yếu."
    a: "Aware->Appeal 30%; Appeal->Ask 50%; Ask->Act 15%; Act->Advocate 20%; PAR = 180/8000 = 2.25%; BAR = 36/8000 = 0.45%. Điểm yếu: Ask->Act 15% (chốt đơn) và Act->Advocate 20%."
  - q: "Giảm giá 15% khi biên gộp 35%: cần tăng sản lượng bao nhiêu để hòa vốn?"
    a: "U = 0.15/(0.35-0.15) = 0.75, tức +75%."
  - q: "Vì sao 'Chỉ còn 3 sản phẩm' có thể phản tác dụng?"
    a: "Nếu không thật sẽ bị khách phát hiện, mất niềm tin và vi phạm quy định; ngay cả khi thật, thúc mua bốc đồng gây hối hận sau mua, tăng trả hàng. Chỉ dùng scarcity với bằng chứng thật và có chính sách đổi trả rõ."
  - q: "Gạch giá 500K giảm còn 299K: % giảm hiển thị? Vấn đề trung thực nếu giá bán thật trước đó là 350K?"
    a: "Hiển thị 40.2%. Giảm thực chỉ 14.6%, nên giá gốc 500K là neo ảo, rủi ro pháp lý và mất niềm tin."
  - q: "Mỗi cấp Maslow gợi ý lời hứa thương hiệu gì? Cho ví dụ một SME."
    a: "Sinh lý: giá rẻ mỗi ngày (quán cơm bình dân); an toàn: yên tâm cho gia đình (thực phẩm sạch, bảo hiểm); xã hội: cộng đồng, thuộc về (quán cà phê cộng đồng); tôn trọng: địa vị, gu (thời trang cao cấp); tự thực hiện: phát triển bản thân (khóa học). SME chọn 1-2 cấp chủ đạo phù hợp persona."
  - q: "Spotify Wrapped khai thác 3 động lực tâm lý nào? Áp dụng cho một quán cà phê có app tích điểm."
    a: "Bản sắc/tiền tệ xã hội, FOMO/bầy đàn, hoài niệm. Quán gửi 'Coffee Wrapped' cuối năm: món yêu thích, số lần ghé, danh hiệu vui, nút chia sẻ một chạm kèm voucher mời bạn; chỉ dùng dữ liệu đã được khách đồng ý."
  - q: "Rủi ro chính của chiến lược khuyến mãi kiểu Shopee với SME?"
    a: "Discount addiction (khách chỉ mua khi sale), biên mỏng (cần uplift d/(m-d)), mua bốc đồng gây trả hàng, không đủ ngân sách trợ giá. SME nên dùng gamification nhẹ, giá trị cộng thêm và loyalty thay vì đua giá."

checklist:
  - "Đã xác định rõ sản phẩm, khách mục tiêu và vấn đề kinh doanh cần giải?"
  - "Persona dựa trên dữ liệu/phỏng vấn thật (không bịa), có đủ 6 mục?"
  - "Đã dựng 5 giai đoạn mua và 5A cho persona, có hành động, câu hỏi, nguồn thông tin, rào cản?"
  - "Đã xét 4 nhóm yếu tố ảnh hưởng (văn hóa, xã hội, cá nhân, tâm lý) và cấp Maslow chi phối?"
  - "Journey map có touchpoints, cảm xúc, pain points, moments of delight, chủ sở hữu?"
  - "Đã tính stage conversion, PAR, BAR và xác định tầng rò rỉ?"
  - "Bias được dùng dựa trên bằng chứng thật, không giả mạo tồn kho/giá/số lượng?"
  - "Đã tính hòa vốn khuyến mãi (m06_breakeven_uplift) và xét cannibalization/pull-forward?"
  - "Có kế hoạch cho hành vi sau mua (xác nhận, hậu mãi, đổi trả, xin review)?"
  - "Đã xét rủi ro discount addiction, mua bốc đồng, trả hàng?"
  - "Tuân thủ quy định quảng cáo/khuyến mại/bảo vệ người tiêu dùng/dữ liệu cá nhân (đã xác nhận hiện hành)?"
  - "Có A/B test, KPI và thời gian đo lại?"
  - "Số liệu minh họa gắn rõ nguồn/độ tin cậy; không dùng số thị trường chưa xác thực làm căn cứ quyết định?"

excel_google_sheets_templates:
  - "Sheet 'Funnel 5A': cột Giai đoạn, Số khách, Stage conversion (=C3/C2), PAR (=Act/Aware), BAR (=Advocate/Aware), ghi chú nguyên nhân."
  - "Sheet 'Journey map': hàng = giai đoạn, cột = Touchpoint, Hành động khách, Cảm xúc (-2..+2), Pain point, Moment of delight, Giải pháp, Owner, KPI."
  - "Sheet 'Persona': 6 mục (Demographics, Goals, Pain Points, Moment of Delight, Information Sources, Preferred Channels) + nguồn dữ liệu + ngày cập nhật."
  - "Sheet 'Bias checklist': 8 bias x điểm chạm áp dụng x bằng chứng thật x rủi ro đạo đức/pháp lý."
  - "Sheet 'Kinh tế khuyến mãi': giá, giá vốn, biên, mức giảm, uplift hòa vốn (=d/(m-d)), uplift kỳ vọng, lãi dự kiến."
  - "Sheet 'Hậu mãi': return rate, rating trung bình, tỷ lệ review, số lượt giới thiệu theo tháng."

