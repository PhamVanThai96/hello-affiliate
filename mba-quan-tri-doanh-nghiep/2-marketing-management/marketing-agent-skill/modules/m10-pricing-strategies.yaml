source_issues_noted:
  - "Bảng Price Elasticity bị vỡ định dạng (3 hàng tách thành 3 bảng riêng, có ký tự '|' trong |Ep|); nội dung đúng: |Ep|>1 co giãn, <1 không co giãn, =1 đơn vị."
  - "Case khóa học: 'tiết kiệm 40%' của 1.499k/năm so với 199k/tháng sai; tính lại 37,2% (199k x 12 = 2.388k)."
  - "Case khóa học: dùng 199k/tháng ở mục 2.1 nhưng 299k/tháng ở ví dụ decoy 2.3; không nhất quán giữa hai kịch bản (là hai ví dụ độc lập)."
  - "Mục 5 (Apple): câu 'Apple KHÔNG BẰNG định giá theo chi phí' là lỗi viết (nên là 'KHÔNG định giá theo chi phí'). Claim '85%+ lợi nhuận toàn ngành smartphone' và resale 60-70% vs 30-40%, Radiohead (6 USD/3 triệu download), conversion Spotify/Dropbox ~4%, Amazon 2,5 triệu lần/ngày là chưa kiểm chứng."
  - "'Rule of 100' trong nguồn ví dụ 80.000đ gọi là 'dưới 100'; quy tắc gốc theo USD (ngưỡng 100 USD), áp dụng cho VND không nên dùng ngưỡng 100 mà phải điều chỉnh/kiểm thử."
  - "Mục 'Quy trình định giá' trong nguồn lặp 2 lần (7 bước ở III và 4 bước ở VI) và có đoạn văn nói với chủ sở hữu ('Tôi đã chuẩn bị...') không phải nội dung kiến thức; module gộp thành quy trình chuẩn."
  - "Early bird trong khóa live: VIP early bird 3.499k chỉ cao hơn Standard 2.999k +16,7%, rủi ro cannibalization (nguồn không cảnh báo)."
  - "Một số trích dẫn kiểu [1, 2, 3] và liên kết Markdown lẫn trong mục Skimming (lỗi sao chép), không ảnh hưởng nội dung."
  - "Zoom Pro ghi 13,33 USD/tháng, Spotify Individual 10,99, Netflix 15,49: giá US có thể đã thay đổi; confidence low."
