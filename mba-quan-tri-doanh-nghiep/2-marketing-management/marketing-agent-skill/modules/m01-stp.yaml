source_notes:
  - "Nguồn không có LaTeX công thức; các công thức m01_* là tổng hợp từ các công cụ trong nguồn (chấm điểm có trọng số) và bổ sung chuẩn sizing để agent tính được."
  - "Lỗi/mâu thuẫn nguồn: (1) 'Volvo ... airbag phía' gõ sai; (2) perceptual map Volvo/Mercedes/BMW nhãn trục 'chất lượng cao/thấp' x 'giá thấp/cao' vẽ tay, chỉ minh họa; (3) giá Biti's Hunter: ghi 600-900k, khoảng trống 600k-1 triệu, ví dụ 700k/đôi - không nhất quán; (4) mục IX đánh số lại '## 1, 2, 3' trùng cấp với mục chính; (5) Sơn Tùng M-TP, Soobin gọi là KOL 'Indie/Underground' không chính xác (nghệ sĩ đại chúng); trình tự MV 'Lạc Trôi' và chiến dịch Đi để trở về không rõ ràng; (6) Spotify 'chưa lãi bền vững mới lãi Q3-Q4/2023', '600M+ users' vs 'MAU 615M+', % user 40/25/15/10/10 là ước tính; (7) Old Spice '+125%' không nêu kỳ; (8) '5 chiến lược targeting' gồm micromarketing và custom chồng lấn nhau; (9) nguồn viết Wendell Smith 1956 cho phân khúc và Ries-Trout 1981 cho positioning (khái niệm positioning xuất hiện từ 1969-72)."
