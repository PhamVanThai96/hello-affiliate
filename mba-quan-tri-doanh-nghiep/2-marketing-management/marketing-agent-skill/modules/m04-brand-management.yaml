# m04 - Quản trị thương hiệu (distill từ 04-brand-management.md)
id: "m04"
name_vi: "Quản trị thương hiệu"
name_en: "Brand Management"
purpose: >
  Hiểu bản chất thương hiệu (lời hứa được thực hiện nhất quán), xây dựng brand từ audit đến identity, truyền thông, trải nghiệm,
  đo lường và bảo vệ; đánh giá sức khỏe thương hiệu bằng Brand Equity (Keller CBBE, Aaker) và bộ chỉ số (awareness, NPS, sentiment,
  share of voice, brand premium, brand search); chọn kiến trúc thương hiệu và quyết định mở rộng/làm mới (rebrand) để tạo lợi thế
  cạnh tranh bền vững (premium pricing, loyalty, bargaining power).
when_to_use:
  - "Chủ SME hỏi 'xây thương hiệu từ đâu?', 'logo/tên/slogan có quan trọng không?', 'làm sao để bán giá cao hơn đối thủ?'"
  - "Cần đánh giá sức khỏe thương hiệu hiện tại (brand audit, brand equity, brand tracking)."
  - "Cần thiết kế brand identity (tên, logo, tagline, màu, font, tone of voice, personality, values, story) và brand guidelines."
  - "Cần chọn kiến trúc thương hiệu khi ra sản phẩm/dòng mới (Branded House, House of Brands, Endorsed, Hybrid) hoặc mở rộng thương hiệu (brand extension)."
  - "Cân nhắc rebrand/refresh vì brand bị 'già', muốn chạm Gen Z, hoặc đổi định vị."
  - "Cần chọn/diễn giải KPI thương hiệu: top-of-mind, aided recall, NPS, sentiment, share of voice, brand search volume, brand premium."
  - "Ứng phó khủng hoảng truyền thông, bảo hộ nhãn hiệu, giữ nhất quán các touchpoint."
  - "Muốn biện minh/đo ROI đầu tư brand (khó quy ra tiền) hoặc ước lượng giá trị thương hiệu."
prerequisites:
  - "m01 - STP: định vị (positioning) là đầu vào của brand strategy"
related_modules:
  - "m01 - STP: Positioning statement, personality, brand strategy phải khớp phân khúc mục tiêu"
  - "m02 - Marketing Mix 4P/7P: brand thể hiện qua product, price (premium), place, promotion; 7P (people, process, physical evidence) là các touchpoint trải nghiệm"
  - "m03 - Customer Lifetime Value: loyalty/retention/NPS của brand tăng CLV, giảm CAC"
  - "m05 - Digital marketing và Growth hacking: kênh xây awareness, social listening, brand search"
  - "m06 - Hành vi người tiêu dùng: nhận biết, cảm xúc, trung thành, ảnh hưởng mua"
  - "m07 - Nghiên cứu thị trường: khảo sát awareness, perception map, brand tracking"
  - "m08 - IMC: truyền thông nhất quán đa kênh cho brand"
  - "m09 - Vòng đời sản phẩm: brand aging và làm mới khi chín muồi/suy thoái"
  - "m10 - Chiến lược giá: brand premium, price-quality perception"
  - "Chiến lược 1-strategic (02 VRIO): brand là nguồn lợi thế khó bắt chước (Inimitable)"

concepts:
  - term_vi: "Thương hiệu"
    term_en: "Brand"
    definition: >
      Định nghĩa AMA: tên, thuật ngữ, ký hiệu, thiết kế hoặc sự kết hợp nhằm nhận diện hàng hóa/dịch vụ của một nhà cung cấp và phân biệt với đối thủ.
      Hiện đại: 'a brand is a promise delivered consistently' (lời hứa được thực hiện nhất quán); Jeff Bezos: 'brand là điều người ta nói về bạn khi bạn không có mặt'.
    why_it_matters: >
      Định nghĩa AMA chỉ nói về dấu hiệu nhận diện (logo, tên); định nghĩa hiện đại nhấn mạnh brand tồn tại trong đầu khách hàng và được tạo bởi
      trải nghiệm lặp lại. Vì vậy đổi logo không làm đổi brand; chỉ thay đổi hành vi/trải nghiệm nhất quán mới đổi nhận thức.
  - term_vi: "Quản trị thương hiệu"
    term_en: "Brand Management"
    definition: "Quá trình xây dựng, duy trì và phát triển giá trị thương hiệu để tạo lợi thế cạnh tranh bền vững."
    why_it_matters: "Brand là tài sản vô hình cần quản trị như tài sản: đầu tư dài hạn (5-10 năm), đo lường định kỳ, bảo vệ pháp lý và uy tín."
  - term_vi: "Tài sản thương hiệu"
    term_en: "Brand Equity"
    definition: "Giá trị tăng thêm mà thương hiệu mang lại cho sản phẩm/dịch vụ so với sản phẩm tương tự không có thương hiệu (generic)."
    why_it_matters: >
      Giải thích vì sao hai sản phẩm giống hệt về chức năng có giá, doanh số, độ trung thành khác nhau. Có hai góc nhìn: dựa trên khách hàng
      (Keller CBBE, Aaker: nhận thức/niềm tin trong đầu khách) và dựa trên tài chính (giá trị quy ra tiền, vd Brand Finance).
  - term_vi: "Mức độ nhận biết (Brand Salience / Awareness)"
    term_en: "Brand Salience / Awareness"
    definition: "Khả năng khách hàng nhận ra (recognition) hoặc nhớ ra (recall) brand trong tình huống mua. Top-of-mind = brand nêu đầu tiên không gợi ý; Aided recall = nhớ khi được gợi ý."
    why_it_matters: "Đây là nền kim tự tháp CBBE: không được nghĩ đến thì không được cân nhắc. Với SME, thường là điểm nghẽn đầu tiên."
  - term_vi: "Chất lượng cảm nhận"
    term_en: "Perceived Quality"
    definition: "Đánh giá của khách về chất lượng/ưu việt tổng thể của brand (không nhất thiết bằng chất lượng kỹ thuật thật)."
    why_it_matters: "Là nền của premium pricing: khách trả cao hơn khi tin chất lượng cao hơn; đồng thời là cái bị phá nhanh nhất bởi scandal."
  - term_vi: "Liên tưởng thương hiệu"
    term_en: "Brand Associations"
    definition: "Mọi thứ nối trong trí nhớ khách với brand (thuộc tính, cảm xúc, giá trị, người dùng, nguồn gốc)."
    why_it_matters: "Liên tưởng độc đáo, mạnh, được ưa chuộng chính là định vị; đo bằng association map/perception map."
  - term_vi: "Lòng trung thành thương hiệu"
    term_en: "Brand Loyalty"
    definition: "Xu hướng mua lặp lại và gắn bó với brand bất chấp đối thủ khuyến mại. Đo bằng repeat rate, NPS, churn rate."
    why_it_matters: "Giữ khách rẻ hơn tìm khách mới; loyalty tăng CLV và là lớp bảo vệ khi đối thủ giảm giá."
  - term_vi: "Cộng hưởng thương hiệu"
    term_en: "Brand Resonance"
    definition: "Đỉnh kim tự tháp CBBE: khách có quan hệ gắn kết sâu ('tôi và brand là một'): loyalty hành vi, gắn bó thái độ, cộng đồng, chủ động quảng bá."
    why_it_matters: "Là đích của toàn bộ chuỗi xây dựng brand; chỉ đạt được khi đủ 3 tầng dưới."
  - term_vi: "Hệ thống nhận diện thương hiệu"
    term_en: "Brand Identity System"
    definition: "Bộ yếu tố hữu hình/vô hình: tên, logo, tagline, màu, typography, tone of voice, personality, values, story."
    why_it_matters: "Nhất quán nhận diện giúp mọi touchpoint cùng 'nói một giọng', tăng khả năng nhớ; ghi thành brand guidelines để nhiều người/agency làm việc đồng nhất."
  - term_vi: "Kiến trúc thương hiệu"
    term_en: "Brand Architecture"
    definition: "Cách tổ chức quan hệ giữa master brand và các sub-brand/sản phẩm: Branded House, House of Brands, Endorsed, Hybrid."
    why_it_matters: "Quyết định brand tận dụng uy tín chung hay tách rủi ro; sai kiến trúc làm loãng ý nghĩa hoặc đốt tiền xây nhiều brand riêng."
  - term_vi: "Mở rộng thương hiệu"
    term_en: "Brand Extension / Over-extension"
    definition: "Dùng brand hiện có cho sản phẩm/ngành mới. Mở rộng quá đà (over-extension) làm loãng ý nghĩa cốt lõi."
    why_it_matters: "Tận dụng awareness sẵn có tiết kiệm chi phí, nhưng nếu sản phẩm mới không 'vừa' với liên tưởng cốt lõi thì kéo tụt brand."
  - term_vi: "Làm mới / tái định vị thương hiệu"
    term_en: "Rebranding / Brand Refresh"
    definition: "Thay đổi nhận diện (logo, màu, tagline) và/hoặc định vị, đối tượng để tránh 'brand aging' (Kodak, Nokia)."
    why_it_matters: "Brand cần tiến hóa theo thế hệ khách hàng mới, nhưng rebrand có rủi ro mất khách cũ; cần change management và giữ mối liên hệ với lõi (core brand)."
  - term_vi: "Lợi thế cạnh tranh bền vững từ brand"
    term_en: "Brand as competitive moat (VRIO - Inimitable)"
    definition: "Brand mạnh khó sao chép vì dựa trên lịch sử, trải nghiệm tích lũy, niềm tin trong tâm trí khách."
    why_it_matters: "Đối thủ copy được sản phẩm/giá nhưng không copy được ký ức và niềm tin; đây là lý do đầu tư brand dù ROI khó đo."
  - term_vi: "Điểm tiếp xúc"
    term_en: "Touchpoint"
    definition: "Mọi điểm khách tiếp xúc với brand: quảng cáo, bao bì, nhân viên, cửa hàng, website, social, chăm sóc sau bán."
    why_it_matters: "Brand = tổng trải nghiệm các touchpoint; một touchpoint tệ phá lời hứa của tất cả touchpoint còn lại."

formulas:
  - id: "m04_nps"
    name_vi: "Chỉ số khuyến nghị ròng"
    name_en: "Net Promoter Score (NPS)"
    expression_latex: 'NPS = \%Promoters - \%Detractors'
    expression_python: "(promoters - detractors) / total_respondents * 100"
    excel: "=(COUNTIF(rng,\">=9\")-COUNTIF(rng,\"<=6\"))/COUNT(rng)*100"
    variables:
      - {symbol: "promoters", meaning: "Số người chấm 9-10 cho câu 'Mức độ sẵn sàng giới thiệu brand cho bạn bè (0-10)?'", unit: "người"}
      - {symbol: "detractors", meaning: "Số người chấm 0-6", unit: "người"}
      - {symbol: "total_respondents", meaning: "Tổng người trả lời (gồm cả passives 7-8, bị bỏ ra khỏi tử số)", unit: "người"}
    when_to_use: "Đo loyalty/mức sẵn sàng truyền miệng; theo dõi theo quý hoặc sau mỗi thay đổi lớn."
    why_it_works: >
      Giới thiệu bạn bè là hành vi có rủi ro uy tín cá nhân nên phản ánh sự tin tưởng thật hơn điểm hài lòng thông thường (Fred Reichheld, Bain, 2003).
      Trừ detractors khỏi promoters vì người chê tích cực làm hỏng tăng trưởng, và passives (7-8) dễ bị đối thủ cuốn đi nên không tính.
    assumptions:
      - "Mẫu đủ lớn và đại diện (tối thiểu vài chục câu trả lời mỗi kỳ để tránh nhiễu)."
      - "Hỏi cùng thang đo, cùng thời điểm trải nghiệm giữa các kỳ."
    pitfalls:
      - "Biểu diễn thang -100 đến +100, KHÔNG phải %; tránh ghi '50%'."
      - "Chỉ hỏi khách đã mua cuối cùng sẽ bị lệch tích cực; nên hỏi cả khách rời bỏ."
      - "Ngưỡng NPS rất khác theo ngành; so sánh với đối thủ cùng ngành."
    interpretation: "Nguồn gốc benchmark: NPS > 50 = Excellent (nguồn tài liệu); 0-30 tạm ổn; < 0 báo động (nhiều người chê hơn khen). Chỉ nên đọc cùng lý do (câu hỏi mở)."
    example:
      inputs: {promoters: 90, detractors: 40, total_respondents: 200}
      steps:
        - "Passives = 200 - 90 - 40 = 70 (không tính)"
        - "%Promoters = 90/200 = 45%; %Detractors = 40/200 = 20%"
        - "NPS = 45 - 20 = 25"
      result: "NPS = 25 (tốt khá, chưa Excellent >50; cần chuyển bớt passives và xử lý nguyên nhân detractors)"
  - id: "m04_brand_premium"
    name_vi: "Phần giá cao thương hiệu"
    name_en: "Brand Premium (%)"
    expression_latex: 'Premium\% = \frac{P_{brand} - P_{generic}}{P_{generic}} \times 100'
    expression_python: "(price_brand - price_generic) / price_generic * 100"
    excel: "=(B2-B3)/B3*100"
    variables:
      - {symbol: "price_brand", meaning: "Giá bán của sản phẩm mang thương hiệu (khách vẫn mua)", unit: "VNĐ"}
      - {symbol: "price_generic", meaning: "Giá sản phẩm tương đương chức năng không thương hiệu/thương hiệu trung bình ngành", unit: "VNĐ"}
    when_to_use: "Lượng hóa Brand Equity theo giá: khách trả hơn bao nhiêu % vì brand; biện minh đầu tư brand."
    why_it_works: "Brand Equity được định nghĩa là giá trị tăng thêm so với sản phẩm không thương hiệu; phần chênh giá khách chấp nhận chi trả là cách đo trực tiếp nhất."
    assumptions:
      - "Sản phẩm so sánh tương đương về chức năng; khác biệt giá chủ yếu do brand."
      - "Khách thực sự mua ở mức giá đó (premium khảo sát ý định thường cao hơn thực tế)."
    pitfalls:
      - "Nhầm brand premium với phần giá cao do chi phí/chất lượng thật hơn."
      - "Dùng giá niêm yết thay vì giá thực bán sau khuyến mại."
      - "Benchmark phụ thuộc ngành: nguồn không cho ngưỡng cụ thể."
    interpretation: "Càng cao càng thể hiện brand mạnh, nhưng phải đi kèm doanh số; premium cao mà volume sụt thì brand chưa thực sự được chấp nhận."
    example:
      inputs: {price_brand: 45000, price_generic: 30000}
      steps: ["Chênh giá = 45000 - 30000 = 15000", "Premium = 15000/30000 = 50%"]
      result: "Brand Premium = 50%"
  - id: "m04_premium_value"
    name_vi: "Giá trị tăng thêm hằng năm từ brand premium"
    name_en: "Annual Revenue Uplift from Brand Premium"
    expression_latex: 'Uplift = (P_{brand} - P_{generic}) \times Q'
    expression_python: "(price_brand - price_generic) * quantity"
    excel: "=(B2-B3)*B4"
    variables:
      - {symbol: "price_brand", meaning: "Giá bán thực tế sản phẩm thương hiệu", unit: "VNĐ/đơn vị"}
      - {symbol: "price_generic", meaning: "Giá sản phẩm tương đương không brand", unit: "VNĐ/đơn vị"}
      - {symbol: "quantity", meaning: "Số đơn vị bán trong kỳ", unit: "đơn vị/năm"}
    when_to_use: "Quy brand equity thành tiền thô (doanh thu tăng thêm) để so với chi phí đầu tư brand."
    why_it_works: "Nếu cùng sản phẩm mà không có brand chỉ bán được giá generic thì phần chênh x sản lượng là dòng giá trị do brand tạo ra."
    assumptions: ["Giữ nguyên sản lượng nếu bỏ brand là giả định tối giản; thực tế bỏ brand sản lượng thường giảm nên đây là cận dưới."]
    pitfalls: ["Là doanh thu tăng thêm, chưa phải lợi nhuận (cần trừ chi phí đầu tư brand và chi phí biến đổi)."]
    interpretation: "So với tổng chi phí brand hằng năm (marketing, thiết kế, bảo hộ) để ước ROI sơ bộ."
    example:
      inputs: {price_brand: 45000, price_generic: 30000, quantity: 24000}
      steps: ["Chênh giá = 15,000", "Uplift = 15,000 x 24,000 = 360,000,000"]
      result: "360 triệu VNĐ/năm giá trị tăng thêm từ brand premium"
  - id: "m04_share_of_voice"
    name_vi: "Thị phần tiếng nói"
    name_en: "Share of Voice (SOV)"
    expression_latex: 'SOV\% = \frac{M_{brand}}{M_{category}} \times 100'
    expression_python: "brand_mentions / category_mentions * 100"
    excel: "=B2/B3*100"
    variables:
      - {symbol: "brand_mentions", meaning: "Số lượt nhắc brand (social listening) hoặc chi tiêu quảng cáo của brand", unit: "lượt hoặc VNĐ"}
      - {symbol: "category_mentions", meaning: "Tổng lượt nhắc/chi tiêu của toàn bộ đối thủ trong ngành (gồm brand)", unit: "cùng đơn vị"}
    when_to_use: "Đo mức hiện diện so với đối thủ; so sánh với thị phần để biết đang 'to tiếng' đủ chưa."
    why_it_works: "Khách chỉ chọn brand mà họ nhớ; chiếm phần lớn tiếng nói trong ngành thường kéo theo tăng thị phần về sau. Nguồn đặt benchmark SOV > Market share."
    assumptions: ["Định nghĩa 'ngành' và danh sách đối thủ giữ ổn định giữa các kỳ."]
    pitfalls: ["Mentions chưa lọc spam/bot; nên dùng cùng nền tảng đo cho brand và đối thủ.", "Nguồn dùng SOV theo mentions; tài liệu chuyên ngành thường dùng SOV theo ngân sách quảng cáo - ghi rõ định nghĩa khi báo cáo."]
    interpretation: "SOV > Market share (ESOV dương) = đang đầu tư nhận diện đủ để tăng trưởng; SOV < Market share = có nguy cơ mất thị phần."
    example:
      inputs: {brand_mentions: 120, category_mentions: 600}
      steps: ["SOV = 120/600 = 20%"]
      result: "SOV = 20%"
  - id: "m04_excess_sov"
    name_vi: "Chênh lệch tiếng nói so với thị phần"
    name_en: "Excess Share of Voice (ESOV)"
    expression_latex: 'ESOV = SOV\% - MarketShare\%'
    expression_python: "sov_pct - market_share_pct"
    excel: "=B2-B3"
    variables:
      - {symbol: "sov_pct", meaning: "Share of voice của brand", unit: "%"}
      - {symbol: "market_share_pct", meaning: "Thị phần (theo doanh thu hoặc sản lượng)", unit: "%"}
    when_to_use: "Kiểm tra benchmark 'SOV > Market share' bằng một con số."
    why_it_works: "Chuyển so sánh định tính thành điểm chênh (percentage points) để theo dõi theo kỳ; thuật ngữ ESOV phổ biến trong ngành quảng cáo (không có trong nguồn)."
    assumptions: ["SOV và thị phần cùng phạm vi thị trường, cùng kỳ."]
    pitfalls: ["Lệch phạm vi (SOV toàn quốc, thị phần theo quận)."]
    interpretation: "ESOV > 0: dư địa tăng trưởng; ESOV ~ 0: giữ nguyên; ESOV < 0: đang yếu hơn quy mô."
    example:
      inputs: {sov_pct: 20, market_share_pct: 12}
      steps: ["ESOV = 20 - 12 = 8 điểm %"]
      result: "ESOV = +8 điểm %"
  - id: "m04_sentiment"
    name_vi: "Tỷ lệ cảm xúc tích cực"
    name_en: "Brand Sentiment (% Positive)"
    expression_latex: 'Sentiment\% = \frac{N_{pos}}{N_{pos}+N_{neu}+N_{neg}} \times 100'
    expression_python: "positive / (positive + neutral + negative) * 100"
    excel: "=B2/SUM(B2:B4)*100"
    variables:
      - {symbol: "positive", meaning: "Số lượt nhắc tích cực (social listening)", unit: "lượt"}
      - {symbol: "neutral", meaning: "Số lượt nhắc trung tính", unit: "lượt"}
      - {symbol: "negative", meaning: "Số lượt nhắc tiêu cực", unit: "lượt"}
    when_to_use: "Theo dõi cảm xúc cộng đồng quanh brand, đặc biệt sau chiến dịch hoặc khủng hoảng."
    why_it_works: "Quy mô nhắc tên (SOV) không đủ; nhắc nhiều nhưng tiêu cực là rủi ro, nên cần đo thêm tính chất của lượt nhắc."
    assumptions: ["Công cụ phân loại cảm xúc xử lý được tiếng Việt (có sai số, nhất là mỉa mai/teencode)."]
    pitfalls: ["Công cụ tự động phân loại sai tiếng Việt; lấy mẫu kiểm tra thủ công.", "Dùng cả negative sentiment tăng đột biến làm tín hiệu cảnh báo, không chỉ % chung."]
    interpretation: "Benchmark nguồn: > 70% positive là tốt; xem cùng xu hướng theo tuần."
    example:
      inputs: {positive: 140, neutral: 40, negative: 20}
      steps: ["Tổng = 200", "Positive = 140/200 = 70%"]
      result: "Sentiment = 70% (đúng ngưỡng 70%)"
  - id: "m04_top_of_mind"
    name_vi: "Tỷ lệ nhận biết"
    name_en: "Brand Awareness Rate (Top-of-mind / Aided)"
    expression_latex: 'Awareness\% = \frac{N_{named}}{N_{sample}} \times 100'
    expression_python: "named / sample * 100"
    excel: "=B2/B3*100"
    variables:
      - {symbol: "named", meaning: "Số người nêu tên brand đầu tiên (top-of-mind) hoặc nhận ra khi được gợi ý (aided)", unit: "người"}
      - {symbol: "sample", meaning: "Cỡ mẫu khảo sát thuộc nhóm khách mục tiêu", unit: "người"}
    when_to_use: "Đo tầng Salience của CBBE/Brand Awareness của Aaker bằng khảo sát: 'Kể tên các brand trong ngành X?'."
    why_it_works: "Top-of-mind phản ánh brand nằm đầu hàng đợi lựa chọn; aided recall cho biết mức nhận ra khi thấy logo/tên."
    assumptions: ["Mẫu thuộc đúng nhóm khách mục tiêu và đủ lớn (không chỉ người quen)."]
    pitfalls: ["Hỏi người quen/follower fanpage làm số quá cao; khảo sát cùng một cách ở mỗi kỳ."]
    interpretation: "Benchmark nguồn: top-of-mind > 20% là mức tham chiếu. SME địa phương đo trong bán kính khu vực phục vụ, không đo toàn quốc."
    example:
      inputs: {named: 52, sample: 200}
      steps: ["52/200 = 26%"]
      result: "Top-of-mind = 26% (> 20%)"
  - id: "m04_repeat_rate"
    name_vi: "Tỷ lệ mua lặp lại"
    name_en: "Repeat Purchase Rate"
    expression_latex: 'Repeat\% = \frac{N_{repeat}}{N_{customers}} \times 100'
    expression_python: "repeat_customers / total_customers * 100"
    excel: "=B2/B3*100"
    variables:
      - {symbol: "repeat_customers", meaning: "Số khách mua từ 2 lần trở lên trong kỳ", unit: "khách"}
      - {symbol: "total_customers", meaning: "Tổng số khách mua trong kỳ", unit: "khách"}
    when_to_use: "Đo loyalty hành vi (Aaker liệt kê repeat rate cùng NPS, churn)."
    why_it_works: "Hành vi mua lại thật khó giả hơn lời nói; bổ sung cho NPS (thái độ)."
    assumptions: ["Nhận diện được khách qua SĐT/thẻ thành viên/POS."]
    pitfalls: ["Chu kỳ mua khác nhau theo ngành (cà phê hằng tuần vs nội thất nhiều năm): chọn kỳ phù hợp."]
    interpretation: "Tăng theo quý = loyalty cải thiện; nếu thấp ở khách mới thì tập trung onboarding và trải nghiệm."
    example:
      inputs: {repeat_customers: 480, total_customers: 1200}
      steps: ["480/1200 = 40%"]
      result: "Repeat rate = 40%"
  - id: "m04_brand_search_growth"
    name_vi: "Tăng trưởng lượng tìm kiếm thương hiệu theo quý"
    name_en: "Brand Search Volume Growth QoQ"
    expression_latex: 'g_{QoQ} = \frac{V_t - V_{t-1}}{V_{t-1}} \times 100'
    expression_python: "(volume_now - volume_prev) / volume_prev * 100"
    excel: "=(B2-B3)/B3*100"
    variables:
      - {symbol: "volume_now", meaning: "Lượt tìm kiếm tên brand quý này (Google Trends, Search Console, SEO tools)", unit: "lượt"}
      - {symbol: "volume_prev", meaning: "Lượt tìm kiếm tên brand quý trước", unit: "lượt"}
    when_to_use: "Chỉ báo nhanh, rẻ về mức quan tâm chủ động của khách (benchmark nguồn: tăng trưởng QoQ)."
    why_it_works: "Người gõ tên brand vào Google là người đã biết và quan tâm; tăng trưởng phản ánh hiệu ứng tích lũy của truyền thông."
    assumptions: ["Loại bỏ biến thể tên thương hiệu trùng nghĩa từ phổ thông."]
    pitfalls: ["Mùa vụ (Tết, hè) làm QoQ sai lệch; so cùng kỳ năm trước cho ngành mùa vụ.", "Google Trends cho chỉ số tương đối (0-100), không phải số tuyệt đối."]
    interpretation: "Dương = awareness/interest tăng; dùng cùng SOV, sentiment để kết luận."
    example:
      inputs: {volume_now: 1380, volume_prev: 1200}
      steps: ["(1380-1200)/1200 = 15%"]
      result: "+15% QoQ"
  - id: "m04_relief_from_royalty"
    name_vi: "Định giá thương hiệu theo phương pháp tiết kiệm phí bản quyền (bổ sung)"
    name_en: "Relief-from-Royalty Brand Valuation (simplified perpetuity)"
    expression_latex: 'V = \frac{Rev \times roy \times (1-t)}{r - g}'
    expression_python: "revenue * royalty_rate * (1 - tax_rate) / (discount_rate - growth)"
    excel: "=B2*B3*(1-B4)/(B5-B6)"
    variables:
      - {symbol: "revenue", meaning: "Doanh thu năm gắn brand", unit: "VNĐ"}
      - {symbol: "royalty_rate", meaning: "Tỷ lệ phí bản quyền ước tính nếu phải đi thuê brand tương đương (theo giao dịch license thị trường/ngành)", unit: "tỷ lệ 0-1"}
      - {symbol: "tax_rate", meaning: "Thuế suất TNDN", unit: "tỷ lệ 0-1"}
      - {symbol: "discount_rate", meaning: "Tỷ suất chiết khấu phản ánh rủi ro brand", unit: "tỷ lệ 0-1"}
      - {symbol: "growth", meaning: "Tăng trưởng dài hạn của dòng royalty (< discount_rate)", unit: "tỷ lệ 0-1"}
    when_to_use: "Tham khảo thêm cho góc nhìn tài chính (nguồn chỉ nói brand value của Brand Finance mà không nêu công thức). Dùng cho M&A, nhượng quyền, gọi vốn."
    why_it_works: "Giá trị brand = hiện giá khoản phí bản quyền mà chủ sở hữu tiết kiệm được nhờ sở hữu thay vì đi thuê (cách tiếp cận phổ biến trong định giá nhãn hiệu); công thức dòng tiền vĩnh viễn tăng trưởng g."
    assumptions: ["Ngoài nguồn gốc tài liệu. Royalty rate ước tính đáng tin cậy chỉ khi có dữ liệu license so sánh.", "discount_rate > growth."]
    pitfalls: ["Rất nhạy với royalty_rate và discount_rate - chạy kịch bản; không biến thành 'giá bán' chắc chắn."]
    interpretation: "Chỉ là khoảng ước lượng để thương lượng/định hướng, không thay thế đo lường sức khỏe brand bằng CBBE."
    example:
      inputs: {revenue: 10000000000, royalty_rate: 0.03, tax_rate: 0.2, discount_rate: 0.15, growth: 0.03}
      steps: ["Royalty sau thuế năm 1 = 10 tỷ x 3% x (1-20%) = 240 triệu", "V = 240 triệu / (15% - 3%) = 2 tỷ"]
      result: "Giá trị brand ước tính ~2 tỷ VNĐ (minh họa)"

frameworks:
  - id: "m04_keller_cbbe"
    name_vi: "Kim tự tháp tài sản thương hiệu dựa trên khách hàng của Keller"
    name_en: "Keller's Customer-Based Brand Equity (CBBE) Pyramid"
    origin: >
      Kevin Lane Keller, công bố khái niệm CBBE năm 1993 (Journal of Marketing) và hoàn thiện thành kim tự tháp trong sách 'Strategic Brand Management'
      (nguồn trích bản 5th Edition). Ra đời vì trước đó brand equity thường chỉ đo bằng tài chính/thị phần, thiếu giải thích điều gì trong đầu khách tạo ra giá trị;
      Keller xây chuỗi nhận thức theo thứ tự dưới lên để doanh nghiệp biết đang kẹt ở tầng nào.
    components:
      - "Tầng 1 - Salience (Identity - Nhận biết): Tôi có biết brand không? Awareness, recognition, recall."
      - "Tầng 2 - Performance và Imagery (Meaning - Ý nghĩa): Brand LÀ GÌ? Performance: tính năng/chức năng; Imagery: phong cách, tính cách, giá trị."
      - "Tầng 3 - Judgments và Feelings (Response - Phản hồi): Tôi NGHĨ/CẢM gì? Judgments: chất lượng, độ tin cậy; Feelings: ấm áp, hào hứng."
      - "Tầng 4 - Resonance (Relationship - Quan hệ): Tôi và brand là MỘT; loyalty, community, engagement."
    when_to_use: "Chẩn đoán brand đang yếu ở tầng nào; định hướng đầu tư theo thứ tự (không nhảy cóc)."
    how_to_apply:
      - "Khảo sát hoặc phỏng vấn khách mục tiêu theo 4 nhóm câu hỏi: Có biết brand? Brand là gì? Nghĩ và cảm gì? Có gắn bó không?"
      - "Chấm điểm từng tầng (vd 1-5) hoặc đánh dấu tín hiệu: top-of-mind, perception, NPS, repeat rate, community."
      - "Tìm tầng thấp nhất chưa đạt - đó là nút thắt cần ưu tiên."
      - "Đặt mục tiêu đo được cho tầng đó (vd top-of-mind 20%, NPS > 50)."
      - "Chọn hành động tương ứng: tầng 1 làm nhận diện/hiện diện; tầng 2 làm rõ định vị/sản phẩm; tầng 3 xây niềm tin/cảm xúc; tầng 4 xây cộng đồng, chương trình khách thân thiết."
      - "Đo lại định kỳ (6-12 tháng) và điều chỉnh."
    how_to_read_results: >
      Xây từ dưới lên: tầng trên chỉ vững khi tầng dưới vững. Awareness cao nhưng Meaning mờ = nổi tiếng nhưng không ai biết brand đại diện cho gì;
      Meaning rõ nhưng Salience thấp = brand tốt nhưng ít người biết. Resonance cao là trạng thái lý tưởng (loyalty, truyền miệng, premium).
    pitfalls:
      - "Nhầm tầng: đầu tư quảng cáo đại trà (Salience) khi vấn đề thật là sản phẩm/ý nghĩa mờ (Meaning)."
      - "Tầng cảm xúc khó đo, dùng NPS và sentiment làm proxy; không bỏ qua cảm xúc dù khó đo."
      - "Nhầm cặp 'Identity-Meaning-Response-Relationship' với các tầng: đó là 4 cấp tương ứng 4 tầng (Salience, Performance+Imagery, Judgments+Feelings, Resonance)."
    example: >
      Quán cà phê specialty ở Đà Nẵng: 80 khách trong khu đều nhận ra tên (Salience tốt) nhưng khảo sát cho thấy khách cho rằng 'giống mọi quán cà phê' (Meaning yếu).
      Khoản ngân sách quảng cáo thêm không giúp ích; ưu tiên làm rõ định vị (ví dụ cà phê rang xay tại chỗ), rồi mới tới trải nghiệm và loyalty.
  - id: "m04_aaker_equity"
    name_vi: "Mô hình 5 thành phần tài sản thương hiệu của Aaker"
    name_en: "Aaker's Brand Equity Model"
    origin: >
      David A. Aaker. Mô hình gốc trong 'Managing Brand Equity' (1991); nguồn trích 'Building Strong Brands' (1996) - cuốn phát triển Brand Identity.
      Ra đời để coi brand là tập hợp tài sản và nợ phải trả gắn với tên/biểu tượng có thể cộng thêm hoặc trừ đi giá trị của sản phẩm.
    components:
      - "Brand Awareness (nhận biết): đo bằng top-of-mind, aided recall."
      - "Perceived Quality (chất lượng cảm nhận): đo bằng quality ratings, premium perception."
      - "Brand Associations (liên tưởng): đo bằng association map, positioning."
      - "Brand Loyalty (trung thành): đo bằng repeat rate, NPS, churn rate."
      - "Other Assets (tài sản khác): bằng sáng chế, nhãn hiệu, quan hệ kênh phân phối."
    when_to_use: "Chấm điểm/đánh giá nhanh sức khỏe brand của mình hoặc của đối thủ trên 5 trục; lập bảng so sánh."
    how_to_apply:
      - "Lập bảng 5 hàng; thu thập chỉ số cụ thể cho từng hàng (số liệu khảo sát, POS, social listening)."
      - "Chấm sao hoặc điểm 1-5 theo thang cố định, ghi rõ căn cứ."
      - "So sánh với 2-3 đối thủ cùng ngành."
      - "Xác định thành phần thấp nhất và thành phần mạnh nhất (lợi thế để khai thác)."
      - "Đề ra hành động và KPI cho từng thành phần yếu."
    how_to_read_results: "Cấu hình 5 điểm cân bằng không nhất thiết tốt; quan trọng là thành phần nào quyết định lựa chọn của khách trong ngành bạn (vd F&B: awareness và perceived quality; B2B: Other Assets và quan hệ)."
    pitfalls:
      - "Chấm sao theo cảm tính (như phần Vinamilk trong nguồn) mà không có số liệu hỗ trợ."
      - "Bỏ qua Other Assets (đăng ký nhãn hiệu, quan hệ kênh) - SME thường mất brand vì chưa bảo hộ."
    example: >
      Cửa hàng bánh địa phương: Awareness 3 (khu phố biết), Perceived Quality 5 (khách khen), Associations 3, Loyalty 4 (repeat rate 40%), Other Assets 1 (chưa đăng ký nhãn hiệu) ->
      việc cần làm đầu tiên là đăng ký bảo hộ nhãn hiệu và tăng nhận biết ngoài khu phố.
  - id: "m04_brand_identity_system"
    name_vi: "Hệ thống nhận diện thương hiệu (9 thành phần)"
    name_en: "Brand Identity System"
    origin: "Khái niệm brand identity gắn với Aaker (1996) và Kapferer (The New Strategic Brand Management, 2012) - nguồn trích dẫn cả hai làm tài liệu tham khảo; ví dụ minh họa trong nguồn là Apple."
    components:
      - "Brand Name (tên): Apple."
      - "Logo (biểu tượng): quả táo cắn dở."
      - "Tagline (slogan): 'Think Different'."
      - "Color (bảng màu): trắng, xám, đen (tối giản)."
      - "Typography (kiểu chữ): San Francisco (font riêng)."
      - "Tone of Voice (giọng điệu): đơn giản, tự tin, gần gũi con người."
      - "Brand Personality (tính cách): Innovator, creative, premium."
      - "Brand Values (giá trị cốt lõi): Innovation, simplicity, privacy."
      - "Brand Story (câu chuyện): Garage của Steve Jobs, quảng cáo '1984'."
    when_to_use: "Thiết kế hoặc rà soát nhận diện khi xây brand mới, rebrand, hoặc khi nhiều kênh đang 'nói khác nhau'."
    how_to_apply:
      - "Bắt đầu từ chiến lược (purpose, positioning, personality, values), KHÔNG bắt đầu từ logo."
      - "Chọn tên: ngắn, dễ đọc/nhớ, kiểm tra trùng nhãn hiệu và tên miền trước khi chốt."
      - "Dịch personality/values thành màu, font, logo, hình ảnh."
      - "Xác định tone of voice (ví dụ tự tin, gần gũi) với 3-5 nguyên tắc 'nên/không nên'."
      - "Viết brand story ngắn (nguồn gốc, lý do ra đời, lời hứa)."
      - "Tổng hợp thành brand guidelines (logo dùng thế nào, mã màu, font, ví dụ đúng/sai) để mọi người/agency làm đồng nhất."
      - "Áp dụng vào mọi touchpoint và kiểm tra nhất quán định kỳ."
    how_to_read_results: "Nhận diện tốt khi người ngoài chỉ nhìn 3 giây vẫn nhận ra brand và nói đúng tính cách; khi các kênh nhìn như của các công ty khác nhau là thiếu nhất quán."
    pitfalls:
      - "Đầu tư logo đẹp nhưng không có chiến lược/personality."
      - "Mỗi kênh/nhân viên dùng một cách riêng; thiếu guidelines."
      - "Tagline hoặc tên khó đăng ký bảo hộ do trùng."
    example: "Chuỗi trà sữa nhỏ: personality 'trẻ trung, thân thiện', màu cam-kem, tone xưng 'mình - bạn', tagline ngắn; ghi toàn bộ vào guidelines 5-8 trang dùng cho nhân viên, fanpage, bao bì, cốc."
  - id: "m04_brand_architecture"
    name_vi: "Kiến trúc thương hiệu"
    name_en: "Brand Architecture"
    origin: "Khung phân loại 4 mô hình phổ biến trong quản trị thương hiệu (nguồn không nêu tác giả); sinh ra để doanh nghiệp quyết định tận dụng hay tách uy tín giữa các sản phẩm."
    components:
      - "Branded House: 1 master brand cho tất cả (Google: Gmail, Maps, Drive)."
      - "House of Brands: nhiều brand độc lập (P&G: Tide, Gillette, Pampers, Oral-B)."
      - "Endorsed: sub-brand có master brand đỡ lưng (Marriott: Courtyard by Marriott, Ritz-Carlton by Marriott)."
      - "Hybrid: kết hợp (Samsung: Samsung Galaxy, Samsung TV nhưng Harman/JBL riêng)."
    when_to_use: "Khi ra dòng sản phẩm mới, thâm nhập phân khúc khác, sau M&A, hoặc rà soát brand portfolio."
    how_to_apply:
      - "Liệt kê toàn bộ sản phẩm/brand hiện có và khách hàng mục tiêu của từng cái."
      - "Hỏi: sản phẩm mới có cùng giá trị cốt lõi và đối tượng với brand hiện tại không? Nếu có -> nghiêng Branded House/Endorsed."
      - "Hỏi: nếu sản phẩm mới thất bại hoặc có scandal, có muốn nó lan sang brand mẹ không? Nếu không -> House of Brands."
      - "Hỏi: ngân sách xây brand riêng là bao nhiêu? SME thường chỉ đủ cho 1 master brand."
      - "Chọn mô hình, ghi quy tắc đặt tên và hiển thị logo vào guidelines."
    how_to_read_results: "Branded House: tiết kiệm chi phí, uy tín dùng chung nhưng rủi ro dây chuyền; House of Brands: tách rủi ro, nhắm phân khúc khác nhau nhưng tốn gấp bội ngân sách; Endorsed: cân bằng; Hybrid: linh hoạt nhưng khó nhất quán."
    pitfalls:
      - "Mở nhiều sub-brand khi chưa có master brand mạnh."
      - "Mở rộng brand sang sản phẩm không liên quan (over-extension) làm loãng ý nghĩa."
    example: "Quán phở chuỗi 3 chi nhánh ra thêm phở khô đóng gói: dùng Endorsed hoặc Branded House ('Phở A - phở khô') thay vì lập brand mới vì ngân sách và uy tín sẵn có."
  - id: "m04_brand_building_process"
    name_vi: "Quy trình xây dựng thương hiệu 7 bước"
    name_en: "7-Step Brand Building Process"
    origin: "Quy trình tổng hợp trong tài liệu (không gắn tác giả): từ Brand Audit đến Brand Protection; ra đời để biến brand từ ý niệm thành chuỗi việc có thứ tự và đầu ra rõ."
    components:
      - "1 Brand Audit - đánh giá hiện trạng (perception map, competitive analysis)."
      - "2 Brand Strategy - purpose, vision, positioning, personality."
      - "3 Brand Identity - logo, color, typography, guidelines."
      - "4 Brand Communication - advertising, content, social media, PR."
      - "5 Brand Experience - product, service, touchpoints."
      - "6 Brand Measurement - awareness, equity, loyalty, NPS."
      - "7 Brand Protection - legal, crisis management, consistency."
    when_to_use: "Xây brand mới hoặc 'dọn lại' brand hiện hữu từ gốc."
    how_to_apply:
      - "Audit: thu thập dữ liệu khách (khảo sát, review), đối thủ, nội bộ; vẽ perception map 2 trục."
      - "Strategy: chốt positioning statement, personality, values, lời hứa thương hiệu."
      - "Identity: chuyển strategy sang tên, logo, màu, font, tone, guidelines."
      - "Communication: chọn kênh (xem m05, m08), nội dung nhất quán."
      - "Experience: đảm bảo sản phẩm, dịch vụ, nhân viên giao đúng lời hứa."
      - "Measurement: lập dashboard KPI (xem bảng benchmark) theo quý."
      - "Protection: đăng ký nhãn hiệu, quy trình xử lý khủng hoảng, kiểm tra nhất quán."
    how_to_read_results: "Mỗi bước cần đầu ra bàn giao được; quay lại bước 1-2 khi số liệu bước 6 cho thấy khác với kỳ vọng."
    pitfalls:
      - "Nhảy thẳng đến bước 3 (làm logo) hoặc 4 (chạy quảng cáo) mà bỏ audit và strategy."
      - "Truyền thông hứa nhiều hơn trải nghiệm thật (thiếu bước 5)."
      - "Chỉ đăng ký bảo hộ khi đã bị đạo nhái."
    example: "Xem procedure m04_build_brand_sme và worked_examples."
  - id: "m04_brand_measurement_dashboard"
    name_vi: "Bộ chỉ số đo lường thương hiệu"
    name_en: "Brand Measurement Dashboard"
    origin: "Bảng 6 chỉ số trong nguồn (Awareness, NPS, Sentiment, Share of Voice, Brand Search Volume, Brand Premium); NPS do Fred Reichheld/Bain đề xuất 2003. Dựng để thay thế việc 'brand khó đo ROI' bằng chuỗi proxy theo dõi được."
    components:
      - "Brand Awareness: khảo sát 'Kể tên brand trong ngành X?'; benchmark top-of-mind > 20%."
      - "NPS: 'Bạn có giới thiệu brand cho bạn bè?' 0-10; benchmark > 50 = Excellent."
      - "Brand Sentiment: social listening (positive/negative/neutral); benchmark > 70% positive."
      - "Share of Voice: % mentions so với đối thủ; benchmark > market share."
      - "Brand Search Volume: Google Trends, SEO tools; benchmark tăng trưởng QoQ."
      - "Brand Premium: giá cao hơn generic bao nhiêu %; benchmark phụ thuộc ngành."
    when_to_use: "Lập dashboard theo quý cho chủ SME và báo cáo đầu tư brand."
    how_to_apply:
      - "Chọn 3-4 chỉ số phù hợp nguồn dữ liệu sẵn có (không cần đủ 6 từ đầu)."
      - "Thiết lập baseline (đo lần đầu) trước khi chạy chiến dịch."
      - "Cố định phương pháp đo (nhóm mẫu, nền tảng, thang điểm) để so sánh được."
      - "Đo theo quý, ghi trong Google Sheets, so sánh với đối thủ và mục tiêu."
      - "Liên hệ với doanh số/CLV để thấy tác động thương mại."
    how_to_read_results: "Đọc theo cụm: nhận biết (awareness, SOV, search) -> cảm nhận (sentiment, NPS) -> giá trị thương mại (premium, repeat rate). Chỉ số nhận biết tăng mà NPS giảm là cảnh báo trải nghiệm."
    pitfalls:
      - "Chỉ đo vanity metrics (like, follow)."
      - "Thay đổi phương pháp đo giữa các kỳ."
      - "Đòi một công thức tính ROI brand chính xác - chỉ có proxy."
    example: "Quán cà phê đo mỗi quý: top-of-mind trong khu vực 1km, NPS qua QR sau thanh toán, sentiment từ review Google Maps, giá trung bình so với quán lân cận."
  - id: "m04_brand_pros_cons"
    name_vi: "Cân nhắc lợi ích và hạn chế của đầu tư thương hiệu"
    name_en: "Brand Investment Trade-offs"
    origin: "Phần Ưu điểm - Nhược điểm của nguồn; giúp chủ doanh nghiệp quyết định mức đầu tư thực tế."
    components:
      - "Ưu: premium pricing, customer loyalty (giảm churn, tăng CLV), competitive moat (VRIO Inimitable), talent attraction, negotiating power, crisis resilience."
      - "Nhược: tốn kém và lâu (5-10 năm), khó đo ROI, dễ tổn thương (1 scandal), cần nhất quán mọi touchpoint, brand aging (Kodak, Nokia), over-extension."
    when_to_use: "Quyết định có đầu tư brand hay ưu tiên bán hàng hiệu suất; thuyết phục chủ doanh nghiệp/nhà đầu tư."
    how_to_apply:
      - "Liệt kê lợi ích nào áp dụng cho ngành/giai đoạn của bạn."
      - "Định lượng lợi ích bằng brand premium, giảm churn, CAC thấp hơn."
      - "Đặt ngân sách trần theo % doanh thu và mốc 12-24 tháng."
      - "Lập danh sách rủi ro và biện pháp (guidelines, đăng ký nhãn hiệu, quy trình khủng hoảng)."
    how_to_read_results: "Brand là khoản đầu tư dài hạn; kết quả 3-6 tháng đầu thường chỉ thấy ở awareness/sentiment, doanh thu theo sau."
    pitfalls: ["Kỳ vọng doanh số tức thì từ brand building.", "Cắt ngân sách brand ngay khi doanh thu chậm."]
    example: "SME giữ 70% ngân sách cho kênh chuyển đổi, 30% cho brand building nhất quán (đây là gợi ý thực hành, không có trong nguồn)."

procedures:
  - id: "m04_build_brand_sme"
    name: "Xây thương hiệu cho SME từ đầu đến cuối"
    steps:
      - "Hỏi đầu vào: ngành, sản phẩm lõi, khách mục tiêu (từ STP), đối thủ chính, ngân sách 12 tháng, mục tiêu (nhận biết/giá cao hơn/loyalty), đã có tên và logo chưa, đã đăng ký nhãn hiệu chưa."
      - "Brand Audit: khảo sát 20-50 khách + quan sát 3-5 đối thủ; vẽ perception map 2 trục (vd giá - chất lượng; truyền thống - hiện đại); xác định khoảng trống."
      - "Brand Strategy: viết purpose, positioning statement, 3 giá trị, 3 tính từ personality, lời hứa thương hiệu."
      - "Brand Identity: chốt tên, logo, màu, font, tone of voice, story; viết brand guidelines ngắn."
      - "Brand Communication: chọn 2-3 kênh chính phù hợp khách (Facebook/TikTok/Zalo/Google Maps), lịch nội dung nhất quán."
      - "Brand Experience: map touchpoint (từ biết -> mua -> sau bán), chuẩn hóa SOP nhân viên và bao bì để giao đúng lời hứa."
      - "Brand Measurement: thiết lập baseline (awareness, NPS, sentiment, premium), đo lại hằng quý."
      - "Brand Protection: đăng ký nhãn hiệu, giữ tên miền/fanpage, quy trình xử lý khủng hoảng, ủy quyền người phát ngôn."
    outputs: "Brand strategy 1 trang, brand guidelines, kế hoạch nội dung 3 tháng, dashboard KPI baseline, hồ sơ đăng ký nhãn hiệu."
  - id: "m04_assess_brand_equity"
    name: "Đánh giá sức khỏe thương hiệu (Brand Equity assessment)"
    steps:
      - "Hỏi: khách mục tiêu là ai, ngành nào, đối thủ nào so sánh, có dữ liệu khảo sát/POS/social không?"
      - "Thu thập chỉ số theo Aaker: awareness (top-of-mind, aided), perceived quality, associations, loyalty (repeat rate, NPS), other assets."
      - "Đối chiếu Keller CBBE để định vị tầng đang thấp nhất."
      - "Tính các công thức m04_nps, m04_brand_premium, m04_share_of_voice, m04_sentiment, m04_repeat_rate."
      - "So với benchmark (top-of-mind > 20%, NPS > 50, sentiment > 70%, SOV > market share) và đối thủ."
      - "Chẩn đoán nút thắt, đề xuất 3 hành động ưu tiên và KPI mục tiêu 6 tháng."
    outputs: "Bảng chấm điểm 5 thành phần, bảng KPI so benchmark, chẩn đoán tầng CBBE thấp nhất, 3 hành động ưu tiên."
  - id: "m04_choose_architecture"
    name: "Chọn kiến trúc thương hiệu khi ra sản phẩm mới"
    steps:
      - "Mô tả sản phẩm mới: đối tượng, mức giá, giá trị cốt lõi, ngân sách."
      - "Kiểm tra sự phù hợp với liên tưởng cốt lõi của master brand (fit)."
      - "Đánh giá rủi ro lan truyền (nếu thất bại/scandal) và ngân sách cho brand riêng."
      - "Chọn: Branded House (fit cao, ngân sách thấp), Endorsed (fit vừa, cần cá tính riêng), House of Brands (fit thấp hoặc phân khúc xung đột), Hybrid (danh mục phức tạp)."
      - "Ghi quy tắc đặt tên, hiển thị logo, ngân sách xây brand."
    outputs: "Quyết định kiến trúc thương hiệu kèm lý do và quy tắc áp dụng."
  - id: "m04_rebrand_decision"
    name: "Quyết định làm mới / tái định vị thương hiệu"
    steps:
      - "Chẩn đoán dấu hiệu brand aging: khách mới (Gen Z) không biết, đối thủ định vị rõ hơn, sentiment/NPS giảm, doanh thu nhóm trẻ yếu."
      - "Xác định điều cần giữ (core assets: tên, lời hứa, màu nhận diện) và điều cần đổi (visual, tone, kênh)."
      - "Chọn mức độ: refresh nhẹ (visual, kênh) hay rebrand sâu (định vị, đối tượng)."
      - "Kiểm tra với khách cũ và khách mới (khảo sát nhỏ, A/B visual); đánh giá phản ứng tiêu cực dự kiến."
      - "Lập kế hoạch change management: thông điệp giải thích, giai đoạn chuyển tiếp, đồng bộ bao bì/cửa hàng/kênh số."
      - "Theo dõi chỉ số trước/sau (awareness, sentiment, NPS, doanh thu theo nhóm khách) trong 3-6 tháng."
    outputs: "Quyết định rebrand/refresh, phạm vi thay đổi/giữ lại, kế hoạch truyền thông và chỉ số theo dõi."
  - id: "m04_crisis_response"
    name: "Ứng phó khủng hoảng thương hiệu"
    steps:
      - "Phát hiện sớm: social listening, cảnh báo sentiment tiêu cực tăng đột biến."
      - "Xác minh sự việc, đánh giá mức độ (chất lượng sản phẩm, an toàn, thái độ nhân viên, tin giả)."
      - "Lập đội phản ứng nhanh và một người phát ngôn duy nhất."
      - "Phản hồi nhanh, thừa nhận phần đúng, nêu hành động khắc phục cụ thể; không tranh cãi công khai."
      - "Sửa nguyên nhân gốc rồi công bố kết quả; theo dõi sentiment tới khi phục hồi."
      - "Rút kinh nghiệm, cập nhật SOP và kịch bản khủng hoảng."
    outputs: "Thông cáo phản hồi, kế hoạch khắc phục, báo cáo sentiment trước-sau, SOP cập nhật."

decision_rules:
  - "Nếu top-of-mind < 20% trong nhóm khách mục tiêu thì ưu tiên tầng Salience (hiện diện, SEO địa phương, Google Maps, nội dung nhất quán) trước khi làm campaign cảm xúc."
  - "Nếu awareness cao nhưng khách mô tả brand 'giống mọi nơi' thì vấn đề ở Meaning (định vị, USP, imagery) - làm rõ định vị trước khi tăng ngân sách quảng cáo."
  - "Nếu NPS < 0 thì dừng đổ tiền vào quảng cáo, xử lý detractors và trải nghiệm sản phẩm/dịch vụ."
  - "Nếu NPS > 50 và repeat rate cao mà awareness thấp thì tăng nhận biết (referral, PR, local SEO), vì lõi trải nghiệm đã tốt."
  - "Nếu SOV < market share thì tăng hiện diện (nội dung, quảng cáo, PR) hoặc giữ nguyên nhưng chấp nhận nguy cơ mất thị phần; nếu SOV > market share dài hạn thì thị phần thường theo sau."
  - "Nếu sentiment < 70% positive hoặc negative tăng đột biến thì kích hoạt quy trình phản hồi (m04_crisis_response)."
  - "Nếu brand premium dương nhưng volume giảm thì premium quá cao so với giá trị cảm nhận; xem lại perceived quality hoặc giảm giá nhẹ."
  - "Nếu sản phẩm mới cùng giá trị cốt lõi và cùng đối tượng thì dùng Branded House/Endorsed; nếu khác phân khúc hoặc rủi ro lan truyền cao thì House of Brands (chỉ khi đủ ngân sách)."
  - "Nếu ngân sách SME < vài chục triệu/năm thì chỉ xây MỘT master brand; tránh sub-brand."
  - "Nếu khách mới (Gen Z) không nhận ra brand và khách cũ vẫn trung thành thì refresh nhận diện nhẹ + mở kênh số, giữ core assets; không rebrand toàn bộ."
  - "Nếu cân nhắc rebrand thì kiểm tra phản ứng khách cũ trước và giữ lõi (name, màu, lời hứa) để giảm rủi ro mất khách."
  - "Nếu các kênh nhìn/nói không giống nhau thì viết brand guidelines và rà soát touchpoint trước khi tạo thêm nội dung."
  - "Nếu chưa đăng ký nhãn hiệu thì ưu tiên đăng ký trước khi đầu tư lớn vào truyền thông."
  - "Nếu cần biện minh ngân sách brand thì dùng brand premium x sản lượng và chỉ số nhận biết làm proxy; không hứa ROI chính xác."
  - "Nếu brand lâu năm bị mô tả 'truyền thống/cũ' bởi nhóm khách trẻ thì xem xét rebrand theo mô hình Vinamilk (giữ master brand, thêm digital, sustainability)."

benchmarks:
  - {metric: "Top-of-mind awareness", value: "> 20%", context: "Khảo sát 'Kể tên brand trong ngành X?' (benchmark của nguồn)", confidence: "medium"}
  - {metric: "NPS", value: "> 50 = Excellent", context: "Thang -100 đến +100; ngưỡng thay đổi theo ngành", confidence: "medium"}
  - {metric: "Brand Sentiment positive", value: "> 70%", context: "Social listening", confidence: "medium"}
  - {metric: "Share of Voice", value: "> Market share", context: "Mentions hoặc ngân sách so với đối thủ", confidence: "medium"}
  - {metric: "Brand Search Volume", value: "Tăng trưởng QoQ dương", context: "Google Trends/SEO tools; tính mùa vụ", confidence: "medium"}
  - {metric: "Brand Premium", value: "Phụ thuộc ngành", context: "Nguồn không đưa ngưỡng", confidence: "low"}
  - {metric: "Thời gian xây brand mạnh", value: "5-10 năm", context: "Nguồn nêu đầu tư lớn và dài hạn", confidence: "medium"}

pitfalls:
  - "Nhầm brand với logo: sửa nhận diện hình ảnh mà không sửa trải nghiệm thì brand không đổi."
  - "Nhảy thẳng vào thiết kế logo/chạy quảng cáo, bỏ audit và strategy."
  - "Thiếu nhất quán giữa các touchpoint (kênh, nhân viên, bao bì) - phá lời hứa thương hiệu."
  - "Hứa hẹn trong quảng cáo vượt xa trải nghiệm thực tế."
  - "Xây từ trên xuống: làm cộng đồng/loyalty khi chưa có awareness và ý nghĩa rõ (bỏ qua thứ tự CBBE)."
  - "Mở rộng thương hiệu quá đà (over-extension) làm loãng ý nghĩa; mở nhiều sub-brand khi chưa có master brand mạnh."
  - "Brand aging: không làm mới theo thế hệ khách mới (Kodak, Nokia)."
  - "Rebrand thiếu change management, đi xa lõi khiến khách cũ phản đối (bài học Vinamilk)."
  - "Quá phụ thuộc đánh giá sao cảm tính (như bảng ⭐ Vinamilk trong nguồn) mà không có số liệu."
  - "Kỳ vọng đo ROI brand chính xác; thực tế chỉ có proxy (premium, awareness, NPS, repeat)."
  - "Chưa bảo hộ nhãn hiệu - nguy cơ bị đăng ký trước hoặc đạo nhái."
  - "Bỏ qua khủng hoảng: một scandal có thể hủy nhiều năm xây dựng; cần quy trình sẵn."
  - "Số liệu trong nguồn có sai lệch/chưa kiểm chứng (xem ghi chú ở case_lessons): không trích dùng như sự thật mà không kiểm tra."
  - "Ghi chú nguồn: nguồn ghi sách Aaker 'Building Strong Brands' (1996) cho mô hình 5 thành phần, trong khi mô hình gốc ở 'Managing Brand Equity' (1991); gọi tên 'Brandnew' trong bài học 5 là lỗi gõ (Brand new). Trong nguồn, chữ 'Identity' ở cấp 1 của 4 cấp (Identity/Meaning/Response/Relationship) khác với 'Brand Identity System' ở mục II."

sme_vn_guidance:
  - "Thứ tự ưu tiên chi tiêu cho SME: (1) chất lượng sản phẩm/dịch vụ nhất quán, (2) định vị + tên dễ nhớ, (3) đăng ký nhãn hiệu, (4) nhận diện cơ bản + guidelines, (5) hiện diện kênh số, (6) đo lường nhẹ."
  - "Đăng ký nhãn hiệu tại Cục Sở hữu trí tuệ Việt Nam (IP Vietnam) theo lớp Nice phù hợp; tra cứu trùng trước khi chốt tên. Lệ phí và thời gian xử lý thay đổi (thường kéo dài nhiều tháng đến hơn 1 năm) - cần xác nhận quy định hiện hành và cân nhắc luật sư SHTT. Confidence thấp."
  - "Chi phí tham khảo (confidence low, cần báo giá thực): thiết kế logo + bộ nhận diện cơ bản từ vài triệu (freelancer) đến vài chục triệu (agency nhỏ); guidelines 5-10 trang có thể tự làm bằng Canva/Figma."
  - "Công cụ: Canva (gói Pro vài trăm nghìn VNĐ/tháng - confidence low), Figma (miễn phí gói cá nhân), Google Trends (miễn phí), Google Search Console (miễn phí), Google Forms (khảo sát NPS/awareness, miễn phí), Google Sheets (dashboard KPI), Brand24/Mention/Buzzmetrics hoặc các công cụ social listening nội địa (trả phí - tham khảo báo giá), Google Business Profile (miễn phí, quản lý đánh giá)."
  - "Đo NPS nhẹ: QR code ở bàn/bill dẫn tới Google Form 2 câu (0-10 và 'vì sao?')."
  - "Mỗi quý: 20-50 khảo sát khách trong khu vực phục vụ, thu thập review Google Maps, so giá 3-5 đối thủ để ước brand premium."
  - "Với Gen Z VN: TikTok, Instagram, KOL/KOC phù hợp xây awareness; luôn đồng bộ tone of voice (xem m05)."
  - "Quy trình khủng hoảng cho SME: chỉ định chủ quán/người phát ngôn duy nhất; mẫu trả lời đánh giá xấu; theo dõi tag tên quán trên Facebook/TikTok hằng ngày."
  - "Nếu có kế hoạch nhượng quyền hoặc gọi vốn: ưu tiên bảo hộ nhãn hiệu, brand guidelines và dữ liệu loyalty (repeat rate, NPS) để tăng giá trị thương hiệu trong định giá."
  - "Ngân sách mô hình (illustrative, confidence low): 3-5% doanh thu cho marketing; trong đó tối thiểu 20-30% cho nhất quán brand (nội dung, trải nghiệm, nhận diện) thay vì dồn hết cho khuyến mại."

case_lessons:
  - name: "Vinamilk - thương hiệu quốc dân thời 4.0 (rebranding 2023)"
    type: "success"
    setup: >
      Thương hiệu sữa số 1 Việt Nam, thành lập 1976, niêm yết HOSE (VNM). Nguồn mô tả 4 giai đoạn: 1976-2000 brand quốc gia ('Sữa Việt Nam cho người Việt Nam'),
      2000-2015 nâng cấp chất lượng (chuẩn quốc tế, organic, xuất khẩu), 2015-2020 mở rộng brand khi TH True Milk cạnh tranh (organic, Greek yogurt),
      2020-2025 digital + rebranding 2023 (logo tối giản, màu xanh lá, TikTok/Instagram/KOL, D2C, omnichannel) nhằm thu hút Gen Z.
    key_calculations:
      - "Aaker scorecard trong nguồn (định tính, 4-5 sao): Awareness 5 sao (top-of-mind ngành sữa ~70%, 96% người VN biết), Perceived Quality 4, Associations 4, Loyalty 4, Other Assets 4 (14 nhà máy, 250,000+ điểm bán, đàn bò 150,000+)."
      - "Kết quả nguồn nêu: doanh thu 2023 ~62,000 tỷ VNĐ (~2.5 tỷ USD); thị phần ~55%; brand value ~2.8 tỷ USD. Kiểm tra quy đổi: 62,000 tỷ / 25,000 VNĐ/USD = 2.48 tỷ USD, khớp ~2.5 tỷ USD (giả định tỷ giá ~25,000)."
      - "Bảng trước-sau: logo, tagline, màu, target, digital, personality (xem lessons)."
    lesson: >
      (1) Brand phải tiến hóa theo thế hệ khách hàng; (2) digital-first không có nghĩa bỏ kênh truyền thống mà là omnichannel; (3) sustainability (ESG, organic, net-zero 2050) có thể là tài sản thương hiệu;
      (4) mở rộng brand cẩn trọng, giữ master brand rõ; (5) rebrand có rủi ro (khách lớn tuổi phản đối) nên cần change management và không đi quá xa lõi. Hạn chế: TH True Milk định vị premium organic rõ hơn; loyalty Gen Z thấp hơn.
    data_reliability: "unverified"
  - name: "Kiểm tra số liệu trong case Vinamilk - cảnh báo sử dụng"
    type: "failure"
    setup: >
      Nhiều chi tiết trong nguồn là số ước lượng hoặc mô tả chưa nêu nguồn kiểm chứng, cần ghi chú khi dùng để dạy học hoặc ra quyết định.
    key_calculations:
      - "Top-of-mind ~70% và 96% người VN biết: không nêu nguồn khảo sát, thời điểm - coi là minh họa."
      - "Thị phần ~55%, brand value ~2.8 tỷ USD, 'Top 50 thương hiệu sữa giá trị nhất thế giới (Brand Finance)': cần đối chiếu báo cáo Brand Finance từng năm (cách đặt tên bảng xếp hạng có thể sai lệch)."
      - "Chi tiết rebranding 2023 (đổi logo từ em bé uống sữa sang tối giản, tagline 'For a Happier Life', màu xanh lá): nhận diện thực tế của Vinamilk gồm logo chữ và biểu tượng giọt sữa/chữ V thương hiệu, với tông xanh dương; mô tả của nguồn có thể không khớp công bố chính thức - cần kiểm tra trước khi trích dẫn."
      - "Nguồn viết 'Vinamilk 47 năm tuổi' (1976 -> 2023 = 47) đúng phép tính."
      - "Đánh giá sao (⭐) là chấm điểm chủ quan, không phải kết quả khảo sát."
    lesson: "Giữ phương pháp (Aaker, CBBE, rebrand) từ case này, nhưng số liệu cụ thể phải kiểm chứng; không đưa vào báo cáo khách hàng như dữ kiện đã xác minh."
    data_reliability: "unverified"
  - name: "Brand aging: Kodak và Nokia (ví dụ nêu trong nguồn)"
    type: "failure"
    setup: "Nguồn chỉ nhắc tên hai brand như hình mẫu của brand aging (nhược điểm 5) và để minh họa lý do Vinamilk phải rebrand; không có số liệu chi tiết."
    key_calculations: ["Không có phép tính trong nguồn."]
    lesson: "Brand lớn vẫn có thể suy yếu nếu không refresh theo công nghệ và thế hệ khách mới; cảnh báo cho SME rằng nổi tiếng hôm nay không đảm bảo ngày mai."
    data_reliability: "illustrative"
  - name: "Apple - ví dụ Brand Identity System"
    type: "success"
    setup: "Nguồn dùng Apple để minh họa 9 yếu tố nhận diện: tên, quả táo cắn dở, 'Think Different', trắng-xám-đen, San Francisco font, tone đơn giản - tự tin - gần gũi, personality innovator, giá trị innovation-simplicity-privacy, story garage Steve Jobs và quảng cáo '1984'."
    key_calculations: ["Không có phép tính; chỉ là ví dụ khung."]
    lesson: "Mọi yếu tố nhận diện đều xuất phát từ cùng một personality/values nên nhìn và nghe đều nhất quán."
    data_reliability: "verified"
  - name: "Quán cà phê specialty Đà Nẵng 'Cà Phê Hạt Nhà' - dùng CBBE để chẩn đoán (SME giả định)"
    type: "sme"
    setup: >
      Quán 45 m2, đầu tư 800 triệu VNĐ, 18 tháng tuổi tại Hải Châu. Doanh thu giảm dù chi đều đặn 8 triệu/tháng cho quảng cáo Facebook.
      Khảo sát 100 khách mục tiêu (nhân viên văn phòng 22-35 tuổi) trong bán kính 1km.
    key_calculations:
      - "Top-of-mind = 12/100 = 12% (dưới 20%); Aided recall = 55/100 = 55%."
      - "NPS: 38 promoters, 42 passives, 20 detractors -> NPS = 38 - 20 = 18."
      - "Brand premium: giá ly 49,000 vs giá trung bình quán lân cận 40,000 -> (49-40)/40 = 22.5%."
      - "Repeat rate = 210/600 khách trong quý = 35%."
    lesson: >
      Aided recall đạt 55% nhưng top-of-mind chỉ 12% nghĩa là Salience mới ở mức nhận ra, chưa 'nhớ ra'; Meaning khá rõ (premium 22.5%, NPS 18 dương) nên chi tiền quảng cáo đại trà là sai hướng.
      Hành động: xây thói quen nhớ tên (nội dung nhất quán, workshop cupping, ưu đãi giới thiệu), đo lại top-of-mind sau 6 tháng với mục tiêu >= 20%.
    data_reliability: "illustrative"

worked_examples:
  - name: "Tính NPS, brand premium và share of voice cho quán cà phê"
    scenario: >
      Quán cà phê Hạt Nhà, Đà Nẵng. Khảo sát 120 khách: 54 chấm 9-10, 42 chấm 7-8, 24 chấm 0-6.
      Giá bán ly signature 55,000; ly tương đương của quán không thương hiệu cùng khu 35,000; bán 1,800 ly/tháng.
      Social listening ngành cà phê trong khu vực: 800 lượt nhắc/tháng, trong đó quán 96 lượt; thị phần doanh thu ước 9%.
    inputs: {promoters: 54, detractors: 24, total_respondents: 120, price_brand: 55000, price_generic: 35000, quantity: 21600, brand_mentions: 96, category_mentions: 800, market_share_pct: 9}
    steps:
      - "NPS = (54 - 24)/120 x 100 = 25"
      - "Brand premium = (55,000 - 35,000)/35,000 = 57.1%"
      - "Premium value/năm = 20,000 x (1,800 x 12 = 21,600) = 432,000,000 VNĐ"
      - "SOV = 96/800 = 12%; ESOV = 12 - 9 = +3 điểm %"
    result: >
      NPS 25 (dương nhưng chưa Excellent); brand premium 57.1%, tạo thêm khoảng 432 triệu/năm doanh thu so với bán generic (cận dưới vì sản lượng bán generic có thể khác);
      SOV 12% > thị phần 9% -> dư địa tăng trưởng; ưu tiên chuyển bớt passives thành promoters qua trải nghiệm.
  - name: "Chọn kiến trúc thương hiệu cho chuỗi phở ra dòng sản phẩm đóng gói"
    scenario: >
      Chuỗi 'Phở Nhà Mình' 4 cửa hàng ở Hà Nội, định vị phở truyền thống gia đình, NPS 40, thị phần địa phương mạnh. Dự định ra 3 sản phẩm: phở khô gói, nước dùng cô đặc, và dòng bún bò Huế.
      Ngân sách xây brand mới 150 triệu cho cả năm.
    inputs: {budget: 150000000, existing_stores: 4}
    steps:
      - "Phở khô và nước dùng: cùng giá trị cốt lõi (hương vị phở truyền thống) và cùng khách -> fit cao -> Branded House/Endorsed ('Phở Nhà Mình')."
      - "Bún bò Huế: giá trị cốt lõi hơi khác (miền Trung) nhưng khách tương tự -> Endorsed: 'Bún bò Huế - by Phở Nhà Mình' hoặc cùng master brand nếu menu cùng quán."
      - "Ngân sách 150 triệu chỉ đủ xây một master brand + hiện diện kênh -> không lập brand riêng (House of Brands) vì phân tán."
      - "Quy tắc hiển thị: logo master brand luôn xuất hiện; bao bì sản phẩm phụ dùng cùng bảng màu."
    result: "Chọn Branded House cho phở khô, nước dùng; Endorsed cho bún bò Huế. Tiết kiệm ngân sách và tận dụng NPS 40 sẵn có; nếu sau này mở dòng khác phân khúc (ví dụ đồ uống cao cấp) mới xét House of Brands."
  - name: "Rà soát nhận diện và quyết định refresh cho thương hiệu thời trang online"
    scenario: >
      Shop thời trang nữ 'Lụa Mộc' bán online, 3 năm, doanh thu 2.4 tỷ/năm. Khách chính 30-45 tuổi, repeat rate 38%, NPS 45. Khách 18-24 gần như không biết đến shop (chỉ 3% khách mới thuộc nhóm này).
      Logo cũ chữ viết tay, màu nâu; Instagram và Shopee dùng ảnh/phông khác nhau, TikTok chưa có.
    inputs: {revenue: 2400000000, repeat_rate: 38, nps: 45, gen_z_new_customer_share: 3}
    steps:
      - "Chẩn đoán CBBE: Salience nhóm 18-24 thấp; Meaning rõ ở nhóm 30-45; Resonance khá (repeat 38%, NPS 45)."
      - "Kết luận: không rebrand sâu vì lõi đang tốt với nhóm hiện tại; chỉ refresh có kiểm soát."
      - "Giữ: tên, tông màu chủ đạo, chất liệu lụa/mộc, lời hứa thương hiệu."
      - "Đổi: nâng cấp visual (ảnh nhất quán, font), mở TikTok/Instagram Reels, KOC nhóm trẻ."
      - "Viết brand guidelines để Shopee, Instagram, TikTok, bao bì cùng tone."
      - "KPI 6 tháng: tỷ trọng khách mới 18-24 từ 3% lên >= 10%; NPS giữ >= 45; sentiment >= 70%."
    result: "Refresh nhẹ + mở kênh mới thay vì rebrand toàn bộ (tránh mất khách cốt lõi như rủi ro Vinamilk đã nêu); theo dõi nhóm tuổi và NPS để kiểm tra không bị loãng brand."
  - name: "Biện minh ngân sách brand bằng premium và ước lượng giá trị thương hiệu (relief-from-royalty)"
    scenario: >
      Công ty bánh kẹo đặc sản 'Hương Quê', doanh thu 10 tỷ/năm, đang chuẩn bị gọi vốn. Nhà đầu tư hỏi giá trị thương hiệu. Giá bán trung bình 60,000/hộp, hộp tương tự không thương hiệu 45,000, bán 100,000 hộp/năm.
    inputs: {price_brand: 60000, price_generic: 45000, quantity: 100000, revenue: 10000000000, royalty_rate: 0.03, tax_rate: 0.2, discount_rate: 0.15, growth: 0.03}
    steps:
      - "Premium = (60,000 - 45,000)/45,000 = 33.3%"
      - "Premium value/năm = 15,000 x 100,000 = 1,500,000,000 (1.5 tỷ)"
      - "Relief-from-royalty (royalty 3%, thuế 20%, r 15%, g 3%): 10 tỷ x 3% x 0.8 = 240 triệu; V = 240 triệu/0.12 = 2 tỷ"
      - "Hai cách cho hai góc nhìn khác nhau: premium (1.5 tỷ/năm doanh thu tăng thêm) và hiện giá royalty tiết kiệm (2 tỷ). Hai con số không cộng với nhau."
    result: "Brand Premium 33.3%; giá trị brand tham khảo ~2 tỷ (rất nhạy với royalty/discount); trình bày như một khoảng kèm giả định, không phải giá cố định."

practice_questions:
  - q: "Phân biệt 4 cấp của Keller (Identity, Meaning, Response, Relationship) với 6 khối CBBE. Mỗi cấp ứng với khối nào?"
    a: "Identity = Salience; Meaning = Performance + Imagery; Response = Judgments + Feelings; Relationship = Resonance. Xây từ dưới lên."
  - q: "Khảo sát 250 khách: 100 chấm 9-10, 100 chấm 7-8, 50 chấm 0-6. Tính NPS và nhận xét."
    a: "NPS = (100 - 50)/250 x 100 = 20. Dương nhưng thấp hơn ngưỡng Excellent (>50); passives chiếm 40% cần chuyển hóa."
  - q: "Giá ly cà phê của quán là 52,000; ly tương tự generic 40,000; bán 3,000 ly/tháng. Tính brand premium và giá trị tăng thêm hằng năm."
    a: "Premium = 12,000/40,000 = 30%. Hằng năm = 12,000 x 3,000 x 12 = 432,000,000 VNĐ."
  - q: "Brand có 150 lượt nhắc trên tổng 1,000 lượt ngành, thị phần 18%. SOV và ESOV?"
    a: "SOV = 15%; ESOV = 15 - 18 = -3 điểm % -> hiện diện thấp hơn quy mô, nguy cơ mất thị phần; cần tăng nội dung/PR."
  - q: "Chuỗi bánh mì muốn ra thêm thương hiệu trà sữa. Nên chọn kiến trúc nào và vì sao?"
    a: "Phụ thuộc fit. Nếu ngân sách hạn chế và khách trùng thì Endorsed ('Trà sữa X by Bánh mì Y') để mượn uy tín; nếu rủi ro lan truyền hoặc khách khác biệt rõ và có ngân sách thì House of Brands. SME thường nên Endorsed/Branded House."
  - q: "Vinamilk rebrand 2023 mang lại 3 bài học nào quan trọng cho SME?"
    a: "Brand phải tiến hóa; omnichannel thay vì bỏ kênh cũ; sustainability làm tài sản brand; rủi ro khách cũ phản đối nên cần change management và giữ lõi. Số liệu cụ thể của case cần kiểm chứng."
  - q: "Quán có top-of-mind 8% nhưng NPS 55. Nên ưu tiên gì?"
    a: "Trải nghiệm đã tốt (NPS > 50) nhưng Salience thấp -> ưu tiên awareness: local SEO, Google Maps, referral, PR, nội dung nhất quán; mục tiêu >= 20%."
  - q: "Tại sao NPS không tính passives (7-8)?"
    a: "Passives hài lòng nhưng không có động lực giới thiệu và dễ bị đối thủ lôi kéo; NPS chỉ đo chênh lệch giữa người ủng hộ tích cực và người chê tích cực."
  - q: "Kể 5 rủi ro của đầu tư thương hiệu và cách giảm thiểu cho SME."
    a: "Tốn kém/dài hạn (đặt ngân sách theo giai đoạn); khó đo ROI (dùng proxy premium, NPS); dễ tổn thương bởi scandal (quy trình khủng hoảng); cần nhất quán (guidelines, SOP); brand aging/over-extension (refresh định kỳ, giữ lõi)."

checklist:
  - "□ Đã phân biệt brand (nhận thức trong đầu khách) với logo/nhận diện?"
  - "□ Đã có positioning statement, personality (3 tính từ), values (3 giá trị), lời hứa thương hiệu?"
  - "□ Đã chẩn đoán CBBE: tầng thấp nhất là gì và hành động tương ứng?"
  - "□ Đã chấm 5 thành phần Aaker kèm số liệu thật, không chỉ cảm tính?"
  - "□ Đã có brand guidelines (logo, màu, font, tone, ví dụ đúng/sai)?"
  - "□ Đã kiểm tra nhất quán tất cả touchpoint (offline, website, social, bao bì, nhân viên)?"
  - "□ Đã chọn kiến trúc thương hiệu và quy tắc đặt tên/hiển thị logo?"
  - "□ Đã đo baseline: top-of-mind, NPS, sentiment, SOV, brand search, brand premium, repeat rate?"
  - "□ Đã đặt mục tiêu KPI theo quý và so sánh với đối thủ?"
  - "□ Đã đăng ký bảo hộ nhãn hiệu và giữ tên miền/fanpage?"
  - "□ Đã có quy trình khủng hoảng và người phát ngôn?"
  - "□ Nếu rebrand: đã xác định phần giữ/đổi, kiểm tra phản ứng khách cũ, có kế hoạch chuyển tiếp?"
  - "□ Đã ghi rõ giả định, độ tin cậy dữ liệu (verified/illustrative/unverified) trong báo cáo?"
  - "□ Đã kiểm chứng số liệu case trích dẫn (Vinamilk) trước khi dùng?"

excel_google_sheets_templates:
  - name: "Brand Health Dashboard (theo quý)"
    description: "Cột: Quý, Top-of-mind %, Aided %, NPS, Sentiment %, SOV %, Market share %, ESOV, Brand search, Brand search QoQ, Brand premium %, Repeat rate %. Dùng công thức Excel trong mục formulas; thêm biểu đồ đường theo quý và định dạng có điều kiện (đỏ khi dưới benchmark)."
  - name: "Aaker 5-component Scorecard"
    description: "Hàng: 5 thành phần; cột: Chỉ số đo, Giá trị, Điểm 1-5, Đối thủ A, Đối thủ B, Hành động. Dùng Google Forms thu thập khảo sát."
  - name: "Brand Audit Competitor Table"
    description: "Cột: Đối thủ, Giá, Định vị, Personality, Kênh chính, Điểm mạnh, Điểm yếu, Premium so với trung bình; kết hợp perception map 2 trục."
  - name: "Brand Guidelines Checklist"
    description: "Danh mục: Logo (phiên bản, khoảng trống an toàn), Màu (HEX/CMYK), Font, Tone of voice (3-5 nguyên tắc), Ví dụ đúng/sai, Mẫu bài đăng, Bao bì."
