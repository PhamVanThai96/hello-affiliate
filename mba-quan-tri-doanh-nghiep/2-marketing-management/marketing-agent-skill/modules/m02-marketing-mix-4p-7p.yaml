# m02 - Marketing Mix 4P/7P (distill từ 02-marketing-mix-4p-7p.md)
id: "m02"
name_vi: "Marketing Mix 4P/7P (Hỗn hợp tiếp thị)"
name_en: "Marketing Mix 4P/7P"
purpose: >
  Biến chiến lược STP (đã biết khách hàng mục tiêu và định vị) thành hành động cụ thể qua bộ công cụ 4P (Product, Price, Place, Promotion)
  cho sản phẩm hữu hình và 7P (thêm People, Process, Physical Evidence) cho dịch vụ; kiểm tra các P nhất quán với định vị,
  chọn kênh bán (offline, e-commerce, social commerce, omnichannel) và công cụ xúc tiến (performance/affiliate, KOC/UGC, automation, gamification).
when_to_use:
  - "Chủ SME/founder hỏi 'đã biết khách hàng mục tiêu rồi, giờ làm sản phẩm, giá, kênh bán, quảng cáo thế nào?'"
  - "Cần dựng kế hoạch marketing mix 4P/7P hoàn chỉnh cho quán cà phê, nhà hàng, spa, shop online, thương hiệu mỹ phẩm, v.v."
  - "Cần kiểm tra các P có mâu thuẫn nhau không (ví dụ định vị cao cấp nhưng flash sale liên tục)."
  - "Chọn kênh bán: cửa hàng vật lý vs sàn TMĐT vs TikTok Shop/Facebook; có nên làm omnichannel (BOPIS, endless aisle) không."
  - "Chọn công cụ xúc tiến: quảng cáo, khuyến mãi, PR, bán hàng trực tiếp, direct marketing, digital, affiliate, KOC, automation, gamification."
  - "Doanh nghiệp dịch vụ (F&B, spa, giáo dục, khách sạn, app) cần quản lý chất lượng không đồng đều: thêm People/Process/Physical Evidence."
  - "Giải thích 4P khác 7P khác 4C, và khi nào dùng cái nào; phân tích case Grab/Hasaki/Vascara/Cocoon."
  - "Tính nhanh giá từ giá vốn (markup/margin), điểm hòa vốn, mức tăng sản lượng cần có khi giảm giá, CPO/ROAS và lợi nhuận theo kênh."
prerequisites:
  - "m01 - STP: phải biết khách hàng mục tiêu và positioning trước khi chọn 4P/7P (Bước 1 của quy trình)"
related_modules:
  - "m01 - STP: đầu vào bắt buộc, positioning là 'la bàn' để kiểm tra consistency của 7P"
  - "m10 - Pricing Strategies: chi tiết các chiến lược giá (nguồn chỉ nêu 3 phương pháp nền tảng ở đây)"
  - "m04 - Brand Management: Product (branding, packaging) và Physical Evidence gắn với bản sắc thương hiệu"
  - "m05 - Digital Marketing và Growth Hacking: chi tiết SEO/SEM/social/affiliate/funnel cho Promotion số"
  - "m08 - IMC: phối hợp thông điệp xuyên các công cụ Promotion Mix"
  - "m09 - Product Life Cycle: mỗi giai đoạn vòng đời điều chỉnh 4P khác nhau"
  - "m03 - CLV: omnichannel, loyalty, retention nâng giá trị vòng đời khách"
  - "m06 - Consumer Behavior: hành trình mua không tuyến tính (xem review TikTok, so giá Shopee, mua tại cửa hàng)"
  - "m11 - Marketing Mix 4C và UGC content: góc nhìn khách hàng thay cho 4P, nội dung KOC/UGC"

concepts:
  - term_vi: "Hỗn hợp tiếp thị"
    term_en: "Marketing Mix"
    definition: "Tập hợp các công cụ marketing doanh nghiệp (DN) phối hợp để triển khai chiến lược marketing và đạt mục tiêu ở thị trường mục tiêu."
    why_it_matters: >
      Neil Borden đặt thuật ngữ năm 1953 (ông mô tả marketer như 'người pha chế' trộn các thành phần); E. Jerome McCarthy hệ thống hóa thành 4P năm 1960
      trong 'Basic Marketing: A Managerial Approach' để có khung nhớ gọn, giao việc cho từng bộ phận được. Giải quyết vấn đề: chiến lược STP chỉ là ý định,
      cần danh mục quyết định cụ thể (làm gì, giá bao nhiêu, bán ở đâu, nói gì) để thực thi.
  - term_vi: "4P truyền thống"
    term_en: "4Ps (McCarthy, 1960)"
    definition: "Product (sản phẩm), Price (giá), Place (phân phối), Promotion (xúc tiến). Phù hợp sản phẩm hữu hình."
    why_it_matters: "Ngôn ngữ chung toàn cầu của marketing; mỗi P dẫn tới quyết định hành động cụ thể. Góc nhìn DN-centric nên cần bổ sung 4C."
  - term_vi: "7P mở rộng cho dịch vụ"
    term_en: "7Ps (Booms và Bitner, 1981)"
    definition: "4P cộng People (con người), Process (quy trình), Physical Evidence (bằng chứng vật lý)."
    why_it_matters: >
      Booms và Bitner (1981, 'Marketing Strategies and Organization Structures for Service Firms') thấy 4P không quản lý được trải nghiệm dịch vụ:
      dịch vụ vô hình, sản xuất và tiêu dùng đồng thời nên nhân viên, quy trình và dấu hiệu hữu hình chính là 'sản phẩm' khách thấy. Ba P thêm vào giải quyết 4 đặc tính IHIP.
  - term_vi: "4C (góc nhìn khách hàng)"
    term_en: "4Cs (Lauterborn, 1990)"
    definition: "Customer Solution (giải pháp cho khách) thay Product; Customer Cost (tổng chi phí khách bỏ ra) thay Price; Convenience (sự thuận tiện) thay Place; Communication (giao tiếp hai chiều) thay Promotion."
    why_it_matters: "Robert Lauterborn (1990) phản biện 4P nhìn từ phía DN. 4C buộc hỏi từ phía khách: khách cần giải pháp gì, tổng chi phí (tiền, thời gian, công sức) là bao nhiêu. Dùng 4C để soát lại 4P, không thay thế 4P khi cần giao việc nội bộ."
  - term_vi: "Đặc tính dịch vụ IHIP"
    term_en: "Intangibility, Heterogeneity, Inseparability, Perishability"
    definition: "Vô hình (không sờ được); Không đồng nhất (mỗi lần mỗi khác); Không tách rời (sản xuất và tiêu dùng đồng thời, khách có mặt); Không lưu kho được (ghế trống, phòng trống là mất doanh thu vĩnh viễn)."
    why_it_matters: "Là lý do cần 3P bổ sung: vô hình thì cần Physical Evidence làm bằng chứng; không đồng nhất thì cần Process chuẩn hóa và People đào tạo; không tách rời thì nhân viên và khách hàng là một phần sản phẩm; không lưu kho thì cần quản lý công suất và giá theo giờ/mùa (dynamic/off-peak pricing)."
  - term_vi: "Lợi ích cốt lõi và sản phẩm 5 cấp"
    term_en: "Core Benefit and Five Product Levels (Kotler)"
    definition: "Khách không mua sản phẩm mà mua lợi ích; Kotler chia sản phẩm thành 5 lớp từ lợi ích cốt lõi đến sản phẩm tiềm năng."
    why_it_matters: "Giúp tìm chỗ cạnh tranh: cấp 1-3 là tiêu chuẩn tối thiểu để vào cuộc; cạnh tranh thực sự ở cấp 4 (mở rộng) và đổi mới ở cấp 5."
  - term_vi: "Giá là P duy nhất tạo doanh thu"
    term_en: "Price is the only revenue-generating P"
    definition: "Product, Place, Promotion (và People, Process, Physical Evidence) đều tạo chi phí; Price quyết định doanh thu và biên lợi nhuận."
    why_it_matters: "Nhắc rằng chỉnh giá 1% thường tác động lợi nhuận lớn hơn chỉnh các P khác 1% và rằng mọi P tốn tiền phải được 'trả công' bởi giá. Lưu ý: đây là cách nói rút gọn, bản chất doanh thu vẫn đến từ khách mua sản phẩm với đủ P."
  - term_vi: "Omnichannel và Multichannel"
    term_en: "Omnichannel vs Multichannel"
    definition: "Multichannel: bán trên nhiều kênh nhưng dữ liệu, tồn kho, giá rời rạc. Omnichannel: lấy khách làm trung tâm, đồng bộ dữ liệu, tồn kho, giá, hồ sơ khách xuyên kênh để có trải nghiệm liền mạch (seamless)."
    why_it_matters: "Khách hiện đại không đi theo đường thẳng (xem review TikTok, so giá Shopee, ra cửa hàng mua). Thắng không phải 'có mặt mọi nơi' mà là 'dữ liệu đồng bộ mọi nơi'."
  - term_vi: "Marketing 4.0 và O2O"
    term_en: "Marketing 4.0 (Kotler) and Online-to-Offline"
    definition: "Giai đoạn kết hợp hài hòa online và offline; Promotion chuyển từ truyền thông một chiều sang Conversation (đối thoại) và Advocacy (khách thành đại sứ)."
    why_it_matters: "Giải thích vì sao hiệu quả xúc tiến nay đo bằng tương tác, bằng chứng xã hội và tracking dữ liệu thay vì chỉ độ phủ TVC/billboard."
  - term_vi: "Bằng chứng xã hội"
    term_en: "Social Proof"
    definition: "Khách tin hành vi và đánh giá của người giống mình hơn lời tự khen của thương hiệu."
    why_it_matters: "Cơ sở của KOC/UGC, review, rating. Là vũ khí của thương hiệu nhỏ không đủ ngân sách TVC (case Cocoon)."
  - term_vi: "Ốc đảo dữ liệu"
    term_en: "Data Silo"
    definition: "Dữ liệu khách hàng nằm rải rác theo kênh, không nối được (mua Shopee nhưng ra cửa hàng bảo hành không có thông tin)."
    why_it_matters: "Là rủi ro chính của bán đơn kênh hoặc multichannel kém; chạm trần tăng trưởng và trải nghiệm đứt gãy."

formulas:
  - id: "m02_markup_price"
    name_vi: "Giá theo chi phí cộng thêm tỷ lệ phụ giá (Cost-plus / Markup)"
    name_en: "Cost-plus Markup Pricing"
    expression_latex: 'P = C \times (1 + k)'
    expression_python: "P = C * (1 + k)"
    excel: "=C*(1+k)"
    variables:
      - {symbol: "P", meaning: "Giá bán", unit: "VNĐ"}
      - {symbol: "C", meaning: "Giá vốn đơn vị (COGS hoặc tổng chi phí đơn vị đã phân bổ)", unit: "VNĐ"}
      - {symbol: "k", meaning: "Tỷ lệ markup trên giá vốn (0.5 = 50%)", unit: "tỷ lệ"}
    when_to_use: "Định giá nhanh theo phương pháp cost-based; làm giá sàn (floor) để kiểm tra giá value-based/competition-based không lỗ."
    why_it_works: >
      Đơn giản, đảm bảo mỗi đơn vị bán ra phủ chi phí cộng lợi nhuận mục tiêu. Phổ biến với bán buôn/bán lẻ vì dễ giao cho nhân viên áp dụng hàng loạt.
      Nhược điểm cốt lõi: bỏ qua nhu cầu khách và cạnh tranh nên có thể để lại tiền trên bàn (khách sẵn sàng trả cao hơn) hoặc đặt giá cao hơn thị trường chấp nhận.
    assumptions:
      - "Giá vốn đơn vị đã tính đủ (cả chi phí cố định phân bổ nếu muốn lãi thật)."
      - "Khối lượng bán không đổi theo giá (thực tế sai, xem formula hòa vốn giảm giá)."
    pitfalls:
      - "Nhầm markup (trên giá vốn) với margin (trên giá bán): markup 100% chỉ tương ứng margin 50%."
      - "Dùng giá vốn nguyên liệu bỏ quên nhân công, thuê mặt bằng, phí sàn, hao hụt."
    interpretation: "Dùng làm sàn; so với giá đối thủ và giá trị cảm nhận. Nếu cost-plus < giá thị trường nhiều thì còn dư địa tăng giá; nếu > giá thị trường thì phải giảm chi phí hoặc đổi định vị."
    example:
      inputs: {C: 14000, k: 2.5}
      steps:
        - "P = 14000 * (1 + 2.5) = 49000 VNĐ"
        - "Margin tương ứng = (49000 - 14000) / 49000 = 71.4%"
      result: "Ly latte vốn 14,000 VNĐ, markup 250% thì giá 49,000 VNĐ (gross margin 71.4%)."

  - id: "m02_margin_price"
    name_vi: "Giá theo biên lợi nhuận gộp mục tiêu"
    name_en: "Target Gross Margin Pricing"
    expression_latex: 'P = \dfrac{C}{1 - m}'
    expression_python: "P = C / (1 - m)"
    excel: "=C/(1-m)"
    variables:
      - {symbol: "P", meaning: "Giá bán", unit: "VNĐ"}
      - {symbol: "C", meaning: "Giá vốn đơn vị", unit: "VNĐ"}
      - {symbol: "m", meaning: "Biên lợi nhuận gộp mục tiêu trên giá bán (0.7 = 70%)", unit: "tỷ lệ"}
    when_to_use: "Khi chủ DN nghĩ theo margin (ví dụ F&B muốn giá vốn nguyên liệu chiếm 30%) thay vì markup."
    why_it_works: "Margin m = (P - C)/P suy ra C = P(1 - m) nên P = C/(1 - m). Chủ SME thường nghĩ 'tôi muốn giữ lại 70% giá bán', công thức này phản ánh đúng ngôn ngữ đó."
    assumptions: ["m < 1", "C đã đủ"]
    pitfalls:
      - "Biên 70% trên cà phê chưa trừ nhân công, thuê mặt bằng nên không phải lãi ròng."
      - "Nhầm P = C*(1+m) (ra giá thấp hơn mong muốn). Ví dụ C=14,000, m=70% sai ra 23,800 thay vì 46,667."
    interpretation: "Margin 70% tương ứng markup 233% (m/(1-m)). Làm tròn lên giá tâm lý (49,000) thường hợp lý."
    example:
      inputs: {C: 14000, m: 0.7}
      steps:
        - "P = 14000 / (1 - 0.7) = 46,666.7 VNĐ"
        - "Làm tròn giá tâm lý 49,000 thì margin thật = 71.4%, markup = 250%"
      result: "Giá lý thuyết 46,667 VNĐ, chọn niêm yết 49,000 VNĐ."

  - id: "m02_markup_margin_convert"
    name_vi: "Chuyển đổi Markup và Margin"
    name_en: "Markup-Margin Conversion"
    expression_latex: 'm = \dfrac{k}{1 + k}, \quad k = \dfrac{m}{1 - m}'
    expression_python: "m = k / (1 + k); k_from_m = m / (1 - m)"
    excel: "=k/(1+k)"
    variables:
      - {symbol: "k", meaning: "Markup trên giá vốn", unit: "tỷ lệ"}
      - {symbol: "m", meaning: "Margin trên giá bán", unit: "tỷ lệ"}
    when_to_use: "Mỗi khi trao đổi với nhà cung cấp, đối tác, nhân viên dùng hai thuật ngữ khác nhau."
    why_it_works: "Hai tỷ lệ cùng đo khoảng chênh P - C, nhưng chia cho mẫu số khác nhau (C so với P) nên markup luôn lớn hơn margin."
    assumptions: ["k >= 0"]
    pitfalls: ["Margin không thể >= 100%, markup thì có thể > 100%."]
    interpretation: "Markup 25% = margin 20%; markup 100% = margin 50%; markup 233% = margin 70%."
    example:
      inputs: {k: 0.25}
      steps: ["m = 0.25 / 1.25 = 0.20", "Ngược lại m = 0.2 thì k = 0.2/0.8 = 0.25"]
      result: "Markup 25% tương đương margin 20%."

  - id: "m02_breakeven_units"
    name_vi: "Điểm hòa vốn theo sản lượng"
    name_en: "Break-even Quantity"
    expression_latex: 'Q^{*} = \dfrac{F}{P - V}'
    expression_python: "Q = F / (P - V)"
    excel: "=F/(P-V)"
    variables:
      - {symbol: "Q*", meaning: "Sản lượng hòa vốn trong kỳ", unit: "đơn vị"}
      - {symbol: "F", meaning: "Tổng chi phí cố định trong kỳ (thuê mặt bằng, lương cố định, khấu hao)", unit: "VNĐ"}
      - {symbol: "P", meaning: "Giá bán đơn vị", unit: "VNĐ"}
      - {symbol: "V", meaning: "Biến phí đơn vị (nguyên liệu, bao bì, phí sàn theo đơn...)", unit: "VNĐ"}
    when_to_use: "Chốt giá/kênh: cần bán bao nhiêu ly/đơn/tháng để không lỗ; so sánh kênh có chi phí cố định khác nhau."
    why_it_works: "Mỗi đơn vị bán đóng góp (P - V) để trả chi phí cố định; bán đủ F/(P - V) đơn vị thì lỗ lãi bằng 0. Giá càng cao thì hòa vốn càng sớm nhưng thường làm giảm cầu."
    assumptions: ["P, V, F không đổi trong khoảng sản lượng xét", "Một sản phẩm đại diện hoặc cơ cấu bán không đổi"]
    pitfalls: ["Quên biến phí ẩn như phí sàn, voucher, freeship, hao hụt.", "Không phân biệt chi phí cố định thật với chi phí bán cố định."]
    interpretation: "So Q* với công suất/lưu lượng khách thực tế. Nếu Q* > 70-80% công suất tối đa thì mô hình rủi ro cao."
    example:
      inputs: {F: 60000000, P: 49000, V: 17000}
      steps: ["Đóng góp đơn vị = 49000 - 17000 = 32000", "Q* = 60,000,000 / 32,000 = 1,875 ly/tháng", "= 62.5 ly/ngày (30 ngày)"]
      result: "Cần khoảng 63 ly mỗi ngày để hòa vốn (chi phí cố định 60 triệu/tháng)."

  - id: "m02_discount_breakeven_uplift"
    name_vi: "Mức tăng sản lượng cần có để giảm giá không lỗ"
    name_en: "Break-even Volume Uplift for a Price Discount"
    expression_latex: '\dfrac{\Delta Q}{Q} = \dfrac{d}{m - d}'
    expression_python: "uplift = d / (m - d)"
    excel: "=d/(m-d)"
    variables:
      - {symbol: "d", meaning: "Mức giảm giá theo % giá cũ (0.2 = giảm 20%)", unit: "tỷ lệ"}
      - {symbol: "m", meaning: "Contribution margin hiện tại trên giá cũ (P - V)/P", unit: "tỷ lệ"}
      - {symbol: "ΔQ/Q", meaning: "Mức tăng sản lượng tối thiểu để tổng đóng góp không giảm", unit: "tỷ lệ"}
    when_to_use: "Đánh giá flash sale, BOGO, coupon, giảm giá tăng doanh số (Sales Promotion) có đáng làm không."
    why_it_works: >
      Đóng góp cũ = Q*(P-V) = Q*P*m. Sau giảm giá, đóng góp mỗi đơn vị còn P*(m - d). Để tổng không đổi: Q'*(m - d) = Q*m suy ra Q'/Q = m/(m - d)
      suy ra tăng ΔQ/Q = d/(m - d). Margin càng mỏng, giảm giá càng cần tăng sản lượng khổng lồ.
    assumptions: ["Biến phí đơn vị V không đổi", "Bỏ qua tác động dài hạn lên giá tham chiếu và thương hiệu (khách chờ giảm giá)", "m > d"]
    pitfalls:
      - "Nếu d >= m thì không volume nào bù được (lỗ trên mỗi đơn)."
      - "Chỉ đo doanh thu tăng thay vì đóng góp lợi nhuận; flash sale thường kéo khách vốn dĩ sẽ mua giá đầy đủ (cannibalization)."
      - "Bỏ qua chi phí vận hành tăng (nhân sự, hàng hoàn)."
    interpretation: "Margin 50% giảm 20% thì cần tăng 66.7% sản lượng. Nếu dự báo khả thi < ngưỡng này thì không giảm giá, chuyển sang combo/quà tặng/tăng giá trị."
    example:
      inputs: {d: 0.2, m: 0.5}
      steps: ["uplift = 0.2 / (0.5 - 0.2) = 0.6667", "Kiểm: trước 100 đơn vị x 50 = 5000; sau 166.7 đơn vị x (80 - 50) = 5000"]
      result: "Giảm giá 20% với margin 50% cần bán thêm tối thiểu 66.7% sản lượng."

  - id: "m02_price_increase_breakeven"
    name_vi: "Mức giảm sản lượng chịu được khi tăng giá"
    name_en: "Break-even Volume Loss for a Price Increase"
    expression_latex: '\dfrac{\Delta Q}{Q} = -\dfrac{p}{m + p}'
    expression_python: "max_loss = p / (m + p)"
    excel: "=p/(m+p)"
    variables:
      - {symbol: "p", meaning: "Mức tăng giá theo % giá cũ", unit: "tỷ lệ"}
      - {symbol: "m", meaning: "Contribution margin hiện tại trên giá cũ", unit: "tỷ lệ"}
    when_to_use: "Cân nhắc tăng giá (value-based, lạm phát chi phí) mà không giảm lợi nhuận."
    why_it_works: "Tương tự giảm giá nhưng đổi dấu: đóng góp mới mỗi đơn vị P*(m + p); để giữ tổng đóng góp, sản lượng được phép giảm tới Q' = Q*m/(m + p)."
    assumptions: ["V không đổi", "Phản ứng cầu tuyến tính trong vùng nhỏ"]
    pitfalls: ["Tăng giá làm ảnh hưởng cảm nhận và lượng khách quay lại dài hạn."]
    interpretation: "Margin 40%, tăng giá 10% thì cho phép mất tới 20% khách vẫn không lỗ lợi nhuận đóng góp. Margin mỏng thì tăng giá có lợi hơn nhiều so với kích cầu bằng giảm giá."
    example:
      inputs: {p: 0.1, m: 0.4}
      steps: ["max_loss = 0.1 / (0.4 + 0.1) = 0.20"]
      result: "Tăng giá 10% với margin 40% chịu được mất 20% sản lượng."

  - id: "m02_economic_value_price"
    name_vi: "Trần giá theo giá trị kinh tế cho khách (EVC)"
    name_en: "Economic Value to Customer (value-based price ceiling)"
    expression_latex: 'EVC = V_{ref} + V_{diff}, \quad C \le P \le EVC'
    expression_python: "evc = v_ref + v_diff; price_ok = (C <= P) and (P <= evc)"
    excel: "=v_ref+v_diff"
    variables:
      - {symbol: "V_ref", meaning: "Giá của sản phẩm tham chiếu mà khách sẽ mua nếu không chọn mình", unit: "VNĐ"}
      - {symbol: "V_diff", meaning: "Giá trị của khác biệt bằng tiền khách cảm nhận (tiết kiệm thời gian, chất lượng cao hơn, uy tín...)", unit: "VNĐ"}
      - {symbol: "C", meaning: "Giá vốn đơn vị (sàn)", unit: "VNĐ"}
    when_to_use: "Định giá value-based cho sản phẩm khác biệt/premium khi giá đối thủ không phản ánh giá trị thật."
    why_it_works: "Khách chỉ trả tối đa bằng giá trị họ nhận; chia khoảng EVC - P cho khách như 'phần dư tiêu dùng' để thuyết phục họ mua. Nguồn gốc: khuôn khổ economic value (Nagle) mở rộng nội dung gốc, nguồn chỉ nêu khái niệm 'giá = giá trị khách cảm nhận'."
    assumptions: ["Ước lượng V_diff qua phỏng vấn, khảo sát WTP, A/B test giá"]
    pitfalls: ["V_diff thường bị chủ DN đánh giá quá cao; kiểm chứng bằng dữ liệu bán thật.", "Perceived value khó đo, dễ tự huyễn hoặc."]
    interpretation: "Giá tối ưu nằm giữa sàn và trần, thường chia một phần giá trị dư cho khách để họ có động cơ mua."
    example:
      inputs: {v_ref: 40000, v_diff: 18000, C: 14000, P: 49000}
      steps: ["EVC = 40,000 + 18,000 = 58,000", "14,000 <= 49,000 <= 58,000 nên giá hợp lệ; khách còn dư 9,000 VNĐ/ly"]
      result: "Giá 49,000 nằm trong khoảng 14,000-58,000; ly cà phê khác biệt đáng giá tối đa 58,000 với khách."

  - id: "m02_cpo"
    name_vi: "Chi phí trên mỗi đơn hàng (CPO)"
    name_en: "Cost Per Order (CPO / CPA)"
    expression_latex: 'CPO = \dfrac{\text{Chi phí marketing}}{\text{Số đơn hàng thành công}}'
    expression_python: "cpo = marketing_cost / orders"
    excel: "=cost/orders"
    variables:
      - {symbol: "marketing_cost", meaning: "Tổng chi phí marketing của kênh (ads, hoa hồng affiliate, KOC, voucher)", unit: "VNĐ"}
      - {symbol: "orders", meaning: "Số đơn hàng thành công (đã giao, không hoàn)", unit: "đơn"}
    when_to_use: "Đo hiệu quả Performance và Affiliate: trả tiền theo đơn thay vì theo hiển thị (nguồn nhấn mạnh case Vascara)."
    why_it_works: "Chuyển rủi ro chi phí quảng cáo sang đối tác: DN chỉ trả khi có kết quả; CPO biết trước giúp lập kế hoạch lợi nhuận. Với affiliate trả % hoa hồng thì CPO = commission * AOV."
    assumptions: ["Tracking chính xác (UTM, pixel, mã giảm giá riêng)", "Đếm đơn đã giao thành công, không tính đơn hủy/hoàn"]
    pitfalls: ["Đếm đơn chốt nhưng hoàn cao (social commerce) làm CPO ảo.", "Không tách đơn khách cũ vốn đã định mua (attribution sai)."]
    interpretation: "So CPO với đóng góp lợi nhuận trước chi phí marketing trên mỗi đơn; CPO phải nhỏ hơn mức đó thì mới lãi."
    example:
      inputs: {AOV: 800000, commission: 0.12}
      steps: ["CPO affiliate = 0.12 x 800,000 = 96,000 VNĐ/đơn"]
      result: "Mỗi đơn qua affiliate tốn 96,000 VNĐ hoa hồng."

  - id: "m02_roas_breakeven"
    name_vi: "ROAS và ROAS hòa vốn"
    name_en: "Return on Ad Spend and Break-even ROAS"
    expression_latex: 'ROAS = \dfrac{R}{A}, \quad ROAS_{BE} = \dfrac{1}{cm}'
    expression_python: "roas = revenue / ad_spend; roas_be = 1 / cm"
    excel: "=revenue/ad_spend"
    variables:
      - {symbol: "R", meaning: "Doanh thu quy cho quảng cáo", unit: "VNĐ"}
      - {symbol: "A", meaning: "Chi phí quảng cáo (hoặc hoa hồng)", unit: "VNĐ"}
      - {symbol: "cm", meaning: "Contribution margin trước chi phí quảng cáo / giá bán (sau COGS, voucher, ship...)", unit: "tỷ lệ"}
    when_to_use: "Quyết định có tăng ngân sách ads/affiliate không; mức ROAS tối thiểu để kênh có lãi."
    why_it_works: "Mỗi đồng ads sinh R/A đồng doanh thu, trong đó cm phần là đóng góp. Hòa vốn khi R*cm = A suy ra ROAS = 1/cm."
    assumptions: ["Đơn vị đo doanh thu nhất quán (đã giao, không hoàn)", "Bỏ qua giá trị khách quay lại (LTV)"]
    pitfalls: ["Dùng ROAS nền tảng tự báo (thường cao hơn thực tế do attribution rộng).", "Bỏ qua LTV nên cắt kênh tốt cho khách lặp lại; hoặc ngược lại coi LTV là cớ chạy lỗ mãi."]
    interpretation: "ROAS > ROAS hòa vốn thì kênh có lãi đóng góp; cm 47.5% có ROAS hòa vốn 2.1; ROAS thực 4 thì đóng góp còn lại dương."
    example:
      inputs: {price: 800000, cogs: 360000, voucher: 40000, ship: 20000, ad_cost_per_order: 200000}
      steps:
        - "cm trước ads = (800,000 - 360,000 - 40,000 - 20,000)/800,000 = 380,000/800,000 = 47.5%"
        - "ROAS hòa vốn = 1/0.475 = 2.105"
        - "Google Shopping ROAS 4 nghĩa là ads = 800,000/4 = 200,000 mỗi đơn; đóng góp sau ads = 380,000 - 200,000 = 180,000"
        - "Affiliate 12%: ROAS tương ứng = 800,000/96,000 = 8.33; đóng góp sau hoa hồng = 380,000 - 96,000 = 284,000"
      result: "ROAS hòa vốn 2.1; Google Shopping ROAS 4 lãi 180k/đơn; affiliate lãi 284k/đơn (nhưng cần đủ publisher)."

  - id: "m02_cvr"
    name_vi: "Tỷ lệ chuyển đổi (CVR)"
    name_en: "Conversion Rate"
    expression_latex: 'CVR = \dfrac{\text{Số đơn (hoặc hành động mục tiêu)}}{\text{Số lượt truy cập (click/visit)}}'
    expression_python: "cvr = conversions / visits"
    excel: "=conversions/visits"
    variables:
      - {symbol: "conversions", meaning: "Số hành động mục tiêu (mua, để lại SĐT)", unit: "lượt"}
      - {symbol: "visits", meaning: "Số lượt click/truy cập", unit: "lượt"}
    when_to_use: "Ưu tiên luồng tracking để biết dòng tiền marketing nào sinh CVR cao nhất (nguồn nhấn mạnh sau phần Promotion 4.0)."
    why_it_works: "Tách chất lượng lưu lượng khỏi số lượng: cùng 10,000 click, CVR 1% khác 3% gấp 3 lần doanh thu."
    assumptions: ["Dùng UTM nhất quán để phân kênh"]
    pitfalls: ["So CVR giữa kênh khác bản chất (tìm kiếm có ý định mua vs social giải trí).", "Mẫu quá nhỏ."]
    interpretation: "Dùng để so kênh và chiến dịch cùng loại; kết hợp CPO và tỷ lệ hoàn để ra hiệu quả thật."
    example:
      inputs: {visits: 10000, conversions: 250}
      steps: ["CVR = 250 / 10000 = 2.5%"]
      result: "CVR 2.5%."

  - id: "m02_channel_contribution"
    name_vi: "Đóng góp lợi nhuận trên mỗi đơn theo kênh"
    name_en: "Channel Contribution per Order"
    expression_latex: 'CM_{order} = P - C - \sum f_i \cdot P - r \cdot c_r - L'
    expression_python: "cm = P - C - sum(f) * P - r * cr - L"
    excel: "=P-C-SUM(fees)*P-r*cr-L"
    variables:
      - {symbol: "P", meaning: "Giá bán", unit: "VNĐ"}
      - {symbol: "C", meaning: "Giá vốn", unit: "VNĐ"}
      - {symbol: "f_i", meaning: "Các khoản phí tính theo % giá: phí sàn, hoa hồng KOC, ads, freeship, mặt bằng + nhân sự phân bổ (offline)", unit: "tỷ lệ"}
      - {symbol: "r", meaning: "Tỷ lệ hoàn/hủy đơn", unit: "tỷ lệ"}
      - {symbol: "c_r", meaning: "Chi phí mỗi đơn hoàn (ship hai chiều, hàng hỏng, đóng gói lại)", unit: "VNĐ"}
      - {symbol: "L", meaning: "Chi phí xử lý cố định theo đơn (đóng gói, pick-pack)", unit: "VNĐ"}
    when_to_use: "So sánh lợi nhuận thực của 3 kênh (offline, sàn, social) trước khi phân bổ ngân sách và tồn kho."
    why_it_works: "Nguồn chỉ mô tả định tính (offline chi phí cố định cao, sàn phí ẩn, social hoàn cao). Công thức này lượng hóa để thấy kênh có doanh thu cao chưa chắc đóng góp cao."
    assumptions: ["Phí phân bổ đúng theo đơn", "Con số phí/ratio trong ví dụ là giả định minh họa, phải thay bằng số thật của DN"]
    pitfalls: ["Bỏ qua phí ẩn nội sàn; bỏ qua chi phí hoàn đơn của social.", "Phân bổ chi phí cố định offline theo đơn không phản ánh công suất."]
    interpretation: "Chọn kênh theo đóng góp x khối lượng khả thi x giá trị dữ liệu/LTV, không chỉ theo biên đơn lẻ."
    example:
      inputs: {P: 300, C: 105, unit: "nghìn VNĐ"}
      steps:
        - "Shopee: phí sàn 14% (42) + freeship 3% (9) + ads 10% (30) + hủy/hoàn 3% (9) + đóng gói 8 -> 300 - 105 - 42 - 9 - 30 - 9 - 8 = 97 (32.3%)"
        - "TikTok Shop: phí 8% (24) + KOC 12% (36) + livestream 6% (18) + hoàn 15% x 60 = 9 + đóng gói 8 -> 300 - 105 - 24 - 36 - 18 - 9 - 8 = 100 (33.3%)"
        - "Cửa hàng: mặt bằng 15% (45) + nhân sự 10% (30) + đóng gói 2 -> 300 - 105 - 45 - 30 - 2 = 118 (39.3%)"
      result: "Offline 118k > TikTok 100k > Shopee 97k mỗi đơn (giả định minh họa); nhưng cần nhân với sản lượng khả thi của từng kênh."

  - id: "m02_product_mix_dimensions"
    name_vi: "Các chiều của danh mục sản phẩm"
    name_en: "Product Mix Dimensions (width, length, depth, consistency)"
    expression_latex: 'width = N_{lines},\; length = \sum n_i,\; avg\ length = \dfrac{length}{width}'
    expression_python: "width = len(lines); length = sum(lines); avg_length = length / width"
    excel: "=COUNTA(lines)"
    variables:
      - {symbol: "N_lines", meaning: "Số dòng sản phẩm (width)", unit: "dòng"}
      - {symbol: "n_i", meaning: "Số mặt hàng (SKU) trong dòng i", unit: "SKU"}
      - {symbol: "depth", meaning: "Số biến thể (size, hương vị, màu) mỗi mặt hàng (đếm, không có công thức tổng quát)", unit: "biến thể"}
    when_to_use: "Mô tả và quyết định mở rộng/thu hẹp danh mục sản phẩm (Product Line, Product Mix)."
    why_it_works: "Tách bốn câu hỏi: bao nhiêu dòng (width), mỗi dòng bao nhiêu mặt hàng (length), mỗi mặt hàng bao nhiêu biến thể (depth), các dòng liên quan nhau đến đâu (consistency). Nguồn viết 'width x length x depth x consistency' nhưng đây là bốn chiều mô tả, không phải phép nhân."
    assumptions: ["Đếm cùng một cấp (SKU)"]
    pitfalls: ["Nguồn gán 'Product Line = width' dễ gây hiểu nhầm: width là số dòng, length là số item trong một dòng.", "Danh mục quá dài làm tồn kho tăng và khách khó chọn (menu overload)."]
    interpretation: "Mở rộng width để vào nhu cầu mới; kéo dài length để phủ phân khúc giá; tăng depth để đáp ứng sở thích; tăng consistency để hưởng lợi thương hiệu, phân phối chung."
    example:
      inputs: {lines: [4, 3, 2]}
      steps: ["width = 3 dòng (bột giặt, nước rửa chén, nước lau sàn)", "length = 4 + 3 + 2 = 9 SKU", "avg length = 9 / 3 = 3.0"]
      result: "Danh mục 3 dòng, 9 SKU, trung bình 3 SKU/dòng."

  - id: "m02_consistency_score"
    name_vi: "Điểm nhất quán 7P (heuristic)"
    name_en: "7P Consistency Score (heuristic, not in source)"
    expression_latex: 'CS = \dfrac{\sum_{i=1}^{7} s_i}{2 \times 7} \times 100\%'
    expression_python: "cs = sum(s) / (2 * len(s)) * 100"
    excel: "=SUM(scores)/(2*COUNT(scores))"
    variables:
      - {symbol: "s_i", meaning: "Điểm của từng P so với positioning: 0 mâu thuẫn, 1 trung tính, 2 củng cố", unit: "điểm"}
    when_to_use: "Biến Ma trận kiểm tra Consistency định tính của nguồn thành điểm số để theo dõi theo thời gian hoặc so phương án."
    why_it_works: "Nguồn kiểm tra nhất quán bằng ma trận ✅/❌. Công thức này là cách lượng hóa do người distill thêm vào; không phải chuẩn học thuật. Tác dụng: phát hiện P yếu nhất để sửa trước."
    assumptions: ["Chấm điểm độc lập bởi 2-3 người để giảm thiên kiến", "Mọi P quan trọng ngang nhau (có thể gán trọng số)"]
    pitfalls: ["Điểm cao giả: 7P nhất quán nhưng cùng lệch khỏi nhu cầu khách (chưa kiểm định với STP).", "Một P mâu thuẫn nặng có thể phá hết hiệu ứng dù điểm tổng cao: luôn nhìn các P bằng 0."]
    interpretation: "Tham khảo: >= 85% nhất quán tốt; 60-85% cần sửa các P bằng 0 hoặc 1; < 60% thương hiệu có nguy cơ làm khách bối rối (ngưỡng heuristic)."
    example:
      inputs: {s: [2, 2, 1, 2, 2, 2, 0]}
      steps: ["sum = 11", "CS = 11/14 = 78.6%", "P bằng 0 là Physical Evidence: sửa trước"]
      result: "Nhất quán 78.6%; cần sửa Physical Evidence."

frameworks:
  - id: "m02_marketing_mix_evolution"
    name_vi: "Marketing Mix: lịch sử 4P, 7P, 4C"
    name_en: "Marketing Mix Evolution (Borden 1953, McCarthy 1960, Booms & Bitner 1981, Lauterborn 1990)"
    origin: >
      Neil Borden đặt tên 'Marketing Mix' năm 1953; E. Jerome McCarthy rút gọn thành 4P năm 1960 để dễ dạy và giao việc; Booms và Bitner mở rộng 7P năm 1981
      vì 4P không đủ cho dịch vụ vô hình; Robert Lauterborn đề xuất 4C năm 1990 để đảo góc nhìn từ DN sang khách hàng.
    components:
      - "4P (1960, McCarthy): sản phẩm hữu hình, góc nhìn DN."
      - "7P (1981, Booms & Bitner): 4P + People, Process, Physical Evidence cho dịch vụ."
      - "4C (1990, Lauterborn): Customer Solution, Customer Cost, Convenience, Communication, góc nhìn khách hàng."
      - "Tương ứng: Product-Customer Solution; Price-Customer Cost; Place-Convenience; Promotion-Communication."
    when_to_use: "Giải thích cho người mới; chọn khung phù hợp: sản phẩm hữu hình dùng 4P; dịch vụ/app dùng 7P; soát lại góc nhìn khách bằng 4C."
    how_to_apply:
      - "Xác định bản chất đề: hữu hình, dịch vụ, hay lai (cà phê = sản phẩm + dịch vụ thì dùng 7P)."
      - "Lập 4P/7P từ góc DN để giao việc."
      - "Soát lại bằng 4C: giải pháp có đúng nhu cầu, tổng chi phí khách chịu (tiền, thời gian, công sức) có chấp nhận được, mua có thuận tiện, giao tiếp hai chiều không."
    how_to_read_results: "Nếu 4P đẹp mà 4C yếu (khách thấy tốn kém/khó mua) thì chỉnh lại 4P từ phía khách."
    pitfalls:
      - "Dùng 4P cho dịch vụ rồi bỏ quên trải nghiệm."
      - "Coi 4C thay thế hoàn toàn 4P: thực tế 4C là lăng kính soát lại."
      - "Ghi chú: nguồn nói Promotion trong Marketing 4.0 'tiến hóa thành Conversation và Advocacy'; đây là cách diễn đạt của nguồn, trong lý thuyết Kotler Marketing 4.0 thường dùng 5A (Aware, Appeal, Ask, Act, Advocate) và 4C mới (Co-creation, Currency, Communal activation, Conversation)."
    example: "Quán phở: 4P = phở, 45k, mặt tiền phố, banner; soát 4C: tổng chi phí khách = 45k + 25 phút xếp hàng + gửi xe thì giá 'rẻ' chưa chắc rẻ."

  - id: "m02_five_product_levels"
    name_vi: "Sản phẩm 5 cấp độ (Kotler)"
    name_en: "Five Product Levels"
    origin: "Philip Kotler trong Marketing Management; ra đời để chỉ ra khách mua lợi ích chứ không mua vật thể, và cạnh tranh nằm ở các lớp ngoài cùng."
    components:
      - "1. Lợi ích cốt lõi (Core Benefit): nhu cầu thật khách mua (khách sạn: nơi nghỉ ngơi qua đêm)."
      - "2. Sản phẩm cơ bản (Basic Product): hình thức tối thiểu (giường, phòng tắm, khăn)."
      - "3. Sản phẩm kỳ vọng (Expected Product): thuộc tính khách mặc định (sạch, Wi-Fi, TV, điều hòa)."
      - "4. Sản phẩm mở rộng (Augmented): vượt kỳ vọng (spa, hồ bơi, concierge, minibar miễn phí; bảo hành, giao hàng, lắp đặt)."
      - "5. Sản phẩm tiềm năng (Potential): cải tiến tương lai (AI personal assistant, VR tour, robot phục vụ)."
    when_to_use: "Thiết kế hoặc làm mới sản phẩm; tìm điểm khác biệt khi cấp 1-3 giống đối thủ."
    how_to_apply:
      - "Viết lợi ích cốt lõi mà khách thực sự thuê sản phẩm để làm (job-to-be-done)."
      - "Liệt kê thuộc tính cơ bản và kỳ vọng bắt buộc có (thiếu thì khách bỏ đi, có cũng không thêm điểm)."
      - "Chọn 1-3 yếu tố mở rộng (cấp 4) phù hợp positioning và ngân sách."
      - "Lập danh sách ý tưởng cấp 5 làm lộ trình đổi mới."
    how_to_read_results: "Chênh lệch giữa mình và đối thủ nằm ở cấp 4-5; cấp 3 chỉ đủ 'vào cuộc'. Đầu tư cấp 4 mà thiếu cấp 3 là lệch ưu tiên."
    pitfalls:
      - "Đầu tư cấp 4 (khuếch trương) khi cấp 3 (sạch, nhanh) còn yếu."
      - "Lẫn lộn cấp 2 và 3."
      - "Mở rộng quá nhiều làm tăng chi phí mà khách không trả thêm."
    example: "Quán cà phê specialty: cốt lõi = không gian làm việc và thư giãn; cơ bản = cà phê + ghế; kỳ vọng = Wi-Fi, ổ điện, sạch; mở rộng = rang tại chỗ, barista giải thích nguồn gốc hạt, thẻ tích điểm; tiềm năng = đặt trước chỗ ngồi qua app."

  - id: "m02_product_decisions"
    name_vi: "Các quyết định về Sản phẩm"
    name_en: "Product Decisions (Line, Mix, Branding, Packaging, Quality, Features, Design)"
    origin: "Khung quyết định Product trong 4P (McCarthy/Kotler): tách việc 'sản phẩm' thành các quyết định quản trị cụ thể."
    components:
      - "Product Line: số dòng sản phẩm."
      - "Product Mix: tổng danh mục (width, length, depth, consistency)."
      - "Branding: tên, logo, kiến trúc thương hiệu."
      - "Packaging: bao bì, thiết kế."
      - "Quality: mức chất lượng so với giá."
      - "Features: tính năng giữ, thêm, loại bỏ."
      - "Design: UX/UI, thẩm mỹ, công năng."
    when_to_use: "Khi thiết kế sản phẩm mới hoặc rà soát danh mục."
    how_to_apply:
      - "Từ STP: nhu cầu và positioning chốt chất lượng/giá mục tiêu."
      - "Chốt chiều rộng/dài/sâu danh mục; loại bớt SKU ít bán."
      - "Thiết kế branding, packaging, features, design nhất quán định vị."
      - "Kiểm tra với 5 cấp độ sản phẩm."
    how_to_read_results: "Danh mục tốt: mỗi SKU có vai trò (thu hút khách, tạo lợi nhuận, lấp phân khúc); loại SKU không vai trò."
    pitfalls:
      - "Mở rộng danh mục theo trực giác (80-100 món) gây menu overload, tồn kho cao."
      - "Chất lượng không khớp giá (premium nhưng đóng gói rẻ)."
    example: "Shop 3 dòng, 9 SKU: bỏ 2 SKU bán dưới 3% doanh thu để giảm tồn kho 15% (giả định minh họa)."

  - id: "m02_pricing_three_methods"
    name_vi: "3 phương pháp định giá nền tảng"
    name_en: "Cost-based, Value-based, Competition-based Pricing"
    origin: "Khung phân loại cổ điển (Kotler): giá chịu 3 lực kéo: chi phí (sàn), giá trị cảm nhận của khách (trần), giá đối thủ (tham chiếu). Chi tiết chiến lược giá xem m10."
    components:
      - "Cost-based: Giá = Chi phí + % markup. Ưu: đơn giản, bảo đảm lợi nhuận. Nhược: bỏ qua nhu cầu và cạnh tranh."
      - "Value-based: Giá = giá trị khách cảm nhận. Ưu: tối ưu doanh thu, hợp premium. Nhược: khó đo perceived value."
      - "Competition-based: Giá = giá đối thủ +/- điều chỉnh. Ưu: nhanh, dễ áp dụng. Nhược: phụ thuộc đối thủ, dễ chiến tranh giá."
    when_to_use: "Bước đầu chọn khung giá trước khi đi vào chiến lược chi tiết (m10)."
    how_to_apply:
      - "Tính giá sàn bằng cost-based (m02_markup_price hoặc m02_margin_price)."
      - "Ước lượng trần giá bằng value-based (m02_economic_value_price) qua khảo sát, phỏng vấn, test."
      - "Thu thập giá đối thủ cùng phân khúc làm tham chiếu."
      - "Chọn giá trong khoảng sàn - trần, nghiêng theo positioning (premium: gần trần; budget: gần sàn hoặc thấp hơn đối thủ)."
      - "Kiểm tra hòa vốn và elasticity bằng m02_discount_breakeven_uplift, m02_price_increase_breakeven."
    how_to_read_results: "Nếu sàn > trần thì mô hình không khả thi (cần giảm chi phí hoặc tăng giá trị). Nếu trần >> đối thủ thì cân nhắc tăng giá."
    pitfalls:
      - "Chỉ dùng cost-plus rồi ngạc nhiên vì khách chê đắt."
      - "Chạy theo giá đối thủ khiến cạnh tranh giá tiêu hao biên lợi nhuận."
      - "Quên 'giá là P duy nhất tạo doanh thu': giảm giá nhẹ có thể ăn mòn hết lợi nhuận."
    example: "Latte vốn 14k: sàn margin 70% = 46.7k, đối thủ cùng phân khúc 55k, trần theo giá trị 58k; chọn 49k (định vị dễ tiếp cận) thấp hơn đối thủ 11%."

  - id: "m02_distribution_channels"
    name_vi: "Kênh phân phối và chiến lược độ phủ"
    name_en: "Distribution Channel Levels and Coverage Strategies"
    origin: "Khung kênh phân phối cổ điển của Kotler: số cấp trung gian và mật độ điểm bán."
    components:
      - "Level 0 (Direct): nhà sản xuất tới người tiêu dùng."
      - "Level 1: nhà sản xuất, nhà bán lẻ, người tiêu dùng."
      - "Level 2: nhà sản xuất, nhà bán sỉ, nhà bán lẻ, người tiêu dùng."
      - "Level 3: nhà sản xuất, đại lý, nhà bán sỉ, nhà bán lẻ, người tiêu dùng."
      - "Intensive: có mặt mọi điểm bán; hợp FMCG và convenience goods (Coca-Cola, mì Hảo Hảo). Lưu ý: nguồn viết FMCG là 'Fast Moving Customer Good', đúng là Fast Moving Consumer Goods."
      - "Selective: chọn lọc; hợp shopping goods, thương hiệu có nhận diện (Samsung, Nike)."
      - "Exclusive: rất ít điểm bán, kiểm soát chặt; hợp hàng xa xỉ, chuyên biệt (Hermès, Rolex)."
    when_to_use: "Chọn cách đưa sản phẩm tới khách đúng nơi, đúng lúc, đúng số lượng."
    how_to_apply:
      - "Xác định thói quen mua của khách mục tiêu (mua ở đâu, ra quyết định thế nào)."
      - "Chọn độ phủ theo loại hàng và positioning (rẻ, dùng hàng ngày thì intensive; premium thì exclusive)."
      - "Chọn số cấp trung gian: ít cấp thì kiểm soát giá/trải nghiệm cao hơn, nhiều cấp thì phủ rộng nhưng biên bị chia."
      - "Cân đối chi phí kênh với biên lợi nhuận (m02_channel_contribution)."
    how_to_read_results: "Kênh phù hợp khi đạt độ phủ khách mục tiêu mà không phá giá/hình ảnh; nhiều trung gian có thể khiến giá niêm yết cao hoặc mất kiểm soát hình ảnh."
    pitfalls:
      - "Premium nhưng bán đại trà giảm giá ở mọi điểm làm phá định vị."
      - "Phân phối intensive khi chưa đủ vốn lưu động và logistics."
    example: "Trà đóng chai của SME chọn Level 1 (siêu thị mini, cửa hàng tiện lợi) thay vì Level 3 để giữ biên 20-25% (số minh họa)."

  - id: "m02_channel_comparison"
    name_vi: "So sánh 3 kênh bán hàng trọng điểm"
    name_en: "Physical Store vs E-commerce vs Social Commerce"
    origin: "Phân tích trong nguồn (bối cảnh Marketing 4.0 tại Việt Nam): ba trụ cột kênh hiện nay với động lực mua, vốn, tốc độ phủ và trung thành khác nhau."
    components:
      - "Cửa hàng vật lý: ưu điểm touch and feel, mua và sở hữu ngay, lòng tin thương hiệu; nhược điểm chi phí cố định cao, giới hạn bán kính 3-5km, khó thu dữ liệu nếu không có thẻ thành viên."
      - "E-commerce (Web/App/Shopee/Lazada): ưu điểm mở rộng không giới hạn, dữ liệu hành vi cho retargeting, cá nhân hóa; nhược điểm cạnh tranh giá khốc liệt, phí ẩn nội sàn (phí sàn, freeship, ads), phụ thuộc logistics."
      - "Social Commerce (TikTok Shop/Facebook/IG): ưu điểm mua ngẫu hứng, lan truyền, tương tác thời gian thực qua livestream; nhược điểm tỷ lệ hoàn đơn (bom/hoàn) cao, tuổi thọ nội dung ngắn, phụ thuộc thuật toán."
      - "Động lực mua: offline = có chủ đích, cần gấp; e-commerce = có chủ đích, tìm giá tốt; social = cảm xúc, FOMO."
      - "Vốn đầu tư: offline rất cao; e-commerce trung bình; social thấp."
      - "Tốc độ phủ: offline chậm; e-commerce nhanh theo ngân sách ads; social đột phá nhờ thuật toán."
      - "Trung thành: offline rất cao; e-commerce trung bình (đổi vì mã giảm giá); social thấp (theo KOL/KOC)."
    when_to_use: "Chọn kênh khởi đầu và lộ trình mở rộng cho SME."
    how_to_apply:
      - "Xác định giai đoạn: startup vốn ít thì một kênh social/sàn; DN đã có dòng tiền thì thêm offline hoặc website/app."
      - "Tính m02_channel_contribution cho từng kênh bằng số thật."
      - "Chọn kênh chính (sinh doanh thu), kênh hỗ trợ (sinh nhận biết hoặc lòng tin)."
      - "Đo CVR, CPO, tỷ lệ hoàn từng kênh hằng tuần."
    how_to_read_results: "Kênh tốt không chỉ là đóng góp cao: phải xét tốc độ phủ, vốn, rủi ro nền tảng, khả năng sở hữu dữ liệu khách."
    pitfalls:
      - "Phụ thuộc 100% vào một sàn/thuật toán."
      - "Đem tỷ lệ hoàn của social vào kế hoạch dòng tiền quá lạc quan."
      - "Bán đa kênh mà giá khác nhau gây mất niềm tin."
    example: "Shop mỹ phẩm nhỏ khởi động với TikTok Shop (vốn thấp, phủ nhanh), thêm Shopee khi có review, mở cửa hàng khi ổn định dòng tiền."

  - id: "m02_omnichannel"
    name_vi: "Omnichannel (đa kênh hợp nhất)"
    name_en: "Omnichannel Retailing"
    origin: "Gắn với Marketing 4.0 (Kotler) và hành trình khách không tuyến tính: khách xem review TikTok, so giá Shopee, ra cửa hàng mua. Multichannel ra đời trước nhưng dữ liệu rời rạc."
    components:
      - "Nguyên tắc: 'dữ liệu đồng bộ mọi nơi' chứ không chỉ 'có mặt mọi nơi'; trải nghiệm đồng nhất xuyên cửa hàng, e-commerce, social commerce."
      - "BOPIS (Buy Online, Pick-up In Store): đặt online, lấy tại cửa hàng để đỡ phí ship."
      - "Endless Aisle: hết size/màu ở cửa hàng, nhân viên dùng tablet đặt từ kho trung tâm giao về nhà."
      - "Showrooming (theo nguồn): khách trải nghiệm ở cửa hàng rồi mở app chính thương hiệu quét mã, áp mã giảm, đặt giao về nhà. Ghi chú: theo nghĩa phổ biến, showrooming thường là xem hàng ở cửa hàng rồi mua online ở nơi khác rẻ hơn; trường hợp nguồn mô tả (mua lại trong app thương hiệu) là hành vi có lợi cho DN vì giữ khách trong hệ sinh thái."
      - "Hạ tầng: đồng bộ tồn kho, giá, hồ sơ khách (CRM/số điện thoại), app là trung tâm điều khiển."
    when_to_use: "DN đã có từ 2 kênh trở lên và gặp tình trạng giá lệch, tồn kho tách rời, dữ liệu khách rời rạc."
    how_to_apply:
      - "Thống nhất mã khách (số điện thoại) và dữ liệu giao dịch giữa các kênh."
      - "Đồng giá hoặc quy tắc giá rõ ràng giữa các kênh để khách không bị 'hớ'."
      - "Kết nối tồn kho cửa hàng với đơn online (giao từ cửa hàng gần nhất)."
      - "Triển khai tính năng đơn giản trước: BOPIS, tra cứu tồn kho, quét QR nhận ưu đãi."
      - "Đo: tỷ lệ khách mua đa kênh, giá trị đơn, tần suất, CLV so khách đơn kênh."
    how_to_read_results: "Khách mua đa kênh thường có CLV cao hơn (cần đo số liệu riêng của DN; không có số trong nguồn)."
    pitfalls:
      - "Hiểu nhầm omnichannel = có mặt ở mọi nơi."
      - "Đầu tư công nghệ lớn khi chưa có dữ liệu khách thống nhất."
      - "Xung đột kênh: nhân viên cửa hàng thấy online ăn doanh số; cần cơ chế chia sẻ doanh thu nội bộ."
    example: "Chuỗi 5 cửa hàng thời trang dùng cùng số điện thoại khách trên POS và website, cho BOPIS và tablet đặt hàng khi hết size."

  - id: "m02_promotion_mix"
    name_vi: "Promotion Mix (hỗn hợp xúc tiến)"
    name_en: "Promotion / Communication Mix"
    origin: "Khung truyền thông cổ điển trong 4P: Promotion có ba mục tiêu thông báo, thuyết phục, nhắc nhở (inform, persuade, remind)."
    components:
      - "Advertising: quảng cáo trả phí (TV, digital, print, outdoor); reach rộng, kiểm soát thông điệp; đắt, một chiều, ad fatigue."
      - "Sales Promotion: khuyến mãi, coupon, flash sale, BOGO; tạo urgency, tăng doanh số ngắn hạn; giảm brand value, khách chờ giảm giá."
      - "PR: quan hệ công chúng, media relations, sự kiện; đáng tin, tăng uy tín; khó kiểm soát, khó đo ROI."
      - "Personal Selling: bán hàng trực tiếp, tư vấn 1-1; cá nhân hóa, xử lý phản đối; chi phí mỗi lần tiếp xúc cao, khó scale."
      - "Direct Marketing: email, SMS, telemarketing, catalog; nhắm mục tiêu, đo được; rủi ro spam, quyền riêng tư."
      - "Digital Marketing: social, SEO, content, influencer; chi phí hiệu quả, đo được, tiềm năng lan truyền; cần chuyên môn, thay đổi nhanh."
    when_to_use: "Chọn công cụ truyền thông và phân bổ ngân sách."
    how_to_apply:
      - "Đặt mục tiêu truyền thông theo phễu: biết đến, cân nhắc, mua, giữ chân, giới thiệu."
      - "Chọn công cụ theo giá trị đơn hàng và mức độ cân nhắc: giá trị thấp, mua nhanh thì digital và sales promotion; giá trị cao, cân nhắc lâu thì personal selling, content, automation."
      - "Gán ngân sách theo ưu tiên và đo (CPO, CVR, ROAS)."
      - "Thống nhất thông điệp xuyên công cụ (IMC, m08)."
    how_to_read_results: "Công cụ có đo được thì tối ưu bằng dữ liệu; công cụ khó đo (PR, brand) đánh giá bằng chỉ báo gián tiếp (lượt tìm kiếm thương hiệu, đề cập)."
    pitfalls:
      - "Sales promotion liên tục tập thói quen khách chờ giảm giá."
      - "Dồn ngân sách vào một công cụ."
      - "Không tracking nên không biết kênh nào hiệu quả."
    example: "Quán mới: digital (TikTok, Google Maps), PR địa phương, khuyến mãi ngắn hạn khai trương; không giảm giá thường trực."

  - id: "m02_promotion_4_0"
    name_vi: "Chiến lược Promotion 4.0 (Performance, KOC/UGC, Automation, Gamification)"
    name_en: "Promotion in Marketing 4.0"
    origin: "Kotler Marketing 4.0: truyền thông chuyển từ một chiều (TVC, billboard) sang hai chiều, cá nhân hóa, khách làm đại sứ. Nguồn nhấn mạnh thành công khi Promotion 'vô hình' và luồng tracking."
    components:
      - "Performance và Affiliate: cần đẩy số nhanh, tối ưu chi phí theo đơn (CPA/CPO); phù hợp thời trang, mỹ phẩm, SaaS, FMCG; trả tiền khi có đơn thành công; tracking bằng UTM, tham số srsltid của Google; công cụ Google Ads, Facebook Ads, mạng lưới Publisher/Affiliate."
      - "KOC/UGC: ngành bão hòa, khách cần bằng chứng xã hội; phù hợp F&B, làm đẹp, gia dụng; gửi sample hoặc mã affiliate cho KOC/micro-influencer."
      - "Marketing Automation và Content Nurturing: hành trình mua dài, nhiều điểm chạm; phù hợp bất động sản, xe hơi, dịch vụ tài chính; dùng CRM, email, Zalo ZNS."
      - "Gamification: tăng retention và tương tác hằng ngày trên app/web; phù hợp sàn TMĐT, app gọi xe, ví điện tử."
      - "Nguyên tắc chung: ưu tiên luồng tracking dữ liệu để biết dòng tiền marketing nào sinh CVR cao nhất."
    when_to_use: "Chọn vũ khí Promotion theo hoàn cảnh và loại sản phẩm."
    how_to_apply:
      - "Phân loại sản phẩm: mua nhanh giá thấp hay cân nhắc lâu giá cao; ngành bão hòa hay mới."
      - "Chọn 1-2 chiến lược chính theo bảng hoàn cảnh; thiết lập tracking (UTM, mã giảm riêng, pixel) trước khi chi tiền."
      - "Với automation: thiết kế phễu theo ngày (ví dụ ngày 1 email, ngày 3 Zalo ZNS, ngày 7 gọi mời tham quan) và dồn ưu đãi vào điểm chốt cuối."
      - "Với KOC/UGC: gửi sample số lượng lớn tới micro-influencer, tổ chức chiến dịch có hashtag, ưu tiên nội dung chân thực."
      - "Với affiliate: mã giảm độc quyền cho publisher, trả hoa hồng khi đơn giao thành công, chống gian lận."
      - "Đo CPO, CVR, ROAS, tỷ lệ hoàn từng chiến lược; điều chỉnh hằng tuần."
    how_to_read_results: "Chiến lược tốt khi CPO thấp hơn đóng góp trước ads, CVR ổn định, hoàn đơn thấp, có lượng khách quay lại; nội dung UGC được khách thật tạo ra."
    pitfalls:
      - "Chạy ads/affiliate không tracking nên không biết kênh nào sinh đơn."
      - "Tung ưu đãi đại trà trên mạng làm giảm giá trị dự án (case bất động sản dồn ưu đãi tới điểm chốt)."
      - "KOC review giả, kịch bản hóa khiến mất bằng chứng xã hội thật."
      - "Gamification quá phức tạp, ưu đãi tốn kém hơn giá trị giữ chân."
    example: "Shop giày dùng Google Shopping + 200 publisher affiliate, hoa hồng 12% chỉ trả khi đơn đã giao thành công."

  - id: "m02_extended_services_ihip"
    name_vi: "Đặc tính dịch vụ IHIP và lý do cần 3P bổ sung"
    name_en: "IHIP Service Characteristics"
    origin: "Khung đặc tính dịch vụ trong marketing dịch vụ (Zeithaml, Parasuraman, Berry thập niên 1980) đi cùng 7P của Booms và Bitner (1981): giải thích vì sao 4P không đủ cho dịch vụ."
    components:
      - "Intangibility (vô hình) - cần Physical Evidence."
      - "Heterogeneity (không đồng nhất) - cần Process chuẩn hóa và People đào tạo."
      - "Inseparability (không tách rời) - nhân viên và khách hàng là một phần của dịch vụ."
      - "Perishability (không lưu kho) - cần quản lý công suất, giá theo giờ/mùa."
    when_to_use: "Mọi DN dịch vụ hoặc sản phẩm lai (F&B, spa, giáo dục, khách sạn, app)."
    how_to_apply:
      - "Đánh dấu đặc tính nào nặng nhất với DN."
      - "Gán giải pháp: vô hình thì thêm bằng chứng (hình, review, đồng phục); không đồng nhất thì SOP và đào tạo; không tách rời thì tuyển dụng đúng thái độ; không lưu kho thì dynamic/off-peak pricing, đặt trước."
    how_to_read_results: "Mỗi đặc tính có ít nhất một biện pháp; nếu không có thì chất lượng dịch vụ sẽ dao động."
    pitfalls:
      - "Bỏ qua perishability: ghế trống giờ thấp điểm là doanh thu mất vĩnh viễn."
    example: "Nhà hàng phở 60% công suất giờ cao điểm, trống buổi chiều: dùng combo và giá giờ thấp điểm."

  - id: "m02_people"
    name_vi: "People (con người)"
    name_en: "People (P5)"
    origin: "P thứ 5 của Booms và Bitner (1981): trong dịch vụ nhân viên chính là một phần sản phẩm vì khách tiếp xúc trực tiếp và quyết định bằng trải nghiệm."
    components:
      - "Nhân viên phục vụ: thái độ, kỹ năng, ngoại hình (barista Starbucks ghi tên lên cốc)."
      - "Đào tạo: tiêu chuẩn và chất lượng huấn luyện (Ritz-Carlton nêu 250 giờ/năm/nhân viên, số chưa kiểm chứng)."
      - "Văn hóa DN: giá trị nội bộ quyết định trải nghiệm khách (Zappos: Deliver WOW through service)."
      - "Khách hàng: khách tham gia tạo dịch vụ (IKEA: khách tự lắp ráp)."
    when_to_use: "Mọi DN dịch vụ, F&B, retail, DN dựa vào đối tác (tài xế Grab)."
    how_to_apply:
      - "Xác định hành vi mong muốn của nhân viên theo positioning (premium: tư vấn chuyên sâu; budget: nhanh, hiệu quả)."
      - "Tuyển theo thái độ, đào tạo kỹ năng và SOP."
      - "Thiết kế KPI và thưởng gắn trải nghiệm khách."
      - "Hướng dẫn khách cách tham gia (self-service)."
    how_to_read_results: "Đo bằng mystery shopper, NPS/CSAT, tỷ lệ khách quay lại, tỷ lệ nghỉ việc."
    pitfalls:
      - "Chất lượng nhân sự (hoặc đối tác) không đều gây hại thương hiệu (hạn chế của Grab)."
      - "Đào tạo một lần rồi bỏ."
    example: "Quán cà phê đào tạo barista gọi tên khách và giải thích hạt cà phê, tăng khách quay lại."

  - id: "m02_process"
    name_vi: "Process (quy trình)"
    name_en: "Process (P6)"
    origin: "P thứ 6 của Booms và Bitner (1981): dịch vụ được tạo ra qua quy trình, nên cách thiết kế quy trình quyết định tốc độ, chất lượng và chi phí."
    components:
      - "Flow: luồng cung cấp dịch vụ (McDonald's: chuẩn từ order tới nhận đồ, nêu 90 giây là con số minh họa)."
      - "Standardization: chuẩn hóa chất lượng (KFC: công thức và quy trình nấu chuẩn toàn cầu)."
      - "Customization: tùy chỉnh theo khách (Subway: chọn bánh, nhân, sốt)."
      - "Technology: công nghệ hỗ trợ (Grab: thuật toán ghép xe, dynamic pricing)."
      - "Waiting time: quản lý thời gian chờ (Disney: FastPass, ước lượng thời gian chờ)."
    when_to_use: "Cần giảm biến động chất lượng, tăng tốc độ, mở rộng nhượng quyền."
    how_to_apply:
      - "Vẽ hành trình dịch vụ (service blueprint) từ lúc khách vào tới lúc rời đi; đánh dấu điểm đau và thời gian chờ."
      - "Chuẩn hóa các bước lặp lại bằng SOP; chừa chỗ tùy chỉnh ở các bước tạo giá trị."
      - "Ứng dụng công nghệ (POS, QR order, app) khi giảm được thời gian hoặc lỗi."
      - "Đặt chuẩn thời gian (order tới phục vụ) và theo dõi."
    how_to_read_results: "Quy trình tốt: thời gian chờ ổn định, lỗi thấp, khách vẫn có lựa chọn tùy chỉnh phù hợp positioning."
    pitfalls:
      - "Chuẩn hóa quá mức làm mất cá tính nếu định vị là 'tùy chỉnh'."
      - "Tùy chỉnh quá nhiều làm quy trình chậm và chi phí tăng."
    example: "Quán phở đặt chuẩn phục vụ dưới 8 phút sau gọi món, QR order giờ cao điểm (số minh họa)."

  - id: "m02_physical_evidence"
    name_vi: "Physical Evidence (bằng chứng vật lý)"
    name_en: "Physical Evidence (P7)"
    origin: "P thứ 7 của Booms và Bitner (1981): dịch vụ vô hình nên khách tìm dấu hiệu hữu hình để đánh giá chất lượng trước và sau khi mua."
    components:
      - "Facility design: thiết kế không gian (Apple Store: tối giản, bàn gỗ, ánh sáng ấm)."
      - "Signage: biển hiệu, logo (Golden Arches của McDonald's)."
      - "Website/App: giao diện số (Airbnb: UX đẹp, ảnh chất lượng cao)."
      - "Dress code: đồng phục (Singapore Airlines: Sarong Kebaya)."
      - "Testimonials: reviews, ratings (4.5 sao trên Google Maps)."
      - "Tangible cues: vật phẩm hữu hình (dép đi trong phòng, amenities khách sạn)."
    when_to_use: "Cần tạo niềm tin cho dịch vụ hoặc thương hiệu mới."
    how_to_apply:
      - "Liệt kê mọi điểm chạm khách nhìn thấy (trước, trong, sau khi mua)."
      - "Chọn chủ đề thiết kế khớp positioning (màu, ánh sáng, chất liệu, ảnh)."
      - "Tạo hệ thống review/rating và hiển thị công khai."
      - "Số hóa: app UI, email template, biên nhận, bản đồ ETA."
    how_to_read_results: "Điểm chạm nhất quán với positioning và có đủ bằng chứng cho phân khúc (review, hình thật, chứng nhận)."
    pitfalls:
      - "Đầu tư decor đắt nhưng trải nghiệm dịch vụ tệ."
      - "Hình ảnh quảng cáo khác thực tế gây thất vọng."
      - "Bỏ qua Physical Evidence số (app, website) khi dịch vụ chủ yếu online."
    example: "Spa mới chụp ảnh thật, treo chứng chỉ kỹ thuật viên, mời khách để lại review Google Maps."

  - id: "m02_build_process"
    name_vi: "Quy trình 10 bước xây dựng Marketing Mix"
    name_en: "Marketing Mix Build Process"
    origin: "Quy trình trong nguồn (phần IV): đi từ STP tới 4P rồi 7P và kiểm tra nhất quán."
    components:
      - "1 STP đã hoàn thành: biết target, positioning."
      - "2 Product: thiết kế SP/DV phù hợp target (features, quality, design, packaging, brand)."
      - "3 Price: định giá theo perceived value (cost, value, competition)."
      - "4 Place: chọn kênh (intensive, selective, exclusive, omnichannel)."
      - "5 Promotion: kế hoạch truyền thông (kênh, ngân sách, creative)."
      - "6 People (nếu dịch vụ): tuyển dụng, đào tạo."
      - "7 Process: chuẩn hóa quy trình."
      - "8 Physical Evidence: thiết kế điểm chạm."
      - "9 Kiểm tra consistency 7P."
      - "10 Triển khai, đo lường, tối ưu."
    when_to_use: "Mỗi lần lập hoặc rà soát kế hoạch marketing."
    how_to_apply:
      - "Làm lần lượt; sau mỗi bước hỏi: có khớp positioning và nhu cầu target không?"
      - "Đưa số liệu vào từng P (giá vốn, giá, chi phí kênh, ngân sách)."
      - "Chạy m02_consistency_score và ma trận consistency."
      - "Đặt KPI mỗi P, lịch rà soát hằng tháng."
    how_to_read_results: "Kế hoạch tốt: mỗi P có quyết định cụ thể, số liệu, người chịu trách nhiệm, và nhất quán với positioning."
    pitfalls:
      - "Làm 4P khi chưa có STP."
      - "Set and forget: mix cần điều chỉnh liên tục."
    example: "Xem procedure m02_proc_build_mix."

  - id: "m02_consistency_matrix"
    name_vi: "Ma trận kiểm tra nhất quán"
    name_en: "Consistency Check Matrix"
    origin: "Công cụ trong nguồn: đối chiếu từng P với positioning để bảo đảm cùng một thông điệp (tránh 'khách hàng bối rối')."
    components:
      - "Positioning Premium: Product chất lượng cao; Price giá cao; Place exclusive; Promotion PR/influencer; People chuyên nghiệp; Process tùy chỉnh; Physical sang trọng."
      - "Positioning Budget: Product cơ bản; Price thấp; Place intensive; Promotion mass ads/khuyến mãi; People hiệu quả; Process nhanh; Physical đơn giản."
      - "Sai (Inconsistent): sản phẩm cao cấp, giá rẻ, cửa hàng bình dân, flash sale liên tục dẫn tới khách bối rối."
    when_to_use: "Sau khi hoàn tất thiết kế 7P, trước khi triển khai và khi doanh thu bất ổn."
    how_to_apply:
      - "Viết positioning một câu ở cột đầu."
      - "Mô tả từng P hiện tại; đánh dấu khớp hoặc mâu thuẫn."
      - "Sửa P mâu thuẫn trước (thường là Promotion giảm giá hoặc Place)."
      - "Chấm điểm bằng m02_consistency_score."
    how_to_read_results: "Mọi P cùng hướng; một P lệch có thể xóa hiệu quả của các P còn lại."
    pitfalls:
      - "Premium mà flash sale triền miên."
      - "Kênh bình dân cho sản phẩm cao cấp."
      - "Matrix chỉ kiểm tra nhất quán nội bộ chứ không kiểm tra khách có thật sự muốn hay không."
    example: "Grab: định vị 'everyday everything app' - tất cả 7P hướng tới tiện lợi, nhanh, đáng tin."

  - id: "m02_limitations"
    name_vi: "Ưu điểm và hạn chế của 4P/7P"
    name_en: "Strengths and Limitations of the Marketing Mix"
    origin: "Tổng kết trong nguồn."
    components:
      - "Ưu điểm: toàn diện; đơn giản dễ nhớ; hành động cụ thể; linh hoạt; kiểm tra nhất quán; ngôn ngữ chung toàn cầu."
      - "Hạn chế: DN-centric (cần 4C); khung 1960 thiếu digital, data, AI; tĩnh nếu không rà soát; 7P xem riêng lẻ thiếu synergy; không ưu tiên P nào; thiếu Partnership (có đề xuất P thứ 8 trong thời đại hệ sinh thái)."
    when_to_use: "Khi giải thích giới hạn của khung và cách bù trừ."
    how_to_apply:
      - "Dùng 4C để soát góc khách."
      - "Bổ sung lớp dữ liệu và đối tác (Partnership) cho nền tảng, marketplace."
      - "Xác định P ưu tiên theo ngành (F&B dịch vụ thì Product + People + Place; online thì Price + Promotion)."
    how_to_read_results: "Khung là bản đồ nền, không phải câu trả lời cuối cùng."
    pitfalls:
      - "Coi 7P là danh sách tick việc."
      - "Cho rằng mọi P quan trọng ngang nhau."
    example: "Grab: cần đối tác (Shopee, ngân hàng) mà 7P gốc không nêu thành P riêng."

procedures:
  - id: "m02_proc_build_mix"
    name: "Dựng Marketing Mix 4P/7P hoàn chỉnh cho một doanh nghiệp"
    steps:
      - "1. Intake: hỏi (a) ngành, sản phẩm/dịch vụ, giai đoạn (ý tưởng, mới mở, đang chạy); (b) khách mục tiêu, positioning (nếu chưa có thì chuyển sang m01); (c) vốn, ngân sách marketing hằng tháng; (d) giá vốn, chi phí cố định, margin mục tiêu; (e) đối thủ chính và giá của họ; (f) kênh hiện có và dữ liệu khách; (g) dịch vụ hay hữu hình (có cần 7P không)."
      - "2. Xác nhận positioning bằng một câu và danh sách 3 tiêu chí khách ưu tiên."
      - "3. Product: dùng 5 cấp độ sản phẩm; chốt cốt lõi, kỳ vọng, 1-3 yếu tố mở rộng; chốt width/length/depth; branding, packaging, features, design."
      - "4. Price: tính sàn (m02_markup_price hoặc m02_margin_price), trần giá trị (m02_economic_value_price), tham chiếu đối thủ; chọn giá và tính hòa vốn (m02_breakeven_units)."
      - "5. Place: chọn cấp kênh và độ phủ; so sánh ba kênh bằng m02_channel_contribution; quyết định single-channel hay omnichannel."
      - "6. Promotion: chọn công cụ trong Promotion Mix và chiến lược 4.0 phù hợp; thiết lập tracking; đặt ngân sách và mục tiêu CPO, ROAS, CVR."
      - "7. (Dịch vụ) People: mô tả hành vi mong muốn, tuyển, đào tạo, KPI."
      - "8. (Dịch vụ) Process: vẽ hành trình, SOP, thời gian chuẩn, công nghệ."
      - "9. (Dịch vụ) Physical Evidence: danh sách điểm chạm, thiết kế, review/rating."
      - "10. Kiểm tra consistency: ma trận + m02_consistency_score; soát lại bằng 4C; sửa P lệch."
      - "11. Kế hoạch triển khai: lịch, người phụ trách, KPI mỗi P, ngân sách, mốc kiểm tra."
      - "12. Rà soát hằng tháng: CPO, CVR, ROAS, tỷ lệ hoàn, doanh thu theo kênh, NPS, điều chỉnh mix."
    outputs: "Bảng Marketing Mix (mỗi P: quyết định, lý do, số liệu, KPI, người phụ trách), điểm nhất quán, ngân sách, kế hoạch 90 ngày, rủi ro."

  - id: "m02_proc_price_decision"
    name: "Chốt giá bán một sản phẩm"
    steps:
      - "1. Xác định giá vốn đầy đủ trên đơn vị (nguyên liệu, bao bì, phí sàn, hao hụt) và chi phí cố định mỗi tháng."
      - "2. Tính giá sàn với margin mục tiêu (m02_margin_price); đổi markup/margin nếu cần (m02_markup_margin_convert)."
      - "3. Thu thập giá 5-10 đối thủ cùng phân khúc."
      - "4. Ước lượng V_ref và V_diff để có trần (m02_economic_value_price) qua phỏng vấn 10-20 khách hoặc test giá."
      - "5. Chọn giá trong [sàn, trần] theo positioning; làm tròn giá tâm lý."
      - "6. Tính hòa vốn (m02_breakeven_units) và so với công suất."
      - "7. Nếu cân nhắc giảm giá: tính m02_discount_breakeven_uplift, chỉ làm nếu dự báo tăng sản lượng vượt ngưỡng; nếu tăng giá: m02_price_increase_breakeven."
      - "8. A/B test hoặc thử giá 2-4 tuần, đo sản lượng và đóng góp."
    outputs: "Giá niêm yết, margin, điểm hòa vốn, quy tắc giảm giá, kế hoạch test giá."

  - id: "m02_proc_channel_selection"
    name: "Chọn và phân bổ kênh bán hàng"
    steps:
      - "1. Mô tả hành trình mua của khách mục tiêu (tìm hiểu ở đâu, mua ở đâu, hậu mãi)."
      - "2. Lập bảng đặc điểm kênh (động lực, vốn, tốc độ phủ, trung thành)."
      - "3. Thu thập số thật mỗi kênh: phí sàn, hoa hồng KOC, ads, ship, tỷ lệ hoàn, mặt bằng, nhân sự."
      - "4. Tính đóng góp mỗi đơn (m02_channel_contribution) và ROAS hòa vốn mỗi kênh."
      - "5. Ước lượng sản lượng khả thi mỗi kênh trong 3-6 tháng; nhân với đóng góp."
      - "6. Chọn kênh chính, kênh hỗ trợ; xác định lộ trình thêm kênh."
      - "7. Nếu từ 2 kênh trở lên: lập kế hoạch đồng bộ giá, tồn kho, dữ liệu khách (omnichannel tối thiểu: cùng số điện thoại, đồng giá, BOPIS)."
      - "8. Theo dõi hằng tuần: doanh thu, CVR, CPO, hoàn, đóng góp theo kênh."
    outputs: "Bảng so sánh kênh có số, quyết định kênh chính/phụ, lộ trình, KPI."

  - id: "m02_proc_promotion_plan"
    name: "Lập kế hoạch Promotion có đo lường"
    steps:
      - "1. Xác định mục tiêu theo phễu (nhận biết, cân nhắc, mua, giữ chân, giới thiệu) và số mục tiêu (đơn, lead)."
      - "2. Phân loại sản phẩm: giá trị đơn, độ cân nhắc, mức bão hòa ngành."
      - "3. Chọn công cụ trong Promotion Mix và 1-2 chiến lược 4.0 theo bảng hoàn cảnh (performance/affiliate, KOC/UGC, automation, gamification)."
      - "4. Thiết lập tracking: UTM, mã giảm riêng mỗi kênh, pixel, CRM."
      - "5. Tính ROAS hòa vốn và CPO tối đa chấp nhận được."
      - "6. Đặt ngân sách thử nghiệm nhỏ, chạy 2-4 tuần."
      - "7. Đọc kết quả: CVR, CPO, ROAS, hoàn; tăng ngân sách kênh vượt ngưỡng, dừng kênh dưới ngưỡng."
      - "8. Giữ ưu đãi lớn ở điểm chốt (không tung đại trà) để bảo vệ giá trị thương hiệu."
    outputs: "Kế hoạch Promotion: mục tiêu, công cụ, ngân sách, tracking, ngưỡng dừng/tăng, lịch."

  - id: "m02_proc_service_7p"
    name: "Thiết kế 3P dịch vụ (People, Process, Physical Evidence)"
    steps:
      - "1. Chấm đặc tính IHIP nặng nhất của dịch vụ."
      - "2. Vẽ hành trình dịch vụ và liệt kê điểm chạm."
      - "3. People: mô tả hành vi mong muốn từng vai, tiêu chí tuyển, chương trình đào tạo, KPI/thưởng."
      - "4. Process: SOP, thời gian chuẩn, điểm tùy chỉnh, công nghệ."
      - "5. Physical Evidence: thiết kế điểm chạm, hệ thống review/rating, đồng phục."
      - "6. Quản lý công suất và giờ thấp điểm (perishability): giá off-peak, đặt trước, subscription."
      - "7. Đo: NPS, thời gian chờ, tỷ lệ khách quay lại, điểm review."
    outputs: "SOP, kế hoạch đào tạo, danh mục điểm chạm, KPI dịch vụ."

  - id: "m02_proc_consistency_audit"
    name: "Kiểm toán nhất quán 7P"
    steps:
      - "1. Viết positioning một câu."
      - "2. Với mỗi P: mô tả hiện trạng một câu và chấm 0/1/2 so với positioning."
      - "3. Tính m02_consistency_score."
      - "4. Với P điểm 0: xác định nguyên nhân (thường là giá, khuyến mãi, kênh, bao bì)."
      - "5. Đề xuất chỉnh sửa và chi phí; ưu tiên P điểm 0 và P ảnh hưởng nhiều tới khách."
      - "6. Soát lại bằng 4C (khách có thấy nhất quán?)."
      - "7. Đặt lịch audit lại 3 tháng/lần."
    outputs: "Bảng điểm nhất quán, danh sách chỉnh sửa theo ưu tiên."

decision_rules:
  - "Nếu chưa có STP/positioning rõ thì dừng lại làm m01 trước; không chọn giá/kênh/quảng cáo cho 'khách bất kỳ'."
  - "Nếu sản phẩm là dịch vụ hoặc có thành phần dịch vụ (F&B, spa, giáo dục, app) thì dùng 7P, không chỉ 4P."
  - "Nếu là hàng FMCG, dùng hàng ngày, giá thấp thì ưu tiên phân phối intensive; nếu thương hiệu mạnh, mua có cân nhắc thì selective; nếu xa xỉ thì exclusive."
  - "Nếu vốn ít, cần thử nhanh thì bắt đầu một kênh social/sàn; khi có dòng tiền và dữ liệu thì thêm offline/website."
  - "Nếu có từ 2 kênh trở lên và giá, tồn kho, dữ liệu khách rời rạc thì triển khai omnichannel tối thiểu (đồng giá, chung mã khách, BOPIS)."
  - "Nếu cần đẩy số nhanh và đo chi phí theo đơn thì dùng Performance/Affiliate, chỉ trả hoa hồng khi đơn giao thành công."
  - "Nếu ngành bão hòa, khách cần bằng chứng xã hội (F&B, làm đẹp, gia dụng) thì dùng KOC/UGC thay vì TVC."
  - "Nếu hành trình mua dài, giá trị cao (bất động sản, xe, tài chính) thì dùng automation/nurturing; dồn ưu đãi vào điểm chốt."
  - "Nếu cần tăng retention và tương tác hằng ngày trên app/web thì dùng gamification."
  - "Nếu cân nhắc giảm giá d thì tính d/(m - d); nếu mức tăng sản lượng cần có vượt dự báo khả thi thì không giảm giá, thay bằng combo/quà tặng/giá trị gia tăng."
  - "Nếu margin mỏng (< 30%) thì ưu tiên tăng giá nhẹ hoặc giảm chi phí hơn là kích cầu bằng giảm giá."
  - "Nếu positioning premium thì tránh flash sale liên tục, kênh bình dân và bao bì rẻ; nếu budget thì đừng decor sang trọng làm tăng chi phí không cần."
  - "Nếu ROAS thực tế < ROAS hòa vốn (1/cm) thì dừng/giảm kênh, kiểm tra CVR, giá, creative trước khi tăng ngân sách (trừ khi có LTV chứng minh)."
  - "Nếu social commerce có tỷ lệ hoàn cao thì tính đóng góp sau hoàn; cân nhắc COD có xác nhận, chính sách đổi trả rõ, tư vấn livestream kỹ."
  - "Nếu điểm nhất quán < 60% hoặc có P bằng 0 thì sửa mix trước khi tăng ngân sách quảng cáo."
  - "Nếu quán/nhà hàng đông giờ cao điểm nhưng vắng giờ thấp điểm thì dùng giá/combo off-peak (xử lý perishability)."
  - "Nếu mix chạy nhiều tháng không đổi mà doanh thu chững thì rà soát lại (marketing mix là động, không set and forget)."
  - "Nếu cần soát từ góc khách hàng thì chuyển 4P sang 4C: giải pháp, tổng chi phí khách chịu, thuận tiện, giao tiếp."

benchmarks:
  - {metric: "Contribution margin tối thiểu để chịu giảm giá 20%", value: "m > 20% (cần tăng sản lượng d/(m-d)); margin 50% cần +66.7%", context: "Suy ra từ công thức, không phải số thị trường", confidence: "high"}
  - {metric: "LTV:CAC / ROAS", value: "ROAS hòa vốn = 1/cm; ví dụ cm 47.5% thì 2.1", context: "Tính toán, thay bằng số thật của DN", confidence: "high"}
  - {metric: "Bán kính phục vụ cửa hàng vật lý", value: "3-5 km", context: "Nguồn nêu cho cửa hàng offline", confidence: "medium"}
  - {metric: "Phí sàn + freeship + ads trên Shopee (ví dụ)", value: "khoảng 14% + 3% + 10% giá bán", context: "Giả định minh họa trong worked example; phí thực thay đổi theo ngành hàng, thời điểm", confidence: "low"}
  - {metric: "Hoa hồng KOC/affiliate (ví dụ)", value: "10-12% giá bán", context: "Giả định minh họa; thay đổi theo ngành", confidence: "low"}
  - {metric: "Tỷ lệ hoàn đơn social commerce (ví dụ)", value: "khoảng 15%", context: "Giả định minh họa; nguồn chỉ nói 'cao'", confidence: "low"}
  - {metric: "Thời gian giao NowFree 2H của Hasaki", value: "2 giờ", context: "Nguồn mô tả dịch vụ; điều kiện/khu vực thay đổi", confidence: "medium"}
  - {metric: "Grab GMV 2023 (nguồn nêu)", value: "20.5 tỷ USD; 35M+ người dùng giao dịch hằng tháng", context: "Số trong nguồn chưa đối chiếu báo cáo Grab; cần kiểm tra lại nếu cần trích dẫn", confidence: "low"}
  - {metric: "Giờ đào tạo Ritz-Carlton", value: "250 giờ/nhân viên/năm", context: "Số nêu trong nguồn, chưa kiểm chứng", confidence: "low"}
  - {metric: "Ngưỡng điểm nhất quán 7P (heuristic)", value: ">= 85% tốt; 60-85% cần sửa; < 60% rủi ro", context: "Do người distill đề xuất, không phải chuẩn học thuật", confidence: "low"}

pitfalls:
  - "Triển khai 4P khi chưa có STP/positioning: mọi quyết định thiếu la bàn."
  - "Nhầm markup với margin (đặt giá sai 10-30%)."
  - "Chỉ dùng một phương pháp giá (cost-plus) và bỏ qua giá trị cảm nhận và đối thủ."
  - "Giảm giá liên tục: tập khách chờ giảm giá, giảm giá trị thương hiệu; không tính ngưỡng tăng sản lượng."
  - "Đo doanh thu thay vì đóng góp lợi nhuận khi so kênh; bỏ qua phí ẩn nội sàn và tỷ lệ hoàn của social commerce."
  - "Hiểu nhầm omnichannel là có mặt ở mọi nơi; thực chất là dữ liệu, giá, tồn kho đồng bộ."
  - "Bán đơn kênh dẫn tới data silo và phụ thuộc nền tảng/thuật toán."
  - "Dùng 4P cho dịch vụ mà bỏ qua People/Process/Physical Evidence; quên perishability và công suất."
  - "7P mâu thuẫn nhau (premium nhưng flash sale liên tục) làm khách bối rối."
  - "Không tracking (UTM, mã riêng) nên không biết kênh nào sinh CVR cao nhất."
  - "Set and forget: mix không rà soát; framework 1960 cần bổ sung digital/data/partnership."
  - "Coi mọi P ngang nhau; không có ưu tiên theo ngành và giai đoạn."
  - "Lỗi/mâu thuẫn trong nguồn cần lưu ý: (1) FMCG viết nhầm 'Fast Moving Customer Good' (đúng: Consumer Goods); (2) 'Product Line = width' dễ hiểu sai và 'width x length x depth x consistency' không phải phép nhân; (3) Showrooming được mô tả khác nghĩa phổ biến; (4) Promotion 4.0 'tiến hóa thành Conversation và Advocacy' là cách nói rút gọn so với Kotler 5A/4C mới; (5) Grab 'mới lãi Q4/2023' cần đối chiếu: Grab báo EBITDA điều chỉnh dương năm 2023, lỗ ròng vẫn tiếp tục, quý đầu tiên có lãi ròng thường được nhắc là cuối 2024; (6) Grab GMV 20.5B USD 2023 chưa kiểm chứng; (7) các số Ritz-Carlton 250 giờ, McDonald's 90 giây là minh họa; (8) phần đánh số cấp heading trong nguồn lộn xộn (mục '1. Phân tích và So sánh 3 Kênh' nằm trong II.3 Place, mục '4. PROMOTION' và 'III. 7P' đánh số P5-P7 liên tục)."

sme_vn_guidance:
  - "Khởi đầu thực dụng: chọn một kênh chính (TikTok Shop/Shopee/Facebook hoặc một cửa hàng) và đo CPO, CVR, hoàn đơn trước khi mở rộng; nhiều SME chết vì dàn trải nhiều kênh khi chưa có dòng tiền."
  - "Công cụ theo dõi bán hàng và tồn kho: KiotViet, Sapo (POS + đa kênh), iPOS (nhà hàng); giá tham khảo từ vài trăm nghìn tới vài triệu VNĐ mỗi tháng tùy gói. Cần xác nhận giá hiện hành trên website nhà cung cấp. (confidence: low)"
  - "Tracking: Google Analytics 4 (miễn phí), UTM (tự gắn), Meta Pixel, Google Tag Manager; mã giảm giá riêng cho mỗi kênh/KOC để tính CPO."
  - "CRM/Automation nhẹ: Zalo OA + ZNS, email (Mailchimp, Getfly, Haravan Marketing); phí ZNS tính theo tin nhắn, cần xác nhận bảng giá Zalo hiện hành. (confidence: low)"
  - "Affiliate tại VN: có các mạng như AccessTrade, Ecomobi...; hoa hồng thường 5-20% tùy ngành; cần xác nhận điều khoản và phí nền tảng. (confidence: low)"
  - "KOC/UGC: bắt đầu từ micro-influencer và khách thật, gửi sample thay vì trả cát-xê lớn; chọn người có tương tác thật, có hợp đồng và quy định công bố quảng cáo (cần xác nhận quy định hiện hành về quảng cáo/KOL). (confidence: low)"
  - "Sàn TMĐT: phí sàn, voucher, freeship thay đổi theo chính sách từng thời điểm; luôn tính đóng góp sau phí thật trước khi chạy ads. (confidence: low)"
  - "Pháp lý quảng cáo, khuyến mại, bán hàng online (thông báo khuyến mại, thương mại điện tử, dữ liệu cá nhân) cần đối chiếu quy định hiện hành hoặc hỏi luật sư; đánh dấu cần xác nhận."
  - "F&B: perishability lớn (nguyên liệu hỏng, ghế trống) nên cần combo/giá giờ thấp điểm, subscription, đặt trước; People và Process (tốc độ ra món, chuẩn vị) là P quyết định."
  - "Bán lẻ nhỏ có từ 2 kênh: bắt đầu omnichannel tối thiểu bằng cùng số điện thoại khách, đồng giá, cho khách lấy tại cửa hàng (BOPIS); chưa cần app riêng."
  - "Ngân sách marketing ban đầu SME thường dùng một tỷ lệ nhỏ doanh thu (ví dụ 5-10%, ước lượng, chỉ tham khảo); điều chỉnh theo CPO và biên lợi nhuận. (confidence: low)"
  - "Bảo vệ giá: đồng giá giữa các kênh để tránh mất niềm tin (như Hasaki); mã giảm riêng cho từng kênh để đo, không để giá niêm yết lệch."

case_lessons:
  - name: "Hasaki - Omnichannel mỹ phẩm tại Việt Nam"
    type: "success"
    setup: >
      Thị trường mỹ phẩm nhiều hàng giả, khách cần lòng tin (cửa hàng), thích săn sale và tiện lợi (e-commerce) và bị ảnh hưởng bởi reviewer (social).
      Hasaki dùng chuỗi cửa hàng làm trạm lòng tin và mini-hub kho vận; app làm trung tâm điều khiển với đồng giá; KOC/beauty blogger làm nam châm; NowFree 2H giao trong 2 giờ từ cửa hàng gần nhất còn hàng.
    key_calculations:
      - "Không có số liệu tài chính trong nguồn; điểm then chốt định tính: đồng giá giữa app và cửa hàng; giao 2 giờ so với 3-5 ngày của giao hàng thông thường."
      - "Đo lường đề xuất: tỷ lệ khách mua đa kênh, thời gian giao trung bình, tỷ lệ đơn giao từ cửa hàng."
    lesson: "Đừng coi kênh là đối thủ của nhau: cửa hàng tạo lòng tin và trải nghiệm, social tạo bùng nổ, app/e-commerce giữ chân và khai thác dữ liệu; hệ thống đồng bộ được cả ba sẽ thắng. Nhân viên cửa hàng nhận diện khách VIP bằng số điện thoại."
    data_reliability: "unverified"
  - name: "Vascara - Performance và Affiliate"
    type: "success"
    setup: "Cạnh tranh online khốc liệt, CPC tăng. Vascara chạy Google Shopping Ads cho truy vấn trực tiếp và mở rộng Affiliate với mã giảm giá độc quyền cho nhiều publisher viết review phối đồ, blog thời trang; trả hoa hồng khi đơn giao thành công."
    key_calculations:
      - "Không có số trong nguồn. Minh họa tính toán: giá 800,000, hoa hồng 12% thì CPO = 96,000; ROAS tương ứng 8.33; ROAS hòa vốn = 1/cm."
    lesson: "Chuyển rủi ro chi phí quảng cáo sang đối tác, kiểm soát chặt CPO; mạng lưới publisher tạo hiện diện dày đặc trên blog và nhóm ưu đãi. Điều kiện: tracking chính xác, tính đơn giao thành công, quản lý chất lượng publisher."
    data_reliability: "unverified"
  - name: "Dự án bất động sản - Marketing Automation và Content Nurturing"
    type: "success"
    setup: "Khách mua đất nền/khu đô thị vệ tinh cần dữ liệu quy hoạch, pháp lý, tiềm năng sinh lời. Chiến dịch chạy quảng cáo tải 'Báo cáo dòng vốn và bản đồ quy hoạch 2025-2026' thay vì 'Bán đất'. Phễu: ngày 1 email hạ tầng, ngày 3 Zalo ZNS gửi VR 360, ngày 7 gọi mời tham quan kèm voucher lãi suất vay ngân hàng đối tác."
    key_calculations:
      - "Không có số trong nguồn; phễu 3 điểm chạm trong 7 ngày."
    lesson: "Với sản phẩm giá trị cao, Promotion là cung cấp thông tin giá trị theo từng giai đoạn tâm lý; ưu đãi chỉ ở điểm chốt cuối để không phá giá trị dự án."
    data_reliability: "illustrative"
  - name: "Cocoon - KOC/UGC thương hiệu mỹ phẩm thuần chay"
    type: "success"
    setup: "Thương hiệu nội địa mới, ngân sách nhỏ, không đọ TVC với L'Oréal/Unilever. Gửi hàng nghìn hộp dùng thử (cà phê Đắk Lắk tẩy da chết) cho micro-influencer và người dùng trong group làm đẹp; chiến dịch 'Đổi vỏ chai cũ lấy sản phẩm mới', khuyến khích tự quay video gắn hashtag."
    key_calculations:
      - "Không có số trong nguồn."
    lesson: "Bằng chứng xã hội từ nhiều người giống mình thuyết phục hơn thương hiệu tự khen; chiến dịch tương tác vì môi trường tạo UGC chân thực với chi phí thấp."
    data_reliability: "unverified"
  - name: "Grab - 7P thời đại 4.0"
    type: "success"
    setup: "Super app ĐNÁ mở rộng từ gọi xe sang giao đồ ăn, thanh toán, siêu thị, bảo hiểm. Positioning 'everyday everything app'; 7P: Product là hệ sinh thái; Price dynamic và subsidy; Place mobile-first; Promotion voucher/referral/subscription; People tài xế đối tác và hỗ trợ 24/7; Process ghép xe nhanh, tracking, thanh toán tự động; Physical Evidence là UI/UX, đồng phục xanh, mũ bảo hiểm, biên nhận trong app."
    key_calculations:
      - "GMV nguồn nêu 20.5B USD (2023), 35M+ người dùng giao dịch hằng tháng, 5M+ tài xế đối tác (chưa kiểm chứng)."
      - "Ma trận consistency: 7/7 P hướng tới tiện lợi, nhanh, đáng tin, nhất quán với positioning."
    lesson: "Product là platform; People là tài sản lớn (tài xế vừa là nhân lực vừa là đại sứ); Process là marketing (ghép xe 30 giây, tracking); Physical Evidence số là UI/thông báo; Price là công cụ tăng trưởng (đổi biên lấy thị phần). Hạn chế: subsidy nặng nên lỗ nhiều năm, chất lượng tài xế không đều, app quá nhiều tính năng gây rối."
    data_reliability: "unverified"
  - name: "Biến thể SME Việt Nam - Quán phở 'Phở Nhà' đồng bộ 7P cho định vị tầm trung chất lượng"
    type: "sme"
    setup: "Quán phở giả định 40 chỗ tại quận Cầu Giấy, Hà Nội, định vị 'phở gia truyền sạch, phục vụ nhanh cho nhân viên văn phòng'. Giá vốn một tô 18,000, giá bán 55,000, chi phí cố định 70 triệu/tháng. Vấn đề: khách đông 7-8h và 11:30-13h, vắng giờ còn lại; đang chạy 'giảm 20%' liên tục trên app giao đồ ăn."
    key_calculations:
      - "Margin = (55,000 - 18,000)/55,000 = 67.3%; biến phí thực gồm cả bao bì, hao hụt khoảng 22,000 nên cm = 33,000/55,000 = 60%."
      - "Hòa vốn = 70,000,000 / (55,000 - 22,000) = 2,121 tô/tháng = 70.7 tô/ngày."
      - "Giảm 20% với cm 60%: uplift cần = 0.2/(0.6-0.2) = 50%; giá còn 44,000, đóng góp 22,000/tô. Nếu hiện bán 100 tô/ngày cần 150 tô/ngày để giữ đóng góp; quán công suất giờ cao điểm không đủ nên không nên giảm giá toàn bộ."
    lesson: "Thay vì giảm giá toàn bộ, dùng giá/combo giờ thấp điểm (perishability), QR order để rút ngắn Process, bảng điểm nhất quán 7P để loại bỏ khuyến mãi mâu thuẫn định vị tầm trung chất lượng. Chiến lược Promotion tập trung KOC địa phương và review Google Maps."
    data_reliability: "illustrative"

worked_examples:
  - name: "Định giá ly latte: sàn, trần, hòa vốn (quán cà phê)"
    context: "Quán cà phê specialty tại TP.HCM; giá vốn mỗi ly latte 14,000 VNĐ; biến phí khác 3,000 (ly, ống hút, hao hụt); chi phí cố định 60 triệu/tháng; đối thủ cùng phân khúc bán 55,000; khách tham chiếu trả 40,000 cho ly thông thường, nhận thấy giá trị khác biệt (hạt rang tại chỗ, không gian) khoảng 18,000."
    inputs: {C: 14000, V: 17000, F: 60000000, margin_target: 0.7, competitor: 55000, v_ref: 40000, v_diff: 18000}
    steps:
      - "Giá sàn margin 70%: P = 14,000 / (1 - 0.7) = 46,667 (markup 233%)"
      - "Trần giá trị: EVC = 40,000 + 18,000 = 58,000"
      - "Khoảng hợp lý [46,667; 58,000], đối thủ 55,000. Chọn giá tâm lý 49,000 (thấp hơn đối thủ 10.9%, định vị dễ tiếp cận)"
      - "Margin gộp thực = (49,000 - 14,000)/49,000 = 71.4%; markup = 250%"
      - "Hòa vốn: Q = 60,000,000 / (49,000 - 17,000) = 1,875 ly/tháng = 62.5 ly/ngày"
      - "Kiểm giảm giá 20% (còn 39,200): cm trước = (49,000 - 17,000)/49,000 = 65.3%; uplift cần = 0.2/(0.653 - 0.2) = 44.1% sản lượng"
    result: "Giá 49,000; hòa vốn khoảng 63 ly/ngày; giảm giá 20% cần bán thêm 44% sản lượng nên chỉ dùng có điều kiện (combo giờ thấp điểm). Số liệu giả định minh họa."
  - name: "So sánh đóng góp theo kênh: shop mỹ phẩm (offline vs Shopee vs TikTok Shop)"
    context: "Serum giá 300,000 VNĐ, giá vốn 105,000. Giả định minh họa: Shopee (phí 14%, freeship 3%, ads 10%, hủy hoàn 3%, đóng gói 8,000); TikTok Shop (phí 8%, KOC 12%, livestream 6%, hoàn 15% x 60,000 mỗi đơn hoàn, đóng gói 8,000); cửa hàng (mặt bằng 15%, nhân sự 10%, đóng gói 2,000)."
    inputs: {P: 300, C: 105, unit: "nghìn VNĐ"}
    steps:
      - "Shopee: 300 - 105 - 42 - 9 - 30 - 9 - 8 = 97 (32.3%)"
      - "TikTok Shop: 300 - 105 - 24 - 36 - 18 - 9 - 8 = 100 (33.3%)"
      - "Cửa hàng: 300 - 105 - 45 - 30 - 2 = 118 (39.3%)"
      - "Nếu khả thi 600 đơn Shopee, 400 TikTok, 200 cửa hàng/tháng: đóng góp = 600x97 + 400x100 + 200x118 = 58,200 + 40,000 + 23,600 = 121,800 nghìn"
    result: "Offline có biên cao nhất nhưng sản lượng thấp; Shopee đóng góp tổng lớn nhất; TikTok tăng nhận biết nhưng nhạy với tỷ lệ hoàn (nếu hoàn 30% thì chi phí hoàn gấp đôi: 18 thay 9, đóng góp còn 91). Chọn mix: TikTok tạo nhu cầu, Shopee thu đơn, cửa hàng làm trạm tin cậy và BOPIS."
  - name: "Affiliate vs Google Shopping: ROAS hòa vốn (shop giày online)"
    context: "Giày giá 800,000; giá vốn 360,000; voucher bình quân 40,000; freeship hỗ trợ 20,000. Affiliate hoa hồng 12% khi đơn giao thành công; Google Shopping ROAS thực 4."
    inputs: {price: 800000, cogs: 360000, voucher: 40000, ship: 20000, commission: 0.12, roas_google: 4}
    steps:
      - "Đóng góp trước marketing = 800,000 - 360,000 - 40,000 - 20,000 = 380,000 (cm = 47.5%)"
      - "ROAS hòa vốn = 1/0.475 = 2.105"
      - "Affiliate: CPO = 0.12 x 800,000 = 96,000; ROAS = 8.33; đóng góp = 380,000 - 96,000 = 284,000/đơn"
      - "Google Shopping: ads/đơn = 800,000/4 = 200,000; đóng góp = 380,000 - 200,000 = 180,000/đơn"
    result: "Cả hai kênh có lãi (ROAS 4 và 8.33 > 2.1). Affiliate đóng góp cao hơn 104,000/đơn nhưng giới hạn bởi số publisher; Google Shopping có thể mở rộng quy mô. Kết hợp cả hai; theo dõi tỷ lệ hoàn trước khi tăng ngân sách."
  - name: "Kiểm toán 7P cho spa nhỏ định vị cao cấp"
    context: "Spa 6 giường định vị 'chăm sóc da cao cấp, tư vấn riêng'. Hiện trạng: dịch vụ chất lượng cao; giá cao; nằm tầng 3 chung cư bình dân không biển hiệu; quảng cáo giảm 50% trên Facebook liên tục; kỹ thuật viên giỏi; quy trình tư vấn có checklist; không gian sang nhưng không có review công khai."
    inputs: {scores: [2, 2, 0, 0, 2, 2, 1]}
    steps:
      - "Chấm 0/1/2: Product 2; Price 2; Place 0 (khó tìm, không tín hiệu cao cấp); Promotion 0 (giảm 50% phá định vị); People 2; Process 2; Physical Evidence 1 (không gian tốt nhưng thiếu review)"
      - "CS = (2+2+0+0+2+2+1)/14 = 9/14 = 64.3%"
      - "Ưu tiên sửa: Promotion (thay giảm giá bằng gói liệu trình/quà tặng/PR chuyên gia), Place (biển hiệu, Google Maps, chỉ dẫn), Physical Evidence (review, ảnh thật, chứng chỉ)"
      - "Sau sửa kỳ vọng Place 1, Promotion 2, Physical 2: CS = (2+2+1+2+2+2+2)/14 = 13/14 = 92.9%"
    result: "Nhất quán từ 64.3% lên khoảng 92.9% sau sửa Promotion, Place, Physical Evidence. Điểm mang tính định hướng, cần kiểm chứng bằng doanh thu và tỷ lệ khách quay lại."
  - name: "Tính danh mục sản phẩm và quyết định cắt SKU"
    context: "Cửa hàng hóa mỹ phẩm gia dụng có 3 dòng: bột giặt (4 SKU), nước rửa chén (3 SKU), nước lau sàn (2 SKU)."
    inputs: {lines: [4, 3, 2]}
    steps:
      - "width = 3; length = 9; avg length = 3.0"
      - "Nếu 2 SKU trong dòng bột giặt chiếm dưới 3% doanh thu và 10% tồn kho: cắt còn 7 SKU; avg length = 7/3 = 2.33"
      - "Dòng nước lau sàn chỉ 2 SKU: cân nhắc thêm 1 biến thể hương mới (tăng depth) thay vì thêm dòng mới"
    result: "Danh mục gọn 3 dòng, 7 SKU, giảm tồn kho. Số liệu giả định minh họa."

practice_questions:
  - q: "Phân biệt markup 100% và margin 50%. Một sản phẩm giá vốn 20,000 cần giá bán bao nhiêu để có margin 60%?"
    a: "Markup 100% (giá bán gấp đôi giá vốn) tương đương margin 50%. Với margin 60%: P = 20,000/(1 - 0.6) = 50,000 (markup 150%)."
  - q: "Quán có margin đóng góp 40% giảm giá 15%. Cần tăng sản lượng tối thiểu bao nhiêu để không giảm đóng góp?"
    a: "d/(m-d) = 0.15/(0.40-0.15) = 60%."
  - q: "Vì sao dịch vụ cần thêm People, Process, Physical Evidence?"
    a: "Dịch vụ có IHIP: vô hình (cần Physical Evidence), không đồng nhất (cần Process và People), không tách rời (nhân viên và khách là một phần dịch vụ), không lưu kho (cần quản lý công suất). Booms và Bitner (1981) thêm 3P để quản lý các đặc tính này."
  - q: "Phân biệt multichannel và omnichannel. Nêu 2 ví dụ omnichannel."
    a: "Multichannel: bán nhiều kênh nhưng dữ liệu rời rạc. Omnichannel: đồng bộ dữ liệu, giá, tồn kho, trải nghiệm. Ví dụ: BOPIS, Endless Aisle, NowFree 2H của Hasaki."
  - q: "Một shop có đóng góp trước ads 380,000/đơn trên giá 800,000. Google Ads ROAS 1.8 có lãi không?"
    a: "ROAS hòa vốn = 800,000/380,000 = 2.1. ROAS 1.8 < 2.1 nên lỗ: ads mỗi đơn = 444,444 > 380,000. Cần cải thiện CVR/giá hoặc dừng."
  - q: "Quán cà phê vốn 14,000/ly, biến phí khác 3,000, cố định 60 triệu/tháng. Giá 49,000. Hòa vốn?"
    a: "Q = 60,000,000/(49,000 - 17,000) = 1,875 ly/tháng (62.5/ngày)."
  - q: "Chọn chiến lược Promotion 4.0 cho: (a) dự án căn hộ giá 3 tỷ; (b) thương hiệu trà mới trên TikTok; (c) ví điện tử muốn tăng retention."
    a: "(a) Marketing automation và content nurturing, ưu đãi dồn ở điểm chốt. (b) KOC/UGC (và affiliate nếu cần đẩy số theo đơn). (c) Gamification."
  - q: "Một thương hiệu mỹ phẩm 'cao cấp' bán qua kênh bình dân, giảm giá flash sale liên tục, bao bì rẻ. Vấn đề là gì?"
    a: "7P không nhất quán với positioning premium: Place, Promotion, Product/Packaging mâu thuẫn, khách bối rối. Sửa bằng ma trận consistency: kênh chọn lọc, bỏ flash sale, nâng bao bì."
  - q: "Điểm khác nhau giữa Sales Promotion và PR về ưu/nhược?"
    a: "Sales Promotion tạo urgency, tăng doanh số ngắn hạn nhưng giảm brand value, khách chờ giảm giá. PR đáng tin, tăng uy tín nhưng khó kiểm soát và khó đo ROI."
  - q: "Hãy chấm nhất quán 7P cho một quán trà sữa 'bình dân, nhanh': sản phẩm cơ bản, giá thấp, kênh intensive, quảng cáo khuyến mãi, nhân viên nhanh, quy trình chậm 15 phút, không gian đơn giản."
    a: "Điểm 2,2,2,2,2,0,2 hoặc 1 cho Process chậm mâu thuẫn 'nhanh': CS = 12/14 = 85.7% (nếu Process 0). Sửa Process (quy trình nhanh, QR order) trước."

checklist:
  - "□ Đã có STP và positioning một câu trước khi dựng 4P/7P."
  - "□ Xác định đúng loại: hữu hình (4P) hay dịch vụ (7P)."
  - "□ Product: 5 cấp độ sản phẩm rõ; width/length/depth; branding, packaging, features, design nhất quán."
  - "□ Price: đã tính sàn, trần giá trị, giá đối thủ; phân biệt markup và margin; có điểm hòa vốn."
  - "□ Place: chọn cấp kênh và độ phủ (intensive/selective/exclusive); có số đóng góp mỗi kênh."
  - "□ Omnichannel: nếu có từ 2 kênh thì giá, tồn kho, mã khách đồng bộ."
  - "□ Promotion: công cụ phù hợp loại sản phẩm; có tracking (UTM, mã riêng); có CPO, ROAS hòa vốn, CVR mục tiêu."
  - "□ Ưu đãi lớn đặt ở điểm chốt thay vì đại trà."
  - "□ People, Process, Physical Evidence: đã thiết kế (nếu dịch vụ); có SOP, đào tạo, điểm chạm, review."
  - "□ Perishability: có giá/combo giờ thấp điểm, đặt trước."
  - "□ Đã chạy ma trận consistency và m02_consistency_score; P điểm 0 đã sửa."
  - "□ Đã soát bằng 4C (khách chịu tổng chi phí nào? mua có thuận tiện?)."
  - "□ Mọi số thị trường (phí sàn, hoa hồng, hoàn) có nguồn hoặc ghi rõ giả định."
  - "□ Có KPI, người phụ trách, lịch rà soát hằng tháng cho mỗi P."

excel_google_sheets_templates:
  - "Sheet 'Pricing': cột giá vốn, biến phí, markup, margin, giá đối thủ, EVC, giá đề xuất; công thức =C/(1-m), =k/(1+k)."
  - "Sheet 'Breakeven': F, P, V, Q* =F/(P-V), Q*/ngày, % công suất."
  - "Sheet 'Discount': m, d, uplift =d/(m-d); bảng tra d từ 5% tới 30%."
  - "Sheet 'ChannelPnL': hàng = kênh (offline, Shopee, TikTok, web); cột = giá, giá vốn, phí %, ads %, hoàn %, đóng gói, đóng góp, % đóng góp, sản lượng, tổng đóng góp."
  - "Sheet 'Promotion': kênh, chi phí, đơn, CPO =cost/orders, doanh thu, ROAS, CVR, hoàn; ngưỡng ROAS hòa vốn =1/cm; tô đỏ nếu dưới ngưỡng."
  - "Sheet 'Consistency7P': hàng = 7P, cột = hiện trạng, điểm 0/1/2, hành động; ô tổng =SUM/(2*7)."
  - "Sheet 'ProductMix': dòng sản phẩm, số SKU, doanh thu, tồn kho; width =COUNTA, length =SUM, avg length."

