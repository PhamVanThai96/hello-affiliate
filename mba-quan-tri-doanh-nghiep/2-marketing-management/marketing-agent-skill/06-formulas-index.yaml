  variables:
  - R
  - A
  - cm
  when_to_use: Quyết định có tăng ngân sách ads/affiliate không; mức ROAS tối thiểu để kênh có lãi.
- id: m02_cvr
  module: m02
  name_vi: Tỷ lệ chuyển đổi (CVR)
  name_en: Conversion Rate
  expression_latex: CVR = \dfrac{\text{Số đơn (hoặc hành động mục tiêu)}}{\text{Số lượt truy cập (click/visit)}}
