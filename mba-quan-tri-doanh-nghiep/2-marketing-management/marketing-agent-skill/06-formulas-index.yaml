  excel: =B1*B2*B3
  variables:
  - aov
  - freq
  - lifespan
  when_to_use: Ước lượng nhanh, bậc độ lớn, khi chưa có dữ liệu cohort. Muốn ra lợi nhuận phải nhân thêm biên lợi nhuận gộp
    (xem m03_clv_margin).
- id: m03_clv_margin
  module: m03
  name_vi: CLV theo lợi nhuận gộp
  name_en: Margin-based CLV
  expression_latex: CLV = AOV \times F \times L \times GM
  expression_python: aov * freq * lifespan * gm
  excel: =B1*B2*B3*B4
  variables:
  - aov
  - freq
  - lifespan
  - gm
  when_to_use: Khi cần so với CAC hoặc ra quyết định đầu tư; đây là dạng đúng nghĩa 'lợi nhuận ròng' của định nghĩa CLV.
- id: m03_clv_discounted
  module: m03
  name_vi: CLV có chiết khấu và retention
  name_en: Discounted CLV with retention
  expression_latex: CLV = \sum_{t=1}^{T} \frac{(Revenue_t - Cost_t) \times Retention_t}{(1+d)^t}
  expression_python: sum((rev_cost) * r**(t-1) / (1+d)**t for t in range(1, T+1))
  excel: =SUMPRODUCT(margin*retention_vector/(1+d)^period_vector)
  variables:
  - rev_cost
  - r
  - d
  - T
  - t
  when_to_use: Khi vòng đời dài, cần giá trị hiện tại để so với CAC trả ngay hôm nay hoặc định giá DN.
- id: m03_clv_subscription
  module: m03
  name_vi: CLV mô hình thuê bao
  name_en: Subscription CLV
  expression_latex: CLV = \frac{ARPU \times GM}{Churn}
  expression_python: arpu * gm / churn
  excel: =B1*B2/B3
  variables:
  - arpu
  - gm
  - churn
  when_to_use: 'Subscription/membership/SaaS: doanh thu lặp lại đều, churn tương đối ổn định.'
- id: m03_cac
