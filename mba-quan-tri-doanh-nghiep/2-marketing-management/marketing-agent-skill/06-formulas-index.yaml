  module: m02
  name_vi: Chi phí trên mỗi đơn hàng (CPO)
  name_en: Cost Per Order (CPO / CPA)
  expression_latex: CPO = \dfrac{\text{Chi phí marketing}}{\text{Số đơn hàng thành công}}
  expression_python: cpo = marketing_cost / orders
  excel: =cost/orders
  variables:
  - marketing_cost
  - orders
  when_to_use: 'Đo hiệu quả Performance và Affiliate: trả tiền theo đơn thay vì theo hiển thị (nguồn nhấn mạnh case Vascara).'
- id: m02_roas_breakeven
  module: m02
  name_vi: ROAS và ROAS hòa vốn
  name_en: Return on Ad Spend and Break-even ROAS
  expression_latex: ROAS = \dfrac{R}{A}, \quad ROAS_{BE} = \dfrac{1}{cm}
  expression_python: roas = revenue / ad_spend; roas_be = 1 / cm
