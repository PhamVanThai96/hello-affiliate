formulas:
- id: m01_weighted_segment_score
  module: m01
  name_vi: Điểm hấp dẫn phân khúc có trọng số
  name_en: Weighted Segment Attractiveness Score
  expression_latex: S_j = \sum_{i=1}^{n} w_i \cdot s_{ij}, \quad \sum_i w_i = 1
  expression_python: sum(w * s for w, s in zip(weights, scores))
  excel: =SUMPRODUCT(weights_range, scores_range)
  variables:
  - w_i
  - s_ij
  - S_j
  when_to_use: 'Bước 5 của quy trình STP: so sánh và xếp hạng nhiều phân khúc để chọn primary/secondary target.'
- id: m01_segment_revenue_potential
  module: m01
  name_vi: Doanh thu tiềm năng của phân khúc
  name_en: Segment Revenue Potential
  expression_latex: R = N \times p \times f \times P
  expression_python: N * p * f * P
  excel: =N*p*f*P
  variables:
  - N
  - p
  - f
  - P
  when_to_use: Tiêu chí 'Quy mô' và 'Lợi nhuận tiềm năng' khi profile phân khúc (Substantial trong DAMAS); sizing nhanh bottom-up
    cho SME.
- id: m01_segment_contribution
  module: m01
  name_vi: Lợi nhuận đóng góp của phân khúc
  name_en: Segment Contribution Profit
  expression_latex: C = R \times m_c
  expression_python: R * mc
  excel: =R*mc
  variables:
  - R
  - m_c
  - C
  when_to_use: Khi hai phân khúc có doanh thu khác nhiều biên (vd sinh viên giá nhạy cảm vs nhân viên văn phòng chịu chi).
- id: m01_segment_share
  module: m01
  name_vi: Tỷ trọng phân khúc
  name_en: Segment Share
  expression_latex: sh_j = \frac{N_j}{\sum_k N_k} \times 100\%
  expression_python: n_j / sum(all_n) * 100
  excel: =n_j/SUM(range)
  variables:
  - N_j
  - sh_j
  when_to_use: Profile cơ cấu khách hàng; kiểm tra các phân khúc cộng đủ 100%; tính độ phủ của target (primary+secondary).
- id: m01_freemium_conversion
  module: m01
  name_vi: Tỷ lệ chuyển đổi trả phí (freemium)
  name_en: Paid Conversion Rate
  expression_latex: CR = \frac{\text{Premium}}{\text{MAU}} \times 100\%
  expression_python: premium / mau * 100
  excel: =premium/mau
  variables:
  - premium
  - mau
  when_to_use: Đánh giá hiệu quả gói miễn phí như công cụ targeting/phễu đưa khách lên bản trả phí.
- id: m01_pct_change
  module: m01
  name_vi: Tỷ lệ thay đổi (tăng trưởng)
  name_en: Percentage Change
  expression_latex: \Delta\% = \frac{V_{after} - V_{before}}{V_{before}} \times 100\%
  expression_python: (after - before) / before * 100
  excel: =(after-before)/before
  variables:
  - V_before
  - V_after
  when_to_use: Đo hiệu quả repositioning (doanh số, nhận diện, tỷ lệ cân nhắc) trước và sau.
- id: m01_perceptual_gap_distance
  module: m01
  name_vi: Khoảng cách tới đối thủ gần nhất trên bản đồ nhận thức
  name_en: Nearest-competitor Distance on Perceptual Map
  expression_latex: d(c) = \min_k \sqrt{(x_c - x_k)^2 + (y_c - y_k)^2}
  expression_python: min(math.dist(cand, p) for p in competitors)
  excel: =MIN(SQRT((xc-x_range)^2+(yc-y_range)^2)) (công thức mảng)
  variables:
  - (x_c, y_c)
  - (x_k, y_k)
  - d(c)
  when_to_use: Tìm khoảng trống (white space) định lượng khi có điểm số nhận thức trung bình từ khảo sát khách.
- id: m02_markup_price
  module: m02
  name_vi: Giá theo chi phí cộng thêm tỷ lệ phụ giá (Cost-plus / Markup)
  name_en: Cost-plus Markup Pricing
  expression_latex: P = C \times (1 + k)
  expression_python: P = C * (1 + k)
  excel: =C*(1+k)
  variables:
  - P
  - C
  - k
  when_to_use: Định giá nhanh theo phương pháp cost-based; làm giá sàn (floor) để kiểm tra giá value-based/competition-based
    không lỗ.
- id: m02_margin_price
  module: m02
  name_vi: Giá theo biên lợi nhuận gộp mục tiêu
  name_en: Target Gross Margin Pricing
  expression_latex: P = \dfrac{C}{1 - m}
  expression_python: P = C / (1 - m)
  excel: =C/(1-m)
  variables:
  - P
  - C
  - m
  when_to_use: Khi chủ DN nghĩ theo margin (ví dụ F&B muốn giá vốn nguyên liệu chiếm 30%) thay vì markup.
- id: m02_markup_margin_convert
  module: m02
  name_vi: Chuyển đổi Markup và Margin
  name_en: Markup-Margin Conversion
  expression_latex: m = \dfrac{k}{1 + k}, \quad k = \dfrac{m}{1 - m}
  expression_python: m = k / (1 + k); k_from_m = m / (1 - m)
  excel: =k/(1+k)
  variables:
  - k
  - m
  when_to_use: Mỗi khi trao đổi với nhà cung cấp, đối tác, nhân viên dùng hai thuật ngữ khác nhau.
- id: m02_breakeven_units
  module: m02
  name_vi: Điểm hòa vốn theo sản lượng
  name_en: Break-even Quantity
  expression_latex: Q^{*} = \dfrac{F}{P - V}
  expression_python: Q = F / (P - V)
  excel: =F/(P-V)
  variables:
  - Q*
  - F
  - P
  - V
  when_to_use: 'Chốt giá/kênh: cần bán bao nhiêu ly/đơn/tháng để không lỗ; so sánh kênh có chi phí cố định khác nhau.'
- id: m02_discount_breakeven_uplift
  module: m02
  name_vi: Mức tăng sản lượng cần có để giảm giá không lỗ
  name_en: Break-even Volume Uplift for a Price Discount
  expression_latex: \dfrac{\Delta Q}{Q} = \dfrac{d}{m - d}
  expression_python: uplift = d / (m - d)
  excel: =d/(m-d)
  variables:
  - d
  - m
  - ΔQ/Q
  when_to_use: Đánh giá flash sale, BOGO, coupon, giảm giá tăng doanh số (Sales Promotion) có đáng làm không.
- id: m02_price_increase_breakeven
  module: m02
  name_vi: Mức giảm sản lượng chịu được khi tăng giá
  name_en: Break-even Volume Loss for a Price Increase
  expression_latex: \dfrac{\Delta Q}{Q} = -\dfrac{p}{m + p}
  expression_python: max_loss = p / (m + p)
  excel: =p/(m+p)
  variables:
  - p
  - m
  when_to_use: Cân nhắc tăng giá (value-based, lạm phát chi phí) mà không giảm lợi nhuận.
- id: m02_economic_value_price
  module: m02
  name_vi: Trần giá theo giá trị kinh tế cho khách (EVC)
  name_en: Economic Value to Customer (value-based price ceiling)
  expression_latex: EVC = V_{ref} + V_{diff}, \quad C \le P \le EVC
  expression_python: evc = v_ref + v_diff; price_ok = (C <= P) and (P <= evc)
  excel: =v_ref+v_diff
  variables:
  - V_ref
  - V_diff
  - C
  when_to_use: Định giá value-based cho sản phẩm khác biệt/premium khi giá đối thủ không phản ánh giá trị thật.
