# m02 - Phong cách lãnh đạo (distill từ 02-leadership-styles.md)
id: "m02"
name_vi: "Phong cách lãnh đạo"
name_en: "Leadership Styles"
source_file: "02-leadership-styles.md"
purpose: >
  Giúp chủ SME/quản lý chọn, phối hợp và chuyển đổi phong cách lãnh đạo (Transformational, Servant, Situational, Charismatic,
  Autocratic, Democratic, Laissez-faire, Authentic, Adaptive, Level 5...) đúng theo mức sẵn sàng của từng nhân sự (D1-D4),
  giai đoạn tổ chức và tình huống; đồng thời đo hiệu quả lãnh đạo bằng chỉ số rẻ, dễ tính (turnover, eNPS, tỷ lệ lỗi, năng suất,
  ROI đào tạo) và nhận diện các cạm bẫy (charisma thiếu đối trọng, bị lợi dụng, chẩn đoán sai, phụ thuộc cá nhân).
when_to_use:
  - "Chủ SME hỏi 'tôi nên lãnh đạo theo phong cách nào?' hoặc 'tại sao nhân viên nghỉ nhiều / thiếu tự giác / không dám quyết?'"
  - "Doanh nghiệp tăng trưởng nhanh (vd từ 20 lên 30+ điểm bán), phong cách cũ của founder bắt đầu 'gãy'."
  - "Cần chẩn đoán mức sẵn sàng (D1-D4) của nhân viên hoặc tổ trưởng và chọn cách giao việc (S1-S4)."
  - "Khủng hoảng / thay đổi lớn cần quyết định nhanh nhưng vẫn giữ niềm tin của đội ngũ."
  - "Cần đo hiệu quả lãnh đạo: turnover, chi phí nghỉ việc, eNPS, 360 feedback, MLQ, fit rate phong cách."
  - "Cần biện minh khoản đầu tư đào tạo tổ trưởng/quản lý bằng ROI."
  - "Founder charismatic/độc đoán cần thiết kế đối trọng (cố vấn, HĐQT độc lập, tách tài sản) và kế hoạch kế nhiệm."
  - "Lập kế hoạch phát triển bản thân thành leader trong 90 ngày."
  - "KHÔNG dùng để gán nhãn tính cách cố định cho một người; phong cách là hành vi có thể đổi theo nhiệm vụ và thời điểm."
prerequisites: ["m01"]
related_modules:
  - "m01 - Lý thuyết động lực: Path-Goal dựa trên Expectancy (Vroom); D-level gồm 'động lực' nên cần hiểu động lực nội tại/ngoại tại"
  - "m03 - Động lực nhóm: S1-S4 áp dụng ở cấp nhóm, tổ trưởng; xung đột và giai đoạn phát triển nhóm"
  - "m04 - Văn hóa tổ chức: lãnh đạo là đòn bẩy đổi văn hóa (Nadella); 'văn hóa không scale' (Soya Garden)"
  - "m05 - Quyền lực và chính trị: autocratic/charismatic liên quan nguồn quyền lực và nhu cầu đối trọng"
  - "m06 - Quản lý xung đột: Healing của Servant, hòa giải, họp rút kinh nghiệm"
  - "m07 - Quản lý thay đổi: Transformational và Adaptive là phong cách dẫn dắt thay đổi"
  - "m08 - Trí tuệ cảm xúc: Empathy, Awareness, Individualized Consideration, tự nhận thức"
  - "m09 - Ra quyết định: nghe rộng quyết gọn (Eisenhower), Autocratic vs Democratic theo thời gian có"
  - "Tài chính (finance-agent-skill): ROI, chi phí cơ hội của nghỉ việc"

concepts:
  - term_vi: "Lãnh đạo"
    term_en: "Leadership"
    definition: >
      Quá trình ảnh hưởng một cá nhân hoặc nhóm để đạt mục tiêu chung thông qua chia sẻ tầm nhìn, truyền cảm hứng và hướng dẫn hành động
      (Bennis: khả năng biến tầm nhìn thành hiện thực; Sinek: chăm sóc những người dưới quyền).
    why_it_matters: >
      Nhiều tổ chức có quá nhiều quản lý nhưng thiếu lãnh đạo: mọi thứ vận hành trơn tru nhưng không ai hỏi 'có đang đi đúng hướng không'.
      Trong SME, chủ doanh nghiệp phải kiêm cả hai vai; sai lầm phổ biến là dồn thời gian vào 'quản lý việc' mà bỏ quên 'lãnh đạo người'.
  - term_vi: "Lãnh đạo khác quản lý"
    term_en: "Leadership vs Management (Kotter 1990; Bennis & Nanus 1985)"
    definition: >
      Quản lý đối phó với sự phức tạp (lập kế hoạch và ngân sách, tổ chức và nhân sự, kiểm soát và giải quyết vấn đề); lãnh đạo đối phó với
      sự thay đổi (định hướng, gắn kết liên minh, truyền cảm hứng). Bennis & Nanus: 4 chiến lược của lãnh đạo hiệu quả là Attention through Vision,
      Meaning through Communication, Trust through Positioning, Deployment of Self.
    why_it_matters: "Phân biệt để biết mình đang thiếu chức năng nào; câu 'quản lý là làm đúng cách, lãnh đạo là làm điều đúng' thường gán cho Drucker và được Bennis phổ biến (nguồn gán ghi trong bài gốc)."
  - term_vi: "Lý thuyết đặc điểm"
    term_en: "Trait Theory (1920s-1940s)"
    definition: "Giả định lãnh đạo có đặc điểm bẩm sinh (thông minh, quyết đoán, tự tin, ngoại hướng, thuyết phục, sức khỏe, chiều cao, ngoại hình)."
    why_it_matters: >
      Ra đời từ quan niệm 'Great Man'. Tổng quan của Stogdill (1948) cho thấy không đặc điểm nào đảm bảo thành công trong mọi tình huống, mở đường
      cho hướng Hành vi và Khả biến. Nghiên cứu hiện đại vẫn thấy một số đặc điểm (trí tuệ cảm xúc, chính trực, tự tin) tương quan với hiệu quả nhưng chỉ là điều kiện cần.
  - term_vi: "Lý thuyết hành vi"
    term_en: "Behavioral Theory (1940s-1960s)"
    definition: "Lãnh đạo là hành vi học được: Ohio State (Initiating Structure và Consideration), Michigan (Likert, 4 hệ thống), Blake & Mouton Managerial Grid 9x9."
    why_it_matters: >
      Phát hiện hai chiều độc lập 'quan tâm việc' và 'quan tâm người' nghĩa là một lãnh đạo có thể cao cả hai (không phải chọn một); là nền tảng cho Grid và Situational.
      Hạn chế: giả định có 'một phong cách tốt nhất' (9,9 hoặc System 4) bất kể hoàn cảnh.
  - term_vi: "Lý thuyết khả biến"
    term_en: "Contingency Theory (1960s-1980s)"
    definition: "Không có phong cách tốt nhất; hiệu quả phụ thuộc độ phù hợp giữa phong cách và hoàn cảnh (Fiedler 1967, House Path-Goal 1971, Hersey & Blanchard 1969)."
    why_it_matters: "Trả lời câu hỏi 'khi nào dùng phong cách nào' mà Behavioral bỏ ngỏ; chuyển từ 'lãnh đạo là ai' sang 'làm gì, khi nào'."
  - term_vi: "Lãnh đạo biến đổi"
    term_en: "Transformational Leadership"
    definition: >
      Lãnh đạo truyền cảm hứng và nâng nhân viên vượt lợi ích cá nhân, tập trung tầm nhìn dài hạn, phát triển cá nhân và thay đổi tổ chức; mô hình 4 I.
    why_it_matters: >
      Burns (1978) phân biệt người 'giao dịch' (trao đổi quyền lợi lấy phiếu/hiệu suất) và người 'biến đổi' (nâng động cơ và đạo đức người đi theo) khi nghiên cứu lãnh đạo chính trị;
      Bass (1985) biến thành mô hình đo được trong doanh nghiệp (nền tảng MLQ). Bass cho rằng Transformational bổ sung (augmentation effect) chứ không thay Transactional.
  - term_vi: "Lãnh đạo giao dịch"
    term_en: "Transactional Leadership"
    definition: "Trao đổi rõ ràng: làm tốt thì thưởng, làm xấu thì phạt (Contingent Reward, Management by Exception chủ động/thụ động)."
    why_it_matters: "Là nền hợp đồng/thưởng phạt cần có; Transformational thêm động lực nội tại phía trên. Chỉ dùng Transactional thì hiệu quả ngắn hạn tốt nhưng nhân viên rời đi khi hết incentive."
  - term_vi: "Lãnh đạo phục vụ"
    term_en: "Servant Leadership (Greenleaf 1970; Spears 10 đặc điểm)"
    definition: "Phục vụ trước, lãnh đạo sau; tập trung phát triển, phúc lợi và quyền lợi của người làm việc và cộng đồng thay vì quyền lực của lãnh đạo."
    why_it_matters: >
      Greenleaf (1970, 'The Servant as Leader', sau khi đọc Journey to the East của Hesse; từng là quản lý nhân sự cấp cao ở AT&T) muốn đảo ngược kim tự tháp quyền lực. Phép thử của ông:
      người được phục vụ có phát triển hơn, khỏe hơn, tự chủ hơn và có xu hướng thành người phục vụ không. Spears (Greenleaf Center, thập niên 1990) rút ra 10 đặc điểm.
  - term_vi: "Lãnh đạo tình huống"
    term_en: "Situational Leadership (Hersey & Blanchard 1969; SLII 1985)"
    definition: "Không có phong cách tốt nhất; lãnh đạo thích ứng phong cách (S1-S4) theo mức phát triển (D1-D4) của người được lãnh đạo, cho từng nhiệm vụ."
    why_it_matters: >
      Ban đầu gọi là Life Cycle Theory (1969), Blanchard tách ra phát triển SLII (1985). Ohio State cho hai chiều việc/người nhưng không nói khi nào dùng tổ hợp nào; Hersey & Blanchard thêm biến thứ ba
      là mức sẵn sàng của người được lãnh đạo, biến mô hình thành công cụ thực hành (khác Fiedler: phong cách có thể đổi). Bằng chứng thực nghiệm còn hạn chế so với mức phổ biến (bài gốc).
  - term_vi: "Mức phát triển (D-level) và phong cách (S-style)"
    term_en: "Development level D1-D4 and Leadership style S1-S4"
    definition: >
      D1 người mới nhiệt tình (năng lực thấp, động lực cao) -> S1 Directing; D2 người học suy chán (năng lực thấp-trung bình, động lực thấp) -> S2 Coaching;
      D3 có năng lực nhưng cẩn thận (năng lực cao, động lực vừa-thấp) -> S3 Supporting; D4 tự chủ (cao, cao) -> S4 Delegating.
    why_it_matters: "Chẩn đoán theo từng nhiệm vụ chứ không theo con người nói chung; một người có thể D4 ở việc A và D1 ở việc B; trong khủng hoảng D4 có thể tụt về D1-D2."
  - term_vi: "Lãnh đạo lôi cuốn"
    term_en: "Charismatic Leadership"
    definition: "Sức lôi cuốn cá nhân tạo ảnh hưởng cảm xúc mạnh (Weber nêu charismatic authority đầu thế kỷ 20; Robert House phát triển lý thuyết hiện đại 1977)."
    why_it_matters: "Charisma là bộ khuếch đại: khuếch đại cả điểm mạnh lẫn điểm yếu đạo đức; không có đối trọng thì thành điểm hỏng duy nhất (Uber, WeWork)."
  - term_vi: "Lãnh đạo chân thực"
    term_en: "Authentic Leadership"
    definition: "Hành động theo giá trị thật, tự nhận thức, minh bạch, không giả vờ, nhận điểm yếu, nói và làm nhất quán."
    why_it_matters: "Bill George (2003) và Avolio & Gardner (2005) phát triển sau bê bối doanh nghiệp đầu 2000 để khôi phục niềm tin vào người đứng đầu. Rủi ro: chia sẻ quá mức làm mất ranh giới nghề nghiệp."
  - term_vi: "Lãnh đạo độc đoán / dân chủ / buông lỏng / hành chính / huấn luyện"
    term_en: "Autocratic / Democratic / Laissez-faire / Bureaucratic / Coach-style"
    definition: "Năm phong cách cổ điển: quyết định tập trung; tham vấn nhưng chốt cuối; không can thiệp; tuân thủ quy tắc tuyệt đối; phát triển người qua coaching và feedback."
    why_it_matters: "Mỗi phong cách có 'đất dùng' riêng (khủng hoảng, tổ chức học, nhân sự D4, ngành tuân thủ chặt, phát triển người) và cái giá riêng; không phong cách nào đúng mọi lúc."
  - term_vi: "Lãnh đạo thích ứng, thách thức kỹ thuật và thích ứng"
    term_en: "Adaptive Leadership (Heifetz 1994); Technical vs Adaptive challenges"
    definition: "Huy động tổ chức đối mặt với vấn đề mới chưa có lời giải sẵn. Vấn đề kỹ thuật có chuyên gia giải được; vấn đề thích ứng đòi hỏi chính con người đổi niềm tin và thói quen."
    why_it_matters: "Lãnh đạo không thể 'giải hộ' vấn đề thích ứng; việc của lãnh đạo là xác định vấn đề từ nhiều góc nhìn, tăng sáng tạo, huy động người xung quanh."
  - term_vi: "Lãnh đạo cấp 5"
    term_en: "Level 5 Leadership (Jim Collins, Good to Great 2001)"
    definition: "Cấp cao nhất trong thang 5 cấp (Individual Contributor, Contributing Team Member, Competent Manager, Effective Leader, Executive/Level 5): khiêm tốn cá nhân cộng quyết tâm mục tiêu, phát triển leader khác, tập trung dài hạn 10+ năm."
    why_it_matters: "Collins nghiên cứu 11 công ty từ 'tốt' lên 'xuất sắc' bền vững và thấy mẫu số chung ở người đứng đầu; là đối trọng với lãnh đạo ngôi sao ồn ào (Charismatic)."
  - term_vi: "Cam kết tổ chức"
    term_en: "Organizational Commitment (Meyer & Allen 1991; OCQ Mowday-Steers-Porter 1979)"
    definition: "Ba thành tố: Affective (muốn ở lại), Continuance (cần ở lại vì kinh tế), Normative (nên ở lại vì trách nhiệm)."
    why_it_matters: "Người ở lại vì bị kẹt sẽ rời khi có cơ hội và làm tối thiểu; người ở lại vì muốn mới đóng góp thêm (extra effort). Lãnh đạo tốt tăng Affective."
  - term_vi: "Điểm mù của lãnh đạo"
    term_en: "Blind spots (qua 360-degree feedback)"
    definition: "Khoảng cách giữa tự đánh giá và đánh giá của cấp dưới/đồng cấp/cấp trên/khách hàng."
    why_it_matters: "Lãnh đạo thường tự đánh giá cao hơn cấp dưới; khoảng cách này chỉ ra nơi cần phát triển."

formulas:
  - id: "m02_turnover_rate"
    name_vi: "Tỷ lệ nghỉ việc"
    name_en: "Employee turnover rate"
    expression_latex: '\text{Turnover} = \dfrac{\text{Số người nghỉ}}{\text{Nhân sự trung bình}} \times 100\%, \quad \text{Nhân sự TB} = \dfrac{N_{dau} + N_{cuoi}}{2}'
    expression_python: "left / ((start + end) / 2) * 100"
    excel: "=B1/AVERAGE(B2,B3)*100"
    variables:
      - {symbol: "left", meaning: "Số người nghỉ việc trong kỳ", unit: "người"}
      - {symbol: "start", meaning: "Nhân sự đầu kỳ", unit: "người"}
      - {symbol: "end", meaning: "Nhân sự cuối kỳ", unit: "người"}
    when_to_use: "Bước đầu 'đo trước khi sửa': lượng hóa hậu quả của phong cách lãnh đạo lên giữ chân nhân sự (cùng eNPS, tỷ lệ lỗi)."
    why_it_works: "Chia cho nhân sự trung bình để so sánh được giữa doanh nghiệp/kỳ có quy mô khác nhau; nhân sự cuối kỳ có thể đã được tuyển bù nên dùng trung bình đầu-cuối."
    assumptions: ["Kỳ đo thường là 12 tháng.", "Cách đếm 'nghỉ việc' thống nhất (tự nguyện/không tự nguyện nên tách riêng nếu có thể)."]
    pitfalls:
      - "Gộp nghỉ không tự nguyện (sa thải) với nghỉ tự nguyện làm sai chẩn đoán phong cách lãnh đạo."
      - "Chỉ nhìn tổng, bỏ qua nghỉ theo nhóm D-level hoặc theo tổ trưởng."
    interpretation: "Turnover cao gợi ý phong cách lãnh đạo không khớp nhu cầu (bài gốc: thấp với Servant, cao với Autocratic). Bài gốc không nêu ngưỡng chuẩn; so với chính DN theo quý."
    example:
      inputs: {left: 24, start: 58, end: 60}
      steps: ["Nhân sự trung bình = (58 + 60) / 2 = 59", "Turnover = 24 / 59 x 100 = 40,68%"]
      result: "40,7%/năm (Case Gỗ Việt Xanh, giả định minh họa)"
  - id: "m02_turnover_cost"
    name_vi: "Chi phí nghỉ việc (khoản lỗ ẩn của lãnh đạo kém)"
    name_en: "Cost of turnover"
    expression_latex: '\text{Chi phí} = N_{nghi} \times (\text{số tháng lương thay thế}) \times \text{lương tháng}'
    expression_python: "left * months_replace * monthly_salary"
    excel: "=B1*B2*B3"
    variables:
      - {symbol: "left", meaning: "Số người nghỉ", unit: "người"}
      - {symbol: "months_replace", meaning: "Chi phí thay một người quy ra số tháng lương (tuyển dụng + đào tạo + giảm năng suất lúc học việc), bài gốc ghi thường 1,5-3 tháng, giả định", unit: "tháng lương"}
      - {symbol: "monthly_salary", meaning: "Lương tháng bình quân", unit: "triệu đồng"}
    when_to_use: "Quy đổi tác hại phong cách lãnh đạo ra tiền để thuyết phục chủ DN đầu tư đào tạo tổ trưởng."
    why_it_works: "Nghỉ việc không chỉ mất người mà mất cả chi phí tuyển, đào tạo và giai đoạn kém năng suất; quy ra tháng lương cho phép ước tính nhanh khi không có số kế toán chi tiết."
    assumptions: ["Hệ số 1,5-3 tháng lương là giả định của bài gốc, cần hiệu chỉnh theo vị trí và ngành.", "Chưa tính phế phẩm, mất khách, mất tri thức."]
    pitfalls: ["Dùng hệ số chung cho mọi vị trí (quản lý, thợ lành nghề thường đắt hơn).", "Coi đây là con số kế toán chính xác thay vì ước tính cấp độ lớn."]
    interpretation: "Là mức tối thiểu của chi phí ẩn; so với chi phí can thiệp để tính ROI."
    example:
      inputs: {left: 24, months_replace: 2.5, monthly_salary: 12}
      steps: ["Chi phí mỗi người = 2,5 x 12 = 30 triệu", "Tổng = 24 x 30 = 720 triệu đồng/năm"]
      result: "720 triệu đồng/năm (giả định minh họa)"
  - id: "m02_enps"
    name_vi: "Chỉ số giới thiệu của nhân viên (eNPS)"
    name_en: "Employee Net Promoter Score"
    expression_latex: '\text{eNPS} = \%\text{Promoter} - \%\text{Detractor} = \dfrac{P - D}{N} \times 100'
    expression_python: "(promoters - detractors) / total * 100"
    excel: "=(COUNTIF(A:A,\">=9\")-COUNTIF(A:A,\"<=6\"))/COUNT(A:A)*100"
    variables:
      - {symbol: "promoters", meaning: "Số người chấm 9-10 cho câu 'bạn có giới thiệu công ty cho bạn bè không' (thang 0-10)", unit: "người"}
      - {symbol: "detractors", meaning: "Số người chấm 0-6", unit: "người"}
      - {symbol: "total", meaning: "Tổng người trả lời (gồm cả Passive 7-8)", unit: "người"}
    when_to_use: "Đo nhanh mức gắn kết/văn hóa dưới tác động của lãnh đạo; theo dõi mỗi quý hoặc nửa năm; làm mục tiêu cho chương trình phát triển lãnh đạo."
    why_it_works: >
      Bắt nguồn từ NPS của Fred Reichheld (2003, Bain & Company) cho khách hàng: người chấm 9-10 mới thực sự giới thiệu, 7-8 'an toàn nhưng không nhiệt tình', 0-6 có thể nói xấu;
      nên nhóm trung lập bị loại khỏi công thức và kết quả là hiệu số hai cực.
    assumptions: ["Khảo sát ẩn danh, đủ tỷ lệ trả lời.", "Dùng cùng thang 0-10 và cùng định nghĩa nhóm qua các kỳ."]
    pitfalls:
      - "Viết thêm dấu % vào kết quả: eNPS tính theo điểm phần trăm, từ -100 đến +100, không có dấu %."
      - "Khảo sát không ẩn danh làm nhân viên chấm 'đẹp'."
      - "Chỉ nhìn eNPS tổng, không cắt theo tổ trưởng/bộ phận."
    interpretation: "Benchmark tham khảo, thay đổi theo ngành: > 30 là tốt, > 50 là xuất sắc (bài gốc). eNPS thấp là tín hiệu cần rà phong cách lãnh đạo."
    example:
      inputs: {promoters: 12, detractors: 24, total: 60}
      steps: ["% Promoter = 12/60 = 20%; % Detractor = 24/60 = 40%", "eNPS = 20 - 40 = -20", "Ví dụ khác: 40 ủng hộ, 40 trung lập, 20 chỉ trích trên 100 người cho eNPS = +20"]
      result: "-20 (dưới benchmark 30; cảnh báo văn hóa, case giả định)"
  - id: "m02_style_fit_rate"
    name_vi: "Tỷ lệ khớp phong cách lãnh đạo (Fit rate)"
    name_en: "Leadership style fit rate"
    expression_latex: '\text{Fit} = \dfrac{\text{Số người nhận đúng phong cách}}{\text{Tổng số người}} \times 100\%'
    expression_python: "matched / total * 100"
    excel: "=B1/B2*100"
    variables:
      - {symbol: "matched", meaning: "Số người mà phong cách lãnh đạo đang dùng khớp D-level của họ", unit: "người"}
      - {symbol: "total", meaning: "Tổng số người được lãnh đạo", unit: "người"}
    when_to_use: "Sau khi chẩn đoán D-level toàn đội: đo độ lệch giữa phong cách thực tế và nhu cầu."
    why_it_works: "Situational Leadership chỉ hiệu quả khi phong cách khớp nhu cầu; một con số fit rate cho thấy bao nhiêu phần trăm đội đang nhận sai phong cách, tiện theo dõi theo quý."
    assumptions: ["D-level được chẩn đoán đúng, theo từng nhiệm vụ.", "Đếm 'khớp' theo quy tắc D1-S1, D2-S2, D3-S3, D4-S4."]
    pitfalls: ["Chẩn đoán D-level sai thì fit rate vô nghĩa.", "Dùng một phong cách cho tất cả (one-size-fits-all) chỉ khớp đúng một nhóm D."]
    interpretation: "Fit rate thấp nghĩa là phần lớn nhân sự nhận sai phong cách (kiểm soát quá mức hoặc bỏ mặc). Bài gốc không đặt ngưỡng; mục tiêu là tăng theo quý."
    example:
      inputs: {matched: 14, total: 60}
      steps: ["Anh Hùng dùng S1 cho tất cả, chỉ khớp nhóm D1 = 14 người", "Fit = 14/60 = 23,3%; lệch = 76,7%"]
      result: "23,3% khớp (case giả định)"
  - id: "m02_roi_intervention"
    name_vi: "ROI của can thiệp phát triển lãnh đạo"
    name_en: "ROI of leadership development"
    expression_latex: '\text{ROI} = \dfrac{\text{Lợi ích} - \text{Chi phí}}{\text{Chi phí}} \times 100\%'
    expression_python: "(benefit - cost) / cost * 100"
    excel: "=(B1-B2)/B2*100"
    variables:
      - {symbol: "benefit", meaning: "Lợi ích đo được (ví dụ chi phí nghỉ việc tiết kiệm được)", unit: "triệu đồng"}
      - {symbol: "cost", meaning: "Chi phí can thiệp (đào tạo, coaching, thời gian)", unit: "triệu đồng"}
    when_to_use: "Biện minh đầu tư đào tạo tổ trưởng/quản lý; so sánh các phương án can thiệp."
    why_it_works: "Quy lợi ích về cùng đơn vị tiền với chi phí để chủ SME ra quyết định như một khoản đầu tư; chỉ tính phần lợi ích chắc chắn đo được thì là ước lượng thận trọng."
    assumptions: ["Lợi ích quy được ra tiền.", "Kết quả cải thiện là giả định, thực tế mất 6-12 tháng và phụ thuộc thị trường lao động."]
    pitfalls: ["Gán toàn bộ cải thiện cho can thiệp, bỏ qua yếu tố thị trường.", "Bỏ sót chi phí thời gian/coaching."]
    interpretation: "ROI dương nghĩa là lợi ích vượt chi phí; ở case dưới đây chưa tính lợi ích từ năng suất và giảm lỗi nên là ước lượng thấp."
    example:
      inputs: {benefit: 450, cost: 120}
      steps: ["Chi phí = 10 tổ trưởng x 8 triệu + 40 triệu coaching = 120 triệu", "Lợi ích = 720 - 270 = 450 triệu (giảm nghỉ việc 24 xuống 9)", "Lợi ích ròng = 450 - 120 = 330 triệu", "ROI = 330/120 = 275%"]
      result: "275% (giả định minh họa)"
  - id: "m02_dlevel_diagnosis"
    name_vi: "Chẩn đoán D-level từ điểm Năng lực và Động lực"
    name_en: "D-level diagnosis scoring rule"
    expression_latex: 'D = \begin{cases} D1 & NL \le 2, \; DL \ge 3 \\ D2 & NL \le 2, \; DL \le 2 \\ D3 & NL \ge 3, \; DL \le 2 \\ D4 & NL \ge 3, \; DL \ge 3 \end{cases}'
    expression_python: "'D4' if ability >= 3 and motivation >= 3 else 'D3' if ability >= 3 else 'D1' if motivation >= 3 else 'D2'"
    variables:
      - {symbol: "ability", meaning: "Điểm năng lực (NL) cho một nhiệm vụ cụ thể, thang nguyên 1-4", unit: "điểm"}
      - {symbol: "motivation", meaning: "Điểm động lực/sự sẵn sàng (ĐL) cho nhiệm vụ đó, thang nguyên 1-4", unit: "điểm"}
    when_to_use: "Chẩn đoán nhanh D-level cho từng người, từng nhiệm vụ, cập nhật mỗi quý; sau đó ánh xạ D1->S1, D2->S2, D3->S3, D4->S4."
    why_it_works: "Hai câu hỏi cốt lõi của Situational là 'biết làm không' và 'muốn/dám làm không'; ngưỡng 2/3 trên thang 1-4 tách thấp (1-2) và cao (3-4) để cho đúng ma trận 2x2."
    assumptions: ["Ngưỡng ≤2 và ≥3 là quy ước của case Gỗ Việt Xanh (giả định thiết kế), không phải chuẩn của SLII.", "Điểm dựa trên quan sát hành vi, không chỉ lời nói."]
    pitfalls: ["Chẩn đoán theo con người thay vì theo nhiệm vụ.", "Chấm theo cảm tính một lần rồi không cập nhật.", "Cho D4 vào việc mới như vẫn là D4 (thực tế có thể là D1)."]
    interpretation: "D1 -> S1 Directing; D2 -> S2 Coaching; D3 -> S3 Supporting; D4 -> S4 Delegating."
    example:
      inputs: {ability: 4, motivation: 2}
      steps: ["Quý: NL 4, ĐL 2 -> NL >= 3 và ĐL <= 2", "Kiểm tra 4 người của case: Lan (1,4)=D1; Tâm (2,2)=D2; Quý (4,2)=D3; Bình (4,4)=D4"]
      result: "D3 -> dùng S3 Supporting"
  - id: "m02_mlq_factor_score"
    name_vi: "Điểm trung bình một yếu tố MLQ"
    name_en: "MLQ factor mean score"
    expression_latex: '\bar{x}_f = \dfrac{1}{n_f}\sum_{i=1}^{n_f} x_i, \quad x_i \in \{0,1,2,3,4\}'
    expression_python: "sum(items) / len(items)"
    excel: "=AVERAGE(B2:B5)"
    variables:
      - {symbol: "items", meaning: "Danh sách điểm các câu thuộc cùng một yếu tố (mỗi câu 0 = không bao giờ đến 4 = thường xuyên, nếu không phải luôn luôn)", unit: "điểm 0-4"}
    when_to_use: "Chấm MLQ 5X (45 câu): 9 yếu tố lãnh đạo x 4 câu = 36 câu, cộng 9 câu kết quả (Extra Effort 3, Effectiveness 4, Satisfaction 2)."
    why_it_works: "Lãnh đạo tốt là một hồ sơ (profile): nhiều Transformational, đủ Contingent Reward, rất ít Laissez-faire; một con số tổng làm mất thông tin này nên tính trung bình riêng từng yếu tố, không cộng tổng 180."
    assumptions: ["MLQ có bản quyền (Mind Garden) và cần dùng đúng bản chuẩn.", "Nên dùng self + 360 để so sánh."]
    pitfalls: ["Cộng tổng 180 điểm.", "Đọc sai chiều: cao là tốt với Transformational, Contingent Reward và các thang kết quả; thấp mới là tốt với Passive Management by Exception và Laissez-faire."]
    interpretation: "Đọc hồ sơ từng yếu tố trên thang 0-4; MLQ chỉ đo Transformational/Transactional/Laissez-faire, không đo Situational hay Servant."
    example:
      inputs: {items: [3, 4, 3, 4]}
      steps: ["Giả sử 4 câu Inspirational Motivation chấm 3, 4, 3, 4 (số minh họa)", "Trung bình = 14 / 4 = 3,5"]
      result: "3,5 trên thang 0-4 (số liệu minh họa của agent, không có trong nguồn)"
  - id: "m02_relative_change"
    name_vi: "Mức thay đổi tương đối và bội số tăng trưởng"
    name_en: "Relative change and growth multiple"
    expression_latex: '\Delta\% = \dfrac{x_{sau} - x_{truoc}}{x_{truoc}} \times 100\%, \quad M = \dfrac{x_{sau}}{x_{truoc}}'
    expression_python: "(after - before) / before * 100"
    excel: "=(B2-B1)/B1*100"
    variables:
      - {symbol: "before", meaning: "Giá trị chỉ số trước can thiệp/ở đầu kỳ", unit: "tùy chỉ số"}
      - {symbol: "after", meaning: "Giá trị sau can thiệp/cuối kỳ", unit: "tùy chỉ số"}
    when_to_use: "So sánh tỷ lệ lỗi, năng suất, doanh thu, giá cổ phiếu trước-sau; phân biệt điểm phần trăm và phần trăm tương đối."
    why_it_works: "Chia cho giá trị gốc cho biết mức cải thiện tương đối; trừ trực tiếp hai tỷ lệ cho điểm phần trăm."
    assumptions: ["Hai kỳ đo cùng định nghĩa."]
    pitfalls: ["Nhầm 'giảm 3,3 điểm %' với 'giảm 50,8%'.", "Gán toàn bộ thay đổi cho phong cách lãnh đạo (thị trường, chiến lược cũng góp phần)."]
    interpretation: "Tỷ lệ lỗi 6,5% xuống 3,2%: giảm 3,3 điểm % và giảm tương đối khoảng 50,8%. Giá cổ phiếu Microsoft 40 lên 300 USD (ước tính): bội số 7,5."
    example:
      inputs: {before: 6.5, after: 3.2}
      steps: ["Giảm tuyệt đối = 6,5 - 3,2 = 3,3 điểm %", "Giảm tương đối = (3,2 - 6,5)/6,5 = -50,8%", "Năng suất 18 lên 21,6 sp/người/tháng = +20%; sản lượng 60 x 21,6 = 1.296 so với 1.080 (+216)"]
      result: "-50,8% (giảm tương đối), case giả định"

frameworks:
  - id: "m02_kotter_bennis"
    name_vi: "Lãnh đạo vs Quản lý (Kotter) và 4 chiến lược của Bennis & Nanus"
    name_en: "Leadership vs Management; Bennis & Nanus 4 strategies"
    origin: "John Kotter (Harvard Business School, 1990); Bennis & Nanus (1985)."
    components:
      - "Lãnh đạo: Setting direction, Building alignment, Inspiring."
      - "Quản lý: Planning & budgeting, Organizing & staffing, Controlling & problem solving."
      - "Bennis & Nanus: Attention through Vision; Meaning through Communication; Trust through Positioning; Deployment of Self."
    when_to_use: "Chẩn đoán chủ SME đang thiên về 'quản lý việc' hay 'lãnh đạo người'."
    how_to_apply: ["Liệt kê 6 chức năng và chấm thời gian bản thân dành cho mỗi chức năng.", "Nếu cột lãnh đạo gần như trống, đặt lịch cho định hướng, gắn kết, truyền cảm hứng.", "Chọn người đảm nhiệm chức năng quản lý để giải phóng thời gian."]
    how_to_read_results: "Tổ chức hiện đại cần cả đối phó phức tạp (quản lý) và đối phó thay đổi (lãnh đạo); thiếu một vế thì lệch."
    pitfalls: ["Coi lãnh đạo tốt hơn quản lý một cách tuyệt đối.", "Dồn mọi thời gian vào kiểm soát việc."]
    example: "Chủ xưởng 60 người chỉ kiểm từng chi tiết sản phẩm (quản lý) nhưng không giải thích vì sao/định hướng (lãnh đạo)."
  - id: "m02_ohio_michigan_grid"
    name_vi: "Nhóm Hành vi: Ohio State, Michigan (Likert), Managerial Grid (Blake & Mouton)"
    name_en: "Behavioral models: Ohio State, Likert Systems, Managerial Grid"
    origin: "Ohio State (từ 1945, Stogdill, Hemphill, Coons); Likert (Michigan, 1950s); Blake & Mouton (1964)."
    components:
      - "Ohio State: Initiating Structure (I, việc) và Consideration (C, người) độc lập: High I-Low C = Directive; High I-High C = Supportive (lý tưởng); Low I-High C = Participative; Low I-Low C = Laissez-faire."
      - "Likert: Exploitative-Authoritative, Benevolent-Authoritative, Consultative, Participative (System 4, 'ideal')."
      - "Grid 9x9 (trục sản xuất x trục con người): 9,1 Authority-Compliance; 1,9 Country Club; 5,5 Middle-of-the-Road; 1,1 Impoverished; 9,9 Team Management (lý tưởng)."
    when_to_use: "Giải thích nền tảng 'việc vs người' và chẩn đoán nhanh thiên lệch của một lãnh đạo."
    how_to_apply: ["Chấm lãnh đạo trên hai chiều việc và người.", "Xác định ô Grid; mục tiêu thường 9,9 nhưng kiểm tra phù hợp tình huống (xem Situational)."]
    how_to_read_results: "Hai chiều độc lập: có thể cao cả hai."
    pitfalls: ["Giả định một phong cách tốt nhất bất kể hoàn cảnh (hạn chế chung của nhóm Behavioral): đội mới cần chỉ dẫn khác đội chuyên gia lâu năm."]
    example: "Founder cà phê 'như gia đình' nhưng thiếu SOP rơi vào 1,9 khi đội phình ra."
  - id: "m02_fiedler"
    name_vi: "Mô hình Khả biến Fiedler"
    name_en: "Fiedler's Contingency Model"
    origin: "Fred Fiedler, 1967. Phong cách đo bằng thang LPC (Least Preferred Coworker)."
    components:
      - "Phong cách: Task-oriented hoặc Relationship-oriented."
      - "Mức thuận lợi của tình huống: Leader-Member Relations (tốt/xấu), Task Structure (rõ/mơ hồ), Position Power (cao/thấp)."
    when_to_use: "Khi phong cách của lãnh đạo khó đổi và có thể đổi bối cảnh (giao việc, cấu trúc, quyền hạn) cho hợp."
    how_to_apply: ["Đánh giá ba yếu tố tình huống.", "Rất thuận lợi hoặc rất bất lợi: dùng Task-oriented; thuận lợi vừa: dùng Relationship-oriented.", "Nếu lệch, đổi tình huống (cấu trúc việc, quyền hạn) thay vì ép lãnh đạo đổi tính."]
    how_to_read_results: "Khi rất thuận lợi nhóm đã sẵn sàng nên chỉ cần chỉ hướng; khi rất bất lợi cần người cầm lái dứt khoát; ở giữa, sự hợp tác của nhóm là chìa khóa."
    pitfalls: ["Fiedler cho rằng phong cách khó đổi, trái với Situational Leadership (lãnh đạo có thể linh hoạt)."]
    example: "Đội mới thành lập, quan hệ chưa tốt, việc mơ hồ: cần Task-oriented rõ ràng."
  - id: "m02_path_goal"
    name_vi: "Lý thuyết Đường đi - Mục tiêu (Path-Goal)"
    name_en: "House's Path-Goal Theory"
    origin: "Robert House, 1971; dựa trên Expectancy Theory (Vroom): nhân viên nỗ lực khi tin rằng nỗ lực dẫn tới kết quả và kết quả có giá trị."
    components: ["Directive: chỉ rõ việc, deadline, tiêu chuẩn.", "Supportive: quan tâm phúc lợi, môi trường thân thiện.", "Participative: lắng nghe, tham vấn trước quyết định.", "Achievement-oriented: đặt mục tiêu cao, tin vào khả năng.", "Biến điều kiện: đặc điểm nhân viên (khả năng, kinh nghiệm, nhu cầu) và bối cảnh công việc (rõ ràng, thách thức, cấu trúc)."]
    when_to_use: "Khi nhân viên không thấy đường từ nỗ lực tới mục tiêu có giá trị."
    how_to_apply: ["Xác định mục tiêu mà nhân viên thật sự quan tâm.", "Dọn chướng ngại (path).", "Chọn trong 4 phong cách theo đặc điểm nhân viên và độ rõ của công việc."]
    how_to_read_results: "Vai trò lãnh đạo là dọn đường để nhân viên đạt mục tiêu của họ."
    pitfalls: ["Dùng Directive cho người đã giỏi và việc đã rõ (thừa)."]
    example: "Thợ mới cần Directive; tổ trưởng giỏi cần Achievement-oriented."
  - id: "m02_4i"
    name_vi: "Mô hình 4 I của Lãnh đạo biến đổi"
    name_en: "Transformational Leadership 4 I (Bass & Avolio)"
    origin: "Bass (1985) từ khái niệm của Burns (1978); Bass & Avolio xác định 4 chiều."
    components:
      - "Idealized Influence: role model, nhất quán lời-việc, nhận trách nhiệm, can đảm, đạo đức, rủi ro tính toán."
      - "Inspirational Motivation: ngôn từ biểu tượng, storytelling, mục tiêu thách thức, kỳ vọng cao, lạc quan."
      - "Intellectual Stimulation: đặt câu hỏi 'tại sao', khuyến khích sáng tạo và tư duy phê phán, chấp nhận thất bại khi thử, không bóp ý kiến khác biệt."
      - "Individualized Consideration: lắng nghe từng người, coaching/mentoring, biết điểm mạnh-yếu, cơ hội phát triển phù hợp, tôn trọng tự quyết."
    when_to_use: "Startup, giai đoạn thay đổi lớn, cần tầm nhìn dài hạn và cam kết vượt mức."
    how_to_apply:
      - "Tự thay đổi hành vi trước khi yêu cầu đội thay đổi (Idealized Influence)."
      - "Phát biểu sứ mệnh/tầm nhìn nối công việc với ý nghĩa lớn hơn doanh số (Inspirational Motivation)."
      - "Hỏi câu hỏi mở: 'Nếu làm lại từ đầu bạn sẽ làm thế nào?' (Intellectual Stimulation)."
      - "SME: họp 1-1 20-30 phút/người/tháng với câu 'Tôi có thể giúp gì để bạn làm việc tốt hơn?' (Individualized Consideration)."
    how_to_read_results: "Đo bằng MLQ (self + 360); kết quả kỳ vọng: extra effort, giữ chân, sáng tạo, thích ứng thay đổi (ước tính, không phải số cố định)."
    pitfalls: ["Có thể thao túng nếu dùng ảnh hưởng thiếu lành mạnh.", "Burnout vì cảm hứng quá mức.", "Không hợp khủng hoảng ngắn hạn (cần thêm Transactional).", "Phụ thuộc cá nhân lãnh đạo."]
    example: "Satya Nadella tại Microsoft (Case 1)."
  - id: "m02_transactional_vs_transformational"
    name_vi: "So sánh Transformational và Transactional"
    name_en: "Transformational vs Transactional (augmentation effect)"
    origin: "Burns (1978), Bass (1985)."
    components: ["Transformational: mục tiêu thay đổi tổ chức; động lực = ý nghĩa, tầm nhìn; hiệu quả cao dài hạn; hạn chế dễ quá lý tưởng.", "Transactional: duy trì hiệu quả; động lực = lương, thưởng, phạt; hiệu quả ngắn hạn; nhân viên nhàm chán và rời khi hết incentive."]
    when_to_use: "Chọn cách tạo động lực: nền giao dịch rõ ràng cộng thêm động lực nội tại."
    how_to_apply: ["Thiết lập nền Contingent Reward rõ ràng (làm gì được gì).", "Thêm tầm nhìn, ý nghĩa, phát triển cá nhân phía trên."]
    how_to_read_results: "Bass: Transformational bổ sung (augment) chứ không thay Transactional."
    pitfalls: ["Bỏ hẳn thưởng phạt rõ ràng vì 'truyền cảm hứng'."]
    example: "Quản lý nhà máy duy trì sản lượng (Transactional) so với Jobs thay đổi Apple (Transformational)."
  - id: "m02_mlq"
    name_vi: "Bảng hỏi MLQ"
    name_en: "Multifactor Leadership Questionnaire (MLQ 5X)"
    origin: "Bruce Avolio và Bernard Bass (1995); bản quyền Mind Garden."
    components:
      - "Transformational (5 x 4 câu): Idealized Influence (Attributed), Idealized Influence (Behavior), Inspirational Motivation, Intellectual Stimulation, Individualized Consideration."
      - "Transactional (3 x 4): Contingent Reward, Active Management by Exception, Passive Management by Exception."
      - "Non-leadership: Laissez-faire (4)."
      - "Kết quả: Extra Effort (3), Effectiveness (4), Satisfaction (2)."
      - "Tổng 45 câu: 36 câu cho 9 yếu tố lãnh đạo, 9 câu cho kết quả; thang 0-4."
    when_to_use: "Đánh giá lãnh đạo (self + 360), xác định điểm mạnh yếu, lập kế hoạch phát triển; benchmark ngành."
    how_to_apply: ["Chọn bản chuẩn có bản quyền.", "Tính trung bình từng yếu tố (0-4), không cộng tổng.", "Đọc hồ sơ: cao là tốt với Transformational, Contingent Reward và kết quả; thấp là tốt với Passive MBE và Laissez-faire."]
    how_to_read_results: "Tìm khoảng cách giữa tự đánh giá và đánh giá của người khác; so benchmark ngành."
    pitfalls: ["Chỉ đo Transformational/Transactional/Laissez-faire, không đo Situational hay Servant.", "Dùng như một con số tổng."]
    example: "Hồ sơ lý tưởng: Transformational cao, Contingent Reward đủ, Laissez-faire rất thấp."
  - id: "m02_servant_spears10"
    name_vi: "10 đặc điểm Lãnh đạo phục vụ (Spears)"
    name_en: "Servant Leadership - Spears' 10 characteristics"
    origin: "Greenleaf (1970); Larry Spears (Greenleaf Center, thập niên 1990) tổng hợp từ các tác phẩm của Greenleaf."
    components:
      - "Listening: lắng nghe chân thành (Town Hall, hộp thư ý kiến, 1-on-1)."
      - "Empathy: hiểu cảm xúc, không phán xét (giảm tạm workload, linh hoạt giờ khi nhân viên khó khăn)."
      - "Healing: hàn gắn mâu thuẫn, an toàn sau thất bại (tổ chức buổi hòa giải)."
      - "Awareness: nhạy với stress, burnout, can thiệp sớm."
      - "Persuasion: thuyết phục thay vì ra lệnh, tìm đồng thuận."
      - "Conceptualization: nghĩ xa, cân bằng tầm xa và vận hành hôm nay (tầm nhìn 3-5 năm)."
      - "Foresight: dự đoán hậu quả của quyết định, học từ quá khứ."
      - "Stewardship: giữ gìn tài sản tổ chức, dùng nguồn lực phục vụ nhân viên, tuân thủ pháp luật và đạo đức."
      - "Commitment to the Growth of People: đầu tư đào tạo, mentoring, đề bạt nội bộ."
      - "Building Community: kết nối thành viên, mục đích chung vượt lợi nhuận."
    when_to_use: "Khi phụ thuộc vào thiện chí của người khác (franchise, đối tác, chuyên môn cao), tổ chức ổn định, ngành con người (giáo dục, y tế, phi lợi nhuận), hoặc cần khôi phục niềm tin."
    how_to_apply: ["Bắt đầu bằng Listening: 1-1, town hall, hộp thư.", "Sửa quan hệ (Empathy + Healing) trước khi nói chiến lược.", "Chọn chỉ số mà đối tác quan tâm nhất (vd lợi nhuận mỗi nhà hàng).", "Đi kèm kỳ vọng rõ ràng và trách nhiệm giải trình hai chiều."]
    how_to_read_results: "Kết quả đến chậm hơn nhưng bền hơn; khó đo ngắn hạn; dùng 360, eNPS, retention."
    pitfalls: ["Bị lợi dụng (doormat) nếu thiếu ranh giới và hậu quả.", "Quá chậm trong khủng hoảng."]
    example: "Cheryl Bachelder tại Popeyes (Case 2)."
  - id: "m02_servant_vs_transformational"
    name_vi: "So sánh Servant và Transformational"
    name_en: "Servant vs Transformational"
    origin: "Tổng hợp trong tài liệu nguồn."
    components: ["Servant: phục vụ người; con người trước; quyền lực chia sẻ; thay đổi chậm cần đồng thuận; hợp tổ chức ổn định.", "Transformational: thay đổi tổ chức; tầm nhìn trước; quyền lực tập trung để dẫn dắt; nhanh hơn; hợp thay đổi, khủng hoảng, startup."]
    when_to_use: "Chọn giữa hai phong cách hiện đại; thực tế nên kết hợp (vision cao + chăm sóc con người)."
    how_to_apply: ["Cần đổi hướng nhanh: thiên Transformational.", "Cần xây niềm tin, phát triển người: thiên Servant.", "Luôn đặt kèm kỷ luật và kỳ vọng."]
    how_to_read_results: "Hạn chế: Servant có thể thiếu quyết liệt; Transformational có thể bỏ quên con người."
    pitfalls: ["Chọn một cực và bỏ cực kia."]
    example: "Indra Nooyi kết hợp cả hai (Case 8)."
  - id: "m02_situational_sii"
    name_vi: "Ma trận Situational Leadership (S1-S4) và Development Level (D1-D4)"
    name_en: "Situational Leadership / SLII"
    origin: "Paul Hersey và Ken Blanchard (1969, 'Life Cycle Theory'); SLII (Blanchard, 1985)."
    components:
      - "S1 Directing: Directive CAO, Supportive THẤP: nói rõ việc gì, làm sao, khi nào. Cho D1."
      - "S2 Coaching: Directive CAO, Supportive CAO: giải thích, hỏi ý kiến, hướng dẫn. Cho D2."
      - "S3 Supporting: Directive THẤP, Supportive CAO: lắng nghe, khuyến khích, trao quyền một phần. Cho D3."
      - "S4 Delegating: Directive THẤP, Supportive THẤP: nhận nhiệm vụ, chỉ hỏi tiến độ. Cho D4."
      - "D1 Enthusiastic Beginner: năng lực thấp, động lực cao (người mới vào việc)."
      - "D2 Disillusioned Learner: năng lực thấp-trung bình, động lực thấp (sau khoảng 3 tháng thấy việc khó)."
      - "D3 Capable but Cautious: năng lực cao, động lực vừa-thấp, thiếu tự tin (vd kinh nghiệm 2 năm, sợ sai)."
      - "D4 Self-Reliant Achiever: năng lực cao, động lực cao (vd 5+ năm)."
    when_to_use: "Đội đa dạng trình độ; giao việc; phát triển nhân viên; dự án mới; chuyển giao quyền."
    how_to_apply:
      - "Chia nhiệm vụ cụ thể (không chẩn đoán chung chung về con người)."
      - "Hỏi 2 câu: Ability (biết làm không, có kinh nghiệm không, từng thành công chưa) và Willingness (muốn làm không, hứng thú không, sợ sai không)."
      - "Ma trận: Động lực cao + Năng lực cao = D4; cao + thấp = D1; thấp + cao = D3; thấp + thấp = D2."
      - "Áp phong cách S tương ứng."
      - "Theo vòng đời một nhiệm vụ mới: khởi động D1/S1 (timeline, deliverable, báo cáo hằng ngày); sau 1-2 tháng D2/S2 (giải thích vì sao, hỏi ý kiến); sau 6-9 tháng D3/S3 (lắng nghe, trao quyết định nhỏ như chọn vendor); sau 18+ tháng D4/S4 (kiểm tra 2 tuần hoặc 1 tháng/lần). Mốc thời gian là ví dụ minh họa của bài gốc."
      - "Khủng hoảng: D4 có thể tụt về D1-D2, lãnh đạo tạm quay S1 rồi nâng dần."
      - "Cập nhật D-level mỗi quý."
    how_to_read_results: "Phong cách khớp D-level là tốt; đo bằng fit rate, turnover, lỗi, eNPS."
    pitfalls: ["Chẩn đoán sai (coi D2 là D4, ủy quyền hết).", "Một người có thể D4 ở việc này, D1 ở việc khác.", "Không phù hợp lãnh đạo cấp C (bài gốc).", "Bằng chứng thực nghiệm còn hạn chế so với mức phổ biến.", "Dao động S1-S4 theo tâm trạng."]
    example: "Xưởng Gỗ Việt Xanh (Case 9)."
  - id: "m02_authentic_charismatic"
    name_vi: "Authentic và Charismatic Leadership"
    name_en: "Authentic and Charismatic Leadership"
    origin: "Authentic: Bill George (2003), Avolio & Gardner (2005). Charismatic: Weber (đầu thế kỷ 20), House (1977)."
    components: ["Authentic: biết giá trị, không giả vờ, nhận điểm yếu, nói-làm nhất quán; lợi ích: tin tưởng sâu, giảm stress; hạn chế: chia sẻ quá nhiều, không hợp khi tổ chức có vấn đề an toàn.", "Charismatic: tự tin, nhiệt tình, nói chuyện giỏi, cảm xúc mạnh; lợi ích: truyền cảm hứng, hút người tài; hạn chế: dễ thao túng, nhân viên nghe theo không suy nghĩ, tổ chức hỗn loạn khi lãnh đạo đi."]
    when_to_use: "Startup cần hút tài năng nhanh (Charismatic) kèm Authentic để cân bằng; khôi phục niềm tin (Authentic)."
    how_to_apply: ["Ghép Charisma với KPI khách quan và 360 feedback.", "Charisma + Authentic + Servant = lành mạnh; Charisma + Autocratic + thao túng = độc hại."]
    how_to_read_results: "Charisma là bộ khuếch đại, không phải thước đo năng lực."
    pitfalls: ["Dùng charisma thay KPI và quy trình.", "Ưu ái người 'cùng vibe' bỏ qua hiệu suất thực."]
    example: "Kalanick (Case 4) và Neumann (Case 5)."
  - id: "m02_classic_styles"
    name_vi: "Autocratic, Democratic, Laissez-faire, Bureaucratic, Coach-style"
    name_en: "Classic leadership styles"
    origin: "Phân loại cổ điển trong tài liệu nguồn."
    components:
      - "Autocratic: lãnh đạo quyết mọi thứ. Dùng khi khủng hoảng, việc lặp lại, nhân viên thiếu kinh nghiệm. Hạn chế: người sáng tạo bỏ đi, không phát triển đội, khó kế thừa."
      - "Democratic: lắng nghe, lãnh đạo chốt cuối. Lợi: được nghe, quyết định tốt hơn, cam kết hơn. Hạn chế: chậm, khó xử lý khủng hoảng."
      - "Laissez-faire: tối thiểu can thiệp. Dùng cho D4, tổ chức sáng tạo cao, động lực nội tại cao. Hạn chế: công việc lơ lửng, khó giữ chuẩn chất lượng; chỉ hiệu quả khi người được giao đủ năng lực và có mục tiêu chung rõ ràng."
      - "Bureaucratic: tuân thủ quy tắc tuyệt đối. Dùng cho ngân hàng, bảo hiểm, y tế, hàng không. Hạn chế: hạn chế sáng tạo, chậm thích ứng (IBM đầu thập niên 1990 thường được nhắc, diễn giải)."
      - "Coach-style: kỳ vọng cao, feedback thường xuyên, phát triển kỹ năng. Lợi: retention, hiệu suất dài hạn. Hạn chế: tốn thời gian, cần kỹ năng coaching."
    when_to_use: "Chọn theo tình huống; xem bảng so sánh và quy tắc quyết định."
    how_to_apply: ["Khớp phong cách với điều kiện sử dụng ở trên.", "Có quy tắc chuyển phong cách khi điều kiện đổi (hết khủng hoảng thì rời Autocratic)."]
    how_to_read_results: "Hiệu quả ngắn hạn/dài hạn (bài gốc, định tính): Autocratic ngắn hạn rất cao dài hạn thấp; Laissez-faire cao nếu nhân viên tốt, dài hạn trung bình; Democratic trung bình/cao."
    pitfalls: ["Autocratic kéo dài sau khi khủng hoảng qua.", "Laissez-faire cho nhân viên D1."]
    example: "Eisenhower dùng nghe rộng, quyết gọn (Case 3)."
  - id: "m02_adaptive"
    name_vi: "Lãnh đạo thích ứng (Heifetz)"
    name_en: "Adaptive Leadership"
    origin: "Ronald Heifetz (Harvard Kennedy School, 1994)."
    components: ["Technical challenge: có giải pháp rõ (gọi thợ sửa máy).", "Adaptive challenge: vấn đề mới chưa biết cách giải (vd mô hình kinh doanh đổi vì COVID).", "Cách làm: xác định vấn đề từ nhiều góc nhìn; tăng sáng tạo (không dùng giải pháp sẵn có); huy động người xung quanh."]
    when_to_use: "Khi chuyên gia không giải được vì người trong tổ chức phải đổi niềm tin/thói quen: cloud thay license (Nadella), đổi danh mục sản phẩm (PepsiCo), giai đoạn Mature/Decline."
    how_to_apply: ["Phân loại vấn đề: kỹ thuật hay thích ứng.", "Với thích ứng: nhiều góc nhìn, thử nghiệm, huy động người, không 'giải hộ'."]
    how_to_read_results: "Nếu giải pháp kỹ thuật không hiệu quả sau nhiều lần, có thể là adaptive challenge."
    pitfalls: ["Giải vấn đề thích ứng bằng quyết định kỹ thuật từ trên xuống."]
    example: "Microsoft từ Windows-only sang Cloud + đa nền tảng."
  - id: "m02_level5"
    name_vi: "Lãnh đạo cấp 5 (Jim Collins)"
    name_en: "Level 5 Leadership"
    origin: "Jim Collins, Good to Great (2001), nghiên cứu 11 công ty."
    components: ["Cấp 1 Individual Contributor; 2 Contributing Team Member; 3 Competent Manager; 4 Effective Leader; 5 Executive (khiêm tốn cá nhân + quyết tâm mục tiêu).", "Không đặt lợi ích cá nhân lên trước; phát triển leader khác; tập trung 10+ năm.", "Ví dụ: Darwin Smith (Kimberly-Clark) trung tâm của Collins; Warren Buffett (ví dụ thường được nhắc)."]
    when_to_use: "Thiết kế hình mẫu lãnh đạo bền vững, kế nhiệm, đối trọng với founder ngôi sao."
    how_to_apply: ["Chấm bản thân trên thang 5 cấp.", "Đầu tư phát triển người kế cận.", "Chỉ ra quyết tâm mục tiêu, không quyết tâm cho cái tôi."]
    how_to_read_results: "Lãnh đạo ít ồn ào thường bền hơn lãnh đạo ngôi sao; Level 5 mô tả tính cách và động cơ."
    pitfalls: ["Hiểu Level 5 là 'nhún nhường' thiếu quyết liệt (thực ra quyết tâm rất cao)."]
    example: "Phát triển lãnh đạo kế cận là bằng chứng bền nhất của lãnh đạo tốt."
  - id: "m02_style_by_stage"
    name_vi: "Chọn phong cách theo giai đoạn tổ chức"
    name_en: "Style by organizational life stage"
    origin: "Bảng 5.1 của tài liệu nguồn (tổng hợp thực hành)."
    components:
      - "Startup (0-2 năm): Transformational + Charismatic (cần vision rõ, tập hợp người nhanh, tạo động lực không bằng tiền)."
      - "Growth (2-5 năm): Transformational + Situational (giữ vision, phát triển nhân viên mới)."
      - "Established (5-15 năm): Servant + Democratic (phát triển leader khác, tăng engagement, chia sẻ quyền)."
      - "Mature/Decline: Transformational (lại) + Adaptive (đổi mindset, tìm cơ hội mới)."
    when_to_use: "Xác định phong cách chủ đạo theo vòng đời doanh nghiệp."
    how_to_apply: ["Xác định giai đoạn của DN.", "Chọn tổ hợp phong cách, đặt mốc rà soát khi sang giai đoạn kế."]
    how_to_read_results: "Phong cách cần đổi khi DN lớn lên; 'văn hóa không scale' là lỗi điển hình."
    pitfalls: ["Giữ phong cách startup ở giai đoạn growth (Soya Garden)."]
    example: "Soya Garden từ 20 lên 30 quán."
  - id: "m02_style_by_situation"
    name_vi: "Chọn phong cách theo tình huống"
    name_en: "Style by situation"
    origin: "Bảng 5.2 của tài liệu nguồn."
    components:
      - "Khủng hoảng (tái cơ cấu, sáp nhập): Autocratic (ngắn hạn) + Transformational (dài hạn)."
      - "Dự án mới / R&D: Transformational + Coach-style."
      - "Operations / Manufacturing: Situational + Servant."
      - "Phi lợi nhuận: Servant + Democratic."
      - "Nhóm tài năng cao: Charismatic + Laissez-faire."
      - "Công ty gia đình: Autocratic + Servant."
    when_to_use: "Chọn nhanh phong cách theo loại tình huống."
    how_to_apply: ["Xác định loại tình huống, chọn cặp phong cách, chuẩn bị quy tắc chuyển phong cách."]
    how_to_read_results: "Tổ hợp: một phong cách chủ đạo, một phong cách bổ sung/đối trọng."
    pitfalls: ["Giữ phong cách khủng hoảng sau khi đã ổn định."]
    example: "CEO mới cắt giảm 20% nhân sự (Autocratic) rồi xây vision mới (Transformational)."
  - id: "m02_decision_tree"
    name_vi: "Cây quyết định chọn phong cách và bảng câu hỏi trước khi chọn"
    name_en: "Leadership style decision tree and question table"
    origin: "Mục VII của tài liệu nguồn (thực hành)."
    components:
      - "Khủng hoảng -> S1/S2 + Autocratic (quyết nhanh, cấp task, chỉ rõ, deadline)."
      - "Startup -> Transformational + Charismatic (tuyển talent nhanh, truyền cảm hứng, tầm nhìn)."
      - "Tổ chức ổn định và đội có nhiều mức kỹ năng -> Situational S1-S4 (phát triển từng người)."
      - "Tổ chức ổn định và đội đồng đều -> Servant + Democratic (xây culture, lắng nghe, hỗ trợ)."
      - "Bảng câu hỏi: gấp (< 1 tuần) -> S1 + Autocratic; đội D1-D4 hỗn hợp -> Situational; cần tầm nhìn dài hạn mới -> Transformational; nhân viên muốn tự chủ cao -> Servant + Situational S3-S4; trust thấp -> Servant + Healing; người tài D4 -> S4 + Authentic; công ty khủng hoảng -> S1 + Transformational dần; mới vào chưa hiểu context -> Listening trước."
    when_to_use: "Khi lãnh đạo mới nhận việc hoặc đang phân vân phong cách."
    how_to_apply: ["Trả lời bảng câu hỏi theo thứ tự ưu tiên (gấp, đội, tầm nhìn, tự chủ, niềm tin).", "Chọn phong cách và ghi lại lý do."]
    how_to_read_results: "Đây là gợi ý ban đầu; luôn kiểm tra lại bằng chẩn đoán D-level và dữ liệu thật."
    pitfalls: ["Áp cây quyết định máy móc, bỏ qua tình huống riêng."]
    example: "Chủ xưởng mới tiếp quản, chưa hiểu context: bắt đầu bằng Listening."
  - id: "m02_360"
    name_vi: "Phản hồi 360 độ"
    name_en: "360-degree feedback"
    origin: "Tài liệu nguồn; công cụ liên quan Hogan Leadership Assessment (360, leadership derailers)."
    components: ["Người đánh giá: tự đánh giá, cấp dưới trực tiếp, cấp trên, đồng cấp, khách hàng/đối tác.", "Tiêu chí: Listening & Communication, Decision making, Delegation, Development of others, Integrity & Authenticity, Vision & Strategy."]
    when_to_use: "Phát hiện điểm mù; 1-2 lần/năm; đầu và cuối kế hoạch 90 ngày."
    how_to_apply: ["Lãnh đạo tự đánh giá.", "Mời 5-10 người đánh giá.", "So sánh khoảng cách tự đánh giá và đánh giá của người khác.", "Chọn 1-2 mục tiêu phát triển."]
    how_to_read_results: "Khoảng cách lớn (tự đánh giá cao hơn người khác) chỉ ra điểm mù cần ưu tiên."
    pitfalls: ["Tốn thời gian, không nên làm hằng tháng.", "Không ẩn danh làm phản hồi méo."]
    example: "Listening 60/100 lên 75/100 sau 90 ngày (baseline và target ví dụ)."
  - id: "m02_commitment_3"
    name_vi: "Cam kết tổ chức 3 thành tố"
    name_en: "Meyer & Allen three-component commitment"
    origin: "Meyer & Allen (1991); OCQ (Mowday, Steers & Porter, 1979)."
    components: ["Affective: muốn ở lại.", "Continuance: cần ở lại vì kinh tế.", "Normative: nên ở lại vì trách nhiệm."]
    when_to_use: "Đánh giá chất lượng gắn bó của nhân viên dưới tác động lãnh đạo."
    how_to_apply: ["Khảo sát OCQ hoặc câu hỏi tương đương.", "Mục tiêu: tăng Affective."]
    how_to_read_results: "Continuance cao mà Affective thấp: người bị kẹt, sẽ rời khi có cơ hội."
    pitfalls: ["Giữ người bằng 'giam lỏng' kinh tế (tăng Continuance) thay vì tạo gắn bó."]
    example: "Thợ lành nghề ở lại vì lương cao nhưng làm tối thiểu."
  - id: "m02_performance_metrics_map"
    name_vi: "Bảng chỉ số hiệu quả lãnh đạo và phong cách cải thiện"
    name_en: "Leadership performance metrics map"
    origin: "Bảng 8.5 tài liệu nguồn."
    components:
      - "Productivity (output/hour): Transformational + Situational."
      - "Retention: Servant + Transformational."
      - "Turnover: thấp với Servant, cao với Autocratic."
      - "Quality (lỗi, rework, hài lòng khách): Situational + Servant."
      - "Innovation (ý tưởng mới, patent): Transformational + Situational."
      - "Safety (tai nạn, chấn thương): Servant + Democratic."
      - "Profitability: Transformational (dài hạn) + Situational (ngắn hạn)."
    when_to_use: "Chọn chỉ số theo mục tiêu và phong cách đang triển khai."
    how_to_apply: ["Chọn 3-4 chỉ số rẻ, dễ đo: turnover, eNPS, tỷ lệ lỗi, năng suất.", "Đặt baseline, mục tiêu, kiểm tra hằng quý."]
    how_to_read_results: "Liên hệ là tương quan định tính theo bài gốc, không chứng minh nhân quả."
    pitfalls: ["Gán mọi kết quả tài chính cho phong cách lãnh đạo."]
    example: "Case Gỗ Việt Xanh theo dõi 4 chỉ số."
  - id: "m02_plan_90days"
    name_vi: "Kế hoạch phát triển bản thân thành leader 90 ngày"
    name_en: "90-day leader development plan"
    origin: "Mục IX tài liệu nguồn."
    components:
      - "Tháng 1 Self-Awareness: MLQ self-assessment, 360 từ 5-10 người, viết leadership philosophy, phân tích feedback, chọn 1-2 mục tiêu, tìm mentor, viết kế hoạch, họp 1-on-1 với từng nhân viên."
      - "Tháng 2 Skill-building: Active Listening (nghe 70%, nói 30% trong họp), chẩn đoán D1-D4 và thử đổi phong cách cho từng người, coaching bi-weekly, peer group 5-7 leader."
      - "Tháng 3 Implementation: áp dụng hằng ngày, thu feedback ẩn danh hoặc 1-on-1, họp team chia sẻ (vulnerability), eNPS, 360 lần 2, lập kế hoạch quý sau với 3 mục tiêu."
      - "Tiêu chí thành công (ví dụ baseline/target): Listening 60 lên 75 (đạt khi >= 75); eNPS 20 lên 40 (đạt >= 35); Retention 80% lên 90% (>= 90%); % D3+D4 50% lên 70% (>= 70%)."
    when_to_use: "Lãnh đạo cam kết cải thiện bản thân có đo lường."
    how_to_apply: ["Làm theo 3 tháng với mục tiêu đo được.", "Chấm lại 360 và eNPS vào tháng 3 để so baseline."]
    how_to_read_results: "Thành công khi đạt ngưỡng mục tiêu của từng chỉ số."
    pitfalls: ["Đặt quá nhiều mục tiêu một lúc (chỉ 1-2).", "Không đo lại."]
    example: "Mục tiêu Listening: học Active Listening, đọc Nonviolent Communication, feedback hằng tháng từ team."

procedures:
  - id: "m02_proc_choose_style"
    name: "Chọn phong cách lãnh đạo cho tình huống"
    steps:
      - "Xác định bối cảnh: khủng hoảng? startup? tổ chức ổn định? thời gian quyết định (< 1 tuần)?"
      - "Xác định đội: có mix D1-D4? có người tài D4? niềm tin thấp?"
      - "Tra cây quyết định/bảng câu hỏi để có phong cách ban đầu (vd khủng hoảng -> S1 + Autocratic; đội đa dạng -> Situational)."
      - "Kiểm tra bằng chẩn đoán D-level theo từng nhiệm vụ."
      - "Đặt quy tắc chuyển phong cách (khi nào bàn, khi nào chốt; khi nào quay lại S3/S4)."
      - "Đo: turnover, eNPS, lỗi, năng suất; rà soát mỗi quý."
    outputs: "Phong cách chủ đạo + phong cách bổ sung/đối trọng + quy tắc chuyển + chỉ số theo dõi."
  - id: "m02_proc_diagnose_d"
    name: "Chẩn đoán D-level và chọn S-style cho từng người"
    steps:
      - "Liệt kê nhiệm vụ then chốt của từng người."
      - "Với mỗi cặp người-nhiệm vụ chấm Năng lực (1-4) và Động lực (1-4) dựa trên quan sát hành vi, kết quả thực tế."
      - "Áp quy tắc: NL<=2 và ĐL>=3 là D1; NL<=2 và ĐL<=2 là D2; NL>=3 và ĐL<=2 là D3; NL>=3 và ĐL>=3 là D4."
      - "Ánh xạ D1-S1, D2-S2, D3-S3, D4-S4 và ghi hành động cụ thể (SOP, họp 15 phút đầu tuần, cho đề xuất cải tiến, giao trọn một đơn hàng)."
      - "Tính fit rate = số người nhận đúng phong cách / tổng; cập nhật mỗi quý."
    outputs: "Bảng người x nhiệm vụ x D-level x S-style + fit rate."
  - id: "m02_proc_diagnose_cost"
    name: "Đo trước khi sửa: lượng hóa chi phí của phong cách lãnh đạo hiện tại"
    steps:
      - "Tính turnover = nghỉ / nhân sự trung bình."
      - "Ước chi phí thay một người (1,5-3 tháng lương, giả định) rồi nhân số người nghỉ."
      - "Chạy khảo sát eNPS ẩn danh."
      - "Đo tỷ lệ lỗi và năng suất."
      - "Phân nhóm D-level toàn đội và tính fit rate."
      - "Ước ROI can thiệp = (lợi ích - chi phí) / chi phí."
    outputs: "Một trang số liệu: turnover, chi phí nghỉ việc, eNPS, lỗi, năng suất, fit rate, ROI dự kiến."
  - id: "m02_proc_scale_style"
    name: "Chuyển phong cách khi doanh nghiệp scale (tránh 'văn hóa không scale')"
    steps:
      - "Đo D-level từng quán trưởng/tổ trưởng mỗi quý và gắn phong cách tương ứng."
      - "Đầu tư SOP và đào tạo cho D1/D2 (S1/S2) trước khi nói tầm nhìn."
      - "Xây tầng quản lý trung gian (vd Area Manager) để nhân bản phong cách lãnh đạo."
      - "Chuyển văn hóa từ 'gia đình' sang 'cộng đồng có nguyên tắc'."
    outputs: "SOP + chương trình đào tạo + cơ cấu tầng giữa + văn hóa có nguyên tắc."
  - id: "m02_proc_crisis"
    name: "Quy trình lãnh đạo trong khủng hoảng"
    steps:
      - "Giai đoạn chuẩn bị/còn thời gian: nghe rộng (S3/S4), tận dụng chuyên môn."
      - "Khi chốt thời điểm: tự quyết (S1), giải thích lý do, nhận trách nhiệm."
      - "Sau khủng hoảng: họp rút kinh nghiệm công khai, chuyển lại S3/S4."
      - "Dài hạn: dựng vision mới (Transformational)."
    outputs: "Quy tắc chuyển phong cách được cả đội hiểu trước."
  - id: "m02_proc_guardrails"
    name: "Thiết lập đối trọng cho founder charismatic/độc đoán"
    steps:
      - "Có ít nhất một cố vấn hoặc thành viên HĐQT độc lập dám phản biện; CFO có quyền phản biện."
      - "Tách bạch tài sản cá nhân và doanh nghiệp từ đầu."
      - "Đo văn hóa bằng dữ liệu (eNPS, khiếu nại, tỷ lệ nghỉ việc)."
      - "Ghép charisma với KPI và quy trình, không thay thế."
      - "Lập kế hoạch kế nhiệm (ít nhất 2 người), tài liệu hóa quy trình."
    outputs: "Cơ chế quản trị giảm rủi ro điểm hỏng duy nhất."

decision_rules:
  - "Nếu tình huống gấp (quyết định trong < 1 tuần) hoặc khủng hoảng thì dùng S1 + Autocratic, giải thích lý do, rồi chuyển lại S3/S4 và họp rút kinh nghiệm sau khi ổn định."
  - "Nếu đội có nhiều mức D1-D4 thì dùng Situational (S1-S4 linh hoạt theo từng người và từng nhiệm vụ), không dùng một phong cách cho tất cả."
  - "Nếu nhân viên mới, năng lực thấp, động lực cao (D1) thì dùng S1 Directing: SOP, kèm cặp 1-1; nếu năng lực thấp và động lực tụt (D2) thì S2 Coaching: giải thích vì sao, ghi nhận tiến bộ nhỏ."
  - "Nếu nhân viên có năng lực cao nhưng thiếu tự tin/động lực (D3) thì S3 Supporting: lắng nghe, cho tự đề xuất, không kiểm từng chi tiết; nếu cao cả hai (D4) thì S4 Delegating: giao trọn việc, chỉ báo cáo kết quả."
  - "Nếu một người D4 ở việc A nhưng giao việc B mới thì chẩn đoán lại theo việc B (có thể D1) và đổi S tương ứng."
  - "Nếu cần tầm nhìn dài hạn mới, đổi hướng, startup thì dùng Transformational (+ Charismatic), nhưng thêm đối trọng và chăm sóc con người để tránh burnout."
  - "Nếu quan hệ/niềm tin bị tổn hại hoặc bạn phụ thuộc thiện chí đối tác (franchise) thì dùng Servant: Listening, Healing, thuyết phục, kèm trách nhiệm giải trình hai chiều."
  - "Nếu mới nhận vị trí, chưa hiểu context thì lắng nghe (Listening) trước khi quyết định."
  - "Nếu founder charismatic hoặc độc đoán thì bắt buộc có cố vấn/HĐQT độc lập phản biện, tách tài sản cá nhân và doanh nghiệp, đo văn hóa bằng eNPS/khiếu nại/turnover."
  - "Nếu doanh nghiệp tăng quy mô (vd 20 lên 30 điểm bán) thì phong cách 1-1 của founder không còn scale: xây SOP, đào tạo, tầng quản lý trung gian."
  - "Nếu eNPS thấp (thấp hơn benchmark 30) hoặc turnover cao thì rà phong cách lãnh đạo: tính fit rate, phân nhóm D-level, kiểm tra kiểm soát quá mức nhóm D3/D4 và bỏ mặc nhóm D1/D2."
  - "Nếu vấn đề là adaptive (giải pháp kỹ thuật không hiệu quả, con người phải đổi niềm tin) thì dùng Adaptive: nhiều góc nhìn, thử nghiệm, huy động người, không giải hộ."
  - "Nếu nhóm toàn người D4, sáng tạo cao, mục tiêu chung rõ thì mới dùng Laissez-faire; nếu chưa chắc năng lực thì không dùng."
  - "Nếu ngành đòi tuân thủ chặt (ngân hàng, bảo hiểm, y tế, hàng không) thì Bureaucratic hợp lý, nhưng cần kênh đổi mới để tránh chậm thích ứng."
  - "Nếu nhân viên làm việc 80 giờ/tuần vì 'cảm hứng' thì cảnh báo Transformational burnout: theo dõi cân bằng công việc-cuộc sống, ghi nhận kết quả chứ không chỉ nỗ lực."
  - "Nếu lãnh đạo hay 'cứu' nhân viên mà không accountability thì chuyển sang Servant + kỳ vọng và hậu quả rõ ràng (Servant không phải doormat)."
  - "Nếu doanh nghiệp phụ thuộc vào một leader thì tài liệu hóa quy trình, phân tán tầm nhìn, đào tạo ít nhất 2 người kế nhiệm (Level 5)."

benchmarks:
  - {metric: "eNPS tốt", value: "> 30", context: "Tham khảo, thay đổi theo ngành (bài gốc)", confidence: "medium"}
  - {metric: "eNPS xuất sắc", value: "> 50", context: "Tham khảo, thay đổi theo ngành (bài gốc)", confidence: "medium"}
  - {metric: "Chi phí thay một nhân sự", value: "1,5-3 tháng lương (giả định trong bài gốc)", context: "Gồm tuyển dụng, đào tạo, giảm năng suất; cần hiệu chỉnh theo vị trí", confidence: "low"}
  - {metric: "Họp 1-1 định kỳ", value: "20-30 phút/người/tháng", context: "Khuyến nghị thực hành cho SME (bài gốc)", confidence: "medium"}
  - {metric: "Tỷ lệ nghe/nói trong họp khi luyện Active Listening", value: "70% nghe, 30% nói", context: "Bài tập kế hoạch 90 ngày (bài gốc)", confidence: "low"}
  - {metric: "Mục tiêu 90 ngày: Listening 360", value: "60 lên >= 75/100", context: "Baseline/target ví dụ của bài gốc", confidence: "low"}
  - {metric: "Mục tiêu 90 ngày: eNPS", value: "20 lên >= 35 (target 40)", context: "Ví dụ bài gốc", confidence: "low"}
  - {metric: "Mục tiêu 90 ngày: Retention", value: "80% lên >= 90%", context: "Ví dụ bài gốc", confidence: "low"}
  - {metric: "Mục tiêu 90 ngày: % nhân sự D3+D4", value: "50% lên >= 70%", context: "Ví dụ bài gốc", confidence: "low"}
  - {metric: "Chênh lệch hiệu suất do Transformational", value: "Meta-analysis cho thấy tương quan dương; con số 20-30% trong tài liệu cũ chỉ là ước tính minh họa", context: "Không dùng như số liệu thật", confidence: "low"}
  - {metric: "Turnover case giả định trước/sau can thiệp", value: "40,7% xuống 15,0%", context: "Case Gỗ Việt Xanh (giả định minh họa); thực tế mất 6-12 tháng", confidence: "low"}
  - {metric: "Thang điểm MLQ", value: "0-4 theo từng yếu tố; 45 câu (36 lãnh đạo + 9 kết quả)", context: "MLQ 5X (Avolio & Bass 1995)", confidence: "high"}
  - {metric: "Phân loại eNPS", value: "Promoter 9-10; Passive 7-8; Detractor 0-6", context: "Theo Reichheld (2003, Bain) cho NPS", confidence: "high"}

pitfalls:
  - "Dao động thất thường (Pendulum Swinging): hôm nay S1 hôm sau S4 theo tâm trạng. Sửa: xác định D-level rõ, ghi lại phong cách đã dùng, review nhất quán, nhờ mentor."
  - "One-size-fits-all: dùng một phong cách cho tất cả (ví dụ Delegating cho D1, hoặc S1 cho D4). Sửa: assess từng người, train quản lý, check-in 'phong cách tôi dùng có phù hợp không?'."
  - "Charisma lạm dụng (Toxic Charisma): ưu ái một số người, bỏ qua hiệu suất thật. Sửa: Charisma + KPI khách quan + 360; Charisma + Authentic + Servant lành mạnh; Charisma + Autocratic + thao túng là độc hại."
  - "Servant Leadership Abuse: quá phục vụ, 'cứu' nhân viên không trách nhiệm giải trình. Sửa: Servant khác doormat, rõ kỳ vọng và hậu quả, vẫn chốt quyết định cuối khi cần."
  - "Transformational Burnout: truyền cảm hứng đến mức đội làm quá sức (80 giờ/tuần). Sửa: Transformational + Servant, theo dõi work-life balance, ăn mừng kết quả, hỏi 'bạn có cần nghỉ không?'."
  - "Situational Misdiagnosis: sai D-level (nghĩ D4 nhưng thực D2). Sửa: hỏi cụ thể khả năng và động lực, quan sát hành vi, check-in và cập nhật."
  - "Organizational Fragility: tổ chức phụ thuộc một leader. Sửa: đào tạo leader khác, tài liệu hóa quy trình, phân tán tầm nhìn, Level 5."
  - "Nhầm gán nhãn phong cách (diễn giải của tài liệu) với kết luận về con người thật; số liệu quốc tế là ước tính cần đối chiếu nguồn."
  - "Coi cổ phiếu/doanh thu tăng là bằng chứng nhân quả của phong cách lãnh đạo (còn thị trường, chiến lược sản phẩm)."
  - "Chỉ dùng Transactional hoặc chỉ dùng Transformational; thiếu tầng giữa; không đo văn hóa bằng dữ liệu."
  - "Chia sẻ cá nhân quá mức (Authentic) làm mất ranh giới nghề nghiệp."
  - "Bỏ SOP và đào tạo cho người mới rồi nói 'tầm nhìn' với D1/D2."

sme_vn_guidance:
  - "Chủ SME thường kiêm cả lãnh đạo và quản lý; dành thời gian cố định cho định hướng/gắn kết (1-1 20-30 phút/người/tháng), phần quản lý việc giao cho tổ trưởng."
  - "Công ty gia đình/xưởng sản xuất: Autocratic + Servant thường hợp (chủ quyết định chính nhưng chăm sóc nhân viên); đừng dùng S1 cho tất cả."
  - "Ba chỉ số rẻ, dễ đo ngay bằng Excel/Google Sheets/Google Forms: turnover, eNPS (khảo sát ẩn danh), tỷ lệ lỗi; thêm năng suất."
  - "Đào tạo tổ trưởng là đòn bẩy rẻ nhất vì giám đốc không thể 1-1 với 60 người (case giả định: 8 triệu/tổ trưởng, chi phí cần xác nhận theo thị trường)."
  - "Nhà sáng lập nên có ít nhất một cố vấn hoặc thành viên HĐQT độc lập dám phản biện; tách bạch tài sản cá nhân và doanh nghiệp ngay từ đầu (liên quan quy định pháp lý về công ty, cần xác nhận với luật sư/kế toán)."
  - "Chuỗi cửa hàng/quán tăng từ 20 lên 30+: cần SOP, đào tạo, quản lý khu vực trước khi nói chuyện tầm nhìn."
  - "Công cụ đánh giá: MLQ (Mind Garden, có bản quyền, có phí - giá cần xác nhận), SLII (Ken Blanchard Companies), Hogan Leadership Assessment, Leadership Pipeline Assessment (Mercer|BrightHire); khóa học: Harvard ManageMentor, LinkedIn Learning, Coursera (Univ. of Michigan), Greenleaf Center - giá và nội dung hiện hành cần xác nhận."
  - "Văn hóa Việt Nam: nhiều DN theo mô hình 'như gia đình'; nhớ rằng văn hóa này không scale khi vượt khoảng 20 điểm bán (case giả định) và cần chuyển sang 'cộng đồng có nguyên tắc'."
  - "Với Phạm Nhật Vượng/Vingroup: tài liệu chỉ dùng làm ví dụ nhận diện phong cách (Transformational + Autocratic có chủ đích), không đánh giá toàn diện; không đưa số vốn hóa/doanh thu vì thay đổi theo thời gian."

case_lessons:
  - name: "Satya Nadella - Microsoft (từ 2/2014)"
    type: "success"
    setup: "Microsoft có lãi nhờ Windows/Office nhưng lỡ nhịp di động, văn hóa silo, thương hiệu tuyển dụng giảm sức hút; đây là adaptive challenge."
    key_calculations:
      - "Giá cổ phiếu khoảng 40 USD (đầu 2014) lên khoảng 300 USD (2021): 300/40 = 7,5 lần (ước tính, làm tròn)."
      - "Ánh xạ 4 I: tự thay đổi (Idealized Influence); sứ mệnh 'empower every person and every organization' (Inspirational); 'learn-it-all' thay 'know-it-all' dựa growth mindset của Dweck (Intellectual Stimulation); empathy trong đánh giá, giao quyền cho nhóm sản phẩm (Individualized)."
    lesson: "Làm gương trước rồi mới truyền cảm hứng; đổi tầm nhìn và văn hóa đồng thời; lãnh đạo mở khóa năng lực thực thi chiến lược chứ không thay chiến lược. Câu hỏi SME: 'tôi đã đổi hành vi nào của mình trước khi yêu cầu đội đổi?'."
    data_reliability: "illustrative"
  - name: "Cheryl Bachelder - Popeyes (cuối 2007)"
    type: "success"
    setup: "CEO mới của công ty nhượng quyền với niềm tin thấp giữa công ty mẹ và franchisee, lợi nhuận franchisee kém hấp dẫn, tăng trưởng đình trệ (theo sách Dare to Serve, 2015)."
    key_calculations:
      - "Listening, Empathy + Healing, Conceptualization + Stewardship (chỉ số lợi nhuận mỗi nhà hàng), Commitment to Growth (đào tạo, kỳ vọng hai chiều)."
      - "Năm 2017 Restaurant Brands International mua lại khoảng 1,8 tỷ USD (số công khai, làm tròn); các số về lợi nhuận franchisee và tỷ lệ rời hệ thống chưa kiểm chứng nên bỏ."
    lesson: "Trong franchise không thể ra lệnh, chỉ có thể thuyết phục nên Servant gần như duy nhất khả thi; kết quả chậm nhưng bền; phải đi kèm kỳ vọng và hậu quả rõ ràng."
    data_reliability: "illustrative"
  - name: "Dwight D. Eisenhower - D-Day 1944"
    type: "success"
    setup: "Chỉ huy liên quân nhiều quốc gia, các tướng cá tính mạnh, trên 150.000 quân ngày đầu (ước tính), cửa sổ thời tiết hẹp."
    key_calculations:
      - "Phân loại D-level các tướng (Bradley D4/S4; Montgomery D3/S3; Patton S2/S3) là diễn giải minh họa, lịch sử không ghi Eisenhower dùng thang D1-D4."
      - "Chuẩn bị nghe rộng (S3/S4), chốt 5/6/1944 để đổ bộ 6/6 (S1), soạn sẵn thông điệp nhận toàn bộ trách nhiệm nếu thất bại."
    lesson: "Nghe rộng, quyết gọn; S1 trong khủng hoảng không phải độc tài nếu đã có niềm tin và giải thích lý do; chẩn đoán D-level theo nhiệm vụ; sau sự cố họp rút kinh nghiệm."
    data_reliability: "illustrative"
  - name: "Travis Kalanick - Uber (CEO đến 6/2017)"
    type: "failure"
    setup: "Tăng trưởng cực nhanh, gọi vốn hàng chục tỷ USD, văn hóa 'thắng bằng mọi giá'."
    key_calculations:
      - "Chẩn đoán: Charismatic/Transformational tốt giai đoạn startup; Autocratic và thiếu Idealized Influence đạo đức (chương trình Greyball bị cáo buộc); thiếu Healing/Awareness/Stewardship khi HR xử lý yếu vụ tố cáo quấy rối đầu 2017; thiếu governance đối trọng; từ chức 6/2017."
    lesson: "Charisma là bộ khuếch đại, không có đối trọng thể chế thì rủi ro pháp lý/văn hóa tích lũy; đo văn hóa bằng dữ liệu; SME cần cố vấn/HĐQT độc lập."
    data_reliability: "illustrative"
  - name: "Adam Neumann - WeWork"
    type: "failure"
    setup: "Câu chuyện sứ mệnh hấp dẫn, SoftBank đầu tư lớn, định giá khoảng 47 tỷ USD (đầu 2019, ước tính); rút hồ sơ IPO 9/2019."
    key_calculations:
      - "Lỗ khoảng 1,9 tỷ USD năm 2018 (số công khai, làm tròn); giao dịch tư lợi (phí nhãn hiệu 'We', thuê lại tòa nhà của chính ông), quyền biểu quyết đặc biệt."
      - "Cắt giảm khoảng 2.400 nhân sự; gói thoát của founder khoảng 1,7 tỷ USD (số báo chí nêu, ước tính)."
    lesson: "Kalanick thiên về thất bại văn hóa/đạo đức; Neumann thiên về quản trị tài chính và xung đột lợi ích; thẩm định con người song song số liệu; người thuyết phục giỏi cần người kiểm tra độc lập; SME tách tài sản cá nhân và doanh nghiệp."
    data_reliability: "illustrative"
  - name: "Phạm Nhật Vượng - Vingroup"
    type: "success"
    setup: "Ví dụ nhận diện phong cách: mục tiêu rất lớn, chuyển ngành nhanh (bất động sản sang ô tô điện, VinFast niêm yết Nasdaq 2023); không đánh giá toàn diện, không đưa số liệu vốn hóa/doanh thu."
    key_calculations:
      - "Inspirational Motivation mạnh; Autocratic có chủ đích (tốc độ là lợi thế); Intellectual Stimulation qua kéo chuyên gia bên ngoài; rủi ro: phụ thuộc cá nhân, ô tô điện cần tiền lớn và thời gian dài."
    lesson: "Ở thị trường mới nổi, Autocratic trong quyết định chiến lược + Transformational trong truyền tầm nhìn cho tốc độ nhưng phải dần thể chế hóa (hội đồng cố vấn, phân quyền, kế nhiệm). Nhận định thận trọng: chưa có bằng chứng công khai về xung đột lợi ích, không phải kết luận pháp lý."
    data_reliability: "illustrative"
  - name: "Soya Garden - chuỗi cà phê (CASE GIẢ ĐỊNH)"
    type: "sme"
    setup: "Founder A sáng lập 2010; 10 lên 20 quán (2010-2015) nhờ Transformational + Charismatic + 'như gia đình'; mở rộng lên 30 quán (2015-2020) rồi đứng ở 30 (2020-2023)."
    key_calculations:
      - "D-level 30 quán trưởng: D4 = 10, D3 = 8, D2 = 7, D1 = 5; tổng 10 + 8 + 7 + 5 = 30."
      - "Founder dùng tầm nhìn + phân quyền gần S4 đồng loạt: đúng cho 10/30 = 33,3%; sai cho 20/30 = 66,7%; D1+D2 = 12/30 = 40% bị bỏ mặc."
      - "Chuỗi hệ quả: thiếu SOP, chất lượng không đều, quán trưởng D1/D2 nản (turnover cao), Founder chữa cháy, mất văn hóa gia đình, nghẽn tầng quản lý."
    lesson: "Văn hóa/phong cách không scale; đo D-level mỗi quý; SOP + đào tạo cho D1/D2 trước; xây Area Manager; chuyển 'gia đình' sang 'cộng đồng có nguyên tắc'."
    data_reliability: "illustrative"
  - name: "Indra Nooyi - PepsiCo (CEO 2006-2018)"
    type: "success"
    setup: "Áp lực xu hướng sức khỏe cộng đồng nhưng doanh thu phụ thuộc đồ uống có đường và snack; ví dụ 'phong cách chồng lớp' (các giai đoạn là diễn giải của tài liệu, không phải phân kỳ chính thức)."
    key_calculations:
      - "Doanh thu khoảng 35 tỷ USD (2006) lên khoảng 64 tỷ USD (2017-2018): 64/35 ≈ 1,83 lần, tức khoảng +83% sau 12 năm (xấp xỉ, cần đối chiếu báo cáo thường niên)."
      - "Performance with Purpose (Transformational); thư cảm ơn gửi cha mẹ lãnh đạo cấp cao (khoảng 2015; Servant/Individualized Consideration); phân quyền theo D-level (Situational)."
    lesson: "Nhà lãnh đạo hiệu quả là hybrid có chủ đích; phát triển lãnh đạo kế cận là bằng chứng bền nhất; không khẳng định mọi kết quả tài chính do phong cách (thị trường, chiến lược sản phẩm)."
    data_reliability: "illustrative"
  - name: "Gỗ Việt Xanh - xưởng nội thất Bình Dương (CASE GIẢ ĐỊNH)"
    type: "sme"
    setup: "60 công nhân/nhân viên, 10 tổ trưởng; Giám đốc Hùng, thợ mộc đi lên, S1 với tất cả. Sau 12 tháng: 24 người nghỉ (58 đầu năm, 60 cuối năm), lỗi 6,5%, eNPS (12 ủng hộ, 24 trung lập, 24 chỉ trích), năng suất 18 sp/người/tháng."
    key_calculations:
      - "Turnover = 24 / ((58+60)/2) = 24/59 ≈ 40,7%/năm; chi phí thay người 2,5 tháng x 12 triệu = 30 triệu; 24 x 30 = 720 triệu/năm."
      - "eNPS = 12/60 - 24/60 = 20% - 40% = -20."
      - "D-level 60 người: D1 = 14, D2 = 18, D3 = 16, D4 = 12 (tổng 60). Fit rate S1 cho tất cả = 14/60 = 23,3%; sai 76,7% (D3+D4 = 28 người bị kiểm soát quá mức; D2 = 18 thiếu giải thích)."
      - "Can thiệp 6 tháng: S1 14 người (SOP hình ảnh, kèm cặp 1-1 hai tuần đầu), S2 18 (họp 15 phút đầu tuần), S3 16 (tự đề xuất cải tiến), S4 12 (giao trọn dây chuyền/đơn hàng); đầu tư 10 x 8 + 40 = 120 triệu."
      - "Sau 12 tháng (giả định): nghỉ 9 người (15,0%), chi phí thay 270 triệu (giảm 450), eNPS (27 - 9)/60 = +30, lỗi 3,2% (giảm 3,3 điểm %, tương đối khoảng 50,8%), năng suất 21,6 (+20%), sản lượng 1.296 so với 1.080 (+216)."
      - "ROI = (450 - 120)/120 = 275%, chưa tính lợi ích từ năng suất và giảm lỗi."
    lesson: "Đo trước khi sửa (turnover, eNPS, lỗi); giá trị lớn nhất của Situational là chẩn đoán đúng nhu cầu; đào tạo tổ trưởng là đòn bẩy rẻ nhất; Servant ở cấp tổ trưởng. Các số cải thiện chỉ là giả định minh họa, thực tế mất 6-12 tháng và phụ thuộc thị trường lao động."
    data_reliability: "illustrative"

worked_examples:
  - name: "Tính turnover, chi phí nghỉ việc và eNPS cho xưởng 60 người"
    inputs: {start: 58, end: 60, left: 24, months_replace: 2.5, monthly_salary_million_vnd: 12, promoters: 12, passives: 24, detractors: 24}
    steps:
      - "Nhân sự trung bình = (58 + 60)/2 = 59"
      - "Turnover = 24/59 = 40,7%"
      - "Chi phí = 24 x 2,5 x 12 = 720 triệu đồng/năm"
      - "eNPS = 12/60 - 24/60 = 20% - 40% = -20"
    result: "Turnover 40,7%; chi phí ẩn 720 triệu/năm; eNPS -20 (cảnh báo văn hóa). Số liệu giả định minh họa."
  - name: "Chẩn đoán D-level 4 người và tính fit rate"
    inputs: {Lan: [1, 4], Tam: [2, 2], Quy: [4, 2], Binh: [4, 4], style_used_for_all: "S1", team_D_counts: {D1: 14, D2: 18, D3: 16, D4: 12}}
    steps:
      - "Lan (NL 1, ĐL 4): NL<=2 và ĐL>=3 -> D1 -> S1"
      - "Tâm (2, 2): NL<=2 và ĐL<=2 -> D2 -> S2"
      - "Quý (4, 2): NL>=3 và ĐL<=2 -> D3 -> S3"
      - "Bình (4, 4): D4 -> S4"
      - "Đội 60 người: D1 14, D2 18, D3 16, D4 12. Dùng S1 cho tất cả chỉ khớp D1 -> fit = 14/60 = 23,3%; lệch 76,7%"
    result: "D1/D2/D3/D4 tương ứng S1/S2/S3/S4; fit rate 23,3% cho thấy cần đa dạng hóa phong cách."
  - name: "ROI chương trình đào tạo tổ trưởng"
    inputs: {cost_training: 80, cost_coaching: 40, turnover_cost_before: 720, turnover_cost_after: 270}
    steps:
      - "Chi phí = 80 + 40 = 120 triệu"
      - "Lợi ích = 720 - 270 = 450 triệu"
      - "Lợi ích ròng = 450 - 120 = 330 triệu"
      - "ROI = 330/120 = 275%"
      - "Kiểm tra eNPS sau = 27/60 - 9/60 = 45% - 15% = +30"
    result: "ROI 275% (chỉ tính chi phí nghỉ việc, chưa tính năng suất và giảm lỗi); số liệu giả định."
  - name: "Soya Garden: tỷ lệ nhận đúng phong cách"
    inputs: {D4: 10, D3: 8, D2: 7, D1: 5, style: "tầm nhìn + S4 đồng loạt"}
    steps:
      - "Tổng = 10 + 8 + 7 + 5 = 30 quán trưởng"
      - "Khớp (D4) = 10/30 = 33,3%; không khớp = 20/30 = 66,7%"
      - "D1 + D2 bị bỏ mặc = 12/30 = 40%"
    result: "Chỉ 33,3% nhận đúng phong cách; cần SOP và S1/S2 cho 40% đội (giả định minh họa)."
  - name: "Mức tăng trưởng giá cổ phiếu Microsoft và doanh thu PepsiCo"
    inputs: {msft_start: 40, msft_end: 300, pep_start: 35, pep_end: 64}
    steps: ["Microsoft: 300/40 = 7,5 lần", "PepsiCo: 64/35 = 1,83 lần, tăng khoảng 83%"]
    result: "7,5 lần và +83% (ước tính, làm tròn; cần đối chiếu nguồn)."

practice_questions:
  - q: "Một nhân viên mới vào, chưa biết cách làm, rất hào hứng. Chẩn đoán D-level và phong cách phù hợp? Nhân viên 3 tháng sau thấy việc khó, động lực giảm thì sao?"
    a: "Lần đầu: D1 (năng lực thấp, động lực cao) -> S1 Directing: nói rõ việc gì, làm sao, khi nào, SOP và kèm cặp 1-1. Sau 3 tháng: D2 -> S2 Coaching: giải thích vì sao, hỏi ý kiến, ghi nhận tiến bộ nhỏ."
  - q: "Chuỗi 25 quán: 5 quán trưởng D1, 7 D2, 8 D3, 5 D4. Founder giao quyền gần S4 cho tất cả. Fit rate bao nhiêu và nhóm nào bị thiệt?"
    a: "Chỉ nhóm D4 khớp: 5/25 = 20%; 80% không khớp. Nhóm D1 và D2 (12 người, 48%) bị bỏ mặc, cần S1/S2 (SOP, đào tạo); nhóm D3 cần S3."
  - q: "Xưởng 40 người, nghỉ 12 người, nhân sự đầu kỳ 38, cuối kỳ 42, lương 10 triệu, chi phí thay người 2 tháng lương. Tính turnover và chi phí."
    a: "Nhân sự trung bình = (38 + 42)/2 = 40; turnover = 12/40 = 30%; chi phí = 12 x 2 x 10 = 240 triệu đồng/năm."
  - q: "Khảo sát eNPS 50 người: 20 người chấm 9-10, 20 người chấm 7-8, 10 người chấm 0-6. eNPS là bao nhiêu và đánh giá thế nào?"
    a: "20/50 - 10/50 = 40% - 20% = +20 (không viết %). Dưới ngưỡng 'tốt' > 30 (benchmark tham khảo); cần rà soát lãnh đạo, không hoảng nếu so quý trước đang tăng."
  - q: "Vì sao Servant Leadership gần như là lựa chọn duy nhất khả thi trong mô hình nhượng quyền (case Popeyes)?"
    a: "Quyền lực chức danh yếu, chỉ có thể thuyết phục (Persuasion); doanh thu phụ thuộc thiện chí của franchisee; Listening và Healing xây lại niềm tin; chỉ số chung (lợi nhuận mỗi nhà hàng) làm hai bên cùng thắng."
  - q: "Khi nào Autocratic là hợp lý và khi nào nó trở thành cạm bẫy?"
    a: "Hợp lý khi khủng hoảng, việc lặp lại, nhân viên thiếu kinh nghiệm (S1 có giải thích, đã có niềm tin). Cạm bẫy khi kéo dài sau khủng hoảng, nhân viên sáng tạo bỏ đi, không phát triển đội, không có người kế thừa, và không có đối trọng (Kalanick)."
  - q: "Tại sao MLQ không cộng tổng 180 điểm mà tính trung bình từng yếu tố?"
    a: "Lãnh đạo tốt là một hồ sơ: nhiều Transformational, đủ Contingent Reward, ít Laissez-faire/Passive MBE; một con số tổng làm mất thông tin, và có yếu tố cao là tốt, yếu tố thấp mới là tốt."
  - q: "Phân biệt Transformational và Transactional; Bass nói về 'augmentation effect' nghĩa là gì?"
    a: "Transactional trao đổi thưởng-phạt, hiệu quả ngắn hạn; Transformational tạo động lực nội tại qua tầm nhìn. Augmentation: Transformational bổ sung chứ không thay thế nền hợp đồng/thưởng phạt."
  - q: "Fiedler và Situational Leadership khác nhau thế nào về khả năng đổi phong cách?"
    a: "Fiedler (LPC): phong cách khó đổi nên đổi tình huống cho hợp lãnh đạo; Situational: lãnh đạo có thể linh hoạt thích ứng S1-S4 theo D-level của từng người cho từng nhiệm vụ."
  - q: "Chọn 3 chỉ số rẻ nhất để theo dõi hiệu quả lãnh đạo ở xưởng 50 người và nêu mục tiêu hợp lý trong 12 tháng."
    a: "Turnover, eNPS, tỷ lệ lỗi (thêm năng suất). Gợi ý mục tiêu theo case giả định: turnover giảm xuống mức 15%, eNPS từ -20 lên +30, lỗi giảm khoảng một nửa; thực tế mất 6-12 tháng, đặt baseline trước."

checklist:
  - "Tự nhận thức: đã làm MLQ hoặc 360 feedback ít nhất 1 lần trong 12 tháng; đã viết triết lý lãnh đạo (3-5 giá trị cốt lõi); đã xác định phong cách mặc định và điểm mù."
  - "Chẩn đoán nhân sự: có bảng D-level (D1-D4) từng người theo từng nhiệm vụ, cập nhật mỗi quý; phong cách dùng khớp D-level (không S1 cho D4, không S4 cho D1); có SOP cho người mới (D1)."
  - "Tầm nhìn và văn hóa: giải thích tầm nhìn trong 1 phút và nhân viên lặp lại được; có họp 1-1 định kỳ (20-30 phút/người/tháng) và ghi nhận phản hồi; có kế hoạch phát triển cho từng quản lý."
  - "Đối trọng và rủi ro: có người dám phản biện (cố vấn/HĐQT độc lập/CFO); tài sản cá nhân và doanh nghiệp tách bạch; không dùng charisma thay KPI hoặc quy trình."
  - "Đo lường: theo dõi turnover, eNPS, tỷ lệ lỗi/khiếu nại, năng suất; có mục tiêu cụ thể (vd eNPS từ -20 lên +30 trong 12 tháng) và kiểm tra hằng quý."
  - "Khủng hoảng: có quy tắc chuyển S1 khi khủng hoảng và quay lại S3/S4 sau khi ổn định; có họp rút kinh nghiệm công khai."
  - "Kế thừa: xác định ít nhất 2 người kế nhiệm tiềm năng cho vị trí then chốt; quy trình và quyết định quan trọng được tài liệu hóa."
  - "Số liệu: ghi nhãn 'ước tính/giả định minh họa' cho số quốc tế chưa kiểm chứng; phân biệt điểm phần trăm và phần trăm tương đối; eNPS không có dấu %."

excel_google_sheets_templates:
  - name: "Bảng chẩn đoán D-level và phong cách"
    description: "Cột: Tên, Nhiệm vụ, NL (1-4), ĐL (1-4), D-level = IF(AND(NL>=3,DL>=3),\"D4\",IF(NL>=3,\"D3\",IF(DL>=3,\"D1\",\"D2\"))), Phong cách cần dùng (S1-S4), Phong cách đang dùng, Khớp? = IF(cần=đang,1,0); Fit rate = SUM(Khớp)/COUNT(Tên); cập nhật mỗi quý."
  - name: "Bảng dashboard lãnh đạo (turnover, chi phí, eNPS, lỗi, năng suất)"
    description: "Ô nhập: nhân sự đầu/cuối kỳ, số người nghỉ, số tháng lương thay thế, lương tháng, số Promoter/Passive/Detractor, tỷ lệ lỗi, năng suất. Công thức: Turnover = nghỉ/AVERAGE(đầu,cuối); Chi phí = nghỉ x tháng x lương; eNPS = (P-D)/Tổng x 100; ROI = (lợi ích - chi phí)/chi phí. Theo dõi theo quý."
  - name: "Biểu mẫu eNPS ẩn danh (Google Forms)"
    description: "Một câu thang 0-10 'Bạn có giới thiệu công ty cho bạn bè làm việc không?' + câu mở 'lý do'; tính Promoter (>=9), Detractor (<=6) bằng COUNTIF; cắt theo bộ phận/tổ trưởng."
  - name: "Bảng MLQ/360 tự chấm"
    description: "Mỗi yếu tố 4 câu thang 0-4, tính AVERAGE từng yếu tố; so cột tự chấm và cột người khác chấm để thấy khoảng cách (điểm mù); đối chiếu bản MLQ chuẩn có bản quyền."
  - name: "Kế hoạch 90 ngày"
    description: "Ba tab Tháng 1/2/3 với việc theo tuần, bảng mục tiêu baseline-target (Listening 360, eNPS, Retention, % D3+D4), cột trạng thái và kết quả đo lại."
