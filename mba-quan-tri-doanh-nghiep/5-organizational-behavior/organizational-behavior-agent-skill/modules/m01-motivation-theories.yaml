# m01 - Các thuyết động lực (distill từ 01-motivation-theories.md)
id: "m01"
name_vi: "Các thuyết động lực làm việc"
name_en: "Motivation Theories"
source_file: "01-motivation-theories.md"
purpose: >
  Giúp nhà quản lý/chủ SME chẩn đoán vì sao nhân viên thiếu động lực (nghỉ việc cao, làm cho có, thưởng không hiệu quả)
  bằng các "ống kính" lý thuyết (Maslow, Herzberg, McClelland, Vroom, Adams, Locke, SDT, Skinner, Hackman-Oldham), rồi thiết kế
  can thiệp có ngân sách và đo ROI. Nguyên tắc: dùng thuyết nội dung (content) để chẩn đoán "họ cần gì", dùng thuyết quá trình
  (process) để thiết kế cơ chế KPI/thưởng/công bằng.
when_to_use:
  - "Nhân viên nghỉ việc nhiều, làm việc đối phó, năng suất thấp dù đã tăng lương."
  - "Thiết kế hệ thống KPI/thưởng cho sales, công nhân, kỹ sư, nhân viên dịch vụ."
  - "Chủ SME định 'tăng lương đồng loạt' và cần biết có hiệu quả không (chẩn đoán E, I, V, Herzberg, Equity trước khi chi)."
  - "Cần chấm điểm mức độ tạo động lực của một công việc và thiết kế lại công việc (MPS)."
  - "Tuyển/phát triển nhân sự theo hồ sơ nhu cầu (nAch, nAff, nPow) cho vị trí sales, manager, support."
  - "Chọn thuyết phù hợp theo loại hình (startup, SME, tập đoàn, IT, sản xuất, dịch vụ)."
  - "Tính chi phí nghỉ việc và ROI của chương trình động lực, kèm độ nhạy 50% hiệu quả."
  - "KHÔNG dùng một thuyết đơn lẻ làm 'chân lý'; không áp số liệu minh họa của case như số thật."
prerequisites: []
related_modules:
  - "m02 - Phong cách lãnh đạo: social nPow, trao quyền, phản hồi ảnh hưởng tới E, I, Autonomy"
  - "m03 - Động lực nhóm: Relatedness, nAff, văn hóa 'như gia đình'"
  - "m04 - Văn hóa tổ chức: duy trì chương trình ghi nhận/lương theo thời gian (case The Coffee House)"
  - "m06 - Quản trị xung đột: bất công (Equity) là nguồn xung đột nội bộ"
  - "m07 - Quản trị thay đổi: triển khai KPI/thưởng mới cần pilot, truyền thông, xây lại niềm tin"
  - "m10 - People insight: khảo sát động lực, đo turnover, engagement"
  - "Tài chính (finance-agent-skill): ROI, độ nhạy, chi phí thay thế nhân sự"

concepts:
  - term_vi: "Động lực làm việc"
    term_en: "Motivation"
    definition: >
      Lực nội tại và ngoại tại thúc đẩy cá nhân dành nỗ lực để đạt mục tiêu; trong tổ chức là sự sẵn sàng dành nỗ lực cho mục tiêu
      tổ chức để nhận phần thưởng cá nhân (lương, địa vị, công nhận, phát triển). Không phải đặc tính bẩm sinh mà là kết quả tương tác
      giữa cá nhân, công việc, môi trường.
    why_it_matters: >
      Hiệu suất = Năng lực x Động lực x Nguồn lực/Cơ hội. Công ty mua được năng lực và cấp được nguồn lực nhưng không mua trực tiếp
      nỗ lực tự nguyện. Hai người cùng trình độ, cùng lương có thể chênh 2-3 lần đóng góp vì khác động lực; SME không có dư địa bù
      cho người thiếu động lực nên vấn đề này càng sống còn.
  - term_vi: "Thuyết nội dung và thuyết quá trình"
    term_en: "Content vs Process theories"
    definition: >
      Content (Maslow, Herzberg, McClelland, SDT): CÁI GÌ thúc đẩy con người. Process (Vroom, Adams, Locke, Skinner): LÀM THẾ NÀO
      động lực hình thành (suy luận, so sánh, mục tiêu, củng cố).
    why_it_matters: "Dùng content để chẩn đoán 'nhóm này thiếu gì', rồi process để thiết kế cơ chế 'làm sao họ thấy nỗ lực được đền đáp'."
  - term_vi: "Thang bậc nhu cầu Maslow"
    term_en: "Maslow's Hierarchy of Needs"
    definition: >
      Maslow (1943, Psychological Review): 5 tầng - sinh lý, an toàn, tình cảm/thuộc về, tôn trọng, tự thực hiện; mở rộng 8 tầng
      (thêm Cognitive, Aesthetic, Self-Transcendence). Nhu cầu thấp chưa đủ sẽ chiếm toàn bộ sự chú ý (prepotency); nhu cầu đã thỏa mãn
      không còn là động lực.
    why_it_matters: >
      Ra đời để phản biện phân tâm học (chỉ nghiên cứu bệnh lý) và hành vi học (chỉ kích thích-phản ứng); giải thích vì sao cùng một phần
      thưởng lúc này hấp dẫn lúc khác thì không. Hàm ý: đừng treo phần thưởng tầng 4-5 (danh hiệu, học tập) cho người còn lo tầng 1-2
      (lương không đủ sống). Maslow chưa vẽ 'kim tự tháp' (do giáo trình sau này vẽ) và coi thứ bậc là tương đối. Phê phán: thứ tự không
      cố định, thiên về văn hóa phương Tây (ở VN tầng 3 có thể nặng hơn tầng 4), khó đo, thiếu chứng cứ thực nghiệm (Wahba & Bridwell 1976),
      ERG của Alderfer (1969) linh hoạt hơn.
  - term_vi: "Thuyết hai yếu tố Herzberg"
    term_en: "Herzberg's Two-Factor Theory (Hygiene vs Motivators)"
    definition: >
      Herzberg, Mausner, Snyderman (1959, The Motivation to Work), khảo sát khoảng 200 (thường trích 203) kỹ sư và kế toán vùng Pittsburgh
      bằng critical incident. Hygiene (lương, an toàn việc làm, điều kiện, chính sách, giám sát, quan hệ đồng nghiệp): thiếu thì bất mãn,
      đủ thì chỉ trung tính. Motivators (thành tựu, công nhận, trách nhiệm, thăng tiến, bản thân công việc, phát triển): có thì hài lòng và có động lực.
    why_it_matters: >
      Nghi ngờ giả định 'hài lòng và bất mãn là hai đầu một thanh trượt'. Hàm ý quản trị: chi tiền để dập bất mãn (hygiene) và chi tiền để tạo động lực
      (motivators) là hai khoản đầu tư khác nhau, không thay thế nhau. Phê phán: mẫu nhỏ/hẹp, thiên lệch tự thuật, lương có thể là motivator khi tăng
      từ rất thấp (VN: 4 -> 6 triệu rất có động lực), House & Wigdor (1967) không thấy tách bạch rõ, bỏ qua khác biệt cá nhân/văn hóa.
  - term_vi: "Thuyết nhu cầu McClelland"
    term_en: "McClelland's Theory of Needs (nAch, nAff, nPow)"
    definition: >
      McClelland (1961, The Achieving Society): 3 nhu cầu tồn tại đồng thời, khác mức ở từng người, được học từ trải nghiệm. nAch: thành tựu (việc vừa sức khó, cần phản hồi,
      nhận trách nhiệm). nAff: thuộc về (thích teamwork, sợ xung đột). nPow: quyền lực, gồm personal power (kiểm soát, thắng, có thể thao túng) và social power
      (ảnh hưởng vì lợi ích chung, lãnh đạo tốt). Đo bằng TAT (Murray & Morgan 1935, McClelland chỉnh cách chấm).
    why_it_matters: >
      Xuất phát từ câu hỏi vĩ mô vì sao có quốc gia phát triển nhanh (tỷ lệ nAch cao). Khác Maslow, mỗi người có 'hồ sơ nhu cầu' riêng nên cùng vị trí hợp người này hơn người kia:
      tuyển đúng hồ sơ cho đúng vị trí; nAch có thể huấn luyện (khóa ở Ấn Độ theo nguồn gốc, chỉ mang tính tham khảo). TAT khó, cần chuyên gia.
  - term_vi: "Thuyết kỳ vọng Vroom"
    term_en: "Expectancy Theory (Vroom)"
    definition: >
      Vroom (1964, Work and Motivation): động lực là phép tính xác suất chủ quan M = E x I x V. E (Expectancy, 0-1): nỗ lực dẫn tới hiệu suất. I (Instrumentality, 0-1):
      hiệu suất dẫn tới phần thưởng. V (Valence, -1..+1 hoặc 0..10): giá trị phần thưởng với cá nhân.
    why_it_matters: >
      Dùng phép NHÂN vì chuỗi nhân quả đứt ở bất kỳ mắt xích nào thì mất tác dụng (E=0 hay I=0 hay V=0 thì M=0); phép cộng sẽ cho 'động lực dương' phi lý. Hàm ý: đừng chỉ tăng tiền
      thưởng (V) khi vấn đề nằm ở E hoặc I - lỗi phổ biến nhất của SME. Khi KPI thưởng kém hiệu quả, hỏi theo thứ tự E -> I -> V.
  - term_vi: "Thuyết công bằng Adams"
    term_en: "Equity Theory (Adams, 1963)"
    definition: >
      Nhân viên so tỷ lệ Output/Input của mình với tỷ lệ của một người tham chiếu (referent), không so mức tuyệt đối. Bất công bằng tạo căng thẳng và dẫn tới giảm nỗ lực, đòi tăng lương,
      tự thuyết phục lại, đổi người so sánh hoặc bỏ đi.
    why_it_matters: >
      J. Stacy Adams (tâm lý học xã hội, GE) dựa trên thuyết bất hòa nhận thức của Festinger (1957). Giải thích vì sao tăng lương 10% vẫn bất mãn nếu đồng nghiệp được 20%. Phản ứng khi bị thiệt mạnh hơn nhiều so với
      khi được ưu ái. Công bằng là điều kiện của Instrumentality: nếu người giỏi hơn nhận ít hơn, mọi KPI mất niềm tin.
  - term_vi: "Thuyết đặt mục tiêu Locke"
    term_en: "Goal-Setting Theory (Locke, 1968)"
    definition: "Mục tiêu CỤ THỂ + KHÓ (nhưng khả thi) + CAM KẾT + có PHẢN HỒI thường xuyên cho hiệu suất cao hơn 'cố hết sức'; độ phức tạp nhiệm vụ đòi nhiều thời gian cam kết hơn."
    why_it_matters: >
      Locke (1968), tổng hợp cùng Latham (1990): nhiều hệ thống thưởng thất bại vì người lao động không biết phải đạt gì. Mục tiêu định hướng chú ý, huy động nỗ lực, tăng bền bỉ, khuyến khích tìm chiến lược.
      Nền tảng MBO (Drucker 1954), SMART, OKR (Intel/Andy Grove, Google nhờ John Doerr). Rủi ro: mục tiêu quá khó + áp lực -> gian lận/bỏ chất lượng; mục tiêu khó chỉ hiệu quả khi E vẫn đủ cao.
  - term_vi: "Thuyết tự quyết"
    term_en: "Self-Determination Theory (Deci & Ryan, 1985-2000s)"
    definition: "3 nhu cầu tâm lý bẩm sinh: Autonomy (tự chủ), Competence (năng lực), Relatedness (kết nối). Phân biệt động lực nội tại và ngoại tại."
    why_it_matters: >
      Deci & Ryan phát hiện hiệu ứng overjustification/crowding-out (mở rộng từ Lepper 1973): thưởng tiền cho việc người ta vốn thích có thể làm giảm hứng thú. Phần thưởng ngoài dùng như công cụ KIỂM SOÁT thì triệt tiêu
      tự chủ; dùng như phản hồi ghi nhận năng lực thì củng cố. Hợp với lao động tri thức (IT). Cần văn hóa tin cậy; dùng quá đà không có quản trị (case WeWork) phản tác dụng.
  - term_vi: "Thuyết củng cố"
    term_en: "Reinforcement Theory (Skinner, 1938)"
    definition: >
      Điều kiện hóa thao tác: hành vi chịu ảnh hưởng của hậu quả ngay sau nó. 4 loại: positive reinforcement (thêm thưởng), negative reinforcement (gỡ điều khó chịu khi làm đúng; khác punishment),
      punishment (phạt), extinction (không hậu quả -> hành vi mất dần).
    why_it_matters: >
      Không quan tâm 'trong đầu nghĩ gì', chỉ quan hệ hành vi-hậu quả; giải thích vì sao khen kịp thời hiệu quả hơn bonus cuối năm và hành vi tốt không được để ý sẽ tắt. Chỉ phạt thì người ta chỉ tránh hành vi xấu,
      không chủ động tìm thành công. Hạn chế: bỏ qua nhận thức, có thể gây crowding-out.
  - term_vi: "Mô hình đặc điểm công việc"
    term_en: "Job Characteristics Model (Hackman & Oldham, 1976)"
    definition: >
      5 đặc điểm cốt lõi (Skill Variety, Task Identity, Task Significance, Autonomy, Feedback) -> 3 trạng thái tâm lý (công việc có ý nghĩa, cảm giác trách nhiệm, biết kết quả) -> 3 kết quả (động lực, hài lòng, nghỉ việc thấp).
      Đo bằng JDS (Job Diagnostic Survey).
    why_it_matters: >
      Từ Taylor (1911), chia nhỏ việc gây nhàm chán/vắng mặt/nghỉ việc; Herzberg đề xuất job enrichment nhưng thiếu công cụ chẩn đoán. Hackman-Oldham cho phép đo công việc 'có tính tạo động lực' đến đâu và biết sửa đặc điểm nào.
  - term_vi: "Khác biệt văn hóa trong động lực"
    term_en: "Cultural context of motivation"
    definition: "Lý thuyết phương Tây cần điều chỉnh: ở VN tầng 3 Maslow (thuộc về, 'như gia đình') và an toàn việc làm thường nặng hơn; sự công nhận của gia đình/cộng đồng quan trọng hơn địa vị cá nhân."
    why_it_matters: "Tránh áp máy móc; Hofstede (1980s) chỉ ra nhu cầu khác nhau đáng kể giữa quốc gia."
  - term_vi: "Chi phí nghỉ việc"
    term_en: "Cost of turnover"
    definition: "Chi phí tuyển + đào tạo + năng suất thấp giai đoạn đầu cho mỗi lần thay người."
    why_it_matters: "Cho biết ngân sách tối đa hợp lý đầu tư vào động lực: nếu thiệt hại nhìn thấy là X thì chương trình đắt hơn X nhiều lần là không hợp lý (xem công thức)."
  - term_vi: "Hệ quả không mong muốn của KPI (gaming)"
    term_en: "Unintended consequences / gaming"
    definition: "KPI chỉ đo số lượng khiến nhân viên hy sinh chất lượng (case 3: lỗi +40%)."
    why_it_matters: "Phải đi kèm chỉ số chất lượng; Vroom: nếu hệ thống bị coi là không công bằng/không đáng tin thì I sụp đổ."

formulas:
  - id: "m01_vroom_motivation"
    name_vi: "Điểm động lực kỳ vọng (Vroom)"
    name_en: "Expectancy motivation score M = E x I x V"
    expression_latex: 'M = E \times I \times V'
    expression_python: "E * I * V"
    excel: "=B2*C2*D2"
    variables:
      - {symbol: "E", meaning: "Expectancy - xác suất chủ quan nỗ lực dẫn tới hiệu suất mong muốn (0-1)", unit: "tỷ lệ"}
      - {symbol: "I", meaning: "Instrumentality - xác suất chủ quan hiệu suất tốt dẫn tới phần thưởng (0-1)", unit: "tỷ lệ"}
      - {symbol: "V", meaning: "Valence - giá trị phần thưởng với cá nhân (0-1 trong ví dụ; nguồn nói -1..+1 hoặc 0..10)", unit: "điểm"}
    when_to_use: "Chẩn đoán vì sao KPI/thưởng không tạo động lực theo nhóm nhân viên; so sánh trước/sau can thiệp; thiết kế hệ thống thưởng."
    why_it_works: >
      Mô hình hóa động lực như chuỗi 3 niềm tin nối tiếp (làm được -> được thưởng -> thưởng đáng giá). Nhân vì chuỗi đứt ở một mắt xích thì cả chuỗi vô hiệu: bất kỳ thành phần bằng 0 thì M bằng 0.
      Nhờ vậy chỉ rõ mắt xích yếu nhất cần sửa thay vì tăng tiền thưởng một cách mù quáng.
    assumptions:
      - "E, I, V là niềm tin CHỦ QUAN lấy từ khảo sát nhân viên (câu hỏi kiểu 'nếu đạt KPI bạn tin sẽ được thưởng?'), cùng thang đo."
      - "Các thành phần độc lập tương đối; V khó định lượng."
    pitfalls:
      - "Chỉ tăng V (thêm tiền) trong khi E hoặc I thấp: M gần như không đổi, có thể giảm (case 3)."
      - "Coi M là xác suất hay thang tuyệt đối; nó chỉ để so sánh tương đối giữa nhóm/thời điểm."
      - "Không nhất quán thang V (-1..+1 vs 0..10) khi so sánh."
      - "Bỏ qua yếu tố xã hội/công bằng; nên phối hợp Equity (công bằng là điều kiện của I)."
    interpretation: >
      Nguồn dùng mốc thực hành M > 0,5 là 'hiệu quả' (template thưởng); 0,576 là trung bình-cao; 0,072-0,216 rất thấp/thấp. Khi M thấp, kiểm tra theo thứ tự E -> I -> V. Mốc 0,5 là ngưỡng thực hành trong tài liệu nguồn, không phải chuẩn học thuật.
    example:
      inputs: {E: 0.5, I: 0.3, V: 0.7}
      steps: ["Công nhân: E=0,5 (50% tự tin vượt chỉ tiêu), I=0,3 (30% khả năng được thưởng), V=0,7", "M = 0,5 x 0,3 x 0,7 = 0,105 (rất thấp)", "Đối chiếu developer E=0,8, I=1,0, V=0,9 -> M = 0,72 (cao)"]
      result: "0.105 (công nhân) so với 0.72 (developer); nguyên nhân gốc ở I=0,3"
  - id: "m01_mps"
    name_vi: "Chỉ số tiềm năng tạo động lực của công việc (MPS)"
    name_en: "Motivating Potential Score (Hackman-Oldham)"
    expression_latex: 'MPS = \frac{SV + TI + TS}{3} \times A \times F'
    expression_python: "(SV + TI + TS) / 3 * A * F"
    excel: "=(B2+B3+B4)/3*B5*B6"
    variables:
      - {symbol: "SV", meaning: "Skill Variety - đa dạng kỹ năng (thang 1-7)", unit: "điểm"}
      - {symbol: "TI", meaning: "Task Identity - thấy được sản phẩm trọn vẹn (1-7)", unit: "điểm"}
      - {symbol: "TS", meaning: "Task Significance - tác động tới người khác (1-7)", unit: "điểm"}
      - {symbol: "A", meaning: "Autonomy - quyền tự quyết cách làm (1-7)", unit: "điểm"}
      - {symbol: "F", meaning: "Feedback - biết kết quả công việc (1-7)", unit: "điểm"}
    when_to_use: "Chấm điểm và so sánh công việc trước/sau thiết kế lại (job redesign), chọn đặc điểm cần sửa trước."
    why_it_works: >
      Ba đặc điểm đầu cùng tạo trạng thái 'công việc có ý nghĩa' nên lấy trung bình (bù trừ lẫn nhau được). Autonomy (cảm giác trách nhiệm) và Feedback (biết kết quả) là hai điều kiện BẮT BUỘC nên nhân:
      nếu một trong hai bằng 0 thì công việc không tạo động lực dù rất đa dạng.
    assumptions: ["Điểm từ khảo sát (JDS) hoặc đánh giá của quản lý/nhóm, cùng thang 1-7.", "Số trong ví dụ là giả định minh họa."]
    pitfalls:
      - "So điểm giữa các thang khác nhau."
      - "Redesign nhưng không thật sự trao quyền/phản hồi (A, F không tăng) nên MPS thực tế không đổi."
      - "Không phải công việc nào cũng thiết kế lại được; chi phí tái cấu trúc cao."
    interpretation: "Điểm càng cao càng có tiềm năng tạo động lực; dùng để so sánh tương đối (ví dụ 14 -> 120 sau redesign). Nguồn không đưa ngưỡng tuyệt đối."
    example:
      inputs: {SV: 2, TI: 2, TS: 3, A: 2, F: 3}
      steps: ["Trước (lắp một chi tiết): (2+2+3)/3 x 2 x 3 = 2,33 x 6 = 14", "Sau (tổ lắp ráp trọn bộ): SV=5, TI=4, TS=6, A=4, F=6 -> (5+4+6)/3 x 4 x 6 = 5 x 24 = 120", "Tăng 120/14 = khoảng 8,6 lần"]
      result: "MPS 14 -> 120 (khoảng 8,6 lần)"
  - id: "m01_equity_ratio"
    name_vi: "Tỷ lệ công bằng Adams (Output/Input)"
    name_en: "Equity ratio comparison"
    expression_latex: '\frac{O_{me}}{I_{me}} = \frac{O_{ref}}{I_{ref}}, \quad ER = \frac{O_{me}/I_{me}}{O_{ref}/I_{ref}}'
    expression_python: "(O_me / I_me) / (O_ref / I_ref)"
    excel: "=(B2/B3)/(C2/C3)"
    variables:
      - {symbol: "O_me", meaning: "Đầu ra của mình (lương, thưởng, công nhận)", unit: "VND hoặc điểm"}
      - {symbol: "I_me", meaning: "Đầu vào của mình (giờ làm, sản lượng, kỹ năng)", unit: "giờ/đơn vị sản phẩm"}
      - {symbol: "O_ref", meaning: "Đầu ra của người tham chiếu", unit: "VND hoặc điểm"}
      - {symbol: "I_ref", meaning: "Đầu vào của người tham chiếu", unit: "giờ/đơn vị sản phẩm"}
    when_to_use: "Kiểm tra công bằng nội bộ giữa hai người cùng vị trí; tìm nguyên nhân sâu của I (Instrumentality) thấp; kiểm tra thang lương/thưởng."
    why_it_works: >
      Con người đánh giá công bằng qua tỷ lệ đầu ra/đầu vào so với người khác chứ không qua mức tuyệt đối; ER = 1 là cân bằng, ER < 1 là cảm giác bị thiệt (phản ứng mạnh), ER > 1 là được ưu ái (phản ứng yếu hơn).
    assumptions: ["Chọn đúng người tham chiếu và đúng định nghĩa input/output (cùng đơn vị).", "Cảm nhận công bằng là chủ quan; số chỉ là gợi ý để điều tra."]
    pitfalls:
      - "Ví dụ 'lương/giờ' coi mọi giờ làm như nhau, bỏ qua kỹ năng/chất lượng."
      - "Bỏ qua việc nhân viên chủ động chọn người so sánh (đổi referent)."
    interpretation: "Chênh lệch trên 10-15% giữa hai người cùng vị trí cần giải thích được bằng tiêu chí minh bạch (quy tắc thực hành trong PHỤ LỤC)."
    example:
      inputs: {O_me: 10, I_me: 10, O_ref: 12, I_ref: 8}
      steps: ["Mình: 10 triệu / 10 giờ-ngày = 1,0", "Đồng nghiệp: 12 triệu / 8 = 1,5", "ER = 1,0 / 1,5 = 0,667 (khoảng 67%) -> bị thiệt"]
      result: "0.667 (bị thiệt, giả định minh họa)"
  - id: "m01_pay_per_unit_equity"
    name_vi: "Thu nhập trên đơn vị sản lượng giữa hai công nhân"
    name_en: "Pay-per-unit equity check"
    expression_latex: 'ER = \frac{w_A/q_A}{w_B/q_B}'
    expression_python: "(wA / qA) / (wB / qB)"
    excel: "=(B2/B3)/(C2/C3)"
    variables:
      - {symbol: "wA, wB", meaning: "Lương tháng của công nhân A, B", unit: "VND"}
      - {symbol: "qA, qB", meaning: "Sản lượng tháng của A, B", unit: "đơn vị"}
    when_to_use: "Chẩn đoán SME sản xuất/may/gia công khi người năng suất cao nhận lương/đơn vị thấp hơn người được ưu ái."
    why_it_works: "Biến Equity thành số: thu nhập trên mỗi đơn vị sản lượng cho thấy ai đang được trả 'rẻ' hơn cho cùng việc; nguồn dùng để chỉ ra A bằng khoảng 81,6% của B."
    assumptions: ["Cùng vị trí, cùng chất lượng, cùng điều kiện làm việc."]
    pitfalls: ["Không điều chỉnh theo chất lượng/lỗi hoặc thâm niên.", "Kết luận 'thiên vị' mà chưa kiểm tra tiêu chí chính thức."]
    interpretation: "ER < 1 nghĩa là A nhận thấp hơn B trên mỗi đơn vị; đây là tín hiệu làm sụp Instrumentality."
    example:
      inputs: {wA: 7200000, qA: 2730, wB: 8400000, qB: 2600}
      steps: ["A: 105 áo/ngày x 26 = 2.730 áo; 7,2 triệu / 2.730 = khoảng 2.637 VND/áo", "B: 100 x 26 = 2.600 áo; 8,4 triệu / 2.600 = khoảng 3.231 VND/áo", "ER = 2.637 / 3.231 = khoảng 0,816"]
      result: "0.816 (A bằng khoảng 81,6% của B; giả định minh họa)"
  - id: "m01_turnover_cost"
    name_vi: "Chi phí nghỉ việc hằng năm"
    name_en: "Annual turnover cost"
    expression_latex: 'C_{turn} = N \times r \times c'
    expression_python: "N * r * c"
    excel: "=B1*B2*B3"
    variables:
      - {symbol: "N", meaning: "Số nhân viên", unit: "người"}
      - {symbol: "r", meaning: "Tỷ lệ nghỉ việc năm", unit: "tỷ lệ"}
      - {symbol: "c", meaning: "Chi phí thay thế mỗi người (tuyển + đào tạo + năng suất thấp ban đầu)", unit: "VND/người"}
    when_to_use: "Bước đầu trước mọi chương trình động lực: đo giá của vấn đề để biết ngân sách tối đa hợp lý."
    why_it_works: "Biến 'nghỉ việc cao' thành tiền, so với chi phí chương trình. Case Google ghi chi phí thay thế thường 50-200% lương năm theo ước lượng phổ biến (chưa kiểm chứng)."
    assumptions: ["c là số giả định/ước lượng từ nội bộ; case nguồn dùng 8 triệu (xưởng may) và 5-6 triệu (các case khác), đều là giả định."]
    pitfalls: ["Bỏ chi phí gián tiếp (kiến thức, trải nghiệm khách hàng) nên thường đánh giá thấp.", "Dùng số của case như thật."]
    interpretation: "Cộng thêm chi phí lỗi/rework/vắng mặt thành 'thiệt hại nhìn thấy'; chương trình có chi phí vượt xa con số này cần chứng minh lợi ích khác."
    example:
      inputs: {N: 120, r: 0.48, c: 8}
      steps: ["120 x 48% = 57,6 người nghỉ/năm", "57,6 x 8 triệu = 460,8 triệu VND/năm", "Cộng chi phí sửa lỗi 1.036,8 triệu -> tổng thiệt hại nhìn thấy 1.497,6 triệu, bằng 13,9% quỹ lương năm 10.800 triệu"]
      result: "460.8 (triệu VND/năm, giả định minh họa)"
  - id: "m01_defect_cost"
    name_vi: "Chi phí sửa lỗi"
    name_en: "Annual defect/rework cost"
    expression_latex: 'C_{defect} = Q \times d \times u \times 12'
    expression_python: "Q * d * u * 12 / 1e6"
    excel: "=B1*B2*B3*12/1000000"
    variables:
      - {symbol: "Q", meaning: "Sản lượng/tháng", unit: "đơn vị"}
      - {symbol: "d", meaning: "Tỷ lệ lỗi", unit: "tỷ lệ"}
      - {symbol: "u", meaning: "Chi phí sửa mỗi sản phẩm lỗi", unit: "VND"}
    when_to_use: "Quy chất lượng ra tiền khi tính thiệt hại và lợi ích giảm lỗi."
    why_it_works: "Tổng chi phí = số sản phẩm lỗi x đơn giá sửa; giúp đưa 'giảm lỗi' vào ROI."
    assumptions: ["u cố định theo sản phẩm (giả định 40.000 VND/áo)."]
    pitfalls: ["Bỏ chi phí khiếu nại khách và mất đơn."]
    interpretation: "Trả về triệu VND/năm."
    example:
      inputs: {Q: 36000, d: 0.06, u: 40000}
      steps: ["36.000 x 6% = 2.160 áo lỗi/tháng", "2.160 x 40.000 = 86,4 triệu/tháng", "x 12 = 1.036,8 triệu/năm"]
      result: "1036.8 (triệu VND/năm)"
  - id: "m01_program_roi"
    name_vi: "ROI chương trình động lực (kèm độ nhạy)"
    name_en: "Motivation program ROI and sensitivity"
    expression_latex: 'Net = (S_{turn} + S_{defect} + G_{output}) - C_{program}, \quad CBR = \frac{C_{program}}{S_{turn}+S_{defect}+G_{output}}'
    expression_python: "(S_turn + S_defect + G_output) - C_program"
    excel: "=(B1+B2+B3)-B4"
    variables:
      - {symbol: "S_turn", meaning: "Tiết kiệm chi phí nghỉ việc = (số người nghỉ trước - sau) x chi phí thay thế", unit: "triệu VND/năm"}
      - {symbol: "S_defect", meaning: "Tiết kiệm sửa lỗi = (lỗi trước - lỗi sau) x đơn giá x 12", unit: "triệu VND/năm"}
      - {symbol: "G_output", meaning: "Lợi nhuận từ sản lượng tăng thêm = sản lượng thêm x lợi nhuận đóng góp/đơn vị x 12", unit: "triệu VND/năm"}
      - {symbol: "C_program", meaning: "Tổng chi phí chương trình (lương cơ bản tăng + quỹ thưởng + ghi nhận/đào tạo)", unit: "triệu VND/năm"}
    when_to_use: "Duyệt ngân sách chương trình động lực; luôn chạy thêm kịch bản chỉ đạt 50% lợi ích năng suất."
    why_it_works: "So lợi ích hữu hình với chi phí, tách từng nguồn lợi ích để thấy phần nào rủi ro nhất (thường là năng suất). Độ nhạy 50% kiểm tra chương trình có sống sót khi kỳ vọng hụt."
    assumptions: ["Lợi ích 'sau' là giả định/kỳ vọng sau 12 tháng, chưa kiểm chứng.", "Chưa chiết khấu; chưa tính lợi ích dài hạn hoặc chi phí duy trì."]
    pitfalls:
      - "Tăng lương đơn độc không có cơ chế chuyển động lực thành năng suất thì chỉ là chi phí (case Vinamilk)."
      - "Chi phí lương cố định khó điều chỉnh: nên tăng theo bậc thợ, không đồng loạt."
      - "Quên pilot một tổ trước khi nhân rộng."
    interpretation: "Net > 0 và CBR < 1 là có lãi. Case xưởng may: net +163,52 triệu, CBR = 0,85 (mỏng); độ nhạy 50% năng suất -> -43,84 triệu (lỗ)."
    example:
      inputs: {S_turn: 220.8, S_defect: 432, G_output: 414.72, C_program: 904}
      steps: ["Nghỉ việc: (57,6 - 30) x 8 = 220,8", "Lỗi: (2.160 - 1.260) x 40.000 x 12 = 432 triệu", "Sản lượng: 2.880 x 12.000 x 12 = 414,72 triệu", "Tổng lợi ích 1.067,52; chi phí 540 + 324 + 40 = 904", "Net = 163,52; CBR = 0,85", "Nếu G_output giảm một nửa còn 207,36: tổng lợi ích 860,16, net = -43,84"]
      result: "163.52 (triệu VND/năm); độ nhạy 50%: -43.84"
  - id: "m01_wage_breakeven_productivity"
    name_vi: "Điểm hòa vốn năng suất của tăng lương"
    name_en: "Wage increase break-even productivity gain"
    expression_latex: 'B_{req} = 12 \times \Delta w - S_{turn,pp}'
    expression_python: "(wage_rise * 12) - turnover_saving_per_worker"
    excel: "=B1*12-B2"
    variables:
      - {symbol: "wage_rise", meaning: "Mức tăng lương mỗi người mỗi tháng", unit: "triệu VND/tháng"}
      - {symbol: "turnover_saving_per_worker", meaning: "Tiết kiệm thay thế trung bình mỗi công nhân mỗi năm = (r_trước - r_sau) x chi phí thay thế", unit: "triệu VND/năm"}
    when_to_use: "Kiểm tra logic trước khi tăng lương: lợi ích năng suất tối thiểu mỗi người mỗi năm để hòa vốn."
    why_it_works: "Chi phí tăng lương phải được bù bằng tiết kiệm thay thế và phần còn lại từ năng suất/chất lượng; chỉ rõ 'phải kiếm thêm bao nhiêu'."
    assumptions: ["Giả định minh họa: chi phí thay thế 6 triệu/người, turnover 40% -> 8%, 3.000 công nhân."]
    pitfalls: ["Coi tăng lương tự động tạo năng suất.", "Dùng số Vinamilk như số thật (ước tính minh họa)."]
    interpretation: "Kết quả là mức năng suất tối thiểu bù đắp; so với lợi nhuận gộp đóng góp mỗi người (giả định 20 triệu/tháng; +25% = 5 triệu/tháng)."
    example:
      inputs: {wage_rise: 2, turnover_saving_per_worker: 1.92}
      steps: ["Chi phí tăng lương: 3.000 x 2 triệu x 12 = 72.000 triệu (72 tỷ)/năm", "Tiết kiệm thay thế: 3.000 x (40% - 8%) x 6 triệu = 5.760 triệu", "Mỗi người: tăng thêm 24 triệu/năm, tiết kiệm 1,92 triệu -> cần ít nhất 22,08 triệu/năm = 1,84 triệu/tháng", "Nếu năng suất +25% mang 5 triệu/tháng: lãi ròng khoảng 5 + 0,16 - 2 = 3,16 triệu/người/tháng"]
      result: "22.08 (triệu VND/người/năm, giả định minh họa)"
  - id: "m01_kpi_stretch_gap"
    name_vi: "Mức tăng yêu cầu của mốc KPI so với năng suất hiện tại"
    name_en: "KPI stretch gap"
    expression_latex: 'g = \frac{T}{P_0} - 1'
    expression_python: "T / P0 - 1"
    excel: "=B1/B2-1"
    variables:
      - {symbol: "T", meaning: "Mốc KPI mục tiêu", unit: "đơn vị/ngày"}
      - {symbol: "P0", meaning: "Năng suất hiện tại của công nhân", unit: "đơn vị/ngày"}
    when_to_use: "Kiểm tra mốc thưởng có khả thi (giữ Expectancy) trước khi triển khai; thiết kế mục tiêu bậc thang."
    why_it_works: "Expectancy phụ thuộc khoảng cách giữa hiện tại và mục tiêu; đo khoảng cách bằng % tăng cho thấy mốc nào là 'không thể' đối với đa số."
    assumptions: ["P0 lấy từ dữ liệu quá khứ."]
    pitfalls: ["Đặt mục tiêu theo ý chí (wishful thinking) thay vì dữ liệu."]
    interpretation: "Quy tắc thực hành trong nguồn: mục tiêu = quá khứ + 10-20% stretch, đạt 100% rồi mới nâng; mốc +14,3% khả thi nếu có đào tạo, +33% rất khó, +52% gần như không thể."
    example:
      inputs: {T: 160, P0: 105}
      steps: ["120/105 - 1 = +14,3%", "140/105 - 1 = +33,3%", "160/105 - 1 = +52,4%"]
      result: "0.524 (mốc 160 đòi +52,4%)"
  - id: "m01_bonus_formula"
    name_vi: "Công thức thưởng theo thành tích"
    name_en: "Performance bonus formula"
    expression_latex: 'Bonus = Base \times Bonus\% \times \frac{Actual}{Target}, \ \text{(có trần)}'
    expression_python: "min(base * bonus_pct * (actual / target), cap)"
    excel: "=MIN(B1*B2*(B3/B4),B5)"
    variables:
      - {symbol: "base", meaning: "Lương cơ bản", unit: "VND/tháng"}
      - {symbol: "bonus_pct", meaning: "Tỷ lệ thưởng áp dụng", unit: "tỷ lệ"}
      - {symbol: "actual", meaning: "Kết quả thực tế", unit: "cùng đơn vị mục tiêu"}
      - {symbol: "target", meaning: "Mục tiêu", unit: "cùng đơn vị"}
      - {symbol: "cap", meaning: "Trần thưởng tối đa", unit: "VND"}
    when_to_use: "Thiết kế hệ thống thưởng minh bạch (Template 3): KPI cá nhân 60% + KPI nhóm 40%."
    why_it_works: "Gắn thưởng liên tục với mức đạt giúp Instrumentality rõ; trần ngăn chi phí và gaming."
    assumptions: ["Công thức công khai, viết trong 1 trang, có ví dụ tính; thưởng trả đúng hạn (tối đa vài tuần sau, thường hàng tháng)."]
    pitfalls: ["Thiếu chỉ số chất lượng (gaming).", "Trả chậm làm I giảm.", "Áp không nhất quán giữa người (vi phạm Equity)."]
    interpretation: "Ví dụ nguồn: base 10 triệu, mục tiêu 500 triệu, thực tế 600 triệu, 30% -> 3,6 triệu. Mốc minh họa trong template: 100% target -> 20% lương, 120% -> 30%, 150% -> 50% (ví dụ, không phải chuẩn)."
    example:
      inputs: {base: 10000000, bonus_pct: 0.3, actual: 600, target: 500, cap: 100000000}
      steps: ["10 triệu x 30% = 3 triệu", "x (600/500) = 3 x 1,2 = 3,6 triệu"]
      result: "3,600,000 VND"
  - id: "m01_survey_scoring"
    name_vi: "Chấm điểm khảo sát động lực và trung bình theo nhóm yếu tố"
    name_en: "Survey scoring and group means"
    expression_latex: '\bar{x}_{g} = \frac{1}{n_g}\sum_{i \in g} x_i'
    expression_python: "sum(hygiene) / len(hygiene)"
    excel: "=AVERAGE(B2:B5)"
    variables:
      - {symbol: "hygiene", meaning: "Danh sách điểm trung bình từng yếu tố trong một nhóm (hygiene; dùng tương tự cho motivators), thang 1-5", unit: "điểm"}
    when_to_use: "Chẩn đoán Herzberg (nhóm Hygiene vs Motivators) và khảo sát 22 câu; xác định yếu tố thấp nhất để can thiệp trước."
    why_it_works: "So trung bình hygiene và motivators cho biết bất mãn do nền tảng hay thiếu động lực; yếu tố thấp nhất thường rẻ nhất để cải thiện (công nhận, thăng tiến)."
    assumptions: ["Mẫu đủ lớn/đại diện; thang 1-5 nhất quán."]
    pitfalls: ["Chỉ nhìn trung bình bỏ qua phân tán theo nhóm nhân viên.", "Khảo sát không ẩn danh nên điểm bị thổi phồng."]
    interpretation: "Quy ước nguồn: < 2,5 nghiêm trọng, cần sửa gấp; 2,5-3,5 cần cải thiện; > 3,5 tốt. Tái khảo sát sau 3-6 tháng."
    example:
      inputs: {hygiene: [2.4, 3.1, 3.4, 2.6], motivators: [1.9, 2.2, 1.8, 2.5]}
      steps: ["Hygiene = (2,4+3,1+3,4+2,6)/4 = 2,875", "Motivators = (1,9+2,2+1,8+2,5)/4 = 2,10 (báo động < 2,5)", "Thấp nhất: thăng tiến 1,8 và công nhận 1,9"]
      result: "Hygiene 2.875; Motivators 2.10"
  - id: "m01_replacement_cost_delta"
    name_vi: "Chi phí thay thế tăng thêm khi nghỉ việc tăng"
    name_en: "Incremental replacement cost"
    expression_latex: '\Delta C = N \times (r_1 - r_0) \times c'
    expression_python: "N * (r1 - r0) * c"
    excel: "=B1*(B2-B3)*B4"
    variables:
      - {symbol: "N", meaning: "Số nhân viên", unit: "người"}
      - {symbol: "r0, r1", meaning: "Tỷ lệ nghỉ việc trước/sau", unit: "tỷ lệ"}
      - {symbol: "c", meaning: "Chi phí thay thế mỗi người", unit: "triệu VND"}
    when_to_use: "Lập luận khi ngừng tăng lương/bỏ chương trình ghi nhận để cắt chi phí (case The Coffee House)."
    why_it_works: "Tiết kiệm cắt giảm cần so với chi phí thay thế tăng thêm."
    assumptions: ["Giả định minh họa: ~3.000 nhân viên, c = 5 triệu, nghỉ việc 12% -> 38% (+26 điểm phần trăm)."]
    pitfalls: ["Bỏ chi phí trải nghiệm khách hàng."]
    interpretation: "Kết quả 3.900 triệu/năm là chưa kể thiệt hại doanh thu; nguồn nói khoản tiết kiệm từ cắt chương trình thường nhỏ hơn."
    example:
      inputs: {N: 3000, r1: 0.38, r0: 0.12, c: 5}
      steps: ["3.000 x 26% x 5 triệu = 3.900 triệu VND/năm"]
      result: "3900 (triệu VND/năm, giả định minh họa)"

frameworks:
  - id: "m01_maslow"
    name_vi: "Thang bậc nhu cầu Maslow"
    name_en: "Maslow's Hierarchy of Needs"
    origin: "Abraham Maslow, 1943 (A Theory of Human Motivation); mở rộng 8 tầng sau này. Ra đời để nghiên cứu người khỏe mạnh có thành tựu, đối lập phân tâm học và hành vi học."
    components:
      - "T1 Sinh lý: lương đủ sống, giờ giấc hợp lý, cơm trưa, điều kiện làm việc an toàn"
      - "T2 An toàn: hợp đồng lao động, BHXH, an toàn lao động, quy tắc rõ ràng"
      - "T3 Tình cảm/thuộc về: team cohesion, team-building, văn hóa 'như gia đình', lãnh đạo quan tâm"
      - "T4 Tôn trọng: ghi nhận thành tích, thăng chức, danh hiệu, quyền tự quyết"
      - "T5 Tự thực hiện: học tập, dự án thử thách, sáng tạo, mentorship, lộ trình nghề"
      - "Bản mở rộng: T5 Cognitive (đào tạo), T6 Aesthetic (không gian đẹp), T7 Self-Actualization, T8 Self-Transcendence (CSR, mentoring, đóng góp xã hội)"
    when_to_use: "Thiết kế thang lương/phúc lợi theo cấp bậc, chẩn đoán nhóm nhân viên đang thiếu tầng nào (đặc biệt công nhân, dịch vụ)."
    how_to_apply:
      - "Phân nhóm nhân viên (công nhân, hành chính/sale, quản lý)."
      - "Hỏi từng nhóm còn thiếu tầng nào, bắt đầu từ T1-2."
      - "Sửa tầng thấp trước (lương theo CPI, hợp đồng chính thức, an toàn), rồi T3 (team events, mentorship), T4 (bảng vinh danh, thăng chức minh bạch), T5 (tuition reimbursement, career roadmap)."
      - "Theo dõi turnover; ví dụ nhà máy 500 người nghỉ 35%/năm, kỳ vọng xuống 15-20% sau 2 năm (kỳ vọng minh họa)."
    how_to_read_results: "Tầng thấp chưa đủ thì treo phần thưởng tầng cao là vô ích; thứ bậc mang tính tương đối, nhu cầu có thể đồng thời hoặc xung đột."
    pitfalls: ["Hiểu thứ bậc là cứng nhắc.", "Áp mô hình phương Tây cho VN mà bỏ qua tầng 3.", "Giả định nhu cầu thỏa mãn thì hết động lực (thực tế con người so sánh liên tục - Equity)."]
    example: "Công nhân lương 5-7 triệu: lương đủ sống, an toàn, team spirit, bảng vinh danh, đào tạo kỹ năng để lên Supervisor (bảng cấp độ của nguồn)."
  - id: "m01_herzberg"
    name_vi: "Thuyết hai yếu tố Herzberg"
    name_en: "Herzberg's Two-Factor Theory"
    origin: "Herzberg, Mausner, Snyderman, 1959, khảo sát khoảng 200 kỹ sư/kế toán Pittsburgh. Ra đời vì nghi ngờ giả định tăng lương + điều kiện tất yếu làm nhân viên hài lòng hơn."
    components:
      - "Hygiene: lương, an toàn việc làm, điều kiện làm việc, chính sách/quản trị công ty, giám sát, quan hệ đồng nghiệp (ngưỡng: thiếu thì bất mãn, có thì bình thường)"
      - "Motivators: thành tựu, công nhận, trách nhiệm, thăng tiến, bản thân công việc, phát triển (càng nhiều càng động lực)"
    when_to_use: "Thiết kế/redesign công việc, tối ưu chi tiêu HR (hygiene vs đầu tư motivators), phân tích vì sao đã trả lương đủ mà vẫn không có động lực."
    how_to_apply:
      - "Khảo sát (thang 1-5) tất cả yếu tố hygiene và motivators theo nhóm."
      - "Tính trung bình mỗi nhóm; xác định yếu tố thấp nhất."
      - "Sửa hygiene lên mức đủ (ít nhất P50 thị trường), rồi đầu tư motivators rẻ (ghi nhận công khai, trao quyền, lộ trình, đào tạo)."
      - "Phân loại tình huống: lương dưới thị trường -> hygiene cần tăng; lương đủ mà không động lực -> chuyển sang motivators; được giao dự án thử thách -> motivator; WFH -> hygiene (điều kiện làm việc)."
    how_to_read_results: "Hygiene trung bình ở mức cần cải thiện nhưng Motivators < 2,5 là báo động: tăng lương chỉ giảm bất mãn, không tạo động lực."
    pitfalls: ["Bỏ hygiene (nền tảng) để chỉ khen thưởng.", "Coi lương luôn chỉ là hygiene: tăng từ rất thấp có thể vừa hết bất mãn vừa tạo động lực.", "Không áp dụng cho nhóm mới vào nghề cần hygiene trước."]
    example: "Xưởng may Thiên Phú: Hygiene 2,875, Motivators 2,10 (công nhận 1,9, thăng tiến 1,8) -> chi 40 triệu cho ghi nhận/đào tạo thay vì chỉ tăng lương."
  - id: "m01_mcclelland"
    name_vi: "Thuyết nhu cầu McClelland và hồ sơ vị trí"
    name_en: "McClelland's Theory of Needs"
    origin: "McClelland (Harvard), 1961, The Achieving Society; TAT do Murray và Morgan phát triển năm 1935."
    components:
      - "nAch: thành tựu - việc thử thách mức rủi ro vừa, cần phản hồi định lượng, nhận trách nhiệm cá nhân"
      - "nAff: thuộc về - thích teamwork, sợ xung đột, cần được khẳng định"
      - "nPow: quyền lực - personal power (kiểm soát, thắng) vs social power (ảnh hưởng vì lợi ích chung, lãnh đạo tốt)"
      - "TAT: cho xem tranh mơ hồ, người thi tự kể chuyện; chủ đề thành tựu -> nAch, quan hệ -> nAff, ảnh hưởng/kiểm soát -> nPow"
    when_to_use: "Tuyển dụng và phát triển lãnh đạo; giao việc theo hồ sơ nhu cầu."
    how_to_apply:
      - "Xác định hồ sơ cần của vị trí: Founder (nAch rất cao, nPow trung-cao); Sales (nAch cao, nAff trung bình, nPow thấp); HR/Team lead (nAff cao, nAch/nPow trung); Manager (nPow social cao + nAch cao); Engineer (nAch cao, nAff thấp-trung, nPow thấp); Customer care (nAff cao, nAch trung, nPow thấp)."
      - "Đo hồ sơ ứng viên bằng TAT/trắc nghiệm nhu cầu và câu hỏi hành vi (ví dụ 'Từng xây gì từ không?', 'Nếu miss target bạn làm gì?')."
      - "Chọn lãnh đạo kế cận: nAch rất cao + nPow cao loại SOCIAL + nAff từ trung bình; mentoring để chuyển personal power sang social power."
      - "Phát triển: stretch projects, leadership training, strategic thinking workshops."
    how_to_read_results: "Cùng một công việc hợp người này hơn người khác; personal power cao + social power thấp là rủi ro cho vai trò quản lý."
    pitfalls: ["TAT cần chuyên gia, chi phí cao.", "Đối xử mọi nhân viên như nhau, bỏ qua hồ sơ nhu cầu."]
    example: "Trong 50 kỹ sư giỏi, chọn 5 người lên lãnh đạo: loại người rất giỏi kỹ thuật nhưng nPow thấp và người chỉ muốn lương/địa vị (personal power) (ví dụ FPT trong nguồn)."
  - id: "m01_vroom_diagnosis"
    name_vi: "Chẩn đoán và sửa E, I, V theo Vroom"
    name_en: "Expectancy Theory diagnosis"
    origin: "Vroom, 1964. Mô hình hóa động lực như phép tính xác suất chủ quan (nhận thức luận), khác các thuyết nội dung."
    components:
      - "E: nỗ lực -> hiệu suất (kỹ năng, công cụ, thời gian, mục tiêu vừa sức)"
      - "I: hiệu suất -> phần thưởng (liên kết minh bạch, trả nhanh, công bằng)"
      - "V: giá trị phần thưởng (khác biệt cá nhân, phần thưởng đa dạng, cho chọn)"
    when_to_use: "Thiết kế hệ thống thưởng, KPI; sửa KPI thất bại; nhất là SME sản xuất/dịch vụ."
    how_to_apply:
      - "Khảo sát E, I, V theo nhóm; tính M = E x I x V."
      - "Tìm thành phần nhỏ nhất, sửa theo thứ tự E -> I -> V."
      - "Sửa E: training, công cụ, mentor, hướng dẫn rõ, đủ thời gian, mục tiêu bậc thang (ví dụ new grad E 0,3 -> 0,8 qua mentor + việc dễ trước)."
      - "Sửa I: KPI minh bạch, thưởng trả nhanh trong tháng, công bằng (cùng KPI thì cùng thưởng); ví dụ 100 sp/ngày = lương cơ bản, >120 = +20%."
      - "Sửa V: hỏi nhân viên muốn gì (tiền, ngày nghỉ, khóa học, danh hiệu); ví dụ tài trợ chứng chỉ AWS (V 0,9) thay vì thưởng tiền (V 0,2)."
      - "Chạy lại khảo sát sau can thiệp."
    how_to_read_results: "Ma trận nguyên nhân: V thấp (E 0,8, I 0,9, V 0,1 -> M 0,072), E thấp (0,3/0,9/0,8 -> 0,216), I thấp (0,8/0,1/0,9 -> 0,072), lý tưởng (0,8/0,9/0,8 -> 0,576)."
    pitfalls: ["V khó đo.", "Bỏ qua yếu tố xã hội.", "Phức tạp hóa công thức thưởng làm I thấp."]
    example: "Case 3 (E 0,1) và case 8 (I 0,3) đều minh họa lỗi chỉ thêm tiền."
  - id: "m01_equity_adams"
    name_vi: "Kiểm tra công bằng Adams"
    name_en: "Equity Theory audit"
    origin: "J. Stacy Adams, 1963 (GE), dựa trên bất hòa nhận thức của Festinger (1957)."
    components: ["Input của mình/người khác (nỗ lực, kỹ năng, giờ làm)", "Output (lương, ghi nhận, thăng tiến)", "Người tham chiếu (referent)", "Phản ứng khi bị thiệt: giảm nỗ lực, đòi tăng lương, hợp lý hóa, đổi referent, bỏ đi"]
    when_to_use: "SME nhỏ (mọi người biết ai lương bao nhiêu), sản xuất/dịch vụ (chia tips, commission), trước khi thiết kế KPI."
    how_to_apply:
      - "Chọn 2 người cùng vị trí; tính thu nhập trên đơn vị sản lượng (hoặc lương/giờ)."
      - "So tỷ lệ; chênh lệch trên 10-15% cần giải thích được bằng tiêu chí minh bạch."
      - "Công bố thang bảng lương, quy tắc thưởng nhất quán, rà soát định kỳ."
    how_to_read_results: "Tỷ lệ < 1: cảm giác bị thiệt, I sụp đổ; > 1: áy náy nhưng phản ứng yếu."
    pitfalls: ["Thiên vị, lương phát sinh không nhất quán.", "Bỏ qua so sánh với thị trường (Yahoo vs Google)."]
    example: "Xưởng may: A 81,6% của B về thu nhập/áo -> thiệt thòi dù làm nhiều hơn."
  - id: "m01_goal_setting"
    name_vi: "Đặt mục tiêu Locke / OKR"
    name_en: "Goal-Setting Theory and OKR"
    origin: "Locke 1968; Locke và Latham 1990; MBO (Drucker 1954); OKR từ Intel (Andy Grove) và Google (John Doerr, cuối thập niên 1990)."
    components: ["Specificity: cụ thể, định lượng", "Difficulty: đủ khó nhưng khả thi (stretch)", "Commitment: cam kết công khai, có lợi ích", "Feedback: theo dõi tuần/tháng", "Task complexity: việc phức tạp cần cam kết sớm hơn"]
    when_to_use: "Thiết kế KPI/OKR cho cá nhân và nhóm."
    how_to_apply: ["Chuyển 'cố bán nhiều hơn' thành mục tiêu cụ thể (ví dụ 100M -> 120M).", "Đặt bậc thang vừa sức, theo dõi hàng tuần.", "Cho nhân viên cùng đặt mục tiêu (co-create) để tăng commitment.", "Đi kèm chỉ số chất lượng."]
    how_to_read_results: "Nếu dưới 50% nhân viên đạt mục tiêu thì mục tiêu quá cao (quy tắc rà soát quý trong template)."
    pitfalls: ["Mục tiêu quá khó gây gian lận/bỏ chất lượng/stress.", "Mục tiêu khó nhưng E thấp sẽ thất bại."]
    example: "Case 3: bậc 120/140/160 đòi +14%/+33%/+52% khiến E sụp; sửa bằng 110 -> 120."
  - id: "m01_sdt"
    name_vi: "Thuyết tự quyết (Autonomy, Competence, Relatedness)"
    name_en: "Self-Determination Theory"
    origin: "Deci và Ryan (Rochester), 1985-2000s; hiệu ứng overjustification (Lepper 1973)."
    components: ["Autonomy: quyền quyết cách làm/thời gian/nguồn lực, không micromanage", "Competence: đào tạo, thử thách, phản hồi tích cực", "Relatedness: team cohesion, mentorship, văn hóa hỗ trợ"]
    when_to_use: "Nhân viên tri thức (IT/Tech), nhân sự trẻ, mobile; khi lương đã đủ."
    how_to_apply: ["Cho tự chọn công cụ/cách làm; thu nhỏ '20% time' ở SME thành 1 buổi chiều/tháng cho dự án tự chọn.", "Ngân sách học tập, tech talk.", "Dùng thưởng như phản hồi ghi nhận, không như công cụ kiểm soát.", "Giữ guardrails quản trị."]
    how_to_read_results: "Autonomy bị cắt (cấm WFH) làm nhân viên cảm thấy không được tin, brain drain."
    pitfalls: ["Autonomy thiếu guardrails (WeWork).", "Tuyển nhanh, thiếu đào tạo (autonomy không competence = stress).", "Relatedness thành văn hóa giáo phái, đàn áp phản biện."]
    example: "Google 20% time (minh họa): Gmail, News, AdSense thường được kể là bắt nguồn từ đây, chưa kiểm chứng đầy đủ."
  - id: "m01_reinforcement"
    name_vi: "Củng cố hành vi (Skinner)"
    name_en: "Reinforcement Theory"
    origin: "B.F. Skinner (Harvard), The Behavior of Organisms, 1938."
    components: ["Positive reinforcement: thêm thưởng sau hành vi tốt", "Negative reinforcement: gỡ điều khó chịu khi làm đúng (ví dụ nộp đúng hạn thì miễn họp kiểm tra hằng tuần)", "Punishment: phạt hành vi xấu", "Extinction: không hậu quả, hành vi mất dần"]
    when_to_use: "Thiết kế thưởng/phản hồi kịp thời; quy tắc vận hành sản xuất."
    how_to_apply: ["Khen/thưởng ngay sau hành vi.", "Ưu tiên positive reinforcement.", "Không để hành vi tốt bị bỏ qua (extinction).", "Hạn chế chỉ phạt."]
    how_to_read_results: "Chỉ phạt thì nhân viên chỉ tránh hành vi xấu, không chủ động tìm thành công."
    pitfalls: ["Bỏ qua nhận thức.", "Crowding-out khi thưởng việc vốn thích."]
    example: "Công nhân 120 sp -> thưởng 1 triệu -> tiếp tục 120+."
  - id: "m01_jcm"
    name_vi: "Mô hình đặc điểm công việc (JCM)"
    name_en: "Job Characteristics Model"
    origin: "Hackman và Oldham (Yale), 1976; JDS là công cụ đo."
    components: ["5 đặc điểm: Skill Variety, Task Identity, Task Significance, Autonomy, Feedback", "3 trạng thái tâm lý: công việc có ý nghĩa, trách nhiệm, biết kết quả", "3 kết quả: động lực cao, hài lòng cao, nghỉ việc thấp", "MPS (xem công thức)"]
    when_to_use: "Redesign công việc lặp lại (công nhân, QA, dịch vụ)."
    how_to_apply: ["Chấm 5 đặc điểm (1-7) cho công việc hiện tại và tính MPS.", "Chọn đặc điểm thấp nhất, ưu tiên Autonomy và Feedback (nhân).", "Skill variety: luân chuyển công đoạn; Task identity: làm trọn bộ/tính năng; Significance: truyền thông tác động (sữa cho trẻ em); Autonomy: cho đề xuất cải tiến; Feedback: dashboard sản lượng hằng ngày, 1-on-1 hằng tuần.", "Tính lại MPS."]
    how_to_read_results: "Tăng MPS 14 -> 120 trong ví dụ minh họa."
    pitfalls: ["Chi phí tái cấu trúc cao; không phải việc nào cũng redesign được."]
    example: "Tổ lắp ráp trọn bộ thay vì một chi tiết; Vinamilk xoay vòng dây chuyền."
  - id: "m01_theory_by_context"
    name_vi: "Bản đồ chọn thuyết theo bối cảnh"
    name_en: "Theory-to-context map"
    origin: "Tổng hợp trong nguồn (phần VIII)."
    components:
      - "Startup: Herzberg và McClelland rất phù hợp (không cạnh tranh lương, nhấn mạnh motivators, tuyển nAch cao); Maslow một phần; Vroom chút (cần thưởng/equity rõ)"
      - "SME: Vroom và Equity RẤT phù hợp; Maslow tầng 3 (như gia đình), McClelland cho quản lý; lương tăng theo CPI, thưởng nhanh"
      - "Tập đoàn: hygiene đã xong -> nhấn mạnh Esteem/Self-actualization; Herzberg job redesign; McClelland phát triển lãnh đạo; đơn giản hóa KPI"
      - "IT/Tech: SDT rất phù hợp (20% time, learning budget, team); equity/cổ phần làm V cao"
      - "Sản xuất: Maslow T1-2 trước; Vroom và Equity rất phù hợp (KPI sản lượng + thưởng nhanh); Reinforcement dương"
      - "Dịch vụ/F&B: Maslow T1-3 (living wage, như gia đình), trao quyền nhỏ, ghi nhận công khai, minh bạch tips/commission"
    when_to_use: "Khi cần chọn thuyết chính trước khi chẩn đoán chi tiết."
    how_to_apply: ["Xác định loại hình và khả năng tài chính.", "Chọn 2-3 thuyết chính theo bảng.", "Chẩn đoán từng nhóm, thiết kế can thiệp 3 tầng."]
    how_to_read_results: "Không có 'một thuyết đúng'; mỗi thuyết là ống kính chẩn đoán."
    pitfalls: ["Sao chép chính sách từ công ty khác không xét bối cảnh (Yahoo)."]
    example: "FPT Software: bản đồ kết hợp 7 thuyết trong một chương trình (minh họa)."
  - id: "m01_three_tier_framework"
    name_vi: "Khung áp dụng 4 bước và 3 tầng can thiệp cho HR"
    name_en: "HR Application Framework (assess-diagnose-design-implement)"
    origin: "Khung tích hợp của nguồn (phần XI)."
    components:
      - "Bước 1 Đánh giá: nhân viên là ai (nhân khẩu, vai trò, thâm niên), vấn đề hiện tại (turnover, engagement, hiệu suất, morale), giai đoạn công ty (quy mô, ngành, tài chính)"
      - "Bước 2 Chẩn đoán 6 ống kính: Maslow, Herzberg, McClelland, Vroom, SDT, Equity"
      - "Bước 3 Thiết kế 3 tầng: Tier 1 sửa nền tảng (lương thị trường, điều kiện, BHXH, bữa ăn); Tier 2 tạo ý nghĩa (redesign, thành tựu, ghi nhận, lộ trình); Tier 3 tối ưu hệ thống (KPI công bằng, thưởng gắn hiệu suất, nhận diện nAch/nPow, phát triển lãnh đạo)"
      - "Bước 4 Triển khai và đo: tháng 1-3 Tier 1, 3-6 Tier 2 (pilot 1-2 phòng), 6-12 Tier 3; đo turnover, engagement, năng suất, vắng mặt, hài lòng"
    when_to_use: "Chương trình động lực end-to-end."
    how_to_apply: ["Thực hiện tuần tự 4 bước; không nhảy sang Tier 2-3 nếu Tier 1 chưa ổn.", "Pilot trước khi nhân rộng."]
    how_to_read_results: "Turnover giảm, engagement tăng, năng suất tăng, vắng mặt giảm."
    pitfalls: ["Triển khai rồi bỏ, không đo (xem pitfalls)."]
    example: "Xưởng may Thiên Phú: 6 bước chẩn đoán-ROI trong case 8."

procedures:
  - id: "m01_p_diagnose"
    name: "Chẩn đoán động lực một nhóm nhân viên"
    steps:
      - "Xác định nhóm (công nhân, QC, tổ trưởng, chuyên viên...)."
      - "Đo chi phí vấn đề: turnover cost + chi phí lỗi + vắng mặt để biết ngân sách tối đa."
      - "Khảo sát Herzberg (hygiene/motivators, thang 1-5) và E, I, V theo nhóm."
      - "Tính trung bình hygiene, motivators; tính M từng nhóm."
      - "Kiểm tra Equity (thu nhập/sản lượng cùng vị trí) và so thị trường (P50)."
      - "Xác định gốc rễ: hygiene thấp, motivators thấp, E/I/V thấp, bất công, công việc nghèo nàn (MPS thấp)."
      - "Chọn can thiệp theo gốc rễ, không mặc định 'tăng lương'."
    outputs: "Bảng chẩn đoán theo nhóm + ngân sách trần + danh sách can thiệp ưu tiên"
  - id: "m01_p_reward_design"
    name: "Thiết kế hệ thống thưởng (Template 3)"
    steps:
      - "Định nghĩa KPI: cá nhân 60% (ví dụ doanh thu 500M/quý, CSAT 4,5/5, lỗi < 2%) và nhóm 40%."
      - "Cấu trúc thưởng: lương cố định + bonus theo mốc (100% target 20% lương, 120% 30%, 150% 50% - ví dụ); công thức Bonus = Base x Bonus% x (Actual/Target), có trần."
      - "Thời điểm trả: hàng tháng cho công nhân, hàng quý cho sales/dự án, nửa năm cho tập đoàn; trả đúng hạn (ví dụ ngày 15 tháng sau)."
      - "Công bằng và minh bạch: công thức công khai, theo dõi hằng tháng trên dashboard, quy trình khiếu nại, không thiên vị."
      - "Kiểm tra Vroom: E (mục tiêu khả thi, đào tạo, phản hồi) ước 0,8; I (minh bạch, đúng hạn, đáng tin) ước 0,9; V (đủ lớn, hỏi nhân viên, cho chọn) ước 0,8 -> M = 0,576, mục tiêu M > 0,5."
      - "Kiểm tra Equity: cùng vị trí cùng lương cơ bản, độ khó KPI tương đương, không phân biệt giới."
      - "Rà soát quý: < 50% đạt mục tiêu thì mục tiêu quá cao; có gaming không; điều chỉnh."
    outputs: "Một trang mô tả KPI + công thức thưởng + lịch trả + kết quả kiểm tra E, I, V, Equity"
  - id: "m01_p_fix_failed_kpi"
    name: "Sửa hệ thống KPI thất bại"
    steps:
      - "Tính khoảng cách mục tiêu/hiện tại (kpi stretch gap)."
      - "Ước lượng E, I, V hiện tại và so với trước KPI."
      - "Reset E: đào tạo, công cụ, mentor, mục tiêu bậc thang (100 -> 110 -> 120)."
      - "Cải thiện I: công thức rõ, trả ngay trong tháng."
      - "Cân bằng V: tiền + mục tiêu nhóm + học tập."
      - "Thêm KPI chất lượng; đồng thiết lập mục tiêu với công nhân; CEO truyền thông xin lỗi, xây lại niềm tin."
      - "Chạy lại M để xác nhận cải thiện."
    outputs: "KPI bậc thang kèm chất lượng; M mục tiêu khoảng 0,45 trở lên"
  - id: "m01_p_roi"
    name: "Tính ROI chương trình động lực"
    steps:
      - "Tính chi phí hiện tại: nghỉ việc (N x r x c) và lỗi (Q x d x u x 12)."
      - "Liệt kê hạng mục chương trình và chi phí/năm (lương cơ bản +x%, quỹ thưởng y% quỹ lương, ghi nhận/đào tạo)."
      - "Giả định kết quả sau 12 tháng: nghỉ việc, lỗi, sản lượng."
      - "Tính lợi ích từng nguồn, tổng lợi ích, Net và CBR."
      - "Chạy độ nhạy: chỉ đạt 50% năng suất; xem còn lãi không."
      - "Pilot một tổ; theo dõi hằng quý; ưu tiên khoản linh hoạt (tăng theo bậc thợ thay vì đồng loạt)."
    outputs: "Bảng ROI + độ nhạy + khuyến nghị pilot"
  - id: "m01_p_survey"
    name: "Chạy khảo sát động lực 22 câu"
    steps:
      - "Dùng thang 1-5, 19 câu chia 8 nhóm (A lương/phúc lợi, B điều kiện, C quản lý/nhóm, D ghi nhận/thành tựu, E trách nhiệm/tự chủ, F phát triển, G KPI/công bằng, H ý định ở lại) + 3 câu mở."
      - "Tính điểm trung bình từng câu/nhóm: < 2,5 nghiêm trọng; 2,5-3,5 cần cải thiện; > 3,5 tốt."
      - "Chọn câu điểm thấp nhất, thiết kế can thiệp."
      - "Tái khảo sát sau 3-6 tháng."
    outputs: "Điểm theo nhóm yếu tố và kế hoạch hành động"

decision_rules:
  - "Nếu nhân viên bất mãn và lương thấp hơn thị trường (dưới P50) thì sửa hygiene trước (lương, an toàn, điều kiện); chưa nên đầu tư motivators."
  - "Nếu lương đã ngang thị trường mà vẫn không có động lực thì chuyển sang motivators (ghi nhận, trách nhiệm, thăng tiến, công việc có ý nghĩa), không tăng thêm lương."
  - "Nếu M = E x I x V thấp thì kiểm tra theo thứ tự E (mục tiêu có khả thi?) -> I (thưởng có chắc chắn, công bằng, trả nhanh?) -> V (phần thưởng có đáng?) trước khi tăng tiền."
  - "Nếu mục tiêu KPI đòi tăng > 30% so với năng suất hiện tại thì E sụp đổ: đặt mục tiêu bậc thang quá khứ + 10-20% và nâng sau khi đạt 100%."
  - "Nếu hai người cùng vị trí có thu nhập/đơn vị sản lượng chênh > 10-15% mà không có tiêu chí minh bạch thì sửa công bằng (thang bảng lương công khai) trước khi triển khai KPI."
  - "Nếu KPI chỉ đo sản lượng thì thêm chỉ số chất lượng (lỗi) để tránh gaming; nếu lỗi tăng sau khi áp KPI, rà soát thiết kế."
  - "Nếu nhân viên tri thức (IT) đã lương cao thì dùng SDT (autonomy, competence, relatedness) thay vì tăng lương."
  - "Nếu nhóm là công nhân sản xuất/dịch vụ lương thấp thì ưu tiên Maslow T1-3 + ghi nhận công khai + lộ trình + KPI/thưởng nhanh và công bằng."
  - "Nếu cần tuyển sales hoặc founder thì ưu tiên nAch cao; nếu cần quản lý thì ưu tiên nPow dạng social; HR/CSKH ưu tiên nAff cao."
  - "Nếu chi phí chương trình > thiệt hại nhìn thấy hiện tại thì cần chứng minh thêm lợi ích khác hoặc thu nhỏ/pilot."
  - "Nếu độ nhạy 50% năng suất cho Net < 0 thì chuyển phần chi phí cố định sang biến phí (thưởng theo kết quả, tăng theo bậc) và pilot một tổ."
  - "Nếu cắt giảm chi phí thì KHÔNG cắt ghi nhận/lương theo CPI trước: đây là cách rẻ giữ chân (case The Coffee House)."
  - "Nếu một chính sách từng hiệu quả ở công ty khác (hoặc công ty cũ của lãnh đạo) thì kiểm tra bằng dữ liệu nhân viên của mình trước khi áp (Yahoo)."
  - "Nếu nhân viên so với thị trường/đồng nghiệp thấy thiệt thì chỉ tăng lương tuyệt đối không đủ (Equity): giải thích tiêu chí và công bố."

benchmarks:
  - {metric: "Hiệu suất = Năng lực x Động lực x Nguồn lực/Cơ hội", value: "khung khái niệm", context: "Giải thích vì sao phải quản trị động lực", confidence: "medium"}
  - {metric: "Ngưỡng M hiệu quả (Vroom)", value: "M > 0,5 (0,576 = trung bình-cao)", context: "Template thưởng trong nguồn; quy ước thực hành, không phải chuẩn học thuật", confidence: "low"}
  - {metric: "Điểm khảo sát động lực (thang 1-5)", value: "< 2,5 nghiêm trọng; 2,5-3,5 cần cải thiện; > 3,5 tốt", context: "Quy ước thang chấm của nguồn", confidence: "medium"}
  - {metric: "Lương so với thị trường", value: "tối thiểu P50; P50-P75 cạnh tranh nhân tài (FPT minh họa)", context: "Hygiene", confidence: "medium"}
  - {metric: "Mục tiêu KPI", value: "quá khứ + 10-20% stretch; giữ E >= 0,6", context: "Checklist nguồn", confidence: "medium"}
  - {metric: "Tỷ lệ bonus tối thiểu để thực sự gắn với KPI", value: "khoảng 10-20% lương", context: "Bảng pitfalls nguồn; KPI nhưng bonus quá nhỏ (1% lương) thì I = 0", confidence: "medium"}
  - {metric: "Chênh lệch công bằng cần giải thích", value: "> 10-15%", context: "Quy tắc thực hành trong PHỤ LỤC nguồn", confidence: "low"}
  - {metric: "Turnover F&B/dịch vụ", value: "ngành trung bình trên 40%/năm; The Coffee House giai đoạn tốt 10-15% (ước tính)", context: "Ước tính minh họa, chưa kiểm chứng", confidence: "low"}
  - {metric: "Turnover công nghệ", value: "ngành khoảng 60-70% retention (tức nghỉ 30-40%); FPT minh họa retention 85-90%", context: "Ước tính minh họa, không phải số FPT công bố", confidence: "low"}
  - {metric: "Chi phí thay thế nhân sự tri thức", value: "50-200% lương năm", context: "Ước lượng phổ biến trong ngành theo nguồn, chưa kiểm chứng", confidence: "low"}
  - {metric: "Tỷ lệ chi ghi nhận/đào tạo trong ngân sách case xưởng may", value: "4,4% (40/904)", context: "Giả định minh họa", confidence: "low"}
  - {metric: "Chi phí chương trình xưởng may so quỹ lương năm", value: "904/10.800 = 8,4%; thiệt hại nhìn thấy = 13,9% quỹ lương", context: "Giả định minh họa", confidence: "low"}

pitfalls:
  - "Chỉ tăng tiền thưởng (V) khi vấn đề ở E hoặc I; chỉ đặt KPI mà bonus không đáng kể (I=0)."
  - "Đặt KPI quá cao (E thấp), không có training/công cụ."
  - "Phần thưởng không có giá trị với nhân viên (không hỏi họ muốn gì)."
  - "Phân phối thưởng không nhất quán, thiên vị, lương không minh bạch (vi phạm Equity)."
  - "Công việc lặp lại không có ý nghĩa; không có chương trình ghi nhận; micromanagement."
  - "Hứa đào tạo mà không thực hiện (E giảm, mất niềm tin)."
  - "Dồn việc cho vài người giỏi gây kiệt sức."
  - "Không đo và điều chỉnh sau khi triển khai; mỗi phòng một cách làm khác nhau."
  - "Bỏ qua khác biệt cá nhân (McClelland): đối xử như nhau với mọi nhân viên."
  - "Chỉ nghĩ tới tiền, bỏ qua ý nghĩa công việc."
  - "Thông báo chính sách mà không thực thi, gây hoài nghi."
  - "Áp thuyết phương Tây máy móc cho VN; bỏ qua tầng thuộc về và an toàn việc làm."
  - "Dùng một thuyết duy nhất làm chân lý; không nhận ra giới hạn (Maslow thứ tự cứng nhắc, Herzberg mẫu hẹp, TAT khó)."
  - "Cắt chương trình động lực khi cắt giảm chi phí (The Coffee House) hoặc mở rộng quá nhanh làm loãng văn hóa."
  - "Trích số liệu minh họa của case (Vinamilk, FPT, Yahoo, WeWork, Coffee House) như số thật."
  - "Tăng lương đồng loạt một lần, khó điều chỉnh; nên theo bậc thợ và hiệu quả."

sme_vn_guidance:
  - "Lương cơ bản tăng theo CPI mỗi năm, không giảm lương thực; BHXH đầy đủ, hợp đồng chính thức (T2 Maslow, hygiene). Mức lương mẫu của nguồn (công nhân 5-7 triệu, hành chính 8-12 triệu, trưởng phòng 20-30 triệu VND/tháng) là ví dụ minh họa - cần xác nhận theo thị trường địa phương và lương tối thiểu vùng hiện hành."
  - "SME nhỏ: mọi người biết ai lương bao nhiêu nên Equity cực quan trọng - công khai thang bảng lương/quy tắc thưởng, không thiên vị."
  - "KPI và thưởng rõ, thưởng nhanh hàng tháng (không chờ cuối năm); mốc thưởng bậc thang, công thức một trang; trả ngày cố định (ví dụ 10-15 tháng sau)."
  - "Chi phí ghi nhận/đào tạo thấp (khoảng 40 triệu/năm cho 120 công nhân trong case) nhưng tác động lớn: bảng vinh danh, thưởng nhỏ, đào tạo đa kỹ năng, lộ trình công nhân -> tổ phó -> tổ trưởng."
  - "Văn hóa 'như gia đình' (T3) rất quan trọng ở VN, nhưng không dùng nó để đàn áp phản biện (WeWork)."
  - "Thu nhỏ SDT: dành 1 buổi chiều/tháng cho dự án cải tiến tự chọn thay vì 20% time."
  - "F&B/dịch vụ: living wage + BHXH + bữa ăn, trao quyền nhỏ (upgrade món, tặng tráng miệng khi khách phàn nàn), ghi nhận công khai, tips/commission công thức công khai; case The Coffee House cho thấy phải duy trì liên tục."
  - "Sản xuất: an toàn lao động tuyệt đối; KPI sản lượng + chất lượng + chuyên cần; thưởng hàng tháng; Top worker tháng công khai."
  - "Pilot một tổ/phòng trước khi nhân rộng; theo dõi hằng quý turnover, năng suất, lỗi, vắng mặt, engagement."
  - "Công cụ: Excel/Google Sheets tính M theo nhóm, ROI, khảo sát bằng Google Forms (không có giá ghi trong nguồn - cần xác nhận phần mềm/giá nếu dùng)."
  - "Pháp lý/thuế: nguồn không nêu cụ thể về quy định thưởng, BHXH, thuế TNCN - cần xác nhận với luật lao động và thuế hiện hành khi thiết kế thưởng, hợp đồng, phúc lợi."

case_lessons:
  - name: "Google - Self-Determination (20% time)"
    type: "success"
    setup: "Thập niên 2000, retention là vấn đề; engineer lương cao nên tiền không còn là đòn bẩy chính. Áp 20% time (autonomy), ngân sách học tập (competence, ước tính 15.000 USD/năm minh họa), đồng nghiệp xuất sắc/bữa trưa chung (relatedness)."
    key_calculations:
      - "Chi phí thật: 20% thời gian kỹ thuật = 1/5 năng lực bị chuyển hướng."
      - "Lợi ích: giữ người giỏi (chi phí thay thế thường 50-200% lương năm, ước lượng phổ biến), ý tưởng từ dưới lên, uy tín tuyển dụng."
    lesson: "Khi hygiene đủ, SDT mạnh hơn tăng lương; cần lợi nhuận cao, người tự giác, văn hóa chấp nhận thất bại; SME nên thu nhỏ (1 buổi chiều/tháng)."
    data_reliability: "illustrative"
  - name: "Vinamilk - Maslow + Herzberg + Job redesign"
    type: "success"
    setup: "Giả định ~3.000 công nhân (minh họa), turnover 40% -> 8%, lương 2,5 -> 4,5 triệu/tháng; recognition, trao quyền, lộ trình, luân chuyển, dashboard sản lượng."
    key_calculations:
      - "Chi phí tăng lương = 3.000 x 2 triệu x 12 = 72.000 triệu."
      - "Tiết kiệm thay thế = 3.000 x 32% x 6 triệu = 5.760 triệu."
      - "Phần phải bù từ năng suất = 66.240 triệu; mỗi người cần 22,08 triệu/năm (1,84 triệu/tháng)."
      - "Nếu +25% năng suất trên 20 triệu/tháng = 5 triệu: lãi ròng 3,16 triệu/người/tháng."
    lesson: "Tăng lương chỉ có ROI dương khi đi cùng cơ chế chuyển động lực thành năng suất/chất lượng (ghi nhận, job redesign, KPI)."
    data_reliability: "illustrative"
  - name: "SME điện tử - sai lầm Expectancy (KPI quá gắt)"
    type: "failure"
    setup: "~200 nhân viên, sản lượng trung bình 105 sp/ngày; CEO đặt thưởng 120/140/160 sp (500k/1 triệu/1,5 triệu) để tăng năng suất 50%."
    key_calculations:
      - "Khoảng cách: +14,3%, +33,3%, +52,4%."
      - "M trước: 0,7 x 0,5 x 0,6 = 0,210."
      - "M sau KPI sai: 0,1 x 0,3 x 0,4 = 0,012 (giảm khoảng 94%)."
      - "M sau khắc phục: 0,7 x 0,85 x 0,75 = 0,446 (gấp ~37 lần đáy, ~2,1 lần trước KPI)."
      - "Hậu quả 3 tháng: turnover 5% -> 20%/tháng, lỗi +40%."
    lesson: "Thêm thưởng làm V tăng nhưng E và I sụp đổ nên M sụp theo phép nhân; sửa E, I (bậc thang, công thức rõ, trả ngay, KPI chất lượng) không cần tăng thưởng; chẩn đoán E -> I -> V."
    data_reliability: "illustrative"
  - name: "Yahoo dưới Marissa Mayer - cấm WFH"
    type: "failure"
    setup: "Chính sách bắt làm tại văn phòng (memo 2013); phân tích Autonomy bị vi phạm, so sánh với Google (Equity), brain drain, lệch giai đoạn công ty."
    key_calculations: ["Tỷ lệ nghỉ việc tăng 20-30% là ước tính minh họa, không có công bố; Yahoo còn nhiều áp lực kinh doanh nên không quy toàn bộ cho chính sách này."]
    lesson: "Ra quyết định từ kinh nghiệm cá nhân của lãnh đạo dễ sai; cần dữ liệu nhân viên của mình; tin cậy và tự chủ hiệu quả hơn ép buộc; chi phí mất nhân tài lớn hơn chi phí linh hoạt."
    data_reliability: "unverified"
  - name: "FPT Software - kết hợp nhiều thuyết"
    type: "success"
    setup: "~10.000 lập trình viên, cạnh tranh outsourcing và Singapore/Nhật; kết hợp Herzberg (lương P50-P75, dự án quốc tế, Star Engineer, lộ trình kỹ thuật/quản lý), McClelland, Vroom, SDT, Equity."
    key_calculations: ["Retention 85-90% so với 60-70% ngành là mô hình ước tính, không phải số FPT công bố.", "Bản đồ: lương -> Herzberg/Equity; chán việc -> motivators/JCM; thiếu lãnh đạo -> McClelland; thưởng không chạm -> Vroom; mất làm chủ -> SDT."]
    lesson: "Mỗi thuyết là một ống kính; giá trị nằm ở quy trình chẩn đoán -> chọn thuyết -> thiết kế -> đo; với lao động tri thức autonomy + competence + relatedness quan trọng hơn lương thô."
    data_reliability: "illustrative"
  - name: "WeWork - lạm dụng Self-Determination"
    type: "failure"
    setup: "Định giá ~47 tỷ USD đầu 2019, IPO hoãn/rút 9/2019, sa thải hàng nghìn (khoảng 1/5 lực lượng theo báo chí, cần kiểm chứng); diễn giải: autonomy thiếu guardrails, tuyển quá nhanh (competence gap), relatedness thành giáo phái, equity bất công, valence chỉ dựa vào sứ mệnh."
    key_calculations: ["Số nhân sự và tỷ lệ cắt giảm là ước tính; phân tích 'overuse SDT' là diễn giải của tác giả, nguyên nhân chính là mô hình kinh doanh và quản trị."]
    lesson: "Tự chủ không phải là không quản trị; đa dạng nguồn động lực (không chỉ sứ mệnh); công bằng về cổ phần/đãi ngộ; văn hóa gia đình không được dùng để dập phản biện."
    data_reliability: "unverified"
  - name: "The Coffee House - Maslow + Herzberg và sự sụp đổ khi bỏ công thức"
    type: "failure"
    setup: "~3.000 nhân viên (ước chừng). 2010-2015: lương cao hơn thị trường, BHXH, văn hóa gia đình, ghi nhận, trao quyền, lộ trình; 2018+: lương thực giảm, mở rộng quá nhanh, bỏ ghi nhận, tập trung hóa."
    key_calculations: ["Nghỉ việc 10-15% -> 35-40%/năm (ước tính minh họa).", "Chi phí thay thế tăng: 3.000 x 26% x 5 triệu = 3.900 triệu VND/năm (giả định)."]
    lesson: "Văn hóa động lực phải được duy trì, cắt hygiene và motivators rẻ tiền cùng lúc làm mất cả 'lý do ở lại' lẫn 'lý do cố gắng'; tiết kiệm thường nhỏ hơn chi phí thay thế."
    data_reliability: "illustrative"
  - name: "Xưởng may Thiên Phú (SME giả định)"
    type: "sme"
    setup: "120 công nhân, lương TB 7,5 triệu, 36.000 áo/tháng x 100.000 đồng, nghỉ việc 48%, lỗi 6%; chủ định tăng lương 10% đồng loạt."
    key_calculations:
      - "Thiệt hại nhìn thấy: 460,8 + 1.036,8 = 1.497,6 triệu/năm (13,9% quỹ lương)."
      - "Herzberg: hygiene 2,875, motivators 2,10."
      - "Vroom trước: công nhân may M 0,126, QC 0,140, tổ trưởng 0,160; sau: 0,51/0,448/0,476."
      - "Equity: A bằng 81,6% của B."
      - "Chương trình 904 triệu (540 + 324 + 40); lợi ích 1.067,52; net +163,52; CBR 0,85; độ nhạy 50% năng suất -43,84."
    lesson: "Chẩn đoán trước khi chi tiền: gốc rễ là I (Equity) và motivators thấp, không phải lương; hygiene đủ, motivators rẻ; kết quả dương nhưng mỏng nên pilot một tổ và ưu tiên tăng theo bậc."
    data_reliability: "illustrative"

worked_examples:
  - name: "Tính M cho hai nhóm và chẩn đoán"
    inputs: {developer: {E: 0.8, I: 1.0, V: 0.9}, worker: {E: 0.5, I: 0.3, V: 0.7}}
    steps: ["Developer: 0,8 x 1,0 x 0,9 = 0,72", "Công nhân: 0,5 x 0,3 x 0,7 = 0,105", "Thành phần nhỏ nhất của công nhân là I = 0,3 -> sửa I: công thức thưởng minh bạch, trả ngay (I 0,3 -> 0,8 thì M = 0,5 x 0,8 x 0,7 = 0,28), đồng thời sửa E bằng đào tạo"]
    result: "Developer 0,72 (cao); công nhân 0,105 (rất thấp) do Instrumentality thấp"
  - name: "MPS trước/sau redesign"
    inputs: {before: {SV: 2, TI: 2, TS: 3, A: 2, F: 3}, after: {SV: 5, TI: 4, TS: 6, A: 4, F: 6}}
    steps: ["Trước: (2+2+3)/3 x 2 x 3 = 14", "Sau: (5+4+6)/3 x 4 x 6 = 120", "Tỷ lệ 120/14 = 8,6"]
    result: "MPS tăng khoảng 8,6 lần"
  - name: "Sửa KPI thất bại (case SME điện tử)"
    inputs: {P0: 105, targets: [120, 140, 160], before_M: [0.7, 0.5, 0.6], after_bad: [0.1, 0.3, 0.4], after_fix: [0.7, 0.85, 0.75]}
    steps: ["Gap: 14,3%, 33,3%, 52,4%", "M trước = 0,210; sau KPI sai = 0,012; sau khắc phục = 0,446", "Giảm 94% rồi tăng khoảng 37 lần so với đáy"]
    result: "0.210 -> 0.012 -> 0.446"
  - name: "Chi phí vấn đề và ROI xưởng may"
    inputs: {N: 120, r: 0.48, c: 8, Q: 36000, d: 0.06, u: 40000, program_cost: 904}
    steps: ["Nghỉ việc: 57,6 x 8 = 460,8; lỗi: 1.036,8; tổng 1.497,6 triệu", "Lợi ích sau 12 tháng: 220,8 + 432 + 414,72 = 1.067,52", "Net = 1.067,52 - 904 = 163,52; CBR 0,85", "Độ nhạy 50% năng suất: 860,16 - 904 = -43,84"]
    result: "Net +163,52 triệu; độ nhạy 50%: -43,84 triệu (giả định minh họa)"
  - name: "Kiểm tra công bằng giữa hai công nhân"
    inputs: {wA: 7200000, qA: 2730, wB: 8400000, qB: 2600}
    steps: ["A: 7,2 triệu / (105 x 26 = 2.730) = khoảng 2.637 VND/áo", "B: 8,4 triệu / (100 x 26 = 2.600) = khoảng 3.231 VND/áo", "Tỷ lệ = 2.637/3.231 = 0,816"]
    result: "A nhận khoảng 81,6% của B trên mỗi áo -> vi phạm công bằng"
  - name: "Kiểm tra ROI tăng lương (Vinamilk minh họa)"
    inputs: {workers: 3000, wage_rise_per_month: 2, turnover_before: 0.4, turnover_after: 0.08, replacement_cost: 6}
    steps: ["Chi phí = 3.000 x 2 x 12 = 72.000 triệu", "Tiết kiệm = 3.000 x 0,32 x 6 = 5.760 triệu", "Mỗi người cần lợi ích năng suất 22,08 triệu/năm = 1,84 triệu/tháng"]
    result: "Cần năng suất bù ít nhất 66.240 triệu/năm; có cơ chế động lực thì lãi ròng khoảng 3,16 triệu/người/tháng (với giả định +25% trên 20 triệu)"

practice_questions:
  - q: "Nhân viên có E 0,8, I 0,1, V 0,9. Tính M và đề xuất can thiệp."
    a: "M = 0,072 (rất thấp). Gốc rễ là I (làm tốt nhưng công ty không thưởng/không liên kết). Sửa: công thức thưởng minh bạch, trả đúng hạn, theo dõi dashboard."
  - q: "Chủ xưởng muốn tăng lương đồng loạt 10% vì nhiều công nhân nghỉ. Cần làm gì trước?"
    a: "Đo chi phí vấn đề (turnover + lỗi), khảo sát Herzberg (hygiene vs motivators), đo E/I/V theo nhóm, kiểm tra Equity. Tăng lương chỉ tác động V/hygiene; nếu I thấp (bất công) hoặc motivators < 2,5 thì sửa chúng."
  - q: "Vì sao Vroom dùng phép nhân thay vì cộng?"
    a: "Chuỗi nhân quả đứt ở bất kỳ mắt xích nào thì mất tác dụng; phép nhân cho M = 0 khi một thành phần = 0, phép cộng cho động lực dương phi lý."
  - q: "Công nhân năng suất 105 sp/ngày, KPI thưởng đặt 160 sp. Khoảng cách và vấn đề?"
    a: "(160/105) - 1 = 52,4%. E sụp đổ; dùng bậc thang quá khứ + 10-20% (khoảng 115-126), thêm KPI chất lượng."
  - q: "Phân biệt Hygiene và Motivator trong Herzberg; cho ví dụ."
    a: "Hygiene (lương, điều kiện, chính sách) thiếu thì bất mãn nhưng đủ thì trung tính. Motivator (thành tựu, công nhận, trách nhiệm) tạo động lực. Ví dụ: văn phòng cũ là hygiene; được giao dự án thử thách là motivator."
  - q: "Tính MPS: SV 4, TI 4, TS 4, A 1, F 6."
    a: "(4+4+4)/3 x 1 x 6 = 4 x 6 = 24. Autonomy thấp kéo MPS dù ba đặc điểm đầu khá cao."
  - q: "Chọn thuyết nào cho công ty IT lương cao; công nhân may lương thấp; startup?"
    a: "IT: SDT (autonomy, competence, relatedness) + Maslow T4-5. Công nhân may: Maslow T1-3, Vroom, Equity, Reinforcement. Startup: Herzberg motivators + McClelland nAch, thưởng/equity rõ."
  - q: "Công ty cắt chương trình ghi nhận và ngừng tăng lương để tiết kiệm; nghỉ việc 12% -> 38% với 3.000 nhân viên, chi phí thay thế 5 triệu. Tính chi phí thay thế tăng thêm."
    a: "3.000 x (0,38 - 0,12) x 5 = 3.900 triệu VND/năm (chưa kể trải nghiệm khách), thường lớn hơn khoản tiết kiệm."
  - q: "Công nhân A 2.730 sp lương 7,2 triệu; B 2.600 sp lương 8,4 triệu. Có công bằng không?"
    a: "A 2.637 VND/sp, B 3.231 VND/sp; A bằng 81,6% của B -> không công bằng (Equity), I sụp."
  - q: "Chương trình 904 triệu, lợi ích kỳ vọng 1.067,52 triệu. Nếu chỉ đạt 50% lợi ích năng suất (414,72 -> 207,36) thì sao?"
    a: "Tổng lợi ích 860,16; net = -43,84 triệu (lỗ). Pilot, tăng theo bậc thợ, chuyển chi phí cố định sang thưởng biến đổi."

checklist:
  - "Đã khảo sát nhân viên (hygiene, motivators, E/I/V) thay vì đoán?"
  - "Đã tính chi phí vấn đề (turnover, lỗi, vắng mặt) để biết ngân sách tối đa?"
  - "Đã phân nhóm nhân viên và chẩn đoán riêng từng nhóm?"
  - "Đã kiểm tra công bằng nội bộ (cùng vị trí, năng suất, thưởng) và so với thị trường?"
  - "Hygiene (lương, điều kiện, an toàn việc làm) đạt tối thiểu P50 thị trường trước khi kỳ vọng motivators?"
  - "KPI bậc thang, dựa trên dữ liệu quá khứ + 10-20% (E >= 0,6)?"
  - "Công thức thưởng minh bạch trong một trang kèm ví dụ (I cao)?"
  - "Có chỉ số chất lượng đi kèm sản lượng để tránh gaming?"
  - "Đã hỏi nhân viên giá trị phần thưởng (tiền, thời gian, học tập, danh hiệu) (V)?"
  - "Có chương trình ghi nhận công khai, chi phí thấp, kịp thời?"
  - "Có lộ trình nghề (kỹ thuật và quản lý) và ngân sách đào tạo?"
  - "Có cho phép tự chủ cách làm, không micromanage?"
  - "Pilot một bộ phận trước khi nhân rộng?"
  - "Thưởng trả đúng hạn, không trì hoãn?"
  - "Theo dõi hằng quý turnover, engagement, năng suất, lỗi, vắng mặt?"
  - "Đã tính ROI và độ nhạy (chỉ đạt 50% lợi ích còn lãi không)?"
  - "Cam kết duy trì chương trình, không cắt ghi nhận/lương khi cắt giảm chi phí?"
  - "Đã đánh dấu số liệu minh họa khi trích từ case study cho báo cáo nội bộ?"
  - "Mục tiêu (checklist 8 nhóm): lương/phúc lợi, môi trường, quản lý/văn hóa, ghi nhận, trách nhiệm/tự chủ, phát triển, KPI/công bằng, đội nhóm/thuộc về đều được rà soát?"

excel_google_sheets_templates:
  - name: "Employee Motivation Assessment (checklist 8 nhóm)"
    description: "Checklist có/không cho: 1 lương và phúc lợi (P50, theo CPI, BHXH, bữa ăn, linh hoạt giờ giấc); 2 môi trường; 3 quản lý/văn hóa; 4 ghi nhận; 5 trách nhiệm/tự chủ; 6 phát triển; 7 KPI/công bằng (KPI rõ, khả thi, liên kết thưởng, công bằng, trả nhanh); 8 đội nhóm/thuộc về."
  - name: "Employee Motivation Survey (22 câu)"
    description: "19 câu thang 1-5 chia 8 nhóm A-H + 3 câu mở (điều gì tạo động lực, điều gì cần đổi, có muốn ở lại không). Chấm: < 2,5 khẩn cấp; 2,5-3,5 cải thiện; > 3,5 tốt; chọn câu thấp nhất; tái khảo sát 3-6 tháng. Có thể dùng Google Forms + Sheets (AVERAGE theo nhóm)."
  - name: "Reward System Design Template"
    description: "7 mục: KPI cá nhân 60% + nhóm 40%; cấu trúc thưởng và công thức Bonus; thời điểm trả; công bằng/minh bạch (công thức công khai, dashboard, khiếu nại, không thiên vị); kiểm tra Vroom (E 0,8, I 0,9, V 0,8 -> M 0,576, mục tiêu M > 0,5); kiểm tra Equity; rà soát quý (dưới 50% đạt -> mục tiêu quá cao; gaming)."
  - name: "Bảng chẩn đoán Vroom + ROI (tự xây)"
    description: "Sheet 1: E, I, V theo nhóm và M = E*I*V; Sheet 2: chi phí vấn đề (N*r*c, Q*d*u*12); Sheet 3: ROI với ô độ nhạy hiệu quả 50%/75%/100%. Cấu trúc gợi ý từ case xưởng may; không phải template có sẵn trong nguồn."
