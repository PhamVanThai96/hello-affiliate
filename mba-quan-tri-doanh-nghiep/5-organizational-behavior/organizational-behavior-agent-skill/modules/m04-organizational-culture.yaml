# m04 - Văn hóa tổ chức (distill từ 04-organizational-culture.md)
id: "m04"
name_vi: "Văn hóa tổ chức"
name_en: "Organizational Culture"
source_file: "04-organizational-culture.md"
purpose: >
  Giúp chẩn đoán, đo lường và thay đổi văn hóa tổ chức (Schein, Hofstede, Cameron-Quinn/OCAI, Denison, Handy,
  Deal-Kennedy, Trompenaars, Kotter) rồi quy ra con số kinh doanh (eNPS, tỷ lệ và chi phí nghỉ việc, khoảng cách văn hóa,
  ROI chương trình) để chủ SME Việt Nam quyết định có đầu tư vào văn hóa hay không, đầu tư theo hướng nào và theo dõi bằng chỉ số nào.
when_to_use:
  - "Chủ SME hỏi: nhân viên nghỉ việc nhiều, giao trễ, các tổ trưởng chờ sếp quyết - có phải vấn đề văn hóa không?"
  - "Cần chẩn đoán văn hóa hiện tại và mong muốn (OCAI), đọc kết quả và chọn hướng can thiệp"
  - "Doanh nghiệp tuyên bố giá trị đẹp nhưng hành vi thực khác (poster vs reality gap) - cần soi 3 tầng Schein"
  - "Mở rộng ra nước ngoài, thuê quản lý nước ngoài, nhận đầu tư/M&A xuyên biên giới - cần so khoảng cách văn hóa (Hofstede, Trompenaars)"
  - "Chuẩn bị M&A, sáp nhập hai công ty: cultural due diligence trước khi định giá"
  - "Startup lớn từ 10-50 lên 100-500 người, sợ mất sáng tạo khi thêm quy trình"
  - "Lập kế hoạch thay đổi văn hóa (Kotter 8 bước), core values workshop, khảo sát văn hóa 20 câu"
  - "Tính eNPS, tỷ lệ nghỉ việc, chi phí nghỉ việc, ROI của chương trình văn hóa"
  - "Thiết kế KPI/thưởng mà không làm nhân viên gian lận (bài học Wells Fargo, Enron, Uber)"
prerequisites: []
related_modules:
  - "m02: Phong cách lãnh đạo - lãnh đạo nhúng văn hóa qua điều chú ý, thưởng, phạt (Schein)"
  - "m01: Động lực - hệ thống thưởng/KPI định hình hành vi (Kerr 1975: thưởng A, hy vọng B)"
  - "m03: Động lực nhóm - an toàn tâm lý, Project Aristotle, văn hóa phụ giữa các nhóm"
  - "m05: Quyền lực và chính trị - Power Culture (Zeus), văn hóa sợ hãi, ngôi sao được bảo vệ"
  - "m06: Quản lý xung đột - xung đột nhiều khi là hai văn hóa va nhau (Handy), kênh khiếu nại độc lập"
  - "m07: Quản trị thay đổi - Kotter 8 bước, chương trình thay đổi văn hóa 3-5 năm"
  - "m08: Trí tuệ cảm xúc - Trompenaars Neutral vs Emotional, giao tiếp liên văn hóa"
  - "m09: Ra quyết định - quyết định đảo ngược được vs không đảo ngược được, nhanh vs chính xác"
  - "m10: People insight - eNPS, pulse survey, chi phí nghỉ việc"
  - "Tài chính (finance-agent-skill): ROI, chi phí thay thế nhân sự, M&A synergy"

concepts:
  - term_vi: "Văn hóa tổ chức"
    term_en: "Organizational Culture"
    definition: "Tập hợp giá trị, niềm tin, chuẩn mực, hành vi, ký hiệu, ngôn ngữ và quy tắc được chia sẻ trong tổ chức - 'cách chúng ta làm việc ở đây'. Schein (2016): khuôn mẫu các giả định cơ bản mà nhóm phát minh/khám phá/phát triển khi học cách đối phó thích nghi bên ngoài và tích hợp bên trong, đủ hiệu quả để được coi là đúng và dạy cho thành viên mới."
    why_it_matters: >
      Chiến lược là kế hoạch viết ra một lần; văn hóa là hệ điều hành hành vi hằng ngày. Hàng trăm quyết định nhỏ (có xin lỗi khách không,
      có báo lỗi không) nghiêng về hướng nào mà không ai ra lệnh là do văn hóa, nên chiến lược đi ngược văn hóa bị mài mòn ở tầng thực thi.
      Các định nghĩa khác: Deal và Kennedy (1982), Hofstede (1980: 'lập trình tập thể của tâm trí').
  - term_vi: "Câu 'Culture eats strategy for breakfast' và bảng lợi ích định lượng"
    term_en: "Culture eats strategy; quantified benefits"
    definition: "Bảng nguồn nêu văn hóa mạnh gắn với +33% ROI (Denison, 2000), +17% hiệu quả, -30% turnover, +50% sáng kiến, +20% tăng trưởng doanh thu."
    why_it_matters: >
      CẢNH BÁO TRUNG THỰC (theo nguồn): các con số chỉ là ước tính minh họa tổng hợp từ nhiều nghiên cứu (Denison, Kotter và Heskett, Gallup...),
      chưa kiểm chứng từng dòng - dùng để hình dung độ lớn, không trích như số chính xác. Câu của 'Peter Drucker' cũng không có nguồn
      xác thực trong tác phẩm của ông; ý nghĩa quan trọng hơn xuất xứ.
  - term_vi: "Lịch sử khái niệm"
    term_en: "History of the concept"
    definition: "1930s Hawthorne (Mayo): yếu tố xã hội ảnh hưởng hiệu suất; 1950s nghiên cứu 'organizational climate'; 1979-1982 Peters-Waterman, Deal-Kennedy, Schein; 1980s-90s Hofstede, Handy, Cameron-Quinn; 2000s Denison, Trompenaars gắn văn hóa với hiệu suất; 2010s-2020s văn hóa số, bao dung, an toàn tâm lý."
    why_it_matters: "Giúp người mới thấy văn hóa là khái niệm trưởng thành, có nhiều mô hình bổ sung nhau chứ không đối lập."
  - term_vi: "Mô hình ba tầng Schein: Artifacts / Espoused Values / Basic Assumptions"
    term_en: "Schein's three levels"
    definition: "Artifacts (hiện tượng quan sát: không gian, trang phục, nghi lễ, câu chuyện, quy trình) - dễ thấy nhưng khó hiểu nghĩa. Espoused Values (giá trị tuyên bố: sứ mệnh, tầm nhìn, core values) - công khai nhưng không chắc được thực hành. Basic Underlying Assumptions (giả định ngầm: bản chất con người, thời gian, mục tiêu tổ chức) - khó thấy nhất nhưng thực sự điều khiển hành vi."
    why_it_matters: >
      Hình tảng băng: chỉ thấy phần nổi. Giá trị tuyên bố và giả định thực thường lệch nhau (tuyên bố 'khách hàng ưu tiên' nhưng giả định 'lợi nhuận ngắn hạn quan trọng hơn'
      nên khách bị bỏ rơi khi ảnh hưởng dòng tiền). Giả định chỉ lộ khi có người mới đến hoặc khi khủng hoảng. Người bắt chước Artifacts mà không hiểu Assumption sẽ thất bại (bỏ chính sách phép mà không có hệ thống đi kèm).
  - term_vi: "Khoảng cách tuyên bố - thực tế"
    term_en: "Posters vs Reality Gap"
    definition: "Chênh lệch giữa Espoused Values (Tầng 2) và Basic Assumptions thể hiện qua hành vi (Tầng 3)."
    why_it_matters: "Khoảng cách càng rộng rủi ro càng lớn (Enron in RICE nhưng thưởng 'thắng bằng mọi giá'). Bộ quy tắc đẹp không bảo vệ được công ty khi hệ thống thưởng phạt dạy điều ngược lại."
  - term_vi: "Sáu chiều văn hóa quốc gia Hofstede"
    term_en: "Hofstede's 6 cultural dimensions"
    definition: "PDI (khoảng cách quyền lực), UAI (tránh bất định), IDV (cá nhân vs tập thể), MAS (nam tính vs nữ tính), LTO (dài hạn vs ngắn hạn), IVR (tận hưởng vs kiềm chế, thêm 2010 bởi Minkov). Mỗi chiều thang 0-100."
    why_it_matters: >
      Cuối thập niên 1960-đầu 1970 Hofstede phân tích hàng chục nghìn khảo sát nhân viên IBM ở 40+ quốc gia (Culture's Consequences, 1980): cùng công ty, cùng chính sách mà phản ứng khác hẳn
      nên văn hóa quốc gia mạnh hơn 'văn hóa công ty'. Giải quyết vấn đề: chính sách 'chuẩn' ở trụ sở có thể hỏng chỉ vì lệch văn hóa; Hofstede cho phép định lượng khoảng cách văn hóa thay vì cảm nhận.
      Chỉ số quốc gia là xu hướng trung bình, không mô tả từng cá nhân/doanh nghiệp.
  - term_vi: "Hồ sơ Hofstede của Việt Nam (làm tròn, cần kiểm tra lại)"
    term_en: "Vietnam's Hofstede profile"
    definition: "PDI 70 (cao), UAI 30 (thấp), IDV 20 (rất thấp - tập thể), MAS 40 (thấp), LTO 80 (rất cao), IVR 35 (thấp). Nguồn ghi: số làm tròn từ Hofstede Insights; riêng LTO của VN công bố khác nhau (thường 57-80 tùy phiên bản) - cần kiểm tra hofstede-insights.com trước khi trích."
    why_it_matters: >
      Hàm ý SME VN: cấu trúc phân cấp, giá trị tập thể, hướng dài hạn. UAI thấp cho thấy thoải mái với thay đổi/mơ hồ, nhưng do PDI cao nhân viên vẫn chờ sếp chỉ dẫn rõ
      và quyết định tập trung ở cấp trên - 'tự do' phải được cho phép rõ ràng thì nhân viên mới dám dùng.
  - term_vi: "Khung giá trị cạnh tranh (CVF) bốn loại văn hóa"
    term_en: "Competing Values Framework: Clan, Adhocracy, Market, Hierarchy"
    definition: "Hai trục: Linh hoạt-Ổn định và Hướng nội-Hướng ngoại. Clan (linh hoạt, nội bộ - gia đình, trung thành), Adhocracy (linh hoạt, ngoại - đổi mới, mạo hiểm), Market (ổn định, ngoại - kết quả, thắng, thị phần), Hierarchy (ổn định, nội bộ - quy trình, kiểm soát)."
    why_it_matters: >
      Cameron và Quinn (thập niên 1980) dựa trên nghiên cứu Quinn và Rohrbaugh (1983): các tiêu chí 'tổ chức hiệu quả' do nhà quản lý nêu tự gom thành 4 nhóm trên hai trục đối lập.
      Điểm đột phá: các giá trị CẠNH TRANH nhau (không tối đa hóa cả sáng tạo lẫn kiểm soát cùng lúc) nên bài toán lãnh đạo là cân bằng có chủ đích, không chọn 'văn hóa tốt nhất'.
  - term_vi: "OCAI"
    term_en: "Organizational Culture Assessment Instrument"
    definition: "6 câu hỏi (đặc điểm chủ yếu, phong cách lãnh đạo, quan hệ nhân viên, chiến lược, tiêu chuẩn thành công, phong cách kiểm soát), mỗi câu 4 lựa chọn ứng 4 loại văn hóa, người trả lời chia ĐÚNG 100 điểm, đo cả Now và Preferred, vẽ radar."
    why_it_matters: "Ép chia 100 điểm buộc đánh đổi (phản ánh bản chất 'giá trị cạnh tranh'). So Now với Preferred cho biết nhân viên muốn dịch chuyển hướng nào - thường khác với giả định của lãnh đạo."
  - term_vi: "Mô hình Denison"
    term_en: "Denison Organizational Culture Model"
    definition: "4 khía cạnh: Mission (hướng ngoài, ổn định), Adaptability (ngoài, linh hoạt), Involvement (trong, linh hoạt), Consistency (trong, ổn định); tâm là niềm tin và giả định cốt lõi. 12 yếu tố con (mỗi khía cạnh 3), khảo sát 60 câu thang 5 điểm."
    why_it_matters: >
      Schein, Handy mô tả hay nhưng khó trả lời 'văn hóa này có giúp tôi kiếm nhiều tiền hơn không?'. Denison (khởi đầu nghiên cứu 1990, ĐH Michigan; nguồn nêu nền 1.400 công ty theo công bố của tác giả)
      đo 4 đặc điểm bằng khảo sát rồi đối chiếu với ROA, tăng trưởng, chất lượng, hài lòng. Văn hóa trở thành biến đo được, so được, gắn KPI. Denison gọi bốn khía cạnh là 'nghịch lý' (paradox): doanh nghiệp xuất sắc quản lý được căng thẳng giữa ngoài/trong và linh hoạt/ổn định thay vì chọn một bên.
  - term_vi: "Bốn văn hóa của Handy"
    term_en: "Handy's Four Cultures (Zeus, Apollo, Athena, Dionysus)"
    definition: "Power (Zeus - quyền lực tập trung, nhanh), Role (Apollo - vai trò, quy tắc, ổn định), Task (Athena - dự án, năng lực, mạng lưới), Person (Dionysus - tổ chức phục vụ cá nhân chuyên môn)."
    why_it_matters: "Handy (Understanding Organizations 1976, Gods of Management 1978) thấy nhiều xung đột không do người xấu mà do hai kiểu văn hóa va nhau (chủ kiểu Zeus muốn quyết nhanh vs kế toán kiểu Apollo đòi quy trình). Hình ảnh thần Hy Lạp dễ nhớ, trực quan, hợp chẩn đoán nhanh cho SME."
  - term_vi: "Bốn văn hóa của Deal & Kennedy"
    term_en: "Deal & Kennedy: Tough Guy, Work Hard Play Hard, Bet Your Company, Process"
    definition: "Hai trục: mức rủi ro của quyết định và tốc độ phản hồi. Tough Guy (rủi ro cao, phản hồi nhanh), Work Hard Play Hard (rủi ro thấp, phản hồi nhanh), Bet Your Company (rủi ro cao, phản hồi chậm), Process/Work Soft (rủi ro thấp, phản hồi chậm)."
    why_it_matters: "Corporate Cultures (1982): văn hóa là sự thích nghi hợp lý với môi trường kinh doanh - bán bất động sản (rủi ro cao, phản hồi nhanh) tạo ra con người khác hẳn thăm dò dầu khí (rủi ro cao, phản hồi nhiều năm) hay công chức (rủi ro thấp, phản hồi chậm)."
  - term_vi: "Bảy chiều Trompenaars"
    term_en: "Trompenaars' 7 Dimensions"
    definition: "Universalism-Particularism, Individualism-Communitarianism, Neutral-Emotional, Specific-Diffuse, Achievement-Ascription, Sequential-Synchronic, Inner-directed-Outer-directed."
    why_it_matters: "Trompenaars và Hampden-Turner (Riding the Waves of Culture, 1993) thiết kế các chiều dưới dạng tình huống đánh đổi thực tế (tuân hợp đồng hay giúp bạn thân? thưởng theo thành tích hay thâm niên?) nên bổ sung Hofstede tốt khi đào tạo giao tiếp liên văn hóa. Con số '15.000 người, 50 quốc gia' chỉ mang tính tham khảo."
  - term_vi: "Văn hóa mạnh và yếu"
    term_en: "Strong vs Weak Culture"
    definition: "Mạnh: giá trị được >80% nhân viên hiểu, hành vi nhất quán, đồng hóa nhanh, turnover thấp. Yếu: giá trị mờ, hành vi không nhất quán, quyết định theo tư lợi/chính trị, dễ chọn lọc ngược (người giỏi nhất rời đi trước)."
    why_it_matters: "Văn hóa mạnh giảm chi phí giao dịch (không phải giải thích lặp lại) và rủi ro, nhưng có thể cứng nhắc, kháng thay đổi cần thiết, khó tuyển người nghĩ khác. 'Mạnh' không đồng nghĩa 'tốt'."
  - term_vi: "Văn hóa lành mạnh và độc hại"
    term_en: "Healthy vs Toxic Culture"
    definition: "Lành mạnh: giá trị rõ, lãnh đạo làm gương, giao tiếp cởi mở hai chiều, sai sót là cơ hội học, xung đột giải quyết công bằng, câu hỏi được khuyến khích. Độc hại: lãnh đạo lạm quyền, giao tiếp dối trá, sai sót bị phạt/giấu, xung đột bị lợi dụng, thắc mắc bị dập tắt, phân biệt đối xử."
    why_it_matters: "Văn hóa độc hại khiến thông tin xấu không đi lên, sai sót tích tụ rồi phát nổ (Enron, Wells Fargo, Uber) - chi phí kiện tụng, mất nhân tài, mất niềm tin là rủi ro đuôi (hiếm nhưng khổng lồ)."
  - term_vi: "Văn hóa phụ"
    term_en: "Subcultures"
    definition: "Nhóm giá trị khác nhau trong cùng tổ chức (công nghệ vs bán hàng, trụ sở vs chi nhánh, bộ phận bị thôn tính)."
    why_it_matters: "Gần như mọi tổ chức lớn đều có. Quản lý bằng: chấp nhận đa dạng trong khuôn khổ giá trị cốt lõi, tạo cầu nối, học từ văn hóa phụ mạnh."
  - term_vi: "Mô hình 8 bước thay đổi Kotter"
    term_en: "Kotter's 8-Step Change Model (Leading Change, 1996)"
    definition: "(1) Tạo cấp bách; (2) Liên minh dẫn dắt (5-15 người); (3) Tầm nhìn và chiến lược; (4) Giao tiếp tầm nhìn (lặp 7-10 lần); (5) Trao quyền, gỡ rào cản, đổi hệ thống thưởng; (6) Chiến thắng nhanh (6-12 tháng); (7) Củng cố, tạo thêm thay đổi; (8) Neo vào văn hóa (3-5 năm)."
    why_it_matters: "Kotter (HBS) nghiên cứu 100+ tổ chức: phần lớn thất bại không vì ý tưởng sai mà vì bỏ sót bước (thường bước 1 hoặc 8). Chuẩn hóa thành danh sách kiểm tra theo thứ tự. Là mô hình quản trị thay đổi tổng quát - áp dụng cho văn hóa cần kiên nhẫn nhiều năm."
  - term_vi: "Cơ chế văn hóa (mechanisms)"
    term_en: "Culture needs mechanisms"
    definition: "Văn hóa chỉ chạy khi có cơ chế đi kèm: tuyển chọn, thưởng phạt, KPI, quy trình, kênh báo cáo, hành vi lãnh đạo (Netflix: talent density, keeper test, context not control; Zappos: The Offer; Toyota: Andon + không đổ lỗi)."
    why_it_matters: "Giá trị viết ra không đổi hành vi; hệ thống thưởng-phạt mới đổi. Bài học lặp lại ở Enron, Uber, Wells Fargo: chỉ viết giá trị mới thì vô ích khi hệ thống thưởng vẫn dạy điều ngược lại."
  - term_vi: "Thưởng A, hy vọng B"
    term_en: "On the folly of rewarding A, while hoping for B (Kerr, 1975)"
    definition: "Khi hệ thống thưởng đo A (số lượng bán) nhưng tổ chức mong B (khách được phục vụ tốt), nhân viên chọn A."
    why_it_matters: "Giải thích vì sao một KPI đơn lẻ có thể chi phối cả văn hóa (Wells Fargo). Trước khi giao KPI hãy hỏi: có thể đạt KPI này bằng cách gian lận hoặc làm khách thiệt không?"
  - term_vi: "eNPS và lý do tính bằng hiệu"
    term_en: "Employee Net Promoter Score"
    definition: "Hỏi 0-10 'khả năng giới thiệu công ty cho bạn bè làm việc'. 9-10 Promoters, 7-8 Passives, 0-6 Detractors. eNPS = %Promoters - %Detractors (thang -100 đến +100)."
    why_it_matters: "Mượn từ NPS của Fred Reichheld (Bain, 2003). Điểm trung bình che giấu cực trị (nhiều 10 và nhiều 2 vẫn cho trung bình 6). Chỉ người chấm 9-10 dám 'bảo chứng'; 0-6 có nguy cơ rời đi và nói xấu; nhóm 7-8 thụ động nên bị loại ra. Hiệu số phản ánh 'uy tín nội bộ ròng' nhạy hơn."
  - term_vi: "An toàn tâm lý / kênh báo cáo độc lập"
    term_en: "Psychological safety and independent reporting channel"
    definition: "Nhân viên dám nói điều khác sếp, báo lỗi, tố cáo mà không bị trả đũa; kênh khiếu nại độc lập với người bị khiếu nại."
    why_it_matters: "Điều kiện bắt buộc để Andon (Toyota), kênh phản hồi và phát hiện sớm hoạt động; vắng nó thông tin xấu bị chặn (Enron, Uber, Wells Fargo). Ở PDI cao cần kênh ít rủi ro thể diện (hộp góp ý ẩn danh, họp nhóm nhỏ) trước khi mong phản biện trực tiếp."

formulas:
  - id: "m04_hofstede_cultural_distance"
    name_vi: "Khoảng cách văn hóa Hofstede (trung bình chênh lệch tuyệt đối)"
    name_en: "Hofstede cultural distance (mean absolute difference)"
    expression_latex: 'CD_{A,B} = \frac{1}{k}\sum_{d=1}^{k} \left| I_{A,d} - I_{B,d} \right|'
    expression_python: "sum(abs(a - b) for a, b in zip(country_a, country_b)) / len(country_a)"
    excel: "=SUMPRODUCT(ABS(B2:B6-C2:C6))/COUNT(B2:B6)"
    variables:
      - {symbol: "country_a", meaning: "Danh sách chỉ số Hofstede của nước/bên A theo các chiều được chọn", unit: "điểm 0-100"}
      - {symbol: "country_b", meaning: "Danh sách chỉ số cùng chiều, cùng thứ tự của nước/bên B", unit: "điểm 0-100"}
      - {symbol: "k", meaning: "Số chiều được so sánh (=len(country_a))", unit: "chiều"}
    when_to_use: "Đánh giá nhanh mức lệch văn hóa quốc gia khi M&A xuyên biên giới, mở chi nhánh nước ngoài, thuê quản lý nước ngoài; xếp hạng chiều nào là điểm nghẽn."
    why_it_works: >
      Hofstede biến 'cảm giác khác nhau' thành điểm 0-100 theo từng chiều. Lấy chênh lệch tuyệt đối từng chiều rồi trung bình cho một con số tóm tắt
      để so sánh các cặp (cặp nào khó tích hợp hơn), còn việc chẩn đoán thực sự nằm ở từng chiều lệch lớn nhất chứ không ở số trung bình.
      Trung bình là cách tính của tài liệu nguồn (không phải công thức chính thức của Hofstede).
    assumptions:
      - "Chỉ số quốc gia là xu hướng trung bình, đúng với doanh nghiệp/cá nhân cụ thể chỉ ở mức giả thuyết."
      - "Hai bên so cùng bộ chiều, cùng phiên bản dữ liệu; số trong bảng là làm tròn, cần đối chiếu hofstede-insights.com."
    pitfalls:
      - "Không so sánh trung bình giữa các cặp dùng số chiều khác nhau (Đức-Mỹ dùng 5 chiều có LTO; Anh-VN dùng 4 chiều không có LTO) mà kết luận chắc chắn."
      - "Trung bình che giấu chiều lệch cực lớn (Đức-Mỹ: LTO lệch 57); luôn đọc từng chiều."
      - "Không thay thế khảo sát văn hóa nội bộ hai công ty (OCAI/Denison)."
    interpretation: "Số càng cao càng khó tích hợp; chiều nào lệch từ khoảng 25-30 điểm trở lên cần chiến lược thích ứng riêng. Ngưỡng này là gợi ý thực dụng của module, không phải chuẩn của Hofstede."
    example:
      inputs:
        country_a: [35, 67, 66, 65, 83]
        country_b: [40, 91, 62, 46, 26]
      steps:
        - "Thứ tự chiều: PDI, IDV, MAS, UAI, LTO. Đức: 35, 67, 66, 65, 83. Mỹ: 40, 91, 62, 46, 26."
        - "Chênh lệch tuyệt đối: |35-40|=5; |67-91|=24; |66-62|=4; |65-46|=19; |83-26|=57."
        - "Tổng = 5+24+4+19+57 = 109; trung bình = 109/5 = 21.8."
      result: "Khoảng cách trung bình Đức-Mỹ = 21.8 điểm; hai điểm nghẽn là LTO (57) và IDV (24); PDI và MAS gần nhau."

  - id: "m04_ocai_gap"
    name_vi: "Khoảng cách OCAI (tổng độ lệch tuyệt đối Preferred - Now)"
    name_en: "OCAI gap (total absolute deviation between Now and Preferred)"
    expression_latex: 'G_{OCAI} = \sum_{c} \left| P_c - N_c \right|, \quad \sum_c N_c = \sum_c P_c = 100'
    expression_python: "sum(abs(p - n) for p, n in zip(preferred, now))"
    excel: "=SUMPRODUCT(ABS(C2:C5-B2:B5))"
    variables:
      - {symbol: "now", meaning: "Điểm trung bình 4 loại văn hóa HIỆN TẠI (Clan, Adhocracy, Market, Hierarchy), tổng 100", unit: "điểm"}
      - {symbol: "preferred", meaning: "Điểm trung bình 4 loại văn hóa MONG MUỐN, tổng 100", unit: "điểm"}
    when_to_use: "Sau khi chạy OCAI: lượng hóa mức độ nhân viên muốn thay đổi văn hóa và theo dõi khoảng cách thu hẹp qua các vòng đo (trước/sau can thiệp)."
    why_it_works: >
      Vì mỗi hồ sơ cộng đúng 100 điểm, mọi tăng ở loại này là giảm ở loại khác (tổng chênh lệch có dấu bằng 0). Tổng giá trị tuyệt đối vì thế đo 'lượng điểm phải dịch chuyển';
      thang tối đa là 200 (khi hai hồ sơ hoàn toàn không chồng nhau). Chia 100 điểm cũng là cách OCAI ép người trả lời đánh đổi, phản ánh bản chất 'giá trị cạnh tranh'.
    assumptions:
      - "Mỗi người trả lời chia đúng 100 điểm cho 4 lựa chọn ở cả 6 câu; hồ sơ là trung bình toàn mẫu."
      - "Mẫu đại diện, gồm cả nhân sự mới lẫn lâu năm."
    pitfalls:
      - "Kiểm tra tổng = 100 trước khi tính (lỗi nhập liệu phổ biến)."
      - "Chỉ đọc con số tổng mà bỏ qua dấu của từng loại: gap 18 'giảm Market, tăng Clan' khác hẳn gap 18 'tăng Hierarchy'."
      - "Mẫu nhỏ (ví dụ 56 người) chỉ nên coi là hướng dẫn."
      - "Nguồn không đưa ngưỡng chính thức 'bao nhiêu điểm là nhiều'; chỉ có các ví dụ 18, 30, 44."
    interpretation: "Ví dụ trong nguồn: 18 (công ty 300 người, lệch vừa), 30 (công ty 500 người, thiếu cấu trúc), 44 (Việt An, lệch lớn, trên thang 200). Giảm từ 44 xuống 18 sau 12 tháng can thiệp được coi là cải thiện rõ."
    example:
      inputs:
        now: [15, 35, 32, 18]
        preferred: [22, 32, 26, 20]
      steps:
        - "Kiểm tra: 15+35+32+18 = 100; 22+32+26+20 = 100."
        - "Chênh lệch (Pref - Now): Clan +7, Adhocracy -3, Market -6, Hierarchy +2."
        - "Tổng tuyệt đối = 7+3+6+2 = 18."
      result: "G = 18 điểm; nhân viên muốn thêm Clan (+7), Hierarchy (+2), bớt Market (-6) và Adhocracy (-3): bớt áp lực kết quả, thêm quan tâm con người, không bỏ sáng tạo. Số liệu giả định minh họa (công ty công nghệ 300 người)."

  - id: "m04_ocai_profile_difference"
    name_vi: "Chênh lệch giữa hai hồ sơ văn hóa OCAI (so hai tổ chức)"
    name_en: "OCAI profile difference between two organizations"
    expression_latex: 'D_{A,B} = \sum_{c} \left| N_{A,c} - N_{B,c} \right|'
    expression_python: "sum(abs(a - b) for a, b in zip(profile_a, profile_b))"
    excel: "=SUMPRODUCT(ABS(B2:B5-C2:C5))"
    variables:
      - {symbol: "profile_a", meaning: "Hồ sơ 4 loại văn hóa của tổ chức A (tổng 100)", unit: "điểm"}
      - {symbol: "profile_b", meaning: "Hồ sơ 4 loại văn hóa của tổ chức B (tổng 100)", unit: "điểm"}
    when_to_use: "Cultural due diligence trong M&A, so văn hóa hai công ty/hai bộ phận, hoặc so văn hóa hiện tại với mô hình mục tiêu."
    why_it_works: "Cùng logic với ocai_gap nhưng so hai tổ chức thay vì Now-Preferred: cho biết cần dịch chuyển bao nhiêu điểm để hai hồ sơ trùng nhau và loại văn hóa nào chênh nhiều nhất."
    assumptions:
      - "Hai hồ sơ cùng đo bằng OCAI, cùng thang 100 điểm."
    pitfalls:
      - "Ví dụ Netflix trong nguồn là GIẢ ĐỊNH minh họa, không phải kết quả OCAI thật của Netflix hay Blockbuster."
    interpretation: "Thang 0-200. Trong ví dụ giả định, 60 là rất lớn: đủ giải thích vì sao 'bắt chước' văn hóa Netflix mà không đổi hệ thống thưởng, tuyển dụng thì khó thành công."
    example:
      inputs:
        profile_a: [15, 10, 35, 40]
        profile_b: [15, 40, 30, 15]
      steps:
        - "Hồ sơ A (kiểu kiểm soát, giả định): Clan 15, Adhocracy 10, Market 35, Hierarchy 40. Hồ sơ B (kiểu Netflix, giả định): 15, 40, 30, 15. Cả hai tổng 100."
        - "Chênh lệch: Clan 0; Adhocracy 30; Market 5; Hierarchy 25."
        - "Tổng = 0+30+5+25 = 60."
      result: "D = 60 trên thang 200; khác biệt chính là Adhocracy (+30) và Hierarchy (-25): đổi quy trình lấy thử nghiệm (giả định minh họa)."

  - id: "m04_denison_average_spread"
    name_vi: "Điểm trung bình và độ chênh Denison (cao nhất - thấp nhất)"
    name_en: "Denison average score and spread"
    expression_latex: 'M = \frac{1}{4}\sum_{i} S_i, \qquad R = \max_i S_i - \min_i S_i'
    expression_python: "(sum(scores) / len(scores), max(scores) - min(scores))"
    excel: "=AVERAGE(B2:B5) và =MAX(B2:B5)-MIN(B2:B5)"
    variables:
      - {symbol: "scores", meaning: "Điểm 4 khía cạnh Mission, Adaptability, Involvement, Consistency (thang 1-5)", unit: "điểm"}
    when_to_use: "Đọc kết quả khảo sát Denison (hoặc khảo sát tương tự): phát hiện mất cân bằng giữa hướng ngoài/hướng trong, linh hoạt/ổn định."
    why_it_works: "Theo logic 'nghịch lý' của Denison, doanh nghiệp xuất sắc cân bằng cả bốn khía cạnh. Trung bình cho mặt bằng chung; độ chênh R phát hiện điểm yếu mà trung bình che giấu (trung bình 3.625 trông ổn nhưng R = 1.7)."
    assumptions:
      - "Thang 1-5, cùng bộ câu hỏi, mẫu đại diện."
    pitfalls:
      - "Không chỉ nhìn trung bình; luôn đọc từng khía cạnh và độ chênh."
      - "Các con số phần trăm hiệu suất gắn với từng khía cạnh không thống nhất giữa các nguồn; nguồn chỉ nêu xu hướng (Mission-tăng trưởng; Adaptability-doanh thu mới/thị phần; Involvement-chất lượng/gắn bó; Consistency-hiệu quả/ROA)."
    interpretation: "Điểm thấp nhất là điểm cần can thiệp trước. Ví dụ công ty sản xuất: Adaptability 2.5 yếu = 'gắn kết nhưng đóng kín'. Ví dụ Uber (giả định): R giảm từ 2.1 xuống 0.7 sau cải tổ là tín hiệu tốt hơn mức tăng trung bình."
    example:
      inputs:
        scores: [4.0, 2.5, 4.2, 3.8]
      steps:
        - "Mission 4.0; Adaptability 2.5; Involvement 4.2; Consistency 3.8."
        - "Trung bình = (4.0+2.5+4.2+3.8)/4 = 14.5/4 = 3.625."
        - "Độ chênh = 4.2 - 2.5 = 1.7."
      result: "Trung bình 3.625 nhưng chênh 1.7: Adaptability (2.5) là điểm yếu; khuyến nghị tăng tiếp xúc khách hàng, dự án thử nghiệm nhỏ, đưa chỉ số phản hồi khách hàng vào KPI (số giả định minh họa)."

  - id: "m04_survey_score_change"
    name_vi: "Điểm khảo sát văn hóa (trung bình nhóm câu hỏi) và thay đổi trước-sau"
    name_en: "Culture survey score and before/after change"
    expression_latex: 'S_g = \frac{1}{n_g}\sum_{q \in g} x_q, \qquad \Delta = \bar{S}_{sau} - \bar{S}_{truoc}'
    expression_python: "sum(after) / len(after) - sum(before) / len(before)"
    excel: "=AVERAGE(after_range)-AVERAGE(before_range)"
    variables:
      - {symbol: "before", meaning: "Điểm các câu hỏi (thang 1-5) ở lần đo TRƯỚC", unit: "điểm"}
      - {symbol: "after", meaning: "Điểm cùng các câu hỏi ở lần đo SAU", unit: "điểm"}
    when_to_use: "Tính điểm 5 nhóm của mẫu khảo sát 20 câu (mỗi nhóm = trung bình 4 câu; tổng thể = trung bình 20 câu) và chứng minh văn hóa đổi thật bằng thiết kế đo trước/sau."
    why_it_works: "Nếu chỉ đo một lần sau can thiệp thì không biết mức tăng bao nhiêu; so cùng câu hỏi ở hai thời điểm mới cô lập được thay đổi. Câu thấp nhất ban đầu thường tăng nhiều nhất."
    assumptions:
      - "Cùng bộ câu hỏi, cùng thang, tỷ lệ phản hồi tương đương (lý tưởng > 70%), ẩn danh."
    pitfalls:
      - "Số liệu FPT Telecom 'STCo' trong nguồn là mô hình minh họa và GIẢ ĐỊNH, không phải số liệu của FPT."
      - "Thay đổi trung bình không chứng minh nhân quả do chương trình (còn yếu tố thị trường, thay người)."
    interpretation: "Thang tổng thể 20 câu: 4.5-5.0 cực tích cực; 3.5-4.4 tích cực; 2.5-3.4 trung bình; 1.5-2.4 tiêu cực; 1.0-1.4 cực tiêu cực."
    example:
      inputs:
        before: [2.4, 2.8, 3.0]
        after: [3.6, 3.7, 3.8]
      steps:
        - "Ba câu: dám phản biện sếp, sai sót là cơ hội học, được tự quyết trong vai trò."
        - "Trung bình trước = (2.4+2.8+3.0)/3 = 8.2/3 = 2.7333."
        - "Trung bình sau = (3.6+3.7+3.8)/3 = 11.1/3 = 3.70."
        - "Thay đổi = 3.70 - 2.7333 = +0.9667 (nguồn làm tròn +0.97)."
      result: "Tăng +0.97 điểm; câu 'dám phản biện' tăng nhiều nhất (+1.2) vì ban đầu thấp nhất (tác động PDI cao). Số liệu giả định minh họa."

  - id: "m04_enps"
    name_vi: "eNPS - Điểm ròng nhân viên sẵn sàng giới thiệu"
    name_en: "Employee Net Promoter Score (eNPS)"
    expression_latex: 'eNPS = \frac{N_{9-10} - N_{0-6}}{N_{total}} \times 100'
    expression_python: "(promoters - detractors) / (promoters + passives + detractors) * 100"
    excel: "=(COUNTIF(A:A,\">=9\")-COUNTIF(A:A,\"<=6\"))/COUNT(A:A)*100"
    variables:
      - {symbol: "promoters", meaning: "Số người chấm 9-10", unit: "người"}
      - {symbol: "passives", meaning: "Số người chấm 7-8", unit: "người"}
      - {symbol: "detractors", meaning: "Số người chấm 0-6", unit: "người"}
    when_to_use: "Theo dõi định kỳ (tháng/quý) mức gắn kết và uy tín nội bộ; kết hợp turnover; đo trước/sau chương trình văn hóa."
    why_it_works: >
      Mượn từ NPS (Fred Reichheld, Bain, 2003). Điểm trung bình che giấu cực trị; chỉ nhóm 9-10 thực sự dám bảo chứng công ty, nhóm 0-6 có nguy cơ rời đi và nói xấu.
      Hiệu hai nhóm cực trị là 'uy tín nội bộ ròng'; nhóm 7-8 thụ động nên không đưa vào tử số.
    assumptions:
      - "Khảo sát ẩn danh, tỷ lệ phản hồi đủ cao; cách ghi điểm 0-10 chuẩn."
    pitfalls:
      - "Mẫu nhỏ làm eNPS dao động mạnh (56 người: một người đổi nhóm đổi ~1.8 điểm)."
      - "Chỉ cho biết 'mức độ' chứ không cho biết 'nguyên nhân': cần câu hỏi mở đi kèm."
      - "Benchmark trong nguồn là ngưỡng tham khảo chung, không phải theo ngành/quốc gia VN."
    interpretation: "Nguồn: >50 tuyệt vời; 30-50 tốt; 10-30 trung bình; <10 xấu. Âm nghĩa là người không dám giới thiệu nhiều hơn người dám."
    example:
      inputs:
        promoters: 14
        passives: 20
        detractors: 22
      steps:
        - "Tổng = 14+20+22 = 56. %Promoters = 14/56 = 25.0%. %Detractors = 22/56 = 39.29%."
        - "eNPS = 25.0 - 39.29 = -14.29."
        - "Sau can thiệp (Việt An): 24/22/10 -> 42.86% - 17.86% = +25.0."
      result: "eNPS Việt An: -14.3 (trước) -> +25.0 (sau 12 tháng). Số giả định minh họa."

  - id: "m04_turnover_rate"
    name_vi: "Tỷ lệ nghỉ việc"
    name_en: "Turnover rate"
    expression_latex: 'TR = \frac{L}{\bar{H}} \times 100\%'
    expression_python: "leavers / avg_headcount * 100"
    excel: "=B2/B3*100"
    variables:
      - {symbol: "leavers", meaning: "Số người nghỉ việc trong kỳ (thường 12 tháng)", unit: "người"}
      - {symbol: "avg_headcount", meaning: "Nhân sự bình quân trong kỳ", unit: "người"}
    when_to_use: "Chỉ báo cứng đầu tiên của văn hóa kém; dùng cùng eNPS; theo dõi theo bộ phận để phát hiện kiệt sức/quản lý có vấn đề."
    why_it_works: "Nghỉ việc là hành vi 'bỏ phiếu bằng chân' của nhân viên, ít bị bóp méo hơn khảo sát; chia cho nhân sự bình quân để so được giữa các công ty/kỳ."
    assumptions:
      - "Dùng nhân sự bình quân (không dùng đầu kỳ hay cuối kỳ riêng nếu quy mô biến động mạnh)."
    pitfalls:
      - "Gộp nghỉ chủ động với bị sa thải/hết hạn hợp đồng; tách ra mới đọc đúng văn hóa."
      - "Ví dụ Việt An của nguồn dùng 62 người (quy mô hiện tại) làm mẫu số - đơn giản hóa."
    interpretation: "Không có benchmark ngành trong nguồn. Việt An: 33.9% (21/62) là cao; mục tiêu trong kế hoạch thay đổi: giảm 10%/năm."
    example:
      inputs:
        leavers: 21
        avg_headcount: 62
      steps:
        - "21/62 = 0.3387."
        - "Sau can thiệp: 9/62 = 14.52%."
      result: "Tỷ lệ nghỉ việc 33.9% giảm còn 14.5% (giả định minh họa)."

  - id: "m04_turnover_cost"
    name_vi: "Chi phí nghỉ việc"
    name_en: "Cost of turnover"
    expression_latex: 'C_{TO} = L \times c_r, \qquad c_r = \rho \times W_{nam}'
    expression_python: "leavers * replacement_pct * monthly_salary * months_paid"
    excel: "=B2*B3*B4*B5"
    variables:
      - {symbol: "leavers", meaning: "Số người nghỉ", unit: "người"}
      - {symbol: "replacement_pct", meaning: "Chi phí thay thế mỗi người, tính theo tỷ lệ của lương năm (nguồn giả định 40%)", unit: "tỷ lệ"}
      - {symbol: "monthly_salary", meaning: "Lương bình quân tháng", unit: "triệu VNĐ"}
      - {symbol: "months_paid", meaning: "Số tháng lương trong năm (ví dụ 13 gồm tháng 13)", unit: "tháng"}
    when_to_use: "Quy văn hóa kém ra tiền để thuyết phục chủ SME đầu tư; làm tử số của ROI chương trình văn hóa."
    why_it_works: "Nhân sự nghỉ gây chi phí tuyển dụng, đào tạo, thời gian hòa nhập, mất năng suất, mất quan hệ khách hàng. Quy ước 'phần trăm lương năm' gom các chi phí đó thành một con số tính được; chuyển 'cảm giác' thành khoản chi."
    assumptions:
      - "Tỷ lệ 40% lương năm là GIẢ ĐỊNH của nguồn; thực tế thay đổi theo vị trí (nên tính riêng cho vị trí then chốt)."
    pitfalls:
      - "Chỉ là chi phí thay thế; chưa gồm thiệt hại giao trễ, uy tín, khách hàng bị mang đi."
      - "Đơn vị: triệu VNĐ; nhớ đổi sang tỷ khi báo cáo."
    interpretation: "Việt An: ~1.04 tỷ = ~2.2% doanh thu 48 tỷ. Có thể diễn đạt: văn hóa kém tương đương trừ ~2.2% doanh thu mỗi năm, chưa tính chi phí ẩn."
    example:
      inputs:
        leavers: 21
        replacement_pct: 0.4
        monthly_salary: 9.5
        months_paid: 13
      steps:
        - "Lương năm = 9.5 x 13 = 123.5 triệu."
        - "Chi phí thay thế mỗi người = 0.4 x 123.5 = 49.4 triệu."
        - "Tổng = 21 x 49.4 = 1037.4 triệu (xấp xỉ 1.04 tỷ); so doanh thu 48 tỷ = 2.16%."
      result: "Chi phí nghỉ việc 1037.4 triệu VNĐ. Sau can thiệp 9 người nghỉ: 9 x 49.4 = 444.6 triệu (giả định minh họa)."

  - id: "m04_turnover_saving"
    name_vi: "Tiết kiệm nhờ giảm tỷ lệ nghỉ việc"
    name_en: "Savings from lower turnover"
    expression_latex: 'S = H \times (TR_{truoc} - TR_{sau}) \times c_r'
    expression_python: "headcount * (rate_before - rate_after) * replacement_cost"
    excel: "=B2*(B3-B4)*B5"
    variables:
      - {symbol: "headcount", meaning: "Tổng nhân sự", unit: "người"}
      - {symbol: "rate_before", meaning: "Tỷ lệ nghỉ việc trước (dạng thập phân)", unit: "tỷ lệ"}
      - {symbol: "rate_after", meaning: "Tỷ lệ nghỉ việc sau (dạng thập phân)", unit: "tỷ lệ"}
      - {symbol: "replacement_cost", meaning: "Chi phí thay thế mỗi người", unit: "triệu VNĐ"}
    when_to_use: "Ước lượng lợi ích tài chính của chương trình văn hóa khi biết mục tiêu giảm turnover (dạng 'giảm 5 điểm phần trăm')."
    why_it_works: "Số người nghỉ ít đi = headcount x chênh tỷ lệ; nhân với chi phí thay thế mỗi người ra tiền tiết kiệm. Cùng logic ở mọi quy mô, từ 62 đến 5.000 người."
    assumptions:
      - "Chi phí thay thế mỗi người không đổi; toàn bộ giảm turnover do chương trình (thực tế chỉ một phần)."
    pitfalls:
      - "Ví dụ FPT Telecom trong nguồn là mô hình minh họa hóa; 5.000 người, 20% -> 15%, lương năm 150 triệu đều là giả định."
    interpretation: "Là phép tính minh họa phương pháp; SME tự thay số của mình."
    example:
      inputs:
        headcount: 5000
        rate_before: 0.20
        rate_after: 0.15
        replacement_cost: 60
      steps:
        - "Số người nghỉ ít hơn = 5000 x (0.20 - 0.15) = 250."
        - "Chi phí thay thế = 40% x 150 triệu = 60 triệu/người."
        - "Tiết kiệm = 250 x 60 = 15000 triệu = 15 tỷ VNĐ/năm."
      result: "Tiết kiệm 15000 triệu VNĐ/năm (giả định minh họa)."

  - id: "m04_culture_roi"
    name_vi: "ROI chương trình văn hóa"
    name_en: "Culture program ROI"
    expression_latex: 'ROI = \frac{S - C}{C} \times 100\%'
    expression_python: "(savings - program_cost) / program_cost * 100"
    excel: "=(B2-B3)/B3"
    variables:
      - {symbol: "savings", meaning: "Tiết kiệm/lợi ích định lượng được (ví dụ chi phí nghỉ việc giảm)", unit: "triệu VNĐ"}
      - {symbol: "program_cost", meaning: "Chi phí chương trình (tư vấn, đào tạo, thưởng ý tưởng, giờ họp)", unit: "triệu VNĐ"}
    when_to_use: "Thuyết phục chủ SME/ban lãnh đạo đầu tư; so các phương án can thiệp."
    why_it_works: "ROI chuẩn (lợi ích ròng/chi phí) áp cho dự án văn hóa; gắn văn hóa với tiền để vượt qua cảm giác 'mềm'."
    assumptions:
      - "Chỉ tính lợi ích đo được (chi phí nghỉ việc); lợi ích giảm trễ đơn hàng, phế phẩm chưa tính nên ROI thật thường cao hơn."
    pitfalls:
      - "Quy toàn bộ cải thiện cho chương trình (bỏ qua yếu tố khác) là thiên lệch."
      - "Tính ROI năm đầu khi thay đổi văn hóa cần 3-5 năm là chưa đầy đủ."
    interpretation: "Việt An: ROI 229% (giả định). Số dương lớn chứng tỏ chi phí thấp so với lợi ích; vẫn cần theo dõi bằng pulse survey 3 tháng/lần."
    example:
      inputs:
        savings: 592.8
        program_cost: 180
      steps:
        - "Tiết kiệm = 1037.4 - 444.6 = 592.8 triệu."
        - "Lợi ích ròng = 592.8 - 180 = 412.8 triệu."
        - "ROI = 412.8 / 180 = 2.2933 = 229.3%."
      result: "ROI = 229% (giả định minh họa, chỉ tính chi phí nghỉ việc)."

  - id: "m04_talent_density"
    name_vi: "Hiệu quả theo mật độ nhân tài (đầu ra trên chi phí)"
    name_en: "Talent density efficiency ratio"
    expression_latex: 'E_B / E_A = \frac{n_B \, o_B / (n_B \, c_B)}{n_A \, o_A / (n_A \, c_A)}'
    expression_python: "(n_b * out_b / (n_b * cost_b)) / (n_a * out_a / (n_a * cost_a))"
    excel: "=(B2*B3/(B2*B4))/(C2*C3/(C2*C4))"
    variables:
      - {symbol: "n_a", meaning: "Số người nhóm A (nhiều người, 'đủ tốt')", unit: "người"}
      - {symbol: "out_a", meaning: "Đầu ra mỗi người nhóm A", unit: "đơn vị"}
      - {symbol: "cost_a", meaning: "Chi phí mỗi người nhóm A", unit: "đơn vị tiền"}
      - {symbol: "n_b", meaning: "Số người nhóm B (ít người, xuất sắc)", unit: "người"}
      - {symbol: "out_b", meaning: "Đầu ra mỗi người nhóm B", unit: "đơn vị"}
      - {symbol: "cost_b", meaning: "Chi phí mỗi người nhóm B", unit: "đơn vị tiền"}
    when_to_use: "Giải thích logic kinh tế của chiến lược 'trả cao hơn cho ít người giỏi hơn' (Netflix) và cân nhắc áp dụng ở SME."
    why_it_works: "Cùng tổng chi phí, đội ít người nhưng đầu ra mỗi người cao hơn nhiều có thể cho tổng đầu ra lớn hơn; thêm vào đó ít người thì ít kênh giao tiếp, ít họp, ít xung đột phối hợp."
    assumptions:
      - "Đầu ra mỗi người của nhóm B gấp 3 nhóm A là giả định rất mạnh (nguồn nhấn mạnh: chỉ để minh họa logic, cần kiểm chứng thực tế)."
    pitfalls:
      - "Không đảm bảo ở thực tế; chênh năng suất 3 lần hiếm và phải kiểm chứng."
      - "Số liệu Netflix trong ví dụ là giả định, không phải số liệu của Netflix."
    interpretation: "Tỷ số > 1 nghĩa là nhóm B hiệu quả hơn trên mỗi đồng chi phí."
    example:
      inputs:
        n_a: 10
        out_a: 1
        cost_a: 100
        n_b: 5
        out_b: 3
        cost_b: 200
      steps:
        - "Nhóm A: 10 người x 100 = 1000; đầu ra 10 x 1 = 10."
        - "Nhóm B: 5 người x 200 = 1000; đầu ra 5 x 3 = 15."
        - "Hiệu quả B/A = (15/1000)/(10/1000) = 1.5."
      result: "Nhóm B hiệu quả hơn 1.5 lần (giả định minh họa)."

  - id: "m04_communication_channels"
    name_vi: "Số kênh giao tiếp trong nhóm"
    name_en: "Communication channels n(n-1)/2"
    expression_latex: 'K = \frac{n(n-1)}{2}'
    expression_python: "n * (n - 1) / 2"
    excel: "=B2*(B2-1)/2"
    variables:
      - {symbol: "n", meaning: "Số người trong nhóm", unit: "người"}
    when_to_use: "Giải thích vì sao đội nhỏ họp ít, phối hợp nhẹ hơn; cân nhắc khi mở rộng đội ngũ (liên hệ chuyển từ văn hóa Power sang Role)."
    why_it_works: "Mỗi cặp người là một kênh; số cặp tăng theo bình phương nên nhân đôi quy mô làm kênh giao tiếp tăng hơn gấp đôi nhiều lần."
    assumptions:
      - "Mọi cặp đều cần giao tiếp (thực tế phân cấp giảm số kênh)."
    pitfalls:
      - "Là ước lượng độ phức tạp, không phải thước đo thời gian họp."
    interpretation: "Nhóm 10 người có 45 kênh; nhóm 5 người có 10 kênh."
    example:
      inputs:
        n: 10
      steps:
        - "Nhóm 10: 10 x 9 / 2 = 45."
        - "Nhóm 5: 5 x 4 / 2 = 10."
      result: "45 kênh (10 người) so với 10 kênh (5 người)."

  - id: "m04_approval_delay"
    name_vi: "Độ trễ phê duyệt tích lũy"
    name_en: "Cumulative approval delay"
    expression_latex: 'T = L \times d \times N'
    expression_python: "layers * days_per_layer * decisions_per_month"
    excel: "=B2*B3*B4"
    variables:
      - {symbol: "layers", meaning: "Số cấp duyệt mỗi quyết định", unit: "cấp"}
      - {symbol: "days_per_layer", meaning: "Số ngày mỗi cấp xử lý", unit: "ngày"}
      - {symbol: "decisions_per_month", meaning: "Số quyết định mỗi tháng", unit: "quyết định"}
    when_to_use: "Lượng hóa chi phí 'chờ sếp quyết' để biện luận cho ủy quyền (context not control); ở SME PDI cao thường là nút cổ chai."
    why_it_works: "Mỗi cấp duyệt cộng thêm độ trễ; nhân với số quyết định cho tổng 'ngày công chờ đợi'. Bỏ lớp duyệt thì chi phí chuyển từ thời gian chờ sang thời gian giải thích bối cảnh ở đầu quy trình."
    assumptions:
      - "Các cấp duyệt tuần tự, không song song; độ trễ độc lập."
    pitfalls:
      - "Là ngày chờ đợi cộng dồn, không phải ngày công lao động bị chiếm; ước lượng thô, số Netflix là giả định."
    interpretation: "240 ngày chờ mỗi tháng là mức lớn; ủy quyền có điều kiện (ví dụ quyết định dưới X đồng không cần hỏi) giảm trực tiếp."
    example:
      inputs:
        layers: 3
        days_per_layer: 2
        decisions_per_month: 40
      steps:
        - "Mỗi quyết định trễ 3 x 2 = 6 ngày."
        - "40 quyết định: 6 x 40 = 240 ngày chờ/tháng."
      result: "240 ngày chờ mỗi tháng (giả định minh họa)."

  - id: "m04_offer_program"
    name_vi: "Kinh tế của chương trình 'The Offer' (trả để người không hợp rời đi sớm)"
    name_en: "Cost-benefit of paying poor-fit hires to leave early"
    expression_latex: 'C = H \cdot p \cdot O,\quad B = H \cdot p \cdot \ell,\quad B/C = \ell / O'
    expression_python: "(hires * take_rate * offer, hires * take_rate * loss_each, hires * take_rate * (loss_each - offer), loss_each / offer)"
    excel: "=B2*B3*B4 (chi phí); =B2*B3*B5 (lợi ích)"
    variables:
      - {symbol: "hires", meaning: "Số người tuyển mỗi năm", unit: "người"}
      - {symbol: "take_rate", meaning: "Tỷ lệ nhận khoản tiền để nghỉ", unit: "tỷ lệ"}
      - {symbol: "offer", meaning: "Khoản tiền trả mỗi người (Zappos công khai ~2.000 USD theo nguồn)", unit: "USD"}
      - {symbol: "loss_each", meaning: "Thiệt hại ước tính nếu người không hợp ở lại (nguồn: 6 tháng lương, lương năm giả định 35.000 USD = 17.500)", unit: "USD"}
    when_to_use: "Cân nhắc chương trình lọc người không hợp văn hóa SỚM, trước khi gây thiệt hại; tương tự thử việc có tiêu chí hành vi rõ."
    why_it_works: "Trả một khoản nhỏ trước thay cho khoản lớn trả sau. Tỷ số lợi ích/chi phí chỉ phụ thuộc loss_each/offer vì số người nhận nằm ở cả hai vế."
    assumptions:
      - "Giả định 'nếu ở lại thì sẽ nghỉ hoặc làm kém, tốn 6 tháng lương'; 3% nhận tiền là giả định."
    pitfalls:
      - "Nguồn nói rõ: phép tính chỉ đúng khi giả định gây thiệt hại thành lập; chỉ minh họa logic."
      - "Số 2.000 USD của Zappos là công khai trong nhiều năm (theo nguồn), chương trình thay đổi theo thời gian; cần kiểm tra."
    interpretation: "Tỷ số 8.75 nghĩa là mỗi 1 đồng trả trước tránh khoảng 8.75 đồng thiệt hại (giả định)."
    example:
      inputs:
        hires: 100
        take_rate: 0.03
        offer: 2000
        loss_each: 17500
      steps:
        - "Số người nhận = 100 x 3% = 3."
        - "Chi phí = 3 x 2000 = 6000 USD."
        - "Thiệt hại tránh được = 3 x 17500 = 52500 USD."
        - "Lợi ích ròng = 52500 - 6000 = 46500 USD; B/C = 52500 / 6000 = 8.75."
      result: "Chi phí 6000; lợi ích 52500; ròng 46500 USD; tỷ lệ 8.75 lần (giả định minh họa)."

  - id: "m04_kaizen_roi"
    name_vi: "ROI hệ thống đề xuất cải tiến (Kaizen) cho xưởng SME"
    name_en: "Suggestion-system (Kaizen) ROI"
    expression_latex: 'ROI = \frac{A \cdot s - I \cdot r}{I \cdot r}, \; I = W \cdot m \cdot 12, \; A = I \cdot a'
    expression_python: "(workers * ideas_per_month * 12 * adopt_rate * saving_each - workers * ideas_per_month * 12 * reward_each) / (workers * ideas_per_month * 12 * reward_each) * 100"
    excel: "=(B5*B6-B4*B7)/(B4*B7)"
    variables:
      - {symbol: "workers", meaning: "Số công nhân", unit: "người"}
      - {symbol: "ideas_per_month", meaning: "Số ý tưởng nộp mỗi người mỗi tháng", unit: "ý tưởng"}
      - {symbol: "adopt_rate", meaning: "Tỷ lệ ý tưởng được áp dụng", unit: "tỷ lệ"}
      - {symbol: "saving_each", meaning: "Tiết kiệm trung bình mỗi ý tưởng được áp dụng mỗi năm", unit: "triệu VNĐ"}
      - {symbol: "reward_each", meaning: "Thưởng cho MỖI ý tưởng được nộp (không chỉ ý tưởng áp dụng)", unit: "triệu VNĐ"}
    when_to_use: "Đề xuất triển khai hộp đề xuất/thưởng cải tiến ở xưởng SME; bắt đầu bằng làm vấn đề nhìn thấy được."
    why_it_works: "Thưởng cả ý tưởng không được dùng để mọi người tiếp tục nộp (nếu chỉ thưởng ý tưởng thành công, người sợ bị từ chối sẽ ngừng nộp); lợi ích đến từ phần nhỏ ý tưởng được áp dụng nhưng cộng dồn."
    assumptions:
      - "Toàn bộ số liệu (100 công nhân, 1 ý tưởng/tháng, 40% áp dụng, 0.5 triệu/ý tưởng, thưởng 0.05 triệu) là giả định minh họa."
    pitfalls:
      - "Chưa tính chi phí quản lý hệ thống và chi phí triển khai từng ý tưởng; chưa tính lợi ích giảm lỗi, giảm tai nạn."
      - "Văn hóa không đổ lỗi là điều kiện: nếu báo lỗi bị phạt thì không ai đề xuất."
    interpretation: "Kết quả 300% (giả định) cho thấy chi phí thưởng nhỏ so với lợi ích; quản lý phải xuống xưởng làm mẫu (gemba) ở PDI cao."
    example:
      inputs:
        workers: 100
        ideas_per_month: 1
        adopt_rate: 0.4
        saving_each: 0.5
        reward_each: 0.05
      steps:
        - "Ý tưởng/năm = 100 x 1 x 12 = 1200; áp dụng = 40% x 1200 = 480."
        - "Tiết kiệm = 480 x 0.5 = 240 triệu/năm; thưởng = 1200 x 0.05 = 60 triệu."
        - "Lợi ích ròng = 240 - 60 = 180; ROI = 180/60 = 300%."
      result: "Tiết kiệm 240 triệu, thưởng 60 triệu, ròng 180 triệu, ROI 300% (giả định, chưa tính giảm lỗi/tai nạn)."

  - id: "m04_defect_cost_escalation"
    name_vi: "Chênh lệch chi phí lỗi theo giai đoạn phát hiện"
    name_en: "Defect cost escalation by detection stage"
    expression_latex: 'D = U \cdot r \cdot (c_{muon} - c_{som})'
    expression_python: "units * defect_rate * (cost_late - cost_early)"
    excel: "=B2*B3*(B5-B4)"
    variables:
      - {symbol: "units", meaning: "Số sản phẩm mỗi tháng", unit: "sản phẩm"}
      - {symbol: "defect_rate", meaning: "Tỷ lệ lỗi", unit: "tỷ lệ"}
      - {symbol: "cost_early", meaning: "Chi phí sửa mỗi lỗi nếu phát hiện ngay tại công đoạn", unit: "USD"}
      - {symbol: "cost_late", meaning: "Chi phí mỗi lỗi nếu để khách hàng phát hiện (bảo hành, uy tín)", unit: "USD"}
    when_to_use: "Biện luận cho quyền dừng chuyền (Andon), văn hóa báo lỗi sớm, không đổ lỗi."
    why_it_works: "Chi phí sửa lỗi tăng khoảng 10 lần mỗi giai đoạn đi xa hơn (quy tắc 1-10-100 chỉ mang tính minh họa). Dừng chuyền một lúc rẻ hơn nhiều so với để lỗi trôi đi; nhưng chỉ hiệu quả khi người báo lỗi không bị phạt."
    assumptions:
      - "Quy tắc 1-10-100 chỉ là minh họa trong nguồn; chi phí 5/50/500 USD là giả định."
    pitfalls:
      - "Không có Andon + an toàn tâm lý thì phép tính vô nghĩa vì lỗi bị giấu."
    interpretation: "Ở ví dụ chênh lệch 99.000 USD/tháng giữa phát hiện sớm nhất và muộn nhất."
    example:
      inputs:
        units: 10000
        defect_rate: 0.02
        cost_early: 5
        cost_late: 500
      steps:
        - "Số lỗi = 10000 x 2% = 200."
        - "Phát hiện tại công đoạn: 200 x 5 = 1000 USD; ở kiểm tra cuối (50 USD): 10000 USD; khi khách nhận (500 USD): 100000 USD."
        - "Chênh lệch = 200 x (500 - 5) = 99000 USD/tháng."
      result: "Chênh lệch 99000 USD mỗi tháng (giả định minh họa)."

  - id: "m04_fast_vs_slow_ev"
    name_vi: "Kỳ vọng giá trị: quyết định nhanh vs chậm, và xác suất hòa vốn"
    name_en: "Expected value of fast vs slow decisions and break-even accuracy"
    expression_latex: 'EV_{nhanh}=p_f V + (1-p_f)L;\; EV_{cham}=p_s V(1-d)+(1-p_s)L;\; p^* = \frac{EV_{nhanh}-L}{V(1-d)-L}'
    expression_python: "(p_fast * value + (1 - p_fast) * loss, p_slow * value * (1 - delay_loss) + (1 - p_slow) * loss, ((p_fast * value + (1 - p_fast) * loss) - loss) / (value * (1 - delay_loss) - loss))"
    excel: "=B2*B3+(1-B2)*B4"
    variables:
      - {symbol: "value", meaning: "Giá trị nếu quyết định đúng", unit: "đơn vị giá trị"}
      - {symbol: "loss", meaning: "Giá trị khi sai (số ÂM)", unit: "đơn vị giá trị"}
      - {symbol: "p_fast", meaning: "Xác suất đúng của phương án nhanh", unit: "tỷ lệ"}
      - {symbol: "p_slow", meaning: "Xác suất đúng của phương án chậm (phân tích kỹ)", unit: "tỷ lệ"}
      - {symbol: "delay_loss", meaning: "Tỷ lệ giá trị mất do đến muộn", unit: "tỷ lệ"}
    when_to_use: "Cân nhắc 'văn hóa tốc độ' (Vingroup minh họa): khi nào nhanh 70% thắng chậm 85%; phân loại quyết định đảo ngược được vs không đảo ngược được."
    why_it_works: "So hai kỳ vọng; giải p* cho biết phân tích kỹ phải nâng xác suất đúng lên bao nhiêu thì mới đáng chậm lại. Nếu sai không sửa được thì |loss| lớn hơn nhiều và kết luận đổi hướng."
    assumptions:
      - "Một kết quả duy nhất, xác suất cho trước; mọi số là giả định của tác giả tài liệu, không phải số liệu Vingroup."
    pitfalls:
      - "Quyết định không đảo ngược được (an toàn, pháp lý, chất lượng xe): phải tăng mạnh |loss| trước khi kết luận 'nhanh'."
    interpretation: "Ví dụ: EV nhanh 58, EV chậm 57.75, p* = 85.2%: chậm chỉ đáng khi xác suất đúng vượt 85.2% (tăng hơn 15 điểm so với 70%)."
    example:
      inputs:
        value: 100
        loss: -40
        p_fast: 0.70
        p_slow: 0.85
        delay_loss: 0.25
      steps:
        - "EV nhanh = 0.70 x 100 + 0.30 x (-40) = 70 - 12 = 58."
        - "EV chậm = 0.85 x (100 x 0.75) + 0.15 x (-40) = 63.75 - 6 = 57.75."
        - "p* thỏa p x 75 + (1-p) x (-40) = 58, nên 115p = 98, p* = 98/115 = 0.8522."
      result: "EV nhanh 58 vs chậm 57.75; xác suất hòa vốn 85.2%. Giả định minh họa."

  - id: "m04_cross_sell_gap"
    name_vi: "Khoảng cách chỉ tiêu bán chéo so với nhu cầu thực"
    name_en: "Cross-sell target gap"
    expression_latex: 'G = H \times (T - P), \qquad g_{ng} = G / N'
    expression_python: "(households * (target_per_household - current_per_household), households * (target_per_household - current_per_household) / sellers)"
    excel: "=B2*(B3-B4)"
    variables:
      - {symbol: "households", meaning: "Số hộ khách hàng", unit: "hộ"}
      - {symbol: "current_per_household", meaning: "Số sản phẩm thực tế trung bình mỗi hộ", unit: "sản phẩm"}
      - {symbol: "target_per_household", meaning: "Chỉ tiêu sản phẩm mỗi hộ do lãnh đạo giao", unit: "sản phẩm"}
      - {symbol: "sellers", meaning: "Số nhân viên bán hàng", unit: "người"}
    when_to_use: "Kiểm tra tính khả thi của chỉ tiêu theo nhu cầu thật TRƯỚC khi giao; phát hiện chỉ tiêu buộc người ta gian lận."
    why_it_works: "Nếu nhu cầu thực đã bão hòa quanh mức hiện tại thì khoảng cách chỉ đạt được bằng cách ép khách mua hay mở tài khoản không có sự đồng ý; liên hệ Kerr (1975) thưởng A hy vọng B."
    assumptions:
      - "Ví dụ 1.000 hộ, 6 -> 8 sản phẩm, 10 nhân viên là GIẢ ĐỊNH minh họa, không phải số liệu Wells Fargo."
    pitfalls:
      - "Chỉ tiêu thật có thể hợp lý nếu còn dư địa nhu cầu; phải đối chiếu khảo sát nhu cầu."
    interpretation: "Càng nhiều sản phẩm mỗi người phải bán thêm trong chu kỳ so với nhu cầu thực, rủi ro hành vi sai càng cao."
    example:
      inputs:
        households: 1000
        current_per_household: 6
        target_per_household: 8
        sellers: 10
      steps:
        - "Hiện có = 1000 x 6 = 6000; mục tiêu = 8000."
        - "Khoảng cách = 2000 sản phẩm."
        - "Mỗi người = 2000 / 10 = 200 sản phẩm trong chu kỳ."
      result: "Khoảng cách 2000 sản phẩm (200/người): không đạt được bằng bán thật nếu nhu cầu đã bão hòa quanh 6."

  - id: "m04_cagr"
    name_vi: "Tốc độ tăng trưởng kép (CAGR)"
    name_en: "Compound annual growth rate"
    expression_latex: 'CAGR = \left(\frac{V_{cuoi}}{V_{dau}}\right)^{1/n} - 1'
    expression_python: "(end_value / start_value) ** (1 / years) - 1"
    excel: "=(B2/B1)^(1/B3)-1"
    variables:
      - {symbol: "start_value", meaning: "Giá trị đầu kỳ", unit: "tiền"}
      - {symbol: "end_value", meaning: "Giá trị cuối kỳ", unit: "tiền"}
      - {symbol: "years", meaning: "Số năm", unit: "năm"}
    when_to_use: "Mô tả tăng trưởng dài hạn khi phân tích case (Netflix 2003-2023). Luôn kèm cảnh báo: văn hóa là một yếu tố góp phần, không phải nguyên nhân duy nhất."
    why_it_works: "Quy tăng trưởng nhiều năm về tốc độ đều mỗi năm để so sánh."
    assumptions:
      - "Doanh thu Netflix 272 triệu USD (2003) và 33,7 tỷ USD (2023) là làm tròn từ báo cáo công khai theo nguồn, cần đối chiếu lại."
    pitfalls:
      - "Không quy toàn bộ tăng trưởng cho văn hóa (còn thời điểm thị trường, vốn, nội dung, công nghệ)."
    interpretation: "Bội số ~124 lần, CAGR ~27.3%/năm trong 20 năm."
    example:
      inputs:
        start_value: 272
        end_value: 33723
        years: 20
      steps:
        - "Bội số = 33723/272 = 123.98."
        - "CAGR = 123.98^(1/20) - 1 = 0.2727, tức ~27.3%/năm."
      result: "Doanh thu tăng ~124 lần, CAGR ~27.3%/năm (số công khai làm tròn, cần đối chiếu)."

  - id: "m04_overtime_excess"
    name_vi: "Giờ làm thêm vượt chuẩn mỗi tháng"
    name_en: "Excess overtime per month"
    expression_latex: 'OT_{thang} = (h_{tuan} - h_{chuan}) \times 52 / 12'
    expression_python: "(hours_week - normal_hours) * 52 / 12"
    excel: "=(B2-B3)*52/12"
    variables:
      - {symbol: "hours_week", meaning: "Số giờ làm thực tế mỗi tuần", unit: "giờ"}
      - {symbol: "normal_hours", meaning: "Giờ làm chuẩn mỗi tuần (nguồn dùng 48 giờ theo Bộ luật Lao động 2019)", unit: "giờ"}
    when_to_use: "Kiểm tra rủi ro tuân thủ và kiệt sức khi áp dụng 'văn hóa tốc độ' (Vingroup minh họa)."
    why_it_works: "Quy giờ vượt chuẩn theo tuần về tháng để so với giới hạn làm thêm theo tháng của luật (nguồn nêu 40 giờ/tháng)."
    assumptions:
      - "60 giờ/tuần là GIẢ ĐỊNH của nguồn, không phải số liệu Vingroup. Cần xác nhận quy định hiện hành (Bộ luật Lao động 2019) về giờ làm việc, làm thêm giờ."
    pitfalls:
      - "Quy định pháp lý cần xác nhận lại với văn bản mới nhất và hợp đồng thực tế."
    interpretation: "Kết quả 52 giờ/tháng vượt 40 giờ/tháng: rủi ro tuân thủ và kiệt sức nếu đúng như giả định."
    example:
      inputs:
        hours_week: 60
        normal_hours: 48
      steps:
        - "Vượt chuẩn = 60 - 48 = 12 giờ/tuần."
        - "Mỗi tháng = 12 x 52 / 12 = 52 giờ."
        - "So giới hạn 40 giờ/tháng: vượt 12 giờ."
      result: "52 giờ làm thêm mỗi tháng, vượt giới hạn 40 giờ nguồn nêu (giả định minh họa, cần xác nhận pháp lý)."

frameworks:
  - id: "m04_schein_three_levels"
    name_vi: "Mô hình ba tầng Schein"
    name_en: "Schein's Three Levels of Culture"
    origin: "Edgar H. Schein (nguồn ghi 1985; định nghĩa trích 2016; Organizational Culture and Leadership). Ví như tảng băng: chỉ thấy phần nhỏ trên mặt nước."
    components:
      - "Tầng 1 Artifacts: kích thước/bố cục văn phòng, trang phục, ngôn ngữ/biệt ngữ, nghi lễ, logo, công nghệ, quy trình, cách xử lý khách, chính sách trên giấy, câu chuyện/huyền thoại. Dễ quan sát, khó giải thích."
      - "Tầng 2 Espoused Values: mission, vision, core values, nguyên tắc đạo đức, chính sách nhân sự, CSR. Công khai nhưng có thể không phản ánh thực tế."
      - "Tầng 3 Basic Underlying Assumptions: quan điểm về bản chất con người, thời gian, không gian, quan hệ tổ chức-môi trường, hoạt động nào quan trọng, mục tiêu tổ chức, cách người khác phản ứng. Ngầm, thành 'trực giác', thực sự điều khiển hành vi."
    when_to_use: "Khi cần hiểu SÂU lý do của hành vi, tìm khoảng cách tuyên bố-thực tế, phân tích hậu quả scandal, chuẩn bị M&A, hiểu giả định cũ cần bỏ trong khủng hoảng."
    how_to_apply:
      - "Tầng 1: quan sát trực tiếp, phỏng vấn hành vi ('lần đầu đến đây bạn thấy gì?'), phân tích tài liệu/website, quan sát tương tác (họp, quyết định), thu thập câu chuyện."
      - "Tầng 2: phỏng vấn lãnh đạo ('tổ chức đại diện cho điều gì?'), đọc mission/vision/core values, khảo sát nhân viên, phân tích tiêu chí quyết định công khai, nghe từ khóa lãnh đạo dùng."
      - "Tầng 3: phỏng vấn sâu hỏi 'Tại sao?' 5 lần, quan sát xung đột giữa các giá trị, phỏng vấn người ở lâu năm nhất, tìm khoảng cách nói-làm, thử đề xuất một thay đổi và quan sát phản ứng."
      - "Ghi bảng 3 cột Artifacts/Espoused/Assumptions rồi đánh dấu mâu thuẫn giữa Tầng 2 và Tầng 3."
    how_to_read_results: "Mâu thuẫn Tầng 2 vs Tầng 3 càng lớn thì rủi ro văn hóa độc hại càng cao. Lãnh đạo nhúng văn hóa qua điều họ chú ý, thưởng và phạt."
    pitfalls:
      - "Chỉ nhìn Artifacts rồi bắt chước (bỏ chấm công, bỏ phê duyệt) mà không hiểu Assumption phía sau."
      - "Chỉ tin Tầng 2 (poster giá trị) mà không kiểm tra hệ thống thưởng-phạt."
    example: "Startup công nghệ: Artifacts là văn phòng mở, họp brainstorm tự phát; Espoused là 'work-life balance'; Assumption thực là 'đặt công việc trên hết' - thấy rõ qua việc làm cuối tuần."

  - id: "m04_hofstede_dimensions"
    name_vi: "Sáu chiều văn hóa Hofstede"
    name_en: "Hofstede's 6 Dimensions"
    origin: "Geert Hofstede (Hà Lan), dữ liệu IBM 40+ quốc gia, Culture's Consequences 1980; 5 chiều ban đầu, thêm chiều thứ 6 (IVR) năm 2010 do Minkov."
    components:
      - "PDI (khoảng cách quyền lực): >60 cấp bậc rõ, quyết định tập trung, ngại chất vấn sếp (Mexico 81, India 77, Philippines 94); <40 bình đẳng, phân quyền (Denmark 18, Austria 11, Israel 13). Cao hay gặp: quân đội, ngân hàng truyền thống; thấp: startup, dự án."
      - "UAI (tránh bất định): >70 cần nhiều quy tắc, ổn định (Greece 100, Belgium 94, Japan 92); <40 thoải mái bất định (Singapore 8, Jamaica 13, Hong Kong 29). Cao: tài chính, dược, kiến trúc; thấp: startup, marketing."
      - "IDV: >60 cá nhân (USA 91, Australia 90, UK 89); <40 tập thể, trung thành nhóm (Guatemala 6, Ecuador 8, Indonesia 14)."
      - "MAS: >60 cạnh tranh, thành công, tiền (Slovakia 100, Japan 95, Hungary 88); <40 quan tâm con người, cân bằng (Denmark 16, Norway 8, Sweden 5)."
      - "LTO: >60 dài hạn, bền vững (South Korea 100, Taiwan 93, Japan 88); <40 kết quả nhanh (Nigeria 13, Philippines 27, USA 26)."
      - "IVR (thêm 2010): >60 cho phép thỏa mãn nhu cầu cá nhân (Venezuela 100, Mexico 97, Colombia 83); <40 kiềm chế, chuẩn mực chặt (Pakistan 0, Egypt 4, Lithuania 16)."
      - "Bảng so sánh PDI/UAI/IDV/MAS/LTO/IVR (làm tròn, cần đối chiếu Hofstede Insights): Vietnam 70/30/20/40/80/35; USA 40/46/91/62/26/68; Japan 54/92/46/95/88/42; Germany 35/65/67/66/83/40; South Korea 60/85/18/39/100/29; Thailand 64/64/20/34/32/45; Singapore 74/8/20/48/72/46; India 77/40/48/56/51/26; Denmark 18/23/74/16/35/70; China 80/30/20/66/87/24."
    when_to_use: "Mở rộng quốc tế, M&A xuyên biên giới, thuê quản lý nước ngoài, giải thích vì sao chính sách 'chuẩn' trụ sở thất bại ở địa phương."
    how_to_apply:
      - "Lấy chỉ số hai nước cho các chiều liên quan."
      - "Tính chênh lệch từng chiều và khoảng cách trung bình (m04_hofstede_cultural_distance)."
      - "Với chiều lệch lớn, dự đoán va chạm hành vi (PDI: nhân viên VN ngại thảo luận với quản lý Mỹ; UAI: VN thoải mái đổi nhưng Mỹ cần giải thích rõ; IDV: khác nhau về thưởng cá nhân/tập thể; LTO: kế hoạch dài hạn vs mục tiêu quý)."
      - "Thiết kế giải pháp: lãnh đạo chủ động nghe, tạo không gian an toàn, giải thích thay đổi rõ và cho thời gian thích ứng, kết hợp mục tiêu ngắn hạn và kế hoạch dài hạn."
    how_to_read_results: "Chỉ số quốc gia là xu hướng trung bình, không mô tả cá nhân/doanh nghiệp: dùng như giả thuyết chẩn đoán, rồi kiểm chứng bằng khảo sát nội bộ."
    pitfalls:
      - "Số liệu là làm tròn và LTO của VN khác nhau giữa nguồn (thường 57-80)."
      - "Đồng nhất văn hóa quốc gia với văn hóa tổ chức (Hofstede ban đầu là văn hóa quốc gia)."
    example: "Công ty Mỹ mở chi nhánh VN: nhân viên VN không thoải mái thảo luận với quản lý (PDI 70 vs 40) -> lãnh đạo chủ động nghe; không thích đổi quá nhanh -> giải thích rõ, cho thời gian."

  - id: "m04_cvf_ocai"
    name_vi: "Khung giá trị cạnh tranh Cameron-Quinn (CVF) và OCAI"
    name_en: "Competing Values Framework and OCAI"
    origin: "Kim Cameron và Robert Quinn (thập niên 1980) từ nghiên cứu Quinn-Rohrbaugh 1983; sách Diagnosing and Changing Organizational Culture (1999, 2011)."
    components:
      - "Clan (Linh hoạt, nội bộ): gia đình, lãnh đạo như cha mẹ/cố vấn, giá trị trung thành, kiểm soát bằng đồng thuận. Ưu: gắn kết, turnover thấp. Nhược: cảm tính, khó quyết định khó, thiếu tiêu chuẩn, chậm thích ứng. Ví dụ: Zappos giai đoạn đầu, doanh nghiệp gia đình, phi lợi nhuận nhỏ."
      - "Adhocracy (Linh hoạt, ngoài): startup, lãnh đạo nhà tiên phong chấp nhận mạo hiểm, giá trị sáng tạo. Ưu: đổi mới, thích ứng nhanh. Nhược: thiếu ổn định, lãng phí, khó chất lượng, kiệt sức. Ví dụ: Google, Apple, Netflix, R&D."
      - "Market (Ổn định, ngoài): cơ chế cạnh tranh, lãnh đạo chiến lược gia/hướng kết quả, giá trị thắng, thị phần, lợi nhuận. Ưu: hiệu suất cao, kết quả rõ. Nhược: khắc nghiệt, thiếu tình người, burn-out. Ví dụ: GE thời Jack Welch, tài chính, bán hàng, bất động sản."
      - "Hierarchy (Ổn định, nội bộ): máy, lãnh đạo quản lý/điều phối, giá trị tuân thủ, kiểm soát bằng chính sách. Ưu: ổn định, chất lượng, rủi ro thấp. Nhược: chậm, ít sáng tạo, cảm giác bị kiểm soát, cục bộ phòng ban. Ví dụ: bảo hiểm, ngân hàng truyền thống, chính phủ, quân đội."
      - "OCAI 6 khía cạnh: đặc điểm tổ chức chủ yếu; phong cách lãnh đạo; quan hệ nhân viên; chiến lược tổ chức; tiêu chuẩn thành công; phong cách kiểm soát (mỗi khía cạnh 4 lựa chọn, chia 100 điểm)."
      - "Gợi ý văn hóa theo tình huống: startup mới - Adhocracy; công ty tài chính - Hierarchy + Market; phi lợi nhuận - Clan; công ty phần mềm - Adhocracy + Market; ngân hàng truyền thống - Hierarchy; cơ sở chăm sóc sức khỏe - Clan + Hierarchy."
    when_to_use: "Chẩn đoán nội bộ nhanh, định hướng thay đổi, kiểm tra cân bằng sáng tạo-ổn định; không phải chọn 'văn hóa tốt nhất' mà cân bằng có chủ đích."
    how_to_apply:
      - "Cho mỗi người trả lời 6 câu OCAI hai lần: Now và Preferred, mỗi câu chia đúng 100 điểm cho 4 lựa chọn."
      - "Trung bình toàn mẫu thành hồ sơ 4 loại, kiểm tra tổng = 100."
      - "Tính chênh lệch Pref - Now từng loại và tổng độ lệch tuyệt đối (m04_ocai_gap)."
      - "Đọc: loại trội nhất Now; loại thấp nhất; hướng dịch chuyển nhân viên muốn."
      - "Chọn hướng can thiệp theo khoảng cách; đo lại định kỳ."
    how_to_read_results: "Ví dụ (giả định, 300 người): Now 15/35/32/18 vs Pref 22/32/26/20 (Clan/Adhocracy/Market/Hierarchy): trội Adhocracy-Market; nhân viên muốn thêm Clan (+7) và Hierarchy (+2), bớt Market (-6) và Adhocracy (-3): bổ sung cố vấn, phản hồi, phúc lợi và chuẩn hóa quy trình tối thiểu, không thay toàn bộ. Công ty A (500 người, giả định) 20/40/30/10 vs 25/35/20/20: Market -10, Hierarchy +10: đang THIẾU cấu trúc chứ không thiếu sáng tạo."
    pitfalls:
      - "OCAI đơn giản hóa quá mức và không bắt được giả định tiềm ẩn (kết hợp Schein)."
      - "Đọc Pref như mệnh lệnh: nhân viên Việt An muốn bớt Hierarchy nhưng thực ra đòi quyền chủ động, không đòi bỏ quy trình."
    example: "Việt An: Now 25/8/45/22 vs Pref 35/20/30/15; gap 44; quyết định: tăng Clan + Adhocracy vừa phải, không sang quy trình nặng."

  - id: "m04_denison_model"
    name_vi: "Mô hình văn hóa Denison"
    name_en: "Denison Organizational Culture Model"
    origin: "Daniel Denison, nghiên cứu từ 1990 (Corporate Culture and Organizational Effectiveness, 1990), nguồn nêu nền 1.400 công ty theo công bố của tác giả. Gắn văn hóa với hiệu suất."
    components:
      - "Mission (ngoài, ổn định): mục tiêu chiến lược rõ, tầm nhìn được hiểu rộng, mục tiêu dài hạn. Yếu: mục tiêu mờ, quyết định tùy tiện."
      - "Adaptability (ngoài, linh hoạt): lắng nghe khách hàng, cấu trúc linh hoạt, sáng tạo được khuyến khích, thất bại là cơ hội học. Yếu: bỏ lỡ tín hiệu thị trường, cứng nhắc."
      - "Involvement (trong, linh hoạt): phân quyền, trao quyền, làm việc nhóm, cảm giác sở hữu. Yếu: quyết định tập trung, thụ động."
      - "Consistency (trong, ổn định): giá trị cốt lõi chia sẻ, chuẩn mực nhất quán, thưởng theo giá trị, hiểu biết chung. Yếu: hành vi không nhất quán, thưởng vô hướng."
      - "12 yếu tố con: Mission (Strategic Direction & Intent, Goals & Objectives, Vision); Adaptability (Creating Change, Customer Focus, Organizational Learning); Involvement (Empowerment, Team Orientation, Capability Development); Consistency (Core Values, Agreement, Coordination & Integration). Tên theo Denison Consultants, dịch VN là của tài liệu nguồn."
      - "Xu hướng liên hệ hiệu suất (chỉ là xu hướng, không có số phần trăm): Mission - tăng trưởng doanh thu, lợi nhuận; Adaptability - doanh thu mới, thị phần, đổi mới; Involvement - chất lượng, gắn bó; Consistency - hiệu quả vận hành, ROA."
    when_to_use: "Liên kết văn hóa với KPI, tìm điểm yếu cụ thể, đo trước/sau; tổ chức công cần tăng Adaptability."
    how_to_apply:
      - "Khảo sát 60 câu (5 câu x 12 yếu tố), thang 5 điểm; thời gian 15-20 phút."
      - "Tính điểm 4 khía cạnh, trung bình và độ chênh (m04_denison_average_spread)."
      - "Xác định khía cạnh thấp nhất, đặt giả thuyết hiệu suất, đối chiếu KPI thực."
      - "Lập hành động theo khía cạnh yếu và đo lại."
    how_to_read_results: "Ví dụ công ty sản xuất (giả định): Mission 4.0, Adaptability 2.5, Involvement 4.2, Consistency 3.8: trung bình 3.625 trông ổn nhưng chênh 1.7; mẫu 'gắn kết nhưng đóng kín', rủi ro bị đối thủ vượt khi thị trường đổi; khuyến nghị tăng tiếp xúc khách hàng, dự án thử nghiệm nhỏ, KPI phản hồi khách hàng."
    pitfalls:
      - "Chi phí khoảng 20-50 USD/người là ước tính tham khảo, cần xác nhận với nhà cung cấp."
      - "Không nêu số phần trăm hiệu suất chính xác theo từng khía cạnh."
    example: "Uber (giả định): trung bình 3.23 che giấu Involvement 2.1 và Consistency 2.6; sau cải tổ 3.75 và độ chênh thu hẹp từ 2.1 xuống 0.7."

  - id: "m04_handy_four_cultures"
    name_vi: "Bốn văn hóa Handy"
    name_en: "Handy's Four Cultures (Gods of Management)"
    origin: "Charles Handy (Anh): Understanding Organizations 1976, Gods of Management 1978. Câu hỏi gốc: quyền lực được phân phối thế nào và giá trị chính là gì."
    components:
      - "Power (Zeus): quyền lực ở số ít người (thường người sáng lập), quyết định nhanh, chuyên quyền, dựa quan hệ cá nhân. Ưu: nhanh, sứ mệnh rõ. Nhược: phụ thuộc lãnh đạo, khó mở rộng. Hợp với khủng hoảng."
      - "Role (Apollo): cấu trúc phân cấp, vai trò xác định, quyết định theo quy trình. Ưu: ổn định, dễ mở rộng, ít sai. Nhược: chậm, thiếu sáng tạo. Ví dụ: ngân hàng, bảo hiểm, chính phủ, quân đội. Hợp với ổn định."
      - "Task (Athena): tổ chức quanh dự án, quyền lực theo chuyên môn, đội liên chức năng. Ưu: linh hoạt, sáng tạo. Nhược: thiếu ổn định dài hạn, chi phí chung cao, xung đột giữa dự án. Ví dụ: quảng cáo, tư vấn, R&D. Hợp với đổi mới."
      - "Person (Dionysus): tổ chức phục vụ cá nhân; mỗi người như một tổ chức nhỏ; quyết định theo thương lượng. Ưu: tự do, sáng tạo rất cao. Nhược: khó kiểm soát, khó mở rộng. Ví dụ: công ty luật, viện nghiên cứu. Hợp với chuyên môn."
      - "So sánh: sáng tạo Power trung bình/Role thấp/Task cao/Person rất cao; ổn định Power cao/Role rất cao/Task trung bình/Person thấp; quyết định Power nhanh/Role chậm/Task trung bình/Person thương lượng."
    when_to_use: "Chẩn đoán nhanh SME; hiểu xung đột do hai kiểu văn hóa va nhau; phát triển lãnh đạo."
    how_to_apply:
      - "Hỏi: quyết định đi qua ai? quy trình hay quan hệ? ai có quyền theo chuyên môn?"
      - "Gán nhãn chủ yếu cho từng bộ phận (có thể khác nhau)."
      - "Xác định cặp va chạm (chủ Zeus vs kế toán Apollo) và chọn cơ chế dung hòa (ủy quyền có hạn mức, quy trình tối thiểu)."
    how_to_read_results: "Việt An: mọi quyết định qua ông Hùng, quan hệ cá nhân quyết định trọng dụng, ít quy trình = Power Culture: nhanh khi nhỏ, thành nút cổ chai khi 60+ người."
    pitfalls:
      - "Chuyển cực đoan (Zappos Holacracy: từ Role/Power sang Task + Person) có chi phí chuyển đổi cao."
    example: "Vingroup (diễn giải của nguồn): gần Power Culture (Zeus) - nhanh, nhất quán một tầm nhìn nhưng phụ thuộc một người."

  - id: "m04_deal_kennedy"
    name_vi: "Bốn văn hóa Deal & Kennedy"
    name_en: "Deal & Kennedy's Four Cultures"
    origin: "Terrence Deal và Allan Kennedy, Corporate Cultures (1982). Văn hóa thích nghi với môi trường kinh doanh: rủi ro và tốc độ phản hồi."
    components:
      - "Tough Guy (rủi ro cao, phản hồi nhanh): kết quả ngắn hạn, cạnh tranh, thắng/thua. Ví dụ: cảnh sát, bác sĩ phẫu thuật, tư vấn quản lý, đầu tư mạo hiểm, xây dựng, truyền thông."
      - "Work Hard Play Hard (rủi ro thấp, phản hồi nhanh): khối lượng việc, số lượt tiếp xúc khách. Ví dụ: bán lẻ, bán hàng trực tiếp, bất động sản, phần mềm bán hàng."
      - "Bet Your Company (rủi ro cao, phản hồi chậm): dự án dài hạn, đầu tư lớn. Ví dụ: dầu khí, hàng không vũ trụ, R&D, ngân hàng đầu tư."
      - "Process / Work Soft (rủi ro thấp, phản hồi chậm): tập trung quy trình, dễ hình thức hóa/quan liêu. Ví dụ: ngân hàng, bảo hiểm, hành chính công."
      - "Tương ứng gần đúng do tác giả tài liệu suy luận (không phải bảng chính thức): Tough Guy - MAS cao, Market, Power; Work Hard Play Hard - MAS cao, Market, Task; Bet Your Company - MAS cao, Adhocracy, Task; Process - MAS thấp, Hierarchy, Role."
    when_to_use: "Giải thích vì sao ngành khác nhau có văn hóa khác nhau; tổ chức chính phủ; khủng hoảng (cần Tough Guy tạm thời)."
    how_to_apply:
      - "Đánh giá mức rủi ro của quyết định điển hình và độ trễ biết kết quả."
      - "Gán góc phần tư; kiểm tra văn hóa nội bộ có khớp bản chất công việc không."
      - "Điều chỉnh: loại phản hồi chậm cần thêm thử nghiệm và kỷ luật (Vingroup mảng ô tô)."
    how_to_read_results: "Lệch giữa văn hóa và bản chất công việc là rủi ro (ví dụ phản hồi chậm mà áp lực quý ngắn)."
    pitfalls:
      - "Bảng tương ứng với Hofstede/CVF/Handy là suy luận, không dùng như chuẩn."
    example: "Wells Fargo: Work Hard Play Hard (phản hồi nhanh bằng chỉ tiêu hằng ngày) chuyển dần thành Tough Guy (gian lận để sống sót) khi áp lực tăng."

  - id: "m04_trompenaars"
    name_vi: "Bảy chiều Trompenaars"
    name_en: "Trompenaars' 7 Dimensions"
    origin: "Fons Trompenaars (Hà Lan) và Hampden-Turner, Riding the Waves of Culture, 1993; nguồn nêu nghiên cứu 15.000 người, 50 quốc gia (chỉ tham khảo)."
    components:
      - "Universalism (quy tắc áp cho mọi người; Mỹ, Đức, Scandinavia) vs Particularism (quan hệ, bối cảnh; VN, TQ, Trung Đông, Nam Âu)."
      - "Individualism (quyền cá nhân; Mỹ, Úc) vs Communitarianism (lợi ích chung; VN, Indonesia)."
      - "Neutral (che giấu cảm xúc; Anh, Nhật, Hà Lan) vs Emotional (thể hiện; Ý, Tây Ban Nha, Mỹ Latin, Pháp)."
      - "Specific (tách việc-đời sống; Mỹ, Úc, Đức) vs Diffuse (liên kết; VN, TQ, Mỹ Latin)."
      - "Achievement (địa vị theo thành tích; Mỹ, Úc, Đan Mạch) vs Ascription (theo tuổi, học vấn, giới tính; VN, TQ, Trung Đông)."
      - "Sequential (thời gian tuyến tính; Mỹ, Đức, Anh) vs Synchronic (vòng tròn, nhiều việc cùng lúc; VN, TQ)."
      - "Inner-directed (kiểm soát môi trường; Mỹ, Úc, Đức) vs Outer-directed (thích ứng; VN, TQ, Nhật)."
      - "Ước lượng ĐỊNH TÍNH cho VN/USA/Japan (nguồn nhấn mạnh VN không có dữ liệu chính thức nổi bật trong khảo sát gốc; Neutral/Emotional của Mỹ có thể khác nguồn): VN - Particularism, Communitarianism, Neutral, Diffuse, Ascription, Synchronic, Outer-directed; USA - Universalism, Individualism, Emotional, Specific, Achievement, Sequential, Inner-directed; Japan giống VN ở cả 7 chiều theo bảng nguồn."
    when_to_use: "Đào tạo giao tiếp liên văn hóa, đàm phán quốc tế, thiết kế hợp đồng, xử lý tình huống đánh đổi (tuân hợp đồng vs giúp bạn)."
    how_to_apply:
      - "Dùng các chiều như câu hỏi tình huống (dilemma) trong workshop."
      - "Bổ sung Hofstede ở các chiều thời gian, cảm xúc, quan hệ với môi trường."
    how_to_read_results: "Dùng để gợi ý thảo luận, không dùng như kết luận."
    pitfalls:
      - "Bảng VN/USA/Japan chỉ ước lượng định tính."
    example: "Particularism ở VN: hợp đồng có thể linh hoạt theo quan hệ - quy tắc chống tham nhũng của công ty nước ngoài va chạm trực tiếp."

  - id: "m04_model_comparison"
    name_vi: "Chọn mô hình văn hóa theo tình huống"
    name_en: "Choosing among culture models"
    origin: "Bảng so sánh 7 mô hình của file nguồn (Schein 1985, Hofstede 1980/2010, Cameron-Quinn 1983, Denison 1990, Handy 1976, Deal-Kennedy 1982, Trompenaars 1993)."
    components:
      - "Phân tích sâu, phát hiện giả định tiềm ẩn: Schein."
      - "Tổ chức quốc tế, mở rộng nước mới: Hofstede + Trompenaars."
      - "Cân bằng sáng tạo-ổn định, chẩn đoán nội bộ: Cameron-Quinn (OCAI)."
      - "Liên kết văn hóa với hiệu suất: Denison."
      - "Phát triển lãnh đạo, hiểu quyền lực: Handy."
      - "Phân tích theo ngành, rủi ro kinh doanh: Deal-Kennedy."
      - "Giao tiếp liên văn hóa, đàm phán: Trompenaars."
      - "Chương trình thay đổi: Kotter; theo dõi định kỳ: eNPS, pulse survey."
    when_to_use: "Khi người dùng hỏi 'dùng mô hình nào?'; luôn kết hợp 2-3 mô hình thay vì một."
    how_to_apply:
      - "Xác định bài toán (chẩn đoán, quốc tế, M&A, hiệu suất, lãnh đạo)."
      - "Chọn mô hình chính + 1-2 mô hình bổ sung theo bảng trên."
      - "Kết hợp Schein (giả định) với một công cụ đo (OCAI/Denison) để cân bằng định tính và định lượng."
    how_to_read_results: "Mô hình bổ sung nhau: Schein cho độ sâu, CVF/Denison cho đo lường, Hofstede/Trompenaars cho khác biệt quốc gia, Handy/Deal-Kennedy cho chẩn đoán nhanh, Kotter cho hành động."
    pitfalls:
      - "Áp một mô hình duy nhất và coi đó là toàn bộ văn hóa."
    example: "M&A: Schein (giả định) + CVF (loại văn hóa) + Hofstede (nếu quốc tế)."

  - id: "m04_context_playbooks"
    name_vi: "Cẩm nang theo bối cảnh: M&A, startup, công vụ, đa quốc gia, khủng hoảng"
    name_en: "Context playbooks"
    origin: "Phần 13 của file nguồn."
    components:
      - "M&A: thách thức hai văn hóa, mất nhân tài, tích hợp 2-3 năm. Mô hình: Schein, CVF, Hofstede (nếu quốc tế). Quy trình: đánh giá văn hóa cả hai (3 mô hình); xác định giá trị cốt lõi chung; tạo văn hóa hybrid; giao tiếp rõ lấy gì từ A, gì từ B; chuẩn bị sốc văn hóa."
      - "Startup lớn nhanh (10-50 lên 100-500): Cameron-Quinn, Denison, Kotter. Quy trình: xác định Adhocracy core; thêm Clan khi lớn; thêm Hierarchy nhưng giữ Adhocracy; tạo integrator roles. Nguy hiểm: mất tài năng vì quá quy trình."
      - "Tổ chức công: Hierarchy + Role, chậm, khó sa thải. Mô hình: Denison (tăng Adaptability), Deal-Kennedy, Handy. Quy trình: tăng Adaptability (lắng nghe công dân); trao quyền cấp dưới; giảm Hierarchy mà không mất kiểm soát; pilot nhỏ."
      - "Đa quốc gia: Hofstede, Trompenaars, Schein. Quy trình: hiểu khác biệt; xác định core values không đổi; xác định flexible values; đào tạo lãnh đạo địa phương nhưng cho phép thích ứng. Ví dụ: core = trung thực, khách hàng trung tâm, đạo đức; flexible = phong cách lãnh đạo, giao tiếp, mức chính thức."
      - "Khủng hoảng: Deal-Kennedy (Tough Guy cần thiết), Kotter, Schein. Quy trình: cấp bách rõ; lãnh đạo mạnh; tinh thần Tough Guy (kết quả, nhanh); sau khủng hoảng mềm lại (Clan, thăm dò). Thách thức: nhân viên kiệt sức, sợ hãi."
    when_to_use: "Khi bối cảnh rơi vào 1 trong 5 loại trên."
    how_to_apply:
      - "Chọn đúng playbook theo bối cảnh rồi chạy các bước đã nêu."
    how_to_read_results: "Mỗi playbook có điểm nguy hiểm đi kèm; theo dõi bằng eNPS, turnover nhân sự then chốt."
    pitfalls:
      - "Ép văn hóa bằng mệnh lệnh; tuyên bố 'ngang hàng' nhưng hành xử kẻ mạnh (Daimler-Chrysler)."
    example: "Ngân hàng A mua 80% Ngân hàng B (giả lập): giữ tuyệt đối liêm chính, quản trị rủi ro; linh hoạt cách giao tiếp, quan hệ khách hàng; dùng lãnh đạo địa phương làm cultural broker."

  - id: "m04_kotter_8_steps"
    name_vi: "Mô hình 8 bước Kotter áp cho thay đổi văn hóa"
    name_en: "Kotter's 8-Step Change Model"
    origin: "John Kotter (HBS), Leading Change, 1996 (bản cập nhật 2012); nghiên cứu 100+ tổ chức: thất bại do bỏ sót bước."
    components:
      - "1 Tạo cấp bách: phân tích môi trường, chia sẻ dữ liệu rủi ro, thuyết phục 75%+ nhân viên. Ví dụ Netflix chuyển DVD sang streaming."
      - "2 Liên minh dẫn dắt: người có ảnh hưởng, nhiều cấp, 5-15 người."
      - "3 Tầm nhìn và chiến lược: giá trị cốt lõi mới, hình ảnh tương lai cụ thể (ví dụ Nadella 'Mobile-first, Cloud-first')."
      - "4 Giao tiếp tầm nhìn: nhiều kênh, lãnh đạo làm gương, lặp 7-10 lần."
      - "5 Trao quyền: gỡ rào cản cấu trúc, đào tạo, đổi hệ thống thưởng, loại người chặn đường."
      - "6 Chiến thắng nhanh: dự án nhỏ trong 6-12 tháng, khen công khai."
      - "7 Củng cố và tạo thêm thay đổi: dùng niềm tin từ thắng lợi; nguy hiểm tuyên bố thắng quá sớm."
      - "8 Neo vào văn hóa: tuyển dụng theo giá trị mới, onboarding, câu chuyện mới, lãnh đạo kế cận; 3-5 năm."
    when_to_use: "Khi đã chẩn đoán xong và cần chương trình thay đổi văn hóa có kỷ luật; kết hợp OCAI/eNPS để đo."
    how_to_apply:
      - "Dùng mẫu Culture Change Plan với mốc: B1 tháng 1-2; B2 tháng 2-3; B3 tháng 3-4; B4 tháng 4-6; B5 tháng 6-12; B6 tháng 9-18; B7 tháng 18-24; B8 tháng 24-36."
      - "Đo hàng quý: % hiểu tầm nhìn (mục tiêu 80%+), % hành động theo giá trị mới (60%+), eNPS (+5 điểm/quý), turnover (giảm 10%/năm), engagement (+10% tham gia cao)."
      - "Không đạt KPI thì điều chỉnh kế hoạch."
    how_to_read_results: "Thất bại thường ở bước 1 (thiếu cấp bách), 5 (không đổi hệ thống), 8 (không neo)."
    pitfalls:
      - "Lãnh đạo yếu, tầm nhìn không rõ, không trao quyền, chiến thắng nhanh không đủ, thay đổi quá nhanh (kiệt sức), tuyên bố thắng sớm."
      - "Mốc thời gian là khuyến nghị; thay đổi văn hóa 3-5 năm."
    example: "Việt An rút gọn 12 tháng: tháng 1-2 trình bày OCAI/eNPS, nhận phần lỗi của sếp; tháng 2-3 nhóm 6 người; tháng 3-4 ủy quyền 5 triệu/đơn và 6 quy trình; tháng 6-12 đổi KPI 30% thưởng theo chất lượng và giao đúng hạn."

  - id: "m04_startup_culture_stages"
    name_vi: "Xây văn hóa từ đầu theo giai đoạn startup"
    name_en: "Building culture by startup stage"
    origin: "Mục 11.3 của file nguồn."
    components:
      - "Năm 1: founder rõ giá trị, làm gương, ít quy tắc nhưng nhất quán, tuyển người chia sẻ giá trị, tạo câu chuyện sớm."
      - "Năm 2-5: xác định vai trò/trách nhiệm, quy trình không phụ thuộc cá nhân, kênh giao tiếp (all-hands, newsletter), đào tạo quản lý cấp giữa, bắt đầu đo văn hóa (engagement survey)."
      - "Năm 5+: chuẩn bị lãnh đạo kế cận, quản lý văn hóa phụ, truyền thông nội bộ theo bộ phận, thích ứng khi mở rộng địa lý, chuẩn bị M&A."
    when_to_use: "SME/startup đang lớn lên; cần biết khi nào đưa quy trình vào."
    how_to_apply:
      - "Ghi giá trị và hành vi cốt lõi trước khi tuyển đợt lớn."
      - "Giai đoạn 2-5: viết quy trình chính và vai trò; đo văn hóa lần đầu."
      - "Giai đoạn 5+: onboarding văn hóa, lãnh đạo thứ hai."
    how_to_read_results: "Dấu hiệu chuyển giai đoạn: founder không còn biết hết mọi người, quyết định dồn một người."
    pitfalls:
      - "Founder dependency, culture drift, quá quy trình mất sáng tạo."
    example: "Việt An (9 năm, 62 người) vẫn vận hành kiểu giai đoạn đầu dù đã ở quy mô giai đoạn 2-5."

  - id: "m04_culture_measurement_tools"
    name_vi: "Công cụ đo lường văn hóa và quy trình khảo sát 4 giai đoạn"
    name_en: "Culture measurement tools and survey process"
    origin: "Mục 12 của file nguồn. Số câu hỏi, thời gian và chi phí là ƯỚC TÍNH tham khảo, cần xác nhận với nhà cung cấp."
    components:
      - "OCAI: 6 câu x 4 lựa chọn, chia 100 điểm, Now và Preferred, 10-15 phút, miễn phí trực tuyến hoặc ~5-10 USD/người nếu chấm chuyên nghiệp. Ưu: nhanh, đơn giản. Nhược: đơn giản hóa, không bắt giả định ngầm."
      - "Denison Culture Survey: 60 câu thang 5, 12 yếu tố, 15-20 phút, ~20-50 USD/người. Ưu: liên kết hiệu suất, CSDL so sánh lớn. Nhược: dài, đắt hơn."
      - "Great Place to Work: 58 câu, đo Tin tưởng-Tự hào-Thân thiện, 15 phút, ~30 USD/người. Ưu: được công nhận; Nhược: tập trung hạnh phúc nhân viên, không phải văn hóa."
      - "eNPS: 1 câu 0-10; theo dõi hàng tháng/quý; liên kết turnover."
      - "Pulse survey: 5-10 câu, 2-3 phút, hàng tháng/quý, tập trung một khía cạnh (ví dụ thoải mái chia sẻ ý kiến khác sếp; hiểu mục tiêu bộ phận; nhận phản hồi thường xuyên)."
      - "Quy trình: GĐ1 chuẩn bị 1-2 tuần (chọn công cụ, mục tiêu, ai tham gia); GĐ2 thực hiện 2-4 tuần (giao tiếp bảo mật, nhắc, tỷ lệ phản hồi lý tưởng >70%); GĐ3 phân tích 1-2 tuần (so benchmark ngành/quốc gia/quá khứ); GĐ4 giao tiếp và hành động (chia sẻ kết quả, town hall, kế hoạch hành động bộ phận, theo dõi)."
    when_to_use: "Chọn công cụ đo theo mục tiêu và ngân sách; SME ưu tiên OCAI miễn phí + eNPS + pulse."
    how_to_apply:
      - "Mục tiêu 'hiểu hiện trạng' dùng OCAI/Denison; 'theo dõi thay đổi' dùng eNPS/pulse."
      - "Công bố cách bảo mật và cách dùng kết quả; chia sẻ lại kết quả."
    how_to_read_results: "So với benchmark ngành, quốc gia, quá khứ; xem bộ phận và nhóm thâm niên."
    pitfalls:
      - "Khảo sát mà không hành động sẽ làm giảm niềm tin lần sau."
    example: "SME 62 người: OCAI + eNPS toàn công ty, pulse 3 tháng/lần."

  - id: "m04_core_values_workshop"
    name_vi: "Workshop giá trị cốt lõi (4-6 giờ)"
    name_en: "Core Values Workshop"
    origin: "Mẫu 15.2 của file nguồn. Mục tiêu xác định 3-5 giá trị cốt lõi; 15-20 người nhiều cấp."
    components:
      - "P1 Nhìn lại lịch sử (30 phút): khi nào tự hào nhất; khác biệt với đối thủ; nếu công ty không tồn tại thế giới mất gì; ghi từ lặp lại."
      - "P2 Tham khảo giá trị phổ biến (30 phút): Integrity, Excellence, Innovation, Customer-Centric, Collaboration, Respect, Accountability, Growth; mỗi người chọn 3 giá trị 'là chúng ta'."
      - "P3 Thảo luận nhóm 3-4 nhóm trộn cấp (60 phút): 3-5 giá trị, định nghĩa, hành vi tích cực/tiêu cực, việc sẽ làm khác."
      - "P4 Tổng hợp và đồng thuận (90 phút): 'Đó có phải là chúng tôi không?', bỏ sót gì, giá trị nào xung đột."
      - "P5 Câu phát biểu giá trị (60 phút): tuyên bố, hành vi dự kiến, hành vi KHÔNG dự kiến."
      - "P6 Công bố và cam kết (30 phút): tuyển, thưởng, nhắc theo giá trị; làm Core Values Deck; dùng trong onboarding."
    when_to_use: "Bước 3 Kotter; khi giá trị mờ hoặc có khoảng cách tuyên bố-thực tế."
    how_to_apply:
      - "Chạy 6 phần theo thứ tự, chốt 3-6 giá trị có hành vi quan sát được."
      - "Gắn giá trị vào tuyển dụng, thưởng, đánh giá."
    how_to_read_results: "Giá trị tốt = có hành vi cụ thể và đã có ví dụ người được thưởng/bị xử lý vì giá trị."
    pitfalls:
      - "Chỉ lập danh sách khẩu hiệu rồi treo tường (poster vs reality)."
    example: "Integrity: tuyên bố 'nói sự thật, kể cả khi khó'; không dự kiến: nói dối để tránh trách nhiệm, đổ lỗi, giấu thông tin."

  - id: "m04_culture_survey_20q"
    name_vi: "Mẫu khảo sát văn hóa 20 câu và thang giải thích"
    name_en: "20-question culture survey template"
    origin: "Mẫu 15.4 của file nguồn; thang 1-5 (1 hoàn toàn không đồng ý, 5 hoàn toàn đồng ý)."
    components:
      - "A Giá trị và sứ mệnh (Q1-4): hiểu sứ mệnh; giá trị phản ánh cách được đối xử; tin công ty là nơi tốt; tự hào."
      - "B Lãnh đạo và quản lý (Q5-8): quản lý làm gương giá trị; hỏi ý kiến; hỗ trợ phát triển; phản hồi thường xuyên."
      - "C Trao quyền và tự chủ (Q9-12): được quyết trong vai trò; sai sót là cơ hội học; ý kiến được nghe; an toàn thách thức sự bình thường."
      - "D Hợp tác và quan hệ (Q13-16): bộ phận hợp tác; cộng đồng; đồng nghiệp hỗ trợ; quan hệ với lãnh đạo tích cực."
      - "E Phát triển và đào tạo (Q17-20): cơ hội kỹ năng; công ty đầu tư; thấy sự nghiệp; sẽ giới thiệu công ty."
      - "Tính điểm: mỗi nhóm = trung bình 4 câu; tổng thể = trung bình 20 câu. Thang: 4.5-5.0 cực tích cực; 3.5-4.4 tích cực; 2.5-3.4 trung bình; 1.5-2.4 tiêu cực; 1.0-1.4 cực tiêu cực."
    when_to_use: "SME không có ngân sách cho công cụ thương mại; đo nhanh toàn công ty."
    how_to_apply:
      - "Gửi ẩn danh, tính trung bình theo nhóm và theo bộ phận."
      - "Nhóm có điểm thấp nhất là ưu tiên can thiệp; đo lại sau 3-6 tháng."
    how_to_read_results: "Dùng thang giải thích; chú ý chênh giữa các bộ phận (văn hóa phụ)."
    pitfalls:
      - "Câu 20 thực chất là câu eNPS dạng thang 1-5, không đồng nhất với eNPS 0-10."
    example: "FPT 'STCo' minh họa: 3 câu dám phản biện, sai sót là cơ hội học, tự quyết - trung bình tăng từ 2.73 lên 3.70 (giả định)."

  - id: "m04_healthy_vs_toxic_diagnostic"
    name_vi: "Chẩn đoán văn hóa lành mạnh vs độc hại, mạnh vs yếu"
    name_en: "Healthy/Toxic and Strong/Weak culture diagnostic"
    origin: "Phần 10 của file nguồn."
    components:
      - "9 khía cạnh so sánh Lành mạnh vs Độc hại: giá trị; lãnh đạo; giao tiếp; hỗ trợ; đa dạng; sai sót; xung đột; thắc mắc; công bằng."
      - "Kết quả lành mạnh: tham gia cao, hiệu suất cao, turnover thấp, sáng tạo cao, đạo đức cao, khách hài lòng. Kết quả độc hại: sợ hãi, đối phó, sai sót cao, turnover cao, rủi ro đạo đức cao, có thể bê bối công khai."
      - "Mạnh vs yếu: giá trị hiểu >80%, hành vi nhất quán, đồng hóa nhanh, turnover thấp vs giá trị mờ, tư lợi, chọn lọc ngược."
      - "Ví dụ lành mạnh: Southwest Airlines (thành lập 1971; Warrior Spirit, Servant's Heart, Fun-LUVing Attitude; turnover thấp hơn ngành - ước tính cần kiểm chứng). Ví dụ độc hại: Enron (RICE tuyên bố vs lợi nhuận bằng mọi giá)."
    when_to_use: "Rà soát nhanh sức khỏe văn hóa, cảnh báo sớm."
    how_to_apply:
      - "Chấm 9 khía cạnh theo bằng chứng (hành vi, câu chuyện, quyết định xử lý sai sót), không theo tuyên bố."
      - "Kiểm tra: sai sót bị phạt hay học? người báo lỗi bị gì? ngôi sao có được ngoại lệ?"
    how_to_read_results: "Nhiều khía cạnh độc hại cùng lúc là cảnh báo đỏ."
    pitfalls:
      - "Văn hóa mạnh không đồng nghĩa lành mạnh."
    example: "Enron: nhân viên bị xếp hạng bắt buộc, người chỉ trích bị trả đũa, số liệu 'làm đẹp'."

procedures:
  - id: "m04_proc_diagnose_culture"
    name: "Chẩn đoán văn hóa tổ chức đầy đủ"
    steps:
      - "Tầng 1 Artifacts: quan sát không gian, ăn mặc, ngôn ngữ, nghi thức, quy trình, câu chuyện huyền thoại."
      - "Tầng 2 Espoused: đọc mission/vision/core values; phỏng vấn lãnh đạo; liệt kê từ khóa lãnh đạo hay dùng."
      - "Tầng 3 Assumptions: hỏi 'Tại sao?' 5 lần; phỏng vấn nhân viên lâu năm; xác định mâu thuẫn nói-làm; phân tích quyết định khó (trade-off)."
      - "Chạy OCAI (Now và Preferred) và eNPS; tính chi phí nghỉ việc."
      - "Chạy Handy (quyền lực phân phối thế nào) và, nếu cần, Denison để liên kết KPI."
      - "Với tổ chức đa quốc gia/M&A: thêm Hofstede/Trompenaars và khoảng cách văn hóa."
      - "Kiểm tra lãnh đạo, hệ thống thưởng-phạt, kênh báo cáo, văn hóa phụ."
      - "Tổng hợp thành bảng: hiện trạng, khoảng cách tuyên bố-thực tế, hướng can thiệp, KPI theo dõi."
    outputs: "Hồ sơ văn hóa 3 tầng, hồ sơ OCAI, eNPS/turnover/chi phí nghỉ việc, danh sách khoảng cách tuyên bố-thực tế, đề xuất hướng can thiệp."

  - id: "m04_proc_ocai_survey"
    name: "Chạy khảo sát văn hóa OCAI/eNPS (4 giai đoạn)"
    steps:
      - "Chuẩn bị (1-2 tuần): chọn công cụ, mục tiêu (hiểu hiện trạng vs theo dõi), ai tham gia (toàn bộ hay mẫu đại diện gồm nhân sự mới và lâu năm)."
      - "Thực hiện (2-4 tuần): giải thích tại sao khảo sát, bảo mật, cách dùng kết quả; công bố; nhắc để đạt >70% phản hồi."
      - "Phân tích (1-2 tuần): trung bình hồ sơ, kiểm tra tổng 100, tính gap, eNPS, so benchmark."
      - "Giao tiếp và hành động: chia sẻ kết quả với toàn bộ nhân viên, town hall, kế hoạch hành động bộ phận, theo dõi tiến độ, pulse 3 tháng/lần."
    outputs: "Hồ sơ OCAI Now/Preferred, gap, eNPS, kế hoạch hành động và lịch đo lại."

  - id: "m04_proc_change_culture"
    name: "Thay đổi văn hóa theo Kotter (kế hoạch 2-3 năm)"
    steps:
      - "Tháng 1-2: phân tích dữ liệu (turnover, hài lòng khách, hiệu suất); viết tuyên bố cấp bách '[Vấn đề] dẫn tới [hậu quả] trong [thời gian]'; chia sẻ dữ liệu rộng rãi (mục tiêu 75%+ chấp nhận)."
      - "Tháng 2-3: lập liên minh 5-15 người (1-2 từ ban giám đốc, 2-3 quản lý giữa, 2-3 nhân viên ngôi sao, 1-2 bộ phận khác); hội thảo 2 ngày; phân vai."
      - "Tháng 3-4: tầm nhìn 3-5 năm; core values workshop; 3-5 trụ cột; kế hoạch 30-60-90 ngày."
      - "Tháng 4-6: giao tiếp (town hall hàng tháng, họp nhóm, email, video); thông điệp 'Chúng ta thay đổi để [lý do]. Điều này nghĩa là [hành vi mới]. Tôi sẽ làm gương. Tôi cần bạn.'"
      - "Tháng 6-12: gỡ rào cản cấu trúc, đào tạo, đổi hệ thống thưởng, loại người chặn đường, tạo tình nguyện viên thay đổi."
      - "Tháng 9-18: tạo 2-3 chiến thắng nhỏ (ví dụ một bộ phận tự quyết ngân sách) và công bố."
      - "Tháng 18-24: củng cố, dự án lớn hơn, tuyển người hợp giá trị mới, tiếp tục giao tiếp (không tuyên bố thắng sớm)."
      - "Tháng 24-36: neo: onboarding mới, cập nhật điều khoản công việc, câu chuyện mới, giáo dục thế hệ lãnh đạo kế cận."
      - "Hàng quý đánh giá: % hiểu tầm nhìn, % hành động theo giá trị, eNPS, turnover, engagement."
    outputs: "Kế hoạch thay đổi có mốc, KPI hàng quý, liên minh dẫn dắt, danh sách chiến thắng nhanh."

  - id: "m04_proc_ma_due_diligence"
    name: "Cultural due diligence khi M&A"
    steps:
      - "Đo văn hóa hai bên (OCAI/Denison) và Schein 3 tầng; nếu quốc tế thêm Hofstede."
      - "Tính chênh lệch hồ sơ (m04_ocai_profile_difference) và khoảng cách quốc gia (m04_hofstede_cultural_distance); xác định chiều lệch lớn nhất."
      - "Xác định giá trị cốt lõi chung làm điểm tựa (ví dụ chất lượng, kỹ thuật)."
      - "Chọn mô hình tích hợp: hybrid; quyết định giữ gì từ A và B."
      - "Nói thẳng ai dẫn dắt; tránh khẩu hiệu 'ngang hàng' nếu thực tế không ngang hàng."
      - "Giữ nhân tài then chốt (kế hoạch giữ người) và chuẩn bị sốc văn hóa; dự trù tích hợp 2-3 năm (kịch bản giả lập: 3-5 năm)."
      - "Đưa chi phí văn hóa (mất người giỏi, giảm hiệu suất) vào mô hình định giá/synergy."
    outputs: "Báo cáo khoảng cách văn hóa, kế hoạch tích hợp, danh sách nhân sự then chốt, giả định chi phí văn hóa trong định giá."

  - id: "m04_proc_kpi_integrity_check"
    name: "Kiểm tra KPI/thưởng để không dạy hành vi sai"
    steps:
      - "Với mỗi KPI doanh số, hỏi: nhân viên có thể đạt KPI này bằng gian lận hoặc làm khách thiệt không?"
      - "Nếu có, thêm KPI cân bằng: hài lòng, tỷ lệ hủy, khiếu nại, giao đúng hạn."
      - "Kiểm tra tính khả thi theo nhu cầu thật (m04_cross_sell_gap) trước khi giao."
      - "Lập danh sách điều 'không bao giờ làm' dù doanh số cao; không ngoại lệ cho ngôi sao."
      - "Lập kênh phản ánh độc lập, cam kết không trả đũa (SME nhỏ: cố vấn bên ngoài hoặc cổ đông không điều hành)."
      - "Giao tiếp thẳng của chủ SME: 'đừng làm sai để đạt doanh số'."
    outputs: "Bộ KPI cân bằng, danh sách hành vi cấm, kênh khiếu nại độc lập."

  - id: "m04_proc_localize_for_vn"
    name: "Dịch một thực hành văn hóa phương Tây sang bối cảnh PDI cao (Việt Nam)"
    steps:
      - "Xác định thực hành (trao quyền, phản biện, open door, keeper test, không có sếp)."
      - "Đối chiếu chỉ số Hofstede VN (PDI 70, IDV 20, UAI 30) để dự đoán rào cản."
      - "Biến thành phiên bản mềm: cho phép tự quyết bằng quy tắc nhỏ ('dưới X đồng không cần hỏi'); sếp là người hỗ trợ; kênh phản biện ít rủi ro thể diện (hộp góp ý ẩn danh, họp nhóm nhỏ)."
      - "Pilot ở một bộ phận, đo trước/sau bằng khảo sát cùng câu hỏi."
      - "Gắn vào KPI của quản lý và tuyển dụng để không bị bỏ khi áp lực tăng."
    outputs: "Phiên bản thực hành đã địa phương hóa, kết quả pilot, KPI quản lý."

  - id: "m04_proc_subculture_management"
    name: "Quản lý văn hóa phụ"
    steps:
      - "Liệt kê văn hóa phụ (công nghệ vs bán hàng, trụ sở vs chi nhánh, bộ phận bị thôn tính)."
      - "Xác định giá trị cốt lõi chung bất biến."
      - "Chấp nhận khác biệt trong khuôn khổ; tạo vai trò cầu nối (integrator, cultural broker)."
      - "Học từ văn hóa phụ mạnh; đo pulse theo bộ phận."
    outputs: "Bản đồ văn hóa phụ và cơ chế cầu nối."

decision_rules:
  - "Nếu nhân viên tuyên bố giá trị đẹp nhưng hành vi và thưởng phạt dạy điều ngược lại thì ưu tiên sửa hệ thống thưởng/KPI/tuyển dụng trước khi viết thêm giá trị."
  - "Nếu OCAI cho thấy Preferred giảm Hierarchy và tăng Clan/Adhocracy thì đừng thêm quy trình cứng; trao thêm quyền chủ động (Việt An)."
  - "Nếu OCAI cho thấy Preferred tăng Hierarchy và giảm Market (Công ty A 500 người) thì doanh nghiệp đang thiếu cấu trúc: chuẩn hóa quy trình và vai trò cốt lõi, giảm thúc ép chỉ tiêu ngắn hạn."
  - "Nếu điểm trung bình Denison ổn nhưng một khía cạnh thấp (độ chênh từ khoảng 1.5 trở lên, ngưỡng gợi ý của module) thì can thiệp khía cạnh thấp nhất trước (ví dụ Adaptability 2.5: tăng tiếp xúc khách hàng)."
  - "Nếu eNPS < 10 (hoặc âm) và turnover cao thì xem là cảnh báo văn hóa: tính chi phí nghỉ việc ra tiền, rồi chạy OCAI/phỏng vấn nghỉ việc để tìm nguyên nhân."
  - "Nếu mở rộng sang nước khác thì tính khoảng cách Hofstede từng chiều; chiều lệch lớn (PDI, IDV, LTO) cần chính sách thích ứng riêng; giữ core values bất biến, cho phép flexible values."
  - "Nếu doanh nghiệp ở văn hóa PDI cao (như VN) thì cho phép 'tự quyết' bằng quy tắc rõ ràng (hạn mức) và dùng kênh phản biện ẩn danh trước khi kỳ vọng phản biện trực tiếp."
  - "Nếu chuẩn bị M&A thì làm cultural due diligence (đo văn hóa 2 bên, tính khoảng cách) TRƯỚC khi định giá và chọn mô hình tích hợp; không hứa 'ngang hàng' nếu không thật."
  - "Nếu đang khủng hoảng thì tạm dùng Tough Guy (nhanh, kết quả, lãnh đạo mạnh) rồi mềm lại (Clan) sau khi qua khủng hoảng."
  - "Nếu quyết định ĐẢO NGƯỢC ĐƯỢC thì ưu tiên làm nhanh, thử và sửa; nếu KHÔNG đảo ngược được (giá, hợp đồng lớn, an toàn thực phẩm, pháp lý) thì phân tích kỹ và có người có quyền dừng."
  - "Nếu một KPI đo số lượng thì thêm KPI chất lượng đối trọng; kiểm tra xem có thể đạt bằng gian lận không."
  - "Nếu có khiếu nại về một 'ngôi sao' thì áp dụng quy tắc không ngoại lệ và kênh điều tra độc lập."
  - "Nếu startup đang lên 100-500 người thì thêm quy trình tối thiểu và vai trò integrator nhưng giữ Adhocracy core; đo văn hóa từ năm 2-5."
  - "Nếu bắt đầu thay đổi văn hóa thì dự trù 3-5 năm, đặt chiến thắng nhanh 6-12 tháng và không tuyên bố thắng sớm."
  - "Nếu muốn bắt chước Netflix/Zappos thì đừng sao chép Artifacts (bỏ chấm công, bỏ phê duyệt) khi chưa có tuyển chọn kỹ, minh bạch số liệu và đánh giá rõ ràng."
  - "Nếu đo văn hóa xong mà không hành động thì đừng đo lại ngay: niềm tin vào khảo sát bị bào mòn; công bố kết quả và kế hoạch trước."

