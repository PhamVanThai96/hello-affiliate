    data_reliability: "unverified"

worked_examples:
  - name: "Khoảng cách văn hóa Anh - Việt Nam cho thương vụ M&A (4 chiều)"
    inputs:
      uk: [35, 89, 66, 35]
      vietnam: [70, 20, 40, 30]
      dims: ["PDI", "IDV", "MAS", "UAI"]
    steps:
      - "Chênh từng chiều: PDI 35, IDV 69, MAS 26, UAI 5."
      - "Trung bình = (35+69+26+5)/4 = 33.75."
      - "Hai chiều gây xung đột chính: IDV (69) và PDI (35)."
      - "Giải thích: PDI cao khiến nhân viên VN im lặng khi giám đốc nước ngoài hỏi ý kiến; IDV thấp khiến quan hệ tin cậy cá nhân đi trước hợp đồng."
      - "Hành động: tôn trọng văn hóa địa phương, đào tạo liên văn hóa, lãnh đạo địa phương làm cầu nối, giữ tuyệt đối quy tắc chống tham nhũng và thay bằng hoạt động quan hệ hợp pháp."
    result: "Khoảng cách trung bình 33.75 (4 chiều, không có LTO); không so trực tiếp với 21.8 của Đức-Mỹ (5 chiều) mà kết luận chắc chắn. Số liệu quốc gia làm tròn, kịch bản giả lập."
  - name: "Chẩn đoán và ROI văn hóa cho SME 62 người (Việt An)"
    inputs:
      headcount: 62
      leavers_before: 21
      leavers_after: 9
      monthly_salary_trieu: 9.5
      months_paid: 13
      replacement_pct: 0.4
      program_cost_trieu: 180
      ocai_now: [25, 8, 45, 22]
      ocai_pref: [35, 20, 30, 15]
    steps:
      - "Gap OCAI = 10+12+15+7 = 44 (kiểm tra tổng 100 cả hai hồ sơ)."
      - "Chi phí thay thế mỗi người = 0.4 x 9.5 x 13 = 49.4 triệu."
      - "Chi phí trước = 21 x 49.4 = 1037.4; sau = 9 x 49.4 = 444.6; tiết kiệm = 592.8."
      - "Lợi ích ròng = 592.8 - 180 = 412.8; ROI = 412.8/180 = 229%."
      - "Đọc: lợi ích chỉ tính chi phí nghỉ việc (chưa tính giảm trễ đơn, phế phẩm); số giả định minh họa."
    result: "Gap 44; tiết kiệm 592.8 triệu; ROI 229% (giả định minh họa)."
  - name: "So sánh hai hồ sơ OCAI để quyết định hướng can thiệp (Công ty A 500 người)"
    inputs:
      now: [20, 40, 30, 10]
      preferred: [25, 35, 20, 20]
    steps:
      - "Kiểm tra tổng: 20+40+30+10 = 100; 25+35+20+20 = 100."
      - "Chênh (Pref - Now): Clan +5, Adhocracy -5, Market -10, Hierarchy +10."
      - "Gap = 5+5+10+10 = 30."
      - "Đọc: nhân viên muốn giảm áp lực kết quả (Market -10) và thêm quy trình/vai trò rõ (Hierarchy +10): công ty đang thiếu cấu trúc chứ không thiếu sáng tạo."
      - "Hành động ưu tiên: chuẩn hóa quy trình cốt lõi và vai trò, giảm thúc ép chỉ tiêu ngắn hạn, bổ sung chăm sóc con người (Clan +5)."
    result: "Gap 30; ưu tiên Hierarchy (+10) và giảm Market (-10). Số giả định minh họa."
  - name: "Chọn nhanh hay chậm cho một quyết định (Vingroup minh họa)"
    inputs:
      value: 100
      loss: -40
      p_fast: 0.70
      p_slow: 0.85
      delay_loss: 0.25
    steps:
      - "EV nhanh = 0.7 x 100 + 0.3 x (-40) = 58."
      - "EV chậm = 0.85 x 75 + 0.15 x (-40) = 57.75."
      - "p* = 98/115 = 85.2%; phân tích kỹ phải nâng xác suất đúng lên trên 85.2% mới đáng chậm lại."
      - "Kết luận: nếu sửa sai rẻ và thị trường thưởng người đến trước thì làm nhanh; nếu sai không sửa được (an toàn, pháp lý) thì tăng |loss| rồi tính lại."
    result: "Hai phương án gần như hòa (58 vs 57.75); nhanh là hợp lý khi sai có thể sửa."
  - name: "Kiểm tra tính khả thi chỉ tiêu bán chéo trước khi giao"
    inputs:
      households: 1000
      current: 6
      target: 8
      sellers: 10
    steps:
      - "Hiện có 6000, mục tiêu 8000, khoảng cách 2000 sản phẩm."
      - "Mỗi người bán 200 sản phẩm thêm trong chu kỳ."
      - "Nếu nhu cầu bão hòa quanh 6 thì chỉ đạt bằng ép bán hoặc gian lận; cần chỉ tiêu theo nhu cầu thật và KPI cân bằng (hài lòng, hủy, khiếu nại)."
    result: "Khoảng cách 2000 sản phẩm (200/người) - cảnh báo chỉ tiêu không khả thi theo nhu cầu thực (giả định minh họa)."

practice_questions:
  - q: "Công ty có 62 người, 21 người nghỉ trong 12 tháng. Lương bình quân 9,5 triệu x 13 tháng; chi phí thay thế 40% lương năm. Tính tỷ lệ nghỉ việc và chi phí nghỉ việc."
    a: "Tỷ lệ = 21/62 = 33.9%. Chi phí = 21 x 0.4 x 123.5 = 1037.4 triệu VNĐ (~1.04 tỷ, ~2.2% doanh thu 48 tỷ). Chi phí thay thế 40% là giả định."
  - q: "Khảo sát 56 người: 14 chấm 9-10, 20 chấm 7-8, 22 chấm 0-6. eNPS bằng bao nhiêu và đọc thế nào?"
    a: "25.0% - 39.29% = -14.3. Âm: người không dám giới thiệu nhiều hơn người dám; dưới ngưỡng 10 của nguồn là 'xấu'; cần tìm nguyên nhân bằng OCAI/phỏng vấn."
  - q: "OCAI Now 15/35/32/18, Preferred 22/32/26/20 (Clan/Adhocracy/Market/Hierarchy). Tính gap và nêu hướng can thiệp."
    a: "Gap = 7+3+6+2 = 18. Thêm Clan (cố vấn, phản hồi, phúc lợi), chuẩn hóa quy trình tối thiểu, giảm áp lực kết quả; không thay toàn bộ văn hóa."
  - q: "Điểm Denison: Mission 4.0, Adaptability 2.5, Involvement 4.2, Consistency 3.8. Nhận xét?"
    a: "Trung bình 3.625 nhưng chênh 1.7; Adaptability thấp: 'gắn kết nhưng đóng kín'. Tăng tiếp xúc khách hàng, dự án thử nghiệm nhỏ, KPI phản hồi khách hàng."
  - q: "Tính khoảng cách Hofstede trung bình Đức-Mỹ (PDI, IDV, MAS, UAI, LTO) và nêu điểm nghẽn."
    a: "Đức 35/67/66/65/83, Mỹ 40/91/62/46/26: chênh 5/24/4/19/57, trung bình 21.8; điểm nghẽn LTO (57) và IDV (24). Chỉ là giả thuyết chẩn đoán."
  - q: "Vì sao eNPS dùng hiệu Promoters - Detractors mà không lấy điểm trung bình?"
    a: "Trung bình che giấu cực trị; chỉ 9-10 dám bảo chứng, 0-6 có nguy cơ rời đi; hiệu phản ánh uy tín nội bộ ròng; nhóm 7-8 thụ động bị loại. Mượn từ NPS của Reichheld (2003)."
  - q: "Doanh nghiệp tuyên bố 'khách hàng trên hết' nhưng thưởng theo doanh số ngắn hạn. Dùng Schein chỉ ra vấn đề và hướng xử lý."
    a: "Tầng 2 (tuyên bố) mâu thuẫn Tầng 3 (giả định lợi nhuận ngắn hạn quan trọng hơn). Sửa hệ thống thưởng: thêm KPI hài lòng/khiếu nại/hủy, lãnh đạo làm gương, nếu chưa sống được thì đừng tuyên bố."
  - q: "Một xưởng 100 công nhân triển khai thưởng 50.000 VNĐ cho mỗi ý tưởng nộp; 1 ý tưởng/người/tháng, 40% áp dụng, mỗi ý tưởng áp dụng tiết kiệm 500.000 VNĐ/năm. ROI?"
    a: "1200 ý tưởng, 480 áp dụng; tiết kiệm 240 triệu; thưởng 60 triệu; ròng 180; ROI 300% (giả định, chưa tính giảm lỗi/tai nạn). Thưởng cả ý tưởng không dùng để mọi người tiếp tục nộp."
  - q: "Tại sao ở Việt Nam (PDI 70) không nên bê nguyên mô hình 'không có sếp' hay 'cửa luôn mở'?"
    a: "PDI cao: nhân viên chờ sếp chỉ dẫn, ngại phản biện thể diện; cần cho phép rõ ràng bằng quy tắc (hạn mức), kênh ẩn danh, sếp là người hỗ trợ, pilot từng bộ phận."
  - q: "Chuẩn bị mua công ty nước ngoài. Các bước cultural due diligence là gì?"
    a: "Đo OCAI/Denison hai bên + Schein; tính chênh hồ sơ và khoảng cách Hofstede; tìm giá trị chung; chọn hybrid; nói rõ ai dẫn dắt; giữ nhân tài; dự trù 2-3 năm tích hợp; đưa chi phí văn hóa vào định giá. Daimler-Chrysler là bài học."
  - q: "Trong Kotter 8 bước, bước nào thường bị bỏ sót và hậu quả?"
    a: "Thường bước 1 (cấp bách) và bước 8 (neo vào văn hóa); thiếu 1 thì không ai tin cần đổi, thiếu 8 thì quay về hành vi cũ; thay đổi văn hóa cần 3-5 năm."
  - q: "Nhóm A 10 người chi phí 100/người, đầu ra 1; nhóm B 5 người chi phí 200/người, đầu ra 3. So hiệu quả và kênh giao tiếp."
    a: "Cùng chi phí 1000; đầu ra 10 vs 15 nên B hiệu quả 1.5 lần; kênh 45 vs 10. Giả định đầu ra 3 lần rất mạnh, cần kiểm chứng."

checklist:
  - "Đã phân biệt rõ 3 tầng Schein: Artifacts, Espoused Values, Basic Assumptions của tổ chức mình?"
  - "Đã đo OCAI (Now và Preferred) với mẫu đại diện (nhân sự mới và lâu năm), kiểm tra mỗi hồ sơ cộng 100?"
  - "Đã đo eNPS, tỷ lệ nghỉ việc và tính chi phí nghỉ việc?"
  - "Đã xác định văn hóa phụ giữa các phòng ban/chi nhánh?"
  - "Đã kiểm tra khoảng cách giá trị tuyên bố và hành vi thực (poster vs reality)?"
  - "Giá trị cốt lõi ít (3-6), mỗi giá trị có hành vi quan sát được?"
  - "Hệ thống thưởng/phạt, tuyển dụng, đánh giá, thăng tiến phù hợp với giá trị?"
  - "Có ví dụ người được thưởng/bị xử lý vì giá trị để chứng minh nghiêm túc?"
  - "Lãnh đạo đã đồng thuận và sẵn sàng thay đổi hành vi của chính mình?"
  - "Có liên minh dẫn dắt, không phụ thuộc một người?"
  - "Có chiến thắng nhanh (3-6 tháng, tối đa 6-12) và cách công bố?"
  - "Đã kiểm tra tốc độ thay đổi để tránh kiệt sức?"
  - "Có kế hoạch neo thay đổi vào tuyển dụng, đào tạo, KPI?"
  - "Nếu M&A: đã làm cultural due diligence trước khi định giá?"
  - "Nếu đa quốc gia/đa vùng: đã thích ứng chính sách theo văn hóa địa phương (core vs flexible values)?"
  - "Nếu startup: đã ghi lại giá trị và hành vi cốt lõi trước khi tuyển đợt lớn?"
  - "Có pulse survey định kỳ (hàng quý) và người chịu trách nhiệm?"
  - "Có kênh phản hồi ẩn danh, độc lập, an toàn tâm lý?"
  - "Mọi KPI doanh số đã được hỏi 'đạt bằng gian lận được không?' và có KPI cân bằng?"
  - "Số liệu/ví dụ trích dẫn đã ghi rõ 'ước tính/giả định minh họa' khi chưa kiểm chứng nguồn?"

excel_google_sheets_templates:
  - "Sheet OCAI: bảng 4 loại x (Now, Preferred, Chênh = Pref - Now); ô kiểm tra tổng = 100; Gap = SUMPRODUCT(ABS(Pref-Now)); radar chart Now vs Preferred."
  - "Sheet eNPS: cột điểm 0-10; Promoters = COUNTIF(>=9), Detractors = COUNTIF(<=6); eNPS = (P - D)/COUNT * 100; biểu đồ theo quý."
  - "Sheet Chi phí nghỉ việc: số người nghỉ, lương tháng, số tháng lương/năm, % chi phí thay thế; chi phí = người nghỉ x % x lương năm; so doanh thu; dòng 'trước/sau' và ROI chương trình."
  - "Sheet khảo sát 20 câu: 5 nhóm x 4 câu, AVERAGE theo nhóm và tổng thể, thang giải thích; so trước/sau và theo bộ phận."
  - "Sheet khoảng cách Hofstede: bảng chỉ số 2 nước x 6 chiều; chênh |A-B| từng chiều; AVERAGE; tô màu chiều >= 25 điểm."
  - "Sheet Kotter 8 bước: cột bước, mốc tháng, người chịu trách nhiệm, KPI hàng quý (hiểu tầm nhìn, hành động theo giá trị, eNPS, turnover, engagement), trạng thái."
  - "Google Forms: OCAI (chia 100 điểm), eNPS 1 câu, pulse 5-10 câu ẩn danh."
