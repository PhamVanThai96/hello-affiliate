pitfalls:
  - "Posters vs Reality Gap: tuyên bố giá trị nhưng hành động ngược lại; đừng tuyên bố giá trị chưa sống được; lãnh đạo làm gương trước (Enron, Wells Fargo)."
  - "Founder dependency: văn hóa chỉ dựa vào một người; tuyên bố giá trị rõ, xây lãnh đạo thứ hai, dạy văn hóa tới mọi nhân viên (Apple gắn Steve Jobs: rời 1985, trở lại 1997, qua đời 2011)."
  - "Culture drift: lớn lên thì văn hóa loãng; dạy onboarding tích cực, nhắc thường xuyên (Netflix, Zappos onboarding 4 tuần)."
  - "One-size-fits-all: áp văn hóa trụ sở cho mọi nơi; tách core values bất biến và flexible values; tuyển lãnh đạo địa phương (open door ở nước PDI cao: nhân viên ít dám vào gặp sếp - suy luận minh họa)."
  - "Thay đổi quá nhanh gây burnout; thay đổi 3-5 năm, lắng nghe phản hồi."
  - "Sợ sai sót nên giấu sai sót: nói 'phân tích sai sót, không trừng phạt' và làm đúng; lãnh đạo thừa nhận sai sót trước (Toyota ghi công 'phát hiện sớm')."
  - "Thiếu cấp bách, lãnh đạo yếu, tầm nhìn mờ, không trao quyền, chiến thắng nhanh không đủ, tuyên bố thắng sớm (bảng lỗi phổ biến Kotter)."
  - "Sao chép Artifacts (bỏ chấm công, bỏ duyệt chi) thay vì xây hệ thống phía sau."
  - "Đổi cấu trúc và văn hóa cùng lúc (Zappos Holacracy); nên pilot từng bộ phận."
  - "Đọc trung bình mà bỏ qua độ chênh/từng chiều (Denison, Hofstede)."
  - "Dùng chỉ số quốc gia như mô tả từng người/doanh nghiệp."
  - "Mẫu khảo sát nhỏ và không đại diện; khảo sát xong không hành động."
  - "Quy toàn bộ thành công (Netflix ~27%/năm) cho văn hóa; bỏ qua thời điểm thị trường, vốn, nội dung, công nghệ."
  - "Dùng số liệu quốc tế (Netflix, Uber, Wells Fargo, Vingroup...) như số thật khi nguồn đã gắn nhãn 'ước tính/giả định minh họa'."
  - "Văn hóa độc hại tạo rủi ro đuôi (kiện tụng, mất đối tác, nhân tài, niềm tin) cần định giá như chi phí."
  - "Dùng 'văn hóa gia đình' làm cớ không ra quyết định khó (nhược điểm của Clan) hoặc 'đội thể thao' mà không có gói thôi việc tốt và minh bạch (Netflix keeper test tạo bất an)."

sme_vn_guidance:
  - "Hồ sơ Hofstede VN (PDI 70, IDV 20, UAI 30, LTO 80) hàm ý: nhân viên chờ sếp chỉ dẫn rõ, ngại phản biện thể diện, ưu tiên quan hệ/tập thể. Số liệu làm tròn; LTO có nguồn ghi 57-80 - cần kiểm tra trước khi trích."
  - "Netflix 'tự do và trách nhiệm' cần 'cho phép rõ ràng' ở VN: quy tắc nhỏ như 'quyết định dưới X đồng không cần hỏi' vì nhân viên có thể không dám tự quyết nếu sếp chưa nói rõ."
  - "'Keeper test' khó dùng nguyên văn do tâm lý gắn bó và luật lao động VN; dùng phiên bản mềm: phản hồi hai chiều định kỳ. Quy định pháp lý về chấm dứt hợp đồng, trợ cấp, bồi thường cần xác nhận với luật sư/văn bản hiện hành."
  - "Mô hình 'không có sếp' (Holacracy) khó áp nguyên mẫu ở PDI cao; dùng 'sếp là người hỗ trợ'."
  - "Chủ SME tập trung quyền lực, mệnh lệnh miệng 'phải đạt doanh số' mạnh hơn văn bản: chủ phải tự nói 'đừng làm sai để đạt doanh số'."
  - "Quản lý xuống xưởng làm mẫu (gemba) thì công nhân mới dám nói; tạo an toàn báo lỗi công khai: 'báo lỗi sớm được khen, giấu lỗi bị phạt'."
  - "Giờ làm thêm: nguồn nêu 48 giờ/tuần chuẩn và giới hạn làm thêm 40 giờ/tháng theo Bộ luật Lao động 2019 - cần xác nhận quy định hiện hành và kiểm tra hợp đồng thực tế."
  - "Chi phí tuyển dụng/thay thế: 40% lương năm là giả định; SME nên tự tính theo vị trí then chốt (tuyển dụng, đào tạo, mất năng suất)."
  - "Công cụ đo ngân sách thấp: OCAI miễn phí trực tuyến (hoặc 5-10 USD/người), eNPS 1 câu hỏi, pulse 5-10 câu, mẫu khảo sát 20 câu; Google Forms/Sheets đủ cho SME; chi phí công cụ thương mại là ước tính, cần xác nhận với nhà cung cấp."
  - "Kênh phản biện ít rủi ro thể diện: hộp góp ý ẩn danh, họp nhóm nhỏ; kênh khiếu nại độc lập: cố vấn bên ngoài hoặc cổ đông không điều hành."
  - "Kaizen ở xưởng: thưởng nhỏ (ví dụ 50.000 VNĐ) cho MỖI ý tưởng được nộp, đều đặn; làm vấn đề nhìn thấy được (bảng, màu, dừng khi có lỗi) trước khi nói 'tinh thần cải tiến'."
  - "Phân loại quyết định đảo ngược được (làm nhanh) và không đảo ngược được (giá, hợp đồng lớn, an toàn thực phẩm: kiểm tra kỹ); lập 'chiếc phanh' độc lập đánh giá rủi ro."
  - "Tuyển dụng theo giá trị ngay từ phỏng vấn; thử việc có tiêu chí hành vi rõ; khoản hỗ trợ nghỉ sớm cho người không hợp (kiểu Zappos) cần kiểm tra tính hợp pháp theo pháp luật lao động VN trước khi áp dụng."

case_lessons:
  - name: "Netflix - Văn hóa 'Tự do và Trách nhiệm'"
    type: "success"
    setup: "Thành lập 1997 (Hastings, Randolph), DVD rồi streaming từ 2007. Sau 2001 sa thải bớt, Hastings thấy người giỏi ở lại thì năng suất tăng. 2009 công bố Culture Deck. Giá trị công khai gần đây gồm Judgment, Communication, Curiosity, Courage, Passion, Selflessness, Innovation, Inclusion, Integrity (có thay đổi theo năm, cần đối chiếu bản mới nhất). Sự kiện lấy từ tài liệu Netflix công bố và sách No Rules Rules (2020)."
    key_calculations:
      - "Talent density (giả định): A = 10 người x 100 = 1000 chi phí, đầu ra 10; B = 5 người x 200 = 1000, đầu ra 15 -> hiệu quả 1.5 lần; kênh giao tiếp 45 vs 10."
      - "Context not control (giả định): 3 cấp duyệt x 2 ngày x 40 quyết định = 240 ngày chờ/tháng."
      - "OCAI giả định kiểu kiểm soát (Clan 15, Adhocracy 10, Market 35, Hierarchy 40) vs Netflix (15, 40, 30, 15): chênh 0+30+5+25 = 60."
      - "Doanh thu ~272 triệu USD (2003) và ~33,7 tỷ USD (2023): ~124 lần, CAGR ~27.3%/năm (làm tròn từ báo cáo công khai, cần đối chiếu)."
    lesson: "Tự do chỉ chạy khi có ba điều kiện: người đủ giỏi, thông tin minh bạch, hậu quả rõ nếu hiệu suất giảm. Đừng sao chép Artifacts (bỏ chấm công, phê duyệt). Ở VN (PDI cao) 'tự do' phải được cho phép rõ bằng quy tắc nhỏ; keeper test dùng bản mềm (phản hồi hai chiều). Văn hóa gắt cần gói thôi việc tốt và minh bạch. Văn hóa chỉ là một yếu tố của tăng trưởng."
    data_reliability: "illustrative"
  - name: "Zappos - Văn hóa dịch vụ WOW và thử nghiệm Holacracy"
    type: "success"
    setup: "Bán giày trực tuyến (thành lập 1999, Hsieh tham gia 2000); Amazon mua 2009 (báo chí ~1,2 tỷ USD, ước tính). Lợi thế duy nhất là trải nghiệm khách hàng nên cần văn hóa khiến nhân viên muốn tạo ra nó: tổng đài không giới hạn thời lượng, 10 giá trị cốt lõi, chương trình The Offer (~2.000 USD cho tân binh chọn nghỉ sau đào tạo). Khoảng 2013-2015 chuyển Holacracy; ~14% nhân viên (~210/1.500, ước tính) nhận đề nghị rời công ty."
    key_calculations:
      - "The Offer (giả định): 100 tuyển x 3% = 3 người x 2.000 = 6.000 USD; thiệt hại tránh được 3 x 17.500 = 52.500; ròng 46.500; B/C = 8.75."
      - "Holacracy: 210/1.500 = 14% (ước tính)."
    lesson: "Chọn người theo giá trị từ tuyển dụng; muốn dịch vụ xuất sắc phải đổi KPI (bỏ thời lượng cuộc gọi, thay bằng hài lòng). Đừng đổi cấu trúc và văn hóa cùng lúc; pilot từng bộ phận. Ở PDI cao dùng 'sếp là người hỗ trợ' thay 'không có sếp'. Điểm yếu của Clan: khó quyết định khó."
    data_reliability: "illustrative"
  - name: "Toyota - Kaizen và 'Tôn trọng con người'"
    type: "success"
    setup: "Sau Thế chiến II Nhật thiếu vốn, nguyên liệu; Ohno và cộng sự phát triển TPS từ thập niên 1950 (Just-in-Time, Jidoka); The Toyota Way công bố 2001. Andon cho mọi công nhân dừng chuyền, Genchi Genbutsu, 5 Whys. Văn hóa không đổ lỗi là điều kiện."
    key_calculations:
      - "Chi phí lỗi (giả định): 10.000 sản phẩm x 2% = 200 lỗi; 5 USD -> 1.000; 50 USD -> 10.000; 500 USD -> 100.000; chênh 99.000 USD/tháng."
      - "Xưởng SME 100 công nhân (giả định): 1.200 ý tưởng/năm, 40% áp dụng = 480, tiết kiệm 240 triệu, thưởng 1.200 x 50.000 = 60 triệu, ròng 180 triệu, ROI 300%."
    lesson: "Bắt đầu bằng làm vấn đề nhìn thấy được, an toàn khi báo lỗi, thưởng hành vi đề xuất nhỏ nhưng đều (kể cả ý tưởng không dùng), quản lý xuống xưởng làm mẫu. Hạn chế: cải tiến từng bước chậm trong ngành đổi nhanh; tăng trưởng quá nhanh làm loãng kiểm soát chất lượng (thu hồi 2009-2011 là cảnh báo theo báo chí); 'tôn trọng' có thể thành ngại phản biện cấp trên."
    data_reliability: "illustrative"
  - name: "FPT Telecom - mô hình 'STCo' (minh họa hóa)"
    type: "success"
    setup: "Khung STCo (Support - Transform - Collaborate) là mô hình minh họa do tác giả tài liệu thiết kế, KHÔNG phải khung chính thức của FPT (giá trị chính thức của FPT: Tôn trọng, Đổi mới, Đồng đội; cần đối chiếu). Bối cảnh PDI cao 70, IDV thấp 20, UAI 30: cấp dưới ngại phản biện, quyết định dồn lên trên."
    key_calculations:
      - "Khảo sát 3 câu trước/sau (giả định): 2.4/2.8/3.0 -> 3.6/3.7/3.8; trung bình 2.73 -> 3.70, +0.97."
      - "5.000 nhân viên, nghỉ việc 20% -> 15%: 250 người ít hơn x 60 triệu (40% x 150 triệu) = 15.000 triệu = 15 tỷ VNĐ/năm."
    lesson: "Dịch ý tưởng phương Tây sang PDI cao: không bỏ tôn trọng thứ bậc mà cho quản lý vai trò hỗ trợ và cho nhân viên kênh an toàn; có kênh + quỹ + quyền để thử; KPI quản lý theo phát triển đội ngũ; đo trước/sau; cơ chế mềm dễ bị bỏ khi áp lực lợi nhuận nên phải gắn vào KPI và tuyển dụng."
    data_reliability: "illustrative"
  - name: "Vingroup - Văn hóa 'tốc độ' và cái giá"
    type: "sme"
    setup: "Sự kiện công khai: VinFast 2017, nhà máy Hải Phòng ~21 tháng theo công bố, VinSmart dừng mảng điện thoại 2021. Phần 'nguyên tắc văn hóa' và số mô phỏng là mô tả khái quát/giả định, không phải văn bản chính thức. Chẩn đoán theo nguồn: Power Culture (Zeus); mảng bất động sản/bán lẻ gần Tough Guy, mảng ô tô gần Bet-Your-Company."
    key_calculations:
      - "EV nhanh = 0.70 x 100 + 0.30 x (-40) = 58; EV chậm = 0.85 x 75 + 0.15 x (-40) = 57.75; xác suất hòa vốn 98/115 = 85.2%."
      - "Giờ làm giả định 60 giờ/tuần: vượt 12 giờ/tuần = 52 giờ/tháng, vượt giới hạn 40 giờ/tháng nguồn nêu (cần xác nhận pháp lý)."
    lesson: "Văn hóa tốc độ là công cụ cạnh tranh có điều kiện: quyết định sửa được, thị trường thưởng người đến trước, có vốn và lãnh đạo chịu rủi ro. Phân loại quyết định đảo ngược/không đảo ngược; trả giá bằng tiền và thời gian nghỉ; theo dõi giờ làm thêm và turnover theo bộ phận; lập 'chiếc phanh' độc lập; chuẩn bị thế hệ kế cận (phụ thuộc người sáng lập)."
    data_reliability: "illustrative"
  - name: "Enron - Văn hóa cạnh tranh độc hại"
    type: "failure"
    setup: "Từ công ty đường ống thành công ty giao dịch năng lượng dưới CEO Skilling; từng được Fortune bình chọn đổi mới nhất nhiều năm cuối thập niên 1990; phá sản 12/2001. Giá trị tuyên bố RICE (Respect, Integrity, Communication, Excellence) nhưng giả định thực: giá trị bằng lợi nhuận ghi nhận trong quý, rank and yank, mark-to-market lạc quan, im lặng được thưởng, kiểm toán xung đột lợi ích (Arthur Andersen). Ước tính: ~4.000 người mất việc đợt đầu; vốn hóa đỉnh ~60-70 tỷ USD bị xóa (ước tính)."
    key_calculations:
      - "Khoảng cách Tầng 2 vs Tầng 3 (RICE vs lợi nhuận bằng mọi giá) là cơ chế, không có phép tính định lượng trong nguồn."
    lesson: "Bộ quy tắc đẹp không bảo vệ được công ty khi hệ thống thưởng phạt dạy điều ngược lại. Soát lại KPI thưởng (có khuyến khích đường tắt không?), lập kênh báo cáo ẩn danh, để người không có lợi ích kiểm tra số liệu quan trọng. Sai sót không được phép nói ra sẽ bị giấu đến khi phát nổ."
    data_reliability: "unverified"
  - name: "Uber thời Kalanick - 'Thắng bằng mọi giá'"
    type: "failure"
    setup: "Uber thành lập 2009, định giá ~70 tỷ USD cuối 2016; bộ 14 giá trị (always be hustlin', toe-stepping, principled confrontation...). Tháng 2/2017 bài của Susan Fowler, điều tra do Eric Holder dẫn dắt, Kalanick từ chức 6/2017, Khosrowshahi CEO 8/2017, IPO 5/2019. Bộ giá trị mới ~8 chuẩn mực. Điểm Denison dưới đây là GIẢ ĐỊNH minh họa, không phải kết quả khảo sát thật của Uber."
    key_calculations:
      - "Denison giả định khủng hoảng: Mission 4.2, Adaptability 4.0, Involvement 2.1, Consistency 2.6, trung bình 3.23, chênh 2.1."
      - "Sau cải tổ: 4.1, 3.8, 3.4, 3.7, trung bình 3.75 (+0.52), chênh thu hẹp còn 0.7."
    lesson: "Thưởng theo tăng trưởng không theo cách đạt được, ngôi sao được bảo vệ, kênh báo cáo mất tín nhiệm khiến thông tin xấu không đi lên. Cần rào chắn đạo đức (danh sách điều không bao giờ làm), kênh khiếu nại độc lập, không ngoại lệ cho ngôi sao, đo Involvement và Consistency hằng quý. Thay lãnh đạo mới đổi được biểu tượng nhưng giá trị mới chỉ có nghĩa khi đi kèm đổi hệ thống. Rủi ro đuôi cần định giá như chi phí."
    data_reliability: "illustrative"
  - name: "Wells Fargo - Áp lực bán chéo"
    type: "failure"
    setup: "Ngân hàng bán lẻ Mỹ với mục tiêu 'Eight is great'; LA Times điều tra 2013; thỏa thuận phạt ~185 triệu USD (9/2016) vì nhân viên mở hàng triệu tài khoản không được phép (~2 triệu lúc đó; số sau đó cao hơn); ~5.300 nhân viên bị sa thải nhiều năm; Stumpf từ chức 10/2016; giới hạn tài sản của Fed 2018; thỏa thuận ~3 tỷ USD 2020 (làm tròn, từ báo chí). Phép tính chỉ tiêu bên dưới là giả định minh họa."
    key_calculations:
      - "Chỉ tiêu giả định: 1.000 hộ x (8 - 6) = 2.000 sản phẩm phải bán thêm; 10 nhân viên: 200 sản phẩm/người."
      - "Tổng phạt công khai: 185 + 3.000 = 3.185 triệu USD (~3,2 tỷ). Phí sai hoàn lại ~2,6 triệu USD; 185/2,6 = ~71 lần."
    lesson: "Kerr (1975): thưởng A hy vọng B. Một KPI đo số lượng có thể chi phối cả văn hóa. Luôn hỏi 'đạt KPI này bằng gian lận được không?', kiểm tra tính khả thi theo nhu cầu thật, thêm KPI hài lòng/hủy/khiếu nại, có đường dây độc lập không trả đũa. Ở SME VN chủ phải tự nói 'đừng làm sai để đạt doanh số'."
    data_reliability: "unverified"
  - name: "Daimler-Chrysler - Xung đột văn hóa sau M&A"
    type: "failure"
    setup: "5/1998 công bố sáp nhập ~36 tỷ USD (ước tính) 'merger of equals' nhưng thực tế Daimler mua Chrysler. Đức: chính xác, tập trung, dài hạn, kỹ sư chi phối; Mỹ: linh hoạt, phân cấp, ngắn hạn, tài chính/marketing. 2007 bán phần lớn cổ phần cho Cerberus ~7,4 tỷ USD (ước tính); 2009 Chrysler phá sản."
    key_calculations:
      - "Chênh Hofstede Đức-Mỹ: PDI 5, IDV 24, MAS 4, UAI 19, LTO 57; trung bình (5+24+4+19+57)/5 = 21.8; điểm nghẽn LTO và IDV."
      - "Giá bán 7,4 so mua 36 = ~21% (chênh ~28,6 tỷ USD); không toàn bộ do văn hóa."
    lesson: "Gọi 'ngang hàng' nhưng hành xử kẻ mạnh phá niềm tin; không đo OCAI/Denison trước sáp nhập; mất tài năng. Cultural due diligence trước khi định giá, tìm giá trị chung (chất lượng, kỹ thuật) làm điểm tựa; không ép văn hóa bằng mệnh lệnh. Văn hóa chỉ là một nguyên nhân cùng chu kỳ ngành, chiến lược sản phẩm."
    data_reliability: "unverified"
  - name: "Ngân hàng nước ngoài mua ngân hàng Việt (giả lập)"
    type: "failure"
    setup: "Ngân hàng A (Anh) mua 80% Ngân hàng B (VN, ~1.200 nhân viên, 60 chi nhánh). Kịch bản tự thiết kế, không mô tả tổ chức có thật: lãnh đạo dân chủ vs chuyên quyền, giao tiếp trực tiếp vs gián tiếp giữ thể diện, liêm chính chặt vs quan hệ, quyết định nhanh vs chậm."
    key_calculations:
      - "Chênh Hofstede Anh-VN: PDI 35 (35 vs 70), IDV 69 (89 vs 20), MAS 26 (66 vs 40), UAI 5 (35 vs 30); trung bình (35+69+26+5)/4 = 33.75 (không tính LTO)."
      - "Kết quả giả định: hiệu suất giảm 20-30% năm đầu; 3-5 năm hòa nhập."
    lesson: "Tôn trọng văn hóa địa phương: giữ bất biến liêm chính, quản trị rủi ro; linh hoạt giao tiếp, quan hệ khách hàng. Đào tạo liên văn hóa, dùng lãnh đạo địa phương làm cultural broker, thay quà/đãi khách bằng hoạt động quan hệ hợp pháp, giải thích rõ giữ gì từ mỗi bên."
    data_reliability: "illustrative"
  - name: "Nội thất Việt An - Từ 'một mình chủ quyết' sang gắn kết"
    type: "sme"
    setup: "Công ty TNHH Nội thất Việt An (Bình Dương), 62 nhân viên, doanh thu 48 tỷ/năm, 9 năm; ông Hùng quyết gần mọi việc; 21 người nghỉ trong 12 tháng. Tên và số liệu giả định minh họa. Chẩn đoán Handy = Power (Zeus). OCAI 56/62 người."
    key_calculations:
      - "OCAI Now 25/8/45/22, Pref 35/20/30/15: gap 10+12+15+7 = 44."
      - "eNPS: 14/20/22 trên 56 -> 25.0% - 39.3% = -14.3; nghỉ việc 21/62 = 33.9%."
      - "Chi phí nghỉ việc: 21 x 0.4 x (9.5 x 13) = 21 x 49.4 = 1037.4 triệu (~2.2% doanh thu 48 tỷ)."
      - "Sau 12 tháng: OCAI 32/14/36/18, gap còn 18; eNPS 24/22/10 -> +25.0; nghỉ 9 người = 14.5%, chi phí 444.6 triệu; tiết kiệm 592.8; chi phí chương trình 180 (giả định); ròng 412.8; ROI 229%."
    lesson: "Chẩn đoán trước khi can thiệp: nhân viên không đòi thêm quy trình cứng mà đòi quyền chủ động (nên tăng Clan + Adhocracy vừa phải). Hành vi lãnh đạo là tín hiệu mạnh nhất (ông Hùng công khai nhận phần lỗi, nhường quyền duyệt dưới 5 triệu/đơn). Gắn văn hóa với tiền (chi phí nghỉ việc, ROI). Giới hạn: mẫu 56 người nhỏ; Market 36 vẫn cao hơn mong muốn; cần pulse survey 3 tháng/lần."
    data_reliability: "illustrative"
  - name: "Southwest Airlines - Văn hóa lành mạnh (ví dụ ngắn)"
    type: "success"
    setup: "Thành lập 1971, giá trị Warrior Spirit, Servant's Heart, Fun-LUVing Attitude; nhân viên được trao quyền làm khách hài lòng; câu chuyện lãnh đạo hỗ trợ việc mặt đất (theo kể lại nội bộ)."
    key_calculations:
      - "Không có phép tính định lượng; turnover thấp hơn ngành chỉ là ước tính cần kiểm chứng."
