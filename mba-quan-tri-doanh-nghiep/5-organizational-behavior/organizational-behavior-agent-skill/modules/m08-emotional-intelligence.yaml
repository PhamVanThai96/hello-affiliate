  - {metric: "EQ ở cấp lãnh đạo cao", value: "85% (thường trích)", context: "Ước tính/minh họa; chiều hướng: EQ quan trọng hơn ở cấp cao", confidence: "low"}
  - {metric: "Hiệu suất nhóm của leader EQ cao", value: "+29% (thường trích)", context: "Ước tính/minh họa chưa kiểm chứng", confidence: "low"}
