  - {metric: "Chi phí EQ-i 2.0", value: "50-150 USD/người", context: "Ước tính, nên xin báo giá", confidence: "low"}
  - {metric: "Chi phí MSCEIT", value: "20-50 USD/người", context: "Ước tính, nên xin báo giá", confidence: "low"}
