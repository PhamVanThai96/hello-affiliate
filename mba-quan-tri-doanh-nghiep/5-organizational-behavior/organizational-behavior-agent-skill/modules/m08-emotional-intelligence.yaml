  - {metric: "Chấp nhận thay đổi khi leader EQ cao và có tầm nhìn rõ", value: "70% so với 30% (thường trích)", context: "Ước tính/minh họa chưa kiểm chứng", confidence: "low"}
  - {metric: "Nguyên nhân executive derailment", value: "50% thiếu EQ / 25% thiếu IQ-kỹ năng / 25% khác", context: "CCL (McCall & Lombardo thập niên 1980) ghi nhận nguyên nhân quan hệ; tỷ lệ cụ thể là ước tính minh họa", confidence: "low"}
  - {metric: "Nhân viên của lãnh đạo EQ cao", value: "lo âu -31%, ngủ +21%, gắn kết +19%, nghỉ việc -40% (thường gán cho nghiên cứu 2019)", context: "Chưa xác minh nguồn; chỉ minh họa chiều hướng", confidence: "low"}
  - {metric: "Nhóm an toàn tâm lý cao", value: "năng suất gấp 2,4 lần (thường trích)", context: "Chưa kiểm chứng; không nên trích như dữ liệu thật; Project Aristotle ~2012-2016 chỉ nêu an toàn tâm lý là yếu tố số 1", confidence: "low"}
  - {metric: "IQ tối thiểu của CEO (threshold hypothesis)", value: "khoảng 120, không cần 160", context: "Ước tính thường trích (kể cả HBR), còn tranh luận", confidence: "low"}
