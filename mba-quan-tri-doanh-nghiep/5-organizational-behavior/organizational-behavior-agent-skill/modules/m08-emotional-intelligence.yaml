id: "m08"
name_vi: "Trí tuệ cảm xúc (EQ) trong quản trị và lãnh đạo"
name_en: "Emotional Intelligence (EQ)"
source_file: "08-emotional-intelligence.md"
purpose: >
  Giúp chủ SME và nhà quản lý hiểu, đo lường, rèn luyện và định lượng giá trị của trí tuệ cảm xúc (nhận thức và điều tiết
  cảm xúc của mình, nhận biết và dẫn dắt cảm xúc của người khác) để giảm nghỉ việc, cải thiện văn hóa, lãnh đạo linh hoạt
  theo 6 phong cách, xử lý xung đột và khủng hoảng. Module đồng thời nhắc agent tách rõ điều có cơ sở khoa học khỏi
  các con số phổ biến nhưng chưa kiểm chứng (58%, 85%, 29%...).
when_to_use:
  - "Chủ SME/quản lý hỏi: EQ là gì, khác IQ thế nào, có quan trọng hơn IQ không, con số 58% có thật không"
  - "Nhân viên giỏi nghỉ liên tục, nghi ngờ do hành vi của chủ/quản lý (quát tháo, ít khen, đổi hướng thất thường)"
  - "Cần đo EQ của lãnh đạo: chọn ESCI (360), EQ-i 2.0 (tự báo cáo) hay MSCEIT (bài test năng lực)"
  - "Có kết quả 360 độ và muốn tính khoảng cách điểm mù (blind-spot gap), chọn domain ưu tiên can thiệp"
  - "Cần chọn phong cách lãnh đạo theo tình huống (khủng hoảng, nhân viên mới, deadline gấp, mâu thuẫn hai đội)"
  - "Cần tính chi phí nghỉ việc và ROI của chương trình coaching/đào tạo EQ để thuyết phục chủ/cổ đông"
  - "Cần lập kế hoạch rèn EQ 90 ngày, nhật ký cảm xúc, bản đồ đồng cảm, khung giải quyết xung đột Win-Win"
  - "Bị kích hoạt cảm xúc (amygdala hijack), muốn kỹ thuật dừng/thở, hoặc lo ngại EQ bị lạm dụng để thao túng, kiệt sức vì đồng cảm"
  - "Điều chỉnh việc dùng công cụ EQ phương Tây cho văn hóa Việt Nam (khoảng cách quyền lực, giữ thể diện)"
prerequisites: ["m02"]
related_modules:
  - "m02: Leadership styles - 6 phong cách Goleman nằm trong bài này; EQ là điều kiện để chuyển phong cách đúng lúc"
  - "m01: Motivation theories - Motivation/Achievement Orientation là thành phần của EQ"
  - "m03: Team dynamics - an toàn tâm lý (Project Aristotle), lây lan cảm xúc trong nhóm"
  - "m04: Organizational culture - hành vi lãnh đạo (case Uber, Microsoft) định hình văn hóa"
  - "m05: Power and politics - Organizational Awareness là năng lực đọc quyền lực chính thức và phi chính thức"
  - "m06: Conflict management - Conflict Management là competency EQ; khung Getting to Yes, lợi ích vs lập trường"
  - "m07: Change management - Adaptability, Positive Outlook; EQ quyết định mức chấp nhận thay đổi"
  - "m10: People insight - 360 độ, đo lường hành vi, Empathy Map"

concepts:
  - term_vi: "Trí tuệ cảm xúc"
    term_en: "Emotional Intelligence (EQ / EI)"
    definition: "Nhóm năng lực nhận biết, hiểu và điều tiết cảm xúc của bản thân, đồng thời nhận biết và tác động tích cực đến cảm xúc người khác để đạt mục tiêu công việc và quan hệ."
    why_it_matters: >
      Thế kỷ 20 tuyển dụng và đánh giá dựa mạnh vào IQ, bằng cấp, kỹ năng kỹ thuật, nhưng ai cũng gặp người 'giỏi mà không làm việc chung được'.
      EQ giải thích khác biệt đó: một nhóm năng lực xử lý thông tin cảm xúc và quan hệ, tách biệt với trí tuệ học thuật, và rèn luyện được.
  - term_vi: "Mốc lịch sử hình thành EQ"
    term_en: "History of EQ"
    definition: "Thorndike (1920) Social Intelligence; Wechsler (1943) vai trò yếu tố cảm xúc; Gardner (1983) Multiple Intelligences (Intrapersonal/Interpersonal); Salovey & Mayer (1990) bài báo Emotional Intelligence; Goleman (1995) sách Emotional Intelligence; Goleman (1998) Working with EI; Goleman (2002) Primal Leadership; Hay Group/Goleman phát triển ESCI (khoảng 2006-2011)."
    why_it_matters: "Cho thấy EQ là dòng nghiên cứu nhiều thập kỷ chứ không phải trào lưu một cuốn sách; Goleman (tiến sĩ tâm lý Harvard, từng là nhà báo khoa học NYT) tổng hợp Salovey-Mayer và nghiên cứu competency của McClelland rồi phổ biến đại chúng, vừa giúp EQ vào doanh nghiệp vừa là lý do giới học thuật cho rằng khái niệm bị thổi phồng."
  - term_vi: "Mô hình 5 thành phần (1995)"
    term_en: "Goleman's original 5 components"
    definition: "Self-Awareness (tự nhận thức), Self-Regulation (tự điều tiết), Motivation (động lực nội tại), Empathy (đồng cảm), Social Skills (kỹ năng xã hội)."
    why_it_matters: "Cần khung đơn giản cho độc giả phổ thông: nhóm năng lực cá nhân (hiểu mình, điều tiết mình, tự thúc đẩy) và năng lực xã hội (hiểu người, làm việc với người). Cách chia 'với mình/với người' được giữ ở mọi phiên bản sau."
  - term_vi: "Mô hình 4 domain, 12 năng lực ESCI"
    term_en: "Goleman-Boyatzis 4-Domain / 12-Competency model (ESCI)"
    definition: "Lưới 2x2 (hiểu/điều tiết) x (bản thân/người khác) gồm 4 domain: Self-Awareness, Self-Management, Social Awareness, Relationship Management. Bản 2002 (Primal Leadership) có khoảng 18 năng lực; ESCI (khoảng 2011) rút còn 12. Tài liệu nguồn mô tả 14 năng lực = 12 ESCI + Accurate Self-Assessment + Self-Confidence (mô hình cũ, không thuộc 12 ESCI)."
    why_it_matters: "Mô tả khái niệm không đủ để tuyển dụng và huấn luyện; doanh nghiệp cần hành vi quan sát và đo được. Cùng Boyatzis (Hay Group), Goleman gắn mỗi domain với competency hành vi để xây công cụ 360 độ (ECI rồi ESCI)."
  - term_vi: "Tự nhận thức"
    term_en: "Self-Awareness domain (Emotional Self-Awareness; Accurate Self-Assessment; Self-Confidence)"
    definition: "Biết cảm xúc mình đang là gì, vì sao có, ảnh hưởng quyết định ra sao; biết điểm mạnh/yếu; tin vào năng lực của mình. Chỉ Emotional Self-Awareness thuộc 12 năng lực ESCI."
    why_it_matters: "Là nền móng của các domain còn lại: không nhận ra cảm xúc thì không điều tiết được. Công cụ: thiền chánh niệm, nhật ký, quét cơ thể, 360 độ."
  - term_vi: "Tự quản lý"
    term_en: "Self-Management domain (Emotional Self-Control, Adaptability, Achievement Orientation, Positive Outlook)"
    definition: "Kiểm soát cảm xúc tiêu cực và xung động, thích ứng thay đổi, định hướng thành tích, nhìn tích cực."
    why_it_matters: "Là domain điều tiết hành vi dưới áp lực; trong case Hạt Nắng đây là domain có điểm người khác thấp nhất (2,40) và cải thiện nhiều nhất (+1,12) sau can thiệp."
  - term_vi: "Nhận thức xã hội"
    term_en: "Social Awareness domain (Empathy, Organizational Awareness)"
    definition: "Hiểu cảm xúc, nhu cầu, góc nhìn người khác (Empathy) và hiểu cấu trúc quyền lực, quy tắc ngầm, nhóm lợi ích trong tổ chức (Organizational Awareness)."
    why_it_matters: "Cho phép chọn đúng hành vi và đúng phong cách lãnh đạo theo bối cảnh; thiếu nó thì lãnh đạo áp dụng một cách cho mọi tình huống."
  - term_vi: "Quản lý quan hệ"
    term_en: "Relationship Management domain (Influence, Coach & Mentor, Conflict Management, Teamwork, Inspirational Leadership)"
    definition: "Dẫn dắt, thuyết phục, huấn luyện, xử lý xung đột, cộng tác và truyền cảm hứng."
    why_it_matters: "Là domain 'đầu ra' nhìn thấy được với người khác; trong case Hạt Nắng đây là domain có gap điểm mù lớn nhất (+1,70)."
  - term_vi: "IQ so với EQ"
    term_en: "IQ vs EQ"
    definition: "IQ: logic, trừu tượng, tương đối ổn định từ khoảng 15-16 tuổi; EQ: hiểu và quản lý cảm xúc, phát triển được suốt đời. Kết luận cân bằng: cần đủ IQ để làm việc, EQ phân biệt lãnh đạo tốt và xuất sắc; IQ + EQ + kỹ năng chuyên môn cùng đóng góp."
    why_it_matters: "Tránh hai thái cực 'EQ thay thế IQ' hoặc 'EQ là trò hào nhoáng'. Quan điểm CEO cần IQ ngưỡng khoảng 120 (threshold hypothesis) là ước tính chưa kiểm chứng, còn tranh luận."
  - term_vi: "Con số 58% / 25%"
    term_en: "The '58% EQ' claim"
    definition: "Con số 'EQ dự báo 58% hiệu suất, IQ 25%' thường gắn với Hay Group/Goleman, được phổ biến bởi tài liệu thương mại (như TalentSmart), chưa có công bố học thuật rõ ràng."
    why_it_matters: "Điều có cơ sở: nghiên cứu competency (Working with EI, 1998) cho thấy năng lực cảm xúc/xã hội chiếm tỷ trọng lớn hơn năng lực kỹ thuật/nhận thức khi phân biệt người xuất sắc với trung bình và tăng ở cấp lãnh đạo cao. Chỉ là ước tính phổ biến: 58/25, 85%, +29% hiệu suất nhóm, 200+ công ty/500+ lãnh đạo. Agent phải ghi nhãn 'ước tính/minh họa, chưa kiểm chứng' khi trích."
  - term_vi: "Mô hình EQ-i của Bar-On"
    term_en: "Bar-On EQ-i (1997; EQ-i 2.0 2011)"
    definition: "Mô hình hỗn hợp (mixed) 5 composite, 15 subscale: Intrapersonal, Interpersonal, Adaptability, Stress Management, General Mood. EQ-i 2.0 (2011) tổ chức lại thành Self-Perception, Self-Expression, Interpersonal, Decision Making, Stress Management nhưng vẫn 15 subscale."
    why_it_matters: "Bar-On (nhà tâm lý Israel) xuất phát từ câu hỏi 'điều gì khiến một người sống tốt và thích nghi tốt' nên gắn với phúc lợi tâm lý; có General Mood (lạc quan, hạnh phúc) mà Goleman không có. Phổ biến ở HR/tư vấn tâm lý hơn lãnh đạo."
  - term_vi: "Mô hình khả năng Mayer-Salovey-Caruso"
    term_en: "Ability model / MSCEIT (4 branches)"
    definition: "EQ là 4 khả năng xử lý thông tin cảm xúc: Perceive, Use, Understand, Manage; đo bằng bài test có đáp án đúng/sai (MSCEIT, 2002)."
    why_it_matters: "Mayer và Salovey (1990) muốn EQ là một dạng trí tuệ thực sự (có đáp án kiểm tra được), không chỉ là tính cách dễ mến. Là mô hình 'ability' thuần, hẹp nhưng chặt chẽ; phổ biến trong nghiên cứu học thuật."
  - term_vi: "Mô hình Trait EI"
    term_en: "Trait EI (Petrides, 2000s; TEIQue)"
    definition: "Xem EQ là đặc điểm tính cách (self-esteem, optimism, trait emotional expression, emotional regulation, trait empathy, social competence, trait stress management), không phải khả năng."
    why_it_matters: "Nhấn mạnh tính ổn định hơn kỹ năng học được; ít phổ biến trong luyện tập lãnh đạo; có thang TEIQue (bản rút gọn 30 câu), kiểm tra điều kiện dùng thương mại."
  - term_vi: "Mô hình hỗn hợp và mô hình khả năng"
    term_en: "Mixed model vs Ability model"
    definition: "Goleman và Bar-On là mixed (khả năng + đặc điểm tính cách + động lực); Mayer-Salovey là ability (chỉ năng lực xử lý cảm xúc)."
    why_it_matters: "Hai công cụ cùng tên EQ nhưng đo thứ khác nhau thì không nên so điểm trực tiếp; mối tương quan giữa các thang chỉ ở mức vừa phải."
  - term_vi: "Cướp quyền của hạch hạnh nhân"
    term_en: "Amygdala hijack"
    definition: "Amygdala (phát hiện mối đe dọa) kích hoạt quá mạnh, vượt qua vỏ não trước trán (tư duy hợp lý), gây phản ứng bốc đồng (đánh/chạy/đóng băng). Đợt đầu mô tả khoảng 6-20 giây; 'quy tắc 6 giây' là mẹo thực hành, không phải hằng số khoa học."
    why_it_matters: "Thuật ngữ do Goleman đặt (1995) dựa trên công trình của Joseph LeDoux về 'đường tắt' nhanh nhưng thô từ giác quan tới amygdala. Giải thích vì sao người thông minh vẫn nói/gửi điều hối hận khi bị chỉ trích, nên cần kỹ thuật (dừng, thở, gọi tên cảm xúc) chứ không chỉ ý chí. Là mô hình đơn giản hóa; thần kinh học hiện đại cho thấy cảm xúc là nhiều mạng lưới não."
  - term_vi: "Nơ-ron gương và lây lan cảm xúc"
    term_en: "Mirror neurons / emotional contagion"
    definition: "Nơ-ron hoạt động khi bạn làm một việc và khi thấy người khác làm (phát hiện ở khỉ, nhóm Rizzolatti, Parma, thập niên 1990). Ứng dụng: cảm xúc của lãnh đạo lan sang nhóm."
    why_it_matters: "Đồng cảm có nền tảng sinh lý nên leader là 'mood setter'. Bằng chứng ở người còn gián tiếp, vai trò trong đồng cảm còn tranh luận: coi là mô hình giải thích hữu ích, không phải kết luận chắc chắn."
  - term_vi: "Trương lực phế vị và Polyvagal"
    term_en: "Vagal tone / Polyvagal Theory (Porges, 1990s-2011)"
    definition: "Dây thần kinh phế vị là 'đường cao tốc' não-cơ thể; vagal tone cao giúp bình tĩnh nhanh sau stress. Tăng bằng thở sâu, hát/ngân nga, tiếp xúc lạnh, yoga, thiền, kết nối xã hội."
    why_it_matters: "Là khung gợi ý cho thực hành thở và kết nối xã hội; lý thuyết còn tranh luận trong sinh lý học, không phải bằng chứng chắc chắn."
  - term_vi: "Tính dẻo thần kinh"
    term_en: "Neuroplasticity"
    definition: "Não hình thành kết nối mới suốt đời; thói quen cảm xúc được củng cố bằng lặp lại nên cũng được viết lại bằng lặp lại có chủ đích. Thay đổi quan sát được sau khoảng 8-12 tuần thực hành đều (mức độ khác nhau theo người)."
    why_it_matters: "Là cơ sở để nói EQ rèn luyện được, khác IQ tương đối cố định. Các nghiên cứu hình ảnh não về thiền cỡ mẫu nhỏ, cần nghiên cứu lặp lại. Công thức chung mọi thực hành: chú ý, dừng, chọn phản ứng mới, lặp lại có phản hồi."
  - term_vi: "Điểm mù (khoảng cách tự đánh giá)"
    term_en: "Blind-spot gap"
    definition: "Chênh lệch giữa điểm tự đánh giá và điểm trung bình người khác chấm; gap dương lớn nghĩa là mình tự thấy tốt hơn người khác thấy."
    why_it_matters: "Thiên kiến tự đánh giá là hạn chế lớn của mọi bài tự chấm; 360 độ phơi bày điểm mù và tạo động lực thay đổi (case Phan Trần, Hạt Nắng). Ngưỡng thực hành: gap > 1 điểm trên thang 5 là tín hiệu cần chú ý."
  - term_vi: "EQ tối (thao túng cảm xúc)"
    term_en: "Dark EQ"
    definition: "Dùng kỹ năng đọc và điều khiển cảm xúc để thao túng, lừa dối hoặc gây hại; EQ trung tính về đạo đức, giá trị phụ thuộc ý định."
    why_it_matters: "Nhắc rằng EQ cao không đồng nghĩa người tốt: nên đánh giá EQ cùng liêm chính (integrity) và hành vi lặp lại theo thời gian. Tổ hợp EQ cao + tự luyến là hướng nghiên cứu còn tranh luận."
  - term_vi: "Kiệt sức vì đồng cảm"
    term_en: "Empathy burnout / compassion fatigue"
    definition: "Đồng cảm quá mức, không có ranh giới, dẫn đến cạn kiệt cảm xúc; thường gặp ở y tá, CSKH, nhà trị liệu và chủ SME hay 'gánh' mọi chuyện của nhân viên."
    why_it_matters: "Phân biệt đồng cảm nhận thức (hiểu người khác cảm thấy gì) với lây cảm xúc (cảm như chính mình tổn thương); quản lý cần phần đầu nhiều hơn."
  - term_vi: "Lệch pha văn hóa"
    term_en: "Cultural mismatch"
    definition: "Mô hình EQ phát triển chủ yếu ở phương Tây; ở văn hóa khoảng cách quyền lực cao, điểm Influence thấp có thể là sự khéo léo văn hóa (nói gián tiếp, qua trung gian) chứ không phải EQ thấp."
    why_it_matters: "Cùng một hành vi (phản đối thẳng cấp trên) là tự tin ở nơi này nhưng vô lễ ở nơi khác. Khung Hofstede (1980): Việt Nam thường được mô tả khoảng cách quyền lực khá cao, thiên tập thể (chỉ nêu xu hướng, điểm số theo từng bản cập nhật)."
  - term_vi: "Phê phán khái niệm EQ"
    term_en: "Critiques of EQ (Locke 2005, Murphy)"
    definition: "Mơ hồ/quá rộng, đo lường có thiên kiến, nhầm lẫn ability/trait, trùng Big Five (agreeableness, openness), thiếu bằng chứng sinh học chắc, thiên kiến văn hóa phương Tây, bị thổi phồng thành 'thuốc chữa bách bệnh'. Locke (2005): intelligence phải là năng lực nhận thức nên EQ pha trộn quá nhiều thứ. Mayer & Salovey phản biện: ability model đo được bằng test có đáp án, khác tính cách."
    why_it_matters: "Giúp agent tư vấn cân bằng: EQ quan trọng, rèn được, nhưng không phải cure-all; IQ và kỹ năng chuyên môn vẫn cần."
  - term_vi: "An toàn tâm lý"
    term_en: "Psychological safety (Edmondson; Google Project Aristotle ~2012-2016)"
    definition: "Thành viên cảm thấy an toàn để chấp nhận rủi ro và nhận lỗi; là yếu tố dự báo số 1 nhóm hiệu quả trong Project Aristotle."
    why_it_matters: "Khó có an toàn tâm lý nếu lãnh đạo thiếu EQ (lộ sự dễ tổn thương, không 'bắn người đưa tin', nhận lỗi, lắng nghe, đồng cảm). Con số nhóm an toàn cao năng suất gấp 2,4 lần chưa kiểm chứng; Google không đo EQ lãnh đạo trực tiếp."
  - term_vi: "Executive derailment"
    term_en: "Executive derailment (CCL, McCall & Lombardo, thập niên 1980)"
    definition: "Hiện tượng lãnh đạo thành công bị cách chức/thất bại; nguyên nhân thường liên quan quan hệ (độc đoán, thiếu hợp tác). Tỷ lệ 50% thiếu EQ / 25% thiếu IQ-kỹ năng / 25% khác là ước tính minh họa thường được trích, không phải kết quả công bố chính xác."
    why_it_matters: "Thiếu sót kỹ thuật nhỏ bù được bằng chăm chỉ học thêm, nhưng thiếu hụt quan hệ và kiểm soát cảm xúc khó khắc phục hơn vì làm thay đổi cách người khác phản ứng với mình."

formulas:
  - id: "m08_blind_spot_gap"
    name_vi: "Khoảng cách điểm mù (tự đánh giá - người khác đánh giá)"
    name_en: "Blind-spot gap"
    expression_latex: 'Gap = S - \bar{O}, \quad \bar{O} = \frac{1}{n}\sum_{i=1}^{n} O_i'
    expression_python: "S - sum(O)/len(O)"
    excel: "=S - AVERAGE(O1:On)"
    variables:
      - {symbol: "S", meaning: "Điểm tự đánh giá của người được đo (thang 1-5)", unit: "điểm"}
      - {symbol: "O", meaning: "Danh sách điểm từng người đánh giá khác (cấp trên, đồng nghiệp, cấp dưới)", unit: "điểm"}
    when_to_use: "Đọc kết quả 360 độ (ESCI hoặc 360 tự thiết kế) để tìm domain có điểm mù lớn nhất cần can thiệp trước."
    why_it_works: "Tự đánh giá phản ánh hình ảnh bản thân, điểm người khác phản ánh hành vi họ thực sự trải nghiệm. Chênh lệch cho thấy chỗ mình không thấy được; người tự chấm cao và bị chấm thấp thường không có động lực đổi cho đến khi thấy con số."
    assumptions:
      - "Các người đánh giá đủ hiểu hành vi của người được đo và trả lời thật"
      - "Cùng một thang điểm cho tự đánh giá và người khác"
    pitfalls:
      - "Mẫu quá nhỏ (case Hạt Nắng chỉ 5 người) chỉ mang tính chỉ báo"
      - "Văn hóa khoảng cách quyền lực cao: nhân viên có thể chấm cao hơn thực tế vì ngại cấp trên, nên điểm thấp là tín hiệu khá mạnh"
      - "Gap giảm vì tự đánh giá giảm (chính xác hơn) khác với gap giảm vì người khác chấm tăng; phải đọc cả hai"
    interpretation: "Gap > 1 điểm trên thang 5 là tín hiệu cần chú ý (ngưỡng thực hành). Gap dương lớn = điểm mù. Gap gần 0 = tự nhận thức chính xác. Ưu tiên domain có gap lớn và liên quan trực tiếp vấn đề kinh doanh."
    example:
      inputs: {S: 4.0, O: [2.2, 2.6, 2.0, 2.4, 2.8]}
      steps:
        - "Trung bình người khác = (2,2+2,6+2,0+2,4+2,8)/5 = 2,40"
        - "Gap = 4,0 - 2,40"
      result: "Gap Tự quản lý = +1,60 (domain Tự quản lý của anh Khôi, case Hạt Nắng, giả định minh họa)"
  - id: "m08_domain_mean_overall_gap"
    name_vi: "Điểm trung bình các domain và gap tổng"
    name_en: "Average across domains and overall gap"
    expression_latex: '\bar{S}=\frac{1}{4}\sum_{d=1}^{4}S_d,\; \bar{O}=\frac{1}{4}\sum_{d=1}^{4}\bar{O}_d,\; Gap_{tot}=\bar{S}-\bar{O}'
    expression_python: "sum(S_domains)/len(S_domains) - sum(O_domain_means)/len(O_domain_means)"
    excel: "=AVERAGE(S1:S4) - AVERAGE(O1:O4)"
    variables:
      - {symbol: "S_domains", meaning: "Điểm tự đánh giá của 4 domain", unit: "điểm"}
      - {symbol: "O_domain_means", meaning: "Điểm trung bình người khác của 4 domain", unit: "điểm"}
    when_to_use: "Tóm tắt 1 con số cho cả 4 domain trước và sau can thiệp."
    why_it_works: "Một chỉ số tổng giúp theo dõi tiến độ; vẫn phải xem từng domain vì trung bình có thể che domain yếu."
    assumptions: ["4 domain có trọng số bằng nhau"]
    pitfalls: ["Trung bình che mất domain yếu nhất (Tự quản lý 2,40 bị kéo lên 2,70)"]
    interpretation: "Trước can thiệp: tự 4,225, người khác 2,70, gap +1,525 (nguồn ghi +1,53). Sau 6 tháng: tự 3,925, người khác 3,65, gap +0,275."
    example:
      inputs: {S_domains: [4.4, 4.0, 4.2, 4.3], O_domain_means: [3.08, 2.40, 2.72, 2.60]}
      steps:
        - "Trung bình tự = (4,4+4,0+4,2+4,3)/4 = 4,225"
        - "Trung bình người khác = (3,08+2,40+2,72+2,60)/4 = 2,70"
        - "Gap tổng = 4,225 - 2,70"
      result: "+1,525 (làm tròn +1,53)"
  - id: "m08_turnover_rate"
    name_vi: "Tỷ lệ nghỉ việc"
    name_en: "Turnover rate"
    expression_latex: 'TR = \frac{N_{left}}{N_{avg}}'
    expression_python: "N_left / N_avg"
    excel: "=N_left / N_avg"
    variables:
      - {symbol: "N_left", meaning: "Số người nghỉ trong năm", unit: "người"}
      - {symbol: "N_avg", meaning: "Nhân sự bình quân trong năm", unit: "người"}
    when_to_use: "Theo dõi tác động của văn hóa và hành vi lãnh đạo; làm chỉ số trước-sau cho chương trình EQ."
    why_it_works: "Nghỉ việc là hậu quả đo được, hiện ra sớm hơn doanh thu; EQ thấp của lãnh đạo thường đẩy người giỏi (nhiều lựa chọn) rời đi trước."
    assumptions: ["Nhân sự bình quân ổn định; nếu mùa vụ lớn cần chuẩn hóa"]
    pitfalls: ["Nghỉ việc còn do lương, mùa vụ, thị trường; không quy toàn bộ cho EQ", "Phân biệt nghỉ không mong muốn và nghỉ được chủ động cho thôi"]
    interpretation: "42,9% là rất cao; sau can thiệp mục tiêu 17,9% (giả định minh họa)."
    example:
      inputs: {N_left: 12, N_avg: 28}
      steps: ["12 / 28 = 0,4286"]
      result: "Tỷ lệ nghỉ việc = 42,9%/năm"
  - id: "m08_replacement_cost"
    name_vi: "Chi phí thay thế nhân sự và tổng chi phí nghỉ việc"
    name_en: "Replacement cost and total turnover cost"
    expression_latex: 'C_{turnover} = N_{left} \times (r \times W_{year})'
    expression_python: "N_left * (r * W_year)"
    excel: "=N_left * r * W_year"
    variables:
      - {symbol: "N_left", meaning: "Số người nghỉ", unit: "người"}
      - {symbol: "r", meaning: "Tỷ lệ chi phí thay thế so với lương năm (giả định, case dùng 0,30)", unit: "tỷ lệ thập phân"}
      - {symbol: "W_year", meaning: "Lương năm bình quân một nhân sự", unit: "VNĐ"}
    when_to_use: "Đưa 'chi phí cảm xúc' (hành vi lãnh đạo gây nghỉ việc) về tiền để thuyết phục chủ/cổ đông."
    why_it_works: "Chi phí nghỉ việc nằm rải rác ở tuyển dụng, đào tạo, giảm năng suất giai đoạn đầu nên không hiện thành một dòng sổ sách; gom lại bằng một tỷ lệ giả định giúp thấy quy mô vấn đề."
    assumptions: ["Tỷ lệ r là giả định minh họa (30% lương năm); thực tế cần đo theo vị trí", "Chưa tính doanh thu mất, trải nghiệm khách, thương hiệu tuyển dụng"]
    pitfalls: ["Dùng r chung cho mọi vị trí", "Trình bày con số như dữ liệu thật mà không ghi giả định"]
    interpretation: "Case Hạt Nắng: gần 389 triệu VNĐ/năm bị 'chảy mất' vì nghỉ việc (giả định minh họa)."
    example:
      inputs: {N_left: 12, r: 0.30, W_year: 108000000}
      steps:
        - "Lương năm = 9 triệu x 12 = 108 triệu"
        - "Chi phí thay một người = 0,30 x 108 triệu = 32,4 triệu"
        - "Tổng = 12 x 32,4 triệu"
      result: "388,8 triệu VNĐ/năm"
  - id: "m08_eq_program_roi"
    name_vi: "ROI và thời gian hoàn vốn của chương trình phát triển EQ"
    name_en: "ROI and payback of an EQ development program"
    expression_latex: 'ROI = \frac{C_{avoided} - C_{program}}{C_{program}},\; C_{avoided}=C_{before}-C_{after},\; Payback_{months}=\frac{C_{program}}{C_{avoided}/12}'
    expression_python: "(C_before - C_after - C_program) / C_program"
    excel: "=((C_before - C_after) - C_program) / C_program"
    variables:
      - {symbol: "C_before", meaning: "Chi phí nghỉ việc trước can thiệp", unit: "VNĐ/năm"}
      - {symbol: "C_after", meaning: "Chi phí nghỉ việc sau can thiệp (dự kiến hoặc đo lại)", unit: "VNĐ/năm"}
      - {symbol: "C_program", meaning: "Tổng chi phí chương trình (360, coaching, workshop)", unit: "VNĐ"}
    when_to_use: "Chứng minh khoản đầu tư coaching/EQ trước khi chi hoặc sau khi đo lại 6-12 tháng."
    why_it_works: "Quy giá trị về cùng đơn vị tiền với chi phí chương trình nên so sánh trực tiếp; chỉ tính chi phí nghỉ việc tránh được là ước lượng thận trọng vì bỏ qua lợi ích gián tiếp."
    assumptions: ["Giảm nghỉ việc chủ yếu do chương trình", "Tỷ lệ chi phí thay thế đúng (giả định)"]
    pitfalls:
      - "ROI phụ thuộc giả định; cần theo dõi 12 tháng và loại trừ lương, mùa vụ"
      - "Không đưa kết quả giả định minh họa thành cam kết"
    interpretation: "ROI 453% (khoảng 4,5 lần vốn bỏ ra) và hoàn vốn khoảng 2,2 tháng trong case Hạt Nắng (giả định minh họa)."
    example:
      inputs: {C_before: 388800000, C_after: 162000000, C_program: 41000000}
      steps:
        - "Chi phí tránh được = 388,8 - 162 = 226,8 triệu/năm (sau: 5 người x 32,4 triệu = 162 triệu; tỷ lệ nghỉ 5/28 = 17,9%)"
        - "Lợi ích ròng = 226,8 - 41 = 185,8 triệu"
        - "ROI = 185,8 / 41 = 4,53 (453%)"
        - "Hoàn vốn = 41 / (226,8/12) = 2,17 tháng"
      result: "ROI = 453%; payback khoảng 2,2 tháng"
  - id: "m08_eq_self_assessment_score"
    name_vi: "Điểm tự đánh giá EQ 12 câu"
    name_en: "12-item EQ self-assessment score"
    expression_latex: 'Score = \sum_{k=1}^{12} x_k, \quad x_k \in \{1,\dots,5\}, \; Score \in [12,60]'
    expression_python: "sum(items)"
    excel: "=SUM(range)"
    variables:
      - {symbol: "items", meaning: "12 điểm tự chấm (3 câu mỗi domain, thang 1-5)", unit: "điểm"}
    when_to_use: "Công cụ khởi động để bắt đầu quan sát bản thân theo 4 domain; không thay thế ESCI/EQ-i."
    why_it_works: "Chỉ 12 câu nên rẻ và nhanh, đủ để chọn domain ưu tiên; không qua kiểm định tâm trắc học nên không dùng để chẩn đoán."
    assumptions: ["Trả lời trung thực", "Do tài liệu thiết kế cho tự nhìn lại, không phải công cụ chuẩn hóa của Goleman"]
    pitfalls: ["Thiên kiến tự đánh giá quá cao; nên nhờ 1-2 người tin cậy chấm giúp rồi so sánh", "Điểm 51-60 vẫn cần kiểm tra bằng phản hồi người khác"]
    interpretation: "12-28 cần ưu tiên phát triển; 29-40 trung bình; 41-50 khá tốt; 51-60 rất tốt (ngưỡng tham khảo). Domain thấp nhất (tổng 3 câu) là ứng viên cho kế hoạch 90 ngày."
    example:
      inputs: {items: [4,3,4, 3,3,4, 4,4,3, 3,4,3]}
      steps:
        - "Self-Awareness 4+3+4 = 11; Self-Management 3+3+4 = 10"
        - "Social Awareness 4+4+3 = 11; Relationship Management 3+4+3 = 10"
        - "Tổng = 11+10+11+10"
      result: "42 (mức khá); ưu tiên Self-Management và Relationship Management (cùng 10/15)"
  - id: "m08_eq_iq_split_illustrative"
    name_vi: "Cơ cấu đóng góp hiệu suất IQ/EQ/khác (ước tính phổ biến, chưa kiểm chứng)"
    name_en: "IQ / EQ / Other contribution split (illustrative, unverified)"
    expression_latex: 'IQ + EQ + Other = 100\%, \quad (25\%, 58\%, 17\%)'
    expression_python: "100 - iq_share - eq_share"
    variables:
      - {symbol: "iq_share", meaning: "Tỷ trọng IQ thường được trích", unit: "%"}
      - {symbol: "eq_share", meaning: "Tỷ trọng EQ thường được trích", unit: "%"}
    when_to_use: "Chỉ để giải thích/nhận diện con số khi người dùng trích nó; KHÔNG dùng để ra quyết định hay dự báo."
    why_it_works: "Không có logic công thức thật: đây là phép trừ cho đủ 100% của một ước tính phổ biến. Điều có cơ sở là chiều hướng: năng lực cảm xúc/xã hội chiếm tỷ trọng lớn hơn khi phân biệt người xuất sắc với trung bình, và tăng ở cấp lãnh đạo."
    assumptions: ["Ước tính/minh họa, chưa có công bố học thuật rõ ràng"]
    pitfalls: ["Trích như kết quả khoa học chắc chắn", "Suy ra 'IQ không quan trọng' (kết luận đúng: cả hai đều cần, kèm kỹ năng chuyên môn)"]
    interpretation: "Phần 'khác' = 17% gồm kinh nghiệm, kỹ năng kỹ thuật, học vấn, may mắn, thời điểm."
    example:
      inputs: {iq_share: 25, eq_share: 58}
      steps: ["Khác = 100 - 25 - 58"]
      result: "17% (ước tính minh họa, chưa kiểm chứng)"

frameworks:
  - id: "m08_goleman_5_components"
    name_vi: "Mô hình 5 thành phần EQ của Goleman (1995)"
    name_en: "Goleman's 5 components of EI"
    origin: "Goleman (1995), Emotional Intelligence: Why It Can Matter More Than IQ; tổng hợp Salovey-Mayer (1990) và competency của McClelland cho độc giả đại chúng."
    components:
      - "Self-Awareness: nhận ra cảm xúc, điểm mạnh yếu; dấu hiệu tự tin không ngạo mạn, nhận lỗi"
      - "Self-Regulation: kiểm soát cảm xúc tiêu cực, thích ứng, chịu thất vọng; dấu hiệu bình tĩnh dưới áp lực"
      - "Motivation: động lực nội tại, khát khao thành công, thích học; dấu hiệu không bỏ cuộc"
      - "Empathy: hiểu cảm xúc và nhu cầu người khác, lắng nghe; dấu hiệu người khác thấy được lắng nghe"
      - "Social Skills: ảnh hưởng, thuyết phục, quản lý xung đột, xây quan hệ"
    when_to_use: "Giải thích EQ cho người mới bằng khung đơn giản; sau đó chuyển sang mô hình 4 domain khi cần đo và huấn luyện."
    how_to_apply:
      - "Nhóm 3 thành phần đầu thành 'năng lực cá nhân' (hiểu mình, điều tiết mình, tự thúc đẩy) và 2 thành phần sau thành 'năng lực xã hội'"
      - "Cho ví dụ hành vi quan sát được cho từng thành phần trong bối cảnh người học"
    how_to_read_results: "Là mô tả khái niệm, chưa có thang đo; chuyển sang ESCI để đo."
    pitfalls: ["Nhầm 5 thành phần (1995) với 12 năng lực ESCI (2011)"]
    example: "Người hiểu khi giận mình nói điều khó nghe nên dừng hít thở sâu (Self-Awareness) rồi mới phản hồi (Self-Regulation)."
  - id: "m08_goleman_4_domains_esci"
    name_vi: "Mô hình 4 domain, 12 năng lực (ESCI) của Goleman-Boyatzis"
    name_en: "Goleman-Boyatzis 4 Domains / 12 Competencies (ESCI)"
    origin: "Primal Leadership (2002) với Boyatzis, Hay Group; ESCI khoảng 2011 rút gọn từ khoảng 18 năng lực xuống 12. Tạo ra để có hành vi quan sát được, đo được, dùng trong 360 độ."
    components:
      - "Self-Awareness: Emotional Self-Awareness (ESCI); Accurate Self-Assessment và Self-Confidence (mô hình 2002, không thuộc 12 ESCI)"
      - "Self-Management: Emotional Self-Control (thở 4-4-4, kỹ thuật tạm dừng, lưu email nháp 1 giờ), Adaptability, Achievement Orientation (SMART, post-mortem), Positive Outlook (nhật ký biết ơn, reframing)"
      - "Social Awareness: Empathy (lắng nghe chủ động, Empathy Map, perspective taking), Organizational Awareness (vẽ sơ đồ quyền lực chính thức và phi chính thức)"
      - "Relationship Management: Influence (kể chuyện, gắn đề nghị với lợi ích người kia), Coach & Mentor (hỏi nhiều hơn bảo, mô hình GROW), Conflict Management (lợi ích vs lập trường, win-win), Teamwork (chia sẻ công trạng, nhận trách nhiệm), Inspirational Leadership (làm rõ vì sao, tầm nhìn)"
    when_to_use: "Chẩn đoán, đặt mục tiêu phát triển và đánh giá 360 độ cho lãnh đạo; chọn 1-2 domain ưu tiên."
    how_to_apply:
      - "Đo baseline bằng ESCI 360 (hoặc 360 tự thiết kế theo 4 domain)"
      - "Tính gap tự đánh giá - người khác cho từng domain (m08_blind_spot_gap)"
      - "Chọn domain có gap lớn và gắn với vấn đề kinh doanh; chọn năng lực hành vi cụ thể trong domain"
      - "Gắn bài luyện cốt lõi cho từng năng lực (xem Phụ lục A của nguồn)"
      - "Đo lại sau 6-12 tháng"
    how_to_read_results: "Điểm người khác thấp nhất cộng gap lớn = ưu tiên 1; tự đánh giá giảm kèm gap giảm có thể là dấu hiệu tự nhận thức chính xác hơn."
    pitfalls: ["Cố sửa cả 4 domain cùng lúc", "Dùng trực tiếp ở văn hóa khoảng cách quyền lực cao mà không điều chỉnh diễn giải"]
    example: "Case Hạt Nắng: gap lớn nhất ở Quản lý quan hệ (+1,70) và Tự quản lý (+1,60); điểm người khác thấp nhất ở Tự quản lý (2,40) nên ưu tiên số 1."
  - id: "m08_bar_on_eqi"
    name_vi: "Mô hình EQ-i của Bar-On"
    name_en: "Bar-On EQ-i model"
    origin: "Reuven Bar-On, dùng thuật ngữ EQ từ 1985, công bố EQ-i 1997; EQ-i 2.0 năm 2011. Gắn với phúc lợi tâm lý (well-being)."
    components:
      - "Intrapersonal: Self-Regard, Self-Actualization, Assertiveness, Independence, Emotional Self-Awareness"
      - "Interpersonal: Empathy, Social Responsibility, Interpersonal Relationship"
      - "Adaptability: Problem Solving, Reality Testing, Flexibility"
      - "Stress Management: Stress Tolerance, Impulse Control"
      - "General Mood: Optimism, Happiness (Goleman không có)"
    when_to_use: "Đánh giá EQ chung, khám phá bản thân, tuyển dụng/tư vấn tâm lý; rẻ, dễ làm online."
    how_to_apply: ["Làm EQ-i 2.0 (133 câu tự báo cáo, 20-30 phút)", "Đọc 5 composite và 15 subscale, kèm hỏi người ngoài để bù thiên kiến"]
    how_to_read_results: "Tự báo cáo dễ đánh giá quá cao; không có góc nhìn 360; ít chuyên biệt cho bối cảnh lãnh đạo."
    pitfalls: ["Nhầm composite của EQ-i 1997 với EQ-i 2.0 (khác tên composite, cùng 15 subscale)"]
    example: "Chủ SME muốn hiểu mức lạc quan, chịu stress, kiểm soát xung động của bản thân trước khi thuê coach."
  - id: "m08_mayer_salovey_msceit"
    name_vi: "Mô hình khả năng 4 nhánh Mayer-Salovey-Caruso (MSCEIT)"
    name_en: "Mayer-Salovey ability model / MSCEIT"
    origin: "Mayer & Salovey (1990); MSCEIT cùng Caruso (2002): muốn EQ là trí tuệ thực sự, có đáp án đúng sai kiểm tra được."
    components:
      - "Perceive: nhận biết cảm xúc qua khuôn mặt, giọng, tranh vẽ, màu sắc"
      - "Use: dùng cảm xúc hỗ trợ tư duy, sáng tạo (vui thì sáng tạo hơn)"
      - "Understand: hiểu nguyên nhân, hệ quả, chuyển đổi, pha trộn cảm xúc (buồn chán kéo dài hơn giận dữ)"
      - "Manage: quản lý cảm xúc mình và người khác (dùng âm nhạc đổi tâm trạng)"
    when_to_use: "Nghiên cứu học thuật, tuyển chọn có kiểm định; không phải lựa chọn đầu tiên cho phát triển lãnh đạo."
    how_to_apply: ["Làm MSCEIT (141 câu, 30-45 phút, đáp án đúng dựa trên đồng thuận chuyên gia/số đông)", "Đọc điểm 4 nhánh"]
    how_to_read_results: "Chấm khách quan, độ tin cậy cao nhất, nhưng khó chuyển thành hành động phát triển và đáp án 'đúng' còn bị tranh cãi."
    pitfalls: ["Dùng điểm MSCEIT so trực tiếp với ESCI/EQ-i"]
    example: "Hỏi 'người buồn thì màu nào hợp tâm trạng' (xanh dương = đúng)."
  - id: "m08_trait_ei"
    name_vi: "Mô hình Trait EI (Petrides)"
    name_en: "Trait Emotional Intelligence"
    origin: "Konstantin Petrides, thập niên 2000; thang TEIQue (có bản rút gọn 30 câu)."
    components: ["Self-esteem", "Optimism", "Trait emotional expression", "Emotional regulation", "Trait empathy", "Social competence", "Trait stress management"]
    when_to_use: "Nghiên cứu học thuật; khi coi EQ là xu hướng tính cách ổn định."
    how_to_apply: ["Kiểm tra điều kiện sử dụng thương mại của TEIQue trước khi dùng"]
    how_to_read_results: "Nhấn mạnh tính ổn định hơn kỹ năng học được."
    pitfalls: ["Suy ra EQ không rèn được"]
    example: "Ít phổ biến trong luyện tập lãnh đạo so với Goleman và Bar-On."
  - id: "m08_model_comparison"
    name_vi: "So sánh 3 mô hình EQ lớn và ma trận đối chiếu năng lực"
    name_en: "Comparison of Goleman, Bar-On and Mayer-Salovey"
    origin: "Bảng so sánh của tài liệu (mục IV.4 và XIII); giúp đọc tài liệu các tác giả khác nhau."
    components:
      - "Goleman: mixed, 1995/2002/ESCI ~2011, 4 domain 12 năng lực, ESCI 360, phổ biến ở lãnh đạo/tổ chức, chi phí cao, dễ dùng, dựa trên coach có chứng chỉ"
      - "Bar-On: mixed, 1997, 5 composite 15 subscale, EQ-i 2.0 tự báo cáo, phổ biến HR/tư vấn, chi phí vừa, rất dễ dùng"
      - "MSCEIT: ability, 2002, 4 branch, test khách quan, học thuật, chi phí vừa-cao, khó dùng, ít bằng chứng cải thiện qua training"
      - "Ma trận đối chiếu: nhận biết cảm xúc mình (Emotional Self-Awareness / Self-Awareness & Self-Regard / Perceive); điều tiết mình (Self-Control, Adaptability, Positive Outlook / Impulse Control, Stress Tolerance, Flexibility, Optimism / Manage); nhận biết người khác (Empathy, Org. Awareness / Empathy, Social Responsibility / Perceive, Understand); quản lý quan hệ (Influence, Coach, Conflict, Inspirational, Teamwork / Interpersonal Relationship, Assertiveness / Manage, Use); động lực (Achievement Orientation / Self-Actualization, Independence / không đo); mood (không có riêng / General Mood / không có); giải quyết vấn đề (không có riêng / Problem Solving, Reality Testing / Use)"
    when_to_use: "Chọn mô hình/công cụ theo mục đích; giải thích vì sao hai điểm EQ khác công cụ không so được."
    how_to_apply: ["Xác định mục đích: phát triển lãnh đạo, khám phá bản thân, hay tuyển chọn/nghiên cứu", "Chọn mô hình tương ứng (ESCI / EQ-i / MSCEIT)"]
    how_to_read_results: "Mixed bao phủ rộng gồm tính cách và động lực; ability hẹp nhưng chặt chẽ. Tương quan giữa các thang chỉ ở mức vừa phải."
    pitfalls: ["So điểm trực tiếp giữa các công cụ", "Dùng giá và tỷ lệ cải thiện của tài liệu thương mại như số đã kiểm chứng"]
    example: "Muốn phát triển một giám đốc chi nhánh: ESCI 360; muốn sàng lọc nghiên cứu: MSCEIT."
  - id: "m08_eq_measurement_tools"
    name_vi: "Công cụ đo EQ: ESCI, EQ-i 2.0, MSCEIT và công cụ khác"
    name_en: "EQ assessment tools"
    origin: "Ba cách đo, mỗi cách một đánh đổi: tự báo cáo (rẻ, dễ quá cao), 360 độ (thấy hành vi thật, tốn kém), test năng lực (khách quan, đáp án còn tranh cãi)."
    components:
      - "ESCI 2.0: 360 độ (tự + sếp + đồng nghiệp + cấp dưới), khoảng 60-70 câu, thang 1-5, báo cáo 4 domain/12 năng lực; chi phí tham khảo 500-2.000 USD/người gồm phản hồi và coaching (ước tính, nên xin báo giá); cần buổi diễn giải với coach; tốt cho lãnh đạo"
      - "EQ-i 2.0: tự báo cáo 133 câu, 20-30 phút, 5 composite 15 subscale; chi phí tham khảo 50-150 USD; rẻ, dễ, đo mood, nhưng tự báo cáo thiên lệch"
      - "MSCEIT: 141 câu, 30-45 phút, 4 branch; chi phí tham khảo 20-50 USD/người; khách quan nhất, nhưng khó chuyển thành hành động"
      - "IAT (Harvard): đo thiên kiến ngầm, KHÔNG phải công cụ đo EQ; độ tin cậy cấp cá nhân còn tranh luận"
      - "360 tự thiết kế theo Goleman: rẻ nhất nhưng cần thiết kế kỹ"
      - "TEIQue (Petrides): thang trait, kiểm tra điều kiện thương mại"
      - "Nhật ký phản tư: miễn phí, cần kỷ luật"
    when_to_use: "Chọn công cụ theo mục đích: phát triển lãnh đạo -> ESCI; khám phá bản thân -> EQ-i; nghiên cứu/tuyển dụng có kiểm định -> MSCEIT."
    how_to_apply: ["Xác định mục đích và ngân sách", "Chọn công cụ", "Luôn đi kèm buổi diễn giải với coach hiểu bối cảnh địa phương", "Đo lại sau 6-12 tháng"]
    how_to_read_results: "Reliability: ESCI cao, EQ-i cao, MSCEIT rất cao; tính hành động cho phát triển: ESCI rất cao, EQ-i cao, MSCEIT trung bình. Mọi mức giá chỉ là ước tính tham khảo."
    pitfalls: ["Dùng IAT như công cụ EQ", "Quên điều chỉnh bảng hỏi cho văn hóa khoảng cách quyền lực cao", "Đào tạo EQ một buổi workshop không đo trước-sau"]
    example: "SME 28 nhân sự thường dùng 360 tự thiết kế 5 người đánh giá (chỉ báo) kèm coaching thay vì ESCI đầy đủ vì chi phí."
  - id: "m08_goleman_6_leadership_styles"
    name_vi: "6 phong cách lãnh đạo của Goleman gắn với EQ"
    name_en: "Goleman's 6 Leadership Styles"
    origin: "Goleman và Hay/McBer, Leadership That Gets Results (HBR, 2000), phân tích dữ liệu hàng nghìn nhà quản lý (thường trích khoảng 3.800+ lãnh đạo, ước tính); kết luận không có phong cách 'tốt nhất', lãnh đạo hiệu quả chuyển linh hoạt; 4 phong cách 'cộng hưởng' cải thiện môi trường, 2 phong cách 'gây áp lực' có hại nếu lạm dụng. Chuyển đúng phong cách cần Social Awareness và Self-Management."
    components:
      - "Visionary ('Hãy cùng tôi'): cần Self-Awareness, Self-Confidence, Influence; dùng khi cần hướng rõ, đổi mới, khủng hoảng, team mất động lực; tăng động lực (con số +20% engagement là ước tính minh họa); nguy cơ tầm nhìn sai kéo cả nhóm sai"
      - "Coaching ('Hãy phát triển điểm mạnh'): cần Empathy, Self-Control, Influence; dùng với nhân viên mới/yếu, dài hạn, không gấp; tăng retention; nguy cơ tốn thời gian khi gấp"
      - "Affiliative ('Mọi người quan trọng'): cần Empathy, Relationship Management, Self-Control; dùng sau khủng hoảng, xây gắn kết, quan hệ căng; giảm turnover; nguy cơ quá thoải mái không ra việc"
      - "Democratic ('Các bạn nghĩ sao'): cần Social Awareness, Influence, Empathy, Teamwork; dùng với team có kinh nghiệm, quyết định không gấp, cần buy-in; tăng commitment; nguy cơ chậm"
      - "Pacesetting ('Làm nhanh, làm như tôi'): cần Self-Control, Achievement Orientation, Self-Awareness; chỉ khi deadline gấp, team giỏi; nguy cơ burnout, turnover cao, vi mô quản lý"
      - "Commanding ('Làm theo cách này ngay'): cần Self-Control, Influence (quyền lực hợp pháp); chỉ khi khủng hoảng thật (cháy, an toàn); dùng lâu gây mất sáng tạo, brain drain, văn hóa 'sếp là tất cả'"
    when_to_use: "Chọn phong cách theo tình huống và nhận diện phong cách mình lạm dụng."
    how_to_apply:
      - "Đọc tình huống (Social Awareness): gấp hay không, năng lực nhóm, mức tin cậy, khủng hoảng thật hay không"
      - "Chọn tổ hợp phong cách: Q1 planning = Visionary + Democratic; deadline gấp = Visionary + Pacesetting; khủng hoảng (cháy) = Commanding + Affiliative sau đó; nhân viên mới = Coaching + Affiliative; team giàu kinh nghiệm = Democratic + Visionary; mâu thuẫn hai đội = Affiliative + Democratic"
      - "Giữ tần suất: Visionary cao; Coaching và Affiliative trung bình-cao; Democratic trung bình; Pacesetting và Commanding hiếm"
      - "Tự kiểm soát (Self-Control) khi chuyển phong cách"
    how_to_read_results: "Ngưỡng 'Pacesetting > 30% thời gian thì morale sụt, Commanding > 20% thì burnout' là quy tắc kinh nghiệm minh họa, không phải kết quả nghiên cứu; ý chính: càng lạm dụng càng rủi ro. Ở VN: Affiliative và Pacesetting rất phổ biến, Commanding và Visionary có, Coaching và Democratic ít (do khoảng cách quyền lực cao); Gen Z/startup muốn Visionary + Coaching + Affiliative."
    pitfalls: ["Dùng một phong cách cho mọi tình huống", "Lạm dụng Pacesetting/Commanding", "Coi con số +20% là kết quả nghiên cứu"]
    example: "Founder đòi ship sản phẩm trong 3 tuần cố định (Pacesetting) chỉ nên dùng ngắn hạn, kèm giải thích lý do (Visionary) và hỏi tải công việc."
  - id: "m08_amygdala_pause_protocol"
    name_vi: "Quy trình xử lý amygdala hijack (Phát hiện - Dừng - Kích hoạt lại tư duy)"
    name_en: "Detect-Pause-Engage protocol"
    origin: "Goleman (1995) dựa trên LeDoux; thực hành 'quy tắc 6 giây' là mẹo phổ biến, không phải hằng số khoa học."
    components:
      - "Detect: nhận dấu hiệu cơ thể sớm (tim nhanh, ngực thắt, mặt nóng, siết hàm) - quét cơ thể (insula nhận cảm giác cơ thể)"
      - "Pause: dừng khoảng 6 giây hoặc rời tình huống 2-5 phút, lưu email giận thành Draft và xem lại sau 1 giờ"
      - "Engage: thở sâu (4-4-4), nghĩ về hệ quả, kích hoạt lại vỏ não trước trán rồi mới phản hồi"
    when_to_use: "Khi bị chỉ trích, nhận tin xấu, khách từ chối hoặc nhân viên cãi lại."
    how_to_apply: ["Xác định mẫu kích hoạt (trigger) bằng nhật ký", "Cam kết hành vi cụ thể (không trả lời email trong 30 phút sau lời chê)", "Gọi tên cảm xúc, thở 4-4-4, rồi quay lại"]
    how_to_read_results: "Mục tiêu: hạ nhiệt trong 1-2 phút thay vì 30 phút, tránh được phản ứng đáng tiếc."
    pitfalls: ["Chỉ 'cố gắng bình tĩnh' mà không có kỹ thuật", "Coi mô hình amygdala là cơ chế khoa học đầy đủ (đây là đơn giản hóa)"]
    example: "CEO bị cộng sự chỉ trích công khai nói 'để tôi suy nghĩ, chiều nay gặp lại' rồi nhận ra lỗi của mình."
  - id: "m08_neuroscience_eq_practices"
    name_vi: "6 thực hành phát triển EQ dựa trên thần kinh học"
    name_en: "Six neuroscience-based EQ practices"
    origin: "Dựa trên tính dẻo thần kinh: chú ý, dừng, chọn phản ứng mới, lặp lại có phản hồi."
    components:
      - "Mindfulness meditation: 10-15 phút/ngày; MBSR 8 tuần giảm lo âu, điều tiết cảm xúc tốt hơn; Headspace, Calm, Insight Timer; cho Self-Awareness, Self-Control"
      - "Emotional journaling: 5-10 phút/ngày; 4 tuần giúp rõ cảm xúc, hồi phục stress nhanh hơn; cho Self-Awareness, Empathy"
      - "Body scan (somatic awareness): 5-10 phút; bắt cảm xúc sớm trước khi mất kiểm soát"
      - "Social engagement (vagal tone): 30+ phút/ngày tương tác tích cực; cho Social Awareness, Relationship Management"
      - "Compassion/Loving-kindness meditation: 15-20 phút; 8 tuần tăng đồng cảm, giảm thiên kiến"
      - "360 độ + coaching: 1-2 buổi/tháng trong 3-6 tháng; tỷ lệ thay đổi hành vi có coaching so với không (ví dụ 70% so với 3%) là ước tính chưa kiểm chứng, chỉ nêu chiều hướng; cho cả 4 domain"
    when_to_use: "Xây kế hoạch luyện EQ cá nhân; chọn thực hành theo domain yếu."
    how_to_apply: ["Chọn 1-2 thực hành phù hợp domain ưu tiên", "Duy trì tối thiểu 8-12 tuần", "Xin phản hồi và đo lại"]
    how_to_read_results: "Thay đổi quan sát được sau khoảng 8-12 tuần; nghiên cứu hình ảnh não cỡ mẫu nhỏ cần lặp lại."
    pitfalls: ["Kỳ vọng thay đổi tức thì", "Trích số liệu coaching 70% vs 3% như dữ liệu thật"]
    example: "Founder Phan Trần: chánh niệm hằng ngày + nhật ký + coaching hằng tháng."
  - id: "m08_90_day_plan"
    name_vi: "Kế hoạch phát triển EQ 90 ngày"
    name_en: "90-Day EQ Development Plan"
    origin: "Khung 8-12 tuần phổ biến trong huấn luyện lãnh đạo và nghiên cứu hình thành thói quen; không phải ngưỡng khoa học cố định."
    components:
      - "Tuần 1-2 Awareness: đo baseline (360/EQ-i/tự đánh giá), chọn 1-2 lĩnh vực yếu, tìm coach/mentor, nhật ký 5 phút/ngày"
      - "Tuần 3-8 Skill-building: thực hành 15-30 phút/ngày (thiền 10-15 phút, nhật ký 5-10 phút), coaching 1 buổi/tuần nếu có ngân sách, xin phản hồi một người"
      - "Tuần 9-12 Integration: áp dụng hành vi mới trong công việc thật, thu thập phản hồi, đánh giá lại sau 90 ngày"
      - "Lĩnh vực 1 Tự nhận thức: thiền chánh niệm, body scan 5 phút x 3 lần/tuần, nhật ký cảm xúc; đánh giá: gọi tên cảm xúc sớm hơn không"
      - "Lĩnh vực 2 Tự quản lý: thở 4-4-4 x 3 lần/ngày, tạm dừng 5 phút khi giận, cam kết hành vi, tiếp xúc căng thẳng có kiểm soát"
      - "Lĩnh vực 3 Đồng cảm: lắng nghe chủ động 1 cuộc/ngày (phản chiếu 'Tôi nghe bạn nói là...'), perspective taking 3 lần/tuần, loving-kindness 10 phút x 3 lần/tuần, tình nguyện 1 giờ/tuần"
      - "Lĩnh vực 4 Quản lý quan hệ: kể chuyện 1 chuyện/tuần, đồng cảm rồi mới đề nghị, phản hồi cụ thể 1 lần/tuần (ưu tiên cụ thể chân thành hơn sandwich), áp dụng Getting to Yes"
      - "Duy trì sau 90 ngày: giữ khoảng 50% thực hành, coaching 1 lần/tháng, 360 hằng năm, làm mentor; neo hành vi: đầu ngày 3 phút thiền, trước họp 'Thở, lắng nghe, đồng cảm', trước phản hồi lúc giận 'Dừng 5 giây', cuối ngày 2 phút biết ơn"
    when_to_use: "Sau khi có kết quả đo và đã chọn domain ưu tiên."
    how_to_apply: ["Chọn MỘT lĩnh vực (không phải cả bốn)", "Chia 3 giai đoạn", "Mốc đánh giá ở tuần 2, 8 và 12", "Đo lại sau 6-12 tháng"]
    how_to_read_results: "Đánh giá bằng câu hỏi hành vi và phản hồi người xung quanh, không chỉ tự chấm."
    pitfalls: ["Làm một buổi workshop rồi dừng", "Trích 'bắt cảm xúc sớm 5 giây thì kiểm soát tốt hơn 30%' (ước tính minh họa, chưa kiểm chứng)"]
    example: "Thử thách 30 ngày: chọn MỘT năng lực, thực hành 15 phút/ngày, quan sát thay đổi."
  - id: "m08_daily_reflection_journal"
    name_vi: "Nhật ký phản tư hằng ngày"
    name_en: "Daily Reflection Journal"
    origin: "Viết ra buộc người viết 'đứng ngoài' quan sát cảm xúc, giảm cường độ và tăng nhận thức mẫu lặp; cách rẻ nhất rèn Self-Awareness."
    components: ["Cảm xúc chủ đạo hôm nay (vui, bình tĩnh, lo lắng, giận, buồn, khác)", "Điều gì kích hoạt", "Tôi phản ứng thế nào", "Phản ứng có phù hợp giá trị không (có/không/một phần)", "Nếu không, lần sau làm khác thế nào", "Một điều làm tốt về cảm xúc", "Biết ơn một người/điều"]
    when_to_use: "5-10 phút mỗi tối, ít nhất 3 lần/tuần."
    how_to_apply: ["Điền 7 mục", "Cuối tuần xem lại tìm mẫu kích hoạt lặp"]
    how_to_read_results: "Mẫu lặp (cùng trigger, cùng phản ứng) là đầu vào cho kế hoạch 90 ngày."
    pitfalls: ["Phụ thuộc kỷ luật, bỏ giữa chừng"]
    example: "Trigger: báo cáo bán hàng thấp; phản ứng: mắng; làm khác: hỏi 'Có vấn đề gì tôi cần biết không?'"
  - id: "m08_empathy_map"
    name_vi: "Bản đồ đồng cảm"
    name_en: "Empathy Map"
    origin: "Bắt nguồn từ phương pháp Design Thinking; chuyển từ 'tôi nghĩ họ muốn gì' sang 'họ thực sự nghĩ, cảm, nói, làm gì'."
    components: ["Nghĩ gì", "Cảm gì", "Nói gì", "Làm gì"]
    when_to_use: "Chuẩn bị cuộc trò chuyện khó, hiểu nhân viên/khách hàng/đối tác."
    how_to_apply: ["Chọn một người", "Điền 4 góc từ quan sát và hỏi", "So sánh 'nói' với 'cảm' để phát hiện họ đang giấu cảm xúc thật"]
    how_to_read_results: "Mâu thuẫn giữa nói và cảm là dấu hiệu cần hỏi sâu."
    pitfalls: ["Điền theo giả định thay vì quan sát và hỏi"]
    example: "Nhân viên ít phát biểu hóa ra sợ nói khi chưa chắc 100%; quản lý khuyến khích chia sẻ ý tưởng chưa hoàn thiện."
  - id: "m08_win_win_conflict_framework"
    name_vi: "Khung giải quyết xung đột Win-Win (Getting to Yes kết hợp EQ)"
    name_en: "Win-Win conflict resolution (Fisher & Ury + EQ)"
    origin: "Fisher & Ury (Harvard Negotiation Project, 1981, Getting to Yes): đàm phán thất bại vì cãi về lập trường thay vì lợi ích; cùng một lợi ích có nhiều lập trường thỏa mãn."
    components:
      - "Bước 1 Tách con người khỏi vấn đề: dùng 'Tôi nhận thấy khi [hành vi] xảy ra thì tôi bị ảnh hưởng thế này' thay 'Anh lúc nào cũng...' (cần tự kiểm soát)"
      - "Bước 2 Hiểu lợi ích, không phải lập trường (cần đồng cảm); hỏi 'Anh/chị giúp tôi hiểu vì sao điều này quan trọng?'"
      - "Bước 3 Động não phương án, làm lớn chiếc bánh"
      - "Bước 4 Dùng tiêu chí khách quan (giá thị trường...)"
      - "Bước 5 Biết BATNA (phương án thay thế tốt nhất nếu không đạt thỏa thuận)"
      - "Bước 6 Xây dựng quan hệ, tìm giải pháp tốt cho cả hai"
    when_to_use: "Xung đột nội bộ (Marketing vs Sales về giá), với đối tác, khách hàng, đồng sáng lập."
    how_to_apply: ["Đi lần lượt 6 bước", "Giữ thể diện cho cả hai bên (đặc biệt ở VN)"]
    how_to_read_results: "Thành công khi cả hai bên đều tốt hơn thay vì thắng-thua."
    pitfalls: ["Nhầm lập trường với lợi ích", "Bỏ bước kiểm soát cảm xúc"]
    example: "Marketing muốn giá cao (margin), Sales muốn giá thấp (dễ bán): đề xuất tăng volume 30% để vẫn giữ margin tốt ở giá thấp hơn."
  - id: "m08_eq_in_work_contexts"
    name_vi: "EQ trong các bối cảnh công việc: Sales, CSKH, xung đột/thay đổi, làm việc từ xa"
    name_en: "EQ in sales, customer service, conflict/change, hybrid work"
    origin: "Tổng hợp mục XII của nguồn; các con số (sales +20%, hài lòng 30%, khách rời bỏ 40%) là ước tính/minh họa chưa kiểm chứng."
    components:
      - "Sales: Empathy (hiểu nhu cầu, không chỉ đẩy sản phẩm), Self-control (không nổi cơn khi bị từ chối), Influence (thuyết phục qua giá trị), Relationship management (đối tác dài hạn)"
      - "CSKH: Empathy, Self-control trước khách giận, Emotional Self-Awareness (biết khi mình bực), Positive Outlook"
      - "Xung đột/thay đổi: nhận biết căng thẳng sớm, không leo thang, hiểu góc nhìn khác, tìm win-win, hòa giải chính thức"
      - "Làm việc từ xa/hybrid: thách thức (ít tín hiệu phi ngôn ngữ, cô đơn, lệch múi giờ, ranh giới mờ gây burnout); giải pháp: check-in không chỉ về công việc, an toàn tâm lý (bình thường hóa ngày 'không ổn'), nhận biết Zoom fatigue, cà phê ảo"
    when_to_use: "Thiết kế đào tạo EQ theo vai trò."
    how_to_apply: ["Ghép competency với vai trò", "Đặt chỉ số theo bối cảnh (revenue, CSAT, churn, turnover)"]
    how_to_read_results: "Chiều hướng đúng; con số cụ thể cần nguồn gốc."
    pitfalls: ["Trích số liệu minh họa như thật"]
    example: "Nhân viên CSKH calm khi khách giận (Self-control) và hỏi để hiểu vấn đề (Empathy)."
  - id: "m08_eq_vietnam_lens"
    name_vi: "Lăng kính văn hóa Việt Nam trong ứng dụng EQ"
    name_en: "Vietnamese cultural lens for EQ"
    origin: "Hofstede (1980): Việt Nam thường được mô tả khoảng cách quyền lực khá cao và thiên tập thể (chỉ nêu xu hướng); nhận định tổng quát, không áp dụng mọi cá nhân."
    components:
      - "Tập thể: EQ hướng 'chúng ta'; quyết định cân nhắc tác động đến gia đình/nhóm"
      - "Khoảng cách quyền lực cao: kiềm chế cảm xúc trước cấp trên, khó nói 'tôi không đồng ý'"
      - "Giữ thể diện: tránh làm mất mặt, góp ý gián tiếp và riêng tư"
      - "Giao tiếp gián tiếp: 'tùy anh/chị' có thể là 'có'"
      - "Chuộng hài hòa: tránh xung đột công khai, chịu đựng thay vì nêu vấn đề"
      - "Tôn trọng thứ bậc, tuổi tác: điều chỉnh cách nói theo vị trí"
      - "Theo domain: Self-Awareness (tích cực: ý thức bổn phận; tiêu cực: khó nhận lỗi vì thể diện), Self-Management (kiên nhẫn; nhưng dồn nén, cơ thể hóa stress), Empathy (tự nhiên; nhưng thiên về in-group), Relationship (trung thành; nhưng khó nói thật với cấp trên)"
    when_to_use: "Diễn giải 360 độ, thiết kế khảo sát, tư vấn lãnh đạo ở SME Việt Nam."
    how_to_apply: ["Điều chỉnh bảng hỏi", "Tạo kênh phản hồi ẩn danh để bù khoảng cách quyền lực", "Diễn giải cùng coach hiểu bối cảnh", "Không đánh đồng ít phản biện cấp trên với EQ thấp"]
    how_to_read_results: "Điểm Influence thấp có thể phản ánh sự khéo léo văn hóa; trong khảo sát ở VN nhân viên có thể chấm cao hơn thực tế vì ngại cấp trên."
    pitfalls: ["Áp chuẩn phương Tây nguyên xi", "Khái quát hóa mọi cá nhân"]
    example: "Công cụ 360 hỏi 'Bạn có dám nêu ý kiến bất đồng không?' có thể đo sai ở môi trường thứ bậc."

procedures:
  - id: "m08_proc_diagnose_leader_eq"
    name: "Chẩn đoán EQ lãnh đạo bằng 360 độ và tìm điểm mù"
    steps:
      - "Xác định vấn đề kinh doanh (nghỉ việc cao, mâu thuẫn, chất lượng dịch vụ không đều) và chi phí của nó (m08_replacement_cost)"
      - "Chọn công cụ theo mục đích và ngân sách: ESCI 360 / 360 tự thiết kế theo 4 domain / EQ-i 2.0 / MSCEIT"
      - "Thu thập tự đánh giá và điểm từ nhiều người (cấp trên, đồng nghiệp/quản lý chi nhánh, nhân viên); ghi chú mẫu nhỏ chỉ là chỉ báo"
      - "Tính trung bình người khác theo domain và gap = tự - người khác (m08_blind_spot_gap); đánh dấu gap > 1"
      - "Chọn 1 domain ưu tiên: điểm người khác thấp nhất, gap lớn, liên quan trực tiếp vấn đề kinh doanh"
      - "Diễn giải trong bối cảnh văn hóa (khoảng cách quyền lực, giữ thể diện) cùng coach hiểu địa phương"
    outputs: "Bảng 4 domain (tự, người khác, gap), domain ưu tiên số 1, giả thuyết gắn với vấn đề kinh doanh."
  - id: "m08_proc_eq_program_roi"
    name: "Thiết kế và tính ROI chương trình phát triển EQ cho SME (5 bước như case Hạt Nắng)"
    steps:
      - "Bước 1 Đo chi phí hiện tại: lương năm, chi phí thay thế = r x lương năm, tỷ lệ nghỉ việc, tổng chi phí nghỉ việc"
      - "Bước 2 Khảo sát 360 độ, tính gap theo domain"
      - "Bước 3 Lập kế hoạch can thiệp 6 tháng và chi phí (360, coaching, workshop quản lý chi nhánh); đặt hành vi mục tiêu đo được (quy tắc 24 giờ không góp ý gay gắt tại chỗ, khen cụ thể 3 người/tuần, 1-1 15 phút/tháng với từng quản lý, thở 4-4-4 và rời đi 2 phút khi nóng giận)"
      - "Bước 4 Đo lại sau 6 tháng: điểm người khác, gap, tự đánh giá (tự đánh giá giảm kèm gap giảm là dấu hiệu tự nhận thức chính xác hơn)"
      - "Bước 5 Tính ROI = (chi phí nghỉ việc tránh được - chi phí chương trình)/chi phí chương trình và thời gian hoàn vốn; ghi rõ giả định và theo dõi 12 tháng, loại trừ yếu tố khác (lương, mùa vụ)"
    outputs: "Báo cáo trước-sau với ROI, payback và danh sách giả định."
  - id: "m08_proc_choose_leadership_style"
    name: "Chọn phong cách lãnh đạo theo tình huống"
    steps:
      - "Đọc tình huống: khủng hoảng thật hay không, gấp hay không, năng lực và kinh nghiệm nhóm, mức độ cần buy-in, trạng thái cảm xúc nhóm"
      - "Chọn tổ hợp: cần hướng và đổi mới = Visionary; phát triển người dài hạn = Coaching; hàn gắn = Affiliative; cần buy-in = Democratic; deadline gấp với đội giỏi = Pacesetting ngắn hạn; khủng hoảng thật = Commanding"
      - "Kiểm tra tần suất: Pacesetting/Commanding hiếm; nếu đang dùng nhiều thì lập kế hoạch giảm"
      - "Kiểm soát cảm xúc bản thân khi chuyển phong cách (Self-Control)"
      - "Sau khi dùng Commanding trong khủng hoảng, chuyển sang Affiliative để chăm sóc nhóm"
    outputs: "Tổ hợp phong cách 1-2 loại cho tình huống kèm cảnh báo rủi ro."
  - id: "m08_proc_calm_response"
    name: "Quy trình khi bị kích hoạt cảm xúc (phản hồi có suy nghĩ)"
    steps:
      - "Nhận dấu hiệu cơ thể (tim nhanh, ngực thắt, mặt nóng, siết hàm)"
      - "Dừng 5-6 giây; nếu cần rời tình huống 2-5 phút (uống nước, đi bộ)"
      - "Thở 4-4-4: hít 4 giây, giữ 4 giây, thở ra 4 giây"
      - "Gọi tên cảm xúc ('Tôi đang giận/lo') và nghĩ hệ quả"
      - "Email giận: lưu Draft, xem lại sau 1 giờ; hẹn thời điểm trao đổi lại ('chiều nay gặp lại')"
      - "Quay lại và phản hồi bằng hành vi cụ thể, riêng tư"
    outputs: "Phản hồi có chủ đích thay vì phản ứng bốc đồng."
  - id: "m08_proc_give_feedback"
    name: "Phản hồi và khen cụ thể, riêng tư (phù hợp văn hóa giữ thể diện)"
    steps:
      - "Chọn thời điểm riêng tư (không chê công khai, nhất là trước khách); áp dụng quy tắc 24 giờ"
      - "Nêu hành vi cụ thể, không nhận xét con người"
      - "Nêu tác động và đề nghị hỗ trợ ('Tôi giúp gì được không?')"
      - "Khen cụ thể ít nhất 3 người mỗi tuần; sandwich khen-góp ý-khen chỉ là một cách phổ biến, dễ bị nhận ra là công thức"
      - "Tạo kênh phản hồi ẩn danh để bù khoảng cách quyền lực"
    outputs: "Phản hồi chân thành, có hành động, giữ thể diện."
  - id: "m08_proc_90_day"
    name: "Lập và theo dõi kế hoạch 90 ngày"
    steps:
      - "Tuần 1-2: đo baseline, chọn 1-2 lĩnh vực yếu, tìm coach/mentor, bắt đầu nhật ký"
      - "Tuần 3-8: thực hành 15-30 phút/ngày theo lĩnh vực, coaching, xin một người phản hồi"
      - "Tuần 9-12: áp dụng trong công việc thật, thu phản hồi, đo lại"
      - "Sau 90 ngày: giữ khoảng 50% thực hành, coaching 1 lần/tháng, 360 hằng năm, làm mentor"
    outputs: "Kế hoạch có mốc tuần 2, 8, 12 và lịch đo lại 6-12 tháng."
  - id: "m08_proc_resolve_conflict"
    name: "Giải quyết xung đột Win-Win (6 bước)"
    steps:
      - "Tách người khỏi vấn đề: mô tả hành vi cụ thể và tác động"
      - "Hiểu lợi ích đằng sau lập trường, hỏi 'vì sao điều này quan trọng với anh/chị'"
      - "Động não phương án làm lớn chiếc bánh"
      - "Chọn theo tiêu chí khách quan"
      - "Biết BATNA của mình"
      - "Xây dựng quan hệ, giữ thể diện hai bên"
    outputs: "Thỏa thuận mà cả hai bên đều tốt hơn."

decision_rules:
  - "Nếu một con số EQ (58%, 85%, +29% hiệu suất, 2,4 lần an toàn tâm lý) được trích mà không có nguồn gốc rõ thì ghi nhãn 'ước tính/minh họa, chưa kiểm chứng' và chỉ dùng để minh họa chiều hướng, không để ra quyết định đầu tư"
  - "Nếu gap (tự - người khác) của một domain > 1 điểm trên thang 5 thì coi là điểm mù cần chú ý và chọn domain đó (hoặc domain có gap lớn nhất gắn với vấn đề kinh doanh) làm ưu tiên, tối đa 1-2 domain"
  - "Nếu điểm tự đánh giá giảm sau can thiệp trong khi điểm người khác tăng và gap thu hẹp thì đọc là tự nhận thức chính xác hơn, không phải kết quả xấu"
  - "Nếu mục tiêu là phát triển lãnh đạo thì chọn ESCI 360; khám phá bản thân/ngân sách thấp thì EQ-i 2.0; nghiên cứu/tuyển chọn có kiểm định thì MSCEIT; không so điểm trực tiếp giữa các công cụ"
  - "Nếu nhân viên giỏi nghỉ nhiều và lãnh đạo hay quát tháo trước đông người, ít khen thì tính chi phí nghỉ việc (nghỉ x r x lương năm) và gap 360 trước khi đề xuất coaching; ưu tiên Tự quản lý và Quản lý quan hệ"
  - "Nếu khủng hoảng thật (cháy, an toàn) thì dùng Commanding kèm Self-Control, sau đó chuyển sang Affiliative; nếu chỉ gấp tiến độ thì Visionary + Pacesetting ngắn hạn và giải thích lý do"
  - "Nếu nhân viên mới/yếu và không gấp thì dùng Coaching + Affiliative; team giàu kinh nghiệm cần buy-in thì Democratic + Visionary; mâu thuẫn hai đội thì Affiliative + Democratic"
  - "Nếu đang dùng Pacesetting hoặc Commanding thường xuyên thì cảnh báo burnout, turnover, brain drain; giảm tần suất (ngưỡng 30%/20% chỉ là quy tắc kinh nghiệm minh họa)"
  - "Nếu bị kích hoạt cảm xúc mạnh (amygdala hijack) thì dừng 5-6 giây hoặc rời 2-5 phút, thở 4-4-4, không gửi email giận ngay; lưu Draft xem lại sau 1 giờ"
  - "Nếu điểm Influence hoặc phản biện cấp trên thấp ở nhân sự Việt Nam thì không kết luận EQ thấp ngay; xét văn hóa thứ bậc/giữ thể diện và dùng kênh phản hồi ẩn danh"
  - "Nếu đồng cảm lan thành kiệt sức thì đặt ranh giới, tự chăm sóc, có mentor/supervision; phân biệt đồng cảm nhận thức với lây cảm xúc"
  - "Nếu một chương trình EQ chỉ là workshop một lần thì cảnh báo hiệu ứng buzzword; đề xuất đo baseline - luyện có huấn luyện - củng cố bằng phản hồi định kỳ"
  - "Nếu gặp lãnh đạo sức hút cao nhưng hành động không khớp lời nói thì cân nhắc rủi ro EQ tối (dark EQ); đánh giá theo hành vi lặp lại và liêm chính"
  - "Nếu người dùng muốn biết 'EQ hay IQ quan trọng hơn' thì trả lời: cần đủ IQ và kỹ năng chuyên môn, EQ phân biệt lãnh đạo tốt/xuất sắc và quan trọng hơn ở vai trò lãnh đạo/quan hệ; trong kỹ thuật/nghiên cứu IQ vẫn quan trọng hơn"
  - "Nếu làm việc từ xa thì check-in cá nhân định kỳ, bình thường hóa ngày không ổn, cảnh giác Zoom fatigue và ranh giới giờ làm (không họp 23h Chủ nhật)"
  - "Nếu ROI chương trình EQ được dùng để thuyết phục thì ghi rõ giả định (tỷ lệ chi phí thay thế, giảm nghỉ việc), không cam kết, theo dõi 12 tháng"

benchmarks:
