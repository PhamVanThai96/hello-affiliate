pitfalls:
  - "Trích '58% EQ' hoặc các con số tương tự như kết quả khoa học chắc chắn; phải ghi nhãn ước tính/minh họa"
  - "Kết luận 'EQ thay thế IQ' hoặc 'EQ là thuốc chữa bách bệnh'; thực tế cần cả IQ, kỹ năng chuyên môn và EQ"
  - "Chỉ tự đánh giá EQ mà không có phản hồi người khác (thiên kiến tự đánh giá quá cao; case Hạt Nắng tự 4,2 vs người khác 2,7)"
  - "So điểm giữa ESCI, EQ-i, MSCEIT vì tên giống nhau"
  - "Cố cải thiện cả 4 domain cùng lúc thay vì chọn 1-2"
  - "Lạm dụng Pacesetting/Commanding; dùng một phong cách cho mọi tình huống"
  - "Đào tạo EQ một buổi workshop không đo trước-sau (buzzword)"
  - "Dùng EQ để thao túng (dark EQ) hoặc để gánh mọi cảm xúc nhân viên đến kiệt sức"
  - "Áp công cụ 360 phương Tây ở môi trường khoảng cách quyền lực cao mà không điều chỉnh; đánh đồng ít phản biện cấp trên với EQ thấp"
  - "Quy mọi thay đổi (giảm nghỉ việc) cho chương trình EQ mà không loại trừ lương, mùa vụ"
  - "Kết luận 'khắc nghiệt = thành công' từ ngoại lệ (Steve Jobs, Musk): thiên lệch người sống sót; bù đắp EQ thấp luôn có giá"
  - "Coi mô hình amygdala hijack, nơ-ron gương, Polyvagal là chân lý thần kinh học; đây là mô hình đơn giản hóa còn tranh luận"
  - "Dùng IAT như công cụ đo EQ"
  - "Gán điểm EQ cao/thấp cho nhân vật thật (Schultz, Nadella, Barra...) như đo ESCI thực; đó chỉ là nhận định phân tích từ thông tin công khai"

sme_vn_guidance:
  - "Chủ SME thường đánh giá thấp chi phí hành vi lãnh đạo: dùng m08_replacement_cost để quy nghỉ việc về tiền (ví dụ minh họa lương 9 triệu/tháng, r = 30%, 12/28 người nghỉ = 388,8 triệu VNĐ/năm)"
  - "Ngân sách chương trình EQ cho SME 28 nhân sự (giả định minh họa, cần xác nhận báo giá): 360 + báo cáo 8 triệu, coaching 6 buổi x 3,5 triệu = 21 triệu, workshop 3 quản lý chi nhánh 12 triệu, tổng 41 triệu VNĐ"
  - "Giá công cụ quốc tế tính bằng USD (ESCI 500-2.000, EQ-i 2.0 50-150, MSCEIT 20-50): ước tính, cần xin báo giá và kiểm tra chứng chỉ coach theo khung Goleman/Bar-On tại VN"
  - "Với SME ít ngân sách: 360 tự thiết kế 4 domain + 5 người đánh giá + nhật ký cảm xúc + quy tắc hành vi (24 giờ, 3 lời khen/tuần, 1-1 hằng tháng) là bước đầu rẻ nhất"
  - "Văn hóa VN: giữ thể diện, góp ý riêng tư, không chê công khai trước khách; tạo kênh phản hồi ẩn danh; hiểu 'tùy anh/chị' có thể là đồng ý; Coaching/Democratic ít phổ biến nên triển khai dần"
  - "Pacesetting (làm nhanh, làm như tôi) và Affiliative (như gia đình) rất phổ biến ở VN: theo dõi nguy cơ burnout và thiếu kỷ luật; Gen Z kỳ vọng Visionary + Coaching + Affiliative"
  - "Công cụ rẻ: Headspace, Calm, Insight Timer (chánh niệm), Penzu/Day One/sổ tay (nhật ký) - giá cần xác nhận"
  - "Làm việc từ xa: tránh họp ngoài giờ (như CEO họp Zoom 23h Chủ nhật trong Case 11); check-in cá nhân"
  - "Nghị định/pháp lý lao động (sa thải, thông báo trước, hợp đồng) không nằm trong nguồn: cần xác nhận với luật sư/HR trước khi áp dụng (ví dụ Case 11 sa thải 3 người qua email không báo trước là ví dụ phản diện)"
  - "Số liệu Vinamilk và các công ty khác chỉ mang tính minh họa; đối chiếu báo cáo thường niên trước khi trích"

case_lessons:
  - name: "Howard Schultz - Starbucks (đồng cảm có hệ thống)"
    type: "success"
    setup: "Xuất thân gia đình lao động nghèo Brooklyn (cha mất việc sau tai nạn, không có bảo hiểm y tế); từ những năm 1980 định vị Starbucks là 'nơi thứ ba'. Đánh giá EQ là nhận định phân tích, không phải điểm ESCI."
    key_calculations:
      - "Chuỗi nhân quả: phúc lợi (bảo hiểm y tế cả nhân viên bán thời gian, gọi 'partners') -> nhân viên thấy được tôn trọng -> ít nghỉ, tay nghề tốt -> trải nghiệm khách ổn định -> khách quay lại và chấp nhận giá cao hơn"
      - "Từ vài chục cửa hàng lên hơn 30.000 cửa hàng toàn cầu (thập niên 2020, làm tròn, ước tính); tỷ lệ nghỉ thấp hơn trung bình ngành (không nêu số cụ thể)"
    lesson: "Đồng cảm hóa thành chính sách mạnh hơn đồng cảm bằng lời; chi phí phúc lợi hoàn vốn qua giảm chi phí tuyển dụng/đào tạo. Starbucks cũng bị chỉ trích về lao động ở giai đoạn sau nên không phải mẫu hoàn hảo."
    data_reliability: "unverified"
  - name: "Satya Nadella - Microsoft (chuyển đổi văn hóa bằng đồng cảm)"
    type: "success"
    setup: "CEO năm 2014 khi công ty tụt hậu di động, văn hóa cạnh tranh nội bộ, silo."
    key_calculations:
      - "Hành vi: lắng nghe, chia sẻ trải nghiệm gia đình, tư duy 'learn-it-all' thay 'know-it-all', ưu tiên điện toán đám mây, đầu tư phát triển lãnh đạo cấp dưới"
      - "Giá cổ phiếu 2014-2020 thường trích tăng khoảng gấp 3 lần trở lên (làm tròn); đây là kết quả của nhiều yếu tố, đặc biệt Azure, không chỉ văn hóa"
    lesson: "Thay đổi văn hóa bắt đầu từ hành vi người đứng đầu; đồng cảm không thay chiến lược nhưng tạo điều kiện để thực thi."
    data_reliability: "unverified"
  - name: "Mary Barra - General Motors (tự quản lý trong khủng hoảng)"
    type: "success"
    setup: "CEO đầu 2014 khi GM đối mặt khủng hoảng công tắc đánh lửa liên quan nhiều vụ tai nạn chết người (quỹ bồi thường ghi nhận trên một trăm ca; số chính xác khác nhau theo nguồn)."
    key_calculations:
      - "Điềm tĩnh trước truyền thông và điều trần; công khai xin lỗi; nhìn ra gốc rễ văn hóa an toàn/chất lượng; thúc đẩy triệu hồi hàng chục triệu xe năm 2014"
    lesson: "Trong khủng hoảng, chân thực và nhận trách nhiệm thắng che giấu và đổ lỗi; tự quản lý là điều kiện cần. Mức độ 'tốt' của kết quả là nhận định, không có chỉ số duy nhất."
    data_reliability: "unverified"
  - name: "Bà Mai Kiều Liên - Vinamilk (đồng cảm chiến lược với chuỗi cung ứng)"
    type: "success"
    setup: "Lãnh đạo nhiều năm của Vinamilk (nguyên Tổng giám đốc và Chủ tịch HĐQT); phần phân tích mang tính minh họa, nên đối chiếu báo cáo thường niên."
    key_calculations:
      - "Hành vi công khai: quan hệ lâu dài với hộ chăn nuôi bò sữa (hỗ trợ kỹ thuật, thu mua), Quỹ sữa vươn cao Việt Nam, mạng lưới đối tác chuỗi cung ứng"
      - "Kết quả: giữ vị thế dẫn đầu thị phần sữa nhiều năm (số liệu thị phần cần đối chiếu báo cáo mới nhất)"
    lesson: "Ở thị trường mới nổi, quan hệ bền vững với chuỗi cung ứng và cộng đồng là lợi thế khó sao chép; đồng cảm mang tính chiến lược, không chỉ thiện chí."
    data_reliability: "illustrative"
  - name: "Indra Nooyi - PepsiCo (tích hợp 4 domain)"
    type: "success"
    setup: "CEO PepsiCo 2006-2018."
    key_calculations:
      - "Tự nhận thức (thừa nhận thẳng thắn quá) -> tự quản lý (kiên trì Performance with Purpose bất chấp áp lực ngắn hạn) -> đồng cảm (thư gửi cha mẹ các lãnh đạo) -> quản lý quan hệ/ảnh hưởng (đa dạng, thuyết phục điều chỉnh danh mục lành mạnh hơn)"
      - "Có ý kiến phê phán một số mục tiêu sức khỏe/doanh thu không đạt kỳ vọng"
    lesson: "Khi 4 domain vận hành cùng nhau (hiểu mình, kiềm chế mình, hiểu người, dẫn dắt người), lãnh đạo dẫn dắt thay đổi lớn mà giữ được lòng tin; bài học ở cách lãnh đạo hơn là một kết quả duy nhất."
    data_reliability: "unverified"
  - name: "Jacinda Ardern - Christchurch 2019 (EQ trong khủng hoảng)"
    type: "success"
    setup: "Thủ tướng New Zealand (2017-2023); tháng 3/2019 vụ tấn công nhà thờ Hồi giáo làm 51 người thiệt mạng, khi bà mới giữ chức khoảng 2 năm."
    key_calculations:
      - "Xuất hiện trực tiếp điềm tĩnh, gặp cộng đồng, đội khăn trùm đầu, thông điệp 'They are us', không nêu tên thủ phạm, luật vũ khí thông qua trong khoảng 4 tuần"
    lesson: "Cảm xúc chân thực + hành động rõ ràng + đồng cảm bằng hành vi cụ thể tạo phản ứng cộng đồng thống nhất. Có tranh luận chính trị về chính sách khác của bà; case chỉ phân tích khía cạnh EQ."
    data_reliability: "unverified"
  - name: "Steve Jobs - Apple 1985 (thiếu đồng cảm, thiếu kiểm soát)"
    type: "failure"
    setup: "Rời Apple năm 1985 ở tuổi 30 sau xung đột ban lãnh đạo/hội đồng quản trị; quay lại 1997 (khoảng 42 tuổi)."
    key_calculations:
      - "Biểu hiện theo tiểu sử công khai: chê gay gắt trước đám đông, bùng nổ cơn giận, đốt cầu với đồng minh -> nhân tài sợ hãi, mất ủng hộ ban lãnh đạo"
      - "Sau 1997: nhiều tiểu sử cho rằng trưởng thành hơn trong làm việc với đội ngũ; mức thay đổi còn tranh luận"
    lesson: "Thiên tài kỹ thuật không bù tổn thất quan hệ mãi mãi; phản tư sau thất bại có thể phát triển EQ (ủng hộ EQ rèn được). Cẩn trọng thiên lệch người sống sót."
    data_reliability: "unverified"
  - name: "Travis Kalanick - Uber (văn hóa thắng bằng mọi giá)"
    type: "failure"
    setup: "Đồng sáng lập, CEO Uber; tăng trưởng cực nhanh, văn hóa cạnh tranh cực đoan."
    key_calculations:
      - "2017: khiếu nại quấy rối bị xử lý chưa thỏa đáng; video tranh cãi gay gắt với tài xế; đối đầu cơ quan quản lý nhiều nơi"
      - "Hệ quả: phong trào #DeleteUber 2017, áp lực nhà đầu tư/HĐQT, từ chức CEO giữa 2017, thay đổi cấu trúc quản trị"
    lesson: "Văn hóa do lãnh đạo mở đường rò rỉ ra ngoài thành rủi ro pháp lý, truyền thông, nhân sự; chi phí EQ thấp đến muộn nhưng rất lớn."
    data_reliability: "unverified"
  - name: "Elon Musk - Tesla và đối chiếu Indra Nooyi"
    type: "failure"
    setup: "Tầm nhìn kỹ thuật mạnh nhưng phát ngôn công khai nhiều lần gây tranh cãi; Case 10 đối chiếu với Nooyi (nhận định của tài liệu, không đo chính thức)."
    key_calculations:
      - "Tweet 2018 'funding secured' dẫn đến điều tra và thỏa thuận với SEC (mỗi bên chịu phạt, hạn chế phát ngôn)"
      - "Tesla vẫn tăng trưởng nhờ ba yếu tố bù: tầm nhìn/sản phẩm mạnh, đội vận hành giỏi, thị trường đón nhận -> EQ thấp có thể được bù tạm thời nhưng có giá (rủi ro pháp lý, biến động giá cổ phiếu, chi phí nhân sự)"
      - "Đối chiếu: cùng tầm nhìn rất mạnh; Musk tự kiểm soát biến động, đồng cảm ít thể hiện, rủi ro văn hóa cao; Nooyi ổn định, thể hiện đồng cảm, gắn bó cao; hai ngành khác nhau nên không kết luận nhân quả đơn giản"
    lesson: "Ở quy mô lớn cảm xúc của một lãnh đạo được khuếch đại thành tín hiệu thị trường và tuyển dụng; EQ là hệ số điều chỉnh rủi ro của mọi chiến lược chứ không quyết định mọi thứ."
    data_reliability: "unverified"
  - name: "CEO startup Việt Nam thất bại vì EQ thấp (giả định minh họa)"
    type: "failure"
    setup: "Startup công nghệ VN gọi Series A khoảng 2 triệu USD (giả định), 20 nhân sự; CEO kỹ sư giỏi, tập trung hoàn toàn vào chỉ số."
    key_calculations:
      - "Hành vi: họp Zoom 23h Chủ nhật, sa thải 3 người qua email không báo trước, đổi hướng 3 lần/quý không giải thích, nhận hết công trạng, giám sát vi mô"
      - "Kết quả giả định: khoảng 50% nhân sự nghỉ trong 6 tháng, nhà đầu tư vòng B rút sau thẩm định văn hóa, đóng cửa sau 18 tháng"
      - "Vòng xoáy: mất an toàn -> người giỏi nhất đi trước -> thực thi giảm -> CEO gây áp lực hơn -> nhà đầu tư thấy turnover cao -> từ chối"
    lesson: "Với nhân sự Gen Z và người có kinh nghiệm có nhiều lựa chọn, EQ thấp trả giá nhanh hơn; CEO (hư cấu) sau đó học EQ qua coaching, minh họa EQ rèn được."
    data_reliability: "illustrative"
  - name: "Founder Phan Trần - chuyển đổi EQ qua coaching (giả định minh họa, tên giả)"
    type: "sme"
    setup: "Founder startup công nghệ, gọi khoảng 1,5 triệu USD năm 2020 (giả định); cầu toàn, nóng vội, khó ủy quyền, mâu thuẫn đồng sáng lập; nghỉ việc khoảng 30%/năm (giả định)."
    key_calculations:
      - "Can thiệp: 360 độ (anh tự chấm 'thẳng thắn, tận tâm' nhưng nhóm thấy bị coi thường) -> chánh niệm, nhật ký, coaching hằng tháng, 1-1 định kỳ, ủy quyền 2-3 đầu việc nhỏ, hòa giải đồng sáng lập"
      - "Sau khoảng 90 ngày: nghỉ việc từ khoảng 30% xuống khoảng 10%/năm (giả định); gọi vốn vòng sau thuận lợi hơn"
    lesson: "Khoảng cách giữa tự nhận thức và nhận thức người khác tạo động lực; thay đổi hành vi nhỏ lặp lại đổi cảm nhận nhóm nhanh hơn 'đổi tính cách'; coaching có cấu trúc (đo, luyện, đo lại) hiệu quả hơn lời khuyên chung chung."
    data_reliability: "illustrative"
  - name: "Chuỗi cà phê 'Hạt Nắng' - 360 độ và ROI (giả định minh họa)"
    type: "sme"
    setup: "3 chi nhánh Đà Nẵng, 28 nhân sự bình quân; chủ (anh Khôi, 38 tuổi) làm 12 giờ/ngày, nhắc nhở gay gắt trước khách, ít khen; 12 người nghỉ trong 12 tháng; lương 9 triệu/tháng; chi phí thay thế 30% lương năm (giả định)."
    key_calculations:
      - "Chi phí: lương năm 108 triệu; thay 1 người 32,4 triệu; tỷ lệ nghỉ 12/28 = 42,9%; tổng 12 x 32,4 = 388,8 triệu VNĐ/năm"
      - "360 (5 người đánh giá): tự 4,4/4,0/4,2/4,3 (TB 4,225); người khác 3,08/2,40/2,72/2,60 (TB 2,70); gap +1,32/+1,60/+1,48/+1,70 (TB +1,53); ưu tiên Tự quản lý (2,40 thấp nhất) và Quản lý quan hệ (gap lớn nhất)"
      - "Chi phí chương trình 6 tháng: 8 + 21 + 12 = 41 triệu VNĐ"
      - "Đo lại: người khác 3,84/3,52/3,68/3,56 (TB 3,65, +0,95); tự 4,0/3,8/3,9/4,0 (TB 3,925); gap sau +0,16/+0,28/+0,22/+0,44 (TB +0,275); Tự quản lý cải thiện nhiều nhất +1,12"
      - "Giả định nghỉ còn 5 người (17,9%): chi phí 162 triệu; tránh được 226,8 triệu; lợi ích ròng 185,8 triệu; ROI 453%; hoàn vốn khoảng 2,2 tháng"
    lesson: "Đo trước khi sửa (gap 360); ưu tiên một domain gắn vấn đề kinh doanh; chuyển thành hành vi cụ thể đo được; quy ra tiền kèm giả định; đo lại sau 6 và 12 tháng. Tự đánh giá giảm là dấu hiệu tự nhận thức chính xác hơn. Mẫu 5 người chỉ là chỉ báo; ROI phụ thuộc giả định."
    data_reliability: "illustrative"

worked_examples:
  - name: "Gap 360 độ cho 4 domain (Hạt Nắng, trước can thiệp, giả định minh họa)"
    inputs:
      self: {tu_nhan_thuc: 4.4, tu_quan_ly: 4.0, nhan_thuc_xa_hoi: 4.2, quan_ly_quan_he: 4.3}
      others:
        tu_nhan_thuc: [3.0, 3.4, 2.8, 3.2, 3.0]
        tu_quan_ly: [2.2, 2.6, 2.0, 2.4, 2.8]
        nhan_thuc_xa_hoi: [2.6, 3.0, 2.4, 2.8, 2.8]
        quan_ly_quan_he: [2.4, 2.8, 2.2, 2.6, 3.0]
    steps:
      - "TB người khác: 3,08; 2,40; 2,72; 2,60"
      - "Gap = tự - người khác: +1,32; +1,60; +1,48; +1,70"
      - "TB tự 4,225; TB người khác 2,70; gap tổng +1,525 (làm tròn +1,53)"
      - "Cả 4 gap > 1 nên tất cả là điểm mù; ưu tiên Tự quản lý (điểm người khác thấp nhất 2,40) và Quản lý quan hệ (gap lớn nhất 1,70)"
    result: "Ưu tiên can thiệp Tự quản lý (quy tắc 24 giờ, thở 4-4-4) và Quản lý quan hệ (khen 3 người/tuần, 1-1 hằng tháng)"
  - name: "Chi phí nghỉ việc (Hạt Nắng, giả định minh họa)"
    inputs: {luong_thang: 9000000, r: 0.30, nguoi_nghi: 12, nhan_su_bq: 28}
    steps:
      - "Lương năm = 9.000.000 x 12 = 108.000.000"
      - "Chi phí thay 1 người = 0,30 x 108.000.000 = 32.400.000"
      - "Tỷ lệ nghỉ việc = 12/28 = 42,9%"
      - "Tổng chi phí nghỉ việc = 12 x 32.400.000 = 388.800.000"
    result: "388,8 triệu VNĐ/năm, tỷ lệ nghỉ 42,9%"
  - name: "ROI chương trình EQ (Hạt Nắng, giả định minh họa)"
    inputs: {C_before: 388800000, nguoi_nghi_sau: 5, chi_phi_thay_1: 32400000, C_program: 41000000}
    steps:
      - "Chi phí nghỉ sau = 5 x 32,4 triệu = 162 triệu (tỷ lệ 5/28 = 17,9%)"
      - "Tránh được = 388,8 - 162 = 226,8 triệu/năm"
      - "Lợi ích ròng = 226,8 - 41 = 185,8 triệu"
      - "ROI = 185,8/41 = 4,53 (453%)"
      - "Payback = 41 / (226,8/12) = 2,17 tháng"
    result: "ROI 453%, hoàn vốn khoảng 2,2 tháng; kèm cảnh báo: phụ thuộc giả định, theo dõi 12 tháng"
  - name: "Điểm tự đánh giá EQ 12 câu"
    inputs: {self_awareness: [4,3,4], self_management: [3,3,4], social_awareness: [4,4,3], relationship: [3,4,3]}
    steps:
      - "Tổng từng domain: 11, 10, 11, 10"
      - "Tổng = 42 -> mức khá (41-50)"
      - "Domain thấp nhất (10/15): Self-Management và Relationship Management -> chọn một trong hai cho kế hoạch 90 ngày"
    result: "42/60 (khá); chọn 1 domain ưu tiên và nhờ người khác chấm để kiểm tra thiên kiến"
  - name: "Chọn phong cách lãnh đạo cho 3 tình huống"
    inputs: {tinh_huong: ["Cháy kho hàng", "Nhân viên mới vào cửa hàng", "Hai bộ phận Marketing và Sales mâu thuẫn về giá"]}
    steps:
      - "Cháy kho: Commanding trước (Self-Control, ra lệnh ngay), sau đó Affiliative chăm sóc nhóm"
      - "Nhân viên mới: Coaching + Affiliative (dạy kỹ năng, quan tâm); thời gian dài, không gấp"
      - "Mâu thuẫn hai bộ phận: Affiliative + Democratic, áp dụng khung Win-Win (lợi ích vs lập trường)"
    result: "Mỗi tình huống một tổ hợp 1-2 phong cách; Pacesetting/Commanding chỉ dùng khi thật cần"
  - name: "Phát hiện dấu hiệu EQ thấp trong tình huống Case 11 và đề xuất sửa"
    inputs: {hanh_vi: ["Họp 23h Chủ nhật", "Sa thải 3 người qua email không báo trước", "Đổi hướng 3 lần/quý không giải thích", "Nhận hết công trạng"]}
    steps:
      - "Ánh xạ domain: họp đêm = Đồng cảm thấp; sa thải qua email và đổi hướng thất thường = Tự kiểm soát thấp; nhận công trạng = Quản lý quan hệ thấp; không nhận ra quá tải = Tự nhận thức thấp"
      - "Chẩn đoán vòng xoáy: mất an toàn -> người giỏi đi trước -> thực thi giảm -> áp lực tăng -> nhà đầu tư từ chối"
      - "Đề xuất: 360 độ baseline, ranh giới giờ làm, giải thích lý do đổi hướng, chia sẻ công trạng, 1-1 định kỳ, coaching 90 ngày"
    result: "Kế hoạch can thiệp theo domain; kết quả của case là giả định minh họa"

practice_questions:
  - q: "Giải thích vì sao con số 'EQ dự báo 58% thành công' cần được trích thận trọng. Điều gì có cơ sở?"
    a: "Con số 58/25 được phổ biến bởi tài liệu thương mại, chưa có công bố học thuật rõ ràng nên là ước tính/minh họa. Có cơ sở: nghiên cứu competency (Goleman 1998) cho thấy năng lực cảm xúc/xã hội chiếm tỷ trọng lớn hơn năng lực kỹ thuật khi phân biệt người xuất sắc với trung bình và tăng ở cấp lãnh đạo cao."
  - q: "Anh/chị tự chấm Quản lý quan hệ 4,3; năm người khác chấm 2,4; 2,8; 2,2; 2,6; 3,0. Tính gap và nhận định."
    a: "TB người khác = 13,0/5 = 2,60; gap = 4,3 - 2,6 = +1,70 > 1 nên là điểm mù lớn; ưu tiên can thiệp (khen cụ thể, 1-1, ủy quyền) và cân nhắc yếu tố văn hóa: nhân viên VN có thể chấm cao hơn thực tế nên điểm thấp là tín hiệu khá mạnh."
  - q: "Quán có 40 nhân viên bình quân, 14 người nghỉ trong năm, lương năm 96 triệu/người, chi phí thay thế giả định 30%. Tính tỷ lệ nghỉ và tổng chi phí nghỉ việc."
    a: "Tỷ lệ = 14/40 = 35%. Chi phí thay 1 người = 0,30 x 96 = 28,8 triệu; tổng = 14 x 28,8 = 403,2 triệu VNĐ/năm (giả định minh họa)."
  - q: "Chương trình EQ chi phí 50 triệu làm số người nghỉ giảm từ 14 xuống 8 (chi phí thay 28,8 triệu/người). Tính ROI và payback."
    a: "Tránh được = 6 x 28,8 = 172,8 triệu; ròng = 122,8 triệu; ROI = 122,8/50 = 245,6%; payback = 50/(172,8/12) = 3,47 tháng. Cảnh báo giả định và theo dõi 12 tháng."
  - q: "Vì sao điểm tự đánh giá của chủ giảm sau can thiệp lại là tin tốt?"
    a: "Tự đánh giá giảm kèm điểm người khác tăng làm gap thu hẹp (từ +1,53 xuống +0,28 trong Hạt Nắng): chủ tự nhận thức chính xác hơn, bớt tự tin quá mức."
  - q: "Phân biệt mô hình mixed và ability; công cụ nào thuộc loại nào? Vì sao không nên so điểm trực tiếp?"
    a: "Mixed (Goleman/ESCI, Bar-On/EQ-i) gồm năng lực, tính cách, động lực; ability (Mayer-Salovey/MSCEIT) chỉ đo khả năng xử lý thông tin cảm xúc bằng test có đáp án. Đo thứ khác nhau và tương quan chỉ vừa phải nên không so trực tiếp."
  - q: "Chọn phong cách lãnh đạo: (a) cháy lớn; (b) deadline gấp, đội giàu kinh nghiệm; (c) công ty mất khách hàng lớn, đội mất động lực."
    a: "(a) Commanding rồi Affiliative; (b) Visionary + Pacesetting ngắn hạn, giải thích lý do; (c) Visionary (hướng mới) kèm Affiliative (hồi phục tinh thần), dùng Positive Outlook."
  - q: "Amygdala hijack là gì và quy trình xử lý?"
    a: "Amygdala kích hoạt quá mạnh, vượt vỏ não trước trán, gây phản ứng bốc đồng (đợt đầu khoảng 6-20 giây; 'quy tắc 6 giây' là mẹo). Quy trình: Detect (dấu hiệu cơ thể), Pause (dừng 6 giây/rời 2-5 phút, lưu Draft 1 giờ), Engage (thở 4-4-4, nghĩ hệ quả). Đây là mô hình đơn giản hóa."
  - q: "Tính điểm tự đánh giá 12 câu: Self-Awareness 5,4,4; Self-Management 2,3,3; Social 4,4,4; Relationship 3,3,2."
    a: "13 + 8 + 12 + 8 = 41 (mức khá, 41-50). Domain thấp nhất: Self-Management và Relationship Management (8/15)."
  - q: "Ở Việt Nam, nhân viên ít phản biện cấp trên có nghĩa EQ thấp không?"
    a: "Không nhất thiết: khoảng cách quyền lực cao và giữ thể diện khiến phản đối trực tiếp bị xem là thiếu tôn trọng; Influence có thể thể hiện gián tiếp. Điều chỉnh bảng hỏi, diễn giải cùng coach địa phương, tạo kênh phản hồi ẩn danh."
  - q: "Nêu 4 cạm bẫy khi ứng dụng EQ và cách phòng."
    a: "Dark EQ (đánh giá theo hành vi lặp lại và liêm chính), kiệt sức vì đồng cảm (ranh giới, tự chăm sóc, mentor), buzzword (đo - luyện - củng cố), lệch pha văn hóa (điều chỉnh công cụ)."
  - q: "Ba bước đầu của khung Win-Win trong xung đột giữa Marketing (muốn giá cao) và Sales (muốn giá thấp)?"
    a: "Tách người khỏi vấn đề (mô tả hành vi/tác động), hiểu lợi ích (margin vs dễ bán), động não phương án (tăng volume 30% để vẫn giữ margin ở giá thấp hơn)."

checklist:
  - "Chẩn đoán: đã đo EQ (hoặc công cụ tương đương) thay vì chỉ cảm thấy ổn; có ít nhất một nguồn phản hồi người khác (360, 1-1 thẳng thắn, khảo sát ẩn danh)?"
  - "So điểm tự đánh giá với điểm người khác để tìm điểm mù (gap > 1 trên thang 5)?"
  - "Chọn tối đa 1-2 lĩnh vực ưu tiên thay vì cố cải thiện cả bốn?"
  - "Thực hành cá nhân: thói quen dừng 5-10 giây (hoặc rời 5 phút) trước khi phản ứng lúc giận; nhật ký cảm xúc ít nhất 3 lần/tuần; có người báo cáo tiến độ; biết dấu hiệu cơ thể báo trước mất kiểm soát?"
  - "Lãnh đạo nhóm: biết mình lạm dụng phong cách nào (nhất là Pacesetting, Commanding); để người khác nói trước; nhân viên có thể nói 'tôi không đồng ý' hoặc báo tin xấu mà không sợ trả đũa; giao việc gấp có giải thích lý do và hỏi tải công việc; phản hồi cụ thể, trực tiếp, riêng tư?"
  - "Bối cảnh VN: hiểu giữ thể diện và góp ý gián tiếp/riêng tư; không đánh đồng ít phản biện cấp trên với EQ thấp; có kênh phản hồi ẩn danh?"
  - "Cạm bẫy: dùng EQ để hiểu và giúp, không thao túng; đặt ranh giới tránh kiệt sức vì đồng cảm; chương trình EQ có đo trước-sau, không chỉ một buổi workshop; gắn nhãn 'ước tính/minh họa' cho số liệu chưa kiểm chứng?"
  - "Duy trì: kế hoạch 90 ngày với mốc tuần 2, 8, 12; lịch đo lại 6-12 tháng; đang giúp người khác phát triển EQ (cố vấn lại)?"
  - "Khi trình bày ROI: đã ghi rõ giả định (tỷ lệ chi phí thay thế, giảm nghỉ việc do chương trình) và kế hoạch theo dõi 12 tháng?"
  - "Khi trích case nhân vật thật: đã nói rõ đây là nhận định phân tích từ thông tin công khai, không phải điểm ESCI thực?"

excel_google_sheets_templates:
  - name: "Bảng 360 độ và gap điểm mù"
    description: "Cột: domain, tự đánh giá, các điểm người đánh giá 1..n, trung bình người khác (=AVERAGE), gap (= tự - TB). Tô đỏ khi gap > 1. Thêm hàng trung bình 4 domain trước và sau can thiệp."
  - name: "Mô hình chi phí nghỉ việc và ROI chương trình EQ"
    description: "Input: lương tháng, nhân sự bình quân, số người nghỉ, r (giả định 30%), chi phí chương trình, số người nghỉ dự kiến sau. Output: tỷ lệ nghỉ, chi phí nghỉ trước/sau, chi phí tránh được, ROI = (tránh được - chương trình)/chương trình, payback tháng = chương trình / (tránh được/12). Ghi ô giả định riêng."
  - name: "Bảng điểm tự đánh giá EQ 12 câu"
    description: "12 dòng chấm 1-5 theo 4 domain, SUM từng domain và tổng; IF để gán mức (12-28, 29-40, 41-50, 51-60)."
  - name: "Nhật ký cảm xúc 7 mục (Google Sheets/Form)"
