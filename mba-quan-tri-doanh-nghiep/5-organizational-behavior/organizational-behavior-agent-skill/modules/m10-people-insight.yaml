# m10 - Thấu hiểu con người: bản đồ 7 tầng tâm lý (distill từ 10-people-insight.md)
# LƯU Ý GIỚI HẠN: đây là mô hình diễn giải thực hành do tác giả tổng hợp (Big Five, Jung, Maslow, tâm lý học xuyên cá nhân),
# KHÔNG phải kết quả nghiên cứu khoa học đã kiểm chứng. Không dùng để chẩn đoán tâm lý hay làm căn cứ duy nhất cho tuyển dụng/sa thải/thăng chức/phân biệt đối xử.
id: "m10"
name_vi: "Thấu hiểu con người - Bản đồ 7 tầng tâm lý (People Insight)"
name_en: "People Insight - The 7-Layer Personality Map"
purpose: >
  Cung cấp một mô hình DIỄN GIẢI (không phải mô hình khoa học kiểm chứng) để nhà quản lý/chủ SME đọc người có kỷ luật:
  tách hành vi quan sát được (Tầng 1-3) khỏi giả định, đặt giả thuyết thay vì gắn nhãn, kiểm chứng theo thời gian và đánh đổi,
  rồi điều chỉnh cách giao tiếp, giao việc, ghép đội và xử lý xung đột. Mô hình KHÔNG dùng để chẩn đoán tâm lý, và Tầng 5-7 mang
  tính triết học/tâm linh lý tưởng hóa, không dùng để đo hay xếp hạng con người.
when_to_use:
  - "Chuẩn bị gặp đối tác/ứng viên/nhân viên mới và muốn đọc phong cách giao tiếp, tránh bị ấn tượng đầu (hiệu ứng hào quang) đánh lừa."
  - "Chọn người cho vai trò (vd cửa hàng trưởng) bằng cách kết hợp mô hình với phỏng vấn có cấu trúc, ca làm thử và tham chiếu độc lập."
  - "Hiểu vì sao cùng một hành vi (làm thêm giờ, đổi việc liên tục, hay hỏi dồn) có thể do nhiều động cơ khác nhau, để dùng đúng đòn bẩy động viên."
  - "Điều chỉnh cách đối đáp/quản lý theo từng kiểu người (hướng nội, logic, động cơ an toàn, bất ổn cảm xúc...)."
  - "Chẩn đoán xung đột giữa hai người ở tầng nào (giao tiếp, xử lý thông tin, giá trị cốt lõi) trước khi can thiệp."
  - "Xây đội có vai trò bổ trợ nhau; kiểm tra các kết hợp tính cách rủi ro (vd hai người tham vọng quyền lực)."
  - "KHÔNG dùng để chẩn đoán bệnh lý, xếp hạng người 'giác ngộ', hay làm căn cứ duy nhất ra quyết định nhân sự."
prerequisites: ["m08"]
related_modules:
  - "m08 - Trí tuệ cảm xúc: nền tảng cho Tầng 2 (EQ, đồng cảm) và kỹ năng tự nhận thức (Tầng 4)"
  - "m01 - Động cơ thúc đẩy: Maslow, McClelland, Self-Determination Theory là gốc của Tầng 3 (động cơ cốt lõi)"
  - "m03 - Động lực nhóm: vai trò nhóm Belbin, ghép đội bổ trợ, kết hợp rủi ro"
  - "m06 - Quản lý xung đột: chẩn đoán xung đột theo tầng (Phụ lục D.3)"
  - "m02 - Phong cách lãnh đạo: điều chỉnh phong cách quản lý theo tính cách nhân viên (D.2)"
  - "m09 - Ra quyết định: thiên kiến nhận thức (halo, FAE) khi đánh giá người khác"
  - "m04 - Văn hóa tổ chức: ảnh hưởng của văn hóa 'nể' Việt Nam tới tín hiệu đồng ý/không đồng ý"

concepts:
  - term_vi: "Mô hình 7 tầng tâm lý (ẩn dụ cái cây)"
    term_en: "Seven-Layer Personality Map"
    definition: >
      Hệ thống 7 tầng từ bề mặt đến sâu: Tầng 1 Phản xạ (Vỏ), Tầng 2 Thích nghi & Xử lý (Thịt), Tầng 3 Bản sắc cốt lõi (Lõi),
      Tầng 4 Tự nhận thức & Chuyển hóa (Rễ), Tầng 5 Bản thể & Di sản (Nguồn), Tầng 6 Trường tâm thức biến đổi, Tầng 7 Toàn thể - Nguồn
      sáng tạo khởi nguyên. Tầng 1-3 quan sát được qua hành vi/lựa chọn; Tầng 4 quan sát gián tiếp; Tầng 5-7 lý tưởng/triết học.
    why_it_matters: >
      Nhắc người đọc rằng cái thấy ngay (Tầng 1) chỉ là vỏ, còn động cơ và nỗi sợ (Tầng 3) mới quyết định hành vi khi có đánh đổi.
      Nguồn: tác giả tổng hợp từ Big Five, Jung, Maslow, Transpersonal Psychology; các mốc thời gian (0-5 phút, 15-30 phút, vài tuần...)
      và ngưỡng trong tài liệu là ước lượng minh họa, KHÔNG phải kết quả nghiên cứu kiểm chứng. Giá trị thực dụng nhất: Tầng 1-3.
  - term_vi: "Tầng 1 - Phản xạ"
    term_en: "Reflex layer (Bark)"
    definition: >
      Biểu hiện bề mặt nhận ra trong 0-5 phút đầu: hướng ngoại/hướng nội, tự tin/rụt rè, cởi mở ấm áp/xa cách, chỉn chu kỷ luật/tự do phóng khoáng.
    why_it_matters: >
      Não tiết kiệm năng lượng nên quét nhanh bề mặt (nghiên cứu thin slices, Ambady và Rosenthal 1992). Nhưng đây là phần người ta chủ động
      trình diễn (Persona của Jung; Goffman 1959), nên vừa dễ đọc nhất vừa dễ sai nhất. Bốn cặp nét gần đúng với Extraversion, Agreeableness,
      Conscientiousness, Openness của Big Five, song phép gán ghép là diễn giải của tài liệu.
  - term_vi: "Tầng 2 - Thích nghi và Xử lý"
    term_en: "Adaptive & Processing layer"
    definition: >
      Cách tư duy, quản lý cảm xúc và tương tác khi có kích thích (tranh luận, sự cố nhỏ), thường lộ sau 15-30 phút trò chuyện sâu (ước lượng
      diễn giải): EQ/đồng cảm, logic vs cảm tính, ổn định cảm xúc (Neuroticism), hòa đồng vs cạnh tranh.
    why_it_matters: >
      Dựa nhiều nhất vào Big Five: giả thuyết từ vựng Allport và Odbert (1936), Cattell, Goldberg, rồi Costa và McCrae (thập niên 1980-1990, NEO-PI-R)
      chốt 5 chiều OCEAN. EQ do Salovey và Mayer (1990), Goleman (1995). Cặp logic/cảm tính gợi nhớ Thinking/Feeling của MBTI (Myers và Briggs, từ Jung 1921)
      nhưng MBTI có bằng chứng khoa học hạn chế, chỉ dùng như phong cách xử lý thông tin. Cần 15-30 phút vì hành vi chỉ lộ khi có kích thích.
  - term_vi: "Tầng 3 - Bản sắc cốt lõi"
    term_en: "Core Identity layer"
    definition: >
      Hệ giá trị và động cơ thầm kín: động cơ cốt lõi (quyền lực/thành tựu, an toàn, kết nối, tự do), niềm tin cốt lõi, vết sẹo tâm lý/cơ chế phòng vệ,
      tính chính trực. Lộ qua vài tuần đến vài tháng hoặc biến cố, thông qua hành động trong áp lực và lựa chọn đánh đổi.
    why_it_matters: >
      Quan trọng nhất với nhà quản trị: cùng hành vi (làm thêm giờ) có thể do thành tựu, sợ mất việc (an toàn) hay muốn được sếp quý (kết nối) nên dùng sai đòn bẩy
      (thưởng tiền cho người cần ghi nhận). Gốc ý tưởng: Maslow 1943, McClelland 1961 (thành tựu-quyền lực-liên kết), Deci và Ryan (SDT 1985/2000), Beck và Ellis (niềm tin/lược đồ),
      Jung (Shadow), Freud (cơ chế phòng vệ). Bốn nhóm động cơ là cách TỔNG HỢP của tác giả, không phải phân loại chuẩn hóa. Gần với revealed preference: lựa chọn phải đánh đổi mới lộ ưu tiên thật.
  - term_vi: "Tầng 4 - Tự nhận thức và Chuyển hóa"
    term_en: "Self-Awareness & Integration layer"
    definition: >
      Tự nhận thức (self-awareness), hợp nhất mặt tối (shadow integration), vượt nghịch cảnh và tìm ý nghĩa (resilience, meaning-making), tâm thức vượt ngã (transcendence).
      Là thang liên tục, cần quan sát nhiều tháng đến nhiều năm (ước lượng minh họa).
    why_it_matters: >
      Phân biệt người bị xiềng xích bởi bản năng với người nhận ra và làm chủ. Gốc: Individuation (Jung), Frankl 1946, Posttraumatic Growth (Tedeschi và Calhoun 1996),
      Maslow tự vượt (~1969-1971). Lưu ý nghiên cứu về tự nhận thức (Eurich 2018) cho thấy nhiều người tin mình tự nhận thức tốt hơn thực tế, nên phải quan sát hành vi, không chỉ lời tự nhận.
  - term_vi: "Tầng 5-7 (lý tưởng/triết học)"
    term_en: "Layers 5-7: Ontological, Field of Consciousness, Non-dual"
    definition: >
      Tầng 5 Bản thể và Di sản (vô ngã, thấu cảm phổ quát, tâm thức di sản, tự do tuyệt đối); Tầng 6 Trường tâm thức (flow tuyệt đối, im lặng nội tại, hiệu ứng trường, phi thời gian);
      Tầng 7 Toàn thể (bất nhị, sáng tạo từ hư không, đồng điệu quy luật vũ trụ, just being).
    why_it_matters: >
      Phần lớn là trạng thái LÝ TƯỞNG trong truyền thống tâm linh (Phật giáo, Đạo giáo, Vedanta), không kiểm chứng được. Phần có nền tảng: Generativity của Erikson 1950 (5.3), Flow của Csikszentmihalyi (6.1, chỉ là trạng thái tạm thời),
      Emotional Contagion của Hatfield, Cacioppo, Rapson 1993 (6.3: 'trường năng lượng' chỉ là ẩn dụ cho lây lan cảm xúc). 'Quantum Consciousness' gây tranh cãi, không dùng làm luận cứ.
      Cảnh báo: không dùng để xếp hạng ai 'giác ngộ'; thận trọng với người tự nhận ở tầng này (nguy cơ thao túng).
  - term_vi: "Mặt nạ xã giao"
    term_en: "Persona"
    definition: "Phần người ta chủ động trình diễn ở lần gặp đầu (Jung; Goffman 1959), có thể thật hoặc là lớp bảo vệ (vd nói to để che lo lắng)."
    why_it_matters: "Giải thích vì sao Tầng 1 phải luôn được kiểm chứng bằng Tầng 2-3 và vì sao một hành vi (nói to) có thể do hai nguyên nhân đối lập."
  - term_vi: "Hiệu ứng hào quang"
    term_en: "Halo effect"
    definition: "Một ấn tượng tốt (vd ăn nói lưu loát, cuốn hút) khiến ta tự động gán thêm nhiều phẩm chất tốt khác (vd 'chắc quản lý giỏi')."
    why_it_matters: "Nguồn đọc sai số 1 ở Tầng 1; trong case SME chị Lan suýt chọn người theo hiệu ứng này."
  - term_vi: "Sai lầm quy kết cơ bản"
    term_en: "Fundamental Attribution Error (Lee Ross, 1977)"
    definition: "Xu hướng gán hành vi nhất thời cho tính cách bền vững, bỏ qua hoàn cảnh."
    why_it_matters: "Lý do mọi nhận định về người khác chỉ là giả thuyết cần kiểm chứng qua nhiều bối cảnh và thời gian."
  - term_vi: "Thiên lệch mong muốn xã hội"
    term_en: "Social desirability bias"
    definition: "Khi bị hỏi thẳng 'anh/chị coi trọng điều gì', người ta trả lời theo hướng mình muốn được nhìn nhận."
    why_it_matters: "Là lý do phải quan sát cách phân bổ thời gian, tiền bạc, năng lượng và lý do ra quyết định thay vì chỉ hỏi trực tiếp (Phụ lục A)."
  - term_vi: "Thang liên tục, không phải nhãn"
    term_en: "Trait continuum"
    definition: "Big Five coi mỗi nét là thang liên tục; hai cực (EQ cao/thấp, logic/cảm tính) chỉ mô tả để dễ nhận diện, phần lớn mọi người ở giữa và thay đổi theo hoàn cảnh."
    why_it_matters: "Không cực nào tốt/xấu tuyệt đối (độ nhạy cảm cao có thể là lợi thế chăm sóc khách hàng nhưng bất lợi trong áp lực liên tục)."
  - term_vi: "Tâm linh giả"
    term_en: "Spiritual Bypassing (John Welwood, 1984)"
    definition: "Dùng ngôn ngữ 'vô ngã', 'bao dung tuyệt đối' để né trách nhiệm, che cảm xúc chưa giải quyết hoặc thao túng người khác."
    why_it_matters: "Dấu hiệu cảnh báo: đòi phục tùng, thu lợi vật chất/quyền lực từ người theo, không chịu phản biện, hành vi không nhất quán với lời nói. Kiểm chứng bằng hành vi nhiều năm, không bằng lời tự nhận."
  - term_vi: "Hành vi thô và giả thuyết"
    term_en: "Raw behavior vs hypothesis"
    definition: "Ghi lại hành vi quan sát được (nói to, ngắt lời) trước khi gán nhãn (hống hách); mỗi hành vi nổi bật cần ≥ 2 giả thuyết và ≥ 2-3 tín hiệu nhất quán."
    why_it_matters: "Biến đọc người từ 'đoán' thành quy trình kiểm định thu nhỏ, không chốt quá sớm và tránh biến ấn tượng đầu thành định kiến."

formulas:
  - id: "m10_turnover_rate"
    name_vi: "Tỷ lệ nghỉ việc"
    name_en: "Employee turnover rate"
    expression_latex: 'TR = \frac{N_{left}}{N_{total}} \times 100\%'
    expression_python: "n_left / n_total * 100"
    excel: "=B1/B2*100"
    variables:
      - {symbol: "n_left", meaning: "Số nhân sự nghỉ việc trong kỳ", unit: "người"}
      - {symbol: "n_total", meaning: "Tổng số nhân sự (đầu kỳ/bình quân)", unit: "người"}
    when_to_use: "Đo hiệu quả ghép người-việc và quản lý theo tính cách/động cơ (case chị Lan: 6/18 nghỉ trong 6 tháng). Tài liệu nguồn dùng phép chia đơn giản trên tổng nhân sự."
    why_it_works: "Chuyển cảm giác 'nhân viên nghỉ nhiều' thành một tỷ lệ so sánh được trước/sau khi đổi cách quản lý."
    assumptions: ["Cùng kỳ đo và cùng cách tính mẫu số trước/sau.", "Số liệu case là giả định minh họa."]
    pitfalls:
      - "Kết quả còn chịu ảnh hưởng mùa vụ, lương thưởng, thị trường; không chứng minh mô hình 7 tầng 'dự đoán đúng'."
    interpretation: "33,3% rất cao với quán 18 người; 5,6% sau cải thiện (giả định minh họa). Không có benchmark ngành trong nguồn."
    example:
      inputs: {n_left: 6, n_total: 18}
      steps: ["6/18 = 0,3333", "x100 = 33,3%"]
      result: "33,3% (sau cải thiện 1/18 = 5,6%)"
  - id: "m10_replacement_cost"
    name_vi: "Chi phí thay thế nhân sự"
    name_en: "Turnover replacement cost"
    expression_latex: 'C = N_{left} \times c'
    expression_python: "n_left * c"
    excel: "=B1*B2"
    variables:
      - {symbol: "n_left", meaning: "Số người nghỉ", unit: "người"}
      - {symbol: "c", meaning: "Chi phí thay thế bình quân mỗi người (đăng tuyển, đào tạo, hao hụt lúc mới vào) - GIẢ ĐỊNH 4,5 triệu trong case", unit: "triệu VNĐ/người"}
    when_to_use: "Lượng hóa thiệt hại trực tiếp của việc nghỉ việc để biện minh đầu tư vào tuyển đúng người/giữ chân."
    why_it_works: "Nhân số người nghỉ với chi phí thay thế bình quân cho ra thiệt hại trực tiếp, chưa gồm ảnh hưởng tới trải nghiệm khách."
    assumptions: ["c là ước tính của chủ quán, không phải số thực của doanh nghiệp nào."]
    pitfalls: ["Bỏ sót chi phí gián tiếp (năng suất, trải nghiệm khách)."]
    interpretation: "27 triệu (6 người) giảm còn 4,5 triệu (1 người): tiết kiệm 22,5 triệu trong 6 tháng (giả định minh họa)."
    example:
      inputs: {n_left: 6, c: 4.5}
      steps: ["6 x 4,5 = 27 triệu", "Sau: 1 x 4,5 = 4,5 triệu", "Tiết kiệm 27 - 4,5 = 22,5 triệu"]
      result: "27 triệu; tiết kiệm 22,5 triệu"
  - id: "m10_revenue_growth_pct"
    name_vi: "Tăng trưởng doanh thu theo %"
    name_en: "Revenue growth percentage"
    expression_latex: 'g = \frac{R_1 - R_0}{R_0} \times 100\%'
    expression_python: "(r1 - r0) / r0 * 100"
    excel: "=(B2-B1)/B1*100"
    variables:
      - {symbol: "r0", meaning: "Doanh thu tháng trước can thiệp", unit: "triệu VNĐ/tháng"}
      - {symbol: "r1", meaning: "Doanh thu tháng sau can thiệp", unit: "triệu VNĐ/tháng"}
    when_to_use: "Kiểm tra bằng số sau khi thay đổi quyết định nhân sự/cách quản lý (case: 140 lên 168 triệu/tháng)."
    why_it_works: "Chuẩn hóa mức tăng về % của mốc ban đầu để so sánh."
    assumptions: ["Số liệu giả định minh họa."]
    pitfalls: ["Tăng không đồng nghĩa nhân quả: mùa vụ, giá, khuyến mãi cũng tác động."]
    interpretation: "+28 triệu = +20% trong case giả định."
    example:
      inputs: {r0: 140, r1: 168}
      steps: ["168 - 140 = 28", "28/140 = 0,2", "x100 = 20%"]
      result: "+20%"

frameworks:
  - id: "m10_seven_layer_map"
    name_vi: "Bản đồ 7 tầng tâm lý"
    name_en: "Seven-Layer Personality Map"
    origin: "Tác giả tài liệu tổng hợp từ Big Five, Jung, Maslow, Transpersonal Psychology (cập nhật 6/2026). Là mô hình diễn giải, không phải nghiên cứu kiểm chứng."
    components:
      - "T1 Phản xạ (Vỏ): nóng nảy, ồn ào, rụt rè - công cụ: quan sát 30 giây-5 phút - câu hỏi: họ biểu hiện thế nào?"
      - "T2 Thích nghi (Thịt): EQ, logic/cảm tính, ổn định, hòa đồng/cạnh tranh - công cụ: trò chuyện 15-30 phút - họ giao tiếp ra sao?"
      - "T3 Cốt lõi (Lõi): động cơ, niềm tin, nỗi sợ, chính trực - công cụ: biến cố, xung đột, vài tuần/tháng - động cơ và nỗi sợ là gì?"
      - "T4 Chuyển hóa (Rễ): tự nhận thức, hợp nhất mặt tối, vượt nghịch cảnh - công cụ: cách nhận sai, phản tư - họ có nhận ra chính mình?"
      - "T5 Bản thể (Nguồn): vô ngã, thấu cảm phổ quát, di sản - rất khó đo, chỉ lý tưởng"
      - "T6 Trường tâm thức: flow, im lặng nội tại, hiệu ứng trường - ẩn dụ, không đo được"
      - "T7 Toàn thể: bất nhị, sáng tạo từ hư không - vượt ngoài hiểu biết, không đo được"
    when_to_use: "Khung tổng quan để định vị mình đang đọc người ở độ sâu nào. Thực dụng ở Tầng 1-3; Tầng 4 gián tiếp; Tầng 5-7 chỉ chiêm nghiệm."
    how_to_apply:
      - "Xác định tầng của hành vi đang quan sát (bề mặt, xử lý, động cơ)."
      - "Chỉ kết luận ở Tầng 3 khi đã có biến cố/đánh đổi hoặc nhiều tuần quan sát."
      - "Dùng Tầng 1-3 cho giao tiếp, quản trị đội; dùng Tầng 4 để chọn cố vấn/đồng hành và tự phản tư; không dùng Tầng 5-7 để xếp hạng."
    how_to_read_results: "Hành vi cùng bề mặt có thể thuộc động cơ khác nhau; mọi nhận định là giả thuyết cần kiểm chứng đa bối cảnh."
    pitfalls:
      - "Coi các mốc thời gian (0-5 phút, 15-30 phút) là chuẩn khoa học."
      - "Dùng Tầng 6-7 xếp hạng người 'giác ngộ' hoặc tin người tự nhận ở tầng này."
    example: "Tầng 1 thấy 'nói to'; Tầng 2 thấy khó nhận sai; Tầng 3 (sau ca làm thử, tham chiếu) mới thấy động cơ quyền lực và quan hệ đồng nghiệp."

  - id: "m10_three_step_reading"
    name_vi: "Quy trình 3 bước đọc người nhanh"
    name_en: "Observe - Trigger - Confirm"
    origin: "Phần 12.1: logic kiểm định khoa học thu nhỏ (giả thuyết, thử nghiệm, lặp lại)."
    components:
      - "Bước 1 QUAN SÁT (0-5 phút): tư thế mở/đóng, ai bắt đầu trò chuyện, cử chỉ thư giãn/căng thẳng; hỏi 'họ đang thể hiện hay đang bảo vệ?'"
      - "Bước 2 KÍCH HOẠT (15-30 phút): tình huống nhẹ có yếu tố bất ngờ, câu hỏi 'Tại sao' về quyết định lớn, để họ kể người họ ngưỡng mộ; hỏi 'xử lý thế nào khi bị kích thích?'"
      - "Bước 3 XÁC NHẬN (theo thời gian): hành vi khi không ai nhìn, cách đối xử người không quyền lực, phản ứng khi không đạt điều muốn; hỏi 'họ nhất quán không?'"
    when_to_use: "Mọi lần cần đọc người: gặp đối tác, tuyển dụng, ghép đội."
    how_to_apply:
      - "Ghi hành vi thô ở Bước 1, đặt ≥ 2 giả thuyết."
      - "Bước 2: dùng cùng bộ câu hỏi/tình huống cho mọi người (công bằng)."
      - "Bước 3: ca làm thử, tham chiếu độc lập, quan sát qua nhiều bối cảnh trước khi kết luận."
    how_to_read_results: "Điều quan trọng không phải đoán đúng ngay mà là không chốt quá sớm."
    pitfalls: ["Dừng ở Bước 1 rồi kết luận.", "Kích hoạt bằng cách dồn dập như thẩm vấn; nếu đối phương khó chịu thì dừng."]
    example: "Case anh Dũng - ông Khải (giả định): 6 bước từ ghi nhận tín hiệu tới kiểm chứng sau hai buổi, xác nhận 'tự tin bù trừ'."

  - id: "m10_hypothesis_analysis"
    name_vi: "Phân tích giả thuyết 6 bước (chống 'hiệu ứng lừa dối' lần đầu gặp)"
    name_en: "Six-step hypothesis analysis"
    origin: "Tình huống minh họa (giả định) anh Dũng và ông Khải trong Tầng 1."
    components:
      - "1 Ghi nhận tín hiệu: mô tả hành vi thô, chưa gán nhãn"
      - "2 Đặt ≥ 2 giả thuyết (vd hướng ngoại tự tin thật vs lo lắng dùng ồn ào lấp bất an)"
      - "3 Tìm tín hiệu kiểm chứng khó 'diễn' (im lặng 5 giây, nghịch bút, giọng nhỏ dần sau 15 phút)"
      - "4 Đọc kết quả: so khớp tín hiệu với từng giả thuyết"
      - "5 Điều chỉnh đối đáp theo giả thuyết mạnh hơn, sẵn sàng sửa"
      - "6 Kiểm chứng theo thời gian, nhiều bối cảnh"
    when_to_use: "Khi hành vi bề mặt nổi bật và dễ gán nhãn vội (nói to, im lặng, đến muộn)."
    how_to_apply: ["Đi đúng 6 bước; cần ít nhất 2-3 tín hiệu nhất quán trước khi tin."]
    how_to_read_results: "Một lần gặp cho giả thuyết, không cho kết luận; cùng hành vi nói to có thể do hai nguyên nhân đối lập."
    pitfalls: ["Chốt nhãn ngay ở bước 1.", "Bỏ qua bối cảnh văn hóa (tránh eye contact có thể là lễ phép với người lớn tuổi, không phải rụt rè)."]
    example: "Ông Khải nói to nhưng im lặng 5 giây thì nghịch bút, mắt đảo: nghiêng về giả thuyết lo lắng bù trừ; anh Dũng ghi nhận thành tích thật và đưa số liệu rõ để ông bớt 'gồng'."

  - id: "m10_layer1_traits"
    name_vi: "Tầng 1 - Sáu nét bề mặt và cách đối đáp"
    name_en: "Layer 1 traits & response"
    origin: "Chương 8 (heuristic minh họa, cặp nét gần đúng với Big Five)."
    components:
      - "8.1 Hướng ngoại: chủ động bắt chuyện, cử chỉ nhiều, chia sẻ cá nhân sớm. Đối đáp: để họ dẫn dắt, phản hồi nhiệt tình, tránh im lặng kéo dài/lạnh ngắn. Cảnh báo: người hướng nội lo âu xã hội có thể 'giả hướng ngoại', sau 15 phút trầm hơn."
      - "8.2 Hướng nội: nói ít nhưng có trọng lượng, nghĩ 2-3 giây trước trả lời. Đối đáp: cho thời gian, hỏi câu sâu cụ thể từng câu một, tạo không gian 1-1; đừng nhầm với lạnh lùng/kiêu ngạo."
      - "8.3 Tự tin: thẳng lưng, bắt tay chắc, không xin lỗi vô cớ. Đối đáp: ngang hàng, nêu quan điểm trực tiếp, không nịnh. Phân biệt tự tin thật (thoải mái khi người khác giỏi hơn) và kiêu ngạo (hạ thấp người khác khi bị đe dọa)."
      - "8.4 Rụt rè/lo âu: nghịch đồ vật, tự vỗ an, giọng lên cuối câu, hay 'không biết có đúng không nhưng...'. Đối đáp: chủ động tạo an toàn, câu dễ trước, khen cụ thể, không ngắt lời/chỉ trích trước đám đông."
      - "8.5 Chỉn chu/kỷ luật: đến sớm/đúng giờ, ghi chép, khó chịu khi đổi kế hoạch. Đối đáp: đúng giờ, gửi agenda trước, xác nhận bằng văn bản. Lưu ý: cực đoan thành cầu toàn/vi quản; đừng coi người đến muộn là thiếu kỷ luật (kẹt xe)."
      - "8.6 Phóng khoáng: ngẫu hứng, ít kế hoạch nhưng ứng biến, ngột ngạt với quy trình cứng. Đối đáp: linh hoạt hình thức, quản lý theo kết quả; thống nhất 'khung cứng tối thiểu' (deadline, chất lượng, an toàn/tài chính)."
    when_to_use: "Phần đầu cuộc gặp để điều chỉnh phong cách giao tiếp."
    how_to_apply: ["Ghi hành vi thô.", "Chọn đối đáp tương ứng.", "Luôn kiểm tra lại ở Tầng 2-3."]
    how_to_read_results: "Mỗi cặp là thang liên tục; phần lớn người ở giữa và thay đổi theo hoàn cảnh."
    pitfalls: ["Hiệu ứng hào quang, sai lầm quy kết cơ bản, khác biệt văn hóa dẫn tới đọc sai."]
    example: "Tuyển dụng: Khoa (hướng ngoại, tự tin) vs Vy (hướng nội, chỉn chu): bề mặt chưa nói gì về năng lực quản lý."

  - id: "m10_layer2_traits"
    name_vi: "Tầng 2 - Tám kiểu xử lý và cách đối đáp"
    name_en: "Layer 2 traits & response"
    origin: "Chương 9 (heuristic minh họa, dựa Big Five + EQ + MBTI Thinking/Feeling ở mức phong cách)."
    components:
      - "9.1 EQ cao: đổi chủ đề khi người khác không thoải mái, nhớ chi tiết, nói 'tôi hiểu cảm giác đó' và mô tả được. Đối đáp: chia sẻ thật, đừng lạnh lùng thuần lý tính, không lợi dụng. Cảnh báo: EQ cao vẫn có thể kiệt sức cảm xúc."
      - "9.2 EQ thấp: cắt lời đưa giải pháp, chuyển chủ đề sang bản thân. Đối đáp: nói trực tiếp, nói thẳng cảm xúc của bạn bằng lời, tận dụng điểm mạnh kết quả; ghép với người EQ cao."
      - "9.3 Logic/lý trí: hỏi nguồn dữ liệu, trả lời 'thứ nhất, thứ hai', ưa sơ đồ. Đối đáp: số liệu, cấu trúc Vấn đề - Nguyên nhân - Giải pháp, cho thời gian phân tích; không dùng 'tôi cảm thấy'."
      - "9.4 Cảm tính/trực giác: 'tôi cảm thấy', ẩn dụ, quyết nhanh theo cảm nhận. Đối đáp: storytelling, nối ý tưởng với tác động con người; không công kích bằng 'bạn có bằng chứng không?'."
      - "9.5 Ổn định cảm xúc: bình tĩnh khi sự cố, giọng đều. Đối đáp: thẳng thắn, giao áp lực, làm neo cho nhóm. Cảnh báo: bình tĩnh bên ngoài chưa chắc ổn bên trong (kìm nén), hỏi thăm định kỳ."
      - "9.6 Bất ổn cảm xúc (Neuroticism cao): phản ứng mạnh sự cố nhỏ, thảm họa hóa, hay xin xác nhận. Đối đáp: rõ ràng, chắc chắn, phản hồi nhẹ có điểm tích cực trước, xác nhận tiến độ thường xuyên; không phê bình trước đám đông. Mô tả hành vi, không phải chẩn đoán."
      - "9.7 Hòa đồng/khiêm tốn: khen ý kiến người khác trước, nói về nhóm. Đối đáp: ghi nhận, hỏi ý kiến trực tiếp, không lấn át. Cảnh báo: hòa đồng không phải dễ bảo; có thể 'ừ cho xong' (văn hóa 'nể' ở VN), hỏi 'Nếu không sợ mất lòng thì anh/chị nghĩ sao?'."
      - "9.8 Cạnh tranh/thể hiện: hướng chuyện về thành tích, bác bỏ ý kiến, khó nhận sai, dễ bị đe dọa bởi người giỏi hơn. Đối đáp: cho vai trò dẫn đầu/được công nhận, thách thức tích cực, không đối đầu trước đám đông, cho 'thắng' ở điểm không quan trọng."
    when_to_use: "Sau 15-30 phút trò chuyện hoặc khi có kích thích để chọn cách thuyết phục, giao việc, phản hồi."
    how_to_apply: ["Đưa một kích thích nhẹ (sự cố giả định, câu hỏi 'lần cuối đổi ý').", "Quan sát phản ứng.", "Điều chỉnh hình thức giao tiếp, không đổi nội dung sự thật."]
    how_to_read_results: "Cực nào cũng có lợi thế/bất lợi tùy bối cảnh; tìm cụm tín hiệu thay vì một dấu hiệu đơn lẻ."
    pitfalls: ["Chốt kết luận từ một tình huống (người có thể căng thẳng vì đang phỏng vấn).", "Dùng nhãn 'bất ổn cảm xúc' như chẩn đoán lâm sàng."]
    example: "Hai trưởng nhóm bán hàng: chị A (logic) muốn số liệu, anh B (cảm tính) muốn câu chuyện: xung đột Tầng 2, giải bằng mẫu báo cáo 2 phần."

  - id: "m10_layer3_core_drivers"
    name_vi: "Tầng 3 - Bốn động cơ cốt lõi"
    name_en: "Four core drivers"
    origin: "Phần 3.1, 10.1-10.4: tổng hợp của tác giả từ Maslow 1943, McClelland 1961, Deci-Ryan SDT; không phải phân loại chuẩn hóa."
    components:
      - "Quyền lực/Thành tựu: tầm nhìn 5-10 năm, hy sinh thời gian cho sự nghiệp, bực khi bị kiểm soát/hạ thấp. Cần: dự án thấy rõ tác động, vùng tự chủ, ghi nhận công khai. Không: qua mặt, dùng như công cụ. Ranh giới: tham vọng lành mạnh nâng đỡ người khác, độc hại giẫm đạp."
      - "An toàn/Ổn định: ngại rủi ro, hỏi nhiều, quyết chậm, tích lũy. Cần: thông tin đầy đủ, plan B và C, chứng minh KHÔNG làm mới là rủi ro lớn hơn. Không: thúc quyết nhanh, đổi kế hoạch đột ngột."
      - "Kết nối/Yêu thương: nói 'chúng ta', khó từ chối người thân, sẵn sàng chịu thiệt, sợ bị bỏ rơi. Cần: cảm giác thuộc về, được cần. Không: lạnh lùng, lợi dụng lòng trung thành."
      - "Tự do/Trải nghiệm: ghét ràng buộc, đổi hướng thường xuyên, ngại cam kết dài hạn. Cần: tự chủ cách làm, ngôn ngữ lựa chọn, thử thách mới. Không: vi quản, deadline dày đặc, ép cam kết sớm."
    when_to_use: "Khi cần chọn đúng đòn bẩy động viên/giữ chân hoặc hiểu hành vi bề mặt giống nhau nhưng động cơ khác."
    how_to_apply:
      - "Nhìn thứ họ sẵn sàng hy sinh khi phải chọn (tiền hay thời gian bên gia đình)."
      - "Dùng Phụ lục A (3 nguồn lực, hệ quy chiếu, quyết định quá khứ, phản ứng nghịch cảnh) để tìm giả thuyết động cơ."
      - "Chọn phần thưởng/giao việc khớp động cơ."
    how_to_read_results: "Động cơ là giả thuyết; ưu tiên thật chỉ lộ khi có chi phí (revealed preference)."
    pitfalls: ["Gắn nhãn thành định kiến; mô tả hành vi cụ thể thay vì gắn nhãn người.", "Nhầm: thưởng tiền cho người cần ghi nhận; giao thêm việc cho người cần an toàn."]
    example: "Khoa đổi việc 3 lần trong 2 năm vì muốn lên quản lý sớm: giả thuyết động cơ quyền lực/thành tựu; Vy gắn bó 4 năm, giữ liên lạc đội cũ: kết nối/an toàn (giả định minh họa)."

  - id: "m10_layer3_beliefs_integrity"
    name_vi: "Tầng 3 - Niềm tin cốt lõi, vết sẹo, tính chính trực"
    name_en: "Core beliefs, shadow, integrity"
    origin: "Mục 3.2-3.4, 10.5-10.8: Beck, Ellis (niềm tin/lược đồ), Jung (Shadow), Freud (phòng vệ)."
    components:
      - "Niềm tin tích cực (10.5): dễ tin, tìm bài học, cho cơ hội thứ hai. Đối đáp: trung thực, không lợi dụng niềm tin."
      - "Niềm tin tiêu cực/độc hại (10.6): hoài nghi, kiểm tra mọi thông tin, 'mình đã bị lừa một lần rồi'. Đối đáp: xây niềm tin từng bước nhỏ, nhất quán lời-hành động, không đòi tin tưởng ngay, không cố đổi niềm tin bằng lời. Đây là mô tả hành vi, không phải chẩn đoán."
      - "Vết sẹo và cơ chế phòng vệ (3.3): sợ bị bỏ rơi dẫn tới chiếm hữu/đẩy người ra; sợ bị coi thường dẫn tới ái kỷ, không nhận sai. Không khai thác vết sẹo để thao túng."
      - "Chính trực cao (10.7): hành xử như nhau khi có/không có người nhìn, nói thật dù bất lợi, từ chối đi tắt. Đối đáp: giao vai trò trách nhiệm cao, không đề xuất đường tắt phi đạo đức."
      - "Cơ hội chủ nghĩa (10.8): nguyên tắc đổi theo lợi ích, nói một làm một, đổ lỗi khi bị góc tường. Đối đáp: ghi thỏa thuận bằng văn bản, xác nhận hành động thật, không chia sẻ thông tin nhạy cảm, tương tác giới hạn."
    when_to_use: "Đánh giá mức tin cậy trước hợp tác quan trọng; quản lý rủi ro với người có dấu hiệu thao túng."
    how_to_apply: ["Quan sát khi không ai nhìn và khi lợi ích cá nhân xung đột lợi ích tập thể.", "Xác thực track record qua người thứ ba."]
    how_to_read_results: "Chính trực = nhất quán nguyên tắc bất kể hoàn cảnh; cơ hội = đổi nguyên tắc theo lợi ích trước mắt."
    pitfalls: ["Nhãn 'độc hại', 'cơ hội' dễ thành định kiến; chỉ mô tả hành vi quan sát được."]
    example: "Tham chiếu cũ: Khoa 'bán hàng giỏi, hay mâu thuẫn đồng nghiệp'; Vy 'đáng tin, chưa trễ ca, ngại phát biểu họp'."

  - id: "m10_layer4_transformation"
    name_vi: "Tầng 4 - Tự nhận thức và vượt nghịch cảnh"
    name_en: "Self-awareness & resilience layer"
    origin: "Mục 4.1-4.4, 11.1-11.2: Jung (individuation), Frankl 1946, Tedeschi và Calhoun 1996, Maslow (tự vượt)."
    components:
      - "Tự nhận thức cao (11.1): nêu điểm yếu cụ thể ('tôi hay nổi nóng khi bị gián đoạn'), không phòng thủ khi bị phê bình, nhận ra tức giận TRƯỚC khi hành động, xin lỗi cụ thể. Đối đáp: nói thẳng, feedback khó nghe; có thể nhờ làm trung gian hòa giải."
      - "Hợp nhất mặt tối (4.2): người ham quyền lực chuyển năng lượng thành quyết đoán bảo vệ kẻ yếu/lãnh đạo thay vì bắt nạt."
      - "Vượt nghịch cảnh (11.2): kể thất bại không cay đắng, chuyển từ 'tại sao lại tôi' sang 'bài học gì', không tự định nghĩa mình là thất bại. Giao vai Crisis Manager/Problem Solver."
      - "Vượt ngã (4.4): bao dung, hướng lợi ích chung; lý tưởng."
    when_to_use: "Chọn cố vấn, đồng sáng lập, người dẫn dắt dự án rủi ro; tự phản tư."
    how_to_apply: ["Quan sát cách họ nhận lỗi, phục hồi sau biến cố trong nhiều tháng đến nhiều năm.", "Đối chiếu hành vi, không chỉ lời tự nhận (Eurich 2018)."]
    how_to_read_results: "Thang liên tục, không đạt/không đạt; mốc thời gian chỉ là ước lượng minh họa."
    pitfalls: ["Tin lời tự nhận 'tôi rất tự nhận thức'.", "Bao bọc người kiên cường quá mức."]
    example: "Người kể 'và đó là lúc mình học được...' về thất bại lớn nhất, phục hồi nhanh hơn người khác sau biến cố."

  - id: "m10_layer5_7_ideals"
    name_vi: "Tầng 5-7 - Trạng thái lý tưởng và nguyên tắc dùng"
    name_en: "Layers 5-7 (idealized)"
    origin: "Chương 5-7, 11.3-11.5: Transpersonal Psychology (Journal of Transpersonal Psychology 1969: Maslow, Grof, Sutich), Erikson 1950, Csikszentmihalyi, Hatfield 1993, Advaita Vedanta/Thiền/Đạo giáo."
    components:
      - "T5: vô ngã (không phản ứng khi bị xúc phạm/ca ngợi), thấu cảm phổ quát, tâm thức di sản (Generativity), tự do tuyệt đối"
      - "T6: flow tuyệt đối (Wu-wei là khái niệm Đạo giáo, không phải thuật ngữ lâm sàng), im lặng nội tại, hiệu ứng trường (giải thích khoa học: lây lan cảm xúc, 'năng lượng' chỉ là ẩn dụ), phi thời gian"
      - "T7: bất nhị, sáng tạo từ hư không (mô tả tâm linh/ẩn dụ; phát kiến thực vẫn đến từ làm việc kiên trì), đồng điệu quy luật vũ trụ, just being"
    when_to_use: "Chỉ để chiêm nghiệm, định hướng phát triển bản thân."
    how_to_apply:
      - "Không đo, không xếp hạng; không dùng tuyển dụng/đánh giá nhân sự."
      - "Bao dung không có nghĩa bỏ qua sai phạm: kiểm chứng người còn chịu trách nhiệm cụ thể với hành động và hậu quả."
      - "Không dùng triết lý ('mọi thứ đều ổn', 'đó chỉ là nghiệp') biện minh hành vi gây hại."
    how_to_read_results: "Nếu ai đó tự nhận ở Tầng 5-7 và đòi phục tùng, thu lợi, không chịu phản biện, hành vi không nhất quán: cảnh báo tâm linh giả."
    pitfalls: ["Đặt người lên 'bệ thờ'.", "Dùng 'quantum consciousness' làm luận cứ (gây tranh cãi)."]
    example: "Hiệu ứng trường thực dụng: người bình tĩnh làm môi trường bình tĩnh; kỹ năng này có thể tập luyện."

  - id: "m10_value_extraction"
    name_vi: "Kỹ thuật khai thác giá trị cốt lõi lần đầu gặp (Phụ lục A)"
    name_en: "Core value extraction techniques"
    origin: "Phụ lục A: quan sát hành vi thay vì hỏi thẳng vì social desirability bias; các phép suy diễn là heuristic minh họa."
    components:
      - "A.1 Ba nguồn lực: thời gian/tiền/năng lượng. Hết thời gian cho công việc/học tập: Thành tựu; gia đình: Gắn kết; học/đọc/trải nghiệm: Phát triển bản thân."
      - "A.2 Hệ quy chiếu khi phán xét người khác: khen 'giỏi, giàu, quyền lực': Vật chất/địa vị; 'tử tế, trung thực': Đạo đức/chính trực; chỉ trích 'lười, kém': cầu tiến cao có thể kèm khắt khe/đố kỵ (có thể là phóng chiếu, chỉ là một khả năng)."
      - "A.3 Lý do các quyết định lớn: 'lương cao/thăng tiến': thực tế, tài chính, quyền lực; 'môi trường thoải mái, sếp tâm lý': an toàn/cảm xúc; 'thử thách bản thân': đổi mới."
      - "A.4 Phản ứng sự cố nhỏ: đổ lỗi, đóng vai nạn nhân: bảo vệ cái tôi, thiếu trách nhiệm; tìm giải pháp, điềm tĩnh: hiệu quả, lý trí, trách nhiệm."
      - "Công thức lồng ghép: Khen/đồng cảm, rồi hỏi 'Tại sao/Như thế nào', rồi lắng nghe và đúc kết (nhắc lại ý chính)."
    when_to_use: "Gặp lần đầu muốn đọc động cơ mà không thẩm vấn."
    how_to_apply: ["Hỏi nhẹ về cuối tuần, dự án mới, cơ duyên đổi việc.", "Cần ≥ 2-3 tín hiệu nhất quán.", "Dừng nếu đối phương khó chịu."]
    how_to_read_results: "Mỗi dấu hiệu là một giả thuyết."
    pitfalls: ["Hỏi dồn dập như thẩm vấn.", "Coi suy diễn là quy luật."]
    example: "Chuyển ngành vì 'chỗ đó lương cao hơn': động cơ thực tế/tài chính."

  - id: "m10_question_bank"
    name_vi: "Bộ câu hỏi thực chiến theo tầng (Phụ lục B)"
    name_en: "Layer-based question bank"
    origin: "Phụ lục B."
    components:
      - "B.1 Tầng 1 (vài phút): 'Đến đây bằng phương tiện gì?' (chuẩn bị/đúng giờ); 'Hay đến sự kiện này không?' (hướng ngoại/nội); 'Cuối tuần làm gì để nạp năng lượng?'; 'Thấy không gian thế nào?' (chi tiết/kỷ luật vs cảm nhận chung/phóng khoáng)"
      - "B.2 Tầng 2 (15-20 phút): 'Ra quyết định dựa trên điều gì?'; 'Khi trong nhóm có người ý kiến khác?'; 'Lần cuối đổi quan điểm vì người khác?'; 'Cảm thấy thế nào khi kế hoạch bị đổi đột ngột?'"
      - "B.3 Tầng 3 (nhiều buổi/khi đã tin): 'Nếu chọn lại, đổi quyết định lớn nào?'; 'Điều gì sợ nhất khi nghĩ tương lai?'; 'Người ngưỡng mộ nhất và tại sao?'; 'Khi không ai nhìn, làm điều gì thường ngại?'"
      - "B.4 Niềm tin: 'Phần lớn người ta tin được không?'; 'Thành công do nỗ lực hay may mắn?'; 'Khi thất bại, điều đầu tiên nghĩ đến?'"
    when_to_use: "Phỏng vấn, họp 1-1, làm quen đối tác."
    how_to_apply: ["Dùng cùng bộ câu hỏi cho mọi người được đánh giá.", "Đặt câu từng câu, chờ trả lời."]
    how_to_read_results: "Câu trả lời cụ thể (kể được câu chuyện) thường mạnh hơn trả lời chung chung; vẫn chỉ là giả thuyết."
    pitfalls: ["Hỏi quá sớm câu Tầng 3 khi chưa có tin tưởng.", "Diễn giải máy móc."]
    example: "Hỏi 'Lần cuối anh/chị đổi quan điểm': Vy kể được câu chuyện cụ thể về đổi cách xếp ca; Khoa ngần ngại."

  - id: "m10_compatibility_matrix"
    name_vi: "Ma trận phối hợp: ai hợp với ai"
    name_en: "Pairing matrix"
    origin: "Mục 12.2: minh họa dựa kinh nghiệm quản trị, tương tự Belbin (Team Roles at Work 1993), không phải đo lường định lượng."
    components:
      - "Phối hợp tốt (bổ sung): Logic + Cảm tính; Hướng ngoại + Hướng nội (đội bán hàng); Tham vọng + Ổn định (lãnh đạo + vận hành); Sáng tạo + Kỷ luật (khởi nghiệp bền vững); EQ cao + IQ cao"
      - "Cần cẩn thận (khuếch đại điểm yếu): 2 người tham vọng quyền lực (cạnh tranh nội bộ); 2 người bất ổn cảm xúc (khuếch đại nhau); Người tự do + Người kỷ luật (xung đột cách làm); Niềm tin tiêu cực + Cởi mở (mâu thuẫn niềm tin)"
    when_to_use: "Chọn cặp đồng sáng lập, tổ hợp lãnh đạo-vận hành, ghép ca."
    how_to_apply: ["Xác định vai trò cần bổ trợ.", "Kiểm tra cặp rủi ro; thiết kế ranh giới nếu buộc phải ghép."]
    how_to_read_results: "Cặp tốt thường bổ sung nhau; cặp rủi ro khuếch đại cùng điểm yếu."
    pitfalls: ["Coi ma trận là công thức đã kiểm chứng."]
    example: "Chọn Vy làm cửa hàng trưởng (ổn định) và Khoa làm bán hàng/sự kiện (tham vọng) theo cặp Tham vọng + Ổn định."

  - id: "m10_emotion_keywords"
    name_vi: "Bảng từ khóa cảm xúc theo tầng"
    name_en: "Emotion keywords by layer"
    origin: "Mục 12.3."
    components:
      - "T1 bề mặt: hứng khởi, lo lắng, phấn chấn, bối rối, tự hào, xấu hổ, thoải mái, căng thẳng, bất an, dè dặt, cởi mở"
      - "T2 xử lý: đồng cảm, kiên nhẫn, thất vọng, hài lòng, ngờ vực, ghen tị, ngưỡng mộ, tức giận kiềm chế, tò mò"
      - "T3 cốt lõi: sợ bị bỏ rơi, khao khát được công nhận, cô đơn sâu, sợ thất bại, sợ mất kiểm soát, tham vọng cháy bỏng, tình yêu hy sinh, nỗi sợ vô nghĩa"
      - "T4 chuyển hóa: bình yên sau bão, chấp nhận không cam chịu, biết ơn, tự do nội tâm, nhẹ nhõm sau nhận lỗi"
      - "T5-7: hiện diện thuần khiết, bình yên tuyệt đối, tình thương vô điều kiện, vô vi, tự tại"
    when_to_use: "Nghe người kể chuyện để thấy họ chạm từ khóa tầng nào."
    how_to_apply: ["Chú ý khi họ dùng từ tầng sâu khi nói chuyện nhỏ.", "Dùng đó làm tín hiệu để hỏi thêm, không để kết luận."]
    how_to_read_results: "Từ ở Tầng 3 gắn nỗi sợ/khao khát sâu."
    pitfalls: ["Kết luận từ một từ."]
    example: "Nói 'sợ bị coi là tầm thường' khi bàn việc nhỏ: gợi ý hỏi thêm về động cơ thành tựu."

  - id: "m10_golden_rules"
    name_vi: "5 nguyên tắc vàng khi đọc người"
    name_en: "Five golden rules"
    origin: "Mục C.2."
    components:
      - "1 Quan sát hành động, không phải lời nói"
      - "2 Nhìn cách họ đối xử với người yếu hơn (phục vụ, lễ tân, nhân viên cấp thấp)"
      - "3 Đặt câu hỏi 'Tại sao', không chỉ 'Cái gì'"
      - "4 Thời gian là bộ lọc tốt nhất (mặt nạ rơi sau đủ thời gian và áp lực)"
      - "5 Không phán xét, chỉ quan sát và thích nghi (hiểu để thích nghi, không để phán xét)"
    when_to_use: "Nguyên tắc nền cho mọi tình huống."
    how_to_apply: ["Dùng làm checklist trước khi chốt nhận định."]
    how_to_read_results: "Nếu nhận định dựa chủ yếu vào lời nói/ấn tượng đầu thì chưa đủ."
    pitfalls: ["Chỉ thuộc lòng mà không đối chiếu hành vi."]
    example: "Ca làm thử: Khoa giao việc dồn dập cho bạn rửa ly mới; Vy hỏi tên và hướng dẫn kỹ."

  - id: "m10_risky_combinations"
    name_vi: "Bảng cảnh báo kết hợp tính cách rủi ro"
    name_en: "Risky combinations"
    origin: "Mục C.3 (minh họa dựa kinh nghiệm quản trị)."
    components:
      - "Động cơ quyền lực + Niềm tin tiêu cực + EQ thấp: thao túng, kiểm soát, không nhận sai; rủi ro toxic leadership. Bảo vệ: ghi chép, có nhân chứng"
      - "Cạnh tranh cao + Bất ổn cảm xúc: nổi giận khi thua, trả thù; tránh đụng chạm ego công khai"
      - "Động cơ kết nối + Niềm tin tiêu cực: chiếm hữu, ghen tuông; đặt ranh giới rõ từ đầu"
      - "Tư duy cảm tính + Bất ổn cảm xúc: quyết định bốc đồng, hối hận; yêu cầu cool-down trước quyết định lớn"
      - "Hướng ngoại + Cơ hội chủ nghĩa: quyến rũ, tạo niềm tin nhanh rồi lợi dụng; xác thực track record qua người thứ ba"
    when_to_use: "Trước hợp tác quan trọng, góp vốn, giao quyền."
    how_to_apply: ["Đối chiếu hành vi quan sát được với các tổ hợp.", "Áp dụng biện pháp bảo vệ trước, không gán nhãn người."]
    how_to_read_results: "Chỉ là cảnh báo cần thận trọng; không kết luận về nhân cách."
    pitfalls: ["Dùng bảng để dán nhãn đối tượng hoặc phân biệt đối xử."]
    example: "Đối tác hướng ngoại quyến rũ nhưng nguyên tắc đổi theo lợi ích: yêu cầu hợp đồng văn bản và tham chiếu độc lập."

  - id: "m10_team_composition"
    name_vi: "Đội nhóm cân bằng và phong cách quản lý theo nhân viên"
    name_en: "Balanced team & management style"
    origin: "Phụ lục D.1-D.2 (gợi ý minh họa, đồng điệu Belbin)."
    components:
      - "Đội lý tưởng gồm: Logic (dữ liệu), EQ cao (cohesion, xung đột), Tham vọng (đẩy tiến), Ổn định (neo cảm xúc lúc khủng hoảng), Sáng tạo (giải pháp mới), Kỷ luật (execution, deadline). SME 5-10 người: một người kiêm 2-3 vai trò."
      - "Hướng nội kỷ luật: giao việc rõ ràng bằng văn bản, ít họp, tự chủ cao"
      - "Hướng ngoại cảm tính: check-in thường xuyên, khen công khai, dự án có visibility"
      - "Động cơ quyền lực: dự án flagship, ghi nhận công khai"
      - "Động cơ an toàn: giải thích kỳ vọng, feedback sớm, hạn chế bất định"
      - "Động cơ kết nối: văn hóa team, team building, quan tâm cá nhân"
      - "Động cơ tự do: remote, quản theo kết quả, thử thách đa dạng"
      - "Bất ổn cảm xúc: feedback thường xuyên, môi trường ổn định, mentor rõ"
      - "Tự nhận thức cao: feedback thẳng, dự án thách thức, cơ hội phát triển"
    when_to_use: "Thiết kế đội và cách quản lý từng người."
    how_to_apply: ["Kiểm kê vai trò hiện có.", "Bù khoảng trống bằng tuyển/kiêm nhiệm.", "Điều chỉnh phong cách quản lý theo nhu cầu từng người."]
    how_to_read_results: "Đánh giá bằng kết quả và hành vi công việc cụ thể, không bằng nhãn tính cách."
    pitfalls: ["Tuyển người 'giống mình'.", "Ép khuôn."]
    example: "Giao Khoa chỉ tiêu doanh thu sự kiện (quyền lực) nhưng thêm chỉ số phối hợp đồng nghiệp."

  - id: "m10_conflict_by_layer"
    name_vi: "Chẩn đoán xung đột theo tầng"
    name_en: "Conflict diagnosis by layer"
    origin: "Phụ lục D.3."
    components:
      - "Xung đột Tầng 1 (phong cách giao tiếp): điều chỉnh hình thức (to/nhỏ, nhanh/chậm), không đổi nội dung; đổi được ngay trong cuộc họp"
      - "Xung đột Tầng 2 (cách xử lý thông tin): Logic đưa dữ liệu trước, Cảm tính đưa câu chuyện trước, kết hợp cả hai; cần vài lần thử"
      - "Xung đột Tầng 3 (giá trị cốt lõi va chạm): khó nhất, gần như không đổi bằng tranh luận; tìm điểm chung ở kết quả mong muốn, nếu quá khác biệt thì phân lĩnh vực độc lập"
    when_to_use: "Trước khi can thiệp xung đột giữa hai người/nhóm."
    how_to_apply:
      - "Hỏi: họ bất đồng vì cách nói, cách xử lý thông tin hay vì giá trị/lợi ích cốt lõi?"
      - "Chọn can thiệp tương ứng tầng."
      - "Nếu giải xong Tầng 2 mà vẫn đối đầu (vd không muốn chia sẻ khách, ai được thưởng) thì chuyển sang chẩn đoán Tầng 3."
    how_to_read_results: "Không tốn công thuyết phục ở tầng không thể thuyết phục."
    pitfalls: ["Cố đổi niềm tin Tầng 3 bằng tranh luận."]
    example: "Chị A (logic, kỷ luật) vs anh B (cảm tính, phóng khoáng) về báo cáo tuần: mẫu 2 phần gồm '5 con số chính' và '1 câu chuyện khách hàng tiêu biểu' (giả định)."

  - id: "m10_quick_reference_table"
    name_vi: "Bảng tham chiếu nhanh: nhận diện - điều họ cần - điều không nên làm"
    name_en: "Quick reference (Appendix C.1)"
    origin: "Phụ lục C.1 (tóm 22 kiểu người)."
    components:
      - "Hướng ngoại: cần được lắng nghe; tránh im lặng kéo dài. Hướng nội: cần không gian, câu sâu; tránh thúc giục"
      - "Tự tin thật: ngang hàng; tránh nịnh hoặc thách thức ego. Lo âu: an tâm, xác nhận; tránh thêm áp lực/chỉ trích"
      - "EQ cao: chia sẻ thật; tránh lợi dụng. EQ thấp: rõ ràng trực tiếp; tránh ngụ ý/bóng gió"
      - "Logic: dữ liệu; tránh thuyết phục bằng cảm xúc. Cảm tính: câu chuyện, ý nghĩa; tránh tấn công trực giác bằng logic"
      - "Ổn định: thảo luận thẳng; tránh vòng vo. Bất ổn: chắc chắn, nhất quán; tránh mơ hồ/đổi đột ngột"
      - "Hòa đồng: được ghi nhận; tránh để lu mờ. Cạnh tranh: spotlight, công nhận; tránh đối đầu đám đông"
      - "Quyền lực: tự chủ, công nhận công khai; tránh vi phạm lãnh thổ. An toàn: thông tin đầy đủ, plan B; tránh thúc quyết nhanh. Kết nối: thuộc về; tránh lợi dụng trung thành. Tự do: tự chủ, thử thách; tránh vi quản"
      - "Niềm tin tích cực: chân thật; tránh lợi dụng. Niềm tin tiêu cực: nhất quán lời-hành động; tránh đòi tin ngay"
      - "Chính trực cao: tôn trọng; tránh đề xuất đi tắt. Cơ hội: không cần gì, tránh phụ thuộc; không chia sẻ thông tin nhạy cảm"
      - "Tự nhận thức cao: feedback thẳng; tránh vòng vo. Kiên cường: thử thách, trách nhiệm lớn; tránh bao bọc quá"
    when_to_use: "Tra cứu nhanh trước cuộc họp/phản hồi."
    how_to_apply: ["Chọn dòng khớp tín hiệu nhất quán, áp dụng cột 'cần' và tránh cột 'không nên'."]
    how_to_read_results: "Là heuristic; nếu tín hiệu mâu thuẫn, quay lại đặt giả thuyết."
    pitfalls: ["Dùng như bảng phân loại cứng."]
    example: "Phản hồi cho nhân viên bất ổn: nói riêng, nêu điểm tích cực trước, rõ ràng kỳ vọng và tiến độ."

procedures:
  - id: "m10_proc_read_person"
    name: "Đọc người có kỷ luật trước một cuộc gặp quan trọng"
    steps:
      - "Xác định mục đích đọc người và tính chính đáng; nhắc bản thân đây là mô hình diễn giải."
      - "Chuẩn bị bộ câu hỏi/tình huống giống nhau cho mọi người (Phụ lục B); nhận diện thiên kiến của mình (hào quang, FAE, định kiến vùng miền/giới/tuổi)."
      - "Bước 1 quan sát: ghi hành vi thô, đặt ≥ 2 giả thuyết, kiểm tra bối cảnh (văn hóa, cấp bậc, mệt, căng thẳng)."
      - "Bước 2 kích hoạt: câu hỏi 'Tại sao', tình huống nhẹ; tìm ≥ 2-3 tín hiệu nhất quán."
      - "Bước 3 xác nhận: hành vi khi không ai nhìn, cách đối xử người yếu thế, phản ứng khi không đạt ý; tham chiếu độc lập."
      - "Điều chỉnh hình thức giao tiếp theo giả thuyết mạnh hơn, sẵn sàng sửa."
    outputs: "Bản ghi hành vi thô + giả thuyết + mức độ chắc chắn + kế hoạch đối đáp; không phải nhãn kết luận."
  - id: "m10_proc_select_candidate"
    name: "Chọn ứng viên cho vai trò quản lý (SME), kết hợp mô hình và tuyển dụng có cấu trúc"
    steps:
      - "Xác định yêu cầu công việc và bảng tiêu chí chung (xử lý khách, điều phối ca, vệ sinh, độ tin cậy); không dùng tuổi, giới tính hay tính cách làm tiêu chí loại."
      - "Quan sát Tầng 1 và ghi hành vi thô; cảnh giác hiệu ứng hào quang."
      - "Phỏng vấn và tình huống mô phỏng giống nhau cho mọi ứng viên (Tầng 2)."
      - "Hỏi 'Tại sao' về các quyết định đổi việc để tìm giả thuyết động cơ (Tầng 3)."
      - "Ca làm thử có trả công và tham chiếu độc lập (đã được ứng viên đồng ý)."
      - "Quyết định theo yêu cầu vai trò; xem xét vai trò khác phù hợp với người còn lại (ghép người đúng việc)."
      - "Soạn kế hoạch đối đáp/quản lý từng người và chỉ số theo dõi sau 6 tháng."
    outputs: "Quyết định có tiêu chí, kế hoạch quản lý từng người, chỉ số (turnover, doanh thu, chi phí thay thế)."
  - id: "m10_proc_conflict_triage"
    name: "Phân loại và xử lý xung đột theo tầng"
    steps:
      - "Mô tả hành vi xung đột bằng ngôn từ thô, không gán nhãn."
      - "Chẩn đoán tầng: giao tiếp (T1), xử lý thông tin (T2), giá trị cốt lõi (T3)."
      - "Áp can thiệp tương ứng (điều chỉnh hình thức; kết hợp dữ liệu và câu chuyện; tìm điểm chung ở kết quả hoặc phân lĩnh vực)."
      - "Nếu Tầng 2 không giải quyết, chẩn đoán lại ở Tầng 3."
    outputs: "Thỏa thuận cụ thể (vd mẫu báo cáo chung) và cơ chế phân vai tránh va chạm."
  - id: "m10_proc_build_team"
    name: "Xây đội bổ trợ và kiểm tra tổ hợp rủi ro"
    steps:
      - "Kiểm kê 6 vai trò (logic, EQ, tham vọng, ổn định, sáng tạo, kỷ luật) trong đội."
      - "Xác định khoảng trống, phân kiêm nhiệm nếu SME nhỏ."
      - "Đối chiếu các tổ hợp rủi ro (C.3) và đặt biện pháp bảo vệ."
      - "Giao việc theo năng lực và động cơ; đánh giá bằng kết quả/hành vi công việc."
    outputs: "Sơ đồ vai trò, danh sách rủi ro và biện pháp."

decision_rules:
  - "Nếu chỉ có ấn tượng 0-5 phút thì chỉ đặt giả thuyết, không kết luận; cần ≥ 2-3 tín hiệu nhất quán và kiểm chứng đa bối cảnh."
  - "Nếu một hành vi nổi bật (nói to, im lặng) có nhiều cách hiểu thì đặt ít nhất 2 giả thuyết đối lập và tìm tín hiệu khó 'diễn' (khi im lặng, sau 15 phút)."
  - "Nếu thấy mình bị cuốn bởi ấn tượng 'cuốn hút' thì tự nhắc hiệu ứng hào quang và kiểm chứng bằng ca làm thử/tham chiếu."
  - "Nếu cần quyết định nhân sự (tuyển, sa thải, thăng chức) thì dùng phỏng vấn có cấu trúc, bài thử thực tế, tham chiếu độc lập; mô hình 7 tầng chỉ bổ trợ và không phải căn cứ duy nhất."
  - "Nếu cần đo tính cách chính thức trong tổ chức thì dùng công cụ có độ tin cậy/giá trị (Big Five: NEO-PI-R, IPIP) và tham vấn chuyên gia; MBTI/Enneagram chỉ để gợi mở thảo luận."
  - "Nếu hành vi bề mặt giống nhau nhưng khác động cơ (làm thêm giờ) thì hỏi 'Tại sao' và quan sát lựa chọn đánh đổi trước khi chọn đòn bẩy động viên."
  - "Nếu đối tượng là người hướng nội/lo âu thì cho thời gian suy nghĩ, hỏi từng câu, ưu tiên 1-1; nếu là người logic thì chuẩn bị số liệu; nếu cảm tính thì dùng câu chuyện và ý nghĩa."
  - "Nếu người đối diện động cơ an toàn thì đưa plan B/C và thông tin đủ; động cơ tự do thì cho lựa chọn và không vi quản; động cơ quyền lực thì cho vùng tự chủ và công nhận công khai; động cơ kết nối thì tạo cảm giác thuộc về."
  - "Nếu cần phê bình ai (đặc biệt người bất ổn, lo âu, cạnh tranh) thì làm riêng, cụ thể, có điểm tích cực; không phê bình trước đám đông."
  - "Nếu có dấu hiệu cơ hội chủ nghĩa/thao túng thì ghi thỏa thuận bằng văn bản, xác nhận hành động thật, hạn chế chia sẻ thông tin nhạy cảm, xác thực qua bên thứ ba."
  - "Nếu xung đột xảy ra thì chẩn đoán tầng trước: T1 đổi hình thức; T2 kết hợp dữ liệu và câu chuyện; T3 tìm điểm chung ở kết quả hoặc phân lĩnh vực độc lập."
  - "Nếu ai tự nhận ở Tầng 5-7 hoặc đòi phục tùng thì xem như cảnh báo tâm linh giả; kiểm chứng bằng hành vi nhiều năm, không dùng Tầng 6-7 để xếp hạng hay tuyển dụng."
  - "Nếu người hòa đồng đồng ý quá dễ (văn hóa 'nể') thì hỏi 'Nếu không sợ mất lòng thì anh/chị nghĩ sao?' để lấy ý kiến thật."
  - "Nếu hành vi có thể do văn hóa/hoàn cảnh (tránh eye contact, đến muộn do kẹt xe) thì không quy ra tính cách."
  - "Nếu muốn dùng mô hình để chẩn đoán/gán nhãn bệnh lý thì dừng: chỉ chuyên gia tâm lý/tâm thần có thẩm quyền chẩn đoán."

benchmarks:
  - {metric: "Mốc thời gian nhận biết theo tầng (T1 0-5 phút; T2 15-30 phút; T3 vài tuần/tháng hoặc biến cố; T4 nhiều tháng/năm)", value: "ước lượng diễn giải", context: "Mô hình diễn giải, không phải ngưỡng khoa học", confidence: "low"}
  - {metric: "Số tín hiệu nhất quán tối thiểu trước khi tin một cách đọc", value: ">= 2-3", context: "Quy tắc thực hành của tài liệu", confidence: "low"}
  - {metric: "Khoảng cách xã giao của người hướng ngoại", value: "< 60 cm", context: "Dấu hiệu minh họa trong 8.1, không phải chuẩn nghiên cứu", confidence: "low"}
  - {metric: "Chi phí thay thế mỗi nhân sự (quán cà phê, case giả định)", value: "4,5 triệu VNĐ/người", context: "Giả định minh họa, cần tính lại theo doanh nghiệp thực tế", confidence: "low"}
  - {metric: "Tỷ lệ nghỉ việc trong case (trước/sau)", value: "33,3% -> 5,6% (6/18 -> 1/18)", context: "Giả định minh họa, không phải benchmark ngành", confidence: "low"}
  - {metric: "Doanh thu cơ sở 2 trong case (trước/sau)", value: "140 -> 168 triệu/tháng (+20%)", context: "Giả định minh họa", confidence: "low"}
  - {metric: "Phỏng vấn có cấu trúc và bài thử thực tế dự báo hiệu quả công việc tốt hơn ấn tượng đầu", value: "định tính (Schmidt và Hunter, 1998, theo tài liệu nguồn)", context: "Trích dẫn ở mức ví dụ; nên kiểm chứng lại nguồn gốc nghiên cứu trước khi dùng chính thức", confidence: "medium"}

pitfalls:
  - "Coi mô hình diễn giải là khoa học kiểm chứng; dùng để chẩn đoán tâm lý hoặc gán nhãn bệnh lý."
  - "Dùng mô hình làm căn cứ duy nhất để tuyển dụng, đánh giá, thăng chức, sa thải hay phân biệt đối xử."
  - "Chốt nhãn từ ấn tượng đầu (hào quang, FAE) và bỏ qua hoàn cảnh/văn hóa."
  - "Hỏi dồn dập như thẩm vấn; không dừng khi đối phương khó chịu."
  - "Dán nhãn 'độc hại', 'cơ hội', 'bất ổn' thành định kiến thay vì mô tả hành vi cụ thể."
  - "Dùng Tầng 5-7 xếp hạng con người; tin người tự nhận 'giác ngộ'; lấy 'quantum consciousness' làm luận cứ."
  - "Khai thác 'vết sẹo'/nỗi sợ của người khác để thao túng."
  - "Dùng khác tiêu chí/bộ câu hỏi cho từng ứng viên, gây thiếu công bằng."
  - "Đọc nhân quả từ case minh họa (kết quả còn chịu ảnh hưởng mùa vụ, lương thưởng, thị trường)."
  - "Dùng triết lý bao dung/vô ngã biện minh cho hành vi gây hại hoặc né trách nhiệm."

sme_vn_guidance:
  - "Với SME 5-20 người, một người kiêm 2-3 vai trò: dùng 6 vai trò (D.1) làm checklist khoảng trống thay vì tuyển đủ."
  - "Quy trình tuyển quản lý cửa hàng: tiêu chí chung, tình huống mô phỏng giống nhau, ca làm thử có trả công (2 ca cuối tuần trong case), tham chiếu độc lập. Chi phí ca thử và chi phí thay thế 4,5 triệu/người trong case là giả định; cần tự tính lại theo thị trường lao động địa phương."
  - "Văn hóa 'nể' ở Việt Nam làm tín hiệu đồng ý/không đồng ý khó phân biệt: hỏi 1-1 trước họp, dùng câu 'Nếu không sợ mất lòng...'."
  - "Tránh giao tiếp bằng mắt có thể là lễ phép với người lớn tuổi/cấp trên; kẹt xe ở TP.HCM, Hà Nội có thể khiến người đúng kỷ luật vẫn đến muộn."
  - "Pháp lý lao động (tiêu chí tuyển dụng, phân biệt đối xử, hồ sơ cá nhân, bảo vệ dữ liệu cá nhân): cần xác nhận với văn bản hiện hành trước khi lưu hồ sơ đánh giá tính cách; tài liệu nguồn không nêu điều khoản cụ thể."
  - "Không cần phần mềm; công cụ thực dụng: sổ ghi hành vi thô, bảng tiêu chí công việc, mẫu báo cáo 2 phần (số liệu và câu chuyện), thỏa thuận văn bản."

case_lessons:
  - name: "Anh Dũng và ông Khải - 'hiệu ứng lừa dối' lần đầu gặp (giả định minh họa)"
    type: "sme"
    setup: "Anh Dũng gặp đối tác mới ông Khải bàn hợp đồng cung ứng; ông bắt tay chặt, nói to, kể 'thương vụ triệu đô', gây ấn tượng tự tin/hống hách."
    key_calculations:
      - "Hai giả thuyết: (a) hướng ngoại tự tin thật; (b) lo lắng dùng ồn ào bù trừ."
      - "Tín hiệu kiểm chứng: im lặng 5 giây thì nghịch bút, mắt đảo; sau 15 phút giọng nhỏ dần, kể bớt; hai buổi sau bình tĩnh hơn khi môi trường quen."
    lesson: "Một lần gặp chỉ cho giả thuyết; cần ≥ 2-3 tín hiệu nhất quán; cùng hành vi nói to có thể có hai nguyên nhân đối lập nên Tầng 1 phải kiểm chứng bằng Tầng 2-3."
    data_reliability: "illustrative"
  - name: "Chị Lan chọn cửa hàng trưởng quán cà phê 'Góc Phố' (Cần Thơ) - giả định minh họa"
    type: "sme"
    setup: "Quán 2 cơ sở, 18 nhân sự; 6/18 nghỉ trong 6 tháng; chi phí thay thế giả định 4,5 triệu/người; doanh thu cơ sở 2 khoảng 140 triệu/tháng. Hai ứng viên Khoa (cuốn hút, hướng ngoại, đổi việc 3 lần/2 năm) và Vy (đến sớm 15 phút, hướng nội, gắn bó 4 năm). Chị Lan suýt chọn Khoa theo hiệu ứng hào quang."
    key_calculations:
      - "Tỷ lệ nghỉ trước: 6/18 = 33,3%; sau: 1/18 = 5,6%."
      - "Chi phí thay thế: 6 x 4,5 = 27 triệu; sau 1 x 4,5 = 4,5 triệu; tiết kiệm 22,5 triệu."
      - "Doanh thu cơ sở 2: 140 -> 168 triệu/tháng; +28 triệu = +20%."
      - "Quy trình: cùng tình huống và câu hỏi cho cả hai; hỏi 'Tại sao' về lý do đổi việc; ca làm thử 2 ca cuối tuần có trả công; tham chiếu độc lập; cùng bảng tiêu chí công việc."
      - "Quyết định: Vy làm cửa hàng trưởng (giữ nhân sự, ổn định, tin cậy), Khoa phụ trách bán hàng/sự kiện với vùng tự chủ rõ (cặp Tham vọng + Ổn định)."
    lesson: "Ấn tượng đầu là giả thuyết; Tầng 3 lộ qua đánh đổi, thời gian, cách đối xử người yếu thế (bạn rửa ly mới); công cụ đọc người bổ trợ chứ không thay thế tuyển dụng có cấu trúc; không phân biệt đối xử (tiêu chí là hành vi và năng lực công việc); cùng một người có thể phù hợp vai trò khác. Cảnh báo: kết quả còn chịu mùa vụ, lương thưởng, thị trường nên không chứng minh mô hình dự đoán đúng."
    data_reliability: "illustrative"
  - name: "Hai trưởng nhóm bán hàng cãi nhau về báo cáo tuần (giả định)"
    type: "sme"
    setup: "Chị A (logic, kỷ luật) muốn số liệu chi tiết; anh B (cảm tính, phóng khoáng) muốn kể câu chuyện khách hàng."
    key_calculations: ["Chẩn đoán: xung đột Tầng 2 (cách xử lý thông tin), chưa phải Tầng 3.", "Xử lý: mẫu 2 phần gồm '5 con số chính' và '1 câu chuyện khách hàng tiêu biểu'."]
    lesson: "Chẩn đoán đúng tầng giúp không tốn công thuyết phục ở tầng không thể thuyết phục; nếu sau đó vẫn đối đầu vì 'không muốn chia sẻ khách' hay 'ai được thưởng' thì chuyển sang chẩn đoán Tầng 3 (động cơ quyền lực/an toàn)."
    data_reliability: "illustrative"

worked_examples:
  - name: "Tính tỷ lệ nghỉ việc và chi phí thay thế trước/sau (case Góc Phố)"
    inputs: {n_total: 18, left_before: 6, left_after: 1, c_million: 4.5}
    steps:
      - "Tỷ lệ nghỉ trước = 6/18 x 100 = 33,3%"
      - "Tỷ lệ nghỉ sau = 1/18 x 100 = 5,6%"
      - "Chi phí thay thế trước = 6 x 4,5 = 27 triệu; sau = 1 x 4,5 = 4,5 triệu"
      - "Tiết kiệm = 27 - 4,5 = 22,5 triệu"
    result: "Nghỉ việc giảm từ 33,3% xuống 5,6%; tiết kiệm trực tiếp 22,5 triệu (giả định minh họa, chưa chứng minh nhân quả)."
  - name: "Tăng trưởng doanh thu cơ sở 2 sau 6 tháng"
    inputs: {r0: 140, r1: 168}
    steps: ["Chênh lệch = 168 - 140 = 28 triệu", "Tỷ lệ = 28/140 = 0,20", "= +20%"]
    result: "+28 triệu/tháng (+20%); cần loại trừ yếu tố mùa vụ, lương thưởng, thị trường trước khi quy cho quyết định nhân sự."
  - name: "Quy trình giả thuyết cho cuộc gặp đối tác (ông Khải)"
    inputs: {behavior: "nói to, bắt tay chặt, kể thành tích", silence_test: "im lặng 5 giây thì nghịch bút, mắt đảo"}
    steps:
      - "Ghi hành vi thô: nói to, bắt tay chặt, kể nhiều thành tích."
      - "Giả thuyết (a) tự tin thật; (b) lo lắng bù trừ."
      - "Tín hiệu kiểm chứng nghiêng về (b): bất an khi im lặng, giọng nhỏ dần sau 15 phút."
      - "Đối đáp: ghi nhận thành tích thật, hỏi chi tiết, đưa số liệu rõ; kiểm chứng ở buổi sau."
    result: "Giả thuyết (b) mạnh hơn, được xác nhận sau hai buổi (giả định minh họa); không kết luận từ lần gặp đầu."
  - name: "Chọn đòn bẩy động viên theo động cơ"
    inputs: {employee: "làm thêm giờ liên tục, hay hỏi 'quy trình này có ổn định không?', ngại đổi kế hoạch"}
    steps:
      - "Hành vi bề mặt (làm thêm giờ) có thể do thành tựu, an toàn hay kết nối; hỏi 'Tại sao' về quyết định quá khứ."
      - "Giả thuyết: động cơ an toàn (hay hỏi quy trình, ngại đổi kế hoạch) nếu thêm lựa chọn công việc ổn định và tiết kiệm."
      - "Đòn bẩy: kỳ vọng rõ, feedback sớm, plan B; không thúc quyết nhanh hay đổi kế hoạch đột ngột."
    result: "Không thưởng riêng tiền hoặc giao thêm việc mơ hồ; dùng đòn bẩy 'an toàn' (giả định minh họa của agent để thực hành, không phải số liệu của nguồn)."

practice_questions:
  - {q: "Vì sao Tầng 1 vừa dễ đọc nhất vừa dễ sai nhất? Nêu ít nhất hai nguyên nhân.", a: "Đó là Persona (phần chủ động trình diễn) nên có thể là mặt nạ; cùng một hành vi (nói to) có thể do tự tin hoặc lo lắng; chịu hiệu ứng hào quang, sai lầm quy kết cơ bản và khác biệt văn hóa."}
  - {q: "Khách hàng nói to, bắt tay chặt và kể nhiều thành tích. Bạn nên làm gì trong 15 phút đầu?", a: "Ghi hành vi thô, đặt ≥ 2 giả thuyết (tự tin thật vs lo lắng bù trừ), tìm tín hiệu khó diễn (im lặng, thay đổi sau 15 phút), điều chỉnh đối đáp nhưng không kết luận; kiểm chứng ở buổi sau."}
  - {q: "Tính tỷ lệ nghỉ việc và chi phí thay thế nếu quán 18 người có 6 người nghỉ, chi phí thay thế 4,5 triệu/người.", a: "6/18 = 33,3%; 6 x 4,5 = 27 triệu."}
  - {q: "Nhân viên A hay hỏi nhiều, quyết chậm, sợ thay đổi; nhân viên B ngại cam kết dài hạn, hay đề xuất thứ mới. Quản lý mỗi người thế nào?", a: "A (an toàn): giải thích kỳ vọng, plan B, feedback sớm, không thúc quyết nhanh. B (tự do): cho tự chủ cách làm, ngôn ngữ lựa chọn, thử thách mới, không vi quản; vẫn cần khung cứng tối thiểu (deadline, chất lượng)."}
  - {q: "Hai quản lý cãi nhau về báo cáo: một người muốn số liệu, một người muốn câu chuyện. Chẩn đoán tầng nào và xử lý ra sao?", a: "Tầng 2 (cách xử lý thông tin). Kết hợp mẫu báo cáo 2 phần (số liệu và câu chuyện); nếu vẫn đối đầu vì lợi ích/thưởng thì chẩn đoán lại ở Tầng 3."}
  - {q: "Vì sao không nên dùng mô hình này làm căn cứ duy nhất để tuyển dụng hay sa thải?", a: "Đây là mô hình diễn giải, không kiểm chứng; dễ dẫn đến định kiến/phân biệt đối xử; quyết định phải dựa tiêu chí công việc, dữ liệu hành vi/kết quả, phỏng vấn có cấu trúc, bài thử thực hành, tham chiếu độc lập."}
  - {q: "Người đồng nghiệp tự nhận đã 'vô ngã' và yêu cầu mọi người nghe theo. Bạn phản ứng thế nào?", a: "Cảnh báo tâm linh giả (Welwood 1984): đòi phục tùng, không chịu phản biện, thu lợi; kiểm chứng bằng hành vi nhiều năm, không dùng Tầng 5-7 để xếp hạng, giữ tư duy phản biện."}
  - {q: "Khách hàng hòa đồng luôn nói 'dạ được' nhưng không làm. Nên làm gì?", a: "Hòa đồng không phải dễ bảo; có thể do văn hóa 'nể'. Hỏi 'Nếu không sợ mất lòng thì anh/chị nghĩ sao?', hỏi 1-1, tạo không gian an toàn để nói thật."}
  - {q: "Vì sao quan sát cách đối xử với người ít quyền lực (lễ tân, phục vụ, nhân viên mới) lại quan trọng?", a: "Là nguyên tắc vàng số 2: phản ánh tính chính trực và Tầng 3 khó diễn khi không có ai quan sát/đánh giá; trong case, cách Khoa và Vy đối xử bạn rửa ly mới là dữ liệu quan trọng."}

checklist:
  - "Trước khi đọc người: nhớ đây là mô hình diễn giải; xác định mục đích chính đáng; chuẩn bị cùng bộ câu hỏi cho mọi người; nhận diện thiên kiến bản thân (hào quang, FAE, định kiến văn hóa/vùng miền/giới/tuổi)."
  - "Khi quan sát (Tầng 1-2): ghi hành vi thô trước nhãn; ≥ 2 giả thuyết/hành vi; ≥ 2-3 tín hiệu nhất quán; kiểm tra bối cảnh (văn hóa, cấp bậc, sức khỏe, mệt, căng thẳng phỏng vấn); đưa kích thích nhẹ và quan sát."
  - "Khi xác nhận (Tầng 3-4): xem cách đối xử người ít quyền lực; hành vi khi không ai nhìn và khi có đánh đổi; đối chiếu lời nói và hành động qua thời gian; tham chiếu độc lập; phân biệt sự thật với diễn giải."
  - "Khi đối đáp: đổi hình thức không đổi sự thật; hướng nội/lo âu thì cho thời gian và hỏi từng câu; logic thì số liệu, cảm tính thì câu chuyện; dùng đúng đòn bẩy động cơ; không phê bình trước đám đông; với người có dấu hiệu thao túng thì ghi văn bản và hạn chế thông tin nhạy cảm."
  - "Quản trị đội và xung đột: chẩn đoán tầng xung đột; đội có vai trò bổ trợ (SME có thể kiêm nhiệm); kiểm tra tổ hợp rủi ro C.3; giao việc theo năng lực/động cơ; đánh giá bằng kết quả/hành vi công việc."
  - "Đạo đức và giới hạn: không chẩn đoán tâm lý; không là căn cứ duy nhất cho tuyển/sa thải/thăng chức/phân biệt; không thao túng khai thác nỗi sợ; dùng công cụ có bằng chứng (Big Five), phỏng vấn có cấu trúc và chuyên gia khi đánh giá chính thức; cảnh giác người tự nhận Tầng 5-7 hoặc đòi phục tùng; sẵn sàng sửa nhận định."

excel_google_sheets_templates:
  - "Sổ quan sát hành vi: cột Ngày/Bối cảnh, Hành vi thô, Giả thuyết 1, Giả thuyết 2, Tín hiệu kiểm chứng, Mức chắc chắn (1-3 tín hiệu nhất quán), Điều chỉnh đối đáp. Nguồn không có mẫu chính thức; đây là gợi ý thiết kế từ quy trình 12.1."
  - "Bảng tiêu chí tuyển dụng dùng chung cho mọi ứng viên: tiêu chí công việc (xử lý khách, điều phối ca, vệ sinh, độ tin cậy), điểm ca làm thử, ghi chú tham chiếu, quyết định; không có cột tuổi/giới/tính cách làm tiêu chí loại."
  - "Bảng theo dõi nhân sự: Tỷ lệ nghỉ việc (=n_left/n_total), Chi phí thay thế (=n_left*c), Tăng trưởng doanh thu (=(r1-r0)/r0)."

