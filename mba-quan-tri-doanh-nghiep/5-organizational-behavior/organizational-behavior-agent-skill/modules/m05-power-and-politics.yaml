pitfalls:
  - "Đọc quyền lực chỉ qua sơ đồ tổ chức (authority) và bỏ sót power/influence ngoài sơ đồ."
  - "Dựa quá nhiều vào Legitimate/Coercive khi cần cam kết tự nguyện; Coercive tăng sợ hãi, turnover, che giấu lỗi."
  - "Nhầm im lặng của nhân viên (PDI cao) với đồng thuận."
  - "Đủ phiếu pháp lý nhưng thiếu đồng thuận thực thi (HP-Compaq 51,4%); liên minh dư 0 điểm dễ vỡ."
  - "Bỏ qua nhóm Q1 phản đối (nhà Hewlett) hoặc coi khách hàng hiện hữu là Low Power (JC Penney)."
  - "Chuyên môn (Expert) không thay được bản đồ bên liên quan; Ron Johnson thay đổi toàn diện không thử nghiệm."
  - "Dùng Information Control/Scapegoating/giấu dữ liệu bất lợi (Theranos, WeWork): quyền lực dựa trên lừa dối sụp khi thông tin bị phơi bày, hậu quả pháp lý."
  - "Quyền lực cấu trúc (cổ phiếu biểu quyết nhiều) không phải sự tin tưởng; khi vốn ngoài rút, không có phương án thay thế."
  - "Machiavellianism, đốt cầu, nịnh bợ, tham gia quá nhiều liên minh, tin nhầm người."
  - "Dùng Cialdini giả (khan hiếm bịa, chứng thực mua) - thao túng và rủi ro pháp lý quảng cáo sai sự thật; Commitment ép làm vượt giới hạn giờ làm theo luật."
  - "Cooptation có định hướng và đe dọa ngầm bằng Connection Power (Case đảo chính HĐQT) làm hỏng quan hệ cả hai phía."
  - "Giải quyết vấn đề kế nhiệm bằng liên minh ngầm thay vì lộ trình công khai (tiêu chí, thời hạn, người đánh giá độc lập)."
  - "Tập trung hình ảnh/quyền lực vào một người - key-person risk; hình ảnh Referent không bù được khủng hoảng niềm tin (Sandberg)."
  - "Tự chấm đạo đức cho chính mình không có phản biện."
  - "Cập nhật bản đồ stakeholder một lần rồi bỏ."

sme_vn_guidance:
  - "Văn hóa PDI cao: hỏi riêng từng người, họp 1-1, kênh góp ý ẩn danh; chủ SME dùng Expert/Referent để chuyển tuân thủ thành nhiệt tình."
  - "Doanh nghiệp gia đình/kế nhiệm: xây lộ trình công khai (ví dụ 24 tháng đào tạo/đánh giá người kế nhiệm có hội đồng độc lập) thay vì liên minh ngầm; công khai tiêu chí và thời hạn (case giả định)."
  - "Biểu quyết HĐTV/HĐQT/ĐHĐCĐ: kiểm tra điều lệ công ty và Luật Doanh nghiệp hiện hành về tỷ lệ thông qua nghị quyết trước khi đếm liên minh (ngưỡng 65% của Case Sao Việt chỉ là giả định - cần xác nhận pháp lý)."
  - "Giữ người then chốt: ESOP/thưởng theo kết quả nhiều năm, lộ trình thăng tiến, nghi thức chung và giá trị cốt lõi (chi phí thấp, tạo Unity); mô hình FPT chỉ là minh họa theo nguồn công khai, cần đối chiếu độc lập."
  - "Giảm key-person risk: đào tạo thêm người vận hành, tài liệu hóa quy trình, redundancy cho kế toán trưởng/kỹ sư/VP Sales nắm khách hàng."
  - "Quan hệ (Connection Power) phổ biến ở VN: dùng chính danh, tránh nepotism, tham nhũng, lót tay; có rủi ro pháp lý và đạo đức."
  - "Quan hệ với ngân hàng, cơ quan quản lý (thuế, sở ngành) thuộc nhóm Keep Satisfied: báo cáo định kỳ chỉ số nợ/EBITDA, tuân thủ; kiểm tra điều khoản tín dụng thực tế (giá trị 2,5 lần là giả định)."
  - "Công đoàn cơ sở: có thể nhảy từ Interest thấp lên cao khi quyền lợi người lao động bị đụng tới; thông báo sớm."
  - "Quyền lực với nhà cung cấp/đại lý lớn: SME cần đa dạng hóa khách hàng/nhà cung cấp để giảm D (Emerson) - chi phí là đầu tư bán hàng."
  - "Làm thêm giờ: giới hạn giờ làm thêm theo Bộ luật Lao động - cần xác nhận quy định hiện hành khi dùng Commitment/Reward/Pressure (cần xác nhận)."
  - "Công cụ: Excel/Google Sheets cho Power Map, đếm liên minh, runway, NPV; bảng chấm Velasquez (không có chi phí phần mềm bắt buộc)."

case_lessons:
  - name: "Lyndon B. Johnson - The Treatment và Civil Rights Act 1964"
    type: "success"
    setup: "Johnson (Lãnh đạo đa số Thượng viện 1955-61, Tổng thống 1963-69); 'The Treatment' do Evans & Novak (1966) đặt tên. Thách thức: vượt filibuster của các thượng nghị sĩ miền Nam. Nguồn: tiểu sử/lịch sử, số liệu xấp xỉ."
    key_calculations:
      - "Cloture cần 2/3 của 100 thượng nghị sĩ = 67 phiếu"
      - "Kết quả xấp xỉ ~71 phiếu thuận, dư ~4 so với ngưỡng; dự luật cuối ~73 phiếu thuận"
      - "Chìa khóa: Dirksen (lãnh đạo thiểu số Cộng hòa), điều chỉnh nhỏ dự luật để Cộng hòa ủng hộ"
      - "Base: Informational (rất cao), Connection (rất cao), Reward (cao), Legitimate (cao), Referent (trung bình-cao), Coercive (ngầm, giai thoại chưa kiểm chứng)"
    lesson: "Thắng bằng tổ hợp thông tin + phần thưởng + quan hệ + vị trí. Đếm trước (ai ủng hộ, trung lập, cần bao nhiêu phiếu), dồn công sức vào nhóm xoay chuyển được. Biên dư chỉ 4 phiếu nên chăm sóc từng phiếu. Không sao chép phần ép buộc; cái giá: mất ủng hộ miền Nam; lạm dụng quyền lực/thiếu minh bạch về Việt Nam làm giảm uy tín."
    data_reliability: "unverified"
  - name: "Steve Jobs - trở lại Apple 1997"
    type: "success"
    setup: "Jobs rời Apple 1985; cuối 1996 Apple mua NeXT khoảng 400 triệu USD (xấp xỉ); tháng 9/1997 CEO lâm thời; Microsoft đầu tư khoảng 150 triệu USD cổ phiếu không biểu quyết (tháng 8/1997). Nguồn: tiểu sử Isaacson, số liệu xấp xỉ."
    key_calculations:
      - "Base: Expert, Referent ('reality distortion field'), Connection (thỏa thuận Microsoft), Legitimate (cố vấn -> CEO lâm thời, cải tổ HĐQT), Coercive (cắt dự án, sa thải)"
      - "Bốn bước: xây nền thông tin/chuyên môn -> gom quyền chính thức -> thu hẹp dòng sản phẩm về lưới 4 ô -> dùng tầm nhìn giữ người (iMac 1998, iPod 2001, iPhone 2007)"
    lesson: "Tầm nhìn cần quyền ra quyết định để thực thi; quyền ra quyết định không có tầm nhìn chỉ tạo tuân thủ yếu. Khi tiếp quản tổ chức khủng hoảng, tập trung quyền quyết định trong thời gian ngắn nhưng gắn với tầm nhìn rõ ràng. Mặt trái: phong cách coercive/nóng tính là rủi ro."
    data_reliability: "unverified"
  - name: "Sheryl Sandberg - Facebook (COO từ 2008)"
    type: "success"
    setup: "Sandberg gia nhập Facebook 2008, báo cáo Zuckerberg; Facebook nhiều người dùng, mô hình doanh thu chưa rõ; IPO 2012; rời Meta 2022 sau tranh cãi dữ liệu 2018."
    key_calculations:
      - "Emerson: Zuckerberg phụ thuộc cao (I_B lớn) vào kinh nghiệm thương mại hóa; ít người thay thế (Alt_B nhỏ) -> quyền lực của Sandberg tăng"
      - "Base: Expert, Connection, Legitimate (COO), Referent (Lean In 2013, sau khi có uy tín)"
    lesson: "Quyền lực mạnh nhất của người số hai là Expert + sự phụ thuộc của người số một; xác định điểm yếu có thể bổ sung chính đáng. Referent phải đi cùng minh bạch; quyền lực dựa trên kiểm soát thông tin/hình ảnh dễ bị thử thách khi khủng hoảng niềm tin."
    data_reliability: "unverified"
  - name: "Trương Gia Bình - FPT (xây liên minh, văn hóa)"
    type: "sme"
    setup: "FPT thành lập 1988, tập đoàn công nghệ lớn VN (nhân sự vài chục nghìn, số liệu thay đổi theo năm, cần kiểm chứng). Nội dung dựa trên phát biểu/báo chí công khai, phần lớn do doanh nghiệp công bố - cần đối chiếu nguồn độc lập."
    key_calculations:
      - "Base: Referent (hình ảnh gắn giáo dục/công nghệ, tự hào làm việc FPT), Expert, Connection, Reward (ESOP, lộ trình nghề nghiệp)"
      - "Cơ chế: lợi ích dài hạn tăng chi phí rời đi + gắn lợi ích người giỏi với kết quả công ty -> cam kết thay vì chỉ tuân thủ; nghi lễ/câu chuyện chung củng cố Unity"
    lesson: "Ở doanh nghiệp VN (PDI cao), quyền lực của người đứng đầu chuyển hóa thành cam kết khi có tầm nhìn nhất quán, lợi ích chia sẻ và bản sắc chung. SME: tạo lợi ích dài hạn cho người chủ chốt, xây câu chuyện/nghi thức chung (chi phí thấp); cẩn trọng key-person risk."
    data_reliability: "unverified"
  - name: "Carly Fiorina - HP mua Compaq"
    type: "failure"
    setup: "CEO HP 1999-2005; tháng 9/2001 công bố mua Compaq khoảng 25 tỷ USD (xấp xỉ). Walter Hewlett cùng quỹ gia đình (~18% cổ phần theo báo cáo) công khai phản đối."
    key_calculations:
      - "Thông qua với ~51,4% phiếu, chỉ hơn ngưỡng 50% khoảng 1,4 điểm %"
      - "Nhà Hewlett = Q1 Mendelow (Power cao, Interest cao) bị đối đầu công khai"
      - "Base: Legitimate cao, Expert trung bình, Referent nội bộ thấp, Connection trung bình"
      - "Fiorina rời tháng 2/2005"
    lesson: "Thắng pháp lý không phải thắng đồng thuận; Legitimate chỉ cho quyền ra quyết định, không tạo tự nguyện thực thi. Đo ngưỡng đồng thuận cần đạt, xây liên minh rộng hơn mức tối thiểu, xử lý Q1 phản đối bằng đối thoại và nhượng bộ có chọn lọc."
    data_reliability: "unverified"
  - name: "Ron Johnson - JC Penney"
    type: "failure"
    setup: "CEO cuối 2011, cựu lãnh đạo bán lẻ Apple; bỏ giảm giá liên tục sang 'giá niêm yết hằng ngày', thiết kế lại cửa hàng thành các 'tiệm' thương hiệu, thay đổi diện rộng không chạy thử."
    key_calculations:
      - "Doanh thu ~17,26 tỷ USD (FY2011) -> ~12,98 tỷ USD (FY2012): (12,98 - 17,26)/17,26 = -24,8%"
      - "Cổ phiếu mất hơn một nửa giá trị; Johnson bị thay tháng 4/2013 sau ~17 tháng; Chapter 11 năm 2020"
    lesson: "Expert không thay được bản đồ bên liên quan; khách hàng lâu năm (coi là Q3/Q4) có quyền lực gián tiếp rất lớn (bỏ đi = doanh thu giảm). Pilot nhỏ trước; Consultation với người tuyến đầu trước khi phá mô hình đang tạo doanh thu."
    data_reliability: "unverified"
  - name: "Cuộc 'đảo chính' HĐQT công ty gia đình (giả định)"
    type: "sme"
    setup: "Công ty gia đình 500 nhân viên; nhà sáng lập A (62) muốn đưa con trai A Jr (40) vào HĐQT 7 ghế (cần >= 4 phiếu); CEO thuê B lo bị thay. Cơ cấu: A + 2 thành viên gia đình = 3 phiếu; B, GĐTC, 2 độc lập = 4 phiếu. Tên và số liệu giả định minh họa."
    key_calculations:
      - "Biểu quyết 4 phiếu (B, GĐTC, 2 độc lập) so với 3 (A và 2 gia đình): 4 >= 4 nên đề xuất bị bác"
      - "B vận động riêng từng người, dùng Information + Impression Mgmt; sau đó ngầm ám chỉ khách hàng gắn với B có thể rời đi (Connection Power như đe dọa ngầm)"
      - "Velasquez: Utility ~, Rights ~, Justice x, Virtues x, Care x -> vùng xám nghiêng mặt tối"
    lesson: "Kế nhiệm cần lộ trình công khai (tiêu chí, thời hạn, người đánh giá độc lập), không bằng liên minh ngầm. Cách tốt hơn: B nói thẳng quan ngại với A và đề xuất lộ trình 24 tháng đào tạo/đánh giá A Jr bằng hội đồng độc lập. Thắng phiếu nhưng cả hai bên đều thiệt hại."
    data_reliability: "illustrative"
  - name: "Elizabeth Holmes - Theranos"
    type: "failure"
    setup: "Holmes sáng lập Theranos 2003; định giá ~9 tỷ USD (2014); WSJ (Carreyrou) 10/2015; ngừng hoạt động 2018; bị kết tội gian lận nhà đầu tư 2022, án khoảng 11 năm 3 tháng (theo hồ sơ tòa và báo chí)."
    key_calculations:
      - "Base bị lạm dụng: Legitimate, Informational (giấu dữ liệu), Coercive (thỏa thuận bảo mật, đe dọa kiện), Connection/Authority giả (HĐQT toàn chính khách), Referent giả"
      - "Cialdini bị lợi dụng: Authority + Social Proof + Scarcity/FOMO"
    lesson: "Dùng nhiều nguồn quyền lực để che giấu sự thật có tuổi thọ ngắn và hậu quả pháp lý nặng. Nhà đầu tư/HĐQT: kiểm chứng độc lập, tên tuổi không thay dữ liệu; nhân viên: ghi chép, kênh tố cáo hợp pháp, tư vấn pháp lý; lãnh đạo: văn hóa cho phép báo cáo tin xấu."
    data_reliability: "unverified"
  - name: "Indra Nooyi - PepsiCo Performance with Purpose"
    type: "success"
    setup: "CEO PepsiCo 2006-2018; chiến lược Performance with Purpose (lợi nhuận + dinh dưỡng + môi trường + con người). Phân loại stakeholder mang tính minh họa của bài."
    key_calculations:
      - "Mendelow: HĐQT/cổ đông lớn = Manage Closely; cơ quan quản lý/tổ chức xã hội = Keep Satisfied; nhân viên = Keep Informed; nhà cung cấp/công chúng = Monitor"
      - "Chiến thuật: Rational Persuasion (dữ liệu xu hướng sức khỏe), Inspirational Appeals (ý nghĩa xã hội), Authority/Expert (chiến lược, tài chính)"
    lesson: "Lãnh đạo bằng Expert + Referent + Inspirational tạo cam kết bền hơn; phân loại stakeholder: nhóm cần dữ liệu, nhóm cần ý nghĩa. Mức thành công tài chính của PwP còn tranh luận - số liệu cần kiểm chứng khi trích dẫn."
    data_reliability: "unverified"
  - name: "Founder startup VN điều phối nhà đầu tư, co-founder, nhân sự chủ chốt (giả định)"
    type: "sme"
    setup: "Founder A (30 tuổi) startup AI Hà Nội, vốn hạt giống 500.000 USD từ nhà đầu tư I; co-founder B (CTO) 50% cổ phần; VP Sales C nắm mạng lưới khách. Tất cả giả định minh họa."
    key_calculations:
      - "Runway = 500.000/25.000 = 20 tháng; mục tiêu Series A 18 tháng -> đệm 2 tháng (áp lực thời gian là thật)"
      - "Mendelow: I (9,9) và B (8,9) Manage Closely; C (4,8) Keep Informed -> nâng Power của C lên 7 vì ~40% pipeline đến từ C (Emerson) -> Manage Closely"
      - "Chiến thuật: I = Rational + Exchange (Commitment, Social Proof); B = Consultation + Inspirational (Unity); C = Exchange (lương + cổ phần thưởng theo mục tiêu) + Personal Appeals (Reciprocity)"
    lesson: "Quản trị quyền lực không phải để thắng mà để cùng nhìn một bản đồ: chia sẻ dữ liệu chung, đo cửa sổ thời gian, gắn lợi ích cá nhân với mục tiêu chung. Ma trận phải cập nhật theo mức phụ thuộc thật."
    data_reliability: "illustrative"
  - name: "WeWork - Adam Neumann"
    type: "failure"
    setup: "WeWork định giá ~47 tỷ USD (đầu 2019); S-1 tháng 8/2019 lộ điều khoản quản trị bất thường; IPO hoãn, định giá ~8 tỷ USD khi SoftBank cứu trợ cuối 2019."
    key_calculations:
      - "Cổ phiếu biểu quyết ~20 phiếu/cổ phiếu cho nhóm Neumann (theo báo cáo) -> kiểm soát vượt tỷ lệ sở hữu"
      - "Giao dịch bên liên quan, khoản vay thế chấp cổ phiếu (báo chí: hơn 700 triệu USD)"
      - "Gói thoái vốn báo chí đưa tin ~1,7 tỷ USD (xấp xỉ)"
      - "Emerson: WeWork cần tiền, ít phương án thay thế -> SoftBank (Q1) có quyền thương lượng cao"
    lesson: "Quyền lực cấu trúc giúp tránh xây liên minh khi mọi việc suôn sẻ nhưng không có phương án thay thế khi vốn ngoài rút; Referent mất ngay khi tự lợi lộ ra. Cần quản trị minh bạch, hạn chế giao dịch bên liên quan, hội đồng độc lập."
    data_reliability: "unverified"
  - name: "Công ty Bao bì Sao Việt - quyết định đầu tư máy in flexo (SME VN)"
    type: "sme"
    setup: "Công ty TNHH Bao bì Sao Việt (Bình Dương), doanh thu ~48 tỷ/năm, EBITDA 5,2 tỷ, nợ hiện tại 3 tỷ; mua máy 6 tỷ (vay 4,5 tỷ). Cần >= 65% vốn biểu quyết (giả định). Vốn: H 38%, M 22%, K 25%, T 10%, N 5%. Tất cả giả định minh họa."
    key_calculations:
      - "Tổng vốn trừ H = 22+25+10+5 = 62% < 65% -> H có veto"
      - "Liên minh tối thiểu: H+M+N = 65 (biên 0), H+K+N = 68, H+M+T = 70, H+K+T = 73, H+M+K = 85"
      - "D = tỷ trọng x tháng thay thế: T 0,6x6 = 3,6; M 0,35x4 = 1,4; N 0,3x3 = 0,9 -> T khó thay nhất"
      - "Nợ/EBITDA sau vay = (3+4,5)/5,2 = 1,44 lần (giới hạn giả định 2,5 -> dư 1,06)"
      - "NPV: hệ số niên kim 8 năm 14% = 4,639; NPV = 1,8x4,639 - 6 = +2,35 tỷ; hoàn vốn 3,33 năm; kịch bản xấu B = 0,9: NPV = -1,83 tỷ; hòa vốn B* = 1,29 tỷ (~72% kỳ vọng)"
      - "Kết quả biểu quyết: H+M+T+N = 75% (dư 10 điểm), K bỏ phiếu trắng rồi thống nhất quyền giám sát; mua theo 2 giai đoạn kèm điều kiện dừng"
      - "Velasquez: 2+2+2+2+1 = 9/10 (chức năng)"
    lesson: "Đếm phiếu trước nhưng đếm cả mức phụ thuộc (phiếu cho biết có thông qua được không; phụ thuộc cho biết có thực hiện được không). Liên minh dư 0 điểm dễ vỡ, dư 10 điểm chịu được một cổ đông đổi ý. Công khai kịch bản xấu biến người phản đối thành đồng tác giả điều kiện dừng. Tự kiểm tra Velasquez trước khi hành động. Nhắc: ngưỡng 65% chỉ giả định - kiểm tra điều lệ/Luật Doanh nghiệp."
    data_reliability: "illustrative"

worked_examples:
  - name: "Emerson: Xưởng cơ khí B phụ thuộc tập đoàn A và chiến lược cân bằng"
    inputs: {I_B: 70, Alt_B: 1, I_A: 8, Alt_A: 4, I_B_after: 40, Alt_B_after: 3}
    steps:
      - "D_BA = 70/1 = 70; D_AB = 8/4 = 2"
      - "Tỷ lệ quyền lực P_AB/P_BA = 70/2 = 35 lần: A có thể ép giá, kéo dài thanh toán"
      - "B tìm 2 khách hàng mới: tỷ trọng A giảm còn 40 và Alt_B = 3 -> D_BA = 40/3 = 13,33"
      - "Tỷ lệ mới = 13,33/2 = 6,67 lần"
      - "Diễn giải: chưa ngang hàng nhưng đàm phán tốt hơn rất nhiều; chi phí là đầu tư bán hàng, không phải đấu tranh (giả định minh họa)"
    result: "Tỷ lệ quyền lực 35 lần giảm còn ~6,67 lần"
  - name: "Đếm liên minh Sao Việt: veto, liên minh tối thiểu, biên"
    inputs: {stakes: {H: 38, M: 22, K: 25, T: 10, N: 5}, threshold: 65}
    steps:
      - "Veto: tổng người khác H = 22+25+10+5 = 62 < 65 -> H có veto"
      - "Liên minh tối thiểu: H+M+N = 65 (biên 0), H+K+N = 68 (3), H+M+T = 70 (5), H+K+T = 73 (8), H+M+K = 85 (20)"
      - "Chọn liên minh thực tế H+M+T+N = 75, biên 10; K bỏ phiếu trắng nhưng vẫn qua"
      - "Cần kiểm tra thêm phụ thuộc: T khó thay nhất (D = 3,6) nên phải giữ T đồng thuận"
    result: "H có veto; 5 liên minh tối thiểu; chọn liên minh biên 10 điểm"
  - name: "Chuẩn bị Rational Persuasion cho người lo nợ: NPV, kịch bản xấu, hòa vốn"
    inputs: {capex: 6, benefit: 1.8, benefit_bad: 0.9, r: 0.14, n: 8, existing_debt: 3, new_debt: 4.5, ebitda: 5.2}
    steps:
      - "Hệ số niên kim = (1 - 1,14^-8)/0,14 = 4,639"
      - "NPV kỳ vọng = 1,8 x 4,639 - 6 = +2,35 tỷ; hoàn vốn = 6/1,8 = 3,33 năm"
      - "NPV xấu = 0,9 x 4,639 - 6 = -1,83 tỷ; hoàn vốn = 6,67 năm"
      - "Hòa vốn B* = 6/4,639 = 1,29 tỷ = 72% kỳ vọng -> chỉ đáng làm nếu đạt tối thiểu ~72% lợi ích kỳ vọng"
      - "Nợ/EBITDA = 7,5/5,2 = 1,44 lần (giới hạn giả định 2,5)"
      - "Đề xuất giai đoạn thử 6 tháng đầu với điều kiện dừng"
    result: "NPV +2,35 / -1,83 tỷ; B* = 1,29 tỷ; nợ/EBITDA 1,44 lần"
  - name: "Mendelow có điều chỉnh Emerson (startup)"
    inputs: {I: [9, 9], B: [8, 9], C: [4, 8], C_adjusted_power: 7, cutoff: 5}
    steps:
      - "I (9,9) -> Manage Closely; B (8,9) -> Manage Closely; C (4,8) -> Keep Informed"
      - "~40% pipeline đến từ mạng lưới C, thay thế mất nhiều tháng -> Power của C = 7"
      - "C (7,8) -> Manage Closely"
      - "Runway 500.000/25.000 = 20 tháng, đệm 2 tháng so với mốc 18 tháng -> áp lực thời gian là thật"
    result: "C chuyển từ Keep Informed sang Manage Closely"
  - name: "Chấm Velasquez cho hai cách thu nạp CFO"
    inputs: {A: [2, 2, 2, 2, 1], B: [1, 0, 1, 0, 0]}
    steps:
      - "A (mời CFO phân tích, chia sẻ toàn bộ dữ liệu, chấp nhận kết luận khác): 2+2+2+2+1 = 9"
      - "B (chỉ đưa dữ liệu ủng hộ tăng giá, giấu dữ liệu bất lợi): 1+0+1+0+0 = 2"
      - "Phân loại: 9 -> chức năng; 2 -> mặt tối"
    result: "Cùng chiến thuật Cooptation nhưng minh bạch dữ liệu quyết định ranh giới đạo đức"
  - name: "Một yêu cầu - bảy cách: tổ 6 thợ làm thêm 3 ngày"
    inputs: {n: 6, days: 3, rate: 300000}
    steps:
      - "Reward: 6 x 3 x 300.000 = 5.400.000 đ (tiền mặt, tạo tiền lệ)"
      - "Legitimate: chi phí rất thấp, tuân thủ tối thiểu; Coercive: rẻ, tăng nghỉ việc/lỗi"
      - "Expert: giải thích số liệu hợp đồng bị phạt; Referent: cùng làm, ghi nhận; Informational: chia sẻ tiến độ; Connection: nhờ 'anh cả' tổ"
      - "Khuyến nghị: Legitimate nền + Reward công bằng + Expert/Referent để người ta muốn làm"
    result: "Reward tốn 5,4 triệu nhưng chọn kết hợp nhiều base"

practice_questions:
  - q: "Trưởng phòng mới được bổ nhiệm nhưng nhân viên cũ vẫn nghe theo đồng nghiệp thâm niên. Chẩn đoán dùng khái niệm nào và hướng xử lý?"
    a: "Có Authority nhưng thiếu Power/Influence. Đầu tư Expert/Referent (chuyên môn, lắng nghe, công bằng), tham vấn người thâm niên (Consultation), không chỉ ra lệnh."
  - q: "Xưởng B bán 70% doanh thu cho A, có 1 khách thay thế; A mua 8% từ B, có 4 nhà cung cấp thay thế. Tính tỷ lệ quyền lực và đề xuất hành động."
    a: "D_BA = 70, D_AB = 2, tỷ lệ 35 lần. Hành động: tìm thêm khách (giảm tỷ trọng A, tăng Alt_B), liên minh các bên yếu; nếu về 40/3 thì tỷ lệ còn ~6,7."
  - q: "HĐQT 7 ghế cần 4 phiếu; phe A có 3, phe B có 4. Phe B thắng không? Biên là bao nhiêu và nên làm gì để thắng bền?"
    a: "Thắng 4 >= 4 nhưng biên 0 - rất mong manh. Cần lộ trình công khai/đối thoại để tránh phản ứng, không dựa vào vận động ngầm."
  - q: "Vốn: H 38, M 22, K 25, T 10, N 5; ngưỡng 65%. Ai có veto? Liệt kê liên minh tối thiểu."
    a: "H có veto (62 < 65). Liên minh tối thiểu: H+M+N 65, H+K+N 68, H+M+T 70, H+K+T 73, H+M+K 85."
  - q: "Cloture cần 2/3 số thượng nghị sĩ trong 100: cần bao nhiêu phiếu và nếu thắng với 71 phiếu thì biên?"
    a: "67 phiếu; biên 71 - 67 = 4 (số liệu xấp xỉ)."
  - q: "Phân loại và hành động cho: CEO, CFO tập đoàn mẹ, nhân viên bán hàng bị đổi CRM, nhân viên hành chính."
    a: "CEO: Manage Closely (đồng thiết kế); CFO: Keep Satisfied (báo cáo ngắn); nhân viên bán hàng: Keep Informed (tham vấn, champion); hành chính: Monitor (thông báo chung)."
  - q: "VP Sales C nắm 40% pipeline, điểm ban đầu Power 4, Interest 8. Điều chỉnh thế nào?"
    a: "Nâng Power lên khoảng 7 vì phụ thuộc (Emerson) -> Manage Closely; có Exchange (lương + cổ phần theo mục tiêu)."
  - q: "Vì sao Pressure hiệu quả ngắn hạn nhưng kém bền? Khi nào vẫn có thể dùng?"
    a: "Tạo tuân thủ nhưng gây phản kháng, hại quan hệ; chỉ dùng khi khẩn cấp, không còn cách khác."
  - q: "Phân biệt Liking và Unity trong Cialdini, cho ví dụ."
    a: "Liking: 'tôi thích bạn' do tương đồng, khen, tiếp xúc; Unity: 'bạn là một phần của chúng ta' (cùng quê, trường, nghề), mạnh hơn vì chạm bản sắc."
  - q: "Cooptation có đạo đức không? Chấm bằng Velasquez cho hai cách làm."
    a: "Vùng xám tùy cách làm: minh bạch dữ liệu, chấp nhận kết luận khác = 9 (chức năng); định hướng, giấu dữ liệu bất lợi = 2 (mặt tối)."
  - q: "Công ty Sao Việt: vay 4,5 tỷ, nợ cũ 3 tỷ, EBITDA 5,2 tỷ. Nợ/EBITDA là bao nhiêu? Máy tăng EBITDA 1,8 tỷ/năm, 8 năm, chiết khấu 14%, giá 6 tỷ: NPV và lợi ích hòa vốn?"
    a: "Nợ/EBITDA 1,44 lần; NPV ≈ +2,35 tỷ; B* ≈ 1,29 tỷ (~72% kỳ vọng); kịch bản xấu (0,9) NPV ≈ -1,83 tỷ."
  - q: "Runway 500.000 USD, burn 25.000 USD/tháng, mốc Series A 18 tháng. Đệm bao nhiêu và hàm ý về quyền lực nhà đầu tư?"
    a: "20 tháng, đệm 2 tháng; áp lực thời gian là thật nên nhà đầu tư có quyền thương lượng cao hơn; cần chia sẻ dữ liệu minh bạch."
  - q: "Vì sao ở Việt Nam (PDI ~70) sự im lặng trong họp không đồng nghĩa với đồng thuận? Gợi ý cách xử lý."
    a: "Nhân viên ngại phản biện công khai với cấp trên. Hỏi riêng từng người, kênh góp ý ẩn danh/1-1, tham vấn trước họp, vẫn đầu tư Expert/Referent."
  - q: "Phân tích HP-Compaq: vì sao thắng 51,4% vẫn là thất bại về quản trị?"
    a: "Biên chỉ ~1,4 điểm %; nhà Hewlett (Q1) bị đối đầu công khai; Legitimate không tạo tự nguyện thực thi; tích hợp xung đột văn hóa; số liệu xấp xỉ cần kiểm chứng."
  - q: "Nêu ba bài học từ Theranos và WeWork về quyền lực dựa trên thông tin và cấu trúc."
    a: "Quyền lực dựa lừa dối/giấu thông tin sụp khi bị phơi bày (Theranos); quyền lực cấu trúc không thay thế tin tưởng và không có phương án thay thế khi vốn rút (WeWork); cần kiểm chứng độc lập, quản trị minh bạch, hội đồng độc lập."

checklist:
  - "Đã liệt kê tất cả stakeholder chính (kể cả người không có chức danh nhưng có ảnh hưởng)"
  - "Đã chấm Power/Interest (1-10) và phân loại ma trận Mendelow"
  - "Đã xác định base quyền lực chính của từng người (French & Raven)"
  - "Đã ước lượng mức phụ thuộc: ai khó thay thế nhất, ai phụ thuộc ai (Emerson)"
  - "Đã cập nhật bản đồ sau các sự kiện lớn"
  - "Nếu biểu quyết: đã đếm phiếu, kiểm tra veto, tìm tổ hợp tối thiểu, tính biên an toàn; đã kiểm tra điều lệ/Luật Doanh nghiệp"
  - "Đã chọn chiến thuật Yukl phù hợp (ưu tiên Rational, Consultation, Inspirational)"
  - "Đã chuẩn bị số liệu kể cả kịch bản bất lợi và điểm hòa vốn"
  - "Đã tham vấn người phản đối chính trước khi quyết định"
  - "Đã dùng nguyên tắc Cialdini đúng sự thật"
  - "Đã cân nhắc bối cảnh văn hóa (PDI cao: hỏi riêng)"
  - "Đã tránh dựa quá nhiều vào Legitimate/Coercive khi cần cam kết tự nguyện"
  - "Bài kiểm tra 'đăng báo': có thể công khai mà không ngại?"
  - "Đã chấm 5 lăng kính Velasquez; tổng >= 8"
  - "Không giấu thông tin quan trọng, không đổ lỗi, không đe dọa ngầm"
  - "Có phương án cho người bị ảnh hưởng (đào tạo, chuyển vị trí, hỗ trợ)"
  - "Ghi chép và gửi email xác nhận sau các cuộc họp quan trọng"
  - "Có ít nhất 1-2 đồng minh tin cậy ở phòng/cấp khác"
  - "Biết kênh báo cáo khi bị đối xử bất công (HR, cấp trên, đường dây nóng)"
  - "Không chia sẻ bí mật quan trọng với người chưa kiểm chứng; không đốt cầu; không tham gia quá nhiều liên minh mâu thuẫn"
  - "Đã đo kết quả (quyết định thông qua? quan hệ có bị tổn hại?)"
  - "Đã chăm sóc người thua (giữ thể diện, tránh trả đũa)"
  - "Đã ghi lại bài học cho lần sau"
  - "Đã gắn nhãn số liệu giả định minh họa/xấp xỉ cần kiểm chứng khi trích case quốc tế"

