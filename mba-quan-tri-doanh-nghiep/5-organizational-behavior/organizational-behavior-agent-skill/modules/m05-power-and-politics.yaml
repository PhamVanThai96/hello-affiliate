procedures:
  - id: "m05_proc_power_map"
    name: "Lập bản đồ quyền lực cho một quyết định/dự án"
    steps:
      - "Liệt kê mọi stakeholder, kể cả người không có chức danh nhưng có ảnh hưởng (kế toán trưởng, kỹ sư nắm hệ thống, 'anh cả' trong tổ)"
      - "Chấm Power và Interest (1-10); ngưỡng 5"
      - "Xác định base quyền lực chính (French & Raven) và mức phụ thuộc (Emerson hoặc D = tỷ trọng x tháng thay thế)"
      - "Điều chỉnh Power cho người khó thay thế; phân loại ô Mendelow"
      - "Ghi lập trường: ủng hộ/trung lập/phản đối"
      - "Nếu có biểu quyết: tính ngưỡng, kiểm tra veto, liệt kê liên minh tối thiểu, tính biên an toàn"
      - "Chọn hành động từng người; cập nhật sau mỗi sự kiện lớn"
    outputs: "Power Map + danh sách ưu tiên stakeholder + liên minh đề xuất với biên an toàn."
  - id: "m05_proc_count_coalition"
    name: "Đếm liên minh biểu quyết và thiết kế biên an toàn"
    steps:
      - "Xác định ngưỡng thông qua (điều lệ/luật); kiểm tra văn bản gốc"
      - "Tính tổng phần của mọi người trừ từng bên để tìm veto"
      - "Liệt kê liên minh tối thiểu và biên dư của từng tổ hợp"
      - "Chọn liên minh có biên đủ an toàn (chịu được một thành viên nhỏ đổi ý), không chọn liên minh dư 0 điểm nếu có lựa chọn khác"
      - "Kiểm tra mức phụ thuộc của người thực thi (phiếu cho biết có thông qua được không; phụ thuộc cho biết có thực hiện được không)"
      - "Tham vấn trước người phản đối chính; chuẩn bị điều kiện dừng/giai đoạn thử để người lo ngại cùng đồng tác giả"
    outputs: "Liên minh mục tiêu, biên an toàn, kế hoạch tham vấn và điều kiện dừng."
  - id: "m05_proc_influence_plan"
    name: "Thiết kế kế hoạch ảnh hưởng với một stakeholder"
    steps:
      - "Xác định mục tiêu, người, thời hạn"
      - "Phân tích lợi ích, lo ngại, loại quyền lực, vị thế hiện tại"
      - "Chọn chiến thuật Yukl (ưu tiên Rational, Consultation, Inspirational; Exchange nếu có giá trị trao đổi rõ)"
      - "Chọn nguyên tắc Cialdini có thật (Reciprocity, Commitment, Social Proof thật, Unity...)"
      - "Điều chỉnh theo văn hóa (PDI cao: hỏi riêng, không chỉ họp công khai)"
      - "Chuẩn bị số liệu gồm kịch bản bất lợi và điểm hòa vốn"
      - "Kiểm tra Velasquez (>= 8) trước khi làm"
      - "Meeting 1 (tiếp cận), Meeting 2 (xử lý lo ngại), Closing (lấy cam kết); chuẩn bị Plan B và đồng minh hỗ trợ"
    outputs: "Influence Plan Canvas hoàn chỉnh và lịch gặp."
  - id: "m05_proc_ethics_check"
    name: "Kiểm tra đạo đức một hành động chính trị"
    steps:
      - "Mô tả hành động và mục tiêu"
      - "Bài kiểm tra 'đăng báo': nếu công khai bạn có ngại không?"
      - "Chấm 5 lăng kính 0-2 (có thể nhờ người thứ hai chấm)"
      - "8-10: tiến hành; 5-7: điều chỉnh (minh bạch dữ liệu/công bố quy trình, bảo vệ người bị ảnh hưởng) rồi chấm lại; 0-4: dừng"
      - "Kiểm tra: không giấu thông tin, không đổ lỗi, không đe dọa ngầm; có phương án cho người bị ảnh hưởng"
    outputs: "Điểm đạo đức, quyết định tiến hành/điều chỉnh/dừng."
  - id: "m05_proc_defend"
    name: "Phòng thủ khi bị tác động chính trị tiêu cực"
    steps:
      - "Nhận biết chiến thuật (Coalition, Information Control, Impression Mgmt, Scapegoating, Cooptation) và red flags ('đừng báo cáo ai', chia sẻ riêng từng người, bỏ phiếu bí mật, có scapegoating)"
      - "Ghi chép và gửi email xác nhận sau họp ('theo như chúng mình trao đổi...')"
      - "Yêu cầu công khai thông tin; nêu bằng chứng phản bác; nhắc thành tích thực"
      - "Xây counter-coalition, có 1-2 đồng minh tin cậy ở phòng/cấp khác"
      - "Escalate qua HR, cấp trên, hotline nếu bất công; cân nhắc rời đi nếu công ty quá chính trị và không thể cải thiện"
    outputs: "Hồ sơ bằng chứng, đồng minh, kênh escalate, quyết định ở lại/rời đi."
  - id: "m05_proc_reduce_politics"
    name: "Giảm chính trị mặt tối trong tổ chức"
    steps:
      - "Chẩn đoán nguồn gốc (khan hiếm, mơ hồ, phức tạp, thay đổi, quy trình không rõ)"
      - "Làm rõ mục tiêu (SMART) và tiêu chí thăng chức/phân bổ ngân sách"
      - "Tài liệu hóa tri thức, tạo redundancy cho vai trò then chốt"
      - "Truyền thông thay đổi sớm, kèm hỗ trợ (đào tạo, chuyển vị trí, severance)"
      - "Khuyến khích kênh góp ý ẩn danh/1-1 (PDI cao) và văn hóa báo cáo tin xấu"
    outputs: "Kế hoạch giảm chính trị mặt tối theo nguyên nhân."

decision_rules:
  - "Nếu một người có chức vụ nhưng nhân viên chỉ làm mức tối thiểu thì kiểm tra thiếu Power/Influence và đầu tư Expert/Referent thay vì tăng mệnh lệnh."
  - "Nếu cần tuân thủ nhanh trong khủng hoảng/an toàn lao động thì dùng Legitimate/Coercive có kiểm soát; nếu cần cam kết bền hoặc sáng tạo thì dùng Expert/Referent/Consultation."
  - "Nếu mục tiêu là hành vi tự giác khi không ai giám sát (internalization) thì dùng Expert/Informational thuyết phục và Referent, không dùng Coercive/Reward đơn thuần."
  - "Nếu bên mình có D_BA lớn hơn nhiều D_AB (phụ thuộc nhiều hơn) thì tăng Alt (đa dạng khách hàng/nhà cung cấp), giảm I, hoặc liên minh các bên yếu trước khi đàm phán."
  - "Nếu tổng phần của tất cả trừ H dưới ngưỡng thì H có veto: thuyết phục H trước, các bên còn lại sau."
  - "Nếu có nhiều liên minh thắng thì chọn liên minh có biên an toàn đủ chịu việc mất một thành viên nhỏ, tránh liên minh dư 0 điểm (vd H+M+N = 65%)."
  - "Nếu đủ phiếu nhưng người thực thi có D cao (khó thay thế) thì phải xin cam kết riêng (đào tạo dự phòng, thưởng theo kết quả) trước khi chốt."
  - "Nếu stakeholder có Power >= 5 và Interest >= 5 thì Manage Closely; Power cao Interest thấp -> Keep Satisfied; Power thấp Interest cao -> Keep Informed; còn lại Monitor."
  - "Nếu một stakeholder nắm phần lớn khách hàng/thông tin/tri thức (vd 40% pipeline) thì nâng Power theo mức phụ thuộc rồi mới phân ô."
  - "Nếu dự án sắp đụng quyền lợi của nhóm Interest thấp (công đoàn khi cắt giảm nhân sự) thì chuyển nhóm đó lên ô cao ngay."
  - "Nếu cần thuyết phục người tin dữ liệu thì Rational Persuasion; cần động viên cấp dưới giỏi thì Inspirational + Consultation; chỉ dùng Pressure khi khẩn cấp."
  - "Nếu dùng Cialdini thì kiểm tra tính thật: khan hiếm thật, số liệu bằng chứng xã hội thật, chuyên môn liên quan trực tiếp; nếu không thật thì bỏ."
  - "Nếu Velasquez dưới 8 thì sửa cách làm (minh bạch dữ liệu, công khai quy trình) và chấm lại; từ 4 trở xuống thì không làm."
  - "Nếu dùng Cooptation thì dữ liệu phải thật và đầy đủ, chấp nhận kết luận khác; nếu định hướng/giấu dữ liệu bất lợi thì là thao túng."
  - "Nếu chia sẻ thông tin quan trọng với một người thì thử trước bằng chuyện nhỏ; không confide điều có thể hại bạn."
  - "Nếu làm việc ở PDI cao (VN) thì hỏi riêng từng người, có kênh ẩn danh/1-1; không coi im lặng là đồng thuận."
  - "Nếu đề xuất tài chính bị lo ngại thì công khai kịch bản xấu và điểm hòa vốn, cùng đối phương đặt điều kiện dừng/giai đoạn thử."
  - "Nếu thay đổi lớn cần ít nhất đa số pháp lý thì đặt mục tiêu đồng thuận rộng hơn ngưỡng tối thiểu và xử lý nhóm phản đối Q1 bằng đối thoại, nhượng bộ có chọn lọc."
  - "Nếu thay đổi lớn mô hình đang tạo doanh thu thì chạy thử nhỏ (pilot) và tham vấn người tuyến đầu trước khi triển khai rộng."
  - "Nếu quyền lực/hình ảnh tập trung vào một người (founder, kỹ sư duy nhất) thì tạo redundancy và lợi ích dài hạn (ESOP, thưởng nhiều năm) để giảm key-person risk."
  - "Nếu rời công ty thì ra đi lịch sự, không đốt cầu; nếu đang trong nhiều liên minh thì giữ tối đa 1-2 liên minh thật sự tin mục tiêu."

