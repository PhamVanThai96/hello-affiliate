id: "m05"
name_vi: "Quyền lực và Chính trị trong tổ chức"
name_en: "Power and Politics in Organizations"
source_file: "05-power-and-politics.md"
purpose: >
  Giúp người quản lý/chủ SME đọc được bản đồ quyền lực thực tế (ngoài sơ đồ tổ chức), đánh giá ai phụ thuộc ai,
  đếm được liên minh/phiếu khi ra quyết định tập thể, chọn chiến thuật ảnh hưởng và cách ưu tiên stakeholder,
  đồng thời kiểm tra ranh giới đạo đức giữa chính trị chức năng và thao túng. Module cung cấp các khung (French & Raven,
  Emerson, Cialdini, Yukl, Mendelow, Velasquez) kèm công cụ chấm điểm/đếm phiếu có thể tính toán.
when_to_use:
  - "Chủ/quản lý hỏi: vì sao nhân viên không làm theo dù tôi có chức vụ? (phân biệt authority - power - influence)"
  - "Cần phân tích nguồn quyền lực của một người (French & Raven) hoặc chọn cách tác động phù hợp"
  - "Có xung đột quyền lợi giữa các bên: ai phụ thuộc ai, ai khó thay thế (Emerson)"
  - "Cần thông qua quyết định bằng biểu quyết HĐQT/HĐTV/cổ đông: đếm phiếu, tìm liên minh tối thiểu, tính biên an toàn"
  - "Lập kế hoạch stakeholder cho dự án/thay đổi (ma trận Mendelow, Power Map, Influence Plan Canvas)"
  - "Cần thuyết phục sếp/đồng nghiệp/nhà đầu tư/khách hàng (Yukl 9 chiến thuật, Cialdini 7 nguyên tắc)"
  - "Nghi ngờ mình đang bị thao túng (scapegoating, kiểm soát thông tin, thu nạp): cần nhận diện và phòng thủ"
  - "Cần kiểm tra đạo đức một hành động chính trị (Velasquez, chấm 0-2 x 5 lăng kính)"
  - "Tình huống nhạy cảm chính trị: M&A, tái cấu trúc, mùa ngân sách, lãnh đạo mới, kế nhiệm gia đình, bất đồng HĐQT"
  - "Làm việc trong văn hóa PDI cao (Việt Nam): im lặng không đồng nghĩa đồng thuận"
prerequisites: ["m02"]
related_modules:
  - "m02: Leadership styles - quyền lực vị trí vs cá nhân, lãnh đạo dùng Expert/Referent"
  - "m04: Organizational culture - Power Distance (Hofstede), văn hóa tạo ra/giảm chính trị"
  - "m06: Conflict management - chính trị sinh ra từ xung đột tài nguyên/mục tiêu mơ hồ"
  - "m07: Change management - bản đồ stakeholder, liên minh ủng hộ, kháng cự khi thay đổi"
  - "m09: Decision making - quyết định tập thể, đếm phiếu, đạo đức quyết định"
  - "m10: People insight - đọc động cơ, nhu cầu của từng stakeholder"

concepts:
  - term_vi: "Quyền lực"
    term_en: "Power"
    definition: "Khả năng của A khiến B làm điều B vốn không làm (hoặc ngăn B làm điều B muốn); không nhất thiết dựa trên vị trí. Weber (1922, diễn giải): xác suất thực hiện ý chí bất chấp kháng cự; Dahl (1957) gọn hóa thành định nghĩa A-B."
    why_it_matters: >
      Quyền lực là thuộc tính của QUAN HỆ chứ không phải tài sản cố hữu. Người quản lý cần tách quyền lực khỏi chức danh
      để giải thích vì sao có người chức cao nhưng không ai nghe, và người chức thấp lại có sức nặng.
  - term_vi: "Quyền hạn"
    term_en: "Authority"
    definition: "Quyền lực hợp pháp do tổ chức cấp theo vị trí; chính thức, được công nhận, đi kèm trách nhiệm, ổn định nhưng mất khi đổi vị trí."
    why_it_matters: "Sơ đồ tổ chức chỉ cho thấy authority. Trưởng phòng mới có authority nhưng thiếu power/influence thì nhân viên chỉ làm mức tối thiểu."
  - term_vi: "Ảnh hưởng"
    term_en: "Influence"
    definition: "Khả năng thay đổi thái độ, ý kiến, hành động của người khác mà không cần authority hay cưỡng chế; dựa trên thuyết phục, uy tín, quan hệ."
    why_it_matters: "Mentor được kính trọng không quản lý ai vẫn thay đổi được hành vi. Hiệu quả lãnh đạo (heuristic, không phải công thức) ~ Authority + Power + Influence: làm vì lệnh, vì sợ/thưởng và vì tôn trọng."
  - term_vi: "Bảy nguồn quyền lực (French & Raven)"
    term_en: "Bases of power"
    definition: "Legitimate, Reward, Coercive, Expert, Referent (French & Raven 1959, ĐH Michigan), Informational (Raven 1965), Connection (thêm vào qua giáo trình như Hersey & Blanchard). '7 loại' là phân loại tổng hợp, không phải bản gốc 1959."
    why_it_matters: >
      Đổi câu hỏi từ 'người này mạnh đến đâu?' thành 'vì sao B chịu làm theo A?'. Cùng một mệnh lệnh nhưng nguồn khác nhau cho chất lượng tuân thủ
      khác nhau (Kelman 1958): compliance (Coercive/Reward/Legitimate), identification (Referent), internalization (Expert/Informational thuyết phục).
      Yukl: 3 nguồn đầu là quyền lực vị trí, Expert và Referent là quyền lực cá nhân.
  - term_vi: "Sự phụ thuộc quyền lực"
    term_en: "Power-dependence (Emerson)"
    definition: "Emerson (1962, ASR): quyền lực của A đối với B bằng mức B phụ thuộc vào A; phụ thuộc tăng khi B đầu tư nhiều động lực vào thứ A giữ và giảm khi B có nhiều nguồn thay thế."
    why_it_matters: "Giải thích nhân viên chức thấp 'ép' được công ty (không ai thay được) và giám đốc bị đối tác nhỏ dắt mũi. Hai đòn bẩy cân bằng: giảm nhu cầu, tăng lựa chọn thay thế."
  - term_vi: "Khoảng cách quyền lực"
    term_en: "Power Distance Index (PDI, Hofstede)"
    definition: "Mức độ thành viên quyền lực thấp chấp nhận và mong đợi quyền lực phân bổ không đều. Hofstede (khảo sát IBM >50 nước, Culture's Consequences 1980). Việt Nam khoảng 70 (cao); điểm là xấp xỉ, lệch giữa các phiên bản."
    why_it_matters: "Cùng hành vi quyền lực được đón nhận khác nhau: PDI cao coi mệnh lệnh là đương nhiên và phản biện công khai là vô lễ; PDI thấp coi là độc đoán. Nhân viên VN hay im lặng thay vì phản đối - im lặng không phải đồng thuận."
  - term_vi: "Bất đối xứng quyền lực"
    term_en: "Power asymmetry"
    definition: "Chênh lệch quyền lực lớn giữa hai bên tạo ra sự lệ thuộc bất cân xứng (nhân viên-công ty, SME-tập đoàn, doanh nhân-nhà nước)."
    why_it_matters: "Bên mạnh dễ khai thác; bên yếu cân bằng bằng phương án thay thế, liên minh, chuyên môn, quan hệ."
  - term_vi: "Chính trị tổ chức"
    term_en: "Organizational politics"
    definition: "Hoạt động cá nhân/nhóm nhằm cải thiện vị thế, tìm quyền lực, bảo vệ lợi ích, thường không chính thức/ẩn kín. Nghiên cứu: Kotter 1977, Pfeffer 1981/1992, Mintzberg 1983."
    why_it_matters: "Tổ chức không phải cỗ máy lý tính thuần túy mà là nơi các nhóm lợi ích cạnh tranh nguồn lực. Dự án thay đổi thất bại thường vì thiếu người ủng hộ ở vị trí then chốt chứ không phải sai kỹ thuật; hiểu chính trị giúp đánh giá khả thi sớm, tự bảo vệ và dùng ảnh hưởng minh bạch."
  - term_vi: "Chính trị chức năng vs mặt tối"
    term_en: "Functional politics vs Dark-side politics"
    definition: "Chức năng: cân bằng lợi ích cá nhân-tổ chức, dùng liên minh/thuyết phục/chia sẻ thông tin, bán công khai, giải thích được. Mặt tối: tự lợi tuyệt đối, lừa dối/thao túng/phá hoại, ẩn kín."
    why_it_matters: "Phân định mục đích - phương tiện - tính công khai - tác động. Ranh giới mờ nên cần công cụ kiểm tra (Velasquez, bài kiểm tra 'đăng báo')."
  - term_vi: "Năng lực chính trị"
    term_en: "Political skill (Ferris et al. 2005)"
    definition: "Khả năng hiểu người khác và dùng hiểu biết đó để tác động nhằm nâng cao mục tiêu cá nhân VÀ tổ chức; 4 thành phần: nhạy bén xã hội, ảnh hưởng giữa các cá nhân, xây dựng mạng lưới, sự chân thành (apparent sincerity)."
    why_it_matters: "Chính 'chân thành' khiến người khác coi bạn là chính trị chức năng chứ không phải thao túng."
  - term_vi: "Ba mức phản ứng với ảnh hưởng (Kelman)"
    term_en: "Compliance - Identification - Internalization"
    definition: "Tuân thủ (làm vì sợ/thưởng, dừng khi hết giám sát), đồng hóa (làm vì muốn giống/thuộc về, gắn với một người), nội tâm hóa (làm vì tin là đúng, tự làm kể cả khi không ai giám sát)."
    why_it_matters: "Dùng để chọn nguồn quyền lực theo mục tiêu: cần tuân thủ nhanh thì Legitimate/Coercive; cần cam kết bền thì Expert/Referent."
  - term_vi: "Lối tắt tâm lý (Cialdini)"
    term_en: "Heuristics / Principles of influence"
    definition: "7 nguyên tắc: Reciprocity, Commitment/Consistency, Social Proof, Authority, Liking, Scarcity (Influence, 1984), Unity (Pre-Suasion, 2016). Mỗi nguyên tắc là một lối tắt ra quyết định của con người."
    why_it_matters: "Hiểu để thuyết phục có đạo đức (trình bày sự thật phù hợp cách người ta quyết định) và nhận ra khi mình bị dẫn dắt. Chỉ dùng khi sự thật phù hợp (khan hiếm thật, bằng chứng xã hội thật); giả dạng = thao túng và rủi ro pháp lý (quảng cáo sai sự thật)."
  - term_vi: "Chiến thuật ảnh hưởng (Yukl)"
    term_en: "Influence tactics"
    definition: "9 chiến thuật (Kipnis, Schmidt & Wilkinson 1980; Yukl & Falbe 1990; Yukl & Tracey 1992): Rational Persuasion, Inspirational Appeals, Consultation, Ingratiation, Personal Appeals, Exchange, Coalition, Legitimating, Pressure."
    why_it_matters: "Trả lời câu hỏi thực dụng: chiến thuật nào đem lại CAM KẾT chứ không chỉ tuân thủ. Nhìn chung Rational, Inspirational, Consultation hiệu quả nhất; Pressure kém nhất và hay gây phản kháng (mức độ phụ thuộc bối cảnh/văn hóa)."
  - term_vi: "Ma trận quyền lực - quan tâm"
    term_en: "Power-Interest Grid (Mendelow 1981)"
    definition: "Ma trận 2x2 phân stakeholder theo Power (khả năng ảnh hưởng kết quả) và Interest (mức quan tâm/bị tác động) thành 4 ô: Manage Closely, Keep Satisfied, Keep Informed, Monitor."
    why_it_matters: "Thời gian của người quản lý có hạn; đối xử bình đẳng với mọi bên là lãng phí công sức cho người ít ảnh hưởng và bỏ sót người có thể chặn dự án. Vị trí không cố định, phải cập nhật."
  - term_vi: "Liên minh"
    term_en: "Coalition"
    definition: "Tập hợp các bên có lợi ích chung để gộp quyền lực; nhiều bên Low Power gộp lại có thể thành High Power. Ở biểu quyết, liên minh phải vượt ngưỡng thông qua, càng dư càng an toàn."
    why_it_matters: "Đủ số phiếu là điều kiện cần, chưa đủ; liên minh 'vừa khít' dễ vỡ, liên minh có biên an toàn chịu được một thành viên đổi ý (Case HP-Compaq thắng 51,4%, Case Sao Việt)."
  - term_vi: "Quyền phủ quyết"
    term_en: "Veto power"
    definition: "Một bên có quyền phủ quyết khi phần phiếu của tất cả những người còn lại cộng lại vẫn dưới ngưỡng thông qua."
    why_it_matters: "Xác định 'chìa khóa' phải thuyết phục; trong Case Sao Việt: 22+25+10+5 = 62% < 65% nên H (38%) có quyền phủ quyết."
  - term_vi: "Nguồn gốc chính trị tổ chức"
    term_en: "Sources of political behavior"
    definition: "Bốn điều kiện: tài nguyên khan hiếm, mục tiêu mơ hồ, phức tạp công nghệ, thay đổi tổ chức; (kèm quy trình không rõ, phụ thuộc lẫn nhau, nhóm lợi ích, nỗi sợ bị chơi trước)."
    why_it_matters: "Biết nguyên nhân thì xử lý nguyên nhân (làm rõ mục tiêu, minh bạch phân bổ, tài liệu hóa tri thức, truyền thông thay đổi) thay vì chỉ trừng phạt triệu chứng."
  - term_vi: "Năm lăng kính đạo đức"
    term_en: "Ethical lenses (Velasquez et al., Santa Clara)"
    definition: "Utility, Rights, Justice, Virtues, Care (bản gốc: Utility, Rights, Justice, Common Good, Virtue; KB này gộp Common Good vào Utility/Care và thêm Care theo Gilligan/Noddings)."
    why_it_matters: "Ranh giới chức năng/thao túng mờ, người trong cuộc dễ tự biện minh; 5 câu hỏi cho phép kiểm tra nhanh từ nhiều góc độ thay vì chỉ hỏi 'có hợp pháp?' hay 'có lợi cho tôi?'."
  - term_vi: "Cạm bẫy chính trị"
    term_en: "Political pitfalls"
    definition: "Machiavellianism (Christie & Geis 1970), đốt cầu, nịnh bợ, tham gia liên minh quá mức, tin nhầm người."
    why_it_matters: "Là các lỗi hành vi phổ biến làm mất uy tín, bị cô lập hoặc bị trả đũa; mỗi cái có dấu hiệu và cách tránh riêng."
  - term_vi: "Rủi ro người then chốt"
    term_en: "Key-person risk"
    definition: "Rủi ro khi quyền lực/hình ảnh/quan hệ tập trung vào một người (founder, kỹ sư duy nhất, kế toán trưởng, VP Sales nắm khách hàng)."
    why_it_matters: "Người đó vừa có Power (Emerson) vừa là điểm yếu của tổ chức; giảm bằng tài liệu hóa, đào tạo dự phòng, cơ chế lợi ích dài hạn."

formulas:
  - id: "m05_emerson_dependence"
    name_vi: "Mức phụ thuộc quyền lực (Emerson)"
    name_en: "Emerson power-dependence"
    expression_latex: 'P_{AB} = D_{BA} \propto \frac{I_B}{Alt_B}'
    expression_python: "I_B / Alt_B"
    excel: "=I_B/Alt_B"
    variables:
      - {symbol: "P_AB", meaning: "Quyền lực của A đối với B", unit: "chỉ số tương đối"}
      - {symbol: "D_BA", meaning: "Mức phụ thuộc của B vào A", unit: "chỉ số tương đối"}
      - {symbol: "I_B", meaning: "Mức B đầu tư động lực/nhu cầu vào tài nguyên A kiểm soát (vd % doanh thu mua từ A)", unit: "điểm hoặc %"}
      - {symbol: "Alt_B", meaning: "Số lượng/chất lượng nguồn thay thế của B ngoài quan hệ với A", unit: "số lượng"}
    when_to_use: "So sánh thế mạnh thương lượng giữa hai bên (nhà cung cấp - tập đoàn, founder - nhà đầu tư, nhân viên then chốt - công ty) và hoạch định cách cân bằng."
    why_it_works: >
      Quyền lực là thuộc tính của quan hệ: B càng CẦN thứ A giữ (tử số lớn) và càng KHÓ tìm nơi khác (mẫu số nhỏ) thì A càng mạnh.
      Vì vậy có hai đòn bẩy cân bằng: giảm nhu cầu (giảm I) hoặc tăng lựa chọn thay thế (tăng Alt). Dạng tỷ lệ là diễn giải heuristic theo Emerson 1962, không phải đơn vị đo chính xác.
    assumptions:
      - "I và Alt chấm theo cùng một thang cho hai phía mới so sánh được"
      - "Công thức mang tính định hướng (tỷ lệ), không có đơn vị chuẩn"
    pitfalls:
      - "Đếm Alt chỉ về số lượng mà bỏ chất lượng/chi phí chuyển đổi"
      - "Quên cập nhật khi thị trường đổi (hãng mở thêm kênh bán trực tiếp làm tăng Alt của hãng)"
    interpretation: "Phụ thuộc càng lớn so với phía còn lại thì phía kia càng có quyền ép giá/điều kiện. Nên xét cả hai chiều D_BA và D_AB (xem công thức tỷ lệ quyền lực)."
    example:
      inputs: {I_B: 70, Alt_B: 1}
      steps:
        - "Xưởng cơ khí B bán 70% doanh thu cho tập đoàn A: I_B = 70; B chỉ có 1 khách thay thế khả thi: Alt_B = 1 (giả định minh họa)"
        - "D_BA = 70/1 = 70"
      result: "D_BA = 70"
  - id: "m05_power_ratio"
    name_vi: "Tỷ lệ quyền lực hai chiều"
    name_en: "Mutual dependence power ratio"
    expression_latex: '\frac{P_{AB}}{P_{BA}} = \frac{D_{BA}}{D_{AB}} = \frac{I_B/Alt_B}{I_A/Alt_A}'
    expression_python: "(I_B / Alt_B) / (I_A / Alt_A)"
    excel: "=(I_B/Alt_B)/(I_A/Alt_A)"
    variables:
      - {symbol: "I_B", meaning: "Mức B cần A", unit: "điểm hoặc %"}
      - {symbol: "Alt_B", meaning: "Nguồn thay thế của B", unit: "số lượng"}
      - {symbol: "I_A", meaning: "Mức A cần B", unit: "điểm hoặc %"}
      - {symbol: "Alt_A", meaning: "Nguồn thay thế của A", unit: "số lượng"}
    when_to_use: "Định lượng độ chênh quyền lực giữa hai bên và đánh giá hiệu quả của chiến lược cân bằng (đa dạng hóa khách hàng, tìm liên minh)."
    why_it_works: "Quyền lực tương đối của A so với B chính là tỷ số hai mức phụ thuộc: A mạnh khi B phụ thuộc A nhiều hơn A phụ thuộc B."
    assumptions: ["Hai phía chấm điểm cùng thang", "Quan hệ song phương đơn giản, chưa tính bên thứ ba"]
    pitfalls: ["Chia cho 0 nếu I_A = 0 (A không cần B chút nào): coi là mất cân bằng cực đoan", "Dữ liệu I, Alt thường là ước lượng chủ quan"]
    interpretation: "Tỷ lệ lớn hơn nhiều so với 1: A áp đảo (B khó từ chối). Tiến về 1: cân bằng. Chiến lược của B nên nhằm giảm tỷ lệ này (tăng Alt_B, giảm I_B) - chi phí là đầu tư bán hàng, không phải 'đấu tranh'."
    example:
      inputs: {I_B: 70, Alt_B: 1, I_A: 8, Alt_A: 4}
      steps:
        - "D_BA = 70/1 = 70; D_AB = 8/4 = 2"
        - "P_AB/P_BA = 70/2 = 35 lần: A ép giá, kéo dài kỳ thanh toán, B khó từ chối"
        - "B tìm thêm 2 khách hàng: tỷ trọng A giảm còn 40, Alt_B = 3 -> D_BA = 40/3 = 13,33; tỷ lệ = 13,33/2 = 6,67 lần (giả định minh họa)"
      result: "35 lần ban đầu; 6,67 lần sau khi đa dạng hóa khách hàng"
  - id: "m05_dependence_index_sme"
    name_vi: "Chỉ số phụ thuộc người then chốt (đơn giản, giả định)"
    name_en: "Key-person dependence index"
    expression_latex: 'D = s \times m'
    expression_python: "share * months"
    excel: "=share*months"
    variables:
      - {symbol: "s", meaning: "Tỷ trọng hoạt động phụ thuộc vào người đó (0-1)", unit: "tỷ lệ"}
      - {symbol: "m", meaning: "Số tháng cần để thay thế người đó", unit: "tháng"}
    when_to_use: "Xếp hạng ai là người khó thay thế nhất trong SME để điều chỉnh bản đồ quyền lực/Mendelow, lập kế hoạch đào tạo dự phòng."
    why_it_works: "Nhân mức độ lan tỏa của vai trò (tỷ trọng hoạt động) với chi phí thời gian để thay thế (proxy cho Alt thấp): vừa quan trọng vừa lâu thay thì phụ thuộc lớn. Đây là chỉ số tự thiết kế của KB (Case Sao Việt), không phải công thức học thuật."
    assumptions: ["Tỷ trọng và thời gian thay thế do quản lý ước lượng", "Không tính chi phí tuyển/đào tạo bằng tiền"]
    pitfalls: ["Chỉ xét vai trò chính thức, bỏ sót người nắm thông tin/quan hệ không ghi trong sơ đồ", "Tin vào số tuyệt đối thay vì dùng để xếp hạng"]
    interpretation: "D cao => quyền thương lượng thực của người đó cao hơn vị trí thể hiện; bỏ qua họ có thể làm hỏng khả năng thực thi dù đủ phiếu bầu."
    example:
      inputs: {share: 0.60, months: 6}
      steps:
        - "T (giám đốc sản xuất): 0,60 x 6 = 3,6"
        - "M (tài chính): 0,35 x 4 = 1,4; N (kế toán trưởng): 0,30 x 3 = 0,9 (giả định minh họa, Case Sao Việt)"
      result: "D_T = 3,6 (khó thay nhất), D_M = 1,4, D_N = 0,9"
  - id: "m05_cloture_threshold"
    name_vi: "Ngưỡng biểu quyết siêu đa số (2/3)"
    name_en: "Supermajority voting threshold"
    expression_latex: '\text{Ngưỡng} = \lceil q \cdot N \rceil'
    expression_python: "-(-2 * n // 3)"
    excel: "=ROUNDUP(2/3*N,0)"
    variables:
      - {symbol: "q", meaning: "Tỷ lệ yêu cầu (2/3 cho cloture Thượng viện Mỹ trong ví dụ; 65% trong Case Sao Việt; 50% đa số đơn giản)", unit: "tỷ lệ"}
      - {symbol: "N", meaning: "Tổng số phiếu/ số người bỏ phiếu hợp lệ", unit: "phiếu"}
    when_to_use: "Bước đầu tiên khi cần thắng một cuộc bỏ phiếu: xác định cần bao nhiêu phiếu rồi mới dồn công sức vào nhóm có thể xoay chuyển."
    why_it_works: "Quyết định tập thể là bài toán đếm: phải biết đích (ngưỡng) trước khi biết khoảng cách phải bù. Biểu thức Python ứng với q = 2/3, làm tròn lên; đổi q khác thì thay biểu thức."
    assumptions: ["Làm tròn lên vì không có 'một phần phiếu'", "Cloture tính trên số thượng nghị sĩ có mặt và bỏ phiếu (nguồn); ở ví dụ lấy N = 100"]
    pitfalls: ["Điều kiện thực tế (điều lệ công ty, Luật Doanh nghiệp, quy tắc Thượng viện) có thể khác - cần kiểm tra văn bản gốc", "Ngưỡng 65% của Case Sao Việt chỉ là giả định"]
    interpretation: "Khoảng cách giữa số phiếu hiện có và ngưỡng cho biết phải thuyết phục thêm bao nhiêu."
    example:
      inputs: {n: 100}
      steps: ["Cloture cần 2/3 trên 100 thượng nghị sĩ: ceil(66,67) = 67 phiếu", "Kết quả lịch sử xấp xỉ: ~71 phiếu thuận (dư ~4) - số liệu xấp xỉ cần kiểm chứng"]
      result: "67 phiếu"
  - id: "m05_coalition_margin"
    name_vi: "Biên an toàn của liên minh"
    name_en: "Coalition safety margin"
    expression_latex: '\text{Biên} = \sum_{i \in C} s_i - \theta'
    expression_python: "sum(stakes) - threshold"
    excel: "=SUM(stakes)-threshold"
    variables:
      - {symbol: "s_i", meaning: "Số phiếu/tỷ lệ vốn của từng thành viên liên minh C", unit: "% hoặc phiếu"}
      - {symbol: "theta", meaning: "Ngưỡng thông qua", unit: "% hoặc phiếu"}
    when_to_use: "Đánh giá một liên minh cụ thể có thắng không và có đủ vững không (chịu được một thành viên đổi ý); so sánh nhiều tổ hợp."
    why_it_works: "Biên = phần dư so với ngưỡng. Biên 0 nghĩa là chỉ cần một thay đổi nhỏ là thua. Biên lớn cho phép mất một thành viên nhỏ mà vẫn thắng. Dùng cho cả đếm phiếu lẫn tỷ lệ cổ phần."
    assumptions: ["Mỗi thành viên bỏ phiếu thống nhất (cả khối)", "Các thành viên giữ nguyên lập trường"]
    pitfalls: ["Thắng sát nút về pháp lý nhưng chưa có đồng thuận để thực thi (HP-Compaq: 51,4% so với ngưỡng 50%)", "Chỉ đếm phiếu mà quên mức phụ thuộc của người thực thi (xem chỉ số phụ thuộc)"]
    interpretation: "Biên âm: thua. Biên 0: mong manh. Biên lớn hơn phiếu của thành viên nhỏ nhất bạn có thể mất: vững. Nên tìm biên đủ lớn thay vì 'đủ vừa khít'."
    example:
      inputs: {stakes: [38, 22, 10, 5], threshold: 65}
      steps:
        - "H + M + T + N = 38 + 22 + 10 + 5 = 75 (%)"
        - "Biên = 75 - 65 = 10 điểm % (giả định minh họa Case Sao Việt)"
        - "So sánh: H + M + N = 65 -> biên 0 (rất mong manh)"
      result: "Biên = +10 điểm %"
  - id: "m05_veto_check"
    name_vi: "Kiểm tra quyền phủ quyết"
    name_en: "Veto power check"
    expression_latex: '\text{Veto}(h) \iff \Theta_{tot} - s_h < \theta'
    expression_python: "(total - holder) < threshold"
    excel: "=(total-holder)<threshold"
    variables:
      - {symbol: "total", meaning: "Tổng phiếu/vốn của tất cả bên", unit: "% hoặc phiếu"}
      - {symbol: "holder", meaning: "Phiếu/vốn của bên đang xét", unit: "% hoặc phiếu"}
      - {symbol: "threshold", meaning: "Ngưỡng thông qua", unit: "% hoặc phiếu"}
    when_to_use: "Xác định bên nào không thể bỏ qua khi cần biểu quyết (HĐQT, cổ đông, hội đồng thành viên)."
    why_it_works: "Nếu tất cả người còn lại cộng lại cũng không đủ ngưỡng thì không có quyết định nào đi qua nếu thiếu bên này: bên đó có quyền chặn."
    assumptions: ["Ngưỡng là tỷ lệ cố định tính trên tổng vốn/phiếu", "Không có quyền biểu quyết đặc biệt/ưu đãi chưa tính vào"]
    pitfalls: ["Không áp dụng nếu điều lệ có cơ chế đặc biệt (cổ phiếu nhiều phiếu như WeWork ~20 phiếu/cổ phiếu theo báo cáo)", "Quyền phủ quyết 'cứng' không đồng nghĩa là quyền thực thi"]
    interpretation: "True: bên đó có veto, phải thuyết phục bằng được. False: có thể thắng không cần họ."
    example:
      inputs: {total: 100, holder: 38, threshold: 65}
      steps: ["Tổng vốn trừ H = 22 + 25 + 10 + 5 = 62 < 65 -> H có quyền phủ quyết (Case Sao Việt, giả định)"]
      result: "True (H có veto)"
  - id: "m05_minimal_coalition"
    name_vi: "Liên minh thắng tối thiểu"
    name_en: "Minimal winning coalition test"
    expression_latex: '\sum_{i\in C} s_i \ge \theta \;\wedge\; \forall j\in C:\ \sum_{i\in C} s_i - s_j < \theta'
    expression_python: "sum(stakes) >= threshold and all(sum(stakes) - s < threshold for s in stakes)"
    excel: "(thủ công/VBA: kiểm tra tổng >= ngưỡng và bỏ từng người thì < ngưỡng)"
    variables:
      - {symbol: "stakes", meaning: "Danh sách phiếu/vốn các thành viên trong liên minh", unit: "% hoặc phiếu"}
      - {symbol: "threshold", meaning: "Ngưỡng thông qua", unit: "% hoặc phiếu"}
    when_to_use: "Liệt kê các tổ hợp tối thiểu để thắng, tìm thành viên 'then chốt' và lựa chọn liên minh ít người nhất/ít nhượng bộ nhất."
    why_it_works: "Liên minh tối thiểu là tổ hợp mà bớt bất kỳ ai là mất đa số: không lãng phí nhượng bộ cho thành viên thừa. Dùng để biết mình có bao nhiêu 'đường đi' đến chiến thắng."
    assumptions: ["Mỗi bên bỏ phiếu cả khối", "Chỉ xét ngưỡng tỷ lệ vốn"]
    pitfalls: ["Liên minh tối thiểu có thể có biên 0 (rất mong manh) - không nên chọn nếu có tổ hợp biên lớn hơn", "Số tổ hợp tăng nhanh nếu nhiều bên; dùng script để liệt kê"]
    interpretation: "Trong Case Sao Việt có 5 liên minh tối thiểu: H+M+N (65), H+K+N (68), H+M+T (70), H+K+T (73), H+M+K (85); H xuất hiện trong tất cả."
    example:
      inputs: {stakes: [38, 22, 5], threshold: 65}
      steps: ["Tổng = 65 >= 65", "Bỏ H: 27 < 65; bỏ M: 43 < 65; bỏ N: 60 < 65 -> mọi thành viên đều thiết yếu"]
      result: "True (H+M+N là liên minh tối thiểu, biên = 0)"
  - id: "m05_mendelow_class"
    name_vi: "Phân loại ma trận Mendelow theo điểm Power/Interest"
    name_en: "Mendelow quadrant classification"
    expression_latex: 'Q = f(P \ge 5,\ I \ge 5) \in \{\text{Manage Closely, Keep Satisfied, Keep Informed, Monitor}\}'
    expression_python: "('Manage Closely' if interest >= cutoff else 'Keep Satisfied') if power >= cutoff else ('Keep Informed' if interest >= cutoff else 'Monitor')"
    excel: '=IF(power>=cutoff,IF(interest>=cutoff,"Manage Closely","Keep Satisfied"),IF(interest>=cutoff,"Keep Informed","Monitor"))'
    variables:
      - {symbol: "power", meaning: "Điểm quyền lực (1-10): quyền phê duyệt/ngân sách/giấy phép/thông tin then chốt, khả năng cản trở", unit: "điểm 1-10"}
      - {symbol: "interest", meaning: "Điểm quan tâm (1-10): kết quả ảnh hưởng công việc/thu nhập/uy tín", unit: "điểm 1-10"}
      - {symbol: "cutoff", meaning: "Ngưỡng phân loại (gợi ý = 5)", unit: "điểm"}
    when_to_use: "Lập danh sách stakeholder và quyết định phân bổ thời gian/kênh liên lạc cho từng nhóm."
    why_it_works: "Biến câu hỏi mơ hồ 'ai quan trọng?' thành hai câu hỏi trả lời được: họ có thể ảnh hưởng kết quả không (Power) và họ có quan tâm không (Interest); 4 ô tương ứng 4 mức đầu tư công sức."
    assumptions: ["Ngưỡng 5 là gợi ý; quy ước >= 5 là 'cao' (Case Sao Việt: N có Power = 5 xếp Manage Closely)", "Điểm chấm chủ quan, cần cập nhật"]
    pitfalls: ["Xếp cố định: stakeholder Interest thấp có thể nhảy lên cao khi quyền lợi bị đụng tới (công đoàn khi cắt giảm nhân sự)", "Đánh giá Power chỉ theo chức danh, bỏ qua mức phụ thuộc Emerson (VP Sales C nắm 40% pipeline được nâng Power từ 4 lên 7)", "Coi khách hàng hiện hữu là Low Power (JC Penney)"]
    interpretation: "Manage Closely: họp định kỳ, đồng thiết kế. Keep Satisfied: báo cáo ngắn, báo sớm rủi ro. Keep Informed: thông tin thường xuyên, tham vấn, tạo champion. Monitor: thông tin chung, theo dõi thay đổi vị trí."
    example:
      inputs: {power: 4, interest: 8, cutoff: 5}
      steps: ["VP Sales C ban đầu: Power 4, Interest 8 -> Keep Informed", "Sau khi tính phụ thuộc (40% pipeline), Power = 7 -> Manage Closely (Case founder startup, giả định)"]
      result: "Keep Informed (trước điều chỉnh); Manage Closely (sau điều chỉnh Power = 7)"
  - id: "m05_velasquez_score"
    name_vi: "Điểm đạo đức 5 lăng kính (Velasquez, thang 0-2)"
    name_en: "Velasquez ethical score"
    expression_latex: 'E = \sum_{k=1}^{5} e_k,\ e_k \in \{0,1,2\}'
    expression_python: "sum(scores)"
    excel: "=SUM(range)"
    variables:
      - {symbol: "e_k", meaning: "Điểm từng lăng kính: Utility, Rights, Justice, Virtues, Care (0 = vi phạm, 1 = chưa rõ, 2 = đạt)", unit: "điểm 0-2"}
    when_to_use: "Kiểm tra nhanh một hành động chính trị/ảnh hưởng trước khi làm (và so sánh hai cách làm cùng mục tiêu)."
    why_it_works: "Thay vì một câu hỏi duy nhất, 5 lăng kính ép người ra quyết định nhìn từ lợi ích tổng thể, quyền người khác, công bằng, đức hạnh (bài kiểm tra 'đăng báo') và quan tâm hậu quả. Thang điểm 0-2 và ngưỡng phân loại là quy ước của KB, không phải thang chuẩn học thuật."
    assumptions: ["Người chấm trung thực (dễ tự biện minh)", "Các lăng kính trọng số bằng nhau"]
    pitfalls: ["Tự chấm điểm cao cho chính mình - nên có người thứ hai đánh giá", "Chiến thuật như Cooptation là vùng xám: điểm phụ thuộc cách làm (minh bạch dữ liệu)"]
    interpretation: "8-10: chức năng; 5-7: vùng xám cần điều chỉnh; 0-4: mặt tối. Checklist yêu cầu tổng >= 8 trước khi hành động."
    example:
      inputs: {scores: [2, 2, 2, 2, 1]}
      steps: ["Cách A (thu nạp CFO minh bạch): Utility 2, Rights 2, Justice 2, Virtues 2, Care 1 -> 9 (chức năng)", "Cách B (định hướng, giấu dữ liệu bất lợi): 1 + 0 + 1 + 0 + 0 = 2 (mặt tối)"]
      result: "A = 9 (chức năng); B = 2 (mặt tối)"
  - id: "m05_pdi_band"
    name_vi: "Phân nhóm Power Distance"
    name_en: "PDI banding"
    expression_latex: '\text{Nhóm} = \begin{cases}\text{Cao} & PDI>60\\ \text{Trung bình} & 40\le PDI\le 60\\ \text{Thấp} & PDI<40\end{cases}'
    expression_python: "'high' if pdi > 60 else ('medium' if pdi >= 40 else 'low')"
    excel: '=IF(pdi>60,"Cao",IF(pdi>=40,"Trung bình","Thấp"))'
    variables:
      - {symbol: "pdi", meaning: "Điểm Power Distance Index quốc gia (0-100+)", unit: "điểm"}
    when_to_use: "Chọn phong cách tác động/lãnh đạo phù hợp văn hóa; đánh giá rủi ro xung đột khi công ty nước ngoài vào VN hoặc ngược lại."
    why_it_works: "PDI mô tả mức chấp nhận chênh lệch quyền lực; phân nhóm giúp dự đoán phản ứng với mệnh lệnh, phản biện công khai. Điểm quốc gia xấp xỉ theo dữ liệu Hofstede, lệch giữa các phiên bản - chỉ so sánh tương đối."
    assumptions: ["Điểm quốc gia phản ánh xu hướng trung bình, không phải từng cá nhân/doanh nghiệp", "Cần đối chiếu Hofstede Insights hiện hành"]
    pitfalls: ["Áp đặt khuôn mẫu lên từng người", "Dùng điểm cũ không cập nhật"]
    interpretation: "PDI cao (VN ~70): tôn trọng cấp bậc, quyết định từ trên, nhân viên im lặng thay vì phản đối - hỏi riêng từng người, có kênh góp ý ẩn danh/1-1; vẫn cần Expert/Referent để có nhiệt tình."
    example:
      inputs: {pdi: 70}
      steps: ["Việt Nam ~70 > 60 -> nhóm cao; so: Mỹ 40 (trung bình), Đan Mạch 18 (thấp) - điểm xấp xỉ theo bài gốc"]
      result: "high"
  - id: "m05_runway"
    name_vi: "Runway và khoảng đệm so với mốc gọi vốn"
    name_en: "Cash runway and buffer"
    expression_latex: '\text{Runway} = \frac{\text{Vốn}}{\text{Burn}},\quad \text{Đệm} = \text{Runway} - T_{target}'
    expression_python: "cash / burn"
    excel: "=cash/burn"
    variables:
      - {symbol: "cash", meaning: "Tiền mặt/vốn hạt giống hiện có", unit: "USD"}
      - {symbol: "burn", meaning: "Chi phí ròng hằng tháng", unit: "USD/tháng"}
      - {symbol: "T_target", meaning: "Mốc nhà đầu tư kỳ vọng (vd gọi vốn Series A)", unit: "tháng"}
    when_to_use: "Khi nhà đầu tư/founder/nhân sự xung đột về tốc độ vs chất lượng: xác định áp lực thời gian là thật hay chỉ là sức ép."
    why_it_works: "Quyền lực thương lượng của nhà đầu tư gắn với việc công ty còn bao nhiêu tháng tiền. Tính runway biến tranh cãi cảm tính thành dữ kiện chung để 3 bên 'cùng nhìn một bản đồ'."
    assumptions: ["Burn không đổi (thực tế thường tăng khi tuyển dụng)", "Chưa tính doanh thu/nguồn vốn khác"]
    pitfalls: ["Dùng burn cũ trong khi chi phí tăng", "Quên rằng gọi vốn mất nhiều tháng nên mốc nên sớm hơn runway"]
    interpretation: "Đệm càng nhỏ, áp lực thời gian càng thật và quyền lực thương lượng của nhà đầu tư càng lớn."
    example:
      inputs: {cash: 500000, burn: 25000}
      steps: ["Runway = 500.000 / 25.000 = 20 tháng", "Đệm = 20 - 18 = 2 tháng so với mốc Series A (giả định minh họa)"]
      result: "20 tháng; đệm 2 tháng"
  - id: "m05_npv_annuity"
    name_vi: "NPV dự án với dòng lợi ích đều (niên kim)"
    name_en: "NPV of level annual benefit"
    expression_latex: 'NPV = B \cdot \frac{1-(1+r)^{-n}}{r} - I_0'
    expression_python: "benefit * (1 - (1 + r) ** -n) / r - capex"
    excel: "=PV(r,n,-benefit)-capex"
    variables:
      - {symbol: "B", meaning: "Lợi ích tăng thêm hằng năm (EBITDA tăng thêm)", unit: "tỷ đồng/năm"}
      - {symbol: "r", meaning: "Tỷ lệ chiết khấu", unit: "tỷ lệ/năm"}
      - {symbol: "n", meaning: "Vòng đời dự án", unit: "năm"}
      - {symbol: "I_0", meaning: "Vốn đầu tư ban đầu (capex)", unit: "tỷ đồng"}
    when_to_use: "Chuẩn bị dữ liệu Rational Persuasion để trả lời lo ngại tài chính của bên có Informational/Expert Power (vd chị M phụ trách tài chính) trước khi biểu quyết."
    why_it_works: "Hiện giá niên kim quy lợi ích nhiều năm về hiện tại để so với vốn bỏ ra; công khai cả kịch bản xấu làm tăng Expert Power của người đề xuất và biến người phản đối thành đồng tác giả điều kiện dừng."
    assumptions: ["Lợi ích đều mỗi năm, không giá trị thanh lý, không thuế (giả định minh họa của bài)", "Tỷ lệ chiết khấu 14% là giả định"]
    pitfalls: ["Chỉ trình bày kịch bản đẹp (mất tín nhiệm khi bị bóc)", "Bỏ qua thuế, khấu hao, vốn lưu động"]
    interpretation: "NPV dương: tạo giá trị theo giả định. Luôn tính thêm kịch bản xấu và điểm hòa vốn."
    example:
      inputs: {benefit: 1.8, r: 0.14, n: 8, capex: 6}
      steps:
        - "Hệ số niên kim = (1 - 1,14^-8)/0,14 = 4,639"
        - "NPV = 1,8 x 4,639 - 6 = +2,35 tỷ đồng; hoàn vốn giản đơn = 6/1,8 = 3,33 năm"
        - "Kịch bản xấu (B = 0,9): NPV = 0,9 x 4,639 - 6 = -1,83 tỷ; hoàn vốn = 6,67 năm"
      result: "NPV kỳ vọng ≈ +2,35 tỷ; NPV xấu ≈ -1,83 tỷ"
  - id: "m05_breakeven_benefit"
    name_vi: "Lợi ích hòa vốn NPV tối thiểu"
    name_en: "NPV break-even annual benefit"
    expression_latex: 'B^{*} = \frac{I_0}{\left(1-(1+r)^{-n}\right)/r}'
    expression_python: "capex / ((1 - (1 + r) ** -n) / r)"
    excel: "=capex/PV(r,n,-1)"
    variables:
      - {symbol: "capex", meaning: "Vốn đầu tư ban đầu", unit: "tỷ đồng"}
      - {symbol: "r", meaning: "Tỷ lệ chiết khấu", unit: "tỷ lệ/năm"}
      - {symbol: "n", meaning: "Vòng đời", unit: "năm"}
    when_to_use: "Xác định mức lợi ích tối thiểu để dự án đáng làm; đặt điều kiện dừng trung thực khi thuyết phục bên lo ngại."
    why_it_works: "Giải NPV = 0 theo B: cho biết tỷ lệ % kỳ vọng phải đạt được. Chia B* cho kỳ vọng ra 'biên chịu lỗi' của kế hoạch."
    assumptions: ["Như công thức NPV niên kim"]
    pitfalls: ["Hiểu B* là mục tiêu thay vì sàn tối thiểu"]
    interpretation: "Case Sao Việt: B* ≈ 1,29 tỷ = ~72% mức kỳ vọng 1,8 tỷ -> lo ngại của người phản đối có cơ sở; dự án chỉ đáng làm nếu đạt tối thiểu ~72% lợi ích kỳ vọng."
    example:
      inputs: {capex: 6, r: 0.14, n: 8}
      steps: ["B* = 6 / 4,639 = 1,29 tỷ/năm", "Tỷ lệ so với kỳ vọng = 1,29/1,8 = 0,72 (72%)"]
      result: "B* ≈ 1,29 tỷ/năm (≈ 72% kỳ vọng)"
  - id: "m05_leverage_ebitda"
    name_vi: "Đòn bẩy nợ / EBITDA sau vay"
    name_en: "Debt-to-EBITDA after borrowing"
    expression_latex: '\frac{D_{cũ}+D_{mới}}{EBITDA}'
    expression_python: "(existing_debt + new_debt) / ebitda"
    excel: "=(existing_debt+new_debt)/ebitda"
    variables:
      - {symbol: "existing_debt", meaning: "Dư nợ hiện tại", unit: "tỷ đồng"}
      - {symbol: "new_debt", meaning: "Khoản vay mới", unit: "tỷ đồng"}
      - {symbol: "ebitda", meaning: "EBITDA hằng năm", unit: "tỷ đồng/năm"}
    when_to_use: "Trả lời lo ngại về nợ của bên nắm tài chính trước khi biểu quyết đầu tư."
    why_it_works: "Chỉ số khả năng gánh nợ phổ biến mà ngân hàng dùng làm giới hạn; so với giới hạn cho biết còn dư địa bao nhiêu."
    assumptions: ["Giới hạn ngân hàng 2,5 lần là giả định minh họa; kiểm tra điều khoản tín dụng thực tế"]
    pitfalls: ["Chỉ nhìn một chỉ số, bỏ qua dòng tiền trả lãi/gốc"]
    interpretation: "Case Sao Việt: 7,5/5,2 = 1,44 lần, dư khoảng 1,06 lần so với giới hạn giả định 2,5 lần."
    example:
      inputs: {existing_debt: 3, new_debt: 4.5, ebitda: 5.2}
      steps: ["(3 + 4,5) / 5,2 = 1,44 lần", "Dư địa = 2,5 - 1,44 = 1,06 lần"]
      result: "≈ 1,44 lần EBITDA"
  - id: "m05_reward_cost"
    name_vi: "Chi phí dùng Reward Power cho một yêu cầu"
    name_en: "Reward power cost"
    expression_latex: 'C = n \times d \times w'
    expression_python: "n * days * rate"
    excel: "=n*days*rate"
    variables:
      - {symbol: "n", meaning: "Số người", unit: "người"}
      - {symbol: "d", meaning: "Số ngày", unit: "ngày"}
      - {symbol: "w", meaning: "Mức thưởng mỗi người mỗi ngày", unit: "VNĐ"}
    when_to_use: "So sánh chi phí giữa các nguồn quyền lực khi yêu cầu nhân viên làm thêm (Legitimate rẻ nhưng tuân thủ tối thiểu; Reward tốn tiền, tạo tiền lệ)."
    why_it_works: "Định lượng chi phí tiền mặt để đặt cạnh chi phí ẩn (tiền lệ, nghỉ việc, lỗi) của các base khác."
    assumptions: ["Mức thưởng 300.000 đ/người/ngày là giả định minh họa"]
    pitfalls: ["Lần sau họ đòi thưởng cao hơn (tạo tiền lệ)", "Quên chi phí không bằng tiền của Expert/Referent (thời gian)"]
    interpretation: "Cách rẻ nhất thường cho kết quả rẻ nhất; kết hợp Legitimate làm nền + Reward bù công bằng + Expert/Referent để người ta muốn làm."
    example:
      inputs: {n: 6, days: 3, rate: 300000}
      steps: ["6 x 3 x 300.000 = 5.400.000 đ"]
      result: "5.400.000 đ"
  - id: "m05_pct_change"
    name_vi: "Phần trăm thay đổi (ví dụ sụt doanh thu)"
    name_en: "Percent change"
    expression_latex: '\frac{X_{mới}-X_{cũ}}{X_{cũ}}\times 100'
    expression_python: "(new - old) / old * 100"
    excel: "=(new-old)/old"
    variables:
      - {symbol: "new", meaning: "Giá trị kỳ sau", unit: "cùng đơn vị"}
      - {symbol: "old", meaning: "Giá trị kỳ trước", unit: "cùng đơn vị"}
    when_to_use: "Đo hậu quả của việc bỏ qua bản đồ stakeholder (Case JC Penney: doanh thu giảm sau khi thay đổi mô hình giá mà không tham vấn)."
    why_it_works: "Chuẩn hóa thay đổi về tỷ lệ để so sánh được."
    assumptions: ["Số liệu JC Penney là xấp xỉ, cần kiểm chứng với báo cáo gốc"]
    pitfalls: ["Chia cho old = 0"]
    interpretation: "Doanh thu 17,26 -> 12,98 tỷ USD: giảm ~24,8%."
    example:
      inputs: {new: 12.98, old: 17.26}
      steps: ["(12,98 - 17,26)/17,26 = -0,248 -> -24,8%"]
      result: "≈ -24,8%"

frameworks:
  - id: "m05_power_authority_influence"
    name_vi: "Phân biệt Power - Authority - Influence"
    name_en: "Power vs Authority vs Influence"
    origin: "Weber (1922, diễn giải) và Dahl (1957) cho định nghĩa quyền lực; phân biệt ba khái niệm là cách tổng hợp trong giáo trình quản trị."
    components:
      - "Power: khả năng tác động (chính hoặc bất chính), không ổn định, phụ thuộc ngữ cảnh; nguồn: cá nhân, quan hệ, tài nguyên"
      - "Authority: quyền hạn hợp pháp theo vị trí, ổn định, kèm trách nhiệm"
      - "Influence: thuyết phục tự nguyện, bền nếu tích lũy uy tín; nguồn: kỹ năng, uy tín, quan hệ"
    when_to_use: "Chẩn đoán vì sao một người có chức mà không có sức nặng, hoặc không có chức mà có sức nặng."
    how_to_apply:
      - "Với mỗi người trong tình huống, hỏi: có authority (vị trí)? có power thực (tài nguyên, thông tin, chuyên môn, phụ thuộc)? có influence (uy tín, được nể)?"
      - "Vẽ lại bản đồ quyền lực ngoài sơ đồ tổ chức"
    how_to_read_results: "Trưởng phòng mới: có Authority, thiếu Power/Influence -> nhân viên chỉ làm tối thiểu. Kế toán trưởng: Power cao (thông tin, chuyên môn) nhưng Authority hạn chế -> nút thắt không có trên sơ đồ. Mentor: Influence thuần túy."
    pitfalls: ["Chỉ đọc sơ đồ tổ chức", "Coi hiệu quả lãnh đạo là một công thức định lượng (chỉ là heuristic)"]
    example: "Trưởng phòng mới được bổ nhiệm nhưng nhân viên cũ vẫn 'chạy' theo đồng nghiệp thâm niên: có authority, thiếu power/influence."
  - id: "m05_french_raven"
    name_vi: "Bảy nguồn quyền lực (French & Raven)"
    name_en: "French & Raven bases of power (7 bases)"
    origin: "French & Raven (1959, Studies in Social Power, ĐH Michigan): 5 base; Raven 1965 thêm Informational; Connection thêm vào qua giáo trình (Hersey & Blanchard). Họ đổi câu hỏi thành 'vì sao B chịu làm theo A?'."
    components:
      - "Legitimate (vị trí chính thức): ổn định, chi phí thấp, dễ gây phản kháng nếu lạm dụng, không tạo động lực nội tại; hiệu quả: tổ chức quan liêu, khủng hoảng, rủi ro cao cần nhất quán"
      - "Reward (kiểm soát phần thưởng): nhanh, tích cực, nhưng chi phí cao, tạo phụ thuộc, gây bất bình nếu không công bằng; hiệu quả: việc lặp lại, mục tiêu ngắn hạn, nhân viên mới"
      - "Coercive (khả năng phạt/đe dọa): nhanh, rộng, rẻ nhưng sinh sợ hãi, phản kháng, tăng turnover; hiệu quả: khủng hoảng tồn vong, gian lận, tuân thủ tuyệt đối (an toàn lao động)"
      - "Expert (kiến thức/kỹ năng): bền, được tôn trọng, nhưng tích lũy lâu, phạm vi hẹp, mất khi kiến thức lạc hậu; hiệu quả: quyết định chuyên môn phức tạp, tổ chức tri thức"
      - "Referent (sức hút, giá trị chung): mạnh nhất, bền, tạo động lực nội tại nhưng khó tích lũy/chuyển giao, dễ thành sùng bái cá nhân; hiệu quả: lãnh đạo đổi mới, khủng hoảng, văn hóa"
      - "Informational (kiểm soát thông tin cần thiết): hiệu quả cao, khó phát hiện, nhưng mất uy tín nếu bị bóc, có rủi ro pháp lý; hiệu quả: tổ chức phức tạp, bất định"
      - "Connection (quan hệ với người có quyền lực): mạnh, kích hoạt nhanh nhưng phụ thuộc, dễ nepotism/ghen tị; hiệu quả: xã hội dựa quan hệ, cấp phát khan hiếm, M&A, lobbying"
      - "Nhóm Yukl: Legitimate, Reward, Coercive = quyền lực vị trí; Expert, Referent = quyền lực cá nhân"
    when_to_use: "Phân tích vì sao người này làm theo người kia; chọn cách tác động; xây bản đồ quyền lực."
    how_to_apply:
      - "Liệt kê từng người và 1-2 base chính của họ"
      - "Xác định mức độ tuân thủ mong muốn (compliance / identification / internalization theo Kelman) rồi chọn base tương ứng"
      - "Kết hợp: Legitimate làm nền, Reward bù đắp công bằng, Expert/Referent để người ta muốn làm"
      - "Ví dụ 'một yêu cầu - bảy cách': yêu cầu tổ 6 thợ làm thêm 3 ngày: Legitimate (rẻ, tuân thủ tối thiểu), Reward (5,4 triệu, tiền lệ), Coercive (sợ, nghỉ việc), Expert (giải thích số liệu, cần uy tín trước), Referent (cùng làm, tự nguyện), Informational (chia sẻ tiến độ), Connection (nhờ 'anh cả' tổ thợ)"
    how_to_read_results: "Cách rẻ nhất (Legitimate, Coercive) thường cho kết quả rẻ nhất; cách tốn công hơn (Expert, Referent) cho tuân thủ tự nguyện và bền."
    pitfalls: ["Coi '7 loại' là bản gốc 1959", "Dựa quá nhiều vào Legitimate/Coercive khi cần cam kết", "Dùng Informational bằng cách giấu thông tin (mất uy tín, rủi ro pháp lý)", "Connection thành nepotism"]
    example: "Giám đốc nhà máy ra lệnh cải tiến quy trình (Legitimate); đầu bếp nổi tiếng được làm theo menu vì Expert; FPT giữ người bằng Referent + Reward (ESOP) - minh họa theo nguồn công khai."
  - id: "m05_emerson_balancing"
    name_vi: "Lý thuyết phụ thuộc quyền lực và bốn cách cân bằng (Emerson)"
    name_en: "Emerson power-dependence and balancing operations"
    origin: "Richard Emerson (1962, American Sociological Review): quyền lực là thuộc tính của quan hệ, bằng mức phụ thuộc của bên kia."
    components:
      - "Phụ thuộc = nhu cầu (I) / số nguồn thay thế (Alt)"
      - "Rút lui: giảm nhu cầu với đối phương"
      - "Mở rộng mạng lưới: tìm thêm nguồn thay thế"
      - "Tạo địa vị/giá trị cho đối phương để họ cần mình hơn"
      - "Hình thành liên minh giữa các bên yếu"
    when_to_use: "SME phụ thuộc đại lý/tập đoàn; founder phụ thuộc một nhà đầu tư; công ty phụ thuộc kỹ sư/nhân viên không thay thế được."
    how_to_apply:
      - "Tính D hai chiều (m05_emerson_dependence) và tỷ lệ quyền lực"
      - "Chọn 1-2 đòn bẩy (tăng Alt, giảm I, liên minh, tăng giá trị mình)"
      - "Đo lại tỷ lệ sau khi hành động"
    how_to_read_results: "Tỷ lệ 35 giảm còn 6,7 sau khi đa dạng hóa khách hàng = đàm phán tốt hơn rất nhiều dù chưa ngang hàng."
    pitfalls: ["Chỉ đếm số nhà cung cấp mà bỏ chi phí chuyển đổi", "Không nhận ra chính mình là người bị phụ thuộc (key-person risk)"]
    example: "Founder phụ thuộc vốn của một nhà đầu tư duy nhất dễ mất kiểm soát khi cần gọi vốn gấp; nhà phân phối độc quyền mạnh cho đến khi hãng mở kênh trực tiếp (tăng Alt)."
  - id: "m05_kelman_levels"
    name_vi: "Ba mức phản ứng với ảnh hưởng (Kelman)"
    name_en: "Kelman compliance - identification - internalization"
    origin: "Kelman (1958, Journal of Conflict Resolution)."
    components:
      - "Compliance: làm vì sợ/thưởng; nguồn: Coercive, Reward, Legitimate; chỉ làm khi bị giám sát"
      - "Identification: làm vì muốn giống/thuộc về; nguồn: Referent; bền hơn nhưng gắn với một người"
      - "Internalization: làm vì tin là đúng; nguồn: Expert, Informational thuyết phục; bền nhất"
    when_to_use: "Chọn nguồn quyền lực theo loại hành vi cần: tuân thủ ngắn hạn hay cam kết bền."
    how_to_apply: ["Xác định mục tiêu (tuân thủ nhanh hay cam kết)", "Chọn base tương ứng", "Kiểm tra sau: người ta còn làm khi không ai giám sát không?"]
    how_to_read_results: "Nếu hành vi biến mất khi hết giám sát: đang ở mức compliance."
    pitfalls: ["Dùng Coercive cho mục tiêu cần sáng tạo/cẩn thận"]
    example: "Công nhân đội mũ bảo hộ vì sợ trừ lương (compliance); kỹ sư tự cải tiến vì tin giá trị (internalization)."
  - id: "m05_hofstede_pdi"
    name_vi: "Khoảng cách quyền lực (Hofstede PDI)"
    name_en: "Hofstede Power Distance"
    origin: "Geert Hofstede, khảo sát nhân viên IBM >50 quốc gia, cuối 1960s-đầu 1970s, công bố Culture's Consequences (1980); PDI là một trong các chiều văn hóa (ban đầu 4, sau mở rộng 6)."
    components:
      - "PDI cao (>60): chấp nhận bất bình đẳng quyền lực, tôn trọng cấp bậc/thâm niên, top-down, sợ sếp; ví dụ Malaysia 104, Mexico 81, Ấn Độ 77, Việt Nam 70"
      - "PDI trung bình (40-60): cân bằng; ví dụ Ý 50, Đức 35, Anh 35, Mỹ 40 (bài gốc xếp chung nhóm)"
      - "PDI thấp (<40): tôn trọng năng lực, quyết định dân chủ, gọi sếp bằng tên; ví dụ Đan Mạch 18, Áo 11, New Zealand 22, Úc 38"
      - "Điểm số xấp xỉ, lệch giữa phiên bản; so sánh tương đối"
    when_to_use: "Quản lý đội ngũ Việt Nam, công ty nước ngoài tại VN, thiết kế kênh phản hồi."
    how_to_apply:
      - "Nhân viên thường im lặng thay vì phản đối công khai: chủ động hỏi riêng từng người"
      - "Top-down nhanh nhưng thiếu thông tin tuyến đầu: bổ sung kênh góp ý ẩn danh hoặc 1-1"
      - "Quyền lực vị trí đủ để được tuân thủ nhưng chưa đủ để nhiệt tình: đầu tư Expert/Referent"
      - "Cơ hội: công ty Việt giảm PDI nội bộ (họp mở, góp ý hai chiều) để thu hút nhân tài trẻ"
    how_to_read_results: "PDI VN ~70 (cao): sự im lặng không đồng nghĩa với đồng thuận."
    pitfalls: ["Khuôn mẫu hóa từng cá nhân", "Quản lý nước ngoài áp lãnh đạo dân chủ cực đoan mà không hiểu bối cảnh"]
    example: "Công ty Tây phương ở VN căng thẳng giữa văn hóa bình đẳng và văn hóa cấp bậc."
  - id: "m05_political_tactics_12"
    name_vi: "12 chiến thuật chính trị (4 nhóm) và cách phòng thủ"
    name_en: "12 political tactics and defensive tactics"
    origin: "Allen, Madison, Porter, Renwick & Mayes (1979) liệt kê hành vi chính trị của quản lý; bộ 12 chiến thuật là tổng hợp của KB, kết hợp Kipnis et al. (1980) và Yukl, chia 4 nhóm theo bản chất hành động."
    components:
      - "A. Xây dựng & liên kết (rủi ro đạo đức thấp; base Connection, Referent): 1) Coalition - gộp người cùng lợi ích để gộp quyền lực; 2) Networking - gặp gỡ, duy trì quan hệ với người có ảnh hưởng; 3) Alliances - đồng minh chính thức dài hạn, có thỏa thuận ai làm gì/ai lấy gì"
      - "B. Thông tin & hình ảnh (rủi ro trung bình-cao; base Informational, Referent): 4) Information Control - giấu, lọc, chậm trễ, làm phức tạp hóa; 5) Impression Management - quản lý ấn tượng (trang phục, hành vi, thành quả, liên kết; trượt sang nhận công đẩy lỗi); 6) Image Building - dài hạn, thương hiệu cá nhân (định hướng, rà soát, tích lũy, truyền thông, chứng minh)"
      - "C. Thao túng & tác động (rủi ro cao; base Legitimate, Coercive): 7) Scapegoating - chọn người yếu, gieo nghi ngờ, lặp lại, không bằng chứng; 8) Cooptation - mời người phản đối vào quyết định để họ gắn trách nhiệm (thu nạp tích cực nếu dữ liệu thật, thao túng nếu dữ liệu bị định hướng); 9) Legitimating - viện dẫn quy định, ủy quyền, tiền lệ, chuyên gia"
      - "D. Thuyết phục trực tiếp (rủi ro thấp; base Expert, Reward): 10) Rational Persuasion - bằng chứng, logic; 11) Personal Appeals - dựa tình cảm/quan hệ, nhanh nhưng dễ bị coi là lợi dụng; 12) Exchange - 'bạn giúp tôi, tôi giúp bạn'"
      - "Phòng thủ chung: nhận biết sớm, xây mạng lưới, giữ uy tín, ghi chép, lập luận rõ ràng có bằng chứng, escalate khi bị bất công"
      - "Phòng thủ cụ thể: Coalition -> counter-coalition; Information Control -> yêu cầu công khai thông tin ('What data do you have?'); Impression Mgmt -> nhắc thành tích thực; Scapegoating -> bằng chứng phản bác + ghi chép; Cooptation -> không tham gia hoặc tham gia hạn chế cam kết"
    when_to_use: "Nhận diện thủ đoạn đang diễn ra, chọn chiến thuật chính đáng, tự bảo vệ."
    how_to_apply:
      - "Xác định nhóm chiến thuật đang gặp (A-D) và mức rủi ro đạo đức"
      - "Với chiến thuật vùng xám (Cooptation, Impression Mgmt) tự chấm Velasquez"
      - "Chọn phòng thủ tương ứng và ghi lại bằng chứng"
    how_to_read_results: "Nhóm A, D thường chức năng; B, C dễ trượt sang mặt tối. Hiệu quả thực nghiệm của từng chiến thuật xem Yukl."
    pitfalls: ["Coi 12 chiến thuật là danh mục nguyên bản của học thuật (đây là tổng hợp của KB)", "Dùng Information Control hoặc Scapegoating - vi phạm đạo đức/pháp lý (vd báo cáo doanh thu sai cho nhà đầu tư)"]
    example: "3 Phó GĐ liên minh đề xuất cắt giảm chi phí; nhân viên bán hàng cùng kiến nghị CRM mới (Coalition). PM đổ lỗi phòng IT dù chính mình đổi yêu cầu 3 lần (Scapegoating)."
  - id: "m05_political_skill"
    name_vi: "Năng lực chính trị (Ferris)"
    name_en: "Political skill"
    origin: "Ferris et al. (2005, Journal of Management)."
    components: ["Nhạy bén xã hội", "Ảnh hưởng giữa các cá nhân", "Xây dựng mạng lưới", "Chân thành (apparent sincerity)"]
    when_to_use: "Phát triển năng lực chính trị chức năng cho quản lý/junior."
    how_to_apply: ["Đọc bản đồ quyền lực", "Chọn chiến thuật chức năng", "Thể hiện chân thành, nhất quán lời nói - hành động"]
    how_to_read_results: "Chân thành là yếu tố phân biệt chính trị chức năng với thao túng."
    pitfalls: ["Giả vờ chân thành (bị bóc là mất tín nhiệm)"]
    example: "Phó TGĐ liên kết các giám đốc khác đề xuất cấu trúc mới có lợi cả bộ phận lẫn tổ chức."
  - id: "m05_cialdini_7"
    name_vi: "Bảy nguyên tắc ảnh hưởng (Cialdini)"
    name_en: "Cialdini's 7 principles of influence"
    origin: "Robert Cialdini (ĐH Bang Arizona), Influence: The Psychology of Persuasion (1984) - 6 nguyên tắc từ nghiên cứu thực nghiệm và quan sát người làm nghề thuyết phục; Unity bổ sung trong Pre-Suasion (2016)."
    components:
      - "1. Reciprocity ('được thì phải trả'): tặng trước (thông tin, thời gian, free trial), rồi mới đề nghị; tránh quà mang tính mua chuộc"
      - "2. Commitment/Consistency ('đã nói thì phải nhất quán'): cam kết nhỏ, công khai, mở rộng dần (foot-in-the-door); lưu ý rủi ro lao động nếu vượt giới hạn giờ làm theo luật"
      - "3. Social Proof ('nhiều người làm thì chắc đúng'): early adopters, testimonials, số liệu thật; chỉ đạo đức nếu con số đúng"
      - "4. Authority ('chuyên gia đáng tin'): bằng cấp, danh tiếng, tham chiếu liên quan trực tiếp vấn đề (không liên quan = phô trương)"
      - "5. Liking ('người mình thích dễ nói đồng ý'): tương đồng, khen chân thành, hợp tác, tiếp xúc nhiều; không thay thế được số liệu"
      - "6. Scarcity ('cái gì hiếm thì quý'): chỉ dùng khi khan hiếm thật (hạn thời gian/số lượng/độc quyền)"
      - "7. Unity ('người nhà'): shared identity (cùng quê, cùng trường, cùng nghề); mạnh hơn Liking vì chạm 'tôi là ai'"
    when_to_use: "Thuyết phục khách hàng/nhà đầu tư/nhân viên; nhận ra khi mình bị dẫn dắt."
    how_to_apply:
      - "Với mỗi stakeholder, hỏi nguyên tắc nào có thật và phù hợp"
      - "Chỉ dùng khi sự thật phù hợp"
      - "So sánh: Cialdini tập trung cách thuyết phục (tâm lý, sales/marketing/PR); French & Raven tập trung nguồn quyền lực (cấu trúc, lãnh đạo nội bộ)"
    how_to_read_results: "Phân biệt Liking (tôi thích bạn) và Unity (bạn là một phần của chúng ta)."
    pitfalls: ["Khan hiếm/bằng chứng xã hội giả (mua đánh giá) = thao túng và rủi ro pháp lý", "Dùng Authority bằng bằng cấp không liên quan", "Theranos: Authority (HĐQT toàn tên tuổi) + Social Proof + Scarcity/FOMO để nhà đầu tư không kiểm chứng"]
    example: "Startup free trial 30 ngày (Reciprocity); khách 'Được 100 doanh nghiệp tin dùng' (số thật - Social Proof)."
  - id: "m05_yukl_9"
    name_vi: "Chín chiến thuật ảnh hưởng (Yukl & Tracey)"
    name_en: "Yukl 9 influence tactics"
    origin: "Kipnis, Schmidt & Wilkinson (1980) khảo sát có hệ thống; Yukl & Falbe (1990), Yukl & Tracey (1992) phát triển 9 chiến thuật và Influence Behavior Questionnaire."
    components:
      - "Rational Persuasion: bằng chứng, logic; hiệu quả cao với người tin dữ liệu"
      - "Inspirational Appeals: giá trị, tầm nhìn, cảm xúc; rất cao nếu authentic (ví dụ lời mời Jobs - Sculley theo tiểu sử Isaacson)"
      - "Consultation: hỏi ý kiến, lắng nghe rồi đề xuất; tạo ownership"
      - "Ingratiation: tạo thiện cảm trước; cao nếu không bị coi là nịnh bợ"
      - "Personal Appeals: dựa quan hệ cá nhân; trung bình"
      - "Exchange: trao đổi lợi ích; trung bình"
      - "Coalition: liên minh; cao"
      - "Legitimating: viện dẫn quy định/quyền hạn; trung bình"
      - "Pressure: đe dọa, nhắc lặp, deadline; thấp dài hạn, gây phản kháng"
    when_to_use: "Chọn cách tác động có cam kết với cấp trên/đồng nghiệp/cấp dưới."
    how_to_apply:
      - "Ưu tiên Rational, Consultation, Inspirational"
      - "Dùng Pressure chỉ khi khẩn cấp và không còn cách khác"
      - "Điều chỉnh theo văn hóa (PDI cao: tham vấn riêng) và đối tượng"
    how_to_read_results: "Rational/Inspirational/Consultation thường đạt cam kết; Pressure kém bền - hiệu quả phụ thuộc bối cảnh và văn hóa."
    pitfalls: ["Pressure dễ trượt sang cưỡng ép", "Ingratiation lộ động cơ -> phản tác dụng"]
    example: "Manager xin thêm nhân sự: số liệu workload +40%, time-to-market -20%, doanh thu dự báo +50% (Rational Persuasion) - số liệu minh họa của bài."
  - id: "m05_mendelow_grid"
    name_vi: "Ma trận Power-Interest (Mendelow) - quản lý stakeholder"
    name_en: "Mendelow Power-Interest Grid"
    origin: "Aubrey Mendelow (1981, hội nghị ICIS, Environmental scanning - the impact of the stakeholder concept): quyết định dành bao nhiêu công sức cho từng nhóm khi nguồn lực có hạn."
    components:
      - "Manage Closely (Power cao + Interest cao): họp định kỳ, tham vấn sớm, cập nhật liên tục, đồng thiết kế; ví dụ CEO/chủ DN tài trợ, khách hàng chính B2B, HĐQT"
      - "Keep Satisfied (Power cao + Interest thấp): báo cáo ngắn định kỳ về điều họ quan tâm, báo sớm vấn đề, theo dõi tín hiệu Interest tăng; ví dụ Chủ tịch HĐQT, cơ quan thuế/cấp phép, CFO tập đoàn mẹ"
      - "Keep Informed (Power thấp + Interest cao): thông tin đầy đủ đúng lúc, giải thích lý do, tham vấn, biến người ủng hộ thành champion; gom nhiều Low Power thành liên minh; ví dụ nhân viên bị ảnh hưởng, khách hàng nhỏ, công đoàn cơ sở"
      - "Monitor (Power thấp + Interest thấp): thông tin chung, theo dõi thay đổi vị trí; ví dụ nhân viên phòng không liên quan, công chúng"
    when_to_use: "Dự án/thay đổi có nhiều bên liên quan; mọi quyết định cần xác định bên nào phải ưu tiên."
    how_to_apply:
      - "Liệt kê stakeholder"
      - "Chấm Power và Interest thang 1-10, ngưỡng 5 (m05_mendelow_class)"
      - "Điều chỉnh Power bằng mức phụ thuộc Emerson"
      - "Chọn hành động theo ô; cập nhật sau mỗi sự kiện lớn"
    how_to_read_results: "Q1 có thể chặn dự án; Q3 có thể là champion hoặc lực lượng phản kháng ngầm; vị trí không cố định."
    pitfalls: ["HP-Compaq: nhà Hewlett (Q1) bị đối đầu công khai", "JC Penney: khách hàng hiện hữu coi là Q3/Q4 nhưng bỏ đi là doanh thu giảm", "Quên cập nhật vị trí"]
    example: "Dự án chuyển đổi số SME: Q1 = CEO, Chủ tịch HĐQT, CTO; Q2 = CFO, công đoàn; Q3 = nhân viên IT, bán hàng; Q4 = hành chính, khách ngoài. Hành động: Q1 họp hằng tuần, Q2 báo cáo hằng tháng, Q3 họp góp ý + champion, Q4 thông báo chung."
  - id: "m05_velasquez_5"
    name_vi: "Năm lăng kính đạo đức cho chính trị tổ chức (Velasquez)"
    name_en: "Velasquez ethical lenses"
    origin: "Velasquez, Andre, Shanks & Meyer (Markkula Center, ĐH Santa Clara), Thinking Ethically (bản đầu cuối thập niên 1980). Bản gốc có Common Good; KB dùng Utility, Rights, Justice, Virtues, Care."
    components:
      - "Utility: tổng lợi ích > tổng thiệt hại? (win-win vs zero-sum)"
      - "Rights: tôn trọng quyền người khác, không lừa dối/ép buộc?"
      - "Justice: công bằng, không thiên vị/kỳ thị?"
      - "Virtues: có tự hào nếu việc này đăng báo? (trung thực, dũng cảm)"
      - "Care: có quan tâm hậu quả với người bị ảnh hưởng?"
      - "Bảng định hướng: Coalition, Rational Persuasion, Networking = ETHICAL; Scapegoating, Information Control = UNETHICAL; Cooptation, Impression Mgmt = GRAY (tùy cách làm)"
    when_to_use: "Trước khi thực hiện hành động chính trị mơ hồ; đánh giá hành vi của người khác."
    how_to_apply:
      - "Chấm 0-2 cho mỗi lăng kính (m05_velasquez_score)"
      - "Phân loại: 8-10 chức năng, 5-7 vùng xám, 0-4 mặt tối"
      - "Nếu thấp: sửa cách làm (minh bạch dữ liệu, công khai quy trình) rồi chấm lại"
    how_to_read_results: "Chiến thuật giống nhau nhưng tính minh bạch của dữ liệu quyết định ranh giới đạo đức (Cooptation minh bạch = 9; có định hướng = 2)."
    pitfalls: ["Tự chấm không có phản biện", "Chỉ hỏi 'có hợp pháp không?'"]
    example: "Thu nạp CFO ủng hộ tăng giá: Cách A minh bạch = 9; Cách B giấu dữ liệu bất lợi = 2."
  - id: "m05_sources_of_politics"
    name_vi: "Nguồn gốc chính trị tổ chức và cách giảm"
    name_en: "Sources of organizational politics"
    origin: "Pfeffer (1981), Mintzberg (1983): chính trị tăng khi điều kiện tổ chức tạo khoảng trống mà quy tắc chính thức không lấp được; bốn điều kiện là tổng hợp phổ biến trong giáo trình."
    components:
      - "Tài nguyên khan hiếm (ngân sách, vị trí, xe công vụ): giảm bằng cấp phát rõ, tăng nguồn lực, tiêu chuẩn minh bạch"
      - "Mục tiêu mơ hồ ('lớn nhanh', 'bền vững' hiểu khác nhau): giảm bằng SMART, chia sẻ rộng, đối thoại định kỳ"
      - "Phức tạp công nghệ/tri thức độc quyền (1 kỹ sư, 1 thợ cả, 1 luật sư): giảm bằng tài liệu hóa, đào tạo, redundancy (2 người biết 1 việc)"
      - "Thay đổi tổ chức (CEO mới, sáp nhập, cấu trúc mới): giảm bằng thông tin sớm rõ ràng, lắng nghe, hỗ trợ, kế hoạch truyền thông"
      - "Bổ sung: quy trình không rõ, phụ thuộc lẫn nhau, nhóm lợi ích, nỗi sợ 'không chơi thì bị chơi' (vòng xoáy tự củng cố)"
    when_to_use: "Chẩn đoán vì sao tổ chức nhiều chính trị và thiết kế biện pháp giảm."
    how_to_apply: ["Xác định điều kiện nào đang hiện diện", "Xử lý nguyên nhân tương ứng", "Rà soát tiêu chí thăng chức, phân bổ ngân sách có minh bạch không"]
    how_to_read_results: "Nhiều điều kiện cùng lúc => rủi ro chính trị mặt tối cao."
    pitfalls: ["Chỉ trừng phạt triệu chứng", "Coi chính trị là 'bẩn' cần né tránh"]
    example: "Startup $500k, 3 bộ phận cùng xin ngân sách; quy trình thăng chức thiếu tiêu chí -> vận động hậu trường."
  - id: "m05_application_contexts"
    name_vi: "Năm hoàn cảnh chính trị điển hình và cách tiếp cận đạo đức"
    name_en: "Typical political contexts"
    origin: "Tổng hợp của KB."
    components:
      - "M&A: coalition cấp trung, information control, networking, impression mgmt -> đạo đức: cấu trúc mới rõ, đánh giá công bằng hai bên, KPI thăng chức minh bạch, hỗ trợ nhân viên bị ảnh hưởng"
      - "Tái cấu trúc: scapegoating, coalition bảo vệ bộ phận, giấu số liệu, legitimating -> đạo đức: tiêu chí cắt giảm rõ, dữ liệu minh bạch, severance/outplacement, giải thích lý do"
      - "Mùa ngân sách (ví dụ 10 bộ phận xin 500k, ngân sách 1M: nhu cầu 5M gấp 5 lần) -> đạo đức: ROI/business case, quy trình minh bạch, giải thích vì sao bộ phận nào được/không"
      - "Lãnh đạo mới: coalition, networking, Referent/Expert -> đạo đức: lắng nghe trước, tôn trọng lãnh đạo cũ, xây trust, giữ người cũ (continuity) + thêm người mới"
      - "Chính trị HĐQT: coalition, information control, legitimating, scapegoating, cooptation -> đạo đức: lợi ích công ty trên cá nhân, lập luận dữ liệu, quy trình quản trị minh bạch"
    when_to_use: "Khi gặp một trong 5 hoàn cảnh nhạy cảm chính trị."
    how_to_apply: ["Xác định hoàn cảnh", "Dự đoán chiến thuật phổ biến", "Áp dụng cách tiếp cận đạo đức tương ứng"]
    how_to_read_results: "Minh bạch tiêu chí và dữ liệu là điểm chung của mọi cách tiếp cận."
    pitfalls: ["Vận động cấp trên của CFO để ép cấp tiền (làm mất lòng CFO)"]
