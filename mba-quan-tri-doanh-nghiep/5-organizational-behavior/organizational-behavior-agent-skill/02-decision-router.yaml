chaining_rules:   # bài toán chéo nhiều module: thứ tự gọi
  - when: "Nhân viên nghỉ việc nhiều, không rõ do lương, sếp hay văn hóa"
    chain: [m02 turnover và eNPS đo hiện trạng, m01 Herzberg/Equity chẩn đoán động lực, m02 style_fit và 360, m04 khảo sát văn hóa 20 câu, m01 ROI can thiệp]
  - when: "Công ty tăng trưởng nhanh, tổ chức bắt đầu vỡ (scale)"
    chain: [m02 chuyển phong cách theo giai đoạn, m04 startup_culture_stages và giá trị cốt lõi, m03 RACI/Charter cho nhóm mới, m07 Kotter cho thay đổi lớn, m09 phân vai RAPID/DACI]
  - when: "Triển khai công nghệ/quy trình mới gặp kháng cự"
