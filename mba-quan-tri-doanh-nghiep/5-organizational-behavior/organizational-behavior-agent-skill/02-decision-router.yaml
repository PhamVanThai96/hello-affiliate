  - when: "Chuẩn bị đàm phán lớn (nhà cung cấp, nhà đầu tư, đối tác)"
    chain: [m06 ZOPA/BATNA và IBR, m05 power map/Emerson, m10 đọc người như giả thuyết, m08 kiểm soát cảm xúc, m09 ma trận/EV để chốt phương án]
  - when: "Quyết định lớn cần sự đồng thuận của nhóm/hội đồng"
    chain: [m09 chẩn đoán loại quyết định và công cụ, m05 đếm liên minh/Veto, m09 premortem + devil's advocate, m03 tranh luận rồi cam kết, m09 Decision Log]
  - when: "Đổi văn hóa hoặc hợp nhất sau M&A"
    chain: [m04 OCAI/Hofstede đo khoảng cách, m04 cultural due diligence, m07 Kotter 8 bước, m05 stakeholder, m01 hệ thống thưởng khớp hành vi mong muốn, m04 eNPS/ROI theo dõi]
  - when: "Phát triển một nhà lãnh đạo/founder"
    chain: [m08 360 độ tìm điểm mù, m02 chọn/chuyển phong cách, m02 guardrails nếu charismatic, m08 kế hoạch 90 ngày, m02 eNPS/ROI theo dõi]
  - when: "Tuyển hoặc thăng chức vị trí quản lý"
    chain: [m02 phong cách yêu cầu theo giai đoạn, m10 đọc người như giả thuyết + phỏng vấn có cấu trúc, m09 ma trận trọng số, m03 ghép đội bổ trợ, kiểm tra không phân biệt đối xử]

clarifying_questions_default:   # hỏi khi thiếu
  - Vấn đề cụ thể là gì (triệu chứng quan sát được: ai làm gì, từ khi nào, bao nhiêu lần) và mục tiêu mong muốn?
  - Quy mô (số nhân sự), ngành, mô hình (gia đình/startup/sản xuất/dịch vụ), giai đoạn phát triển và cơ cấu quản lý?
  - Dữ liệu sẵn có (tỷ lệ nghỉ việc, lương, KPI, khảo sát, biên bản, phản hồi) và ngân sách/thời gian can thiệp?
  - Ai là người ra quyết định, ai bị ảnh hưởng, và những ràng buộc (pháp lý, văn hóa, quan hệ gia đình)?
  - Đầu ra mong muốn (chẩn đoán, kế hoạch hành động, báo cáo, kịch bản trao đổi, tính ROI)?
