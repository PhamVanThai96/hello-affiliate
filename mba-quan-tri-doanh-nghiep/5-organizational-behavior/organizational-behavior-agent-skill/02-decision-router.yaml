# 02-decision-router.yaml — Định tuyến: câu hỏi/tình huống -> module + framework + công thức + playbook
# Cách dùng: khớp từ khóa/ý định với `triggers`, nạp `modules`, ưu tiên `frameworks`/`formulas`/`procedures` liệt kê (id có thật trong modules/), chạy `playbook` trong 03-playbooks.yaml.
# Module: m01 động lực | m02 lãnh đạo | m03 nhóm | m04 văn hóa | m05 quyền lực-chính trị | m06 xung đột | m07 thay đổi | m08 EQ | m09 ra quyết định | m10 thấu hiểu con người
