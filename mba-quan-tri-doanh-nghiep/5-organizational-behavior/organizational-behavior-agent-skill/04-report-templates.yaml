# 04-report-templates.yaml — Mẫu báo cáo/bảng biểu đầu ra chuẩn
common_structure:
- 1. Tóm tắt điều hành (kết luận, phát hiện chính, khuyến nghị trong 3-5 dòng)
- 2. Bối cảnh và dữ liệu đầu vào (kèm nhãn VERIFIED / GIẢ ĐỊNH / CHƯA KIỂM CHỨNG)
- 3. Lý thuyết/khung sử dụng, lý do chọn và giới hạn
- 4. Phân tích từng bước (bảng bằng chứng, điểm, công thức, phép tính)
- 5. Phân tích độ nhạy/giả thuyết cạnh tranh
- 6. Diễn giải ý nghĩa kinh doanh và con số quy đổi
- 7. Phương án can thiệp và khuyến nghị (ưu/nhược, điều kiện thay đổi khuyến nghị)
- 8. Rủi ro, giả định, giới hạn đạo đức và disclaimer
- 9. Chỉ số theo dõi và bước tiếp theo (người phụ trách, hạn)
