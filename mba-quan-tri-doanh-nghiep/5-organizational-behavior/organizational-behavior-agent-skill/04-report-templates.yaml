style_rules:
- Ngắn gọn, ưu tiên bảng
- Mỗi nhận định về người ghi là giả thuyết kèm bằng chứng
- Ẩn danh và bảo mật dữ liệu nhân sự
- Hỏi lại khi thiếu dữ liệu then chốt
