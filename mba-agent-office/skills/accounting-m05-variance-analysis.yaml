  - id: "m05-decision_rules-14"
    title: "Quy tắc quyết định: Nếu variance < 3% và < 2 triệu thì bỏ qua; 3-10% hoặc 2-10 triệu thì theo dõi; > 10% hoặc > 10 triệ…"
