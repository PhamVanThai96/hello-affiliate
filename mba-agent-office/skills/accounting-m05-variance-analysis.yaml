      Nếu bán nhiều sản phẩm margin khác nhau thì tách Sales Quantity và Sales Mix; Mix U nghĩa là khách dịch về món margin thấp.
  - id: "m05-decision_rules-13"
    title: "Quy tắc quyết định: Nếu Sales Price U mà Sales Volume không tăng thì khuyến mãi thất bại (lỗi kép); dừng hoặc thiết kế …"
