  - id: "m05-tong-quan"
    title: "Tổng quan m05"
    tags: ["m05", "phân", "tích", "chênh", "lệch", "variance", "analysis"]
    text: |-
      Phân tích chênh lệch (Variance Analysis) — module m05

      Mục đích: So sánh kết quả thực tế (Actual) với chuẩn/ngân sách (Standard/Budget), bóc tổng chênh lệch lợi nhuận thành các mảnh nhỏ gắn với một người/bộ phận kiểm soát được (giá mua, lượng dùng, đơn giá giờ công, hiệu suất, chi tiêu chung, công suất, giá bán, sản lượng, cơ cấu bán), rồi quy trách nhiệm và đề ra hành động khắc phục. Trả lời: lợi nhuận hụt kế hoạch X triệu thì do đâu, bao nhiêu phần ngoài tầm kiểm soát, ai sửa gì trước.

      Dùng khi:
      - Chủ SME hỏi 'tháng này lợi nhuận thấp hơn kế hoạch X triệu, vì sao?', 'ai chịu trách nhiệm khoản hụt này?'.
      - Cần lập thẻ định mức (Standard Cost Card) cho 1 sản phẩm/ly/suất ăn/đơn hàng.
      - Cần chuyển ngân sách tĩnh sang ngân sách linh hoạt trước khi so sánh với thực tế.
      - Cần tính/diễn giải DM Price-Quantity, DL Rate-Efficiency, VOH Spending-Efficiency, FOH Budget-Volume, Sales Price-Volume-Mix.
      - Cần lập bảng đối chiếu (reconciliation) để chứng minh tổng các variance bằng chênh lệch lợi nhuận.
      - Cần chọn ngưỡng quản trị theo ngoại lệ, 5 Whys, controllable/uncontrollable, action plan ai-làm gì-hạn nào.
      - Câu hỏi về Volume Variance của định phí, absorption vs contribution costing, bẫy sản xuất thừa để 'đẹp' variance.
      - Thiết kế báo cáo variance hằng tháng trên Excel/Google Sheets/Looker Studio cho SME.

      Module liên quan: - 'm02 - Kế toán quản trị: CM, absorption vs variable costing, CVP dùng chung với Sales Volume Variance' - 'm03 - Kế toán giá thành: định mức, thẻ giá thành, phân bổ chi phí chung, FOH rate' - 'm04 - Ngân sách và dự báo: ngân sách tĩnh làm gốc so sánh, rolling forecast cập nhật sau khi có variance' - 'm01 - Kế toán tài chính: Actual lấy từ TK 621, 622, 627, 154, 632; VAS 02 về hàng tồn kho và địn…

      Công thức (tra chi tiết bằng skill_search("<id>")):
      - m05_basic_variance: Chênh lệch cơ bản và nhãn F/U
      - m05_std_allowed: Lượng/giờ cho phép theo chuẩn
      - m05_flexible_budget_cost: Chi phí ngân sách linh hoạt
      - m05_dm_price: Chênh lệch giá NVL
      - m05_dm_quantity: Chênh lệch lượng NVL
      - m05_dm_total: Tổng chênh lệch NVL trực tiếp
      - m05_dl_rate: Chênh lệch đơn giá nhân công
      - m05_dl_efficiency: Chênh lệch hiệu suất nhân công
      - m05_voh_spending: Chênh lệch chi tiêu biến phí chung
      - m05_voh_efficiency: Chênh lệch hiệu suất biến phí chung
      - m05_foh_rate: Mức phân bổ định phí chung
      - m05_foh_budget: Chênh lệch chi tiêu định phí chung (ngân sách)
      - m05_foh_volume: Chênh lệch công suất định phí chung
      - m05_sales_price: Chênh lệch giá bán
      - m05_sales_volume: Chênh lệch sản lượng bán
      - m05_sales_quantity: Chênh lệch tổng số lượng bán
      - m05_sales_mix: Chênh lệch cơ cấu bán
      - m05_cm_vs_abs_bridge: Cầu nối Sales Volume theo CM và theo absorption
      - m05_profit_reconciliation: Đối chiếu tổng các variance với chênh lệch lợi nhuận
      - m05_exception_pct: Phần trăm variance so với chuẩn để phân loại ngoại lệ

      Kho tra cứu của module: Khái niệm 16, Công thức 20, frameworks 7, Quy trình 6, Quy tắc quyết định 21, Chuẩn so sánh 8, Lỗi thường gặp 14, Lưu ý SME Việt Nam 14, Bài học case 5, Ví dụ có lời giải 7, Câu hỏi luyện tập 10, Checklist 18, Mẫu Excel/Sheets 8. Tra bằng skill_search với từ khoá chủ đề (vd "ví dụ định khoản", "lỗi thường gặp khấu hao").
  - id: "m05-concepts-1"
    title: "Khái niệm: Phân tích chênh lệch"
    tags: ["khái", "niệm", "phân", "tích", "chênh", "lệch"]
    text: |-
      term_vi: Phân tích chênh lệch
      term_en: Variance Analysis
      definition: 'So sánh Actual với Standard/Budget: Variance = Actual - Standard; xác định nguyên nhân, quy trách nhiệm, đề xuất hành động. Là bước Check của vòng PDCA / Management Control Cycle (Plan - Execute - Measure - Compare - Corrective Action).'
      why_it_matters: Tổng 'lợi nhuận hụt 80 triệu' có hàng chục nguyên nhân (bán ít, bán rẻ, vải đắt, thợ chậm, điện nước tăng) - không ai biết sửa ở đâu, giao cho ai. Variance bóc tổng thành các mảnh gắn với một người kiểm soát được (Mua hàng - giá; Sản xuất - định mức; Nhân sự - đơn giá giờ công; Kinh doanh - giá bán, số lượng). Không có bước này ngân sách chỉ là tờ giấy; không có hành động khắc phục thì phân tích chỉ là báo cáo khám nghiệm tử thi.
  - id: "m05-concepts-2"
    title: "Khái niệm: Chênh lệch thuận lợi / bất lợi"
    tags: ["khái", "niệm", "chênh", "lệch", "thuận", "lợi", "bất"]
    text: |-
      term_vi: Chênh lệch thuận lợi / bất lợi
      term_en: Favorable (F) / Unfavorable (U) Variance
      definition: 'F là kết quả tốt hơn kế hoạch (doanh thu cao hơn hoặc chi phí thấp hơn, làm lợi nhuận tăng); U là xấu hơn (làm lợi nhuận giảm). Quy ước dấu nguồn: chi phí - Variance = Actual - Standard nên dương = U, âm = F; doanh thu và lợi nhuận - âm = U, dương = F.'
      why_it_matters: 'Hai quy ước dấu ngược nhau là nguồn nhầm lẫn số một. Luôn ghi chữ (F) hoặc (U) sau mỗi con số. F không đồng nghĩa tốt: có thể do cắt chất lượng, cắt bảo trì, sản xuất thừa.'
  - id: "m05-concepts-3"
    title: "Khái niệm: Chi phí tiêu chuẩn / định mức"
    tags: ["khái", "niệm", "chi", "phí", "tiêu", "chuẩn", "định", "mức"]
    text: |-
      term_vi: Chi phí tiêu chuẩn / định mức
      term_en: Standard Cost
      definition: 'Chi phí kỳ vọng để làm ra 1 đơn vị sản phẩm/dịch vụ trong điều kiện hoạt động hợp lý, ghi trên thẻ định mức (Standard Cost Card): lượng và giá NVL, giờ và đơn giá nhân công, biến phí chung, định phí phân bổ.'
      why_it_matters: Muốn biết thực tế tốt hay xấu phải có thước đo. Không có thước thì chỉ so với tháng trước (mà tháng trước có thể đã kém). Mọi chi phí đều là tích Giá x Lượng nên thẻ định mức tách rõ hai yếu tố để về sau tách variance đúng.
  - id: "m05-concepts-4"
    title: "Khái niệm: Ba loại tiêu chuẩn"
    tags: ["khái", "niệm", "ba", "loại", "tiêu", "chuẩn"]
    text: |-
      term_vi: Ba loại tiêu chuẩn
      term_en: Ideal / Currently Attainable / Basic Standard
      definition: 'Ideal: hoàn hảo, không lãng phí, không hỏng máy (mục tiêu dài hạn, Toyota/Lean). Currently Attainable: khả thi, cho phép hao hụt hợp lý (phổ biến nhất để lập ngân sách và đánh giá). Basic: cố định nhiều năm, dùng so sánh xu hướng.'
      why_it_matters: 'Chọn sai loại sinh hành vi sai: Ideal dùng để đánh giá thì luôn U, nhân viên nản; Attainable đặt dễ quá thì luôn đạt nhưng không cải tiến (GM); Basic lạc hậu khi giá/công nghệ đổi.'
  - id: "m05-concepts-5"
    title: "Khái niệm: Ngân sách tĩnh"
    tags: ["khái", "niệm", "ngân", "sách", "tĩnh"]
    text: |-
      term_vi: Ngân sách tĩnh
      term_en: Static Budget
      definition: Ngân sách lập cho một mức hoạt động kế hoạch cố định (vd 1.200 áo/6.000 ly), không điều chỉnh khi sản lượng thực tế khác.
      why_it_matters: Dùng để đo mục tiêu ban đầu và tổng chênh lệch. Không dùng để đánh giá chi phí biến đổi khi sản lượng khác kế hoạch.
  - id: "m05-concepts-6"
    title: "Khái niệm: Ngân sách linh hoạt"
    tags: ["khái", "niệm", "ngân", "sách", "linh", "hoạt"]
    text: |-
      term_vi: Ngân sách linh hoạt
      term_en: Flexible Budget
      definition: 'Ngân sách tính lại cho đúng mức hoạt động thực tế: biến phí = sản lượng thực tế x định mức biến phí/đơn vị; định phí giữ nguyên trong phạm vi công suất. Chia tổng chênh lệch thành 2 tầng: Sales Volume Variance (Static -> Flexible) và Flexible Budget Variance (Flexible -> Actual).'
      why_it_matters: 'Ngân sách 1.200 áo, thực tế 1.000 áo: so thẳng thì mọi biến phí đều ''tiết kiệm'' giả (so táo với cam). Tầng 1 phụ thuộc thị trường/kinh doanh; tầng 2 (giá, lượng, hiệu suất) mới là trách nhiệm quản lý sản xuất - người sản xuất chỉ nên bị đánh giá trên tầng 2.'
  - id: "m05-concepts-7"
    title: "Khái niệm: Sản lượng/lượng/giờ cho phép theo chuẩn"
    tags: ["khái", "niệm", "sản", "lượng", "giờ", "cho", "phép", "theo", "chuẩn"]
    text: |-
      term_vi: Sản lượng/lượng/giờ cho phép theo chuẩn
      term_en: Standard quantity / hours allowed (SQ, SH)
      definition: SQ = sản lượng THỰC TẾ x lượng chuẩn/đơn vị; SH = sản lượng THỰC TẾ x giờ chuẩn/đơn vị. Không phải theo sản lượng ngân sách.
      why_it_matters: Nhầm SQ theo sản lượng ngân sách là lỗi phổ biến nhất - biến Quantity Variance thành Sales Volume Variance trá hình.
  - id: "m05-concepts-8"
    title: "Khái niệm: Chênh lệch giá và chênh lệch lượng"
    tags: ["khái", "niệm", "chênh", "lệch", "giá", "và", "lượng"]
    text: |-
      term_vi: Chênh lệch giá và chênh lệch lượng
      term_en: Price vs Quantity (Efficiency) Variance
      definition: 'Mọi chi phí = Giá x Lượng. Thay lần lượt từng biến: đổi giá trước (giữ lượng thực tế) ra chênh lệch giá; đổi lượng (giữ giá chuẩn) ra chênh lệch lượng. Hai phần cộng đúng bằng tổng chênh lệch.'
      why_it_matters: Price Variance nhân AQ vì giá tác động lên toàn bộ lượng thực tế (kể cả phần hao phí). Quantity Variance định giá bằng SP để loại ảnh hưởng của giá, đo trách nhiệm Sản xuất công bằng. Gộp chung thì không ai phải giải trình.
  - id: "m05-concepts-9"
    title: "Khái niệm: Chi phí sản xuất chung (MOH) và Volume Variance của định phí"
    tags: ["khái", "niệm", "chi", "phí", "sản", "xuất", "chung", "moh", "và", "volume", "variance", "của"]
    text: |-
      term_vi: Chi phí sản xuất chung (MOH) và Volume Variance của định phí
      term_en: Manufacturing Overhead (MOH), Fixed Overhead Volume Variance
      definition: MOH không gắn trực tiếp sản phẩm nên phân bổ theo tiêu thức (giờ nhân công trực tiếp - DLH). Tách VOH (biến phí) và FOH (định phí). FOH Rate tính từ sản lượng kế hoạch; Volume Variance = FOH dự toán - FOH đã phân bổ (SH x FOH Rate).
      why_it_matters: Định phí là tiền chi không đổi dù sản xuất nhiều hay ít, nhưng phải phân bổ bằng một mức/đơn vị cố định tính từ sản lượng kế hoạch. Sản xuất ít hơn kế hoạch thì phần gánh vào sản phẩm thấp hơn số dự toán; phần chưa gánh hết là Volume Variance (U) = công suất bỏ không. Đây là hệ quả toán học của cách phân bổ, không phải sai sót chi tiêu; chỉ báo xem lại công suất/kế hoạch bán, không phải mục tiêu để 'tối ưu về 0'.
  - id: "m05-concepts-10"
    title: "Khái niệm: Absorption costing vs Contribution (Variable) costing trong variance"
    tags: ["khái", "niệm", "absorption", "costing", "vs", "contribution", "variable", "trong", "variance"]
    text: |-
      term_vi: Absorption costing vs Contribution (Variable) costing trong variance
      term_en: Absorption vs Contribution costing
      definition: 'Absorption: Sales Volume Variance nhân lãi gộp chuẩn (giá - giá thành đầy đủ) và có thêm FOH Volume Variance. Contribution: nhân CM chuẩn (giá - biến phí), định phí là chi phí kỳ nên không có FOH Volume Variance, chỉ có FOH Budget Variance. Tổng chênh lệch lợi nhuận hai cách bằng nhau.'
      why_it_matters: 'Cách Contribution rõ hơn cho SME vì không sinh ra Volume Variance khó hiểu. Quy tắc nhất quán: đã chọn cách nào thì dùng cho cả Sales Volume lẫn xử lý định phí, không trộn.'
  - id: "m05-concepts-11"
    title: "Khái niệm: Chênh lệch cơ cấu và số lượng bán"
    tags: ["khái", "niệm", "chênh", "lệch", "cơ", "cấu", "và", "số", "lượng", "bán"]
    text: |-
      term_vi: Chênh lệch cơ cấu và số lượng bán
      term_en: Sales Mix & Sales Quantity Variance
      definition: Khi bán nhiều sản phẩm margin khác nhau, Sales Volume Variance tách thành Quantity (tổng lượng lệch x CM bình quân ngân sách) và Mix (lượng từng sản phẩm lệch so với cơ cấu ngân sách áp lên tổng lượng thực tế, x CM từng sản phẩm).
      why_it_matters: Bán đủ số ly nhưng dồn vào món margin thấp thì lợi nhuận vẫn thua kế hoạch; tổng số lượng không nói lên điều đó.
  - id: "m05-concepts-12"
    title: "Khái niệm: Quản trị theo ngoại lệ"
    tags: ["khái", "niệm", "quản", "trị", "theo", "ngoại", "lệ"]
    text: |-
      term_vi: Quản trị theo ngoại lệ
      term_en: Management by Exception
      definition: 'Chỉ điều tra variance đủ lớn (theo % và giá trị tuyệt đối) hoặc lặp lại nhiều kỳ. Ngưỡng tham khảo: Insignificant dưới 3% VÀ dưới 2 triệu; Moderate 3-10% HOẶC 2-10 triệu; Significant trên 10% HOẶC trên 10 triệu; Recurring cùng variance 3+ tháng liên tiếp.'
      why_it_matters: Sự chú ý của chủ SME có hạn; điều tra mọi variance nhỏ tốn hơn lợi ích. Variance lặp lại 3+ tháng thường là dấu hiệu định mức sai, vấn đề hệ thống chứ không phải biến cố.
  - id: "m05-concepts-13"
    title: "Khái niệm: Điều tra nguyên nhân gốc và kiểm soát được"
    tags: ["khái", "niệm", "điều", "tra", "nguyên", "nhân", "gốc", "và", "kiểm", "soát", "được"]
    text: |-
      term_vi: Điều tra nguyên nhân gốc và kiểm soát được
      term_en: Root Cause Analysis (5 Whys) & Controllable vs Uncontrollable
      definition: 5 Whys hỏi 'tại sao' liên tiếp đến nguyên nhân gốc (kỹ thuật do Sakichi Toyoda phát triển và Toyota phổ biến - cần đối chiếu nguồn). Phân loại controllable (manager sửa được) và uncontrollable (thị trường, thiên tai, chính sách).
      why_it_matters: Chỉ hành động lên nguyên nhân kiểm soát được; nguyên nhân bất khả kháng thì điều chỉnh kế hoạch/định mức chứ không phạt người.
  - id: "m05-concepts-14"
    title: "Khái niệm: Quan hệ cặp giữa các variance"
    tags: ["khái", "niệm", "quan", "hệ", "cặp", "giữa", "các", "variance"]
    text: |-
      term_vi: Quan hệ cặp giữa các variance
      term_en: Interacting variances (Price-Qty, Rate-Efficiency, Price-Volume)
      definition: Mua vải rẻ (Price F) có thể làm hao phí nhiều (Quantity U); thuê thợ giỏi (Rate U) có thể giảm giờ (Efficiency F); khuyến mãi giảm giá (Price U) phải kéo lượng (Volume F) - nếu không là lỗi kép.
      why_it_matters: Đọc riêng lẻ dễ khen thưởng sai hành vi (Mua hàng chỉ bị đánh giá theo Price Variance sẽ có động cơ mua rẻ, kém). Luôn đọc cặp trước khi kết luận.
  - id: "m05-concepts-15"
    title: "Khái niệm: Variance trong triết lý Kaizen vs văn hóa đạt chỉ tiêu"
    tags: ["khái", "niệm", "variance", "trong", "triết", "lý", "kaizen", "vs", "văn", "hóa", "đạt", "chỉ"]
    text: |-
      term_vi: Variance trong triết lý Kaizen vs văn hóa đạt chỉ tiêu
      term_en: Toyota Kaizen vs GM 'hit the number'
      definition: 'Toyota: variance là tín hiệu cải tiến tại hiện trường, phân tích real-time, Ideal Standard kéo giãn, Andon dừng sửa ngay, sản xuất theo cầu (pull). Doanh nghiệp theo kiểu GM: variance là công cụ đổ lỗi, standard dễ, che giấu, sản xuất tối đa để giảm unit cost.'
      why_it_matters: 'Cùng công cụ, văn hóa quyết định kết quả. Volume Variance Favorable không bằng tốt: sản xuất thừa để dàn định phí tạo tồn kho và giảm giá lớn gấp nhiều lần phần định phí ''cứu'' được.'
  - id: "m05-concepts-16"
    title: "Khái niệm: Nguồn gốc lịch sử (cần đối chiếu nguồn khi trích dẫn)"
    tags: ["khái", "niệm", "nguồn", "gốc", "lịch", "sử", "cần", "đối", "chiếu", "khi", "trích", "dẫn"]
    text: |-
      term_vi: Nguồn gốc lịch sử (cần đối chiếu nguồn khi trích dẫn)
      term_en: Origins of standard costing
      definition: 'Đầu thế kỷ 20 Scientific Management (F. W. Taylor): đo thời gian chuẩn từng thao tác. Khoảng 1910s-1920s Standard Costing được hệ thống hóa ở Mỹ (thường nhắc G. Charter Harrison với công thức chênh lệch giá/lượng); DuPont và GM cùng thời phát triển kiểm soát tài chính theo kế hoạch - thực tế (cùng dòng với DuPont analysis). Sau 1950s vào giáo trình Managerial/Cost Accounting và kỳ thi CMA; từ 1980-1990 Lean/Toyota phê bình lạm dụng variance trong môi trường cải tiến liên tục.'
      why_it_matters: Hiểu bối cảnh sản xuất lặp lại, quy mô lớn giải thích tại sao công cụ hiệu quả nhất ở sản xuất lặp lại và kém hiệu quả ở R&D, startup, dịch vụ khó chuẩn hóa.
  - id: "m05-formulas-1"
    title: "Công thức: m05_basic_variance — Chênh lệch cơ bản và nhãn F/U"
    tags: ["công", "thức", "m05_basic_variance", "chênh", "lệch", "cơ", "bản", "và", "nhãn"]
    text: |-
      id: m05_basic_variance
      name_vi: Chênh lệch cơ bản và nhãn F/U
      name_en: Basic variance and F/U flag
      expression_latex: '\text{Variance} = \text{Actual} - \text{Standard};\quad \text{chi phí: } >0 \Rightarrow U,\ <0 \Rightarrow F;\quad \text{doanh thu/lợi nhuận: } <0 \Rightarrow U'
      expression_python: ("U" if (actual - standard) > 0 else "F") if is_cost else ("U" if (actual - standard) < 0 else "F")
      excel: =IF(Var>0,"U","F")  (chi phí); =IF(Var<0,"U","F")  (doanh thu, lợi nhuận)
      variables:
      - symbol: actual
        meaning: Giá trị thực tế
        unit: VNĐ
      - symbol: standard
        meaning: Giá trị chuẩn hoặc ngân sách
        unit: VNĐ
      - symbol: is_cost
        meaning: True nếu là khoản chi phí, False nếu doanh thu hoặc lợi nhuận
        unit: bool
      when_to_use: 'Mọi variance: xác định hướng tác động lên lợi nhuận trước khi diễn giải.'
      why_it_works: Chi phí tăng làm lợi nhuận giảm nên (+) là U; doanh thu giảm làm lợi nhuận giảm nên (-) là U. Nhãn chữ loại bỏ nhập nhằng dấu.
      assumptions:
      - Actual và Standard cùng mức hoạt động (đã quy về flexible budget khi so biến phí)
      - Cùng đơn vị tiền tệ và kỳ
      pitfalls:
      - Trộn quy ước dấu chi phí và doanh thu trong cùng bảng tổng hợp; khi cộng vào tác động lợi nhuận phải đổi dấu chi phí U thành âm.
      - Coi F là luôn tốt (có thể do cắt chất lượng, cắt bảo trì, sản xuất thừa).
      interpretation: U của chi phí vượt chuẩn; U của doanh thu thiếu chuẩn. F cũng cần soát xem có đánh đổi chất lượng không.
      example:
        inputs:
          actual: 64800000
          standard: 60000000
          is_cost: true
        steps:
        - 64.800.000 - 60.000.000 = +4.800.000, chi phí dương nên U
        result: 4.800.000 (U)
  - id: "m05-formulas-2"
    title: "Công thức: m05_std_allowed — Lượng/giờ cho phép theo chuẩn"
    tags: ["công", "thức", "m05_std_allowed", "lượng", "giờ", "cho", "phép", "theo", "chuẩn"]
    text: |-
      id: m05_std_allowed
      name_vi: Lượng/giờ cho phép theo chuẩn
      name_en: Standard quantity / hours allowed for actual output
      expression_latex: SQ = Q_{actual\ output} \times \text{std qty per unit};\quad SH = Q_{actual\ output} \times \text{std hours per unit}
      expression_python: actual_output * std_per_unit
      excel: =SanLuongThucTe*DinhMucDonVi
      variables:
      - symbol: actual_output
        meaning: Sản lượng thực tế
        unit: đơn vị SP
      - symbol: std_per_unit
        meaning: Định mức lượng NVL hoặc giờ công trên 1 đơn vị SP
        unit: m, g hoặc giờ/SP
      when_to_use: Bước đầu của mọi tính toán Quantity, Efficiency, VOH Efficiency, FOH Volume.
      why_it_works: Muốn đo hiệu quả dùng đầu vào phải so với lượng ĐÁNG LẼ cần cho đúng số sản phẩm đã làm ra, không phải số kế hoạch.
      assumptions:
      - Định mức đã kiểm chứng thực tế
      - Sản phẩm dở dang quy đổi tương đương nếu có
      pitfalls:
      - Dùng sản lượng ngân sách thay cho thực tế làm lẫn Quantity Var với Volume Var
      - Quên cộng phế phẩm cho phép nếu định mức đã tính hao hụt
      interpretation: Là cột 'Standard' trong mọi so sánh lượng.
      example:
        inputs:
          actual_output: 1000
          std_per_unit: 1.2
        steps:
        - SQ vải = 1.000 x 1,2 = 1.200 m
        result: SQ = 1.200 m (áo thun)
  - id: "m05-formulas-3"
    title: "Công thức: m05_flexible_budget_cost — Chi phí ngân sách linh hoạt"
    tags: ["công", "thức", "m05_flexible_budget_cost", "chi", "phí", "ngân", "sách", "linh", "hoạt"]
    text: |-
      id: m05_flexible_budget_cost
      name_vi: Chi phí ngân sách linh hoạt
      name_en: Flexible budget cost
      expression_latex: \text{Flex cost} = Q_{actual} \times v_{std} + F_{budget}
      expression_python: actual_output * var_cost_per_unit + fixed_cost
      excel: =SanLuongThucTe*BienPhiDonVi+DinhPhi
      variables:
      - symbol: actual_output
        meaning: Sản lượng/doanh số thực tế
        unit: đơn vị SP
      - symbol: var_cost_per_unit
        meaning: Biến phí chuẩn trên 1 đơn vị
        unit: VNĐ/SP
      - symbol: fixed_cost
        meaning: Định phí ngân sách (không đổi trong phạm vi công suất)
        unit: VNĐ
      when_to_use: Trước khi so chi phí thực tế với kế hoạch khi sản lượng thực tế khác ngân sách tĩnh.
      why_it_works: Biến phí đổi theo sản lượng nên phải tính lại; định phí không đổi nên giữ nguyên. Nhờ vậy so cùng mức hoạt động.
      assumptions:
      - Phân loại biến phí/định phí đúng
      - Sản lượng thực tế nằm trong phạm vi công suất liên quan (relevant range)
      pitfalls:
      - Coi cả chi phí 'bán biến đổi' (lương ca, điện) là biến phí hoàn toàn
      - Quên định phí bậc thang (step cost) khi sản lượng vượt công suất
      interpretation: Là mốc so sánh công bằng với Actual; chênh lệch với Actual = Flexible Budget Variance.
      example:
        inputs:
          actual_output: 5400
          var_cost_per_unit: 22900
          fixed_cost: 60000000
        steps:
        - 5.400 x 22.900 = 123.660.000
        - + 60.000.000 = 183.660.000
        result: Chi phí linh hoạt quán Hẻm 25 = 183.660.000
  - id: "m05-formulas-4"
    title: "Công thức: m05_dm_price — Chênh lệch giá NVL"
    tags: ["công", "thức", "m05_dm_price", "chênh", "lệch", "giá", "nvl"]
    text: |-
      id: m05_dm_price
      name_vi: Chênh lệch giá NVL
      name_en: Direct Materials Price Variance
      expression_latex: (AP - SP)\times AQ
      expression_python: (ap - sp) * aq
      excel: =(AP-SP)*AQ
      variables:
      - symbol: ap
        meaning: Giá mua thực tế
        unit: VNĐ/đơn vị NVL
      - symbol: sp
        meaning: Giá mua chuẩn
        unit: VNĐ/đơn vị NVL
      - symbol: aq
        meaning: Lượng NVL thực tế (dùng hoặc mua tuỳ thời điểm ghi nhận)
        unit: đơn vị NVL
      when_to_use: 'Đánh giá bộ phận Mua hàng: đàm phán, nhà cung cấp, thời điểm mua.'
      why_it_works: Giá chỉ lệch đúng một lần trên mọi đơn vị thực tế đã chi; nhân AQ gồm cả phần hao phí vì phần hao phí cũng đã mua với giá đó.
      assumptions:
      - AQ cùng đơn vị với giá
      - Nếu báo cáo ghi nhận lúc mua thì AQ là lượng mua, khi đó phần tồn chưa dùng vẫn mang giá chuẩn
      pitfalls:
      - 'Đọc riêng, bỏ qua cặp Quantity: mua rẻ chất kém làm hao phí tăng.'
      - Đánh giá Mua hàng chỉ bằng Price Var tạo động cơ mua rẻ kém; nên kèm tổng chi phí NVL trên đơn vị thành phẩm đạt chất lượng và tỷ lệ phế phẩm.
      interpretation: 'Âm là F (mua rẻ hơn chuẩn), dương là U. Nguyên nhân F: đàm phán tốt, mua sỉ, giảm giá mùa vụ; U: khan hiếm, mua gấp, đổi chính sách NCC.'
      example:
        inputs:
          ap: 48000
          sp: 50000
          aq: 1350
        steps:
        - (48.000 - 50.000) x 1.350 = -2.700.000
        result: -2.700.000 (F)
  - id: "m05-formulas-5"
    title: "Công thức: m05_dm_quantity — Chênh lệch lượng NVL"
    tags: ["công", "thức", "m05_dm_quantity", "chênh", "lệch", "lượng", "nvl"]
    text: |-
      id: m05_dm_quantity
      name_vi: Chênh lệch lượng NVL
      name_en: Direct Materials Quantity (Usage) Variance
      expression_latex: (AQ - SQ)\times SP
      expression_python: (aq - sq) * sp
      excel: =(AQ-SQ)*SP
      variables:
      - symbol: aq
        meaning: Lượng NVL dùng thực tế
        unit: đơn vị NVL
      - symbol: sq
        meaning: Lượng chuẩn cho sản lượng thực tế
        unit: đơn vị NVL
      - symbol: sp
        meaning: Giá mua chuẩn
        unit: VNĐ/đơn vị NVL
      when_to_use: 'Đánh giá Sản xuất: tay nghề, phế phẩm, máy móc, thiết kế, chất lượng NVL.'
      why_it_works: Định giá phần lượng thừa bằng giá chuẩn để cô lập hiệu suất sử dụng khỏi biến động giá; trách nhiệm Sản xuất đo công bằng.
      assumptions:
      - SQ tính theo sản lượng thực tế
      - Giá chuẩn ổn định trong kỳ
      pitfalls:
      - Nhân giá thực tế thay vì giá chuẩn làm trộn lẫn hai variance, tổng sẽ không khớp
      - Quên phế phẩm bình thường đã nằm trong định mức
      interpretation: 'Dương là U (dùng thừa), âm là F. Nguyên nhân U: thợ mới, máy cũ, NVL kém, thiết kế phức tạp hơn dự kiến; F: thợ lành nghề, cải tiến quy trình.'
      example:
        inputs:
          aq: 1350
          sq: 1200
          sp: 50000
        steps:
        - (1.350 - 1.200) x 50.000 = 7.500.000
        result: +7.500.000 (U)
  - id: "m05-formulas-6"
    title: "Công thức: m05_dm_total — Tổng chênh lệch NVL trực tiếp"
    tags: ["công", "thức", "m05_dm_total", "tổng", "chênh", "lệch", "nvl", "trực", "tiếp"]
    text: |-
      id: m05_dm_total
      name_vi: Tổng chênh lệch NVL trực tiếp
      name_en: Total DM Variance (check)
      expression_latex: AQ\cdot AP - SQ\cdot SP = (AP-SP)AQ + (AQ-SQ)SP
      expression_python: aq * ap - sq * sp
      excel: =AQ*AP-SQ*SP
      variables:
      - symbol: aq
        meaning: Lượng thực tế
        unit: đơn vị NVL
      - symbol: ap
        meaning: Giá thực tế
        unit: VNĐ/đơn vị
      - symbol: sq
        meaning: Lượng chuẩn cho sản lượng thực tế
        unit: đơn vị NVL
      - symbol: sp
        meaning: Giá chuẩn
        unit: VNĐ/đơn vị
      when_to_use: Kiểm chứng Price + Quantity cộng khớp tổng chi phí thực tế trừ chi phí chuẩn.
      why_it_works: 'Thêm bớt AQ.SP vào giữa: AP.AQ - SP.AQ + SP.AQ - SP.SQ - tách tuần tự từng biến, hai phần cộng khít, không thừa thiếu.'
      assumptions:
      - Dùng cùng một bộ giá, lượng cho cả ba phép tính
      pitfalls:
      - Tổng không khớp thường do SQ tính sai sản lượng hoặc nhân sai giá ở một trong hai variance
      interpretation: Dương là U. Dùng làm bước đối chiếu bắt buộc.
      example:
        inputs:
          aq: 1350
          ap: 48000
          sq: 1200
          sp: 50000
        steps:
        - 1.350 x 48.000 = 64.800.000
        - 1.200 x 50.000 = 60.000.000
        - chênh = 4.800.000 = -2.700.000 + 7.500.000
        result: +4.800.000 (U)
  - id: "m05-formulas-7"
    title: "Công thức: m05_dl_rate — Chênh lệch đơn giá nhân công"
    tags: ["công", "thức", "m05_dl_rate", "chênh", "lệch", "đơn", "giá", "nhân"]
    text: |-
      id: m05_dl_rate
      name_vi: Chênh lệch đơn giá nhân công
      name_en: Direct Labor Rate Variance
      expression_latex: (AR - SR)\times AH
      expression_python: (ar - sr) * ah
      excel: =(AR-SR)*AH
      variables:
      - symbol: ar
        meaning: Lương thực tế/giờ
        unit: VNĐ/giờ
      - symbol: sr
        meaning: Lương chuẩn/giờ
        unit: VNĐ/giờ
      - symbol: ah
        meaning: Giờ làm thực tế
        unit: giờ
      when_to_use: Đánh giá chính sách nhân sự, tăng ca (OT), cơ cấu thợ, tăng lương tối thiểu vùng (mức hiện hành cần xác nhận).
      why_it_works: 'Nhân công cũng là Giá x Lượng: Rate là giá. Nhân AH vì đơn giá áp lên mọi giờ thực tế đã trả.'
      assumptions:
      - Đơn giá bình quân gồm cả phụ cấp, OT, bảo hiểm tính theo giờ
      pitfalls:
      - 'Đọc riêng, bỏ qua Efficiency: thuê thợ giỏi (Rate U) có thể giảm giờ (Efficiency F)'
      - Quên quy đổi lương tháng ra đơn giá giờ
      interpretation: Dương là U. Nếu Efficiency F lớn hơn Rate U thì quyết định thuê thợ giỏi là đúng.
      example:
        inputs:
          ar: 42000
          sr: 40000
          ah: 1900
        steps:
        - (42.000 - 40.000) x 1.900 = 3.800.000
        result: +3.800.000 (U)
  - id: "m05-formulas-8"
    title: "Công thức: m05_dl_efficiency — Chênh lệch hiệu suất nhân công"
    tags: ["công", "thức", "m05_dl_efficiency", "chênh", "lệch", "hiệu", "suất", "nhân"]
    text: |-
      id: m05_dl_efficiency
      name_vi: Chênh lệch hiệu suất nhân công
      name_en: Direct Labor Efficiency Variance
      expression_latex: (AH - SH)\times SR
      expression_python: (ah - sh) * sr
      excel: =(AH-SH)*SR
      variables:
      - symbol: ah
        meaning: Giờ làm thực tế
        unit: giờ
      - symbol: sh
        meaning: Giờ chuẩn cho sản lượng thực tế
        unit: giờ
      - symbol: sr
        meaning: Lương chuẩn/giờ
        unit: VNĐ/giờ
      when_to_use: 'Đánh giá quản đốc/ca làm: năng suất, bố trí dây chuyền, đào tạo, máy hỏng.'
      why_it_works: Giờ thừa định giá bằng đơn giá chuẩn để tách khỏi biến động lương.
      assumptions:
      - Định mức giờ đúng thực tế; nếu một phần nhân công là cố định theo ca thì định mức theo ly/áo sẽ sai
      pitfalls:
      - Với SME giữ người theo ca cố định, Efficiency U có thể là vấn đề xếp ca chứ không phải tay nghề; cần xem lại định mức
      - Ghi nhận AH không đủ (chấm công thiếu)
      interpretation: 'Dương là U (làm chậm hơn chuẩn). Nguyên nhân U: thợ mới, máy hỏng, NVL kém, dây chuyền chưa hợp lý; còn kéo theo VOH Efficiency U.'
      example:
        inputs:
          ah: 1900
          sh: 1700
          sr: 40000
        steps:
        - (1.900 - 1.700) x 40.000 = 8.000.000
        result: +8.000.000 (U)
  - id: "m05-formulas-9"
    title: "Công thức: m05_voh_spending — Chênh lệch chi tiêu biến phí chung"
    tags: ["công", "thức", "m05_voh_spending", "chênh", "lệch", "chi", "tiêu", "biến", "phí", "chung"]
    text: |-
      id: m05_voh_spending
      name_vi: Chênh lệch chi tiêu biến phí chung
      name_en: Variable Overhead Spending Variance
      expression_latex: \text{Actual VOH} - AH \times \text{Std VOH rate}
      expression_python: actual_voh - ah * std_voh_rate
      excel: =ActualVOH-AH*StdVOHRate
      variables:
      - symbol: actual_voh
        meaning: Biến phí chung thực tế
        unit: VNĐ
      - symbol: ah
        meaning: Giờ nhân công thực tế (tiêu thức phân bổ)
        unit: giờ
      - symbol: std_voh_rate
        meaning: Đơn giá biến phí chung chuẩn trên giờ
        unit: VNĐ/giờ
      when_to_use: Kiểm tra chi tiêu điện, gas, vật tư phụ so với mức phải chi cho số giờ thực tế.
      why_it_works: 'Tách ảnh hưởng của ''giá'' khỏi ''hoạt động'': so Actual với mức phải chi cho đúng AH.'
      assumptions:
      - Tiêu thức phân bổ (DLH) phản ánh động lực chi phí thật
      - Định mức tính theo ly/đơn vị thì chỉ có Spending Variance (Case Hẻm 25)
      pitfalls:
      - Chọn tiêu thức phân bổ không liên quan động lực chi phí
      interpretation: Dương là U (điện, gas, vật tư phụ đắt hơn hoặc lãng phí).
      example:
        inputs:
          actual_voh: 30000000
          ah: 1900
          std_voh_rate: 15000
        steps:
        - 1.900 x 15.000 = 28.500.000
        - 30.000.000 - 28.500.000 = 1.500.000
        result: +1.500.000 (U)
  - id: "m05-formulas-10"
    title: "Công thức: m05_voh_efficiency — Chênh lệch hiệu suất biến phí chung"
    tags: ["công", "thức", "m05_voh_efficiency", "chênh", "lệch", "hiệu", "suất", "biến", "phí", "chung"]
    text: |-
      id: m05_voh_efficiency
      name_vi: Chênh lệch hiệu suất biến phí chung
      name_en: Variable Overhead Efficiency Variance
      expression_latex: (AH - SH)\times \text{Std VOH rate}
      expression_python: (ah - sh) * std_voh_rate
      excel: =(AH-SH)*StdVOHRate
      variables:
      - symbol: ah
        meaning: Giờ thực tế
        unit: giờ
      - symbol: sh
        meaning: Giờ chuẩn cho sản lượng thực tế
        unit: giờ
      - symbol: std_voh_rate
        meaning: Đơn giá biến phí chung chuẩn/giờ
        unit: VNĐ/giờ
      when_to_use: Xem biến phí chung tăng thêm vì làm chậm; chỉ là hệ quả của DL Efficiency.
      why_it_works: VOH phân bổ theo giờ; làm chậm (AH > SH) kéo biến phí theo. Không phải sai sót độc lập.
      assumptions:
      - Phân bổ VOH theo giờ nhân công
      pitfalls:
      - Quy trách nhiệm trùng hai lần (DL Efficiency và VOH Efficiency cùng một nguyên nhân gốc); khi báo cáo nên chỉ ra là cùng nguồn
      interpretation: Dương là U. Cải thiện DL Efficiency tự động giảm khoản này.
      example:
        inputs:
          ah: 1900
          sh: 1700
          std_voh_rate: 15000
        steps:
        - (1.900 - 1.700) x 15.000 = 3.000.000
        result: +3.000.000 (U)
  - id: "m05-formulas-11"
    title: "Công thức: m05_foh_rate — Mức phân bổ định phí chung"
    tags: ["công", "thức", "m05_foh_rate", "mức", "phân", "bổ", "định", "phí", "chung"]
    text: |-
      id: m05_foh_rate
      name_vi: Mức phân bổ định phí chung
      name_en: Fixed Overhead Rate
      expression_latex: \text{FOH rate} = \dfrac{\text{Budgeted FOH}}{\text{Budgeted output}\times \text{Std hours/unit}}
      expression_python: budget_foh / (budget_output * std_hours_per_unit)
      excel: =DinhPhiNganSach/(SanLuongNganSach*GioChuan)
      variables:
      - symbol: budget_foh
        meaning: Định phí chung ngân sách
        unit: VNĐ
      - symbol: budget_output
        meaning: Sản lượng ngân sách
        unit: đơn vị SP
      - symbol: std_hours_per_unit
        meaning: Giờ chuẩn/đơn vị SP
        unit: giờ/SP
      when_to_use: Lập thẻ giá thành (định phí phân bổ/đơn vị) và tính FOH Volume Variance.
      why_it_works: Định phí phân bổ bằng một mức cố định tính từ công suất kế hoạch (giờ chuẩn của sản lượng kế hoạch).
      assumptions:
      - Dùng công suất kế hoạch/bình thường làm mẫu số; VAS 02 yêu cầu phân bổ theo công suất bình thường (cần xác nhận hiện hành)
      pitfalls:
      - Đổi mẫu số giữa các kỳ làm thẻ giá thành nhảy
      - Nguồn từng ghi 19.608 làm lệch thẻ; giá trị đúng là 20.000/DLH
      interpretation: Mỗi giờ nhân công chuẩn 'gánh' bao nhiêu định phí.
      example:
        inputs:
          budget_foh: 40800000
          budget_output: 1200
          std_hours_per_unit: 1.7
        steps:
        - 1.200 x 1,7 = 2.040 giờ
        - 40.800.000 / 2.040 = 20.000
        result: 20.000 VNĐ/DLH
  - id: "m05-formulas-12"
    title: "Công thức: m05_foh_budget — Chênh lệch chi tiêu định phí chung (ngân sách)"
    tags: ["công", "thức", "m05_foh_budget", "chênh", "lệch", "chi", "tiêu", "định", "phí", "chung", "ngân", "sách"]
    text: |-
      id: m05_foh_budget
      name_vi: Chênh lệch chi tiêu định phí chung (ngân sách)
      name_en: Fixed Overhead Budget (Spending) Variance
      expression_latex: \text{Actual FOH} - \text{Budgeted FOH}
      expression_python: actual_foh - budget_foh
      excel: =ActualFOH-BudgetFOH
      variables:
      - symbol: actual_foh
        meaning: Định phí chung thực tế
        unit: VNĐ
      - symbol: budget_foh
        meaning: Định phí chung ngân sách
        unit: VNĐ
      when_to_use: Kiểm soát thuê mặt bằng, khấu hao, lương quản lý, bảo hiểm so ngân sách (có trong cả absorption và contribution).
      why_it_works: Định phí không đổi theo hoạt động nên so thẳng với ngân sách, không cần flexible.
      assumptions:
      - Trong phạm vi công suất liên quan
      pitfalls:
      - Nhầm với Volume Variance
      interpretation: Dương là U (chi vượt). Do giá thuê, hóa đơn điện tăng, phát sinh khấu hao.
      example:
        inputs:
          actual_foh: 42000000
          budget_foh: 40800000
        steps:
        - 42.000.000 - 40.800.000 = 1.200.000
        result: +1.200.000 (U)
  - id: "m05-formulas-13"
    title: "Công thức: m05_foh_volume — Chênh lệch công suất định phí chung"
    tags: ["công", "thức", "m05_foh_volume", "chênh", "lệch", "suất", "định", "phí", "chung"]
    text: |-
      id: m05_foh_volume
      name_vi: Chênh lệch công suất định phí chung
      name_en: Fixed Overhead Volume Variance
      expression_latex: \text{Budgeted FOH} - SH\times \text{FOH rate}
      expression_python: budget_foh - sh * foh_rate
      excel: =BudgetFOH-SH*FOHRate
      variables:
      - symbol: budget_foh
        meaning: Định phí ngân sách
        unit: VNĐ
      - symbol: sh
        meaning: Giờ chuẩn cho sản lượng thực tế
        unit: giờ
      - symbol: foh_rate
        meaning: Mức phân bổ định phí
        unit: VNĐ/giờ
      when_to_use: 'Chỉ khi dùng absorption costing: đo công suất bỏ không (hay vượt) so với kế hoạch.'
      why_it_works: Định phí đã dự toán nhưng chỉ 'gánh' vào sản phẩm theo SH x rate; phần chưa gánh hết là tiền trả cho công suất không dùng.
      assumptions:
      - Absorption costing
      - FOH rate tính từ sản lượng kế hoạch
      pitfalls:
      - 'Theo đuổi Volume Variance = 0 bằng cách sản xuất đủ kế hoạch dù thị trường không cần (bẫy GM): tồn kho và giảm giá thiệt hại lớn hơn nhiều.'
      - Quy cho Sản xuất trong khi nguyên nhân thường là cầu thị trường hoặc kế hoạch.
      - Trong contribution costing không có khoản này; đừng cộng hai lần cùng với Sales Volume tính theo CM.
      interpretation: Dương là U (sản xuất ít hơn kế hoạch, công suất bỏ không); âm là F (vượt kế hoạch). Là chỉ báo xem lại công suất/kế hoạch bán hàng, không phải mục tiêu tối ưu.
      example:
        inputs:
          budget_foh: 40800000
          sh: 1700
          foh_rate: 20000
        steps:
        - Applied = 1.700 x 20.000 = 34.000.000
        - 40.800.000 - 34.000.000 = 6.800.000
        result: +6.800.000 (U)
  - id: "m05-formulas-14"
    title: "Công thức: m05_sales_price — Chênh lệch giá bán"
    tags: ["công", "thức", "m05_sales_price", "chênh", "lệch", "giá", "bán"]
    text: |-
      id: m05_sales_price
      name_vi: Chênh lệch giá bán
      name_en: Sales Price Variance
      expression_latex: (AP_{sell} - BP_{sell})\times AQ_{sold}
      expression_python: (actual_price - budget_price) * actual_qty
      excel: =(GiaTT-GiaKH)*SoLuongTT
      variables:
      - symbol: actual_price
        meaning: Giá bán thực tế bình quân
        unit: VNĐ/đơn vị
      - symbol: budget_price
        meaning: Giá bán ngân sách
        unit: VNĐ/đơn vị
      - symbol: actual_qty
        meaning: Số lượng bán thực tế
        unit: đơn vị
      when_to_use: Đánh giá chính sách giá, khuyến mãi, chiết khấu, cạnh tranh giá.
      why_it_works: Giá lệch tác động toàn bộ lên lợi nhuận (không có chi phí đi kèm) và áp lên số lượng đã thực sự bán.
      assumptions:
      - Giá bình quân thực tế đã trừ chiết khấu, voucher, hoa hồng sàn nếu coi là giảm giá
      pitfalls:
      - Khuyến mãi giảm giá mà lượng không tăng là lỗi kép (Price U và Volume U)
      - Gộp doanh thu sau chiết khấu sai kỳ
      interpretation: 'Dương là F, âm là U (doanh thu). Nguyên nhân U controllable: giảm giá nhiều để đẩy lượng; uncontrollable: đối thủ giảm giá.'
      example:
        inputs:
          actual_price: 43000
          budget_price: 45000
          actual_qty: 5400
        steps:
        - (43.000 - 45.000) x 5.400 = -10.800.000
        result: -10.800.000 (U)
  - id: "m05-formulas-15"
    title: "Công thức: m05_sales_volume — Chênh lệch sản lượng bán"
    tags: ["công", "thức", "m05_sales_volume", "chênh", "lệch", "sản", "lượng", "bán"]
    text: |-
      id: m05_sales_volume
      name_vi: Chênh lệch sản lượng bán
      name_en: Sales Volume Variance
      expression_latex: (AQ_{sold} - BQ)\times \text{Budgeted margin per unit}
      expression_python: (actual_qty - budget_qty) * budget_margin
      excel: =(SLTT-SLKH)*MarginNganSach
      variables:
      - symbol: actual_qty
        meaning: Số lượng bán thực tế
        unit: đơn vị
      - symbol: budget_qty
        meaning: Số lượng bán ngân sách
        unit: đơn vị
      - symbol: budget_margin
        meaning: 'Margin chuẩn/đơn vị: CM (contribution) hoặc lãi gộp absorption, chọn nhất quán'
        unit: VNĐ/đơn vị
      when_to_use: 'Tầng 1 (Static -> Flexible): phần lợi nhuận mất/được do bán ít/nhiều hơn kế hoạch.'
      why_it_works: Bán thêm 1 sản phẩm chỉ tăng lợi nhuận đúng phần margin của nó; nhân giá bán sẽ cường điệu vì bỏ qua chi phí bù đắp.
      assumptions:
      - 'Margin dùng nhất quán: CM thì định phí là chi phí kỳ; lãi gộp absorption thì phải thêm FOH Volume Variance'
      pitfalls:
      - Nhân giá bán thay margin
      - Trộn CM với FOH Volume Variance làm đếm hai lần
      - Cho rằng toàn bộ là lỗi của nhân viên bán hàng (thường do thị trường, mùa vụ)
      interpretation: Dương là F, âm là U. Phần lớn ngoài tầm kiểm soát của sản xuất; hướng tới marketing, vị trí, đội bán.
      example:
        inputs:
          actual_qty: 1000
          budget_qty: 1200
          budget_margin: 157500
        steps:
        - (1.000 - 1.200) x 157.500 = -31.500.000 (lãi gộp absorption)
        - 'Với CM 191.500: -200 x 191.500 = -38.300.000'
        result: -31.500.000 (U) theo absorption; -38.300.000 (U) theo CM
  - id: "m05-formulas-16"
    title: "Công thức: m05_sales_quantity — Chênh lệch tổng số lượng bán"
    tags: ["công", "thức", "m05_sales_quantity", "chênh", "lệch", "tổng", "số", "lượng", "bán"]
    text: |-
      id: m05_sales_quantity
      name_vi: Chênh lệch tổng số lượng bán
      name_en: Sales Quantity Variance (multi-product)
      expression_latex: (\sum AQ_i - \sum BQ_i)\times \overline{CM}_{budget}
      expression_python: (total_actual_qty - total_budget_qty) * budget_avg_cm
      excel: =(TongSLTT-TongSLKH)*CMBinhQuanNganSach
      variables:
      - symbol: total_actual_qty
        meaning: Tổng số lượng bán thực tế mọi sản phẩm
        unit: đơn vị
      - symbol: total_budget_qty
        meaning: Tổng số lượng ngân sách
        unit: đơn vị
      - symbol: budget_avg_cm
        meaning: CM bình quân gia quyền theo cơ cấu ngân sách
        unit: VNĐ/đơn vị
      when_to_use: Nhiều sản phẩm có margin khác nhau; phần 'bán nhiều hay ít' thuần túy.
      why_it_works: Giả định cơ cấu ngân sách giữ nguyên, tổng lượng lệch được định giá bằng CM bình quân ngân sách.
      assumptions:
      - Có cơ cấu bán ngân sách xác định
      - Sản phẩm thay thế được cho nhau về mặt bán hàng
      pitfalls:
      - Dùng CM bình quân thực tế thay vì ngân sách làm Quantity và Mix lẫn nhau
      interpretation: Cộng với Mix bằng tổng Sales Volume Variance. Dương F, âm U.
      example:
        inputs:
          total_actual_qty: 5400
          total_budget_qty: 6000
          budget_avg_cm: 21600
        steps:
        - CM bình quân ngân sách = (3.600 x 24.000 + 2.400 x 18.000) / 6.000 = 21.600
        - (5.400 - 6.000) x 21.600 = -12.960.000
        result: -12.960.000 (U)
  - id: "m05-formulas-17"
    title: "Công thức: m05_sales_mix — Chênh lệch cơ cấu bán"
    tags: ["công", "thức", "m05_sales_mix", "chênh", "lệch", "cơ", "cấu", "bán"]
    text: |-
      id: m05_sales_mix
      name_vi: Chênh lệch cơ cấu bán
      name_en: Sales Mix Variance
      expression_latex: \sum_i \left(AQ_i - \sum AQ \times Mix^{budget}_i\right)\times CM_i
      expression_python: sum((aq[k] - sum(aq.values()) * budget_mix[k]) * cm[k] for k in aq)
      excel: =SUMPRODUCT((SLTT-TongSLTT*CoCauNS)*CM)
      variables:
      - symbol: aq
        meaning: Dict số lượng bán thực tế theo sản phẩm
        unit: đơn vị
      - symbol: budget_mix
        meaning: Dict tỷ trọng cơ cấu ngân sách (tổng 1)
        unit: tỷ lệ
      - symbol: cm
        meaning: Dict CM chuẩn từng sản phẩm
        unit: VNĐ/đơn vị
      when_to_use: Khi khách chuyển sang món/gói margin thấp hơn (hoặc cao hơn) dù tổng lượng không đổi.
      why_it_works: Áp cơ cấu ngân sách lên tổng lượng thực tế, phần lệch từng sản phẩm x CM của nó cho biết lợi nhuận bị kéo bởi thay đổi cơ cấu.
      assumptions:
      - Tổng Mix phần lệch bằng 0 về số lượng; chỉ giá trị khác nhau do CM khác nhau
      pitfalls:
      - Với một sản phẩm duy nhất Mix luôn = 0
      - Nhầm Mix là lỗi chiến lược khi nó có thể là hành vi khách cố hữu
      interpretation: Âm là U (cơ cấu dịch về món CM thấp), dương là F. Quantity + Mix = Total Sales Volume = Σ (AQ_i - BQ_i) x CM_i.
      example:
        inputs:
          aq:
            cafe: 2700
            tra: 2700
          budget_mix:
            cafe: 0.6
            tra: 0.4
          cm:
            cafe: 24000
            tra: 18000
        steps:
        - 'Tổng thực tế 5.400: cơ cấu NS cà phê 3.240, trà 2.160'
        - (2.700 - 3.240) x 24.000 = -12.960.000
        - (2.700 - 2.160) x 18.000 = +9.720.000
        - Mix = -3.240.000
        result: -3.240.000 (U); Quantity -12.960.000 + Mix -3.240.000 = -16.200.000
  - id: "m05-formulas-18"
    title: "Công thức: m05_cm_vs_abs_bridge — Cầu nối Sales Volume theo CM và theo absorption"
    tags: ["công", "thức", "m05_cm_vs_abs_bridge", "cầu", "nối", "sales", "volume", "theo", "cm", "và", "absorption"]
    text: |-
      id: m05_cm_vs_abs_bridge
      name_vi: Cầu nối Sales Volume theo CM và theo absorption
      name_en: Contribution vs Absorption volume bridge
      expression_latex: (AQ-BQ)\cdot CM = (AQ-BQ)\cdot GM_{abs} + FOH_{vol},\quad FOH_{vol} = (BQ-AQ)\cdot \text{FOH/unit}
      expression_python: (actual_qty - budget_qty) * (price - var_cost) - ((actual_qty - budget_qty) * (price - var_cost - foh_per_unit) + (budget_qty - actual_qty) * foh_per_unit)
      excel: =(SLTT-SLKH)*CM - ((SLTT-SLKH)*LaiGop + (SLKH-SLTT)*DinhPhiDonVi)
      variables:
      - symbol: actual_qty
        meaning: Số lượng thực tế
        unit: đơn vị
      - symbol: budget_qty
        meaning: Số lượng ngân sách
        unit: đơn vị
      - symbol: price
        meaning: Giá bán chuẩn
        unit: VNĐ
      - symbol: var_cost
        meaning: Biến phí chuẩn/đơn vị
        unit: VNĐ
      - symbol: foh_per_unit
        meaning: Định phí phân bổ chuẩn/đơn vị (= FOH rate x giờ chuẩn)
        unit: VNĐ
      when_to_use: Chứng minh hai cách (CM và absorption) cho cùng tổng; kiểm tra đối chiếu khi đổi phương pháp. Hàm trả 0 nếu đồng nhất.
      why_it_works: CM = lãi gộp absorption + định phí/đơn vị; Sales Volume theo CM bằng Sales Volume theo absorption + FOH Volume (khi sản lượng sản xuất = bán).
      assumptions:
      - Sản lượng sản xuất bằng sản lượng bán (không đổi tồn kho)
      - FOH Volume tính theo sản lượng thực tế chênh ngân sách
      pitfalls:
      - Nếu tồn kho thay đổi, FOH Volume liên quan sản lượng sản xuất chứ không phải sản lượng bán; cầu nối sẽ lệch
      interpretation: Kết quả 0 nghĩa hai cách khớp.
      example:
        inputs:
          actual_qty: 5400
          budget_qty: 6000
          price: 45000
          var_cost: 22900
          foh_per_unit: 10000
        steps:
        - 'CM: -600 x 22.100 = -13.260.000'
        - 'Absorption: -600 x 12.100 = -7.260.000; FOH Volume = 600 x 10.000 = 6.000.000 (U)'
        - Cầu nối = -13.260.000 - (-7.260.000 - 6.000.000) = 0
        result: 0 (khớp)
  - id: "m05-formulas-19"
    title: "Công thức: m05_profit_reconciliation — Đối chiếu tổng các variance với chênh lệch lợi nhuận"
    tags: ["công", "thức", "m05_profit_reconciliation", "đối", "chiếu", "tổng", "các", "variance", "với", "chênh", "lệch", "lợi"]
    text: |-
      id: m05_profit_reconciliation
      name_vi: Đối chiếu tổng các variance với chênh lệch lợi nhuận
      name_en: Variance-to-profit reconciliation check
      expression_latex: \sum \text{impact}_i = \text{Actual profit} - \text{Budgeted profit}
      expression_python: sum(impacts) - (actual_profit - budget_profit)
      excel: =SUM(TacDong)-(LNThucTe-LNNganSach)
      variables:
      - symbol: impacts
        meaning: Danh sách tác động từng variance lên lợi nhuận (U là âm, F là dương)
        unit: VNĐ
      - symbol: actual_profit
        meaning: Lợi nhuận thực tế
        unit: VNĐ
      - symbol: budget_profit
        meaning: Lợi nhuận ngân sách tĩnh
        unit: VNĐ
      when_to_use: Bước bắt buộc cuối mỗi báo cáo variance.
      why_it_works: Phân rã đầy đủ phải cộng khít; chênh lệch dư chỉ ra variance sót hoặc tính sai.
      assumptions:
      - Các variance phủ hết doanh thu và mọi khoản chi phí
      - Cùng quy ước margin (CM hoặc absorption)
      pitfalls:
      - Quên khoản mục (vd NVL khác) không có giá/lượng riêng - vẫn phải đưa vào dưới dạng một variance gộp
      - Quên đổi dấu chi phí U thành âm khi cộng với doanh thu
      - Absorption mà quên FOH Volume, hoặc CM mà vẫn thêm FOH Volume
      interpretation: 'Kết quả 0 là khớp. Khác 0 thì dò theo thứ tự: bước flexible budget, từng cặp price/qty, định phí.'
      example:
        inputs:
          impacts:
          - -13260000
          - -10800000
          - -3240000
          - -4860000
          - -2160000
          - -780000
          - -3080000
          - -2700000
          - -2500000
          actual_profit: 29220000
          budget_profit: 72600000
        steps:
        - Σ = -43.380.000
        - 29.220.000 - 72.600.000 = -43.380.000
        - Chênh = 0
        result: 0 (khớp, quán Hẻm 25)
  - id: "m05-formulas-20"
    title: "Công thức: m05_exception_pct — Phần trăm variance so với chuẩn để phân loại ngoại lệ"
    tags: ["công", "thức", "m05_exception_pct", "phần", "trăm", "variance", "so", "với", "chuẩn", "để", "phân", "loại"]
    text: |-
      id: m05_exception_pct
      name_vi: Phần trăm variance so với chuẩn để phân loại ngoại lệ
      name_en: Variance % for management by exception
      expression_latex: \%\text{var} = \dfrac{|\text{Variance}|}{\text{Standard of that line}}\times 100
      expression_python: abs(variance) / standard * 100
      excel: =ABS(Var)/Chuan*100
      variables:
      - symbol: variance
        meaning: Giá trị variance
        unit: VNĐ
      - symbol: standard
        meaning: Chi phí hoặc doanh thu chuẩn của khoản mục đó (flexible)
        unit: VNĐ
      when_to_use: Xếp hạng variance để chọn 3 việc cần xử lý, áp ngưỡng Insignificant/Moderate/Significant.
      why_it_works: Đồng thời xét quy mô tương đối (%) và tuyệt đối (triệu) để không bỏ sót khoản lớn nhỏ lẻ cũng không sa vào khoản vụn.
      assumptions:
      - Ngưỡng do doanh nghiệp tự thống nhất; số trong module là tham khảo
      pitfalls:
      - Mẫu số không nhất quán giữa các khoản (nguồn có chỗ chia cho chi phí thực tế, chỗ cho chuẩn)
      - Bỏ qua variance nhỏ nhưng lặp lại 3+ tháng
      interpretation: 'Dưới 3% và dưới 2 triệu: bỏ qua. 3-10% hoặc 2-10 triệu: theo dõi. Trên 10% hoặc trên 10 triệu: điều tra ngay. Lặp 3+ tháng: rà soát định mức.'
      example:
        inputs:
          variance: 4860000
          standard: 43740000
        steps:
        - 4.860.000 / 43.740.000 = 11,1%
        result: 11,1%, Significant (Hạt - lượng, Hẻm 25)
  - id: "m05-frameworks-1"
    title: "Frameworks: m05_standard_cost_card — Thẻ định mức (Standard Cost Card) và ba loại tiêu chuẩn"
    tags: ["frameworks", "m05_standard_cost_card", "thẻ", "định", "mức", "standard", "cost", "card", "và", "ba", "loại", "tiêu"]
    text: |-
      id: m05_standard_cost_card
      name_vi: Thẻ định mức (Standard Cost Card) và ba loại tiêu chuẩn
      name_en: Standard Cost Card & standard types
      origin: Khởi nguồn từ Scientific Management (Taylor, đầu thế kỷ 20) đo thời gian chuẩn; Standard Costing hệ thống hóa ở Mỹ khoảng 1910s-1920s. Cần đối chiếu nguồn.
      components:
      - 'NVL trực tiếp: lượng chuẩn x giá chuẩn (+ phụ kiện)'
      - 'Nhân công trực tiếp: giờ chuẩn x đơn giá giờ chuẩn theo công đoạn'
      - 'Biến phí chung: giờ x VOH rate'
      - 'Định phí chung phân bổ: giờ x FOH rate'
      - Tổng giá thành chuẩn/đơn vị, biến phí/đơn vị, CM, lãi gộp absorption
      when_to_use: Mọi tổ chức sản xuất/dịch vụ lặp lại muốn đo hiệu quả; chuẩn bị nền cho flexible budget.
      how_to_apply:
      - Chọn đơn vị tính (áo, ly, suất, đơn hàng).
      - Thu thập dữ liệu thực tế 3-6 tháng + cân, đo, bấm giờ để đặt lượng và giờ.
      - 'Chọn loại chuẩn: Currently Attainable cho đánh giá; Ideal cho mục tiêu Kaizen; Basic cho xu hướng.'
      - 'Tính giá thành chuẩn và kiểm tra cộng khớp: Áo thun 60.000 vải + 5.000 phụ kiện + 68.000 nhân công + 25.500 VOH + 34.000 FOH = 192.500.'
      - Thống nhất với nhân viên và rà soát mỗi quý/6 tháng.
      how_to_read_results: Thẻ là thước đo; sai thẻ thì mọi variance vô nghĩa. Variance lặp 3+ tháng thường báo hiệu thẻ lạc hậu.
      pitfalls:
      - Đặt định mức theo trí nhớ/cảm tính
      - Ideal Standard dùng đánh giá thì luôn U
      - Standard dễ quá thì luôn F và không cải tiến (GM)
      - Nguồn từng ghi sai QC 35.000/h và FOH rate 19.608; giá trị đúng 40.000/h và 20.000/DLH
      example: 'Áo thun: biến phí 158.500, giá thành đầy đủ 192.500, CM 191.500 (giá 350.000), lãi gộp absorption 157.500.'
  - id: "m05-frameworks-2"
    title: "Frameworks: m05_static_flexible_budget — Ngân sách tĩnh - ngân sách linh hoạt - thực tế (hai tầng)"
    tags: ["frameworks", "m05_static_flexible_budget", "ngân", "sách", "tĩnh", "linh", "hoạt", "thực", "tế", "hai", "tầng"]
    text: |-
      id: m05_static_flexible_budget
      name_vi: Ngân sách tĩnh - ngân sách linh hoạt - thực tế (hai tầng)
      name_en: Static / Flexible / Actual two-layer analysis
      origin: Công cụ của kế toán quản trị chuẩn (Horngren, Garrison); nền tảng của mọi phân tích variance.
      components:
      - Static Budget (mức kế hoạch)
      - Flexible Budget (sản lượng thực tế x định mức)
      - Actual
      - Tầng 1 Sales Volume Variance = Static -> Flexible
      - Tầng 2 Flexible Budget Variance = Flexible -> Actual, gồm Sales Price, DM, DL, VOH, FOH Budget
      when_to_use: Mỗi lần sản lượng thực tế khác ngân sách (gần như luôn luôn).
      how_to_apply:
      - Lập Static Budget (doanh thu, chi phí, lợi nhuận).
      - Lấy sản lượng/doanh số thực tế.
      - 'Tính Flexible Budget: biến phí tính lại, định phí giữ nguyên, doanh thu theo giá chuẩn.'
      - Tính Sales Volume Variance = Flexible profit - Static profit.
      - Tính Flexible Budget Variance = Actual profit - Flexible profit, rồi tách tiếp theo khoản mục.
      - Cộng tất cả và đối chiếu với tổng chênh lệch.
      how_to_read_results: 'Phần Tầng 1 phụ thuộc thị trường/kinh doanh; Tầng 2 là trách nhiệm quản lý và chính là nơi hành động. Quán Hẻm 25: 13,26 triệu (31%) do bán ít, 30,12 triệu (69%) do vận hành.'
      pitfalls:
      - So thẳng Actual với Static
      - Coi toàn bộ chi phí biến đổi theo sản lượng (bỏ qua định phí/bán biến phí)
      - Dùng lẫn CM và absorption
      example: 'Hẻm 25: Static LN 72,6 triệu -> Flexible 59,34 triệu -> Actual 29,22 triệu.'
  - id: "m05-frameworks-3"
    title: "Frameworks: m05_dm_dl_moh_sales_tree — Cây phân rã tổng chênh lệch lợi nhuận"
    tags: ["frameworks", "m05_dm_dl_moh_sales_tree", "cây", "phân", "rã", "tổng", "chênh", "lệch", "lợi", "nhuận"]
    text: |-
      id: m05_dm_dl_moh_sales_tree
      name_vi: Cây phân rã tổng chênh lệch lợi nhuận
      name_en: Total profit variance tree
      origin: Sơ đồ chuẩn trong Cost Accounting (Horngren, Datar, Rajan; Garrison); cùng dòng với DuPont.
      components:
      - 'Revenue: Sales Price, Sales Volume (-> Quantity + Mix)'
      - 'DM: Price (Mua hàng), Quantity (Sản xuất)'
      - 'DL: Rate (Nhân sự), Efficiency (Quản đốc)'
      - 'VOH: Spending, Efficiency (hệ quả DL Efficiency)'
      - 'FOH: Budget (chi tiêu), Volume (công suất, chỉ absorption)'
      when_to_use: Khi cần báo cáo đầy đủ cho sản xuất lặp lại; với dịch vụ/F&B thu gọn còn Price/Quantity cho nguyên liệu chính, Rate/Efficiency cho giờ công, Spending cho chi phí chung, Budget cho định phí.
      how_to_apply:
      - Xác định người chịu trách nhiệm cho từng nhánh.
      - Tính từng variance theo công thức.
      - 'Đổi dấu: U thành tác động âm lên lợi nhuận.'
      - Cộng và đối chiếu.
      how_to_read_results: 'Nhìn cặp: DM Price + Quantity, DL Rate + Efficiency, Sales Price + Volume. Phân biệt controllable với uncontrollable.'
      pitfalls:
      - 'Bỏ nhánh không có dữ liệu giá/lượng riêng (như NVL khác ở Hẻm 25): vẫn cần một variance gộp'
      - Quy trách nhiệm hai lần cho DL Efficiency và VOH Efficiency
      example: 'Áo thun: tổng chi phí U 29,1 triệu = 4,8 DM + 11,8 DL + 4,5 VOH + 8,0 FOH.'
  - id: "m05-frameworks-4"
    title: "Frameworks: m05_variance_investigation — Quy trình điều tra 6 bước và 5 Whys"
    tags: ["frameworks", "m05_variance_investigation", "quy", "trình", "điều", "tra", "bước", "và", "whys"]
    text: |-
      id: m05_variance_investigation
      name_vi: Quy trình điều tra 6 bước và 5 Whys
      name_en: Variance investigation process & 5 Whys
      origin: 5 Whys do Sakichi Toyoda phát triển, Toyota phổ biến (cần đối chiếu nguồn). Vòng PDCA từ quản trị chất lượng.
      components:
      - B1 Significant không? (5-10% hoặc X triệu)
      - B2 F hay U? (F cũng xem)
      - B3 Root cause bằng 5 Whys
      - B4 Controllable hay uncontrollable?
      - B5 Corrective action (ai, làm gì, khi nào)
      - B6 Cập nhật standard nếu điều kiện đổi bền vững
      when_to_use: Sau khi có bảng variance; với các khoản vượt ngưỡng ngoại lệ.
      how_to_apply:
      - Lọc theo ngưỡng; lấy top 3.
      - Hỏi tại sao tối thiểu 3 lần (lý tưởng 5) cho từng khoản.
      - 'Ví dụ DM Quantity U 7,5 triệu: phế phẩm 5% lên 15% -> máy cắt lệch -> lưỡi dao cũ -> không có lịch bảo trì -> quản đốc mới chưa được đào tạo SOP; hành động: lập SOP bảo trì + đào tạo bắt buộc.'
      - Gán người chịu trách nhiệm và hạn; theo dõi tháng sau.
      how_to_read_results: Nguyên nhân gốc thường là quy trình/đào tạo chứ không phải 'công nhân cẩu thả'. Nguyên nhân bất khả kháng thì điều chỉnh kế hoạch.
      pitfalls:
      - Dừng ở nguyên nhân bề mặt
      - Phạt khi U làm nhân viên che giấu
      - Điều tra variance vụn vặt
      example: 'Bảng ma trận: DM Price U (controllable: mua ngoài deal; uncontrollable: giá thế giới tăng); Sales Vol U (controllable: marketing yếu; uncontrollable: suy thoái, mùa thấp điểm).'
  - id: "m05-frameworks-5"
    title: "Frameworks: m05_management_by_exception — Quản trị theo ngoại lệ - bảng ngưỡng"
    tags: ["frameworks", "m05_management_by_exception", "quản", "trị", "theo", "ngoại", "lệ", "bảng", "ngưỡng"]
    text: |-
      id: m05_management_by_exception
      name_vi: Quản trị theo ngoại lệ - bảng ngưỡng
      name_en: Management by Exception thresholds
      origin: Nguyên tắc quản trị tập trung nguồn lực chú ý hữu hạn vào độ lệch lớn.
      components:
      - 'Insignificant: < 3% VÀ < 2 triệu - bỏ qua'
      - 'Moderate: 3-10% HOẶC 2-10 triệu - theo dõi, báo cáo tháng'
      - 'Significant: > 10% HOẶC > 10 triệu - điều tra ngay'
      - 'Recurring: cùng variance 3+ tháng - rà soát standard'
      when_to_use: Mọi báo cáo variance hằng tháng.
      how_to_apply:
      - Tính % so với chuẩn của chính khoản mục.
      - Áp ngưỡng (điều chỉnh theo quy mô DN).
      - Tô màu bằng conditional formatting.
      - Đánh dấu khoản lặp.
      how_to_read_results: 'Hẻm 25: Significant - Hạt lượng (11,1%), nhân công hiệu suất (20,4%), biến phí chung (16,7%), giá bán (>10 triệu). Moderate - Hạt giá, NVL khác, định phí. Rate nhân công ở mức Insignificant/Moderate.'
      pitfalls:
      - Ngưỡng cứng cho quán nhỏ quá lỏng/chặt (10 triệu có thể bằng 30% lợi nhuận tháng); chỉnh theo quy mô
      - Mẫu số % không nhất quán
      example: 'Hẻm 25 chọn 3 việc: định lượng hạt (4,86tr), lịch ca (3,08tr), khuyến mãi (10,8tr).'
  - id: "m05-frameworks-6"
    title: "Frameworks: m05_kaizen_vs_blame — Toyota Kaizen so với văn hóa đạt chỉ tiêu"
    tags: ["frameworks", "m05_kaizen_vs_blame", "toyota", "kaizen", "so", "với", "văn", "hóa", "đạt", "chỉ", "tiêu"]
    text: |-
      id: m05_kaizen_vs_blame
      name_vi: Toyota Kaizen so với văn hóa đạt chỉ tiêu
      name_en: Kaizen use of variance vs blame culture
      origin: Toyota Production System, Kaizen (Imai 1986), Lean (Womack & Jones); phê bình của HBR 'Stop Using Cost Variance Analysis'. Số liệu minh họa, cần đối chiếu nguồn.
      components:
      - 'Tần suất: hằng ngày/giờ so với hằng tháng'
      - 'Ai phân tích: tổ trưởng/công nhân tại hiện trường so với kế toán'
      - 'Standard: Ideal, kéo giãn so với Attainable dễ'
      - 'Phản ứng: Andon dừng và sửa so với chờ cuối tháng'
      - 'Khi F: kéo standard xuống (18,0h -> 17,8h -> 16,5h)'
      when_to_use: Thiết kế văn hóa và nhịp báo cáo variance; chống gaming.
      how_to_apply:
      - Đo ngay tại nguồn (hằng tuần/ngày cho khoản chính).
      - Variance U là tín hiệu cải tiến, không phải phạt.
      - Khi F bền vững thì cập nhật standard.
      - Chỉ sản xuất theo cầu, không sản xuất thừa để giảm Volume Variance.
      how_to_read_results: 'Volume Variance F không bằng tốt. Mua rẻ -> bảo hành đắt: tối ưu cục bộ làm hại toàn cục.'
      pitfalls:
      - Phạt khi U
      - Standard dễ
      - Cắt bảo trì/đào tạo để đẹp tháng
      - Phân tích theo silo
      example: 'Toyota giả định tiết kiệm 1,5 giờ x 400.000 xe = 600.000 giờ/năm; GM: Volume Var 1.500 tỷ vs thiệt hại tồn kho 15.000 tỷ.'
  - id: "m05-frameworks-7"
    title: "Frameworks: m05_variance_monthly_workflow — Quy trình variance hằng tháng cho SME và cấu trúc Sheets"
    tags: ["frameworks", "m05_variance_monthly_workflow", "quy", "trình", "variance", "hằng", "tháng", "cho", "sme", "và", "cấu", "trúc"]
    text: |-
      id: m05_variance_monthly_workflow
      name_vi: Quy trình variance hằng tháng cho SME và cấu trúc Sheets
      name_en: Monthly SME variance workflow
      origin: Thực hành SME dựa trên PDCA.
      components:
      - '6 bước: so sánh với flexible, tô màu vượt ngưỡng, top 3 + hỏi Why, ghi action, follow-up, cập nhật định mức quý'
      - 'Sheets: Standards, Budget, Actual, Flexible, Variance, Dashboard'
      when_to_use: SME muốn đưa variance vào nhịp quản trị đều đặn.
      how_to_apply:
      - 'Tháng đầu: lập định mức cho 3-5 khoản chi lớn nhất.'
      - Nhập Actual từ POS/kế toán/chấm công.
      - Họp 30 phút top 3.
      - Ghi action vào Notion/Trello.
      - Họp quý cập nhật định mức.
      how_to_read_results: Mỗi tháng có ≤3 hành động, có người và hạn, theo dõi được.
      pitfalls:
      - Báo cáo xong để đó không hành động
      - Dữ liệu thực tế ghi Zalo/sổ tay thiếu
      example: Waterfall từ LN ngân sách -> LN thực tế trên Dashboard.
  - id: "m05-procedures-1"
    title: "Quy trình: m05_proc_full_variance — Phân tích chênh lệch từ ngân sách tĩnh đến hành động"
    tags: ["quy", "trình", "m05_proc_full_variance", "phân", "tích", "chênh", "lệch", "từ", "ngân", "sách", "tĩnh", "đến"]
    text: |-
      id: m05_proc_full_variance
      name: Phân tích chênh lệch từ ngân sách tĩnh đến hành động
      steps:
      - 'Hỏi đủ đầu vào: ngân sách tĩnh (sản lượng, giá bán, chi phí), thẻ định mức (giá, lượng, giờ, biến phí, định phí), số liệu thực tế (sản lượng, giá bán, giá mua, lượng dùng, giờ, chi phí chung); cách chọn margin (CM hay absorption); đơn vị và kỳ.'
      - 'Tính Static Budget: doanh thu, chi phí, lợi nhuận (kế hoạch).'
      - 'Tính Actual: doanh thu, chi phí, lợi nhuận thực tế. Tổng chênh lệch = Actual profit - Static profit.'
      - Lập Flexible Budget với sản lượng thực tế (biến phí tính lại, định phí giữ).
      - 'Tầng 1: Sales Volume Variance (và tách Quantity/Mix nếu nhiều SP).'
      - 'Tầng 2: Sales Price Variance; DM Price-Quantity; DL Rate-Efficiency; VOH Spending-Efficiency; FOH Budget (và Volume nếu absorption). Khoản không có dữ liệu giá/lượng riêng thì tính một variance gộp.'
      - 'Lập bảng đối chiếu: đổi dấu U thành âm, cộng và so với tổng chênh lệch. Phải khớp; nếu không dò lại từng bước.'
      - Phân loại theo ngưỡng ngoại lệ (% và triệu); chọn top 3.
      - 'Với mỗi khoản top: đọc cặp (Price-Qty...), 5 Whys, controllable hay không, hành động (ai - làm gì - hạn), ước lượng tiền cho 1 đơn vị cải thiện.'
      - 'Kết luận tỷ lệ: bao nhiêu % ngoài tầm kiểm soát (Volume), bao nhiêu % vận hành.'
      - Cập nhật định mức nếu điều kiện đổi bền vững; ghi lại để theo dõi tháng sau.
      outputs: Bảng Static / Flexible / Actual; bảng variance F/U kèm tác động lợi nhuận; bảng đối chiếu cộng khớp; top 3 variance kèm nguyên nhân gốc, hành động, người, hạn; kết luận controllable vs uncontrollable.
  - id: "m05-procedures-2"
    title: "Quy trình: m05_proc_standard_setup — Lập thẻ định mức cho SME"
    tags: ["quy", "trình", "m05_proc_standard_setup", "lập", "thẻ", "định", "mức", "cho", "sme"]
    text: |-
      id: m05_proc_standard_setup
      name: Lập thẻ định mức cho SME
      steps:
      - Chọn đơn vị tính sản phẩm/dịch vụ.
      - Lấy dữ liệu 3-6 tháng gần nhất; cân đo lượng NVL (vd 18 g cà phê/ly), bấm giờ thao tác.
      - Chọn loại chuẩn (Currently Attainable cho đánh giá; Ideal làm mục tiêu cải tiến).
      - 'Tính từng dòng: NVL, nhân công, VOH, FOH rate; cộng tổng.'
      - 'Kiểm tra: tổng khớp; biến phí/đơn vị; CM; lãi gộp absorption.'
      - Thống nhất với nhân viên; ghi hiệu lực và ngày rà soát.
      outputs: Thẻ định mức 1 đơn vị kèm CM và lãi gộp; lịch rà soát quý.
  - id: "m05-procedures-3"
    title: "Quy trình: m05_proc_dm_dl_pairs — Tính và đọc cặp variance giá-lượng"
    tags: ["quy", "trình", "m05_proc_dm_dl_pairs", "tính", "và", "đọc", "cặp", "variance", "giá", "lượng"]
    text: |-
      id: m05_proc_dm_dl_pairs
      name: Tính và đọc cặp variance giá-lượng
      steps:
      - Xác định AP, SP, AQ, SQ (SQ theo sản lượng thực tế).
      - Price = (AP - SP) x AQ; Quantity = (AQ - SQ) x SP; kiểm tra tổng = AQ.AP - SQ.SP.
      - 'Làm tương tự DL: Rate = (AR - SR) x AH; Efficiency = (AH - SH) x SR.'
      - 'Đọc cặp: F giá nhưng U lượng lớn hơn thì quyết định ''mua rẻ'' lỗ ròng; Rate U nhưng Efficiency F lớn hơn thì thuê thợ giỏi hợp lý.'
      - Hỏi nguyên nhân ở bộ phận khác nhau (Mua hàng, Sản xuất, Nhân sự).
      outputs: Hai con số cho mỗi cặp, tổng đối chiếu, nhận định cặp và hành động theo từng bộ phận.
  - id: "m05-procedures-4"
    title: "Quy trình: m05_proc_overhead_sales — Variance chi phí chung và doanh thu"
    tags: ["quy", "trình", "m05_proc_overhead_sales", "variance", "chi", "phí", "chung", "và", "doanh", "thu"]
    text: |-
      id: m05_proc_overhead_sales
      name: Variance chi phí chung và doanh thu
      steps:
      - Tách MOH thành biến phí và định phí.
      - 'VOH: Spending và Efficiency (hoặc chỉ Spending nếu định mức theo ly).'
      - 'FOH: tính FOH rate, Budget variance; nếu absorption thêm Volume variance.'
      - Quyết định dùng CM hay absorption cho Sales Volume và nhất quán.
      - Sales Price = (giá TT - giá KH) x lượng TT; Sales Volume = (lượng TT - lượng KH) x margin chuẩn.
      - 'Nhiều sản phẩm: tách Quantity (CM bình quân ngân sách) và Mix; kiểm tra tổng bằng cách tính trực tiếp Σ (AQ_i - BQ_i) x CM_i.'
      outputs: Variance chi phí chung và doanh thu, kèm giải thích Volume Variance và cơ cấu.
  - id: "m05-procedures-5"
    title: "Quy trình: m05_proc_report_and_followup — Lập báo cáo variance và theo dõi hành động"
    tags: ["quy", "trình", "m05_proc_report_and_followup", "lập", "báo", "cáo", "variance", "và", "theo", "dõi", "hành", "động"]
    text: |-
      id: m05_proc_report_and_followup
      name: Lập báo cáo variance và theo dõi hành động
      steps:
      - Dựng bảng Budget / Flexible / Actual / Var / F-U cho Doanh thu, NVL, Nhân công, Overhead, Lãi gộp, Chi phí bán hàng, Quản lý, Lợi nhuận.
      - Tô màu khoản vượt ngưỡng.
      - 'Ghi TOP 3 VARIANCE: khoản - hành động - ai - hạn.'
      - Họp review 30 phút; ghi action vào Notion/Trello; tháng sau follow-up.
      - Kiểm tra variance lặp 3+ tháng để rà soát định mức.
      outputs: Báo cáo 1-2 trang và danh sách hành động có chủ.
  - id: "m05-procedures-6"
    title: "Quy trình: m05_proc_volume_trap_check — Kiểm tra bẫy Volume Variance trước khi quyết định sản xuất"
    tags: ["quy", "trình", "m05_proc_volume_trap_check", "kiểm", "tra", "bẫy", "volume", "variance", "trước", "khi", "quyết", "định"]
    text: |-
      id: m05_proc_volume_trap_check
      name: Kiểm tra bẫy Volume Variance trước khi quyết định sản xuất
      steps:
      - Tính FOH rate và Volume Variance nếu sản xuất đúng cầu.
      - 'Tính kịch bản sản xuất thừa để Volume Var = 0: số tồn kho thừa x mức giảm giá cần để bán + chi phí lưu kho.'
      - So hai kịch bản bằng tiền thật; chọn sản xuất theo cầu nếu thiệt hại tồn kho lớn hơn Volume Var.
      - 'Báo cáo Volume Var là chi phí của công suất dư; hướng xử lý: tăng cầu, dùng công suất cho đơn khác, giảm định phí.'
      outputs: So sánh hai kịch bản và khuyến nghị sản xuất theo cầu.
  - id: "m05-decision_rules-1"
    title: "Quy tắc quyết định: Nếu sản lượng thực tế khác ngân sách thì BẮT BUỘC dùng flexible budget; không so chi phí biến đổi v…"
    tags: ["quy", "tắc", "quyết", "định", "nếu", "sản", "lượng", "thực", "tế", "khác", "ngân", "sách"]
    text: |-
      Nếu sản lượng thực tế khác ngân sách thì BẮT BUỘC dùng flexible budget; không so chi phí biến đổi với ngân sách tĩnh.
  - id: "m05-decision_rules-2"
    title: "Quy tắc quyết định: Nếu so chi phí thực tế với flexible budget thì SQ và SH tính theo sản lượng thực tế, không phải sản…"
    tags: ["quy", "tắc", "quyết", "định", "nếu", "so", "chi", "phí", "thực", "tế", "với", "flexible"]
    text: |-
      Nếu so chi phí thực tế với flexible budget thì SQ và SH tính theo sản lượng thực tế, không phải sản lượng ngân sách.
  - id: "m05-decision_rules-3"
    title: "Quy tắc quyết định: Nếu chi phí có Giá x Lượng thì tách Price (nhân lượng thực tế) và Quantity (nhân giá chuẩn); kiểm t…"
    tags: ["quy", "tắc", "quyết", "định", "nếu", "chi", "phí", "có", "giá", "lượng", "thì", "tách"]
    text: |-
      Nếu chi phí có Giá x Lượng thì tách Price (nhân lượng thực tế) và Quantity (nhân giá chuẩn); kiểm tra cộng khớp tổng.
  - id: "m05-decision_rules-4"
    title: "Quy tắc quyết định: Nếu DM Price F nhưng DM Quantity U lớn hơn thì quyết định mua rẻ là lỗ ròng; xem lại chất lượng nhà…"
    tags: ["quy", "tắc", "quyết", "định", "nếu", "dm", "price", "nhưng", "quantity", "lớn", "hơn", "thì"]
    text: |-
      Nếu DM Price F nhưng DM Quantity U lớn hơn thì quyết định mua rẻ là lỗ ròng; xem lại chất lượng nhà cung cấp và chỉ tiêu đánh giá Mua hàng.
  - id: "m05-decision_rules-5"
    title: "Quy tắc quyết định: Nếu DL Rate U nhưng Efficiency F lớn hơn thì thuê thợ giỏi/tăng ca hợp lý; nếu ngược lại thì xem lạ…"
    tags: ["quy", "tắc", "quyết", "định", "nếu", "dl", "rate", "nhưng", "efficiency", "lớn", "hơn", "thì"]
    text: |-
      Nếu DL Rate U nhưng Efficiency F lớn hơn thì thuê thợ giỏi/tăng ca hợp lý; nếu ngược lại thì xem lại.
  - id: "m05-decision_rules-6"
    title: "Quy tắc quyết định: Nếu định mức giờ công gắn với ca cố định (SME giữ người theo ca) thì DL Efficiency U nhiều khả năng…"
    tags: ["quy", "tắc", "quyết", "định", "nếu", "mức", "giờ", "công", "gắn", "với", "ca", "cố"]
    text: |-
      Nếu định mức giờ công gắn với ca cố định (SME giữ người theo ca) thì DL Efficiency U nhiều khả năng do xếp ca; xem lại định mức/ lịch ca thay vì quy lỗi thợ.
  - id: "m05-decision_rules-7"
    title: "Quy tắc quyết định: Nếu VOH Efficiency U thì xem DL Efficiency trước; cùng một nguyên nhân gốc, đừng quy trách nhiệm ha…"
    tags: ["quy", "tắc", "quyết", "định", "nếu", "voh", "efficiency", "thì", "xem", "dl", "trước", "cùng"]
    text: |-
      Nếu VOH Efficiency U thì xem DL Efficiency trước; cùng một nguyên nhân gốc, đừng quy trách nhiệm hai lần.
  - id: "m05-decision_rules-8"
    title: "Quy tắc quyết định: Nếu Sản xuất ít hơn kế hoạch thì FOH Volume Variance (U) xuất hiện (absorption): đó là công suất bỏ…"
    tags: ["quy", "tắc", "quyết", "định", "nếu", "sản", "xuất", "ít", "hơn", "kế", "hoạch", "thì"]
    text: |-
      Nếu Sản xuất ít hơn kế hoạch thì FOH Volume Variance (U) xuất hiện (absorption): đó là công suất bỏ không, xem kế hoạch bán và công suất, không phạt người.
  - id: "m05-decision_rules-9"
    title: "Quy tắc quyết định: Nếu muốn Volume Variance về 0 bằng cách sản xuất thêm mà thị trường không cần thì dừng: tính thiệt …"
    tags: ["quy", "tắc", "quyết", "định", "nếu", "muốn", "volume", "variance", "về", "bằng", "cách", "sản"]
    text: |-
      Nếu muốn Volume Variance về 0 bằng cách sản xuất thêm mà thị trường không cần thì dừng: tính thiệt hại tồn kho/giảm giá trước (bẫy GM).
  - id: "m05-decision_rules-10"
    title: "Quy tắc quyết định: Nếu SME muốn đơn giản thì dùng contribution costing: không có FOH Volume Variance, chỉ FOH Budget V…"
    tags: ["quy", "tắc", "quyết", "định", "nếu", "sme", "muốn", "đơn", "giản", "thì", "dùng", "contribution"]
    text: |-
      Nếu SME muốn đơn giản thì dùng contribution costing: không có FOH Volume Variance, chỉ FOH Budget Variance; nhân Sales Volume với CM.
  - id: "m05-decision_rules-11"
    title: "Quy tắc quyết định: Nếu dùng absorption thì Sales Volume nhân lãi gộp và phải thêm FOH Volume; tổng hai cách phải bằng …"
