  - id: "m05-case_lessons-1"
    title: "Bài học case: Toyota - variance trong văn hóa Kaizen"
    tags: ["bài", "học", "case", "toyota", "variance", "trong", "văn", "hóa", "kaizen"]
    text: |-
      name: Toyota - variance trong văn hóa Kaizen
      type: success
      setup: 'Toyota dùng variance trong TPS như tín hiệu cải tiến tại genba: real-time, tổ trưởng/công nhân phân tích, Ideal Standard, Andon dừng ngay, kéo standard xuống khi F.'
      key_calculations:
      - Standard 18,0 giờ/xe; Tuần 1 thực tế 18,3h = +0,3h (U) -> jig mới; Tuần 4 17,8h = -0,2h (F) -> cập nhật standard 17,8h.
      - 'Sau 1 năm giả định standard 16,5h: tiết kiệm 1,5 giờ x 400.000 xe = 600.000 giờ/năm.'
      - Nếu giờ công 400.000đ/giờ giả định thì 600.000 x 400.000 = 240 tỷ đồng/năm.
      lesson: 'Variance không dừng ở đạt chuẩn mà là điểm khởi đầu của vòng cải tiến mới. Bốn bài học: real-time, tại nguồn, cải tiến không đổ lỗi, cập nhật standard.'
      data_reliability: illustrative
  - id: "m05-case_lessons-2"
    title: "Bài học case: General Motors - văn hóa đạt chỉ tiêu và bẫy Volume Variance"
    tags: ["bài", "học", "case", "general", "motors", "văn", "hóa", "đạt", "chỉ", "tiêu", "và", "bẫy"]
    text: |-
      name: General Motors - văn hóa đạt chỉ tiêu và bẫy Volume Variance
      type: failure
      setup: 'Trước phá sản 2009 (Chapter 11), GM được nhiều tài liệu mô tả dùng chỉ tiêu ''hit the number'': standard dễ, đổ lỗi, cắt bảo trì/đào tạo, ám ảnh Volume Variance, tối ưu theo silo.'
      key_calculations:
      - 'Công suất 500.000 xe, định phí 5.000 tỷ: FOH rate = 5.000 tỷ / 500.000 = 10 triệu/xe; cầu chỉ 350.000 xe.'
      - 'Sản xuất đúng cầu: Applied = 350.000 x 10tr = 3.500 tỷ; Volume Var = 5.000 - 3.500 = 1.500 tỷ (U), không tồn kho.'
      - 'Sản xuất 500.000 xe: Volume Var = 0 nhưng thừa 150.000 xe; giảm giá 20% trên 500 triệu = 100 triệu/xe x 150.000 = 15.000 tỷ, gấp 10 lần Volume Var.'
      lesson: Volume Variance (U) 1.500 tỷ là chi phí thật của công suất dư, nhưng 'chữa' bằng sản xuất thừa tốn gấp 10 lần. Volume F không bằng tốt; standard phải đủ thách thức; nhìn toàn cục (mua rẻ -> bảo hành đắt).
      data_reliability: illustrative
  - id: "m05-case_lessons-3"
    title: "Bài học case: Quán cà phê Hẻm 25 - variance tháng 9"
    tags: ["bài", "học", "case", "quán", "cà", "phê", "hẻm", "25", "variance", "tháng"]
    text: |-
      name: Quán cà phê Hẻm 25 - variance tháng 9
      type: sme
      setup: Ngân sách 6.000 ly x 45.000đ, LN kế hoạch 72,6 triệu; thực tế 5.400 ly, giá 43.000đ, LN 29,22 triệu. Chênh lệch -43,38 triệu. Giả định minh họa, đã verify nhất quán.
      key_calculations:
      - 'Thẻ chuẩn: biến phí 22.900/ly (hạt 8.100 + NVL khác 9.000 + nhân công 2.800 + biến phí chung 3.000), định phí 60 triệu (10.000/ly), CM 22.100, lãi gộp absorption 12.100.'
      - 'Flexible budget 5.400 ly: LN 243,0 - 183,66 = 59,34 triệu. Sales Volume (CM) = -600 x 22.100 = -13,26 triệu.'
      - 'Hạt: Price (480 - 450) x 108.000 = +3,24tr U; Qty (108.000 - 97.200) x 450 = +4,86tr U.'
      - 'NVL khác: 50,76 - 48,6 = +2,16tr U. Nhân công: Rate +0,78tr U; Efficiency (520 - 432) x 35.000 = +3,08tr U.'
      - Biến phí chung +2,7tr U; Định phí Budget +2,5tr U; (absorption) FOH Volume +6,0tr U.
      - Giá bán (43.000 - 45.000) x 5.400 = -10,8tr U. Tổng = 43,38 triệu U, khớp.
      lesson: '31% (13,26tr) do bán ít, 69% (30,12tr) do vận hành kiểm soát được (khuyến mãi 10,8tr, hạt, ca làm, chi phí chung). Khuyến mãi làm giảm giá nhưng lượng vẫn thấp hơn kế hoạch 600 ly - chương trình không hiệu quả. Chọn top 3 bằng Management by Exception: khuyến mãi, định lượng hạt, lịch ca.'
      data_reliability: illustrative
  - id: "m05-case_lessons-4"
    title: "Bài học case: Công ty áo thun - đối chiếu 80,6 triệu"
    tags: ["bài", "học", "case", "công", "ty", "áo", "thun", "đối", "chiếu", "80", "triệu"]
    text: |-
      name: Công ty áo thun - đối chiếu 80,6 triệu
      type: sme
      setup: Ngân sách 1.200 áo x 350.000, LN 189,0 triệu; thực tế 1.000 áo x 330.000, LN 108,4 triệu. Chênh lệch -80,6 triệu.
      key_calculations:
      - Sales Price -20,0; Sales Volume (absorption) -31,5 (hoặc CM -38,3); DM Price -2,7 F; DM Qty +7,5 U; DL Rate +3,8 U; DL Eff +8,0 U; VOH Spend +1,5 U; VOH Eff +3,0 U; FOH Budget +1,2 U; FOH Volume +6,8 U.
      - 'Tổng chi phí U 29,1; 20,0 + 31,5 + 29,1 = 80,6; hoặc contribution: 20,0 + 38,3 + 4,8 + 11,8 + 4,5 + 1,2 = 80,6.'
      lesson: Hai cách costing cho cùng tổng; contribution rõ hơn cho SME. DM Price F 2,7 bị DM Qty U 7,5 xóa - nếu chỉ nhìn tổng (+4,8 U) sẽ không biết Mua hàng làm tốt còn Sản xuất làm kém.
      data_reliability: illustrative
  - id: "m05-case_lessons-5"
    title: "Bài học case: Quán cà phê - Mix Variance (cà phê vs trà)"
    tags: ["bài", "học", "case", "quán", "cà", "phê", "mix", "variance", "vs", "trà"]
    text: |-
      name: Quán cà phê - Mix Variance (cà phê vs trà)
      type: sme
      setup: Ngân sách 6.000 ly = 3.600 cà phê (CM 24.000) + 2.400 trà (CM 18.000); thực tế 5.400 = 2.700 + 2.700.
      key_calculations:
      - CM bình quân NS = 21.600; Quantity = -600 x 21.600 = -12,96tr U.
      - 'Cơ cấu NS áp 5.400: cà phê 3.240, trà 2.160. Mix = -540 x 24.000 + 540 x 18.000 = -3,24tr U.'
      - Tổng Volume = -16,2tr = (2.700-3.600) x 24.000 + (2.700-2.400) x 18.000.
      lesson: Khách chuyển sang trà (margin thấp hơn) làm mất thêm 3,24 triệu ngoài việc bán ít hơn; tổng số ly không nói lên điều đó.
      data_reliability: illustrative
  - id: "m05-worked_examples-1"
    title: "Ví dụ có lời giải: Áo thun: thẻ định mức, DM, DL, MOH, Sales và đối chiếu 80,6 triệu"
    tags: ["ví", "dụ", "có", "lời", "giải", "áo", "thun", "thẻ", "định", "mức", "dm", "dl"]
    text: |-
      name: 'Áo thun: thẻ định mức, DM, DL, MOH, Sales và đối chiếu 80,6 triệu'
      inputs:
        budget_qty: 1200
