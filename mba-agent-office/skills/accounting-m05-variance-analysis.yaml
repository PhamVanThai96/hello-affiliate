  - id: "m05-worked_examples-5"
    title: "Ví dụ có lời giải: Nhà hàng phở (SME mới): linh hoạt ngân sách bán 2.000 -> 1.700 tô"
    tags: ["ví", "dụ", "có", "lời", "giải", "nhà", "hàng", "phở", "sme", "mới", "linh", "hoạt"]
    text: |-
      name: 'Nhà hàng phở (SME mới): linh hoạt ngân sách bán 2.000 -> 1.700 tô'
      inputs:
        budget_qty: 2000
        actual_qty: 1700
        budget_price: 55000
        actual_price: 52000
        var_cost_std: 28000
        fixed_std: 30000000
        actual_var_cost: 50300000
        actual_fixed: 32000000
      steps:
      - CM chuẩn = 55.000 - 28.000 = 27.000. Static LN = 2.000 x 27.000 - 30tr = 24,0tr.
      - Flexible LN = 1.700 x 27.000 - 30tr = 15,9tr; Sales Volume = -300 x 27.000 = -8,1tr U.
      - Actual LN = 1.700 x 52.000 - 50,3tr - 32tr = 6,1tr.
      - 'Sales Price = (52.000 - 55.000) x 1.700 = -5,1tr U. Biến phí: 50,3 - 1.700 x 28.000 (47,6) = +2,7tr U. Định phí: 32 - 30 = +2,0tr U.'
      - Σ = 8,1 + 5,1 + 2,7 + 2,0 = 17,9 = 24,0 - 6,1.
      result: '-17,9 triệu (U): 45% do bán ít, còn lại giảm giá 5,1tr và chi phí 4,7tr. Hành động: kiểm tra giảm giá có kéo lượng không; định lượng thịt, hành, nước dùng; rà soát hóa đơn điện, gas.'
  - id: "m05-worked_examples-6"
    title: "Ví dụ có lời giải: Shop online ba sản phẩm: Quantity và Mix (nghìn đồng)"
    tags: ["ví", "dụ", "có", "lời", "giải", "shop", "online", "ba", "sản", "phẩm", "quantity", "và"]
    text: |-
      name: 'Shop online ba sản phẩm: Quantity và Mix (nghìn đồng)'
      inputs:
        budget:
          A: 500
          B: 300
          C: 200
        cm:
          A: 60
          B: 100
          C: 150
        actual:
          A: 620
          B: 260
          C: 160
      steps:
      - Tổng NS 1.000, TT 1.040; CM bình quân NS = (500 x 60 + 300 x 100 + 200 x 150) / 1.000 = 90.
      - Quantity = (1.040 - 1.000) x 90 = +3.600 (F).
      - Mix = Σ (AQ - 1.040 x tỷ trọng NS) x CM = (620 - 520) x 60 + (260 - 312) x 100 + (160 - 208) x 150 = 6.000 - 5.200 - 7.200 = -6.400 (U).
      - Tổng = 3.600 - 6.400 = -2.800 = Σ (AQ - BQ) x CM = 120 x 60 + (-40) x 100 + (-40) x 150 = 7.200 - 4.000 - 6.000 = -2.800.
      result: Bán nhiều hơn 4% nhưng lợi nhuận thấp hơn 2,8 triệu vì dồn vào sản phẩm A (CM thấp 60k); cần đẩy B, C.
  - id: "m05-worked_examples-7"
