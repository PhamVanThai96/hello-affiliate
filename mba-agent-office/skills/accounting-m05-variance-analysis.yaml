    text: |-
      Nếu Ideal Standard dùng để đánh giá cá nhân thì đổi sang Currently Attainable; giữ Ideal làm mục tiêu Kaizen.
  - id: "m05-decision_rules-20"
    title: "Quy tắc quyết định: Nếu là ngành dịch vụ khó chuẩn hóa/startup chưa đủ dữ liệu/R&D thì dùng đơn vị dịch vụ (ly, lượt, b…"
