    text: |-
      Nếu dùng absorption thì Sales Volume nhân lãi gộp và phải thêm FOH Volume; tổng hai cách phải bằng nhau.
  - id: "m05-decision_rules-12"
    title: "Quy tắc quyết định: Nếu bán nhiều sản phẩm margin khác nhau thì tách Sales Quantity và Sales Mix; Mix U nghĩa là khách …"
