      Nếu cùng variance lặp 3+ tháng liên tiếp thì rà soát định mức (có thể vấn đề hệ thống/định mức lỗi thời).
  - id: "m05-decision_rules-16"
    title: "Quy tắc quyết định: Nếu variance F thì vẫn kiểm tra có đánh đổi chất lượng, cắt bảo trì/đào tạo không."
