    tags: ["ví", "dụ", "có", "lời", "giải", "bẫy", "volume", "variance", "gm", "số", "liệu", "giả"]
    text: |-
      name: Bẫy Volume Variance (GM) - số liệu giả định
      inputs:
        capacity_cars: 500000
        fixed_cost_billion: 5000
        demand_cars: 350000
        price_million: 500
        discount: 0.2
