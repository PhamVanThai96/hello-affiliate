  - id: "m05-practice_questions-7"
    title: "Câu hỏi luyện tập: Vì sao Price Variance nhân AQ còn Quantity Variance nhân SP?"
    tags: ["câu", "hỏi", "luyện", "tập", "vì", "sao", "price", "variance", "nhân", "aq", "còn", "quantity"]
    text: |-
      q: Vì sao Price Variance nhân AQ còn Quantity Variance nhân SP?
      a: Giá áp lên toàn bộ lượng thực tế đã chi (kể cả hao phí). Lượng thừa định giá bằng giá chuẩn để loại ảnh hưởng của giá, đo trách nhiệm Sản xuất công bằng; tổng hai phần = AP.AQ - SP.SQ.
  - id: "m05-practice_questions-8"
    title: "Câu hỏi luyện tập: Vì sao có FOH Volume Variance dù định phí không đổi? Có nên đưa về 0?"
    tags: ["câu", "hỏi", "luyện", "tập", "vì", "sao", "có", "foh", "volume", "variance", "dù", "định"]
    text: |-
      q: Vì sao có FOH Volume Variance dù định phí không đổi? Có nên đưa về 0?
      a: Vì định phí được phân bổ bằng mức cố định tính từ sản lượng kế hoạch; sản xuất ít hơn thì phần gánh vào sản phẩm thấp hơn dự toán, phần còn lại là công suất bỏ không. Không nên ép về 0 bằng sản xuất thừa (bẫy GM); dùng làm chỉ báo xem lại công suất/kế hoạch.
  - id: "m05-practice_questions-9"
    title: "Câu hỏi luyện tập: Với Hẻm 25, có bao nhiêu % tổng thiếu hụt do bán ít và bao nhiêu % kiểm soát được?"
    tags: ["câu", "hỏi", "luyện", "tập", "với", "hẻm", "25", "có", "bao", "nhiêu", "tổng", "thiếu"]
    text: |-
      q: Với Hẻm 25, có bao nhiêu % tổng thiếu hụt do bán ít và bao nhiêu % kiểm soát được?
      a: 13,26/43,38 = 30,6% do bán ít; 30,12/43,38 = 69,4% do vận hành kiểm soát được.
  - id: "m05-practice_questions-10"
    title: "Câu hỏi luyện tập: Static 1.200 áo, thực tế 1.000. DL Eff, SH là gì khi giờ chuẩn 1,7/áo?"
    tags: ["câu", "hỏi", "luyện", "tập", "static", "200", "áo", "thực", "tế", "000", "dl", "eff"]
    text: |-
      q: Static 1.200 áo, thực tế 1.000. DL Eff, SH là gì khi giờ chuẩn 1,7/áo?
      a: SH = 1.000 x 1,7 = 1.700 giờ (theo sản lượng thực tế, không phải 1.200 x 1,7 = 2.040).
