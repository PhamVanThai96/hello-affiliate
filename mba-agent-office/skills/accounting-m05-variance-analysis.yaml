      - FOH rate = 5.000 tỷ / 500.000 = 10 triệu/xe.
      - 'Sản xuất 350.000: Applied 3.500 tỷ, Volume Var = 1.500 tỷ U.'
      - 'Sản xuất 500.000: Volume Var = 0 nhưng tồn 150.000 xe; giảm 20% x 500 triệu = 100 triệu/xe; 150.000 x 100 triệu = 15.000 tỷ.'
      - 15.000 / 1.500 = 10 lần.
      result: Sản xuất thừa để 'đẹp' variance tốn gấp 10 lần phần định phí cần cứu; chọn sản xuất theo cầu.
