        std_price: 350000
        actual_price: 330000
        std_card:
          vai_m: 1.2
          vai_price: 50000
          phu_kien: 5000
          hours: 1.7
          rate: 40000
          voh_rate: 15000
          foh_rate: 20000
        actual:
          vai_m: 1350
          vai_price: 48000
          phu_kien: 5000
          ah: 1900
          ar: 42000
          voh: 30000000
          foh: 42000000
      steps:
      - Giá thành chuẩn/áo = 60.000 + 5.000 + 68.000 + 25.500 + 34.000 = 192.500; biến phí 158.500; CM 191.500; lãi gộp 157.500.
      - 'Ngân sách: Doanh thu 420tr; chi phí 78 + 81,6 + 30,6 + 40,8 = 231; LN 189tr. Thực tế: DT 330; chi phí 69,8 + 79,8 + 30 + 42 = 221,6; LN 108,4. Chênh -80,6.'
      - 'DM: Price (48.000 - 50.000) x 1.350 = -2,7tr F; Qty (1.350 - 1.200) x 50.000 = +7,5tr U; tổng +4,8 U.'
      - 'DL: Rate (42.000 - 40.000) x 1.900 = +3,8tr U; Eff (1.900 - 1.700) x 40.000 = +8,0 U; tổng +11,8 U.'
      - 'VOH: Spend 30,0 - 1.900 x 15.000 = +1,5 U; Eff (200) x 15.000 = +3,0 U. FOH: Budget +1,2 U; Volume 40,8 - 1.700 x 20.000 = +6,8 U.'
      - 'Sales: Price (330.000 - 350.000) x 1.000 = -20,0 U; Volume (-200) x 157.500 = -31,5 U.'
      - 'Σ = 20,0 + 31,5 + 29,1 = 80,6, khớp. Cách contribution: 20,0 + 38,3 + 4,8 + 11,8 + 4,5 + 1,2 = 80,6.'
      result: 'Tổng chênh lệch -80,6 triệu (U), khớp cả absorption lẫn contribution; DM Price F 2,7 bị Quantity U 7,5 xóa. Ưu tiên: hao phí vải, hiệu suất công, giá bán/khuyến mãi, công suất bỏ không.'
  - id: "m05-worked_examples-2"
    title: "Ví dụ có lời giải: Hẻm 25: ngân sách linh hoạt hai tầng và bảng đối chiếu"
    tags: ["ví", "dụ", "có", "lời", "giải", "hẻm", "25", "ngân", "sách", "linh", "hoạt", "hai"]
    text: |-
      name: 'Hẻm 25: ngân sách linh hoạt hai tầng và bảng đối chiếu'
      inputs:
        budget_qty: 6000
        actual_qty: 5400
        budget_price: 45000
        actual_price: 43000
        var_cost_std: 22900
        fixed_std: 60000000
        actual_costs:
          hat: 51840000
          nvl_khac: 50760000
          nhan_cong: 18980000
          voh: 18900000
          dinh_phi: 62500000
      steps:
      - Static LN = 6.000 x 22.100 - 60.000.000 = 72,6tr. Actual LN = 232,2 - 202,98 = 29,22tr; chênh -43,38.
      - 'Flexible LN = 5.400 x 22.100 - 60.000.000 = 59,34tr. Tầng 1: -13,26tr U. Tầng 2: 29,22 - 59,34 = -30,12tr U.'
      - 'Hạt: SQ 97.200 g; Price +3,24 U; Qty +4,86 U. Nhân công: SH 432; Rate +0,78 U; Eff +3,08 U.'
      - NVL khác +2,16 U; Biến phí chung +2,7 U; Định phí +2,5 U; Giá bán -10,8 U.
      - Σ = 13,26 + 10,8 + 3,24 + 4,86 + 2,16 + 0,78 + 3,08 + 2,7 + 2,5 = 43,38, khớp.
      - 'Tỷ lệ: 13,26/43,38 = 30,6% do bán ít; 30,12/43,38 = 69,4% do vận hành.'
      result: '-43,38 triệu (U): 31% Volume, 69% vận hành. Top 3 xử lý: khuyến mãi (10,8tr), định lượng hạt (4,86tr), lịch ca (3,08tr). Mỗi 1 g hạt/ly = 5.400 x 450 = 2,43tr/tháng.'
  - id: "m05-worked_examples-3"
    title: "Ví dụ có lời giải: Mix và Quantity: quán cà phê hai món"
    tags: ["ví", "dụ", "có", "lời", "giải", "mix", "và", "quantity", "quán", "cà", "phê", "hai"]
    text: |-
      name: 'Mix và Quantity: quán cà phê hai món'
      inputs:
        budget:
          cafe: 3600
          tra: 2400
        cm:
          cafe: 24000
          tra: 18000
        actual:
          cafe: 2700
          tra: 2700
      steps:
      - CM bình quân NS = (3.600 x 24.000 + 2.400 x 18.000) / 6.000 = 21.600.
      - Quantity = (5.400 - 6.000) x 21.600 = -12.960.000 U.
      - Mix = (2.700 - 3.240) x 24.000 + (2.700 - 2.160) x 18.000 = -12.960.000 + 9.720.000 = -3.240.000 U.
      - 'Kiểm tra: Σ (AQ - BQ) x CM = -900 x 24.000 + 300 x 18.000 = -16.200.000.'
      result: Tổng Volume -16,2 triệu U (Quantity -12,96 + Mix -3,24).
  - id: "m05-worked_examples-4"
    title: "Ví dụ có lời giải: Xưởng may: DM và DL từ bài tập"
    tags: ["ví", "dụ", "có", "lời", "giải", "xưởng", "may", "dm", "và", "dl", "từ", "bài"]
