  - id: "m07-practice_questions-3"
    title: "Câu hỏi luyện tập: Khảo sát 250 khách, 60% hài lòng. Tính khoảng tin cậy 95%."
    tags: ["câu", "hỏi", "luyện", "tập", "khảo", "sát", "250", "khách", "60", "hài", "lòng", "tính"]
    text: |-
      q: Khảo sát 250 khách, 60% hài lòng. Tính khoảng tin cậy 95%.
      a: e = 1.96*sqrt(0.6*0.4/250) = 0.0607; CI = [53.9%, 66.1%].
  - id: "m07-practice_questions-4"
    title: "Câu hỏi luyện tập: NPS của quán có 120 promoters, 50 passives, 30 detractors trên 200 người là bao nhiêu?"
    tags: ["câu", "hỏi", "luyện", "tập", "nps", "của", "quán", "có", "120", "promoters", "50", "passives"]
    text: |-
      q: NPS của quán có 120 promoters, 50 passives, 30 detractors trên 200 người là bao nhiêu?
      a: (120-30)/200*100 = 45.
  - id: "m07-practice_questions-5"
    title: "Câu hỏi luyện tập: Vì sao dữ liệu hành vi thường đáng tin hơn khảo sát? Cho ví dụ."
    tags: ["câu", "hỏi", "luyện", "tập", "vì", "sao", "dữ", "liệu", "hành", "vi", "thường", "đáng"]
    text: |-
      q: Vì sao dữ liệu hành vi thường đáng tin hơn khảo sát? Cho ví dụ.
      a: Vì khách có thể nói điều họ nghĩ nên nói (social desirability) hoặc không biết rõ mình muốn gì (stated preference); hành vi (revealed) là lựa chọn thật. Ví dụ khách nói thích documentary nhưng xem nhiều true crime; nói muốn healthy nhưng mua fast food.
  - id: "m07-practice_questions-6"
    title: "Câu hỏi luyện tập: A/B test: nhóm A 30/600 click, nhóm B 45/600. B có thắng không?"
    tags: ["câu", "hỏi", "luyện", "tập", "test", "nhóm", "30", "600", "click", "45", "có", "thắng"]
    text: |-
      q: 'A/B test: nhóm A 30/600 click, nhóm B 45/600. B có thắng không?'
      a: 'p chung = 75/1200 = 0.0625; SE = sqrt(0.0625*0.9375*(2/600)) = 0.01398; z = (0.075-0.05)/0.01398 = 1.79; p-value khoảng 0.074 > 0.05: chưa đủ bằng chứng, cần thêm dữ liệu.'
  - id: "m07-practice_questions-7"
    title: "Câu hỏi luyện tập: Vì sao không nên dừng A/B test ngay khi thấy B đang dẫn?"
    tags: ["câu", "hỏi", "luyện", "tập", "vì", "sao", "không", "nên", "dừng", "test", "ngay", "khi"]
    text: |-
      q: Vì sao không nên dừng A/B test ngay khi thấy B đang dẫn?
      a: Dừng sớm (peeking) làm tăng nguy cơ dương tính giả vì chênh lệch dao động ngẫu nhiên theo thời gian; phải chạy đủ cỡ mẫu/thời gian đã tính trước, tối thiểu một chu kỳ tuần.
  - id: "m07-practice_questions-8"
    title: "Câu hỏi luyện tập: Hãy nêu 4 thiên lệch/rủi ro của nghiên cứu digital so với truyền thống."
    tags: ["câu", "hỏi", "luyện", "tập", "hãy", "nêu", "thiên", "lệch", "rủi", "ro", "của", "nghiên"]
    text: |-
      q: Hãy nêu 4 thiên lệch/rủi ro của nghiên cứu digital so với truyền thống.
      a: Selection bias (người online không đại diện), bot traffic, dữ liệu lớn nhưng nhiễu (messy), vấn đề quyền riêng tư; trong khi truyền thống có survey bias và câu hỏi dẫn dắt.
  - id: "m07-practice_questions-9"
    title: "Câu hỏi luyện tập: Khi nào nên dùng dữ liệu thứ cấp thay vì sơ cấp?"
    tags: ["câu", "hỏi", "luyện", "tập", "khi", "nào", "nên", "dùng", "dữ", "liệu", "thứ", "cấp"]
    text: |-
      q: Khi nào nên dùng dữ liệu thứ cấp thay vì sơ cấp?
      a: Khi dữ liệu thứ cấp (báo cáo ngành, Google Trends, thống kê, dữ liệu nội bộ) đã trả lời đủ câu hỏi, còn mới và đúng định nghĩa; vì nhanh và rẻ. Thu sơ cấp chỉ cho khoảng trống.
  - id: "m07-practice_questions-10"
    title: "Câu hỏi luyện tập: Mini case: chủ quán lẩu muốn biết có nên mở thêm bữa sáng. Hãy thiết kế nghiên cứu."
    tags: ["câu", "hỏi", "luyện", "tập", "mini", "case", "chủ", "quán", "lẩu", "muốn", "biết", "có"]
    text: |-
      q: 'Mini case: chủ quán lẩu muốn biết có nên mở thêm bữa sáng. Hãy thiết kế nghiên cứu.'
      a: 'Quyết định: mở hay không bữa sáng. Dữ liệu nội bộ: lưu lượng 6-9h. Khám phá: phỏng vấn 10-15 người đi làm gần quán. Mô tả: khảo sát 385 người (hoặc 97 nếu cần nhanh): thói quen ăn sáng, giá, thời gian. Nhân quả: chạy thử 2 tuần bữa sáng với menu hạn chế, đo doanh thu và lợi nhuận. Ngưỡng: nếu doanh thu sáng bù chi phí cố định thêm thì mở rộng.'
  - id: "m07-practice_questions-11"
    title: "Câu hỏi luyện tập: Netflix mua thẳng 2 mùa House of Cards không cần tập thí điểm: rủi ro của cách tiếp cận này là gì?"
    tags: ["câu", "hỏi", "luyện", "tập", "netflix", "mua", "thẳng", "mùa", "house", "of", "cards", "không"]
    text: |-
      q: 'Netflix mua thẳng 2 mùa House of Cards không cần tập thí điểm: rủi ro của cách tiếp cận này là gì?'
      a: Dữ liệu quá khứ không đảm bảo tương lai; quá tin dữ liệu bỏ qua yếu tố văn hóa khó đo; một thành công không chứng minh phương pháp luôn đúng (thiên lệch người sống sót); chi phí sai rất lớn.
