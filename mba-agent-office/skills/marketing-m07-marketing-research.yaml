  - id: "m07-case_lessons-1"
    title: "Bài học case: Netflix: House of Cards (2013)"
    tags: ["bài", "học", "case", "netflix", "house", "of", "cards", "2013"]
    text: |-
      name: 'Netflix: House of Cards (2013)'
      type: success
      setup: |
        Netflix cân nhắc sản xuất nội dung gốc đầu tiên, rủi ro trên 100 triệu USD. Phân tích dữ liệu xem thấy ba yếu tố có giao thoa lớn trong khán giả: Kevin Spacey, đạo diễn David Fincher, và bản House of Cards gốc của Anh. Mua thẳng hai mùa (26 tập) mà không làm tập thí điểm, và tạo 10 phiên bản trailer cho từng phân khúc (fan phim chính trị, fan Spacey, fan chính kịch).
      key_calculations:
      - 2 mùa x 13 tập = 26 tập (nguồn khớp)
      - Rủi ro đầu tư ước tính trên 100 triệu USD; giá trị thương hiệu ước tính trên 500 triệu USD (số của nguồn, chưa kiểm chứng)
      - 'Giá trị dữ liệu: nếu xác suất thành công từ dữ liệu cao hơn trực giác, chi phí thử nghiệm thí điểm tiết kiệm được là chi phí mà thí điểm sẽ tốn thêm (không có số trong nguồn)'
      lesson: |
        Khi dữ liệu hành vi cho thấy giao thoa sở thích rõ ràng, có thể giảm bước thử nghiệm tốn kém; cá nhân hóa truyền thông theo phân khúc (nhiều phiên bản trailer) tăng hiệu quả. Cho SME: dùng dữ liệu bán hàng để chọn món/sản phẩm đặt cược, và tạo nhiều phiên bản quảng cáo cho từng phân khúc. Cẩn thận: một case thành công không chứng minh quy trình luôn đúng (thiên lệch người sống sót).
      data_reliability: illustrative
  - id: "m07-case_lessons-2"
    title: "Bài học case: Netflix: thumbnail A/B testing"
    tags: ["bài", "học", "case", "netflix", "thumbnail", "testing"]
    text: |-
      name: 'Netflix: thumbnail A/B testing'
      type: success
      setup: |
        Netflix thử nhiều ảnh đại diện cho cùng một title và cá nhân hóa ảnh cho từng người xem. Theo nguồn, một ảnh có thể đổi 20-30% lượt xem; insight: khuôn mặt biểu cảm mạnh, ít hơn 3 người, villain cho thể loại tội phạm.
      key_calculations:
      - Nếu CTR cơ sở 5% và ảnh tốt hơn tăng tương đối 25% thì CTR mới = 6.25% (chênh 1.25 điểm %)
      - 'Cỡ mẫu để phát hiện 5% lên 6.25%: tính bằng m07_ab_sample_size, khoảng 5.330 mỗi nhóm (đã tính lại)'
      lesson: |
        Yếu tố nhỏ (ảnh) tác động doanh thu lớn; test liên tục; mỗi phân khúc có thể nên thấy phiên bản khác. SME có thể áp dụng cho ảnh sản phẩm, thumbnail video, tiêu đề email.
      data_reliability: unverified
  - id: "m07-case_lessons-3"
    title: "Bài học case: Netflix: hạn chế của quyết định dựa trên dữ liệu"
    tags: ["bài", "học", "case", "netflix", "hạn", "chế", "của", "quyết", "định", "dựa", "trên", "dữ"]
