    title: "Câu hỏi luyện tập: Tính cỡ mẫu khảo sát với độ tin cậy 95%, sai số 5%, p chưa biết. Nếu quần thể 2.000 người thì sao?"
    tags: ["câu", "hỏi", "luyện", "tập", "tính", "cỡ", "mẫu", "khảo", "sát", "với", "độ", "tin"]
    text: |-
      q: Tính cỡ mẫu khảo sát với độ tin cậy 95%, sai số 5%, p chưa biết. Nếu quần thể 2.000 người thì sao?
