  - id: "m07-worked_examples-1"
    title: "Ví dụ có lời giải: Thiết kế khảo sát cho quán cà phê specialty Q.1 (cỡ mẫu và số cần mời)"
    tags: ["ví", "dụ", "có", "lời", "giải", "thiết", "kế", "khảo", "sát", "cho", "quán", "cà"]
    text: |-
      name: Thiết kế khảo sát cho quán cà phê specialty Q.1 (cỡ mẫu và số cần mời)
      inputs:
        z: 1.96
        p: 0.5
        e: 0.05
        response_rate: 0.2
      steps:
      - 'Quyết định: mở quán cà phê specialty ở Q.1 nếu ít nhất 25% người khảo sát sẵn sàng mua tuần hai lần và chấp nhận giá trung bình trên 55.000 VNĐ.'
      - 'Cỡ mẫu Cochran: n0 = 1.96^2*0.5*0.5/0.05^2 = 384.16, làm tròn 385 phiếu hợp lệ.'
      - Tỷ lệ phản hồi dự kiến 20% nên cần mời 385/0.2 = 1.925 người (khảo sát Zalo/Facebook cộng với phát QR ở các tòa nhà văn phòng).
      - Nếu chỉ khảo sát khách của một tòa nhà 2.000 người thì n = 384.16/(1+383.16/2000) = 322.4, tức khoảng 323 phiếu.
      - 'Bảng hỏi 8-10 câu: tần suất mua cà phê, nơi mua gần nhất và giá, mức giá sẵn sàng trả, yếu tố quan trọng (hương vị, không gian, giá), kênh biết đến, nhân khẩu.'
      - 'Sau khi thu 385 phiếu, giả sử 112 người đạt ngưỡng: p_hat = 112/385 = 29.1%; sai số = 1.96*sqrt(0.291*0.709/385) = 4.5 điểm %; CI 95% = [24.6%, 33.6%]. Cận dưới (24.6%) hơi dưới ngưỡng 25% nhưng gần; kết luận: gần ngưỡng, nên làm thử pop-up hoặc nghiên cứu bổ sung trước khi thuê mặt bằng.'
      result: 385 phiếu hợp lệ (hoặc 323 nếu quần thể 2.000); mời 1.925 người; kết quả 29.1% với CI [24.6%, 33.6%] đặt cận dưới sát ngưỡng quyết định
  - id: "m07-worked_examples-2"
    title: "Ví dụ có lời giải: Đọc kết quả A/B test quảng cáo của shop online"
    tags: ["ví", "dụ", "có", "lời", "giải", "đọc", "kết", "quả", "test", "quảng", "cáo", "của"]
    text: |-
      name: Đọc kết quả A/B test quảng cáo của shop online
      inputs:
        xa: 48
        na: 1000
        xb: 68
        nb: 1000
      steps:
      - Shop chạy quảng cáo ảnh A (ảnh sản phẩm trắng nền) và B (ảnh người dùng thật) trong 7 ngày, mỗi biến thể 1.000 lượt hiển thị cho tệp tương đương.
      - CTR A = 48/1000 = 4.8%; CTR B = 68/1000 = 6.8%; chênh lệch 2.0 điểm %, tăng tương đối 41.7%.
      - Tỷ lệ chung p = 116/2000 = 0.058; SE = sqrt(0.058*0.942*0.002) = 0.01045; z = 0.02/0.01045 = 1.91; p-value hai phía 0.056.
      - 'p-value 0.056 lớn hơn 0.05: chưa đủ bằng chứng ở mức 5%. Không kết luận B thắng.'
      - 'Cỡ mẫu cần để phát hiện 4.8% -> 6.8% (power 80%): (2.8016)^2 * (0.0457+0.0634) / 0.0004 = 7.849*0.1091/0.0004 = 2.141 mỗi nhóm; vậy 1.000 lượt/nhóm chưa đủ.'
      - 'Khuyến nghị: tiếp tục chạy B đến khoảng 2.150 lượt mỗi nhóm, hoặc thử một khác biệt lớn hơn; trong lúc chờ có thể phân bổ nhiều ngân sách hơn cho B vì chi phí đổi nhỏ (quyết định dễ đảo ngược).'
      result: 'z = 1.91, p = 0.056: chưa đạt ý nghĩa; cần khoảng 2.150 lượt hiển thị mỗi nhóm để chắc phát hiện chênh 2 điểm %'
  - id: "m07-worked_examples-3"
    title: "Ví dụ có lời giải: Tính NPS và kế hoạch hành động cho nhà hàng phở"
    tags: ["ví", "dụ", "có", "lời", "giải", "tính", "nps", "và", "kế", "hoạch", "hành", "động"]
    text: |-
      name: Tính NPS và kế hoạch hành động cho nhà hàng phở
      inputs:
        total: 200
        promoters: 90
        passives: 70
        detractors: 40
      steps:
      - 'Quán phở thu 200 phản hồi qua QR bàn: 90 người chấm 9-10, 70 người 7-8, 40 người 0-6.'
      - '%Promoters = 45%; %Detractors = 20%; NPS = +25.'
      - 'Sai số: tỷ lệ detractors 20% với n=200 có sai số 1.96*sqrt(0.2*0.8/200) = 5.5 điểm %; NPS có sai số cỡ vài chục điểm khi n nhỏ nên theo dõi xu hướng nhiều kỳ, không đọc tuyệt đối.'
      - 'Đọc câu mở của 40 detractors: nhóm ''chờ lâu giờ trưa'' 17, ''nước dùng nhạt'' 9, ''giá cao'' 8, khác 6. Ưu tiên giải quyết thời gian chờ (chiếm 42.5% = 17/40).'
      - 'Hành động: set trưa phục vụ nhanh 10 phút, đo lại NPS sau 4 tuần với n tối thiểu 100; mục tiêu NPS 35.'
      result: NPS = +25; vấn đề ưu tiên số 1 là thời gian chờ buổi trưa (42.5% detractors)
  - id: "m07-worked_examples-4"
    title: "Ví dụ có lời giải: Chọn phương pháp nghiên cứu cho shop thời trang online ngân sách 5 triệu VNĐ"
    tags: ["ví", "dụ", "có", "lời", "giải", "chọn", "phương", "pháp", "nghiên", "cứu", "cho", "shop"]
    text: |-
      name: Chọn phương pháp nghiên cứu cho shop thời trang online ngân sách 5 triệu VNĐ
      inputs:
        budget_vnd: 5000000
      steps:
      - 'Vấn đề: tỷ lệ khách mua lại thấp (12%), chưa rõ lý do. Quyết định: đổi chính sách hay đổi sản phẩm.'
      - 'Loại nghiên cứu: chưa rõ vấn đề nên Exploratory trước; sau đó Descriptive để đo quy mô; sau đó Causal để thử giải pháp.'
      - 'Dữ liệu thứ cấp/nội bộ (miễn phí): xuất lịch sử đơn, tính tỷ lệ mua lại theo sản phẩm, kênh; xem Clarity/GA nơi khách bỏ giỏ.'
      - 'Định tính: 12 phỏng vấn điện thoại 15 phút, quà 100.000 VNĐ mỗi người = 1.200.000 VNĐ.'
      - 'Định lượng: khảo sát Google Forms 5 câu gửi Zalo cho 1.500 khách cũ; tỷ lệ phản hồi dự kiến 20% = 300 phiếu; voucher 20.000 VNĐ cho 300 người = 6.000.000 VNĐ vượt ngân sách, nên chỉ tặng bốc thăm 10 voucher 100.000 VNĐ = 1.000.000 VNĐ.'
      - 'Sai số với n=300, p=0.5: 1.96*sqrt(0.25/300) = 5.7 điểm % (chấp nhận được cho quyết định dễ đảo ngược).'
      - 'Thử nghiệm: gửi ưu đãi mua lại cho 50% khách ngẫu nhiên (A/B), đo tỷ lệ mua lại 30 ngày.'
      - Tổng chi phí khoảng 1.200.000 + 1.000.000 = 2.200.000 VNĐ, dưới ngân sách 5 triệu.
      result: Quy trình Exploratory -> Descriptive -> Causal với tổng chi khoảng 2,2 triệu VNĐ; giá/mức phản hồi minh họa, confidence thấp
  - id: "m07-worked_examples-5"
    title: "Ví dụ có lời giải: Cỡ mẫu A/B khi phát hiện nhỏ so với lớn (thumbnail kiểu Netflix cho SME)"
    tags: ["ví", "dụ", "có", "lời", "giải", "cỡ", "mẫu", "khi", "phát", "hiện", "nhỏ", "so"]
    text: |-
      name: Cỡ mẫu A/B khi phát hiện nhỏ so với lớn (thumbnail kiểu Netflix cho SME)
      inputs:
        p1: 0.05
        p2_small: 0.06
        p2_large: 0.1
      steps:
      - 'Hiệu ứng nhỏ (5% -> 6%): n = 7.849*(0.0475+0.0564)/0.0001 = 8.155, làm tròn 8.156 mỗi nhóm.'
      - 'Hiệu ứng lớn (5% -> 10%): n = 7.849*(0.0475+0.09)/0.0025 = 431.7, làm tròn 432 mỗi nhóm.'
      - 'Hệ quả: shop chỉ có 300 lượt hiển thị/ngày/biến thể: hiệu ứng nhỏ cần 27 ngày, hiệu ứng lớn cần 1.5 ngày (làm tròn thành 7 ngày để phủ chu kỳ tuần).'
      result: 432 mỗi nhóm (hiệu ứng lớn) so với 8.156 mỗi nhóm (hiệu ứng nhỏ); thiết kế test phải bám lưu lượng thực
  - id: "m07-practice_questions-1"
    title: "Câu hỏi luyện tập: Phân biệt nghiên cứu khám phá, mô tả, nhân quả; mỗi loại cho một ví dụ cho quán cà phê."
