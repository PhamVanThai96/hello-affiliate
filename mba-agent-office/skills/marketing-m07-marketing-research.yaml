  - id: "m07-case_lessons-4"
    title: "Bài học case: Netflix: bài học Marketing 4.0 tổng hợp"
    tags: ["bài", "học", "case", "netflix", "marketing", "tổng", "hợp"]
    text: |-
      name: 'Netflix: bài học Marketing 4.0 tổng hợp'
      type: success
      setup: 'Năm bài học: Data hơn Intuition; Behavioral hơn Survey; Research liên tục; Thumbnail research là doanh thu; Predictive hơn Descriptive.'
