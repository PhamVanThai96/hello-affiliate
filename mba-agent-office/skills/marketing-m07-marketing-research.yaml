        Với SME, thu nhỏ năm bài học thành quy tắc: (1) quyết định quan trọng phải có dữ liệu; (2) tin hành vi hơn lời nói; (3) mỗi tháng một thử nghiệm; (4) tối ưu yếu tố tiếp xúc đầu (ảnh, tiêu đề); (5) dùng dữ liệu để dự đoán khách sắp rời bỏ (ví dụ khách quen 30 ngày chưa quay lại thì gửi ưu đãi).
