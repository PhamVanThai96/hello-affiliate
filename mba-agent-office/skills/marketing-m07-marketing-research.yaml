  - id: "m07-tong-quan"
    title: "Tổng quan m07"
    tags: ["m07", "nghiên", "cứu", "marketing", "research"]
    text: |-
      Nghiên cứu marketing (Marketing Research) — module m07

      Mục đích: Cung cấp quy trình và công cụ thu thập, phân tích, diễn giải thông tin hệ thống về thị trường, khách hàng, đối thủ để ra quyết định marketing dựa trên dữ liệu thay vì trực giác: chọn loại nghiên cứu (khám phá, mô tả, nhân quả), chọn phương pháp định tính/định lượng, thiết kế khảo sát và tính cỡ mẫu, chạy A/B test, đo NPS/CTR, dùng công cụ digital với chi phí thấp, và tránh các bẫy dữ liệu (stated vs revealed preference, garbage in garbage out, analysis paralysis).

      Dùng khi:
      - Chủ SME hỏi 'tôi nên hỏi khách hàng gì', 'khảo sát bao nhiêu người là đủ', 'làm sao biết khách có thích sản phẩm mới không'.
      - Cần thiết kế khảo sát, phỏng vấn sâu, focus group hoặc quan sát trước khi mở quán/ra mắt sản phẩm/đổi giá.
      - Cần tính cỡ mẫu (sample size), sai số (margin of error) hoặc xem kết quả A/B test có ý nghĩa thống kê không.
      - Đánh giá mức độ trung thành bằng NPS, tối ưu CTR của quảng cáo/thumbnail/tiêu đề.
      - Chọn bộ công cụ nghiên cứu số (Google Analytics, Trends, Meta Insights, Hotjar/Clarity, SurveyMonkey/Typeform, social listening).
      - So sánh nghiên cứu truyền thống và digital về tốc độ, chi phí, độ chính xác, thiên lệch.
      - Học từ case Netflix: dùng dữ liệu hành vi, A/B test liên tục, nghiên cứu dự báo.

      Module liên quan: - 'm01 - STP: nghiên cứu cung cấp dữ liệu để phân khúc, chọn mục tiêu, định vị' - 'm06 - Hành vi người tiêu dùng: nghiên cứu để hiểu động cơ, hành trình mua; stated vs revealed preference' - 'm03 - CLV: dữ liệu hành vi/panel cho retention, cohort, RFM' - 'm05 - Digital marketing và growth hacking: A/B test, analytics, funnel' - 'm10 - Định giá: nghiên cứu willingness-to-pay, test giá bằng experim…

      Công thức (tra chi tiết bằng skill_search("<id>")):
      - m07_sample_size_cochran: Cỡ mẫu khảo sát tỷ lệ (Cochran)
      - m07_sample_size_fpc: Hiệu chỉnh cỡ mẫu cho quần thể hữu hạn
      - m07_margin_of_error: Sai số biên và khoảng tin cậy của tỷ lệ
      - m07_invites_needed: Số người cần mời khảo sát theo tỷ lệ phản hồi
      - m07_nps: Chỉ số NPS (Net Promoter Score)
      - m07_ctr: Tỷ lệ nhấp (CTR) và tỷ lệ chuyển đổi
      - m07_ab_sample_size: Cỡ mẫu mỗi nhóm cho A/B test (hai tỷ lệ)
      - m07_two_prop_ztest: Kiểm định z hai tỷ lệ (đọc kết quả A/B)

      Kho tra cứu của module: Khái niệm 11, Công thức 8, frameworks 10, Quy trình 5, Quy tắc quyết định 14, Chuẩn so sánh 13, Lỗi thường gặp 14, Lưu ý SME Việt Nam 10, Bài học case 5, Ví dụ có lời giải 5, Câu hỏi luyện tập 11, Checklist 12, Mẫu Excel/Sheets 6. Tra bằng skill_search với từ khoá chủ đề (vd "ví dụ CLV", "lỗi thường gặp định giá").
  - id: "m07-concepts-1"
    title: "Khái niệm: Nghiên cứu marketing"
    tags: ["khái", "niệm", "nghiên", "cứu", "marketing"]
    text: |-
      term_vi: Nghiên cứu marketing
      term_en: Marketing Research
      definition: Quá trình thu thập, phân tích và diễn giải thông tin một cách hệ thống về thị trường, khách hàng, đối thủ, môi trường kinh doanh để hỗ trợ quyết định marketing.
      why_it_matters: 'Giảm rủi ro và xác suất sai khi quyết định tốn kém (mở điểm bán, ra sản phẩm, đổi giá). Câu của W. Edwards Deming: không có dữ liệu thì bạn chỉ là một người có ý kiến. Nguyên tắc cốt lõi: nghiên cứu phục vụ một quyết định cụ thể, không phải để sưu tầm dữ liệu.'
  - id: "m07-concepts-2"
    title: "Khái niệm: Nghiên cứu khám phá"
    tags: ["khái", "niệm", "nghiên", "cứu", "khám", "phá"]
    text: |-
      term_vi: Nghiên cứu khám phá
      term_en: Exploratory Research
      definition: Nghiên cứu linh hoạt, quy mô nhỏ để hiểu vấn đề và tìm insight ban đầu (focus group, phỏng vấn sâu, quan sát).
      why_it_matters: 'Dùng khi chưa rõ vấn đề: tránh đi khảo sát số lớn với bảng hỏi sai khung. Kết quả là giả thuyết, không phải kết luận có thể suy rộng.'
  - id: "m07-concepts-3"
    title: "Khái niệm: Nghiên cứu mô tả"
    tags: ["khái", "niệm", "nghiên", "cứu", "mô", "tả"]
    text: |-
      term_vi: Nghiên cứu mô tả
      term_en: Descriptive Research
      definition: Mô tả đặc điểm thị trường/khách hàng, trả lời 'cái gì', 'bao nhiêu', 'ai' bằng khảo sát, dữ liệu thứ cấp, panel.
      why_it_matters: Cho con số có thể suy rộng (nếu mẫu đại diện) để đo quy mô, thị phần, mức hài lòng, tần suất mua.
  - id: "m07-concepts-4"
    title: "Khái niệm: Nghiên cứu nhân quả"
    tags: ["khái", "niệm", "nghiên", "cứu", "nhân", "quả"]
    text: |-
      term_vi: Nghiên cứu nhân quả
      term_en: Causal Research
      definition: 'Kiểm tra quan hệ nguyên nhân-kết quả bằng thí nghiệm có nhóm đối chứng (experiment, A/B testing): ''nếu đổi X thì Y thay đổi bao nhiêu''.'
      why_it_matters: Chỉ thí nghiệm ngẫu nhiên mới tách được tác động của một thay đổi khỏi nhiễu (mùa vụ, khuyến mãi khác). Khảo sát và tương quan không chứng minh nhân quả.
  - id: "m07-concepts-5"
    title: "Khái niệm: Dữ liệu sơ cấp và thứ cấp"
    tags: ["khái", "niệm", "dữ", "liệu", "sơ", "cấp", "và", "thứ"]
    text: |-
      term_vi: Dữ liệu sơ cấp và thứ cấp
      term_en: Primary vs Secondary Data
      definition: 'Sơ cấp: doanh nghiệp tự thu thập (survey, interview, A/B test), khớp mục tiêu nhưng tốn thời gian và tiền. Thứ cấp: có sẵn (báo cáo ngành, Google Trends, thống kê nhà nước), nhanh và rẻ nhưng có thể lỗi thời hoặc lệch mục tiêu.'
      why_it_matters: 'Quy tắc tiết kiệm: luôn khai thác dữ liệu thứ cấp trước để khoanh vùng câu hỏi, chỉ thu sơ cấp cho phần khoảng trống còn lại.'
  - id: "m07-concepts-6"
    title: "Khái niệm: Định tính và định lượng"
    tags: ["khái", "niệm", "định", "tính", "và", "lượng"]
    text: |-
      term_vi: Định tính và định lượng
      term_en: Qualitative vs Quantitative
      definition: Định tính trả lời 'tại sao' (mẫu nhỏ, sâu, không suy rộng thống kê). Định lượng trả lời 'bao nhiêu' (mẫu lớn, chuẩn hóa, kiểm định thống kê).
      why_it_matters: 'Hai loại bổ trợ nhau: định tính sinh giả thuyết và ngôn ngữ của khách để viết bảng hỏi; định lượng kiểm chứng quy mô. Dùng cả hai theo thứ tự định tính trước, định lượng sau.'
  - id: "m07-concepts-7"
    title: "Khái niệm: Sở thích tuyên bố và sở thích thực tế"
    tags: ["khái", "niệm", "sở", "thích", "tuyên", "bố", "và", "thực", "tế"]
    text: |-
      term_vi: Sở thích tuyên bố và sở thích thực tế
      term_en: Stated vs Revealed Preference
      definition: 'Stated: điều khách NÓI họ muốn. Revealed: điều khách THỰC SỰ làm/mua (suy ra từ dữ liệu hành vi).'
      why_it_matters: Khách nói muốn ăn healthy nhưng mua fast food; nói thích documentary nhưng xem true crime. Khi hai loại mâu thuẫn, ưu tiên hành vi, dùng khảo sát để hiểu lý do chứ không để dự báo hành vi.
  - id: "m07-concepts-8"
    title: "Khái niệm: Rác vào, rác ra"
    tags: ["khái", "niệm", "rác", "vào", "ra"]
    text: |-
      term_vi: Rác vào, rác ra
      term_en: Garbage In, Garbage Out (GIGO)
      definition: Dữ liệu kém chất lượng (mẫu lệch, câu hỏi dẫn dắt, bot traffic) cho insight sai và quyết định sai.
      why_it_matters: Một nghiên cứu cẩu thả nguy hiểm hơn không có nghiên cứu vì tạo cảm giác chắc chắn giả. Kiểm soát thiên lệch quan trọng hơn tăng cỡ mẫu.
  - id: "m07-concepts-9"
    title: "Khái niệm: Liệt phân tích"
    tags: ["khái", "niệm", "liệt", "phân", "tích"]
    text: |-
      term_vi: Liệt phân tích
      term_en: Analysis Paralysis
      definition: Có quá nhiều dữ liệu nhưng không biết quyết định gì, hoặc nghiên cứu kéo dài làm chậm hành động.
      why_it_matters: Phòng ngừa bằng cách xác định quyết định cần ra và ngưỡng hành động (decision rule) TRƯỚC khi thu thập dữ liệu.
  - id: "m07-concepts-10"
    title: "Khái niệm: Nghiên cứu liên tục"
    tags: ["khái", "niệm", "nghiên", "cứu", "liên", "tục"]
    text: |-
      term_vi: Nghiên cứu liên tục
      term_en: Continuous Research Culture
      definition: Nghiên cứu là văn hóa vận hành thường xuyên (đo, thử, học), không phải dự án làm một lần.
      why_it_matters: 'Bài học Netflix: chạy A/B test liên tục. Với SME: lịch tối thiểu mỗi tháng một thử nghiệm nhỏ và mỗi quý một vòng phản hồi khách.'
  - id: "m07-concepts-11"
    title: "Khái niệm: Dữ liệu lịch sử không đảm bảo tương lai"
    tags: ["khái", "niệm", "dữ", "liệu", "lịch", "sử", "không", "đảm", "bảo", "tương", "lai"]
    text: |-
      term_vi: Dữ liệu lịch sử không đảm bảo tương lai
      term_en: Past is not Future
      definition: Mô hình dựa trên quá khứ không dự báo được thay đổi cấu trúc, xu hướng văn hóa đột biến (ví dụ Squid Game).
      why_it_matters: Dùng dữ liệu để tăng xác suất, không để thay thế tầm nhìn; đột phá cần giả thuyết sáng tạo cộng thử nghiệm nhỏ.
  - id: "m07-formulas-1"
    title: "Công thức: m07_sample_size_cochran — Cỡ mẫu khảo sát tỷ lệ (Cochran)"
    tags: ["công", "thức", "m07_sample_size_cochran", "cỡ", "mẫu", "khảo", "sát", "tỷ", "lệ", "cochran"]
    text: |-
      id: m07_sample_size_cochran
      name_vi: Cỡ mẫu khảo sát tỷ lệ (Cochran)
      name_en: Sample size for a proportion (Cochran)
      expression_latex: n_0 = \dfrac{Z^2 \, p(1-p)}{e^2}
      expression_python: 'n0 = z**2 * p * (1 - p) / e**2  # làm tròn lên: math.ceil(n0)'
      excel: =ROUNDUP(z^2*p*(1-p)/e^2,0)
      variables:
      - symbol: z
        meaning: Giá trị Z theo độ tin cậy (1.645 cho 90%, 1.96 cho 95%, 2.576 cho 99%)
        unit: không đơn vị
      - symbol: p
        meaning: Tỷ lệ kỳ vọng của đặc điểm cần đo (không biết thì lấy 0.5, cho cỡ mẫu lớn nhất, an toàn nhất)
        unit: tỷ lệ 0-1
      - symbol: e
        meaning: Sai số biên chấp nhận (margin of error)
        unit: tỷ lệ 0-1 (0.05 = 5 điểm %)
      when_to_use: Thiết kế khảo sát định lượng với mẫu ngẫu nhiên đơn giản, biến chính là tỷ lệ (% hài lòng, % sẽ mua), quần thể lớn.
      why_it_works: |
        Tỷ lệ mẫu xấp xỉ phân phối chuẩn quanh tỷ lệ thật với độ lệch chuẩn sqrt(p(1-p)/n). Sai số biên = Z nhân độ lệch chuẩn đó. Giải ngược cho n được công thức. p(1-p) lớn nhất tại p=0.5 nên p=0.5 là lựa chọn thận trọng khi chưa biết gì. Sai số tỷ lệ nghịch với căn n: muốn giảm một nửa sai số phải gấp bốn lần cỡ mẫu (nên mẫu vượt 1000 hiếm khi đáng tiền).
      assumptions:
      - Mẫu ngẫu nhiên đơn giản, quần thể đủ lớn (hoặc dùng hiệu chỉnh quần thể hữu hạn).
      - Trả lời trung thực, không thiên lệch không phản hồi.
      pitfalls:
      - Công thức chỉ kiểm soát sai số lấy mẫu; không sửa được thiên lệch chọn mẫu (khảo sát trên fanpage chỉ đại diện fan) hay câu hỏi dẫn dắt.
      - Cỡ mẫu là số phiếu HỢP LỆ cần có, không phải số người mời (phải chia cho tỷ lệ phản hồi).
      - Muốn phân tích theo từng phân khúc con thì mỗi phân khúc cần đủ cỡ mẫu riêng.
      - Nguồn nêu mẫu khảo sát 200-2000+ chung chung; con số cụ thể phải tính theo sai số và độ tin cậy, không lấy tùy ý.
      interpretation: 95% tin cậy, sai số 5%, p=0.5 cho 385 phiếu; sai số 10% chỉ cần khoảng 97 phiếu. Chọn sai số theo mức độ rủi ro của quyết định.
      example:
        inputs:
          z: 1.96
          p: 0.5
          e: 0.05
        steps:
        - n0 = 1.96^2 * 0.5 * 0.5 / 0.05^2 = 3.8416 * 0.25 / 0.0025 = 384.16
        - 'Làm tròn lên: 385 phiếu hợp lệ'
        - 'Với e = 0.10: n0 = 96.04, làm tròn 97 phiếu'
        result: 385 phiếu hợp lệ cho 95% tin cậy và sai số 5 điểm %
  - id: "m07-formulas-2"
    title: "Công thức: m07_sample_size_fpc — Hiệu chỉnh cỡ mẫu cho quần thể hữu hạn"
    tags: ["công", "thức", "m07_sample_size_fpc", "hiệu", "chỉnh", "cỡ", "mẫu", "cho", "quần", "thể", "hữu", "hạn"]
    text: |-
      id: m07_sample_size_fpc
      name_vi: Hiệu chỉnh cỡ mẫu cho quần thể hữu hạn
      name_en: Finite population correction (FPC)
      expression_latex: n = \dfrac{n_0}{1 + \dfrac{n_0 - 1}{N}}
      expression_python: n = n0 / (1 + (n0 - 1) / N)
      excel: =n0/(1+(n0-1)/N)
      variables:
      - symbol: n0
        meaning: Cỡ mẫu từ công thức Cochran
        unit: người/phiếu
      - symbol: N
        meaning: Quy mô quần thể (tổng số khách hàng/đối tượng cần nghiên cứu)
        unit: người
      when_to_use: 'Quần thể nhỏ (vài trăm đến vài nghìn: khách thành viên của một quán, nhân viên, khách B2B) khi n0 chiếm hơn khoảng 5% N.'
      why_it_works: Khi lấy mẫu không hoàn lại từ quần thể nhỏ, mỗi phần tử đã chọn cung cấp thông tin nhiều hơn nên phương sai giảm; công thức FPC giảm cỡ mẫu cần thiết tương ứng.
      assumptions:
      - Lấy mẫu không hoàn lại từ danh sách quần thể xác định.
      pitfalls:
      - Không dùng FPC khi quần thể rất lớn (kết quả gần như bằng n0).
      - Kết quả luôn nhỏ hơn n0 và nhỏ hơn N; nếu n tiến gần N nên điều tra toàn bộ (census).
      interpretation: 'Quần thể 2.000 khách thành viên, 95%, sai số 5%: chỉ cần khoảng 323 phiếu thay vì 385.'
      example:
        inputs:
          n0: 384.16
          N: 2000
        steps:
        - n = 384.16 / (1 + 383.16/2000) = 384.16 / 1.19158 = 322.4
        - 'Làm tròn lên: 323'
        result: 323 phiếu hợp lệ
  - id: "m07-formulas-3"
    title: "Công thức: m07_margin_of_error — Sai số biên và khoảng tin cậy của tỷ lệ"
    tags: ["công", "thức", "m07_margin_of_error", "sai", "số", "biên", "và", "khoảng", "tin", "cậy", "của", "tỷ"]
    text: |-
      id: m07_margin_of_error
      name_vi: Sai số biên và khoảng tin cậy của tỷ lệ
      name_en: Margin of error / confidence interval for a proportion
      expression_latex: e = Z \sqrt{\dfrac{\hat{p}(1-\hat{p})}{n}}, \quad CI = \hat{p} \pm e
      expression_python: e = z * (p_hat * (1 - p_hat) / n) ** 0.5
      excel: =NORM.S.INV(0.975)*SQRT(p_hat*(1-p_hat)/n)
      variables:
      - symbol: p_hat
        meaning: Tỷ lệ quan sát được trong mẫu
        unit: tỷ lệ 0-1
      - symbol: n
        meaning: Số phiếu hợp lệ
        unit: người
      - symbol: z
        meaning: Giá trị Z theo độ tin cậy (1.96 cho 95%)
        unit: không đơn vị
      when_to_use: Sau khi có dữ liệu khảo sát, báo cáo kết quả kèm khoảng tin cậy; hoặc kiểm tra nhanh 'kết quả 60% có chắc không'.
      why_it_works: Cùng logic phân phối chuẩn của tỷ lệ mẫu như Cochran, nhưng dùng p_hat quan sát thay vì p giả định.
      assumptions:
      - Mẫu ngẫu nhiên, n*p_hat >= 10 và n*(1-p_hat) >= 10 để xấp xỉ chuẩn.
      pitfalls:
      - Hai khoảng tin cậy chồng nhau chưa kết luận hai nhóm không khác; dùng kiểm định hai tỷ lệ (m07_two_prop_ztest).
      - Báo '60%' mà không kèm n và sai số dễ gây hiểu lầm.
      interpretation: 'p_hat=0.60, n=250: sai số 6.07 điểm %, khoảng tin cậy 95% là 53.9% đến 66.1%. Nếu quyết định cần ngưỡng 50%, kết quả đủ chắc; nếu cần ngưỡng 60% thì chưa kết luận được.'
      example:
        inputs:
          z: 1.96
          p_hat: 0.6
          n: 250
        steps:
        - e = 1.96 * sqrt(0.6*0.4/250) = 1.96 * sqrt(0.00096) = 1.96 * 0.030984 = 0.0607
        - CI = 0.600 +/- 0.0607 = [0.539, 0.661]
        result: 60% +/- 6.1 điểm %
  - id: "m07-formulas-4"
    title: "Công thức: m07_invites_needed — Số người cần mời khảo sát theo tỷ lệ phản hồi"
    tags: ["công", "thức", "m07_invites_needed", "số", "người", "cần", "mời", "khảo", "sát", "theo", "tỷ", "lệ"]
    text: |-
      id: m07_invites_needed
      name_vi: Số người cần mời khảo sát theo tỷ lệ phản hồi
      name_en: Invitations required given response rate
      expression_latex: N_{invite} = \dfrac{n}{r}
      expression_python: n_invite = n / r
      excel: =ROUNDUP(n/r,0)
      variables:
      - symbol: n
        meaning: Số phiếu hợp lệ cần có
        unit: phiếu
      - symbol: r
        meaning: Tỷ lệ phản hồi hợp lệ dự kiến (email 10-25%, tại chỗ có quà cao hơn; con số giả định, cần đo thực tế)
        unit: tỷ lệ 0-1
      when_to_use: Lập kế hoạch phát khảo sát, quyết định cần mời bao nhiêu người hoặc cần chạy quảng cáo kéo bao nhiêu lượt vào form.
      why_it_works: Số phiếu thu được = số mời nhân tỷ lệ phản hồi, nên số mời = n chia r.
      assumptions:
      - Người phản hồi đại diện cho người không phản hồi (thường không hoàn toàn đúng).
      pitfalls:
      - Tỷ lệ phản hồi thấp làm tăng thiên lệch không phản hồi, không chỉ tăng chi phí.
      interpretation: Cần 385 phiếu, phản hồi 20% thì phải mời 1.925 người.
      example:
        inputs:
          n: 385
          r: 0.2
        steps:
        - 385 / 0.2 = 1925
        result: Mời 1.925 người
  - id: "m07-formulas-5"
    title: "Công thức: m07_nps — Chỉ số NPS (Net Promoter Score)"
    tags: ["công", "thức", "m07_nps", "chỉ", "số", "nps", "net", "promoter", "score"]
    text: |-
      id: m07_nps
      name_vi: Chỉ số NPS (Net Promoter Score)
      name_en: Net Promoter Score
      expression_latex: NPS = \%Promoters - \%Detractors
      expression_python: nps = (promoters - detractors) / total * 100
      excel: =(COUNTIF(range,">=9")-COUNTIF(range,"<=6"))/COUNT(range)*100
      variables:
      - symbol: promoters
        meaning: Số người chấm 9-10 cho câu 'Bạn có sẵn lòng giới thiệu chúng tôi cho bạn bè/đồng nghiệp không? (0-10)'
        unit: người
      - symbol: detractors
        meaning: Số người chấm 0-6
        unit: người
      - symbol: total
        meaning: Tổng số người trả lời (passives = 7-8 được tính vào tổng nhưng không cộng/trừ)
        unit: người
      when_to_use: Đo lòng trung thành/khả năng truyền miệng của khách qua một câu hỏi, theo dõi theo thời gian hoặc so giữa chi nhánh.
      why_it_works: |
        Fred Reichheld (Bain and Company) công bố năm 2003 trên Harvard Business Review, với lập luận một câu hỏi về mức sẵn lòng giới thiệu liên quan tốt tới tăng trưởng hơn các thang đo hài lòng dài. Trừ detractors khỏi promoters phản ánh rằng người chê làm tổn hại tăng trưởng ngang việc người khen làm tăng trưởng. Đây là kiến thức ngoài nguồn bổ sung cho mục đo satisfaction/NPS mà nguồn chỉ nhắc tên.
      assumptions:
      - 'Thang 0-10, cách chia nhóm chuẩn: 9-10, 7-8, 0-6.'
      pitfalls:
      - NPS nằm trong khoảng -100 đến +100, không phải phần trăm.
      - So sánh NPS giữa ngành khác nhau không công bằng; so với chính mình theo thời gian và với đối thủ cùng ngành.
      - Cỡ mẫu nhỏ (dưới khoảng 100) làm NPS dao động mạnh; luôn hỏi thêm câu mở 'vì sao bạn chấm điểm này'.
      interpretation: Trên 0 là tốt hơn mức trung bình tồi, trên 30 khá, trên 50 xuất sắc (ngưỡng tham chiếu phổ biến, độ tin cậy trung bình, thay đổi theo ngành).
      example:
        inputs:
          promoters: 90
          passives: 70
          detractors: 40
          total: 200
        steps:
        - '%Promoters = 90/200 = 45%'
        - '%Detractors = 40/200 = 20%'
        - NPS = 45 - 20 = 25
        result: NPS = +25
  - id: "m07-formulas-6"
    title: "Công thức: m07_ctr — Tỷ lệ nhấp (CTR) và tỷ lệ chuyển đổi"
    tags: ["công", "thức", "m07_ctr", "tỷ", "lệ", "nhấp", "ctr", "và", "chuyển", "đổi"]
    text: |-
      id: m07_ctr
      name_vi: Tỷ lệ nhấp (CTR) và tỷ lệ chuyển đổi
      name_en: Click-through rate / Conversion rate
      expression_latex: CTR = \dfrac{Clicks}{Impressions}, \quad CR = \dfrac{Conversions}{Visitors}
      expression_python: ctr = clicks / impressions
      excel: =clicks/impressions
      variables:
      - symbol: clicks
        meaning: Số lượt nhấp
        unit: lượt
      - symbol: impressions
        meaning: Số lượt hiển thị
        unit: lượt
      when_to_use: Chỉ số kết quả chính trong A/B test thumbnail, tiêu đề, quảng cáo, landing page (Netflix tối ưu CTR cho từng title).
      why_it_works: Chuẩn hóa hành vi nhấp theo lượt hiển thị để so sánh các biến thể có lượng hiển thị khác nhau.
      assumptions:
      - Các biến thể được hiển thị cho tập người tương đương (ngẫu nhiên).
      pitfalls:
      - CTR cao không đồng nghĩa doanh thu cao (clickbait); nên kèm chỉ số cuối phễu (đơn hàng, giữ chân).
      - Bot traffic làm sai CTR.
      interpretation: Chỉ đọc khi chênh lệch có ý nghĩa thống kê (m07_two_prop_ztest) và đủ cỡ mẫu (m07_ab_sample_size).
      example:
        inputs:
          clicks: 68
          impressions: 1000
        steps:
        - 68 / 1000 = 0.068
        result: CTR = 6.8%
  - id: "m07-formulas-7"
    title: "Công thức: m07_ab_sample_size — Cỡ mẫu mỗi nhóm cho A/B test (hai tỷ lệ)"
    tags: ["công", "thức", "m07_ab_sample_size", "cỡ", "mẫu", "mỗi", "nhóm", "cho", "test", "hai", "tỷ", "lệ"]
    text: |-
      id: m07_ab_sample_size
      name_vi: Cỡ mẫu mỗi nhóm cho A/B test (hai tỷ lệ)
      name_en: A/B test sample size per group (two proportions)
      expression_latex: n = \dfrac{(Z_{\alpha/2} + Z_{\beta})^2 \, [p_1(1-p_1) + p_2(1-p_2)]}{(p_2 - p_1)^2}
      expression_python: n = (z_alpha + z_beta) ** 2 * (p1 * (1 - p1) + p2 * (1 - p2)) / (p2 - p1) ** 2
      excel: =((z_alpha+z_beta)^2*(p1*(1-p1)+p2*(1-p2)))/(p2-p1)^2
      variables:
      - symbol: p1
        meaning: Tỷ lệ chuyển đổi/CTR hiện tại (nhóm đối chứng)
        unit: tỷ lệ 0-1
      - symbol: p2
        meaning: Tỷ lệ mong muốn phát hiện được (hiệu ứng tối thiểu có ý nghĩa kinh doanh)
        unit: tỷ lệ 0-1
      - symbol: z_alpha
        meaning: Z hai phía cho mức ý nghĩa alpha (1.96 ứng với alpha 0.05)
        unit: không đơn vị
      - symbol: z_beta
        meaning: Z ứng với power (0.8416 cho power 80%)
        unit: không đơn vị
      when_to_use: 'Trước khi chạy thí nghiệm giá, quảng cáo, landing page, email subject: để biết có đủ lưu lượng hay không.'
      why_it_works: 'Muốn phát hiện chênh lệch nhỏ giữa hai tỷ lệ trong nhiễu lấy mẫu thì cần nhiều dữ liệu: cỡ mẫu tăng theo nghịch đảo bình phương mức chênh lệch. Power 80% nghĩa là nếu khác biệt thật tồn tại, ta phát hiện được với xác suất 80%.'
      assumptions:
      - Hai nhóm bằng nhau, phân bổ ngẫu nhiên; kiểm định hai phía.
      pitfalls:
      - 'Con số ''mỗi nhóm 1000+'' trong nguồn chỉ là quy tắc thô: để phát hiện 5% lên 6% cần khoảng 8.156 mỗi nhóm; để phát hiện 5% lên 10% chỉ cần khoảng 432.'
      - Dừng test sớm khi thấy kết quả 'đẹp' (peeking) làm tăng dương tính giả; cố định cỡ mẫu/thời gian trước.
      - Chạy tối thiểu một chu kỳ tuần (7 ngày) để bắt hiệu ứng ngày trong tuần.
      interpretation: Nếu lưu lượng không đủ, hãy kiểm tra thay đổi lớn hơn (hiệu ứng lớn), kéo dài thời gian, hoặc dùng phương pháp định tính thay A/B test.
      example:
        inputs:
          p1: 0.05
          p2: 0.06
          z_alpha: 1.96
          z_beta: 0.8416
        steps:
        - (1.96+0.8416)^2 = 7.849
        - p1(1-p1)+p2(1-p2) = 0.0475 + 0.0564 = 0.1039
        - (p2-p1)^2 = 0.0001
        - n = 7.849 * 0.1039 / 0.0001 = 8155.1, làm tròn lên 8156 mỗi nhóm
        result: Khoảng 8.156 người mỗi nhóm (16.312 tổng)
  - id: "m07-formulas-8"
    title: "Công thức: m07_two_prop_ztest — Kiểm định z hai tỷ lệ (đọc kết quả A/B)"
    tags: ["công", "thức", "m07_two_prop_ztest", "kiểm", "định", "hai", "tỷ", "lệ", "đọc", "kết", "quả"]
    text: |-
      id: m07_two_prop_ztest
      name_vi: Kiểm định z hai tỷ lệ (đọc kết quả A/B)
      name_en: Two-proportion z-test
      expression_latex: z = \dfrac{\hat{p}_B - \hat{p}_A}{\sqrt{\hat{p}(1-\hat{p})\left(\frac{1}{n_A}+\frac{1}{n_B}\right)}}, \quad \hat{p} = \dfrac{x_A + x_B}{n_A + n_B}
      expression_python: p = (xa + xb) / (na + nb); se = (p * (1 - p) * (1 / na + 1 / nb)) ** 0.5; z = (xb / nb - xa / na) / se
      excel: =(xb/nb-xa/na)/SQRT(p*(1-p)*(1/na+1/nb))
      variables:
      - symbol: xa, xb
        meaning: Số thành công (click/mua) ở nhóm A và B
        unit: lượt
      - symbol: na, nb
        meaning: Số người/lượt hiển thị mỗi nhóm
        unit: lượt
      when_to_use: Sau khi A/B test kết thúc, kết luận biến thể B có thật sự hơn A không.
      why_it_works: Giả thuyết không là hai tỷ lệ bằng nhau; ước lượng tỷ lệ chung (pooled) để tính sai số chuẩn; |z| > 1.96 tương ứng p-value dưới 0.05 (hai phía).
      assumptions:
      - Ngẫu nhiên hóa; quan sát độc lập; số thành công và thất bại mỗi nhóm đều trên khoảng 10.
      pitfalls:
      - 'p-value dưới 0.05 chỉ nói khác biệt khó do ngẫu nhiên, không nói khác biệt đủ lớn để đáng triển khai: luôn so với chi phí và mức tăng doanh thu.'
      - Chạy nhiều biến thể cùng lúc làm tăng nguy cơ dương tính giả.
      interpretation: 'p-value hai phía khoảng 0.056 là chưa đạt ngưỡng 0.05: chưa đủ bằng chứng, nên chạy thêm dữ liệu thay vì kết luận B thắng.'
      example:
        inputs:
          xa: 48
          na: 1000
          xb: 68
          nb: 1000
        steps:
        - p_chung = (48+68)/2000 = 0.058
        - SE = sqrt(0.058*0.942*(2/1000)) = 0.010453
        - z = (0.068-0.048)/0.010453 = 1.913
        - p-value hai phía = 0.0557
        result: 'z = 1.91, p = 0.056: chưa đạt ý nghĩa ở mức 5%, B nhỉnh hơn nhưng cần thêm dữ liệu'
  - id: "m07-frameworks-1"
    title: "Frameworks: m07_research_types — Ba loại nghiên cứu: Khám phá, Mô tả, Nhân quả"
    tags: ["frameworks", "m07_research_types", "ba", "loại", "nghiên", "cứu", "khám", "phá", "mô", "tả", "nhân", "quả"]
    text: |-
      id: m07_research_types
      name_vi: 'Ba loại nghiên cứu: Khám phá, Mô tả, Nhân quả'
      name_en: Exploratory, Descriptive, Causal Research
      origin: Phân loại chuẩn trong giáo trình nghiên cứu marketing (Malhotra; Aaker, Kumar và Day), dựa trên mức độ rõ ràng của vấn đề; ra đời để chọn phương pháp phù hợp thay vì mặc định dùng khảo sát cho mọi câu hỏi.
      components:
      - 'Exploratory (Khám phá): hiểu vấn đề, tìm insight ban đầu; phương pháp focus group, phỏng vấn sâu, quan sát; dùng khi chưa rõ vấn đề, giai đoạn đầu.'
      - 'Descriptive (Mô tả): mô tả đặc điểm thị trường/khách hàng; phương pháp survey, dữ liệu thứ cấp, panel; dùng khi cần biết cái gì, bao nhiêu.'
      - 'Causal (Nhân quả): kiểm tra quan hệ nhân quả; phương pháp experiment, A/B testing; dùng khi cần biết tại sao, nếu... thì.'
      when_to_use: 'Bước 2 của quy trình nghiên cứu: chọn thiết kế nghiên cứu sau khi đã phát biểu rõ vấn đề và quyết định cần ra.'
      how_to_apply:
      - 'Hỏi: mức độ hiểu biết về vấn đề hiện nay? Chưa rõ thì Exploratory trước.'
      - Nếu đã có giả thuyết và cần con số suy rộng thì Descriptive.
      - Nếu cần biết thay đổi X có làm Y tăng không thì Causal (thí nghiệm có nhóm đối chứng, ngẫu nhiên).
      - 'Đi theo chuỗi: Exploratory để sinh giả thuyết, Descriptive để đo quy mô, Causal để kiểm chứng can thiệp.'
      how_to_read_results: Exploratory cho giả thuyết, không suy rộng; Descriptive cho ước lượng với sai số; Causal cho tác động ước lượng nếu thiết kế sạch.
      pitfalls:
      - Dùng kết quả focus group (vài chục người) để kết luận tỷ lệ thị trường.
      - Dùng khảo sát mô tả để khẳng định nhân quả (tương quan khác nhân quả).
      example: 'Quán phở muốn tăng khách buổi trưa: phỏng vấn sâu 12 khách văn phòng (Exploratory) thấy họ ngại chờ lâu; khảo sát 385 người quanh khu (Descriptive) cho thấy 58% chỉ có 45 phút nghỉ; thử set trưa giao nhanh 10 phút cho một nửa số ngày (Causal) để đo doanh thu chênh lệch.'
  - id: "m07-frameworks-2"
    title: "Frameworks: m07_data_sources — Dữ liệu sơ cấp và thứ cấp"
    tags: ["frameworks", "m07_data_sources", "dữ", "liệu", "sơ", "cấp", "và", "thứ"]
    text: |-
      id: m07_data_sources
      name_vi: Dữ liệu sơ cấp và thứ cấp
      name_en: Primary vs Secondary Data
      origin: Phân loại nguồn dữ liệu cơ bản của nghiên cứu marketing; ra đời để nhắc nghiên cứu viên rằng nên tận dụng dữ liệu có sẵn trước khi tốn tiền thu mới.
      components:
      - 'Sơ cấp: DN tự thu (survey, interview, A/B test); ưu: khớp mục tiêu; nhược: tốn thời gian, chi phí.'
      - 'Thứ cấp: có sẵn (báo cáo ngành, Google Trends, thống kê chính phủ); ưu: nhanh, rẻ, sẵn có; nhược: có thể lỗi thời, không phù hợp.'
      when_to_use: Mọi dự án nghiên cứu, ngay sau khi xác định mục tiêu.
      how_to_apply:
      - Liệt kê câu hỏi nghiên cứu, tìm dữ liệu thứ cấp trả lời được phần nào (Google Trends, báo cáo ngành, Tổng cục Thống kê, dữ liệu nội bộ POS/CRM/Google Analytics).
      - Kiểm tra độ mới, phương pháp lấy mẫu, định nghĩa chỉ tiêu của nguồn thứ cấp.
      - Chỉ thiết kế thu thập sơ cấp cho phần khoảng trống.
      how_to_read_results: Dữ liệu thứ cấp dùng để khoanh vùng và làm benchmark, không thay thế hiểu biết về khách hàng cụ thể của mình.
      pitfalls:
      - Dùng báo cáo ngành cũ nhiều năm hoặc định nghĩa thị trường khác với thị trường mình.
      - Bỏ qua dữ liệu nội bộ sẵn có (hóa đơn POS, đơn hàng, lịch sử chat) vốn là dữ liệu hành vi rất giá trị.
      example: Trước khi mở quán cà phê specialty, dùng Google Trends xem xu hướng tìm 'specialty coffee' theo tháng, rồi mới khảo sát 385 người quanh khu để hỏi mức giá chấp nhận.
  - id: "m07-frameworks-3"
    title: "Frameworks: m07_six_step_process — Quy trình nghiên cứu marketing 6 bước"
    tags: ["frameworks", "m07_six_step_process", "quy", "trình", "nghiên", "cứu", "marketing", "bước"]
    text: |-
      id: m07_six_step_process
      name_vi: Quy trình nghiên cứu marketing 6 bước
      name_en: 6-Step Marketing Research Process
      origin: Quy trình chuẩn trong giáo trình Malhotra, Aaker và cộng sự; ra đời để nghiên cứu đi từ quyết định đến hành động, tránh thu thập dữ liệu không dẫn tới quyết định nào.
      components:
      - 'Bước 1: Xác định vấn đề và mục tiêu (cần biết gì, để quyết định gì).'
      - 'Bước 2: Thiết kế phương pháp (Exploratory/Descriptive/Causal, định tính hay định lượng).'
      - 'Bước 3: Thu thập dữ liệu (survey, interview, observation, digital analytics).'
      - 'Bước 4: Phân tích dữ liệu (thống kê, thematic analysis, AI/ML).'
      - 'Bước 5: Trình bày kết quả (báo cáo, dashboard, khuyến nghị).'
      - 'Bước 6: Ra quyết định và hành động.'
      when_to_use: Mọi dự án nghiên cứu; dùng như khung kiểm tra để không nhảy cóc.
      how_to_apply:
      - 'Viết một câu: ''Chúng tôi cần biết X để quyết định Y; nếu kết quả là Z1 thì làm A, nếu Z2 thì làm B'' (decision rule trước khi thu thập).'
      - Chọn thiết kế và phương pháp theo m07_research_types, m07_qualitative_methods, m07_quantitative_methods; dự toán ngân sách và thời gian.
      - Soạn công cụ (bảng hỏi, kịch bản phỏng vấn), thử nghiệm (pilot) với 5-10 người trước khi chạy chính thức.
      - 'Thu thập: kiểm soát chất lượng (loại bot, trả lời vội, trùng).'
      - 'Phân tích: làm sạch dữ liệu, thống kê mô tả, kiểm định phù hợp; với định tính, mã hóa chủ đề.'
      - 'Trình bày: nêu kết luận trước, bằng chứng sau, kèm n, sai số, hạn chế; mỗi phát hiện gắn một khuyến nghị hành động.'
      - Thực thi quyết định, đo kết quả, ghi lại bài học cho vòng sau.
      how_to_read_results: 'Bước 6 là thước đo: nghiên cứu không dẫn tới quyết định/hành động nào là nghiên cứu thất bại, dù số liệu đẹp.'
      pitfalls:
      - Nhảy thẳng vào thu thập dữ liệu (bước 3) khi chưa rõ quyết định (bước 1).
      - Bỏ pilot nên bảng hỏi có câu hiểu sai.
      - Báo cáo dài liệt kê số liệu mà không có khuyến nghị.
      example: 'Quán trà sữa cân nhắc mở chi nhánh: quyết định = mở hay không ở khu X; ngưỡng = nếu tối thiểu 30% trong 385 người khảo sát nói sẽ mua tuần ít nhất một lần và lưu lượng đi bộ đạt mức đề ra thì mở.'
  - id: "m07-frameworks-4"
    title: "Frameworks: m07_qualitative_methods — Phương pháp định tính (Tại sao?)"
    tags: ["frameworks", "m07_qualitative_methods", "phương", "pháp", "định", "tính", "tại", "sao"]
    text: |-
      id: m07_qualitative_methods
      name_vi: Phương pháp định tính (Tại sao?)
      name_en: Qualitative Research Methods
      origin: Gốc từ nhân học (ethnography) và tâm lý học; focus group phát triển mạnh trong marketing từ giữa thế kỷ 20; netnography do Robert Kozinets đề xuất cuối thập niên 1990 để nghiên cứu cộng đồng online (kiến thức ngoài nguồn). Ra đời vì khảo sát chuẩn hóa không bắt được động cơ và ngữ cảnh.
      components:
      - 'In-depth Interview (Phỏng vấn sâu): 1-1, 10-30 người; hiểu động cơ, pain point.'
      - 'Focus Group (Thảo luận nhóm): 6-10 người/nhóm, 2-5 nhóm; test concept, khám phá insight.'
      - 'Ethnography (Dân tộc học/quan sát): 5-20 người trong môi trường tự nhiên; hiểu hành vi thực tế.'
      - 'Netnography: phân tích hành vi online (forum, mạng xã hội), hàng nghìn bài đăng; hiểu hội thoại tự nhiên.'
      when_to_use: Khi chưa rõ vấn đề, cần hiểu lý do, cần ngôn ngữ của khách để viết bảng hỏi, thử concept sớm, hoặc khi khách khó diễn đạt nhu cầu.
      how_to_apply:
      - Xác định câu hỏi nghiên cứu và tiêu chí chọn người tham gia (screener) bám sát phân khúc mục tiêu.
      - 'Soạn kịch bản bán cấu trúc: câu hỏi mở, từ rộng đến hẹp, hỏi ''lần gần nhất bạn... kể cho tôi nghe'', hỏi tiếp ''vì sao''.'
      - 'Phỏng vấn/nhóm: ghi âm có xin phép; focus group cần người điều phối trung lập, tránh để một người chi phối.'
      - Dừng khi hết thông tin mới (bão hòa chủ đề), thường trong khoảng nguồn đề xuất.
      - Mã hóa theo chủ đề (thematic analysis), tóm tắt kèm trích dẫn nguyên văn của khách.
      - Đổi giả thuyết thành câu hỏi kiểm chứng định lượng.
      how_to_read_results: Là hệ giả thuyết và ngôn ngữ khách hàng; không báo cáo bằng phần trăm dù mẫu có vẻ nhiều.
      pitfalls:
      - Suy rộng kết quả thành tỷ lệ thị trường.
      - Chọn người quen/bạn bè gây thiên lệch lịch sự.
      - Câu hỏi dẫn dắt ('bạn có thấy món này ngon không').
      - Focus group bị người nói nhiều áp đảo (groupthink).
      example: 'Chủ shop thời trang online phỏng vấn sâu 15 khách đã mua ít nhất 2 lần để tìm lý do quay lại; kết quả: chính sách đổi trả quan trọng hơn giá, từ đó thiết kế câu hỏi khảo sát định lượng cho 385 khách.'
  - id: "m07-frameworks-5"
    title: "Frameworks: m07_quantitative_methods — Phương pháp định lượng (Bao nhiêu?)"
    tags: ["frameworks", "m07_quantitative_methods", "phương", "pháp", "định", "lượng", "bao", "nhiêu"]
    text: |-
      id: m07_quantitative_methods
      name_vi: Phương pháp định lượng (Bao nhiêu?)
      name_en: Quantitative Research Methods
      origin: Dựa trên thống kê suy diễn (lấy mẫu ngẫu nhiên, kiểm định giả thuyết) và thiết kế thí nghiệm của R. A. Fisher những năm 1920-1930 (kiến thức ngoài nguồn); ra đời để đo lường có sai số kiểm soát được.
      components:
      - 'Survey: bảng hỏi chuẩn hóa, 200-2000+ phiếu; đo thái độ, mức hài lòng.'
      - 'Experiment: A/B test, nguồn nêu 1000+ mỗi nhóm (cần tính theo m07_ab_sample_size); test giá, quảng cáo, tính năng.'
      - 'Panel data: theo dõi cùng nhóm khách theo thời gian, hàng nghìn; tracking hành vi mua.'
      - 'Big Data Analytics: hàng triệu bản ghi; dự báo, nhận dạng mẫu.'
      when_to_use: Khi đã có giả thuyết cần đo quy mô, so sánh nhóm, hoặc kiểm tra tác động của một thay đổi.
      how_to_apply:
      - Xác định biến cần đo, nhóm đối tượng, khung lấy mẫu.
      - Tính cỡ mẫu theo m07_sample_size_cochran (và m07_sample_size_fpc nếu quần thể nhỏ); chia cho tỷ lệ phản hồi (m07_invites_needed).
      - 'Soạn bảng hỏi theo quy tắc: câu ngắn, một ý, không dẫn dắt, thang đo nhất quán (Likert 5 điểm), câu sàng lọc đầu, câu nhân khẩu cuối; pilot 5-10 người.'
      - Thu thập bằng form online hoặc tại điểm bán; có kiểm soát chất lượng (thời gian trả lời tối thiểu, câu kiểm tra chú ý).
      - 'Phân tích: thống kê mô tả, khoảng tin cậy (m07_margin_of_error), so sánh nhóm (m07_two_prop_ztest), crosstab theo phân khúc.'
      - Báo cáo kèm n, sai số, cách lấy mẫu, hạn chế.
      how_to_read_results: Đọc tỷ lệ cùng khoảng tin cậy; khác biệt dưới sai số biên coi như chưa khác; luôn cân nhắc thiên lệch chọn mẫu.
      pitfalls:
      - Mẫu thuận tiện (chỉ khảo sát khách đang ngồi quán) không đại diện thị trường tiềm năng.
      - Bảng hỏi quá dài làm bỏ dở hoặc trả lời đại.
      - 'Panel: người tham gia lâu dần thành ''không điển hình''.'
      example: 'Khảo sát quán cà phê Q.1: 385 phiếu hợp lệ, hỏi tần suất mua, mức giá chấp nhận, kênh biết đến quán; phân tích theo nhóm tuổi.'
  - id: "m07-frameworks-6"
    title: "Frameworks: m07_digital_tools — Bộ công cụ nghiên cứu số (Digital Research Tools)"
    tags: ["frameworks", "m07_digital_tools", "bộ", "công", "cụ", "nghiên", "cứu", "số", "digital", "research", "tools"]
    text: |-
      id: m07_digital_tools
      name_vi: Bộ công cụ nghiên cứu số (Digital Research Tools)
      name_en: Digital Research Tools
      origin: Phát triển cùng Internet, mạng xã hội và AI từ những năm 2000; ra đời vì hành vi khách hàng nay để lại dấu vết số, cho phép đo thời gian thực với chi phí thấp hơn nhiều so với nghiên cứu truyền thống.
      components:
      - 'Google Analytics (miễn phí): hành vi web, traffic, chuyển đổi, user flow.'
      - 'Google Trends (miễn phí): mức quan tâm tìm kiếm, xu hướng, mùa vụ.'
      - 'Meta Audience Insights (miễn phí): nhân khẩu học mạng xã hội, profiling.'
      - 'SEMrush / Ahrefs (trả phí): SEO, từ khóa, phân tích đối thủ.'
      - 'SurveyMonkey / Typeform (freemium): khảo sát online.'
      - 'Hotjar / Microsoft Clarity (freemium): heatmap, session recording.'
      - 'Brandwatch / Sprout (trả phí): social listening, sentiment.'
      - 'ChatGPT / công cụ AI (freemium): tóm tắt báo cáo, gom chủ đề, sinh insight (cần kiểm chứng).'
      when_to_use: Cần dữ liệu nhanh, rẻ, thời gian thực; SME có ngân sách hạn chế.
      how_to_apply:
      - 'Bắt đầu với bộ miễn phí: Google Analytics + Google Trends + Meta Insights + Clarity + Google Forms.'
      - Gắn tracking (GA4, Meta Pixel) để thu hành vi thật trước khi cần ra quyết định.
      - Dùng Trends/SEMrush trước để khoanh vùng nhu cầu và đối thủ, rồi khảo sát để hiểu lý do.
      - Dùng AI để gom và tóm tắt phản hồi mở, nhưng kiểm tra lại mẫu trích dẫn gốc.
      - Nâng cấp công cụ trả phí khi có câu hỏi cụ thể và ngân sách.
      how_to_read_results: Dữ liệu hành vi cho biết khách LÀM gì; không cho biết VÌ SAO. Kết hợp với phỏng vấn/khảo sát ngắn để giải thích.
      pitfalls:
      - Selection bias (người dùng online không đại diện toàn dân) và bot traffic làm sai số liệu.
      - Đo nhiều nhưng không hành động (analysis paralysis).
      - 'Quyền riêng tư: tuân thủ quy định dữ liệu cá nhân; cần xác nhận quy định hiện hành tại Việt Nam.'
      - 'Đánh giá AI như nguồn sự thật: AI có thể bịa số liệu thị trường.'
      example: Shop mỹ phẩm online dùng Google Trends so sánh 'serum vitamin C' và 'serum retinol' theo mùa, Clarity xem khách bỏ giỏ ở bước nào, rồi gửi khảo sát 5 câu qua Zalo cho khách vừa bỏ giỏ.
  - id: "m07-frameworks-7"
    title: "Frameworks: m07_traditional_vs_digital — So sánh nghiên cứu truyền thống và digital"
    tags: ["frameworks", "m07_traditional_vs_digital", "so", "sánh", "nghiên", "cứu", "truyền", "thống", "và", "digital"]
    text: |-
      id: m07_traditional_vs_digital
      name_vi: So sánh nghiên cứu truyền thống và digital
      name_en: Traditional vs Digital Research
      origin: Khung so sánh giáo khoa cho kỷ nguyên Marketing 4.0 (Kotler); ra đời để SME chọn cách tiếp cận phù hợp ngân sách và loại câu hỏi.
      components:
      - 'Tốc độ: truyền thống tuần-tháng; digital giờ-ngày.'
      - 'Chi phí: truyền thống cao (nguồn: $50K-500K); digital thấp-trung bình ($0-50K); đây là mức của dự án lớn, giá thị trường VN thấp hơn nhiều, confidence thấp.'
      - 'Sample size: truyền thống trăm-nghìn; digital triệu-tỉ.'
      - 'Accuracy: truyền thống kiểm soát chặt nhưng nhỏ; digital lớn nhưng nhiễu (messy).'
      - 'Real-time: truyền thống không; digital có (live dashboard).'
      - 'Bias: truyền thống survey bias, câu hỏi dẫn dắt; digital selection bias, bot traffic.'
      when_to_use: Lựa chọn phương pháp ở bước 2 và lập ngân sách.
      how_to_apply:
      - 'Cần hiểu động cơ, sản phẩm mới chưa có dữ liệu, đối tượng offline: ưu tiên truyền thống/định tính.'
      - 'Cần theo dõi hiệu quả liên tục, tối ưu chi phí, kênh online: ưu tiên digital.'
      - 'Kết hợp (mixed methods): digital cho ''cái gì'', truyền thống/định tính cho ''tại sao''.'
      how_to_read_results: Không phương pháp nào thắng tuyệt đối; kết quả đáng tin nhất khi hai nguồn độc lập cùng chỉ một hướng (triangulation).
      pitfalls:
      - Cho rằng dữ liệu lớn tự đúng; dữ liệu lớn có thể lệch hệ thống.
      - Cho rằng nghiên cứu truyền thống luôn tốn kém; SME có thể làm khảo sát nhỏ tại điểm bán với chi phí thấp.
      example: Chuỗi cà phê dùng Google Analytics đo lưu lượng đặt hàng online, nhưng phỏng vấn trực tiếp 10 khách quen để hiểu vì sao đơn tối ít.
  - id: "m07-frameworks-8"
    title: "Frameworks: m07_stated_vs_revealed — Sở thích tuyên bố và sở thích thực tế"
    tags: ["frameworks", "m07_stated_vs_revealed", "sở", "thích", "tuyên", "bố", "và", "thực", "tế"]
    text: |-
      id: m07_stated_vs_revealed
      name_vi: Sở thích tuyên bố và sở thích thực tế
      name_en: Stated vs Revealed Preference
      origin: 'Khái niệm revealed preference do nhà kinh tế Paul Samuelson đề xuất năm 1938 (kiến thức ngoài nguồn): suy ra sở thích từ lựa chọn thực tế. Ra đời vì lời nói về sở thích thường không khớp hành vi.'
      components:
      - 'Stated: lời nói, trả lời khảo sát, ý định mua.'
      - 'Revealed: hành vi quan sát được (đơn hàng, lượt xem, hóa đơn).'
      - 'Khoảng cách: do thiên lệch mong muốn xã hội (social desirability), hiểu biết sai về bản thân, ý định mua không biến thành hành động.'
      when_to_use: Mọi lúc dùng khảo sát để dự báo hành vi mua; khi dữ liệu khảo sát mâu thuẫn dữ liệu bán hàng.
      how_to_apply:
      - Ưu tiên dữ liệu hành vi (POS, analytics) khi có; dùng khảo sát để giải thích.
      - Đo ý định bằng hành vi nhỏ có chi phí (đặt cọc, đăng ký danh sách chờ, mua thử) thay vì chỉ hỏi 'có mua không'.
      - Hỏi về hành vi quá khứ cụ thể ('lần gần nhất bạn mua...') thay vì ý định tương lai.
      - Khi dùng ý định mua, chiết khấu mạnh (ví dụ chỉ phần nhỏ những người nói 'chắc chắn mua' thật sự mua; tỷ lệ phải đo theo ngành).
      how_to_read_results: Nếu khảo sát nói 70% muốn món healthy nhưng doanh số món healthy chỉ 8%, hãy tin doanh số và tìm lý do bằng phỏng vấn.
      pitfalls:
      - Dựa hoàn toàn vào ý định mua khi lập dự báo doanh thu.
      example: Khách nói thích tài liệu (documentary) nhưng dữ liệu xem cho thấy họ xem true crime nhiều hơn (case Netflix).
  - id: "m07-frameworks-9"
    title: "Frameworks: m07_netflix_system — Hệ thống nghiên cứu dữ liệu của Netflix"
    tags: ["frameworks", "m07_netflix_system", "hệ", "thống", "nghiên", "cứu", "dữ", "liệu", "của", "netflix"]
    text: |-
      id: m07_netflix_system
      name_vi: Hệ thống nghiên cứu dữ liệu của Netflix
      name_en: Netflix Data-Driven Research System
      origin: Netflix chuyển từ cho thuê DVD sang streaming rồi sản xuất nội dung gốc (House of Cards, 2013) và đặt dữ liệu ở trung tâm mọi quyết định để giảm rủi ro khi đầu tư lớn.
      components:
      - 'Behavioral data: theo dõi hành vi xem (xem gì, khi nào, dừng ở đâu, tua lại, bỏ giữa chừng) cho cá nhân hóa và gợi ý.'
      - 'A/B Testing: thử thumbnail, tiêu đề, tóm tắt, trailer; nguồn nêu 250+ thử nghiệm đồng thời (số liệu không kiểm chứng).'
      - 'Content Research: phân tích độ phổ biến thể loại, diễn viên, sentiment đánh giá để quyết định sản xuất.'
      - 'Market Research: khảo sát hài lòng, NPS, willingness-to-pay cho giá và vào thị trường mới.'
      - 'Predictive (ML): dự đoán show nào hit, khách nào sẽ rời bỏ (churn) để greenlight và retention.'
      when_to_use: Mô hình tham chiếu để thiết kế văn hóa nghiên cứu dựa trên dữ liệu hành vi liên tục.
      how_to_apply:
      - Thu thập dữ liệu hành vi sẵn có của mình (hóa đơn POS, lịch sử đơn, chat, lượt xem video).
      - Chạy thử nghiệm nhỏ liên tục (tiêu đề, ảnh, giá, ưu đãi) với quyết định theo ngưỡng định trước.
      - Kết hợp khảo sát (NPS, WTP) với hành vi để hiểu lý do.
      - Dùng dữ liệu để đặt cược có tính toán, không để thay thế tầm nhìn.
      how_to_read_results: Hành vi quan sát được đáng tin hơn lời nói; kết quả A/B chỉ tối ưu cải tiến nhỏ, đột phá cần tầm nhìn.
      pitfalls:
      - Dữ liệu bỏ lỡ khoảnh khắc văn hóa (không dự đoán được Squid Game viral toàn cầu).
      - Quá phụ thuộc dữ liệu dẫn tới hủy show niche chất lượng nhưng lượt xem thấp.
      - Lo ngại quyền riêng tư khi theo dõi hành vi chi tiết đến từng phút.
      - SME không có quy mô Netflix; bắt chước nguyên cấu trúc 250 test là phi thực tế.
      example: 'Phiên bản SME: quán phở theo dõi món bán chạy theo giờ trong POS, thử 2 mẫu menu trong 2 tuần và hỏi NPS bằng mã QR ở bàn.'
  - id: "m07-frameworks-10"
    title: "Frameworks: m07_ab_testing — A/B Testing (thử nghiệm đối chứng)"
    tags: ["frameworks", "m07_ab_testing", "testing", "thử", "nghiệm", "đối", "chứng"]
    text: |-
      id: m07_ab_testing
      name_vi: A/B Testing (thử nghiệm đối chứng)
      name_en: A/B Testing
      origin: Thiết kế thí nghiệm ngẫu nhiên có nhóm đối chứng của R. A. Fisher (thập niên 1920-30, nông nghiệp) được các công ty web ứng dụng từ đầu những năm 2000 vì thay đổi giao diện có thể thử rẻ trên hàng triệu người dùng. Dùng trong marketing vì là cách duy nhất tách tác động của một thay đổi khỏi nhiễu.
      components:
      - Biến thể A (đối chứng) và B (thử nghiệm), khác nhau ở một yếu tố.
      - Phân bổ ngẫu nhiên người dùng vào mỗi nhóm.
      - Chỉ số kết quả chính đặt trước (CTR, chuyển đổi, doanh thu/khách).
      - Cỡ mẫu và thời gian xác định trước.
      - Kiểm định ý nghĩa thống kê.
      when_to_use: Test thumbnail/tiêu đề/ảnh quảng cáo, giá, landing page, email subject, tính năng; khi có đủ lưu lượng.
      how_to_apply:
      - 'Phát biểu giả thuyết: ''đổi X thành Y sẽ tăng chỉ số Z ít nhất k điểm %''.'
      - Chọn chỉ số chính và hiệu ứng tối thiểu đáng quan tâm; tính cỡ mẫu bằng m07_ab_sample_size.
      - Chỉ đổi MỘT yếu tố; chia ngẫu nhiên; chạy đồng thời hai biến thể (không chạy A tuần này, B tuần sau).
      - Chạy tối thiểu một chu kỳ tuần, không dừng sớm.
      - Kiểm định bằng m07_two_prop_ztest; xem cả ý nghĩa thực tế (mức tăng doanh thu so với chi phí triển khai).
      - Ghi lại kết quả (kể cả thất bại) vào sổ thí nghiệm.
      how_to_read_results: Kết quả có ý nghĩa thống kê VÀ đủ lớn về kinh doanh mới triển khai; không có ý nghĩa thì giữ nguyên bản đối chứng, đừng kết luận B tệ hơn.
      pitfalls:
      - Đổi nhiều yếu tố cùng lúc nên không biết yếu tố nào gây ra khác biệt.
      - Dừng khi thấy B thắng (peeking), cỡ mẫu quá nhỏ, nhiều biến thể.
      - 'Hiệu ứng tân kỳ (novelty): biến thể mới được click nhiều lúc đầu rồi giảm.'
      - Chỉ tối ưu chi tiết nhỏ, bỏ qua câu hỏi chiến lược lớn.
      example: 'Netflix cho biết một thumbnail có thể đổi 20-30% lượt xem cùng một phim (số liệu không kiểm chứng, minh họa); insight: khuôn mặt biểu cảm mạnh hơn phong cảnh, dưới 3 người trong hình hơn nhiều người, villain hơn hero cho thể loại tội phạm.'
  - id: "m07-procedures-1"
    title: "Quy trình: m07_proc_design_survey — Thiết kế và triển khai khảo sát khách hàng định lượng từ đầu đến cuối"
    tags: ["quy", "trình", "m07_proc_design_survey", "thiết", "kế", "và", "triển", "khai", "khảo", "sát", "khách", "hàng"]
    text: |-
      id: m07_proc_design_survey
      name: Thiết kế và triển khai khảo sát khách hàng định lượng từ đầu đến cuối
      steps:
      - '1. Phát biểu quyết định: ''Chúng tôi cần biết ... để quyết định ...''. Viết sẵn ngưỡng hành động (nếu kết quả >= x% thì làm A, nếu không thì B).'
      - 2. Tìm dữ liệu thứ cấp và dữ liệu nội bộ (POS, CRM, GA, Google Trends, báo cáo ngành) để khoanh vùng; chỉ khảo sát cho phần chưa biết.
      - '3. Nếu chưa rõ lý do/động cơ: phỏng vấn sâu 10-15 người trước để lấy ngôn ngữ và giả thuyết.'
      - 4. Xác định quần thể mục tiêu và khung lấy mẫu (ví dụ người sống/làm việc trong bán kính 1 km, khách thành viên); chia phân khúc nếu cần.
      - '5. Tính cỡ mẫu: m07_sample_size_cochran (95%, e 5%, p 0.5 thì 385); nếu quần thể nhỏ dùng m07_sample_size_fpc; nếu cần phân tích riêng từng phân khúc thì tính cho từng phân khúc; chia cho tỷ lệ phản hồi (m07_invites_needed).'
      - '6. Soạn bảng hỏi: câu sàng lọc, câu chính (thái độ, hành vi gần nhất, mức giá chấp nhận, kênh biết đến, rào cản), câu nhân khẩu (cuối). Quy tắc: một ý mỗi câu, không dẫn dắt, thang đo nhất quán, tránh câu phủ định kép, thêm 1-2 câu mở.'
      - 7. Pilot với 5-10 người, sửa câu hiểu sai, đo thời gian làm bài (mục tiêu 3-7 phút).
      - '8. Thu thập: Google Forms/Typeform qua Zalo/Facebook/QR tại điểm bán; thêm ưu đãi nhỏ (voucher) để tăng phản hồi; theo dõi đa dạng nguồn để tránh mẫu lệch.'
      - '9. Làm sạch dữ liệu: loại trùng, trả lời vội, mâu thuẫn; tính tỷ lệ phản hồi thực.'
      - '10. Phân tích: thống kê mô tả, khoảng tin cậy (m07_margin_of_error), crosstab theo phân khúc, so sánh nhóm (m07_two_prop_ztest), NPS (m07_nps) nếu có; tóm tắt câu mở theo chủ đề.'
      - '11. Báo cáo: kết luận trước, bằng chứng, n và sai số, hạn chế, khuyến nghị gắn với ngưỡng hành động ở bước 1.'
      - 12. Hành động và đo kết quả thực (so khảo sát với doanh số thực để hiệu chỉnh stated vs revealed cho lần sau).
      outputs: 'Báo cáo khảo sát 1-2 trang: quyết định, phương pháp, mẫu, kết quả chính kèm khoảng tin cậy, hạn chế, khuyến nghị và kế hoạch hành động.'
  - id: "m07-procedures-2"
    title: "Quy trình: m07_proc_choose_method — Chọn phương pháp nghiên cứu theo ngân sách và câu hỏi"
    tags: ["quy", "trình", "m07_proc_choose_method", "chọn", "phương", "pháp", "nghiên", "cứu", "theo", "ngân", "sách", "và"]
    text: |-
      id: m07_proc_choose_method
      name_vi: Chọn phương pháp nghiên cứu theo ngân sách và câu hỏi
      name: Chọn loại nghiên cứu và phương pháp
      steps:
      - 1. Viết câu hỏi nghiên cứu dạng 'cái gì / bao nhiêu / tại sao / nếu thay đổi thì sao'.
      - '2. Ánh xạ: không rõ vấn đề hoặc ''tại sao'' thì Exploratory (định tính); ''cái gì/bao nhiêu'' thì Descriptive (survey, thứ cấp, panel); ''nếu thay đổi X thì'' thì Causal (experiment).'
      - 3. Kiểm tra dữ liệu thứ cấp và nội bộ có trả lời được không; nếu có thì dừng, không cần sơ cấp.
      - '4. Chọn kênh: khách online có lưu lượng thì digital (A/B, analytics); khách offline hoặc cần chiều sâu thì phỏng vấn/quan sát tại điểm bán.'
      - '5. Kiểm tra ràng buộc: ngân sách, thời gian ra quyết định, lưu lượng cho A/B (m07_ab_sample_size); nếu không đủ lưu lượng thì chuyển sang định tính hoặc test hiệu ứng lớn.'
      - '6. Quyết định mixed methods: định tính trước, định lượng sau, hành vi đối chiếu.'
      outputs: 'Một bản thiết kế nghiên cứu 1 trang: câu hỏi, loại nghiên cứu, phương pháp, mẫu, chi phí, thời gian, ngưỡng hành động.'
  - id: "m07-procedures-3"
    title: "Quy trình: m07_proc_run_ab_test — Chạy một A/B test đúng cách"
    tags: ["quy", "trình", "m07_proc_run_ab_test", "chạy", "một", "test", "đúng", "cách"]
    text: |-
      id: m07_proc_run_ab_test
      name: Chạy một A/B test đúng cách
      steps:
      - 1. Giả thuyết và chỉ số chính (ví dụ CTR quảng cáo, tỷ lệ đặt hàng landing page).
      - 2. Lấy p1 hiện tại từ analytics; chọn p2 tối thiểu đáng làm; tính n mỗi nhóm bằng m07_ab_sample_size.
      - 3. Ước thời gian = 2n / lưu lượng mỗi ngày; nếu quá dài (vài tháng) thì tăng hiệu ứng, đổi chỉ số, hoặc dùng định tính.
      - 4. Thiết lập chia ngẫu nhiên 50/50, chạy đồng thời, khoá các yếu tố khác (không đổi khuyến mãi giữa chừng).
      - 5. Không dừng sớm; chạy trọn số ngày đã định (bội số 7).
      - 6. Tính CTR/CR hai nhóm, m07_two_prop_ztest, khoảng tin cậy chênh lệch.
      - '7. Quyết định: có ý nghĩa và đủ lớn thì triển khai; không có ý nghĩa thì giữ A; hai trường hợp đều ghi vào sổ thí nghiệm.'
      outputs: Quyết định triển khai/giữ nguyên, kèm số liệu, ghi bài học và giả thuyết tiếp theo.
  - id: "m07-procedures-4"
    title: "Quy trình: m07_proc_nps_program — Triển khai chương trình đo NPS và vòng phản hồi"
    tags: ["quy", "trình", "m07_proc_nps_program", "triển", "khai", "chương", "đo", "nps", "và", "vòng", "phản", "hồi"]
    text: |-
      id: m07_proc_nps_program
      name: Triển khai chương trình đo NPS và vòng phản hồi
      steps:
      - 1. Hỏi 'Bạn sẵn lòng giới thiệu [tên] cho bạn bè (0-10)?' và 1 câu mở 'Vì sao bạn chấm vậy?' qua QR trên hóa đơn/Zalo OA sau mua.
      - 2. Thu tối thiểu 100 phản hồi mỗi kỳ (tháng/quý) cho mỗi điểm bán để tránh dao động quá lớn.
      - 3. Tính NPS bằng m07_nps; phân tích theo chi nhánh, nhóm khách, kênh.
      - 4. Mã hóa câu mở của Detractors thành 3-5 chủ đề chính; xếp hạng theo tần suất.
      - 5. Liên hệ lại Detractors trong 48 giờ để xử lý; mời Promoters chia sẻ/giới thiệu.
      - 6. Chọn 1-2 cải tiến, đo lại NPS kỳ sau và so với doanh thu lặp lại.
      outputs: Dashboard NPS theo kỳ, danh sách chủ đề phàn nàn ưu tiên, kế hoạch cải tiến.
  - id: "m07-procedures-5"
    title: "Quy trình: m07_proc_digital_stack — Dựng bộ nghiên cứu số tối thiểu cho SME"
    tags: ["quy", "trình", "m07_proc_digital_stack", "dựng", "bộ", "nghiên", "cứu", "số", "tối", "thiểu", "cho", "sme"]
    text: |-
      id: m07_proc_digital_stack
      name: Dựng bộ nghiên cứu số tối thiểu cho SME
      steps:
      - 1. Cài Google Analytics 4 và Meta Pixel (hoặc TikTok Pixel) lên website/landing page; đặt các sự kiện chuyển đổi chính.
      - 2. Dùng Google Trends kiểm tra xu hướng và mùa vụ của ngành/từ khóa.
      - 3. Dùng Meta Audience Insights/Ads Manager để hiểu nhân khẩu học tệp khách.
      - 4. Cài Microsoft Clarity (miễn phí) để xem heatmap và ghi phiên.
      - 5. Dùng Google Forms/Typeform cho khảo sát ngắn; Zalo OA để gửi.
      - 6. Đặt lịch xem số liệu hàng tuần (30 phút) và một thử nghiệm mỗi tháng.
      outputs: Hệ thống đo lường chạy tự động và nhịp nghiên cứu liên tục.
  - id: "m07-decision_rules-1"
    title: "Quy tắc quyết định: Nếu chưa rõ vấn đề hoặc cần hiểu lý do thì làm nghiên cứu khám phá định tính (phỏng vấn sâu 10-30, …"
    tags: ["quy", "tắc", "quyết", "định", "nếu", "chưa", "rõ", "vấn", "đề", "hoặc", "cần", "hiểu"]
    text: |-
      Nếu chưa rõ vấn đề hoặc cần hiểu lý do thì làm nghiên cứu khám phá định tính (phỏng vấn sâu 10-30, focus group 2-5 nhóm) trước khi khảo sát số lớn.
  - id: "m07-decision_rules-2"
    title: "Quy tắc quyết định: Nếu cần con số suy rộng (tỷ lệ, quy mô) thì làm khảo sát/ dữ liệu mô tả với cỡ mẫu tính theo sai số…"
    tags: ["quy", "tắc", "quyết", "định", "nếu", "cần", "con", "số", "suy", "rộng", "tỷ", "lệ"]
    text: |-
      Nếu cần con số suy rộng (tỷ lệ, quy mô) thì làm khảo sát/ dữ liệu mô tả với cỡ mẫu tính theo sai số; mặc định 385 cho 95% tin cậy, sai số 5%.
  - id: "m07-decision_rules-3"
    title: "Quy tắc quyết định: Nếu cần chứng minh một thay đổi có tác dụng thì làm thí nghiệm ngẫu nhiên (A/B test), không dựa trê…"
    tags: ["quy", "tắc", "quyết", "định", "nếu", "cần", "chứng", "minh", "một", "thay", "đổi", "có"]
    text: |-
      Nếu cần chứng minh một thay đổi có tác dụng thì làm thí nghiệm ngẫu nhiên (A/B test), không dựa trên khảo sát hay so sánh trước-sau.
  - id: "m07-decision_rules-4"
    title: "Quy tắc quyết định: Nếu dữ liệu thứ cấp hoặc nội bộ đã trả lời được câu hỏi thì không thu dữ liệu sơ cấp."
    tags: ["quy", "tắc", "quyết", "định", "nếu", "dữ", "liệu", "thứ", "cấp", "hoặc", "nội", "bộ"]
    text: |-
      Nếu dữ liệu thứ cấp hoặc nội bộ đã trả lời được câu hỏi thì không thu dữ liệu sơ cấp.
  - id: "m07-decision_rules-5"
    title: "Quy tắc quyết định: Nếu lời khách nói (stated) mâu thuẫn hành vi (revealed) thì tin hành vi và dùng định tính để tìm lý…"
    tags: ["quy", "tắc", "quyết", "định", "nếu", "lời", "khách", "nói", "stated", "mâu", "thuẫn", "hành"]
    text: |-
      Nếu lời khách nói (stated) mâu thuẫn hành vi (revealed) thì tin hành vi và dùng định tính để tìm lý do.
  - id: "m07-decision_rules-6"
    title: "Quy tắc quyết định: Nếu quần thể dưới vài nghìn và n0 lớn hơn khoảng 5% N thì áp dụng hiệu chỉnh quần thể hữu hạn."
    tags: ["quy", "tắc", "quyết", "định", "nếu", "quần", "thể", "dưới", "vài", "nghìn", "và", "n0"]
    text: |-
      Nếu quần thể dưới vài nghìn và n0 lớn hơn khoảng 5% N thì áp dụng hiệu chỉnh quần thể hữu hạn.
  - id: "m07-decision_rules-7"
    title: "Quy tắc quyết định: Nếu quyết định ít rủi ro, dễ đảo ngược (đổi tiêu đề quảng cáo) thì chấp nhận sai số lớn hơn (10%) v…"
    tags: ["quy", "tắc", "quyết", "định", "nếu", "ít", "rủi", "ro", "dễ", "đảo", "ngược", "đổi"]
    text: |-
      Nếu quyết định ít rủi ro, dễ đảo ngược (đổi tiêu đề quảng cáo) thì chấp nhận sai số lớn hơn (10%) và nghiên cứu nhanh; nếu tốn kém và khó đảo ngược (mở chi nhánh, thuê mặt bằng 3 năm) thì đầu tư nghiên cứu kỹ.
  - id: "m07-decision_rules-8"
    title: "Quy tắc quyết định: Nếu lưu lượng không đủ cho A/B test (cỡ mẫu tính ra cần vượt thời gian chấp nhận được) thì thử hiệu…"
    tags: ["quy", "tắc", "quyết", "định", "nếu", "lưu", "lượng", "không", "đủ", "cho", "test", "cỡ"]
    text: |-
      Nếu lưu lượng không đủ cho A/B test (cỡ mẫu tính ra cần vượt thời gian chấp nhận được) thì thử hiệu ứng lớn hơn, kéo dài thời gian, hoặc chuyển sang định tính.
  - id: "m07-decision_rules-9"
    title: "Quy tắc quyết định: Nếu p-value A/B lớn hơn 0.05 thì không kết luận B hơn A; chạy thêm hoặc giữ A."
    tags: ["quy", "tắc", "quyết", "định", "nếu", "value", "lớn", "hơn", "05", "thì", "không", "kết"]
    text: |-
      Nếu p-value A/B lớn hơn 0.05 thì không kết luận B hơn A; chạy thêm hoặc giữ A.
  - id: "m07-decision_rules-10"
    title: "Quy tắc quyết định: Nếu A/B có ý nghĩa nhưng mức tăng doanh thu nhỏ hơn chi phí triển khai thì không triển khai."
    tags: ["quy", "tắc", "quyết", "định", "nếu", "có", "nghĩa", "nhưng", "mức", "tăng", "doanh", "thu"]
    text: |-
