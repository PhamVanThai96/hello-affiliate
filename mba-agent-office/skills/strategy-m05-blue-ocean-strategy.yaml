    text: |-
      F&B: hỏi 'khách đến quán vì nhu cầu nào ngoài uống/ăn?' (làm việc, hoài niệm, họp mặt gia đình); nhiều quán đỏ vì cùng đua menu và decor. Ví dụ ý tưởng xanh: cà phê làm việc có ổ cắm/yên tĩnh, thực đơn rút gọn, giá minh bạch.
  - id: "m05-sme_vn_guidance-5"
    title: "Lưu ý SME Việt Nam: Cộng Cà Phê (bài học trong nguồn): không đua 'cà phê ngon nhất' mà cạnh tranh bằng trải nghiệm hoài…"
