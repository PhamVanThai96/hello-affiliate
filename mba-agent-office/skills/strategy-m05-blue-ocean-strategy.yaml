    text: |-
      q: Ba tầng non-customers gồm 500x25%, 2,000x6%, 10,000x1%. Tính Q.
      a: 125 + 120 + 100 = 345.
  - id: "m05-practice_questions-7"
    title: "Câu hỏi luyện tập: Fixed 40 triệu, giá 150,000, biến phí 30%. BE?"
    tags: ["câu", "hỏi", "luyện", "tập", "fixed", "40", "triệu", "giá", "150", "000", "biến", "phí"]
    text: |-
      q: Fixed 40 triệu, giá 150,000, biến phí 30%. BE?
      a: Đóng góp 105,000; 40,000,000/105,000 = 380.95 -> 381.
  - id: "m05-practice_questions-8"
    title: "Câu hỏi luyện tập: Vì sao 'Planet Fitness' thành công với tầng 2 và 3?"
    tags: ["câu", "hỏi", "luyện", "tập", "vì", "sao", "planet", "fitness", "thành", "công", "với", "tầng"]
    text: |-
      q: Vì sao 'Planet Fitness' thành công với tầng 2 và 3?
      a: Bỏ đúng điều họ sợ (tạ nặng, gương, văn hóa gym bro), tạo cảm giác không bị đánh giá, giá 10 USD; giải điểm đau chung xuyên tầng.
  - id: "m05-practice_questions-9"
    title: "Câu hỏi luyện tập: Nêu 4 cổng BOS Sequence và thứ tự."
    tags: ["câu", "hỏi", "luyện", "tập", "nêu", "cổng", "bos", "sequence", "và", "thứ", "tự"]
    text: |-
      q: Nêu 4 cổng BOS Sequence và thứ tự.
      a: Buyer Utility -> Price -> Cost -> Adoption. Trượt cổng nào thì quay lại cổng đó.
  - id: "m05-practice_questions-10"
    title: "Câu hỏi luyện tập: McDonald's sau khi thành công không đi tiếp đại dương xanh. Vì sao?"
    tags: ["câu", "hỏi", "luyện", "tập", "mcdonald", "sau", "khi", "thành", "công", "không", "đi", "tiếp"]
    text: |-
      q: McDonald's sau khi thành công không đi tiếp đại dương xanh. Vì sao?
      a: Quy mô và định vị gắn với tốc độ, quen thuộc; chuyển mô hình phá lợi thế quy mô và khách trung thành; họ chọn thống trị đỏ và nhuộm xanh cục bộ (McLocal).
  - id: "m05-practice_questions-11"
    title: "Câu hỏi luyện tập: Nêu 2 hạn chế của BOS mà agent phải nói với chủ SME."
    tags: ["câu", "hỏi", "luyện", "tập", "nêu", "hạn", "chế", "của", "bos", "mà", "agent", "phải"]
    text: |-
      q: Nêu 2 hạn chế của BOS mà agent phải nói với chủ SME.
      a: Survivorship bias và rủi ro cầu không chắc chắn; BOS yếu về thực thi; xanh sẽ bị sao chép.
