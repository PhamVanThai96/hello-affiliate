  - id: "m05-case_lessons-1"
    title: "Bài học case: Cirque du Soleil - đại dương xanh kinh điển"
    tags: ["bài", "học", "case", "cirque", "du", "soleil", "đại", "dương", "xanh", "kinh", "điển"]
    text: |-
      name: Cirque du Soleil - đại dương xanh kinh điển
      type: success
      setup: |
        Xiếc truyền thống thập niên 1980 suy tàn (Ringling lỗ, phản đối quyền động vật, TV và game cạnh tranh, khách trẻ em giảm). ERRC của Cirque - Eliminate: ngôi sao, thú vật, bán hàng lưu niệm, 3 sân khấu cùng lúc; Reduce: hài hước, hồi hộp nguy hiểm; Raise: không gian độc đáo, yếu tố nghệ thuật; Create: chủ đề/câu chuyện, nhạc sống, nhiều show, môi trường tinh tế, giá vé tương đương kịch.
      key_calculations:
      - Giá vé 100-300 USD so với 10-30 USD của xiếc truyền thống (nguồn), khoảng 10 lần.
      - Doanh thu trên 1 tỷ USD/năm trước COVID; hơn 150 triệu khán giả ở hơn 450 thành phố (số liệu nguồn).
      - 'Khán giả mới: người lớn, cặp đôi, doanh nghiệp, không phụ thuộc trẻ em và gia đình.'
      lesson: Khác biệt không phải làm xiếc tốt hơn mà ghép xiếc + nhà hát, bỏ chi phí lớn (ngôi sao, thú) và nâng yếu tố khách trả tiền. Nhắm vào non-customers người lớn.
      data_reliability: unverified
  - id: "m05-case_lessons-2"
    title: "Bài học case: Nintendo Wii - non-customers và giới hạn của BOS"
    tags: ["bài", "học", "case", "nintendo", "wii", "non", "customers", "và", "giới", "hạn", "của", "bos"]
    text: |-
      name: Nintendo Wii - non-customers và giới hạn của BOS
      type: success
      setup: |
        2006: PS3 và Xbox 360 đua cấu hình cho hardcore gamer, giá 399-599 USD; Wii giá 249 USD, motion control, game đơn giản, chơi gia đình.
      key_calculations:
      - Wii bán khoảng 101 triệu máy so với PS3 khoảng 87M, Xbox 360 khoảng 84M (số liệu nguồn).
      - 'Giá Wii 249 so với 399 đến 599 USD: thấp hơn khoảng 38% đến 58% (249/399 = 0.624 và 249/599 = 0.416).'
      - Sony từng lỗ khoảng 240 USD mỗi máy PS3 năm đầu (ước tính trong nguồn, cần kiểm chứng).
      lesson: 'Nhắm ông bà, mẹ, người không chơi game; giảm cấu hình để giảm chi phí và có biên tốt. Wii U (2012) thất bại: BOS không bảo đảm dài hạn; Nintendo phải tìm xanh mới (Switch 2017).'
      data_reliability: illustrative
  - id: "m05-case_lessons-3"
    title: "Bài học case: VinFast VF e34 tại Việt Nam - xanh ở VN, đỏ ở Mỹ/EU"
    tags: ["bài", "học", "case", "vinfast", "vf", "e34", "tại", "việt", "nam", "xanh", "vn", "đỏ"]
    text: |-
      name: VinFast VF e34 tại Việt Nam - xanh ở VN, đỏ ở Mỹ/EU
      type: success
      setup: |
        2021: thị trường ô tô điện VN gần như chưa có; mô hình thuê pin, hệ sinh thái VinFast + Vinhomes, app dịch vụ. Ở Mỹ/EU đối đầu Tesla, BYD.
      key_calculations:
      - 'Mức chi phí: giảm giá mua nhờ thuê pin (chuyển CAPEX thành thuê bao).'
      - Số trạm sạc trong nguồn gốc là 'hàng nghìn' (số cụ thể cần xác nhận).
      lesson: Đánh giá BOS theo từng thị trường; chưa rõ xanh thực sự hay chỉ là first mover trong đỏ tương lai. Rào cản cổng Adoption (hạ tầng sạc, thói quen) là then chốt.
      data_reliability: unverified
  - id: "m05-case_lessons-4"
    title: "Bài học case: McDonald's - từ xanh sang thống trị đỏ"
    tags: ["bài", "học", "case", "mcdonald", "từ", "xanh", "sang", "thống", "trị", "đỏ"]
    text: |-
      name: McDonald's - từ xanh sang thống trị đỏ
      type: success
      setup: |
        1948 anh em McDonald: bỏ phục vụ tại bàn và dụng cụ sứ, giảm thực đơn khoảng 25 xuống 9 món, tốc độ phục vụ từ khoảng 20 phút xuống khoảng 30 giây (số liệu nguồn). Sau này đạt thống trị nhờ bất động sản, chuẩn hóa, chuỗi cung ứng.
      key_calculations:
      - Thực đơn giảm (25 - 9)/25 = 64%.
      - Thời gian phục vụ giảm từ 20 phút xuống 0.5 phút (giảm khoảng 97.5%), số liệu nguồn.
      lesson: Đại dương xanh trở thành đỏ khi bị sao chép; doanh nghiệp có thể bảo vệ bằng hệ thống (bất động sản, chuẩn hóa, chuỗi cung ứng) và nhuộm xanh từng phần (McLocal).
      data_reliability: unverified
  - id: "m05-case_lessons-5"
    title: "Bài học case: Planet Fitness - nhắm tầng 2 và 3 non-customers"
    tags: ["bài", "học", "case", "planet", "fitness", "nhắm", "tầng", "và", "non", "customers"]
    text: |-
      name: Planet Fitness - nhắm tầng 2 và 3 non-customers
      type: success
      setup: |
        Nhắm người ngại phòng gym truyền thống. Eliminate: tạ nặng, gương toàn thân, văn hóa 'gym bro'; Reduce: thiết bị chuyên nghiệp; Raise: không gian thoải mái, 'Judgement Free Zone'; Create: Pizza Monday, Tootsie Roll Tuesday, hội viên 10 USD/tháng.
      key_calculations:
      - Nguồn nêu 18 triệu hội viên, lớn nhất Mỹ; số liệu thực tế có thể khác theo năm.
      - 'Doanh thu hội viên tối thiểu theo nguồn: 18 triệu x 10 USD x 12 = 2.16 tỷ USD/năm (ước tính tối thiểu, bỏ qua gói cao cấp).'
      lesson: 'Chiến lược xanh không cần công nghệ: chỉ cần hiểu vì sao người không tập gym không mua, rồi bỏ đúng thứ họ sợ.'
      data_reliability: unverified
  - id: "m05-case_lessons-6"
    title: "Bài học case: Cộng Cà Phê và quán cà phê trải nghiệm"
    tags: ["bài", "học", "case", "cộng", "cà", "phê", "và", "quán", "trải", "nghiệm"]
    text: |-
      name: Cộng Cà Phê và quán cà phê trải nghiệm
      type: success
      setup: Không cạnh tranh 'cà phê ngon nhất' mà cạnh tranh trải nghiệm hoài niệm (không gian, kỷ niệm); khách ít so giá với quán cóc.
      key_calculations:
      - Không có số liệu định lượng trong nguồn; đây là bài học định tính.
      lesson: Đổi trục cạnh tranh sang cảm xúc làm giảm áp lực giá; nhưng cần kiểm tra chi phí đầu tư không gian có được bù bằng giá/lượng khách không.
      data_reliability: illustrative
  - id: "m05-case_lessons-7"
    title: "Bài học case: Quán cà phê làm việc cho dân tech (SME giả định, Tây Bắc Đà Nẵng)"
    tags: ["bài", "học", "case", "quán", "cà", "phê", "làm", "việc", "cho", "dân", "tech", "sme"]
    text: |-
      name: Quán cà phê làm việc cho dân tech (SME giả định, Tây Bắc Đà Nẵng)
      type: sme
      setup: |
        Khu đô thị mới, dân kỹ thuật trẻ. Quán cà phê trung bình: menu dài, decor đẹp, wifi tạm, ồn. Ý tưởng: cà phê làm việc yên tĩnh có bàn đứng, màn hình rời, cabin nghỉ, gói thành viên.
      key_calculations:
      - 'Canvas 10 yếu tố: quán trung bình [3,4,4,4,3,2,1,1,3,1] và quán mới [2,3,1,2,5,5,5,4,1,4].'
      - Chênh tuyệt đối tổng 24, D = 24/10 = 2.4 (phân kỳ rõ).
      - 'Pearson r = -0.66: hình dạng đảo ngược.'
      - 'Tầng 1+2+3 giả định: 240 + 240 + 180 = 660 khách tiềm năng.'
      lesson: Bỏ menu rộng, decor và phục vụ bàn (E/R); nâng wifi/ổ cắm, yên tĩnh, bàn đứng; tạo cabin và thành viên. Cần kiểm chứng giả định bằng pre-order gói thành viên trước khi thuê mặt bằng.
      data_reliability: illustrative
  - id: "m05-case_lessons-8"
    title: "Bài học case: Tiệm giặt tự phục vụ 24/7 (SME giả định, Hà Nội)"
    tags: ["bài", "học", "case", "tiệm", "giặt", "tự", "phục", "vụ", "24", "sme", "giả", "định"]
    text: |-
      name: Tiệm giặt tự phục vụ 24/7 (SME giả định, Hà Nội)
      type: sme
      setup: 'Tiệm giặt ủi truyền thống tính theo kg, đóng cửa tối, nhân viên giặt tay. Ý tưởng: giặt tự phục vụ 24/7 thanh toán QR cho dân chung cư/nhà trọ.'
      key_calculations:
      - C_target = 22,000 - 22,000 x 0.18 = 18,040 VND/kg.
      - 'Phiên bản 1: 21,000 - 3,500 - 1,200 + 1,300 + 700 + 400 = 18,700 > 18,040: trượt cổng Cost.'
      - 'Phiên bản 2: thêm Reduce 800 (rút gọn dịch vụ ủi), được 17,900 <= 18,040: qua.'
      lesson: Giá chiến lược quyết định chi phí cho phép; trượt cổng Cost phải quay lại ERRC chứ không tăng giá.
      data_reliability: illustrative
  - id: "m05-worked_examples-1"
    title: "Ví dụ có lời giải: m05_ex_cafe_work — Quán cà phê làm việc (Đà Nẵng): canvas, ERRC, D và r"
    tags: ["ví", "dụ", "có", "lời", "giải", "m05_ex_cafe_work", "quán", "cà", "phê", "làm", "việc", "đà"]
    text: |-
      id: m05_ex_cafe_work
      title: 'Quán cà phê làm việc (Đà Nẵng): canvas, ERRC, D và r'
      inputs:
        factors:
        - Giá
        - Hương vị
        - Menu đa dạng
        - Decor/check-in
        - Wifi/ổ cắm
        - Yên tĩnh
        - Bàn đứng/màn hình
        - Cabin nghỉ
        - Phục vụ bàn
        - Gói thành viên
        competitor_avg:
        - 3
        - 4
        - 4
        - 4
        - 3
        - 2
        - 1
        - 1
        - 3
        - 1
        new_curve:
        - 2
        - 3
        - 1
        - 2
        - 5
        - 5
        - 5
        - 4
        - 1
        - 4
      steps:
      - 'ERRC - Eliminate: phục vụ bàn (điểm 1), menu rộng (còn 8 món); Reduce: decor check-in (4->2), hương vị đặc sản (4->3, đủ tốt không cần đỉnh); Raise: wifi/ổ cắm 3->5, yên tĩnh 2->5; Create: bàn đứng/màn hình rời, cabin nghỉ 15 phút, gói thành viên 24/7.'
      - D = (|2-3|+|3-4|+|1-4|+|2-4|+|5-3|+|5-2|+|5-1|+|4-1|+|1-3|+|4-1|)/10 = (1+1+3+2+2+3+4+3+2+3)/10 = 2.4.
      - 'r = -0.66 (đảo cấu trúc: yếu tố ngành mạnh thì mình yếu và ngược lại).'
      - 'Focus: 5 yếu tố bị hạ hoặc giữ thấp (giá, hương vị, menu, decor, phục vụ bàn) - đạt; Tagline: ''Quán cà phê làm việc yên tĩnh cho người kỹ thuật''.'
      - 'Q (giả định): tầng 1 800 x 0.30 = 240; tầng 2 3,000 x 0.08 = 240; tầng 3 12,000 x 0.015 = 180; Q = 660.'
      - 'BE (F = 60 triệu/tháng, p = 199,000 gói tháng, v = 25%): 60,000,000/(199,000 x 0.75) = 402.01 -> 403; Q/BE = 660/403 = 1.64.'
      - 'Lợi nhuận tháng dự kiến ở Q: 660 x 149,250 - 60,000,000 = 38,505,000 VND (cần xác nhận).'
      result: 'D 2.4, r -0.66, Q/BE 1.64: qua kiểm tra sơ bộ; việc tiếp theo là pre-order 150 gói thành viên trước khi ký thuê.'
  - id: "m05-worked_examples-2"
    title: "Ví dụ có lời giải: m05_ex_laundry_cost — Tiệm giặt tự phục vụ: target costing và ERRC"
    tags: ["ví", "dụ", "có", "lời", "giải", "m05_ex_laundry_cost", "tiệm", "giặt", "tự", "phục", "vụ", "target"]
    text: |-
      id: m05_ex_laundry_cost
      title: 'Tiệm giặt tự phục vụ: target costing và ERRC'
      inputs:
        price_strategic: 22000
        target_margin: 0.18
        cost_base: 21000
      steps:
      - C_target = 22,000 x (1 - 0.18) = 18,040.
      - 'Phiên bản 1 ERRC: Eliminate nhân viên giặt tay -3,500; Reduce diện tích/trang trí -1,200; Raise máy công nghiệp +1,300; Create app/QR +700; Create camera an ninh 24/7 +400.'
      - 'C_new1 = 21,000 - 3,500 - 1,200 + 1,300 + 700 + 400 = 18,700 > 18,040: trượt (vượt 660).'
      - 'Phiên bản 2: Reduce dịch vụ ủi/gấp -800 (chuyển thành add-on), C_new2 = 17,900 <= 18,040.'
      - Biên thực = (22,000 - 17,900)/22,000 = 18.6%.
      result: 'Phiên bản 2 qua cổng Cost với biên 18.6%; kết luận: bỏ ủi/gấp khỏi gói chuẩn, bán add-on.'
  - id: "m05-worked_examples-3"
    title: "Ví dụ có lời giải: m05_ex_gym_noncustomers — Phòng tập 'không phán xét': 3 tầng non-customers và hòa vốn"
    tags: ["ví", "dụ", "có", "lời", "giải", "m05_ex_gym_noncustomers", "phòng", "tập", "không", "phán", "xét", "tầng"]
    text: |-
      id: m05_ex_gym_noncustomers
      title: 'Phòng tập ''không phán xét'': 3 tầng non-customers và hòa vốn'
      inputs:
        tiers:
        - - 800
          - 0.3
        - - 3000
          - 0.08
        - - 12000
          - 0.015
        price: 199000
        fixed_cost: 60000000
        variable_ratio: 0.25
      steps:
      - 'Tầng 1 sắp bỏ tập: 800 x 0.30 = 240.'
      - 'Tầng 2 từ chối vì ngại bị đánh giá/giá: 3,000 x 0.08 = 240.'
      - 'Tầng 3 chưa nghĩ đến: 12,000 x 0.015 = 180.'
      - Q = 660 thành viên; doanh thu tháng = 660 x 199,000 = 131,340,000 VND.
      - BE = 60,000,000/(199,000 x 0.75) = 402.01 -> 403; biên an toàn = (660 - 403)/660 = 38.9%.
      result: Khả thi nếu giả định tỷ lệ chuyển đổi đạt; nếu tầng 3 chỉ đạt 0.5% (60 người) thì Q = 540, Q/BE = 1.34, vẫn qua ngưỡng 1.3.
  - id: "m05-worked_examples-4"
    title: "Ví dụ có lời giải: m05_ex_buyer_utility — Buyer Utility Map cho dịch vụ giặt ủi"
    tags: ["ví", "dụ", "có", "lời", "giải", "m05_ex_buyer_utility", "buyer", "utility", "map", "cho", "dịch", "vụ"]
    text: |-
      id: m05_ex_buyer_utility
      title: Buyer Utility Map cho dịch vụ giặt ủi
      inputs:
        cells_served: 14
      steps:
      - Ma trận 6x6 = 36 ô; đối thủ phục vụ tốt 14 ô (chủ yếu Sử dụng x Đơn giản, Mua sắm x Tiện lợi).
      - Ô trống = 36 - 14 = 22; B = 22/36 = 0.611.
      - 'Ô trống chọn: Sử dụng x Tiện lợi (24/7), Giao hàng x Năng suất (đặt qua app), Bảo trì x Giảm rủi ro (không hỏng đồ).'
      result: 'B = 0.61: ngành còn nhiều khoảng trống; ưu tiên 3 ô trên vào mục Raise/Create.'
  - id: "m05-practice_questions-1"
    title: "Câu hỏi luyện tập: Phân biệt đại dương đỏ và xanh theo 3 tiêu chí, và nêu vì sao BOS nói 'phá trade-off giá trị-chi ph…"
    tags: ["câu", "hỏi", "luyện", "tập", "phân", "biệt", "đại", "dương", "đỏ", "và", "xanh", "theo"]
    text: |-
      q: Phân biệt đại dương đỏ và xanh theo 3 tiêu chí, và nêu vì sao BOS nói 'phá trade-off giá trị-chi phí'.
      a: Cạnh tranh (đánh bại đối thủ vs làm cạnh tranh vô nghĩa), nhu cầu (khai thác hiện tại vs tạo mới), giá trị-chi phí (chọn một vs cả hai). BOS giảm chi phí qua Eliminate/Reduce và tăng giá trị qua Raise/Create nên cả hai cùng đạt.
  - id: "m05-practice_questions-2"
    title: "Câu hỏi luyện tập: Quán phở của bạn có đường cong giá trị [4,4,3,3,2] và đối thủ [4,4,3,3,2]. Đánh giá?"
    tags: ["câu", "hỏi", "luyện", "tập", "quán", "phở", "của", "bạn", "có", "đường", "cong", "giá"]
    text: |-
      q: Quán phở của bạn có đường cong giá trị [4,4,3,3,2] và đối thủ [4,4,3,3,2]. Đánh giá?
      a: 'D = 0, r = +1: giống hệt, me-too, đại dương đỏ; cần ERRC và Six Paths.'
  - id: "m05-practice_questions-3"
    title: "Câu hỏi luyện tập: ERRC của một ý tưởng có Eliminate và Reduce rỗng, Raise/Create 6 mục. Kết luận?"
    tags: ["câu", "hỏi", "luyện", "tập", "errc", "của", "một", "tưởng", "có", "eliminate", "và", "reduce"]
    text: |-
      q: ERRC của một ý tưởng có Eliminate và Reduce rỗng, Raise/Create 6 mục. Kết luận?
      a: Khác biệt hóa thêm chi phí, chưa phải BOS; cần tìm yếu tố bỏ/giảm để C_new <= C_target.
  - id: "m05-practice_questions-4"
    title: "Câu hỏi luyện tập: Tính C_target nếu giá chiến lược 45,000 và biên mục tiêu 20%."
    tags: ["câu", "hỏi", "luyện", "tập", "tính", "c_target", "nếu", "giá", "chiến", "lược", "45", "000"]
    text: |-
      q: Tính C_target nếu giá chiến lược 45,000 và biên mục tiêu 20%.
      a: 45,000 x 0.8 = 36,000 VND.
  - id: "m05-practice_questions-5"
    title: "Câu hỏi luyện tập: Cho cost_base 21,000, tiết kiệm E 3,000, R 1,500, Raise +1,000, Create +1,500, C_target 18,000. Qua…"
    tags: ["câu", "hỏi", "luyện", "tập", "cho", "cost_base", "21", "000", "tiết", "kiệm", "500", "raise"]
    text: |-
      q: Cho cost_base 21,000, tiết kiệm E 3,000, R 1,500, Raise +1,000, Create +1,500, C_target 18,000. Qua cổng Cost không?
      a: 'C_new = 21,000 - 3,000 - 1,500 + 1,000 + 1,500 = 19,000 > 18,000: trượt; cần cắt thêm >= 1,000 hoặc đổi mô hình.'
