when: ["dai duong xanh", "blue ocean", "dai duong do", "strategy canvas", "errc", "four actions", "tao thi truong moi", "doi moi gia tri", "value innovation", "khong co doi thu", "pha vo nganh", "loai bo giam thieu gia tang tao moi", "chien luoc dai duong xanh", "blue ocean strategy"]
