  - id: "m05-excel_google_sheets_templates-1"
    title: "Mẫu Excel/Sheets: Strategy Canvas Scoring"
    tags: ["mẫu", "excel", "sheets", "strategy", "canvas", "scoring"]
    text: |-
      name: Strategy Canvas Scoring
      description: 'Cột A: yếu tố; B: điểm mình; C: điểm đối thủ 1; D: đối thủ 2; E: trung bình đối thủ (=AVERAGE(C2:D2)); F: |B-E|. Ô tổng: D = AVERAGE(F2:F11), r = CORREL(B2:B11,E2:E11). Vẽ Line chart nhiều series.'
  - id: "m05-excel_google_sheets_templates-2"
    title: "Mẫu Excel/Sheets: ERRC Cost Model"
    tags: ["mẫu", "excel", "sheets", "errc", "cost", "model"]
    text: |-
      name: ERRC Cost Model
      description: Bảng 4 ô (E/R/Ra/C) với cột tác động VND/đơn vị; ô C_new = C_base - SUMIF(E,R) + SUMIF(Ra,C); so với C_target = Giá*(1-Biên).
  - id: "m05-excel_google_sheets_templates-3"
    title: "Mẫu Excel/Sheets: Noncustomer Sizing + Break-even"
    tags: ["mẫu", "excel", "sheets", "noncustomer", "sizing", "break", "even"]
    text: |-
      name: Noncustomer Sizing + Break-even
      description: 3 hàng tầng với N và r; Q = SUMPRODUCT; BE = F/(p*(1-v)); tỷ số Q/BE; biên an toàn.
  - id: "m05-excel_google_sheets_templates-4"
    title: "Mẫu Excel/Sheets: Buyer Utility Map 6x6"
    tags: ["mẫu", "excel", "sheets", "buyer", "utility", "map", "6x6"]
    text: |-
      name: Buyer Utility Map 6x6
      description: Ma trận 6 giai đoạn x 6 đòn bẩy, đánh dấu 1 nếu đối thủ phục vụ tốt; B = (36 - SUM)/36; tô màu ô trống.
