id: strategy-m05
title: "Chiến lược m05: Chiến lược Đại dương xanh"
summary: "Giúp doanh nghiệp thoát khỏi cạnh tranh trực diện (đại dương đỏ) bằng đổi mới giá trị (value innovation): vẽ Strategy Canvas, dùng ERRC/Four Actions để thiết kế đường cong giá trị mới, tìm khách hàng chưa phục vụ (non-customers), kiểm tra tính khả thi bằng Buyer Utility, Price, …"
agents: ["strategist"]
