  - id: "readme-skill"
    title: "README bộ skill — skill"
    tags: ["skill"]
    text: |-
      id: finance-agent-skill
      version: 1.0
      language: vi (thuật ngữ Anh trong ngoặc)
      created: 2026-10-29
      purpose: |
        Bộ tri thức đã chắt lọc từ giáo trình "Quản trị tài chính doanh nghiệp" (MBA ứng dụng SME Việt Nam) để một agent tài chính tư vấn, giải đáp, tính toán, lập bảng biểu/báo cáo và đề xuất phương án cho mọi vấn đề tài chính doanh nghiệp.
      source_material: |
        11 file markdown trong thư mục cha (01-time-value-of-money.md ... 11-integrated-corporate-finance-guide.md). Skill này tự đủ (self-contained): agent không cần đọc file markdown gốc để làm việc; markdown gốc chỉ để tham chiếu sâu thêm nếu có.
      portability: |
        Chỉ gồm YAML (+ 1 script Python tùy chọn). Copy nguyên thư mục finance-agent-skill/ sang máy khác là dùng được. Không có đường dẫn tuyệt đối, không phụ thuộc phần mềm ngoài. Script kiểm tra cần python3 + pyyaml.
