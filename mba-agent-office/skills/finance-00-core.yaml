  - id: "readme-conventions_for_calculation"
    title: "README bộ skill — conventions_for_calculation"
    tags: ["conventions_for_calculation"]
    text: |-
      expression_python: |
        Biểu thức hoặc đoạn code Python minh họa cách tính; tên biến khớp mục variables và example.inputs. Một số công thức cần thư viện math/numpy/scipy (vd brentq cho IRR) hoặc có nhiều dòng: coi là mã tham chiếu, không nhất thiết eval một dòng. Ví dụ m08_hamada: unlever beta trước rồi mới relever.
      source_errors_found: |
        Khi distill, agent phát hiện một số lỗi trong markdown gốc (đáp số bài tập 01 bài 4 và 6c; 02 bài 4-5; WACC Microsoft ở 04; DuPont 5 thành phần và Apple ở 05; 07 bài 6e). YAML đã dùng giá trị tính lại đúng; ưu tiên YAML hơn markdown khi hai bên mâu thuẫn.
  - id: "readme-maintenance"
    title: "README bộ skill — maintenance"
    tags: ["maintenance"]
    text: |-
      validate: 'python3 tools/build_and_validate.py   # kiểm tra YAML, trùng id, sinh lại 06-formulas-index.yaml'
      update_rule: Sửa module trong modules/, rồi chạy lại script để cập nhật 06-formulas-index.yaml.
      data_quality_notes: |
        Mỗi case_lessons có data_reliability (verified/illustrative/unverified). Số liệu công ty quốc tế và thuế/pháp lý VN cần đối chiếu nguồn gốc trước khi dùng cho quyết định thật. Xem known_data_caveats trong 01-agent-profile.yaml.
  - id: "readme-how_to_bootstrap"
    title: "README bộ skill — how_to_bootstrap"
    tags: ["how_to_bootstrap"]
    text: |-
      step_1: Đọc toàn bộ file này.
      step_2: Đọc 01-agent-profile.yaml (vai trò, nguyên tắc, quy trình trả lời, nhãn độ tin cậy) — BẮT BUỘC tuân thủ.
      step_3: Đọc SCHEMA.yaml để hiểu cấu trúc các module.
      step_4: Với mỗi yêu cầu của người dùng, dùng 02-decision-router.yaml để chọn module + playbook.
      step_5: Nạp module cần dùng trong modules/ (đọc đầy đủ), tra công thức ở 06-formulas-index.yaml, chạy playbook ở 03-playbooks.yaml.
      step_6: Trình bày kết quả theo 04-report-templates.yaml; tra thuật ngữ ở 05-glossary.yaml.
      note_on_context: |
        Nếu giới hạn ngữ cảnh chặt: luôn nạp 00, 01, 02; chỉ nạp thêm module liên quan (router chỉ ra tối đa 3-4 module cho mỗi tình huống).
  - id: "readme-load_order"
    title: "README bộ skill — load_order"
    tags: ["load_order"]
    text: |-
      always:
      - 00-README.yaml
      - 01-agent-profile.yaml
      - 02-decision-router.yaml
      on_demand:
      - 03-playbooks.yaml
      - 04-report-templates.yaml
      - 05-glossary.yaml
      - 06-formulas-index.yaml
      - modules/*.yaml
      reference_only:
      - SCHEMA.yaml
