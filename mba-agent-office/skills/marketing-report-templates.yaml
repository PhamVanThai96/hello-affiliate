id: marketing-report-templates
title: "Marketing — mẫu báo cáo/bảng biểu"
summary: "Cấu trúc chung và các mẫu báo cáo marketing."
agents: ["marketing_expert"]
order: 61
when: ["__chi_tra_cuu_bang_skill_search__"]
sections:
  - id: "tpl-cau-truc-chung"
    title: "Mẫu báo cáo — cấu trúc chung"
    tags: ["mẫu", "báo", "cáo", "cấu", "trúc"]
    text: |-
      - 1. Tóm tắt điều hành (kết luận, con số chính, khuyến nghị trong 3-5 dòng)
      - 2. Bối cảnh và dữ liệu đầu vào (kèm nhãn VERIFIED, GIẢ ĐỊNH, CHƯA KIỂM CHỨNG)
      - 3. Khung phân tích và công thức sử dụng (và vì sao chọn)
      - 4. Phân tích và tính toán từng bước (bảng)
      - 5. Phân tích độ nhạy hoặc kịch bản xấu, cơ sở, tốt
      - 6. Diễn giải ý nghĩa kinh doanh và so sánh benchmark (ghi độ tin cậy)
      - 7. Phương án và khuyến nghị (ưu, nhược, điều kiện làm thay đổi khuyến nghị)
      - 8. Ngân sách, KPI và lộ trình hành động
      - 9. Rủi ro, giả định, giới hạn, lưu ý đạo đức và pháp lý quảng cáo
      - 10. Việc cần bàn giao agent khác và bước tiếp theo
