      steps:
      - 'Kênh hồi quy toàn bộ 230 phiên (kiểu cũ): độ dốc +59 đồng/phiên (do đa số dữ liệu là xu hướng tăng), bề rộng 25,7% giá; 6/10 phiên kế tiếp nằm trong kênh (60%).'
