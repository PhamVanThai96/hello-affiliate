  - id: "m01-worked_examples-1"
    title: "Ví dụ có lời giải: m01_ex_atr_cone — Tính vùng biến động 10 phiên"
    tags: ["ví", "dụ", "có", "lời", "giải", "m01_ex_atr_cone", "tính", "vùng", "biến", "động", "10", "phiên"]
    text: |-
      id: m01_ex_atr_cone
      name: Tính vùng biến động 10 phiên
      data_reliability: illustrative
      inputs:
        close: 26000
        atr_pct: 0.024
        k: 0.974
        h: 10
        drift_nhom_UP4: 0.01342
      steps:
      - sigma_h = 0,024 x sqrt(10) x 0,974 = 0,0739 (7,39%)
      - 'Với drift = 0: thấp = 26.000 x (1 - 0,0739) = 24.078; cao = 26.000 x (1 + 0,0739) = 27.922'
      - 'Với drift nhóm UP|4 = +1,342%: thấp 24.427; cao 28.271'
      result: Vùng 80% 10 phiên khoảng 24.100-27.900 (không drift) hoặc 24.427-28.271 (có drift); chênh drift nhỏ so với bề rộng.
      interpretation: Chiều rộng ±7,4% tức khoảng ±1.920 đồng quanh 26.000; một phiên HOSE biến động tối đa ±7%, nên vùng 10 phiên không phải đảm bảo.
  - id: "m01-worked_examples-2"
    title: "Ví dụ có lời giải: m01_ex_position_size — Kích thước vị thế theo ATR"
    tags: ["ví", "dụ", "có", "lời", "giải", "m01_ex_position_size", "kích", "thước", "vị", "thế", "theo", "atr"]
    text: |-
      id: m01_ex_position_size
      name: Kích thước vị thế theo ATR
      data_reliability: illustrative
      inputs:
        capital: 500000000
        risk_pct: 0.01
        m: 2
        atr_pct: 0.024
        price: 26000
        lot: 100
        target: 28500
      steps:
      - ATR = 26.000 x 0,024 = 624 đồng; khoảng cắt lỗ = 2 x 624 = 1.248; cắt lỗ = 24.752 (4,8% < 7% nên không bị chặn)
      - Rủi ro tiền = 500.000.000 x 1% = 5.000.000
      - Số cp = 5.000.000/1.248 = 4.006 -> lô 100 -> 4.000 cp; giá trị 104.000.000 (20,8% vốn)
      - Lỗ nếu chạm cắt lỗ ~ 4.000 x 1.248 = 4.992.000 (~1% vốn)
      - R:R tới 28.500 = 2.500/1.248 = 2,003
      result: Mua 4.000 cp, cắt lỗ 24.752, R:R = 2,0 (mục tiêu 28.500 chỉ là giả định)
      interpretation: Vị thế 20,8% vốn nằm trong trần 20-25% tự đặt; nếu ATR% tăng gấp đôi thì số cp giảm một nửa.
  - id: "m01-worked_examples-3"
    title: "Ví dụ có lời giải: m01_ex_read_cli — Đọc một đầu ra CLI mẫu (HPG.VN, số giả định minh họa)"
    tags: ["ví", "dụ", "có", "lời", "giải", "m01_ex_read_cli", "đọc", "một", "đầu", "ra", "cli", "mẫu"]
    text: |-
      id: m01_ex_read_cli
      name: Đọc một đầu ra CLI mẫu (HPG.VN, số giả định minh họa)
      data_reliability: illustrative
      inputs:
        cli_sample: |
          {"ticker":"HPG.VN","as_of":"2026-11-10","close":26000,"bars":251,
           "trend_state":{"structure":"TĂNG (giá > MA50 > MA200)","ma50":25200,"ma200":23800,"roc20_pct":4.0,"pos60_pct":68},
           "outlook":{"direction":0,"label":"CHƯA RÕ HƯỚNG","regime":"UP","p_up":0.5066,"n":6344,"score":0.30,"mean_ret":0.00833,"horizon":10,"cone_low":24295,"cone_high":28139,"sigma_h_pct":7.39},
           "channel":{"channel_type":"Ascending (Kênh tăng)","window":90,"width_pct":14.6},
           "channel_edges_now":{"upper":28100,"lower":24300,"median":26200},
           "support_resistance":{"nearest_support":{"level":25100,"touches":4},"nearest_resistance":{"level":27200,"touches":3}},
           "value_area":{"window":60,"poc":25800,"vah":26600,"val":25000,"position":"trong Value Area"},
           "patterns_info_only":[{"pattern":"Hammer"}],
           "rule_filter":{"label":"THEO DÕI","reasons":["Giá đang lơ lửng giữa kênh"]}}
      steps:
      - 'Trạng thái: giá 26.000 > MA50 25.200 > MA200 23.800 -> cấu trúc TĂNG; ROC20 +4%; vị trí 68% biên 60 phiên.'
      - 'Nhận định: regime UP, score 0,30 -> nhóm 4 (UP|3): p_up 50,66% (n=6.344). |0,5066 - 0,5| = 0,0066 < 0,045 -> direction 0 = CHƯA RÕ. So nền 52%: không khác.'
      - 'Vùng biến động: 24.295-28.139 (sigma_h 7,39%; drift +0,833%): kiểm tra 26.000 x (1+0,00833-0,0739) = 24.295 và x (1+0,00833+0,0739) = 28.139.'
      - 'Kênh: tăng, rộng 14,6% (gần khoảng 15-17% điển hình); giá 26.000 ở vị trí (26.000-24.300)/(28.100-24.300) = 44,7% -> gần giữa kênh, không có biên nào gần.'
      - 'Hỗ trợ/kháng cự: 25.100 (4 chạm), 27.200 (3 chạm): chỉ là nơi giá từng đảo chiều.'
      - 'Value Area: trong vùng giá trị -> không có quán tính; 26.000 gần POC 25.800.'
      - 'Nến Hammer: mô tả; không dùng làm tín hiệu (kiểm chứng: không dự báo).'
      - 'Nhãn luật THEO DÕI: không thuận cũng không nghịch.'
      result: 'Báo cáo trung thực: ''Xu hướng đang tăng, nhưng hướng 10 phiên tới không rõ (50,7%, như tung đồng xu). Vùng dao động 80% khoảng 24.300-28.100. Mức vô hiệu hoá của kịch bản tích cực: đóng cửa dưới 24.752 (2 ATR).'''
      interpretation: Không có điểm mua rõ; hướng không có thiên hướng; hãy bàn về kích thước vị thế và kế hoạch chứ không bàn 'mua hay bán ngay'.
