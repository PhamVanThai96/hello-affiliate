  - id: "m01-practice_questions-5"
    title: "Câu hỏi luyện tập: Giá xuất hiện nến Hammer sát đáy 20 phiên, dưới MA50. Có nên mua không?"
    tags: ["câu", "hỏi", "luyện", "tập", "giá", "xuất", "hiện", "nến", "hammer", "sát", "đáy", "20"]
    text: |-
      q: Giá xuất hiện nến Hammer sát đáy 20 phiên, dưới MA50. Có nên mua không?
      a: 'Không nên chỉ vì nến: bullish reversal ở vùng giá thấp vượt nền -0,74% (train)/-0,82% (test), bắt đáy theo nến thường sai. Chỉ mô tả; nếu muốn mua phải dựa vào luận điểm cơ bản và quản trị rủi ro.'
  - id: "m01-practice_questions-6"
    title: "Câu hỏi luyện tập: Giá đóng cửa vượt biên trên kênh v3. Chiến lược mua đuổi có hợp lý không?"
    tags: ["câu", "hỏi", "luyện", "tập", "giá", "đóng", "cửa", "vượt", "biên", "trên", "kênh", "v3"]
    text: |-
      q: Giá đóng cửa vượt biên trên kênh v3. Chiến lược mua đuổi có hợp lý không?
      a: 'Không: 57-67% quay lại trong kênh trong 5 phiên, lợi suất 10 phiên sau không hơn nền. Chờ khối lượng và phiên xác nhận.'
  - id: "m01-practice_questions-7"
    title: "Câu hỏi luyện tập: Nhãn rule_filter = BÁN vì giá < MA200. Nhà đầu tư đang giữ cổ phiếu nên làm gì?"
    tags: ["câu", "hỏi", "luyện", "tập", "nhãn", "rule_filter", "bán", "vì", "giá", "ma200", "nhà", "đầu"]
    text: |-
      q: Nhãn rule_filter = BÁN vì giá < MA200. Nhà đầu tư đang giữ cổ phiếu nên làm gì?
      a: Nhãn không có giá trị dự báo ngắn hạn (sau đó vẫn tăng ~50%). Không bán chỉ vì nhãn; xem lại luận điểm đầu tư và kích thước vị thế/cắt lỗ; không mua thêm bình quân giá xuống dưới MA200 (kỷ luật).
  - id: "m01-practice_questions-8"
    title: "Câu hỏi luyện tập: Tại sao vùng biến động dự báo tốt hơn hướng giá?"
    tags: ["câu", "hỏi", "luyện", "tập", "tại", "sao", "vùng", "biến", "động", "dự", "báo", "tốt"]
    text: |-
      q: Tại sao vùng biến động dự báo tốt hơn hướng giá?
      a: Biến động có tính tụ cụm (tương quan ATR% với |lợi suất tương lai| ~0,22) nên biên độ gần đây dự báo biên độ sắp tới; hướng giá gần như bước ngẫu nhiên (IC 0,05-0,1, đổi dấu theo chế độ). Vùng 80% phủ 82,7% ngoài mẫu.
  - id: "m01-practice_questions-9"
    title: "Câu hỏi luyện tập: Người dùng muốn bán khống mã đang giảm. Trả lời thế nào?"
    tags: ["câu", "hỏi", "luyện", "tập", "người", "dùng", "muốn", "bán", "khống", "mã", "đang", "giảm"]
    text: |-
      q: Người dùng muốn bán khống mã đang giảm. Trả lời thế nào?
      a: Nhà đầu tư cá nhân VN không bán khống; 'SHORT' không khả thi. Chỉ có không mua/giảm tỷ trọng/đứng ngoài. Hơn nữa nhãn giảm không dự báo được hướng ngắn hạn.
  - id: "m01-practice_questions-10"
    title: "Câu hỏi luyện tập: Chạy --as-of 2025-05-29 và diễn biến sau đó khớp vùng 80%. Có chứng minh công cụ đúng không?"
    tags: ["câu", "hỏi", "luyện", "tập", "chạy", "as", "of", "2025", "05", "29", "và", "diễn"]
    text: |-
      q: Chạy --as-of 2025-05-29 và diễn biến sau đó khớp vùng 80%. Có chứng minh công cụ đúng không?
      a: Không. Một mẫu không chứng minh gì; vùng 80% vẫn có 20% sót; và bảng hiệu chuẩn p_up tính trên mọi năm nên đó là trong mẫu.
