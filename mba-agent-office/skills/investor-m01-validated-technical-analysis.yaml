      - 'Nhận định v3: đúng ~52,0% trên 1.576 ngày; nền ''luôn tăng'' 50,8%'
      - Xác suất theo nhóm 47-59%; vùng biến động 80% phủ 82,7%
      - IC +0,10 (UP) và -0,13 (DOWN); tỷ lệ đúng từng năm 19%-86%
      lesson: Hướng 10-20 phiên gần như không dự báo được từ giá; biên độ dự báo được. Vì vậy công cụ chuyển từ mũi tên sang xác suất + vùng biến động.
