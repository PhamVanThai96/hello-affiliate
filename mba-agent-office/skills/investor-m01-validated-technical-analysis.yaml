  - id: "m01-data_reliability"
    title: "Data reliability"
    tags: ["data", "reliability"]
    text: |-
      Số liệu kiểm chứng (mọi tỷ lệ, lợi suất vượt nền, độ phủ vùng biến động) trích nguyên văn VERIFICATION_FINDINGS.md (do các script kiểm thử walk-forward đã gỡ khỏi repo sinh ra; KHÔNG chạy lại trong module này) -> 'verified' theo tài liệu. Bảng p_up theo (chế độ|nhóm) và cone_k80 = 0,974 lấy từ outlook_calibration.json. Mọi ví dụ giá HPG/MSN, kênh tổng hợp và vị thế là 'illustrative' (giả định hoặc tính lại bằng python3). Các tuyên bố trong skills/references (confluence 75-80%, hỗ trợ cứng >= 3 chạm, mua đáy hộp với nến từ chối giá) là 'unverified' và bị bác bỏ. Điểm còn thiếu: kiểm chứng riêng RSI/MFI/Bollinger/MA cross, dữ liệu trong ngày (AMT 15m).
