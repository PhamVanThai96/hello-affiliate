    text: |-
      q: Value Area 70% gắn với khái niệm thống kê nào?
      a: Xấp xỉ 1 độ lệch chuẩn quanh trung bình của phân phối chuẩn (khoảng 68%); là quy ước của Market Profile, không phải hằng số tự nhiên.
  - id: "m02-practice_questions-10"
    title: "Câu hỏi luyện tập: Nêu ba điều kiện của yfinance/VN khiến tín hiệu AMT trong ngày chưa đáng tin."
    tags: ["câu", "hỏi", "luyện", "tập", "nêu", "ba", "điều", "kiện", "của", "yfinance", "vn", "khiến"]
    text: |-
      q: Nêu ba điều kiện của yfinance/VN khiến tín hiệu AMT trong ngày chưa đáng tin.
