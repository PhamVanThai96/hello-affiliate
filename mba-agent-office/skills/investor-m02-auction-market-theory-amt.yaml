      q: Tín hiệu SHORT từ kịch bản A xử lý thế nào ở VN?
      a: Không thực hiện vì không bán khống cổ phiếu cơ sở; diễn giải thành 'không mua/đứng ngoài/giảm tỷ trọng'. Ngoài ra tín hiệu intraday chưa kiểm chứng.
  - id: "m02-practice_questions-7"
