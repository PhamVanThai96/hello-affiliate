  - id: "m02-practice_questions-2"
    title: "Câu hỏi luyện tập: Vì sao chia khối lượng nến theo tỷ lệ chồng lấp thay vì gán toàn bộ vào bin của giá đóng cửa?"
    tags: ["câu", "hỏi", "luyện", "tập", "vì", "sao", "chia", "khối", "lượng", "nến", "theo", "tỷ"]
    text: |-
      q: Vì sao chia khối lượng nến theo tỷ lệ chồng lấp thay vì gán toàn bộ vào bin của giá đóng cửa?
      a: Giá đã đi qua toàn bộ [Low, High] trong nến; gán vào Close làm profile lệch và lởm chởm. Chia theo chồng lấp giả định khối lượng trải đều, bảo toàn tổng khối lượng, là xấp xỉ trung tính khi không có tick.
  - id: "m02-practice_questions-3"
    title: "Câu hỏi luyện tập: Tại sao VWAP phiên trên nến ngày vô nghĩa?"
    tags: ["câu", "hỏi", "luyện", "tập", "tại", "sao", "vwap", "phiên", "trên", "nến", "ngày", "vô"]
    text: |-
      q: Tại sao VWAP phiên trên nến ngày vô nghĩa?
      a: 'Mỗi phiên chỉ một nến nên cộng dồn chỉ có một điểm: VWAP = Typical Price và sigma = 0. Code bỏ qua và ghi cảnh báo trong notes.'
  - id: "m02-practice_questions-4"
    title: "Câu hỏi luyện tập: Dữ liệu VN cho thấy gì về kịch bản A (hồi về POC)?"
    tags: ["câu", "hỏi", "luyện", "tập", "dữ", "liệu", "vn", "cho", "thấy", "gì", "về", "kịch"]
    text: |-
      q: Dữ liệu VN cho thấy gì về kịch bản A (hồi về POC)?
      a: Khi giá ngoài Value Area, xác suất hồi về POC trong 10 phiên chỉ 41-50% (như tung đồng xu), nên kịch bản mean reversion không được ủng hộ trên khung ngày.
  - id: "m02-practice_questions-5"
    title: "Câu hỏi luyện tập: Đóng cửa trên VAH có phải tín hiệu mua mạnh không?"
    tags: ["câu", "hỏi", "luyện", "tập", "đóng", "cửa", "trên", "vah", "có", "phải", "tín", "hiệu"]
    text: |-
      q: Đóng cửa trên VAH có phải tín hiệu mua mạnh không?
      a: 'Không. Chỉ có quán tính nhẹ: tăng 10 phiên 55-56% so với nền 51-53% và lợi suất +1.2% đến +1.5% so với nền +0.5% đến +0.9%. Là yếu tố phụ, không độc lập.'
  - id: "m02-practice_questions-6"
    title: "Câu hỏi luyện tập: Tín hiệu SHORT từ kịch bản A xử lý thế nào ở VN?"
