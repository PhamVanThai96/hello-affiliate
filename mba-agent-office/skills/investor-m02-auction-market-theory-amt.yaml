    text: |-
      Nếu người dùng muốn tín hiệu vào lệnh intraday (kịch bản A/B) thì nói rõ chưa kiểm chứng và dữ liệu intraday mã .VN qua yfinance không được đảm bảo; yêu cầu nguồn dữ liệu trong ngày đáng tin cậy trước.
  - id: "m02-decision_rules-6"
    title: "Quy tắc quyết định: Nếu tín hiệu tự động là SHORT hoặc SHORT_TREND thì không đề xuất bán khống (VN không cho bán khống …"
    tags: ["quy", "tắc", "quyết", "định", "nếu", "tín", "hiệu", "tự", "động", "là", "short", "hoặc"]
    text: |-
      Nếu tín hiệu tự động là SHORT hoặc SHORT_TREND thì không đề xuất bán khống (VN không cho bán khống cổ phiếu cơ sở); diễn giải thành 'không mua/giảm tỷ trọng/đứng ngoài'.
  - id: "m02-decision_rules-7"
    title: "Quy tắc quyết định: Nếu shape = KHONG_DU_DU_LIEU (ít hơn 8 bin có dữ liệu) thì không kết luận hình dạng; mở rộng cửa sổ…"
