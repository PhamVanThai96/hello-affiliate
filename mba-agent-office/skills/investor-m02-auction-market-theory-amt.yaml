  - id: "m02-case_lessons-1"
    title: "Bài học case: Kiểm chứng AMT khung ngày trên cổ phiếu VN"
    tags: ["bài", "học", "case", "kiểm", "chứng", "amt", "khung", "ngày", "trên", "cổ", "phiếu", "vn"]
    text: |-
      name: Kiểm chứng AMT khung ngày trên cổ phiếu VN
      type: sme
      setup: |
        Backtest trong VERIFICATION_FINDINGS mục 6: Value Area dựng từ 60 phiên trước (num_bins = 40), xét hành vi 10 phiên sau khi giá đóng cửa ngoài VA, trên hai giai đoạn dữ liệu. Chi tiết mẫu/giai đoạn không có trong file nên không ghi thêm.
      key_calculations:
      - 'Trên VAH: tăng 10 phiên 55-56%, lợi suất +1.2% đến +1.5% (nền +0.5% đến +0.9%).'
      - 'Dưới VAL: tăng 48-52%, lợi suất +0.0% đến +0.1%.'
      - 'Hồi về POC trong 10 phiên khi giá ngoài VA: 41-50%.'
      lesson: |
        Chỉ có quán tính nhẹ phía trên VAH; kịch bản mean reversion (A) không được ủng hộ. Lý do hợp lý (suy luận, chưa kiểm chứng): cổ phiếu VN có xu hướng momentum và không bán khống nên giá dưới VAL không bị "mua bắt đáy" mạnh. Cần giữ AMT ở vai trò mô tả.
      data_reliability: verified
  - id: "m02-case_lessons-2"
    title: "Bài học case: Profile 5 nến minh họa"
    tags: ["bài", "học", "case", "profile", "nến", "minh", "họa"]
    text: |-
      name: Profile 5 nến minh họa
      type: sme
      setup: Profile tự thiết kế để tính tay POC/VAH/VAL, TPO, shape (xem worked_examples m02_we1).
      key_calculations:
      - bin_volume = [100,100,250,500,525,525,450,200,75,75]; POC 104.5; VA 103-107 (71.4%).
      lesson: Giúp agent mới hiểu thuật toán và quy tắc hòa; số là giả định minh họa, không phải mã thật.
      data_reliability: illustrative
  - id: "m02-worked_examples-1"
    title: "Ví dụ có lời giải: m02_we1 — Dựng Volume Profile và TPO từ 5 nến (giả định minh họa)"
    tags: ["ví", "dụ", "có", "lời", "giải", "m02_we1", "dựng", "volume", "profile", "và", "tpo", "từ"]
    text: |-
      id: m02_we1
      title: Dựng Volume Profile và TPO từ 5 nến (giả định minh họa)
      inputs:
        candles: '(Low, High, Volume): (100,104,400), (102,106,600), (103,107,1000), (104,108,500), (106,110,300)'
        num_bins: 10
        price_range: 100 đến 110, mỗi bin rộng 1
      steps:
      - 'Nến 1 (100-104, 400): chồng lấp 4 bin 0-3, mỗi bin 400 x 1/4 = 100.'
      - 'Nến 2 (102-106, 600): bin 2-5, mỗi bin 150.'
      - 'Nến 3 (103-107, 1000): bin 3-6, mỗi bin 250.'
      - 'Nến 4 (104-108, 500): bin 4-7, mỗi bin 125.'
      - 'Nến 5 (106-110, 300): bin 6-9, mỗi bin 75.'
      - 'Cộng: bin0 = 100; bin1 = 100; bin2 = 100 + 150 = 250; bin3 = 100 + 150 + 250 = 500; bin4 = 150 + 250 + 125 = 525; bin5 = 525; bin6 = 250 + 125 + 75 = 450; bin7 = 125 + 75 = 200; bin8 = 75; bin9 = 75. Tổng 2800 = 400+600+1000+500+300 (bảo toàn).'
      - 'POC: bin 4 và 5 cùng 525, argmax lấy bin 4 => POC = 104.5.'
      - 'Value Area: 525 (18.75%) -> +525 phải = 1050 -> +500 trái = 1550 -> +450 phải = 2000 = 71.4% >= 70% dừng; VA = bin 3..6 => VAL = 103, VAH = 107.'
      - 'HVN: mean bin = 280, std = 188.0 (np.std tổng thể); ngưỡng HVN = 468.0 => bin 3 (500) và bin 5 (525) là HVN (bin 4 là POC nên loại). Giá HVN = 103.5 và 105.5. LVN: ngưỡng 92.0 => bin 8 và 9 (75) = 108.5 và 109.5.'
      - 'TPO (mỗi nến 1 chu kỳ): bin_count = [1,1,2,3,4,3,4,3,2,1]; TPO POC = 104.5 (hòa với bin 6, chọn bin nhỏ); TPO VA = 103 đến 108; Single Prints ở 100.5, 101.5, 109.5.'
      - 'Shape: skew = 0.0166, excess kurt = -0.1576 => D_SHAPE theo ngưỡng (nhưng chỉ có 5 nến, 10 bin, mẫu quá nhỏ để tin).'
      result: POC 104.5; VAL 103; VAH 107 (71.4%); HVN 103.5 và 105.5; LVN 108.5 và 109.5; D_SHAPE (skew 0.017, kurt -0.158)
  - id: "m02-worked_examples-2"
    title: "Ví dụ có lời giải: m02_we2 — VWAP và dải sigma trong ngày, reset khi sang phiên mới (giả định minh họa)"
    tags: ["ví", "dụ", "có", "lời", "giải", "m02_we2", "vwap", "và", "dải", "sigma", "trong", "ngày"]
    text: |-
      id: m02_we2
      title: VWAP và dải sigma trong ngày, reset khi sang phiên mới (giả định minh họa)
      inputs:
        bars: 'Phiên 5/1: (H,L,C,V) = (101,99,100,1000), (103,100,102,3000), (104,101,103,1000); phiên 6/1: (50,48,49,500)'
      steps:
      - 'Typical Price: 100; 101.6667; 102.6667.'
      - VWAP nến 1 = 100; nến 2 = (100x1000 + 101.6667x3000)/4000 = 101.25; nến 3 = (405000 + 102666.7)/5000 = 101.5333.
      - 'Sigma running: nến 1 = 0; nến 2 = sqrt(520.83/4000) = 0.3608; nến 3 = sqrt(1805.2/5000) = 0.6009.'
      - '+1 sigma: 100; 101.6108; 102.1342. +2 sigma nến 2 = 101.25 + 2x0.3608 = 101.9717.'
      - 'Sang phiên 6/1 (ngày mới): cộng dồn reset; nến duy nhất có VWAP = Typical Price = 49, sigma = 0.'
      result: VWAP = [100, 101.25, 101.5333]; sigma = [0, 0.3608, 0.6009]; phiên mới reset VWAP = 49
  - id: "m02-worked_examples-3"
    title: "Ví dụ có lời giải: m02_we3 — Phân loại hình P-shape bằng weighted moments (giả định minh họa)"
    tags: ["ví", "dụ", "có", "lời", "giải", "m02_we3", "phân", "loại", "hình", "shape", "bằng", "weighted"]
    text: |-
      id: m02_we3
      title: Phân loại hình P-shape bằng weighted moments (giả định minh họa)
      inputs:
        bin_volume: '[50, 50, 100, 200, 400, 900, 1200, 1400]'
      steps:
      - Tổng = 50+50+100+200+400+900+1200+1400 = 4300; w = V/4300.
      - 'mu = sum(i x w) = 5.5698 (chỉ số bin trung bình, gần cuối: khối lượng dồn ở giá cao).'
      - sigma = 1.4906.
      - 'Skew = -1.3255 (<= -0.5: đuôi dài về giá thấp) và excess kurt = 1.8666.'
      - Có 8 bin có dữ liệu (đủ ngưỡng tối thiểu 8) => P_SHAPE.
      result: 'P_SHAPE: skew -1.3255; kurt 1.8666; diễn giải: khối lượng dồn ở vùng giá cao, có thể phân phối ở đỉnh hoặc breakout tăng được chấp nhận; chỉ là mô tả.'
  - id: "m02-worked_examples-4"
    title: "Ví dụ có lời giải: m02_we4 — Đọc vị trí giá so với Value Area và ra kết luận theo bằng chứng (giả định minh họa)"
    tags: ["ví", "dụ", "có", "lời", "giải", "m02_we4", "đọc", "vị", "trí", "giá", "so", "với"]
    text: |-
      id: m02_we4
      title: Đọc vị trí giá so với Value Area và ra kết luận theo bằng chứng (giả định minh họa)
      inputs:
        VAL: 103
        POC: 104.5
        VAH: 107
        close_hom_nay: 108
        khung: ngày, VA dựng từ 60 phiên trước, num_bins = 40
      steps:
      - 'Vị trí: 108 > VAH 107 => trạng thái ''trên VA'' (vượt 0.93% so với VAH).'
      - 'Tra decision_rules: đóng cửa trên VAH => quán tính nhẹ, tăng 10 phiên 55-56% (nền 51-53%).'
      - Kịch bản A (hồi về POC 104.5, tức -3.2%) chỉ 41-50% nên KHÔNG dùng làm luận điểm.
      - 'VWAP: không có vì chỉ dùng nến ngày.'
      - 'Kết luận: yếu tố hỗ trợ nhẹ cho kịch bản tăng, không phải tín hiệu độc lập; kết hợp cơ bản, quản trị rủi ro (cắt lỗ) và m01.'
      result: 'Trên VAH: lợi thế thống kê nhỏ (khoảng 3-4 điểm phần trăm so với nền); không dùng kịch bản hồi về POC.'
