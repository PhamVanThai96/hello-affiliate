  - id: "m02-excel_google_sheets_templates-1"
    title: "Mẫu Excel/Sheets: Sheet 'Bins': cột A chỉ số bin; B biên dưới = MinLow + (A-1)*(MaxHigh-MinLow)/N; C biên trên; D tâm…"
    tags: ["mẫu", "excel", "sheets", "sheet", "bins", "cột", "chỉ", "số", "bin", "biên", "dưới", "minlow"]
    text: |-
      Sheet 'Bins': cột A chỉ số bin; B biên dưới = MinLow + (A-1)*(MaxHigh-MinLow)/N; C biên trên; D tâm bin = (B+C)/2.
  - id: "m02-excel_google_sheets_templates-2"
    title: "Mẫu Excel/Sheets: Sheet 'Alloc': với mỗi nến (hàng) x bin (cột) công thức =IF(Vol>0, Vol*MAX(0,MIN(High,BinHi)-MAX(Lo…"
    tags: ["mẫu", "excel", "sheets", "sheet", "alloc", "với", "mỗi", "nến", "hàng", "bin", "cột", "công"]
    text: |-
      Sheet 'Alloc': với mỗi nến (hàng) x bin (cột) công thức =IF(Vol>0, Vol*MAX(0,MIN(High,BinHi)-MAX(Low,BinLo))/(High-Low), 0); cột tổng theo bin = bin_volume.
  - id: "m02-excel_google_sheets_templates-3"
    title: "Mẫu Excel/Sheets: Sheet 'VA': POC = INDEX(tâm_bin, MATCH(MAX(bin_volume), bin_volume, 0)); mở rộng thủ công bằng cột …"
    tags: ["mẫu", "excel", "sheets", "sheet", "va", "poc", "index", "tâm_bin", "match", "max", "bin_volume", "mở"]
    text: |-
      Sheet 'VA': POC = INDEX(tâm_bin, MATCH(MAX(bin_volume), bin_volume, 0)); mở rộng thủ công bằng cột cộng dồn chọn bên lớn hơn tới khi >= 70% tổng.
  - id: "m02-excel_google_sheets_templates-4"
    title: "Mẫu Excel/Sheets: Sheet 'VWAP' (dữ liệu trong ngày): cột Typical Price; cột cộng dồn TP*Vol và Vol theo từng ngày (SU…"
    tags: ["mẫu", "excel", "sheets", "sheet", "vwap", "dữ", "liệu", "trong", "ngày", "cột", "typical", "price"]
    text: |-
      Sheet 'VWAP' (dữ liệu trong ngày): cột Typical Price; cột cộng dồn TP*Vol và Vol theo từng ngày (SUMIFS theo ngày); VWAP = cộng dồn TP*Vol / cộng dồn Vol; cột Dev2Vol = (TP - VWAP)^2 * Vol để tính sigma.
