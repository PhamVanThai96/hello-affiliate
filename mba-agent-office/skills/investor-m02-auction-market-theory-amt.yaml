    text: |-
      q: TPO trên khung ngày khác TPO của Steidlmayer thế nào?
      a: Mỗi nến ngày là một chu kỳ nên là range profile (đếm số phiên đã chạm từng mức giá), không phải nhiều chữ cái 30 phút trong một phiên.
  - id: "m02-practice_questions-8"
    title: "Câu hỏi luyện tập: Skew âm của profile nói lên điều gì?"
    tags: ["câu", "hỏi", "luyện", "tập", "skew", "âm", "của", "profile", "nói", "lên", "điều", "gì"]
    text: |-
      q: Skew âm của profile nói lên điều gì?
      a: 'Khối lượng dồn ở bin giá cao, đuôi mỏng kéo về giá thấp: P-shape (skew <= -0.5). Skew dương mạnh là b-shape (dồn ở giá thấp).'
  - id: "m02-practice_questions-9"
    title: "Câu hỏi luyện tập: Value Area 70% gắn với khái niệm thống kê nào?"
