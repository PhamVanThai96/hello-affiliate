  - id: "m06-case_lessons-1"
    title: "Bài học case: FPT Corporation - BSC với Học hỏi dẫn dắt"
    tags: ["bài", "học", "case", "fpt", "corporation", "bsc", "với", "hỏi", "dẫn", "dắt"]
    text: |-
      name: FPT Corporation - BSC với Học hỏi dẫn dắt
      type: success
      setup: FPT áp dụng BSC từ đầu 2010s, chiến lược Go Global; nguồn mô phỏng dựa trên báo cáo thường niên (60,000+ nhân sự).
      key_calculations:
      - 'Chuỗi: 5,000+ kỹ sư AI, 500+ dự án AI/Cloud, 150+ khách hàng triệu đô, doanh thu CNTT nước ngoài +28% (~1 tỷ USD).'
      - Net margin 11.3%; on-time delivery > 95%.
      lesson: Đầu tư Học hỏi dẫn tới tăng trưởng tài chính nếu nối nhân quả rõ; BSC giúp align hàng chục nghìn nhân sự; rủi ro turnover ngành IT đòi hỏi đầu tư Học hỏi liên tục.
      data_reliability: illustrative
  - id: "m06-case_lessons-2"
    title: "Bài học case: Starbucks - BSC như triết lý quản trị và hạn chế"
    tags: ["bài", "học", "case", "starbucks", "bsc", "như", "triết", "lý", "quản", "trị", "và", "hạn"]
    text: |-
      name: Starbucks - BSC như triết lý quản trị và hạn chế
      type: failure
      setup: BSC quản lý 35,000+ cửa hàng, 80+ nước; 'Partners', College Achievement Plan; năm 2022-2023 nhân viên Mỹ đình công đòi quyền lợi.
      key_calculations:
      - 'KPI: comp store sales, 75M+ Rewards members, drive-thru <= 4 phút, 99% cà phê ethically sourced.'
      lesson: KPI engagement cao trên giấy không bằng sự hài lòng thực; BSC cần kiểm chứng chéo và lắng nghe thực địa, không chỉ báo cáo.
      data_reliability: unverified
  - id: "m06-case_lessons-3"
    title: "Bài học case: Cà Phê Nhà - chuỗi 3 quán chấm điểm BSC (giả định)"
    tags: ["bài", "học", "case", "cà", "phê", "nhà", "chuỗi", "quán", "chấm", "điểm", "bsc", "giả"]
    text: |-
      name: Cà Phê Nhà - chuỗi 3 quán chấm điểm BSC (giả định)
      type: sme
      setup: 25 nhân viên, trọng số F35/C30/P20/L15; 8 KPI.
      key_calculations:
      - 'Điểm viễn cảnh: F 0.750, C 0.815, P 1.044, L 0.817; tổng 0.838.'
      - 'ROI sáng kiến loyalty: +200 khách quay lại x 3 lần x 450k = 270tr; GM 40% = 108tr; chi 60tr; ROI 80%.'
      lesson: Quy trình tốt chưa đủ nếu NPS thấp; ưu tiên NPS và giữ người trước khi mở rộng.
      data_reliability: illustrative
  - id: "m06-worked_examples-1"
    title: "Ví dụ có lời giải: Chấm điểm BSC chuỗi Cà Phê Nhà (giả định)"
    tags: ["ví", "dụ", "có", "lời", "giải", "chấm", "điểm", "bsc", "chuỗi", "cà", "phê", "nhà"]
    text: |-
      name: Chấm điểm BSC chuỗi Cà Phê Nhà (giả định)
      inputs:
        weights_perspective:
          F: 0.35
          C: 0.3
          P: 0.2
          L: 0.15
        kpi_weight: 50/50 mỗi viễn cảnh
      steps:
      - 'Revenue growth (baseline 10%, target 20%, actual 17%): (17-10)/(20-10) = 0.70'
      - 'Net margin (8% target, 6.4% actual): 6.4/8 = 0.80 -> Tài chính = 0.5x0.70 + 0.5x0.80 = 0.75'
      - 'NPS (25 -> 50, actual 42): 17/25 = 0.68; Retention 57/60 = 0.95 -> Khách hàng = 0.815'
      - Service time 4/4.5 = 0.889; error rate 2/1.6 = 1.25 cắt 1.20 -> Quy trình = 1.044
      - Training 32/40 = 0.80; turnover 30/36 = 0.833 -> Học hỏi = 0.817
      - Tổng = 0.35x0.75 + 0.30x0.815 + 0.20x1.044 + 0.15x0.817 = 0.838 -> Amber
      result: '0.838 (Vàng). Điểm nghẽn: Tài chính và NPS; rủi ro nền: turnover.'
  - id: "m06-worked_examples-2"
    title: "Ví dụ có lời giải: Kiểm chứng nhân quả: sáng kiến giữ khách (giả định)"
    tags: ["ví", "dụ", "có", "lời", "giải", "kiểm", "chứng", "nhân", "quả", "sáng", "kiến", "giữ"]
    text: |-
      name: 'Kiểm chứng nhân quả: sáng kiến giữ khách (giả định)'
      inputs:
        customers: 2000
        repeat_before: 0.25
        repeat_after: 0.35
        purchases_per_year: 3
        aov: 450000
        gross_margin: 0.4
        cost: 60000000
      steps:
      - Khách quay lại thêm = 2000 x (0.35-0.25) = 200
      - Doanh thu thêm = 200 x 3 x 450,000 = 270,000,000
      - Lãi gộp thêm = 270tr x 0.4 = 108,000,000
      - ROI = (108-60)/60 = 0.80
      result: 'ROI 80%: sáng kiến đáng làm; nối Khách hàng (repeat) tới Tài chính.'
  - id: "m06-worked_examples-3"
    title: "Ví dụ có lời giải: Chấm OKR quý và hiểu khác biệt với BSC (giả định)"
    tags: ["ví", "dụ", "có", "lời", "giải", "chấm", "okr", "quý", "và", "hiểu", "khác", "biệt"]
    text: |-
      name: Chấm OKR quý và hiểu khác biệt với BSC (giả định)
      inputs:
        O: Khách mê quán
        KR1_score: 1.0
        KR2_score: 0.6
        KR3_score: 0.4
      steps:
      - Điểm O = (1.0+0.6+0.4)/3 = 0.667
      - Với OKR 0.667 ~ 0.7 là tốt (tham vọng); nếu là KPI BSC thì 0.667 là Đỏ (< 0.7).
      result: Cùng điểm, ý nghĩa khác nhau do BSC 100% = tốt, OKR ~70% = tốt.
  - id: "m06-worked_examples-4"
    title: "Ví dụ có lời giải: NPS và Retention của quán (giả định)"
    tags: ["ví", "dụ", "có", "lời", "giải", "nps", "và", "retention", "của", "quán", "giả", "định"]
    text: |-
      name: NPS và Retention của quán (giả định)
      inputs:
        promoters: 0.55
        detractors: 0.18
        start: 500
        end: 520
        new: 140
      steps:
      - NPS = 0.55 - 0.18 = 0.37 = 37
      - Retention = (520-140)/500 = 0.76
      result: NPS 37 (còn thấp so với target 50); retention 76%.
  - id: "m06-practice_questions-1"
    title: "Câu hỏi luyện tập: Tại sao BSC cần cả leading và lagging indicators?"
    tags: ["câu", "hỏi", "luyện", "tập", "tại", "sao", "bsc", "cần", "cả", "leading", "và", "lagging"]
    text: |-
      q: Tại sao BSC cần cả leading và lagging indicators?
      a: Lagging (doanh thu, lợi nhuận) chỉ cho biết kết quả đã xảy ra; leading (đào tạo, thời gian phục vụ, NPS) cho phép can thiệp sớm. Chỉ lagging thì phát hiện vấn đề muộn.
