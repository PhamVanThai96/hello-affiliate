  - id: "m06-practice_questions-5"
    title: "Câu hỏi luyện tập: Phân biệt BSC và OKR."
    tags: ["câu", "hỏi", "luyện", "tập", "phân", "biệt", "bsc", "và", "okr"]
    text: |-
      q: Phân biệt BSC và OKR.
      a: 'BSC: năm, 4 viễn cảnh, ~20-25 KPI, mô tả chiến lược, 100% = tốt, hợp DN ổn định. OKR: quý, linh hoạt, 3-5 O x 3-5 KR, tham vọng, ~70% = tốt, hợp startup. Có thể kết hợp.'
  - id: "m06-practice_questions-6"
    title: "Câu hỏi luyện tập: Quán có Quy trình 1.05 nhưng Tài chính 0.6. Cần làm gì?"
    tags: ["câu", "hỏi", "luyện", "tập", "quán", "có", "quy", "trình", "05", "nhưng", "tài", "chính"]
    text: |-
      q: Quán có Quy trình 1.05 nhưng Tài chính 0.6. Cần làm gì?
      a: Kiểm tra mắt xích Khách hàng (NPS, retention); chuỗi nhân quả có thể sai hoặc sáng kiến Quy trình chưa chuyển hóa; ưu tiên sáng kiến Khách hàng.
  - id: "m06-practice_questions-7"
    title: "Câu hỏi luyện tập: Sáng kiến tốn 40tr, tăng 120tr doanh thu, GM 35%. ROI?"
    tags: ["câu", "hỏi", "luyện", "tập", "sáng", "kiến", "tốn", "40tr", "tăng", "120tr", "doanh", "thu"]
    text: |-
      q: Sáng kiến tốn 40tr, tăng 120tr doanh thu, GM 35%. ROI?
      a: (120x0.35-40)/40 = (42-40)/40 = 0.05 = 5%.
