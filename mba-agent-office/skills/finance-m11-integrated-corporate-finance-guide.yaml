    text: |-
      Nếu lãi suất nợ vượt lợi suất hoạt động thì không vay thêm; vay để mua thêm quỹ đất/tài sản là nguyên nhân sụp đổ Ever-G.
  - id: "m11-decision_rules-7"
    title: "Quy tắc quyết định: Nếu doanh thu tăng nhanh thì tính ΔNWC và nguồn tài trợ; nếu ΔNWC > lợi nhuận + hạn mức thì dừng nớ…"
    tags: ["quy", "tắc", "quyết", "định", "nếu", "doanh", "thu", "tăng", "nhanh", "thì", "tính", "δnwc"]
    text: |-
      Nếu doanh thu tăng nhanh thì tính ΔNWC và nguồn tài trợ; nếu ΔNWC > lợi nhuận + hạn mức thì dừng nới tín dụng/đẩy tồn kho (overtrading).
  - id: "m11-decision_rules-8"
    title: "Quy tắc quyết định: Nếu DPO được kéo dài nhờ sức mua thì cần quỹ dự phòng thanh khoản vì khi doanh thu giảm lợi thế đảo…"
    tags: ["quy", "tắc", "quyết", "định", "nếu", "dpo", "được", "kéo", "dài", "nhờ", "sức", "mua"]
