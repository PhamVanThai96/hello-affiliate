    text: |-
      Nếu dòng tiền dự án đổi dấu nhiều hơn một lần (đại tu, hoàn nguyên môi trường, tiền ứng trước) thì KHÔNG dùng IRR đơn lẻ; dùng NPV và MIRR, vẽ đồ thị NPV theo tỷ suất chiết khấu.
  - id: "m11-decision_rules-2"
    title: "Quy tắc quyết định: Nếu NPV tĩnh chỉ dương nhẹ nhờ bù trừ hai kịch bản lệch (+221 / -204) và có thể chờ thông tin thì h…"
