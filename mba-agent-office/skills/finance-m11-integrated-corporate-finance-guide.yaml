    text: |-
      Nếu EPS gần như 0 hoặc dòng tiền suy sụp thì cắt cổ tức nhanh (SOA cao); không vay để trả cổ tức.
  - id: "m11-decision_rules-11"
    title: "Quy tắc quyết định: Nếu hai tài sản có ρ cao thì thay bằng tài sản ρ thấp/âm thay vì tài sản 'ít rủi ro' (Pan-Capital: …"
    tags: ["quy", "tắc", "quyết", "định", "nếu", "hai", "tài", "sản", "có", "cao", "thì", "thay"]
    text: |-
      Nếu hai tài sản có ρ cao thì thay bằng tài sản ρ thấp/âm thay vì tài sản 'ít rủi ro' (Pan-Capital: thay thép bằng vàng giảm σ 21,2% -> 14,3%, Sharpe +34%).
  - id: "m11-decision_rules-12"
    title: "Quy tắc quyết định: Nếu Premium ≥ Synergies thì không mua; đặt giá trần Price_max = V_B + Synergies và chào thấp hơn; k…"
    tags: ["quy", "tắc", "quyết", "định", "nếu", "premium", "synergies", "thì", "không", "mua", "đặt", "giá"]
    text: |-
      Nếu Premium ≥ Synergies thì không mua; đặt giá trần Price_max = V_B + Synergies và chào thấp hơn; kiểm tra break-even synergy realization.
  - id: "m11-decision_rules-13"
    title: "Quy tắc quyết định: Nếu P/E bên mua thấp hơn P/E trả thì thương vụ trả cổ phiếu sẽ dilutive ban đầu; xét synergy bù đắp."
    tags: ["quy", "tắc", "quyết", "định", "nếu", "bên", "mua", "thấp", "hơn", "trả", "thì", "thương"]
    text: |-
      Nếu P/E bên mua thấp hơn P/E trả thì thương vụ trả cổ phiếu sẽ dilutive ban đầu; xét synergy bù đắp.
  - id: "m11-decision_rules-14"
    title: "Quy tắc quyết định: Nếu TV/EV > 70-80% thì bắt buộc báo cáo khoảng giá trị (ma trận WACC-g) thay vì một con số; kiểm tr…"
    tags: ["quy", "tắc", "quyết", "định", "nếu", "tv", "ev", "70", "80", "thì", "bắt", "buộc"]
    text: |-
      Nếu TV/EV > 70-80% thì bắt buộc báo cáo khoảng giá trị (ma trận WACC-g) thay vì một con số; kiểm tra g ≤ tăng trưởng danh nghĩa dài hạn và implied ROIC/multiple.
  - id: "m11-decision_rules-15"
    title: "Quy tắc quyết định: Nếu so EV/EBITDA giữa công ty áp dụng và không áp dụng IFRS 16 thì phải điều chỉnh (cộng nợ thuê, E…"
