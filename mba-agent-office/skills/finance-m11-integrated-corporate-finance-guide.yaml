      Nếu chọn tỷ suất chiết khấu thì dùng WACC phản ánh rủi ro dự án, không dùng lãi vay (SME thường đánh giá NPV cao gấp ~2 lần nếu dùng lãi vay).
  - id: "m11-decision_rules-4"
    title: "Quy tắc quyết định: Nếu giữ r_d cố định khi tăng đòn bẩy thì kết quả sai; luôn để r_d tăng theo D/E hoặc theo ICR (Fly-…"
    tags: ["quy", "tắc", "quyết", "định", "nếu", "giữ", "r_d", "cố", "khi", "tăng", "đòn", "bẩy"]
    text: |-
      Nếu giữ r_d cố định khi tăng đòn bẩy thì kết quả sai; luôn để r_d tăng theo D/E hoặc theo ICR (Fly-Ind: WACC 10,10% giả định vs 15,22% thực tế).
  - id: "m11-decision_rules-5"
    title: "Quy tắc quyết định: Nếu ICR < 2,5-3 lần hoặc nợ ngắn hạn tài trợ tài sản dài hạn thì cảnh báo rủi ro tái cấp vốn/kiệt q…"
    tags: ["quy", "tắc", "quyết", "định", "nếu", "icr", "lần", "hoặc", "nợ", "ngắn", "hạn", "tài"]
    text: |-
