sections:
  - id: "m11-tong-quan"
    title: "Tổng quan m11"
    tags: ["m11", "cẩm", "nang", "tích", "hợp", "tài", "chính", "doanh", "nghiệp", "integrated", "corporate", "finance"]
    text: |-
      Cẩm nang tích hợp tài chính doanh nghiệp (Integrated Corporate Finance Guide) — module m11

      Mục đích: Kết nối toàn bộ m01-m10 thành một hệ thống ra quyết định: huy động vốn (WACC, cấu trúc vốn) -> đầu tư (capital budgeting) -> tạo dòng tiền (FCFF, vốn lưu động) -> hoàn vốn (cổ tức, mua lại), cộng định giá, M&A, rủi ro định lượng (VaR, ES, Monte Carlo) và chuẩn mực kế toán (IFRS 15/16). Dùng khi bài toán đa chiều cần chuỗi module theo đúng thứ tự tính.

      Dùng khi:
      - Một quyết định đồng thời đụng nhiều khối kiến thức (ví dụ: vay vốn mở chi nhánh = chi phí vốn + cơ cấu vốn + NPV + dòng tiền trả nợ + vốn lưu động + rủi ro).
      - Cần chọn đúng chuỗi module/công thức và thứ tự tính cho bài toán lớn, hoặc tìm case tương tự để làm khuôn bắt chước.
      - Cần các công thức không nằm ở m01-m10 - VaR, Expected Shortfall, Monte Carlo NPV, DSCR, Baumol, Miller-Orr, IFRS 15 phân bổ giá, IFRS 16 nợ thuê, EPS accretion…
      - Cần ma trận tổng hợp/checklist trước khi trình bày quyết định tài chính, hoặc rà soát tính nhất quán số liệu.
      - Tư vấn SME Việt Nam có vay ngân hàng (Case 13 là khuôn mẫu đầy đủ).

      Nên nắm trước: - m01; - m02; - m03; - m04; - m05; - m06; - m07; - m08; - m09; - m10

      Module liên quan: - m01 - PV, annuity, perpetuity, ghép lãi liên tục, Fisher (nền của mọi chuỗi tính). - m02 - NPV/IRR/MIRR/PI/DPP, dòng tiền tăng thêm, Real Options, đồ thị NPV. - m03 - CAPM, WACC, Hamada, chi phí nợ, MCC/break point. - m04 - M&M I/II (có/không thuế), Miller 1977, Trade-off, Pecking Order, agency costs. - m05 - ICR, Current/Quick/Cash Ratio, kiểm tra nhất quán BCTC. - m06 - CCC, DIO/DSO/DPO, EOQ,…

      Công thức (tra chi tiết bằng skill_search("<id>")):
      - m11_var_parametric: Giá trị chịu rủi ro tham số (VaR)
      - m11_expected_shortfall: Tổn thất kỳ vọng vượt ngưỡng (ES / CVaR)
      - m11_monte_carlo_npv_prob: Xác suất NPV âm (giải tích & mô phỏng Monte Carlo)
      - m11_dscr: Hệ số khả năng trả nợ (DSCR)
      - m11_level_payment: Khoản trả nợ đều hằng kỳ (annuity loan payment)
      - m11_interest_coverage: Hệ số bao phủ lãi vay (ICR) và đòn bẩy EBIT
      - m11_baumol_bat: Lượng tiền mặt rút tối ưu Baumol-Allais-Tobin (BAT)
      - m11_miller_orr: Mô hình tiền mặt Miller-Orr (sàn-điểm quay về-trần)
      - m11_real_option_delay: Giá trị quyền chọn trì hoãn đầu tư (2 kịch bản)
      - m11_ifrs15_allocation: Phân bổ giá hợp đồng theo giá bán độc lập (IFRS 15)
      - m11_ifrs16_lease: Nợ thuê tài sản theo IFRS 16
      - m11_eps_accretion: EPS sau thâu tóm bằng cổ phiếu (accretion/dilution)
      - m11_ex_dividend_buyback: So sánh cổ tức và mua lại cổ phiếu theo giá trị nội tại
      - m11_tv_implied_roic: Kiểm tra TV: bội số ngầm định và ROIC ngầm định
      - m11_npv_breakeven_shortfall: Điểm hòa vốn NPV theo doanh thu (stress test)
      - m11_overtrading_gap: Khoảng thiếu hụt tài trợ do tăng trưởng (overtrading gap)

      Kho tra cứu của module: Khái niệm 10, Công thức 16, Quy trình 7, Quy tắc quyết định 19, Chuẩn so sánh 12, Lỗi thường gặp 16, Lưu ý SME Việt Nam 10, Bài học case 15, Ví dụ có lời giải 7, Câu hỏi luyện tập 8, Checklist 35, Mẫu Excel/Sheets 7. Tra bằng skill_search với từ khoá chủ đề (vd "ví dụ NPV", "lỗi thường gặp WACC").
  - id: "m11-concepts-1"
    title: "Khái niệm: Bản đồ dòng chuyển vốn"
    tags: ["khái", "niệm", "bản", "đồ", "dòng", "chuyển", "vốn"]
    text: |-
      term_vi: Bản đồ dòng chuyển vốn
      term_en: Capital flow map / financial decision system
      definition: Vòng tuần hoàn 3 quyết định cốt lõi của giám đốc tài chính. (1) Huy động vốn từ thị trường tài chính (cổ đông + chủ nợ) với chi phí WACC; (2) đầu tư vào tài sản dài hạn (capital budgeting) và vận hành (vốn lưu động CCC) để sinh dòng tiền tự do FCFF; (3) phân bổ FCFF trả nợ gốc/lãi, chi cổ tức/mua lại cổ phiếu, giữ lại tái đầu tư. Dòng (3) quay lại thị trường vốn và quyết định giá cổ phiếu.
      why_it_matters: Tránh tư duy "mỗi công thức là một ốc đảo". Tỷ suất chiết khấu của dự án (WACC) chính là đầu ra của khối huy động vốn; FCFF của dự án là đầu vào của định giá; chính sách chi trả phụ thuộc FCFF và cơ hội NPV>0. Sai ở một khâu (ví dụ WACC dùng lãi vay) lan sang tất cả khâu sau (NPV sai, giá trị sai).
  - id: "m11-concepts-2"
    title: "Khái niệm: Sơ đồ phụ thuộc giữa các khối"
    tags: ["khái", "niệm", "sơ", "đồ", "phụ", "thuộc", "giữa", "các", "khối"]
    text: |-
      term_vi: Sơ đồ phụ thuộc giữa các khối
      term_en: Dependency chain of finance blocks
      definition: 'Thứ tự phụ thuộc chuẩn: m01 (TVM) -> m03 (cost of capital) -> m04 (cơ cấu vốn đích để chọn trọng số WACC, r_d phụ thuộc đòn bẩy) -> m02 (NPV với WACC) -> m06 (ΔNWC trong dòng tiền, CCC) -> m10 (FCFF, TV, equity) -> m09 (synergy, premium) -> m07 (hoàn vốn) -> m08/m11 VaR (rủi ro, stress).'
      why_it_matters: Agent phải tính theo thứ tự này; đảo thứ tự (ví dụ NPV trước khi biết WACC thật) sẽ cho kết luận sai.
  - id: "m11-concepts-3"
    title: "Khái niệm: Nguyên tắc nhất quán giữa dòng tiền và tỷ suất chiết khấu"
    tags: ["khái", "niệm", "nguyên", "tắc", "nhất", "quán", "giữa", "dòng", "tiền", "và", "tỷ", "suất"]
    text: |-
      term_vi: Nguyên tắc nhất quán giữa dòng tiền và tỷ suất chiết khấu
      term_en: Cash flow / discount rate consistency
      definition: Dòng tiền trước lãi vay (FCFF) chiết khấu bằng WACC; dòng tiền cho vốn chủ (FCFE) chiết khấu bằng r_e; dòng tiền danh nghĩa dùng tỷ suất danh nghĩa; thuế tính trên EBIT (lá chắn thuế đã nằm trong WACC, không tính hai lần).
      why_it_matters: 'Vi phạm nguyên tắc này là lỗi phổ biến nhất khiến NPV/EV lệch hàng chục phần trăm (Case 13: dùng lãi vay 11% làm tỷ suất chiết khấu khiến NPV +415,6 thay vì +194,9).'
  - id: "m11-concepts-4"
    title: "Khái niệm: Lợi nhuận không phải tiền mặt - tăng trưởng cần nguồn vốn"
    tags: ["khái", "niệm", "lợi", "nhuận", "không", "phải", "tiền", "mặt", "tăng", "trưởng", "cần", "nguồn"]
    text: |-
      term_vi: Lợi nhuận không phải tiền mặt - tăng trưởng cần nguồn vốn
      term_en: Profit is not cash; growth consumes capital
      definition: Tăng trưởng doanh thu làm tăng ΔNWC (tồn kho + phải thu - phải trả). Nếu ΔNWC vượt lợi nhuận giữ lại + hạn mức tín dụng thì doanh nghiệp vỡ nợ dù P&L lãi (overtrading).
      why_it_matters: 'Case 8 Home-Pro: lãi ròng 55,2 tỷ nhưng ΔNWC 221,1 tỷ; thiếu hụt tài trợ 165,9 tỷ, vượt hạn mức thấu chi 100 tỷ -> thiếu 65,9 tỷ.'
  - id: "m11-concepts-5"
    title: "Khái niệm: Giá trị thuộc về động cơ giá trị chứ không phải cơ cấu chia"
    tags: ["khái", "niệm", "giá", "trị", "thuộc", "về", "động", "cơ", "chứ", "không", "phải", "cấu"]
    text: |-
      term_vi: Giá trị thuộc về động cơ giá trị chứ không phải cơ cấu chia
      term_en: Value drivers vs. financing/payout (M&M logic)
      definition: Trong thị trường hoàn hảo, giá trị công ty do tài sản/dòng tiền quyết định; cơ cấu vốn và cổ tức chỉ chia chiếc bánh. Thuế, kiệt quệ tài chính, bất cân xứng thông tin mới tạo ra khác biệt thực.
      why_it_matters: 'Giúp agent hỏi đúng: ma sát nào (thuế, chi phí phá sản, tín hiệu) khiến quyết định này có giá trị? Nếu không có ma sát, đừng khẳng định lợi ích.'
  - id: "m11-concepts-6"
    title: "Khái niệm: Giá trị quyền chọn / linh hoạt quản lý"
    tags: ["khái", "niệm", "giá", "trị", "quyền", "chọn", "linh", "hoạt", "quản", "lý"]
    text: |-
      term_vi: Giá trị quyền chọn / linh hoạt quản lý
      term_en: Value of managerial flexibility (real options)
      definition: Quyền (không phải nghĩa vụ) trì hoãn/mở rộng/từ bỏ có giá trị dương, lớn nhất khi bất định cao và khi có thể chờ thông tin trước khi chi tiền không hoàn lại.
      why_it_matters: 'Case 1 GEC: NPV tích hợp +76,58 so với NPV tĩnh +8,79. Với SME: chạy thử/pop-up/thuê ngắn hạn trước khi ký hợp đồng 5 năm.'
  - id: "m11-concepts-7"
    title: "Khái niệm: Giá trị cuối kỳ là phần nguy hiểm nhất của định giá"
    tags: ["khái", "niệm", "giá", "trị", "cuối", "kỳ", "là", "phần", "nguy", "hiểm", "nhất", "của"]
    text: |-
      term_vi: Giá trị cuối kỳ là phần nguy hiểm nhất của định giá
      term_en: Terminal value dominance
      definition: TV thường chiếm 60-80% EV (S-Green 82,5%); kết quả nhạy với g và WACC theo hàm nghịch đảo (WACC - g), nên không đối xứng.
      why_it_matters: Phải trình bày khoảng giá trị, ma trận độ nhạy, và kiểm tra implied multiple/ROIC ngầm định (g = tỷ lệ tái đầu tư × ROIC).
  - id: "m11-concepts-8"
    title: "Khái niệm: Rủi ro định lượng: ngưỡng và đuôi"
    tags: ["khái", "niệm", "rủi", "ro", "định", "lượng", "ngưỡng", "và", "đuôi"]
    text: |-
      term_vi: 'Rủi ro định lượng: ngưỡng và đuôi'
      term_en: VaR, Expected Shortfall, Monte Carlo
      definition: 'VaR: tổn thất tối đa ở độ tin cậy α trong kỳ T. ES: trung bình tổn thất khi đã vượt VaR. Monte Carlo: gán phân phối cho nhiều biến đầu vào bất định, chạy hàng chục nghìn lần để ra phân phối NPV (xác suất NPV<0, P5, P95).'
      why_it_matters: JP Morgan phổ biến VaR đầu thập niên 1990 (RiskMetrics) theo yêu cầu "một con số cho biết hôm nay có thể mất bao nhiêu"; Basel dùng cho vốn dự phòng. VaR giả định chuẩn nên đánh giá thấp đuôi dày; ES bù điểm yếu "không biết mất bao nhiêu khi vượt ngưỡng". Monte Carlo (Ulam, von Neumann thập niên 1940; Hertz 1964 áp dụng cho thẩm định đầu tư) thay 3 kịch bản rời rạc bằng phân phối.
  - id: "m11-concepts-9"
    title: "Khái niệm: Chuẩn mực kế toán ảnh hưởng đầu vào định giá"
    tags: ["khái", "niệm", "chuẩn", "mực", "kế", "toán", "ảnh", "hưởng", "đầu", "vào", "định", "giá"]
    text: |-
      term_vi: Chuẩn mực kế toán ảnh hưởng đầu vào định giá
      term_en: IFRS 15 and IFRS 16 impact
      definition: 'IFRS 15: phân bổ giá hợp đồng theo giá bán độc lập cho từng nghĩa vụ thực hiện, ghi nhận khi hoàn thành. IFRS 16: thuê >12 tháng ghi ROU asset + lease liability (PV các khoản thuê). VN: Quyết định 345/QĐ-BTC (2020) lộ trình áp dụng IFRS (cần xác nhận hiệu lực/lộ trình hiện hành).'
      why_it_matters: IFRS 15 đổi thời điểm doanh thu/EBIT/thuế nhưng không đổi tiền thu - phải chỉnh ΔNWC (deferred revenue) khi dự phóng FCFF. IFRS 16 làm EBITDA tăng, nợ tăng, D/E tăng, Beta và WACC dịch chuyển; không so bội số EV/EBITDA giữa công ty có/không IFRS 16 mà chưa điều chỉnh.
  - id: "m11-concepts-10"
    title: "Khái niệm: Tính nhất quán số liệu"
    tags: ["khái", "niệm", "tính", "nhất", "quán", "số", "liệu"]
    text: |-
      term_vi: Tính nhất quán số liệu
      term_en: Numerical consistency discipline
      definition: 'Mọi case tự tạo phải tự khớp: Assets = Liabilities + Equity, dòng tiền khớp thay đổi tiền mặt, EBIT = Doanh thu - OpEx - Khấu hao, FCFF cộng đúng; chạy Python/Excel trước khi báo cáo.'
      why_it_matters: 'Quy ước chất lượng của knowledge base: không bịa số liệu không khớp phép tính.'
  - id: "m11-formulas-1"
    title: "Công thức: m11_var_parametric — Giá trị chịu rủi ro tham số (VaR)"
    tags: ["công", "thức", "m11_var_parametric", "giá", "trị", "chịu", "rủi", "ro", "tham", "số", "var"]
    text: |-
      id: m11_var_parametric
      name_vi: Giá trị chịu rủi ro tham số (VaR)
      name_en: Parametric Value at Risk
      expression_latex: VaR_{\alpha}(T) = V_p \times \left(z_{\alpha}\,\sigma_T - \mu_T\right),\quad \sigma_T=\sigma\sqrt{T},\ \mu_T=\mu T
      expression_python: Vp*(z*sigma*T**0.5 - mu*T)
      excel: =Vp*(NORM.S.INV(alpha)*sigma*SQRT(T)-mu*T)
      variables:
      - symbol: Vp
        meaning: Giá trị danh mục
        unit: tiền
      - symbol: z
        meaning: Giá trị tới hạn chuẩn tắc (1,645 cho 95%; 2,326 cho 99%)
        unit: đơn vị độ lệch chuẩn
      - symbol: sigma
        meaning: Độ lệch chuẩn lợi suất 1 ngày
        unit: tỷ lệ/ngày
      - symbol: mu
        meaning: Lợi suất kỳ vọng 1 ngày
        unit: tỷ lệ/ngày
      - symbol: T
        meaning: Số ngày nắm giữ
        unit: ngày
      when_to_use: Cần một con số tổn thất tối đa ở độ tin cậy cho trước (danh mục chứng khoán, vốn dự phòng); giả định lợi suất xấp xỉ phân phối chuẩn.
      why_it_works: Với phân phối chuẩn, lợi suất xấu nhất ở xác suất (1-α) nằm cách trung bình z độ lệch chuẩn. Nhân với giá trị danh mục ra tổn thất tiền. σ tăng theo căn bậc hai thời gian (các ngày độc lập), μ tăng tuyến tính nên VaR 10 ngày không bằng 10 × VaR 1 ngày.
      assumptions:
      - Lợi suất phân phối chuẩn, độc lập theo thời gian
      - Danh mục không đổi trong T ngày
      - σ ổn định (lấy từ dữ liệu quá khứ)
      pitfalls:
      - 'Đánh giá thấp đuôi dày (khủng hoảng 2008): VaR 99% có thể sai rất lớn.'
      - VaR là ngưỡng, không cho biết tổn thất khi vượt ngưỡng (dùng ES).
      - Nhập μ dương làm VaR nhỏ đi; nhiều nơi dùng μ=0 cho thận trọng. Nêu rõ lựa chọn.
      - Quên đổi σ, μ về cùng đơn vị thời gian với T.
      interpretation: VaR95 1 ngày = 182.400 USD nghĩa là 95% số ngày tổn thất không vượt ngưỡng này; 5% số ngày xấu nhất sẽ vượt.
      example:
        inputs:
          Vp: 10000000
          mu: 0.0015
          sigma: 0.012
          z95: 1.645
          z99: 2.326
          T_long: 10
        steps:
        - VaR95 1 ngày = 10.000.000 × (1,645×0,012 - 0,0015) = 10.000.000 × 0,01824 = 182.400
        - VaR99 1 ngày = 10.000.000 × (2,326×0,012 - 0,0015) = 264.120
        - 'VaR95 10 ngày: σ10 = 0,012×√10 = 3,795%; μ10 = 1,5%; VaR = 10.000.000 × (1,645×0,03795 - 0,015) = 474.234 (làm tròn 474.233,6)'
        result: 182.400 / 264.120 / 474.234 USD
  - id: "m11-formulas-2"
    title: "Công thức: m11_expected_shortfall — Tổn thất kỳ vọng vượt ngưỡng (ES / CVaR)"
    tags: ["công", "thức", "m11_expected_shortfall", "tổn", "thất", "kỳ", "vọng", "vượt", "ngưỡng", "es", "cvar"]
    text: |-
      id: m11_expected_shortfall
      name_vi: Tổn thất kỳ vọng vượt ngưỡng (ES / CVaR)
      name_en: Expected Shortfall (Conditional VaR), normal
      expression_latex: ES_{\alpha} = V_p \times \left(\sigma \frac{\phi(z_{\alpha})}{1-\alpha} - \mu\right)
      expression_python: 'Vp*(sigma*phi/(1-alpha) - mu)  # phi = norm.pdf(z)'
      excel: =Vp*(sigma*NORM.S.DIST(z,FALSE)/(1-alpha)-mu)
      variables:
      - symbol: phi
        meaning: Hàm mật độ chuẩn tắc tại z (phi(1,645) = 0,1031)
        unit: '-'
      - symbol: alpha
        meaning: Độ tin cậy (0,95)
        unit: '-'
      - symbol: sigma, mu, Vp
        meaning: Như VaR (cùng kỳ)
        unit: '-'
      when_to_use: Cần biết tổn thất trung bình trong những ngày tồi tệ nhất (đuôi), quy định hiện đại ưa dùng hơn VaR.
      why_it_works: VaR chỉ là điểm cắt; ES lấy trung bình toàn bộ phần đuôi vượt điểm cắt nên nhạy với độ dày đuôi và là thước đo rủi ro nhất quán (coherent).
      assumptions:
      - Phân phối chuẩn (công thức đóng); với phân phối thực dùng lịch sử/mô phỏng
      pitfalls:
      - 'Làm tròn phi quá sớm: dùng phi=0,1031 cho 232.440; công thức nguồn ghi 232.466 do làm tròn khác - sai khác nhỏ, ghi rõ khi trích.'
      - ES luôn lớn hơn VaR cùng α; nếu ES < VaR là tính sai.
      interpretation: 'ES95 ≈ 232.440 USD > VaR95 182.400: trong 5% ngày xấu nhất, mất trung bình khoảng 232 nghìn USD.'
      example:
        inputs:
          Vp: 10000000
          mu: 0.0015
          sigma: 0.012
          phi: 0.1031
          alpha: 0.95
        steps:
        - ES = 10.000.000 × (0,012×0,1031/0,05 - 0,0015) = 10.000.000 × (0,024744 - 0,0015) = 232.440
        result: 232.440 USD (nguồn ghi 232.466; chênh do làm tròn)
  - id: "m11-formulas-3"
    title: "Công thức: m11_monte_carlo_npv_prob — Xác suất NPV âm (giải tích & mô phỏng Monte Carlo)"
    tags: ["công", "thức", "m11_monte_carlo_npv_prob", "xác", "suất", "npv", "âm", "giải", "tích", "mô", "phỏng", "monte"]
    text: |-
      id: m11_monte_carlo_npv_prob
      name_vi: Xác suất NPV âm (giải tích & mô phỏng Monte Carlo)
      name_en: Probability of negative NPV (analytic and Monte Carlo)
      expression_latex: P(NPV<0)=\Phi\!\left(-\frac{NPV_{base}}{\sigma_k\,\cdot\,\partial NPV/\partial k}\right),\quad NPV(k)=NPV_0+k\cdot S
      expression_python: 'norm.cdf(-npv_base/(sens_per_unit_k*sigma_k))  # hoặc (npv_mc<0).mean()'
      excel: =NORM.S.DIST(-NPV_base/(slope*sigma_k),TRUE)
      variables:
      - symbol: NPV_base
        meaning: NPV kịch bản cơ sở (k = 1)
        unit: tiền
      - symbol: slope
        meaning: Độ nhạy NPV theo hệ số doanh thu k (NPV(1)-NPV(0))
        unit: tiền/1,0 k
      - symbol: sigma_k
        meaning: Độ lệch chuẩn của doanh thu so với kế hoạch
        unit: tỷ lệ
      when_to_use: Một biến đầu vào chi phối NPV (doanh thu) và NPV gần tuyến tính theo biến đó; muốn nói được 'xác suất lỗ' thay vì 3 kịch bản.
      why_it_works: Nếu k ~ Chuẩn(1, σ_k) và NPV tuyến tính theo k, NPV cũng chuẩn; xác suất NPV<0 là xác suất k vượt dưới điểm hòa vốn (1 - NPV_base/slope). Monte Carlo tổng quát hóa cho nhiều biến, phi tuyến.
      assumptions:
      - Phân phối của doanh thu chuẩn quanh kế hoạch
      - Các biến khác cố định (hoặc gán phân phối riêng)
      - Có thuế sàn (EBIT âm không có lá chắn thuế) làm NPV hơi phi tuyến ở vùng xấu
      pitfalls:
      - Phân phối chuẩn có thể cho k<0; cắt hoặc dùng log-normal.
      - Không tính tương quan giữa các biến đầu vào.
      - Seed khác -> số liệu khác nhẹ; báo cáo kèm seed và số lần chạy.
      interpretation: 'Case 13: NPV base +194,9, slope xấp xỉ 3.250 (mỗi 1% doanh thu ≈ 32 triệu), σ_k=10% -> xác suất NPV<0 ≈ 27%.'
      example:
        inputs:
          npv_base: 194.85
          slope: 3200
          note: slope xấp xỉ 32 triệu/1% doanh thu, tuyến tính gần đúng (xem kết quả verify)
          sigma_k: 0.1
        steps:
        - 'Hòa vốn: k* = 0,9391 (doanh thu thấp hơn kế hoạch 6,1%)'
        - z = (0,9391 - 1)/0,10 = -0,609; Φ(-0,609) ≈ 27,1% (giải tích)
        - 'Monte Carlo 20.000 lần, seed 42, σ=10%: NPV TB ≈ +196; SD ≈ 322; P5 ≈ -332; P95 ≈ +730; P(NPV<0) ≈ 26,9%'
        result: 'Khoảng 27% xác suất NPV âm (nguồn: TB +195,9, SD 322,9, P5 -333,6, P95 +729,6; kiểm lại: +196,5, 321,6, -331,4, +729,6)'
  - id: "m11-formulas-4"
    title: "Công thức: m11_dscr — Hệ số khả năng trả nợ (DSCR)"
    tags: ["công", "thức", "m11_dscr", "hệ", "số", "khả", "năng", "trả", "nợ", "dscr"]
    text: |-
      id: m11_dscr
      name_vi: Hệ số khả năng trả nợ (DSCR)
      name_en: Debt Service Coverage Ratio
      expression_latex: DSCR_t=\frac{EBITDA_t - Tax_t}{Principal_t + Interest_t}
      expression_python: (ebitda - tax)/(principal + interest)
      excel: =(EBITDA-Thue)/(Goc+Lai)
      variables:
      - symbol: EBITDA
        meaning: Lợi nhuận trước lãi, thuế, khấu hao
        unit: tiền
      - symbol: Tax
        meaning: Thuế TNDN thực nộp
        unit: tiền
      - symbol: Principal+Interest
        meaning: Nghĩa vụ trả nợ trong năm (annuity payment)
        unit: tiền
      when_to_use: Thẩm định khả năng trả nợ của dự án vay vốn (ngân hàng, SME); thường kèm ICR.
      why_it_works: Ngân hàng cần tiền thực để trả gốc + lãi, không phải lợi nhuận kế toán. Dòng tiền khả dụng cho nợ = EBITDA trừ thuế (chưa trừ capex/vốn lưu động trong biến thể đơn giản).
      assumptions:
      - Capex duy trì và ΔNWC nhỏ/bỏ qua trong biến thể này
      - Nghĩa vụ trả nợ theo annuity đều
      pitfalls:
      - 'Công thức này lạc quan hơn nếu capex duy trì lớn: dùng CFADS (sau capex, ΔNWC) khi cần chặt.'
      - Chỉ xét DSCR năm trung bình mà bỏ qua năm đầu (EBITDA thấp nhất).
      - Quên tính tiền thuê vào chi phí hoạt động (EBITDA đã trừ rent).
      interpretation: 'DSCR > 1,5 thường được ngân hàng chấp nhận (cần xác nhận chính sách từng ngân hàng); < 1,0 không đủ trả nợ. Case 13: năm 1 = 2,11; năm 5 = 3,10.'
      example:
        inputs:
          loan: 840
          r: 0.11
          n: 5
          ebitda_y1: 510.0
          tax_y1: 30.0
        steps:
        - Annuity payment = 840/PVIFA(11%,5) = 840/3,6959 = 227,28
        - DSCR năm 1 = (510,0 - 30,0)/227,28 = 2,11
        result: 'DSCR năm 1 = 2,11; qua 5 năm: 2,11; 2,58; 2,85; 3,01; 3,10'
  - id: "m11-formulas-5"
    title: "Công thức: m11_level_payment — Khoản trả nợ đều hằng kỳ (annuity loan payment)"
    tags: ["công", "thức", "m11_level_payment", "khoản", "trả", "nợ", "đều", "hằng", "kỳ", "annuity", "loan", "payment"]
    text: |-
      id: m11_level_payment
      name_vi: Khoản trả nợ đều hằng kỳ (annuity loan payment)
      name_en: Level loan payment
      expression_latex: PMT = \frac{L\,r}{1-(1+r)^{-n}} = \frac{L}{PVIFA(r,n)}
      expression_python: L*r/(1-(1+r)**-n)
      excel: =-PMT(r,n,L)
      variables:
      - symbol: L
        meaning: Số tiền vay
        unit: tiền
      - symbol: r
        meaning: Lãi suất theo kỳ
        unit: tỷ lệ
      - symbol: n
        meaning: Số kỳ trả
        unit: kỳ
      when_to_use: Lập lịch trả nợ để tính lãi, gốc, dư nợ và DSCR.
      why_it_works: 'Đảo ngược công thức PV của annuity (m01): PV khoản vay = PMT × PVIFA. Mỗi kỳ lãi = dư nợ đầu kỳ × r; gốc = PMT - lãi.'
      assumptions:
      - Lãi cố định, trả cuối kỳ
      pitfalls:
      - Lãi thả nổi thay đổi PMT
      - Nhầm lãi tháng với lãi năm
      interpretation: Dùng để dựng bảng lịch trả nợ và kiểm tra dư nợ cuối cùng = 0.
      example:
        inputs:
          L: 840
          r: 0.11
          n: 5
        steps:
        - PMT = 840/3,6959 = 227,28
        - 'Năm 1: lãi 92,4; gốc 134,9; dư nợ 705,1'
        - 'Năm 5: gốc 204,8; dư nợ 0'
        result: 227,28 triệu VNĐ/năm
  - id: "m11-formulas-6"
    title: "Công thức: m11_interest_coverage — Hệ số bao phủ lãi vay (ICR) và đòn bẩy EBIT"
    tags: ["công", "thức", "m11_interest_coverage", "hệ", "số", "bao", "phủ", "lãi", "vay", "icr", "và", "đòn"]
    text: |-
      id: m11_interest_coverage
      name_vi: Hệ số bao phủ lãi vay (ICR) và đòn bẩy EBIT
      name_en: Interest coverage and debt/EBIT
      expression_latex: ICR=\frac{EBIT}{Interest},\qquad Leverage=\frac{D}{EBIT}
      expression_python: ebit/(D*rd), D/ebit
      excel: =EBIT/(D*rd)
      variables:
      - symbol: EBIT
        meaning: Lợi nhuận trước lãi và thuế
        unit: tiền/năm
      - symbol: D
        meaning: Dư nợ
        unit: tiền
      - symbol: rd
        meaning: Lãi suất nợ
        unit: tỷ lệ
      when_to_use: Kiểm tra lãi vay có an toàn, lá chắn thuế còn tồn tại không, đánh giá kiệt quệ tài chính.
      why_it_works: Lá chắn thuế chỉ có giá trị khi EBIT đủ lớn để khấu trừ lãi; ICR<1 nghĩa là EBT âm, lá chắn thuế mất và phải bù lãi bằng bán tài sản/vay mới.
      assumptions:
      - EBIT ổn định (với EBIT biến động mạnh cần ngưỡng cao hơn)
      pitfalls:
      - Lãi suất cao nhưng chỉ nhìn ICR trung bình, bỏ qua nợ ngắn hạn đáo hạn (refinancing risk).
      - Dùng ICR danh nghĩa bỏ qua gốc phải trả - dùng thêm DSCR.
      interpretation: 'ICR an toàn thường > 2,5-3 lần. Ever-G: ICR 1,59 (9%), 1,19 (12%), 0,65 (22%).'
      example:
        inputs:
          EBIT: 500
          D: 3500
          rd: 0.22
        steps:
        - Lãi = 3.500×22% = 770; EBT = 500-770 = -270; ICR = 500/770 = 0,65
        - D/EBIT = 3.500/500 = 7,0 lần
        result: 'ICR 0,65 < 1: không bao phủ được lãi'
  - id: "m11-formulas-7"
    title: "Công thức: m11_baumol_bat — Lượng tiền mặt rút tối ưu Baumol-Allais-Tobin (BAT)"
    tags: ["công", "thức", "m11_baumol_bat", "lượng", "tiền", "mặt", "rút", "tối", "ưu", "baumol", "allais", "tobin"]
    text: |-
      id: m11_baumol_bat
      name_vi: Lượng tiền mặt rút tối ưu Baumol-Allais-Tobin (BAT)
      name_en: Baumol-Allais-Tobin cash model
      expression_latex: C^{*}=\sqrt{\frac{2\,T\,F}{r}}
      expression_python: (2*T*F/r)**0.5
      excel: =SQRT(2*T*F/r)
      variables:
      - symbol: T
        meaning: Tổng nhu cầu tiền mặt cả kỳ
        unit: tiền
      - symbol: F
        meaning: Chi phí cố định mỗi lần chuyển đổi chứng khoán/tiết kiệm sang tiền
        unit: tiền/lần
      - symbol: r
        meaning: Lãi suất cơ hội (lãi gửi/chứng khoán ngắn hạn)
        unit: tỷ lệ/năm
      when_to_use: Chi tiêu tiền mặt đều đặn, ổn định; cần quyết định mỗi lần rút bao nhiêu từ tài khoản sinh lãi.
      why_it_works: 'Giống EOQ: tiền mặt là hàng tồn kho. Rút nhiều lần giảm tiền nhàn rỗi mất lãi nhưng tốn phí giao dịch; tối ưu khi chi phí giao dịch = chi phí cơ hội. Baumol (1952), Tobin (1956).'
      assumptions:
      - Dòng chi đều tuyến tính
      - Không có thu nhập tiền mặt ngẫu nhiên
      - F và r hằng số
      pitfalls:
      - Dòng tiền biến động ngẫu nhiên -> dùng Miller-Orr.
      - Đơn vị r (năm) phải khớp T (năm).
      interpretation: Tại tối ưu, phí giao dịch = chi phí cơ hội = 4,24 triệu, tổng 8,49 triệu/năm (ví dụ SME).
      example:
        inputs:
          T: 1200
          F: 0.5
          r: 0.06
        steps:
        - C* = √(2×1.200×0,5/0,06) = √20.000 = 141,42
        - Số lần = 1.200/141,42 = 8,49 lần/năm
        - Phí giao dịch = 8,49×0,5 = 4,24; chi phí cơ hội = 141,42/2×6% = 4,24
        result: C* = 141,4 triệu VNĐ mỗi lần; tổng chi phí tối thiểu 8,49 triệu/năm
  - id: "m11-formulas-8"
    title: "Công thức: m11_miller_orr — Mô hình tiền mặt Miller-Orr (sàn-điểm quay về-trần)"
    tags: ["công", "thức", "m11_miller_orr", "mô", "hình", "tiền", "mặt", "miller", "orr", "sàn", "điểm", "quay"]
    text: |-
      id: m11_miller_orr
      name_vi: Mô hình tiền mặt Miller-Orr (sàn-điểm quay về-trần)
      name_en: Miller-Orr cash management model
      expression_latex: spread = 3\left(\frac{3F\sigma^{2}}{4r}\right)^{1/3},\quad Z=L+\frac{spread}{3},\quad H=L+spread
      expression_python: sp=3*(3*F*var/(4*r_daily))**(1/3); Z=L+sp/3; H=L+sp
      excel: =3*(3*F*sigma^2/(4*r_ngay))^(1/3)
      variables:
      - symbol: L
        meaning: Mức sàn an toàn do doanh nghiệp đặt
        unit: tiền
      - symbol: F
        meaning: Chi phí mỗi lần giao dịch
        unit: tiền/lần
      - symbol: sigma^2
        meaning: Phương sai dòng tiền ròng hằng ngày
        unit: tiền^2
      - symbol: r_daily
        meaning: Lãi suất cơ hội theo ngày
        unit: tỷ lệ/ngày
      - symbol: Z, H
        meaning: Điểm quay về và mức trần
        unit: tiền
      when_to_use: 'Dòng tiền ròng ngày dao động ngẫu nhiên; cần quy tắc tự động: chạm trần mua chứng khoán, chạm sàn bán.'
      why_it_works: 'Miller và Orr (1966) mở rộng BAT cho dòng tiền ngẫu nhiên: biến động σ lớn cần dải rộng hơn (spread tỷ lệ σ^{2/3}); phí F cao cũng làm dải rộng hơn; lãi suất r cao làm dải hẹp lại.'
      assumptions:
      - Dòng tiền ngày độc lập, phân phối đối xứng
      - Khoản chuyển đổi tức thì
      pitfalls:
      - 'Công thức nguồn spread = 115,48 (làm tròn cube root 38,49): Z = L + spread/3 = 48,49; H = 125,48.'
      - Dùng r năm thay r ngày sẽ sai hàng chục lần.
      interpretation: Giữ số dư trong dải [L,H]; chạm H -> mua chứng khoán về Z; chạm L -> bán về Z.
      example:
        inputs:
          L: 10
          F: 0.5
          sigma: 5
          r_annual: 0.06
        steps:
        - r ngày = 0,06/365 = 0,000164
        - Cube root = (3×0,5×25/(4×0,000164))^{1/3} = 38,49 -> spread = 115,48
        - Z = 10+38,49 = 48,49; H = 10+115,48 = 125,48
        result: Z = 48,49 triệu; H = 125,48 triệu (sàn 10)
  - id: "m11-formulas-9"
    title: "Công thức: m11_real_option_delay — Giá trị quyền chọn trì hoãn đầu tư (2 kịch bản)"
    tags: ["công", "thức", "m11_real_option_delay", "giá", "trị", "quyền", "chọn", "trì", "hoãn", "đầu", "tư", "kịch"]
    text: |-
      id: m11_real_option_delay
      name_vi: Giá trị quyền chọn trì hoãn đầu tư (2 kịch bản)
      name_en: Option to delay (two-state)
      expression_latex: NPV_{int}=-Fee+\frac{p\max(PV_H-I,0)+(1-p)\max(PV_L-I,0)}{(1+r)^{t}},\quad Option=NPV_{int}-NPV_{static},\ p^{*}=\frac{I-PV_L}{PV_H-PV_L}
      expression_python: -fee + (p*max(PVH-I,0)+(1-p)*max(PVL-I,0))/(1+r)**t
      excel: =-fee+(p*MAX(PVH-I,0)+(1-p)*MAX(PVL-I,0))/(1+r)^t
      variables:
      - symbol: I
        meaning: Vốn đầu tư (tại thời điểm cam kết)
        unit: tiền
      - symbol: PV_H, PV_L
        meaning: PV dòng tiền ở kịch bản tốt/xấu
        unit: tiền
      - symbol: p
        meaning: Xác suất kịch bản tốt
        unit: '-'
      - symbol: Fee, t
        meaning: Phí mua quyền và thời gian chờ
        unit: tiền, năm
      when_to_use: Dự án lớn có bất định chính sách/thị trường được giải quyết sau thời gian chờ, có thể trả phí nhỏ để giữ quyền.
      why_it_works: Chờ thông tin rồi chỉ đầu tư khi NPV>0 cắt bỏ phía xấu (max(.,0)) nhưng giữ phía tốt, giống call option (Black-Scholes 1973; Myers 1977 đặt tên real options).
      assumptions:
      - Bất định giải quyết hoàn toàn sau t
      - Không mất cơ hội vì đối thủ/luật thay đổi (mô hình cho bằng 0)
      - Chiết khấu bằng WACC (đơn giản hóa)
      pitfalls:
      - Bỏ qua chi phí chờ đợi (2 năm doanh thu), rủi ro đối thủ chiếm khu vực.
      - Quyền chọn mất giá trị khi gần chắc chắn kịch bản tốt (p->1).
      interpretation: 'GEC: NPV tĩnh +8,79; tích hợp +76,58; giá trị quyền = 67,79; phí tối đa hợp lý = 82,79 (phí thực 15).'
      example:
        inputs:
          I: 800
          PVH: 1021.63
          PVL: 595.95
          p: 0.5
          fee: 15
          r: 0.1
          t: 2
        steps:
        - NPV_H=+221,63; NPV_L=-204,05; NPV tĩnh=+8,79; p*=47,9%
        - E[NPV năm 2]=0,5×221,63+0,5×0=110,81; PV=110,81/1,21=91,58
        - NPV tích hợp = -15+91,58 = 76,58
        result: Quyền chọn có giá trị ròng 67,79 triệu USD
  - id: "m11-formulas-10"
    title: "Công thức: m11_ifrs15_allocation — Phân bổ giá hợp đồng theo giá bán độc lập (IFRS 15)"
    tags: ["công", "thức", "m11_ifrs15_allocation", "phân", "bổ", "giá", "hợp", "đồng", "theo", "bán", "độc", "lập"]
    text: |-
      id: m11_ifrs15_allocation
      name_vi: Phân bổ giá hợp đồng theo giá bán độc lập (IFRS 15)
      name_en: IFRS 15 transaction price allocation
      expression_latex: Alloc_i = Price_{contract}\times\frac{SSP_i}{\sum_j SSP_j}
      expression_python: price*ssp_i/sum(ssp)
      excel: =Gia_HD*SSP_i/SUM(SSP)
      variables:
      - symbol: Price_contract
        meaning: Giá hợp đồng
        unit: tiền
      - symbol: SSP_i
        meaning: Giá bán độc lập của nghĩa vụ i
        unit: tiền
      when_to_use: Hợp đồng gói nhiều hạng mục (hàng + dịch vụ bảo trì) khi dự phóng doanh thu/FCFF theo chuẩn IFRS.
      why_it_works: 'Ngăn ghi nhận sớm: mỗi nghĩa vụ thực hiện nhận phần doanh thu tỷ lệ với giá bán độc lập và được ghi nhận khi hoàn thành. Phần chưa hoàn thành thành doanh thu chưa thực hiện (deferred revenue).'
      assumptions:
      - Có SSP quan sát được/ước tính hợp lý
      - Mô hình 5 bước của IFRS 15
      pitfalls:
      - Tiền mặt không đổi nhưng doanh thu/EBIT/thuế năm 1 thấp hơn; phải điều chỉnh ΔNWC (deferred revenue) trong FCFF để dòng tiền không méo.
      interpretation: 'Hợp đồng 120 (máy SSP 100 + bảo trì 3 năm SSP 50): máy 80, bảo trì 40 (13,33/năm); doanh thu năm 1 = 93,33 thay vì 120; deferred 26,67.'
      example:
        inputs:
          price: 120
          ssp_machine: 100
          ssp_maint: 50
        steps:
        - Máy = 120×100/150 = 80
        - Bảo trì = 120×50/150 = 40 (13,33/năm)
        - Năm 1 = 80+13,33 = 93,33; deferred = 26,67
        result: 'Doanh thu năm 1: 93,33 triệu VNĐ (vs 120 theo cách cũ)'
  - id: "m11-formulas-11"
    title: "Công thức: m11_ifrs16_lease — Nợ thuê tài sản theo IFRS 16"
    tags: ["công", "thức", "m11_ifrs16_lease", "nợ", "thuê", "tài", "sản", "theo", "ifrs", "16"]
    text: |-
      id: m11_ifrs16_lease
      name_vi: Nợ thuê tài sản theo IFRS 16
      name_en: IFRS 16 lease liability and expense profile
      expression_latex: Lease\ Liability_0 = PMT\times PVIFA(r,n);\quad Interest_1=Liab_0\,r;\quad Dep_{ROU}=\frac{Liab_0}{n}
      expression_python: liab=pmt*(1-(1+r)**-n)/r; interest1=liab*r; dep=liab/n
      excel: =PMT_thue*(1-(1+r)^-n)/r
      variables:
      - symbol: PMT
        meaning: Tiền thuê hằng năm
        unit: tiền/năm
      - symbol: r
        meaning: Lãi suất chiết khấu thuê (incremental borrowing rate)
        unit: tỷ lệ
      - symbol: n
        meaning: Thời hạn thuê
        unit: năm
      when_to_use: 'Doanh nghiệp thuê nhiều (bán lẻ, F&B, hàng không): điều chỉnh EBITDA, nợ, D/E, WACC, EV bridge khi so sánh giữa các công ty.'
      why_it_works: Thuê dài hạn thực chất là mua tài sản bằng nợ; ghi nhận ROU + nợ thuê làm bảng cân đối phản ánh đòn bẩy thật, tiền thuê chuyển từ OpEx sang khấu hao + lãi.
      assumptions:
      - Thuê > 12 tháng
      - Chi phí vay biên chiết khấu hợp lý
      pitfalls:
      - EBITDA tăng đúng bằng tiền thuê (+10) nhưng tiền mặt không đổi; không so EV/EBITDA giữa công ty áp dụng/không áp dụng.
      - Nếu EV gồm nợ thuê, phải trừ nợ thuê khi sang Equity Value.
      - Chi phí năm đầu (lãi+khấu hao) cao hơn tiền thuê (front-loaded).
      interpretation: 'Thuê 10/năm × 5 năm @8%: nợ thuê 39,93; năm 1 lãi 3,19 + khấu hao 7,99 = 11,18 > 10; EBIT tăng 2,01.'
      example:
        inputs:
          pmt: 10
          r: 0.08
          n: 5
        steps:
        - Liab = 10×3,9927 = 39,93
        - Lãi năm 1 = 39,93×8% = 3,19; Dep = 39,93/5 = 7,99; tổng 11,18
        - EBITDA +10; EBIT +2,01 (=10-7,99)
        result: Nợ thuê 39,93 triệu USD; D/E tăng, WACC dịch chuyển
  - id: "m11-formulas-12"
    title: "Công thức: m11_eps_accretion — EPS sau thâu tóm bằng cổ phiếu (accretion/dilution)"
    tags: ["công", "thức", "m11_eps_accretion", "eps", "sau", "thâu", "tóm", "bằng", "cổ", "phiếu", "accretion", "dilution"]
    text: |-
      id: m11_eps_accretion
      name_vi: EPS sau thâu tóm bằng cổ phiếu (accretion/dilution)
      name_en: Post-merger EPS accretion/dilution
      expression_latex: EPS_{pro}=\frac{NI_A+NI_B+Syn_{AT}}{N_A+\frac{Price}{P_A}},\quad Accretive\iff EPS_{pro}>EPS_A
      expression_python: (NI_A+NI_B+syn)/(N_A+price/P_A)
      excel: =(NI_A+NI_B+Syn)/(N_A+Gia_tra/P_A)
      variables:
      - symbol: NI_A, NI_B
        meaning: Lợi nhuận ròng bên mua/mục tiêu
        unit: tiền
      - symbol: Syn_AT
        meaning: Synergy sau thuế hằng năm
        unit: tiền/năm
      - symbol: N_A
        meaning: Cổ phiếu hiện hành bên mua
        unit: cổ phiếu
      - symbol: Price, P_A
        meaning: Giá trả cho mục tiêu và giá cổ phiếu bên mua
        unit: tiền
      when_to_use: Thương vụ trả bằng cổ phiếu; cần biết EPS bị pha loãng hay tăng và ai gánh rủi ro synergy.
      why_it_works: EPS tăng nếu P/E bên mua cao hơn P/E trả (cổ phiếu đắt đổi lấy lợi nhuận rẻ). Accretion cơ học không bằng tạo giá trị; giá trị = synergy - premium.
      assumptions:
      - Giá cổ phiếu bên mua không đổi khi phát hành
      - Synergy thực hiện đầy đủ ngay
      pitfalls:
      - EPS dilutive có thể vẫn tạo giá trị nếu synergy lớn; ngược lại accretive vẫn có thể phá giá trị nếu premium > synergy.
      - Chi phí tích hợp, nhân sự rời đi chưa trừ.
      interpretation: 'Bev-Co: không synergy EPS 0,990 (-0,97%, dilutive); có synergy 20 -> 1,039 (+3,86%, accretive). Trả bằng cổ phiếu chia sẻ rủi ro synergy với cổ đông mục tiêu.'
      example:
        inputs:
          NI_A: 400
          NI_B: 10
          syn: 20
          N_A: 400
          price: 280
          P_A: 20
        steps:
        - Cổ phiếu mới = 280/20 = 14 -> tổng 414
        - EPS không synergy = 410/414 = 0,9903; có synergy = 430/414 = 1,0386
        - Giá trị/cổ phiếu hợp nhất = 8.400/414 = 20,29; cổ đông cũ +115,9, cổ đông Tea-Pro +84,1 (tổng 200)
        result: -0,97% (dilutive) -> +3,86% (accretive)
  - id: "m11-formulas-13"
    title: "Công thức: m11_ex_dividend_buyback — So sánh cổ tức và mua lại cổ phiếu theo giá trị nội tại"
    tags: ["công", "thức", "m11_ex_dividend_buyback", "so", "sánh", "cổ", "tức", "và", "mua", "lại", "phiếu", "theo"]
    text: |-
      id: m11_ex_dividend_buyback
      name_vi: So sánh cổ tức và mua lại cổ phiếu theo giá trị nội tại
      name_en: 'Dividend vs buyback: intrinsic value per remaining share'
      expression_latex: IV_{after}=\frac{V_{equity}-Cash_{paid}}{N-\frac{Cash_{paid}}{P_{buy}}},\quad P_{ex}=P_0-DPS
      expression_python: (V-cash)/(N-cash/Pbuy)
      excel: =(V-Cash)/(N-Cash/Pbuy)
      variables:
      - symbol: V
        meaning: Giá trị nội tại vốn chủ trước hoàn vốn (gồm tiền dư)
        unit: tiền
      - symbol: Cash_paid
        meaning: Tiền dùng hoàn vốn
        unit: tiền
      - symbol: P_buy
        meaning: Giá mua lại
        unit: tiền/cp
      - symbol: N
        meaning: Cổ phiếu lưu hành
        unit: cổ phiếu
      when_to_use: Có tiền dư không có dự án NPV>0 và phải chọn hình thức hoàn vốn.
      why_it_works: Cổ đông ở lại chỉ có lợi nếu giá mua < nội tại, vì phần chênh được chuyển từ người bán sang người ở lại. Cổ tức trung tính về giá trị trước thuế (P_ex = P0 - DPS) nhưng bị đánh thuế ngay.
      assumptions:
      - Giá trị nội tại ước tính được
      - Không bất cân xứng thông tin về tín hiệu
      pitfalls:
      - EPS tăng cơ học không chứng minh tạo giá trị; mua lại giá cao (55 vs nội tại 45) phá 0,34 USD/cp.
      - Thuế cổ tức 10% làm mất 0,18/cp (đầu vào giả định).
      interpretation: 'C-Pharma: buy 36 -> nội tại 45,47 (+0,47); buy 45 -> 45,00 (0); buy 55 -> 44,66 (-0,34). EPS 2,00 -> 2,105 (+5,26%); giá P/E 18x -> 37,89.'
      example:
        inputs:
          V: 4500
          cash: 180
          N: 100
        steps:
        - Còn lại giá trị = 4.500-180 = 4.320
        - 'P=36: mua 5,00tr -> 95tr cp -> 45,47'
        - 'P=45: 96tr -> 45,00; P=55: 96,73tr -> 44,66'
        - 'Cổ tức 1,80/cp: P_ex = 34,20; sau thuế 10% tổng 35,82 (mất 0,18)'
        result: Mua lại chỉ tạo giá trị khi P_buy < giá trị nội tại
  - id: "m11-formulas-14"
    title: "Công thức: m11_tv_implied_roic — Kiểm tra TV: bội số ngầm định và ROIC ngầm định"
    tags: ["công", "thức", "m11_tv_implied_roic", "kiểm", "tra", "tv", "bội", "số", "ngầm", "định", "và", "roic"]
    text: |-
      id: m11_tv_implied_roic
      name_vi: 'Kiểm tra TV: bội số ngầm định và ROIC ngầm định'
      name_en: 'Terminal value sanity: implied multiple and implied ROIC'
      expression_latex: ROIC_{implied}=\frac{g}{Reinvestment\ rate},\quad Reinv=\frac{CapEx-Dep+\Delta NWC}{NOPAT},\quad EV/EBITDA_{exit}=\frac{TV}{EBITDA_n}
      expression_python: g/reinv, TV/ebitda_n
      excel: =g/Reinv
      variables:
      - symbol: g
        meaning: Tăng trưởng vĩnh viễn
        unit: tỷ lệ
      - symbol: Reinv
        meaning: Tỷ lệ tái đầu tư năm cuối
        unit: tỷ lệ
      when_to_use: Sau khi tính DCF, kiểm tra giả định g có thể được tài trợ bởi tái đầu tư với ROIC hợp lý hay không.
      why_it_works: 'Tăng trưởng cần vốn: g = tỷ lệ tái đầu tư × ROIC. Nếu ROIC ngầm định quá cao so với WACC bền vững không thực tế.'
      assumptions:
      - Tái đầu tư năm cuối đại diện cho giai đoạn ổn định
      pitfalls:
      - Chỉ nhìn TV mà không kiểm tra bội số ngầm định.
      - g vượt tăng trưởng danh nghĩa dài hạn nền kinh tế (2-4%).
      interpretation: 'S-Green: Reinv = (23,0-16,5+7,5)/65,74 = 21,3%; ROIC ngầm định 14,1% > WACC 9,76%; exit multiple 8,0x EBITDA; TV/EV = 82,5%; EV/EBITDA năm 1 = 17,1x.'
      example:
        inputs:
          capex: 23.0
          dep: 16.5
          dNWC: 7.5
          nopat: 65.74
          g: 0.03
          TV: 788.35
          ebitda_n: 98.67
        steps:
        - Reinv = 14,0/65,74 = 21,3%
        - ROIC = 3%/21,3% = 14,1%
        - TV/EBITDA = 788,35/98,67 = 7,99x
        result: ROIC ngầm định 14,1%, exit multiple 8,0x
  - id: "m11-formulas-15"
    title: "Công thức: m11_npv_breakeven_shortfall — Điểm hòa vốn NPV theo doanh thu (stress test)"
    tags: ["công", "thức", "m11_npv_breakeven_shortfall", "điểm", "hòa", "vốn", "npv", "theo", "doanh", "thu", "stress", "test"]
    text: |-
      id: m11_npv_breakeven_shortfall
      name_vi: Điểm hòa vốn NPV theo doanh thu (stress test)
      name_en: NPV break-even revenue shortfall
      expression_latex: k^{*}:\ NPV(k^{*})=0,\qquad shortfall=1-k^{*},\qquad \frac{\Delta NPV}{1\%\ revenue}\approx\frac{NPV(1)-NPV(0)}{100}
      expression_python: 'brentq(lambda k: NPV(cfs(k), wacc), 0.5, 1)'
      excel: 'Goal Seek: đặt NPV=0 bằng cách đổi hệ số doanh thu k'
      variables:
      - symbol: k
        meaning: Hệ số doanh thu thực/kế hoạch
        unit: '-'
      when_to_use: 'Mọi dự án SME: cho biết biên an toàn doanh thu trước khi NPV về 0.'
      why_it_works: Một kế hoạch duy nhất che giấu rủi ro. Điểm hòa vốn NPV cho ngưỡng cụ thể (6,1%) để chủ SME so sánh với biến động thực tế; thuế sàn (EBIT<0 không có lá chắn thuế) làm NPV giảm nhanh hơn tuyến tính ở vùng xấu.
      assumptions:
      - Chi phí cố định (thuê) không đổi; chi phí biến đổi tỷ lệ doanh thu
      - Thuế không được hoàn khi lỗ (tax floor)
      pitfalls:
      - 'Quên tax floor: NPV ở 80% sai (-445,4 thay vì -453,8; 75%: -605,4 vs -622,6).'
      interpretation: 'Case 13: hòa vốn NPV khi doanh thu năm 1 ≈ 2.817 triệu (≈7,8 triệu/ngày), thiếu 6,1%; mỗi 1% ≈ 32 triệu NPV.'
      example:
        inputs:
          wacc: 0.14276
          scenarios:
          - 1.0
          - 0.9
          - 0.85
          - 0.8
          - 0.75
        steps:
        - 'NPV: +194,9; -125,3; -285,3; -453,8; -622,6 (với tax floor)'
        - 'IRR: 17,6%; 12,1%; 9,2%; 6,2%; 3,0%'
        result: k* = 0,939 (hụt 6,1%)
  - id: "m11-formulas-16"
    title: "Công thức: m11_overtrading_gap — Khoảng thiếu hụt tài trợ do tăng trưởng (overtrading gap)"
    tags: ["công", "thức", "m11_overtrading_gap", "khoảng", "thiếu", "hụt", "tài", "trợ", "do", "tăng", "trưởng", "overtrading"]
    text: |-
      id: m11_overtrading_gap
      name_vi: Khoảng thiếu hụt tài trợ do tăng trưởng (overtrading gap)
      name_en: Growth funding gap
      expression_latex: NWC=\frac{DIO\cdot COGS+DSO\cdot Sales-DPO\cdot COGS}{365},\quad Gap=\Delta NWC-NI-Credit\ line
      expression_python: dNWC = nwc(after)-nwc(before); gap = dNWC - NI - credit
      excel: =(DIO*COGS+DSO*Doanhthu-DPO*COGS)/365
      variables:
      - symbol: DIO,DSO,DPO
        meaning: Số ngày tồn kho, phải thu, phải trả
        unit: ngày
      - symbol: NI
        meaning: Lợi nhuận ròng giữ lại
        unit: tiền
      when_to_use: Trước khi nới tín dụng, tăng tồn kho, hoặc đẩy tăng trưởng nhanh.
      why_it_works: Quy đổi số ngày CCC thành tiền thực bị đóng băng; tăng trưởng bền vững bị giới hạn bởi dòng tiền, không phải nhu cầu thị trường.
      assumptions:
      - Giá vốn tỷ lệ doanh thu
      - DIO/DSO/DPO quan sát ổn định
      pitfalls:
      - Chỉ nhìn P&L lãi mà bỏ qua ΔNWC.
      - Nhà cung cấp siết điều khoản khi chậm trả (DPO co lại) làm vấn đề tệ hơn.
      interpretation: 'Home-Pro: NWC 18,6 -> 239,7; ΔNWC 221,1; thiếu 165,9 sau lãi 55,2; vượt hạn mức 100 -> thiếu 65,9 tỷ.'
      example:
        inputs:
          S0: 200
          C0: 160
          S1: 500
          C1: 400
        steps:
        - NWC0 = (45×160+30×200-40×160)/365 = 18,63
        - NWC1 = (90×400+115×500-15×400)/365 = 239,73
        - ΔNWC = 221,1; NI = 69×0,8 = 55,2; gap = 165,9; sau hạn mức 100 -> 65,9
        result: Thiếu hụt tài trợ 65,9 tỷ VNĐ dù lãi 55,2 tỷ
  - id: "m11-procedures-1"
    title: "Quy trình: m11_proc_capital_flow_map — Bản đồ dòng chuyển vốn - chẩn đoán vấn đề nằm ở khâu nào"
    tags: ["quy", "trình", "m11_proc_capital_flow_map", "bản", "đồ", "dòng", "chuyển", "vốn", "chẩn", "đoán", "vấn", "đề"]
    text: |-
      id: m11_proc_capital_flow_map
      name: Bản đồ dòng chuyển vốn - chẩn đoán vấn đề nằm ở khâu nào
      steps:
      - 'Khâu 1 - Huy động vốn: hỏi WACC hiện tại là bao nhiêu, cơ cấu vốn đích là gì, r_d có tăng theo đòn bẩy không? (m03, m04)'
      - 'Khâu 2 - Đầu tư: dòng tiền tăng thêm có đủ (CapEx, ΔNWC, thuế, thanh lý, tiền cọc)? NPV/MIRR so với WACC? (m02)'
      - 'Khâu 3 - Vận hành/thanh khoản: CCC, ΔNWC có tài trợ được? Lợi nhuận có chuyển thành tiền? (m06)'
      - 'Khâu 4 - Hoàn vốn: FCFF còn lại sau tái đầu tư NPV>0 đủ cho nợ gốc/lãi, cổ tức/mua lại? (m07)'
      - 'Khâu 5 - Định giá/M&A: EV, TV, synergy-premium có kỷ luật? (m10, m09)'
      - 'Khâu 6 - Rủi ro: stress test, Monte Carlo, VaR/ES, DSCR (m11, m08)'
      outputs: Chẩn đoán khâu yếu nhất + chuỗi module cần chạy tiếp.
  - id: "m11-procedures-2"
    title: "Quy trình: m11_proc_master_decision_chain — Chuỗi tích hợp chuẩn cho một quyết định đầu tư có tài trợ (mẫu Case 13)"
    tags: ["quy", "trình", "m11_proc_master_decision_chain", "chuỗi", "tích", "hợp", "chuẩn", "cho", "một", "quyết", "định", "đầu"]
    text: |-
      id: m11_proc_master_decision_chain
      name: Chuỗi tích hợp chuẩn cho một quyết định đầu tư có tài trợ (mẫu Case 13)
      steps:
      - 'B1 (m03/m04): Xác định cơ cấu vốn đích; unlever beta ngành (β_u), relever theo D/E (Hamada); r_e = Rf + β×ERP (+ size/illiquidity premium nếu chưa niêm yết); r_d theo mức vay; WACC = E/V r_e + D/V r_d (1-T).'
      - 'B2 (m04): Quét WACC theo các mức D/V với r_d tăng dần để chọn mức vay (SME: mục tiêu giữ quyền sở hữu, không phải hạ WACC). Case 13: 40% -> 14,28% ≈ 0% -> 14,30%; 60% -> 14,74%; 70% -> 15,38%.'
      - 'B3 (m02/m06): Dựng FCFF: EBITDA, trừ khấu hao -> EBIT, thuế, NOPAT, cộng khấu hao, trừ capex/ΔNWC; năm cuối cộng thu hồi NWC + tiền cọc + thanh lý sau thuế.'
      - 'B4 (m02): NPV @WACC, IRR, MIRR (tái đầu tư ở WACC), PI = 1 + NPV/I, payback & DPP. Kiểm tra dòng tiền đổi dấu nhiều lần (nhiều IRR).'
      - 'B5 (m11): Dựng lịch trả nợ (PMT annuity), tính DSCR từng năm, ICR, IRR vốn chủ (sau trả nợ) so với r_e.'
      - 'B6 (m06): CCC của dự án (DIO+DSO-DPO) để phân tách vốn lưu động thành tồn kho/phải thu/quỹ đệm; dựng quỹ dự phòng trả nợ ≥ 6 tháng.'
      - 'B7 (m11): Stress test doanh thu -10/-15/-20/-25% (nhớ tax floor); tìm điểm hòa vốn NPV; độ nhạy theo biến đàm phán được (giá thuê); Monte Carlo ra P(NPV<0), P5, P95.'
      - 'B8 (m02 Real Options): Đề xuất giai đoạn hóa (chạy thử/pop-up) trước khi cam kết dài hạn.'
      - 'B9: Kết luận có điều kiện + hành động cụ thể (đàm phán thuê, ân hạn, quỹ dự phòng, giới hạn mức vay).'
      outputs: Bảng WACC, bảng FCFF, NPV/IRR/MIRR/PI/payback, lịch nợ + DSCR, stress/MC, khuyến nghị có điều kiện.
  - id: "m11-procedures-3"
    title: "Quy trình: m11_proc_dcf_valuation_chain — Chuỗi định giá DCF tích hợp (mẫu S-Green)"
    tags: ["quy", "trình", "m11_proc_dcf_valuation_chain", "chuỗi", "định", "giá", "dcf", "tích", "hợp", "mẫu", "green"]
    text: |-
      id: m11_proc_dcf_valuation_chain
      name: Chuỗi định giá DCF tích hợp (mẫu S-Green)
      steps:
      - 'WACC theo cơ cấu vốn mục tiêu dài hạn (không dùng cơ cấu hiện tại nếu sẽ thay đổi): 0,6×12% + 0,4×8%×0,8 = 9,76%.'
      - Dự phóng 3 báo cáo nối nhau -> FCFF 5 năm = NOPAT + Dep - CapEx - ΔNWC (kiểm từng cột).
      - TV = FCFF_n(1+g)/(WACC-g) với g ≤ tăng trưởng danh nghĩa dài hạn; chiết khấu về t=0.
      - EV -> Equity = EV - Debt + Cash - minority; chia cho số cổ phiếu.
      - 'Sanity: TV/EV, EV/EBITDA, exit multiple ngầm định, ROIC ngầm định (m11_tv_implied_roic).'
      - Ma trận độ nhạy WACC (±1pp) × g (2-4%); trình bày khoảng giá trị. Kiểm chéo bằng multiples (P/E, EV/EBITDA).
      - 'Nếu có hợp đồng nhiều hạng mục/thuê: áp IFRS 15/16 trước (chỉnh ΔNWC, nợ thuê trong EV bridge).'
      outputs: EV, Equity, giá/cổ phiếu, khoảng giá trị, bảng độ nhạy, cảnh báo TV.
  - id: "m11-procedures-4"
    title: "Quy trình: m11_proc_ma_discipline — Quy trình M&A có kỷ luật giá (mẫu Bev-Co)"
    tags: ["quy", "trình", "m11_proc_ma_discipline", "có", "kỷ", "luật", "giá", "mẫu", "bev", "co"]
    text: |-
      id: m11_proc_ma_discipline
      name: Quy trình M&A có kỷ luật giá (mẫu Bev-Co)
      steps:
      - 'Định giá V_B độc lập; định lượng synergy: cost PV = ΔCost sau thuế / WACC (vĩnh viễn) + revenue synergy PV; giảm trừ chi phí tích hợp.'
      - Price_max = V_B + Synergies (walk-away). Chào premium thấp hơn nhiều (Bev-Co 40% premium = 80 so với synergy 200).
      - NPV mua = Synergies - Premium; tính break-even synergy realization = Premium/Synergies (40%).
      - 'Kịch bản thực hiện synergy 100%/50%/30%: NPV +120/+20/-20.'
      - 'Nếu trả cổ phiếu: số cổ phiếu mới = Price/P_A, EPS accretion/dilution, phân chia giá trị hợp nhất; ai gánh rủi ro synergy.'
      outputs: Giá trần, giá chào, NPV thương vụ, bảng độ nhạy synergy, phương án thanh toán.
  - id: "m11-procedures-5"
    title: "Quy trình: m11_proc_payout_decision — Chọn chính sách hoàn vốn cho cổ đông"
    tags: ["quy", "trình", "m11_proc_payout_decision", "chọn", "chính", "sách", "hoàn", "vốn", "cho", "cổ", "đông"]
    text: |-
      id: m11_proc_payout_decision
      name: Chọn chính sách hoàn vốn cho cổ đông
      steps:
      - Loại bỏ nhu cầu tái đầu tư NPV>0 trước (Residual Dividend); đảm bảo thanh khoản.
      - 'So giá thị trường với giá trị nội tại (m10): mua lại chỉ khi giá < nội tại.'
      - Tính ảnh hưởng thuế (cổ tức bị đánh thuế ngay, buyback hoãn thuế), tín hiệu (cắt cổ tức = tin xấu), tính linh hoạt.
      - Dùng Lintner với SOA phù hợp; trong khủng hoảng chọn SOA cao, đừng vay để trả cổ tức.
      outputs: Hình thức hoàn vốn + mức chi, kèm ràng buộc thanh khoản.
  - id: "m11-procedures-6"
    title: "Quy trình: m11_proc_portfolio_risk — Rà soát rủi ro danh mục / quyết định lớn"
    tags: ["quy", "trình", "m11_proc_portfolio_risk", "rà", "soát", "rủi", "ro", "danh", "mục", "quyết", "định", "lớn"]
    text: |-
      id: m11_proc_portfolio_risk
      name: Rà soát rủi ro danh mục / quyết định lớn
      steps:
      - 'Danh mục: tính E(Rp), σp qua công thức 2 tài sản (m08), thử các ρ (+1, +0,8, +0,5, 0, -0,5, -1) để thấy ảnh hưởng tương quan.'
      - 'Tìm MVP: w_A = (σ_C² - ρσ_Aσ_C)/(σ_A²+σ_C²-2ρσ_Aσ_C); tính Sharpe.'
      - Stress ρ→+1 trong khủng hoảng; VaR/ES (m11); Monte Carlo cho dự án.
      - Dự phòng vốn theo ES/P5, không chỉ VaR.
      outputs: Bảng rủi ro-lợi suất, VaR/ES, cảnh báo tương quan.
  - id: "m11-procedures-7"
    title: "Quy trình: m11_proc_consistency_check — Kiểm tra nhất quán trước khi trình bày số liệu"
    tags: ["quy", "trình", "m11_proc_consistency_check", "kiểm", "tra", "nhất", "quán", "trước", "khi", "bày", "số", "liệu"]
    text: |-
      id: m11_proc_consistency_check
      name: Kiểm tra nhất quán trước khi trình bày số liệu
      steps:
      - 'Bảng cân đối: Tài sản = Nợ + Vốn chủ; Cash Flow Statement khớp thay đổi tiền mặt hai kỳ.'
      - EBIT = Doanh thu - OpEx - Khấu hao; FCFF cộng đúng từng cột; PV nhân đúng hệ số chiết khấu.
      - 'Chạy lại bằng Python/Excel; so với kiểm tra chéo hai cách (ví dụ Case 5: V_l tính bằng M&M = 1.080 và bằng EBIT(1-T)/WACC = 1.080).'
      outputs: Số liệu tự nhất quán, sẵn sàng đưa vào báo cáo.
  - id: "m11-decision_rules-1"
    title: "Quy tắc quyết định: Nếu dòng tiền dự án đổi dấu nhiều hơn một lần (đại tu, hoàn nguyên môi trường, tiền ứng trước) thì …"
