    text: |-
      name: Case 4 - Fly-Ind (đòn bẩy cực đoan, WACC bùng nổ)
      type: failure
      setup: Hàng không, D/E = 4 (D/V 80%), β_u = 0,9, Rf 6%, ERP 5%, T 20%; ngân hàng nâng r_d 8% -> 16%.
      key_calculations:
      - β_lh = 0,9×(1+0,8×4) = 3,78; r_e = 6% + 3,78×5% = 24,9%
      - WACC = 0,2×24,9% + 0,8×16%×0,8 = 4,98% + 10,24% = 15,22%
      - 'So sánh: D/E=1, r_d 8% -> 10,25% (β 1,62; r_e 14,1%); D/E=4, r_d 8% -> 10,10%; D/E=4, r_d 16% -> 15,22%'
      lesson: Nếu r_d giữ 8% thì WACC gần như không đổi (M&M); phần +5,12pp đến từ chi phí kiệt quệ. Luôn để r_d biến thiên theo đòn bẩy/ICR.
