  - id: "m11-case_lessons-15"
    title: "Bài học case: Case 13 - Quán cà phê Nhà Rang, chi nhánh 2 (SME Việt Nam)"
    tags: ["bài", "học", "case", "13", "quán", "cà", "phê", "nhà", "rang", "chi", "nhánh", "sme"]
    text: |-
      name: Case 13 - Quán cà phê Nhà Rang, chi nhánh 2 (SME Việt Nam)
      type: sme
      setup: Biên Hòa; nhu cầu vốn 2.100 triệu VNĐ (cải tạo 1.100 + thiết bị 700 + cọc 200 + NWC 100); vay 840 (40%) lãi 11% annuity 5 năm, vốn chủ 1.260; T 20%; doanh thu năm 1 3.000, tăng 15/8/5/3%; giá vốn 33%, nhân sự 24%, chi khác 10%, thuê 480 (tăng 3%/năm); thanh lý thiết bị 180.
      key_calculations:
      - D/E = 0,667; β_lh = 0,85×(1+0,8×0,667) = 1,303; r_e = 3,5%+1,303×8%+4% = 17,93%; WACC = 0,6×17,93%+0,4×11%×0,8 = 14,28%
      - 'Quét đòn bẩy: 0% -> 14,30%; 40% -> 14,28%; 60% (12%) -> 14,74%; 70% (13%) -> 15,38%'
      - 'FCFF: 480,0; 587,3; 648,3; 685,2; 1.147,6 (năm 5 gồm 444 = 100 + 200 + 180×0,8)'
      - NPV @14,28% = +194,9; IRR 17,6%; MIRR 16,3%; PI 1,093; payback 3,56 năm; DPP 4,67 năm
      - 'Sai tỷ suất: lãi vay 11% -> NPV +415,6; r_e 17,93% -> -17,8'
      - PMT = 840/3,6959 = 227,3; DSCR 2,11; 2,58; 2,85; 3,01; 3,10; IRR vốn chủ 22,2% > r_e 17,93%
      - CCC = 10+0-18 = -8 ngày; tồn kho 27,1, phải trả 48,8, NWC thương mại -21,7; quỹ đệm ≈ 73
      - 'Stress: 90% -> -125,3 (IRR 12,1%); 85% -> -285,3; 80% -> -453,8; 75% -> -622,6; hòa vốn NPV khi hụt 6,1%'
      - 'Monte Carlo (σ 10%, 20.000 lần, seed 42): P(NPV<0) ≈ 27%; P5 ≈ -333,6; P95 ≈ +729,6'
      - Thuê 420 -> NPV +367,3 (IRR 20,5%); thuê 360 -> +539,8 (IRR 23,3%)
      lesson: 'Nên làm nhưng có điều kiện: đàm phán thuê (đòn bẩy giá trị lớn nhất), chạy thử trước khi ký 5 năm (Real Options), quỹ dự phòng trả nợ ≥ 6 tháng (≈114), vay không quá 40-50%. Kiểm lại: dùng đúng WACC; NPV mỏng nên P(NPV<0) 27%.'
      data_reliability: illustrative
  - id: "m11-worked_examples-1"
    title: "Ví dụ có lời giải: m11_we_sme_branch_decision — Tích hợp: SME vay mở chi nhánh (mẫu Case 13, rút gọn)"
    tags: ["ví", "dụ", "có", "lời", "giải", "m11_we_sme_branch_decision", "tích", "hợp", "sme", "vay", "mở", "chi"]
    text: |-
      id: m11_we_sme_branch_decision
      name: 'Tích hợp: SME vay mở chi nhánh (mẫu Case 13, rút gọn)'
      inputs:
        capex_total: 2100
        loan: 840
        rate_loan: 0.11
        equity: 1260
        tax: 0.2
        Rf: 0.035
        ERP: 0.08
        beta_u: 0.85
        size_premium: 0.04
        rev_y1: 3000
        growth:
        - 0.15
        - 0.08
        - 0.05
        - 0.03
      steps:
      - D/E = 840/1.260 = 0,667; β_lh = 0,85×(1+0,8×0,667) = 1,3033
      - r_e = 3,5% + 1,3033×8% + 4% = 17,93%; WACC = 0,6×17,93% + 0,4×11%×0,8 = 14,276%
      - 'Doanh thu: 3.000; 3.450; 3.726; 3.912,3; 4.029,7. EBITDA = 33% doanh thu - thuê; EBITDA 510,0; 644,1; 720,3; 766,6; 789,5'
      - 'EBIT = EBITDA - 360; NOPAT = 0,8×EBIT; FCFF = NOPAT + 360 (+444 năm 5): 480,0; 587,3; 648,3; 685,2; 1.147,6'
      - NPV = Σ FCFF/(1,14276)^t - 2.100 = +194,9; IRR 17,6%; MIRR 16,3%; PI 1,093
      - 'Payback thường: lũy kế -1.620; -1.032,7; -384,4; +300,8 -> 3 + 384,4/685,2 = 3,56 năm; DPP: -1.680; -1.230; -795,8; -394,0; +194,9 -> 4,67 năm'
      - PMT = 227,28; DSCR năm 1 = (510-30)/227,28 = 2,11; IRR vốn chủ = 22,2%
      - 'Hòa vốn NPV: doanh thu hụt 6,1% (k*=0,939); P(NPV<0) ≈ 27%'
      result: 'Nên làm có điều kiện: NPV +194,9; biên IRR - WACC chỉ 3,3 điểm; DSCR 2,11; rủi ro 27%.'
