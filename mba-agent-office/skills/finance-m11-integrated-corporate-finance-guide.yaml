    text: |-
      Nếu NPV tĩnh chỉ dương nhẹ nhờ bù trừ hai kịch bản lệch (+221 / -204) và có thể chờ thông tin thì hãy tính quyền chọn trì hoãn trước khi cam kết vốn.
  - id: "m11-decision_rules-3"
    title: "Quy tắc quyết định: Nếu chọn tỷ suất chiết khấu thì dùng WACC phản ánh rủi ro dự án, không dùng lãi vay (SME thường đán…"
    tags: ["quy", "tắc", "quyết", "định", "nếu", "chọn", "tỷ", "suất", "chiết", "khấu", "thì", "dùng"]
