    tags: ["ví", "dụ", "có", "lời", "giải", "m11_we_irr_trap", "tích", "hợp", "kiểm", "tra", "bẫy", "irr"]
    text: |-
      id: m11_we_irr_trap
      name: 'Tích hợp: kiểm tra bẫy IRR nhiều nghiệm (mẫu Case 2)'
      inputs:
        cf:
        - -1000
        - 2845
        - -1992
        wacc: 0.12
      steps:
      - Giải 1.992v² - 2.845v + 1.000 = 0 -> r = 24,5% và 60%
      - NPV(12%) = -1.000 + 2.845/1,12 - 1.992/1,12² = -47,83
      - 'MIRR: TV = 2.845×1,12 = 3.186,4; PV(out) = 1.000 + 1.992/1,2544 = 2.588,01; MIRR = √1,2312 - 1 = 10,96%'
      result: Bác bỏ dự án (NPV âm, MIRR 10,96% < 12%) dù Excel báo IRR 24,5%.
