      Nếu hợp đồng gói nhiều hạng mục thì phân bổ theo IFRS 15 và điều chỉnh ΔNWC (deferred revenue) trong FCFF.
  - id: "m11-decision_rules-17"
    title: "Quy tắc quyết định: Nếu DSCR năm 1 < 1,5 thì giảm mức vay, tăng ân hạn, hoặc kéo dài kỳ hạn; luôn kiểm tra năm đầu vì E…"
    tags: ["quy", "tắc", "quyết", "định", "nếu", "dscr", "năm", "thì", "giảm", "mức", "vay", "tăng"]
    text: |-
      Nếu DSCR năm 1 < 1,5 thì giảm mức vay, tăng ân hạn, hoặc kéo dài kỳ hạn; luôn kiểm tra năm đầu vì EBITDA thấp nhất.
  - id: "m11-decision_rules-18"
    title: "Quy tắc quyết định: Nếu NPV âm ở kịch bản -10% doanh thu và xác suất NPV<0 > 25% thì quyết định phải có điều kiện (đàm …"
    tags: ["quy", "tắc", "quyết", "định", "nếu", "npv", "âm", "kịch", "bản", "10", "doanh", "thu"]
    text: |-
      Nếu NPV âm ở kịch bản -10% doanh thu và xác suất NPV<0 > 25% thì quyết định phải có điều kiện (đàm phán thuê, chạy thử, quỹ dự phòng), không duyệt vô điều kiện.
