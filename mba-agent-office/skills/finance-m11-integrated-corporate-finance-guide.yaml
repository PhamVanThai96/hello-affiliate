      name: Case 1 - GEC điện gió ngoài khơi Bình Thuận (Real Options)
      type: success
      setup: 'Vốn 800 triệu USD; hai kịch bản FIT 50/50: dòng tiền 120 hoặc 70 triệu USD/năm × 20 năm; WACC 10%; mua quyền trì hoãn 2 năm giá 15 triệu.'
      key_calculations:
      - PVIFA(10%,20) = 8,5136; PV_H = 1.021,63; PV_L = 595,95
      - NPV_H = +221,63; NPV_L = -204,05; NPV tĩnh = 0,5×221,63 + 0,5×(-204,05) = +8,79; p* hòa vốn = 47,9%
      - 'Tích hợp: -15 + 0,5×221,63/1,21 = -15 + 91,58 = +76,58; giá trị quyền = 67,79; phí tối đa = 82,79'
      - 'Độ nhạy p: 30% -> tĩnh -76,35 / tích hợp +39,95; 70% -> +93,92 / +113,21'
      lesson: Không duyệt dự án lớn bất định chính sách chỉ bằng NPV tĩnh; chia giai đoạn, trả phí nhỏ mua thông tin. Quyền chọn giá trị nhất khi bất định cao; chi phí chờ đợi (mất 2 năm doanh thu, đối thủ) cần cân nhắc.
      data_reliability: illustrative
  - id: "m11-case_lessons-2"
    title: "Bài học case: Case 2 - X-Refinery (bẫy IRR nhiều nghiệm)"
    tags: ["bài", "học", "case", "refinery", "bẫy", "irr", "nhiều", "nghiệm"]
    text: |-
      name: Case 2 - X-Refinery (bẫy IRR nhiều nghiệm)
      type: failure
      setup: 'Dòng tiền (triệu USD): năm 0 -1.000; năm 1 +2.845 (ứng trước); năm 2 -1.992 (chi phí/đại tu). WACC 12%. Ban dự án báo IRR 24,5%.'
      key_calculations:
      - 'v=1/(1+r): 1.992v² - 2.845v + 1.000 = 0 -> r1 = 24,5%, r2 = 60%'
      - NPV(12%) = -1.000 + 2.540,18 - 1.588,01 = -47,83; NPV dương chỉ trong 24,5%-60%
      - MIRR = √(3.186,4/2.588,01) - 1 = 10,96% < 12%
      lesson: Dòng tiền đổi dấu nhiều lần -> dùng NPV/MIRR, vẽ đồ thị NPV; khoản thu lớn sớm kèm chi lớn muộn là khoản vay ngầm.
      data_reliability: illustrative
  - id: "m11-case_lessons-3"
