    text: |-
      Nếu so EV/EBITDA giữa công ty áp dụng và không áp dụng IFRS 16 thì phải điều chỉnh (cộng nợ thuê, EBITDA đã tăng).
  - id: "m11-decision_rules-16"
    title: "Quy tắc quyết định: Nếu hợp đồng gói nhiều hạng mục thì phân bổ theo IFRS 15 và điều chỉnh ΔNWC (deferred revenue) tron…"
