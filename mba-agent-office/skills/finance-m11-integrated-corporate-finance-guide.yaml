    text: |-
      Nếu có tiền dư không có dự án NPV>0 thì mua lại cổ phiếu chỉ khi giá < giá trị nội tại; ngược lại chi cổ tức hoặc giữ tiền.
  - id: "m11-decision_rules-10"
    title: "Quy tắc quyết định: Nếu EPS gần như 0 hoặc dòng tiền suy sụp thì cắt cổ tức nhanh (SOA cao); không vay để trả cổ tức."
