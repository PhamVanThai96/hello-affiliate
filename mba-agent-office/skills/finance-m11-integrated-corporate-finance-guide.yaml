    tags: ["bài", "học", "case", "vte", "hạ", "hurdle", "rate", "bằng", "cấu", "trúc", "vốn"]
    text: |-
      name: Case 3 - VTE (hạ hurdle rate bằng cấu trúc vốn)
      type: success
      setup: Công nghệ, D/E = 0, β_l = 1,6, Rf 6%, ERP 5%, T 20%; phát hành trái phiếu 8% mua lại cổ phiếu, D/E -> 1,0.
      key_calculations:
      - WACC ban đầu = r_e = 6% + 1,6×5% = 14,0%
      - β_lh = 1,6×(1+0,8×1,0) = 2,88; r_e = 20,4%; WACC = 0,5×20,4% + 0,5×8%×0,8 = 13,4%
      - 'Quét D/E: 0 -> 14,00%; 0,25 -> 13,76%; 0,5 -> 13,60%; 1,0 -> 13,40%; 2,0 -> 13,20% (r_d cố định 8%)'
      - 'Dự án 100 triệu, lợi suất 13,8%: NPV = 13,8/0,14 - 100 = -1,43 (bác) vs 13,8/0,134 - 100 = +2,99 (duyệt)'
      lesson: Vay vừa phải hạ WACC dù r_e tăng; nhưng bảng giả định r_d cố định -> thực tế r_d tăng (xem Case 4).
