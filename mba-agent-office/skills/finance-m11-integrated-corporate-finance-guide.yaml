      Nếu DPO được kéo dài nhờ sức mua thì cần quỹ dự phòng thanh khoản vì khi doanh thu giảm lợi thế đảo ngược.
  - id: "m11-decision_rules-9"
    title: "Quy tắc quyết định: Nếu có tiền dư không có dự án NPV>0 thì mua lại cổ phiếu chỉ khi giá < giá trị nội tại; ngược lại c…"
