    text: |-
      q: 'Gốc đều 800 trong 20 năm ở 6,6%: tổng trả năm 1 và năm 20?'
      a: 'Năm 1: 40 + 52.8 = 92.8; năm 20: 40 + 2.64 = 42.64.'
