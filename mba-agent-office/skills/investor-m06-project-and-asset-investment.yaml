    text: |-
      Công cụ: Google Sheets/Excel là đủ cho mô hình 20 năm (cột năm, các dòng NOI, FCFF, FCFE); dùng Data Table hoặc cột kịch bản cho stress. Giá phần mềm kế toán SME xem cong-cu-quan-tri-doanh-nghiep-sme.md.
  - id: "m06-sme_vn_guidance-6"
    title: "Lưu ý SME Việt Nam: Dữ liệu thị trường (lợi suất trái phiếu chính phủ, lãi tiết kiệm, ERP, giá thuê) lấy từ m07 hoặc ng…"
    tags: ["lưu", "sme", "việt", "nam", "dữ", "liệu", "thị", "trường", "lợi", "suất", "trái", "phiếu"]
    text: |-
      Dữ liệu thị trường (lợi suất trái phiếu chính phủ, lãi tiết kiệm, ERP, giá thuê) lấy từ m07 hoặc nguồn có ngày tham chiếu; không nhớ số. Gắn data_reliability.
  - id: "m06-case_lessons-1"
    title: "Bài học case: Mua tài sản cho thuê 1,3 tỷ, vay 800 triệu 6,6%/20 năm gốc đều (ví dụ của prompt, dựng lại đúng)"
    tags: ["bài", "học", "case", "mua", "tài", "sản", "cho", "thuê", "tỷ", "vay", "800", "triệu"]
    text: |-
      name: Mua tài sản cho thuê 1,3 tỷ, vay 800 triệu 6,6%/20 năm gốc đều (ví dụ của prompt, dựng lại đúng)
      type: sme
      setup: 'Vốn 1300 (tự có 500, vay 800), Rf 6,5%, ERP 7%, beta 0,6, thuế DN 20%, khấu hao đường thẳng 20 năm, doanh thu 4,5 triệu/tháng (54/năm) tăng 5%/năm, tài sản tăng giá 4%/năm. Giả định minh họa thêm: trống và vận hành 15%, phí bán 2%, giá trị sổ cuối kỳ bằng 0.'
      key_calculations:
      - Re 10.7%, WACC 7.3646%, lá chắn năm 1 = 10.56 + 13 = 23.56
      - 'Cách sai trong prompt: FCFE chiết khấu WACC cho NPV -399.6 (không có NOI, không có thanh lý)'
      - 'Cách đúng: FCFF năm 1 = 49.72, FCFE năm 1 = -32.52; TV = 2233.19; NPV(FCFF, WACC) = -68.8; NPV(FCFE, Re) = -240.9; IRR vốn chủ 7.74%; MIRR 7.77% (fin = Re, rein = Rf)'
      - DSCR năm 1 = 0.495; đảo chiều năm 9; đỉnh âm lũy kế -642.2; tăng giá hòa vốn 7.17%/năm
      lesson: 'Dự án có MIRR hơn gửi tiết kiệm 6,5% một chút nhưng thấp hơn Re 10.7% nên chưa bù đủ rủi ro; NPV vẫn âm. Giá trị đến từ cược tăng giá chứ không phải từ tiền thuê. Cải thiện: thương lượng giá mua, tăng vốn tự có, lãi cố định, hoặc chọn tài sản có lợi suất thuê cao hơn.'
      data_reliability: illustrative
  - id: "m06-worked_examples-1"
    title: "Ví dụ có lời giải: m06_we1 — Chi phí vốn và lá chắn thuế của ví dụ trong prompt"
    tags: ["ví", "dụ", "có", "lời", "giải", "m06_we1", "chi", "phí", "vốn", "và", "lá", "chắn"]
    text: |-
      id: m06_we1
      title: Chi phí vốn và lá chắn thuế của ví dụ trong prompt
      inputs:
        V: 1300
        E: 500
        D: 800
        rf: 0.065
        erp: 0.07
        beta: 0.6
        rd: 0.066
        T: 0.2
        dep_years: 20
      steps:
      - Re = 0.065 + 0.6 x 0.07 = 0.107 (beta 1.0 cho 0.135)
      - E/V = 0.3846; D/V = 0.6154; Rd sau thuế = 0.066 x 0.8 = 0.0528
      - 'WACC = 0.3846 x 0.107 + 0.6154 x 0.0528 = 0.073646 (T = 0: 0.081769; beta 1.0 doanh nghiệp: 0.084415)'
      - Khấu hao = 1300/20 = 65; lá chắn khấu hao = 13
      - Lãi năm 1 = 800 x 0.066 = 52.8; lá chắn lãi = 10.56; tổng lá chắn kép = 23.56
      result: 'Re 10.7%, WACC 7.3646%, lá chắn kép năm 1 = 23.56 triệu. Giải thích: khấu hao không chi tiền nhưng giảm thuế 13 triệu tiền thật mỗi năm.'
  - id: "m06-worked_examples-2"
    title: "Ví dụ có lời giải: m06_we2 — Dựng bản ĐÚNG và so với cách sai trong prompt"
    tags: ["ví", "dụ", "có", "lời", "giải", "m06_we2", "dựng", "bản", "đúng", "và", "so", "với"]
    text: |-
      id: m06_we2
      title: Dựng bản ĐÚNG và so với cách sai trong prompt
      inputs:
        rev0: 54
        g: 0.05
        vacancy_opex: 0.15
        T: 0.2
        dep: 65
        debt: 800
        rd: 0.066
        principal: 40
        price_growth: 0.04
        sell_cost: 0.02
        book_end: 0
        Re: 0.107
        WACC: 0.073646
      steps:
      - 'SAI (prompt): CF1 = (54 - 52.8 - 65) x 0.8 + 65 - 40 = -26.04; chuỗi -500 rồi -26.04, ... đến +80.1 năm 20, không có thanh lý; NPV tại WACC = -399.6; IRR = -0.62%'
      - 'ĐÚNG: NOI1 = 54 x 0.85 = 45.9; FCFF1 = 45.9 x 0.8 + 13 = 49.72; FCFE1 = 49.72 - 52.8 x 0.8 - 40 = -32.52'
      - Giá bán năm 20 = 1300 x 1.04^20 = 2848.46; sau phí 2% = 2791.49; thuế = 558.30; TV = 2233.19; FCFF20 = 2339.0; FCFE20 = 2296.9
      - NPV(FCFF, WACC 7.3646%) = -68.8; IRR dự án = 6.95%
      - NPV(FCFE, Re 10.7%) = -240.9; IRR vốn chủ = 7.74%; MIRR (fin = Re, rein = Rf 6.5%) = 7.77%; so với gửi tiết kiệm 500 x 1.065^20 = 1761.8
      - 'Điểm đảo chiều: FCFE năm 9 = +1.9 (năm 1 -32.5, năm 5 -16.2, năm 10 +6.7); đỉnh âm lũy kế -642.2 tại năm 9 (vốn tự có thực tế cần có = 500 + 142.2 = 642.2 nếu không có nguồn khác)'
      - 'DSCR: năm 1 = 0.495, năm 20 = 2.72'
      result: 'Cách sai mắc hai lỗi ngược chiều (thiếu chi phí vận hành làm dòng tiền lạc quan; thiếu giá trị thanh lý và dùng sai cặp làm NPV âm nặng) nên cho NPV -399.6 không có ý nghĩa. Cách đúng: NPV -68.8 (FCFF/WACC) và -240.9 (FCFE/Re), hai kết quả cùng dấu nên kết luận nhất quán: dự án không đáng giá theo giả định cơ sở.'
  - id: "m06-worked_examples-3"
    title: "Ví dụ có lời giải: m06_we3 — Stress test và điểm hòa vốn tăng giá"
    tags: ["ví", "dụ", "có", "lời", "giải", "m06_we3", "stress", "test", "và", "điểm", "hòa", "vốn"]
    text: |-
      id: m06_we3
      title: Stress test và điểm hòa vốn tăng giá
      inputs:
        base: ví dụ m06_we2
        shocks:
        - doanh thu -10%
        - lãi vay 8.6%
        - tăng giá 0%
        - tăng giá 2%
        - kết hợp (doanh thu -10%, lãi 8.6%, tăng giá 2%)
        - beta 1.0
      steps:
      - 'Cơ sở: NPV FCFF -68.8; NPV FCFE -240.9; MIRR 7.77%; đảo chiều năm 9; DSCR1 0.495'
      - 'Doanh thu -10%: -124.6 | -283.0 | MIRR 7.33% | năm 10 | DSCR 0.445'
      - 'Lãi vay 8.6% (WACC 8.35%): -215.2 | -312.0 | MIRR 7.13% | năm 11 | DSCR 0.422'
      - 'Tăng giá 0%: -361.9 | -399.9 | MIRR 4.61% | năm 9'
      - 'Tăng giá 2%: -242.3 | -335.0 | MIRR 6.12% | năm 9'
      - 'Kết hợp: -410.9 | -448.1 | MIRR 4.96% | năm 12 | DSCR 0.380'
      - 'Beta 1.0 (Re 13.5%, WACC 8.44%): -227.7 | -372.0 | MIRR 7.84% | năm 9'
      - 'Tăng giá hòa vốn (NPV FCFE = 0): 7.17% một năm (so với giả định 4%)'
      - 'Quỹ dự phòng: thiếu hụt stress = 92.8 - 41.31 = 51.49 một năm = 4.29 một tháng; 12 tháng = 51.49; 6 tháng = 25.75'
      result: 'Biến nhạy nhất là tăng giá tài sản và lãi vay. Dự án chỉ có NPV vốn chủ dương nếu giá tăng khoảng 7.2% một năm trong 20 năm, gần 1,8 lần giả định. Khuyến nghị CFO: không đầu tư ở giá và điều kiện này; nếu vẫn làm, giữ quỹ dự phòng 12 tháng khoảng 52 triệu và cố định lãi.'
  - id: "m06-worked_examples-4"
    title: "Ví dụ có lời giải: m06_we4 — So sánh đứng tên cá nhân với doanh nghiệp (T = 0 so với 20%)"
    tags: ["ví", "dụ", "có", "lời", "giải", "m06_we4", "so", "sánh", "đứng", "tên", "cá", "nhân"]
    text: |-
      id: m06_we4
      title: So sánh đứng tên cá nhân với doanh nghiệp (T = 0 so với 20%)
      inputs:
        T_personal: 0
        T_corp: 0.2
        same_other_inputs: true
      steps:
      - 'Cá nhân T = 0: WACC = 0.3846 x 0.107 + 0.6154 x 0.066 = 8.1769%; không có lá chắn lãi/khấu hao; thuế bán = 0 (giả định minh họa)'
      - 'FCFE cá nhân: năm 1 = 45.9 - 52.8 - 40 = -46.9; năm 20 = 2864.8 (gồm giá bán sau phí 2791.49 không thuế); đảo chiều năm 10'
      - NPV(FCFF, WACC 8.18%) = -71.6; NPV(FCFE, Re 10.7%) = -226.9; MIRR (fin = Re, rein = Rf) = 8.30%
      - 'Doanh nghiệp: NPV FCFF -68.8; NPV FCFE -240.9; MIRR 7.77%; đảo chiều năm 9'
      - 'Chênh lệch NPV vốn chủ: -240.9 - (-226.9) = -14.0'
      result: 'Trong mô hình này doanh nghiệp có dòng tiền hằng năm tốt hơn (đảo chiều năm 9, năm 1 là -32.5 so với -46.9) nhờ lá chắn, nhưng thuế 20% trên lãi bán tài sản làm NPV tổng thấp hơn khoảng 14 triệu. Kết luận phụ thuộc giả định miễn thuế chuyển nhượng cá nhân (CẦN XÁC NHẬN hiện hành): nếu cá nhân thực tế bị thuế (thuê và chuyển nhượng), lợi thế cá nhân nhỏ lại hoặc đảo chiều. Cần chạy lại với thuế cá nhân thực.'
  - id: "m06-worked_examples-5"
    title: "Ví dụ có lời giải: m06_we5 — Lãi suất danh nghĩa so với thực và nhất quán Rf"
    tags: ["ví", "dụ", "có", "lời", "giải", "m06_we5", "lãi", "suất", "danh", "nghĩa", "so", "với"]
    text: |-
      id: m06_we5
      title: Lãi suất danh nghĩa so với thực và nhất quán Rf
      inputs:
        real: 0.04
        inflation: 0.03
        rf_deposit: 0.065
      steps:
      - Lãi danh nghĩa = (1.04)(1.03) - 1 = 7.12%
      - Nếu doanh thu tăng 5% là danh nghĩa (đã gồm lạm phát 3%), tăng thực = 1.05/1.03 - 1 = 1.94%
      - 'Nếu bảng đầu vào dùng Rf 6.5% (danh nghĩa) nhưng chiết khấu dòng tiền thực thì sai; hoặc quy dòng tiền về danh nghĩa, hoặc đổi Rf về thực: 1.065/1.03 - 1 = 3.40%'
      result: Chọn một hệ (danh nghĩa) và dùng nhất quán; ghi rõ cơ sở Rf (tiết kiệm hay trái phiếu chính phủ kỳ hạn tương ứng).
  - id: "m06-practice_questions-1"
    title: "Câu hỏi luyện tập: Vốn 1300, E 500, D 800 vay 6,6%, T 20%, beta 0,6, Rf 6,5%, ERP 7%. Tính Re và WACC."
    tags: ["câu", "hỏi", "luyện", "tập", "vốn", "1300", "500", "800", "vay", "20", "beta", "rf"]
    text: |-
      q: Vốn 1300, E 500, D 800 vay 6,6%, T 20%, beta 0,6, Rf 6,5%, ERP 7%. Tính Re và WACC.
      a: Re = 6.5% + 0.6 x 7% = 10.7%; WACC = 0.3846 x 10.7% + 0.6154 x 6.6% x 0.8 = 7.3646%.
  - id: "m06-practice_questions-2"
    title: "Câu hỏi luyện tập: Vì sao không được chiết khấu FCFE bằng WACC? Sửa thế nào?"
    tags: ["câu", "hỏi", "luyện", "tập", "vì", "sao", "không", "được", "chiết", "khấu", "fcfe", "bằng"]
    text: |-
      q: Vì sao không được chiết khấu FCFE bằng WACC? Sửa thế nào?
      a: WACC đã chứa chi phí nợ nên trừ gốc/lãi trong dòng tiền là tính nợ hai lần, và rủi ro vốn chủ cao hơn WACC. Dùng FCFF với WACC hoặc FCFE với Re.
  - id: "m06-practice_questions-3"
    title: "Câu hỏi luyện tập: Doanh thu 54 mỗi năm, vận hành và trống 15%. NOI bằng bao nhiêu? Lợi suất thuần trên giá 1300? So v…"
    tags: ["câu", "hỏi", "luyện", "tập", "doanh", "thu", "54", "mỗi", "năm", "vận", "hành", "và"]
    text: |-
      q: Doanh thu 54 mỗi năm, vận hành và trống 15%. NOI bằng bao nhiêu? Lợi suất thuần trên giá 1300? So với lãi vay 6,6% nói gì?
      a: 'NOI = 45.9; lợi suất 3.53%, thấp hơn lãi vay nên đòn bẩy âm: dòng tiền vốn chủ hằng năm âm đến khi NOI tăng.'
  - id: "m06-practice_questions-4"
    title: "Câu hỏi luyện tập: Nếu tài sản tăng giá 4%/năm trong 20 năm từ 1300, giá bán và giá trị sau phí 2% là bao nhiêu? Vì sa…"
    tags: ["câu", "hỏi", "luyện", "tập", "nếu", "tài", "sản", "tăng", "giá", "năm", "trong", "20"]
    text: |-
      q: Nếu tài sản tăng giá 4%/năm trong 20 năm từ 1300, giá bán và giá trị sau phí 2% là bao nhiêu? Vì sao cần đưa vào dòng tiền?
      a: 1300 x 1.04^20 = 2848.46; sau phí 2791.49 (trước thuế). Đây là phần lớn lợi nhuận nên bỏ thì NPV sai lệch.
  - id: "m06-practice_questions-5"
    title: "Câu hỏi luyện tập: Gốc đều 800 trong 20 năm ở 6,6%: tổng trả năm 1 và năm 20?"
