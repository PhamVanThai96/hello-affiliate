      q: DSCR năm 1 trong ví dụ là bao nhiêu và nghĩa là gì?
      a: '45.9 / 92.8 = 0.495: dự án chỉ trả được khoảng một nửa nghĩa vụ nợ năm đầu; phải bù tiền túi khoảng 46.9 (trước thuế).'
  - id: "m06-practice_questions-7"
    title: "Câu hỏi luyện tập: MIRR vốn chủ 7,77% so với Rf 6,5% và Re 10,7% nói gì?"
    tags: ["câu", "hỏi", "luyện", "tập", "mirr", "vốn", "chủ", "77", "so", "với", "rf", "và"]
    text: |-
      q: MIRR vốn chủ 7,77% so với Rf 6,5% và Re 10,7% nói gì?
      a: Hơn gửi tiết kiệm nhưng chưa bù đủ rủi ro (thấp hơn Re) nên NPV vốn chủ âm.
