  - id: "m06-pitfalls-1"
    title: "Lỗi thường gặp: LỖI 1 (nghiêm trọng): công thức dòng tiền ròng của prompt, (Doanh thu - Lãi - Khấu hao) x (1-T) + K…"
    tags: ["lỗi", "thường", "gặp", "nghiêm", "trọng", "công", "thức", "dòng", "tiền", "ròng", "của", "prompt"]
    text: |-
      LỖI 1 (nghiêm trọng): công thức dòng tiền ròng của prompt, (Doanh thu - Lãi - Khấu hao) x (1-T) + Khấu hao - Gốc, là dòng tiền của VỐN CHỦ sau trả gốc và lãi (FCFE) nhưng lại chiết khấu bằng WACC, vốn đã chứa chi phí nợ: không nhất quán, tính nợ hai lần và dùng mẫu số quá thấp. Sửa: FCFF (trước nợ) chiết khấu WACC, hoặc FCFE (sau nợ) chiết khấu Re (CAPM). Trong ví dụ, cách sai cho NPV -399.6 và IRR -0.6%; cách đúng FCFF -68.8, FCFE -240.9.
  - id: "m06-pitfalls-2"
    title: "Lỗi thường gặp: LỖI 2: dùng 'doanh thu' thay NOI/EBITDA; bỏ qua chi phí vận hành, bảo trì, thuế tài sản, quản lý, t…"
    tags: ["lỗi", "thường", "gặp", "dùng", "doanh", "thu", "thay", "noi", "ebitda", "bỏ", "qua", "chi"]
    text: |-
      LỖI 2: dùng 'doanh thu' thay NOI/EBITDA; bỏ qua chi phí vận hành, bảo trì, thuế tài sản, quản lý, trống phòng. Sửa: NOI = doanh thu x (1 - vacancy - opex), mức mặc định minh họa 15% (phải thay bằng số thực).
  - id: "m06-pitfalls-3"
    title: "Lỗi thường gặp: LỖI 3: không có giá trị thanh lý/tăng giá tài sản cuối kỳ dù có giả định tăng giá 4%/năm; với BĐS đ…"
    tags: ["lỗi", "thường", "gặp", "không", "có", "giá", "trị", "thanh", "lý", "tăng", "tài", "sản"]
    text: |-
      LỖI 3: không có giá trị thanh lý/tăng giá tài sản cuối kỳ dù có giả định tăng giá 4%/năm; với BĐS đây thường là nguồn lợi chính. Sửa: thêm TV sau chi phí bán và thuế vào dòng tiền năm cuối.
  - id: "m06-pitfalls-4"
    title: "Lỗi thường gặp: LỖI 4: trộn lãi danh nghĩa với thực/lạm phát. Rf 6,5% và Rd 6,6% là danh nghĩa nên tăng trưởng doan…"
    tags: ["lỗi", "thường", "gặp", "trộn", "lãi", "danh", "nghĩa", "với", "thực", "lạm", "phát", "rf"]
    text: |-
      LỖI 4: trộn lãi danh nghĩa với thực/lạm phát. Rf 6,5% và Rd 6,6% là danh nghĩa nên tăng trưởng doanh thu, tăng giá và chi phí cũng phải ở giá danh nghĩa. Nếu có số liệu thực, chuyển bằng Fisher trước khi chiết khấu.
  - id: "m06-pitfalls-5"
    title: "Lỗi thường gặp: LỖI 5: Rf lấy lãi tiết kiệm thay vì lợi suất trái phiếu chính phủ kỳ hạn tương ứng. Cả hai cách đượ…"
    tags: ["lỗi", "thường", "gặp", "rf", "lấy", "lãi", "tiết", "kiệm", "thay", "vì", "lợi", "suất"]
    text: |-
      LỖI 5: Rf lấy lãi tiết kiệm thay vì lợi suất trái phiếu chính phủ kỳ hạn tương ứng. Cả hai cách được chấp nhận nhưng phải nhất quán (CAPM, chi phí cơ hội, MIRR, ERP cùng cơ sở) và ghi nguồn. Lãi tiết kiệm có thể là kỳ hạn ngắn tái tục; trái phiếu chính phủ cùng kỳ hạn dự án phản ánh đúng hơn lãi phi rủi ro dài hạn. Không bịa số trái phiếu: lấy từ m07 hoặc người dùng.
  - id: "m06-pitfalls-6"
    title: "Lỗi thường gặp: LỖI 6: bảng beta theo loại tài sản chỉ là heuristic chưa kiểm chứng; confidence thấp. Ưu tiên beta …"
    tags: ["lỗi", "thường", "gặp", "bảng", "beta", "theo", "loại", "tài", "sản", "chỉ", "là", "heuristic"]
    text: |-
      LỖI 6: bảng beta theo loại tài sản chỉ là heuristic chưa kiểm chứng; confidence thấp. Ưu tiên beta ngành hoặc công ty so sánh un-lever/re-lever, và chạy độ nhạy beta.
  - id: "m06-pitfalls-7"
    title: "Lỗi thường gặp: LỖI 7: trường hợp cá nhân T = 0% giả định không có thuế. Thực tế thu nhập cho thuê tài sản và chuyể…"
    tags: ["lỗi", "thường", "gặp", "trường", "hợp", "cá", "nhân", "giả", "định", "không", "có", "thuế"]
    text: |-
      LỖI 7: trường hợp cá nhân T = 0% giả định không có thuế. Thực tế thu nhập cho thuê tài sản và chuyển nhượng BĐS của cá nhân tại VN có thể chịu thuế (cần xác nhận hiện hành). Nếu có thuế thật, T = 0 làm quá lạc quan dòng tiền cá nhân.
  - id: "m06-pitfalls-8"
    title: "Lỗi thường gặp: Dùng WACC tỷ trọng cố định cho dự án trả gốc đều: nợ giảm dần nên tỷ trọng D/V giảm; coi WACC là xấ…"
    tags: ["lỗi", "thường", "gặp", "dùng", "wacc", "tỷ", "trọng", "cố", "định", "cho", "dự", "án"]
    text: |-
      Dùng WACC tỷ trọng cố định cho dự án trả gốc đều: nợ giảm dần nên tỷ trọng D/V giảm; coi WACC là xấp xỉ và kiểm tra chéo bằng FCFE/Re.
  - id: "m06-pitfalls-9"
    title: "Lỗi thường gặp: Khấu hao cả giá trị đất; đất không khấu hao. Prompt gốc khấu hao toàn bộ 1,3 tỷ vì đơn giản hóa."
    tags: ["lỗi", "thường", "gặp", "khấu", "hao", "cả", "giá", "trị", "đất", "không", "prompt", "gốc"]
    text: |-
      Khấu hao cả giá trị đất; đất không khấu hao. Prompt gốc khấu hao toàn bộ 1,3 tỷ vì đơn giản hóa.
  - id: "m06-pitfalls-10"
    title: "Lỗi thường gặp: Hàm NPV Excel bỏ năm 0; hàm IRR/MIRR cần dòng tiền cùng kỳ (năm hoặc tháng)."
    tags: ["lỗi", "thường", "gặp", "hàm", "npv", "excel", "bỏ", "năm", "irr", "mirr", "cần", "dòng"]
    text: |-
      Hàm NPV Excel bỏ năm 0; hàm IRR/MIRR cần dòng tiền cùng kỳ (năm hoặc tháng).
  - id: "m06-pitfalls-11"
    title: "Lỗi thường gặp: Quên chi phí giao dịch ban đầu (phí chuyển nhượng, công chứng, phí vay, sửa chữa) và vốn lưu động (…"
    tags: ["lỗi", "thường", "gặp", "quên", "chi", "phí", "giao", "dịch", "ban", "đầu", "chuyển", "nhượng"]
    text: |-
      Quên chi phí giao dịch ban đầu (phí chuyển nhượng, công chứng, phí vay, sửa chữa) và vốn lưu động (tiền đặt cọc).
  - id: "m06-pitfalls-12"
    title: "Lỗi thường gặp: Dự báo lạc quan một chiều: không stress, không hòa vốn, không post-audit."
    tags: ["lỗi", "thường", "gặp", "dự", "báo", "lạc", "quan", "một", "chiều", "không", "stress", "hòa"]
    text: |-
      Dự báo lạc quan một chiều: không stress, không hòa vốn, không post-audit.
  - id: "m06-sme_vn_guidance-1"
    title: "Lưu ý SME Việt Nam: Nhà đầu tư cá nhân mua BĐS cho thuê bằng vay ngân hàng: lợi suất thuê thuần thường thấp so với lãi …"
    tags: ["lưu", "sme", "việt", "nam", "nhà", "đầu", "tư", "cá", "nhân", "mua", "bđs", "cho"]
    text: |-
      Nhà đầu tư cá nhân mua BĐS cho thuê bằng vay ngân hàng: lợi suất thuê thuần thường thấp so với lãi vay nên dòng tiền hằng năm có thể âm lâu; cần quỹ dự phòng và tăng giá để bù. Luôn tính điểm hòa vốn tăng giá.
  - id: "m06-sme_vn_guidance-2"
    title: "Lưu ý SME Việt Nam: Thuế cho thuê và chuyển nhượng của cá nhân tại VN có thể gồm thuế GTGT và thuế TNCN trên doanh thu …"
    tags: ["lưu", "sme", "việt", "nam", "thuế", "cho", "thuê", "và", "chuyển", "nhượng", "của", "cá"]
    text: |-
      Thuế cho thuê và chuyển nhượng của cá nhân tại VN có thể gồm thuế GTGT và thuế TNCN trên doanh thu cho thuê vượt một ngưỡng doanh thu năm, và thuế TNCN trên giá chuyển nhượng BĐS. Mức thuế, ngưỡng và cách khai thay đổi theo thời kỳ: CẦN XÁC NHẬN theo quy định hiện hành hoặc hỏi kế toán/thuế trước khi dùng T = 0.
  - id: "m06-sme_vn_guidance-3"
    title: "Lưu ý SME Việt Nam: Lãi vay ngân hàng VN thường cố định ưu đãi 1-3 năm rồi thả nổi theo lãi tiết kiệm cộng biên độ; hợp…"
    tags: ["lưu", "sme", "việt", "nam", "lãi", "vay", "ngân", "hàng", "vn", "thường", "cố", "định"]
    text: |-
      Lãi vay ngân hàng VN thường cố định ưu đãi 1-3 năm rồi thả nổi theo lãi tiết kiệm cộng biên độ; hợp đồng cho vay 20 năm là điển hình. Stress lãi tăng 2-3 điểm phần trăm sau giai đoạn ưu đãi (số liệu hợp đồng cụ thể: xác nhận với ngân hàng).
  - id: "m06-sme_vn_guidance-4"
    title: "Lưu ý SME Việt Nam: Đứng tên doanh nghiệp: phải đủ thu nhập chịu thuế để dùng lá chắn; chi phí lãi vay được trừ có thể …"
    tags: ["lưu", "sme", "việt", "nam", "đứng", "tên", "doanh", "nghiệp", "phải", "đủ", "thu", "nhập"]
    text: |-
      Đứng tên doanh nghiệp: phải đủ thu nhập chịu thuế để dùng lá chắn; chi phí lãi vay được trừ có thể bị khống chế theo quy định (cần xác nhận Nghị định hiện hành); rút tiền về cá nhân có thể chịu thêm thuế cổ tức; thêm chi phí kế toán, báo cáo thuế.
  - id: "m06-sme_vn_guidance-5"
    title: "Lưu ý SME Việt Nam: Công cụ: Google Sheets/Excel là đủ cho mô hình 20 năm (cột năm, các dòng NOI, FCFF, FCFE); dùng Dat…"
