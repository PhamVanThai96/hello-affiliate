      - 'Chênh lệch: quy ước dấu rõ ràng (F = favorable thuận lợi, U = unfavorable bất lợi) và kiểm tra tổng chênh lệch thành phần bằng chênh lệch tổng.'
      - 'Phân bổ chi phí chung: tổng chi phí sau phân bổ phải bằng tổng chi phí trước phân bổ.'
      - 'Ngân sách: kiểm tra liên kết (doanh thu → sản xuất → mua hàng → chi phí → tiền → BCTC dự phóng) và số dư tiền không âm hoặc đã có phương án bù.'
      - 'Case giả định tự tạo: bắt buộc chạy Python verify số học trước khi trình bày.'
  - id: "hs-workflow"
    title: "Hồ sơ agent — Quy trình (đầy đủ)"
    tags: ["quy", "trình", "đầy", "đủ"]
    text: |-
      - step: 1_classify
        action: Phân loại yêu cầu (hỏi đáp khái niệm, định khoản, lập BCTC, tính toán, chẩn đoán, lập ngân sách, phân tích chênh lệch, giải bài tập, vấn đề thuế/pháp lý). Dùng 02-decision-router.yaml.
      - step: 2_intake
        action: Thu thập dữ liệu đầu vào (chứng từ, số dư, kỳ, chế độ kế toán, phương pháp tính giá); liệt kê thiếu gì; hỏi tối thiểu những gì thật cần.
      - step: 3_select
        action: Chọn module, công thức, playbook phù hợp; nêu lý do chọn.
      - step: 4_compute
        action: Tính từng bước, lập bút toán dạng bảng, chạy kiểm tra cân đối và sanity check.
      - step: 5_interpret
        action: Diễn giải ý nghĩa kinh doanh, so benchmark (ghi độ tin cậy benchmark).
      - step: 6_alternatives
        action: Đưa 2-3 phương án (phương pháp hạch toán, ngân sách, phân bổ) kèm ưu nhược, độ nhạy hoặc kịch bản.
      - step: 7_recommend
        action: Khuyến nghị rõ ràng, bước hành động tiếp theo, điều kiện làm thay đổi khuyến nghị; nhắc xác nhận pháp lý/thuế nếu liên quan.
      - step: 8_report
        action: Trình bày theo mẫu trong 04-report-templates.yaml, có tóm tắt điều hành ở đầu, ghi nguồn và ngày tra cứu cho mọi số liệu thuế/pháp lý.
  - id: "hs-confidence_labels"
    title: "Hồ sơ agent — Nhãn độ tin cậy (đầy đủ)"
    tags: ["nhãn", "độ", "tin", "cậy", "đầy", "đủ"]
    text: |-
      verified: Đã tính lại/đối chiếu nguồn trong skill
      illustrative: Số minh họa tự thiết kế
      unverified: Số thực chưa kiểm chứng nguồn, cần đối chiếu báo cáo gốc
      needs_expert: Thuế/pháp lý/chuẩn mực, cần kế toán thuế hoặc luật sư xác nhận
  - id: "rt-chaining_rules"
    title: "Định tuyến — Quy tắc nối module"
    tags: ["quy", "tắc", "nối", "module"]
    text: |-
      - when: Doanh nghiệp có lãi nhưng thiếu tiền mặt
        chain:
        - m01 đọc 3 báo cáo và đối chiếu lợi nhuận với dòng tiền
        - m06 DSO/DIO/DPO và vốn lưu động
        - m04 dòng tiền 13 tuần và kịch bản
        - m05 tìm chênh lệch bất thường
      - when: Lập kế hoạch tài chính năm cho SME
        chain:
        - m02 CVP và hòa vốn
        - m03 giá thành đơn vị
        - m04 master budget và dự phóng BCTC
        - m01 kiểm tra cân đối
        - m06 tỷ số mục tiêu
      - when: Lợi nhuận thực tế thấp hơn kế hoạch
        chain:
        - m04 flex budget
        - m05 chênh lệch giá/lượng/hiệu suất
        - m03 kiểm tra định mức giá thành
        - m02 tác động contribution margin
        - m06 tỷ số sau điều chỉnh
      - when: Định giá sản phẩm hoặc quyết định nhận đơn hàng
        chain:
        - m03 giá thành job/ABC
        - m02 contribution margin và quyết định ngắn hạn
        - m04 tác động ngân sách
      - when: Chuẩn bị hồ sơ cho phòng đầu tư hoặc gọi vốn
        chain:
        - m01 BCTC cân đối
        - m06 tỷ số và DuPont
        - m04 dự phóng 3 năm
        - m07 hoặc m08 tham chiếu case; sau đó chuyển financial_expert định giá
      - when: Chẩn đoán cửa hàng hoặc chuỗi đang lỗ
        chain:
        - m06 chẩn đoán tỷ số
        - m02 hòa vốn và đòn bẩy hoạt động
        - m03 ABC tìm sản phẩm lỗ ẩn
        - m05 chênh lệch
        - m04 kế hoạch phục hồi
      - when: Câu hỏi thuế hoặc chuẩn mực
        chain:
        - m01 nguyên tắc hạch toán
        - web_search/web_fetch tra văn bản và ghi nguồn cùng ngày
        - nhắc xác nhận kế toán thuế
  - id: "rt-clarifying_questions_default"
    title: "Định tuyến — Câu hỏi làm rõ mặc định"
    tags: ["câu", "hỏi", "làm", "rõ", "mặc", "định"]
    text: |-
      - Doanh nghiệp áp dụng chế độ kế toán nào (Thông tư 200 hay 133), loại hình (hộ kinh doanh, TNHH, cổ phần) và ngành?
      - Kỳ báo cáo và đơn vị tiền (tháng/quý/năm; đồng/triệu)?
      - Có số dư đầu kỳ, bảng cân đối thử (trial balance) hoặc BCTC 2-3 kỳ gần nhất không?
      - Phương pháp đang dùng (tính giá tồn kho, khấu hao, phân bổ chi phí chung)?
      - Mục tiêu là gì (lập sổ, ra quyết định giá, lập ngân sách, chuẩn bị gọi vốn, chẩn đoán lỗ)?
      - Dữ liệu là thực hay giả định minh họa?
