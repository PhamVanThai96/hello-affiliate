      q: 'Công đoạn pha trộn: hoàn thành 2.000; WIP cuối 500 (NVL 100%, chế biến 60%); NVL 50.000.000, chế biến 36.800.000 (đã gồm WIP đầu). Tính EU, giá thành đơn vị, thành phẩm và WIP cuối.'
      a: EU NVL 2.500 (20.000/EU); EU chế biến 2.300 (16.000/EU); giá thành 36.000; thành phẩm 72.000.000; WIP cuối 14.800.000; tổng 86.800.000.
  - id: "m03-practice_questions-3"
    title: "Câu hỏi luyện tập: Cửa hàng quà tặng MOH 100 triệu (đóng gói 40 triệu/2.000 gói; giao 60 triệu/1.000 chuyến). Sỉ: 300 …"
    tags: ["câu", "hỏi", "luyện", "tập", "cửa", "hàng", "quà", "tặng", "moh", "100", "triệu", "đóng"]
    text: |-
      q: 'Cửa hàng quà tặng MOH 100 triệu (đóng gói 40 triệu/2.000 gói; giao 60 triệu/1.000 chuyến). Sỉ: 300 gói, 100 chuyến; lẻ: 1.700 gói, 900 chuyến. Phân bổ theo ABC?'
      a: Sỉ 12.000.000; lẻ 88.000.000; khách lẻ tốn gấp khoảng 7,3 lần; chia theo doanh thu cho sỉ 60 triệu, lẻ 40 triệu.
  - id: "m03-practice_questions-4"
    title: "Câu hỏi luyện tập: Bộ phận CSKH 54 triệu/tháng, 36.000 phút; gọi 6 phút, email 3 phút; 3.000 cuộc gọi, 4.000 email. Tí…"
