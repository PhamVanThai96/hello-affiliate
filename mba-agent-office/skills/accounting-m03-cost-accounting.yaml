      q: Xưởng cơ khí ước tính MOH 480.000.000 và 8.000 giờ lao động. Thực tế MOH 470.000.000; 7.600 giờ. Tính POHR, MOH áp dụng, under/over và bút toán nếu không trọng yếu.
      a: POHR 60.000/giờ; applied 456.000.000; under-applied 14.000.000; Nợ 632 / Có 627 = 14.000.000.
  - id: "m03-practice_questions-2"
    title: "Câu hỏi luyện tập: Công đoạn pha trộn: hoàn thành 2.000; WIP cuối 500 (NVL 100%, chế biến 60%); NVL 50.000.000, chế bi…"
