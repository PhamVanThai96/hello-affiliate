  - id: "m03-practice_questions-7"
    title: "Câu hỏi luyện tập: Vì sao Process Costing phải tính EU riêng cho NVL và chế biến?"
    tags: ["câu", "hỏi", "luyện", "tập", "vì", "sao", "process", "costing", "phải", "tính", "eu", "riêng"]
    text: |-
      q: Vì sao Process Costing phải tính EU riêng cho NVL và chế biến?
      a: NVL thường vào đầu quy trình (100% ngay), chế biến hoàn thành dần theo tiến độ; dùng một cột EU sẽ định giá sai WIP và thành phẩm.
  - id: "m03-practice_questions-8"
    title: "Câu hỏi luyện tập: Tại sao tổng lợi nhuận không đổi giữa Traditional và ABC mà ABC vẫn quan trọng?"
    tags: ["câu", "hỏi", "luyện", "tập", "tại", "sao", "tổng", "lợi", "nhuận", "không", "đổi", "giữa"]
    text: |-
      q: Tại sao tổng lợi nhuận không đổi giữa Traditional và ABC mà ABC vẫn quan trọng?
      a: Tổng MOH không đổi; ABC chỉ phân bổ lại. Giá trị là quyết định đúng (giá, mix, khách) vì đối tượng được trợ giá chéo lộ ra.
  - id: "m03-practice_questions-9"
    title: "Câu hỏi luyện tập: Sản xuất 1.200, bán 1.000 (đơn giá định phí 40.000/sp). Absorption lãi nhiều hơn variable bao nhiêu…"
    tags: ["câu", "hỏi", "luyện", "tập", "sản", "xuất", "200", "bán", "000", "đơn", "giá", "định"]
    text: |-
      q: Sản xuất 1.200, bán 1.000 (đơn giá định phí 40.000/sp). Absorption lãi nhiều hơn variable bao nhiêu và vì sao?
      a: (1.200 - 1.000) x 40.000 = 8.000.000; định phí nằm trong 200 sp tồn kho.
