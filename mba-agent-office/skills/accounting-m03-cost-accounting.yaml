  - id: "m03-excel_google_sheets_templates-1"
    title: "Mẫu Excel/Sheets: Job Cost Sheet"
    tags: ["mẫu", "excel", "sheets", "job", "cost", "sheet"]
    text: |-
      name: Job Cost Sheet
      description: 'A: mã job/ngày/khách; B: NVL (mã, số lượng, đơn giá, thành tiền); C: nhân công (loại thợ, giờ, đơn giá); D: MOH = POHR x giờ; E: tổng giá thành, giá bán, lãi gộp, %; F: so giá báo vs thực tế.'
  - id: "m03-excel_google_sheets_templates-2"
    title: "Mẫu Excel/Sheets: ABC cho SME (5 sheet)"
    tags: ["mẫu", "excel", "sheets", "abc", "cho", "sme", "sheet"]
    text: |-
      name: ABC cho SME (5 sheet)
      description: Pools (hoạt động và chi phí từ sổ chi tiết); Drivers (số lượng driver từng sản phẩm/khách); Rates (= Pool/Total driver); Allocation (ma trận sản phẩm x hoạt động = rate x driver); Compare (Traditional vs ABC, check tổng phân bổ - tổng pool = 0).
  - id: "m03-excel_google_sheets_templates-3"
    title: "Mẫu Excel/Sheets: Công thức Excel gợi ý"
    tags: ["mẫu", "excel", "sheets", "công", "thức", "gợi"]
    text: |-
      name: Công thức Excel gợi ý
      description: POHR =SUM(MOH_est)/SUM(Base_est); Applied =POHR*Actual_Base; Under/Over =Actual_MOH-Applied_MOH (dương = under); EU =Completed+WIP_end*Pct; Activity rate =Pool/Total_Driver; Check =SUM(Allocated)-SUM(Pools) phải bằng 0.
  - id: "m03-excel_google_sheets_templates-4"
    title: "Mẫu Excel/Sheets: Process Costing report"
    tags: ["mẫu", "excel", "sheets", "process", "costing", "report"]
    text: |-
      name: Process Costing report
      description: 'Các cột: luồng số lượng, EU NVL, EU chế biến, chi phí gộp, cost per EU, phân bổ thành phẩm và WIP cuối, ô kiểm tra tổng.'
