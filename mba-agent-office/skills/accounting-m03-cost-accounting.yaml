      name: TasteVN - mở rộng khi không biết chi phí thực
      type: failure
      setup: 3 chi nhánh TP.HCM, tổng lãi 8% nên mở thêm 5 chi nhánh; không có food cost từng món, P&L từng chi nhánh/kênh.
      key_calculations:
      - Q1 lãi 50 (10%), Q7 36 (12%), Thủ Đức -6 (-3%); tổng +80 (8%).
      - BE Q1 ~423,1; Q7 ~246,3; Thủ Đức 210 > doanh thu 200 (biên an toàn -5%).
      - Food cost bình quân 33,3%; giảm món Âu fusion 45% -> 38% tiết kiệm 2,1% doanh thu ~ 21 triệu/tháng.
      lesson: 'Biết tổng thể có lãi chưa đủ; Cost Accounting là tiền đề của scaling; nhân rộng mô hình chưa tối ưu là nhân rộng lỗ; cắt món cần xét chi phí tránh được và chi phí cơ hội. Hậu quả giả định: đóng 2 chi nhánh sau 18 tháng, lỗ khoảng 3 tỷ.'
      data_reliability: illustrative
  - id: "m03-case_lessons-3"
    title: "Bài học case: Xưởng in bao bì Hải Long - đơn nhỏ lời trên giấy, lỗ khi ABC"
    tags: ["bài", "học", "case", "xưởng", "in", "bao", "bì", "hải", "long", "đơn", "nhỏ", "lời"]
    text: |-
      name: Xưởng in bao bì Hải Long - đơn nhỏ lời trên giấy, lỗ khi ABC
      type: sme
      setup: Bình Dương, 18 nhân sự, 2 máy in offset; MOH 960 triệu/năm, 4.800 giờ máy; POHR 200.000/giờ; chủ ưu tiên đơn nhỏ vì biên Traditional cao.
      key_calculations:
      - 'Traditional: P-101 giá thành 126.000.000 (lãi 10,0%); P-102 11.400.000 (lãi 18,6%).'
      - 'ABC rates: setup 500.000/lần, mẫu 500.000/mẫu, máy 68.750/giờ, giao 150.000/lần.'
      - 'ABC MOH: P-101 11.050.000; P-102 5.475.000 -> lãi P-101 19,25%, P-102 -3,4%.'
      - Giá tối thiểu P-102 để biên 15% = 14.475.000/0,85 = 17.029.412 (+21,6%).
      - 'Under-applied cuối năm: 972.000.000 - 4.700 x 200.000 = 32.000.000 (Nợ 632 / Có 627).'
      lesson: 'Biên Traditional có thể đẹp giả; đơn nhỏ nhiều setup/mẫu là nguồn rò rỉ lợi nhuận; khách lớn đang trả hộ khách nhỏ. Giải pháp: phí setup/mẫu, MOQ, gom lô, chuẩn hóa mẫu; chỉ cần ABC 3-4 hoạt động.'
      data_reliability: illustrative
  - id: "m03-worked_examples-1"
    title: "Ví dụ có lời giải: we_job_costing — Xưởng cơ khí Tân Phát - tính giá thành job và quyết toán MOH cuối năm (SME VN, ví dụ mới)"
    tags: ["ví", "dụ", "có", "lời", "giải", "we_job_costing", "xưởng", "cơ", "khí", "tân", "phát", "tính"]
    text: |-
      id: we_job_costing
      name: Xưởng cơ khí Tân Phát - tính giá thành job và quyết toán MOH cuối năm (SME VN, ví dụ mới)
      scenario: 'Xưởng cơ khí nhỏ tại Bình Dương; ngân sách MOH 480.000.000 và 8.000 giờ lao động trực tiếp (DLH) cả năm. Job C-07: gia công khung thép; vật tư 18.000.000, 90 giờ thợ x 70.000/giờ, giá bán 38.000.000. Cuối năm thực tế MOH 470.000.000, DLH 7.600.'
      inputs:
        est_moh: 480000000
        est_dlh: 8000
        dm: 18000000
        dl_hours: 90
        dl_rate: 70000
        price: 38000000
        actual_moh: 470000000
        actual_dlh: 7600
      steps:
      - POHR = 480.000.000 / 8.000 = 60.000/giờ.
      - DL job = 90 x 70.000 = 6.300.000; MOH áp dụng = 90 x 60.000 = 5.400.000.
      - Giá thành job C-07 = 18.000.000 + 6.300.000 + 5.400.000 = 29.700.000; lãi gộp = 8.300.000 = 21,84%.
      - 'Bút toán nguyên tắc (cần xác nhận): xuất vật tư Nợ 621 / Có 152 = 18.000.000; lương công nhân Nợ 622 / Có 334 = 6.300.000; MOH phân bổ Nợ 154 / Có 627 = 5.400.000 (kết chuyển Nợ 154 / Có 621, 622); giao hàng Nợ 632 / Có 155 = 29.700.000 (nếu nhập kho).'
      - 'Cuối năm: applied = 7.600 x 60.000 = 456.000.000; variance = 470.000.000 - 456.000.000 = 14.000.000 under-applied.'
      - 'Nếu không trọng yếu: Nợ 632 / Có 627 = 14.000.000. Nguyên nhân: DLH thực tế 7.600 < 8.000 trong khi định phí không giảm.'
      result: 'Giá thành job 29.700.000 (lãi gộp 21,84%); under-applied 14.000.000, hạch toán vào 632 nếu không trọng yếu; hành động: thêm đơn để lấp công suất.'
  - id: "m03-worked_examples-2"
    title: "Ví dụ có lời giải: we_process_costing — Nước mắm - Process 3, tháng 6: Weighted Average vs FIFO"
    tags: ["ví", "dụ", "có", "lời", "giải", "we_process_costing", "nước", "mắm", "process", "tháng", "weighted", "average"]
    text: |-
      id: we_process_costing
      name: 'Nước mắm - Process 3, tháng 6: Weighted Average vs FIFO'
      scenario: 'WIP đầu 500 lít (NVL 100%, chế biến 80%); bắt đầu 4.000; hoàn thành 3.500; WIP cuối 1.000 (NVL 100%, chế biến 40%). Chi phí: NVL đầu 10.000.000 + phát sinh 80.000.000; chế biến đầu 5.200.000 + phát sinh 53.300.000.'
      inputs:
        wip_begin: 500
        pct_begin: 0.8
        started: 4000
        completed: 3500
        wip_end: 1000
        pct_end_conv: 0.4
        mat_beg: 10000000
        mat_cur: 80000000
        conv_beg: 5200000
        conv_cur: 53300000
      steps:
      - 'Cân đối số lượng: 500 + 4.000 = 4.500 = 3.500 + 1.000.'
      - 'BQGQ: EU NVL = 4.500; EU chế biến = 3.500 + 400 = 3.900.'
      - Rate NVL = 90.000.000/4.500 = 20.000; chế biến = 58.500.000/3.900 = 15.000; giá thành 35.000/lít.
      - Thành phẩm = 3.500 x 35.000 = 122.500.000; WIP cuối = 1.000 x 20.000 + 400 x 15.000 = 26.000.000; tổng 148.500.000.
      - 'FIFO: EU NVL = 0 + 3.000 + 1.000 = 4.000; EU chế biến = 100 + 3.000 + 400 = 3.500; rate NVL 20.000; chế biến 53.300.000/3.500 = 15.228,57.'
      - FIFO thành phẩm = 15.200.000 + 100 x 15.228,57 + 3.000 x 35.228,57 = 122.408.571; WIP cuối = 26.091.429.
      - 'Bút toán nguyên tắc (cần xác nhận): Nợ 155 hoặc chuyển công đoạn sau = 122.500.000 / Có 154; số dư 154 = 26.000.000.'
      result: BQGQ 35.000/lít (thành phẩm 122,5 triệu, WIP 26,0 triệu); FIFO khoảng 34.974/lít; SME dùng BQGQ là đủ.
  - id: "m03-worked_examples-3"
    title: "Ví dụ có lời giải: we_abc_traditional — Công ty bánh: Traditional vs ABC - phát hiện trợ giá chéo"
    tags: ["ví", "dụ", "có", "lời", "giải", "we_abc_traditional", "công", "ty", "bánh", "traditional", "vs", "abc"]
    text: |-
      id: we_abc_traditional
      name: 'Công ty bánh: Traditional vs ABC - phát hiện trợ giá chéo'
      scenario: 'MOH 500 triệu. Bánh A: 10.000 cái, 5.000 giờ máy, 10 setup, 20 QC, 50 đơn giao, giá 70.000, chi phí trực tiếp 30.000. Bánh B: 2.000 cái, 1.000 giờ máy, 40 setup, 60 QC, 150 đơn giao, giá 220.000, chi phí trực tiếp 45.000. Pool: setup 150 triệu/50 lần; QC 100 triệu/80; giao 150 triệu/200; bảo trì 100 triệu/6.000 giờ.'
      steps:
      - 'Traditional: POHR = 500.000.000/6.000 = 83.333/giờ máy; MOH/cái cả hai = 41.667.'
      - 'ABC rates: setup 3.000.000/lần; QC 1.250.000/lần; giao 750.000/đơn; bảo trì 16.667/giờ.'
      - 'MOH ABC: A = 175.833.333 (17.583/cái); B = 324.166.667 (162.083/cái); tổng 500.000.000.'
      - 'Lãi/cái: Traditional A -1.667 (lỗ 16,7 triệu), B +133.333; ABC A +22.417 (32,0%), B +12.917 (5,9%).'
      - Tổng lợi nhuận 250 triệu cả hai cách.
      result: 'Quyết định đảo ngược: Bánh A là ngôi sao, Bánh B lãi mỏng 5,9% do setup/QC/giao hàng; cần tăng giá, gom lô, giảm setup.'
  - id: "m03-worked_examples-4"
    title: "Ví dụ có lời giải: we_giftshop_abc — Cửa hàng quà tặng: ABC phát hiện khách lẻ tốn gấp 7,3 lần (SME VN)"
    tags: ["ví", "dụ", "có", "lời", "giải", "we_giftshop_abc", "cửa", "hàng", "quà", "tặng", "abc", "phát"]
    text: |-
      id: we_giftshop_abc
      name: 'Cửa hàng quà tặng: ABC phát hiện khách lẻ tốn gấp 7,3 lần (SME VN)'
      scenario: 'MOH 100.000.000/tháng: đóng gói 40.000.000 (2.000 gói), giao hàng 60.000.000 (1.000 chuyến). Khách sỉ doanh thu 600 triệu, 300 gói, 100 chuyến; khách lẻ 400 triệu, 1.700 gói, 900 chuyến.'
      steps:
      - Rate đóng gói = 40.000.000/2.000 = 20.000/gói; giao = 60.000.000/1.000 = 60.000/chuyến.
      - 'Theo doanh thu: sỉ 60.000.000, lẻ 40.000.000.'
      - 'ABC: sỉ = 300x20.000 + 100x60.000 = 12.000.000; lẻ = 1.700x20.000 + 900x60.000 = 88.000.000; tổng 100.000.000.'
      result: Khách lẻ tốn gấp khoảng 7,3 lần dù doanh thu thấp hơn -> đặt phí giao hàng, mức đơn tối thiểu hoặc giá bậc thang.
  - id: "m03-worked_examples-5"
    title: "Ví dụ có lời giải: we_absorption_variable — Absorption vs Variable Costing"
    tags: ["ví", "dụ", "có", "lời", "giải", "we_absorption_variable", "absorption", "vs", "variable", "costing"]
    text: |-
      id: we_absorption_variable
      name: Absorption vs Variable Costing
      scenario: Biến phí SX 100.000/sp; định phí SX chung 50.000.000/kỳ; sản xuất 1.000; bán 800 giá 250.000.
      steps:
      - Giá thành absorption = 100.000 + 50.000.000/1.000 = 150.000.
      - Lợi nhuận absorption = 800 x 250.000 - 800 x 150.000 = 80.000.000.
      - Lợi nhuận variable = 800 x 150.000 - 50.000.000 = 70.000.000.
      - Chênh lệch = 200 x 50.000 = 10.000.000 (định phí nằm trong 200 sp tồn kho).
      - Nếu bán hết 1.000 sp thì cả hai cùng 100.000.000.
      result: Chênh 10 triệu do tồn kho; sản xuất thừa làm absorption đẹp hơn.
  - id: "m03-worked_examples-6"
    title: "Ví dụ có lời giải: we_tdabc — TDABC bộ phận CSKH và xử lý đơn"
    tags: ["ví", "dụ", "có", "lời", "giải", "we_tdabc", "tdabc", "bộ", "phận", "cskh", "và", "xử"]
    text: |-
      id: we_tdabc
      name: TDABC bộ phận CSKH và xử lý đơn
      scenario: Bộ phận CSKH chi phí 54.000.000/tháng, 36.000 phút thực dụng. Cuộc gọi 6 phút, email 3 phút; tháng này 3.000 cuộc gọi và 4.000 email.
      steps:
      - Chi phí/phút = 54.000.000/36.000 = 1.500.
      - Cuộc gọi = 6 x 1.500 = 9.000; email = 3 x 1.500 = 4.500.
      - Phút dùng = 3.000x6 + 4.000x3 = 30.000; sử dụng = 83,3%; nhàn rỗi 6.000 phút = 9.000.000.
      result: Công suất nhàn rỗi 9.000.000/tháng; xem xét giảm người hoặc nhận thêm việc.
  - id: "m03-worked_examples-7"
    title: "Ví dụ có lời giải: we_target_cost_be — Target Costing và hòa vốn chuỗi cà phê"
    tags: ["ví", "dụ", "có", "lời", "giải", "we_target_cost_be", "target", "costing", "và", "hòa", "vốn", "chuỗi"]
    text: |-
      id: we_target_cost_be
      name: Target Costing và hòa vốn chuỗi cà phê
      scenario: 'Giá thị trường 450.000, biên 25%, chi phí hiện tại 360.000. Cà phê: định phí 90 triệu/tháng, giá 60.000/ly, biến phí 24.000/ly.'
      steps:
      - Target cost = 450.000 x 75% = 337.500; gap = 22.500 (6,25% chi phí hiện tại).
      - CM/ly = 36.000; BE = 90.000.000/36.000 = 2.500 ly; doanh thu BE = 150.000.000.
      - 'Bán 2.000 ly: 72.000.000 - 90.000.000 = -18.000.000.'
      result: Cần cắt 22.500/sp để đạt biên; chi nhánh cà phê chưa đạt 2.500 ly không nên nhân rộng.
  - id: "m03-worked_examples-8"
    title: "Ví dụ có lời giải: we_cogm_cogs — Báo cáo giá thành và giá vốn kỳ (ví dụ mới)"
    tags: ["ví", "dụ", "có", "lời", "giải", "we_cogm_cogs", "báo", "cáo", "giá", "thành", "và", "vốn"]
    text: |-
      id: we_cogm_cogs
      name: Báo cáo giá thành và giá vốn kỳ (ví dụ mới)
      scenario: DM 120 triệu, DL 60 triệu, MOH 80 triệu (đã điều chỉnh), WIP đầu 20, WIP cuối 30; thành phẩm đầu 40, cuối 55 (triệu).
      steps:
      - COGM = 120 + 60 + 80 + 20 - 30 = 250 triệu.
      - COGS = 40 + 250 - 55 = 235 triệu.
      - 'Bút toán nguyên tắc (cần xác nhận): Nợ 154 / Có 621, 622, 627 = 260 triệu; nhập kho Nợ 155 / Có 154 = 250 triệu; giá vốn Nợ 632 / Có 155 = 235 triệu.'
      result: COGM 250 triệu; COGS 235 triệu; WIP cuối 30 triệu và thành phẩm cuối 55 triệu là tài sản trên Balance Sheet.
  - id: "m03-practice_questions-1"
    title: "Câu hỏi luyện tập: Xưởng cơ khí ước tính MOH 480.000.000 và 8.000 giờ lao động. Thực tế MOH 470.000.000; 7.600 giờ. Tí…"
