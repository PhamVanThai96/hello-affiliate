  - id: "m03-case_lessons-1"
    title: "Bài học case: HP - ABC phơi bày lợi nhuận thật dòng máy in (mô hình giả định)"
    tags: ["bài", "học", "case", "hp", "abc", "phơi", "bày", "lợi", "nhuận", "thật", "dòng", "máy"]
    text: |-
      name: HP - ABC phơi bày lợi nhuận thật dòng máy in (mô hình giả định)
      type: success
      setup: MOH 600 triệu (đơn vị quy ước); InkJet 40.000 máy (nhỏ, nhiều đơn lẻ), LaserJet 8.000 máy; phân bổ Traditional theo giờ lao động 10.000 giờ vs ABC 4 hoạt động (mua hàng, QC, hỗ trợ KH, giao hàng).
      key_calculations:
      - POHR = 600.000.000 / 10.000 = 60.000/giờ; InkJet 3.000/máy, LaserJet 60.000/máy.
      - 'ABC: InkJet 410.000.000 (10.250/máy), LaserJet 190.000.000 (23.750/máy).'
      - 'Lãi/máy: InkJet 9.000 (45%) -> 1.750 (8,75%); LaserJet 10.000 (10%) -> 46.250 (46,25%).'
      - Tổng lợi nhuận không đổi 440.000.000; InkJet chiếm 20% giờ lao động nhưng tiêu thụ 68% overhead.
      lesson: 'ABC phá vỡ ảo tưởng lợi nhuận do trợ giá chéo. Sản phẩm đơn giản chưa chắc rẻ, phức tạp chưa chắc đắt. Hành động: giảm chi phí hỗ trợ InkJet, gom đơn mua, định giá lại hoặc chuyển margin sang vật tư tiêu hao.'
      data_reliability: illustrative
