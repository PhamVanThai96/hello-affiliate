      name: P/B vị trọng tài của ngân hàng (SHB) và vô nghĩa với asset-light (Grab) - minh họa prompt gốc
      type: success
      setup: 'Prompt gốc nêu: ngân hàng có tài sản là tiền và khoản vay thanh khoản nên P/B là thước đo chính; công ty công nghệ/asset-light có giá trị ở hiệu ứng mạng lưới nên P/B cao và vô nghĩa.'
      key_calculations:
      - P/B ngân hàng hợp lý = (ROE - g)/(Re - g).
      - 'Công ty asset-light: dùng EV/Sales, EV/EBITDA, PEG, DCF.'
      lesson: Chọn multiple theo nơi giá trị nằm; không áp P/B máy móc.
      data_reliability: unverified
  - id: "m04-case_lessons-3"
    title: "Bài học case: WeWork - định giá dựa trên tăng trưởng tưởng tượng (bài học từ prompt gốc)"
    tags: ["bài", "học", "case", "wework", "định", "giá", "dựa", "trên", "tăng", "trưởng", "tưởng", "tượng"]
    text: |-
      name: WeWork - định giá dựa trên tăng trưởng tưởng tượng (bài học từ prompt gốc)
      type: failure
      setup: Prompt gốc nêu WeWork vẽ kịch bản tăng trưởng quá cao để định giá; multiple dựa trên doanh thu/tăng trưởng (EV/Sales) không phản ánh kinh tế đơn vị.
      key_calculations:
      - 'EV/Sales cao chỉ hợp lý nếu biên lợi nhuận mục tiêu đủ lớn: EV/Sales = biên x EV/EBITDA-hay-EV/FCF tương ứng.'
      lesson: Không đưa tăng trưởng 30-50% nhiều năm vào EPS/doanh thu dự phóng; multiple trên doanh thu phải kèm biên và con đường đạt biên.
      data_reliability: unverified
  - id: "m04-worked_examples-1"
    title: "Ví dụ có lời giải: m04_ex_bank_pb_roe — Ngân hàng 'NH Minh họa A': giá hợp lý bằng P/B theo ROE (giả định minh họa)"
    tags: ["ví", "dụ", "có", "lời", "giải", "m04_ex_bank_pb_roe", "ngân", "hàng", "nh", "minh", "họa", "giá"]
    text: |-
      id: m04_ex_bank_pb_roe
      title: 'Ngân hàng ''NH Minh họa A'': giá hợp lý bằng P/B theo ROE (giả định minh họa)'
      inputs:
        bvps: 20000
        roe: 0.17
        g: 0.08
        re: 0.14
        price: 27000
      steps:
      - 'Bối cảnh: ngân hàng giả định có BVPS 20.000 VND, ROE chuẩn hóa 17%, giữ lại 47% lợi nhuận nên g = ROE x b ~ 8%; Re 14% theo CAPM (giả định). Thị giá 27.000 VND.'
      - P/B hợp lý = (0,17 - 0,08)/(0,14 - 0,08) = 0,09/0,06 = 1,50x
      - Giá hợp lý = 1,50 x 20.000 = 30.000 VND
      - P/B thị trường = 27.000/20.000 = 1,35x
      - Upside = 30.000/27.000 - 1 = 11,1%; biên an toàn = (30.000 - 27.000)/30.000 = 10,0%
      - 'Bảng nhạy: ROE 15%, g 8%, Re 14% -> P/B 1,17x -> giá 23.333; ROE 17%, g 8%, Re 15% -> 1,29x -> giá 25.714; ROE 17%, g 7%, Re 14% -> 1,43x -> giá 28.571.'
      - 'Diễn giải: thị giá 27.000 nằm trong dải 23.333-30.000 của bảng nhạy; biên an toàn 10% mỏng hơn mặc định 20%.'
      result: P/B hợp lý 1,50x, giá hợp lý 30.000 VND; thị giá 27.000 -> Hợp lý (biên an toàn 10% < 20%), không đủ để gọi Rẻ. Rất nhạy với ROE và Re.
      data_reliability: illustrative
  - id: "m04-worked_examples-2"
    title: "Ví dụ có lời giải: m04_ex_manufacturer_ev_ebitda — Doanh nghiệp sản xuất 'SX Minh họa B': EV/EBITDA và cầu nối về giá cp (giả định minh họa)"
    tags: ["ví", "dụ", "có", "lời", "giải", "m04_ex_manufacturer_ev_ebitda", "doanh", "nghiệp", "sản", "xuất", "sx", "minh"]
    text: |-
      id: m04_ex_manufacturer_ev_ebitda
      title: 'Doanh nghiệp sản xuất ''SX Minh họa B'': EV/EBITDA và cầu nối về giá cp (giả định minh họa)'
      inputs:
        ebitda_bn: 400
        peer_multiples:
        - 6.2
        - 7.0
        - 7.8
        - 8.5
        - 6.8
        adjustment: -0.15
        debt_bn: 900
        cash_bn: 300
        minority_bn: 80
        shares_basic: 100000000
        shares_diluted: 105000000
        price: 14500
      steps:
      - 'Bối cảnh: sản xuất giả định, EBITDA điều chỉnh 400 tỷ; 5 peers cùng ngành có EV/EBITDA 6,2; 7,0; 7,8; 8,5; 6,8.'
      - Trung vị = 7,0x (sắp xếp 6,2; 6,8; 7,0; 7,8; 8,5).
      - Điều chỉnh -15% (quy mô nhỏ, thanh khoản thấp, ít đa dạng hóa sản phẩm) -> 7,0 x 0,85 = 5,95x.
      - EV mục tiêu = 400 x 5,95 = 2.380 tỷ.
      - Nợ ròng = 900 - 300 = 600 tỷ.
      - Vốn chủ = 2.380 - 600 - 80 (thiểu số) = 1.700 tỷ.
      - Giá/cp trên 100 triệu cp = 1.700 x 1e9 / 1e8 = 17.000 VND; trên 105 triệu cp pha loãng = 16.190 VND.
      - Thị giá 14.500 -> upside = 16.190/14.500 - 1 = 11,7% (dùng pha loãng); biên an toàn = (16.190 - 14.500)/16.190 = 10,4%.
      - 'Đối chiếu: EV/EBITDA hiện tại = (14.500 x 105 triệu/1e9 + 600 + 80)/400 = (1.522,5 + 680)/400 = 5,51x, thấp hơn 5,95x mục tiêu.'
      result: Giá hợp lý khoảng 16.190 VND/cp (pha loãng); thị giá 14.500 thấp hơn ~10% so với giá hợp lý -> nằm ở ngưỡng giữa Hợp lý và Rẻ; nếu bỏ cầu nối nợ ròng sẽ cho giá 23.800 VND/cp, sai lệch tới 47%.
      data_reliability: illustrative
  - id: "m04-worked_examples-3"
    title: "Ví dụ có lời giải: m04_ex_bank_normalized — Ngân hàng dọn nợ xấu: P/E TTM 24,3x nhưng P/E chuẩn hóa 11,2x (giả định minh họa)"
    tags: ["ví", "dụ", "có", "lời", "giải", "m04_ex_bank_normalized", "ngân", "hàng", "dọn", "nợ", "xấu", "ttm"]
    text: |-
      id: m04_ex_bank_normalized
      title: 'Ngân hàng dọn nợ xấu: P/E TTM 24,3x nhưng P/E chuẩn hóa 11,2x (giả định minh họa)'
      inputs:
        price: 22000
        shares: 1500000000
        ppop_bn: 5200
        provision_ttm_bn: 3500
        normal_provision_bn: 1500
        tax_rate: 0.2
        bvps: 15000
      steps:
      - 'Bối cảnh: ngân hàng giả định đang dọn nợ xấu; lợi nhuận trước dự phòng (PPOP) 5.200 tỷ; chi phí dự phòng TTM 3.500 tỷ (cao bất thường); thuế 20%; 1,5 tỷ cp; BVPS 15.000; giá 22.000.'
      - LNST TTM = (5.200 - 3.500) x 0,8 = 1.700 x 0,8 = 1.360 tỷ; EPS TTM = 1.360/1,5 = 906,7 VND; P/E TTM = 22.000/906,7 = 24,3x.
      - 'Chuẩn hóa: dự phòng bình thường (credit cost trung bình chu kỳ) 1.500 tỷ. LNST chuẩn hóa = (5.200 - 1.500) x 0,8 = 3.700 x 0,8 = 2.960 tỷ; EPS chuẩn hóa = 1.973,3 VND; P/E chuẩn hóa = 22.000/1.973,3 = 11,1x.'
      - ROE chuẩn hóa = 1.973,3/15.000 = 13,2%; P/B hiện tại = 22.000/15.000 = 1,47x.
      - 'Đối chiếu P/B hợp lý với Re 14% và g 7%: (0,1316 - 0,07)/(0,14 - 0,07) = 0,88x -> giá 13.200 VND. Vì ROE chuẩn hóa 13,2% < Re 14%, P/B 1,47x trông đắt, trái chiều với P/E chuẩn hóa 11,1x.'
      - 'Diễn giải: hai multiple mâu thuẫn, kết quả phụ thuộc ROE bền vững và Re. Cần kiểm tra NPL, LLR, nợ nhóm 2 và độ tin cậy của mức dự phòng ''bình thường'' (có thể đang bị đặt thấp) trước khi kết luận.'
      result: 'P/E TTM 24,3x (đắt do dự phòng bất thường) so với P/E chuẩn hóa 11,1x; nhưng P/B-ROE cho giá hợp lý khoảng 13.200 nên giá 22.000 có thể đắt nếu ROE chuẩn hóa không vượt Re. Kết luận thận trọng: không kết luận Đắt chỉ từ P/E TTM và không kết luận Rẻ cho tới khi xác nhận chất lượng tài sản, ROE bền vững.'
      data_reliability: illustrative
  - id: "m04-worked_examples-4"
    title: "Ví dụ có lời giải: m04_ex_peer_table_football — Bảng peers P/E, EPS dự phóng 2 năm, PEG, football field cho 'CP Minh họa C' (giả định minh họa)"
    tags: ["ví", "dụ", "có", "lời", "giải", "m04_ex_peer_table_football", "bảng", "peers", "eps", "dự", "phóng", "năm"]
    text: |-
      id: m04_ex_peer_table_football
      title: Bảng peers P/E, EPS dự phóng 2 năm, PEG, football field cho 'CP Minh họa C' (giả định minh họa)
      inputs:
        price: 52000
        eps_ttm: 4000
        g1: 0.15
        g2: 0.12
        peer_pe:
        - 9.5
        - 11.0
        - 12.5
        - 10.2
        - 14.0
        adjustment: -0.1
        pb_range:
        - 1.3
        - 1.5
        - 1.8
        bvps: 30000
      steps:
      - 'Bối cảnh: cổ phiếu giả định thị giá 52.000 VND, EPS TTM 4.000 (đã chuẩn hóa, không có bất thường).'
      - 'Dự phóng: EPS năm 1 = 4.000 x 1,15 = 4.600; EPS năm 2 = 4.600 x 1,12 = 5.152 (giả định: doanh thu +10%, biên +1-2 điểm; ghi lý do khi dùng thật).'
      - 'P/E hiện tại: TTM = 52.000/4.000 = 13,0x; forward 1 năm = 52.000/4.600 = 11,3x; forward 2 năm = 52.000/5.152 = 10,1x.'
      - PEG = 11,3/15 = 0,75.
      - 'Peers P/E: 9,5; 10,2; 11,0; 12,5; 14,0 -> trung vị 11,0x; chiết khấu 10% -> 9,9x.'
      - 'Giá hợp lý theo P/E 9,9 x EPS năm 1 4.600 = 45.540 VND; theo EPS năm 2 chiết khấu về hiện tại với Re 13%: 9,9 x 5.152/1,13 = 45.136 VND (cùng cơ sở thận trọng).'
      - Giá theo P/B 1,3-1,5-1,8 x BVPS 30.000 = 39.000 - 45.000 - 54.000 VND.
      - 'Football field (thấp - cơ sở - cao): P/E ~ 8,9x/9,9x/10,9x x 4.600 = 40.940 - 45.540 - 50.140; P/B 39.000 - 45.000 - 54.000; vùng chồng nhau khoảng 40.900 - 50.100 quanh cơ sở ~45.000.'
      - 'Thị giá 52.000 nằm trên đỉnh vùng chồng nhau (50.000) -> ''Đắt'': thị giá cao hơn giá cơ sở 45.000 khoảng 15,6% (biên an toàn = (45.000 - 52.000)/45.000 = -15,6%).'
      result: Giá hợp lý cơ sở ~45.000 VND, dải ~40.900-50.100; thị giá 52.000 -> Đắt nhẹ. PEG 0,75 cho thấy không đắt về tăng trưởng nên khẳng định phụ thuộc vào việc EPS thực sự tăng 15%/12%; cần theo dõi và kiểm tra.
      data_reliability: illustrative
  - id: "m04-worked_examples-5"
    title: "Ví dụ có lời giải: m04_ex_justified_pe_check — Kiểm tra P/E mục tiêu bằng P/E Gordon (giả định minh họa)"
    tags: ["ví", "dụ", "có", "lời", "giải", "m04_ex_justified_pe_check", "kiểm", "tra", "mục", "tiêu", "bằng", "gordon"]
    text: |-
      id: m04_ex_justified_pe_check
      title: Kiểm tra P/E mục tiêu bằng P/E Gordon (giả định minh họa)
      inputs:
        payout: 0.4
        g: 0.06
        re: 0.13
        peer_median: 11.0
      steps:
      - P/E hợp lý = 0,4 x 1,06/(0,13 - 0,06) = 0,424/0,07 = 6,06x
      - P/E trung vị peers = 11,0x cao gần gấp đôi.
      - 'Giải thích: peers có tăng trưởng 12-15% trong giai đoạn đầu nên P/E cao hơn Gordon 1 giai đoạn; Gordon với g 6% vĩnh viễn thấp hơn thực tế.'
      - 'Kết luận: chênh lệch này không phủ nhận P/E 9,9x nhưng nhắc rằng P/E >= 10x ngầm kỳ vọng tăng trưởng cao kéo dài; cần mô hình 2 giai đoạn hoặc kiểm tra bằng m05.'
      result: P/E Gordon 6,06x là mốc thận trọng (sàn); P/E mục tiêu 9,9x đòi hỏi tăng trưởng cao hơn 6% trong nhiều năm.
      data_reliability: illustrative
  - id: "m04-practice_questions-1"
    title: "Câu hỏi luyện tập: Ngân hàng có BVPS 20.000, ROE bền vững 15%, g 8%, Re 14%. Giá hợp lý theo P/B-ROE?"
    tags: ["câu", "hỏi", "luyện", "tập", "ngân", "hàng", "có", "bvps", "20", "000", "roe", "bền"]
    text: |-
      q: Ngân hàng có BVPS 20.000, ROE bền vững 15%, g 8%, Re 14%. Giá hợp lý theo P/B-ROE?
      a: P/B = (0,15 - 0,08)/(0,14 - 0,08) = 0,07/0,06 = 1,167x; giá hợp lý = 1,167 x 20.000 = 23.333 VND.
  - id: "m04-practice_questions-2"
    title: "Câu hỏi luyện tập: Công ty có EBITDA 400 tỷ, EV/EBITDA mục tiêu 6,0x, nợ 900 tỷ, tiền 300 tỷ, thiểu số 80 tỷ, 100 triệ…"
    tags: ["câu", "hỏi", "luyện", "tập", "công", "ty", "có", "ebitda", "400", "tỷ", "ev", "mục"]
    text: |-
      q: Công ty có EBITDA 400 tỷ, EV/EBITDA mục tiêu 6,0x, nợ 900 tỷ, tiền 300 tỷ, thiểu số 80 tỷ, 100 triệu cp. Giá hợp lý/cp?
      a: EV = 2.400; vốn chủ = 2.400 - 900 + 300 - 80 = 1.720 tỷ; giá = 1.720 x 1e9/1e8 = 17.200 VND.
  - id: "m04-practice_questions-3"
    title: "Câu hỏi luyện tập: EPS TTM 906,7 do dự phòng bất thường, EPS chuẩn hóa 1.973,3, giá 22.000. P/E TTM và chuẩn hóa?"
    tags: ["câu", "hỏi", "luyện", "tập", "eps", "ttm", "906", "do", "dự", "phòng", "bất", "thường"]
    text: |-
      q: EPS TTM 906,7 do dự phòng bất thường, EPS chuẩn hóa 1.973,3, giá 22.000. P/E TTM và chuẩn hóa?
      a: 24,3x và 11,1x; P/E TTM 'đắt' có thể là ảo, cần kiểm tra chất lượng tài sản.
  - id: "m04-practice_questions-4"
    title: "Câu hỏi luyện tập: Vì sao không dùng P/B cho công ty phần mềm?"
    tags: ["câu", "hỏi", "luyện", "tập", "vì", "sao", "không", "dùng", "cho", "công", "ty", "phần"]
    text: |-
      q: Vì sao không dùng P/B cho công ty phần mềm?
      a: Giá trị nằm ở tài sản vô hình (phần mềm, dữ liệu, hiệu ứng mạng lưới) không có trong sổ sách nên P/B không phản ánh; dùng EV/Sales, EV/EBITDA, PEG, DCF.
  - id: "m04-practice_questions-5"
    title: "Câu hỏi luyện tập: Công ty thép có P/E 5x trong năm lợi nhuận kỷ lục. Có nên kết luận rẻ?"
    tags: ["câu", "hỏi", "luyện", "tập", "công", "ty", "thép", "có", "5x", "trong", "năm", "lợi"]
    text: |-
      q: Công ty thép có P/E 5x trong năm lợi nhuận kỷ lục. Có nên kết luận rẻ?
      a: Chưa. Lợi nhuận ở đỉnh chu kỳ; thị trường trả P/E thấp vì dự đoán lợi nhuận giảm. Phải dùng lợi nhuận mid-cycle hoặc P/B, EV/EBITDA trung bình lịch sử.
  - id: "m04-practice_questions-6"
    title: "Câu hỏi luyện tập: P/E 11,3x, tăng trưởng EPS 15%/năm. PEG? Diễn giải."
    tags: ["câu", "hỏi", "luyện", "tập", "11", "3x", "tăng", "trưởng", "eps", "15", "năm", "peg"]
    text: |-
      q: P/E 11,3x, tăng trưởng EPS 15%/năm. PEG? Diễn giải.
      a: PEG = 11,3/15 = 0,75 < 1, hấp dẫn nếu tăng trưởng đáng tin; là dấu hiệu sàng lọc.
  - id: "m04-practice_questions-7"
    title: "Câu hỏi luyện tập: Giá hợp lý cơ sở 45.000, thị giá 52.000. Biên an toàn?"
    tags: ["câu", "hỏi", "luyện", "tập", "giá", "hợp", "lý", "cơ", "sở", "45", "000", "thị"]
    text: |-
      q: Giá hợp lý cơ sở 45.000, thị giá 52.000. Biên an toàn?
      a: '(45.000 - 52.000)/45.000 = -15,6%: biên an toàn âm, giá cao hơn giá hợp lý.'
  - id: "m04-practice_questions-8"
    title: "Câu hỏi luyện tập: P/E Gordon với payout 50%, g 5%, Re 12%?"
    tags: ["câu", "hỏi", "luyện", "tập", "gordon", "với", "payout", "50", "re", "12"]
    text: |-
      q: P/E Gordon với payout 50%, g 5%, Re 12%?
      a: P/E trailing = 0,5 x 1,05/(0,12 - 0,05) = 0,525/0,07 = 7,5x.
  - id: "m04-practice_questions-9"
    title: "Câu hỏi luyện tập: Giá hợp lý EV/EBITDA dùng 100 triệu cp lưu hành, nhưng có thêm 5 triệu cp ESOP sắp vesting. Sai ở đ…"
    tags: ["câu", "hỏi", "luyện", "tập", "giá", "hợp", "lý", "ev", "ebitda", "dùng", "100", "triệu"]
    text: |-
      q: Giá hợp lý EV/EBITDA dùng 100 triệu cp lưu hành, nhưng có thêm 5 triệu cp ESOP sắp vesting. Sai ở đâu?
      a: Phải dùng số pha loãng 105 triệu cp; dùng 100 triệu thổi phồng giá hợp lý khoảng 5%.
  - id: "m04-practice_questions-10"
    title: "Câu hỏi luyện tập: Tại sao dùng trung vị thay trung bình khi chọn multiple mục tiêu?"
    tags: ["câu", "hỏi", "luyện", "tập", "tại", "sao", "dùng", "trung", "vị", "thay", "bình", "khi"]
    text: |-
      q: Tại sao dùng trung vị thay trung bình khi chọn multiple mục tiêu?
