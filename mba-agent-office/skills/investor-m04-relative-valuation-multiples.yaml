  - id: "m04-case_lessons-1"
    title: "Bài học case: Ngân hàng dọn nợ xấu: P/E TTM đắt nhưng P/E chuẩn hóa hợp lý (minh họa từ prompt gốc về STB)"
    tags: ["bài", "học", "case", "ngân", "hàng", "dọn", "nợ", "xấu", "ttm", "đắt", "nhưng", "chuẩn"]
    text: |-
      name: 'Ngân hàng dọn nợ xấu: P/E TTM đắt nhưng P/E chuẩn hóa hợp lý (minh họa từ prompt gốc về STB)'
      type: sme
      setup: Prompt gốc nêu hiện tượng một ngân hàng chủ động trích lập dự phòng gấp hơn 6 lần trong nửa đầu năm 2026 để dọn nợ xấu nội bảng, làm LNST giảm và P/E TTM tăng cao. Đây chỉ là minh họa định tính; số liệu cụ thể chưa được kiểm chứng.
      key_calculations:
      - LNST TTM bị nén -> EPS thấp -> P/E TTM = Giá/EPS cao.
      - LNST chuẩn hóa (dự phòng bình thường) -> EPS chuẩn hóa cao hơn -> P/E chuẩn hóa thấp hơn nhiều (cơ chế minh họa, chưa có số kiểm chứng).
      lesson: Không kết luận 'đắt' chỉ từ P/E TTM; chuẩn hóa dự phòng và cân nhắc hoàn nhập sau dọn dẹp, kèm kiểm tra chất lượng tài sản. Số trong prompt gốc không được dùng như dữ liệu hiện hành.
      data_reliability: unverified
