sections:
  - id: "m04-tong-quan"
    title: "Tổng quan m04"
    tags: ["m04", "định", "giá", "tương", "đối", "multiples", "relative", "valuation"]
    text: |-
      Định giá tương đối (multiples) (Relative Valuation (Multiples)) — module m04

      Mục đích: Trả lời nhanh và có căn cứ câu hỏi 'cổ phiếu này đang Rẻ, Hợp lý hay Đắt so với lợi nhuận, giá trị sổ sách, doanh thu, EBITDA của nó và so với các doanh nghiệp tương đồng?'. Module dạy chọn đúng multiple theo ngành, tính multiple đúng cách (TTM, forward, chuẩn hóa), chọn multiple mục tiêu có lý do, chuyển từ EV về giá cổ phiếu, dựng bảng peers và football field, rồi kết luận bằng một khoảng giá hợp lý kèm biên an toàn - không phải một con số duy nhất. Là bước định giá nhanh, dùng để đối chiếu c…

      Dùng khi:
      - Người dùng hỏi 'mã X đang rẻ hay đắt?', 'P/E hợp lý của X là bao nhiêu?', 'P/B 1,5 của ngân hàng này có cao không?'.
      - Cần ước tính giá hợp lý bằng P/E hoặc P/B mục tiêu x EPS/BVPS dự phóng cho năm hiện tại và năm kế tiếp.
      - Cần định giá doanh nghiệp sản xuất, bán lẻ, công nghệ bằng EV/EBITDA, EV/Sales rồi quy về giá mỗi cổ phiếu.
      - Cần định giá ngân hàng/công ty tài chính: dùng P/B gắn với ROE, P/E chuẩn hóa, tránh EV.
      - Cần so sánh một cổ phiếu với nhóm peers (bảng so sánh), hoặc vẽ football field gộp nhiều phương pháp.
      - P/E TTM của một mã bỗng rất cao hoặc rất thấp và cần biết đó là tín hiệu thật hay méo mó do lợi nhuận bất thường, trích lập dự phòng, chu kỳ.
      - Cần chọn giữa multiple và DCF, hoặc cần đối chiếu kết quả hai cách.

      Nên nắm trước: - 'm03 - Phân tích cơ bản: đọc BCTC, chất lượng lợi nhuận, chuẩn hóa lợi nhuận bất thường (đầu vào của EPS/BVPS/EBITDA sạch)'

      Module liên quan: - 'm03 - Phân tích cơ bản: cung cấp EPS, BVPS, ROE, nợ ròng, EBITDA đã điều chỉnh' - 'm05 - Định giá nội tại (DCF/FCFE/DDM): đối chiếu chéo; Re và g dùng chung. Công thức P/B và P/E hợp lý ở đây là dạng rút gọn của DDM/Gordon' - 'm07 - Dữ liệu thị trường VN và rủi ro: nguồn giá, vốn hóa, free float, thanh khoản, lãi suất phi rủi ro VN để chọn Re' - 'm06 - Thẩm định dự án: không liên quan trực tiế…

      Công thức (tra chi tiết bằng skill_search("<id>")):
      - m04_pe: P/E (TTM và forward) và earnings yield
      - m04_pb: P/B và BVPS
      - m04_ps_evsales: P/S và EV/Sales
      - m04_ev_ebitda: EV, EV/EBITDA và cầu nối EV về giá mỗi cổ phiếu
      - m04_fair_price_pe_pb: Giá hợp lý = multiple mục tiêu x EPS hoặc BVPS dự phóng
      - m04_pb_roe: P/B hợp lý theo ROE (justified P/B)
      - m04_pe_justified: P/E hợp lý theo tăng trưởng, payout và Re (justified P/E)
      - m04_peg: PEG
      - m04_dividend_yield: Tỷ suất cổ tức
      - m04_target_multiple: Multiple mục tiêu điều chỉnh từ trung vị peers
      - m04_eps_bvps_projection: Dự phóng EPS và BVPS 2 năm

      Kho tra cứu của module: Khái niệm 9, Công thức 11, frameworks 7, Quy trình 4, Quy tắc quyết định 13, Chuẩn so sánh 7, Lỗi thường gặp 15, Lưu ý SME Việt Nam 9, Bài học case 3, Ví dụ có lời giải 5, Câu hỏi luyện tập 10, Checklist 12, Mẫu Excel/Sheets 6. Tra bằng skill_search với từ khoá chủ đề (vd "ví dụ DCF", "lỗi thường gặp định giá").
  - id: "m04-concepts-1"
    title: "Khái niệm: Định giá tương đối"
    tags: ["khái", "niệm", "định", "giá", "tương", "đối"]
    text: |-
      term_vi: Định giá tương đối
      term_en: Relative Valuation
      definition: Xác định giá trị cổ phiếu bằng cách so giá thị trường với một thước đo kinh tế (lợi nhuận, sổ sách, doanh thu, EBITDA) rồi so tỷ lệ đó với nhóm doanh nghiệp tương đồng hoặc với chính lịch sử của nó. Giá hợp lý = multiple mục tiêu x thước đo của doanh nghiệp.
      why_it_matters: 'DCF cần dự phóng 5-10 năm với hàng chục giả định, nhạy cực mạnh với Re và g (Terminal Value thường chiếm 70-80% giá trị theo prompt gốc). Multiple là cách ''hỏi thị trường'': các tài sản tương tự đang được trả giá bao nhiêu cho 1 đồng lợi nhuận. Nhanh, ít giả định, nhưng thừa hưởng cả sự hợp lý lẫn sự điên rồ của thị trường - nếu cả nhóm peers đang bị định giá quá cao thì kết quả ''rẻ so với peers'' vẫn có thể là đắt tuyệt đối. Vì vậy phải dùng cùng DCF chứ không thay thế.'
  - id: "m04-concepts-2"
    title: "Khái niệm: Hệ số giá trên thu nhập"
    tags: ["khái", "niệm", "hệ", "số", "giá", "trên", "thu", "nhập"]
    text: |-
      term_vi: Hệ số giá trên thu nhập
      term_en: Price-to-Earnings (P/E)
      definition: P/E = Giá cổ phiếu / EPS. TTM (trailing twelve months) dùng EPS 4 quý gần nhất đã công bố; forward dùng EPS dự phóng 12 tháng tới hoặc năm tài chính tới.
      why_it_matters: Nghịch đảo của P/E là earnings yield (EPS/giá) - lợi suất lợi nhuận mà nhà đầu tư 'mua' mỗi đồng vốn bỏ ra, so được với lãi suất trái phiếu. TTM nhìn lùi và dễ bị bóp méo bởi khoản bất thường; forward nhìn tới nhưng phụ thuộc chất lượng dự phóng. Luôn nêu rõ đang dùng loại nào.
  - id: "m04-concepts-3"
    title: "Khái niệm: Hệ số giá trên giá trị sổ sách"
    tags: ["khái", "niệm", "hệ", "số", "giá", "trên", "trị", "sổ", "sách"]
    text: |-
      term_vi: Hệ số giá trên giá trị sổ sách
      term_en: Price-to-Book (P/B)
      definition: P/B = Giá / BVPS, BVPS = Vốn chủ sở hữu thuộc cổ đông công ty mẹ / số cổ phiếu lưu hành.
      why_it_matters: 'Phù hợp khi giá trị nằm ở bảng cân đối: ngân hàng, bảo hiểm, chứng khoán, bất động sản, doanh nghiệp nặng tài sản. Vô nghĩa với công ty phần mềm/asset-light (như Grab trong prompt gốc) vì giá trị là hiệu ứng mạng lưới, thương hiệu, dữ liệu - không nằm trong sổ sách. P/B hợp lý phụ thuộc ROE: ROE cao hơn chi phí vốn thì xứng đáng P/B > 1.'
  - id: "m04-concepts-4"
    title: "Khái niệm: Giá trị doanh nghiệp (EV) và hệ số EV/EBITDA, EV/Sales"
    tags: ["khái", "niệm", "giá", "trị", "doanh", "nghiệp", "ev", "và", "hệ", "số", "ebitda", "sales"]
    text: |-
      term_vi: Giá trị doanh nghiệp (EV) và hệ số EV/EBITDA, EV/Sales
      term_en: Enterprise Value, EV/EBITDA, EV/Sales
      definition: EV = Vốn hóa thị trường (số cổ phiếu pha loãng x giá) + Nợ vay - Tiền và tương đương tiền (+ Lợi ích cổ đông thiểu số + Cổ phiếu ưu đãi - Đầu tư tài chính/tài sản phi hoạt động). EV/EBITDA = EV / EBITDA; EV/Sales = EV / Doanh thu.
      why_it_matters: Vốn hóa chỉ là phần của cổ đông; hai công ty giống hệt nhau nhưng một công ty vay nhiều thì vốn hóa nhỏ hơn và P/E méo theo đòn bẩy. EV tính giá của cả hoạt động kinh doanh (cho cả chủ nợ và cổ đông) nên so sánh được giữa các công ty cấu trúc vốn khác nhau, cũng ít bị ảnh hưởng bởi khác biệt thuế và khấu hao khi dùng EBITDA. EV/Sales dùng cho doanh nghiệp chưa có lợi nhuận hoặc biên lợi nhuận bất thường tạm thời, nhưng bỏ qua hoàn toàn chất lượng biên lợi nhuận. Không dùng EV cho ngân hàng vì nợ (tiền gửi) là nguyên liệu kinh doanh, không phải nguồn vốn tài trợ.
  - id: "m04-concepts-5"
    title: "Khái niệm: Cầu nối từ EV về vốn chủ sở hữu"
    tags: ["khái", "niệm", "cầu", "nối", "từ", "ev", "về", "vốn", "chủ", "sở", "hữu"]
    text: |-
      term_vi: Cầu nối từ EV về vốn chủ sở hữu
      term_en: EV-to-Equity Bridge
      definition: Giá trị vốn chủ sở hữu của cổ đông công ty mẹ = EV - Nợ vay + Tiền - Lợi ích cổ đông thiểu số - Cổ phiếu ưu đãi + Tài sản phi hoạt động; chia cho số cổ phiếu pha loãng ra giá mỗi cổ phiếu.
      why_it_matters: Quên trừ nợ ròng là lỗi kinh điển làm giá hợp lý cao ảo (xem pitfall). Lợi ích cổ đông thiểu số phải trừ vì EBITDA hợp nhất tính 100% công ty con nhưng cổ đông mẹ chỉ sở hữu một phần. Phải dùng số cổ phiếu pha loãng (ESOP, trái phiếu chuyển đổi, chia thưởng sắp phát hành) vì EPS và giá/cp chỉ đúng với số cp sau pha loãng.
  - id: "m04-concepts-6"
    title: "Khái niệm: PEG"
    tags: ["khái", "niệm", "peg"]
    text: |-
      term_vi: PEG
      term_en: Price/Earnings-to-Growth
      definition: 'PEG = P/E / (tăng trưởng EPS kỳ vọng, tính bằng số %, vd 15% thì dùng 15). Quy ước phổ biến: PEG < 1 hấp dẫn, ~1 hợp lý, > 2 đắt.'
      why_it_matters: 'Một công ty P/E 20 mà EPS tăng 25%/năm có thể rẻ hơn công ty P/E 10 mà EPS không tăng. PEG chuẩn hóa P/E theo tăng trưởng (phổ biến bởi Peter Lynch). Hạn chế: chỉ là quy tắc kinh nghiệm, nhạy với chất lượng dự báo tăng trưởng, vô nghĩa khi tăng trưởng âm hoặc rất nhỏ, và bỏ qua rủi ro và ROE.'
  - id: "m04-concepts-7"
    title: "Khái niệm: Tỷ suất cổ tức"
    tags: ["khái", "niệm", "tỷ", "suất", "cổ", "tức"]
    text: |-
      term_vi: Tỷ suất cổ tức
      term_en: Dividend Yield
      definition: Dividend Yield = Cổ tức tiền mặt/cp một năm / Giá.
      why_it_matters: Cho biết dòng tiền thực nhận. Ở Việt Nam nhiều doanh nghiệp chia cổ tức bằng cổ phiếu (không có tiền về tay), nên phải tách cổ tức tiền mặt. Yield rất cao có thể là dấu hiệu giá giảm vì kỳ vọng cổ tức bị cắt.
  - id: "m04-concepts-8"
    title: "Khái niệm: Multiple mục tiêu và nhóm so sánh"
    tags: ["khái", "niệm", "multiple", "mục", "tiêu", "và", "nhóm", "so", "sánh"]
    text: |-
      term_vi: Multiple mục tiêu và nhóm so sánh
      term_en: Target Multiple and Comparable Set (Peers)
      definition: Multiple mục tiêu là hệ số áp vào chỉ tiêu dự phóng để ra giá hợp lý; thường lấy trung vị (median) của nhóm peers rồi điều chỉnh theo khác biệt về tăng trưởng, ROE, rủi ro, quy mô, thanh khoản, chu kỳ.
      why_it_matters: 'Prompt gốc bắt buộc ''giải thích lý do chọn hệ số''. Lý do để dùng trung vị thay vì trung bình: ít bị một peer cực đoan kéo lệch. Peers phải cùng mô hình kinh doanh, địa lý, quy mô và chu kỳ; peers kém tương đồng thì kết quả chỉ là con số trang trí.'
  - id: "m04-concepts-9"
    title: "Khái niệm: Lợi nhuận chuẩn hóa"
    tags: ["khái", "niệm", "lợi", "nhuận", "chuẩn", "hóa"]
    text: |-
      term_vi: Lợi nhuận chuẩn hóa
      term_en: Normalized Earnings
      definition: Lợi nhuận đã loại khoản bất thường một lần (thoái vốn, đánh giá lại tài sản, trích lập/hoàn nhập dự phòng bất thường) và quy về mức trung bình chu kỳ.
      why_it_matters: Multiple chỉ có nghĩa khi mẫu số phản ánh năng lực kiếm tiền lặp lại được. Mẫu số sai thì multiple sai, dù phép chia đúng.
  - id: "m04-formulas-1"
    title: "Công thức: m04_pe — P/E (TTM và forward) và earnings yield"
    tags: ["công", "thức", "m04_pe", "ttm", "và", "forward", "earnings", "yield"]
    text: |-
      id: m04_pe
      name_vi: P/E (TTM và forward) và earnings yield
      name_en: Price/Earnings, trailing and forward
      expression_latex: P/E = \frac{P}{EPS}, \quad EPS = \frac{LNST_{me} - \text{cổ tức ưu đãi}}{\text{số cp bình quân pha loãng}}, \quad \text{Earnings yield} = \frac{EPS}{P}
      expression_python: pe = price / eps
      excel: =B1/B2
      variables:
      - symbol: price
        meaning: Giá cổ phiếu hiện tại
        unit: VND/cp
      - symbol: eps
        meaning: EPS TTM (4 quý gần nhất) hoặc EPS dự phóng (forward), đã chuẩn hóa nếu cần
        unit: VND/cp
      when_to_use: Doanh nghiệp có lợi nhuận dương, ổn định, ngành không quá chu kỳ; so sánh nhanh với peers và với lịch sử.
      why_it_works: 'P/E là số năm lợi nhuận hiện tại để hoàn vốn nếu lợi nhuận không đổi. Phản ánh kỳ vọng tăng trưởng và rủi ro: tăng trưởng cao, rủi ro thấp thì thị trường chấp nhận P/E cao.'
      assumptions:
      - EPS đại diện cho năng lực kiếm tiền bền vững (đã loại bất thường).
      - Số cổ phiếu dùng là số bình quân gia quyền/pha loãng, không phải số cp tại một thời điểm nếu có phát hành lớn giữa kỳ.
      pitfalls:
      - EPS <= 0 thì P/E vô nghĩa (không báo P/E âm).
      - TTM bị bóp méo bởi trích lập dự phòng đột biến hoặc lãi bất thường; xem framework m04_normalization.
      - P/E thấp ở đỉnh chu kỳ (lợi nhuận đỉnh) thường là bẫy, P/E cao ở đáy chu kỳ thường là cơ hội (xem m04_cycle_adjust).
      - Khác chuẩn mực kế toán (VAS và IFRS) hoặc khác kỳ năm tài chính làm P/E không so sánh trực tiếp được.
      interpretation: 'Không có ngưỡng tuyệt đối. Đọc theo ba trục: so median peers, so lịch sử 3-5 năm của chính mã đó, so earnings yield với lợi suất trái phiếu chính phủ 10 năm. Lệch đáng kể mà không giải thích được bằng tăng trưởng/rủi ro thì phải tìm nguyên nhân trước khi kết luận rẻ hoặc đắt.'
      example:
        inputs:
          price: 52000
          eps_ttm: 4000
          eps_forward: 4600
        steps:
        - P/E TTM = 52000/4000 = 13,0x
        - P/E forward = 52000/4600 = 11,3x
        - Earnings yield forward = 4600/52000 = 8,85%
        result: P/E TTM 13,0x; P/E forward 11,3x; earnings yield 8,85% (giả định minh họa).
  - id: "m04-formulas-2"
    title: "Công thức: m04_pb — P/B và BVPS"
    tags: ["công", "thức", "m04_pb", "và", "bvps"]
    text: |-
      id: m04_pb
      name_vi: P/B và BVPS
      name_en: Price/Book and Book Value per Share
      expression_latex: P/B = \frac{P}{BVPS}, \quad BVPS = \frac{VCSH_{me}}{N}
      expression_python: pb = price / bvps
      excel: =B1/B2
      variables:
      - symbol: price
        meaning: Giá cổ phiếu
        unit: VND/cp
      - symbol: bvps
        meaning: Giá trị sổ sách mỗi cp = VCSH cổ đông mẹ / số cp lưu hành (đã trừ cp quỹ)
        unit: VND/cp
      when_to_use: Ngân hàng, bảo hiểm, chứng khoán, BĐS, công ty nặng tài sản có sổ sách phản ánh được giá trị tài sản (thanh khoản, giá trị thị trường gần giá sổ).
      why_it_works: 'Sổ sách là ''tiền đã bỏ vào'' công ty; P/B so giá với phần vốn thực. Với ngân hàng, tài sản là khoản cho vay và tiền thật nên sổ sách là mỏ neo giá trị đáng tin (prompt gốc: P/B là ''vị trọng tài tối cao'' của ngân hàng như SHB), nhưng chỉ khi chất lượng tài sản được kiểm soát (nợ xấu đã dự phòng đủ).'
      assumptions:
      - Giá trị sổ gần giá trị kinh tế của tài sản; chất lượng tài sản (nợ xấu, tồn kho, BĐS) đã được phản ánh đủ.
      pitfalls:
      - Vô nghĩa với asset-light, phần mềm, công ty có tài sản vô hình lớn (giá trị không có trong sổ).
      - Sổ sách bị thổi phồng nếu dự phòng thiếu hoặc BĐS ghi giá gốc cũ/đánh giá lại; ngân hàng có nợ xấu lớn mà dự phòng thấp thì BVPS cao ảo.
      - Dùng VCSH hợp nhất gồm cả lợi ích thiểu số thay vì phần cổ đông mẹ làm BVPS sai.
      interpretation: P/B < 1 chỉ là 'rẻ' khi ROE bền vững >= Re hoặc tài sản đáng tin; P/B < 1 kèm ROE < Re là hợp lý. Dùng cùng ROE (m04_pb_roe).
      example:
        inputs:
          price: 27000
          bvps: 20000
        steps:
        - P/B = 27000/20000 = 1,35x
        result: P/B 1,35x (giả định minh họa).
  - id: "m04-formulas-3"
    title: "Công thức: m04_ps_evsales — P/S và EV/Sales"
    tags: ["công", "thức", "m04_ps_evsales", "và", "ev", "sales"]
    text: |-
      id: m04_ps_evsales
      name_vi: P/S và EV/Sales
      name_en: Price/Sales and EV/Sales
      expression_latex: P/S = \frac{\text{Vốn hóa}}{\text{Doanh thu}}, \quad EV/Sales = \frac{EV}{\text{Doanh thu}}
      expression_python: evs = ev / sales; ps = market_cap / sales
      excel: =B1/B2
      variables:
      - symbol: ev
        meaning: Giá trị doanh nghiệp
        unit: tỷ VND
      - symbol: market_cap
        meaning: Vốn hóa = giá x số cp pha loãng
        unit: tỷ VND
      - symbol: sales
        meaning: Doanh thu thuần TTM hoặc dự phóng
        unit: tỷ VND
      when_to_use: Công ty tăng trưởng chưa có lợi nhuận, lợi nhuận đang ở đáy chu kỳ, hoặc so sánh các công ty cùng mô hình có biên lợi nhuận mục tiêu tương đương (bán lẻ, phần mềm giai đoạn đầu). Ưu tiên EV/Sales hơn P/S khi nợ đáng kể.
      why_it_works: Doanh thu ít bị bóp méo bởi kế toán và ít âm hơn lợi nhuận, nên luôn tính được. Giá trị công ty về dài hạn = doanh thu x biên lợi nhuận x multiple lợi nhuận, nên EV/Sales chỉ hợp lý khi biên tương đương.
      assumptions:
      - Biên lợi nhuận bình thường của các công ty so sánh tương tự nhau.
      pitfalls:
      - 'Bỏ qua biên lợi nhuận: công ty biên 3% và 25% có thể cùng EV/Sales nhưng giá trị khác xa nhau.'
      - 'Doanh thu có thể bị thổi phồng (ghi nhận doanh thu gộp thay vì ròng, bán hàng hóa giá thấp lấy doanh thu). Prompt gốc nhắc bài học WeWork: định giá dựa trên doanh thu/tăng trưởng tưởng tượng chứ không dựa trên kinh tế đơn vị.'
      interpretation: Chỉ so với peers cùng biên lợi nhuận và tăng trưởng; không dùng làm thước đo duy nhất để kết luận Rẻ/Đắt.
      example:
        inputs:
          ev: 2380
          sales: 3200
        steps:
        - EV/Sales = 2380/3200 = 0,74x
        result: EV/Sales 0,74x (giả định minh họa, cùng doanh nghiệp ở ví dụ EV/EBITDA).
  - id: "m04-formulas-4"
    title: "Công thức: m04_ev_ebitda — EV, EV/EBITDA và cầu nối EV về giá mỗi cổ phiếu"
    tags: ["công", "thức", "m04_ev_ebitda", "ev", "ebitda", "và", "cầu", "nối", "về", "giá", "mỗi", "cổ"]
    text: |-
      id: m04_ev_ebitda
      name_vi: EV, EV/EBITDA và cầu nối EV về giá mỗi cổ phiếu
      name_en: EV, EV/EBITDA and EV-to-Equity bridge
      expression_latex: EV = Cap + D - Cash + MI + Pref - NonOp, \quad EV/EBITDA = \frac{EV}{EBITDA}, \quad P_{fair} = \frac{EBITDA \times M_{target} - D + Cash - MI - Pref + NonOp}{N_{diluted}}
      expression_python: ev_fair = ebitda * target_multiple; equity_fair = ev_fair - debt + cash - minority - preferred + non_operating; price_fair = equity_fair * 1e9 / shares_diluted
      excel: =(EBITDA*M - Nợ + Tiền - MI)*1E9/CP
      variables:
      - symbol: ebitda
        meaning: EBITDA điều chỉnh bất thường, TTM hoặc forward
        unit: tỷ VND
      - symbol: target_multiple
        meaning: EV/EBITDA mục tiêu (median peers đã điều chỉnh)
        unit: lần
      - symbol: debt
        meaning: Nợ vay có lãi (ngắn + dài hạn, gồm cả thuê tài chính/thuê vận hành nếu EBITDA chưa trừ chi phí thuê, nhất quán với peers)
        unit: tỷ VND
      - symbol: cash
        meaning: Tiền và tương đương tiền (và đầu tư tài chính ngắn hạn dễ chuyển đổi)
        unit: tỷ VND
      - symbol: minority
        meaning: Lợi ích cổ đông thiểu số (giá trị sổ hoặc theo multiple)
        unit: tỷ VND
      - symbol: preferred
        meaning: Cổ phiếu ưu đãi (nếu có)
        unit: tỷ VND
      - symbol: non_operating
        meaning: Tài sản phi hoạt động (đầu tư công ty liên kết, BĐS đầu tư chưa vào EBITDA) nếu EBITDA không bao gồm
        unit: tỷ VND
      - symbol: shares_diluted
        meaning: Số cổ phiếu pha loãng (cp lưu hành + ESOP + chuyển đổi, trừ cp quỹ)
        unit: cp
      when_to_use: Doanh nghiệp phi tài chính, nợ vay khác nhau giữa các công ty, cần so sánh độc lập với cấu trúc vốn và khấu hao (sản xuất, hạ tầng, viễn thông, bán lẻ). Không dùng cho ngân hàng/tài chính.
      why_it_works: EBITDA gần với dòng tiền hoạt động trước đầu tư, EV là giá của toàn bộ hoạt động. Tỷ lệ này không bị đòn bẩy và chính sách khấu hao bóp méo. Cầu nối từ EV về vốn chủ nhằm trả lại phần thuộc chủ nợ và thiểu số, vì EV là 'bánh' chung còn cổ đông mẹ chỉ ăn phần còn lại.
      assumptions:
      - Peers có tỷ lệ capex/EBITDA và tăng trưởng tương tự (EBITDA chưa trừ capex; công ty nặng tài sản có capex cao thì cùng EV/EBITDA kém giá trị hơn).
      - Nợ và tiền lấy cùng ngày với giá, EBITDA là TTM hoặc forward nhất quán với peers.
      pitfalls:
      - 'Quên trừ nợ ròng hoặc lợi ích thiểu số: giá hợp lý bị thổi phồng.'
      - Dùng số cp lưu hành thay cho số cp pha loãng.
      - Tính tiền gồm cả tiền bị phong tỏa/ký quỹ hoặc tiền không tự do dùng.
      - Peers khác chính sách thuê tài sản (IFRS 16) hoặc khác cách tính EBITDA (có/không gồm thu nhập tài chính) thì không so sánh được.
      interpretation: EV/EBITDA so với median peers đã điều chỉnh. Nếu rẻ hơn peers mà tăng trưởng, ROIC không kém thì có tiềm năng; nếu rẻ vì capex nặng/đáy chu kỳ thì không phải cơ hội.
      example:
        inputs:
          ebitda: 400
          target_multiple: 5.95
          debt: 900
          cash: 300
          minority: 80
          shares_diluted: 100000000
        steps:
        - EV mục tiêu = 400 x 5,95 = 2.380 tỷ
        - Nợ ròng = 900 - 300 = 600 tỷ
        - Vốn chủ = 2.380 - 600 - 80 = 1.700 tỷ
        - Giá/cp = 1.700 x 1e9 / 100 triệu = 17.000 VND (nếu pha loãng 105 triệu cp thì 16.190 VND)
        result: Giá hợp lý 17.000 VND/cp trên 100 triệu cp, 16.190 VND nếu pha loãng thành 105 triệu cp (giả định minh họa).
  - id: "m04-formulas-5"
    title: "Công thức: m04_fair_price_pe_pb — Giá hợp lý = multiple mục tiêu x EPS hoặc BVPS dự phóng"
    tags: ["công", "thức", "m04_fair_price_pe_pb", "giá", "hợp", "lý", "multiple", "mục", "tiêu", "eps", "hoặc", "bvps"]
    text: |-
      id: m04_fair_price_pe_pb
      name_vi: Giá hợp lý = multiple mục tiêu x EPS hoặc BVPS dự phóng
      name_en: Fair price from target multiple
      expression_latex: P_{fair} = M_{target} \times EPS_{fwd}, \quad P_{fair} = M_{target} \times BVPS_{fwd}
      expression_python: price_fair = target_multiple * metric_forward; margin_of_safety = (price_fair - price) / price_fair; upside = price_fair / price - 1
      excel: =M*EPS_fwd
      variables:
      - symbol: target_multiple
        meaning: P/E hoặc P/B mục tiêu
        unit: lần
      - symbol: metric_forward
        meaning: EPS hoặc BVPS dự phóng (năm hiện tại hoặc năm tới)
        unit: VND/cp
      - symbol: price
        meaning: Thị giá hiện tại
        unit: VND/cp
      when_to_use: Bước tính giá hợp lý cuối cùng sau khi đã chọn multiple mục tiêu và dự phóng EPS/BVPS.
      why_it_works: Đảo ngược định nghĩa của multiple. Dùng chỉ tiêu dự phóng vì giá hôm nay trả cho dòng lợi nhuận tương lai, không phải quá khứ; tuy nhiên multiple phải cùng loại với chỉ tiêu (multiple trailing của peers áp vào EPS trailing, multiple forward áp vào EPS forward) để khỏi lẫn.
      assumptions:
      - Multiple mục tiêu và chỉ tiêu cùng kỳ (TTM-TTM hoặc forward-forward).
      - Chiết khấu giá hợp lý về hiện tại nếu dùng chỉ tiêu 2 năm tới (xem m04_eps_projection).
      pitfalls:
      - Áp multiple trailing của peers vào EPS forward hoặc ngược lại làm lệch 1 chu kỳ tăng trưởng.
      - Lấy giá hợp lý là một điểm; phải báo khoảng bằng nhạy multiple +/- và kịch bản EPS thấp/cơ sở/cao.
      interpretation: Upside >= biên an toàn yêu cầu thì Rẻ; trong khoảng +/- biên thì Hợp lý; thấp hơn thì Đắt (xem decision_rules).
      example:
        inputs:
          target_multiple: 9.9
          metric_forward: 4600
          price: 52000
        steps:
        - Giá hợp lý = 9,9 x 4.600 = 45.540 VND
        - Upside = 45.540/52.000 - 1 = -12,4% (thị giá cao hơn giá hợp lý)
        result: Giá hợp lý 45.540 VND, thị giá 52.000 cao hơn 12,4% (giả định minh họa).
  - id: "m04-formulas-6"
    title: "Công thức: m04_pb_roe — P/B hợp lý theo ROE (justified P/B)"
    tags: ["công", "thức", "m04_pb_roe", "hợp", "lý", "theo", "roe", "justified"]
    text: |-
      id: m04_pb_roe
      name_vi: P/B hợp lý theo ROE (justified P/B)
      name_en: Justified P/B from ROE
      expression_latex: P/B_{justified} = \frac{ROE - g}{R_e - g}
      expression_python: pb_justified = (roe - g) / (re - g)
      excel: =(ROE-g)/(Re-g)
      variables:
      - symbol: roe
        meaning: ROE bền vững (đã chuẩn hóa, dài hạn)
        unit: thập phân (0,17 = 17%)
      - symbol: g
        meaning: Tăng trưởng dài hạn của lợi nhuận/cổ tức, bằng roe x tỷ lệ giữ lại
        unit: thập phân
      - symbol: re
        meaning: Chi phí vốn chủ sở hữu (CAPM, xem m05 và finance m03)
        unit: thập phân
      when_to_use: Ngân hàng và tổ chức tài chính (ROE ổn định, tăng trưởng gắn với giữ lại lợi nhuận); công ty nặng tài sản có ROE ổn định.
      why_it_works: 'Suy từ DDM Gordon: P0 = D1/(Re - g), với D1 = EPS1 x (1 - b) và g = b x ROE. Chia hai vế cho BVPS0 và dùng EPS1/BVPS0 = ROE ta được P/B = (ROE - g)/(Re - g). Ý nghĩa kinh tế: nếu ROE = Re thì P/B = 1 (công ty không tạo thêm giá trị bằng tái đầu tư nên chỉ đáng giá sổ sách); ROE > Re thì P/B > 1; ROE < Re thì P/B < 1. Đây là lý do ''ngân hàng ROE 20% đáng P/B cao hơn ngân hàng ROE 10%''.'
      assumptions:
      - 'ROE, g, Re ổn định vô thời hạn; g < Re; g không vượt tăng trưởng danh nghĩa dài hạn của nền kinh tế (prompt gốc: neo 2%-4,5%; với ngân hàng đang tăng trưởng cao có thể dùng mô hình 2 giai đoạn thay vì ép g cao).'
      - Tăng trưởng g đạt được qua giữ lại lợi nhuận (không phát hành thêm vốn pha loãng).
      pitfalls:
      - Mẫu số Re - g nhỏ làm kết quả cực nhạy; thay đổi Re 1% có thể đổi P/B hợp lý 15-25%.
      - Dùng ROE đỉnh chu kỳ hoặc ROE bị thổi phồng bởi lãi bất thường.
      - Nếu ROE <= g thì P/B hợp lý <= 0 hoặc không có nghĩa; công thức chỉ đúng khi Re > g.
      interpretation: So P/B hợp lý với P/B thị trường; chênh lệch >10-15% mới có ý nghĩa. Luôn bảng nhạy ROE x Re.
      example:
        inputs:
          roe: 0.17
          g: 0.08
          re: 0.14
          bvps: 20000
        steps:
        - P/B = (0,17 - 0,08)/(0,14 - 0,08) = 0,09/0,06 = 1,50x
        - Giá hợp lý = 1,5 x 20.000 = 30.000 VND
        result: P/B hợp lý 1,50x, giá hợp lý 30.000 VND (giả định minh họa).
  - id: "m04-formulas-7"
    title: "Công thức: m04_pe_justified — P/E hợp lý theo tăng trưởng, payout và Re (justified P/E)"
    tags: ["công", "thức", "m04_pe_justified", "hợp", "lý", "theo", "tăng", "trưởng", "payout", "và", "re", "justified"]
    text: |-
      id: m04_pe_justified
      name_vi: P/E hợp lý theo tăng trưởng, payout và Re (justified P/E)
      name_en: Justified P/E (Gordon)
      expression_latex: P/E_{justified,\ forward} = \frac{payout}{R_e - g}, \quad P/E_{justified,\ trailing} = \frac{payout \times (1 + g)}{R_e - g}
      expression_python: pe_trailing = payout * (1 + g) / (re - g); pe_forward = payout / (re - g)
      excel: =payout*(1+g)/(Re-g)
      variables:
      - symbol: payout
        meaning: Tỷ lệ chi trả cổ tức bằng tiền (cổ tức/LNST)
        unit: thập phân
      - symbol: g
        meaning: Tăng trưởng bền vững của cổ tức
        unit: thập phân
      - symbol: re
        meaning: Chi phí vốn chủ sở hữu
        unit: thập phân
      when_to_use: Công ty ổn định, trả cổ tức tiền mặt đều (đối chiếu với DDM) hoặc để kiểm tra tính hợp lý của P/E mục tiêu đã chọn từ peers.
      why_it_works: Từ P0 = D1/(Re - g) với D1 = payout x EPS1 nên P0/EPS1 = payout/(Re - g); nhân (1+g) để chuyển về EPS trailing. Cho thấy P/E tăng khi payout cao, tăng trưởng cao, rủi ro thấp - ba nguồn gốc của P/E, giúp giải thích vì sao peers P/E khác nhau.
      assumptions:
      - Tăng trưởng ổn định vĩnh viễn, payout không đổi, g < Re.
      pitfalls:
      - Công ty tăng trưởng cao dùng g cao vĩnh viễn sẽ cho P/E phi lý; dùng mô hình hai giai đoạn.
      - Payout phải là tiền mặt; cổ tức cổ phiếu không phải dòng tiền cho cổ đông.
      - Bản chất là công cụ kiểm tra thận trọng, không phải nguồn P/E duy nhất.
      interpretation: Nếu P/E mục tiêu chọn từ peers cao hơn nhiều P/E hợp lý theo Gordon mà không có lý do tăng trưởng vượt trội thì cần xem lại.
      example:
        inputs:
          payout: 0.4
          g: 0.06
          re: 0.13
        steps:
        - P/E trailing = 0,4 x 1,06/(0,13 - 0,06) = 0,424/0,07 = 6,06x
        result: P/E hợp lý khoảng 6,06x (giả định minh họa; thấp vì payout 40% và g 6% so Re 13%).
  - id: "m04-formulas-8"
    title: "Công thức: m04_peg — PEG"
    tags: ["công", "thức", "m04_peg", "peg"]
    text: |-
      id: m04_peg
      name_vi: PEG
      name_en: PEG ratio
      expression_latex: PEG = \frac{P/E}{g_{EPS}\ (\%)}
      expression_python: peg = pe / (eps_growth_pct)
      excel: =PE/(g*100)
      variables:
      - symbol: pe
        meaning: P/E forward (ưu tiên) hoặc TTM
        unit: lần
      - symbol: eps_growth_pct
        meaning: Tăng trưởng EPS kỳ vọng hằng năm, lấy số % (15 chứ không phải 0,15), thường CAGR 2-3 năm
        unit: '%'
      when_to_use: So sánh các công ty cùng ngành có tăng trưởng khác nhau; sàng lọc nhanh cổ phiếu tăng trưởng.
      why_it_works: 'P/E của công ty tăng trưởng nên cao hơn; chia cho tăng trưởng để so sánh công bằng. Quy ước: PEG ~1 tương ứng giá đã hợp lý cho tăng trưởng.'
      assumptions:
      - Tăng trưởng EPS ổn định và dự báo được; chất lượng tăng trưởng giống nhau giữa các công ty.
      pitfalls:
      - Tăng trưởng thấp hoặc âm cho PEG vô nghĩa.
      - Tăng trưởng từ nền thấp hoặc một lần (phục hồi sau dọn dẹp) thổi phồng g và làm PEG đẹp giả.
      - Bỏ qua rủi ro, ROE và đòn bẩy.
      interpretation: PEG < 1 hấp dẫn, 1-2 trung tính, > 2 đắt; luôn xem như dấu hiệu sàng lọc, không phải kết luận.
      example:
        inputs:
          pe: 11.3
          eps_growth_pct: 15
        steps:
        - PEG = 11,3/15 = 0,75
        result: PEG 0,75, nghiêng về hấp dẫn nếu tăng trưởng 15% là đáng tin (giả định minh họa).
  - id: "m04-formulas-9"
    title: "Công thức: m04_dividend_yield — Tỷ suất cổ tức"
    tags: ["công", "thức", "m04_dividend_yield", "tỷ", "suất", "cổ", "tức"]
    text: |-
      id: m04_dividend_yield
      name_vi: Tỷ suất cổ tức
      name_en: Dividend yield
      expression_latex: DY = \frac{DPS_{cash}}{P}
      expression_python: dy = dps_cash / price
      excel: =DPS/Gia
      variables:
      - symbol: dps_cash
        meaning: Cổ tức tiền mặt/cp 12 tháng gần nhất hoặc dự kiến
        unit: VND/cp
      - symbol: price
        meaning: Giá cổ phiếu
        unit: VND/cp
      when_to_use: Cổ phiếu phòng thủ, doanh nghiệp trả cổ tức tiền mặt đều (điện, nước, tiện ích, một số ngân hàng); so với lãi suất tiền gửi và trái phiếu.
      why_it_works: Phần lợi suất tiền thật nhà đầu tư nhận, không phụ thuộc kế toán.
      assumptions:
      - Cổ tức bền vững, được tài trợ từ dòng tiền tự do.
      pitfalls:
      - Yield cao bất thường do giá sụt vì kỳ vọng cắt cổ tức (bẫy yield).
      - Gộp cả cổ tức cổ phiếu và thưởng vào DPS (không phải tiền).
      - Bỏ qua thuế thu nhập từ cổ tức theo quy định hiện hành (cần xác nhận).
      interpretation: So yield với lãi suất tiền gửi 12 tháng và lợi suất trái phiếu; yield sát lãi tiền gửi mà không có tăng trưởng thì kém hấp dẫn.
      example:
        inputs:
          dps_cash: 1500
          price: 30000
        steps:
        - DY = 1500/30000 = 5,0%
        result: Tỷ suất cổ tức 5,0% (giả định minh họa).
  - id: "m04-formulas-10"
    title: "Công thức: m04_target_multiple — Multiple mục tiêu điều chỉnh từ trung vị peers"
    tags: ["công", "thức", "m04_target_multiple", "multiple", "mục", "tiêu", "điều", "chỉnh", "từ", "trung", "vị", "peers"]
    text: |-
      id: m04_target_multiple
      name_vi: Multiple mục tiêu điều chỉnh từ trung vị peers
      name_en: Peer-median target multiple with adjustments
      expression_latex: M_{target} = Median(M_{peers}) \times (1 + a_{growth} + a_{quality} + a_{risk} + a_{liquidity} + a_{cycle})
      expression_python: import statistics; m_target = statistics.median(peer_multiples) * (1 + sum(adjustments))
      excel: =MEDIAN(range)*(1+SUM(adj))
      variables:
      - symbol: peer_multiples
        meaning: Danh sách multiple cùng loại và cùng kỳ của các peers
        unit: lần
      - symbol: adjustments
        meaning: Các điều chỉnh % (vd -0,10 chiết khấu thanh khoản/quy mô, +0,10 tăng trưởng/ROE cao hơn)
        unit: thập phân
      when_to_use: Mọi lần chọn P/E, P/B, EV/EBITDA mục tiêu; kết quả phải kèm lý do từng điều chỉnh.
      why_it_works: Trung vị cho mức thị trường trả cho 'doanh nghiệp điển hình'; điều chỉnh phản ánh phần khác biệt có căn cứ. Giữ điều chỉnh nhỏ, có tên, có lý do để tránh việc 'chọn multiple cho ra giá mình muốn'.
      assumptions:
      - Có tối thiểu 4-5 peers đủ tương đồng; loại ngoại lai và công ty lỗ.
      pitfalls:
      - Tổng điều chỉnh vượt +/-30% nghĩa là peers không tương đồng - tìm peers khác.
      - Dùng trung bình khi có ngoại lai.
      interpretation: 'Báo ba mức: thấp (trung vị giảm), cơ sở, cao (trung vị tăng) thay cho một điểm.'
      example:
        inputs:
          peer_pe:
          - 9.5
          - 11
          - 12.5
          - 10.2
          - 14
          adjustments:
          - -0.1
        steps:
        - Trung vị = 11,0x
        - Điều chỉnh -10% (thanh khoản thấp, quy mô nhỏ) -> 11,0 x 0,9 = 9,9x
        result: P/E mục tiêu 9,9x (giả định minh họa).
  - id: "m04-formulas-11"
    title: "Công thức: m04_eps_bvps_projection — Dự phóng EPS và BVPS 2 năm"
    tags: ["công", "thức", "m04_eps_bvps_projection", "dự", "phóng", "eps", "và", "bvps", "năm"]
    text: |-
      id: m04_eps_bvps_projection
      name_vi: Dự phóng EPS và BVPS 2 năm
      name_en: EPS and BVPS projection (2 years)
      expression_latex: EPS_{t+1} = EPS_t (1 + g_t), \quad BVPS_{t+1} = BVPS_t + EPS_{t+1} \times (1 - payout_{cash}) \ (\text{khi không phát hành thêm})
      expression_python: eps1 = eps0 * (1 + g1); eps2 = eps1 * (1 + g2); bvps1 = bvps0 + eps1 * (1 - payout_cash); bvps2 = bvps1 + eps2 * (1 - payout_cash)
      excel: =EPS0*(1+g1)
      variables:
      - symbol: eps0
        meaning: EPS cơ sở đã chuẩn hóa (năm gần nhất hoặc TTM)
        unit: VND/cp
      - symbol: g1, g2
        meaning: Tăng trưởng EPS năm 1 và năm 2, mỗi giả định phải gắn lý do (doanh thu, biên, chi phí dự phòng, thuế, số cp)
        unit: thập phân
      - symbol: payout_cash
        meaning: Tỷ lệ chi cổ tức tiền mặt
        unit: thập phân
      - symbol: bvps0
        meaning: BVPS gần nhất
        unit: VND/cp
      when_to_use: Mọi định giá multiple theo chỉ tiêu dự phóng.
      why_it_works: EPS tăng theo giả định vận hành (doanh thu x biên) chia số cp; BVPS tăng bằng phần giữ lại. Công thức BVPS bỏ qua phát hành cổ phiếu mới và chia cổ tức bằng cổ phiếu (phải điều chỉnh theo số cp mới).
      assumptions:
      - Số cp không đổi hoặc đã điều chỉnh pha loãng/chia thưởng.
      - Giả định tăng trưởng thận trọng, ghi rõ (kịch bản thấp/cơ sở/cao).
      pitfalls:
      - Ngoại suy tăng trưởng hiện tại bất biến nhiều năm (lỗi 'Garbage In, Garbage Out' ở prompt gốc).
      - Quên chia thưởng/phát hành làm EPS dự phóng không so được với EPS cũ.
      interpretation: Dự phóng năm 2 dùng để tính P/E forward 2 năm; giá hợp lý theo EPS năm 2 phải chiết khấu về hiện tại bằng Re (1 năm) nếu dùng.
      example:
        inputs:
          eps0: 4000
          g1: 0.15
          g2: 0.12
        steps:
        - EPS1 = 4.000 x 1,15 = 4.600
        - EPS2 = 4.600 x 1,12 = 5.152
        result: EPS1 4.600; EPS2 5.152 (giả định minh họa).
  - id: "m04-frameworks-1"
    title: "Frameworks: m04_method_selection — Chọn multiple phù hợp theo loại doanh nghiệp"
    tags: ["frameworks", "m04_method_selection", "chọn", "multiple", "phù", "hợp", "theo", "loại", "doanh", "nghiệp"]
    text: |-
      id: m04_method_selection
      name_vi: Chọn multiple phù hợp theo loại doanh nghiệp
      name_en: Multiple selection by business type
      origin: 'Thực hành định giá chuẩn của giới phân tích (sell-side, buy-side); chung quy bởi một nguyên tắc: multiple phải phản ánh cái tạo ra giá trị của mô hình kinh doanh đó. Prompt gốc nhấn mạnh ngân hàng dùng P/B và FCFE/DDM, doanh nghiệp sản xuất, bán lẻ, công nghệ ưu tiên FCFF.'
      components:
      - 'Ngân hàng, tài chính: P/B (gắn ROE), P/E chuẩn hóa; không dùng EV.'
      - 'Sản xuất, bán lẻ, hạ tầng nặng tài sản: EV/EBITDA là chính, P/E phụ, P/B tham khảo.'
      - 'BĐS: P/B (hoặc RNAV), P/E tham khảo; chú ý quỹ đất và chu kỳ bàn giao.'
      - 'Công nghệ, phần mềm, asset-light: EV/Sales, EV/EBITDA, PEG; hạn chế P/B.'
      - 'Chu kỳ (thép, hóa chất, cảng biển, dầu khí): P/B hoặc EV/EBITDA chuẩn hóa theo chu kỳ; không tin P/E đỉnh/đáy.'
      - 'Tiện ích, cổ tức cao: dividend yield, P/E, EV/EBITDA.'
      - 'Công ty lỗ: EV/Sales hoặc P/B hoặc đưa sang DCF (m05).'
      when_to_use: Bước đầu của mọi định giá multiple.
      how_to_apply:
      - 'Xác định mô hình giá trị: giá trị nằm ở bảng cân đối (P/B), dòng lợi nhuận (P/E), dòng tiền hoạt động (EV/EBITDA), hay tăng trưởng doanh thu (EV/Sales).'
      - Chọn một multiple chính và 1-2 multiple đối chiếu; kết luận dựa trên chính, đối chiếu để kiểm tra chéo.
      - Nếu multiple chính và đối chiếu mâu thuẫn mạnh, tìm nguyên nhân (bất thường, chu kỳ, kế toán) trước khi kết luận.
      how_to_read_results: Nếu nhiều multiple cùng chỉ một hướng (cùng rẻ/cùng đắt) thì độ tin cậy cao hơn; mâu thuẫn là tín hiệu cần chuẩn hóa dữ liệu.
      pitfalls:
      - Dùng P/B cho công ty asset-light; dùng EV cho ngân hàng; dùng P/E cho công ty lỗ.
      example: 'Ngân hàng thương mại: chính P/B-ROE, đối chiếu P/E chuẩn hóa. Doanh nghiệp thép: chính EV/EBITDA chuẩn hóa chu kỳ, đối chiếu P/B.'
  - id: "m04-frameworks-2"
    title: "Frameworks: m04_normalization — Chuẩn hóa lợi nhuận trước khi tính multiple (bẫy P/E TTM)"
    tags: ["frameworks", "m04_normalization", "chuẩn", "hóa", "lợi", "nhuận", "trước", "khi", "tính", "multiple", "bẫy", "ttm"]
    text: |-
      id: m04_normalization
      name_vi: Chuẩn hóa lợi nhuận trước khi tính multiple (bẫy P/E TTM)
      name_en: Earnings normalization (P/E TTM trap)
      origin: 'Phụ lục kinh nghiệm: lợi nhuận kế toán chứa khoản không lặp lại. Prompt gốc nêu minh họa STB nửa đầu năm 2026: ngân hàng đẩy mạnh trích lập dự phòng (gấp hơn 6 lần) để dọn nợ xấu, LNST sụt, P/E TTM cao; người chỉ nhìn P/E đắt sẽ bỏ lỡ cơ hội nếu dự phòng sau đó được hoàn nhập. (Ví dụ minh họa, data_reliability unverified, không dùng làm dữ liệu thị trường.)'
      components:
      - 'Lợi nhuận trước dự phòng (PPOP) và chi phí dự phòng: tách khỏi LNST.'
      - 'Khoản bất thường: lãi/lỗ thoái vốn, đánh giá lại, bán công ty con, xử lý tài sản.'
      - 'Hoàn nhập dự phòng tiềm năng (ngân hàng): ước theo tỷ lệ bao phủ nợ xấu và lịch sử thu hồi.'
      - Chi phí tín dụng bình thường (credit cost) theo trung bình chu kỳ.
      when_to_use: Khi P/E TTM bất thường so lịch sử hoặc peers, khi LNST thay đổi >30% mà không do doanh thu, ngân hàng sau giai đoạn dọn nợ xấu.
      how_to_apply:
      - Đọc thuyết minh BCTC và báo cáo KQKD để tìm khoản bất thường; ghi từng khoản kèm nguồn.
      - Tính LNST chuẩn hóa = LNST báo cáo + khoản bất thường làm giảm lợi nhuận - khoản bất thường làm tăng lợi nhuận (sau thuế, dùng thuế suất hiệu dụng).
      - 'Với ngân hàng: thay chi phí dự phòng thực tế bằng mức bình thường theo chu kỳ (credit cost x dư nợ), ghi giả định; không tự cộng toàn bộ hoàn nhập vào EPS cơ sở.'
      - Tính P/E trên EPS chuẩn hóa song song với TTM và báo cả hai.
      how_to_read_results: Nếu P/E TTM cao nhưng P/E chuẩn hóa nằm trong dải peers thì tín hiệu 'đắt' là ảo; ngược lại P/E TTM thấp nhờ lãi bất thường mà chuẩn hóa cao thì 'rẻ' là ảo.
      pitfalls:
      - Chuẩn hóa quá lạc quan (coi mọi khoản dự phòng là bất thường) - phải kiểm chứng bằng chất lượng tài sản (NPL, LLR, nhóm 2, nợ tái cơ cấu).
      - Chuẩn hóa tùy tiện để cho ra kết luận mong muốn.
      example: Xem worked example m04_ex_bank_normalized.
  - id: "m04-frameworks-3"
    title: "Frameworks: m04_cycle_adjust — Điều chỉnh theo chu kỳ ngành"
    tags: ["frameworks", "m04_cycle_adjust", "điều", "chỉnh", "theo", "chu", "kỳ", "ngành"]
    text: |-
      id: m04_cycle_adjust
      name_vi: Điều chỉnh theo chu kỳ ngành
      name_en: Cycle adjustment
      origin: 'Quan sát lâu đời ở ngành chu kỳ (thép, hóa chất, vận tải biển, bất động sản): P/E thấp nhất ở đỉnh lợi nhuận và cao nhất ở đáy (Graham-Dodd đề xuất lợi nhuận trung bình nhiều năm; Shiller phổ biến CAPE).'
      components:
      - 'Vị trí trong chu kỳ: đáy, phục hồi, đỉnh, suy thoái.'
      - Lợi nhuận/EBITDA trung bình 5-7 năm (mid-cycle).
      - P/B hoặc EV/EBITDA trung bình lịch sử.
      when_to_use: Doanh nghiệp chu kỳ; thị trường mà lợi nhuận biến động mạnh theo giá hàng hóa, lãi suất, thị trường BĐS.
      how_to_apply:
      - Xác định giai đoạn chu kỳ bằng giá hàng hóa, spread, công suất, tồn kho ngành (ghi nguồn, ngày).
      - Tính EPS/EBITDA mid-cycle = trung bình 5-7 năm hoặc biên mid-cycle x doanh thu hiện tại.
      - Áp multiple trung bình lịch sử lên chỉ tiêu mid-cycle; so với giá hiện tại.
      how_to_read_results: P/E thấp ở đỉnh chu kỳ là cảnh báo bán (thị trường đã trừ lợi nhuận về mức thấp); P/E cao ở đáy là cơ hội nếu lợi nhuận sắp phục hồi và bảng cân đối sống sót.
      pitfalls:
      - Mua vì P/E thấp ở đỉnh chu kỳ.
      - Cho rằng đáy chu kỳ mãi là cấu trúc (thực ra chu kỳ có thể kéo dài).
      example: 'Doanh nghiệp thép biên EBITDA 8%, trung bình chu kỳ 12%, năm nay 18% do giá cao: dùng 12% x doanh thu, không dùng 18%.'
  - id: "m04-frameworks-4"
    title: "Frameworks: m04_peer_selection — Chọn nhóm peers và bảng so sánh"
    tags: ["frameworks", "m04_peer_selection", "chọn", "nhóm", "peers", "và", "bảng", "so", "sánh"]
    text: |-
      id: m04_peer_selection
      name_vi: Chọn nhóm peers và bảng so sánh
      name_en: Peer group and comps table
      origin: Phương pháp trading comparables chuẩn trong phân tích tài chính (xem finance m10).
      components:
      - 'Tiêu chí: cùng ngành/mô hình kinh doanh, cùng thị trường, quy mô vốn hóa/doanh thu tương đương (0,3-3 lần), tăng trưởng, ROE/biên, đòn bẩy, thanh khoản.'
      - 'Cột bảng: mã, vốn hóa, giá, EPS TTM, EPS fwd, P/E TTM, P/E fwd, BVPS, P/B, ROE, tăng trưởng EPS, EV/EBITDA (nếu phi tài chính), nợ ròng/EBITDA, thanh khoản/ngày, ngày và nguồn dữ liệu.'
      - 'Thống kê: trung vị, trung bình, min, max; cả nhóm và mã đang xét.'
      when_to_use: Bước 2 của quy trình định giá.
      how_to_apply:
      - Dùng web_search/web_fetch lấy danh sách doanh nghiệp cùng ngành từ nguồn tin cậy (sở giao dịch, báo cáo công ty chứng khoán, trang dữ liệu); ghi nguồn và ngày truy cập cho mọi con số.
      - 'Lọc: loại công ty lỗ, vừa M&A lớn, hoặc đang bị hạn chế giao dịch, hoặc mô hình khác bản chất.'
      - 'Chuẩn hóa: cùng kỳ (TTM-TTM), cùng chuẩn mực kế toán, cùng đơn vị tiền, loại bất thường.'
      - Tính median, tính độ phân tán; nếu độ phân tán lớn (max/min > 3) thì cần peers hẹp hơn.
      how_to_read_results: Mã đang xét nằm ở quartile nào của peers; lệch có lý do (tăng trưởng/ROE khác) hay không.
      pitfalls:
      - Lấy peers 'cho đủ số' khác mô hình.
      - Dữ liệu từ các nguồn khác ngày/khác định nghĩa (EPS cơ bản vs pha loãng, VCSH có/không thiểu số).
      - 'Không ghi nguồn và ngày: dữ liệu thị trường hết hạn rất nhanh.'
      example: Xem worked example m04_ex_peer_table_football.
  - id: "m04-frameworks-5"
    title: "Frameworks: m04_football_field — Football field (biểu đồ sân bóng)"
    tags: ["frameworks", "m04_football_field", "football", "field", "biểu", "đồ", "sân", "bóng"]
    text: |-
      id: m04_football_field
      name_vi: Football field (biểu đồ sân bóng)
      name_en: Football field chart
      origin: 'Công cụ tổng hợp trong ngân hàng đầu tư: hiển thị nhiều phương pháp trên cùng một trục giá, mỗi phương pháp là một thanh từ thấp đến cao (xem finance m10).'
      components:
      - 'Mỗi hàng: một phương pháp (P/E thấp-cao, P/B theo ROE, EV/EBITDA, DCF/DDM từ m05, 52 tuần).'
      - 'Mỗi thanh: [giá thấp, giá cao] từ nhạy multiple/giả định.'
      - 'Đường dọc: thị giá hiện tại.'
      - 'Vùng chồng nhau của các thanh: dải giá hợp lý.'
      when_to_use: Bước tổng hợp cuối cùng và khi trình bày cho người dùng.
      how_to_apply:
      - Với mỗi phương pháp tính giá thấp/cơ sở/cao bằng multiple thấp/cơ sở/cao và EPS/BVPS thấp/cơ sở/cao.
      - Vẽ (bảng text hoặc python matplotlib) và đánh dấu thị giá.
      - Xác định dải chồng nhau của ít nhất 2-3 phương pháp độc lập; coi đó là khoảng giá hợp lý.
      - Tính biên an toàn = (giá hợp lý thấp-cơ sở - thị giá)/giá hợp lý.
      how_to_read_results: 'Thị giá dưới đáy dải: Rẻ; trong dải: Hợp lý; trên đỉnh dải: Đắt. Thanh quá rộng nghĩa là kết quả không chắc chắn.'
      pitfalls:
      - Thanh dựng từ cùng một giả định lặp lại (không độc lập).
      - Trình bày chỉ điểm giữa.
      example: Xem worked example m04_ex_peer_table_football.
  - id: "m04-frameworks-6"
    title: "Frameworks: m04_accounting_comparability — Kiểm tra khả năng so sánh (kế toán, kỳ, loại EPS)"
    tags: ["frameworks", "m04_accounting_comparability", "kiểm", "tra", "khả", "năng", "so", "sánh", "kế", "toán", "kỳ", "loại"]
    text: |-
      id: m04_accounting_comparability
      name_vi: Kiểm tra khả năng so sánh (kế toán, kỳ, loại EPS)
      name_en: Comparability checks
      origin: Thực hành thẩm tra dữ liệu khi so sánh công ty khác chuẩn mực (VAS và IFRS), khác kỳ báo cáo.
      components:
      - Chuẩn mực kế toán (VAS vs IFRS; ví dụ khác ở thuê tài sản, ghi nhận doanh thu, đánh giá lại).
      - 'Kỳ báo cáo: cuối năm 31/12 khác 30/6, 31/3 - lệch kỳ thì TTM so sánh thận trọng.'
      - 'Số cp: cơ bản vs pha loãng; có/không cổ phiếu quỹ.'
      - 'Hợp nhất: có/không lợi ích cổ đông thiểu số.'
      - Loại tiền và đơn vị.
      when_to_use: Khi peers gồm công ty nước ngoài hoặc niêm yết đồng thời nhiều sàn; khi so sánh VN với khu vực.
      how_to_apply:
      - Lập danh sách khác biệt từng peers.
      - Điều chỉnh về cùng chuẩn hoặc loại peers khó điều chỉnh.
      - Ghi rõ các khác biệt còn lại trong báo cáo.
      how_to_read_results: Nếu khác biệt kế toán giải thích phần lớn chênh multiple thì không kết luận rẻ/đắt dựa trên chênh lệch đó.
      pitfalls:
      - So P/E công ty VN (VAS) với công ty Mỹ (US GAAP) mà không ghi nhận khác biệt.
      example: 'EBITDA công ty IFRS 16 không chứa chi phí thuê, EBITDA VAS chứa chi phí thuê: EV/EBITDA lệch có hệ thống.'
  - id: "m04-frameworks-7"
    title: "Frameworks: m04_dilution_handling — Xử lý pha loãng EPS và số cổ phiếu"
    tags: ["frameworks", "m04_dilution_handling", "xử", "lý", "pha", "loãng", "eps", "và", "số", "cổ", "phiếu"]
    text: |-
      id: m04_dilution_handling
      name_vi: Xử lý pha loãng EPS và số cổ phiếu
      name_en: Dilution handling
      origin: Chuẩn kế toán EPS cơ bản và pha loãng (IAS 33 / VAS 30).
      components:
      - Cổ phiếu thưởng, chia tách (điều chỉnh hồi tố).
      - ESOP, quyền chọn, trái phiếu chuyển đổi, phát hành riêng lẻ.
      - Cổ phiếu quỹ (trừ ra).
      when_to_use: Mọi lần tính EPS, BVPS và giá mỗi cổ phiếu từ EV.
      how_to_apply:
      - Lấy số cp lưu hành cuối kỳ và kế hoạch phát hành đã được phê duyệt.
      - Tính số cp pha loãng (treasury stock method nếu quyền chọn).
      - Điều chỉnh EPS lịch sử cho chia thưởng để so sánh được.
      how_to_read_results: Pha loãng 5% nghĩa là giá hợp lý giảm khoảng 5% ở cùng EV.
      pitfalls:
      - Dùng EPS cũ chưa điều chỉnh cổ phiếu thưởng làm P/E cao ảo.
      - Bỏ qua kế hoạch phát hành lớn.
      example: Giá hợp lý trên 100 triệu cp là 17.000 VND; sau pha loãng 105 triệu cp còn khoảng 16.190 VND.
  - id: "m04-procedures-1"
    title: "Quy trình: m04_proc_full_valuation — Quy trình định giá multiple từ đầu đến cuối"
    tags: ["quy", "trình", "m04_proc_full_valuation", "định", "giá", "multiple", "từ", "đầu", "đến", "cuối"]
    text: |-
      id: m04_proc_full_valuation
      name: Quy trình định giá multiple từ đầu đến cuối
      steps:
      - 1. Xác định mã, ngày định giá, loại hình (ngân hàng, sản xuất, công nghệ, BĐS, chu kỳ). Chọn multiple chính và đối chiếu theo m04_method_selection.
      - '2. Thu thập dữ liệu công ty: BCTC mới nhất, EPS, BVPS, ROE, nợ vay, tiền, lợi ích thiểu số, số cp pha loãng, cổ tức. Ghi nguồn và ngày; nếu không có nguồn tin cậy thì nêu rõ ''chưa xác minh'', không bịa.'
      - '3. Chuẩn hóa lợi nhuận theo m04_normalization: loại bất thường, tách dự phòng bất thường, đối chiếu chu kỳ.'
      - 4. Chọn peers theo m04_peer_selection bằng web_search/web_fetch; ghi nguồn + ngày truy cập; lập bảng peers và tính trung vị.
      - '5. Chọn multiple mục tiêu theo m04_target_multiple: trung vị, điều chỉnh từng yếu tố (tăng trưởng, ROE, rủi ro, thanh khoản/quy mô, chu kỳ), ghi lý do; lập ba mức thấp-cơ sở-cao.'
      - 6. Dự phóng EPS/BVPS năm hiện tại và năm kế tiếp theo m04_eps_bvps_projection với giả định rõ và ba kịch bản.
      - 7. Tính giá hợp lý theo từng multiple (m04_fair_price_pe_pb; với EV dùng cầu nối EV sang vốn chủ m04_ev_ebitda). Với ngân hàng thêm P/B hợp lý theo ROE (m04_pb_roe).
      - '8. Kiểm tra chéo: P/E hợp lý Gordon, PEG, dividend yield; đối chiếu DCF/FCFE/DDM của m05 nếu có.'
      - 9. Dựng football field và dải chồng nhau; tính biên an toàn (m04_football_field).
      - '10. Kết luận Rẻ/Hợp lý/Đắt theo decision_rules, nêu khoảng giá, biên an toàn, các giả định nhạy nhất, rủi ro. Kèm disclaimer: không phải khuyến nghị đầu tư cá nhân hóa.'
      outputs: 'Báo cáo: bảng multiple hiện tại, bảng peers (nguồn, ngày), multiple mục tiêu và lý do, EPS/BVPS dự phóng và giả định, giá hợp lý theo từng phương pháp (thấp/cơ sở/cao), football field, kết luận Rẻ/Hợp lý/Đắt với biên an toàn, hạn chế dữ liệu.'
  - id: "m04-procedures-2"
    title: "Quy trình: m04_proc_bank_pb — Định giá ngân hàng bằng P/B và ROE"
    tags: ["quy", "trình", "m04_proc_bank_pb", "định", "giá", "ngân", "hàng", "bằng", "và", "roe"]
    text: |-
      id: m04_proc_bank_pb
      name_vi: Định giá ngân hàng bằng P/B và ROE
      name: Định giá ngân hàng bằng P/B-ROE
      steps:
      - 1. Lấy BVPS cổ đông mẹ, ROE chuẩn hóa (loại bất thường, dùng dự phòng bình thường), NPL, LLR, CAR (từ m03).
      - 2. Chọn Re từ CAPM với Rf là lợi suất trái phiếu chính phủ 10 năm VN tại thời điểm định giá (nguồn m07, ghi ngày); không dùng 10% cố định cho mọi doanh nghiệp.
      - 3. Chọn g bền vững = ROE x tỷ lệ giữ lại, giới hạn bởi tăng trưởng danh nghĩa dài hạn; ngân hàng tăng trưởng cao dùng mô hình 2 giai đoạn.
      - 4. Tính P/B hợp lý = (ROE - g)/(Re - g); nhân BVPS ra giá hợp lý. Lập bảng nhạy ROE x Re.
      - 5. Đối chiếu P/B của peers (cùng nhóm vốn nhà nước/tư nhân, quy mô), P/E chuẩn hóa.
      - 6. Chiết khấu P/B hợp lý nếu chất lượng tài sản yếu (NPL, nợ nhóm 2 cao, LLR thấp) hoặc BVPS có thể bị ăn mòn bởi dự phòng còn thiếu.
      - 7. Kết luận theo decision_rules.
      outputs: Bảng P/B hợp lý theo ROE-Re, giá hợp lý khoảng, so với P/B thị trường và peers.
  - id: "m04-procedures-3"
    title: "Quy trình: m04_proc_ev_bridge — Định giá doanh nghiệp phi tài chính bằng EV/EBITDA"
    tags: ["quy", "trình", "m04_proc_ev_bridge", "định", "giá", "doanh", "nghiệp", "phi", "tài", "chính", "bằng", "ev"]
    text: |-
      id: m04_proc_ev_bridge
      name_vi: Định giá doanh nghiệp phi tài chính bằng EV/EBITDA
      name: Định giá phi tài chính bằng EV/EBITDA và cầu nối
      steps:
      - 1. Tính EBITDA điều chỉnh (loại bất thường), TTM và forward.
      - 2. Lấy nợ vay, tiền, lợi ích thiểu số, tài sản phi hoạt động, số cp pha loãng mới nhất.
      - 3. Chọn peers và trung vị EV/EBITDA; điều chỉnh theo tăng trưởng, capex/EBITDA, thanh khoản; ba mức thấp-cơ sở-cao.
      - 4. EV mục tiêu = EBITDA x multiple; cầu nối sang vốn chủ; chia cp pha loãng.
      - 5. Đối chiếu với P/E và EV/Sales; kiểm tra tính hợp lý của vốn hóa hiện tại và EV hiện tại.
      outputs: Giá hợp lý theo thấp/cơ sở/cao và so với thị giá.
  - id: "m04-procedures-4"
    title: "Quy trình: m04_proc_report — Báo cáo kết luận Rẻ/Hợp lý/Đắt"
    tags: ["quy", "trình", "m04_proc_report", "báo", "cáo", "kết", "luận", "rẻ", "hợp", "lý", "đắt"]
    text: |-
      id: m04_proc_report
      name: Báo cáo kết luận Rẻ/Hợp lý/Đắt
      steps:
      - '1. Trình bày bảng: thị giá, multiple hiện tại (TTM, forward), multiple mục tiêu, giá hợp lý thấp-cơ sở-cao.'
      - 2. Nêu khoảng giá hợp lý và biên an toàn theo công thức (giá hợp lý cơ sở - thị giá)/giá hợp lý cơ sở.
      - 3. Kết luận theo decision_rules, nêu rõ phụ thuộc giả định nào.
      - 4. Nêu bẫy nhận diện được (bất thường, chu kỳ, kế toán, pha loãng) và hành động kiểm tra tiếp.
      - 5. Disclaimer và ngày dữ liệu; mọi số thị trường kèm nguồn + ngày truy cập; số chưa xác minh gắn nhãn.
      outputs: Một báo cáo ngắn gọn, có bảng, đủ để người đọc kiểm tra lại từng giả định.
  - id: "m04-decision_rules-1"
    title: "Quy tắc quyết định: Nếu doanh nghiệp là ngân hàng/tài chính thì dùng P/B-ROE và P/E chuẩn hóa; không dùng EV/EBITDA."
    tags: ["quy", "tắc", "quyết", "định", "nếu", "doanh", "nghiệp", "là", "ngân", "hàng", "tài", "chính"]
    text: |-
      Nếu doanh nghiệp là ngân hàng/tài chính thì dùng P/B-ROE và P/E chuẩn hóa; không dùng EV/EBITDA.
  - id: "m04-decision_rules-2"
    title: "Quy tắc quyết định: Nếu doanh nghiệp asset-light hoặc tài sản vô hình lớn thì không dùng P/B làm kết luận chính; dùng E…"
    tags: ["quy", "tắc", "quyết", "định", "nếu", "doanh", "nghiệp", "asset", "light", "hoặc", "tài", "sản"]
    text: |-
      Nếu doanh nghiệp asset-light hoặc tài sản vô hình lớn thì không dùng P/B làm kết luận chính; dùng EV/Sales, EV/EBITDA, PEG, DCF.
  - id: "m04-decision_rules-3"
    title: "Quy tắc quyết định: Nếu EPS TTM thay đổi mạnh (>30%) do dự phòng hoặc khoản bất thường thì phải chuẩn hóa trước khi kết…"
    tags: ["quy", "tắc", "quyết", "định", "nếu", "eps", "ttm", "thay", "đổi", "mạnh", "30", "do"]
    text: |-
      Nếu EPS TTM thay đổi mạnh (>30%) do dự phòng hoặc khoản bất thường thì phải chuẩn hóa trước khi kết luận từ P/E TTM, và báo cả hai con số.
  - id: "m04-decision_rules-4"
    title: "Quy tắc quyết định: Nếu ngành chu kỳ và lợi nhuận đang ở đỉnh thì không coi P/E thấp là rẻ; dùng lợi nhuận mid-cycle ho…"
    tags: ["quy", "tắc", "quyết", "định", "nếu", "ngành", "chu", "kỳ", "và", "lợi", "nhuận", "đang"]
    text: |-
      Nếu ngành chu kỳ và lợi nhuận đang ở đỉnh thì không coi P/E thấp là rẻ; dùng lợi nhuận mid-cycle hoặc P/B/EV-EBITDA trung bình lịch sử.
  - id: "m04-decision_rules-5"
    title: "Quy tắc quyết định: Nếu ROE bền vững > Re thì P/B hợp lý > 1; nếu ROE < Re thì P/B < 1 là hợp lý, không phải rẻ."
    tags: ["quy", "tắc", "quyết", "định", "nếu", "roe", "bền", "vững", "re", "thì", "hợp", "lý"]
    text: |-
      Nếu ROE bền vững > Re thì P/B hợp lý > 1; nếu ROE < Re thì P/B < 1 là hợp lý, không phải rẻ.
  - id: "m04-decision_rules-6"
    title: "Quy tắc quyết định: Nếu thị giá thấp hơn giá hợp lý cơ sở từ 20% trở lên VÀ thấp hơn đáy dải football field thì 'Rẻ'; n…"
    tags: ["quy", "tắc", "quyết", "định", "nếu", "thị", "giá", "thấp", "hơn", "hợp", "lý", "cơ"]
    text: |-
      Nếu thị giá thấp hơn giá hợp lý cơ sở từ 20% trở lên VÀ thấp hơn đáy dải football field thì 'Rẻ'; nếu giá nằm trong dải hợp lý (cơ sở +/-10%) thì 'Hợp lý'; nếu cao hơn đỉnh dải hoặc >10% so với cơ sở thì 'Đắt'. Ngưỡng 20% và 10% là quy ước mặc định cho cổ phiếu vốn hóa nhỏ vừa, nâng biên an toàn (vd 30-40%) với doanh nghiệp rủi ro cao hoặc dữ liệu kém.
  - id: "m04-decision_rules-7"
    title: "Quy tắc quyết định: Nếu các multiple độc lập cho tín hiệu mâu thuẫn thì không kết luận mạnh; tìm nguyên nhân và hạ độ t…"
    tags: ["quy", "tắc", "quyết", "định", "nếu", "các", "multiple", "độc", "lập", "cho", "tín", "hiệu"]
    text: |-
      Nếu các multiple độc lập cho tín hiệu mâu thuẫn thì không kết luận mạnh; tìm nguyên nhân và hạ độ tin cậy.
  - id: "m04-decision_rules-8"
    title: "Quy tắc quyết định: Nếu tổng điều chỉnh multiple vượt +/-30% so với trung vị thì xem lại nhóm peers."
    tags: ["quy", "tắc", "quyết", "định", "nếu", "tổng", "điều", "chỉnh", "multiple", "vượt", "30", "so"]
    text: |-
      Nếu tổng điều chỉnh multiple vượt +/-30% so với trung vị thì xem lại nhóm peers.
  - id: "m04-decision_rules-9"
    title: "Quy tắc quyết định: Nếu peers đang cùng bị định giá quá cao (so với lịch sử và earnings yield vs trái phiếu) thì 'rẻ so…"
    tags: ["quy", "tắc", "quyết", "định", "nếu", "peers", "đang", "cùng", "bị", "giá", "quá", "cao"]
    text: |-
      Nếu peers đang cùng bị định giá quá cao (so với lịch sử và earnings yield vs trái phiếu) thì 'rẻ so với peers' không đủ để kết luận rẻ; đối chiếu DCF/earnings yield.
  - id: "m04-decision_rules-10"
    title: "Quy tắc quyết định: Nếu thiếu dữ liệu đáng tin về một biến chính (BVPS, nợ ròng, số cp pha loãng) thì dừng, nêu rõ thiế…"
    tags: ["quy", "tắc", "quyết", "định", "nếu", "thiếu", "dữ", "liệu", "đáng", "tin", "về", "một"]
    text: |-
      Nếu thiếu dữ liệu đáng tin về một biến chính (BVPS, nợ ròng, số cp pha loãng) thì dừng, nêu rõ thiếu gì, không điền số bịa.
  - id: "m04-decision_rules-11"
    title: "Quy tắc quyết định: Nếu peers < 4 hoặc độ phân tán max/min > 3 thì cảnh báo độ tin cậy thấp và mở rộng/thu hẹp nhóm."
    tags: ["quy", "tắc", "quyết", "định", "nếu", "peers", "hoặc", "độ", "phân", "tán", "max", "min"]
    text: |-
      Nếu peers < 4 hoặc độ phân tán max/min > 3 thì cảnh báo độ tin cậy thấp và mở rộng/thu hẹp nhóm.
  - id: "m04-decision_rules-12"
    title: "Quy tắc quyết định: Nếu so sánh khác chuẩn mực kế toán hoặc khác kỳ thì ghi chú, điều chỉnh hoặc loại khỏi trung vị."
    tags: ["quy", "tắc", "quyết", "định", "nếu", "so", "sánh", "khác", "chuẩn", "mực", "kế", "toán"]
    text: |-
      Nếu so sánh khác chuẩn mực kế toán hoặc khác kỳ thì ghi chú, điều chỉnh hoặc loại khỏi trung vị.
  - id: "m04-decision_rules-13"
    title: "Quy tắc quyết định: Nếu kết luận dùng cho quyết định mua bán thật thì thêm disclaimer và khuyên đối chiếu thêm với m05 …"
    tags: ["quy", "tắc", "quyết", "định", "nếu", "kết", "luận", "dùng", "cho", "mua", "bán", "thật"]
    text: |-
      Nếu kết luận dùng cho quyết định mua bán thật thì thêm disclaimer và khuyên đối chiếu thêm với m05 và rủi ro thanh khoản (m07).
  - id: "m04-benchmarks-1"
    title: "Chuẩn so sánh: Quy ước PEG"
    tags: ["chuẩn", "so", "sánh", "quy", "ước", "peg"]
    text: |-
      metric: Quy ước PEG
      value: <1 hấp dẫn; ~1 hợp lý; >2 đắt
      context: Quy tắc kinh nghiệm phổ biến, không phải chuẩn khoa học
      confidence: medium
  - id: "m04-benchmarks-2"
    title: "Chuẩn so sánh: Trần g trong công thức Gordon"
