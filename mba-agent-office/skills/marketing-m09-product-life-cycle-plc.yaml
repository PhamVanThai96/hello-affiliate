  - id: "m09-case_lessons-1"
    title: "Bài học case: iPhone qua 17 năm (2007-2024)"
    tags: ["bài", "học", "case", "iphone", "qua", "17", "năm", "2007", "2024"]
    text: |-
      name: iPhone qua 17 năm (2007-2024)
      type: success
      setup: |
        Introduction 2007-2008: Gen 1 chỉ AT&T Mỹ, $499, keynote PR của Steve Jobs, phân phối hạn chế, skimming. Growth 2008-2015: iPhone 3G đến 6 Plus, App Store, đa quốc gia, đa operator, giá giảm dần ($199 với hợp đồng), 'There is an app for that'. Maturity 2015-2024: smartphone bão hoà, cải tiến incremental, line extension (SE, Pro, Pro Max), trade-in, services (Apple One), ecosystem lock-in. Decline? Chưa: doanh số ổn định/giảm nhẹ nhưng doanh thu tăng nhờ ASP cao.
      key_calculations:
      - 'Doanh thu = Số lượng x ASP: số lượng giảm nhẹ nhưng ASP tăng (nguồn: +15% nhờ upsell Pro) -> doanh thu và lợi nhuận tăng (minh hoạ: (1-0.05)(1+0.15)-1 = +9.25%)'
      - 'Market Modification: Ấn Độ, ĐNÁ, iPhone SE giá thấp hơn, sản xuất tại Ấn Độ: India sales +40% (2023, nguồn không trích dẫn)'
      - 'Product Modification: Camera Pro, Dynamic Island, USB-C, Apple Intelligence (2024)'
      - 'Marketing Mix Modification: trade-in, trả góp (Apple Card), Apple One bundle -> từ bán thiết bị sang bán thuê bao'
      lesson: |
        PLC không phải định mệnh: Apple chủ động kéo dài Maturity bằng đổi mới liên tục + ecosystem lock-in. Revenue quan trọng hơn Unit Sales (premiumization qua ASP). Dịch vụ biến device thành platform nên PLC của platform dài hơn PLC của device. Vượt Chasm nhờ App Store giải câu hỏi 'làm được gì' thay vì 'công nghệ hay'. Portfolio: iPhone (Maturity), Apple Watch (Growth), Vision Pro (Introduction), dòng tiền Cash Cow nuôi Stars và Question Marks. Hạn chế: disruption (AR glasses, AI wearables), super cycle ít dần, phụ thuộc Trung Quốc (rủi ro PESTEL).
      data_reliability: illustrative
  - id: "m09-case_lessons-2"
    title: "Bài học case: Nokia bị iPhone vượt (disruption)"
    tags: ["bài", "học", "case", "nokia", "bị", "iphone", "vượt", "disruption"]
    text: |-
      name: Nokia bị iPhone vượt (disruption)
      type: failure
      setup: 'Nguồn nhắc ngắn: sản phẩm có thể ''chết đột ngột'' vì disruption; Nokia bị iPhone ''giết'' trong khoảng 3 năm.'
      key_calculations:
      - Không có số liệu trong nguồn; khung thời gian ~3 năm do nguồn nêu, chưa kiểm chứng
      lesson: Đường cong S-curve không bảo vệ bạn khỏi công nghệ thay thế; cần theo dõi tín hiệu disruption (PESTEL) và phát triển sản phẩm kế nhiệm ngay ở Maturity.
      data_reliability: unverified
  - id: "m09-case_lessons-3"
    title: "Bài học case: Các ví dụ minh hoạ theo giai đoạn (nguồn)"
    tags: ["bài", "học", "case", "các", "ví", "dụ", "minh", "hoạ", "theo", "giai", "đoạn", "nguồn"]
    text: |-
      name: Các ví dụ minh hoạ theo giai đoạn (nguồn)
      type: success
      setup: 'Introduction: ChatGPT 2022 tăng trưởng bằng PR + word-of-mouth. Growth: Grab mở rộng SG -> Hà Nội -> toàn quốc -> ĐNÁ. Maturity: Coca-Cola line extension (Zero, Diet, Cherry, Vanilla, Energy) và 200+ quốc gia; Starbucks Rewards; hàng không war giá. Decline: iPod khai tử 2022, BlackBerry giảm giá không cứu được, máy fax, DVD player. Maturity extension: Arm & Hammer baking soda -> cleaning, deodorizer; Samsung camera; McDonald''s delivery.'
      key_calculations:
      - Không có số liệu tài chính; minh hoạ định tính
      lesson: 'Mỗi giai đoạn có một đòn bẩy marketing dominating: PR/seeding (Introduction), mở rộng phân phối/brand (Growth), line extension + loyalty (Maturity), thu hẹp (Decline). Một số ví dụ nguồn (Grab vs Uber, Netflix, Tesla) cần diễn giải thận trọng.'
      data_reliability: illustrative
  - id: "m09-worked_examples-1"
    title: "Ví dụ có lời giải: 1. Chẩn đoán giai đoạn: thương hiệu trà sữa 'Trà Sen' (SME VN, minh hoạ)"
    tags: ["ví", "dụ", "có", "lời", "giải", "chẩn", "đoán", "giai", "đoạn", "thương", "hiệu", "trà"]
    text: |-
      name: '1. Chẩn đoán giai đoạn: thương hiệu trà sữa ''Trà Sen'' (SME VN, minh hoạ)'
      inputs: 'Doanh thu (triệu VNĐ): năm 1: 600; năm 2: 1,100; năm 3: 1,500; năm 4: 1,560; năm 5: 1,580; năm 6: 1,500. Khu vực có 3 đối thủ năm 1, 25 đối thủ năm 4. Biên lợi nhuận: năm 1 âm, năm 3 +14%, năm 6 +6%.'
      steps:
      - 'Tính g từng năm: 1100/600-1 = 83.3%; 1500/1100-1 = 36.4%; 1560/1500-1 = 4.0%; 1580/1560-1 = 1.3%; 1500/1580-1 = -5.1%'
      - 'Gán nhãn: năm 2-3 g>20% -> Growth; năm 4-5 g trong 0-5% -> Maturity; năm 6 g<0 -> bắt đầu Decline? cần kiểm tra'
      - 'Xác nhận bằng số đối thủ: tăng 3 -> 25 (Maturity đông nhất); biên lợi nhuận giảm 14% -> 6% (chiến tranh giá)'
      - 'Kiểm tra nguyên nhân năm 6: có phải do cạnh tranh giá hoặc cửa hàng chuyển địa điểm? hay do ngành suy thoái (cấu trúc)?'
      - 'Kết luận: cuối Maturity, có nguy cơ vào Decline; chưa cắt đầu tư ngay (tránh self-fulfilling)'
      result: 'Trà Sen ở cuối Maturity (độ tin cậy trung bình); khuyến nghị: Market Mod (B2B văn phòng), Product Mod (dòng ít đường/healthy), Mix Mod (giao hàng, combo, thành viên); đặt trigger: nếu g<0 thêm 2 quý và đóng góp âm thì xem xét Harvest/Divest.'
  - id: "m09-worked_examples-2"
    title: "Ví dụ có lời giải: 2. Doanh thu tăng nhờ ASP dù lượng giảm: công ty máy lọc nước SME (minh hoạ)"
    tags: ["ví", "dụ", "có", "lời", "giải", "doanh", "thu", "tăng", "nhờ", "asp", "dù", "lượng"]
    text: |-
      name: '2. Doanh thu tăng nhờ ASP dù lượng giảm: công ty máy lọc nước SME (minh hoạ)'
      inputs: 'Năm trước: 100 máy x ASP 20 triệu = 2,000 triệu. Năm nay: 95 máy, ASP 23 triệu (nhờ bán nhiều dòng cao cấp và lắp đặt).'
      steps:
      - g_q = 95/100 - 1 = -5%
      - g_ASP = 23/20 - 1 = +15%
      - Doanh thu năm nay = 95 x 23 = 2,185 triệu
      - 'g_R = 2185/2000 - 1 = 9.25%; kiểm tra bằng tích: 0.95 x 1.15 - 1 = 0.0925'
      - Không cộng thẳng -5% + 15% = 10% (sai)
      result: 'Doanh thu +9.25% nhờ premiumization (Maturity). Cảnh báo: nếu số lượng tiếp tục giảm, cần kiểm tra thị phần; hành động: line extension, trade-in máy cũ, gói bảo trì định kỳ (dịch vụ).'
  - id: "m09-worked_examples-3"
    title: "Ví dụ có lời giải: 3. Harvest sản phẩm suy thoái: cà phê hòa tan 3in1 (minh hoạ)"
    tags: ["ví", "dụ", "có", "lời", "giải", "harvest", "sản", "phẩm", "suy", "thoái", "cà", "phê"]
    text: |-
      name: '3. Harvest sản phẩm suy thoái: cà phê hòa tan 3in1 (minh hoạ)'
      inputs: 'Doanh thu 480 triệu/năm, biên đóng góp 35%, marketing 60 triệu, chi phí cố định phân bổ 90 triệu. Nếu Harvest: marketing cắt còn 10 triệu, doanh thu giảm 8.3% còn 440 triệu.'
      steps:
      - 'Maintain: 480 x 0.35 = 168; 168 - 60 - 90 = 18 triệu'
      - 'Harvest: 440 x 0.35 = 154; 154 - 10 - 90 = 54 triệu'
      - 'Chênh lệch: 54 - 18 = +36 triệu/năm'
      - 'Kiểm tra giả định: chi phí cố định 90 có cắt được không? nếu không thì lợi ích thật là 36; xem xét tác động bán chéo sang cà phê phin/hạt'
      result: 'Harvest cho đóng góp cao hơn 36 triệu/năm. Khuyến nghị: Harvest và theo dõi hằng quý; nếu doanh thu sụt >20% bất ngờ hoặc đóng góp <0 thì chuyển Discontinue/Divest. Nguồn lực giải phóng chuyển cho dòng đang Growth.'
  - id: "m09-worked_examples-4"
    title: "Ví dụ có lời giải: 4. Ước lượng khách theo nhóm Rogers và Chasm: phần mềm quản lý bếp cho quán ăn (minh hoạ)"
    tags: ["ví", "dụ", "có", "lời", "giải", "ước", "lượng", "khách", "theo", "nhóm", "rogers", "và"]
    text: |-
      name: '4. Ước lượng khách theo nhóm Rogers và Chasm: phần mềm quản lý bếp cho quán ăn (minh hoạ)'
      inputs: Thị trường mục tiêu 50,000 quán ăn có thể dùng phần mềm. Hiện có 1,100 khách trả phí, doanh số bắt đầu chững.
      steps:
      - Innovators = 2.5% x 50,000 = 1,250; Early Adopters = 13.5% x 50,000 = 6,750; tích lũy Chasm = 16% x 50,000 = 8,000
      - Hiện 1,100 khách (2.2%) -> vẫn trong nhóm Innovators; chưa tới Chasm (cần 8,000)
      - Early Majority = 34% x 50,000 = 17,000 khách; thông điệp phải đổi từ tính năng sang tiết kiệm chi phí, tham chiếu quán tương tự, bảo hành/hỗ trợ
      - 'Chiến lược vượt Chasm: chọn niche (chuỗi phở/quán nhậu 20-50 bàn), giải pháp trọn gói (cài đặt + đào tạo + hỗ trợ Zalo), thu thập case study từ 20-30 khách đầu'
      result: Doanh số chững ở 1,100 chưa phải Chasm thật mà là chưa hết nhóm đầu; cần bàn phân biệt giữa bão hoà nhóm đầu và hiệu quả thông điệp trước khi kết luận.
  - id: "m09-practice_questions-1"
    title: "Câu hỏi luyện tập: Doanh thu sản phẩm A: 800, 1,000, 1,080 triệu (3 năm). Tính tăng trưởng từng năm và nhận định giai …"
    tags: ["câu", "hỏi", "luyện", "tập", "doanh", "thu", "sản", "phẩm", "800", "000", "080", "triệu"]
    text: |-
      q: 'Doanh thu sản phẩm A: 800, 1,000, 1,080 triệu (3 năm). Tính tăng trưởng từng năm và nhận định giai đoạn.'
      a: g1 = 1000/800-1 = 25%; g2 = 1080/1000-1 = 8%. Từ >20% xuống 8% -> chuyển từ Growth sang giai đoạn chuyển tiếp/vào Maturity; cần thêm số đối thủ và biên lợi nhuận.
  - id: "m09-practice_questions-2"
    title: "Câu hỏi luyện tập: Sản phẩm bán 10,000 chiếc năm trước với ASP 500k; năm nay 9,000 chiếc ASP 600k. Doanh thu thay đổi …"
    tags: ["câu", "hỏi", "luyện", "tập", "sản", "phẩm", "bán", "10", "000", "chiếc", "năm", "trước"]
    text: |-
      q: Sản phẩm bán 10,000 chiếc năm trước với ASP 500k; năm nay 9,000 chiếc ASP 600k. Doanh thu thay đổi bao nhiêu %?
      a: 'Trước: 5,000 triệu; sau: 9,000 x 0.6 = 5,400 triệu -> +8%. Kiểm tra: (0.9)(1.2)-1 = 0.08.'
  - id: "m09-practice_questions-3"
    title: "Câu hỏi luyện tập: Tại sao nhiều sản phẩm tech chết ở Chasm?"
    tags: ["câu", "hỏi", "luyện", "tập", "tại", "sao", "nhiều", "sản", "phẩm", "tech", "chết", "chasm"]
    text: |-
      q: Tại sao nhiều sản phẩm tech chết ở Chasm?
      a: Early Adopters yêu công nghệ, chấp nhận rủi ro; Early Majority cần giải pháp thực tế, đáng tin, có tham chiếu. Sản phẩm không chuyển thông điệp và 'whole product' nên không thuyết phục nhóm kế tiếp.
  - id: "m09-practice_questions-4"
    title: "Câu hỏi luyện tập: Khi nào chọn skimming, khi nào penetration ở Introduction?"
    tags: ["câu", "hỏi", "luyện", "tập", "khi", "nào", "chọn", "skimming", "penetration", "introduction"]
    text: |-
      q: Khi nào chọn skimming, khi nào penetration ở Introduction?
      a: 'Skimming: sản phẩm khác biệt, có nhóm trả giá cao, năng lực giới hạn (iPhone $499). Penetration: cần lượng nhanh, dễ bị sao chép, economies of scale (Grab voucher chuyến đầu).'
  - id: "m09-practice_questions-5"
    title: "Câu hỏi luyện tập: Kể 3 chiến lược kéo dài Maturity và cho ví dụ VN."
    tags: ["câu", "hỏi", "luyện", "tập", "kể", "chiến", "lược", "kéo", "dài", "maturity", "và", "cho"]
    text: |-
      q: Kể 3 chiến lược kéo dài Maturity và cho ví dụ VN.
      a: 'Market Modification (bán khối văn phòng/B2B), Product Modification (dòng healthy/ít đường), Marketing Mix Modification (giao hàng, combo, loyalty). Ví dụ nguồn: Arm & Hammer, Samsung camera, McDonald''s delivery.'
  - id: "m09-practice_questions-6"
    title: "Câu hỏi luyện tập: Nêu 4 chiến lược ở Decline và khi nào dùng Harvest."
    tags: ["câu", "hỏi", "luyện", "tập", "nêu", "chiến", "lược", "decline", "và", "khi", "nào", "dùng"]
    text: |-
      q: Nêu 4 chiến lược ở Decline và khi nào dùng Harvest.
      a: 'Maintain, Harvest, Divest, Discontinue. Harvest khi sản phẩm không còn tương lai nhưng vẫn sinh tiền: cắt marketing/chi phí để tối đa hoá đóng góp ngắn hạn.'
  - id: "m09-practice_questions-7"
    title: "Câu hỏi luyện tập: Nhược điểm 'self-fulfilling prophecy' của PLC là gì? Cách phòng tránh?"
    tags: ["câu", "hỏi", "luyện", "tập", "nhược", "điểm", "self", "fulfilling", "prophecy", "của", "plc", "là"]
    text: |-
      q: Nhược điểm 'self-fulfilling prophecy' của PLC là gì? Cách phòng tránh?
      a: 'Tin sản phẩm đang suy thoái nên cắt đầu tư -> gây suy thoái thật. Phòng tránh: chẩn đoán nguyên nhân (cấu trúc hay vận hành), dùng nhiều chỉ số, thử nghiệm kéo dài trước khi cắt.'
  - id: "m09-practice_questions-8"
    title: "Câu hỏi luyện tập: Vì sao iPhone ở Late Maturity mà doanh thu vẫn tăng?"
    tags: ["câu", "hỏi", "luyện", "tập", "vì", "sao", "iphone", "late", "maturity", "mà", "doanh", "thu"]
    text: |-
      q: Vì sao iPhone ở Late Maturity mà doanh thu vẫn tăng?
      a: Unit sales ổn định/giảm nhẹ nhưng ASP tăng (upsell Pro/Pro Max, premium), cộng dịch vụ (Apple One, iCloud) tạo recurring revenue; doanh thu = lượng x ASP.
  - id: "m09-practice_questions-9"
    title: "Câu hỏi luyện tập: Thị trường 50,000 khách tiềm năng. Cần bao nhiêu khách để tới điểm Chasm?"
    tags: ["câu", "hỏi", "luyện", "tập", "thị", "trường", "50", "000", "khách", "tiềm", "năng", "cần"]
    text: |-
      q: Thị trường 50,000 khách tiềm năng. Cần bao nhiêu khách để tới điểm Chasm?
      a: 16% x 50,000 = 8,000 khách (Innovators 1,250 + Early Adopters 6,750).
