  - id: "m09-pitfalls-8"
    title: "Lỗi thường gặp: Ghi chú dữ liệu nguồn: (1) Nguồn nêu 'Grab marketing app Việt khi Uber vào VN' là diễn giải đáng ng…"
    tags: ["lỗi", "thường", "gặp", "ghi", "chú", "dữ", "liệu", "nguồn", "nêu", "grab", "marketing", "app"]
    text: |-
      Ghi chú dữ liệu nguồn: (1) Nguồn nêu 'Grab marketing app Việt khi Uber vào VN' là diễn giải đáng ngờ, Grab là công ty Đông Nam Á (thành lập tại Malaysia, trụ sở Singapore); dùng như minh họa, không dùng làm fact. (2) 'Netflix giảm giá khi mở rộng quốc tế' chưa kiểm chứng. (3) 'Tesla chỉ bán online + showroom chọn lọc' là mô hình direct-to-consumer, ví dụ minh họa. (4) Giá iPhone Gen 1 $499 (4GB, kèm hợp đồng AT&T); nguồn gọi là skimming, còn giá $199 'w/ contract' của 3G là giá trợ giá hợp đồng, so sánh giá hai thời điểm cần cùng điều kiện. (5) Các số India +40% và ASP +15% không có nguồn trích dẫn.
