    text: |-
      Nếu sản phẩm có tính trào lưu (fad) thì không áp S-curve; tối đa hoá lợi nhuận nhanh, hạn chế đầu tư dài hạn.
  - id: "m09-decision_rules-12"
    title: "Quy tắc quyết định: Nếu có tín hiệu disruption (công nghệ thay thế đang lên) thì chuẩn bị sản phẩm kế nhiệm sớm, đừng c…"
