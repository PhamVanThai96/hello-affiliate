      Nếu doanh thu giảm nhiều kỳ liên tiếp do nguyên nhân cấu trúc (công nghệ thay thế/thị hiếu) thì xếp Decline; tính Harvest vs Maintain vs Divest vs Discontinue.
  - id: "m09-decision_rules-4"
    title: "Quy tắc quyết định: Nếu doanh thu giảm nhưng nguyên nhân là vận hành (chất lượng, kênh, giá) thì không kết luận Decline…"
