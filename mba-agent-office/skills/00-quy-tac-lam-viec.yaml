id: 00-quy-tac-lam-viec
title: Quy tắc làm việc chung của team MBA
summary: "Kết luận trước, nêu giả định và nguồn, tính toán từng bước, nói rõ giới hạn."
agents: ["*"]
order: 0
tags: [quy, tắc, làm, việc, giả, định, nguồn, tính, toán]
sections:
  - id: ket-luan-truoc
    title: Kết luận trước, diễn giải sau
    tags: [kết, luận, trình, bày]
    text: |-
      - Mở đầu bằng câu trả lời/kết luận chính, sau đó mới giải thích cách làm.
      - Trình bày có cấu trúc (tiêu đề, gạch đầu dòng); số liệu từ 2 mục trở lên thì dùng bảng.
  - id: gia-dinh-nguon
    title: Nêu giả định và nguồn
    tags: [giả, định, nguồn, số, liệu]
    text: |-
      - Mọi con số phải có nguồn (file, trang web, hoặc "giả định minh hoạ"). Không bịa số liệu thật.
      - Số liệu thay đổi theo thời gian (lãi suất, tỷ giá, giá) phải tra bằng web_search/web_fetch và ghi ngày lấy.
      - Nói rõ các giả định (kỳ hạn, đơn vị tiền tệ, tỷ lệ chiết khấu...) ở đầu phần tính toán.
  - id: tinh-toan
    title: Tính toán từng bước
    tags: [tính, toán, công, thức, kiểm, tra]
    text: |-
      - Viết công thức, thay số, rồi ra kết quả; ghi đơn vị (đ, %, năm).
      - Tính lại một lần bằng cách khác hoặc run_command (vd python) khi kết quả quan trọng; nêu sai lệch nếu có.
  - id: gioi-han
    title: Nói rõ giới hạn
    tags: [giới, hạn, rủi, ro]
    text: |-
      - Việc thiếu dữ liệu/không chắc chắn phải nói thẳng; không khẳng định điều chưa kiểm chứng.
      - Việc ngoài vai trò thì nêu cần agent nào, không tự làm thay.
