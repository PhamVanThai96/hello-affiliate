      LỖI/ĐIỂM YẾU CỦA PROMPT GỐC ĐÃ ĐƯỢC SỬA: (1) hard-code Rf 4,58%, TV 76% STB, 74% SHB, 'trích lập gấp hơn 6 lần' và giá cụ thể 2026 như dữ kiện; nay xem là ví dụ minh họa chưa kiểm chứng, phải tra lại bằng snapshot có ngày; (2) khoảng g 3,0-4,5% mâu thuẫn với phạm vi 2-4,5% giữa mục 3 và Phần 2 và 'g không bao giờ lớn hơn GDP' mà không phân biệt GDP thực và danh nghĩa; nay quy ước g <= tăng trưởng danh nghĩa dài hạn và kiểm tra bằng RR x ROIC; (3) nói 'FCFE hoặc DDM' mà không giải thích khớp dòng tiền - tỷ lệ chiết khấu; nay có quy tắc rõ; (4) chưa nói rõ cầu nối EV sang giá/cổ phiếu, số cổ phiếu pha loãng, thiểu số; (5) Re 13-15% như đáp án cố định cho doanh nghiệp rủi ro; nay chỉ là khoảng tham chiếu, phải tính bằng CAPM; (6) MoS không có công thức; nay có công thức và quy tắc worst-case; (7) bảng độ nhạy chưa nêu RR thay đổi theo g; (8) chưa có bước chuẩn hóa TV và kiểm tra multiple/g ngụ ý.
