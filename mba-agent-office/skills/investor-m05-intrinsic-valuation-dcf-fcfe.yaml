  - id: "m05-case_lessons-1"
    title: "Bài học case: Mô hình hóa doanh nghiệp sản xuất bằng FCFF (minh họa)"
    tags: ["bài", "học", "case", "mô", "hình", "hóa", "doanh", "nghiệp", "sản", "xuất", "bằng", "fcff"]
    text: |-
      name: Mô hình hóa doanh nghiệp sản xuất bằng FCFF (minh họa)
      type: sme
      setup: 'Công ty sản xuất giả định: doanh thu 2.000 tỷ, tăng trưởng giảm dần 10% còn 6%, biên EBIT 12% lên 13%, WACC 10,35%, g 3,5%, ROIC bền vững 15%, nợ ròng 500 tỷ, 100 triệu cổ phiếu.'
      key_calculations:
      - 'FCFF năm 1-5: 148,2; 174,1; 201,7; 219,4; 236,5 (tỷ)'
      - TV = 242,4 / 0,0685 = 3.538,8; PV(TV) = 2.162,7; PV FCFF = 719,9; EV = 2.882,6
      - Giá vốn chủ = 2.382,6 tỷ; giá/cổ phiếu = 23.826 VND; TV% = 75,0%
      lesson: Ngay cả giả định thận trọng vẫn cho TV chiếm 75%; do đó phải có bảng độ nhạy và MoS tại worst-case.
      data_reliability: illustrative
  - id: "m05-case_lessons-2"
    title: "Bài học case: Ngân hàng minh họa: DDM = Residual Income"
    tags: ["bài", "học", "case", "ngân", "hàng", "minh", "họa", "ddm", "residual", "income"]
    text: |-
      name: 'Ngân hàng minh họa: DDM = Residual Income'
      type: sme
      setup: Ngân hàng giả định BVPS 20.000, ROE giảm 17% còn 14% trong 5 năm, payout 20% lên 40%, Re 13,1%, g 5%.
      key_calculations:
      - PV cổ tức 5 năm = 3.906,4; TV = 37.058,9; PV(TV) = 20.025,3; P0 = 23.931,7
      - 'RI: BV0 20.000 + 1.929,2 + 2.001,3 = 23.931,7'
      - P/B = 1,20; TV%/giá = 83,7%
      lesson: Hai phương pháp trùng khi bút toán sạch; ngân hàng cho TV% cao, cần độ nhạy Re x g và kiểm tra ROE dài hạn.
      data_reliability: illustrative
  - id: "m05-case_lessons-3"
    title: "Bài học case: WeWork: dựng tăng trưởng quá mức"
    tags: ["bài", "học", "case", "wework", "dựng", "tăng", "trưởng", "quá", "mức"]
    text: |-
      name: 'WeWork: dựng tăng trưởng quá mức'
      type: failure
      setup: Prompt gốc nhắc WeWork như ví dụ định giá ảo do kịch bản Bull-case tăng trưởng quá cao, và việc nhìn dòng tiền danh nghĩa thô chưa chiết khấu.
      key_calculations:
      - Tăng trưởng 30%/năm trong 10 năm làm doanh thu gấp 1,3^10 ≈ 13,8 lần
      lesson: Giá trị nội tại bị thổi phồng khi tăng trưởng cao kéo dài và biên bất khả thi; kiểm soát bằng TAM, ROIC bền vững, g <= GDP danh nghĩa. Chi tiết số liệu thực của WeWork không được xác minh trong tài liệu này.
      data_reliability: unverified
  - id: "m05-case_lessons-4"
    title: "Bài học case: Ngân hàng trích lập dự phòng mạnh (ví dụ STB, SHB trong prompt gốc)"
    tags: ["bài", "học", "case", "ngân", "hàng", "trích", "lập", "dự", "phòng", "mạnh", "ví", "dụ"]
    text: |-
      name: Ngân hàng trích lập dự phòng mạnh (ví dụ STB, SHB trong prompt gốc)
      type: sme
      setup: Prompt gốc nêu STB đẩy trích lập dự phòng nửa đầu 2026 làm EPS giảm và P/E TTM cao; TV chiếm khoảng 76% STB, 74% SHB.
