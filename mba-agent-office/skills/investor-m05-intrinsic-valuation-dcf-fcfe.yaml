      - Các số 6 lần, 76%, 74% là số của prompt gốc, không xác minh được và không dùng làm dữ kiện
      lesson: 'Bẫy P/E: lợi nhuận bị bóp tạm thời không có nghĩa doanh nghiệp đắt; phải chuẩn hóa EPS và dùng nội tại; TV% cao của ngân hàng là đặc trưng nên cần độ nhạy. Agent phải tra BCTC thực tế.'
      data_reliability: unverified
  - id: "m05-worked_examples-1"
    title: "Ví dụ có lời giải: m05_ex1 — DCF FCFF doanh nghiệp sản xuất (giả định minh họa)"
    tags: ["ví", "dụ", "có", "lời", "giải", "m05_ex1", "dcf", "fcff", "doanh", "nghiệp", "sản", "xuất"]
    text: |-
      id: m05_ex1
      name: DCF FCFF doanh nghiệp sản xuất (giả định minh họa)
      inputs:
        revenue0: 2000
        growth:
        - 0.1
        - 0.09
        - 0.08
        - 0.07
        - 0.06
        ebit_margin:
        - 0.12
        - 0.125
        - 0.13
        - 0.13
        - 0.13
        tax: 0.2
        da_pct: 0.04
        capex_pct: 0.055
        nwc_pct_delta_rev: 0.15
        rf: 0.04
        beta: 1.1
        erp: 0.07
        kd: 0.09
        wd: 0.3
        g: 0.035
        roic: 0.15
        net_debt: 500
        shares_million: 100
      steps:
      - Re = 0,04 + 1,1 x 0,07 = 11,7%; WACC = 0,7 x 11,7% + 0,3 x 9% x 0,8 = 10,35%
      - 'Năm 1: doanh thu 2.200; EBIT 264,0; NOPAT 211,2; D&A 88,0; CAPEX 121,0; ΔNWC 30,0; FCFF 148,2'
      - 'Năm 2: doanh thu 2.398,0; EBIT 299,8; NOPAT 239,8; D&A 95,9; CAPEX 131,9; ΔNWC 29,7; FCFF 174,1'
      - 'Năm 3: doanh thu 2.589,8; EBIT 336,7; NOPAT 269,3; D&A 103,6; CAPEX 142,4; ΔNWC 28,8; FCFF 201,7'
      - 'Năm 4: doanh thu 2.771,1; EBIT 360,2; NOPAT 288,2; D&A 110,8; CAPEX 152,4; ΔNWC 27,2; FCFF 219,4'
      - 'Năm 5: doanh thu 2.937,4; EBIT 381,9; NOPAT 305,5; D&A 117,5; CAPEX 161,6; ΔNWC 24,9; FCFF 236,5'
      - FCFF chuẩn hóa năm 6 = 305,5 x 1,035 x (1 - 0,035/0,15) = 242,4; TV = 242,4/0,0685 = 3.538,8
      - PV FCFF 5 năm = 719,9; PV(TV) = 3.538,8 / 1,1035^5 = 2.162,7; EV = 2.882,6
      - TV share = 75,0%; EV/EBITDA ngụ ý = 3.538,8 / 499,4 = 7,09x
      - Giá vốn chủ = 2.882,6 - 500 = 2.382,6 tỷ; giá/cổ phiếu = 2.382,6e9 / 100e6 = 23.826 VND
      - 'Mid-year (nhân (1+r)^0,5 cho EV): EV = 3.028,1; giá = 25.281 VND (+6,1%)'
      result: Giá nội tại cơ sở 23.826 VND/cổ phiếu (cuối năm) hoặc 25.281 (mid-year); TV chiếm 75%.
  - id: "m05-worked_examples-2"
    title: "Ví dụ có lời giải: m05_ex2 — Ngân hàng: DDM, Residual Income và FCFE cho cùng kết quả (giả định minh họa)"
    tags: ["ví", "dụ", "có", "lời", "giải", "m05_ex2", "ngân", "hàng", "ddm", "residual", "income", "và"]
    text: |-
      id: m05_ex2
      name: 'Ngân hàng: DDM, Residual Income và FCFE cho cùng kết quả (giả định minh họa)'
      inputs:
        bv0: 20000
        roe:
        - 0.17
        - 0.16
        - 0.15
        - 0.145
        - 0.14
        payout:
        - 0.2
        - 0.25
        - 0.3
        - 0.35
        - 0.4
        rf: 0.04
        beta: 1.3
        erp: 0.07
        g: 0.05
        roe_terminal: 0.14
        car_target: 0.11
      steps:
      - Re = 0,04 + 1,3 x 0,07 = 13,1% (không dùng WACC cho ngân hàng)
      - 'Năm 1: BV 20.000, NI 3.400, cổ tức 680, RI = 3.400 - 0,131 x 20.000 = 780, BV cuối 22.720'
      - 'Năm 2: NI 3.635, cổ tức 909, RI 659, BV cuối 25.446'
      - 'Năm 3: NI 3.817, cổ tức 1.145, RI 483, BV cuối 28.118'
      - 'Năm 4: NI 4.077, cổ tức 1.427, RI 394, BV cuối 30.768'
      - 'Năm 5: NI 4.308, cổ tức 1.723, RI 277, BV cuối 33.353'
      - FCFE năm 1 = NI - CAR x ΔRWA, trong đó ΔBV = 2.720 nên ΔRWA = 2.720/0,11 = 24.727 và FCFE = 3.400 - 0,11 x 24.727 = 680 = cổ tức
      - 'Năm 6: payout cuối kỳ = 1 - 0,05/0,14 = 64,3%; D6 = (0,14 - 0,05) x 33.353 = 3.001,8; TV = 3.001,8/0,081 = 37.058,9'
      - 'DDM: PV cổ tức 3.906,4 + PV(TV) 20.025,3 = 23.931,7 VND'
      - 'RI: 20.000 + 1.929,2 + (3.705,9)/1,131^5 = 20.000 + 1.929,2 + 2.002,3 = 23.931,7 (trùng DDM) [TV phần RI = (0,14 - 0,131) x 33.353/0,081 = 3.705,9]'
      - P/B ngụ ý = 23.932 / 20.000 = 1,20; TV% = 20.025/23.932 = 83,7% (vùng cảnh báo)
      result: Giá nội tại ≈ 23.932 VND/cp, P/B 1,20. DDM, FCFE và RI cho cùng kết quả nhờ bút toán sạch; TV chiếm 83,7%.
  - id: "m05-worked_examples-3"
    title: "Ví dụ có lời giải: m05_ex3 — Bảng độ nhạy 5x5, kịch bản và Margin of Safety cho m05_ex1"
    tags: ["ví", "dụ", "có", "lời", "giải", "m05_ex3", "bảng", "độ", "nhạy", "5x5", "kịch", "bản"]
    text: |-
      id: m05_ex3
      name: Bảng độ nhạy 5x5, kịch bản và Margin of Safety cho m05_ex1
      inputs:
        flows:
        - 148.2
        - 174.1
        - 201.7
        - 219.4
        - 236.5
        nopat5: 305.5
        roic: 0.15
        net_debt: 500
        shares_million: 100
        market_price: 18000
      steps:
      - 'Bảng (VND/cp; hàng WACC, cột g = 2,5%, 3,0%, 3,5%, 4,0%, 4,5%):'
      - 'WACC 8,35%: 32.483 | 34.121 | 36.083 | 38.480 | 41.482'
      - 'WACC 9,35%: 26.766 | 27.756 | 28.904 | 30.255 | 31.871'
      - 'WACC 10,35% (gốc): 22.514 | 23.130 | 23.826 | 24.622 | 25.544'
      - 'WACC 11,35%: 19.230 | 19.616 | 20.045 | 20.523 | 21.063'
      - 'WACC 12,35%: 16.619 | 16.859 | 17.121 | 17.407 | 17.722'
      - Worst-case (WACC 12,35%, g 2,5%) = 16.619; Best = 41.482; giá ô trung tâm 23.826
      - 'Kịch bản: xấu (tăng trưởng 6-4%, biên 11%, WACC +1%, g 2,5%) = 13.125 (TV 69,2%); cơ sở 23.826 (75,0%); tốt (tăng trưởng 12-8%, biên 12,5-14%, WACC -0,5%, g 4%) = 32.423 (78,5%)'
      - 'Với giá thị trường minh họa 18.000: MoS cơ sở = (23.826 - 18.000)/23.826 = 24,5%; MoS tại worst-case bảng độ nhạy = (16.619 - 18.000)/16.619 = -8,3%; so với kịch bản xấu 13.125 là -37%'
      result: 'Giá 18.000 chỉ có MoS 24,5% ở kịch bản cơ sở, và âm ở worst-case. Kết luận thận trọng: hợp lý hoặc hơi rẻ, chưa đủ biên an toàn dày; chờ giá thấp hơn khoảng 16.000-17.000 hoặc xác minh thêm giả định.'
  - id: "m05-worked_examples-4"
    title: "Ví dụ có lời giải: m05_ex4 — Tác động của Terminal Value và GIGO"
    tags: ["ví", "dụ", "có", "lời", "giải", "m05_ex4", "tác", "động", "của", "terminal", "value", "và"]
    text: |-
      id: m05_ex4
      name: Tác động của Terminal Value và GIGO
      inputs:
        fcff_next: 100
        r:
        - 0.1
        - 0.11
        - 0.12
        g:
        - 0.025
        - 0.03
        - 0.035
      steps:
      - Giả sử FCFF năm n = 100 và FCFF năm n+1 = 100 x (1+g); TV = FCFF_n x (1+g)/(r - g)
      - TV(r 10%, g 3,0%) = 100 x 1,03 / 0,07 = 1.471,4
      - TV(r 10%, g 3,5%) = 100 x 1,035 / 0,065 = 1.592,3 (+8,2%)
      - TV(r 10%, g 2,5%) = 100 x 1,025 / 0,075 = 1.366,7 (-7,1%)
      - TV(r 11%, g 3,0%) = 100 x 1,03 / 0,08 = 1.287,5 (-12,5%)
      - TV(r 12%, g 3,0%) = 100 x 1,03 / 0,09 = 1.144,4 (-22,2%)
      - TV(r 11%, g 2,5%) = 100 x 1,025 / 0,085 = 1.205,9 (-18,0%)
      - 'GIGO: tăng trưởng 30%/năm 10 năm làm doanh thu từ 2.000 lên 2.000 x 1,3^10 = 27.572 (gấp 13,8 lần); cần thị trường đủ lớn và biên bền vững'
      - 'Chuẩn hóa TV: năm 5 có NOPAT 305,5, g 3,5%: nếu ROIC 15% thì FCFF6 = 242,4; nếu ROIC 8% thì RR = 43,75% và FCFF6 = 177,9; nếu sao chép FCFF5 x 1,035 thì 244,8 (bỏ qua ROIC thấp làm TV phình lên 38% so với ROIC 8%)'
      result: r +1% và g -0,5% cùng lúc làm TV giảm khoảng 18%; r +2% giảm 22%. Tăng trưởng giả định phi thực tế hoặc ROIC không được kiểm tra làm TV sai lệch hai chữ số %.
  - id: "m05-worked_examples-5"
    title: "Ví dụ có lời giải: m05_ex5 — Cầu nối EV sang giá/cổ phiếu và kiểm tra TV exit multiple (giả định minh họa)"
    tags: ["ví", "dụ", "có", "lời", "giải", "m05_ex5", "cầu", "nối", "ev", "sang", "giá", "cổ"]
    text: |-
      id: m05_ex5
      name: Cầu nối EV sang giá/cổ phiếu và kiểm tra TV exit multiple (giả định minh họa)
      inputs:
        ev: 3000
        debt: 800
        cash: 200
        minority: 100
        diluted_shares: 50000000
        ebitda5: 499.357
        multiple: 7.0
        fcff5: 236.5
        wacc: 0.1035
      steps:
      - Giá vốn chủ = 3.000 - 800 + 200 - 100 = 2.300 tỷ; giá = 2.300e9/50e6 = 46.000 VND/cp
      - 'Nếu dùng 55 triệu cổ phiếu pha loãng thay 50 triệu (ESOP, trái phiếu chuyển đổi): giá = 2.300e9/55e6 = 41.818 (-9,1%); dùng cổ phiếu lưu hành sai làm giá thổi phồng'
      - TV exit = 499,357 x 7,0 = 3.495,5; g ngụ ý = (3.495,5 x 0,1035 - 236,5)/(3.495,5 + 236,5) = 3,36%
      - 'So với TV Gordon 3.538,8: chênh 1,2%; hai cách cho cùng kết luận, g ngụ ý 3,36% hợp lý'
      result: 46.000 VND/cp (41.818 nếu có pha loãng 10%); TV exit multiple khớp TV Gordon với g ngụ ý 3,36%.
  - id: "m05-worked_examples-6"
    title: "Ví dụ có lời giải: m05_ex6 — Lỗi chiết khấu sai tỷ lệ: cổ tức ngân hàng bằng WACC thay vì Re"
    tags: ["ví", "dụ", "có", "lời", "giải", "m05_ex6", "lỗi", "chiết", "khấu", "sai", "tỷ", "lệ"]
    text: |-
      id: m05_ex6
      name: 'Lỗi chiết khấu sai tỷ lệ: cổ tức ngân hàng bằng WACC thay vì Re'
      inputs:
        bank_from_ex2: true
        wrong_rate: 0.1035
        correct_re: 0.131
      steps:
      - 'Đúng (Re 13,1%): giá = 23.932 VND'
      - 'Sai (dùng 10,35%): giá = 38.520 VND (+61,0%)'
      - 'Độ nhạy Re x g của DDM ngân hàng: Re 14,1%: g 4% = 20.874, g 5% = 20.855; Re 15,1%: g 4% = 18.568, g 5% = 18.406'
      result: Dùng WACC thay Re làm giá phình 61%; ngay cả tăng Re thêm 2% đã kéo giá từ 23.932 xuống khoảng 18.400-18.600 (khoảng -22 đến -23%).
  - id: "m05-practice_questions-1"
    title: "Câu hỏi luyện tập: Tính Re biết Rf = 4%, beta = 1,2, ERP = 7%. Tính WACC với tỷ trọng nợ 25%, kd = 8%, thuế 20%."
    tags: ["câu", "hỏi", "luyện", "tập", "tính", "re", "biết", "rf", "beta", "erp", "wacc", "với"]
    text: |-
      q: Tính Re biết Rf = 4%, beta = 1,2, ERP = 7%. Tính WACC với tỷ trọng nợ 25%, kd = 8%, thuế 20%.
      a: Re = 0,04 + 1,2 x 0,07 = 12,4%. WACC = 0,75 x 12,4% + 0,25 x 8% x 0,8 = 9,3% + 1,6% = 10,9%.
  - id: "m05-practice_questions-2"
    title: "Câu hỏi luyện tập: FCFF dự phóng năm 6 là 120, WACC 10%, g 3%. Tính TV và PV nếu TV tại cuối năm 5."
    tags: ["câu", "hỏi", "luyện", "tập", "fcff", "dự", "phóng", "năm", "là", "120", "wacc", "10"]
    text: |-
      q: FCFF dự phóng năm 6 là 120, WACC 10%, g 3%. Tính TV và PV nếu TV tại cuối năm 5.
      a: TV = 120/(0,10 - 0,03) = 1.714,3; PV = 1.714,3/1,1^5 = 1.064,4. Nếu 120 là FCFF năm 5 thì F6 = 123,6 và TV = 1.765,7.
  - id: "m05-practice_questions-3"
    title: "Câu hỏi luyện tập: Vì sao không dùng FCFF để định giá ngân hàng?"
    tags: ["câu", "hỏi", "luyện", "tập", "vì", "sao", "không", "dùng", "fcff", "để", "định", "giá"]
    text: |-
      q: Vì sao không dùng FCFF để định giá ngân hàng?
      a: Nợ (tiền gửi) là nguyên liệu kinh doanh, không phải nguồn vốn tách khỏi hoạt động; EBIT, capex, ΔNWC, EV không có nghĩa. Dòng tiền thực cho cổ đông là lợi nhuận sau khi giữ vốn cho CAR và trích lập dự phòng, nên dùng FCFE/DDM/RI chiết khấu Re.
  - id: "m05-practice_questions-4"
    title: "Câu hỏi luyện tập: FCFF năm 1 là 104 và tăng đều 4%/năm mãi mãi, WACC 10%. Tính tổng giá trị, PV 5 năm đầu, PV(TV) và …"
    tags: ["câu", "hỏi", "luyện", "tập", "fcff", "năm", "là", "104", "và", "tăng", "đều", "mãi"]
    text: |-
      q: FCFF năm 1 là 104 và tăng đều 4%/năm mãi mãi, WACC 10%. Tính tổng giá trị, PV 5 năm đầu, PV(TV) và tỷ trọng TV.
      a: V0 = 104/(0,10 - 0,04) = 1.733,3. PV(năm 1-5) = 104 x [1 - (1,04/1,10)^5]/0,06 = 104 x (1 - 0,7501)/0,06 = 433,2. PV(TV) = 1.733,3 - 433,2 = 1.300,1; TV% = 75,0%. Dù dòng tiền tăng đều, TV vẫn chiếm 75% khi (r - g) nhỏ.
  - id: "m05-practice_questions-5"
    title: "Câu hỏi luyện tập: Giá nội tại cơ sở 40.000, worst-case 28.000, giá thị trường 33.000. Tính MoS cơ sở, MoS worst-case,…"
    tags: ["câu", "hỏi", "luyện", "tập", "giá", "nội", "tại", "cơ", "sở", "40", "000", "worst"]
    text: |-
      q: Giá nội tại cơ sở 40.000, worst-case 28.000, giá thị trường 33.000. Tính MoS cơ sở, MoS worst-case, kết luận.
      a: 'MoS cơ sở = (40.000 - 33.000)/40.000 = 17,5%; MoS worst-case = (28.000 - 33.000)/28.000 = -17,9%. Chưa đủ biên an toàn (dưới 25-30%) và worst-case âm: giá vào thận trọng hơn là khoảng 28.000-30.000.'
  - id: "m05-practice_questions-6"
    title: "Câu hỏi luyện tập: Ngân hàng có BVPS 15.000, ROE bền vững 15%, g 5%, Re 13%. P/B hợp lý và giá?"
    tags: ["câu", "hỏi", "luyện", "tập", "ngân", "hàng", "có", "bvps", "15", "000", "roe", "bền"]
    text: |-
      q: Ngân hàng có BVPS 15.000, ROE bền vững 15%, g 5%, Re 13%. P/B hợp lý và giá?
      a: P/B = (0,15 - 0,05)/(0,13 - 0,05) = 1,25; giá = 18.750 VND.
  - id: "m05-practice_questions-7"
    title: "Câu hỏi luyện tập: Một báo cáo định giá dùng WACC 9%, g 6%, FCFF 200 cho một công ty VN; bạn phản biện thế nào?"
    tags: ["câu", "hỏi", "luyện", "tập", "một", "báo", "cáo", "định", "giá", "dùng", "wacc", "fcff"]
    text: |-
      q: Một báo cáo định giá dùng WACC 9%, g 6%, FCFF 200 cho một công ty VN; bạn phản biện thế nào?
      a: g 6% có thể vượt tăng trưởng danh nghĩa dài hạn (cần xác minh, khoảng 2-4,5%); (WACC - g) = 3% làm TV = 200 x 1,06/0,03 = 7.067 (35 lần FCFF) phình rất lớn. Yêu cầu hạ g, kiểm tra RR x ROIC, độ nhạy, và kiểm tra WACC có neo Rf, beta, ERP của thời điểm.
  - id: "m05-practice_questions-8"
    title: "Câu hỏi luyện tập: Tính FCFE ngân hàng: NI 2.000, CAR mục tiêu 12%, RWA đầu kỳ 40.000, tăng 15%."
    tags: ["câu", "hỏi", "luyện", "tập", "tính", "fcfe", "ngân", "hàng", "ni", "000", "car", "mục"]
    text: |-
      q: 'Tính FCFE ngân hàng: NI 2.000, CAR mục tiêu 12%, RWA đầu kỳ 40.000, tăng 15%.'
      a: ΔRWA = 6.000; vốn giữ lại = 0,12 x 6.000 = 720; FCFE = 2.000 - 720 = 1.280 (64% NI).
