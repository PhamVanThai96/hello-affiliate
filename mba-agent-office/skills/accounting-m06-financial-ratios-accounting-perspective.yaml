      Nếu so Gross Margin hoặc Current Ratio giữa hai doanh nghiệp thì kiểm tra chính sách giá xuất kho và phân loại chi phí trước.
  - id: "m06-decision_rules-14"
    title: "Quy tắc quyết định: Nếu doanh nghiệp tăng trưởng nhanh hoặc mùa vụ thì dùng số bình quân hoặc luỹ kế 12 tháng; ghi rõ q…"
