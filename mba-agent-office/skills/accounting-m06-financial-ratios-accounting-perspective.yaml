      - 'BS: TSNH 4.500/5.868; TS 6.500/8.268; nợ ngắn hạn 2.100/3.500; nợ phải trả 3.500/4.700; vốn chủ 3.000/3.568; cân ở cả hai năm. LN chưa phân phối N = 1.000 + 768 - 200 = 1.568; TSCĐ N = 2.000 + 700 - 300 = 2.400.'
      - 'LCTT N: 768 + 300 - 1.100 - 900 + 400 + 100 = CFO -432; CFI -700; CFF = +900 - 200 - 200 = +500; Δ tiền -632; 900 - 632 = 268 khớp.'
      - 'Thanh khoản: CR 2,14 xuống 1,68; QR (tiền + AR)/CL 1,29 xuống 0,91; Cash 0,43 xuống 0,08.'
      - 'Hiệu quả: DIO 41,0 lên 46,5; DSO 36,5 lên 44,1; DPO 26,6 lên 26,8; CCC 51,0 lên 63,8; AT 2,77 lên 2,90.'
      - 'Đòn bẩy: D/E 1,17 lên 1,32; Debt Ratio 53,8% lên 56,8%; ICR 5,0 và 5,0; EM 2,17 lên 2,32.'
      - 'Lợi nhuận: GM 16,0% xuống 15,0%; OM 5,0%; NM 3,2%; ROA 8,9% lên 9,3%; ROE 19,2% lên 21,5%.'
      - 'DuPont 5 N: 0,8 x 0,8 x 5,0% x 2,90 x 2,32 = 21,5%.'
