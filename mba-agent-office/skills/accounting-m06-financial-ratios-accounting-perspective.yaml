  - id: "m06-case_lessons-3"
    title: "Bài học case: Hải Long - nhà phân phối thực phẩm TP.HCM: doanh thu +33%, lãi +33%, tiền cạn"
    tags: ["bài", "học", "case", "hải", "long", "nhà", "phân", "phối", "thực", "phẩm", "tp", "hcm"]
    text: |-
      name: 'Hải Long - nhà phân phối thực phẩm TP.HCM: doanh thu +33%, lãi +33%, tiền cạn'
      type: sme
      setup: 'Giả định (triệu VNĐ, thuế 20%, số cuối kỳ, 365 ngày): doanh thu 18.000 lên 24.000, giá vốn 15.120 lên 20.400, lợi nhuận ròng 576 lên 768. Mở thêm tuyến giao hàng, nới bán chịu. Cuối năm tiền chỉ còn 268, ngân hàng nhắc hạn mức.'
      key_calculations:
      - 'BS cân: N-1 3.500 + 3.000 = 6.500; N 4.700 + 3.568 = 8.268. CFO = 768 + 300 - 1.100 - 900 + 400 + 100 = -432; CFI -700; CFF +500; tiền 900 - 632 = 268.'
      - CR 2,14 xuống 1,68; QR 1,29 xuống 0,91; Cash Ratio 0,43 xuống 0,08; DIO 41,0 lên 46,5; DSO 36,5 lên 44,1; DPO 26,6 lên 26,8; CCC 51,0 lên 63,8.
      - GM 16,0% xuống 15,0%; OM 5,0%; NM 3,2%; ICR 5,0x; D/E 1,17 lên 1,32; ROE 19,2% lên 21,5%.
      - OWC 2.400 lên 4.000 (+1.600); FCF = -432 - 700 = -1.132, bù bằng vay ngắn hạn +900 và dùng 632 tiền.
      - 'Giải phóng: DSO về 36,5 (500) + DIO về 41,0 (307) + DPO lên 35 (456-458) khoảng 1.263-1.265; CCC còn 42,5 ngày.'
      lesson: 'Lãi tăng không bằng tiền tăng: tăng trưởng nuốt vốn lưu động. ROE tăng nhờ vay (EM 2,17 lên 2,32), không nhờ biên. ICR đẹp che mất Cash Ratio gần 0 và vay ngắn hạn tài trợ TSCĐ (sai khớp kỳ hạn). CCC là kim chỉ nam cho phân phối; mỗi ngày bằng một số tiền cụ thể. Kế toán đóng sổ đúng hạn giúp thấy cảnh báo sớm.'
      data_reliability: illustrative
