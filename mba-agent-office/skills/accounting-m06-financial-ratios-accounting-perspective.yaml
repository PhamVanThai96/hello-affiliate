    text: |-
      Nếu DSO tăng nhanh hơn doanh thu hoặc trên 90 ngày thì kiểm tra cut-off, đối chiếu công nợ, dự phòng phải thu khó đòi và chính sách tín dụng.
  - id: "m06-decision_rules-6"
    title: "Quy tắc quyết định: Nếu DIO tăng 30% so cùng kỳ thì kiểm tra SKU chậm, dự phòng giảm giá HTK và chính sách mua."
