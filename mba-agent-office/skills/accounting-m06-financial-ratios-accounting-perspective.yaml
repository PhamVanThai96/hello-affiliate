  - id: "m06-worked_examples-4"
    title: "Ví dụ có lời giải: DSCR: ICR đẹp nhưng gốc nợ lớn"
    tags: ["ví", "dụ", "có", "lời", "giải", "dscr", "icr", "đẹp", "nhưng", "gốc", "nợ", "lớn"]
