      Nếu doanh nghiệp tăng trưởng nhanh hoặc mùa vụ thì dùng số bình quân hoặc luỹ kế 12 tháng; ghi rõ quy ước.
  - id: "m06-decision_rules-15"
    title: "Quy tắc quyết định: Nếu tỷ số cuối năm đẹp bất thường so với quý trước thì nghi window dressing: kiểm tra giao dịch sát…"
    tags: ["quy", "tắc", "quyết", "định", "nếu", "tỷ", "số", "cuối", "năm", "đẹp", "bất", "thường"]
