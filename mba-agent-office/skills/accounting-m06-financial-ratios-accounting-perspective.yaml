  - id: "m06-case_lessons-1"
    title: "Bài học case: Apple - vòng quay vốn lưu động và Current Ratio dưới 1"
    tags: ["bài", "học", "case", "apple", "vòng", "quay", "vốn", "lưu", "động", "và", "current", "ratio"]
    text: |-
      name: Apple - vòng quay vốn lưu động và Current Ratio dưới 1
      type: success
      setup: 'FY2023 xấp xỉ (USD tỷ, cần đối chiếu 10-K): doanh thu 383,3; giá vốn 214,1; lợi nhuận ròng 97,0; TS ngắn hạn 143,6; nợ ngắn hạn 145,3; tổng tài sản 352,6; nợ phải trả 290,4; vốn chủ 62,1; HTK 6,3; phải thu 29,5; phải trả NCC 62,6.'
      key_calculations:
      - Current Ratio = 143,6/145,3 = 0,99 (dưới 1 nhưng nợ ngắn hạn chủ yếu là phải trả NCC 62,6).
      - DIO = 6,3/214,1 x 365 = 10,8; DSO = 29,5/383,3 x 365 = 28,1; DPO = 62,6/214,1 x 365 = 106,7; CCC = -67,9 ngày.
      - NM = 25,3%; AT = 1,087; EM = 5,68; ROE = 156%; D/E = 4,68.
      - Nếu vốn chủ giả định 150 thì ROE = 97/150 = 64,7% vẫn rất cao.
      lesson: Current Ratio dưới 1 không tự động nguy hiểm; CCC âm là đỉnh quản trị vốn lưu động dựa trên sức mạnh đàm phán; ROE cao nhờ mua lại cổ phiếu quỹ làm giảm vốn chủ khác với ROE nhờ vay; phải ghi rõ cuối kỳ/bình quân và định nghĩa D/E. SME học tư duy biến NCC thành nguồn vốn qua DPO hợp lý, không sao chép CCC âm.
      data_reliability: unverified
  - id: "m06-case_lessons-2"
