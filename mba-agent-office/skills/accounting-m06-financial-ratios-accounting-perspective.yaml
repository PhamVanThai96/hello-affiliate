      - 'Lằn 1 = (2.100 - 300)/2.500 = 72,0%; lằn 2 = (700 - 130)/400 = 142,5%; lằn 3 = 130/360 = 0,36: cả ba vi phạm.'
      lesson: Không tỷ số riêng lẻ nào đủ cảnh báo, phải đồng thời xấu cả đòn bẩy, thanh khoản, hiệu quả; ICR dưới 1 nghĩa là vay để trả lãi; đòn bẩy trong ngành chu kỳ khuếch đại hai chiều; tiền nhận trước của khách là nghĩa vụ giao nhà ghi nợ chứ không phải doanh thu; SME tự đặt lằn ranh đỏ.
