  - id: "m06-decision_rules-19"
    title: "Quy tắc quyết định: Nếu D/E được định nghĩa khác nhau giữa các nguồn thì ghi rõ (tổng nợ phải trả/vốn chủ hay nợ vay có…"
    tags: ["quy", "tắc", "quyết", "định", "nếu", "được", "nghĩa", "khác", "nhau", "giữa", "các", "nguồn"]
    text: |-
      Nếu D/E được định nghĩa khác nhau giữa các nguồn thì ghi rõ (tổng nợ phải trả/vốn chủ hay nợ vay có lãi/vốn chủ) trước khi so sánh.
  - id: "m06-decision_rules-20"
    title: "Quy tắc quyết định: Nếu benchmark khác ngành hoặc khác quy mô thì không dùng; nếu không có số ngành thì so với chính mì…"
