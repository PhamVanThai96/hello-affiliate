      Nếu doanh nghiệp thuê nhiều tài sản thì điều chỉnh nợ thuê (IFRS 16) trước khi đánh giá D/E; theo VAS D/E có thể thấp giả.
  - id: "m06-decision_rules-17"
    title: "Quy tắc quyết định: Nếu doanh nghiệp vay ngắn hạn để đầu tư TSCĐ thì cảnh báo sai khớp kỳ hạn, đề xuất chuyển sang vay …"
