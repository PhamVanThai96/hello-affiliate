sections:
  - id: "m06-tong-quan"
    title: "Tổng quan m06"
    tags: ["m06", "tỷ", "số", "tài", "chính", "góc", "nhìn", "kế", "toán", "financial", "ratios", "accounting"]
    text: |-
      Tỷ số tài chính (góc nhìn kế toán) (Financial Ratios (accounting perspective)) — module m06

      Mục đích: Biến BCTC (theo VAS) thành bộ tỷ số Thanh khoản - Hiệu quả - Đòn bẩy - Lợi nhuận kèm DuPont, red flags và quy trình chẩn đoán sức khỏe tài chính. Góc nhìn kế toán: tỷ số nằm ở mã số/tài khoản nào, chính sách kế toán (giá xuất kho, khấu hao, dự phòng, cut-off, phân loại nợ) làm méo tỷ số ra sao, window dressing, quy ước số cuối kỳ/bình quân, nợ ngoài bảng/IFRS 16, Burn Rate/Runway, DSCR. Trả lời: doanh nghiệp có trả được nợ không, tiền đang kẹt ở đâu, ROE cao do biên, vòng quay hay đòn bẩy, số l…

      Dùng khi:
      - Chủ SME/ngân hàng hỏi 'công ty khỏe hay yếu?', 'lãi mà sao hết tiền?', 'có đủ điều kiện vay không?'.
      - Cần tính Current/Quick/Cash Ratio, DIO/DSO/DPO/CCC, D/E, ICR, DSCR, các biên lợi nhuận, ROE/ROA, DuPont 3 và 5.
      - Cần ánh xạ mã số BCTC (B01-DN, B02-DN) và tài khoản TT200 vào từng thành phần tỷ số, hoặc tính EBIT từ mã 50 và 23.
      - So sánh hai doanh nghiệp/hai kỳ nhưng chính sách kế toán khác nhau (FIFO vs bình quân, khấu hao, dự phòng).
      - Nghi ngờ BCTC làm đẹp (window dressing, ghi doanh thu sớm, không trích dự phòng, nợ ngoài bảng).
      - Startup lỗ cần Burn Rate và Runway; SME vay vốn cần DSCR và lịch trả gốc.
      - Lập dashboard tỷ số hằng tháng trên Excel/Google Sheets, đặt cảnh báo xanh-vàng-đỏ.

      Module liên quan: - 'm01 - Kế toán tài chính: nguồn số liệu BCTC, mã số VAS, chính sách kế toán, dự phòng, cut-off' - 'm02 - Kế toán quản trị: số quản trị theo tháng để tính tỷ số nhanh, CVP' - 'm03 - Kế toán giá thành: giá vốn và biên gộp phụ thuộc phân loại chi phí' - 'm04 - Ngân sách và dự báo: dự báo dòng tiền 13 tuần khi CCC kéo dài, runway' - 'm05 - Phân tích chênh lệch: tỷ số trend khi variance lặp lại' - '…

      Công thức (tra chi tiết bằng skill_search("<id>")):
      - m06_ebit_vas: EBIT từ BCTC theo VAS
      - m06_average_balance: Số dư bình quân
      - m06_current_ratio: Tỷ số thanh toán hiện hành
      - m06_quick_ratio: Tỷ số thanh toán nhanh
      - m06_cash_ratio: Tỷ số tiền mặt
      - m06_nwc: Vốn lưu động ròng
      - m06_inventory_turnover_dio: Vòng quay hàng tồn kho và số ngày tồn kho
      - m06_ar_turnover_dso: Vòng quay phải thu và số ngày thu tiền
      - m06_ap_turnover_dpo: Vòng quay phải trả và số ngày trả tiền
      - m06_ccc: Chu kỳ chuyển đổi tiền mặt
      - m06_cash_release: Tiền giải phóng khi rút ngắn CCC
      - m06_asset_turnover: Vòng quay tổng tài sản
      - m06_debt_to_equity: Tỷ số nợ trên vốn chủ
      - m06_debt_ratio: Tỷ số nợ trên tổng tài sản
      - m06_interest_coverage: Khả năng thanh toán lãi vay
      - m06_equity_multiplier: Hệ số vốn chủ sở hữu
      - m06_dscr: Hệ số khả năng trả nợ (gốc và lãi)
      - m06_gross_margin: Biên lợi nhuận gộp
      - m06_operating_margin: Biên lợi nhuận hoạt động
      - m06_ebitda_margin: Biên EBITDA
      - m06_net_margin: Biên lợi nhuận ròng
      - m06_roe: Tỷ suất sinh lời trên vốn chủ
      - m06_roa: Tỷ suất sinh lời trên tài sản
      - m06_burn_runway: Burn Rate và Runway
      - m06_cfo_to_ni: Tỷ lệ dòng tiền hoạt động trên lợi nhuận ròng
      - m06_operating_wc: Vốn lưu động hoạt động
      - m06_revenue_growth: Tăng trưởng và so sánh tốc độ tăng
      - m06_cogs_fifo_wavg: Giá vốn theo FIFO và bình quân gia quyền

      Kho tra cứu của module: Khái niệm 11, Công thức 28, frameworks 11, Quy trình 6, Quy tắc quyết định 22, Chuẩn so sánh 16, Lỗi thường gặp 18, Lưu ý SME Việt Nam 12, Bài học case 4, Ví dụ có lời giải 8, Câu hỏi luyện tập 13, Checklist 18, Mẫu Excel/Sheets 7. Tra bằng skill_search với từ khoá chủ đề (vd "ví dụ định khoản", "lỗi thường gặp khấu hao").
  - id: "m06-concepts-1"
    title: "Khái niệm: Tỷ số tài chính"
    tags: ["khái", "niệm", "tỷ", "số", "tài", "chính"]
    text: |-
      term_vi: Tỷ số tài chính
      term_en: Financial Ratio
      definition: Thương số giữa hai khoản mục BCTC (hoặc cùng khoản mục ở hai kỳ) dùng đánh giá thanh khoản, hiệu quả, đòn bẩy, sinh lời.
      why_it_matters: Số tuyệt đối không có thước đo (lãi 1 tỷ là nhiều hay ít?). Tỷ số chuẩn hóa về cùng thang để so sánh giữa doanh nghiệp, ngành, kỳ. Lịch sử (cần đối chiếu nguồn) - cuối thế kỷ 19 ngân hàng Mỹ đòi bảng cân đối khi cho vay, Current Ratio ngưỡng 2:1 ra đời phục vụ chủ nợ; 1919 Alexander Wall đề xuất dùng hệ nhiều tỷ số thay vì một; thập niên 1910-1920 DuPont (gắn tên Donaldson Brown) tách ROE để quy trách nhiệm từng bộ phận.
  - id: "m06-concepts-2"
    title: "Khái niệm: Tỷ số là đầu ra của hệ thống kế toán"
    tags: ["khái", "niệm", "tỷ", "số", "là", "đầu", "ra", "của", "hệ", "thống", "kế", "toán"]
    text: |-
      term_vi: Tỷ số là đầu ra của hệ thống kế toán
      term_en: Ratios depend on accounting policies
      definition: Chuỗi chứng từ - sổ cái - bảng cân đối phát sinh - BCTC - tỷ số; chính sách kế toán tác động lên mọi khâu.
      why_it_matters: Sổ sai hoặc cắt kỳ sai thì tỷ số sai; hai doanh nghiệp khác chính sách thì tỷ số không so được; BCTC làm đẹp cho tỷ số đẹp vô nghĩa. Agent phải luôn hỏi chính sách kế toán trước khi so sánh.
  - id: "m06-concepts-3"
    title: "Khái niệm: Bốn nhóm tỷ số"
    tags: ["khái", "niệm", "bốn", "nhóm", "tỷ", "số"]
    text: |-
      term_vi: Bốn nhóm tỷ số
      term_en: Liquidity, Efficiency, Leverage, Profitability
      definition: Thanh khoản (trả nợ gần được không), Hiệu quả (vốn quay nhanh không), Đòn bẩy (vay quá mức không), Lợi nhuận (kiếm đủ không).
      why_it_matters: 'Một tỷ số đơn lẻ luôn thiếu: ICR đẹp vẫn có thể cạn tiền. Phải xem đủ 4 nhóm cộng dòng tiền CFO và tìm sự phân kỳ giữa các tỷ số.'
  - id: "m06-concepts-4"
    title: "Khái niệm: Lãi kế toán khác tiền mặt"
    tags: ["khái", "niệm", "lãi", "kế", "toán", "khác", "tiền", "mặt"]
    text: |-
      term_vi: Lãi kế toán khác tiền mặt
      term_en: Profit vs cash
      definition: Lợi nhuận theo dồn tích có thể dương trong khi CFO âm vì phải thu, tồn kho tăng.
      why_it_matters: Doanh nghiệp có lãi vẫn vỡ nợ vì không có tiền trả nợ đúng hạn; nhóm thanh khoản và CCC sinh ra để bắt hiện tượng này.
  - id: "m06-concepts-5"
    title: "Khái niệm: Số dư cuối kỳ và số dư bình quân"
    tags: ["khái", "niệm", "số", "dư", "cuối", "kỳ", "và", "bình", "quân"]
    text: |-
      term_vi: Số dư cuối kỳ và số dư bình quân
      term_en: Ending vs average balances
      definition: Tử số (doanh thu, giá vốn, lợi nhuận) là dòng chảy cả kỳ, mẫu số (AR, HTK, tài sản, vốn chủ) là ảnh chụp một thời điểm. Chuẩn lý thuyết dùng bình quân (đầu kỳ + cuối kỳ)/2.
      why_it_matters: Doanh nghiệp tăng trưởng nhanh thì số cuối kỳ lớn hơn mức bình quân cả năm nên DSO/DIO tính cuối kỳ cao hơn thực tế còn ROE/ROA thấp hơn. Ví dụ Hải Long ROE cuối kỳ 21,5% nhưng bình quân 23,4%. Phải ghi rõ cách tính và nhất quán giữa các kỳ.
  - id: "m06-concepts-6"
    title: "Khái niệm: Quy ước ngày trong năm và chiều tỷ số"
    tags: ["khái", "niệm", "quy", "ước", "ngày", "trong", "năm", "và", "chiều", "tỷ", "số"]
    text: |-
      term_vi: Quy ước ngày trong năm và chiều tỷ số
      term_en: 365 vs 360 days; direction of ratios
      definition: Dùng 365 ngày (một số tài liệu dùng 360), nhất quán giữa kỳ. Lợi nhuận/vòng quay cao thường tốt; đòn bẩy cao thường rủi ro; DSO/DIO/CCC thấp thường tốt.
      why_it_matters: Tránh đọc nhầm chiều và so sánh lệch.
  - id: "m06-concepts-7"
    title: "Khái niệm: Ánh xạ mã số BCTC theo VAS"
    tags: ["khái", "niệm", "ánh", "xạ", "mã", "số", "bctc", "theo", "vas"]
    text: |-
      term_vi: Ánh xạ mã số BCTC theo VAS
      term_en: VAS statement code mapping (TT200)
      definition: B01-DN mã 100 TS ngắn hạn, 110 tiền, 130 phải thu ngắn hạn, 140 HTK, 270 tổng tài sản, 300 nợ phải trả, 310 nợ ngắn hạn, 400 vốn chủ. B02-DN mã 10 doanh thu thuần, 11 giá vốn, 20 lợi nhuận gộp, 22 chi phí tài chính, 23 chi phí lãi vay, 50 LN trước thuế, 60 LN sau thuế. TK tương ứng 511, 632, 635, 131, 151-156, 331, 411, 421.
      why_it_matters: 'Agent mới phải biết lấy đúng dòng từ BCTC thật, không đoán. Mã số và chế độ (TT200 hay TT133 cho DN nhỏ) cần đối chiếu mẫu biểu hiện hành. EBIT không có dòng riêng: EBIT = mã 50 + mã 23 (loại thu nhập/chi phí khác bất thường).'
  - id: "m06-concepts-8"
    title: "Khái niệm: Window dressing (làm đẹp cuối kỳ)"
    tags: ["khái", "niệm", "window", "dressing", "làm", "đẹp", "cuối", "kỳ"]
    text: |-
      term_vi: Window dressing (làm đẹp cuối kỳ)
      term_en: Window dressing
      definition: 'Thao tác sát ngày khóa sổ để tỷ số đẹp: trả bớt nợ ngắn hạn rồi vay lại đầu kỳ sau, tái phân loại nợ ngắn hạn thành dài hạn, đẩy doanh thu sang kỳ này, hoãn chi phí.'
      why_it_matters: Current Ratio 2,0 thành 3,0 chỉ bằng cách dùng 500 tiền trả nợ 500 (CA 2.000-500, CL 1.000-500). Dùng bình quân và xu hướng nhiều kỳ, đọc thuyết minh, kiểm tra cut-off.
  - id: "m06-concepts-9"
    title: "Khái niệm: Nợ ngoài bảng và IFRS 16"
    tags: ["khái", "niệm", "nợ", "ngoài", "bảng", "và", "ifrs", "16"]
    text: |-
      term_vi: Nợ ngoài bảng và IFRS 16
      term_en: Off-balance-sheet debt, IFRS 16 leases
      definition: Thuê dài hạn, bảo lãnh vay cho bên liên quan, cam kết ngoài bảng là nghĩa vụ thực nhưng có thể không nằm trong nợ phải trả. IFRS 16 buộc hầu hết hợp đồng thuê lên bảng (tài sản quyền sử dụng và nợ thuê); VAS ít chặt hơn (cần xác nhận hiện hành).
      why_it_matters: D/E và Debt Ratio theo VAS có thể thấp hơn thực chất với doanh nghiệp thuê nhiều (chuỗi cửa hàng, F&B). Khi so sánh với công ty IFRS hoặc khi ngân hàng thẩm định phải điều chỉnh.
  - id: "m06-concepts-10"
    title: "Khái niệm: Burn Rate và Runway"
    tags: ["khái", "niệm", "burn", "rate", "và", "runway"]
    text: |-
      term_vi: Burn Rate và Runway
      term_en: Burn Rate, Runway
      definition: Burn Rate là tiền mặt tiêu hao ròng mỗi tháng; Runway = tiền mặt hiện có / Burn Rate = số tháng còn sống.
      why_it_matters: Startup lỗ chưa có lợi nhuận để tính ICR/ROE; Current Ratio không nói còn sống được bao lâu. Runway trả lời trực tiếp.
  - id: "m06-concepts-11"
    title: "Khái niệm: Khớp kỳ hạn tài trợ"
    tags: ["khái", "niệm", "khớp", "kỳ", "hạn", "tài", "trợ"]
    text: |-
      term_vi: Khớp kỳ hạn tài trợ
      term_en: Maturity matching
      definition: Tài sản dài hạn phải được tài trợ bằng nguồn dài hạn; vốn lưu động bằng nguồn ngắn hạn/chu kỳ.
      why_it_matters: Vay ngắn hạn để đầu tư TSCĐ (Hải Long) làm Cash Ratio tụt và rủi ro tái tài trợ dù ICR vẫn đẹp.
  - id: "m06-formulas-1"
    title: "Công thức: m06_ebit_vas — EBIT từ BCTC theo VAS"
    tags: ["công", "thức", "m06_ebit_vas", "ebit", "từ", "bctc", "theo", "vas"]
    text: |-
      id: m06_ebit_vas
      name_vi: EBIT từ BCTC theo VAS
      name_en: EBIT from VAS statements
      expression_latex: \text{EBIT} = \text{EBT (mã 50)} + \text{Chi phí lãi vay (mã 23)} - \text{Thu nhập khác bất thường} + \text{Chi phí khác bất thường}
      expression_python: ebt + interest - abnormal_income + abnormal_expense
      excel: =B02_ma50+B02_ma23-ThuNhapBatThuong+ChiPhiBatThuong
      variables:
      - symbol: ebt
        meaning: Lợi nhuận trước thuế (mã 50)
        unit: triệu VNĐ
      - symbol: interest
        meaning: Chi phí lãi vay (mã 23, nằm trong chi phí tài chính mã 22)
        unit: triệu VNĐ
      - symbol: abnormal_income
        meaning: Thu nhập khác bất thường cần loại
        unit: triệu VNĐ
      - symbol: abnormal_expense
        meaning: Chi phí khác bất thường cần cộng lại
        unit: triệu VNĐ
      when_to_use: Mọi lần cần EBIT (ICR, Operating Margin, DuPont 5, EBITDA) vì BCTC VAS không có dòng EBIT riêng.
      why_it_works: Lợi nhuận trước thuế đã trừ lãi vay; cộng lại lãi vay ra lợi nhuận trước cấu trúc vốn và thuế; loại khoản bất thường để EBIT phản ánh hoạt động cốt lõi.
      assumptions:
      - Chi phí lãi vay tách được từ thuyết minh
      - Thu nhập/chi phí khác bất thường xác định được
      pitfalls:
      - Quên loại khoản bất thường làm ICR và Operating Margin sai
      - Lấy mã 22 (chi phí tài chính, gồm cả lỗ tỷ giá, dự phòng đầu tư) thay vì mã 23 (lãi vay)
      interpretation: Là lợi nhuận hoạt động cốt lõi trước lãi vay và thuế.
      example:
        inputs:
          ebt: 960
          interest: 240
          abnormal_income: 0
          abnormal_expense: 0
        steps:
        - 960 + 240 = 1.200 (Hải Long năm N)
        result: EBIT = 1.200 triệu
  - id: "m06-formulas-2"
    title: "Công thức: m06_average_balance — Số dư bình quân"
    tags: ["công", "thức", "m06_average_balance", "số", "dư", "bình", "quân"]
    text: |-
      id: m06_average_balance
      name_vi: Số dư bình quân
      name_en: Average balance
      expression_latex: \bar{B} = \frac{B_{\text{đầu kỳ}} + B_{\text{cuối kỳ}}}{2}
      expression_python: (opening + closing) / 2
      excel: =AVERAGE(DauKy,CuoiKy)
      variables:
      - symbol: opening
        meaning: Số dư đầu kỳ
        unit: triệu VNĐ
      - symbol: closing
        meaning: Số dư cuối kỳ
        unit: triệu VNĐ
      when_to_use: Mẫu số của mọi tỷ số có tử số là dòng chảy (vòng quay, ROE, ROA).
      why_it_works: Tử số tích lũy cả kỳ nên mẫu số cũng nên đại diện cả kỳ; bình quân hai điểm giảm méo khi tăng trưởng nhanh.
      assumptions:
      - Số dư biến động tương đối đều trong kỳ
      pitfalls:
      - 'Doanh nghiệp mùa vụ: bình quân 2 điểm vẫn méo, dùng bình quân 4 quý hoặc 12 tháng'
      - Trộn tỷ số tính cuối kỳ của kỳ này với bình quân của kỳ trước
      interpretation: Ghi rõ trong báo cáo đã dùng bình quân hay cuối kỳ.
      example:
        inputs:
          opening: 1800
          closing: 2900
        steps:
        - (1.800 + 2.900)/2 = 2.350
        result: AR bình quân = 2.350 triệu
  - id: "m06-formulas-3"
    title: "Công thức: m06_current_ratio — Tỷ số thanh toán hiện hành"
    tags: ["công", "thức", "m06_current_ratio", "tỷ", "số", "thanh", "toán", "hiện", "hành"]
    text: |-
      id: m06_current_ratio
      name_vi: Tỷ số thanh toán hiện hành
      name_en: Current Ratio
      expression_latex: \text{CR} = \frac{\text{Tài sản ngắn hạn (mã 100)}}{\text{Nợ ngắn hạn (mã 310)}}
      expression_python: current_assets / current_liabilities
      excel: =B01_ma100/B01_ma310
      variables:
      - symbol: current_assets
        meaning: Tài sản ngắn hạn
        unit: triệu VNĐ
      - symbol: current_liabilities
        meaning: Nợ ngắn hạn
        unit: triệu VNĐ
      when_to_use: Bước đầu đánh giá khả năng trả nợ trong 12 tháng/1 chu kỳ.
      why_it_works: Nếu mọi tài sản ngắn hạn thanh lý đúng giá sổ thì có đủ trả nợ ngắn hạn không. Ngưỡng 2:1 cổ điển là đệm an toàn cho trường hợp tài sản bán không được giá sổ.
      assumptions:
      - Tài sản ngắn hạn chuyển thành tiền đúng giá sổ
      - Nợ ngắn hạn đã phân loại đúng
      pitfalls:
      - Bị window dressing cuối kỳ
      - Phân loại nợ ngắn hạn thành dài hạn làm đẹp
      - Tử số chứa HTK và phải thu có thể khó thu/bán
      - CR dưới 1 không tự động nguy hiểm (Apple 0,99 vì nợ ngắn hạn chủ yếu là phải trả NCC và dòng tiền khổng lồ)
      interpretation: Dưới 1,0 nguy hiểm; 1,0-1,5 cảnh báo; 1,5-3,0 khỏe; trên 3,0 có thể giữ quá nhiều tiền/HTK/phải thu. Đọc cùng Quick Ratio và dòng tiền.
      example:
        inputs:
          current_assets: 5868
          current_liabilities: 3500
        steps:
        - 5.868/3.500 = 1,68 (Hải Long năm N; năm N-1 là 2,14)
        result: CR = 1,68
  - id: "m06-formulas-4"
    title: "Công thức: m06_quick_ratio — Tỷ số thanh toán nhanh"
    tags: ["công", "thức", "m06_quick_ratio", "tỷ", "số", "thanh", "toán", "nhanh"]
    text: |-
      id: m06_quick_ratio
      name_vi: Tỷ số thanh toán nhanh
      name_en: Quick (Acid-Test) Ratio
      expression_latex: \text{QR} = \frac{\text{CA} - \text{Inventory}}{\text{CL}} = \frac{\text{Cash} + \text{ST Investments} + \text{AR}}{\text{CL}}
      expression_python: (current_assets - inventory) / current_liabilities
      excel: =(B01_ma100-B01_ma140)/B01_ma310
      variables:
      - symbol: current_assets
        meaning: Tài sản ngắn hạn
        unit: triệu VNĐ
      - symbol: inventory
        meaning: Hàng tồn kho (mã 140)
        unit: triệu VNĐ
      - symbol: current_liabilities
        meaning: Nợ ngắn hạn
        unit: triệu VNĐ
      when_to_use: Kiểm tra thanh khoản khi không bán thêm được hàng nào; ưu tiên với bán lẻ, phân phối, sản xuất.
      why_it_works: Tên Acid-Test mượn phép thử axit của thợ vàng. Loại HTK vì khó chuyển thành tiền nhất, ghi theo giá gốc chứ không phải giá bán gấp, và là thứ bị đóng băng đầu tiên trong khủng hoảng.
      assumptions:
      - Phải thu thu được gần giá sổ (đã trích dự phòng)
      - Tài sản ngắn hạn khác không đáng kể hoặc đã xử lý nhất quán
      pitfalls:
      - Phải thu quá hạn chưa trích dự phòng làm QR đẹp giả
      - 'Hai biến thể công thức (CA - HTK hay Cash + đầu tư + AR) cho kết quả khác khi có tài sản ngắn hạn khác: ghi rõ dùng biến thể nào'
      interpretation: Dưới 0,5 nguy hiểm; 0,5-1,0 chấp nhận được, hơi tight; 1,0-2,0 tốt; trên 2,0 rất tốt nhưng có thể giữ quá nhiều tiền.
      example:
        inputs:
          current_assets: 5868
          inventory: 2600
          current_liabilities: 3500
        steps:
        - (5.868 - 2.600)/3.500 = 0,934 theo CA - HTK (bằng 0,905 theo (Cash + AR)/CL = 3.168/3.500 vì còn 100 tài sản ngắn hạn khác)
        result: QR = 0,93 (biến thể 1) hoặc 0,91 (biến thể 2)
  - id: "m06-formulas-5"
    title: "Công thức: m06_cash_ratio — Tỷ số tiền mặt"
    tags: ["công", "thức", "m06_cash_ratio", "tỷ", "số", "tiền", "mặt"]
    text: |-
      id: m06_cash_ratio
      name_vi: Tỷ số tiền mặt
      name_en: Cash Ratio
      expression_latex: \text{Cash Ratio} = \frac{\text{Tiền và tương đương tiền (mã 110)}}{\text{Nợ ngắn hạn}}
      expression_python: cash / current_liabilities
      excel: =B01_ma110/B01_ma310
      variables:
      - symbol: cash
        meaning: Tiền và tương đương tiền
        unit: triệu VNĐ
      - symbol: current_liabilities
        meaning: Nợ ngắn hạn
        unit: triệu VNĐ
      when_to_use: 'Phép thử khắt khe nhất: nếu ngày mai chủ nợ đồng loạt đòi thì trả được bao nhiêu phần; ngân hàng quan tâm khi nhiều khoản vay đến hạn cùng lúc.'
      why_it_works: Chỉ tính tiền, loại mọi giả định về thu nợ hay bán hàng.
      assumptions:
      - Tiền không bị phong tỏa hay ký quỹ
      pitfalls:
      - Tiền gửi ký quỹ, tiền bị phong tỏa vẫn nằm trong mã 110
      - Mong đạt bằng 1 là lãng phí vốn
      interpretation: Dưới 0,1 rất mong manh; doanh nghiệp bình thường không cần bằng 1.
      example:
        inputs:
          cash: 268
          current_liabilities: 3500
        steps:
        - 268/3.500 = 0,0766 (năm N-1 là 900/2.100 = 0,43)
        result: Cash Ratio = 0,08
  - id: "m06-formulas-6"
    title: "Công thức: m06_nwc — Vốn lưu động ròng"
    tags: ["công", "thức", "m06_nwc", "vốn", "lưu", "động", "ròng"]
    text: |-
      id: m06_nwc
      name_vi: Vốn lưu động ròng
      name_en: Net Working Capital (balance-sheet basis)
      expression_latex: \text{NWC} = \text{CA} - \text{CL}
      expression_python: current_assets - current_liabilities
      excel: =B01_ma100-B01_ma310
      variables:
      - symbol: current_assets
        meaning: Tài sản ngắn hạn
        unit: triệu VNĐ
      - symbol: current_liabilities
        meaning: Nợ ngắn hạn
        unit: triệu VNĐ
      when_to_use: Xem đệm thanh khoản tuyệt đối; luôn đọc cùng cấu trúc (tiền hay HTK/phải thu).
      why_it_works: Là phần tài sản ngắn hạn còn lại sau khi trả hết nợ ngắn hạn.
      assumptions:
      - Phân loại ngắn hạn/dài hạn đúng
      pitfalls:
      - NWC không đổi nhưng chất lượng xấu đi (tiền giảm, phải thu/HTK tăng, vay ngắn hạn tăng) - Hải Long N-1 2.400 và N 2.368
      interpretation: Dương là có đệm; đọc cơ cấu bên trong chứ không chỉ con số.
      example:
        inputs:
          current_assets: 5868
          current_liabilities: 3500
        steps:
        - 5.868 - 3.500 = 2.368
        result: NWC = 2.368 triệu (N-1 là 2.400)
  - id: "m06-formulas-7"
    title: "Công thức: m06_inventory_turnover_dio — Vòng quay hàng tồn kho và số ngày tồn kho"
    tags: ["công", "thức", "m06_inventory_turnover_dio", "vòng", "quay", "hàng", "tồn", "kho", "và", "số", "ngày"]
    text: |-
      id: m06_inventory_turnover_dio
      name_vi: Vòng quay hàng tồn kho và số ngày tồn kho
      name_en: Inventory Turnover and DIO
      expression_latex: \text{Turnover} = \frac{\text{COGS}}{\text{Avg Inventory}},\quad \text{DIO} = \frac{365}{\text{Turnover}}
      expression_python: 365 / (cogs / avg_inventory)
      excel: =365/(GiaVon/HTKBinhQuan)
      variables:
      - symbol: cogs
        meaning: Giá vốn hàng bán (mã 11, TK 632)
        unit: triệu VNĐ/năm
      - symbol: avg_inventory
        meaning: Hàng tồn kho bình quân (mã 140)
        unit: triệu VNĐ
      when_to_use: Đánh giá hàng nằm kho bao lâu; phát hiện tồn kho ứ đọng.
      why_it_works: Dùng COGS vì HTK ghi theo giá vốn; chia doanh thu (chứa lãi) cho HTK so hai thứ khác thước đo và thổi phồng vòng quay theo biên lợi nhuận. 365/vòng quay đổi sang ngày để dễ hình dung và cộng trừ trong CCC.
      assumptions:
      - Giá xuất kho nhất quán
      - Đã trích dự phòng giảm giá HTK (TK 2294)
      pitfalls:
      - FIFO hay bình quân làm giá vốn và HTK khác nhau
      - Không trích dự phòng HTK chậm luân chuyển làm DIO và lợi nhuận đẹp giả
      - Dùng doanh thu thay COGS
      - Số cuối kỳ khi mùa vụ
      interpretation: 'Đọc theo ngành: FMCG 8-12 vòng (30-45 ngày), thời trang 4-6 (60-90), điện tử 6-10 (35-60), nội thất 2-4 (90-180), xây dựng 1-3 (120-365). Tăng +30% so cùng kỳ là cờ vàng.'
      example:
        inputs:
          cogs: 2000
          avg_inventory: 400
        steps:
        - Vòng quay = 2.000/400 = 5,0 lần
        - DIO = 365/5 = 73 ngày
        result: DIO = 73 ngày (thời trang chấp nhận được, FMCG quá chậm)
  - id: "m06-formulas-8"
    title: "Công thức: m06_ar_turnover_dso — Vòng quay phải thu và số ngày thu tiền"
    tags: ["công", "thức", "m06_ar_turnover_dso", "vòng", "quay", "phải", "thu", "và", "số", "ngày", "tiền"]
    text: |-
      id: m06_ar_turnover_dso
      name_vi: Vòng quay phải thu và số ngày thu tiền
      name_en: AR Turnover and DSO
      expression_latex: \text{DSO} = \frac{365}{\text{Net Credit Sales}/\text{Avg AR}} = \frac{\text{Avg AR}}{\text{Net Credit Sales}}\times 365
      expression_python: avg_ar / credit_sales * 365
      excel: =PhaiThuBinhQuan/DoanhThuBanChiu*365
      variables:
      - symbol: avg_ar
        meaning: Phải thu khách hàng bình quân (TK 131)
        unit: triệu VNĐ
      - symbol: credit_sales
        meaning: Doanh thu bán chịu thuần (nếu không tách được dùng doanh thu thuần mã 10)
        unit: triệu VNĐ/năm
      when_to_use: Đo bán xong bao lâu thì thu tiền; so với điều khoản bán hàng.
      why_it_works: AR là doanh thu chưa thu; AR/doanh thu một ngày cho số ngày doanh thu còn nằm trong công nợ.
      assumptions:
      - Doanh thu đều trong năm
      - 'Doanh thu chịu thuế GTGT: AR gồm VAT nên đồng nhất tử và mẫu hoặc ghi chú'
      pitfalls:
      - Dùng cả doanh thu thu tiền ngay làm DSO thấp hơn thực tế
      - AR quá hạn không trích dự phòng (TK 2293) làm đẹp giả
      - AR gồm VAT còn doanh thu thuần chưa gồm VAT làm DSO cao hơn khoảng 8-10%
      - 'DSO tăng nhanh hơn doanh thu: nới bán chịu hoặc ghi doanh thu sớm'
      interpretation: Dưới 30 xuất sắc; 30-45 tốt; 45-60 trung bình; 60-90 cần cải thiện; trên 90 nguy hiểm. Luôn so với hạn thanh toán cho khách (hạn 30 ngày mà DSO 45 tức trả chậm trung bình 15 ngày).
      example:
        inputs:
          avg_ar: 2900
          credit_sales: 24000
        steps:
        - 2.900/24.000 x 365 = 44,1 ngày (dùng cuối kỳ; N-1 là 36,5)
        result: DSO = 44,1 ngày
  - id: "m06-formulas-9"
    title: "Công thức: m06_ap_turnover_dpo — Vòng quay phải trả và số ngày trả tiền"
    tags: ["công", "thức", "m06_ap_turnover_dpo", "vòng", "quay", "phải", "trả", "và", "số", "ngày", "tiền"]
    text: |-
      id: m06_ap_turnover_dpo
      name_vi: Vòng quay phải trả và số ngày trả tiền
      name_en: AP Turnover and DPO
      expression_latex: \text{DPO} = \frac{\text{Avg AP}}{\text{COGS (hoặc Purchases)}}\times 365
      expression_python: avg_ap / purchases_or_cogs * 365
      excel: =PhaiTraBinhQuan/GiaVon*365
      variables:
      - symbol: avg_ap
        meaning: Phải trả nhà cung cấp bình quân (TK 331)
        unit: triệu VNĐ
      - symbol: purchases_or_cogs
        meaning: Giá trị mua vào; xấp xỉ bằng giá vốn nếu tồn kho ổn định
        unit: triệu VNĐ/năm
      when_to_use: Đo số ngày giữ tiền của nhà cung cấp (nguồn vốn lưu động miễn phí).
      why_it_works: AP phát sinh từ mua hàng nên tử số lý tưởng là Purchases; COGS là xấp xỉ.
      assumptions:
      - Tồn kho ổn định nếu dùng COGS thay Purchases
      pitfalls:
      - Kéo DPO vượt điều khoản làm mất uy tín, bị siết hàng, mất chiết khấu thanh toán sớm
      - Khi tồn kho tăng mạnh dùng COGS làm DPO sai lệch
      interpretation: DPO cao tốt cho dòng tiền nếu trong điều khoản; phải so điều khoản NCC.
      example:
        inputs:
          avg_ap: 1500
          purchases_or_cogs: 20400
        steps:
        - 1.500/20.400 x 365 = 26,8 ngày
        result: DPO = 26,8 ngày
  - id: "m06-formulas-10"
    title: "Công thức: m06_ccc — Chu kỳ chuyển đổi tiền mặt"
    tags: ["công", "thức", "m06_ccc", "chu", "kỳ", "chuyển", "đổi", "tiền", "mặt"]
    text: |-
      id: m06_ccc
      name_vi: Chu kỳ chuyển đổi tiền mặt
      name_en: Cash Conversion Cycle
      expression_latex: \text{CCC} = \text{DIO} + \text{DSO} - \text{DPO}
      expression_python: dio + dso - dpo
      excel: =DIO+DSO-DPO
      variables:
      - symbol: dio
        meaning: Số ngày tồn kho
        unit: ngày
      - symbol: dso
        meaning: Số ngày thu tiền
        unit: ngày
      - symbol: dpo
        meaning: Số ngày trả tiền
        unit: ngày
      when_to_use: Doanh nghiệp phân phối/bán lẻ/sản xuất; quy đổi sang số tiền cần tài trợ hoặc giải phóng được.
      why_it_works: 'Đi theo một đồng vốn: hàng nằm kho DIO ngày, bán chịu chờ DSO ngày thì tiền bị kẹt DIO + DSO, nhưng trong thời gian đó chưa phải trả NCC DPO ngày (NCC tài trợ) nên trừ đi. Phần còn lại là số ngày doanh nghiệp tự tìm vốn.'
      assumptions:
      - Ba thành phần tính cùng quy ước (cuối kỳ hoặc bình quân, 365 ngày)
      - Giá vốn làm cơ sở cho DIO và DPO, doanh thu cho DSO
      pitfalls:
      - CCC âm kiểu Apple/Dell dựa trên sức mạnh đàm phán, SME không sao chép máy móc
      - 'Cộng ngày tính trên cơ sở khác nhau (doanh thu vs giá vốn) khi quy đổi tiền: dùng giá vốn/ngày cho DIO, DPO và doanh thu/ngày cho DSO'
      interpretation: Âm là tuyệt vời; 0-30 rất tốt; 30-60 bình thường; 60-90 cần tối ưu; trên 90 vốn lưu động bị đóng băng. Xu hướng tăng khi doanh thu tăng là dấu hiệu tăng trưởng đốt tiền.
      example:
        inputs:
          dio: 46.5196
          dso: 44.1042
          dpo: 26.8382
        steps:
        - 46,5 + 44,1 - 26,8 = 63,8 ngày (N-1 là 51,0; tăng 12,8 ngày)
        result: CCC = 63,8 ngày
  - id: "m06-formulas-11"
    title: "Công thức: m06_cash_release — Tiền giải phóng khi rút ngắn CCC"
    tags: ["công", "thức", "m06_cash_release", "tiền", "giải", "phóng", "khi", "rút", "ngắn", "ccc"]
    text: |-
      id: m06_cash_release
      name_vi: Tiền giải phóng khi rút ngắn CCC
      name_en: Cash released by days saved
      expression_latex: \Delta\text{Cash} = \Delta\text{DSO}\times\frac{\text{Revenue}}{365} + \Delta\text{DIO}\times\frac{\text{COGS}}{365} + \Delta\text{DPO}\times\frac{\text{COGS}}{365}
      expression_python: d_dso * revenue / 365 + d_dio * cogs / 365 + d_dpo * cogs / 365
      excel: =dDSO*DoanhThu/365+dDIO*GiaVon/365+dDPO*GiaVon/365
      variables:
      - symbol: d_dso
        meaning: Số ngày DSO giảm
        unit: ngày
      - symbol: d_dio
        meaning: Số ngày DIO giảm
        unit: ngày
      - symbol: d_dpo
        meaning: Số ngày DPO tăng
        unit: ngày
      - symbol: revenue
        meaning: Doanh thu thuần năm
        unit: triệu VNĐ
      - symbol: cogs
        meaning: Giá vốn năm
        unit: triệu VNĐ
      when_to_use: 'Biến tỷ số thành quyết định tiền thật: mỗi ngày CCC = một lượng tiền cụ thể.'
      why_it_works: Một ngày DSO bằng doanh thu bình quân một ngày nằm trong công nợ; một ngày DIO/DPO bằng giá vốn một ngày.
      assumptions:
      - Doanh thu và giá vốn đều trong năm
      - Giữ nguyên quy mô hoạt động
      pitfalls:
      - Dùng doanh thu cho cả DIO/DPO làm số tiền chênh vài phần trăm
      - 'Giả định thu hồi nợ dễ dàng: cần kiểm tra khách hàng và điều khoản'
      interpretation: Số tiền ước tính giải phóng, dùng trả bớt vay ngắn hạn hoặc khôi phục đệm tiền.
      example:
        inputs:
          d_dso: 7.6042
          d_dio: 5.4812
          d_dpo: 8.1618
          revenue: 24000
          cogs: 20400
        steps:
        - 'DSO: 65,75 x 7,60 = 500'
        - 'DIO: 55,89 x 5,48 = 307'
        - 'DPO (35 - 26,84 = 8,16): 55,89 x 8,16 = 456'
        - Tổng khoảng 1.263 (nguồn làm tròn ngày ra 1.262-1.265)
        result: Khoảng 1.263 triệu giải phóng, CCC còn 42,5 ngày
  - id: "m06-formulas-12"
    title: "Công thức: m06_asset_turnover — Vòng quay tổng tài sản"
    tags: ["công", "thức", "m06_asset_turnover", "vòng", "quay", "tổng", "tài", "sản"]
    text: |-
      id: m06_asset_turnover
      name_vi: Vòng quay tổng tài sản
      name_en: Total Asset Turnover
      expression_latex: \text{AT} = \frac{\text{Revenue}}{\text{Avg Total Assets (mã 270)}}
      expression_python: revenue / avg_total_assets
      excel: =DoanhThu/TongTaiSanBinhQuan
      variables:
      - symbol: revenue
        meaning: Doanh thu thuần (mã 10)
        unit: triệu VNĐ
      - symbol: avg_total_assets
        meaning: Tổng tài sản bình quân
        unit: triệu VNĐ
      when_to_use: Mỗi đồng tài sản tạo bao nhiêu đồng doanh thu; trụ cột thứ hai của DuPont.
      why_it_works: Tài sản là vốn đã bỏ ra; doanh thu là sản phẩm của tài sản.
      assumptions:
      - Tài sản phản ánh đúng quy mô hoạt động
      pitfalls:
      - 'Tài sản ghi giá gốc trừ khấu hao: tài sản cũ đã khấu hao nhiều làm AT cao giả tạo so với công ty đầu tư mới'
      - Tài sản thuê ngoài bảng làm AT cao giả
      interpretation: Bán lẻ 2-3; FMCG 1-2; sản xuất nặng 0,3-0,8; tech/SaaS 0,5-1,0; bất động sản 0,1-0,3.
      example:
        inputs:
          revenue: 24000
          avg_total_assets: 8268
        steps:
        - 24.000/8.268 = 2,90 (cuối kỳ);
        result: AT = 2,90 (cuối kỳ)
  - id: "m06-formulas-13"
    title: "Công thức: m06_debt_to_equity — Tỷ số nợ trên vốn chủ"
    tags: ["công", "thức", "m06_debt_to_equity", "tỷ", "số", "nợ", "trên", "vốn", "chủ"]
    text: |-
      id: m06_debt_to_equity
      name_vi: Tỷ số nợ trên vốn chủ
      name_en: Debt-to-Equity (D/E)
      expression_latex: \text{D/E} = \frac{\text{Nợ phải trả (mã 300)}}{\text{Vốn chủ sở hữu (mã 400)}}
      expression_python: total_liabilities / equity
      excel: =B01_ma300/B01_ma400
      variables:
      - symbol: total_liabilities
        meaning: Tổng nợ phải trả
        unit: triệu VNĐ
      - symbol: equity
        meaning: Vốn chủ sở hữu
        unit: triệu VNĐ
      when_to_use: Đo đệm vốn chủ bảo vệ chủ nợ; ngân hàng thẩm định vay.
      why_it_works: 'So tiền của người ngoài với tiền của chủ: D/E = 1 nghĩa là 1 đồng vốn chủ đệm cho 1 đồng nợ.'
      assumptions:
      - 'Ghi rõ định nghĩa: tổng nợ phải trả/vốn chủ (dùng ở đây) hay chỉ nợ vay có lãi/vốn chủ'
      pitfalls:
      - Hai định nghĩa cho kết quả rất khác (Apple 4,67 theo tổng nợ so với khoảng 2 theo nợ vay)
      - Nợ ngoài bảng và thuê dài hạn làm D/E thấp giả
      - Vốn chủ thấp do lỗ lũy kế hay mua lại cổ phiếu
      interpretation: 'Dưới 0,5 bảo thủ; 0,5-1,5 cân bằng; 1,5-3,0 aggressive; trên 3,0 nguy hiểm. Ngành: utilities 1,5-3; BĐS 2-5; tech 0-0,5; bán lẻ 0,5-1,5; ngân hàng 8-15.'
      example:
        inputs:
          total_liabilities: 4700
          equity: 3568
        steps:
        - 4.700/3.568 = 1,317 (N-1 là 3.500/3.000 = 1,167)
        result: D/E = 1,32
  - id: "m06-formulas-14"
    title: "Công thức: m06_debt_ratio — Tỷ số nợ trên tổng tài sản"
    tags: ["công", "thức", "m06_debt_ratio", "tỷ", "số", "nợ", "trên", "tổng", "tài", "sản"]
    text: |-
      id: m06_debt_ratio
      name_vi: Tỷ số nợ trên tổng tài sản
      name_en: Debt Ratio
      expression_latex: \text{Debt Ratio} = \frac{\text{TL}}{\text{TA}} = 1 - \text{Equity Ratio};\quad \text{D/E} = \frac{\text{DR}}{1-\text{DR}}
      expression_python: total_liabilities / total_assets
      excel: =B01_ma300/B01_ma270
      variables:
      - symbol: total_liabilities
        meaning: Tổng nợ phải trả
        unit: triệu VNĐ
      - symbol: total_assets
        meaning: Tổng tài sản
        unit: triệu VNĐ
      when_to_use: Cùng thông tin D/E nhưng ở dạng phần trăm tài sản tài trợ bằng nợ, dễ hiểu cho người không quen D/E.
      why_it_works: Tài sản = Nợ + Vốn chủ nên DR và D/E là hai cách biểu diễn cùng một cơ cấu.
      assumptions:
      - Bảng cân đối đã cân
      pitfalls:
      - Quên nợ ngoài bảng
      - Nhầm DR 56,85% với D/E
      interpretation: 'Trên 50% là tài sản chủ yếu tài trợ bằng nợ. Chuyển đổi: DR 56,85% tương ứng D/E 1,32.'
      example:
        inputs:
          total_liabilities: 4700
          total_assets: 8268
        steps:
        - 4.700/8.268 = 56,85%
        - D/E = 0,5685/0,4315 = 1,32
        result: Debt Ratio = 56,8%
  - id: "m06-formulas-15"
    title: "Công thức: m06_interest_coverage — Khả năng thanh toán lãi vay"
    tags: ["công", "thức", "m06_interest_coverage", "khả", "năng", "thanh", "toán", "lãi", "vay"]
    text: |-
      id: m06_interest_coverage
      name_vi: Khả năng thanh toán lãi vay
      name_en: Interest Coverage Ratio (ICR)
      expression_latex: \text{ICR} = \frac{\text{EBIT}}{\text{Chi phí lãi vay}}
      expression_python: ebit / interest_expense
      excel: =EBIT/ChiPhiLaiVay
      variables:
      - symbol: ebit
        meaning: Lợi nhuận trước lãi vay và thuế
        unit: triệu VNĐ
      - symbol: interest_expense
        meaning: Chi phí lãi vay (mã 23)
        unit: triệu VNĐ
      when_to_use: Ngân hàng/chủ nợ đánh giá đệm lợi nhuận trả lãi; kiểm tra độ nhạy khi EBIT giảm.
      why_it_works: Lãi vay trả từ lợi nhuận trước lãi và thuế (chi phí được trừ trước thuế), nên mẫu số là EBIT chứ không phải lợi nhuận ròng. ICR = 5 thì EBIT có thể giảm 80% mà vẫn đủ trả lãi.
      assumptions:
      - EBIT ổn định, không bất thường
      - Lãi vay đã gồm lãi vốn hóa nếu có
      pitfalls:
      - 'Chỉ xét lãi, không xét gốc: ICR 5,0x vẫn vỡ nợ nếu gốc đến hạn lớn (cần DSCR)'
      - ICR dưới 1 nghĩa là phải vay mới để trả lãi cũ
      - Lãi vốn hóa vào tài sản không nằm trong chi phí lãi vay
      interpretation: Dưới 1,0 rất nguy; 1,0-1,5 nguy hiểm; 1,5-3,0 chấp nhận cẩn thận; 3,0-6,0 tốt; trên 6,0 rất tốt hoặc ít nợ.
      example:
        inputs:
          ebit: 600
          interest_expense: 400
        steps:
        - 600/400 = 1,5
        - 'EBIT giảm 30% còn 420: 420/400 = 1,05 (gần như không đủ trả lãi)'
        result: ICR = 1,5 và 1,05 sau cú sốc
  - id: "m06-formulas-16"
    title: "Công thức: m06_equity_multiplier — Hệ số vốn chủ sở hữu"
    tags: ["công", "thức", "m06_equity_multiplier", "hệ", "số", "vốn", "chủ", "sở", "hữu"]
    text: |-
      id: m06_equity_multiplier
      name_vi: Hệ số vốn chủ sở hữu
      name_en: Equity Multiplier
      expression_latex: \text{EM} = \frac{\text{TA}}{\text{Equity}} = 1 + \text{D/E}
      expression_python: total_assets / equity
      excel: =B01_ma270/B01_ma400
      variables:
      - symbol: total_assets
        meaning: Tổng tài sản
        unit: triệu VNĐ
      - symbol: equity
        meaning: Vốn chủ sở hữu
        unit: triệu VNĐ
      when_to_use: Thành phần đòn bẩy trong DuPont; mỗi đồng vốn chủ chống đỡ bao nhiêu đồng tài sản.
      why_it_works: 'Chứng minh: TA = TL + Equity nên TA/Equity = TL/Equity + 1.'
      assumptions:
      - Bảng cân đối cân
      pitfalls:
      - EM tăng nhờ lỗ lũy kế hay mua lại cổ phiếu chứ không do kinh doanh
      interpretation: EM cao khuếch đại cả lãi lẫn lỗ; luôn đọc cùng ICR và Cash Ratio.
      example:
        inputs:
          total_assets: 8268
          equity: 3568
        steps:
        - 8.268/3.568 = 2,317 = 1 + 1,317
        result: EM = 2,32
  - id: "m06-formulas-17"
    title: "Công thức: m06_dscr — Hệ số khả năng trả nợ (gốc và lãi)"
    tags: ["công", "thức", "m06_dscr", "hệ", "số", "khả", "năng", "trả", "nợ", "gốc", "và", "lãi"]
    text: |-
      id: m06_dscr
      name_vi: Hệ số khả năng trả nợ (gốc và lãi)
      name_en: Debt Service Coverage Ratio (DSCR)
      expression_latex: \text{DSCR} = \frac{\text{EBITDA} - \text{Thuế TNDN} - \text{Capex duy trì}}{\text{Gốc phải trả trong kỳ} + \text{Lãi phải trả trong kỳ}}
      expression_python: (ebitda - tax - maintenance_capex) / (principal + interest)
      excel: =(EBITDA-Thue-CapexDuyTri)/(Goc+Lai)
      variables:
      - symbol: ebitda
        meaning: EBIT + khấu hao
        unit: triệu VNĐ
      - symbol: tax
        meaning: Thuế TNDN đã nộp
        unit: triệu VNĐ
      - symbol: maintenance_capex
        meaning: Chi đầu tư duy trì năng lực
        unit: triệu VNĐ
      - symbol: principal
        meaning: Gốc nợ phải trả trong kỳ
        unit: triệu VNĐ
      - symbol: interest
        meaning: Lãi vay phải trả trong kỳ
        unit: triệu VNĐ
      when_to_use: Thẩm định vay và rà soát SME có lịch trả gốc lớn; bổ sung cho ICR chỉ xét lãi.
      why_it_works: Vỡ nợ xảy ra vì không đủ tiền trả gốc và lãi đúng hạn chứ không phải vì lợi nhuận kế toán thấp. Tử số là dòng tiền khả dụng sau thuế và duy trì tài sản; mẫu số là tổng nghĩa vụ trả nợ.
      assumptions:
      - 'Định nghĩa tử số khác nhau giữa ngân hàng: ghi rõ dùng định nghĩa nào'
      - Lịch trả gốc lấy từ hợp đồng vay
      pitfalls:
      - Dùng EBITDA thô bỏ qua thuế và capex duy trì làm DSCR cao giả
      - Quên khoản vay ngắn hạn đáo hạn một lần (bullet) cần tái tài trợ
      - Coi vay ngắn hạn được đảo nợ luôn là chắc chắn
      interpretation: Dưới 1,0 không đủ trả nợ từ dòng tiền; ngân hàng thường yêu cầu khoảng 1,2-1,5 trở lên (ngưỡng thực hành, confidence medium, cần xác nhận với từng ngân hàng).
      example:
        inputs:
          ebitda: 1500
          tax: 192
          maintenance_capex: 300
          principal: 400
          interest: 240
        steps:
        - Tử số = 1.500 - 192 - 300 = 1.008
        - Mẫu số = 400 + 240 = 640
        - 1.008/640 = 1,575
        result: DSCR = 1,58 (giả định gốc phải trả 400)
  - id: "m06-formulas-18"
    title: "Công thức: m06_gross_margin — Biên lợi nhuận gộp"
    tags: ["công", "thức", "m06_gross_margin", "biên", "lợi", "nhuận", "gộp"]
    text: |-
      id: m06_gross_margin
      name_vi: Biên lợi nhuận gộp
      name_en: Gross Margin
      expression_latex: \text{GM} = \frac{\text{Revenue} - \text{COGS}}{\text{Revenue}}\times 100\%
      expression_python: (revenue - cogs) / revenue
      excel: =(B02_ma10-B02_ma11)/B02_ma10
      variables:
      - symbol: revenue
        meaning: Doanh thu thuần
        unit: triệu VNĐ
      - symbol: cogs
        meaning: Giá vốn hàng bán
        unit: triệu VNĐ
      when_to_use: Đo sức mạnh định giá và hiệu quả mua hàng/sản xuất.
      why_it_works: Phần doanh thu còn lại sau chi phí trực tiếp tạo ra hàng bán; giảm tức giá bán giảm hoặc giá vốn tăng nhanh hơn.
      assumptions:
      - Phân loại chi phí giá vốn (TK 632) và bán hàng (TK 641) nhất quán
      - Giá xuất kho nhất quán
      pitfalls:
      - Cùng khoản (lương đầu bếp) xếp giá vốn hay QLDN làm GM khác mà lãi ròng không đổi
      - FIFO vs bình quân khi giá thay đổi lệch GM vài điểm phần trăm
      interpretation: SaaS 70-90%; dược 60-80%; thời trang 50-65%; F&B 60-70%; bán lẻ 25-40%; phân phối tiêu dùng 10-20%; xây dựng 10-20%. Giảm 5 điểm YoY là cờ vàng.
      example:
        inputs:
          revenue: 24000
          cogs: 20400
        steps:
        - (24.000 - 20.400)/24.000 = 15,0% (N-1 là 16,0%)
        result: GM = 15,0%
  - id: "m06-formulas-19"
    title: "Công thức: m06_operating_margin — Biên lợi nhuận hoạt động"
    tags: ["công", "thức", "m06_operating_margin", "biên", "lợi", "nhuận", "hoạt", "động"]
    text: |-
      id: m06_operating_margin
      name_vi: Biên lợi nhuận hoạt động
      name_en: Operating Margin
      expression_latex: \text{OM} = \frac{\text{EBIT}}{\text{Revenue}}
      expression_python: ebit / revenue
      excel: =EBIT/DoanhThuThuan
      variables:
      - symbol: ebit
        meaning: Lợi nhuận trước lãi vay và thuế
        unit: triệu VNĐ
      - symbol: revenue
        meaning: Doanh thu thuần
        unit: triệu VNĐ
      when_to_use: So hiệu quả cốt lõi giữa hai doanh nghiệp vay nợ khác nhau.
      why_it_works: Trước lãi vay và thuế nên không phụ thuộc cấu trúc vốn.
      assumptions:
      - EBIT đã loại khoản bất thường
      pitfalls:
      - Chính sách khấu hao khác nhau làm EBIT khác
      interpretation: So cùng ngành và xu hướng.
      example:
        inputs:
          ebit: 1200
          revenue: 24000
        steps:
        - 1.200/24.000 = 5,0%
        result: Operating Margin = 5,0%
  - id: "m06-formulas-20"
    title: "Công thức: m06_ebitda_margin — Biên EBITDA"
    tags: ["công", "thức", "m06_ebitda_margin", "biên", "ebitda"]
    text: |-
      id: m06_ebitda_margin
      name_vi: Biên EBITDA
      name_en: EBITDA Margin
      expression_latex: \text{EBITDA Margin} = \frac{\text{EBIT} + \text{D\&A}}{\text{Revenue}}
      expression_python: (ebit + depreciation_amortization) / revenue
      excel: =(EBIT+KhauHao)/DoanhThuThuan
      variables:
      - symbol: ebit
        meaning: EBIT
        unit: triệu VNĐ
      - symbol: depreciation_amortization
        meaning: Khấu hao và phân bổ
        unit: triệu VNĐ
      - symbol: revenue
        meaning: Doanh thu thuần
        unit: triệu VNĐ
      when_to_use: Xem khả năng tạo dòng tiền hoạt động thô; so công ty có chính sách khấu hao khác nhau.
      why_it_works: Khấu hao là chi phí không dùng tiền trong kỳ và phụ thuộc chính sách (đường thẳng/số dư giảm dần, thời gian hữu dụng ước tính).
      assumptions:
      - Khấu hao lấy từ thuyết minh hoặc LCTT
      pitfalls:
      - EBITDA bỏ qua nhu cầu tái đầu tư tài sản nên doanh nghiệp nhiều tài sản (nhà hàng, sản xuất) không coi như tiền chi tự do
      interpretation: Dùng làm biên dòng tiền thô; đọc cùng capex.
      example:
        inputs:
          ebit: 1200
          depreciation_amortization: 300
          revenue: 24000
        steps:
        - (1.200 + 300)/24.000 = 6,25%
        result: EBITDA Margin = 6,25%
  - id: "m06-formulas-21"
    title: "Công thức: m06_net_margin — Biên lợi nhuận ròng"
    tags: ["công", "thức", "m06_net_margin", "biên", "lợi", "nhuận", "ròng"]
    text: |-
      id: m06_net_margin
      name_vi: Biên lợi nhuận ròng
      name_en: Net Profit Margin
      expression_latex: \text{NM} = \frac{\text{Net Income (mã 60)}}{\text{Revenue}}\times 100\%
      expression_python: net_income / revenue
      excel: =B02_ma60/B02_ma10
      variables:
      - symbol: net_income
        meaning: Lợi nhuận sau thuế
        unit: triệu VNĐ
      - symbol: revenue
        meaning: Doanh thu thuần
        unit: triệu VNĐ
      when_to_use: 'Bottom line: giữ lại bao nhiêu từ mỗi đồng doanh thu sau mọi chi phí, lãi vay và thuế.'
      why_it_works: Tổng hợp mọi khoản; biên vài % không tệ nếu vòng quay nhanh (DuPont).
      assumptions:
      - Không có khoản bất thường lớn
      pitfalls:
      - Đánh giá riêng lẻ ngành phân phối bán lẻ mà bỏ qua vòng quay
      interpretation: 'Ngành: bán lẻ 2-6%, phân phối 1-4%, dịch vụ 10-20%, F&B 5-12%, sản xuất nhỏ 3-8% (ước lượng, cần đối chiếu số liệu ngành).'
      example:
        inputs:
          net_income: 768
          revenue: 24000
        steps:
        - 768/24.000 = 3,2%
        result: Net Margin = 3,2%
  - id: "m06-formulas-22"
    title: "Công thức: m06_roe — Tỷ suất sinh lời trên vốn chủ"
    tags: ["công", "thức", "m06_roe", "tỷ", "suất", "sinh", "lời", "trên", "vốn", "chủ"]
    text: |-
      id: m06_roe
      name_vi: Tỷ suất sinh lời trên vốn chủ
      name_en: Return on Equity (ROE)
      expression_latex: \text{ROE} = \frac{\text{Net Income}}{\text{Avg Equity}}\times 100\%
      expression_python: net_income / avg_equity
      excel: =B02_ma60/VonChuBinhQuan
      variables:
      - symbol: net_income
        meaning: Lợi nhuận sau thuế
        unit: triệu VNĐ
      - symbol: avg_equity
        meaning: Vốn chủ bình quân (hoặc cuối kỳ, phải ghi rõ)
        unit: triệu VNĐ
      when_to_use: 'Góc nhìn chủ sở hữu: mỗi đồng vốn bỏ vào kiếm bao nhiêu; so chi phí cơ hội.'
      why_it_works: Phải cao hơn lãi tiết kiệm/chi phí cơ hội vốn chủ, nếu không chủ gửi ngân hàng còn hơn.
      assumptions:
      - Vốn chủ dương
      pitfalls:
      - ROE cao do đòn bẩy, hoặc do vốn chủ thấp vì lỗ lũy kế/mua lại cổ phiếu/cổ tức lớn
      - Vốn chủ âm hoặc gần 0 làm ROE vô nghĩa
      - Phải phân rã bằng DuPont
      interpretation: Dưới 5% yếu; 5-10% trung bình; 10-20% tốt; 20-30% rất tốt; trên 30% xuất sắc hoặc đòn bẩy rất cao.
      example:
        inputs:
          net_income: 768
          avg_equity: 3568
        steps:
        - 768/3.568 = 21,5% (cuối kỳ); bình quân (3.000+3.568)/2 = 3.284 cho 23,4%
        result: ROE = 21,5% (cuối kỳ)
  - id: "m06-formulas-23"
    title: "Công thức: m06_roa — Tỷ suất sinh lời trên tài sản"
    tags: ["công", "thức", "m06_roa", "tỷ", "suất", "sinh", "lời", "trên", "tài", "sản"]
    text: |-
      id: m06_roa
      name_vi: Tỷ suất sinh lời trên tài sản
      name_en: Return on Assets (ROA)
      expression_latex: \text{ROA} = \frac{\text{Net Income}}{\text{Avg Total Assets}}\times 100\%;\quad \text{ROA hiệu chỉnh} = \frac{\text{NI} + \text{Lãi vay}(1-T)}{\text{Avg TA}}
      expression_python: net_income / avg_total_assets
      excel: =B02_ma60/TongTaiSanBinhQuan
      variables:
      - symbol: net_income
        meaning: Lợi nhuận sau thuế
        unit: triệu VNĐ
      - symbol: avg_total_assets
        meaning: Tổng tài sản bình quân
        unit: triệu VNĐ
      when_to_use: Đánh giá năng lực quản lý dùng tài sản, độc lập cấu trúc vốn.
      why_it_works: Mẫu số là toàn bộ tài sản dù tài trợ bằng nợ hay vốn chủ.
      assumptions:
      - Ghi rõ định nghĩa tử số (NI hay NI + lãi vay x (1-T))
      pitfalls:
      - Tài sản khấu hao nhiều làm ROA cao giả
      - Trộn hai định nghĩa tử số khi so sánh
      interpretation: ROE lớn hơn ROA nhiều là đòn bẩy cao; ROA ít bị đòn bẩy tác động.
      example:
        inputs:
          net_income: 768
          avg_total_assets: 8268
        steps:
        - 768/8.268 = 9,3% (N-1 là 576/6.500 = 8,9%)
        result: ROA = 9,3% (cuối kỳ)
  - id: "m06-formulas-24"
    title: "Công thức: m06_burn_runway — Burn Rate và Runway"
    tags: ["công", "thức", "m06_burn_runway", "burn", "rate", "và", "runway"]
    text: |-
      id: m06_burn_runway
      name_vi: Burn Rate và Runway
      name_en: Burn Rate and Runway
      expression_latex: \text{Runway (tháng)} = \frac{\text{Tiền mặt hiện có}}{\text{Burn Rate/tháng}}
      expression_python: cash_on_hand / monthly_burn
      excel: =TienMat/BurnRate
      variables:
      - symbol: cash_on_hand
        meaning: Tiền mặt và tương đương tiền khả dụng
        unit: triệu VNĐ
      - symbol: monthly_burn
        meaning: Tiền mặt tiêu hao ròng mỗi tháng (chi - thu hoạt động và đầu tư)
        unit: triệu VNĐ/tháng
      when_to_use: Startup/SME lỗ hoặc dòng tiền âm, cần biết còn sống bao lâu.
      why_it_works: Với doanh nghiệp lỗ, Current Ratio không nói thời gian sống; chia tiền hiện có cho tốc độ tiêu hao cho trực tiếp số tháng.
      assumptions:
      - Burn Rate ổn định (nên dùng bình quân 3 tháng gần nhất)
      pitfalls:
      - Burn Rate tăng khi mở rộng làm runway ngắn hơn dự tính
      - Tính burn trên lỗ kế toán thay dòng tiền
      - Quên khoản trả nợ gốc đến hạn
      interpretation: Dưới 6 tháng cần gọi vốn hoặc cắt chi ngay; cần kế hoạch gọi vốn bắt đầu khi còn trên 9-12 tháng (ngưỡng thực hành, confidence low).
      example:
        inputs:
          cash_on_hand: 480
          monthly_burn: 60
        steps:
        - 480/60 = 8 tháng
        - 'Nếu burn tăng lên 80: 480/80 = 6 tháng'
        result: Runway = 8 tháng
  - id: "m06-formulas-25"
    title: "Công thức: m06_cfo_to_ni — Tỷ lệ dòng tiền hoạt động trên lợi nhuận ròng"
    tags: ["công", "thức", "m06_cfo_to_ni", "tỷ", "lệ", "dòng", "tiền", "hoạt", "động", "trên", "lợi", "nhuận"]
    text: |-
      id: m06_cfo_to_ni
      name_vi: Tỷ lệ dòng tiền hoạt động trên lợi nhuận ròng
      name_en: CFO to Net Income
      expression_latex: \text{CFO/NI} = \frac{\text{Lưu chuyển tiền thuần từ HĐKD}}{\text{Lợi nhuận sau thuế}}
      expression_python: cfo / net_income
      excel: =CFO/LNST
      variables:
      - symbol: cfo
        meaning: Dòng tiền thuần từ hoạt động kinh doanh
        unit: triệu VNĐ
      - symbol: net_income
        meaning: Lợi nhuận sau thuế
        unit: triệu VNĐ
      when_to_use: Kiểm tra chất lượng lợi nhuận; phát hiện tăng trưởng đốt tiền hoặc ghi nhận doanh thu sớm.
      why_it_works: Lợi nhuận dồn tích khác tiền; tỷ lệ này cho biết bao nhiêu phần lãi đã thành tiền.
      assumptions:
      - LCTT lập đúng, khớp tiền trên bảng cân đối
      pitfalls:
      - Một kỳ thấp có thể do mùa vụ, cần 3 kỳ
      - Lãi vay đã trả có thể xếp ở CFO hoặc CFF tùy chính sách (cần xác nhận)
      interpretation: Gần 1 hoặc hơn là tốt; CFO nhỏ hơn NI liên tục 3 kỳ trở lên là cờ vàng; CFO âm khi NI dương là cờ đỏ.
      example:
        inputs:
          cfo: -432
          net_income: 768
        steps:
        - -432/768 = -0,56 (Hải Long năm N)
        result: 'CFO/NI = -0,56: cờ đỏ chất lượng lợi nhuận'
  - id: "m06-formulas-26"
    title: "Công thức: m06_operating_wc — Vốn lưu động hoạt động"
    tags: ["công", "thức", "m06_operating_wc", "vốn", "lưu", "động", "hoạt"]
    text: |-
      id: m06_operating_wc
      name_vi: Vốn lưu động hoạt động
      name_en: Operating working capital
      expression_latex: \text{OWC} = \text{AR} + \text{Inventory} - \text{AP}
      expression_python: ar + inventory - ap
      excel: =PhaiThu+HTK-PhaiTra
      variables:
      - symbol: ar
        meaning: Phải thu khách hàng
        unit: triệu VNĐ
      - symbol: inventory
        meaning: Hàng tồn kho
        unit: triệu VNĐ
      - symbol: ap
        meaning: Phải trả nhà cung cấp
        unit: triệu VNĐ
      when_to_use: Lượng vốn thực sự bị kẹt trong chu kỳ hoạt động; giải thích vì sao lãi mà thiếu tiền.
      why_it_works: Là phần hoạt động cần tài trợ; tăng OWC trừ trực tiếp vào CFO.
      assumptions:
      - Các khoản mục hoạt động tách khỏi tiền và nợ vay
      pitfalls:
      - NWC theo bảng cân đối lẫn tiền và vay ngắn hạn nên che mất mức tăng của OWC
      interpretation: OWC tăng nhanh hơn doanh thu là dấu hiệu tăng trưởng nuốt tiền.
      example:
        inputs:
          ar: 2900
          inventory: 2600
          ap: 1500
        steps:
        - '2.900 + 2.600 - 1.500 = 4.000 (N-1: 1.800 + 1.700 - 1.100 = 2.400; tăng 1.600)'
        result: OWC = 4.000 triệu
  - id: "m06-formulas-27"
    title: "Công thức: m06_revenue_growth — Tăng trưởng và so sánh tốc độ tăng"
    tags: ["công", "thức", "m06_revenue_growth", "tăng", "trưởng", "và", "so", "sánh", "tốc", "độ"]
    text: |-
      id: m06_revenue_growth
      name_vi: Tăng trưởng và so sánh tốc độ tăng
      name_en: Growth rate comparison
      expression_latex: g = \frac{X_t}{X_{t-1}} - 1
      expression_python: current / previous - 1
      excel: =KyNay/KyTruoc-1
      variables:
      - symbol: current
        meaning: Giá trị kỳ này
        unit: tuỳ chỉ tiêu
      - symbol: previous
        meaning: Giá trị kỳ trước
        unit: tuỳ chỉ tiêu
      when_to_use: So tốc độ tăng của doanh thu với phải thu, tồn kho, phải trả, lợi nhuận, CFO để lộ sự phân kỳ.
      why_it_works: Phải thu hoặc tồn kho tăng nhanh hơn doanh thu nghĩa là bán chịu nhiều hơn hoặc hàng chậm bán.
      assumptions:
      - Hai kỳ cùng độ dài và cùng chính sách kế toán
      pitfalls:
      - Nền thấp làm phần trăm lớn giả
      - Mùa vụ nếu so kỳ không cùng mùa
      interpretation: AR tăng nhiều hơn doanh thu liên tục là cờ vàng/đỏ.
      example:
        inputs:
          current: 2900
          previous: 1800
        steps:
        - 2.900/1.800 - 1 = 61,1% so với doanh thu 33,3%
        result: AR +61,1%
  - id: "m06-formulas-28"
    title: "Công thức: m06_cogs_fifo_wavg — Giá vốn theo FIFO và bình quân gia quyền"
    tags: ["công", "thức", "m06_cogs_fifo_wavg", "giá", "vốn", "theo", "fifo", "và", "bình", "quân", "gia", "quyền"]
    text: |-
      id: m06_cogs_fifo_wavg
      name_vi: Giá vốn theo FIFO và bình quân gia quyền
      name_en: COGS under FIFO vs weighted average
      expression_latex: \text{COGS}_{FIFO} = \sum \text{lô cũ trước};\quad \text{COGS}_{WA} = Q_{bán}\times\frac{\text{Giá trị tồn đầu} + \text{Giá trị nhập}}{Q_{tồn đầu}+Q_{nhập}}
      expression_python: qty_sold * (open_qty * open_price + buy_qty * buy_price) / (open_qty + buy_qty)
      excel: =SL_ban*(SL_dau*Gia_dau+SL_nhap*Gia_nhap)/(SL_dau+SL_nhap)
      variables:
      - symbol: qty_sold
        meaning: Số lượng bán
        unit: đơn vị
      - symbol: open_qty
        meaning: Tồn đầu kỳ (số lượng)
        unit: đơn vị
      - symbol: open_price
        meaning: Giá tồn đầu
        unit: nghìn đồng/đơn vị
      - symbol: buy_qty
        meaning: Số lượng nhập
        unit: đơn vị
      - symbol: buy_price
        meaning: Giá nhập
        unit: nghìn đồng/đơn vị
      when_to_use: So sánh hai doanh nghiệp khác phương pháp giá xuất kho; đánh giá ảnh hưởng chính sách lên Gross Margin, HTK, DIO.
      why_it_works: Giá tăng thì FIFO xuất hàng cũ rẻ trước nên giá vốn thấp, GM cao, tồn cuối đắt; giá giảm thì ngược lại (bình quân cho GM cao hơn). VAS 02 không cho LIFO (cần xác nhận hiện hành).
      assumptions:
      - Một lần nhập trong kỳ
      - Phương pháp bình quân tính cuối kỳ
      pitfalls:
      - So Gross Margin giữa hai doanh nghiệp mà chưa đọc thuyết minh giá xuất kho
      - Đổi chính sách phải thuyết minh và áp dụng nhất quán
      interpretation: Chênh lệch 3,3 điểm GM ở ví dụ giá tăng cho thấy chính sách có thể lớn hơn khác biệt kinh doanh thực.
      example:
        inputs:
          qty_sold: 120
          open_qty: 100
          open_price: 10
          buy_qty: 100
          buy_price: 12
        steps:
        - 'BQGQ: 120 x (1.000 + 1.200)/200 = 1.320'
        - 'FIFO: 100 x 10 + 20 x 12 = 1.240'
        - GM FIFO = (2.400 - 1.240)/2.400 = 48,3%; BQ = 45,0%
        result: Giá vốn BQGQ 1.320 so với FIFO 1.240
  - id: "m06-frameworks-1"
    title: "Frameworks: m06_four_group_system — Hệ thống bốn nhóm tỷ số"
    tags: ["frameworks", "m06_four_group_system", "hệ", "thống", "bốn", "nhóm", "tỷ", "số"]
    text: |-
      id: m06_four_group_system
      name_vi: Hệ thống bốn nhóm tỷ số
      name_en: Liquidity - Efficiency - Leverage - Profitability system
      origin: Alexander Wall 1919 (hệ nhiều tỷ số thay vì một); Current Ratio 2:1 từ yêu cầu ngân hàng Mỹ cuối thế kỷ 19 (cần đối chiếu nguồn).
      components:
      - 'Thanh khoản: Current, Quick, Cash Ratio, NWC (trả nợ gần được không)'
      - 'Hiệu quả: DIO, DSO, DPO, CCC, Asset Turnover (vốn quay nhanh không)'
      - 'Đòn bẩy: D/E, Debt Ratio, ICR, EM, DSCR (vay quá mức không)'
      - 'Lợi nhuận: Gross, Operating, EBITDA, Net Margin, ROE, ROA (kiếm đủ không)'
      - 'Bổ sung: CFO/NI, Burn Rate/Runway, tăng trưởng'
      when_to_use: Mọi lần chẩn đoán sức khỏe tài chính.
      how_to_apply:
      - Tính đủ cả bốn nhóm cho ít nhất 2 kỳ.
      - So YoY và kỳ trước, so ngành cùng quy mô.
      - Tìm sự phân kỳ giữa các nhóm (lợi nhuận tốt, tiền xấu).
      how_to_read_results: Một tỷ số tốt không bù được tỷ số xấu ở nhóm khác (ICR 5,0x nhưng Cash Ratio 0,08).
      pitfalls:
      - Chỉ nhìn lợi nhuận
      - Benchmark khác ngành
      - Quên dòng tiền
      example: 'Hải Long: lợi nhuận và ICR đẹp, thanh khoản và CCC xấu đi, CFO âm.'
  - id: "m06-frameworks-2"
    title: "Frameworks: m06_statement_code_mapping — Ánh xạ mã số BCTC theo VAS vào tỷ số"
    tags: ["frameworks", "m06_statement_code_mapping", "ánh", "xạ", "mã", "số", "bctc", "theo", "vas", "vào", "tỷ"]
    text: |-
      id: m06_statement_code_mapping
      name_vi: Ánh xạ mã số BCTC theo VAS vào tỷ số
      name_en: VAS statement code to ratio mapping
      origin: Thông tư 200/2014/TT-BTC (B01-DN, B02-DN); DN nhỏ có thể áp dụng TT133/2016/TT-BTC với mẫu khác - cần xác nhận hiện hành.
      components:
      - 'B01-DN: 100 TS ngắn hạn; 110 tiền; 130 phải thu ngắn hạn; 140 HTK (trừ dự phòng TK 2294); 270 tổng tài sản; 300 nợ phải trả; 310 nợ ngắn hạn; 400 vốn chủ'
      - 'B02-DN: 10 doanh thu thuần (01 - 02, TK 511); 11 giá vốn (TK 632); 20 lợi nhuận gộp; 22 chi phí tài chính; 23 chi phí lãi vay (TK 635); 50 LN trước thuế; 60 LN sau thuế'
      - Dự phòng phải thu khó đòi TK 2293; dự phòng giảm giá HTK TK 2294
      when_to_use: Khi nhận BCTC thật và cần lấy đúng số cho từng tỷ số.
      how_to_apply:
      - Xác nhận chế độ kế toán (TT200 hay TT133) và mẫu biểu.
      - Lấy số từng dòng theo bảng và ghi mã số nguồn trong bảng tính.
      - Tính EBIT = mã 50 + mã 23 (loại bất thường).
      - Đối chiếu tổng tài sản = nợ + vốn chủ, tiền LCTT khớp mã 110.
      how_to_read_results: Mã số chỉ định hướng; mọi mã cần đối chiếu mẫu hiện hành.
      pitfalls:
      - Dùng mã 22 làm lãi vay
      - Dùng HTK chưa trừ dự phòng
      - Dùng mã của chế độ cũ
      example: Quick Ratio = (mã 100 - mã 140)/mã 310.
  - id: "m06-frameworks-3"
    title: "Frameworks: m06_dupont_3 — DuPont 3 thành phần"
    tags: ["frameworks", "m06_dupont_3", "dupont", "thành", "phần"]
    text: |-
      id: m06_dupont_3
      name_vi: DuPont 3 thành phần
      name_en: DuPont 3-factor
      origin: 'Thập niên 1910-1920 tại DuPont, gắn với Donaldson Brown, khi DuPont kiểm soát General Motors: cần biết bộ phận nào chịu trách nhiệm khi ROE biến động (cần đối chiếu nguồn).'
      components:
      - Net Margin = NI/Revenue (bán hàng, định giá, kiểm soát chi phí)
      - Asset Turnover = Revenue/Assets (vận hành, vốn lưu động, tài sản)
      - Equity Multiplier = Assets/Equity (tài chính, đòn bẩy)
      - 'ROE = NM x AT x EM (đồng nhất thức đại số: Revenue và Assets triệt tiêu)'
      when_to_use: ROE biến động hoặc cần so hai doanh nghiệp cùng ROE nhưng rủi ro khác.
      how_to_apply:
      - Tính ba thành phần cho hai kỳ (cùng quy ước cuối kỳ hoặc bình quân).
      - Kiểm tra tích bằng ROE tính trực tiếp.
      - 'Phân rã thay đổi ROE: thành phần nào đổi, cái nào đứng yên.'
      how_to_read_results: ROE tăng mà NM không đổi, EM tăng là ROE nhờ đòn bẩy, đẹp mặt rỗng ruột. Luxury 15% x 0,8 x 1,5 = 18% (rủi ro thấp) khác bán lẻ giá rẻ 3% x 3,0 x 2,5 = 22,5% (nhạy suy thoái).
      pitfalls:
      - Trộn cuối kỳ và bình quân
      - Bỏ qua rủi ro của EM cao
      - Gộp thuế và lãi vay vào NM
      example: 'Hải Long N: 3,2% x 2,90 x 2,32 = 21,5%; N-1: 3,2% x 2,77 x 2,17 = 19,2%.'
  - id: "m06-frameworks-4"
    title: "Frameworks: m06_dupont_5 — DuPont 5 thành phần"
    tags: ["frameworks", "m06_dupont_5", "dupont", "thành", "phần"]
    text: |-
      id: m06_dupont_5
      name_vi: DuPont 5 thành phần
      name_en: DuPont 5-factor
      origin: Mở rộng DuPont 3 để tách thuế và lãi vay ra khỏi biên ròng.
      components:
      - Tax Burden = NI/EBT
      - Interest Burden = EBT/EBIT
      - Operating Margin = EBIT/Revenue
      - Asset Turnover = Revenue/Assets
      - Equity Multiplier = Assets/Equity
      when_to_use: Phân biệt ROE tăng do kinh doanh cốt lõi hay do thuế/lãi vay giảm.
      how_to_apply:
      - Tính 5 thành phần từ mã 60, 50, EBIT, 10, 270, 400.
      - Kiểm tra tích 5 thành phần = ROE.
      - Interest Burden thấp (0,5) nghĩa là nửa lợi nhuận hoạt động bị lãi vay nuốt.
      how_to_read_results: 'Hải Long: 0,8 x 0,8 x 5,0% x 2,90 x 2,32 = 21,5%; Operating Margin đứng yên nên cải thiện ROE nằm ở AT và EM, không ở hoạt động.'
      pitfalls:
      - EBIT tính sai
      - Thuế hiệu dụng thay đổi do khoản không được trừ
      example: Tax Burden 768/960 = 0,8; Interest Burden 960/1.200 = 0,8.
  - id: "m06-frameworks-5"
    title: "Frameworks: m06_accounting_policy_effects — Ảnh hưởng chính sách kế toán lên tỷ số"
    tags: ["frameworks", "m06_accounting_policy_effects", "ảnh", "hưởng", "chính", "sách", "kế", "toán", "lên", "tỷ", "số"]
    text: |-
      id: m06_accounting_policy_effects
      name_vi: Ảnh hưởng chính sách kế toán lên tỷ số
      name_en: Accounting policy effects on ratios
      origin: Nguyên tắc nhất quán và thận trọng của kế toán; VAS 02 về HTK.
      components:
      - 'Giá xuất kho (FIFO, bình quân, đích danh): Gross Margin, Current Ratio, DIO'
      - 'Khấu hao và thời gian hữu dụng: Operating Margin, ROA, Asset Turnover'
      - 'Dự phòng phải thu/HTK: Current Ratio, DSO, DIO, Net Margin'
      - 'Cut-off ghi nhận doanh thu: gần như mọi tỷ số'
      - 'Vốn hóa vs ghi chi phí ngay: Margin, ROA, AT'
      - 'Phân loại nợ ngắn/dài hạn: Current Ratio, Quick Ratio'
      - 'Phân loại chi phí giá vốn vs bán hàng/QLDN: Gross Margin'
      when_to_use: So sánh giữa doanh nghiệp hoặc kỳ khi chính sách có thể khác.
      how_to_apply:
      - Đọc thuyết minh BCTC lấy chính sách của từng bên.
      - Chuẩn hóa nếu có thể (tính lại giá vốn theo cùng phương pháp).
      - Nếu không chuẩn hóa được, ghi rõ không so sánh trực tiếp.
      how_to_read_results: Hai doanh nghiệp đồng nhất kinh doanh nhưng khác chính sách có thể chênh Gross Margin vài điểm phần trăm.
      pitfalls:
      - Đổi chính sách không thuyết minh
      - So sánh khi chưa đọc thuyết minh
      example: 'Giá nhập tăng: FIFO GM 48,3% so với BQGQ 45,0%; giá giảm: FIFO 51,7% so với BQGQ 55,0%.'
  - id: "m06-frameworks-6"
    title: "Frameworks: m06_window_dressing_check — Rà soát window dressing và chất lượng số liệu"
    tags: ["frameworks", "m06_window_dressing_check", "rà", "soát", "window", "dressing", "và", "chất", "lượng", "số", "liệu"]
    text: |-
      id: m06_window_dressing_check
      name_vi: Rà soát window dressing và chất lượng số liệu
      name_en: Window dressing and data quality check
      origin: 'Thực hành kiểm toán/thẩm định tín dụng: số cuối kỳ là điểm dễ thao tác nhất.'
      components:
      - Trả nợ ngắn hạn sát ngày khóa sổ rồi vay lại đầu kỳ sau
      - Tái phân loại vay ngắn hạn thành dài hạn qua tái cơ cấu hợp đồng
      - Đẩy doanh thu/hoãn chi phí qua cut-off
      - Không trích dự phòng phải thu/HTK
      - Nợ ngoài bảng, thuê dài hạn, bảo lãnh
      when_to_use: Thẩm định vay, đầu tư, mua bán doanh nghiệp, hoặc khi tỷ số đẹp bất thường.
      how_to_apply:
      - Dùng số bình quân nhiều kỳ và xu hướng quý/tháng thay vì một mốc cuối năm.
      - Đọc thuyết minh nợ vay, cam kết, bên liên quan.
      - Kiểm tra giao dịch lớn 5-10 ngày quanh ngày khóa sổ.
      - Đối chiếu công nợ, kiểm kê kho, đối chiếu CFO với lợi nhuận.
      how_to_read_results: 'Ví dụ CA 2.000, CL 1.000 (CR 2,0); trả 500 nợ bằng tiền: CA 1.500, CL 500 (CR 3,0) mà doanh nghiệp không giàu hơn.'
      pitfalls:
      - Tin tỷ số một mốc
      - Không phân biệt thao tác hợp pháp (quản trị tiền) và gian lận
      example: Cash Ratio cuối năm đột nhiên đẹp rồi tụt đầu quý sau.
  - id: "m06-frameworks-7"
    title: "Frameworks: m06_off_balance_ifrs16 — Điều chỉnh nợ ngoài bảng và thuê theo IFRS 16"
    tags: ["frameworks", "m06_off_balance_ifrs16", "điều", "chỉnh", "nợ", "ngoài", "bảng", "và", "thuê", "theo", "ifrs", "16"]
    text: |-
      id: m06_off_balance_ifrs16
      name_vi: Điều chỉnh nợ ngoài bảng và thuê theo IFRS 16
      name_en: Off-balance-sheet and IFRS 16 adjustment
      origin: 'IFRS 16 (hiệu lực 2019) đưa hầu hết hợp đồng thuê lên bảng: tài sản quyền sử dụng và nợ thuê; VAS chưa chặt như vậy (cần xác nhận hiện hành và lộ trình IFRS tại Việt Nam).'
      components:
      - Nợ thuê = giá trị hiện tại của tiền thuê tương lai chiết khấu theo lãi suất vay biên
      - Cộng nợ thuê vào cả tổng nợ lẫn tổng tài sản (tài sản quyền sử dụng)
      - 'Các nghĩa vụ khác: bảo lãnh cho bên liên quan, cam kết mua hàng'
      when_to_use: Doanh nghiệp thuê nhiều (chuỗi cửa hàng, nhà hàng, kho); so với công ty IFRS; ngân hàng thẩm định.
      how_to_apply:
      - Liệt kê hợp đồng thuê dài hạn và tiền thuê còn lại.
      - Tính hiện giá tiền thuê (chiết khấu theo lãi vay biên).
      - Tính lại D/E, Debt Ratio, Asset Turnover, ROA với số điều chỉnh.
      how_to_read_results: 'Ví dụ tiền thuê 600/năm trong 5 năm, lãi 10%: nợ thuê 2.274; D/E 1,32 tăng lên 1,95.'
      pitfalls:
      - Chiết khấu bằng lãi suất sai
      - Điều chỉnh một bên mà không điều chỉnh bên so sánh
      example: Xem worked example IFRS 16.
  - id: "m06-frameworks-8"
    title: "Frameworks: m06_ratio_red_flags — Bảng red flags tỷ số"
    tags: ["frameworks", "m06_ratio_red_flags", "bảng", "red", "flags", "tỷ", "số"]
    text: |-
      id: m06_ratio_red_flags
      name_vi: Bảng red flags tỷ số
      name_en: Ratio red flags
      origin: Quy tắc kinh nghiệm từ thẩm định tín dụng và phân tích BCTC, không phải quy định pháp lý.
      components:
      - Đỏ - Current Ratio dưới 1,0 giảm 3 quý liên tiếp
      - Đỏ - D/E tăng nhanh, +50% trong 1 năm
      - Đỏ - ICR dưới 1,5 và đang giảm
      - Vàng - DIO +30% so với cùng kỳ
      - Vàng - DSO trên 90 ngày hoặc tăng nhanh hơn doanh thu
      - Vàng - Gross Margin giảm 5 điểm phần trăm YoY
      - Vàng - ROE tăng do EM tăng trong khi Net Margin không đổi hoặc giảm
      - Vàng - CFO dưới Net Income trong 3 kỳ liên tiếp
      - Đỏ - CFO âm khi Net Income dương
      when_to_use: Quét nhanh dashboard hằng tháng/quý.
      how_to_apply:
      - Tính các tỷ số liên quan và so ngưỡng.
      - 'Tìm sự phân kỳ: doanh thu +20% nhưng DSO 45 lên 85, DIO 30 lên 55, CR 2,0 xuống 1,2, CFO +100 xuống -50.'
      - Gán giả thuyết (ghi doanh thu sớm, bán chịu mạnh, hàng chậm bán) và hành động kiểm tra.
      how_to_read_results: Nhiều cờ cùng chiều nghiêm trọng hơn một cờ riêng lẻ.
      pitfalls:
      - Ngưỡng cứng bỏ qua đặc thù ngành (Apple CR dưới 1)
      - Cờ đơn lẻ
      example: 'Công ty Y bài tập: AR +96%, DSO 118 ngày, CFO/NI 0,14.'
  - id: "m06-frameworks-9"
    title: "Frameworks: m06_ratio_diagnosis_flow — Quy trình chẩn đoán sức khỏe tài chính"
    tags: ["frameworks", "m06_ratio_diagnosis_flow", "quy", "trình", "chẩn", "đoán", "sức", "khỏe", "tài", "chính"]
    text: |-
      id: m06_ratio_diagnosis_flow
      name_vi: Quy trình chẩn đoán sức khỏe tài chính
      name_en: Financial health diagnosis flow
      origin: 'Tổng hợp từ nguồn: 7 bước của case Hải Long.'
      components:
      - B1 Kiểm tra số liệu (cân đối, khớp LCTT, cut-off, chính sách)
      - B2 Tính 4 nhóm tỷ số hai kỳ
      - B3 DuPont 3 và 5
      - B4 Đối chiếu CFO và vốn lưu động hoạt động
      - B5 Quét red flags
      - B6 Chẩn đoán nguyên nhân và lượng hóa
      - B7 Khuyến nghị hành động có chủ, hạn
      when_to_use: Mọi yêu cầu 'phân tích BCTC/sức khỏe tài chính'.
      how_to_apply:
      - Theo thứ tự B1 đến B7, không bỏ B1.
      - Ghi cách tính (cuối kỳ/bình quân) và nguồn mã số.
      - Kết luận gồm điểm mạnh, rủi ro, ưu tiên hành động và số tiền giải phóng.
      how_to_read_results: Kết luận phải nêu được tiền đang kẹt ở đâu và vì sao lợi nhuận không thành tiền.
      pitfalls:
      - Bỏ B1
      - Chỉ nêu tỷ số không nêu hành động
      example: 'Hải Long: tăng trưởng nuốt tiền, ROE nhờ đòn bẩy, vay ngắn hạn tài trợ TSCĐ.'
  - id: "m06-frameworks-10"
    title: "Frameworks: m06_three_red_lines — Ba lằn ranh đỏ (Trung Quốc, BĐS)"
    tags: ["frameworks", "m06_three_red_lines", "ba", "lằn", "ranh", "đỏ", "trung", "quốc", "bđs"]
    text: |-
      id: m06_three_red_lines
      name_vi: Ba lằn ranh đỏ (Trung Quốc, BĐS)
      name_en: Three Red Lines policy
      origin: Chính sách ban hành khoảng 2020 giới hạn đòn bẩy nhà phát triển bất động sản Trung Quốc (diễn đạt mức nguyên tắc, cần đối chiếu quy định gốc).
      components:
      - 'Lằn 1: (Nợ phải trả - tiền nhận trước)/Tài sản không quá 70%'
      - 'Lằn 2: Nợ ròng/Vốn chủ không quá 100%'
      - 'Lằn 3: Tiền/Nợ vay ngắn hạn tối thiểu 1,0'
      when_to_use: Mẫu để SME tự đặt lằn ranh đỏ (ICR tối thiểu, Cash Ratio tối thiểu, D/E trần) khi không có cơ quan quản lý đặt hộ.
      how_to_apply:
      - Tính ba tỷ số trên số giả định hoặc thực.
      - Tự đặt ba lằn ranh cho SME.
      how_to_read_results: 'Mô hình giả định: 72,0%, 142,5%, 0,36 đều vi phạm.'
      pitfalls:
      - Số Evergrande trong nguồn là giả định minh họa chứ không phải số thật
      - Phiên bản cũ ghi lằn 1 là D/E nhỏ hơn 1 - sai
      example: Xem worked example Evergrande mô phỏng.
  - id: "m06-frameworks-11"
    title: "Frameworks: m06_ratio_use_context — Chọn tỷ số theo mục đích và giai đoạn"
    tags: ["frameworks", "m06_ratio_use_context", "chọn", "tỷ", "số", "theo", "mục", "đích", "và", "giai", "đoạn"]
    text: |-
      id: m06_ratio_use_context
      name_vi: Chọn tỷ số theo mục đích và giai đoạn
      name_en: Ratios by purpose and lifecycle
      origin: Thực hành phân tích tài chính.
      components:
      - 'Xin vay: Current Ratio, D/E, ICR, DSO, DSCR'
      - 'Gọi vốn: ROE, tăng trưởng doanh thu, Net Margin'
      - 'Quản trị nội bộ: Gross Margin, CCC, Asset Turnover'
      - 'M&A: EV/EBITDA, ROA, DuPont'
      - 'Startup: Burn Rate, Runway, CAC/LTV, CCC'
      - 'Tăng trưởng: Revenue Growth, Gross Margin, CCC'
      - 'Trưởng thành: Net Margin, ROE/ROA, DuPont, Dividend Payout'
      - 'Suy thoái: Cash Ratio, D/E, ICR'
      when_to_use: Chọn bộ tỷ số ưu tiên theo người đọc và giai đoạn.
      how_to_apply:
      - Xác định người đọc và mục đích.
      - Chọn 5-8 tỷ số ưu tiên theo bảng.
      - 'Đặt tần suất: tháng cho margin, thanh khoản, DSO; quý cho CCC, D/E, ROE.'
      how_to_read_results: Cùng một báo cáo, ngân hàng và nhà đầu tư nhìn tỷ số khác nhau.
      pitfalls:
      - Dùng một bộ cho mọi đối tượng
      example: 'Hải Long xin vay: nhấn Quick Ratio, DSCR, CCC.'
  - id: "m06-procedures-1"
    title: "Quy trình: m06_proc_health_diagnosis — Chẩn đoán sức khỏe tài chính từ BCTC (từ đầu đến cuối)"
    tags: ["quy", "trình", "m06_proc_health_diagnosis", "chẩn", "đoán", "sức", "khỏe", "tài", "chính", "từ", "bctc", "đầu"]
    text: |-
      id: m06_proc_health_diagnosis
      name: Chẩn đoán sức khỏe tài chính từ BCTC (từ đầu đến cuối)
      steps:
      - 'Hỏi đủ đầu vào: BCTC 2 kỳ trở lên (B01, B02, B03 LCTT, thuyết minh), chế độ kế toán (TT200/TT133), mục đích (vay, gọi vốn, nội bộ), ngành, quy ước cuối kỳ hay bình quân. Thiếu LCTT thì lập gián tiếp từ hai bảng cân đối.'
      - 'B1 kiểm tra số liệu: Tài sản = Nợ + Vốn chủ; lợi nhuận chưa phân phối cuối = đầu + LNST - cổ tức - phân phối khác; tiền cuối LCTT = mã 110; TSCĐ cuối = đầu + đầu tư - khấu hao; đối chiếu công nợ, kiểm kê kho, cut-off, đọc thuyết minh chính sách (giá xuất kho, khấu hao, dự phòng).'
      - Ánh xạ số liệu vào tỷ số theo mã số; tính EBIT = mã 50 + mã 23.
      - B2 tính 4 nhóm tỷ số cho mọi kỳ cùng một quy ước; nếu chọn bình quân thì ghi rõ.
      - B3 DuPont 3 và 5; phân rã thay đổi ROE giữa hai kỳ.
      - B4 lập hoặc đọc LCTT gián tiếp; tính CFO/NI, OWC, tăng trưởng AR/HTK/AP so với doanh thu.
      - B5 quét red flags theo bảng; tìm phân kỳ giữa các nhóm; kiểm tra window dressing và nợ ngoài bảng.
      - 'B6 chẩn đoán: tiền kẹt ở đâu (AR, HTK), vì sao ROE đổi, cơ cấu nợ (ngắn dài, khớp kỳ hạn), ICR và DSCR; so benchmark ngành.'
      - 'B7 lượng hóa hành động: số ngày CCC giảm x doanh thu/giá vốn một ngày; đề xuất ai - làm gì - hạn; cập nhật dự báo dòng tiền 13 tuần.'
      - 'Xuất báo cáo: bảng tỷ số 2 kỳ có cờ xanh-vàng-đỏ, DuPont, chẩn đoán, 3 hành động, ghi chú giả định và mục cần xác nhận.'
      outputs: Bảng tỷ số 4 nhóm hai kỳ, DuPont 3/5, danh sách red flags kèm nguyên nhân, lượng tiền giải phóng ước tính, 3 hành động có chủ và hạn, danh mục giả định và mục cần xác nhận.
  - id: "m06-procedures-2"
    title: "Quy trình: m06_proc_data_reliability — Kiểm tra độ tin cậy số liệu trước khi tính tỷ số"
    tags: ["quy", "trình", "m06_proc_data_reliability", "kiểm", "tra", "độ", "tin", "cậy", "số", "liệu", "trước", "khi"]
    text: |-
      id: m06_proc_data_reliability
      name: Kiểm tra độ tin cậy số liệu trước khi tính tỷ số
      steps:
      - Bảng cân đối đã cân; LNST khớp giữa KQKD và vốn chủ (lợi nhuận chưa phân phối).
      - Tiền cuối kỳ LCTT khớp bảng cân đối.
      - Đối chiếu công nợ phải thu, phải trả với đối tác; kiểm kê hàng tồn kho với sổ.
      - Kiểm tra dự phòng phải thu khó đòi (TK 2293) và giảm giá HTK (TK 2294) đã trích khi có cơ sở (cần xác nhận hiện hành).
      - Kiểm tra cut-off doanh thu/chi phí đúng kỳ.
      - Kiểm tra chính sách kế toán nhất quán với kỳ trước, thay đổi đã thuyết minh.
      - Kiểm tra đơn vị và định nghĩa để so sánh được với kỳ trước/đối thủ.
      outputs: Danh sách sai lệch phát hiện và mức ảnh hưởng đến tỷ số; quyết định có đủ tin cậy để tính chưa.
  - id: "m06-procedures-3"
    title: "Quy trình: m06_proc_dupont_decompose — Phân rã thay đổi ROE bằng DuPont"
    tags: ["quy", "trình", "m06_proc_dupont_decompose", "phân", "rã", "thay", "đổi", "roe", "bằng", "dupont"]
    text: |-
      id: m06_proc_dupont_decompose
      name: Phân rã thay đổi ROE bằng DuPont
      steps:
      - Tính NM, AT, EM (và Tax/Interest Burden, Operating Margin cho bản 5) cho kỳ trước và kỳ này.
      - Kiểm tra tích bằng ROE trực tiếp.
      - 'So từng thành phần: cái nào đổi, bao nhiêu.'
      - 'Nếu EM tăng mà NM không đổi: kết luận ROE nhờ đòn bẩy, kiểm tra ICR, Cash Ratio, DSCR.'
      - 'Nếu OM tăng: kinh doanh cốt lõi tốt lên; nếu Interest/Tax Burden đổi: nguồn không phải hoạt động.'
      - 'Gán trách nhiệm: bán hàng (margin), vận hành (AT), tài chính (EM).'
      outputs: Bảng thành phần hai kỳ và nhận định nguồn gốc tăng/giảm ROE.
  - id: "m06-procedures-4"
    title: "Quy trình: m06_proc_ccc_optimize — Tối ưu CCC và quy đổi ra tiền"
    tags: ["quy", "trình", "m06_proc_ccc_optimize", "tối", "ưu", "ccc", "và", "đổi", "ra", "tiền"]
    text: |-
      id: m06_proc_ccc_optimize
      name: Tối ưu CCC và quy đổi ra tiền
      steps:
      - Tính DIO, DSO, DPO, CCC hai kỳ cùng quy ước.
      - Tìm thành phần lệch nhất so với kỳ trước hoặc benchmark.
      - Đặt mục tiêu ngày cho từng thành phần (DSO về mức cũ, DIO giảm SKU chậm, DPO thương lượng trong điều khoản).
      - 'Quy đổi tiền: ngày x doanh thu/365 (DSO) hoặc giá vốn/365 (DIO, DPO).'
      - 'Thiết kế chính sách: hạn mức tín dụng khách, chiết khấu thanh toán sớm, phạt chậm, nhập hàng theo cầu, đổi vay ngắn hạn tài trợ TSCĐ sang trung/dài hạn.'
      - Theo dõi hằng tháng bằng số luỹ kế 12 tháng nhân 365 để tránh mùa vụ.
      outputs: Bảng mục tiêu ngày, số tiền giải phóng, hành động và người chịu trách nhiệm.
  - id: "m06-procedures-5"
    title: "Quy trình: m06_proc_dashboard_setup — Dựng dashboard tỷ số hằng tháng cho SME"
    tags: ["quy", "trình", "m06_proc_dashboard_setup", "dựng", "dashboard", "tỷ", "số", "hằng", "tháng", "cho", "sme"]
    text: |-
      id: m06_proc_dashboard_setup
      name: Dựng dashboard tỷ số hằng tháng cho SME
      steps:
      - Đóng sổ tháng đúng hạn; xuất B01 và B02 ra Excel/Google Sheets.
      - Tab INPUT_BS, INPUT_PL theo tháng với mã số; Tab RATIOS công thức; Tab DASHBOARD biểu đồ xu hướng và tô màu; Tab NOTES ghi chính sách và thay đổi bất thường.
      - 'Số tháng: DSO = AR/doanh thu tháng x 30 hoặc luỹ kế 12 tháng x 365; ROE năm hóa x 12 thận trọng với mùa vụ.'
      - 'Đặt cờ: IF dưới 1 đỏ, dưới 1,5 vàng, còn lại xanh (đặt ngưỡng theo chỉ tiêu).'
      - 'Phân công: kế toán nhập và đóng sổ hằng ngày/tháng; kế toán trưởng tính dashboard hằng tháng; chủ DN và kế toán trưởng phân tích DuPont hằng quý.'
      outputs: Dashboard 1 trang gồm 4 nhóm tỷ số, tăng trưởng, màu cảnh báo và ghi chú.
  - id: "m06-procedures-6"
    title: "Quy trình: m06_proc_policy_compare — So sánh hai doanh nghiệp khác chính sách kế toán"
    tags: ["quy", "trình", "m06_proc_policy_compare", "so", "sánh", "hai", "doanh", "nghiệp", "khác", "chính", "sách", "kế"]
    text: |-
      id: m06_proc_policy_compare
      name: So sánh hai doanh nghiệp khác chính sách kế toán
      steps:
      - Lấy chính sách giá xuất kho, khấu hao, dự phòng, cut-off, phân loại chi phí của cả hai từ thuyết minh.
      - 'Nếu khác: chuẩn hóa (tính lại giá vốn theo cùng phương pháp nếu có dữ liệu lô).'
      - 'Nếu không chuẩn hóa được: dùng tỷ số ít nhạy chính sách (EBITDA Margin, CFO/NI) và ghi chú.'
      - Báo cáo kết quả kèm chênh lệch ước tính do chính sách.
      outputs: Bảng so sánh đã chuẩn hóa hoặc có chú thích hạn chế.
  - id: "m06-decision_rules-1"
    title: "Quy tắc quyết định: Nếu Current Ratio dưới 1,0 thì xem cấu trúc nợ ngắn hạn và dòng tiền hoạt động trước khi kết luận n…"
    tags: ["quy", "tắc", "quyết", "định", "nếu", "current", "ratio", "dưới", "thì", "xem", "cấu", "trúc"]
    text: |-
      Nếu Current Ratio dưới 1,0 thì xem cấu trúc nợ ngắn hạn và dòng tiền hoạt động trước khi kết luận nguy hiểm; chỉ cờ đỏ khi kèm Cash Ratio thấp, CFO âm hoặc ICR dưới 1,5.
  - id: "m06-decision_rules-2"
    title: "Quy tắc quyết định: Nếu Current Ratio đẹp nhưng Quick Ratio dưới 1,0 thì thanh khoản phụ thuộc bán tồn kho: kiểm tra DI…"
    tags: ["quy", "tắc", "quyết", "định", "nếu", "current", "ratio", "đẹp", "nhưng", "quick", "dưới", "thì"]
    text: |-
      Nếu Current Ratio đẹp nhưng Quick Ratio dưới 1,0 thì thanh khoản phụ thuộc bán tồn kho: kiểm tra DIO và dự phòng HTK.
  - id: "m06-decision_rules-3"
    title: "Quy tắc quyết định: Nếu Cash Ratio dưới 0,1 trong khi có nhiều khoản vay đáo hạn thì cảnh báo rủi ro thanh khoản dù Cur…"
    tags: ["quy", "tắc", "quyết", "định", "nếu", "cash", "ratio", "dưới", "trong", "khi", "có", "nhiều"]
    text: |-
      Nếu Cash Ratio dưới 0,1 trong khi có nhiều khoản vay đáo hạn thì cảnh báo rủi ro thanh khoản dù Current Ratio ổn.
  - id: "m06-decision_rules-4"
    title: "Quy tắc quyết định: Nếu lợi nhuận dương mà CFO âm thì tìm nguyên nhân ở AR, HTK, AP (tăng trưởng nuốt tiền hay ghi doan…"
    tags: ["quy", "tắc", "quyết", "định", "nếu", "lợi", "nhuận", "dương", "mà", "cfo", "âm", "thì"]
    text: |-
      Nếu lợi nhuận dương mà CFO âm thì tìm nguyên nhân ở AR, HTK, AP (tăng trưởng nuốt tiền hay ghi doanh thu sớm) và đề xuất giải phóng vốn lưu động.
  - id: "m06-decision_rules-5"
    title: "Quy tắc quyết định: Nếu DSO tăng nhanh hơn doanh thu hoặc trên 90 ngày thì kiểm tra cut-off, đối chiếu công nợ, dự phòn…"
