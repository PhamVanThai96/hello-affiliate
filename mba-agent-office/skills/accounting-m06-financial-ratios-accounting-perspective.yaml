    tags: ["lỗi", "thường", "gặp", "mâu", "thuẫn", "trong", "nguồn", "đã", "dùng", "giá", "trị", "đúng"]
    text: |-
      Lỗi/mâu thuẫn trong nguồn đã dùng giá trị đúng: (1) nguồn Hải Long Bước 7 cộng 500 + 306 + 456 = 1.263 trong khi tính chính xác là 500 + 307 + 458 = 1.265 (làm tròn ngày), không đổi kết luận; (2) QR Hải Long nguồn tính (Cash + AR)/CL = 0,91 trong khi công thức CA - HTK cho 0,93 do còn 100 tài sản ngắn hạn khác, ghi rõ biến thể; (3) Apple Cash/AT/D/E dùng số cuối kỳ, số cũ DIO 9, DPO 97, CCC -60, AT 1,16, D/E 2,0 đã được nguồn sửa thành 10,8, 106,7, -67,8 (làm tròn -68), 1,087, 4,67; (4) Evergrande: số trong nguồn là mô phỏng giả định chứ không phải số thật; lằn ranh 1 đúng là (nợ - tiền nhận trước)/tài sản không quá 70%, không phải D/E nhỏ hơn 1; (5) AT của Hải Long cuối kỳ 2,90 (làm tròn 2,9027) và tích DuPont 3,2% x 2,90 x 2,32 = 21,5% vì làm tròn; (6) tổng tài sản Apple 352,6 trong khi nợ + vốn chủ = 352,5 (sai lệch làm tròn).
