      - DSCR = 1.008/(400 + 240) = 1,575.
      - 'Nếu gốc phải trả tăng lên 900 (vay ngắn hạn đáo hạn): DSCR = 1.008/1.140 = 0,88.'
      result: 'ICR 5,0 che mất rủi ro gốc: khi gốc 900 DSCR dưới 1 nghĩa là không đủ trả nợ từ dòng tiền.'
