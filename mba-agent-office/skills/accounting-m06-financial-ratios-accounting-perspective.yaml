    text: |-
      name: Evergrande (mô phỏng) - đòn bẩy và thanh khoản mất kiểm soát
      type: failure
      setup: 'Bộ số GIẢ ĐỊNH nhà phát triển BĐS vay cao (tỷ NDT), không phải số thật của Evergrande: TS 2.500; nợ phải trả 2.100 (tiền nhận trước 300); nợ vay 700 (ngắn hạn 360); tiền 130; vốn chủ 400; CA 1.500; CL 1.700; HTK 1.300; giá vốn 400; EBIT 120; lãi vay 160. Thực tế (cần đối chiếu): vỡ nợ 2021, Tòa án Hồng Kông ra lệnh thanh lý tháng 1/2024.'
      key_calculations:
