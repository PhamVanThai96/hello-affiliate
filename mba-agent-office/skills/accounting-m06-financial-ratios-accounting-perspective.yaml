      a: 'FIFO: giá vốn 1.160, GM 51,7%. Bình quân: đơn giá 9, giá vốn 1.080, GM 55,0%. Khi giá giảm, bình quân cho GM cao hơn (ngược khi giá tăng).'
  - id: "m06-practice_questions-6"
    title: "Câu hỏi luyện tập: Công ty Y (doanh thu 100/130/170; LN 10/15/22; CFO 9/8/3; AR 15/28/55): tăng trưởng, DSO, CFO/LN và…"
    tags: ["câu", "hỏi", "luyện", "tập", "công", "ty", "doanh", "thu", "100", "130", "170", "ln"]
    text: |-
      q: 'Công ty Y (doanh thu 100/130/170; LN 10/15/22; CFO 9/8/3; AR 15/28/55): tăng trưởng, DSO, CFO/LN và red flag lớn nhất?'
      a: 'Doanh thu +30,0%, +30,8%; lợi nhuận +50,0%, +46,7%; AR +86,7%, +96,4%. DSO 54,8, 78,6, 118,1 ngày. CFO/NI 0,90, 0,53, 0,14. Red flag: AR tăng gấp 2-3 lần doanh thu, CFO tụt khi lợi nhuận tăng (ghi doanh thu sớm hoặc bán chịu mạnh).'
  - id: "m06-practice_questions-7"
    title: "Câu hỏi luyện tập: EBIT 600, lãi vay 400. ICR? Nếu EBIT giảm 30%? Nhận xét."
    tags: ["câu", "hỏi", "luyện", "tập", "ebit", "600", "lãi", "vay", "400", "icr", "nếu", "giảm"]
    text: |-
      q: EBIT 600, lãi vay 400. ICR? Nếu EBIT giảm 30%? Nhận xét.
      a: ICR = 1,5; EBIT 420 thì ICR = 1,05; chỉ giảm 30% EBIT là gần không đủ trả lãi, rất nhạy cảm.
  - id: "m06-practice_questions-8"
    title: "Câu hỏi luyện tập: Hải Long: NWC hai năm và vì sao thanh khoản xấu đi dù NWC gần như đứng yên? Đề xuất 3 hành động."
    tags: ["câu", "hỏi", "luyện", "tập", "hải", "long", "nwc", "hai", "năm", "và", "vì", "sao"]
    text: |-
      q: 'Hải Long: NWC hai năm và vì sao thanh khoản xấu đi dù NWC gần như đứng yên? Đề xuất 3 hành động.'
      a: 'NWC N-1 = 4.500 - 2.100 = 2.400; N = 5.868 - 3.500 = 2.368. Cơ cấu đổi: tiền 900 xuống 268, AR/HTK tăng (khó chuyển thành tiền), vay ngắn hạn tăng nên Quick và Cash Ratio giảm mạnh. Hành động: siết DSO, giảm tồn chậm, vay dài hạn thay vay ngắn hạn cho đầu tư TSCĐ.'
  - id: "m06-practice_questions-9"
    title: "Câu hỏi luyện tập: Vì sao nên dùng số dư bình quân cho DSO, ROE? Hải Long ROE bình quân là bao nhiêu?"
    tags: ["câu", "hỏi", "luyện", "tập", "vì", "sao", "nên", "dùng", "số", "dư", "bình", "quân"]
    text: |-
      q: Vì sao nên dùng số dư bình quân cho DSO, ROE? Hải Long ROE bình quân là bao nhiêu?
      a: Tử số là dòng chảy cả kỳ nên mẫu số cũng nên đại diện cả kỳ; tăng trưởng nhanh làm số cuối kỳ lệch. ROE bình quân = 768/3.284 = 23,4% (so với 21,5% cuối kỳ).
  - id: "m06-practice_questions-10"
    title: "Câu hỏi luyện tập: Cho CA 2.000, CL 1.000. Trả nợ ngắn hạn 500 bằng tiền sát cuối kỳ thì CR là bao nhiêu và đây là dấu…"
    tags: ["câu", "hỏi", "luyện", "tập", "cho", "ca", "000", "cl", "trả", "nợ", "ngắn", "hạn"]
    text: |-
      q: Cho CA 2.000, CL 1.000. Trả nợ ngắn hạn 500 bằng tiền sát cuối kỳ thì CR là bao nhiêu và đây là dấu hiệu gì?
      a: CR = 1.500/500 = 3,0 (từ 2,0). Dấu hiệu window dressing nếu vay lại sau ngày khóa sổ; kiểm tra giao dịch quanh ngày khóa sổ.
  - id: "m06-practice_questions-11"
    title: "Câu hỏi luyện tập: Tiền 480 triệu, burn 60 triệu/tháng. Runway? Nếu mở rộng làm burn 80?"
    tags: ["câu", "hỏi", "luyện", "tập", "tiền", "480", "triệu", "burn", "60", "tháng", "runway", "nếu"]
    text: |-
      q: Tiền 480 triệu, burn 60 triệu/tháng. Runway? Nếu mở rộng làm burn 80?
      a: 'Runway = 8 tháng; với burn 80: 6 tháng.'
  - id: "m06-practice_questions-12"
    title: "Câu hỏi luyện tập: Hải Long N: tính DSCR nếu gốc phải trả 400, EBITDA 1.500, thuế 192, capex duy trì 300, lãi 240."
    tags: ["câu", "hỏi", "luyện", "tập", "hải", "long", "tính", "dscr", "nếu", "gốc", "phải", "trả"]
    text: |-
      q: 'Hải Long N: tính DSCR nếu gốc phải trả 400, EBITDA 1.500, thuế 192, capex duy trì 300, lãi 240.'
      a: (1.500 - 192 - 300)/(400 + 240) = 1.008/640 = 1,575.
  - id: "m06-practice_questions-13"
