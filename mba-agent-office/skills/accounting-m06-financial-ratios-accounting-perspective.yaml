      result: ROE tăng 2,3 điểm nhờ AT và EM chứ không nhờ biên; lợi nhuận dương mà CFO -432; cần siết DSO, giảm tồn chậm, tăng DPO trong điều khoản, tái cơ cấu vay ngắn thành dài; python đã verify cân và khớp.
  - id: "m06-worked_examples-2"
    title: "Ví dụ có lời giải: FIFO và bình quân gia quyền khi giá tăng và giảm"
    tags: ["ví", "dụ", "có", "lời", "giải", "fifo", "và", "bình", "quân", "gia", "quyền", "khi"]
    text: |-
      name: FIFO và bình quân gia quyền khi giá tăng và giảm
      inputs:
        open_qty: 100
        open_price: 10
        buy_qty: 100
        buy_price:
        - 12
        - 8
        qty_sold: 120
        sell_price: 20
      steps:
      - Doanh thu = 120 x 20 = 2.400.
      - 'Giá tăng (12): FIFO = 100 x 10 + 20 x 12 = 1.240, GM 48,3%, tồn cuối 960; BQGQ = 120 x 11 = 1.320, GM 45,0%, tồn cuối 880.'
      - 'Giá giảm (8): FIFO = 100 x 10 + 20 x 8 = 1.160, GM 51,7%; BQGQ = 120 x 9 = 1.080, GM 55,0%.'
      result: Giá tăng FIFO cho GM cao hơn; giá giảm bình quân cho GM cao hơn. Không so GM giữa hai doanh nghiệp khi chưa kiểm tra giá xuất kho.
