    text: |-
      Nếu DIO tăng 30% so cùng kỳ thì kiểm tra SKU chậm, dự phòng giảm giá HTK và chính sách mua.
  - id: "m06-decision_rules-7"
    title: "Quy tắc quyết định: Nếu CCC tăng thì tách DIO, DSO, DPO, rồi quy đổi từng ngày ra tiền bằng doanh thu hoặc giá vốn một …"
    tags: ["quy", "tắc", "quyết", "định", "nếu", "ccc", "tăng", "thì", "tách", "dio", "dso", "dpo"]
    text: |-
      Nếu CCC tăng thì tách DIO, DSO, DPO, rồi quy đổi từng ngày ra tiền bằng doanh thu hoặc giá vốn một ngày.
  - id: "m06-decision_rules-8"
    title: "Quy tắc quyết định: Nếu ICR dưới 1,5 và đang giảm thì cờ đỏ; nếu ICR dưới 1 thì doanh nghiệp đang vay mới để trả lãi cũ."
    tags: ["quy", "tắc", "quyết", "định", "nếu", "icr", "dưới", "và", "đang", "giảm", "thì", "cờ"]
    text: |-
      Nếu ICR dưới 1,5 và đang giảm thì cờ đỏ; nếu ICR dưới 1 thì doanh nghiệp đang vay mới để trả lãi cũ.
  - id: "m06-decision_rules-9"
    title: "Quy tắc quyết định: Nếu ICR đẹp nhưng có nhiều vay ngắn hạn đáo hạn hoặc gốc lớn thì tính DSCR và lịch trả nợ thay vì t…"
    tags: ["quy", "tắc", "quyết", "định", "nếu", "icr", "đẹp", "nhưng", "có", "nhiều", "vay", "ngắn"]
    text: |-
      Nếu ICR đẹp nhưng có nhiều vay ngắn hạn đáo hạn hoặc gốc lớn thì tính DSCR và lịch trả nợ thay vì tin ICR.
  - id: "m06-decision_rules-10"
    title: "Quy tắc quyết định: Nếu DSCR dưới 1,0 thì dòng tiền không đủ trả nợ: đề xuất tái cơ cấu kỳ hạn, giảm chi, tăng vốn chủ."
    tags: ["quy", "tắc", "quyết", "định", "nếu", "dscr", "dưới", "thì", "dòng", "tiền", "không", "đủ"]
    text: |-
      Nếu DSCR dưới 1,0 thì dòng tiền không đủ trả nợ: đề xuất tái cơ cấu kỳ hạn, giảm chi, tăng vốn chủ.
  - id: "m06-decision_rules-11"
    title: "Quy tắc quyết định: Nếu ROE tăng mà Net Margin không đổi và EM tăng thì ROE nhờ đòn bẩy: kiểm tra ICR, Cash Ratio và kh…"
    tags: ["quy", "tắc", "quyết", "định", "nếu", "roe", "tăng", "mà", "net", "margin", "không", "đổi"]
    text: |-
      Nếu ROE tăng mà Net Margin không đổi và EM tăng thì ROE nhờ đòn bẩy: kiểm tra ICR, Cash Ratio và không khen thưởng thành tích đó.
  - id: "m06-decision_rules-12"
    title: "Quy tắc quyết định: Nếu hai doanh nghiệp cùng ROE thì dùng DuPont để so nguồn (biên, vòng quay, đòn bẩy) và rủi ro."
    tags: ["quy", "tắc", "quyết", "định", "nếu", "hai", "doanh", "nghiệp", "cùng", "roe", "thì", "dùng"]
    text: |-
      Nếu hai doanh nghiệp cùng ROE thì dùng DuPont để so nguồn (biên, vòng quay, đòn bẩy) và rủi ro.
  - id: "m06-decision_rules-13"
    title: "Quy tắc quyết định: Nếu so Gross Margin hoặc Current Ratio giữa hai doanh nghiệp thì kiểm tra chính sách giá xuất kho v…"
