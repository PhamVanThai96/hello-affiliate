id: accounting-report-templates
title: "Kế toán — mẫu báo cáo/bảng biểu"
summary: "Cấu trúc chung và các mẫu báo cáo kế toán."
agents: ["accountant"]
order: 61
when: ["__chi_tra_cuu_bang_skill_search__"]
sections:
  - id: "tpl-cau-truc-chung"
    title: "Mẫu báo cáo — cấu trúc chung"
    tags: ["mẫu", "báo", "cáo", "cấu", "trúc"]
    text: |-
      - 1. Tóm tắt điều hành (kết luận + con số chính + khuyến nghị trong 3-5 dòng)
      - 2. Bối cảnh và dữ liệu đầu vào (kèm nhãn VERIFIED/GIẢ ĐỊNH/CHƯA KIỂM CHỨNG)
      - 3. Phương pháp, chế độ kế toán và công thức sử dụng (và vì sao chọn)
      - 4. Tính toán/bút toán từng bước (bảng)
      - 5. Kiểm tra cân đối (Nợ = Có, A = L + E, CFS khớp tiền) và phân tích độ nhạy/kịch bản
      - 6. Diễn giải ý nghĩa kinh doanh và so sánh benchmark
      - 7. Phương án và khuyến nghị (ưu/nhược, điều kiện thay đổi khuyến nghị)
      - 8. Rủi ro, giả định, giới hạn; nhắc xác nhận văn bản hiện hành và kế toán thuế; nguồn và ngày tra cứu
      - 9. Bước hành động tiếp theo
