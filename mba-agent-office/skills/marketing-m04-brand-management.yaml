      metric: Thời gian xây brand mạnh
      value: 5-10 năm
      context: Nguồn nêu đầu tư lớn và dài hạn
      confidence: medium
  - id: "m04-pitfalls-1"
    title: "Lỗi thường gặp: Nhầm brand với logo: sửa nhận diện hình ảnh mà không sửa trải nghiệm thì brand không đổi."
    tags: ["lỗi", "thường", "gặp", "nhầm", "brand", "với", "logo", "sửa", "nhận", "diện", "hình", "ảnh"]
    text: |-
      Nhầm brand với logo: sửa nhận diện hình ảnh mà không sửa trải nghiệm thì brand không đổi.
  - id: "m04-pitfalls-2"
    title: "Lỗi thường gặp: Nhảy thẳng vào thiết kế logo/chạy quảng cáo, bỏ audit và strategy."
    tags: ["lỗi", "thường", "gặp", "nhảy", "thẳng", "vào", "thiết", "kế", "logo", "chạy", "quảng", "cáo"]
    text: |-
      Nhảy thẳng vào thiết kế logo/chạy quảng cáo, bỏ audit và strategy.
  - id: "m04-pitfalls-3"
    title: "Lỗi thường gặp: Thiếu nhất quán giữa các touchpoint (kênh, nhân viên, bao bì) - phá lời hứa thương hiệu."
    tags: ["lỗi", "thường", "gặp", "thiếu", "nhất", "quán", "giữa", "các", "touchpoint", "kênh", "nhân", "viên"]
    text: |-
      Thiếu nhất quán giữa các touchpoint (kênh, nhân viên, bao bì) - phá lời hứa thương hiệu.
  - id: "m04-pitfalls-4"
    title: "Lỗi thường gặp: Hứa hẹn trong quảng cáo vượt xa trải nghiệm thực tế."
    tags: ["lỗi", "thường", "gặp", "hứa", "hẹn", "trong", "quảng", "cáo", "vượt", "xa", "trải", "nghiệm"]
    text: |-
      Hứa hẹn trong quảng cáo vượt xa trải nghiệm thực tế.
  - id: "m04-pitfalls-5"
    title: "Lỗi thường gặp: Xây từ trên xuống: làm cộng đồng/loyalty khi chưa có awareness và ý nghĩa rõ (bỏ qua thứ tự CBBE)."
    tags: ["lỗi", "thường", "gặp", "xây", "từ", "trên", "xuống", "làm", "cộng", "đồng", "loyalty", "khi"]
    text: |-
      Xây từ trên xuống: làm cộng đồng/loyalty khi chưa có awareness và ý nghĩa rõ (bỏ qua thứ tự CBBE).
  - id: "m04-pitfalls-6"
    title: "Lỗi thường gặp: Mở rộng thương hiệu quá đà (over-extension) làm loãng ý nghĩa; mở nhiều sub-brand khi chưa có maste…"
    tags: ["lỗi", "thường", "gặp", "mở", "rộng", "thương", "hiệu", "quá", "đà", "over", "extension", "làm"]
    text: |-
      Mở rộng thương hiệu quá đà (over-extension) làm loãng ý nghĩa; mở nhiều sub-brand khi chưa có master brand mạnh.
  - id: "m04-pitfalls-7"
    title: "Lỗi thường gặp: Brand aging: không làm mới theo thế hệ khách mới (Kodak, Nokia)."
    tags: ["lỗi", "thường", "gặp", "brand", "aging", "không", "làm", "mới", "theo", "thế", "hệ", "khách"]
    text: |-
      Brand aging: không làm mới theo thế hệ khách mới (Kodak, Nokia).
  - id: "m04-pitfalls-8"
    title: "Lỗi thường gặp: Rebrand thiếu change management, đi xa lõi khiến khách cũ phản đối (bài học Vinamilk)."
    tags: ["lỗi", "thường", "gặp", "rebrand", "thiếu", "change", "management", "đi", "xa", "lõi", "khiến", "khách"]
    text: |-
      Rebrand thiếu change management, đi xa lõi khiến khách cũ phản đối (bài học Vinamilk).
  - id: "m04-pitfalls-9"
    title: "Lỗi thường gặp: Quá phụ thuộc đánh giá sao cảm tính (như bảng ⭐ Vinamilk trong nguồn) mà không có số liệu."
    tags: ["lỗi", "thường", "gặp", "quá", "phụ", "thuộc", "đánh", "giá", "sao", "cảm", "tính", "như"]
    text: |-
      Quá phụ thuộc đánh giá sao cảm tính (như bảng ⭐ Vinamilk trong nguồn) mà không có số liệu.
  - id: "m04-pitfalls-10"
    title: "Lỗi thường gặp: Kỳ vọng đo ROI brand chính xác; thực tế chỉ có proxy (premium, awareness, NPS, repeat)."
    tags: ["lỗi", "thường", "gặp", "kỳ", "vọng", "đo", "roi", "brand", "chính", "xác", "thực", "tế"]
    text: |-
      Kỳ vọng đo ROI brand chính xác; thực tế chỉ có proxy (premium, awareness, NPS, repeat).
  - id: "m04-pitfalls-11"
    title: "Lỗi thường gặp: Chưa bảo hộ nhãn hiệu - nguy cơ bị đăng ký trước hoặc đạo nhái."
    tags: ["lỗi", "thường", "gặp", "chưa", "bảo", "hộ", "nhãn", "hiệu", "nguy", "cơ", "bị", "đăng"]
    text: |-
      Chưa bảo hộ nhãn hiệu - nguy cơ bị đăng ký trước hoặc đạo nhái.
  - id: "m04-pitfalls-12"
    title: "Lỗi thường gặp: Bỏ qua khủng hoảng: một scandal có thể hủy nhiều năm xây dựng; cần quy trình sẵn."
    tags: ["lỗi", "thường", "gặp", "bỏ", "qua", "khủng", "hoảng", "một", "scandal", "có", "thể", "hủy"]
    text: |-
      Bỏ qua khủng hoảng: một scandal có thể hủy nhiều năm xây dựng; cần quy trình sẵn.
  - id: "m04-pitfalls-13"
    title: "Lỗi thường gặp: Số liệu trong nguồn có sai lệch/chưa kiểm chứng (xem ghi chú ở case_lessons): không trích dùng như …"
