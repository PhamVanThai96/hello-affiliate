    text: |-
      Nếu người dùng đòi 'kịch bản nào khả năng cao nhất' thì giải thích scenario là hợp lý, không phải xác suất; có thể dùng trọng số chủ quan nhưng ghi rõ giả định và chạy sensitivity.
  - id: "m07-decision_rules-13"
    title: "Quy tắc quyết định: Nếu xảy ra cú sốc ngoài kịch bản (Black Swan) thì rà lại ngay bộ kịch bản và đối chiếu runway, đa d…"
