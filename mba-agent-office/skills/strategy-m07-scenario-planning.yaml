    title: "Mẫu Excel/Sheets: Bảng xếp hạng yếu tố"
    tags: ["mẫu", "excel", "sheets", "bảng", "xếp", "hạng", "yếu", "tố"]
    text: |-
      name: Bảng xếp hạng yếu tố
      layout: Cột A yếu tố; B Tác động (1-5); C Bất định (1-5); D = B*C; sắp xếp giảm dần; tô màu D>=16.
  - id: "m07-excel_google_sheets_templates-2"
    title: "Mẫu Excel/Sheets: Ma trận payoff và tiêu chí chọn"
    tags: ["mẫu", "excel", "sheets", "ma", "trận", "payoff", "và", "tiêu", "chí", "chọn"]
    text: |-
      name: Ma trận payoff và tiêu chí chọn
      layout: 'Hàng = phương án, cột = KB1-KB4; hàng 7 trọng số w. Cột F: =SUMPRODUCT(B2:E2,$B$7:$E$7) (EV); G: =MIN(B2:E2) (min); bảng regret: =MAX(B$2:B$5)-B2; H: MAX regret theo hàng; I: =COUNTIF(B2:E2,">=0")/4 (độ vững).'
