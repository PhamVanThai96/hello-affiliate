    tags: ["quy", "tắc", "quyết", "định", "nếu", "kịch", "bản", "dẫn", "tới", "cùng", "một", "chiến"]
    text: |-
      Nếu 4 kịch bản dẫn tới cùng một chiến lược thì trục chưa đủ khác biệt, chọn lại trục.
  - id: "m07-decision_rules-6"
    title: "Quy tắc quyết định: Nếu một phương án có kết quả dưới ngưỡng sống sót (mất khả năng thanh toán) ở bất kỳ kịch bản nào t…"
