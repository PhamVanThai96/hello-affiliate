    text: |-
      Dùng số liệu minh họa (giá giảm 20-40%, 70% doanh thu) như dự báo thực.
  - id: "m07-sme_vn_guidance-1"
    title: "Lưu ý SME Việt Nam: Bản rút gọn nửa ngày (procedure m07_lean_scenario_sme) đủ cho đa số SME; không cần tư vấn đắt tiền.…"
    tags: ["lưu", "sme", "việt", "nam", "bản", "rút", "gọn", "nửa", "ngày", "procedure", "m07_lean_scenario_sme", "đủ"]
    text: |-
      Bản rút gọn nửa ngày (procedure m07_lean_scenario_sme) đủ cho đa số SME; không cần tư vấn đắt tiền. Cần xác nhận lại nếu quyết định liên quan vay lớn hoặc đầu tư trên 1 tỷ VNĐ (nên thêm mô hình tài chính chi tiết).
  - id: "m07-sme_vn_guidance-2"
    title: "Lưu ý SME Việt Nam: Yếu tố bất định thường gặp với SME VN: lãi suất cho vay và chính sách tín dụng NHNN; tỷ giá USD/VND…"
    tags: ["lưu", "sme", "việt", "nam", "yếu", "tố", "bất", "định", "thường", "gặp", "với", "vn"]
    text: |-
      Yếu tố bất định thường gặp với SME VN: lãi suất cho vay và chính sách tín dụng NHNN; tỷ giá USD/VND (XNK); thuế quan/luật xuất xứ của thị trường xuất khẩu (Mỹ, EU); cước container; chính sách phí và thuật toán của sàn TMĐT (Shopee, TikTok Shop, Lazada); giá thuê mặt bằng; giá nguyên liệu; quy định pháp lý ngành (thuế hộ kinh doanh, hóa đơn điện tử). Cần cập nhật từ nguồn chính thức khi áp dụng.
  - id: "m07-sme_vn_guidance-3"
    title: "Lưu ý SME Việt Nam: Nguồn dữ liệu miễn phí cho tín hiệu: cổng thông tin NHNN, Tổng cục Thống kê, Google Trends, báo cáo…"
    tags: ["lưu", "sme", "việt", "nam", "nguồn", "dữ", "liệu", "miễn", "phí", "cho", "tín", "hiệu"]
    text: |-
      Nguồn dữ liệu miễn phí cho tín hiệu: cổng thông tin NHNN, Tổng cục Thống kê, Google Trends, báo cáo cước tàu (Drewry, Freightos), tin hiệp hội ngành (VASEP, VIFOREST), số liệu nội bộ (đơn hàng, công nợ, tồn kho). Cần xác nhận quyền truy cập từng nguồn.
  - id: "m07-sme_vn_guidance-4"
    title: "Lưu ý SME Việt Nam: Công cụ: Google Sheets/Excel đủ để làm ma trận payoff, EV, regret, runway; Notion/Miro cho workshop…"
    tags: ["lưu", "sme", "việt", "nam", "công", "cụ", "google", "sheets", "excel", "đủ", "để", "làm"]
    text: |-
      Công cụ: Google Sheets/Excel đủ để làm ma trận payoff, EV, regret, runway; Notion/Miro cho workshop; bảng tín hiệu một trang dán trên dashboard theo dõi tháng. Chi phí gần như 0 (cần xác nhận gói bản quyền nếu dùng Miro bản trả phí).
  - id: "m07-sme_vn_guidance-5"
    title: "Lưu ý SME Việt Nam: Tập trung vào 'hành động không hối tiếc': tăng dự phòng tiền mặt, đa dạng khách hàng/nhà cung cấp, …"
    tags: ["lưu", "sme", "việt", "nam", "tập", "trung", "vào", "hành", "động", "không", "hối", "tiếc"]
    text: |-
      Tập trung vào 'hành động không hối tiếc': tăng dự phòng tiền mặt, đa dạng khách hàng/nhà cung cấp, hợp đồng linh hoạt (thuê ngắn hạn, option gia hạn), giảm phụ thuộc một nền tảng.
  - id: "m07-sme_vn_guidance-6"
    title: "Lưu ý SME Việt Nam: Đừng thuê mặt bằng/vay dài hạn lãi thả nổi chỉ dựa trên kịch bản thuận lợi; ghi rõ kịch bản xấu nhấ…"
