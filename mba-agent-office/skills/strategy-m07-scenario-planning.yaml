  - id: "m07-case_lessons-1"
    title: "Bài học case: Royal Dutch Shell và khủng hoảng dầu mỏ 1973"
    tags: ["bài", "học", "case", "royal", "dutch", "shell", "và", "khủng", "hoảng", "dầu", "mỏ", "1973"]
    text: |-
      name: Royal Dutch Shell và khủng hoảng dầu mỏ 1973
      type: success
      setup: |
        Đầu thập niên 1970, ngành dầu tin giá dầu ổn định quanh 2-3 USD/thùng. Nhóm Pierre Wack xây kịch bản với hai yếu tố bất định (phản ứng của OPEC; nhu cầu dầu toàn cầu), trong đó có kịch bản OPEC kiểm soát giá.
      key_calculations:
      - 'Giá dầu tăng từ khoảng 3 lên khoảng 12 USD/thùng (xấp xỉ +300-400% tùy cách tính; nguồn nêu +400%): (12-3)/3 = 300% mức tăng tuyệt đối.'
      - Lợi thế phản ứng sớm 6-12 tháng so với đối thủ (nguồn mô tả).
      lesson: |
        Mục đích không phải đoán chính xác cú sốc (chiến tranh Yom Kippur) mà đã suy nghĩ về nó trước; khi xảy ra, Shell phản ứng nhanh. Kịch bản thay đổi 'mô hình tinh thần' của lãnh đạo.
      data_reliability: illustrative
  - id: "m07-case_lessons-2"
    title: "Bài học case: Maersk và kịch bản hậu COVID (2020)"
    tags: ["bài", "học", "case", "maersk", "và", "kịch", "bản", "hậu", "covid", "2020"]
    text: |-
      name: Maersk và kịch bản hậu COVID (2020)
      type: success
      setup: |
        Hai trục: phục hồi kinh tế (nhanh/chậm) x toàn cầu hóa (tiếp tục/phân mảnh). Chiến lược robust: chuyển từ hãng tàu sang nhà cung cấp logistics tích hợp; mua LF Logistics (khoảng 3,6 tỷ USD, 2022) và Senator International.
      key_calculations:
      - 'Logic robust: dù toàn cầu hóa hay không, nhu cầu logistics tồn tại; đa dạng khỏi cước tàu giảm rủi ro khi cước hạ (2023).'
      lesson: |
        Chiến lược đa dạng hóa dịch vụ chạy qua nhiều kịch bản. Giới hạn: không dự đoán khủng hoảng Biển Đỏ 2024 (Black Swan), cho thấy cần rà soát kịch bản định kỳ.
      data_reliability: illustrative
  - id: "m07-case_lessons-3"
    title: "Bài học case: Starbucks tại Trung Quốc (2010s)"
    tags: ["bài", "học", "case", "starbucks", "tại", "trung", "quốc", "2010s"]
    text: |-
      name: Starbucks tại Trung Quốc (2010s)
      type: success
      setup: Hai trục tăng trưởng kinh tế (nhanh/chậm) x rủi ro chính trị (ổn định/biến động); chiến lược robust 'premium experience'.
      key_calculations:
      - 'Không có số liệu kịch bản công khai; chỉ minh họa logic robust: khách chịu trả cho trải nghiệm cao cấp ở mọi kịch bản.'
      lesson: |
        Chiến lược định vị chạy tốt ở nhiều kịch bản vĩ mô. Hạn chế: không lường trước bùng nổ giao đồ ăn nên phải hợp tác nền tảng (Meituan). Dùng như ví dụ minh họa phương pháp, không coi là tài liệu nội bộ của Starbucks.
      data_reliability: unverified
  - id: "m07-case_lessons-4"
    title: "Bài học case: Công ty BĐS hạng trung Việt Nam 2025-2030 (minh họa)"
    tags: ["bài", "học", "case", "công", "ty", "bđs", "hạng", "trung", "việt", "nam", "2025", "2030"]
    text: |-
      name: Công ty BĐS hạng trung Việt Nam 2025-2030 (minh họa)
      type: sme
      setup: Trục lãi suất (6-8% vs 10-14%) x chính sách (thông thoáng vs siết chặt) cho 4 kịch bản Bùng nổ, Chọn lọc, Đóng băng từ từ, Khủng hoảng.
      key_calculations:
      - Giá +20-30% ở KB1; giá -20-40% ở KB4 (con số định tính của nguồn, tham khảo giai đoạn 2022-2023).
      - 'Wind-tunnel: ''Đa dạng bán + cho thuê + dịch vụ'' đạt ✅ ở cả 4 kịch bản = robust; ''Mở rộng nhanh vay nhiều'' ❌ ở KB4.'
      lesson: Chiến lược dòng tiền đa nguồn sống sót cả khi khủng hoảng; chiến lược đòn bẩy cao thắng lớn ở một kịch bản nhưng phá sản ở kịch bản xấu.
      data_reliability: illustrative
  - id: "m07-case_lessons-5"
    title: "Bài học case: DN xuất nhập khẩu 2025-2030 (minh họa)"
    tags: ["bài", "học", "case", "dn", "xuất", "nhập", "khẩu", "2025", "2030", "minh", "họa"]
    text: |-
      name: DN xuất nhập khẩu 2025-2030 (minh họa)
      type: sme
      setup: Quyết định đa dạng hóa nguồn cung/thị trường hay tập trung thị trường truyền thống; trục chính sách thương mại (tự do/bảo hộ) x chi phí logistics (ổn định/tăng vọt).
      key_calculations:
      - Nếu bảo hộ cực đoan, có thể mất tới 70% doanh thu thị trường chính nếu thiếu chứng chỉ xuất xứ mới (con số minh họa).
      - 'Dự phòng tiền mặt 6 tháng vận hành; tín hiệu: cước tàu tăng, thay đổi thuế quan đối tác, tỷ giá biến động >5% ngắn hạn.'
      lesson: 'Robust chung: đa dạng nhà cung cấp, số hóa quản trị kho vận, dự phòng tiền mặt; họp Ban chỉ đạo kịch bản hằng tháng và kích hoạt phương án khi tín hiệu xuất hiện.'
      data_reliability: illustrative
  - id: "m07-worked_examples-1"
    title: "Ví dụ có lời giải: we_cafe_expansion — Chuỗi cà phê 3 chi nhánh: có nên mở chi nhánh thứ 4 (vay 70%) không?"
    tags: ["ví", "dụ", "có", "lời", "giải", "we_cafe_expansion", "chuỗi", "cà", "phê", "chi", "nhánh", "nên"]
    text: |-
      id: we_cafe_expansion
      title: 'Chuỗi cà phê 3 chi nhánh: có nên mở chi nhánh thứ 4 (vay 70%) không?'
      context: |
        Chuỗi 'Cà Phê Hẻm' tại TP.HCM có 3 chi nhánh; chủ cân nhắc mở chi nhánh 4 (đầu tư khoảng 1,5 tỷ VNĐ) trong 3 năm. Horizon 3 năm. Hai trục bất định: sức mua F&B (hồi phục mạnh/yếu) x chi phí đầu vào + thuê mặt bằng (ổn định/tăng mạnh). Bốn kịch bản: KB1 'Hồi sinh' (sức mua mạnh, chi phí ổn), KB2 'Chọn lọc' (sức mua mạnh, chi phí tăng), KB3 'Áp lực chi phí' (sức mua yếu, chi phí ổn), KB4 'Đóng băng' (sức mua yếu, chi phí tăng). (Số liệu minh họa.)
      inputs:
        payoff_trieu_vnd_loi_nhuan_rong_3_nam:
          mo_cn4_vay_70:
          - 900
          - 300
          - -200
          - -900
          mo_cn4_von_tu_co:
          - 600
          - 350
          - 50
          - -250
          nang_cap_3_cn_va_delivery:
          - 400
          - 320
          - 150
          - 60
          giu_tien_mat:
          - 50
          - 50
          - 50
          - 50
        trong_so_ky_bao:
        - 0.3
        - 0.4
        - 0.2
        - 0.1
        runway_kb4:
          cash: 480
          outflow: 120
          inflow: 90
      steps:
      - Trọng số chủ quan (đã chuẩn hóa) w = [0.3, 0.4, 0.2, 0.1] (nhóm đồng thuận).
      - EV vay 70% = 0.3x900 + 0.4x300 + 0.2x(-200) + 0.1x(-900) = 270+120-40-90 = 260.
      - EV vốn tự có = 180+140+10-25 = 305. EV nâng cấp = 120+128+30+6 = 284. EV giữ tiền = 50.
      - 'Maximin: min mỗi phương án = -900, -250, 60, 50 -> chọn Nâng cấp (60).'
      - 'Regret: max cột = 900, 350, 150, 60; regret lớn nhất mỗi hàng = 960, 310, 500, 850 -> minimax regret chọn Mở CN4 vốn tự có (310).'
      - 'Độ vững (T=0): vay 70% = 0.5; vốn tự có = 0.75; nâng cấp = 1.0; giữ tiền = 1.0.'
      - 'Runway KB4 hiện tại (nếu giữ nguyên, burn 120-90=30): 480/30 = 16 tháng; nếu mở CN4 vay 70%, outflow tăng và runway ngắn đi nhiều (cần dòng tiền nhà vay).'
      result: |
        Ba tiêu chí không đồng thuận (EV chọn vốn tự có 305; maximin chọn nâng cấp 60; regret chọn vốn tự có 310). Đề xuất: không vay 70% (không robust, âm lớn ở KB3-KB4); làm ngay phần robust (nâng cấp 3 chi nhánh + delivery), chuẩn bị chi nhánh 4 bằng vốn tự có như phương án contingent, kích hoạt khi tín hiệu: doanh thu cùng cửa hàng +10% trong 3 tháng liên tiếp, giá thuê khu vực không tăng quá 5%, lãi suất vay ổn định.
  - id: "m07-worked_examples-2"
    title: "Ví dụ có lời giải: we_wood_export — Xưởng gỗ xuất khẩu Bình Dương: tập trung Mỹ, đa dạng thị trường hay tối ưu chi phí"
    tags: ["ví", "dụ", "có", "lời", "giải", "we_wood_export", "xưởng", "gỗ", "xuất", "khẩu", "bình", "dương"]
    text: |-
      id: we_wood_export
      title: 'Xưởng gỗ xuất khẩu Bình Dương: tập trung Mỹ, đa dạng thị trường hay tối ưu chi phí'
      context: |
        Xưởng gỗ nội thất, doanh thu 60 tỷ VNĐ/năm, 70% xuất Mỹ. Hai trục: thuế quan/luật xuất xứ Mỹ (thấp/cao) x cước container (ổn định/tăng vọt). KB1 'Thông thoáng', KB2 'Pháo đài' (thuế cao, cước ổn), KB3 'Bão cước' (thuế thấp, cước tăng), KB4 'Sụp đổ chuỗi' (cả hai xấu). Số liệu minh họa.
      inputs:
        driving_forces_I_U:
          thue_quan_my:
          - 5
          - 5
          cuoc_container:
          - 4
          - 5
          luat_xuat_xu:
          - 5
          - 4
          ty_gia:
          - 4
          - 4
          chung_chi_FSC_EUDR:
          - 4
          - 3
          gia_go_nhap:
          - 3
          - 3
          nhan_cong:
          - 3
          - 2
          do_thi_hoa:
          - 2
          - 1
        payoff_ty_vnd_npv_3_nam:
          tap_trung_my_mo_rong:
          - 8
          - 5
          - 2
          - -4
          da_dang_EU_Nhat_noi_dia:
          - 6
          - 5
          - 4
          - 1
          toi_uu_chi_phi_giu_thi_truong:
          - 7
          - 4
          - -1
          - -6
        w:
        - 0.25
        - 0.35
        - 0.3
        - 0.1
      steps:
      - 'Điểm S=IxU: thuế quan Mỹ 25; cước container 20; luật xuất xứ 20; tỷ giá 16; chứng chỉ 12; giá gỗ nhập 9; nhân công 6; đô thị hóa 2.'
      - 'Chọn trục: thuế quan Mỹ (25) và cước container (20). Luật xuất xứ (20) tương quan mạnh với thuế quan nên gộp vào câu chuyện KB2/KB4, không làm trục thứ ba.'
      - 'EV: tập trung Mỹ = 0.25x8+0.35x5+0.3x2+0.1x(-4) = 2+1.75+0.6-0.4 = 3.95; đa dạng = 1.5+1.75+1.2+0.1 = 4.55; tối ưu chi phí = 1.75+1.4-0.3-0.6 = 2.25.'
      - 'Maximin: -4, 1, -6 -> chọn Đa dạng (1).'
      - 'Regret: max cột = 8, 5, 4, 1; regret lớn nhất = 5 (tập trung Mỹ), 2 (đa dạng), 7 (tối ưu chi phí) -> chọn Đa dạng (2).'
      - 'Cả ba tiêu chí đồng thuận: Đa dạng EU/Nhật/nội địa là robust.'
      result: |
        Làm ngay: xin chứng chỉ (FSC, truy xuất nguồn gốc), chào hàng EU/Nhật, mở kênh nội địa, giữ dự phòng tiền mặt 6 tháng vận hành. Contingent: nếu thuế quan Mỹ tăng và cước +30% 4 tuần liền thì giảm tồn kho nguyên liệu, chuyển đơn sang thị trường phụ. Tín hiệu: thông báo thuế quan/điều tra chống lẩn tránh, cước tàu hằng tuần, tỷ giá biến động >5% ngắn hạn.
  - id: "m07-worked_examples-3"
    title: "Ví dụ có lời giải: we_online_shop — Shop online TikTok Shop/Shopee: quỹ dự phòng và tín hiệu kích hoạt"
    tags: ["ví", "dụ", "có", "lời", "giải", "we_online_shop", "shop", "online", "tiktok", "shopee", "quỹ", "dự"]
    text: |-
      id: we_online_shop
      title: 'Shop online TikTok Shop/Shopee: quỹ dự phòng và tín hiệu kích hoạt'
      context: |
        Shop thời trang online doanh thu 500 triệu/tháng; hai trục: chính sách phí sàn (ổn định/tăng mạnh) x chi phí quảng cáo CPC (ổn định/tăng mạnh). Tiền mặt 480 triệu. Quyết định: tăng ngân sách quảng cáo hay xây kênh sở hữu (Zalo OA, website, khách quen)? Số liệu minh họa.
      inputs:
        cash: 480
        burn_kich_ban:
          co_so:
          - 120
          - 90
          xau:
          - 140
          - 60
        signals:
          weights:
          - 3
          - 2
          - 2
          - 1
          present:
          - 1
          - 1
          - 0
          - 1
      steps:
      - 'Cơ sở: outflow 120, inflow 90 -> burn 30; runway = 480/30 = 16 tháng.'
      - 'Kịch bản xấu (phí sàn và CPC cùng tăng): outflow 140, inflow 60 -> burn 80; runway = 480/80 = 6 tháng (đúng ngưỡng nguy hiểm).'
      - 'Tín hiệu: (1) sàn thông báo tăng phí (w=3, có), (2) CPC +20% 3 tuần (w=2, có), (3) tỷ lệ hoàn đơn >15% (w=2, chưa), (4) đối thủ giảm giá mạnh (w=1, có).'
      - SS = (3+2+0+1)/8 = 0.75 >= 0.7 -> kích hoạt phương án contingent.
      result: |
        Phương án contingent: dừng tăng quảng cáo, chuyển 30% ngân sách sang xây danh sách khách quen (Zalo OA, inbox), giảm SKU kém biên lợi nhuận, thương lượng hạn mức tín dụng để nâng runway lên hơn 9 tháng. Hành động robust làm ngay: giữ dự phòng ít nhất 6 tháng, không phụ thuộc quá 60% doanh thu vào một sàn.
  - id: "m07-worked_examples-4"
    title: "Ví dụ có lời giải: we_signal_score_bds — Điểm tín hiệu nhiều nguồn: BĐS cho thuê/dịch vụ"
    tags: ["ví", "dụ", "có", "lời", "giải", "we_signal_score_bds", "điểm", "tín", "hiệu", "nhiều", "nguồn", "bđs"]
    text: |-
      id: we_signal_score_bds
      title: 'Điểm tín hiệu nhiều nguồn: BĐS cho thuê/dịch vụ'
      context: 'Công ty BĐS nhỏ theo dõi 4 tín hiệu hướng KB4 (Khủng hoảng): trái phiếu DN BĐS vỡ nợ tăng (w=3), lãi suất huy động tăng liên tiếp (w=2), quy định siết tín dụng (w=3), thanh khoản giao dịch giảm 20% (w=2).'
      inputs:
        weights:
        - 3
        - 2
        - 3
        - 2
        signals:
        - 1
        - 1
        - 0
        - 1
      steps:
      - Tử số = 3x1+2x1+3x0+2x1 = 7; Mẫu số = 10; SS = 0.7.
      - 'Ngưỡng kích hoạt 0.7 -> chuyển sang phương án bảo toàn dòng tiền: giảm vay, tăng tỷ trọng cho thuê.'
      result: SS = 0.7; kích hoạt sớm vì chờ thêm tín hiệu thứ 3 (siết tín dụng) có thể đã muộn.
  - id: "m07-practice_questions-1"
    title: "Câu hỏi luyện tập: Phân biệt Scenario Planning và Forecasting trong một câu. Vì sao scenario không gán xác suất?"
    tags: ["câu", "hỏi", "luyện", "tập", "phân", "biệt", "scenario", "planning", "và", "forecasting", "trong", "một"]
    text: |-
      q: Phân biệt Scenario Planning và Forecasting trong một câu. Vì sao scenario không gán xác suất?
      a: Forecasting dự báo MỘT tương lai (có thể xảy ra), scenario xây nhiều tương lai hợp lý để chuẩn bị. Không gán xác suất vì mục tiêu là mở rộng tầm nhìn và tránh tunnel vision; gán xác suất khiến người ta bỏ qua kịch bản xấu nhưng sống còn.
  - id: "m07-practice_questions-2"
    title: "Câu hỏi luyện tập: Tại sao chọn trục là yếu tố 'tác động cao + bất định cao' mà không phải 'tác động cao + bất định th…"
    tags: ["câu", "hỏi", "luyện", "tập", "tại", "sao", "chọn", "trục", "là", "yếu", "tố", "tác"]
    text: |-
      q: Tại sao chọn trục là yếu tố 'tác động cao + bất định cao' mà không phải 'tác động cao + bất định thấp'?
      a: Yếu tố chắc chắn (đô thị hóa) diễn ra giống nhau ở mọi kịch bản, nếu làm trục thì các kịch bản giống nhau. Nó đưa vào nền chung (predetermined). Trục phải là thứ KHÔNG biết hướng nào.
  - id: "m07-practice_questions-3"
    title: "Câu hỏi luyện tập: Chấm 6 yếu tố I,U: A (5,5), B (5,2), C (2,5), D (4,4), E (3,3), F (4,5). Chọn 2 trục."
    tags: ["câu", "hỏi", "luyện", "tập", "chấm", "yếu", "tố", "chọn", "trục"]
    text: |-
      q: 'Chấm 6 yếu tố I,U: A (5,5), B (5,2), C (2,5), D (4,4), E (3,3), F (4,5). Chọn 2 trục.'
      a: S=25,10,10,16,9,20. Hai cao nhất là A (25) và F (20); nếu A và F tương quan mạnh, chọn A và D (16).
  - id: "m07-practice_questions-4"
    title: "Câu hỏi luyện tập: Ma trận payoff (tỷ VNĐ): P1 [10,4,-3], P2 [6,5,2], P3 [3,3,3]. Tính maximin và minimax regret."
    tags: ["câu", "hỏi", "luyện", "tập", "ma", "trận", "payoff", "tỷ", "vnđ", "p1", "10", "p2"]
    text: |-
      q: 'Ma trận payoff (tỷ VNĐ): P1 [10,4,-3], P2 [6,5,2], P3 [3,3,3]. Tính maximin và minimax regret.'
      a: 'Maximin: min = -3, 2, 3 -> chọn P3 (3). Regret: max cột = 10,5,3; regret P1 [0,1,6] max 6; P2 [4,0,1] max 4; P3 [7,2,0] max 7 -> chọn P2 (4).'
  - id: "m07-practice_questions-5"
    title: "Câu hỏi luyện tập: Tính EV của P2 trên nếu trọng số [0.2, 0.5, 0.3]."
    tags: ["câu", "hỏi", "luyện", "tập", "tính", "ev", "của", "p2", "trên", "nếu", "trọng", "số"]
    text: |-
      q: Tính EV của P2 trên nếu trọng số [0.2, 0.5, 0.3].
      a: 0.2x6 + 0.5x5 + 0.3x2 = 1.2+2.5+0.6 = 4.3.
  - id: "m07-practice_questions-6"
    title: "Câu hỏi luyện tập: Cửa hàng có tiền mặt 300 triệu; kịch bản xấu chi 90, thu 40 triệu/tháng. Runway? Có an toàn không?"
    tags: ["câu", "hỏi", "luyện", "tập", "cửa", "hàng", "có", "tiền", "mặt", "300", "triệu", "kịch"]
    text: |-
      q: Cửa hàng có tiền mặt 300 triệu; kịch bản xấu chi 90, thu 40 triệu/tháng. Runway? Có an toàn không?
      a: Burn = 50; runway = 300/50 = 6 tháng; ở ngưỡng nguy hiểm theo quy ước, nên tăng dự phòng hoặc hạn mức vay.
  - id: "m07-practice_questions-7"
    title: "Câu hỏi luyện tập: Hai trục: P(lãi suất cao)=0.5, P(chính sách siết)=0.4. Tính trọng số ô 'lãi suất cao + siết' nếu độ…"
    tags: ["câu", "hỏi", "luyện", "tập", "hai", "trục", "lãi", "suất", "cao", "chính", "sách", "siết"]
    text: |-
      q: 'Hai trục: P(lãi suất cao)=0.5, P(chính sách siết)=0.4. Tính trọng số ô ''lãi suất cao + siết'' nếu độc lập. Vì sao có thể sai?'
      a: 0.5x0.4 = 0.20. Có thể sai vì lãi suất cao và siết tín dụng thường đi cùng nhau (tương quan dương), thực tế ô này khả năng cao hơn 0.2.
  - id: "m07-practice_questions-8"
    title: "Câu hỏi luyện tập: Wind-tunnel là gì và khác contingency planning thế nào?"
    tags: ["câu", "hỏi", "luyện", "tập", "wind", "tunnel", "là", "gì", "và", "khác", "contingency", "planning"]
    text: |-
      q: Wind-tunnel là gì và khác contingency planning thế nào?
      a: 'Wind-tunnel thử mọi phương án trong mọi kịch bản để chọn robust; contingency là kế hoạch B sau khi đã chọn A. Scenario cho ra cả hai: robust (làm ngay) và contingent (chờ tín hiệu).'
  - id: "m07-practice_questions-9"
    title: "Câu hỏi luyện tập: Điểm tín hiệu: weights [4,3,2,1], signals [1,0,1,0]. Có kích hoạt (ngưỡng 0.7)?"
    tags: ["câu", "hỏi", "luyện", "tập", "điểm", "tín", "hiệu", "weights", "signals", "có", "kích", "hoạt"]
    text: |-
      q: 'Điểm tín hiệu: weights [4,3,2,1], signals [1,0,1,0]. Có kích hoạt (ngưỡng 0.7)?'
      a: (4+0+2+0)/10 = 0.6 < 0.7 -> chuẩn bị nguồn lực, chưa kích hoạt.
  - id: "m07-practice_questions-10"
    title: "Câu hỏi luyện tập: Nêu 3 giới hạn của scenario planning và cách giảm."
    tags: ["câu", "hỏi", "luyện", "tập", "nêu", "giới", "hạn", "của", "scenario", "planning", "và", "cách"]
    text: |-
      q: Nêu 3 giới hạn của scenario planning và cách giảm.
      a: (1) Chủ quan -> workshop đa dạng và người phản biện. (2) Không xác suất -> dùng trọng số chủ quan có kiểm tra sensitivity. (3) Black Swan -> giữ khả năng chịu sốc chung (tiền mặt, đa dạng) và rà kịch bản 6-12 tháng.
