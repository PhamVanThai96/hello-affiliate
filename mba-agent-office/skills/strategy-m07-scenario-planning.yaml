    text: |-
      Nếu EV chọn phương án A, maximin chọn B, regret chọn C thì đưa ba kết quả cho chủ DN: lựa chọn phụ thuộc khẩu vị rủi ro; DN mỏng vốn nghiêng về maximin/regret, DN dư vốn có thể nghiêng về EV.
  - id: "m07-decision_rules-8"
    title: "Quy tắc quyết định: Nếu runway ở kịch bản xấu nhất dưới 6 tháng thì ưu tiên tạo dự phòng tiền mặt/hạn mức tín dụng trướ…"
    tags: ["quy", "tắc", "quyết", "định", "nếu", "runway", "kịch", "bản", "xấu", "nhất", "dưới", "tháng"]
