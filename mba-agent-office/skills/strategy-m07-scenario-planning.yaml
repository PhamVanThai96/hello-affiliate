sections:
  - id: "m07-tong-quan"
    title: "Tổng quan m07"
    tags: ["m07", "lập", "kế", "hoạch", "theo", "kịch", "bản", "scenario", "planning"]
    text: |-
      Lập kế hoạch theo kịch bản (Scenario Planning) — module m07

      Mục đích: Giúp doanh nghiệp ra quyết định chiến lược dài hạn khi tương lai bất định: thay vì dự báo một con số, xây 3-4 câu chuyện tương lai hợp lý từ hai yếu tố vừa quan trọng vừa khó đoán nhất, thử từng phương án chiến lược trong từng kịch bản (wind-tunnel) để tìm chiến lược vững (robust), rồi đặt hệ thống tín hiệu sớm để biết kịch bản nào đang thành hình và khi nào kích hoạt phương án dự phòng (contingent).

      Dùng khi:
      - Quyết định đầu tư/mở rộng dài hạn (5-10 năm) hoặc khó đảo ngược: mở chi nhánh, xây nhà máy, vay lớn, mua đất, vào thị trường mới.
      - Ngành đang bị đảo lộn (disruption) hoặc phụ thuộc biến số vĩ mô khó đoán: lãi suất, chính sách, thuế quan, tỷ giá, cước vận tải.
      - Chủ SME hỏi 'nếu lãi suất/thuế/đối tác thay đổi thì sao?', 'nên chuẩn bị gì cho 3-5 năm tới?'
      - Cần kiểm tra (stress-test) chiến lược hiện tại hoặc một thương vụ M&A / mở rộng quốc tế trong nhiều bối cảnh.
      - Cần thiết kế hệ thống cảnh báo sớm và ngưỡng kích hoạt phương án B.
      - KHÔNG dùng cho quyết định vận hành hằng ngày; với startup rất sớm chỉ dùng bản rút gọn 2-3 kịch bản.

      Nên nắm trước: - m01

      Module liên quan: - 'm01 - PESTEL/Porter: nguồn để liệt kê driving forces (Bước 2)' - 'm02 - Phân tích nội bộ: đánh giá năng lực DN có chịu nổi từng kịch bản không (Bước 6)' - 'm03 - Chiến lược cạnh tranh: các phương án chiến lược đem thử trong wind-tunnel' - 'm04 - Chiến lược tăng trưởng: phương án mở rộng/đa dạng hóa được test bằng kịch bản' - 'm05 - Blue Ocean: tìm không gian mới khi kịch bản làm thị trường hiệ…

      Công thức (tra chi tiết bằng skill_search("<id>")):
      - m07_impact_uncertainty_score: Điểm ưu tiên yếu tố (Tác động x Bất định)
      - m07_joint_scenario_weight: Trọng số kịch bản từ hai trục (giả định độc lập)
      - m07_expected_value: Giá trị kỳ vọng của chiến lược qua các kịch bản
      - m07_maximin: Tiêu chí Maximin (kết quả xấu nhất tốt nhất)
      - m07_regret: Regret lớn nhất (Minimax regret, Savage)
      - m07_robustness_share: Tỷ lệ kịch bản sống sót (độ vững)
      - m07_cash_runway: Thời gian chịu đựng tiền mặt trong kịch bản xấu
      - m07_signal_score: Điểm tín hiệu của một kịch bản

      Kho tra cứu của module: Khái niệm 8, Công thức 8, frameworks 7, Quy trình 4, Quy tắc quyết định 14, Chuẩn so sánh 8, Lỗi thường gặp 10, Lưu ý SME Việt Nam 8, Bài học case 5, Ví dụ có lời giải 4, Câu hỏi luyện tập 10, Checklist 14, Mẫu Excel/Sheets 3. Tra bằng skill_search với từ khoá chủ đề (vd "ví dụ SWOT", "lỗi thường gặp BSC").
  - id: "m07-concepts-1"
    title: "Khái niệm: Lập kế hoạch theo kịch bản"
    tags: ["khái", "niệm", "lập", "kế", "hoạch", "theo", "kịch", "bản"]
    text: |-
      term_vi: Lập kế hoạch theo kịch bản
      term_en: Scenario Planning
      definition: |
        Phương pháp xây nhiều câu chuyện hợp lý (plausible) về tương lai dựa trên các yếu tố bất định có tác động lớn, để chuẩn bị, kiểm tra và điều chỉnh chiến lược. Là công cụ tư duy chiến lược, không phải công cụ dự báo.
      why_it_matters: |
        Nguồn gốc: war gaming quân sự sau Thế chiến II; Herman Kahn (RAND, thập niên 1950) dùng cho chiến lược quốc phòng; Pierre Wack (Royal Dutch Shell, thập niên 1970) đưa vào kinh doanh; Peter Schwartz (GBN, 1991, 'The Art of the Long View') phổ biến; van der Heijden (1996) và Schoemaker (1995) hệ thống hóa. Ra đời vì dự báo một con số thất bại đúng lúc cần nhất (ngoặt chiến lược), và vì người ra quyết định không đổi niềm tin chỉ vì một biểu đồ nhưng đổi niềm tin vì một câu chuyện thuyết phục.
  - id: "m07-concepts-2"
    title: "Khái niệm: Hợp lý, không phải xác suất"
    tags: ["khái", "niệm", "hợp", "lý", "không", "phải", "xác", "suất"]
    text: |-
      term_vi: Hợp lý, không phải xác suất
      term_en: Plausibility vs Probability
      definition: |
        Kịch bản được chọn theo tính hợp lý và tính khác biệt của nó, không gán xác suất khách quan. Mục tiêu là mở rộng tầm nhìn của đội ngũ, chứ không đoán kịch bản nào thắng.
      why_it_matters: |
        Gán xác suất khiến người ta bám vào kịch bản 'có khả năng nhất' rồi bỏ qua kịch bản xấu nhưng sống còn (tunnel vision). Với SME, khi cần so sánh phương án có thể dùng trọng số chủ quan, nhưng phải coi là công cụ phụ (xem công thức), không phải kết luận.
  - id: "m07-concepts-3"
    title: "Khái niệm: Thế giới VUCA"
    tags: ["khái", "niệm", "thế", "giới", "vuca"]
    text: |-
      term_vi: Thế giới VUCA
      term_en: VUCA (Volatility, Uncertainty, Complexity, Ambiguity)
      definition: Biến động nhanh, bất định, phức tạp (nhiều yếu tố liên kết), mơ hồ (cùng dữ kiện, nhiều cách diễn giải).
      why_it_matters: Là bối cảnh khiến kế hoạch 1 kịch bản dễ vỡ; thập niên 2020 (COVID, xung đột, lãi suất, thuế quan) là minh họa điển hình.
  - id: "m07-concepts-4"
    title: "Khái niệm: Yếu tố dẫn dắt"
    tags: ["khái", "niệm", "yếu", "tố", "dẫn", "dắt"]
    text: |-
      term_vi: Yếu tố dẫn dắt
      term_en: Driving forces
      definition: Xu hướng/lực lượng bên ngoài định hình tương lai ngành (chính trị, kinh tế, xã hội, công nghệ, môi trường, pháp lý).
      why_it_matters: Là nguyên liệu đầu vào; thường lấy từ PESTEL. Phải tách yếu tố 'chắc chắn' (xu hướng rõ, vd đô thị hóa) khỏi yếu tố 'bất định'.
  - id: "m07-concepts-5"
    title: "Khái niệm: Yếu tố chắc chắn và yếu tố bất định"
    tags: ["khái", "niệm", "yếu", "tố", "chắc", "chắn", "và", "bất", "định"]
    text: |-
      term_vi: Yếu tố chắc chắn và yếu tố bất định
      term_en: Predetermined elements vs Critical uncertainties
      definition: |
        Predetermined elements: xu hướng gần như chắc chắn, đưa vào mọi kịch bản. Critical uncertainties: yếu tố tác động lớn nhưng không biết sẽ diễn ra theo hướng nào; chỉ 2 yếu tố trong nhóm này được chọn làm trục.
      why_it_matters: Nếu đem yếu tố chắc chắn làm trục, các kịch bản sẽ giống nhau; nếu đem yếu tố ít tác động làm trục, kịch bản không đáng quan tâm.
  - id: "m07-concepts-6"
    title: "Khái niệm: Chiến lược vững và chiến lược dự phòng"
    tags: ["khái", "niệm", "chiến", "lược", "vững", "và", "dự", "phòng"]
    text: |-
      term_vi: Chiến lược vững và chiến lược dự phòng
      term_en: Robust strategy vs Contingent strategy
      definition: |
        Robust: chiến lược chạy tốt hoặc ít nhất sống sót ở hầu hết kịch bản, triển khai NGAY. Contingent: chỉ kích hoạt khi tín hiệu cho thấy một kịch bản cụ thể đang xảy ra; chuẩn bị sẵn nhưng chưa dùng.
      why_it_matters: 'Giải quyết nhược điểm ''biết nhiều kịch bản nhưng không biết làm gì'': chia hành động thành làm ngay (robust), chuẩn bị sẵn (contingent), và chờ tín hiệu.'
  - id: "m07-concepts-7"
    title: "Khái niệm: Tín hiệu cảnh báo sớm"
    tags: ["khái", "niệm", "tín", "hiệu", "cảnh", "báo", "sớm"]
    text: |-
      term_vi: Tín hiệu cảnh báo sớm
      term_en: Early Warning Signals / Leading indicators
      definition: Chỉ báo quan sát được, đo được, đi trước sự kiện và gắn với một kịch bản cụ thể, kèm ngưỡng và người chịu trách nhiệm.
      why_it_matters: Không có tín hiệu thì kịch bản chỉ là tài liệu trên giấy; tín hiệu sớm biến kịch bản thành phản xạ nhanh (Shell phản ứng sớm hơn đối thủ 6-12 tháng theo mô tả trong tài liệu nguồn).
  - id: "m07-concepts-8"
    title: "Khái niệm: Thiên nga đen"
    tags: ["khái", "niệm", "thiên", "nga", "đen"]
    text: |-
      term_vi: Thiên nga đen
      term_en: Black Swan
      definition: Sự kiện hiếm, bất ngờ, tác động cực lớn, thường nằm ngoài tất cả kịch bản đã dựng (COVID-19, khủng hoảng Biển Đỏ 2024).
      why_it_matters: 'Là giới hạn của phương pháp. Cách đối phó: giữ khả năng chịu sốc chung (tiền mặt, đa dạng nguồn cung) thay vì cố dự đoán sự kiện cụ thể; rà soát kịch bản định kỳ.'
  - id: "m07-formulas-1"
    title: "Công thức: m07_impact_uncertainty_score — Điểm ưu tiên yếu tố (Tác động x Bất định)"
    tags: ["công", "thức", "m07_impact_uncertainty_score", "điểm", "ưu", "tiên", "yếu", "tố", "tác", "động", "bất", "định"]
    text: |-
      id: m07_impact_uncertainty_score
      name_vi: Điểm ưu tiên yếu tố (Tác động x Bất định)
      name_en: Impact x Uncertainty priority score
      expression_latex: S_i = I_i \times U_i
      expression_python: I * U
      excel: =B2*C2
      variables:
      - symbol: I
        meaning: Mức tác động của yếu tố lên quyết định chiến lược (thang 1-5)
        unit: điểm
      - symbol: U
        meaning: Mức bất định về hướng diễn biến của yếu tố (thang 1-5)
        unit: điểm
      when_to_use: 'Bước 3 của quy trình: xếp hạng 10-15 driving forces để chọn ứng viên làm trục kịch bản.'
      why_it_works: |
        Một yếu tố đáng làm trục khi VỪA tác động lớn VỪA khó đoán. Nhân hai điểm làm điểm cao chỉ khi cả hai cùng cao (5x5=25), còn yếu tố chỉ cao một chiều (5x1=5) tự bị loại: tác động lớn nhưng chắc chắn thì đưa vào mọi kịch bản, bất định nhưng tác động nhỏ thì chỉ theo dõi.
      assumptions:
      - Điểm do nhóm chấm đồng thuận, cùng một thang.
      - Hai trục được chọn nên độc lập tương đối (xem decision_rules).
      pitfalls:
      - Chấm theo cảm tính của một người; cần workshop đa chức năng.
      - Chọn 2 yếu tố điểm cao nhất nhưng chúng phụ thuộc nhau (vd lãi suất và tín dụng BĐS), khiến 4 ô thực ra chỉ có 2 kịch bản thật.
      - Dùng điểm này như xác suất. Nó chỉ xếp hạng ưu tiên.
      interpretation: Điểm 16-25 là ứng viên làm trục; 9-15 theo dõi chặt; dưới 9 đưa vào bối cảnh hoặc bỏ qua. Ngưỡng là quy ước thực hành, không phải chuẩn học thuật.
      example:
        inputs:
          I: 5
          U: 5
        steps:
        - 'Thuế quan Mỹ: tác động 5, bất định 5'
        - S = 5 x 5 = 25 (cao nhất trong danh sách)
        result: '25'
  - id: "m07-formulas-2"
    title: "Công thức: m07_joint_scenario_weight — Trọng số kịch bản từ hai trục (giả định độc lập)"
    tags: ["công", "thức", "m07_joint_scenario_weight", "trọng", "số", "kịch", "bản", "từ", "hai", "trục", "giả", "định"]
    text: |-
      id: m07_joint_scenario_weight
      name_vi: Trọng số kịch bản từ hai trục (giả định độc lập)
      name_en: Scenario weight from two axes
      expression_latex: P(A_i, B_j) = P(A_i)\times P(B_j)
      expression_python: pa * pb
      excel: =B1*B2
      variables:
      - symbol: pa
        meaning: Trọng số chủ quan cho cực của trục 1 (0-1)
        unit: tỷ lệ
      - symbol: pb
        meaning: Trọng số chủ quan cho cực của trục 2 (0-1)
        unit: tỷ lệ
      when_to_use: Chỉ khi cần gán trọng số để tính giá trị kỳ vọng hoặc phân bổ ngân sách dự phòng; không dùng để 'dự báo kịch bản thắng'.
      why_it_works: Nếu hai trục độc lập thì khả năng đồng thời bằng tích. 4 ô có tổng trọng số bằng 1 vì mỗi trục có hai cực loại trừ nhau.
      assumptions:
      - Hai trục độc lập.
      - pa, pb là phán đoán chủ quan có nhóm đồng thuận, ghi rõ nguồn.
      pitfalls:
      - 'Hai trục thường tương quan (lãi suất cao thường đi với siết tín dụng): tích sẽ đánh giá sai ô chéo.'
      - Tin con số thập phân như thật. Nên làm tròn, và chạy lại với trọng số khác (sensitivity).
      interpretation: Dùng để xếp thứ tự quan tâm, không để loại bỏ kịch bản có trọng số thấp nhưng thiệt hại sống còn (vd 12%).
      example:
        inputs:
          pa: 0.6
          pb: 0.3
        steps:
        - P(A cao)=0.6, P(B cao)=0.3
        - Ô (A cao, B cao) = 0.6 x 0.3 = 0.18
        - Ô (A thấp, B thấp) = 0.4 x 0.7 = 0.28; ô (A cao, B thấp) = 0.6 x 0.7 = 0.42; ô (A thấp, B cao) = 0.4 x 0.3 = 0.12; tổng = 1
        result: '0.18'
  - id: "m07-formulas-3"
    title: "Công thức: m07_expected_value — Giá trị kỳ vọng của chiến lược qua các kịch bản"
    tags: ["công", "thức", "m07_expected_value", "giá", "trị", "kỳ", "vọng", "của", "chiến", "lược", "qua", "các"]
    text: |-
      id: m07_expected_value
      name_vi: Giá trị kỳ vọng của chiến lược qua các kịch bản
      name_en: Scenario-weighted expected value
      expression_latex: EV_s = \sum_{k} w_k \, X_{s,k}
      expression_python: sum(w_k * x for w_k, x in zip(w, payoffs))
      excel: =SUMPRODUCT(B2:E2,$B$7:$E$7)
      variables:
      - symbol: w
        meaning: Trọng số từng kịch bản, tổng bằng 1
        unit: tỷ lệ
      - symbol: payoffs
        meaning: Kết quả (lợi nhuận/NPV 3 năm) của chiến lược s ở từng kịch bản k
        unit: tỷ VNĐ
      when_to_use: So sánh phương án khi chấp nhận rủi ro lặp lại và có trọng số tạm tin được.
      why_it_works: 'Là bình quân gia quyền: mỗi kịch bản đóng góp kết quả của nó theo mức quan tâm.'
      assumptions:
      - Trọng số chủ quan nhưng nhất quán.
      - Payoff cùng đơn vị, cùng horizon, đã chiết khấu nếu cần.
      pitfalls:
      - 'Kịch bản đuôi (phá sản) bị trung bình hóa: EV dương vẫn có thể che một kịch bản không thể sống sót.'
      - Phương án EV cao nhất thường là phương án 'cược' mạnh nhất.
      interpretation: Dùng cùng maximin và regret; nếu EV chọn một phương án nhưng maximin có kết quả âm lớn thì cần trần rủi ro (xem decision_rules).
      example:
        inputs:
          w:
          - 0.3
          - 0.4
          - 0.2
          - 0.1
          payoffs:
          - 600
          - 350
          - 50
          - -250
        steps:
        - 0.3x600=180; 0.4x350=140; 0.2x50=10; 0.1x(-250)=-25
        - EV = 180+140+10-25 = 305
        result: 305 (triệu VNĐ)
  - id: "m07-formulas-4"
    title: "Công thức: m07_maximin — Tiêu chí Maximin (kết quả xấu nhất tốt nhất)"
    tags: ["công", "thức", "m07_maximin", "tiêu", "chí", "maximin", "kết", "quả", "xấu", "nhất", "tốt"]
    text: |-
      id: m07_maximin
      name_vi: Tiêu chí Maximin (kết quả xấu nhất tốt nhất)
      name_en: Maximin / worst-case criterion
      expression_latex: \max_s \min_k X_{s,k}
      expression_python: max(min(row) for row in matrix)
      excel: =MAX(F2:F5) với F = MIN(B:E) mỗi hàng
      variables:
      - symbol: matrix
        meaning: Ma trận payoff, hàng = chiến lược, cột = kịch bản
        unit: tỷ VNĐ
      when_to_use: DN mỏng vốn, vay nhiều, hoặc quyết định có thể dẫn đến mất khả năng thanh toán.
      why_it_works: Với DN không chịu nổi cú ngã lớn, điều cần là sống sót ở kịch bản xấu nhất rồi mới nói đến tối ưu.
      assumptions:
      - Kịch bản xấu nhất đã được đưa vào ma trận (không bị 'dễ dãi' quá mức).
      pitfalls:
      - Quá bi quan, luôn chọn phương án an toàn kém sinh lời (giữ tiền mặt).
      interpretation: Giá trị maximin âm nghĩa là phương án có kịch bản gây lỗ; so sánh với vốn chủ và dự phòng tiền mặt.
      example:
        inputs:
          matrix:
          - - 900
            - 300
            - -200
            - -900
          - - 600
            - 350
            - 50
            - -250
          - - 400
            - 320
            - 150
            - 60
          - - 50
            - 50
            - 50
            - 50
        steps:
        - 'min từng hàng: -900, -250, 60, 50'
        - max trong các min = 60 (Nâng cấp 3 chi nhánh + delivery)
        result: '60'
  - id: "m07-formulas-5"
    title: "Công thức: m07_regret — Regret lớn nhất (Minimax regret, Savage)"
    tags: ["công", "thức", "m07_regret", "regret", "lớn", "nhất", "minimax", "savage"]
    text: |-
      id: m07_regret
      name_vi: Regret lớn nhất (Minimax regret, Savage)
      name_en: Minimax regret
      expression_latex: R_{s,k}=\max_{s'}X_{s',k}-X_{s,k};\; \min_s \max_k R_{s,k}
      expression_python: min(max(max(col) - row[k] for k, col in enumerate(zip(*matrix))) for row in matrix)
      excel: Bảng regret = MAX(cột) - ô; rồi MIN của MAX theo hàng
      variables:
      - symbol: matrix
        meaning: Ma trận payoff
        unit: tỷ VNĐ
      when_to_use: Quyết định một lần, khó đảo ngược, nỗi sợ lớn nhất là 'chọn sai khi đáng lẽ chọn khác'.
      why_it_works: L. J. Savage (1951) đề xuất đo thiệt hại so với phương án tốt nhất ở từng kịch bản; chọn phương án mà hối tiếc tệ nhất vẫn nhỏ nhất.
      assumptions:
      - Các phương án trong ma trận bao quát các lựa chọn thực tế.
      pitfalls:
      - Thêm/bớt một phương án làm đổi regret của các phương án khác.
      interpretation: Regret nhỏ nghĩa là ít bị 'bỏ lỡ' hoặc 'dính đòn' so với phương án tối ưu ở mọi kịch bản.
      example:
        inputs:
          matrix:
          - - 900
            - 300
            - -200
            - -900
          - - 600
            - 350
            - 50
            - -250
          - - 400
            - 320
            - 150
            - 60
          - - 50
            - 50
            - 50
            - 50
        steps:
        - 'max từng cột: 900, 350, 150, 60'
        - Hàng 1 regret [0,50,350,960] max 960; hàng 2 [300,0,100,310] max 310; hàng 3 [500,30,0,0] max 500; hàng 4 [850,300,100,10] max 850
        - min của các max = 310 (Mở CN4 vốn tự có)
        result: '310'
  - id: "m07-formulas-6"
    title: "Công thức: m07_robustness_share — Tỷ lệ kịch bản sống sót (độ vững)"
    tags: ["công", "thức", "m07_robustness_share", "tỷ", "lệ", "kịch", "bản", "sống", "sót", "độ", "vững"]
    text: |-
      id: m07_robustness_share
      name_vi: Tỷ lệ kịch bản sống sót (độ vững)
      name_en: Robustness share
      expression_latex: 'Rb_s=\frac{\#\{k: X_{s,k}\ge T\}}{K}'
      expression_python: sum(1 for x in payoffs if x >= T) / len(payoffs)
      excel: =COUNTIF(B2:E2,">="&T)/COUNT(B2:E2)
      variables:
      - symbol: payoffs
        meaning: Kết quả của một chiến lược ở K kịch bản
        unit: tỷ VNĐ
      - symbol: T
        meaning: Ngưỡng chấp nhận (thường 0 = hòa vốn, hoặc mức lợi nhuận tối thiểu)
        unit: tỷ VNĐ
      when_to_use: 'Bước wind-tunnel: đo định lượng thế nào là ''robust'' (không cần xác suất).'
      why_it_works: Robust nghĩa là đạt ngưỡng ở nhiều kịch bản; đếm số kịch bản đạt ngưỡng là cách không đòi hỏi trọng số.
      assumptions:
      - T phản ánh ngưỡng sống sót thật của DN (dòng tiền, nghĩa vụ nợ).
      pitfalls:
      - T = 0 che việc lợi nhuận quá thấp; đặt T theo chi phí vốn hoặc mức tối thiểu của chủ DN.
      interpretation: 1.0 = đạt ngưỡng ở mọi kịch bản (robust); 0.75 = thất bại ở một kịch bản, cần kế hoạch dự phòng cụ thể; dưới 0.5 = cược.
      example:
        inputs:
          payoffs:
          - 900
          - 300
          - -200
          - -900
          T: 0
        steps:
        - 'Đạt ngưỡng ở KB1 (900) và KB2 (300): 2 kịch bản'
        - 2/4 = 0.5
        result: 0.5 (Mở CN4 vay 70% không robust)
  - id: "m07-formulas-7"
    title: "Công thức: m07_cash_runway — Thời gian chịu đựng tiền mặt trong kịch bản xấu"
    tags: ["công", "thức", "m07_cash_runway", "thời", "gian", "chịu", "đựng", "tiền", "mặt", "trong", "kịch", "bản"]
    text: |-
      id: m07_cash_runway
      name_vi: Thời gian chịu đựng tiền mặt trong kịch bản xấu
      name_en: Cash runway under a scenario
      expression_latex: Runway=\frac{Cash}{MonthlyOutflow-MonthlyInflow}
      expression_python: cash / (outflow - inflow)
      excel: =B1/(B2-B3)
      variables:
      - symbol: cash
        meaning: Tiền mặt và tương đương tiền có thể dùng
        unit: triệu VNĐ
      - symbol: outflow
        meaning: Tiền chi hằng tháng (chi phí cố định + biến phí) trong kịch bản
        unit: triệu VNĐ/tháng
      - symbol: inflow
        meaning: Tiền thu hằng tháng trong kịch bản
        unit: triệu VNĐ/tháng
      when_to_use: 'Đánh giá kịch bản xấu: DN sống được bao tháng; xác định quỹ dự phòng (nguồn nêu 6 tháng vận hành cho DN XNK).'
      why_it_works: Phá sản là cạn tiền, không phải lỗ kế toán; runway cho biết 'thời gian mua' để chuyển sang chiến lược contingent.
      assumptions:
      - Outflow > inflow (đang đốt tiền); nếu không, runway vô hạn.
      - Dòng tiền trong kịch bản ổn định (thực tế dao động).
      pitfalls:
      - Quên các khoản nợ đến hạn đột ngột (gốc vay, thuế) khỏi outflow.
      - Dùng cash đã cam kết cho việc khác.
      interpretation: Dưới 6 tháng là vùng nguy hiểm theo quy ước thực hành (nguồn nêu mốc 6 tháng); trên 12 tháng thoải mái.
      example:
        inputs:
          cash: 480
          outflow: 140
          inflow: 60
        steps:
        - Burn = 140 - 60 = 80
        - Runway = 480 / 80 = 6 tháng
        result: 6 tháng
  - id: "m07-formulas-8"
    title: "Công thức: m07_signal_score — Điểm tín hiệu của một kịch bản"
    tags: ["công", "thức", "m07_signal_score", "điểm", "tín", "hiệu", "của", "một", "kịch", "bản"]
    text: |-
      id: m07_signal_score
      name_vi: Điểm tín hiệu của một kịch bản
      name_en: Weighted early-warning signal score
      expression_latex: SS=\frac{\sum_j w_j s_j}{\sum_j w_j}
      expression_python: sum(w * s for w, s in zip(weights, signals)) / sum(weights)
      excel: =SUMPRODUCT(B2:B5,C2:C5)/SUM(B2:B5)
      variables:
      - symbol: weights
        meaning: Trọng số từng tín hiệu (độ tin cậy/độ sớm)
        unit: điểm
      - symbol: signals
        meaning: 1 nếu tín hiệu đã xuất hiện, 0 nếu chưa
        unit: 0/1
      when_to_use: Gộp nhiều tín hiệu rời rạc thành một con số để quyết định kích hoạt phương án contingent.
      why_it_works: Một tín hiệu đơn lẻ dễ nhiễu; nhiều tín hiệu độc lập cùng chỉ một hướng tăng độ tin cậy. Ngưỡng định trước tránh phản ứng cảm tính.
      assumptions:
      - Tín hiệu tương đối độc lập, ngưỡng được thống nhất TRƯỚC khi sự kiện xảy ra.
      pitfalls:
      - Đổi ngưỡng sau khi thấy dữ liệu (confirmation bias).
      - Tín hiệu trùng nguồn (3 bài báo cùng một nguồn) bị đếm 3 lần.
      interpretation: 'Ngưỡng gợi ý thực hành: dưới 0.4 theo dõi; 0.4-0.7 chuẩn bị nguồn lực; từ 0.7 kích hoạt phương án contingent.'
      example:
        inputs:
          weights:
          - 3
          - 2
          - 2
          - 1
          signals:
          - 1
          - 1
          - 0
          - 1
        steps:
        - Tử số = 3x1 + 2x1 + 2x0 + 1x1 = 6
        - Mẫu số = 3+2+2+1 = 8
        - SS = 6/8 = 0.75
        result: 0.75 (đạt ngưỡng kích hoạt)
  - id: "m07-frameworks-1"
    title: "Frameworks: m07_shell_8_steps — Quy trình 8 bước (Phương pháp Shell / Trực giác-Logic)"
    tags: ["frameworks", "m07_shell_8_steps", "quy", "trình", "bước", "phương", "pháp", "shell", "trực", "giác", "logic"]
    text: |-
      id: m07_shell_8_steps
      name_vi: Quy trình 8 bước (Phương pháp Shell / Trực giác-Logic)
      name_en: Eight-step scenario planning process (Shell method)
      origin: |
        Pierre Wack và nhóm Group Planning của Royal Dutch Shell (London, đầu thập niên 1970) phát triển sau khi nhận thấy dự báo một con số về giá dầu sắp mất tác dụng. Họ không dự đoán chiến tranh Yom Kippur 1973 nhưng đã xây kịch bản 'OPEC kiểm soát giá', giúp lãnh đạo Shell chuẩn bị tinh thần và chiến lược trước cú sốc. Wack công bố trên HBR 1985; Schwartz hệ thống hóa 1991.
      components:
      - B1 Xác định vấn đề chiến lược
      - B2 Driving forces
      - B3 Xếp hạng tác động x bất định
      - B4 Chọn 2 trục và dựng ma trận 2x2
      - B5 Viết kịch bản
      - B6 Phân tích tác động
      - B7 Xây chiến lược robust và contingent
      - B8 Giám sát tín hiệu sớm
      when_to_use: Quyết định chiến lược lớn, horizon 5-10 năm (SME 3-5 năm), ngành bất định, có thể tổ chức workshop.
      how_to_apply:
      - B1 Viết câu hỏi quyết định dạng 'Có nên X trong N năm tới?' (không hỏi 'tương lai ra sao'). Xác định horizon (thường 5-10 năm; SME 3-5 năm) và người quyết định.
      - B2 Liệt kê 10-15 driving forces qua PESTEL, Porter, báo cáo ngành, phỏng vấn khách hàng/nhà cung cấp/ngân hàng.
      - B3 Chấm mỗi yếu tố Tác động (1-5) và Bất định (1-5); tính điểm; tách nhóm 'chắc chắn' (bất định thấp) đưa vào mọi kịch bản.
      - B4 Chọn 2 yếu tố tác động và bất định cao nhất, độc lập nhau; định nghĩa hai cực rõ ràng, đo được (vd lãi suất 6-8% vs 10-14%); dựng ma trận 2x2 = 4 ô.
      - 'B5 Mỗi ô: đặt tên gợi hình, viết câu chuyện 1-3 trang (điều gì đã xảy ra, ai thắng ai thua, thị trường trông ra sao), đảm bảo nhất quán nội tại.'
      - B6 Với mỗi kịch bản, ước tính tác động lên doanh thu, chi phí, dòng tiền, năng lực chủ chốt; xác định điểm gãy (vd mất khả năng thanh toán).
      - B7 Wind-tunnel các phương án chiến lược qua 4 kịch bản; chọn chiến lược robust làm ngay, contingent chuẩn bị sẵn (xem m07_wind_tunnel).
      - B8 Với mỗi kịch bản chọn 2-3 tín hiệu sớm đo được, ngưỡng kích hoạt, nguồn dữ liệu, người theo dõi; họp rà soát định kỳ (hằng tháng với DN nhỏ nhạy biến động, 6-12 tháng rà lại cả bộ kịch bản).
      how_to_read_results: |
        Kết quả không phải 'kịch bản nào đúng' mà là (1) danh sách hành động làm ngay (robust), (2) phương án sẵn sàng khi tín hiệu xuất hiện, (3) bảng tín hiệu theo dõi. Nếu phải chọn giữa phương án, đọc thêm EV, maximin, regret.
      pitfalls:
      - Chọn trục là yếu tố chắc chắn hoặc phụ thuộc nhau nên các kịch bản giống nhau hoặc chỉ còn 2 kịch bản thật.
      - Viết 3 kịch bản 'xấu - trung bình - tốt', trong đó tốt-xấu chỉ khác con số, không khác bản chất; trục phải sinh ra câu chuyện khác nhau.
      - Gán xác suất rồi chỉ bám kịch bản 'có khả năng nhất' (tunnel vision).
      - Làm xong để trong ngăn kéo, không đặt tín hiệu và không rà soát (kịch bản chết).
      - 'Confirmation bias: chọn kịch bản mình muốn tin; cần người phản biện (devil''s advocate).'
      - Quá nhiều yếu tố bất định dẫn đến paralysis; giới hạn 2 trục, 4 kịch bản.
      example: Xem worked_examples we_wood_export (xưởng gỗ XNK) và we_cafe_expansion (chuỗi cà phê).
  - id: "m07-frameworks-2"
    title: "Frameworks: m07_impact_uncertainty_matrix — Ma trận Tác động - Bất định"
    tags: ["frameworks", "m07_impact_uncertainty_matrix", "ma", "trận", "tác", "động", "bất", "định"]
    text: |-
      id: m07_impact_uncertainty_matrix
      name_vi: Ma trận Tác động - Bất định
      name_en: Impact / Uncertainty matrix
      origin: 'Công cụ sàng lọc trong quy trình scenario của Shell/GBN: chọn trục từ nhiều driving forces dựa trên hai chiều tác động và bất định.'
      components:
      - 'Ô 1 (tác động cao, bất định cao): chọn làm trục kịch bản'
      - 'Ô 2 (tác động thấp, bất định cao): theo dõi chặt'
      - 'Ô 3 (tác động cao, bất định thấp): lập kế hoạch cụ thể, nằm trong mọi kịch bản (predetermined)'
      - 'Ô 4 (thấp, thấp): bỏ qua'
      when_to_use: Bước 3 của quy trình, khi có hơn 8-10 driving forces.
      how_to_apply:
      - Lập bảng yếu tố, chấm I và U 1-5 (công thức m07_impact_uncertainty_score).
      - Vẽ lên lưới 2x2; ngưỡng chia ở mức giữa (3).
      - Chọn 2 yếu tố ở ô trên-phải, bất định hơn và ít liên quan nhau; thử nói cực cao/thấp bằng một câu để chắc chúng định nghĩa được.
      - Yếu tố tác động cao nhưng chắc chắn (vd đô thị hóa) ghi vào bối cảnh chung của mọi kịch bản.
      how_to_read_results: Nhóm ô 1 có thể có 3-5 yếu tố; tinh lọc bằng câu hỏi 'hai yếu tố này có thể đi ngược nhau không?' và 'chúng có tương quan mạnh không?'.
      pitfalls:
      - Lẫn 'ít biết' với 'bất định thật'; yếu tố chưa nghiên cứu nên nghiên cứu thêm trước khi chấm bất định cao.
      - Chọn hai yếu tố cùng ngành (lãi suất và tín dụng) khiến ô chéo phi thực tế.
      example: 'Xưởng gỗ XNK: thuế quan Mỹ (5x5=25) và cước container (4x5=20) được chọn; luật xuất xứ (20) có tương quan với thuế quan nên gộp vào kịch bản thay vì làm trục thứ ba.'
  - id: "m07-frameworks-3"
    title: "Frameworks: m07_scenario_matrix_2x2 — Ma trận kịch bản 2x2"
    tags: ["frameworks", "m07_scenario_matrix_2x2", "ma", "trận", "kịch", "bản", "2x2"]
    text: |-
      id: m07_scenario_matrix_2x2
      name_vi: Ma trận kịch bản 2x2
      name_en: 2x2 scenario matrix (Schwartz / GBN axes method)
      origin: Peter Schwartz và Global Business Network (1991) chuẩn hóa cách dựng 4 kịch bản bằng hai trục bất định; là dạng phổ biến nhất vì đủ khác nhau, đủ ít để thảo luận.
      components:
      - Trục 1 với hai cực
      - Trục 2 với hai cực
      - 4 ô = 4 kịch bản, mỗi ô có tên gợi hình, câu chuyện, tác động, hàm ý chiến lược
      when_to_use: Mọi bài toán scenario; thay bằng 3 kịch bản (thấp/trung bình/cao) cho SME khi nguồn lực ít.
      how_to_apply:
      - 'Đặt tên trục trung tính, đo được (vd ''Lãi suất: 6-8% ↔ 10-14%'', không dùng ''tốt/xấu'').'
      - Điền 4 ô; đặt tên có hình ảnh (Bùng nổ, Chọn lọc, Đóng băng từ từ, Khủng hoảng).
      - 'Viết câu chuyện theo thứ tự: sự kiện kích hoạt, hành vi các bên, hệ quả cho ngành, trông ra sao ở năm cuối horizon.'
      - 'Kiểm tra: mỗi kịch bản có hợp lý không, nhất quán nội tại không, có khác biệt thực sự không, có hàm ý chiến lược khác nhau không.'
      - Đặt 'dấu hiệu' xác định mình đang ở/hướng tới ô nào (sang Bước 8).
      how_to_read_results: Thường có một ô thuận lợi, một ô khủng hoảng, hai ô ở giữa; phương án tốt không chỉ thắng ở ô thuận lợi mà phải sống sót ở ô khủng hoảng.
      pitfalls:
      - Bốn ô thiếu cân bằng (ba ô tốt, một ô xấu) là dấu hiệu bias lạc quan.
      - Tên kịch bản mơ hồ khiến ban lãnh đạo không nhớ và không dùng.
      example: |
        BĐS Việt Nam 2025-2030: trục Lãi suất (6-8% ↔ 10-14%) x Chính sách (thông thoáng ↔ siết chặt) cho 4 kịch bản Bùng nổ, Chọn lọc, Đóng băng từ từ, Khủng hoảng; giá có thể +20-30% ở KB1 và -20-40% ở KB4 (con số minh họa của tài liệu nguồn).
  - id: "m07-frameworks-4"
    title: "Frameworks: m07_wind_tunnel — Thử nghiệm chiến lược trong hầm gió"
    tags: ["frameworks", "m07_wind_tunnel", "thử", "nghiệm", "chiến", "lược", "trong", "hầm", "gió"]
    text: |-
      id: m07_wind_tunnel
      name_vi: Thử nghiệm chiến lược trong hầm gió
      name_en: Wind tunneling / Wind-tunnel testing
      origin: 'Thuật ngữ dùng trong thực hành scenario (van der Heijden 1996; Schoemaker 1995): ví với thử mô hình máy bay trong hầm gió trước khi bay thật; thử chiến lược trong mỗi kịch bản trước khi cam kết nguồn lực.'
      components:
      - Danh sách phương án chiến lược
      - 4 kịch bản
      - Ma trận chấm điểm (định tính hoặc payoff)
      - Kết luận robust / contingent / loại
      when_to_use: 'Bước 6-7: chọn giữa các phương án đầu tư, mở rộng, đa dạng hóa.'
      how_to_apply:
      - Liệt kê 3-5 phương án (gồm cả 'giữ nguyên' và 'giữ tiền mặt').
      - Với mỗi cặp phương án x kịch bản, chấm kết quả (định tính ✅/⚠️/❌ hoặc payoff số) và nêu lý do một dòng.
      - Gạch phương án có ❌ ở kịch bản gây mất khả năng thanh toán; tính maximin, regret, EV, độ vững (xem formulas).
      - Phương án sống sót ở nhiều kịch bản nhất = robust. Phương án thắng lớn ở một kịch bản = contingent, gắn với tín hiệu.
      - 'Thử cải tiến: nhiều phương án có thể ghép (vd mở chi nhánh bằng vốn tự có + chuẩn bị gói delivery).'
      how_to_read_results: Robust không phải 'tốt nhất ở mọi nơi' mà là 'không chết và vẫn tạo giá trị ở mọi nơi'; chấp nhận hy sinh phần upside của kịch bản đẹp.
      pitfalls:
      - Chấm điểm cảm tính không có lý do viết ra; thiếu kiểm chứng chéo.
      - Quên chi phí đa dạng hóa (tiền, quản lý) khi gọi chiến lược 'đa dạng' là robust.
      example: |
        Ma trận BĐS của nguồn: Mở rộng nhanh vay nhiều (phá sản ở KB4, không robust); Tập trung cao cấp (khá); Đa dạng bán + cho thuê + dịch vụ (robust, dòng tiền ổn ở mọi KB); Bảo thủ giữ tiền mặt (khá, bỏ lỡ KB1).
  - id: "m07-frameworks-5"
    title: "Frameworks: m07_early_warning — Hệ thống tín hiệu cảnh báo sớm"
    tags: ["frameworks", "m07_early_warning", "hệ", "thống", "tín", "hiệu", "cảnh", "báo", "sớm"]
    text: |-
      id: m07_early_warning
      name_vi: Hệ thống tín hiệu cảnh báo sớm
      name_en: Early Warning Signals / Signposts
      origin: Bước 8 trong quy trình Shell; Schoemaker (1995) nhấn mạnh 'signposts' để kịch bản không chết trên giấy.
      components:
      - Tín hiệu (chỉ số đo được)
      - Kịch bản liên quan
      - Ngưỡng kích hoạt
      - Nguồn dữ liệu
      - Người chịu trách nhiệm
      - Hành động khi vượt ngưỡng
      when_to_use: Sau khi chọn chiến lược; chạy liên tục (họp hằng tháng cho DN nhạy biến động).
      how_to_apply:
      - Mỗi kịch bản chọn 2-3 tín hiệu dẫn dắt (leading), tránh chỉ số trễ (lagging).
      - Đặt ngưỡng định lượng trước (vd NHNN giảm lãi suất 2 lần liên tiếp; cước tàu +30% trong 4 tuần; tỷ giá biến động >5% ngắn hạn).
      - 'Gắn mỗi tín hiệu vào hành động: theo dõi, chuẩn bị, kích hoạt (điểm tín hiệu m07_signal_score).'
      - Lập 'Ban chỉ đạo kịch bản' họp hằng tháng; ghi lại tín hiệu nào đã xuất hiện, đảo ngược chưa.
      - Rà soát cả bộ kịch bản mỗi 6-12 tháng và sau mọi cú sốc lớn.
      how_to_read_results: Nhiều tín hiệu cùng chỉ một ô là bằng chứng mạnh; tín hiệu mâu thuẫn nghĩa là hệ thống đang ở giữa/không tuân theo trục đã chọn, cần xem lại trục.
      pitfalls:
      - Chọn tín hiệu không đo được hoặc không có dữ liệu thường xuyên.
      - Phản ứng quá muộn vì ngưỡng đặt sau khi sự kiện diễn ra.
      example: 'BĐS: NHNN giảm lãi suất 2 lần liên tiếp -> KB1/KB3; trái phiếu DN BĐS vỡ nợ tăng -> KB4; giao dịch +30% cùng kỳ -> KB1. XNK: cước tàu tăng -> KB3/KB4; thay đổi thuế quan đối tác -> KB2.'
  - id: "m07-frameworks-6"
    title: "Frameworks: m07_backcasting — Lập kế hoạch ngược"
    tags: ["frameworks", "m07_backcasting", "lập", "kế", "hoạch", "ngược"]
    text: |-
      id: m07_backcasting
      name_vi: Lập kế hoạch ngược
      name_en: Backcasting
      origin: Khái niệm do John Robinson (1982) đề xuất trong nghiên cứu năng lượng; dùng trong foresight và quy hoạch bền vững, kết hợp với scenario khi muốn đạt một mục tiêu tương lai cụ thể.
      components:
      - Tương lai mong muốn
      - Các mốc trung gian
      - Bước đầu hiện tại
      - Rào cản và điều kiện cần
      when_to_use: Khi đã có tầm nhìn/mục tiêu rõ (vd đạt 100 triệu USD doanh thu năm 2030) và cần biết đường đi; bổ trợ scenario khi đã chọn ô mong muốn.
      how_to_apply:
      - Mô tả tương lai mong muốn đo được (năm, chỉ số).
      - 'Đi ngược: để đạt mốc đó, năm kề trước phải thế nào? Lặp đến hiện tại.'
      - Liệt kê điều kiện cần/rào cản ở mỗi mốc; gắn với kịch bản bất lợi có thể làm lệch lộ trình.
      - Chuyển các mốc thành mục tiêu năm và KPI (liên kết BSC).
      how_to_read_results: Cho ra lộ trình hành động; khác scenario (đi từ hiện tại ra nhiều tương lai) ở chỗ backcasting đi từ MỘT tương lai mong muốn lùi về.
      pitfalls:
      - Biến thành kế hoạch 1 kịch bản (mong muốn) và bỏ qua rủi ro.
      - Mục tiêu tương lai quá chung chung.
      example: 'Nguồn: 2030 đạt 100M USD -> 2028 đạt 50M -> 2026 mở thị trường mới -> 2025 hiện tại.'
  - id: "m07-frameworks-7"
    title: "Frameworks: m07_related_methods — So sánh với phương pháp liên quan"
    tags: ["frameworks", "m07_related_methods", "so", "sánh", "với", "phương", "pháp", "liên", "quan"]
    text: |-
      id: m07_related_methods
      name_vi: So sánh với phương pháp liên quan
      name_en: Scenario planning vs Forecasting, Sensitivity, Monte Carlo, Contingency, Strategic Foresight
      origin: Tập hợp các công cụ dự báo/phân tích rủi ro có trước hoặc song hành với scenario; mỗi công cụ trả lời một câu hỏi khác nhau.
      components:
      - 'Forecasting: một tương lai duy nhất'
      - 'Sensitivity analysis: đổi một biến, giữ nguyên còn lại'
      - 'Monte Carlo: mô phỏng hàng nghìn kịch bản xác suất'
      - 'Contingency planning: kế hoạch B nếu A thất bại'
      - 'Strategic Foresight: scenario + trend analysis + weak signals'
      when_to_use: Chọn công cụ đúng bài toán.
      how_to_apply:
      - 'Tương lai gần, quy luật ổn định, cần con số: forecasting.'
      - 'Muốn biết dự án nhạy với biến nào: sensitivity (kết hợp tài chính).'
      - 'Có phân phối xác suất đáng tin cho nhiều biến: Monte Carlo.'
      - 'Bất định cấu trúc, ngoặt chiến lược, không có xác suất tin được: scenario planning.'
      - 'Đã chọn chiến lược chính, cần phương án B: contingency (scenario cho ra cả robust lẫn contingent).'
      how_to_read_results: 'Có thể dùng chồng lớp: scenario để chọn hướng, sensitivity/Monte Carlo để tinh chỉnh số trong từng kịch bản.'
      pitfalls:
      - Dùng Monte Carlo cho biến không có phân phối đáng tin, tạo ảo giác chính xác.
      example: 'Mở chi nhánh: scenario chọn khung (thuê mặt bằng ổn định vs tăng mạnh), sensitivity kiểm doanh số hòa vốn trong từng khung.'
  - id: "m07-procedures-1"
    title: "Quy trình: m07_build_4_scenarios — Dựng 4 kịch bản cho một ngành/SME (từ đầu đến cuối)"
    tags: ["quy", "trình", "m07_build_4_scenarios", "dựng", "kịch", "bản", "cho", "một", "ngành", "sme", "từ", "đầu"]
    text: |-
      id: m07_build_4_scenarios
      name: Dựng 4 kịch bản cho một ngành/SME (từ đầu đến cuối)
      steps:
      - 'Hỏi người dùng (intake): quyết định cần đưa ra là gì? Horizon bao lâu? Ngân sách và vốn có thể đặt cược? Ai ra quyết định? Có phụ thuộc lớn vào lãi suất, tỷ giá, chính sách, một khách hàng/nhà cung cấp/nền tảng nào không?'
      - Viết lại thành câu hỏi quyết định một câu (vd 'Có nên mở chi nhánh thứ 4 trong 3 năm tới?'). Đây là 'bộ lọc' cho mọi bước sau.
      - 'Lập 10-15 driving forces (PESTEL + ngành + khách hàng). Tách: chắc chắn (đưa vào nền chung) và bất định.'
      - Chấm I và U (1-5), tính S=I x U; chọn các yếu tố S>=16; kiểm tra tương quan; chọn 2 trục độc lập, mỗi trục có hai cực định nghĩa đo được.
      - Dựng ma trận 2x2; đặt 4 tên gợi hình; viết câu chuyện mỗi kịch bản 150-300 chữ (sự kiện kích hoạt, hành vi khách hàng/đối thủ/chính sách, hệ quả, trông ra sao cuối horizon).
      - Ước tính tác động định lượng thô lên doanh thu, chi phí, dòng tiền cho mỗi kịch bản (dựa trên mô hình tài chính hiện có); xác định runway (m07_cash_runway) ở kịch bản xấu nhất.
      - 'Liệt kê 3-5 phương án chiến lược (gồm giữ nguyên và giữ tiền mặt); wind-tunnel: ma trận payoff hoặc ✅/⚠️/❌; tính maximin, regret, EV (nếu có trọng số), độ vững.'
      - 'Phân loại hành động: robust (làm ngay), contingent (chuẩn bị, kích hoạt theo tín hiệu), bỏ.'
      - Đặt 2-3 tín hiệu sớm cho mỗi kịch bản, ngưỡng, nguồn dữ liệu, người theo dõi; lịch họp rà soát; lịch refresh kịch bản (6-12 tháng).
      - 'Báo cáo: câu hỏi quyết định, bảng driving forces, ma trận 2x2 + 4 câu chuyện, bảng wind-tunnel, đề xuất hành động 30-60-90 ngày, bảng tín hiệu.'
      outputs: 'Gói 5 mục: ma trận kịch bản kèm narrative; bảng wind-tunnel; danh sách robust/contingent; bảng tín hiệu và ngưỡng; lịch rà soát.'
  - id: "m07-procedures-2"
    title: "Quy trình: m07_lean_scenario_sme — Bản rút gọn cho SME/startup (workshop nửa ngày)"
    tags: ["quy", "trình", "m07_lean_scenario_sme", "bản", "rút", "gọn", "cho", "sme", "startup", "workshop", "nửa", "ngày"]
    text: |-
      id: m07_lean_scenario_sme
      name: Bản rút gọn cho SME/startup (workshop nửa ngày)
      steps:
      - Chủ DN + 2-4 người (tài chính, vận hành, bán hàng, một người ngoài) họp 3-4 giờ.
      - Viết quyết định cần ra (một câu) và horizon 2-3 năm.
      - Sticky-note 10 yếu tố ngoài DN có thể làm thay đổi kết quả; chấm I, U bằng bỏ phiếu 1-5.
      - Chọn 2 trục; vẽ 4 ô; mỗi ô viết 5 gạch đầu dòng thay cho narrative dài.
      - 'Với mỗi ô trả lời 3 câu: doanh thu/biên lợi nhuận thay đổi bao nhiêu? tiền mặt chịu được mấy tháng? mình sẽ làm gì?'
      - Chọn 3 hành động 'không hối tiếc' (làm ngay) + 1 phương án dự phòng; chọn 4-6 tín hiệu dễ theo dõi (Google Trends, giá cước, tỷ giá, lãi suất NH, số đơn).
      - Đặt lịch rà soát 15 phút hằng tháng và refresh sau 6 tháng.
      outputs: '1 trang A3: ma trận 2x2, 3 hành động không hối tiếc, 1 phương án dự phòng, bảng 4-6 tín hiệu.'
  - id: "m07-procedures-3"
    title: "Quy trình: m07_stress_test_existing_strategy — Stress-test một chiến lược hoặc thương vụ có sẵn"
    tags: ["quy", "trình", "m07_stress_test_existing_strategy", "stress", "test", "một", "chiến", "lược", "hoặc", "thương", "vụ", "có"]
    text: |-
      id: m07_stress_test_existing_strategy
      name: Stress-test một chiến lược hoặc thương vụ có sẵn
      steps:
      - Mô tả chiến lược/thương vụ (đầu tư, doanh thu kỳ vọng, cơ cấu vốn).
      - Dựng 4 kịch bản (procedure m07_build_4_scenarios bước 3-5), chỉ lấy thông số ảnh hưởng đến chiến lược.
      - Tính kết quả chiến lược ở từng kịch bản (NPV, EBITDA, DSCR, runway).
      - 'Tìm điểm gãy: kịch bản nào làm DN không trả nợ/cạn tiền; cần điều chỉnh gì (cấu trúc vốn, tiến độ, hợp đồng) để sống sót.'
      - Đề xuất sửa chiến lược (giảm vay, chia giai đoạn, thêm nguồn thu, option mua/bán) rồi test lại.
      outputs: Bảng kết quả theo kịch bản, điểm gãy, phiên bản chiến lược đã điều chỉnh.
  - id: "m07-procedures-4"
    title: "Quy trình: m07_scenario_governance — Vận hành sau khi dựng kịch bản"
    tags: ["quy", "trình", "m07_scenario_governance", "vận", "hành", "sau", "khi", "dựng", "kịch", "bản"]
    text: |-
      id: m07_scenario_governance
      name: Vận hành sau khi dựng kịch bản
      steps:
      - Lập Ban chỉ đạo kịch bản (chủ DN + tài chính + vận hành + bán hàng), họp hằng tháng 30-45 phút.
      - Cập nhật bảng tín hiệu (xuất hiện/chưa), tính điểm tín hiệu, ghi quyết định.
      - 'Khi điểm tín hiệu vượt ngưỡng: kích hoạt phương án contingent đã chuẩn bị; ghi ngày, người chịu trách nhiệm.'
      - 'Sau sự kiện lớn hoặc 6-12 tháng: rà lại trục, kịch bản, trọng số; loại kịch bản đã lạc hậu, thêm kịch bản mới.'
      - 'Ghi bài học: kịch bản nào gần đúng, tín hiệu nào hiệu quả.'
      outputs: Nhật ký tín hiệu, quyết định kích hoạt, phiên bản kịch bản cập nhật.
  - id: "m07-decision_rules-1"
    title: "Quy tắc quyết định: Nếu quyết định ngắn hạn/vận hành hằng ngày thì KHÔNG dùng scenario planning; dùng kế hoạch thường v…"
    tags: ["quy", "tắc", "quyết", "định", "nếu", "ngắn", "hạn", "vận", "hành", "hằng", "ngày", "thì"]
    text: |-
      Nếu quyết định ngắn hạn/vận hành hằng ngày thì KHÔNG dùng scenario planning; dùng kế hoạch thường và theo dõi KPI.
  - id: "m07-decision_rules-2"
    title: "Quy tắc quyết định: Nếu quyết định có horizon 5-10 năm, vốn lớn hoặc khó đảo ngược thì dùng đầy đủ 8 bước; SME horizon …"
    tags: ["quy", "tắc", "quyết", "định", "nếu", "có", "horizon", "10", "năm", "vốn", "lớn", "hoặc"]
    text: |-
      Nếu quyết định có horizon 5-10 năm, vốn lớn hoặc khó đảo ngược thì dùng đầy đủ 8 bước; SME horizon 3-5 năm thì dùng bản rút gọn.
  - id: "m07-decision_rules-3"
    title: "Quy tắc quyết định: Nếu yếu tố có tác động cao nhưng bất định thấp (xu hướng rõ) thì đưa vào nền chung của mọi kịch bản…"
    tags: ["quy", "tắc", "quyết", "định", "nếu", "yếu", "tố", "có", "tác", "động", "cao", "nhưng"]
    text: |-
      Nếu yếu tố có tác động cao nhưng bất định thấp (xu hướng rõ) thì đưa vào nền chung của mọi kịch bản, KHÔNG dùng làm trục.
  - id: "m07-decision_rules-4"
    title: "Quy tắc quyết định: Nếu hai trục ứng viên tương quan mạnh (lãi suất và tín dụng BĐS) thì thay một trục bằng yếu tố độc …"
    tags: ["quy", "tắc", "quyết", "định", "nếu", "hai", "trục", "ứng", "viên", "tương", "quan", "mạnh"]
