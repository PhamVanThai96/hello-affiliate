      Nếu hai trục ứng viên tương quan mạnh (lãi suất và tín dụng BĐS) thì thay một trục bằng yếu tố độc lập hơn, hoặc gộp thành một trục và tìm trục thứ hai.
  - id: "m07-decision_rules-5"
