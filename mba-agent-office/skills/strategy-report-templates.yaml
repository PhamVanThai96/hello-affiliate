id: strategy-report-templates
title: "Chiến lược — mẫu báo cáo/bảng biểu"
summary: "Cấu trúc chung và các mẫu báo cáo chiến lược kinh doanh."
agents: ["strategist"]
order: 61
when: ["__chi_tra_cuu_bang_skill_search__"]
sections:
  - id: "tpl-cau-truc-chung"
    title: "Mẫu báo cáo — cấu trúc chung"
    tags: ["mẫu", "báo", "cáo", "cấu", "trúc"]
    text: |-
      - 1. Tóm tắt điều hành (kết luận + phát hiện chính + khuyến nghị trong 3-5 dòng)
      - 2. Bối cảnh và dữ liệu đầu vào (kèm nhãn VERIFIED/GIẢ ĐỊNH/CHƯA KIỂM CHỨNG)
      - 3. Framework sử dụng và lý do chọn (kèm giới hạn)
      - '4. Phân tích từng bước (bảng chấm điểm: tiêu chí, trọng số, điểm, bằng chứng)'
      - 5. Phân tích độ nhạy / kịch bản
      - 6. Diễn giải ý nghĩa kinh doanh và so sánh benchmark
      - 7. Lựa chọn chiến lược và khuyến nghị (ưu/nhược, điều kiện thay đổi khuyến nghị)
      - 8. Rủi ro, giả định, giới hạn và disclaimer
      - 9. KPI theo dõi và bước hành động tiếp theo (người phụ trách, hạn)
