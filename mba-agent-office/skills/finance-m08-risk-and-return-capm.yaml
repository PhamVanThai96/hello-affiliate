  - id: "m08-practice_questions-3"
    title: "Câu hỏi luyện tập: A: E 14%, sigma 22%; B: E 8%, sigma 12%; rho 0,25; danh mục 60/40. Tính E, sigma_p."
    tags: ["câu", "hỏi", "luyện", "tập", "14", "sigma", "22", "12", "rho", "25", "danh", "mục"]
    text: |-
      q: 'A: E 14%, sigma 22%; B: E 8%, sigma 12%; rho 0,25; danh mục 60/40. Tính E, sigma_p.'
      a: E 11,6%; sigma_p 15,13% (so với 18,0%).
