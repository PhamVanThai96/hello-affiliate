    title: "Mẫu Excel/Sheets: TAB 2 Thống kê: E=SUMPRODUCT(p,R); Var=SUMPRODUCT(p,(R-E)^2); sigma=SQRT(Var); CV=sigma/E; Cov=SUMP…"
    tags: ["mẫu", "excel", "sheets", "tab", "thống", "kê", "sumproduct", "var", "sigma", "sqrt", "cv", "cov"]
    text: |-
      TAB 2 Thống kê: E=SUMPRODUCT(p,R); Var=SUMPRODUCT(p,(R-E)^2); sigma=SQRT(Var); CV=sigma/E; Cov=SUMPRODUCT(p,(RA-EA)*(RB-EB)); rho=Cov/(sA*sB)
  - id: "m08-excel_google_sheets_templates-3"
    title: "Mẫu Excel/Sheets: TAB 3 Danh mục: bảng tỷ trọng 0..100% bước 10%: E=w*EA+(1-w)*EB; sigma_p=SQRT(w^2*VarA+(1-w)^2*VarB…"
    tags: ["mẫu", "excel", "sheets", "tab", "danh", "mục", "bảng", "tỷ", "trọng", "100", "bước", "10"]
    text: |-
      TAB 3 Danh mục: bảng tỷ trọng 0..100% bước 10%: E=w*EA+(1-w)*EB; sigma_p=SQRT(w^2*VarA+(1-w)^2*VarB+2*w*(1-w)*Cov); Sharpe=(Ep-Rf)/sigma_p; tô xanh Sharpe cao nhất, tô đỏ lỗ xấu nhất vượt mức chấp nhận
  - id: "m08-excel_google_sheets_templates-4"
