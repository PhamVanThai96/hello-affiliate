    text: |-
      q: Hãy nêu một chỉ báo cảnh báo sớm tốt và một chỉ báo kém trong R-Estate.
      a: 'Tốt: lãi suất cho vay thực tế hoặc vỡ nợ trái phiếu BĐS tăng (đo được, nhanh, cùng trục). Kém: số nghị định theo dõi hàng tuần (tần suất thấp) và lãi suất tiết kiệm làm đại diện cho lãi suất vay.'
