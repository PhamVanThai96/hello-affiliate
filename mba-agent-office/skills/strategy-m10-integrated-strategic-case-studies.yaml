  - id: "m10-case_lessons-13"
    title: "Bài học case: Bất động sản Việt Nam 2025-2030 (ví dụ minh họa phần III)"
    tags: ["bài", "học", "case", "bất", "động", "sản", "việt", "nam", "2025", "2030", "ví", "dụ"]
    text: |-
      name: Bất động sản Việt Nam 2025-2030 (ví dụ minh họa phần III)
      type: sme
      setup: 'Câu hỏi: công ty BĐS hạng trung nên đầu tư phân khúc nào 5 năm tới? Trục: Lãi suất (thấp 6-8% / cao 10-14%) x Chính sách (thông thoáng / siết chặt).'
      key_calculations:
      - 'Driving forces (impact, uncertainty): Luật Đất đai 2024 (cao, cao); lãi suất (cao, cao); siết tín dụng BĐS (cao, cao); đô thị hóa (cao, thấp); Gen Z (cao, trung bình); PropTech (trung bình, cao). Điểm skill I x U: 25 cho ba yếu tố cao-cao, 5 cho đô thị hóa (5 x 1) nên là trend chắc chắn, không làm trục.'
      - 'Bốn kịch bản: Bùng nổ (giá tăng 20-30%), Chọn lọc, Đóng băng từ từ, Khủng hoảng (giá giảm 20-40%, M&A tăng).'
      - 'Wind tunnel: Mở rộng nhanh tổng 4, min 0; Chất lượng cao cấp 7, min 1; Đa dạng bán + cho thuê + dịch vụ 8, min 2; Bảo thủ giữ tiền 7, min 1.'
      - 'Chỉ báo sớm: NHNN giảm lãi suất 2 lần liên tiếp (KB1/KB3); cấp phép dự án +50% (KB1/KB2); vỡ nợ trái phiếu BĐS tăng (KB4); giao dịch +30% (KB1); Quốc hội thông qua siết tín dụng (KB3/KB4).'
      lesson: Chiến lược đa dạng là robust nhưng không tối đa hóa ở KB1; Mở rộng nhanh vay nhiều hưởng lợi lớn nhất ở KB1 và chết ở KB4. Nhiều tiêu chí bổ sung ở worked_examples m10_we_rstate_payoff.
      data_reliability: illustrative
  - id: "m10-case_lessons-14"
    title: "Bài học case: R-Estate Group - ứng biến chu kỳ 2026-2030 (case giả định)"
    tags: ["bài", "học", "case", "estate", "group", "ứng", "biến", "chu", "kỳ", "2026", "2030", "giả"]
    text: |-
      name: R-Estate Group - ứng biến chu kỳ 2026-2030 (case giả định)
      type: sme
      setup: 'Hai bất định: pháp lý đất đai (thông suốt/tắc nghẽn) x lãi suất vay (thấp/thắt chặt). Bốn kịch bản kèm chiến lược sinh tồn cụ thể.'
      key_calculations:
      - 'KB1 (pháp lý thông, lãi thấp): quy hoạch đại đô thị xanh, đòn bẩy tiền mặt để thâu tóm quỹ đất sạch, mở bán nhanh, IPO mảng dự án.'
      - 'KB2 (pháp lý thông, lãi cao): M&A bán sỉ dự án cho dòng vốn ngoại, chấp nhận chiết khấu để giảm nợ gốc.'
      - 'KB3 (pháp lý tắc, lãi cao): ngủ đông tuyệt đối, đóng băng dự án dở dang, cắt 60% định phí lương ban quản lý cơ sở, khất nợ ngân hàng, bảo toàn tiền mặt.'
      - 'KB4 (pháp lý tắc, lãi thấp): dừng mua đất mập mờ pháp lý, chuyển vốn rẻ sang cải tạo tòa nhà văn phòng cho thuê để tạo dòng tiền thụ động nuôi bộ máy.'
      - 'Hai chỉ báo nguồn: lãi suất tiết kiệm 12 tháng Big 4 và số nghị định tháo gỡ pháp lý. Điểm tín hiệu minh họa của skill: KB4-tồi: 2 tín hiệu quan trọng (nợ xấu trái phiếu tăng, luật siết tín dụng) + 2 phụ -> (2*1 + 2*0 + 1*1 + 1*0.5) / 6 = 0.583 -> chuẩn bị nguồn lực.'
      lesson: 'Chiến lược cho từng kịch bản rất rõ nhưng thiếu số: không có tổn thất định lượng, không có ngưỡng kích hoạt. Khi dùng, bổ sung payoff, ngưỡng tiền mặt/runway (m07_cash_runway) và 4-5 chỉ báo có ngưỡng; nhớ lãi suất tiền gửi chỉ là đại diện của lãi suất cho vay.'
      data_reliability: illustrative
  - id: "m10-worked_examples-1"
    title: "Ví dụ có lời giải: m10_we_ge_samsung — Phân loại GE-McKinsey 6 SBU Samsung và kiểm tra nhãn của nguồn"
    tags: ["ví", "dụ", "có", "lời", "giải", "m10_we_ge_samsung", "phân", "loại", "ge", "mckinsey", "sbu", "samsung"]
    text: |-
      id: m10_we_ge_samsung
      title: Phân loại GE-McKinsey 6 SBU Samsung và kiểm tra nhãn của nguồn
      inputs:
        scores: '(ngành, vị thế): Semiconductor (5.0, 4.5); Galaxy (3.5, 4.0); Display (4.5, 5.0); Gia dụng (3.0, 3.5); SDI (4.5, 3.0); Heavy (2.0, 2.5)'
        rule: thấp < 2.33; TB 2.33-3.67; cao > 3.67; lưới m04_ge_zone
      steps:
      - 'Semiconductor: cao, cao -> Invest/Grow'
      - 'Galaxy: ngành 3.5 = trung bình, vị thế 4.0 = cao -> Invest/Grow (chọn lọc)'
      - 'Display: cao, cao -> Invest/Grow'
      - 'Gia dụng: trung bình, trung bình -> Selective (Duy trì bảo vệ)'
      - 'SDI: ngành 4.5 = cao, vị thế 3.0 = trung bình -> Invest/Grow; nguồn gán ''Selective Invest, vàng'' (lệch màu)'
      - 'Heavy: ngành 2.0 = thấp, vị thế 2.5 = trung bình -> Harvest/Divest'
      - 'Độ nhạy +-0.3: Galaxy, SDI luôn Invest; Gia dụng đổi từ Selective sang Invest khi vị thế +0.3 (3.5 thành 3.8, vượt ngưỡng 3.67): kết quả của Gia dụng nhạy, cần kiểm bằng tài chính.'
      result: '4 SBU Invest/Grow (Semi, Galaxy, Display, SDI), 1 Selective (Gia dụng, nhạy), 1 Harvest (Heavy). Khuyến nghị: dồn vốn cho Semi và Display; SDI cần mô hình tài chính để quyết định mức vốn (hạn chế nguồn); xem xét Heavy. Dữ liệu là case nguồn chưa kiểm chứng.'
  - id: "m10-worked_examples-2"
    title: "Ví dụ có lời giải: m10_we_ge_sme_axes — Chấm hai trục GE-McKinsey cho một mảng của SME (dùng bảng trọng số nguồn)"
    tags: ["ví", "dụ", "có", "lời", "giải", "m10_we_ge_sme_axes", "chấm", "hai", "trục", "ge", "mckinsey", "cho"]
    text: |-
      id: m10_we_ge_sme_axes
      title: Chấm hai trục GE-McKinsey cho một mảng của SME (dùng bảng trọng số nguồn)
      inputs:
        sbu: Mảng 'cà phê hạt cho khách sạn' của công ty rang xay giả định (illustrative)
        industry_scores: quy mô 3, tăng trưởng 4, lợi nhuận ngành 3, cường độ cạnh tranh gay gắt nên đảo điểm = 1, rào cản gia nhập 2, công nghệ 3, rủi ro môi trường 4
        competitive_scores: thị phần 2, chất lượng 4, thương hiệu 3, chi phí 3, R&D 2, phân phối 3, quản lý 4, tài chính 2
        weights_industry:
        - 0.2
        - 0.2
        - 0.15
        - 0.15
        - 0.1
        - 0.1
        - 0.1
        weights_competitive:
        - 0.2
        - 0.15
        - 0.15
        - 0.15
        - 0.1
        - 0.1
        - 0.1
        - 0.05
      steps:
      - 'Kiểm tra tổng trọng số: ngành 1.00; vị thế 1.00'
      - IA = 0.20*3 + 0.20*4 + 0.15*3 + 0.15*1 + 0.10*2 + 0.10*3 + 0.10*4 = 0.60 + 0.80 + 0.45 + 0.15 + 0.20 + 0.30 + 0.40 = 2.90
      - CS = 0.20*2 + 0.15*4 + 0.15*3 + 0.15*3 + 0.10*2 + 0.10*3 + 0.10*4 + 0.05*2 = 0.40 + 0.60 + 0.45 + 0.45 + 0.20 + 0.30 + 0.40 + 0.10 = 2.90
      - 'Mức: ngành TB, vị thế TB -> ô giữa: Selective / Duy trì bảo vệ'
      result: 'Điểm (2.90, 2.90): ô Duy trì bảo vệ. Hành động: giữ khách hiện có, không bơm vốn lớn; thử nâng 1-2 yếu tố vị thế (thị phần, R&D) và chạy lại. Đây là chấm minh họa; trọng số/điểm là giả định.'
  - id: "m10-worked_examples-3"
    title: "Ví dụ có lời giải: m10_we_bcg_netflix — Phân loại BCG 4 SBU kiểu Netflix với số giả định (nguồn chỉ có nhãn)"
    tags: ["ví", "dụ", "có", "lời", "giải", "m10_we_bcg_netflix", "phân", "loại", "bcg", "sbu", "kiểu", "netflix"]
    text: |-
      id: m10_we_bcg_netflix
      title: Phân loại BCG 4 SBU kiểu Netflix với số giả định (nguồn chỉ có nhãn)
      inputs:
        assumed: '(thị phần %, đối thủ lớn nhất %, tăng trưởng thị trường %): Originals (36, 30, 16); Licensed (30, 12, 4); Games (1, 10, 25); DVD (3, 9, -15). Số do skill giả định vì nguồn không cho.'
        thresholds: RMS = 1.0; tăng trưởng 10%
      steps:
      - 'Originals: RMS = 36/30 = 1.20; tăng trưởng 16% -> Star'
      - 'Licensed: RMS = 30/12 = 2.50; 4% -> Cash Cow'
      - 'Games: RMS = 1/10 = 0.10; 25% -> Question Mark'
      - 'DVD: RMS = 3/9 = 0.333; -15% -> Dog'
      - 'Cân đối dòng tiền giả định (tỷ USD): Cow +10; Star -3; QM -2; Dog 0 -> N = 10 - 3 - 2 = +5 (đủ nuôi)'
      result: 'Phù hợp nhãn nguồn. N = +5 nghĩa danh mục tự chủ. Quyết định: tiếp tục tái đầu tư Originals, nuôi Games có mốc dừng (RMS 0.10 rất thấp), đóng DVD. Số là giả định; áp dụng cho dự án thật cần dữ liệu thực.'
  - id: "m10-worked_examples-4"
    title: "Ví dụ có lời giải: m10_we_spotify_canvas — Độ phân kỳ đường giá trị của Spotify so với CD và iTunes"
    tags: ["ví", "dụ", "có", "lời", "giải", "m10_we_spotify_canvas", "độ", "phân", "kỳ", "đường", "giá", "trị"]
    text: |-
      id: m10_we_spotify_canvas
      title: Độ phân kỳ đường giá trị của Spotify so với CD và iTunes
      inputs:
        scores_0_5: yếu tố [giá hợp lý khi dùng nhiều, tiện lợi di động, gợi ý thông minh, chia sẻ xã hội, sở hữu vật chất]. CD [1,1,0,0,5]; iTunes [3,4,1,1,2]; Spotify [5,5,5,4,0]
        note: Điểm là giả định của skill, ánh xạ từ mô tả định tính trong nguồn
      steps:
      - D(Spotify, CD) = (|5-1| + |5-1| + |5-0| + |4-0| + |0-5|)/5 = (4+4+5+4+5)/5 = 22/5 = 4.4
      - D(Spotify, iTunes) = (|5-3| + |5-4| + |5-1| + |4-1| + |0-2|)/5 = (2+1+4+3+2)/5 = 12/5 = 2.4
      - 'Tương quan Pearson: r(Spotify, CD) = -0.923; r(Spotify, iTunes) = 0.195'
      - 'ERRC: 3 Eliminate (đĩa vật lý, tải lậu, giới hạn lưu trữ), 3 Reduce, 3 Raise, 3 Create -> đủ 4 hành động'
      result: 'D = 2.4-4.4 (> 1.5 phân kỳ rõ) và tương quan thấp/âm: đường giá trị khác biệt; yếu tố ''sở hữu vật chất'' bị loại bỏ có chủ đích. Tính ''BOUI'' không thể làm vì nguồn không định nghĩa; dùng D thay thế.'
  - id: "m10-worked_examples-5"
    title: "Ví dụ có lời giải: m10_we_stech_bsc — Chấm BSC kỳ đầu của S-Tech với số thực hiện giả định"
    tags: ["ví", "dụ", "có", "lời", "giải", "m10_we_stech_bsc", "chấm", "bsc", "kỳ", "đầu", "của", "tech"]
    text: |-
      id: m10_we_stech_bsc
      title: Chấm BSC kỳ đầu của S-Tech với số thực hiện giả định
      inputs:
        targets: ROE >= 22%; giữ chân đối tác >= 92%; chu kỳ phát triển <= 6 tháng (baseline 12); Dashboard 100% lãnh đạo
        actuals_assumed: ROE 19%; giữ chân 89%; chu kỳ 8 tháng; Dashboard 70%
        weights: Tài chính 0.35; Khách hàng 0.30; Quy trình 0.20; Học hỏi 0.15 (mỗi viễn cảnh một KPI chính)
      steps:
      - 'Tài chính: 19/22 = 0.864 (m06_kpi_score_higher)'
      - 'Khách hàng: 89/92 = 0.967'
      - 'Quy trình (càng thấp càng tốt, theo mốc nền): (8 - 12)/(6 - 12) = 0.667'
      - 'Học hỏi: 70/100 = 0.700'
      - Tổng = 0.35*0.8636 + 0.30*0.9674 + 0.20*0.6667 + 0.15*0.70 = 0.3023 + 0.2902 + 0.1333 + 0.105 = 0.831
      - 'RAG theo m06 (>= 0.9 xanh; 0.7-0.9 vàng; < 0.7 đỏ): tổng vàng; Quy trình 0.667 đỏ; Học hỏi 0.70 vàng sát đỏ'
      result: Điểm tổng 0.831 vàng nhưng Quy trình đỏ (chu kỳ ra mắt) là nút thắt kéo trễ doanh thu IoT; ưu tiên sáng kiến Agile + tự động hóa khuôn đúc; Học hỏi cần đẩy Dashboard. Dữ liệu thực hiện là giả định.
  - id: "m10-worked_examples-6"
    title: "Ví dụ có lời giải: m10_we_rstate_payoff — R-Estate: so sánh 4 chiến lược qua 4 kịch bản bằng nhiều tiêu chí"
    tags: ["ví", "dụ", "có", "lời", "giải", "m10_we_rstate_payoff", "estate", "so", "sánh", "chiến", "lược", "qua"]
    text: |-
      id: m10_we_rstate_payoff
      title: 'R-Estate: so sánh 4 chiến lược qua 4 kịch bản bằng nhiều tiêu chí'
      inputs:
        payoff_tỷ_VNĐ_giả_định: A Mở rộng nhanh vay nhiều [1200,300,-300,-1500]; B Tập trung chất lượng cao cấp [700,450,100,-300]; C Đa dạng bán + cho thuê + dịch vụ [500,380,200,80]; D Bảo thủ giữ tiền [60,80,80,150]; kịch bản KB1 Bùng nổ, KB2 Chọn lọc, KB3 Đóng băng từ từ, KB4 Khủng hoảng
        weights_assumed: KB1 0.25; KB2 0.30; KB3 0.20; KB4 0.25 (chủ quan; nguồn Scenario không gán xác suất)
      steps:
      - 'Giá trị kỳ vọng: A = 0.25*1200 + 0.30*300 + 0.20*(-300) + 0.25*(-1500) = -45; B = 255; C = 299; D = 92.5'
      - 'Maximin (xấu nhất): A -1500; B -300; C 80; D 60 -> chọn C'
      - 'Regret: max từng cột = [1200, 450, 200, 150]. Regret A [0,150,500,1650] max 1650; B [500,0,100,450] max 500; C [700,70,0,70] max 700; D [1140,370,120,0] max 1140 -> minimax regret chọn B'
      - 'Tỷ lệ kịch bản đạt >= 0: A 0.50; B 0.75; C 1.00; D 1.00'
      result: C đồng thời có EV cao nhất, maximin cao nhất và robustness 1.0 -> chiến lược chủ đạo (khớp kết luận ROBUST của nguồn). B tốt khi sợ bỏ lỡ KB1 (regret nhỏ nhất). A phá sản ở KB4 (-1500). Xác suất là giả định và phải ghi rõ.
  - id: "m10-worked_examples-7"
    title: "Ví dụ có lời giải: m10_we_wind_tunnel — Wind tunnel bảng Robust của ví dụ BĐS VN"
    tags: ["ví", "dụ", "có", "lời", "giải", "m10_we_wind_tunnel", "wind", "tunnel", "bảng", "robust", "của", "bđs"]
    text: |-
      id: m10_we_wind_tunnel
      title: Wind tunnel bảng Robust của ví dụ BĐS VN
      inputs:
        grades: 2 = tốt (dấu tích), 1 = rủi ro (cảnh báo), 0 = thất bại (dấu X)
      steps:
      - 'Mở rộng nhanh: [2,1,1,0] -> tổng 4, min 0, đạt >= 1: 3/4 = 0.75'
      - 'Chất lượng cao cấp: [2,2,2,1] -> tổng 7, min 1, đạt 4/4'
      - 'Đa dạng bán + cho thuê + dịch vụ: [2,2,2,2] -> tổng 8, min 2'
      - 'Bảo thủ: [1,2,2,2] -> tổng 7, min 1'
      result: Đa dạng hóa là Robust (tổng 8, min 2). Mở rộng nhanh có ô 0 -> chỉ làm có giới hạn vốn.
  - id: "m10-worked_examples-8"
    title: "Ví dụ có lời giải: m10_we_pct_check — Kiểm tra lại con số '400%' của Shell"
    tags: ["ví", "dụ", "có", "lời", "giải", "m10_we_pct_check", "kiểm", "tra", "lại", "con", "số", "400"]
    text: |-
      id: m10_we_pct_check
      title: Kiểm tra lại con số '400%' của Shell
      inputs:
        old: 3
        new: 12
      steps:
      - Phần trăm tăng = (12 - 3)/3 * 100 = 300
      - Hệ số = 12/3 = 4 lần
      result: 300% (gấp 4 lần). Mọi con số tăng% trong case nên tự tính lại trước khi báo cáo.
  - id: "m10-practice_questions-1"
    title: "Câu hỏi luyện tập: Vì sao thị phần tương đối, không phải thị phần tuyệt đối, là trục ngang BCG?"
    tags: ["câu", "hỏi", "luyện", "tập", "vì", "sao", "thị", "phần", "tương", "đối", "không", "phải"]
    text: |-
      q: Vì sao thị phần tương đối, không phải thị phần tuyệt đối, là trục ngang BCG?
      a: 'Henderson (1970) dựa trên đường cong kinh nghiệm: so với đối thủ lớn nhất, thị phần tương đối cao nghĩa là khối lượng tích lũy lớn, chi phí đơn vị thấp, dòng tiền nhiều. RMS > 1 nghĩa đang dẫn đầu.'
