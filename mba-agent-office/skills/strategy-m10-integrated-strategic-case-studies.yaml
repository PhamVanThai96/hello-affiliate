  - id: "m10-practice_questions-4"
    title: "Câu hỏi luyện tập: Netflix dùng Cash Cow nào để nuôi Star nào, và tại sao đóng DVD?"
    tags: ["câu", "hỏi", "luyện", "tập", "netflix", "dùng", "cash", "cow", "nào", "để", "nuôi", "star"]
    text: |-
      q: Netflix dùng Cash Cow nào để nuôi Star nào, và tại sao đóng DVD?
      a: Licensed Streaming nuôi Originals (và Games). DVD là Dog (tăng trưởng âm, thị phần co lại); giữ lại tốn chi phí cố định, trong khi nguồn lực cần cho streaming. Đó là self-cannibalization.
  - id: "m10-practice_questions-5"
    title: "Câu hỏi luyện tập: Phân biệt Blue Ocean thật với first-mover trong Red Ocean tương lai qua ví dụ VinFast."
