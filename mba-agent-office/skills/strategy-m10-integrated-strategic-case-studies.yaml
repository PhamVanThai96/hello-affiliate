    tags: ["câu", "hỏi", "luyện", "tập", "vì", "sao", "chiến", "lược", "mở", "rộng", "nhanh", "vay"]
    text: |-
      q: Vì sao chiến lược 'Mở rộng nhanh, vay nhiều' không robust?
      a: 'Điểm [2,1,1,0]: tuyệt vời ở KB1 nhưng phá sản ở KB4; min = 0. Robust đòi sống sót ở mọi kịch bản.'
