    text: |-
      q: GE-McKinsey khác BCG ở điểm nào và khi nào nên dùng?
      a: GE dùng nhiều tiêu chí có trọng số (7 cho ngành, 8 cho vị thế), 9 ô, trả lời 'đầu tư bao nhiêu'; phù hợp tập đoàn nhiều SBU. Nhược điểm chủ quan, phức tạp, không cho số tiền.
