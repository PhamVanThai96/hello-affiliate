      a: Tầng 2 (biết nhưng từ chối vì đắt/ngại) và tầng 3 (chưa từng nghĩ tới). Eliminate máy nặng, gương, văn hóa gym bro; Reduce thiết bị chuyên nghiệp; Raise không gian thoải mái, Judgement Free Zone; Create Pizza Monday, thẻ khoảng 10 USD/tháng.
  - id: "m10-practice_questions-8"
    title: "Câu hỏi luyện tập: Vì sao BSC dùng cả chỉ số dẫn và chỉ số trễ?"
