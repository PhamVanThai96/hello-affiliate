  - id: "m10-practice_questions-11"
    title: "Câu hỏi luyện tập: BSC khác OKR thế nào, và nên chọn khi nào?"
    tags: ["câu", "hỏi", "luyện", "tập", "bsc", "khác", "okr", "thế", "nào", "và", "nên", "chọn"]
    text: |-
      q: BSC khác OKR thế nào, và nên chọn khi nào?
      a: 'BSC: 4 viễn cảnh cố định, 20-25 KPI, chu kỳ năm, 100% = tốt, hợp DN lớn chiến lược ổn định. OKR: 3-5 Objective, 3-5 KR, chu kỳ quý, 70% = tốt, hợp startup/agile. DN hiện đại kết hợp cả hai.'
  - id: "m10-practice_questions-12"
    title: "Câu hỏi luyện tập: Vì sao Scenario Planning không đưa xác suất và có hạn chế gì?"
    tags: ["câu", "hỏi", "luyện", "tập", "vì", "sao", "scenario", "planning", "không", "đưa", "xác", "suất"]
    text: |-
      q: Vì sao Scenario Planning không đưa xác suất và có hạn chế gì?
      a: 'Nó đánh giá tính hợp lý (plausibility), không phải xác suất; không dự báo. Hạn chế: tốn thời gian (2-4 tuần), chủ quan, tê liệt nếu quá nhiều kịch bản, confirmation bias, không bao Black Swan.'
  - id: "m10-practice_questions-13"
    title: "Câu hỏi luyện tập: Chọn 2 trục kịch bản như thế nào?"
    tags: ["câu", "hỏi", "luyện", "tập", "chọn", "trục", "kịch", "bản", "như", "thế", "nào"]
    text: |-
      q: Chọn 2 trục kịch bản như thế nào?
      a: Chấm Impact x Uncertainty (m07); chọn hai yếu tố cao-cao, độc lập tương đối. Yếu tố tác động cao nhưng chắc chắn (đô thị hóa) đưa vào mọi kịch bản; bất định nhưng tác động nhỏ chỉ theo dõi.
