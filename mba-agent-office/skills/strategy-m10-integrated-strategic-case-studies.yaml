    text: |-
      q: Chỉ ra 2 lỗi nhất quán trong BSC S-Tech của nguồn.
      a: KPI Học hỏi (tỷ lệ phòng ban báo cáo tự động) lệch với target (100% lãnh đạo dùng Dashboard); mục tiêu 'rút ngắn một nửa' thiếu baseline; bản đồ có mục không có KPI trong bảng.
