    text: |-
      q: Phân biệt Blue Ocean thật với first-mover trong Red Ocean tương lai qua ví dụ VinFast.
      a: Blue Ocean thật phải đổi mới giá trị (giảm chi phí và nâng giá trị) ở một thị trường chưa có đối thủ trực tiếp; VF e34 ở VN 2021 có tính này, nhưng ở Mỹ/EU đối đầu Tesla, BYD nên là Red Ocean. Nguồn cũng nói 'chưa rõ'.
