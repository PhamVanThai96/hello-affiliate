  - id: "m10-case_lessons-1"
    title: "Bài học case: Unilever - quản lý portfolio theo BCG"
    tags: ["bài", "học", "case", "unilever", "quản", "lý", "portfolio", "theo", "bcg"]
    text: |-
      name: Unilever - quản lý portfolio theo BCG
      type: success
      setup: 'Bốn thương hiệu đại diện bốn ô BCG: Dove (Star), OMO/Surf (Cash Cow), Dollar Shave Club (Question Mark), margarine (Dog).'
      key_calculations:
      - 'Phân loại: Dove = thị phần #1 chăm sóc cá nhân toàn cầu, tăng trưởng cao -> Star; OMO/Surf #1 Việt Nam và Đông Nam Á, thị trường bão hòa -> Cash Cow; DSC nhỏ so với Gillette, thị trường DTC tăng -> Question Mark; margarine suy giảm -> Dog.'
      - 'Chuyển vốn theo nguồn: bán margarine cho KKR khoảng 8 tỷ USD (2018) để đầu tư vào thương hiệu tăng trưởng; mua DSC 1 tỷ USD (2016).'
      - 'Kiểm tra logic dòng tiền (skill): 8 tỷ USD thoái Dog lớn hơn 8 lần khoản mua DSC 1 tỷ USD (8/1 = 8) -> thoái Dogs tài trợ được nhiều cược Question Mark.'
      lesson: 'BCG hữu ích để quyết định ''bơm ở đâu, rút ở đâu''; thoái Dogs giải phóng vốn rất lớn. Nhưng BCG không dự đoán được phản ứng của Gillette: DSC không thành Star dù được xếp Question Mark có triển vọng. Cần bổ sung phân tích đối thủ khi cược Question Mark.'
      data_reliability: unverified
  - id: "m10-case_lessons-2"
    title: "Bài học case: Samsung Group - GE-McKinsey 6 SBU"
    tags: ["bài", "học", "case", "samsung", "group", "ge", "mckinsey", "sbu"]
    text: |-
      name: Samsung Group - GE-McKinsey 6 SBU
      type: success
      setup: 'Sáu SBU chấm hai trục 1-5: Semiconductor 5.0/4.5; Galaxy 3.5/4.0; Display 4.5/5.0; Gia dụng 3.0/3.5; SDI 4.5/3.0; Heavy 2.0/2.5.'
      key_calculations:
      - 'Semiconductor: ngành 5.0 cao, vị thế 4.5 cao -> Đầu tư tăng trưởng; nguồn ghi 230 tỷ USD cho chip 2022-2042.'
      - 'Galaxy: ngành 3.5 trung bình, vị thế 4.0 cao -> ô xanh Đầu tư chọn lọc. Display 4.5/5.0 -> Đầu tư tăng trưởng (nguồn: monopoly 80%, mở rộng sang ô tô).'
      - 'Gia dụng 3.0/3.5 cùng trung bình -> Duy trì bảo vệ. Heavy: ngành 2.0 thấp, vị thế 2.5 trung bình -> Thu hoạch/rút lui.'
      - 'SDI: ngành 4.5 cao, vị thế 3.0 trung bình -> theo lưới nguồn là ô xanh; nguồn ghi vàng (sai lệch nhãn, xem worked_examples m10_we_ge_samsung).'
      lesson: 'GE-McKinsey hỗ trợ quyết định tập trung nguồn lực (đổ vốn vào chip thay vì dàn đều) và cho phép tiếp tục đầu tư vào Display dù vị thế gần độc quyền vì ngành vẫn hấp dẫn (AR/VR). Hạn chế: không nói đầu tư BAO NHIÊU vào SDI, cần mô hình tài chính. Điểm số là chủ quan.'
      data_reliability: unverified
  - id: "m10-case_lessons-3"
    title: "Bài học case: Netflix - xoay trục danh mục và tự ăn thịt chính mình"
    tags: ["bài", "học", "case", "netflix", "xoay", "trục", "danh", "mục", "và", "tự", "ăn", "thịt"]
    text: |-
      name: Netflix - xoay trục danh mục và tự ăn thịt chính mình
      type: success
      setup: 'Từ cho thuê DVD qua bưu điện đối đầu Blockbuster sang streaming toàn cầu; nguồn xếp 4 SBU: Originals (Star), Licensed Streaming (Cash Cow), Games (Question Mark), DVD-by-Mail (Dog).'
      key_calculations:
      - 'Originals: tăng trưởng rất cao, thị phần số 1 -> Star; tái đầu tư trên 15 tỷ USD/năm (nguồn).'
      - 'Licensed Streaming: bão hòa nhẹ, thị phần rất lớn -> Cash Cow, nuôi studio nội dung tự sản xuất từ hơn 200 triệu tài khoản (nguồn, có thể lỗi thời).'
      - 'Games: tăng trưởng cao, thị phần sơ khai -> Question Mark, đầu tư chọn lọc qua mua studio indie, gộp vào gói cơ bản.'
      - 'DVD: tăng trưởng âm, thu hẹp tối đa -> Dog, đóng cửa vĩnh viễn tháng 9/2023.'
      - 'Ánh xạ Ansoff (skill suy luận, nguồn chưa xếp): DVD -> streaming là Product Development trên tệp khách có sẵn; vào thị trường quốc tế là Market Development; Games là Product Development hướng liên quan; Originals chuyển dần sang tích hợp dọc.'
      - 'Phép thử cân đối: nếu Cow tạo tiền ròng dương và Star cần tái đầu tư lớn thì N = tiền Cow - nhu cầu Star/QM phải >= 0 (m10_portfolio_cash_balance); nguồn không cho số.'
      lesson: 'Chủ động rút nguồn lực khỏi mảng đang sinh lời nhưng bị thay thế (DVD) để xây hạ tầng mới là điểm khác biệt với Blockbuster. Bài học cho SME: đặt ''ngày hoàng hôn'' cho mảng cũ ngay khi mảng mới có đà. Cảnh báo: phân loại BCG ở đây là diễn giải định tính của nguồn, thiếu RMS và tăng trưởng số.'
      data_reliability: unverified
  - id: "m10-case_lessons-4"
    title: "Bài học case: Cirque du Soleil - Blue Ocean kinh điển"
    tags: ["bài", "học", "case", "cirque", "du", "soleil", "blue", "ocean", "kinh", "điển"]
    text: |-
      name: Cirque du Soleil - Blue Ocean kinh điển
      type: success
      setup: 'Ngành xiếc suy tàn thập niên 1980: Ringling Bros lỗ, phản đối quyền động vật, TV và video game cạnh tranh, trẻ em ít hứng thú.'
      key_calculations:
      - Giá vé 100-300 USD so với 10-30 USD của xiếc truyền thống (gấp khoảng 10 lần mỗi đầu người) trong khi bỏ thú vật và ngôi sao (giảm chi phí).
      - Doanh thu trên 1 tỷ USD/năm trước COVID; 150 triệu+ khán giả ở 450+ thành phố (nguồn, chưa kiểm chứng).
      - 'Đối tượng mới: người lớn, cặp đôi, doanh nghiệp (phi khách hàng) thay vì gia đình và trẻ em.'
      lesson: Không đối đầu Ringling Bros mà tạo ngành mới trộn xiếc, nhà hát, concert; điểm cốt lõi là vừa giảm chi phí (bỏ thú, ngôi sao) vừa nâng giá trị và giá bán. Chú ý lỗi định tính của ERRC nguồn.
      data_reliability: unverified
  - id: "m10-case_lessons-5"
    title: "Bài học case: Nintendo Wii - Blue Ocean trong console"
    tags: ["bài", "học", "case", "nintendo", "wii", "blue", "ocean", "trong", "console"]
    text: |-
      name: Nintendo Wii - Blue Ocean trong console
      type: success
      setup: '2006: PS3 và Xbox 360 đua cấu hình cho hardcore gamer giá 399-599 USD; Wii giá 249 USD, motion control, nhắm cả gia đình và người không chơi game.'
      key_calculations:
      - 'Chênh giá thấp nhất: 399 - 249 = 150 USD (37.6%); cao nhất 599 - 249 = 350 USD (58.4%).'
      - 'Doanh số theo nguồn: Wii 101M so với PS3 87M, Xbox 360 84M; Wii cao hơn PS3 14M máy (16.1%).'
      - 'Nguồn: Sony lỗ khoảng 240 USD mỗi máy PS3 năm đầu; Wii giảm chi phí phần cứng nên biên cao hơn.'
      lesson: 'Nhắm phi khách hàng (ông bà, mẹ, người không chơi game) và giảm cấu hình, giá thấp tạo Blue Ocean. Nhưng Blue Ocean không bền: Wii U (2012) thất bại, Nintendo phải tìm Switch (2017). Lập kế hoạch tìm Blue Ocean tiếp theo.'
      data_reliability: unverified
  - id: "m10-case_lessons-6"
    title: "Bài học case: VinFast VF e34 tại Việt Nam - nỗ lực Blue Ocean (2021)"
    tags: ["bài", "học", "case", "vinfast", "vf", "e34", "tại", "việt", "nam", "nỗ", "lực", "blue"]
    text: |-
      name: VinFast VF e34 tại Việt Nam - nỗ lực Blue Ocean (2021)
      type: failure
      setup: 'Thị trường ô tô điện Việt Nam gần như chưa tồn tại năm 2021; ERRC: thuê pin, mạng sạc, hậu mãi qua app, hệ sinh thái Vinhomes.'
      key_calculations:
      - 'Phân loại theo thị trường (skill): VN = có tính Blue Ocean/first-mover (chưa đối thủ nội địa trực tiếp); Mỹ/EU = Red Ocean (đối đầu Tesla, BYD).'
      - 'Kiểm tra BOS Sequence: Buyer Utility (sạc, hậu mãi) có; Price (thuê pin giảm giá mua) có; Cost (khoản trợ cấp) chưa rõ lãi; Adoption (rào cản hạ tầng sạc) cao.'
      lesson: Blue Ocean phải đánh giá theo từng thị trường; cùng một sản phẩm có thể là Blue Ocean ở nước này nhưng Red Ocean ở nước kia. Nguồn chính nó nêu 'chưa rõ Blue Ocean hay first-mover'; không kết luận mạnh hơn.
      data_reliability: unverified
  - id: "m10-case_lessons-7"
    title: "Bài học case: Spotify - tái định hình bản đồ giá trị ngành thu âm"
    tags: ["bài", "học", "case", "spotify", "tái", "định", "hình", "bản", "đồ", "giá", "trị", "ngành"]
    text: |-
      name: Spotify - tái định hình bản đồ giá trị ngành thu âm
      type: success
      setup: 'Đầu 2000s: tải lậu miễn phí (rủi ro) so với CD 15-20 USD/album hoặc iTunes 0.99 USD/bài; Spotify 9.99 USD/tháng truy cập hàng chục triệu bài.'
      key_calculations:
      - 'Canvas 5 yếu tố điểm skill 0-5 (giả định): CD [giá đắt 1, tiện 1, gợi ý 0, xã hội 0, sở hữu vật chất 5]; iTunes [3, 4, 1, 1, 2]; Spotify [5, 5, 5, 4, 0] (giá cao = điểm ''rẻ'' cao).'
      - 'Độ phân kỳ D của Spotify: so CD = 4.4; so iTunes = 2.4; so trung bình hai đối thủ = 3.4 (tất cả > 1.5 = phân kỳ rõ, quy ước m05).'
      - 'Tương quan hình dạng r: Spotify với CD = -0.92 (đường cong gần như đảo ngược); với iTunes = 0.20 (khác hình); iTunes với CD = 0.15 (nguồn hai đối thủ cũng không giống nhau).'
      - 'So sánh giá: CD 15-20 USD/album so với 9.99 USD/tháng; iTunes 10 bài = 9.9 USD thì Spotify gần tương đương giá 10 bài iTunes nhưng truy cập cả kho.'
      lesson: 'Spotify chuyển giá trị từ ''sở hữu đĩa'' sang ''quyền truy cập bất tận'' (Eliminate sở hữu vật lý, Create Freemium và gợi ý cá nhân hóa), mở tầng phi khách hàng 2 (thích nhạc nhưng từ chối trả giá CD). Nhưng nguồn nói chấm ''BOUI'' mà không tính: đây là khoảng trống, tự chấm bằng D có điểm giả định.'
      data_reliability: illustrative
  - id: "m10-case_lessons-8"
    title: "Bài học case: FPT Corporation - BSC tại Việt Nam"
    tags: ["bài", "học", "case", "fpt", "corporation", "bsc", "tại", "việt", "nam"]
    text: |-
      name: FPT Corporation - BSC tại Việt Nam
      type: success
      setup: 'Nguồn ''mô phỏng dựa trên báo cáo thường niên'': 8 mục tiêu trải 4 viễn cảnh, chiến lược ''Go Global''.'
      key_calculations:
      - 'Tài chính: doanh thu CNTT nước ngoài +28% YoY (khoảng 1 tỷ USD); biên lợi nhuận ròng 11.3%.'
      - 'Khách hàng: 150+ khách hàng trên 1 triệu USD; Nhật 45%, Mỹ 20% doanh thu theo thị trường.'
      - 'Quy trình: 500+ dự án AI/Cloud, giao hàng đúng hạn trên 95%. Học hỏi: 30,000+ nhân sự CNTT, 5,000+ có chứng chỉ AI.'
      - 'Tỷ lệ AI trong nhân sự CNTT (skill tính): 5,000 / 30,000 = 16.7%.'
      - 'Chuỗi nhân quả: đào tạo AI -> dự án AI/Cloud -> khách hàng triệu đô -> doanh thu tăng.'
      lesson: 'Đầu tư mạnh vào Học hỏi và Quy trình dẫn tới tăng trưởng tài chính; BSC giúp đồng bộ hàng chục nghìn nhân viên theo một chiến lược. Rủi ro: turnover ngành IT cao đòi hỏi đầu tư học hỏi liên tục.'
      data_reliability: unverified
  - id: "m10-case_lessons-9"
