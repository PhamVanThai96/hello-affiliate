sections:
  - id: "m10-tong-quan"
    title: "Tổng quan m10"
    tags: ["m10", "cẩm", "nang", "case", "study", "chiến", "lược", "tích", "hợp", "phần", "integrated", "strategic"]
    text: |-
      Cẩm nang case study chiến lược tích hợp (phần 2) (Integrated Strategic Case Studies Manual (Part 2)) — module m10

      Mục đích: Hoàn tất thư viện case mẫu của cẩm nang tích hợp: sau bước phân tích ngoài/trong/cạnh tranh/tăng trưởng (m09), phần này dạy cách PHÂN BỔ NGUỒN LỰC danh mục (BCG, GE-McKinsey, Netflix, Unilever, Samsung), TẠO KHÔNG GIAN GIÁ TRỊ MỚI (Blue Ocean: Cirque du Soleil, Wii, VinFast VF e34, Spotify), BIẾN CHIẾN LƯỢC THÀNH ĐO LƯỜNG HÀNH ĐỘNG (BSC: FPT, Starbucks, S-Tech) và PHÒNG THỦ TƯƠNG LAI BẤT ĐỊNH (Scenario: Shell, Maersk, bất động sản VN, R-Estate). Kèm hai phụ lục chuyển thành bảng tra cứu framewo…

      Dùng khi:
      - Cần ví dụ mẫu để so sánh khi phân tích danh mục nhiều SBU, quyết định bỏ ngành cũ sinh lời để chuyển sang ngành mới (Netflix, Unilever).
      - Cần chấm điểm GE-McKinsey 9 ô cho nhiều đơn vị kinh doanh và kiểm tra tính nhất quán giữa điểm số và màu ô (Samsung).
      - Cần kiểm tra một ý tưởng có phải Blue Ocean thật hay chỉ là first-mover/Red Ocean (VinFast, Wii U, Spotify).
      - Cần dựng hoặc phản biện Strategy Map và bộ KPI BSC cho một tập đoàn/SME (S-Tech, FPT, Starbucks).
      - Cần chọn chiến lược bền qua nhiều kịch bản (Shell, Maersk, bất động sản VN 2025-2030, R-Estate) và thiết lập chỉ báo cảnh báo sớm.
      - Cần bảng tra nhanh 'dùng framework nào, đo gì, giới hạn gì' hoặc bộ câu hỏi 15 điểm để rà soát một bài case MBA.

      Nên nắm trước: - m01; - m02; - m03; - m04; - m05; - m06; - m07; - m09

      Module liên quan: - m04 - Ansoff, BCG, GE-McKinsey đầy đủ (công thức m04_bcg_quadrant, m04_weighted_score, m04_ge_zone); m10 dùng lại và chỉ bổ sung bảng trọng số mẫu của nguồn, case Samsung/Unilever/Netflix. - m05 - Blue Ocean đầy đủ (Strategy Canvas, ERRC, Six Paths, 3 Tiers, BOS Sequence, độ phân kỳ D); m10 áp vào Cirque, Wii, VinFast, Spotify. - m06 - BSC đầy đủ (4 viễn cảnh, Strategy Map, chấm điểm KPI, RAG);…

      Công thức (tra chi tiết bằng skill_search("<id>")):
      - m10_ge_axis_score: Điểm trục GE-McKinsey với bảng trọng số mẫu của nguồn
      - m10_portfolio_cash_balance: Cân đối dòng tiền danh mục (Cow nuôi Star và Question Mark)
      - m10_wind_tunnel_score: Điểm hầm gió (chất lượng chiến lược qua các kịch bản)
      - m10_pct_change: Phần trăm thay đổi (kiểm tra số trong case)

      Kho tra cứu của module: Khái niệm 9, Công thức 4, frameworks 7, Quy trình 5, Quy tắc quyết định 17, Chuẩn so sánh 9, Lỗi thường gặp 16, Lưu ý SME Việt Nam 7, Bài học case 14, Ví dụ có lời giải 8, Câu hỏi luyện tập 17, Checklist 13, Mẫu Excel/Sheets 5. Tra bằng skill_search với từ khoá chủ đề (vd "ví dụ SWOT", "lỗi thường gặp BSC").
  - id: "m10-concepts-1"
    title: "Khái niệm: Tự ăn thịt chính mình"
    tags: ["khái", "niệm", "tự", "ăn", "thịt", "chính", "mình"]
    text: |-
      term_vi: Tự ăn thịt chính mình
      term_en: Self-cannibalization
      definition: Chủ động đẩy một mảng đang có lãi (DVD qua bưu điện của Netflix) vào vùng thu hẹp để dồn nguồn lực cho mảng mới đang lên (streaming), thay vì chờ đối thủ hoặc thị trường làm việc đó.
      why_it_matters: 'Theo nguồn, Blockbuster sụp đổ vì bám chặt mảng ''bò sữa'' đĩa vật lý đã bắt đầu trượt dốc và không đầu tư công nghệ mới. Bài học: một Cash Cow trong thị trường đang bị thay thế thực chất là Dog chưa bị gọi tên; quyết định khó là rút nguồn lực khi mảng đó vẫn đang sinh tiền.'
  - id: "m10-concepts-2"
    title: "Khái niệm: Danh mục tăng trưởng 3 lớp công cụ"
    tags: ["khái", "niệm", "danh", "mục", "tăng", "trưởng", "lớp", "công", "cụ"]
    text: |-
      term_vi: Danh mục tăng trưởng 3 lớp công cụ
      term_en: Ansoff -> BCG -> GE-McKinsey chain
      definition: Ansoff trả lời 'tăng trưởng bằng cách nào' (một SBU); BCG phân loại nhanh 'SBU nào là Star/Cow/Question/Dog'; GE-McKinsey chấm điểm nhiều tiêu chí để quyết định 'đầu tư bao nhiêu vào SBU nào'.
      why_it_matters: 'Mỗi công cụ có điểm yếu riêng (Ansoff thiếu cạnh tranh; BCG chỉ 2 trục; GE chủ quan, phức tạp). Dùng nối tiếp bù trừ nhau: hướng -> phân loại nhanh -> quyết định đầu tư chi tiết. Không có công cụ nào cho biết SỐ TIỀN cụ thể: phải thêm mô hình tài chính (hạn chế nguồn ghi ở case Samsung SDI).'
  - id: "m10-concepts-3"
    title: "Khái niệm: Đổi mới giá trị"
    tags: ["khái", "niệm", "đổi", "mới", "giá", "trị"]
    text: |-
      term_vi: Đổi mới giá trị
      term_en: Value innovation
      definition: Đồng thời tăng giá trị cho người mua và giảm chi phí (bằng cách loại bỏ/cắt giảm yếu tố ngành coi là đương nhiên, nâng/tạo yếu tố mới), phá vỡ thế đánh đổi giá trị - chi phí của Red Ocean.
      why_it_matters: Là tiêu chí phân biệt Blue Ocean với 'chỉ làm khác' hay 'chỉ rẻ hơn' hay 'chỉ công nghệ đột phá' (nguồn nói rõ BOS không phải innovation đơn thuần, không phải phá giá, không phải disruption công nghệ). Cirque bỏ thú vật và ngôi sao (giảm chi phí) để thêm nhà hát, nhạc sống (tăng giá trị).
  - id: "m10-concepts-4"
    title: "Khái niệm: Phi khách hàng tầng 2 (Refusing)"
    tags: ["khái", "niệm", "phi", "khách", "hàng", "tầng", "refusing"]
    text: |-
      term_vi: Phi khách hàng tầng 2 (Refusing)
      term_en: Second-tier noncustomers (refusing noncustomers)
      definition: 'Người biết ngành nhưng chủ động từ chối dùng vì thấy đắt, phức tạp hoặc không phù hợp (Spotify: thích nghe nhạc nhưng không muốn trả giá CD/0.99 USD mỗi bài).'
      why_it_matters: Quy mô Blue Ocean lớn hơn khi chuyển nhóm từ chối thành khách; bài tập tự hỏi 'rào cản nào của ngành khiến họ từ chối và ta loại được không' (Phụ lục B câu 11).
  - id: "m10-concepts-5"
    title: "Khái niệm: Chỉ số trễ và chỉ số dẫn dắt"
    tags: ["khái", "niệm", "chỉ", "số", "trễ", "và", "dẫn", "dắt"]
    text: |-
      term_vi: Chỉ số trễ và chỉ số dẫn dắt
      term_en: Lagging vs leading indicators
      definition: Chỉ số trễ phản ánh kết quả đã xảy ra (ROE, doanh thu); chỉ số dẫn dắt dự báo kết quả (giờ đào tạo, cycle time, NPS). BSC đặt Tài chính là chỉ số trễ ở đích và Quy trình/Học hỏi là chỉ số dẫn.
      why_it_matters: Kaplan và Norton (HBR 1992) lập BSC vì doanh nghiệp chỉ nhìn 'gương chiếu hậu' tài chính. Bộ KPI cân bằng phải có cả hai loại, nếu không đo được tiến trình thì không kịp điều chỉnh.
  - id: "m10-concepts-6"
    title: "Khái niệm: Chiến lược vững chắc và chiến lược theo tình huống"
    tags: ["khái", "niệm", "chiến", "lược", "vững", "chắc", "và", "theo", "tình", "huống"]
    text: |-
      term_vi: Chiến lược vững chắc và chiến lược theo tình huống
      term_en: Robust strategy vs contingent strategy
      definition: Chiến lược vững chắc chạy tốt qua hầu hết kịch bản và triển khai ngay; chiến lược theo tình huống chỉ bật khi tín hiệu xác nhận một kịch bản cụ thể.
      why_it_matters: Scenario Planning không tìm 'phương án đúng' mà tìm phương án sống sót đa kịch bản (Wind Tunneling); phần còn lại chuyển thành kế hoạch dự phòng gắn tín hiệu cảnh báo sớm.
  - id: "m10-concepts-7"
    title: "Khái niệm: Tính hợp lý thay cho xác suất"
    tags: ["khái", "niệm", "tính", "hợp", "lý", "thay", "cho", "xác", "suất"]
    text: |-
      term_vi: Tính hợp lý thay cho xác suất
      term_en: Plausibility over probability
      definition: Nguồn nhấn mạnh Scenario Planning KHÔNG phải dự báo, KHÔNG gán xác suất, mà đánh giá tính hợp lý của các tương lai khả dĩ.
      why_it_matters: Tránh ngộ nhận 'kịch bản có xác suất cao nhất là đúng'. m07 vẫn cho công thức trọng số kịch bản như một lựa chọn bổ trợ của skill, cần nói rõ là giả định chủ quan.
  - id: "m10-concepts-8"
    title: "Khái niệm: Điểm mù Thiên Nga Đen"
    tags: ["khái", "niệm", "điểm", "mù", "thiên", "nga", "đen"]
    text: |-
      term_vi: Điểm mù Thiên Nga Đen
      term_en: Black Swan blind spot
      definition: Sự kiện hoàn toàn bất ngờ (COVID, 9/11, nguồn thêm cú sốc Houthi Biển Đỏ 2024 với Maersk) thường nằm ngoài mọi bộ kịch bản đã dựng.
      why_it_matters: Không dựng nhiều kịch bản hơn để 'bao hết' mà tăng độ linh hoạt tài chính (tiền mặt, nợ ngắn hạn thấp) và rà soát kịch bản định kỳ 6-12 tháng.
  - id: "m10-concepts-9"
    title: "Khái niệm: Chỉ số Tiện ích Đại dương Xanh (BOUI) - NHÃN CỦA NGUỒN"
    tags: ["khái", "niệm", "chỉ", "số", "tiện", "ích", "đại", "dương", "xanh", "boui", "nhãn", "của"]
    text: |-
      term_vi: Chỉ số Tiện ích Đại dương Xanh (BOUI) - NHÃN CỦA NGUỒN
      term_en: Blue Ocean Utility Index (BOUI, source label)
      definition: Mục lục và Phụ lục A của nguồn nhắc 'chấm điểm BOUI' cho Spotify nhưng nội dung KHÔNG định nghĩa hay tính. Trong lý thuyết Kim và Mauborgne có Buyer Utility Map (6 giai đoạn x 6 đòn bẩy) và Blue Ocean Idea Index (tiện ích, giá, chi phí, chấp nhận), không có 'BOUI' chuẩn.
      why_it_matters: Agent không bịa công thức BOUI. Dùng Buyer Utility Map/BOS Sequence của m05, hoặc độ phân kỳ D (m05_value_curve_divergence), và nói rõ đây là thang của skill.
  - id: "m10-formulas-1"
    title: "Công thức: m10_ge_axis_score — Điểm trục GE-McKinsey với bảng trọng số mẫu của nguồn"
    tags: ["công", "thức", "m10_ge_axis_score", "điểm", "trục", "ge", "mckinsey", "với", "bảng", "trọng", "số", "mẫu"]
    text: |-
      id: m10_ge_axis_score
      name_vi: Điểm trục GE-McKinsey với bảng trọng số mẫu của nguồn
      name_en: GE-McKinsey axis score (source weight templates)
      expression_latex: IA = \sum_{i=1}^{7} w_i s_i,\quad CS = \sum_{j=1}^{8} v_j t_j,\quad \sum w_i = \sum v_j = 1
      expression_python: sum(w*s for w, s in zip(weights, scores))
      excel: =SUMPRODUCT(weights, scores)
      variables:
      - symbol: w_i
        meaning: 'trọng số 7 yếu tố sức hấp dẫn ngành: quy mô 20%, tăng trưởng 20%, lợi nhuận ngành 15%, cường độ cạnh tranh (đảo điểm) 15%, rào cản gia nhập 10%, công nghệ 10%, rủi ro môi trường 10%'
        unit: tỷ lệ
      - symbol: v_j
        meaning: 'trọng số 8 yếu tố vị thế: thị phần 20%, chất lượng 15%, thương hiệu 15%, chi phí sản xuất 15%, R&D 10%, phân phối 10%, quản lý nhân sự 10%, tài chính 5%'
        unit: tỷ lệ
      - symbol: s_i, t_j
        meaning: điểm 1-5 mỗi yếu tố (cạnh tranh gay gắt = điểm thấp)
        unit: điểm
      when_to_use: 'Bước 4-5 quy trình GE-McKinsey 8 bước: chấm điểm từng SBU rồi ra điểm hai trục (đặt ô bằng m04_ge_zone).'
      why_it_works: GE-McKinsey (McKinsey cho General Electric, thập niên 1970) sinh ra để thay BCG 2 trục bằng nhiều tiêu chí. Tổng trọng số 100% buộc ban lãnh đạo công khai điều mình coi trọng; nhân điểm với trọng số gộp tiêu chí khác tầm quan trọng vào một thang để đặt lên ma trận.
      assumptions:
      - Trọng số do nhóm chốt TRƯỚC khi chấm
      - 'Bảng trọng số của nguồn chỉ là mẫu; mỗi ngành chỉnh theo thực tế (nguồn ghi ''Tùy chỉnh: trọng số linh hoạt theo ngành'')'
      pitfalls:
      - Quên đảo điểm cho cạnh tranh/rủi ro
      - Tổng trọng số khác 100%
      - 'Chấm một mình: dùng trung bình nhóm 3-5 người'
      - Mỗi DN chọn yếu tố khác nhau nên khó benchmark chéo (nhược điểm nguồn)
      interpretation: Chia 1-5 thành thấp < 2.33, trung bình 2.33-3.67, cao > 3.67 (cùng quy ước m04). Kiểm tra độ nhạy +-0.3 khi điểm sát ngưỡng.
      example:
        inputs:
          weights_IA:
          - 0.2
          - 0.2
          - 0.15
          - 0.15
          - 0.1
          - 0.1
          - 0.1
          scores_IA:
          - 3
          - 4
          - 3
          - 1
          - 2
          - 3
          - 4
        steps:
        - 0.20*3 + 0.20*4 + 0.15*3 + 0.15*1 + 0.10*2 + 0.10*3 + 0.10*4 = 0.60 + 0.80 + 0.45 + 0.15 + 0.20 + 0.30 + 0.40
        - = 2.90 (mức trung bình)
        result: IA = 2.90
  - id: "m10-formulas-2"
    title: "Công thức: m10_portfolio_cash_balance — Cân đối dòng tiền danh mục (Cow nuôi Star và Question Mark)"
    tags: ["công", "thức", "m10_portfolio_cash_balance", "cân", "đối", "dòng", "tiền", "danh", "mục", "cow", "nuôi", "star"]
    text: |-
      id: m10_portfolio_cash_balance
      name_vi: Cân đối dòng tiền danh mục (Cow nuôi Star và Question Mark)
      name_en: Portfolio cash balance
      expression_latex: N = \sum_{k \in Cow} F_k - \sum_{k \in Star \cup QM} I_k
      expression_python: sum(cow_surplus) - sum(star_need) - sum(qm_need)
      excel: =SUM(cow_range)-SUM(star_range)-SUM(qm_range)
      variables:
      - symbol: F_k
        meaning: dòng tiền dư của Cash Cow k
        unit: tỷ VNĐ hoặc USD
      - symbol: I_k
        meaning: nhu cầu vốn của Star/Question Mark k (Star xấp xỉ 0 ròng nhưng cần tái đầu tư để giữ vị thế)
        unit: cùng đơn vị
      when_to_use: 'Kiểm tra logic nền của BCG: danh mục có Cash Cow đủ nuôi các đơn vị tiêu tiền không. Công thức là quy ước của skill, nguồn chỉ nêu nguyên tắc ''bò sữa nuôi sao và dấu hỏi''.'
      why_it_works: 'Henderson (BCG 1970) thiết kế ma trận để quản trị DÒNG TIỀN: đơn vị thị phần cao trong thị trường chậm tạo tiền dư, đơn vị thị trường nhanh ngốn tiền. N < 0 nghĩa là phải vay/ra thị trường vốn hoặc cắt Question Mark.'
      assumptions:
      - Dòng tiền ròng ước tính cùng kỳ
      - Chưa tính chi phí vốn và hiệp lực giữa SBU (hạn chế BCG)
      pitfalls:
      - Coi Cow đang bị thay thế (như DVD) là nguồn tiền vĩnh viễn
      - 'Quên rằng Star thị phần cao vẫn cần tái đầu tư lớn (nguồn: Originals trên 15 tỷ USD/năm)'
      interpretation: 'N >= 0: danh mục tự chủ vốn. N < 0: thiếu vốn, ưu tiên Question Mark triển vọng nhất (RMS cao nhất) và cắt phần còn lại.'
      example:
        inputs:
          cow_surplus:
          - 120
          star_need:
          - 40
          qm_need:
          - 60
          - 30
        steps:
        - N = 120 - 40 - 60 - 30 = -10
        result: '-10: thiếu 10 đơn vị vốn, chỉ nên nuôi QM triển vọng hơn hoặc vay.'
  - id: "m10-formulas-3"
    title: "Công thức: m10_wind_tunnel_score — Điểm hầm gió (chất lượng chiến lược qua các kịch bản)"
    tags: ["công", "thức", "m10_wind_tunnel_score", "điểm", "hầm", "gió", "chất", "lượng", "chiến", "lược", "qua", "các"]
    text: |-
      id: m10_wind_tunnel_score
      name_vi: Điểm hầm gió (chất lượng chiến lược qua các kịch bản)
      name_en: Wind-tunnel score from qualitative grades
      expression_latex: W_s = \sum_{k=1}^{K} g_{s,k},\quad g \in \{0,1,2\}
      expression_python: sum(grades)
      excel: =SUM(B2:E2)
      variables:
      - symbol: g_{s,k}
        meaning: 'điểm đánh giá chiến lược s ở kịch bản k: 2 = tốt (dấu tích), 1 = rủi ro (cảnh báo), 0 = thất bại (dấu X)'
        unit: điểm
      when_to_use: Chuyển bảng 'Robust?' bằng biểu tượng của nguồn (Bước 6-7 BĐS VN) thành số để so sánh. Là quy ước của skill, nguồn chỉ dùng biểu tượng.
      why_it_works: 'Wind Tunneling của nguồn: đặt từng chiến lược vào từng kịch bản và chọn cái sống sót nhiều nhất. Tổng điểm đo mức tốt trung bình; điểm nhỏ nhất (min) đo khả năng sống sót ở kịch bản tồi nhất.'
      assumptions:
      - Thang 0/1/2 thô, ánh xạ biểu tượng của nguồn
      - Các kịch bản được coi ngang nhau (không trọng số xác suất)
      pitfalls:
      - 'Chỉ nhìn tổng điểm: chiến lược có thể có điểm cao nhưng một ô 0 gây phá sản'
      - Luôn xem min trước (sống sót) rồi mới xem tổng
      interpretation: Chọn chiến lược có min >= 1 và tổng cao nhất; chiến lược có min = 0 chỉ chấp nhận như quyết định có kiểm soát vốn.
      example:
        inputs:
          grades:
            Mở rộng nhanh vay nhiều:
            - 2
            - 1
            - 1
            - 0
            Tập trung chất lượng cao cấp:
            - 2
            - 2
            - 2
            - 1
            Đa dạng bán + cho thuê + dịch vụ:
            - 2
            - 2
            - 2
            - 2
            Bảo thủ giữ tiền:
            - 1
            - 2
            - 2
            - 2
        steps:
        - 'Tổng: 4, 7, 8, 7'
        - 'Min: 0, 1, 2, 1'
        - 'Tỷ lệ kịch bản đạt >= 1: 0.75, 1, 1, 1'
        result: Đa dạng hóa dẫn đầu (tổng 8, min 2), khớp kết luận ROBUST của nguồn. Mở rộng nhanh min = 0.
  - id: "m10-formulas-4"
    title: "Công thức: m10_pct_change — Phần trăm thay đổi (kiểm tra số trong case)"
    tags: ["công", "thức", "m10_pct_change", "phần", "trăm", "thay", "đổi", "kiểm", "tra", "số", "trong", "case"]
    text: |-
      id: m10_pct_change
      name_vi: Phần trăm thay đổi (kiểm tra số trong case)
      name_en: Percentage change (case-number sanity check)
      expression_latex: \Delta\% = \frac{new - old}{old}\times 100
      expression_python: (new - old) / old * 100
      excel: =(new-old)/old
      variables:
      - symbol: old, new
        meaning: giá trị trước và sau
        unit: cùng đơn vị
      when_to_use: Mọi lần trích 'tăng X%' trong case, đặc biệt các mệnh đề về giá dầu, doanh thu, thị phần.
      why_it_works: Lỗi hay gặp là nhầm 'gấp 4 lần' (x4) với 'tăng 400%'. Tăng % luôn lấy chênh lệch chia cho GIÁ TRỊ GỐC.
      assumptions:
      - old khác 0
      pitfalls:
      - Nguồn viết giá dầu 1973 từ 3 lên 12 USD là 'tăng 400%' nhưng đúng là tăng 300% (gấp 4 lần)
      interpretation: Luôn tự tính lại phần trăm từ hai số gốc trước khi dùng.
      example:
        inputs:
          old: 3
          new: 12
        steps:
        - (12 - 3) / 3 * 100 = 300
        - 12 / 3 = 4 lần
        result: 300% (gấp 4 lần), không phải 400%
  - id: "m10-frameworks-1"
    title: "Frameworks: m10_ge_nine_box — Ma trận GE-McKinsey 9 ô (bản nguồn, bổ sung cho m04)"
    tags: ["frameworks", "m10_ge_nine_box", "ma", "trận", "ge", "mckinsey", "bản", "nguồn", "bổ", "sung", "cho", "m04"]
    text: |-
      id: m10_ge_nine_box
      name_vi: Ma trận GE-McKinsey 9 ô (bản nguồn, bổ sung cho m04)
      name_en: GE-McKinsey nine-box (source version)
      origin: McKinsey và General Electric, thập niên 1970; ra đời để khắc phục BCG 'quá đơn giản' bằng nhiều tiêu chí thay vì 2, phục vụ tập đoàn quản lý nhiều SBU phức tạp.
      components:
      - 'Trục dọc: Sức hấp dẫn ngành (7 yếu tố có trọng số, xem m10_ge_axis_score). Trục ngang: Vị thế cạnh tranh (8 yếu tố).'
      - 'Lưới 3x3 theo nguồn: hàng Cao - Mạnh: Đầu tư tăng trưởng (xanh); Cao - Trung bình: Đầu tư chọn lọc (xanh); Cao - Yếu: Đầu tư chọn lọc (vàng).'
      - 'Hàng Trung bình - Mạnh: Đầu tư chọn lọc (xanh); TB - TB: Duy trì bảo vệ (vàng); TB - Yếu: Thu hoạch/rút lui (đỏ).'
      - 'Hàng Thấp - Mạnh: Thu hoạch chọn lọc (vàng); Thấp - TB: Thu hoạch/rút lui (đỏ); Thấp - Yếu: Rút lui/bán (đỏ). Bong bóng: kích thước = doanh thu.'
      when_to_use: Tập đoàn nhiều SBU cần quyết định 'đầu tư bao nhiêu vào SBU nào' (câu hỏi của GE), sau khi BCG đã phân loại sơ bộ.
      how_to_apply:
      - 'Bước 1: liệt kê SBU. Bước 2-3: chốt yếu tố và trọng số hai trục TRƯỚC khi chấm.'
      - 'Bước 4-5: chấm 1-5 từng yếu tố, tính điểm hai trục (m10_ge_axis_score).'
      - 'Bước 6: đặt SBU lên ma trận (m04_ge_zone). Bước 7: gán chiến lược theo ô. Bước 8: phân bổ nguồn lực.'
      - Kiểm tra độ nhạy +-0.3 với SBU sát ngưỡng; đối chiếu màu ô với nhãn chiến lược trong báo cáo.
      how_to_read_results: 'Xanh = đầu tư; vàng = chọn lọc/duy trì; đỏ = thu hoạch/bán. Không cho biết SỐ TIỀN: cần mô hình tài chính (NPV/IRR ở khối tài chính).'
      pitfalls:
      - 'Chủ quan: chọn yếu tố, trọng số, điểm đều có thể thiên lệch.'
      - Snapshot tĩnh; không tính synergy giữa SBU; ít ý nghĩa với DN chỉ có 1-2 SBU.
      - 'Nhãn ô và màu ô không khớp (vd Samsung SDI trong nguồn): luôn tính lại màu từ điểm.'
      example: 'Samsung 6 SBU (case_lessons): Semiconductor 5.0/4.5 và Display 4.5/5.0 đều Đầu tư tăng trưởng; Heavy 2.0/2.5 vào ô đỏ.'
  - id: "m10-frameworks-2"
    title: "Frameworks: m10_portfolio_toolchain — Chuỗi công cụ danh mục: Ansoff, BCG, GE-McKinsey"
    tags: ["frameworks", "m10_portfolio_toolchain", "chuỗi", "công", "cụ", "danh", "mục", "ansoff", "bcg", "ge", "mckinsey"]
    text: |-
      id: m10_portfolio_toolchain
      name_vi: 'Chuỗi công cụ danh mục: Ansoff, BCG, GE-McKinsey'
      name_en: Portfolio toolchain comparison
      origin: Phần IV nguồn so sánh 3 công cụ và đề xuất quy trình kết hợp.
      components:
      - 'Ansoff (1957): Sản phẩm x Thị trường, 4 ô, độ phức tạp thấp, phạm vi 1 SBU, câu hỏi ''tăng trưởng bằng cách nào''. Hạn chế: quá đơn giản, thiếu cạnh tranh.'
      - 'BCG (1970): Thị phần tương đối x Tăng trưởng, 4 ô, độ phức tạp thấp, phạm vi portfolio, câu hỏi ''đầu tư vào SBU nào''. Hạn chế: chỉ 2 tiêu chí.'
      - 'GE-McKinsey (1970s): Vị thế cạnh tranh x Sức hấp dẫn ngành, 9 ô, phức tạp cao, phạm vi portfolio, câu hỏi ''đầu tư bao nhiêu vào SBU nào''. Hạn chế: phức tạp, chủ quan.'
      when_to_use: Khi tập đoàn/SME đa sản phẩm cần quy trình ba bước thay vì dùng riêng một công cụ.
      how_to_apply:
      - 'Bước 1 Ansoff: xác định HƯỚNG tăng trưởng cho từng SBU.'
      - 'Bước 2 BCG: phân loại nhanh Star/Cow/Question Mark/Dog; kiểm tra cân đối dòng tiền (m10_portfolio_cash_balance).'
      - 'Bước 3 GE-McKinsey: chấm điểm chi tiết SBU quan trọng/biên giới, rồi quyết định mức đầu tư bằng mô hình tài chính.'
      how_to_read_results: 'Nếu BCG và GE cho khuyến nghị lệch (vd Dollar Shave Club: BCG Question Mark nhưng thực tế không thành Star), tin GE cho quyết định lớn và kiểm chứng bằng động thái đối thủ.'
      pitfalls:
      - 'Dùng BCG dự đoán thị trường thay đổi (nguồn: Gillette phản công DSC)'
      - Bỏ qua Dogs có giá trị hỗ trợ thương hiệu hoặc hoàn thiện danh mục (nhược điểm số 6 của BCG)
      example: 'Unilever: Dove (Star), OMO (Cow), Dollar Shave Club (Question Mark), margarine (Dog -> bán).'
  - id: "m10-frameworks-3"
    title: "Frameworks: m10_bos_case_patterns — Mẫu ERRC của các case Blue Ocean (Cirque, Wii, VinFast, Spotify, Planet Fitness)"
    tags: ["frameworks", "m10_bos_case_patterns", "mẫu", "errc", "của", "các", "case", "blue", "ocean", "cirque", "wii", "vinfast"]
    text: |-
      id: m10_bos_case_patterns
      name_vi: Mẫu ERRC của các case Blue Ocean (Cirque, Wii, VinFast, Spotify, Planet Fitness)
      name_en: ERRC patterns across Blue Ocean cases
      origin: Kim và Mauborgne (INSEAD, 2005; Blue Ocean Shift 2017); nghiên cứu 150 bước chiến lược ở 30+ ngành trong hơn 100 năm.
      components:
      - 'Cirque: Eliminate ngôi sao, thú vật, bán lưu niệm, nhiều sân khấu cùng lúc; Reduce hài hước, hồi hộp nguy hiểm; Raise không gian độc đáo và nghệ thuật; Create chủ đề/câu chuyện mỗi show, nhạc sống, nhiều show, môi trường tinh tế, giá vé ngang Broadway.'
      - 'Wii: Eliminate đồ họa đỉnh cao, ổ cứng lớn; Reduce cấu hình, game phức tạp; Raise giá phải chăng, dễ tiếp cận; Create motion control, trải nghiệm gia đình, vận động khi chơi game, biến non-gamer thành gamer.'
      - 'Spotify: Eliminate đĩa vật lý, tải lậu, giới hạn lưu trữ; Reduce chi phí mua từng album, độ trễ, thời gian tìm nhạc; Raise kho 100 triệu bài hợp pháp, chất lượng 320kbps, tương thích đa nền tảng; Create Freemium, AI gợi ý (Discover Weekly), chia sẻ xã hội, lời bài hát.'
      - 'VinFast VF e34 (VN 2021): Eliminate phụ thuộc xăng dầu, bảo dưỡng phức tạp; Raise mạng sạc, hậu mãi qua app, niềm tự hào hàng Việt; Reduce giá mua (thuê pin); Create thuê pin, hệ sinh thái sạc tại nhà với Vinhomes, subscription.'
      - 'Planet Fitness (nguồn): nhắm tầng 2 và 3; Eliminate máy nặng, gương, văn hóa gym bro; Create Judgement Free Zone, Pizza Monday, thẻ khoảng 10 USD/tháng.'
      when_to_use: Cần ví dụ mẫu để dựng ERRC hoặc để kiểm tra ERRC của bài toán mới có đủ cả 4 hành động và có yếu tố 'Create' thật không.
      how_to_apply:
      - Vẽ Strategy Canvas ngành, so đường giá trị; mỗi ô ERRC phải gắn một yếu tố trên canvas.
      - 'Kiểm tra 3 tiêu chí đường giá trị tốt: Focus, Divergence, Compelling tagline (m05).'
      - 'Chạy BOS Sequence: Buyer Utility -> Price -> Cost -> Adoption (nguồn thêm: cùng một sản phẩm có thể là Blue Ocean ở VN nhưng Red Ocean ở Mỹ).'
      how_to_read_results: Blue Ocean thật khi giảm chi phí VÀ nâng giá trị cùng lúc; ERRC chỉ có Raise (không Eliminate/Reduce) thì đang đua tính năng trong Red Ocean.
      pitfalls:
      - 'Đồng nhất ''sản phẩm mới'' với Blue Ocean: VinFast ở VN có thể là first-mover chứ chưa chắc Blue Ocean; ở Mỹ/EU là Red Ocean đối đầu Tesla, BYD.'
      - 'Survivorship bias: nguồn tự ghi chỉ nghiên cứu case thành công, bỏ qua nhiều thất bại.'
      - Blue Ocean có hạn sử dụng (Wii U 2012 thất bại, phải tìm Switch 2017); bảo vệ tạm thời nguồn ước 10-15 năm (chưa kiểm chứng).
      example: 'Xem case_lessons: Cirque, Wii, VinFast VF e34, Spotify.'
  - id: "m10-frameworks-4"
    title: "Frameworks: m10_bsc_strategy_map_audit — Kiểm định Strategy Map và bộ KPI (chuỗi nhân quả 4 tầng)"
    tags: ["frameworks", "m10_bsc_strategy_map_audit", "kiểm", "định", "strategy", "map", "và", "bộ", "kpi", "chuỗi", "nhân", "quả"]
    text: |-
      id: m10_bsc_strategy_map_audit
      name_vi: Kiểm định Strategy Map và bộ KPI (chuỗi nhân quả 4 tầng)
      name_en: Strategy-map causal audit
      origin: 'Kaplan và Norton: BSC 1992 (HBR, Gen 1 hệ đo lường), Strategy Maps 1996 (Gen 2 quản lý chiến lược), 2000+ tổ chức học hỏi (Gen 3, kết hợp OKR).'
      components:
      - Chuỗi nhân quả đi từ Học hỏi -> Quy trình -> Khách hàng -> Tài chính (đích trễ).
      - 'Tầng Học hỏi: Human, Information, Organization Capital và đổi mới; tầng Quy trình: innovation, operations, customer management, regulatory và xã hội; tầng Khách hàng: CSAT, retention, NPS, thị phần, CLV.'
      - 'Quy mô theo nguồn: 12-20 mục tiêu, 1-2 KPI mỗi mục tiêu, tổng 20-25 KPI; SMART target; cascading đến cá nhân.'
      when_to_use: Khi dựng/chấm một BSC (S-Tech, FPT, Starbucks) hoặc khi BSC chỉ là danh sách KPI rời.
      how_to_apply:
      - Với mỗi mục tiêu Tài chính, tìm ít nhất một mục tiêu Khách hàng dẫn tới nó; mỗi mục tiêu Khách hàng có ít nhất một mục tiêu Quy trình dẫn tới; mỗi Quy trình có Học hỏi nền.
      - 'Kiểm tra KPI khớp với mục tiêu và target: cùng đơn vị, cùng đối tượng đo (xem lỗi S-Tech trong pitfalls).'
      - Kiểm tra có baseline và nguồn dữ liệu đo; gắn trách nhiệm và sáng kiến.
      how_to_read_results: Mục tiêu 'mồ côi' (không mũi tên vào/ra) hoặc KPI không đo được mục tiêu = bản đồ chưa đạt. Dùng m06_rag_status cho báo cáo kỳ.
      pitfalls:
      - Quá nhiều KPI (> 25), gaming (chơi số), phụ thuộc cam kết lãnh đạo, thiếu stakeholder khác như nhà cung cấp và cộng đồng.
      - 'BSC trên giấy khác thực tế: Starbucks (nguồn) có engagement cao nhưng nhân viên Mỹ vẫn đình công 2022-2023.'
      example: 'FPT: 5,000+ kỹ sư AI (Học hỏi) -> 500+ dự án AI/Cloud (Quy trình) -> 150+ khách hàng triệu đô (Khách hàng) -> doanh thu CNTT nước ngoài +28% (Tài chính). Số liệu chưa kiểm chứng.'
  - id: "m10-frameworks-5"
    title: "Frameworks: m10_scenario_robust_toolkit — Bộ công cụ chọn chiến lược từ kịch bản (Robust, Wind Tunneling, Early Warning, Backcasting)"
    tags: ["frameworks", "m10_scenario_robust_toolkit", "bộ", "công", "cụ", "chọn", "chiến", "lược", "từ", "kịch", "bản", "robust"]
    text: |-
      id: m10_scenario_robust_toolkit
      name_vi: Bộ công cụ chọn chiến lược từ kịch bản (Robust, Wind Tunneling, Early Warning, Backcasting)
      name_en: Scenario-to-strategy toolkit
      origin: Herman Kahn (RAND, 1950s), Pierre Wack (Shell, 1970s), Peter Schwartz (GBN, 1990s, The Art of the Long View); Shell 8 bước; Schoemaker (1995), van der Heijden (1996).
      components:
      - 'Impact x Uncertainty (ô 1: cao-cao = trục kịch bản; ô 2 cao bất định thấp tác động: theo dõi; ô 3 tác động cao bất định thấp: lập kế hoạch cụ thể; ô 4: bỏ qua).'
      - Ma trận 2x2 tạo 4 kịch bản, mỗi kịch bản một tên gợi hình và một câu chuyện.
      - 'Wind Tunneling: đặt từng chiến lược vào từng kịch bản, chọn chiến lược sống sót nhiều nhất; chiến lược Robust triển khai ngay, Contingent chuẩn bị chờ tín hiệu.'
      - 'Early Warning Signals: mỗi kịch bản có chỉ báo định lượng quan sát được; Backcasting đi ngược từ tương lai mong muốn về hiện tại.'
      when_to_use: 'Đầu tư dài hạn 5-10 năm, ngành đang disruption, M&A lớn, mở rộng quốc tế (nguồn: ''rất nên''); startup chỉ dùng bản đơn giản 2-3 kịch bản; quyết định vận hành hằng ngày thì không cần.'
      how_to_apply:
      - Chọn 2 yếu tố độc lập tương đối (nếu hai trục phụ thuộc nhau, 4 ô thực ra thành 2 kịch bản).
      - Chấm wind tunnel bằng m10_wind_tunnel_score hoặc các tiêu chí m07 (maximin, minimax regret, robustness share).
      - Gắn tín hiệu cảnh báo (m07_signal_score) và ngưỡng kích hoạt phương án contingent.
      how_to_read_results: 'Chiến lược Robust không phải ''tối ưu nhất ở mọi kịch bản'' mà là không thua thảm ở kịch bản nào; lợi nhuận tối đa có thể mất ở kịch bản tốt (Bảo thủ: bỏ lỡ KB bùng nổ).'
      pitfalls:
      - Nhầm Scenario với dự báo hoặc kế hoạch dự phòng; đặt xác suất rồi quên plausible.
      - 'Confirmation bias: chọn kịch bản mình muốn tin; quá nhiều kịch bản gây tê liệt.'
      - 'Chỉ báo không khớp trục: dùng lãi suất tiền gửi làm tín hiệu cho trục lãi suất cho vay (xem pitfalls R-Estate).'
      example: 'Bất động sản VN: trục Lãi suất (thấp 6-8% / cao 10-14%) x Chính sách (thông thoáng / siết chặt) -> Bùng nổ, Chọn lọc, Đóng băng từ từ, Khủng hoảng; chiến lược Đa dạng bán + cho thuê + dịch vụ là Robust.'
  - id: "m10-frameworks-6"
    title: "Frameworks: m10_quick_reference_appendix_a — Phụ lục A - Bảng tra nhanh 8 khuôn khổ chiến lược"
    tags: ["frameworks", "m10_quick_reference_appendix_a", "phụ", "lục", "bảng", "tra", "nhanh", "khuôn", "khổ", "chiến", "lược"]
    text: |-
      id: m10_quick_reference_appendix_a
      name_vi: Phụ lục A - Bảng tra nhanh 8 khuôn khổ chiến lược
      name_en: Appendix A - Strategic framework quick reference
      origin: Phụ lục A của nguồn; cột 'chỉ số định lượng' có chỗ chưa chặt (xem pitfalls).
      components:
      - 'PESTEL: rủi ro vĩ mô dài hạn bên ngoài; chỉ số: lạm phát, lãi suất thực, tăng trưởng GDP, phát thải CO2; điểm yếu: liệt kê chay, thiếu liên kết chéo.'
      - 'Porter''s 5 Forces: độ hấp dẫn ngành; chỉ số: HHI, biên lợi nhuận ròng ngành; yếu: tĩnh, ít xét hợp tác hệ sinh thái.'
      - 'VRIO: năng lực cạnh tranh bền vững nội bộ; chỉ số: giữ chân nhân tài, giá trị tài sản vô hình, số bằng sáng chế; yếu: khó lượng hóa ''khó sao chép''.'
      - 'Value Chain: tối ưu chuỗi hoạt động nội bộ; chỉ số: chi phí logistics biên, OEE; yếu: cần kế toán quản trị phân đoạn rất chi tiết, khó có số của đối thủ.'
      - 'Ansoff: danh mục rủi ro các hướng tăng trưởng; chỉ số: tỷ trọng doanh thu sản phẩm mới, tỷ lệ chuyển đổi khách cũ sang kênh mới; yếu: không chỉ cách xây năng lực.'
      - 'BCG: phân bổ vốn danh mục SBU; chỉ số: thị phần tương đối, tăng trưởng ngành thực (sau lạm phát); yếu: chỉ 2 biến, bỏ synergy.'
      - 'Blue Ocean: tạo không gian thị trường mới; chỉ số: BOUI (nhãn nguồn, không định nghĩa) và lợi nhuận tăng thêm từ phi khách hàng; yếu: rủi ro cao, dễ bị copy.'
      - 'Scenario Planning: phòng ngự trước bất định vĩ mô; chỉ số: hệ số bão hòa cung tiền, số văn bản pháp lý thông duyệt hằng quý; yếu: cần trí tưởng tượng lãnh đạo, tốn chi phí.'
      when_to_use: Chọn nhanh framework theo câu hỏi, hoặc kiểm tra bài case đã bao quát đủ góc chưa.
      how_to_apply:
      - 'Đi theo thứ tự tích hợp: PESTEL/5 Forces (ngoài) -> VRIO/Value Chain (trong) -> Generic/Ansoff/BCG/GE (hướng) -> Blue Ocean (đổi mới) -> BSC (thực thi) -> Scenario (phòng thủ).'
      how_to_read_results: Bảng cho biết dùng gì để làm gì; không thay thế công thức và tiêu chí đọc kết quả đã ở m01-m07.
      pitfalls:
      - 'Một số chỉ số trong cột định lượng của nguồn đáng ngờ: WACC không phải ''lãi suất thực''; ''chỉ số phát thải CO2'' chỉ hợp ngành đặc thù; ''hệ số bão hòa cung tiền'' không phải thước đo scenario chuẩn. Dùng chỉ số theo ngành, có định nghĩa.'
      example: 'Quyết định mở nhà máy mới: PESTEL (chính sách thuế) + 5 Forces + VRIO + GE-McKinsey + Scenario (lãi suất x tỷ giá).'
  - id: "m10-frameworks-7"
    title: "Frameworks: m10_case_interrogation_appendix_b — Phụ lục B - Bộ 15 câu hỏi vấn đáp phân tích tình huống"
    tags: ["frameworks", "m10_case_interrogation_appendix_b", "phụ", "lục", "bộ", "15", "câu", "hỏi", "vấn", "đáp", "phân", "tích"]
    text: |-
      id: m10_case_interrogation_appendix_b
      name_vi: Phụ lục B - Bộ 15 câu hỏi vấn đáp phân tích tình huống
      name_en: Appendix B - 15-question MBA case interrogation set
      origin: 'Phụ lục B của nguồn: 4 nhóm câu hỏi để kiến lập báo cáo phân tích chiến lược trọn vẹn trước hội đồng.'
      components:
      - 'Nhóm 1 (Môi trường - Doanh nghiệp): Q1 thay đổi PESTEL lớn nhất đang bóp nghẹt hay mở ra FCF? Q2 5 Forces dịch chuyển thế nào trong 3 năm, rào cản gia nhập tăng hay giảm? Q3 DN có thể tái cấu trúc luật chơi bằng sáng kiến công nghệ nào (như Uber)?'
      - 'Nhóm 2 (Nội lực): Q4 nguồn lực vô hình nào vượt VRIO, đối thủ sao chép tốn bao lâu/bao nhiêu? Q5 hoạt động bổ trợ nào trong Value Chain làm xói mòn biên của hoạt động chính? Q6 Causal Ambiguity nằm ở đâu và bảo vệ trước săn đầu người ra sao?'
      - 'Nhóm 3 (Hướng đi, tài chính): Q7 Generic hiện tại là gì, có Stuck-in-the-Middle không? Q8 rủi ro Ansoff hiện hành có tương xứng cấu trúc vốn (D/E)? Q9 điều chuyển tiền từ Cow sang Question Mark thế nào mà cổ đông ngắn hạn không phản đối?'
      - 'Nhóm 4 (Không gian giá trị, kịch bản): Q10 Strategy Canvas khác đối thủ ra sao, có thặng dư giá trị cho khách? Q11 nhóm phi khách hàng tầng 2 nào chờ được giải phóng? Q12 Strategy Map đã nối học hỏi/quy trình tới ROE? Q13 KPI vận hành actionable hay báo cáo tĩnh? Q14 hai biến bất định lớn nhất của ma trận 4 kịch bản? Q15 phương án dự phòng nào khi tín hiệu sớm nghiêng về kịch bản tồi nhất?'
      when_to_use: Rà soát một báo cáo case trước khi nộp; hoặc dùng làm dàn ý khi Strategist phân tích doanh nghiệp bất kỳ.
      how_to_apply:
      - Trả lời từng câu bằng số liệu hoặc bằng chứng; câu nào không có dữ liệu thì ghi 'thiếu dữ liệu' và nêu cách thu thập.
      - 'Ánh xạ: Q1 -> m01; Q2 -> m01; Q3 -> m05; Q4-Q6 -> m02; Q7 -> m03; Q8-Q9 -> m04 và khối tài chính; Q10-Q11 -> m05; Q12-Q13 -> m06; Q14-Q15 -> m07.'
      how_to_read_results: Số câu trả lời được bằng bằng chứng định lượng là thước đo độ chín của phân tích; câu bỏ trống cho thấy lỗ hổng cần lấp.
      pitfalls:
      - 'Q8 dùng D/E nhưng thiếu ngưỡng: gắn với khung cấu trúc vốn (khối tài chính)'
      - Trả lời bằng khẩu hiệu thay vì số liệu
      example: 'Với R-Estate: Q14 -> lãi suất vay x tiến độ pháp lý; Q15 -> kích hoạt chế độ ngủ đông khi cả hai tín hiệu xấu.'
  - id: "m10-procedures-1"
    title: "Quy trình: m10_proc_portfolio_review — Rà soát danh mục đa SBU (Ansoff -> BCG -> GE-McKinsey -> dòng tiền)"
    tags: ["quy", "trình", "m10_proc_portfolio_review", "rà", "soát", "danh", "mục", "đa", "sbu", "ansoff", "bcg", "ge"]
    text: |-
      id: m10_proc_portfolio_review
      name: Rà soát danh mục đa SBU (Ansoff -> BCG -> GE-McKinsey -> dòng tiền)
      steps:
      - Liệt kê SBU, doanh thu, thị phần, thị phần đối thủ lớn nhất, tăng trưởng thị trường (đã trừ lạm phát).
      - Gán hướng Ansoff cho từng SBU và nhận diện rủi ro (Diversification không liên quan cao nhất).
      - Tính RMS và phân loại BCG (m04_bcg_quadrant); đánh dấu 'Cow đang bị thay thế' nếu thị trường có công nghệ thay thế rõ.
      - Cho SBU quan trọng/ở biên chấm GE (m10_ge_axis_score + m04_ge_zone); đối chiếu nhãn màu.
      - Tính cân đối dòng tiền (m10_portfolio_cash_balance); quyết định đầu tư/thu hoạch/bán và mô hình hóa tiền bằng NPV.
      - 'Ghi hạn chế: synergy giữa SBU, Dogs có giá trị thương hiệu, snapshot tĩnh; hẹn rà soát lại sau 6-12 tháng.'
      outputs: Bảng danh mục (SBU, ô BCG, ô GE, chiến lược, số vốn), cảnh báo cân đối dòng tiền, danh sách SBU rút lui kèm kịch bản thoái.
  - id: "m10-procedures-2"
    title: "Quy trình: m10_proc_blue_ocean_case_test — Kiểm tra một ý tưởng có phải Blue Ocean thật"
    tags: ["quy", "trình", "m10_proc_blue_ocean_case_test", "kiểm", "tra", "một", "tưởng", "có", "phải", "blue", "ocean", "thật"]
    text: |-
      id: m10_proc_blue_ocean_case_test
      name: Kiểm tra một ý tưởng có phải Blue Ocean thật
      steps:
      - Xác định thị trường cụ thể (quốc gia, phân khúc); cùng sản phẩm có thể Blue ở nơi này, Red ở nơi khác.
      - Vẽ Strategy Canvas ngành; chấm điểm 0-5 các yếu tố mua; tính độ phân kỳ D và tương quan (m05).
      - Hoàn thành ERRC; yêu cầu có ít nhất một Eliminate/Reduce giảm chi phí và một Create mới.
      - Xác định tầng phi khách hàng 1-2-3 sẽ mở và dung lượng ước tính.
      - Chạy BOS Sequence (Buyer Utility, Price, Cost, Adoption) và kiểm tra đối thủ lớn nào cạnh tranh trực diện ở thị trường đó.
      - 'Kết luận ba mức: Blue Ocean thật / first-mover trong Red Ocean tương lai / Red Ocean; ghi hạn bảo vệ và kế hoạch tìm Blue Ocean tiếp theo (Wii -> Switch).'
      outputs: Kết luận phân loại kèm Strategy Canvas có điểm, ERRC, rủi ro bị sao chép.
  - id: "m10-procedures-3"
    title: "Quy trình: m10_proc_bsc_strategy_map_audit — Dựng và kiểm định BSC từ chiến lược (mẫu S-Tech)"
    tags: ["quy", "trình", "m10_proc_bsc_strategy_map_audit", "dựng", "và", "kiểm", "định", "bsc", "từ", "chiến", "lược", "mẫu"]
    text: |-
      id: m10_proc_bsc_strategy_map_audit
      name: Dựng và kiểm định BSC từ chiến lược (mẫu S-Tech)
      steps:
      - 'Viết chiến lược 3-5 năm một câu (S-Tech: từ gia công thiết bị cơ bản lên nhà thiết kế trọn gói hệ sinh thái nhà thông minh đạt chuẩn IPO).'
      - Mỗi viễn cảnh 3-5 mục tiêu; vẽ Strategy Map từ dưới lên; chọn 1-2 KPI mỗi mục tiêu.
      - 'Mỗi KPI: định nghĩa đơn vị, baseline, target SMART, nguồn dữ liệu, chủ sở hữu, sáng kiến.'
      - Kiểm định khớp KPI - mục tiêu - target; kiểm định nhân quả (m10_bsc_strategy_map_audit).
      - Chấm kỳ đầu bằng m06_kpi_score_* và m06_overall_score; cascading xuống phòng ban; gắn thưởng sau khi KPI ổn định.
      outputs: Strategy Map, bảng BSC (mục tiêu, KPI, baseline, target, sáng kiến, chủ sở hữu), danh sách lỗi cần sửa, điểm kỳ đầu.
  - id: "m10-procedures-4"
    title: "Quy trình: m10_proc_scenario_to_strategy — Từ kịch bản đến chiến lược robust và chỉ báo kích hoạt"
    tags: ["quy", "trình", "m10_proc_scenario_to_strategy", "từ", "kịch", "bản", "đến", "chiến", "lược", "robust", "và", "chỉ"]
    text: |-
      id: m10_proc_scenario_to_strategy
      name: Từ kịch bản đến chiến lược robust và chỉ báo kích hoạt
      steps:
      - Chốt quyết định chiến lược và horizon; liệt kê driving forces bằng PESTEL; chấm Impact x Uncertainty (m07).
      - Chọn 2 trục độc lập; đặt tên 4 kịch bản gợi hình; viết câu chuyện 2-3 trang mỗi kịch bản.
      - 'Wind tunnel 3-5 chiến lược: chấm 0/1/2 (m10_wind_tunnel_score), thêm maximin/regret/robustness nếu có số tiền (m07).'
      - Chọn Robust triển khai ngay; chiến lược Contingent gắn ngưỡng kích hoạt.
      - Chọn 3-5 chỉ báo cảnh báo sớm đo được, cùng trục với kịch bản; tính điểm tín hiệu (m07_signal_score); đặt tần suất theo dõi hợp lý.
      - Rà soát 6-12 tháng; cập nhật sau cú sốc; ghi nhận điểm mù Thiên Nga Đen.
      outputs: Ma trận kịch bản, bảng wind tunnel, kế hoạch robust + contingent, bảng chỉ báo và ngưỡng.
  - id: "m10-procedures-5"
    title: "Quy trình: m10_proc_full_case_analysis — Phân tích trọn vẹn một bài case MBA (15 câu hỏi Phụ lục B)"
    tags: ["quy", "trình", "m10_proc_full_case_analysis", "phân", "tích", "trọn", "vẹn", "một", "bài", "case", "mba", "15"]
    text: |-
      id: m10_proc_full_case_analysis
      name: Phân tích trọn vẹn một bài case MBA (15 câu hỏi Phụ lục B)
      steps:
      - 'Ngoài vào trong: PESTEL, 5 Forces (Q1-Q3, m01) rồi nội lực VRIO, Value Chain, causal ambiguity (Q4-Q6, m02).'
      - 'Hướng đi: Generic, Stuck-in-the-Middle, Ansoff, BCG/GE, cấu trúc vốn (Q7-Q9).'
      - 'Đổi mới: Strategy Canvas, ERRC, phi khách hàng (Q10-Q11, m05).'
      - 'Thực thi: Strategy Map, KPI actionable (Q12-Q13, m06).'
      - 'Phòng thủ: 2 biến bất định, 4 kịch bản, dự phòng khẩn cấp (Q14-Q15, m07).'
      - Gắn cờ data_reliability cho mọi số; viết khuyến nghị 3-5 hành động có chủ thể, chỉ số, mốc thời gian.
      outputs: Báo cáo 15 câu trả lời có bằng chứng, danh sách giả định, 3-5 hành động ưu tiên.
  - id: "m10-decision_rules-1"
    title: "Quy tắc quyết định: Nếu một mảng đang sinh tiền nhưng thị trường đang bị công nghệ thay thế (DVD so với streaming), thì…"
    tags: ["quy", "tắc", "quyết", "định", "nếu", "một", "mảng", "đang", "sinh", "tiền", "nhưng", "thị"]
    text: |-
      Nếu một mảng đang sinh tiền nhưng thị trường đang bị công nghệ thay thế (DVD so với streaming), thì coi đó là Dog sắp xảy ra: rút dần nguồn lực sang mảng mới thay vì chờ (self-cannibalization), trừ khi có kế hoạch thu hoạch có kiểm soát.
  - id: "m10-decision_rules-2"
    title: "Quy tắc quyết định: Nếu SBU có RMS >= 1 và tăng trưởng thị trường cao, thì Star: tiếp tục tái đầu tư (không kỳ vọng dòn…"
    tags: ["quy", "tắc", "quyết", "định", "nếu", "sbu", "có", "rms", "và", "tăng", "trưởng", "thị"]
    text: |-
      Nếu SBU có RMS >= 1 và tăng trưởng thị trường cao, thì Star: tiếp tục tái đầu tư (không kỳ vọng dòng tiền dư); nếu thị trường chậm lại thì chuyển Cash Cow.
  - id: "m10-decision_rules-3"
    title: "Quy tắc quyết định: Nếu BCG gán Question Mark nhưng không có lợi thế đặc thù hoặc đối thủ phản công mạnh (Dollar Shave …"
    tags: ["quy", "tắc", "quyết", "định", "nếu", "bcg", "gán", "question", "mark", "nhưng", "không", "có"]
    text: |-
      Nếu BCG gán Question Mark nhưng không có lợi thế đặc thù hoặc đối thủ phản công mạnh (Dollar Shave Club), thì đầu tư chọn lọc có mốc dừng; không cam kết vốn lớn chỉ vì thị trường tăng nhanh.
  - id: "m10-decision_rules-4"
    title: "Quy tắc quyết định: Nếu tổng nhu cầu vốn Star + Question Mark vượt dòng tiền Cow (N < 0), thì hoãn Question Mark yếu nh…"
    tags: ["quy", "tắc", "quyết", "định", "nếu", "tổng", "nhu", "cầu", "vốn", "star", "question", "mark"]
    text: |-
      Nếu tổng nhu cầu vốn Star + Question Mark vượt dòng tiền Cow (N < 0), thì hoãn Question Mark yếu nhất hoặc vay có kiểm soát; không dàn trải.
  - id: "m10-decision_rules-5"
    title: "Quy tắc quyết định: Nếu điểm GE sát ngưỡng 2.33/3.67, thì chạy độ nhạy +-0.3 và đối chiếu bằng mô hình tài chính trước …"
    tags: ["quy", "tắc", "quyết", "định", "nếu", "điểm", "ge", "sát", "ngưỡng", "33", "67", "thì"]
    text: |-
      Nếu điểm GE sát ngưỡng 2.33/3.67, thì chạy độ nhạy +-0.3 và đối chiếu bằng mô hình tài chính trước khi quyết định đầu tư lớn.
  - id: "m10-decision_rules-6"
    title: "Quy tắc quyết định: Nếu nhãn chiến lược của SBU không khớp ô tính từ điểm (Samsung SDI), thì tin điểm số, ghi chú sai l…"
    tags: ["quy", "tắc", "quyết", "định", "nếu", "nhãn", "chiến", "lược", "của", "sbu", "không", "khớp"]
    text: |-
      Nếu nhãn chiến lược của SBU không khớp ô tính từ điểm (Samsung SDI), thì tin điểm số, ghi chú sai lệch trong báo cáo.
  - id: "m10-decision_rules-7"
    title: "Quy tắc quyết định: Nếu đường giá trị mới chỉ cao hơn đối thủ ở mọi yếu tố (dàn trải) hoặc không loại bỏ yếu tố nào, th…"
    tags: ["quy", "tắc", "quyết", "định", "nếu", "đường", "giá", "trị", "mới", "chỉ", "cao", "hơn"]
    text: |-
      Nếu đường giá trị mới chỉ cao hơn đối thủ ở mọi yếu tố (dàn trải) hoặc không loại bỏ yếu tố nào, thì không phải Blue Ocean: quay lại ERRC.
  - id: "m10-decision_rules-8"
    title: "Quy tắc quyết định: Nếu sản phẩm là Blue Ocean ở thị trường nội địa nhưng đối đầu đối thủ toàn cầu ở thị trường mục tiê…"
