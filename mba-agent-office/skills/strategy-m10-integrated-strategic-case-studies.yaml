    text: |-
      q: Vì sao BSC dùng cả chỉ số dẫn và chỉ số trễ?
      a: Chỉ số trễ (ROE) cho biết kết quả nhưng quá muộn để sửa; chỉ số dẫn (giờ đào tạo, cycle time, NPS) dự báo. Kaplan và Norton lập BSC vì nhìn mỗi tài chính là 'gương chiếu hậu'.
