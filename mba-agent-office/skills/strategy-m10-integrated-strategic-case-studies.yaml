  - id: "m10-case_lessons-10"
    title: "Bài học case: S-Tech - BSC tập đoàn công nghệ chế tạo (case giả định)"
    tags: ["bài", "học", "case", "tech", "bsc", "tập", "đoàn", "công", "nghệ", "chế", "tạo", "giả"]
    text: |-
      name: S-Tech - BSC tập đoàn công nghệ chế tạo (case giả định)
      type: sme
      setup: 'Chiến lược: từ gia công thiết bị cơ bản lên nhà thiết kế trọn gói hệ sinh thái nhà thông minh, chuẩn bị IPO. Mỗi viễn cảnh một mục tiêu, một KPI chính.'
      key_calculations:
      - 'Tài chính: ROE >= 22%, tăng trưởng doanh thu IoT > 15% (bản đồ). Khách hàng: giữ chân đối tác B2B >= 92%, NPS > 75 (bản đồ). Quy trình: chu kỳ phát triển/ra mắt <= 6 tháng (''rút một nửa'' nghĩa baseline khoảng 12 tháng), hao hụt SX < 0.5% (bản đồ). Học hỏi: 100% lãnh đạo dùng thành thạo Dashboard, 70% kỹ sư có chứng chỉ IoT (bản đồ).'
      - 'Chấm minh họa kỳ đầu (số giả định): ROE 19% -> 19/22 = 0.864; giữ chân 89% -> 89/92 = 0.967; chu kỳ từ 12 xuống 8 tháng theo mốc nền -> (8-12)/(6-12) = 0.667; Dashboard 70% -> 0.70.'
      - Điểm BSC tổng với trọng số Tài chính 35%, Khách hàng 30%, Quy trình 20%, Học hỏi 15% = 0.35*0.864 + 0.30*0.967 + 0.20*0.667 + 0.15*0.70 = 0.831 (vàng, m06).
      lesson: 'Cốt lõi: liên kết chéo để mọi người thấy việc mình (rút thời gian ra mắt, giảm lỗi bo mạch) đóng góp vào ROE và định giá IPO. Nhưng case nguồn thiếu baseline và KPI Học hỏi lệch đơn vị với target; khi dùng cho SME phải bổ sung baseline và nhất quán đơn vị trước khi chấm.'
      data_reliability: illustrative
  - id: "m10-case_lessons-11"
    title: "Bài học case: Royal Dutch Shell - kịch bản khủng hoảng dầu 1973"
    tags: ["bài", "học", "case", "royal", "dutch", "shell", "kịch", "bản", "khủng", "hoảng", "dầu", "1973"]
    text: |-
      name: Royal Dutch Shell - kịch bản khủng hoảng dầu 1973
      type: success
      setup: 'Thập niên 1970 cả ngành tin giá dầu ổn định 2-3 USD/thùng; Pierre Wack dựng kịch bản với hai bất định: phản ứng OPEC (hợp tác/kiểm soát) và nhu cầu dầu toàn cầu (tăng/ổn định).'
      key_calculations:
      - 'Giá dầu 3 -> 12 USD/thùng: (12 - 3) / 3 = 300% (gấp 4 lần); nguồn ghi 400% (sai).'
      - 'Tuyên bố của nguồn: Shell vươn từ hạng 7 lên 2 về lợi nhuận, phản ứng nhanh hơn đối thủ 6-12 tháng (chưa kiểm chứng).'
      lesson: Mục đích của kịch bản không phải đoán đúng Yom Kippur mà là chuẩn bị tâm thế và phương án cho 'OPEC kiểm soát giá', nên phản ứng nhanh khi sự kiện xảy ra.
