  - id: "m10-excel_google_sheets_templates-1"
    title: "Mẫu Excel/Sheets: GE-McKinsey chấm điểm"
    tags: ["mẫu", "excel", "sheets", "ge", "mckinsey", "chấm", "điểm"]
    text: |-
      name: GE-McKinsey chấm điểm
      layout: 'Sheet 1: bảng yếu tố (cột trọng số, điểm) cho mỗi SBU, =SUMPRODUCT cho hai trục; Sheet 2: tra bảng 3x3 từ điểm (=IF(x>3.67,"Cao",IF(x>=2.33,"TB","Thấp"))); biểu đồ bong bóng, kích thước = doanh thu; cột độ nhạy +-0.3.'
  - id: "m10-excel_google_sheets_templates-2"
    title: "Mẫu Excel/Sheets: Cân đối dòng tiền danh mục"
    tags: ["mẫu", "excel", "sheets", "cân", "đối", "dòng", "tiền", "danh", "mục"]
    text: |-
      name: Cân đối dòng tiền danh mục
      layout: 'Cột: SBU, ô BCG, dòng tiền ròng ước tính; ô tổng =SUMIF(Cow)-SUMIF(Star)-SUMIF(QM); cảnh báo đỏ khi < 0.'
  - id: "m10-excel_google_sheets_templates-3"
    title: "Mẫu Excel/Sheets: Strategy Canvas và độ phân kỳ"
    tags: ["mẫu", "excel", "sheets", "strategy", "canvas", "và", "độ", "phân", "kỳ"]
    text: |-
      name: Strategy Canvas và độ phân kỳ
      layout: 'Cột: yếu tố, điểm DN, điểm đối thủ; D = SUMPRODUCT(ABS(B-C))/COUNT(B); r = CORREL(B,C); đồ thị đường (line chart) cho đường giá trị.'
  - id: "m10-excel_google_sheets_templates-4"
    title: "Mẫu Excel/Sheets: BSC dashboard 4 viễn cảnh"
    tags: ["mẫu", "excel", "sheets", "bsc", "dashboard", "viễn", "cảnh"]
    text: |-
      name: BSC dashboard 4 viễn cảnh
      layout: 'Cột: viễn cảnh, mục tiêu, KPI, baseline, target, thực tế, điểm = min(actual/target, cap) hoặc theo mốc nền, trọng số, RAG bằng conditional formatting; sheet tổng hợp =SUMPRODUCT.'
  - id: "m10-excel_google_sheets_templates-5"
    title: "Mẫu Excel/Sheets: Wind tunnel + payoff kịch bản"
    tags: ["mẫu", "excel", "sheets", "wind", "tunnel", "payoff", "kịch", "bản"]
    text: |-
      name: Wind tunnel + payoff kịch bản
      layout: 'Hàng: chiến lược, cột: 4 kịch bản; ô điểm 0/1/2 hoặc tiền (tỷ VNĐ); cột min (maximin), tổng, EV (SUMPRODUCT với xác suất), bảng regret = MAX(cột) - ô; tín hiệu: bảng chỉ báo, trọng số, quan sát 0/0.5/1, điểm tín hiệu.'
