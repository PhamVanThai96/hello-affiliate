  - id: "m05-case_lessons-1"
    title: "Bài học case: Airbnb x Craigslist (hack nền tảng bằng kỹ thuật)"
    tags: ["bài", "học", "case", "airbnb", "craigslist", "hack", "nền", "tảng", "bằng", "kỹ", "thuật"]
    text: |-
      name: Airbnb x Craigslist (hack nền tảng bằng kỹ thuật)
      type: success
      setup: Airbnb ~2010 thiếu cả cung và cầu, không có ngân sách ads. Craigslist có hàng chục triệu người tìm chỗ ở nhưng không có API; Airbnb dựng tính năng đăng chéo, dùng bot điền form và chèn link kéo khách về.
      key_calculations:
      - 'Chi phí ads cho nguồn này: gần 0 (nguồn nêu)'
      - Số liệu 'hàng triệu người dùng' trong nguồn không có phép tính kèm
      lesson: Tận dụng nền tảng có sẵn khách mục tiêu để giải bài toán cold start; nhưng ranh giới đạo đức/pháp lý (spam, vi phạm điều khoản) và tính xác thực của câu chuyện cần cảnh giác.
      data_reliability: unverified
  - id: "m05-case_lessons-2"
    title: "Bài học case: Dropbox referral (từ CPA 288-300 USD xuống chi phí lưu trữ vài cent)"
    tags: ["bài", "học", "case", "dropbox", "referral", "từ", "cpa", "288", "300", "usd", "xuống", "chi"]
    text: |-
      name: Dropbox referral (từ CPA 288-300 USD xuống chi phí lưu trữ vài cent)
      type: success
      setup: 2008, CPA qua Google Ads 288-300 USD trong khi giá 99 USD/năm. Chuyển sang referral hai chiều +500MB (tối đa 16GB), game hóa thanh tiến trình.
      key_calculations:
      - Doanh thu năm đầu / CAC = 99 / 288 = 0.34 (chưa tính biên); payback ~ 2.9 năm
      - 100,000 -> 4,000,000 user trong 15 tháng = +3,900% (đúng)
      - CAC referral giả định 0.5 USD so với 288 USD (giả định minh họa)
      lesson: Khi CAC ads vượt giá trị khách, đổi sang cơ chế gắn trong sản phẩm có chi phí biên thấp, thưởng cả hai phía, đo K và CAC_ref.
      data_reliability: unverified
  - id: "m05-case_lessons-3"
    title: "Bài học case: TikTok (digital marketing và growth hacking phân tích theo AARRR)"
    tags: ["bài", "học", "case", "tiktok", "digital", "marketing", "và", "growth", "hacking", "phân", "tích", "theo"]
    text: |-
      name: TikTok (digital marketing và growth hacking phân tích theo AARRR)
      type: success
      setup: TikTok ra quốc tế 2017; mua Musical.ly, quảng cáo trên nền tảng đối thủ, onboarding dưới 30 giây, thuật toán For You, Duet/Stitch/Hashtag Challenge, TikTok Shop.
      key_calculations:
      - 'MAU 271M -> 1.5B: (1500-271)/271 = +453.5% (nguồn +454%)'
      - 'DAU 100M -> 1B: +900%; thời gian dùng 42 -> 95 phút: +126%; doanh thu 200M -> 20B USD: +9,900%'
      - DAU/MAU = 1B/1.5B = 66.7%, khớp khoảng 60-70% của nguồn
      - 'Ocean Spray #DreamsChallenge: 10B view, doanh số +25% (số nguồn)'
      lesson: 'Product = marketing; AI là động cơ tăng trưởng; giảm rào cản sáng tạo; growth hacking không miễn phí (chi 1 tỷ USD/năm quảng cáo trên đối thủ); social commerce là xu hướng. Rủi ro: quyền riêng tư, thiết kế gây nghiện, phụ thuộc thuật toán.'
      data_reliability: unverified
  - id: "m05-case_lessons-4"
    title: "Bài học case: Hotmail, Instagram, Slack (viral loop kinh điển)"
    tags: ["bài", "học", "case", "hotmail", "instagram", "slack", "viral", "loop", "kinh", "điển"]
    text: |-
      name: Hotmail, Instagram, Slack (viral loop kinh điển)
      type: success
      setup: Footer quảng cáo trong mỗi email (Hotmail 1996); cross-share (Instagram 2010); bottom-up team invite (Slack 2013).
      key_calculations:
      - 'Hotmail: 12M user trong 18 tháng (nguồn)'
      - 'Instagram: 25M user trong 1 năm (nguồn)'
      - 'Slack: 500K user đầu với 0 USD marketing (nguồn)'
      lesson: Gắn lời mời vào hành vi dùng sản phẩm; lợi ích rõ ràng cho cả hai phía; nhưng đây là cherry-pick từ người sống sót.
      data_reliability: unverified
  - id: "m05-case_lessons-5"
    title: "Bài học case: PropHunter (SaaS cảnh báo đất ngộp - case giả định của nguồn)"
    tags: ["bài", "học", "case", "prophunter", "saas", "cảnh", "báo", "đất", "ngộp", "giả", "định", "của"]
    text: |-
      name: PropHunter (SaaS cảnh báo đất ngộp - case giả định của nguồn)
      type: sme
      setup: SaaS cảnh báo bất động sản theo thời gian thực (Golden Hills, Hòa Liên, Đà Nẵng). Nhà đầu tư 30-50 tuổi; kênh Google Search, Facebook Ads, Zalo ZNS; UTM + Meta Pixel + GA4; blog/backlink; chuỗi email ngày 1-3-7; A/B landing (tính năng vs nỗi đau); Facebook Group; ROAS mục tiêu > 200%.
      key_calculations:
      - 'PMF: 45% rất thất vọng, retention tháng 1 là 65%, đạt'
      - 'AARRR: 1,000 user/tháng, Activation 20% là bottleneck'
      - 'ICE: ý tưởng 1 (4,5,8) = 17 (5.67); ý tưởng 2 (9,8,7) = 24 (8.0); chọn ý tưởng 2'
      - 'ROAS: 10 triệu ads cần >= 20 triệu doanh thu'
      - 'Viral: watermark PDF gửi qua Zalo; referral +15 ngày Pro'
      - 'North star: số cảnh báo được mở xem chi tiết mỗi tuần'
      lesson: 'Thứ tự đúng: PMF -> đo AARRR -> chọn bottleneck -> ICE -> thử nghiệm -> viral loop/referral -> north star. Đo bằng dữ liệu, không bằng cảm tính.'
      data_reliability: illustrative
  - id: "m05-case_lessons-6"
    title: "Bài học case: Growth Hacking với Affiliate (pre-landing, share-to-unlock, SEO parasite)"
    tags: ["bài", "học", "case", "growth", "hacking", "với", "affiliate", "pre", "landing", "share", "to", "unlock"]
    text: |-
      name: Growth Hacking với Affiliate (pre-landing, share-to-unlock, SEO parasite)
      type: sme
      setup: 'Hướng dẫn 3 chiến lược: lọc click để tăng EPC, share-to-unlock để giảm CPA, SEO ký sinh với dữ liệu cào để CPA tối ưu.'
      key_calculations:
      - EPC = hoa hồng / click sang merchant; CPA = chi phí ads / đơn
      - 'Ví dụ tính (worked example 3): EPC 800 -> 3,200 (4 lần) nhưng EPV 800 -> 960 (+20%)'
      lesson: Đòn bẩy là công nghệ để lọc và giá trị để người dùng tự quảng bá; nhưng phải đo EPV và tuân thủ chính sách nền tảng.
      data_reliability: illustrative
  - id: "m05-worked_examples-1"
    title: "Ví dụ có lời giải: m05_we_funnel_prophunter — Đo phễu AARRR của PropHunter và tác động sửa Activation"
    tags: ["ví", "dụ", "có", "lời", "giải", "m05_we_funnel_prophunter", "đo", "phễu", "aarrr", "của", "prophunter", "và"]
    text: |-
      id: m05_we_funnel_prophunter
      title: Đo phễu AARRR của PropHunter và tác động sửa Activation
      inputs:
        signups: 1000
        activation_before: 0.2
        activation_after: 0.45
        paid_conversion: 0.1
        price_month_vnd: 299000
      steps:
      - 'Giả định (illustrative): giá gói Pro 299,000 VNĐ/tháng, 10% người đã kích hoạt nâng cấp trả phí (số do tư vấn đặt ra, không có trong nguồn).'
      - 'Trước: Activated = 1,000 x 0.20 = 200; Paid = 200 x 0.10 = 20; MRR = 20 x 299,000 = 5,980,000.'
      - 'Sau khi làm nút một-click (ICE 8.0): Activation 45% -> Activated = 450; Paid = 45; MRR = 45 x 299,000 = 13,455,000.'
      - Toàn phễu tăng gấp 0.45/0.20 = 2.25 lần.
      - 'Quyết định: sửa Activation trước khi mua thêm traffic.'
      result: MRR tăng từ 5.98 triệu lên 13.455 triệu (+125%) nếu giả định đúng; bottleneck là Activation.
  - id: "m05-worked_examples-2"
    title: "Ví dụ có lời giải: m05_we_ads_reverse — Tính ngược phễu và ROAS cho chiến dịch Google Ads của SaaS"
    tags: ["ví", "dụ", "có", "lời", "giải", "m05_we_ads_reverse", "tính", "ngược", "phễu", "và", "roas", "cho"]
    text: |-
      id: m05_we_ads_reverse
      title: Tính ngược phễu và ROAS cho chiến dịch Google Ads của SaaS
      inputs:
        spend: 10000000
        cpc: 8000
        cvr_signup: 0.04
        activation: 0.2
        paid_conversion: 0.1
        price_year: 2990000
        gross_margin: 0.85
      steps:
      - Clicks = 10,000,000 / 8,000 = 1,250.
      - Signups = 1,250 x 0.04 = 50; Activated = 50 x 0.20 = 10; Paid = 10 x 0.10 = 1 khách.
      - Doanh thu = 1 x 2,990,000 = 2,990,000; ROAS = 2.99/10 = 0.299.
      - ROAS hòa vốn = 1/0.85 = 1.176; mục tiêu 2.0 cần doanh thu 20,000,000, tức 20,000,000/2,990,000 = 6.69 khách.
      - CR toàn phễu hiện tại = 0.04 x 0.2 x 0.1 = 0.08%; cần 6.69/1,250 = 0.535% (gấp 6.7 lần).
      - 'Nếu Activation lên 45%: Paid = 2.25 khách, ROAS 0.67, vẫn dưới 1.176.'
      result: Chưa nên mở rộng ads; trước hết cải thiện chuyển đổi (activation, paid conversion) và dùng kênh nhẹ chi phí như email/referral. Số liệu giả định minh họa.
  - id: "m05-worked_examples-3"
    title: "Ví dụ có lời giải: m05_we_affiliate_epc — Lọc click: EPC tăng 4 lần nhưng EPV chỉ tăng 20%"
    tags: ["ví", "dụ", "có", "lời", "giải", "m05_we_affiliate_epc", "lọc", "click", "epc", "tăng", "lần", "nhưng"]
    text: |-
      id: m05_we_affiliate_epc
      title: 'Lọc click: EPC tăng 4 lần nhưng EPV chỉ tăng 20%'
      inputs:
        visits: 10000
        cpc: 500
        commission_per_order: 80000
        direct_cvr: 0.01
        pass_filter: 0.3
        merchant_cvr_filtered: 0.04
      steps:
      - Chi phí ads = 10,000 x 500 = 5,000,000.
      - 'Đổ thẳng: click 10,000, đơn = 100, hoa hồng = 8,000,000; EPC = 800 (> CPC 500); lãi = 3,000,000; CPA = 5,000,000/100 = 50,000.'
      - 'Pre-landing: 30% qua lọc = 3,000 click; CVR 4% -> 120 đơn; hoa hồng = 9,600,000; EPC = 3,200 (4 lần); EPV = 960; lãi = 4,600,000; CPA = 41,667.'
      - Số click sang merchant giảm 70% nhưng EPV chỉ tăng 20%.
      result: Pre-landing có lợi (+1.6 triệu lãi), nhưng chuyển động thực là +20% EPV, không phải 4 lần. Giả định minh họa; kiểm chứng bằng A/B.
  - id: "m05-worked_examples-4"
    title: "Ví dụ có lời giải: m05_we_ab_test — Đọc kết quả A/B landing page và CPA"
    tags: ["ví", "dụ", "có", "lời", "giải", "m05_we_ab_test", "đọc", "kết", "quả", "landing", "page", "và"]
    text: |-
      id: m05_we_ab_test
      title: Đọc kết quả A/B landing page và CPA
      inputs:
        visits_A: 4000
        conv_A: 120
        visits_B: 4000
        conv_B: 160
        spend_each: 20000000
      steps:
      - CVR A = 3.0%; CVR B = 4.0%.
      - CPA A = 20,000,000/120 = 166,667; CPA B = 20,000,000/160 = 125,000 (giảm 25%).
      - 'z = 2.43 (> 1.96), p khoảng 0.015: khác biệt có ý nghĩa 5%.'
      - Cỡ mẫu cần để phát hiện 3% -> 4% với power 80% là khoảng 5,295 visit/biến thể; test hiện tại 4,000 là thiếu power, nên khuyến nghị kéo dài trước khi scale hoàn toàn.
      result: Bản B (đánh vào nỗi đau) thắng, CPA giảm 25%; nên xác nhận thêm vì mẫu dưới cỡ mẫu tính trước.
  - id: "m05-worked_examples-5"
    title: "Ví dụ có lời giải: m05_we_viral_k — K-factor của share-to-unlock và CAC hiệu dụng"
    tags: ["ví", "dụ", "có", "lời", "giải", "m05_we_viral_k", "factor", "của", "share", "to", "unlock", "và"]
    text: |-
      id: m05_we_viral_k
      title: K-factor của share-to-unlock và CAC hiệu dụng
      inputs:
        paid_users: 500
        paid_cac: 200000
        share_rate: 0.4
        groups: 3
        reach_per_group: 10
        view_to_signup: 0.01
      steps:
      - i = 0.40 x 3 x 10 = 12 người được tiếp cận trên mỗi user; K = 12 x 0.01 = 0.12.
      - Tổng user khuếch đại = 500/(1 - 0.12) = 568 (tiệm cận); CAC hiệu dụng = 200,000 x 0.88 = 176,000.
      - 'Muốn giảm CAC 1/3 cần K = 0.33: ví dụ conversion 2.75% hoặc reach 33 người/user.'
      - Cộng chi phí phần thưởng (mã giảm/file) vào CAC để có kết quả ròng.
      result: 'K = 0.12: giảm CAC 12%, không phải ''1 khách mang 3 khách miễn phí''. Giả định minh họa.'
