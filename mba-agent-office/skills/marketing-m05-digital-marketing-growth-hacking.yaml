  - id: "m05-decision_rules-4"
    title: "Quy tắc quyết định: Nếu CTR thấp thì sửa creative/target; nếu CTR ổn mà CVR thấp thì sửa landing page/offer."
    tags: ["quy", "tắc", "quyết", "định", "nếu", "ctr", "thấp", "thì", "sửa", "creative", "target", "ổn"]
    text: |-
      Nếu CTR thấp thì sửa creative/target; nếu CTR ổn mà CVR thấp thì sửa landing page/offer.
  - id: "m05-decision_rules-5"
    title: "Quy tắc quyết định: Nếu một chặng AARRR thấp bất thường thì tập trung chặng đó trước khi tăng Acquisition."
    tags: ["quy", "tắc", "quyết", "định", "nếu", "một", "chặng", "aarrr", "thấp", "bất", "thường", "thì"]
    text: |-
      Nếu một chặng AARRR thấp bất thường thì tập trung chặng đó trước khi tăng Acquisition.
  - id: "m05-decision_rules-6"
    title: "Quy tắc quyết định: Nếu Activation thấp thì rút ngắn time-to-value (một-click, điền sẵn) trước khi mua thêm traffic."
    tags: ["quy", "tắc", "quyết", "định", "nếu", "activation", "thấp", "thì", "rút", "ngắn", "time", "to"]
    text: |-
      Nếu Activation thấp thì rút ngắn time-to-value (một-click, điền sẵn) trước khi mua thêm traffic.
