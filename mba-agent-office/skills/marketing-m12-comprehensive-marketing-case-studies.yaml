      name: Case 2 - Soya Garden (phân khúc nhỏ và WTP bị ngộ nhận, Việt Nam)
      type: failure
      setup: Thành lập 2016; gọi vốn hơn $2 triệu USD (khoảng 45 tỷ VNĐ) theo nguồn; mở hơn 50 cửa hàng vị trí vàng Hà Nội/TP.HCM; sữa đậu nành hữu cơ định giá 50.000-75.000 VNĐ so với vỉa hè 5.000-10.000 VNĐ.
      key_calculations:
      - 'Chênh giá: 50.000/10.000 = 5 lần đến 75.000/5.000 = 15 lần (nguồn nêu ''khoảng 7 lần'', khớp mức giữa).'
      - 'Quy đổi vốn: $2.000.000 x 23.000 = khoảng 46 tỷ VNĐ (nguồn nêu khoảng 45 tỷ).'
      - '5 tiêu chí phân khúc (Kotler): thất bại ở Substantial - phân khúc sẵn lòng trả giá premium quá nhỏ/phân mảnh để phủ chi phí cố định mặt bằng.'
      - 'Hệ quả (nguồn nêu): retention rơi tự do khi hết tò mò; COVID-19 2020-2021 đóng hơn 90% cửa hàng.'
      lesson: Quan tâm sức khỏe không bằng sẵn lòng chi trả; trước khi nhân rộng chuỗi vật lý phải chứng minh retention và WTP ở quy mô nhỏ. Khi định vị phá nhận thức cố hữu (đậu nành bình dân), cần cầu nối giá trị cảm nhận tương xứng.
      data_reliability: unverified
  - id: "m12-case_lessons-3"
    title: "Bài học case: Case 3 - Starbucks (7P nhất quán, Third Place, toàn cầu)"
