      key_calculations:
      - 'Price: định giá theo giá trị cảm nhận, cao hơn quán thường khoảng 150-200% (nguồn nêu, mơ hồ).'
      - 'People: Baristas là Partners, cổ phiếu Bean Stock; Process: Mobile Order and Pay (nguồn nêu lấy nước dưới 2 phút); Physical Evidence: ánh sáng vàng, gỗ, nhạc jazz, mùi cà phê.'
      - 'Service Blueprint chia 3 ranh giới: Line of Interaction, Line of Visibility, Line of Internal Support; mọi điểm tiếp xúc đo bằng giây.'
      lesson: Giá cao chỉ bền khi People, Process, Physical Evidence cùng chứng minh; tính nhất quán hệ thống là hàng rào chống sao chép (đối thủ copy được một P nhưng khó copy cả bảy).
      data_reliability: illustrative
