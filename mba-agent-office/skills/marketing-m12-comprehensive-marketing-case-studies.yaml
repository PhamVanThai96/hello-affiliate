      - 'SIR: R0 = beta x S0/gamma; minh họa R0 = 2,5 -> bức xúc tăng mũ, đỉnh I khoảng 23,5% quần thể.'
      lesson: Conversation thuộc cộng đồng; không lợi dụng biểu tượng xã hội để đánh bóng sản phẩm. Cần kiểm duyệt đa dạng trước khi phát hành và kế hoạch khủng hoảng 6 bước.
