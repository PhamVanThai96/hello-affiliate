  - id: "m12-case_lessons-1"
    title: "Bài học case: Case 1 - Biti's Hunter (tái định vị STP sang giới trẻ, Việt Nam)"
    tags: ["bài", "học", "case", "biti", "hunter", "tái", "định", "vị", "stp", "sang", "giới", "trẻ"]
    text: |-
      name: Case 1 - Biti's Hunter (tái định vị STP sang giới trẻ, Việt Nam)
      type: success
      setup: Biti's từng là giày quốc dân thập niên 90 ('Nâng niu bàn chân Việt'), bị Nike/Adidas ở trên và hàng Trung Quốc rẻ ở dưới ép; hình ảnh bền nhưng thô, già hóa. 2016 ra dòng Hunter nhắm 15-24 tuổi đô thị loại I, định vị sneaker streetwear siêu nhẹ, thông điệp 'Đi để trở về'.
      key_calculations:
      - 'Seg: giới trẻ 15-24, đô thị loại I, ngân sách vừa phải, nhạy mạng xã hội.'
      - 'Positioning map hai trục (giá - phong cách): Hunter ở vùng ''accessible cool'' giữa Nike/Adidas (premium) và giày Trung Quốc đại trà (rẻ).'
      - '4P nhất quán: Product phylon 204g siêu nhẹ; Price khoảng 650.000 VNĐ phù hợp học sinh sinh viên; Place cửa hàng Hunter Stores; Promotion MV Lạc trôi (Sơn Tùng M-TP) và Đi để trở về (Soobin Hoàng Sơn) dịp Tết dương lịch 2017.'
      - 'Kết quả (nguồn nêu): hơn 100.000 đôi bán trong tuần đầu; doanh số tổng +300% trong 3 năm.'
      lesson: Tái định vị thành công khi chọn phân khúc rõ, định vị mới thật khác định vị cũ, và 4P đồng bộ (sản phẩm nhẹ, giá vừa túi tiền, kênh trải nghiệm, truyền thông phong cách sống). Tái định vị cho thương hiệu lâu năm cần dám bỏ định vị cũ ('siêu bền').
      data_reliability: unverified
  - id: "m12-case_lessons-2"
    title: "Bài học case: Case 2 - Soya Garden (phân khúc nhỏ và WTP bị ngộ nhận, Việt Nam)"
