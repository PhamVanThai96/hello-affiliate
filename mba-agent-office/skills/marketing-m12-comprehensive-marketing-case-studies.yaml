  - id: "m12-case_lessons-5"
    title: "Bài học case: Case 5 - Spotify (giảm churn nâng CLV)"
    tags: ["bài", "học", "case", "spotify", "giảm", "churn", "nâng", "clv"]
    text: |-
      name: Case 5 - Spotify (giảm churn nâng CLV)
      type: success
      setup: 'Freemium: bản miễn phí quảng cáo + Premium thu phí; churn cao làm CAC ăn mòn tiền mặt. Công cụ: Discover Weekly (30 bài mới mỗi sáng thứ Hai) tạo switching cost tâm lý; Family Plan 6 tài khoản.'
      key_calculations:
      - 'Giả định: ARPU $10/tháng, margin 30%, d = 1%/tháng, CAC $15.'
      - 'Churn 5,5%: CLV = 3/(1 - 0,945/1,01) = 3/0,06436 = 46,62 USD; CLV/CAC = 3,11.'
      - 'Churn 3,9%: CLV = 3/(1 - 0,961/1,01) = 3/0,04851 = 61,84 USD; CLV/CAC = 4,12.'
      - Mức tăng CLV = 32,7%; payback = 15/(10 x 0,30) = 5 tháng. Giảm churn 1,6 điểm % cho CLV +15,2 USD không tốn thêm CAC.
      lesson: 'Churn là đòn bẩy CLV rẻ nhất: đầu tư vào cá nhân hóa, thói quen và gói gia đình làm tăng giá trị mỗi khách và cho phép trả CAC cao hơn. Số liệu Spotify là giả định minh họa.'
      data_reliability: illustrative
  - id: "m12-case_lessons-6"
    title: "Bài học case: Case 6 - MoviePass (CLV âm, Mỹ)"
    tags: ["bài", "học", "case", "moviepass", "clv", "âm", "mỹ"]
    text: |-
      name: Case 6 - MoviePass (CLV âm, Mỹ)
      type: failure
      setup: 2017 gói $9,95/tháng xem 1 phim/ngày; MoviePass trả rạp khoảng $12/vé; người dùng từ 20.000 lên khoảng 3 triệu trong 1 năm.
      key_calculations:
      - Margin/tháng nếu xem 1 phim = 9,95 - 12 = -2,05 USD.
      - Xem 3 phim = 9,95 - 36 = -26,05 USD; hòa vốn q* = 9,95/12 = 0,83 phim/tháng.
      - CLV = tổng biên âm liên tục chiết khấu -> âm (nguồn viết -vô cực); CAC thấp không cứu được.
      - 'Hậu quả: vay nóng lãi cao, chặn ứng dụng, phá sản (nguồn nêu 2019; thực tế công ty mẹ nộp đơn 1/2020).'
      lesson: Không trợ giá khi biên đóng góp âm trừ khi có nguồn thu thứ hai chắc chắn (hoa hồng bắp nước, dữ liệu). Tăng trưởng nhanh càng làm lỗ nhanh.
      data_reliability: illustrative
  - id: "m12-case_lessons-7"
    title: "Bài học case: Case 7 - Apple (đỉnh tháp CBBE)"
    tags: ["bài", "học", "case", "apple", "đỉnh", "tháp", "cbbe"]
    text: |-
      name: Case 7 - Apple (đỉnh tháp CBBE)
      type: success
      setup: 'Tháp 4 tầng CBBE: Salience (quả táo cắn dở), Performance/Imagery (iOS mượt, bảo mật, ''Think Different''), Judgments/Feelings (hoàn thiện, địa vị), Resonance (cộng đồng iFans, xếp hàng đêm).'
      key_calculations:
      - 'Elasticity thấp -> Lerner: P* = C x eps/(eps-1); eps=1,25 cho P*=5C (biên gộp lý thuyết 80%); nguồn nói biên 40-50% - mâu thuẫn, xem pitfalls.'
      - 'So sánh: eps=4 -> P*=1,33C (biên 25%) cho thương hiệu thông thường.'
      lesson: Đỉnh tháp Resonance làm khách ít so sánh thông số kỹ thuật và giảm độ nhạy giá (tăng được markup); xây dần từ Salience qua Feelings, không nhảy cóc. '$3.000 tỷ' trong nguồn là vốn hóa thị trường, không phải giá trị thương hiệu.
      data_reliability: illustrative
