  - id: "m12-case_lessons-9"
    title: "Bài học case: Case 9 - Dropbox (referral loop, K-factor)"
    tags: ["bài", "học", "case", "dropbox", "referral", "loop", "factor"]
    text: |-
      name: Case 9 - Dropbox (referral loop, K-factor)
      type: success
      setup: AdWords tốn $250-350 mỗi khách mới trong khi phí cơ bản $99/năm; chuyển sang referral hai chiều +500MB, đồng bộ danh bạ Gmail 2 lần bấm.
      key_calculations:
      - CLV/CAC doanh thu năm đầu = 99/250 = 0,40 đến 99/350 = 0,28 (nguồn nêu dưới 0,3).
      - Với biên 70% giả định, payback = 300/(99 x 0,7) = 4,3 năm - không sống nổi bằng quảng cáo trả phí.
      - 'Kết quả nguồn nêu: 100.000 -> hơn 4.000.000 người dùng trong 15 tháng; K > 1,15.'
      - 'Kiểm tra số học: K=1,15 cần log(40)/log(1,15) = 26,4 vòng để tăng 40 lần; để đạt trong 15 tháng cần chu kỳ ~17 ngày/vòng.'
      lesson: Nhúng động lực lan truyền vào sản phẩm (phần thưởng là chính sản phẩm có chi phí biên thấp), làm đơn giản chia sẻ, đo i và c. Đừng bỏ qua chi phí lưu trữ cho phần thưởng.
      data_reliability: unverified
  - id: "m12-case_lessons-10"
