  - id: "m12-worked_examples-1"
    title: "Ví dụ có lời giải: m12_we_subscription_launch — Ví dụ tích hợp 1 - Gói cà phê thuê bao SME (STP -> giá -> q* -> CLV/CAC -> payback)"
    tags: ["ví", "dụ", "có", "lời", "giải", "m12_we_subscription_launch", "tích", "hợp", "gói", "cà", "phê", "thuê"]
    text: |-
      id: m12_we_subscription_launch
      name: Ví dụ tích hợp 1 - Gói cà phê thuê bao SME (STP -> giá -> q* -> CLV/CAC -> payback)
      inputs:
        arpu_vnd: 450000
        margin: 0.55
        d: 0.01
        cac_vnd: 1200000
        churn_base: 0.06
        churn_improved: 0.04
        variable_cost_per_cup: 18000
      steps:
      - 'Bước 1 (STP, m01): phân khúc dân văn phòng bán kính 1 km, uống 1 ly/ngày làm việc; WTP gói 450.000 VNĐ/tháng được khảo sát trước với mẫu >= 100 người.'
      - 'Bước 2 (m12_contribution_margin_usage): q* = 450.000/18.000 = 25 ly/tháng. Khách dùng 22 ngày/tháng x 1 ly = 22 ly < 25 -> còn biên; khách uống 2 ly/ngày (44 ly) -> lỗ ngay. Đặt giới hạn 1 ly/ngày.'
      - 'Bước 3 (m12_clv_discounted_geometric): margin 55% -> biên 247.500 VNĐ/tháng. Churn 6%: CLV = 247.500/(1 - 0,94/1,01) = 247.500/0,069307 = 3.571.071 VNĐ; CLV/CAC = 3.571.071/1.200.000 = 2,98.'
      - 'Bước 4 (m12_cac_payback): 1.200.000/247.500 = 4,85 tháng.'
      - 'Bước 5: Giảm churn 6% -> 4% (cải thiện cá nhân hóa, tích điểm): CLV = 247.500/(1 - 0,96/1,01) = 4.999.500; CLV/CAC = 4,17; tăng 40,0% (+1.428.429 VNĐ mỗi khách); với 100 khách mới = +142,8 triệu VNĐ giá trị.'
      - 'Bước 6: CAC tối đa cho CLV/CAC = 3: 3.571.071/3 = 1.190.357 (churn 6%) hoặc 1.666.500 (churn 4%).'
      - 'Bước 7: Churn 8% -> CLV 2.777.500; CLV/CAC = 2,32 < 3 -> cảnh báo không mở rộng.'
      result: CLV/CAC 2,98 (churn 6%), 4,17 (churn 4%), 2,32 (churn 8%); payback 4,85 tháng; q* = 25 ly/tháng. Số liệu giả định minh họa tự nhất quán.
  - id: "m12-worked_examples-2"
    title: "Ví dụ có lời giải: m12_we_pricing_ab — Ví dụ tích hợp 2 - Giá tối ưu Lerner và A/B test trang đăng ký"
    tags: ["ví", "dụ", "có", "lời", "giải", "m12_we_pricing_ab", "tích", "hợp", "giá", "tối", "ưu", "lerner"]
    text: |-
      id: m12_we_pricing_ab
      name: Ví dụ tích hợp 2 - Giá tối ưu Lerner và A/B test trang đăng ký
      inputs:
        C: 18000
        eps_options:
        - 4
        - 2.5
        - 1.8
        conv_A: 216
        conv_B: 264
        n_each: 2400
      steps:
      - 'Giá tối ưu: eps=4 -> P* = 18.000 x 4/3 = 24.000 (biên 25%); eps=2,5 -> 30.000 (biên 40%); eps=1,8 -> 40.500 (biên 55,6%). Thương hiệu mạnh hơn (eps nhỏ) chịu giá cao hơn.'
      - 'Kiểm tra tại eps=2,5: P* = 30.000; lợi nhuận tương đối nếu tăng giá thêm 20% = 0,951 lần; nếu giảm 20% = 0,873 lần -> P* là cực đại.'
      - 'A/B trang đăng ký: pA = 216/2400 = 9,0%; pB = 264/2400 = 11,0%; p gộp = 480/4800 = 10,0%.'
      - SE = sqrt(0,10 x 0,90 x (2/2400)) = 0,00866; Z = 0,02/0,00866 = 2,31.
      - 'Kết luận: Z = 2,31 > 1,96 (cả hai phía) -> bác bỏ H0 ở mức 5%; triển khai B nếu chi phí thay đổi nhỏ, theo dõi churn của cohort B (lift đăng ký có thể kèm chất lượng thấp).'
      result: P* = 30.000 VNĐ khi eps=2,5; Z = 2,31 nên chọn bản B
  - id: "m12-worked_examples-3"
    title: "Ví dụ có lời giải: m12_we_viral_vs_paid — Ví dụ tích hợp 3 - Referral (K-factor) so với quảng cáo trả phí"
    tags: ["ví", "dụ", "có", "lời", "giải", "m12_we_viral_vs_paid", "tích", "hợp", "referral", "factor", "so", "với"]
    text: |-
      id: m12_we_viral_vs_paid
      name: Ví dụ tích hợp 3 - Referral (K-factor) so với quảng cáo trả phí
      inputs:
        N0: 100000
        i: 5
        c: 0.23
        CAC_paid: 300
        price_year: 99
        margin: 0.7
      steps:
      - K = 5 x 0,23 = 1,15 > 1 -> tự duy trì lý thuyết.
      - 'Sau 3/6/9/12 vòng: N0 x K^n = 152.087 / 231.306 / 351.788 / 535.025 (thế hệ thứ n).'
      - 'Quảng cáo trả phí: CAC trung bình 300 USD; biên năm = 99 x 0,7 = 69,3 USD; payback = 300/69,3 = 4,33 năm (> thời gian khách ở lại điển hình) -> không bền.'
      - 'Referral chi phí biên: giả định phần thưởng 500MB tốn 0,5 USD mỗi người -> CAC thực khoảng 1 USD (hai phía) so với 300 USD.'
      - 'Nếu K giảm xuống 0,8 (i=4, c=0,2): tổng người dùng từ 1 hạt giống = 1/(1-0,8) = 5 -> vẫn giảm CAC trộn nhưng tắt dần; cần kênh trả phí tiếp tế.'
      result: 'K=1,15: vòng viral; quảng cáo trả phí cho payback 4,33 năm. Tham số i, c, chi phí phần thưởng là giả định.'
  - id: "m12-worked_examples-4"
    title: "Ví dụ có lời giải: m12_we_attribution_budget — Ví dụ tích hợp 4 - So sánh 4 mô hình attribution cho cùng một hành trình"
    tags: ["ví", "dụ", "có", "lời", "giải", "m12_we_attribution_budget", "tích", "hợp", "so", "sánh", "mô", "hình"]
    text: |-
      id: m12_we_attribution_budget
      name: Ví dụ tích hợp 4 - So sánh 4 mô hình attribution cho cùng một hành trình
      inputs:
        path: Search (14 ngày trước) -> Facebook (7 ngày) -> Email (1 ngày) -> Mua
        lambda: 7
        order_value_vnd: 1000000
      steps:
      - 'Last-touch: Email 100% = 1.000.000 VNĐ; Search, Facebook = 0.'
      - 'Linear: mỗi kênh 33,3% = 333.333 VNĐ.'
      - 'Time-decay lambda 7: w = 0,25 / 0,5 / 0,906; chuẩn hóa: Search 15,1% (151.000), Facebook 30,2% (302.000), Email 54,7% (547.000).'
      - 'Markov (đồ thị giả định, 1.000 đơn): P(conv)=0,31; RE Search 83,9%, Facebook 35,5%, Email 41,9%; chuẩn hóa Search 52%, Email 26%, Facebook 22%.'
      - 'Diễn giải: Search bị last-touch cho 0 nhưng bỏ nó thì mất 83,9% chuyển đổi -> kênh thượng nguồn thiết yếu. Quyết định: không cắt Search; kiểm lại bằng holdout trước khi chuyển ngân sách.'
      result: 'Search nhận 0% (last-touch) so với 52% (Markov): hai mô hình dẫn đến quyết định ngân sách trái ngược'
  - id: "m12-worked_examples-5"
    title: "Ví dụ có lời giải: m12_we_markov_share — Ví dụ tích hợp 5 - Dự báo thị phần Markov và giá trị đầu tư giữ chân"
    tags: ["ví", "dụ", "có", "lời", "giải", "m12_we_markov_share", "tích", "hợp", "dự", "báo", "thị", "phần"]
    text: |-
      id: m12_we_markov_share
      name: Ví dụ tích hợp 5 - Dự báo thị phần Markov và giá trị đầu tư giữ chân
      inputs:
        P:
        - - 0.8
          - 0.2
        - - 0.3
          - 0.7
        s0:
        - 0.5
        - 0.5
      steps:
      - s(1) = (0,5 x 0,8 + 0,5 x 0,3; 0,5 x 0,2 + 0,5 x 0,7) = (0,55; 0,45).
      - s(2) = (0,575; 0,425); s(5) = (0,5969; 0,4031).
      - Cân bằng pi_A = p21/(p12 + p21) = 0,3/0,5 = 60%.
      - 'Chiến dịch giữ chân nâng p11 từ 0,8 lên 0,85 (p12 = 0,15): pi_A = 0,3/(0,15+0,3) = 66,7% (+6,7 điểm % thị phần dài hạn).'
      - 'Chiến dịch giành khách nâng p21 từ 0,3 lên 0,35: pi_A = 0,35/(0,2+0,35) = 63,6% (+3,6 điểm).'
      result: Cùng mức cải thiện 5 điểm % xác suất, giữ chân (p12 giảm) cho +6,7 điểm, giành khách (p21 tăng) cho +3,6 điểm - ưu tiên giữ chân khi hai chi phí tương đương
  - id: "m12-practice_questions-1"
    title: "Câu hỏi luyện tập: Nguồn Câu hỏi 2: SaaS Fintech có churn tháng tăng từ 2% lên 8%. Với ARPU 10, biên 30%, d=1%, CLV gi…"
    tags: ["câu", "hỏi", "luyện", "tập", "nguồn", "saas", "fintech", "có", "churn", "tháng", "tăng", "từ"]
    text: |-
      q: 'Nguồn Câu hỏi 2: SaaS Fintech có churn tháng tăng từ 2% lên 8%. Với ARPU 10, biên 30%, d=1%, CLV giảm bao nhiêu phần trăm? Giả thiết giá trị doanh nghiệp tỷ lệ thuận tổng CLV danh mục thì EV giảm thế nào?'
      a: 'CLV(2%) = 3/(1 - 0,98/1,01) = 101,00; CLV(8%) = 3/(1 - 0,92/1,01) = 33,67; giảm 66,7%. Nếu EV tỷ lệ với tổng CLV và số khách không đổi, EV giảm cùng 66,7%. Giải pháp: onboarding/Aha moment, cá nhân hóa, gói gia đình/dài hạn, cảnh báo sớm churn theo hành vi, ưu đãi giữ chân.'
  - id: "m12-practice_questions-2"
    title: "Câu hỏi luyện tập: Vì sao gói 'không giới hạn' có thể giết doanh nghiệp (MoviePass), tính q* thế nào?"
    tags: ["câu", "hỏi", "luyện", "tập", "vì", "sao", "gói", "không", "giới", "hạn", "có", "thể"]
    text: |-
      q: Vì sao gói 'không giới hạn' có thể giết doanh nghiệp (MoviePass), tính q* thế nào?
      a: q* = ARPU/biến phí mỗi lần dùng = 9,95/12 = 0,83 phim/tháng. Khách dùng nhiều hơn q* gây lỗ; khách dùng nhiều tự chọn gói; cần giới hạn dùng hoặc nguồn thu bổ trợ.
  - id: "m12-practice_questions-3"
    title: "Câu hỏi luyện tập: Phân biệt Z-test một phía và hai phía; vì sao nguồn dùng 1,96 là chưa chính xác cho H1 một phía?"
    tags: ["câu", "hỏi", "luyện", "tập", "phân", "biệt", "test", "một", "phía", "và", "hai", "vì"]
    text: |-
      q: Phân biệt Z-test một phía và hai phía; vì sao nguồn dùng 1,96 là chưa chính xác cho H1 một phía?
      a: 'Hai phía 5% có ngưỡng 1,96; một phía 5% là 1,645. H1: pB > pA là một phía nên ngưỡng 1,645 (hoặc dùng 1,96 để bảo thủ, nhưng phải nêu rõ).'
  - id: "m12-practice_questions-4"
    title: "Câu hỏi luyện tập: Nếu eps = 1,25 thì giá tối ưu gấp mấy lần chi phí và biên gộp là bao nhiêu? Vì sao điều này mâu thu…"
    tags: ["câu", "hỏi", "luyện", "tập", "nếu", "eps", "25", "thì", "giá", "tối", "ưu", "gấp"]
    text: |-
      q: Nếu eps = 1,25 thì giá tối ưu gấp mấy lần chi phí và biên gộp là bao nhiêu? Vì sao điều này mâu thuẫn với biên 40-50% của Apple trong nguồn?
      a: P* = 5C, biên gộp 1/eps = 80%. Biên 40-50% ứng eps 2,0-2,5; hoặc biên gộp kế toán thực của Apple không phải biên đơn vị của một sản phẩm; cần ước lượng eps từ dữ liệu.
  - id: "m12-practice_questions-5"
    title: "Câu hỏi luyện tập: Cohort có alpha cao nhưng beta < 1 chẩn đoán gì?"
    tags: ["câu", "hỏi", "luyện", "tập", "cohort", "có", "alpha", "cao", "nhưng", "beta", "chẩn", "đoán"]
    text: |-
      q: Cohort có alpha cao nhưng beta < 1 chẩn đoán gì?
      a: Mất khách lớn ngay ban đầu (Activation yếu - chưa tới Aha moment) nhưng khách ở lại thì trung thành dần. Ưu tiên cải thiện onboarding.
  - id: "m12-practice_questions-6"
    title: "Câu hỏi luyện tập: Vì sao 5 mô hình attribution cho kết quả khác nhau, chọn mô hình nào?"
    tags: ["câu", "hỏi", "luyện", "tập", "vì", "sao", "mô", "hình", "attribution", "cho", "kết", "quả"]
    text: |-
      q: Vì sao 5 mô hình attribution cho kết quả khác nhau, chọn mô hình nào?
      a: Mỗi mô hình là giả định khác (last-touch = kênh cuối; linear = bằng nhau; time-decay = gần thì nặng; Markov = giá trị biên nếu bỏ kênh). Dùng Markov/data-driven khi đủ dữ liệu và xác nhận bằng thử nghiệm incrementality; dùng time-decay khi dữ liệu mỏng.
