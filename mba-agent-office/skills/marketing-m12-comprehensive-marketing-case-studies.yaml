  - id: "m12-case_lessons-12"
    title: "Bài học case: Case 12 - Pepsi Kendall Jenner (Conversation phản ứng ngược)"
    tags: ["bài", "học", "case", "12", "pepsi", "kendall", "jenner", "conversation", "phản", "ứng", "ngược"]
