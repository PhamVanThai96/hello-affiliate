  - id: "m12-case_lessons-11"
    title: "Bài học case: Case 11 - Airbnb (4C hoàn chỉnh)"
    tags: ["bài", "học", "case", "11", "airbnb", "4c", "hoàn", "chỉnh"]
    text: |-
      name: Case 11 - Airbnb (4C hoàn chỉnh)
      type: success
      setup: Không sở hữu phòng nào; nền tảng P2P với Co-creation (chủ nhà tự thiết kế), Currency (Smart Pricing), Communal Activation (phòng trống), Conversation (đánh giá hai chiều ẩn danh).
      key_calculations:
      - 'Giá động minh họa: base 500.000 VNĐ, D=120, S=80, alpha 0,5, gamma 0,2, tau 0,6 -> 595.808 VNĐ (+19,2%) (công thức minh họa).'
      - 'Nguồn nêu IPO vượt $100 tỷ USD và số phòng lớn hơn 5 tập đoàn khách sạn: chưa kiểm chứng; giá IPO 12/2020 định giá khoảng $47 tỷ.'
