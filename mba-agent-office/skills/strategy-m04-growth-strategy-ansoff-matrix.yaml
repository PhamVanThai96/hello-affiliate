    text: |-
      Khi nghi ngờ nên thử nhỏ: mở pop-up/kiosk 3 tháng, bán thử trên 1 sàn, ra mắt 1 SKU mới, trước khi cam kết vốn lớn.
  - id: "m04-case_lessons-1"
    title: "Bài học case: Vingroup - đa dạng hóa và rút lui"
    tags: ["bài", "học", "case", "vingroup", "đa", "dạng", "hóa", "và", "rút", "lui"]
    text: |-
      name: Vingroup - đa dạng hóa và rút lui
      type: failure
      setup: Vingroup là tập đoàn tư nhân lớn nhất VN; mở rộng từ BĐS (Vinhomes) sang bán lẻ (VinMart), resort, ô tô (VinFast), điện thoại (Vsmart), giáo dục (VinSchool), y tế (Vinmec), kế hoạch hàng không (Vinpearl Air) rồi thu hẹp.
      key_calculations:
      - 'Phân loại Ansoff theo nguồn: BĐS cao cấp = Penetration/lõi; VinMart, Vinpearl = Product Development (khách Vinhomes); VinFast, Vsmart = Unrelated Diversification; VinSchool, Vinmec = có synergy hệ sinh thái.'
      - 'Kết quả: Vsmart đóng cửa 2021; VinMart bán cho Masan (2019); kế hoạch hàng không hủy; tập trung VinFast, Vinhomes.'
      lesson: 'Ansoff cảnh báo đúng: unrelated diversification rủi ro nhất dù vốn lớn; thiếu năng lực cốt lõi (phần mềm, brand ô tô, dealer network) thì vốn không bù được. Synergy (đa dạng hóa liên quan) làm tăng tỷ lệ thành công. Với SME: vốn nhỏ hơn nhiều nên tolerance cho thất bại thấp hơn.'
      data_reliability: unverified
  - id: "m04-case_lessons-2"
    title: "Bài học case: Unilever - quản lý danh mục theo BCG"
    tags: ["bài", "học", "case", "unilever", "quản", "lý", "danh", "mục", "theo", "bcg"]
    text: |-
      name: Unilever - quản lý danh mục theo BCG
      type: success
      setup: Dove = Star; OMO/Surf = Cash Cow (số 1 VN và Đông Nam Á, thị trường bão hòa); Dollar Shave Club = Question Mark; mảng margarine = Dog.
      key_calculations:
      - Bán margarine cho KKR giá khoảng 8 tỷ USD (2018) -> giải phóng vốn cho thương hiệu tăng trưởng.
      - Dollar Shave Club mua khoảng 1 tỷ USD (2016) nhưng không thành Star do Gillette phản công.
      lesson: 'Dùng Cash Cow nuôi Star/QM, bán Dog khi mua được giá tốt. Hạn chế BCG: không dự đoán phản ứng đối thủ, nên mỗi QM cần mốc và điều kiện dừng.'
      data_reliability: unverified
  - id: "m04-case_lessons-3"
    title: "Bài học case: Samsung - phân bổ vốn bằng GE-McKinsey"
    tags: ["bài", "học", "case", "samsung", "phân", "bổ", "vốn", "bằng", "ge", "mckinsey"]
    text: |-
      name: Samsung - phân bổ vốn bằng GE-McKinsey
      type: success
      setup: '6 SBU chấm hấp dẫn ngành/vị thế: Semiconductor 5,0/4,5; Galaxy 3,5/4,0; Display OLED 4,5/5,0; Gia dụng 3,0/3,5; SDI pin 4,5/3,0; Heavy (đóng tàu) 2,0/2,5.'
      key_calculations:
      - 'Hành động theo ô: đầu tư lớn cho chip (nguồn nêu khoảng 230 tỷ USD, 2022-2042); chọn lọc cho Galaxy và SDI; duy trì gia dụng; thu hoạch/tái cấu trúc đóng tàu.'
      lesson: 'GE giúp tập trung vốn vào ô xanh thay vì chia đều; hạn chế: không nói được đầu tư BAO NHIÊU, cần mô hình tài chính. Điểm số trong nguồn là minh họa, không phải số của Samsung.'
      data_reliability: illustrative
  - id: "m04-case_lessons-4"
    title: "Bài học case: VinFast EV - GE-McKinsey"
    tags: ["bài", "học", "case", "vinfast", "ev", "ge", "mckinsey"]
    text: |-
      name: VinFast EV - GE-McKinsey
      type: sme
      setup: 'Đánh giá SBU xe điện toàn cầu: Hấp dẫn ngành 5 yếu tố (tăng trưởng 0,30 điểm 5; rào cản 0,15 điểm 5; pháp lý 0,20 điểm 5; cạnh tranh 0,20 điểm 2; bền vững lợi nhuận 0,15 điểm 3); Vị thế 5 yếu tố (thị phần 0,20 điểm 2; tài chính 0,25 điểm 4; R&D 0,20 điểm 3; thương hiệu 0,15 điểm 3; chuỗi cung ứng 0,20 điểm 4).'
      key_calculations:
      - Hấp dẫn = 1,50 + 0,75 + 1,00 + 0,40 + 0,45 = 4,10 (nguồn cũ ghi 4,2 - đã sửa)
      - Vị thế = 0,40 + 1,00 + 0,60 + 0,45 + 0,80 = 3,25 (nguồn cũ ghi 3,2 - đã sửa)
      - 'Ô: Hấp dẫn Cao x Vị thế TB = đầu tư chọn lọc'
      lesson: 'Tấn công có chọn lọc: củng cố lõi (VN, hệ sinh thái, trạm sạc), mở rộng quốc tế kiểu vết dầu loang, tối ưu chi phí (thuê pin, phần mềm); điểm yếu then chốt là độ tin cậy sản phẩm. Điểm số mang tính đánh giá chủ quan, minh họa.'
      data_reliability: illustrative
  - id: "m04-worked_examples-1"
    title: "Ví dụ có lời giải: SME: chuỗi 3 quán trà sữa chọn hướng Ansoff"
    tags: ["ví", "dụ", "có", "lời", "giải", "sme", "chuỗi", "quán", "trà", "sữa", "chọn", "hướng"]
    text: |-
      name: 'SME: chuỗi 3 quán trà sữa chọn hướng Ansoff'
      inputs: Doanh thu 6.000 triệu/năm, mục tiêu +25% trong 3 năm, vốn tối đa 500 triệu. 4 phương án, 3 năm; biên đóng góp m và xác suất p ước lượng.
      steps:
      - 'Penetration (combo + app thành viên + giao hàng): p=0,7; thêm 600 tr/năm; m=15%; vốn 100 -> V = 0,7 x (600x0,15x3) - 100 = 0,7 x 270 - 100 = +89.'
      - 'Market Development (mở quán thứ 4 khu mới): p=0,5; thêm 1.200 tr/năm; m=15%; vốn 500 -> V = 0,5 x 540 - 500 = -230.'
      - 'Product Development (dòng trà trái cây + bánh ăn kèm): p=0,55; thêm 900 tr/năm; m=18%; vốn 200 -> V = 0,55 x 486 - 200 = +67,3.'
      - 'Diversification (nhượng quyền/nhà máy đóng chai): p=0,2; thêm 2.000 tr/năm; m=12%; vốn 1.500 -> V = 0,2 x 720 - 1.500 = -1.356.'
      - 'Kết luận: làm Penetration (V=+89) trước, kèm Product Development thử trên menu (V=+67,3); chưa mở quán 4 (V<0 trong 3 năm, cần NPV 5 năm và kiểm tra cannibalization); không đa dạng hóa.'
      result: 'Hướng chính: Penetration; hướng phụ: Product Development thử nghiệm. Mở quán 4 chỉ khi có NPV dương ở kịch bản xấu.'
  - id: "m04-worked_examples-2"
    title: "Ví dụ có lời giải: SME: shop F&B 4 dòng sản phẩm - BCG"
    tags: ["ví", "dụ", "có", "lời", "giải", "sme", "shop", "dòng", "sản", "phẩm", "bcg"]
    text: |-
      name: 'SME: shop F&B 4 dòng sản phẩm - BCG'
      inputs: 'Thị phần / thị phần đối thủ lớn nhất / tăng trưởng thị trường: Trà đào 30%/25%/22%; Trà sữa truyền thống 40%/35%/6%; Bánh ngọt 6%/15%/25%; Cà phê phin 4%/10%/-2%. Ngưỡng RMS=1; g=10%.'
      steps:
      - 'RMS: 30/25 = 1,2; 40/35 = 1,14; 6/15 = 0,4; 4/10 = 0,4.'
      - 'Phân ô: Trà đào (RMS>=1, g=22%) = Star; Trà sữa truyền thống (RMS>=1, g=6%) = Cash Cow; Bánh ngọt (RMS<1, g=25%) = Question Mark; Cà phê phin (RMS<1, g=-2%) = Dog.'
      - 'Hành động: Star = đầu tư giữ vị thế (marketing, nhân sự); Cow = thu hoạch giữ giá, không đầu tư thêm ngoài duy trì; QM = thử 3 tháng với mốc RMS >= 0,6 hoặc doanh thu đạt X, không đạt thì loại; Dog = giảm còn vài món hoặc bỏ (kiểm tra có kéo khách buổi sáng không).'
      - 'Ngân sách: tiền ra từ Cash Cow trích 60% cho Trà đào, 25% cho Bánh ngọt thử nghiệm, 15% dự phòng.'
      result: Một Star, một Cow, một QM được đầu tư có điều kiện, một Dog thu hẹp.
  - id: "m04-worked_examples-3"
    title: "Ví dụ có lời giải: SME: tập đoàn gia đình 3 SBU - GE-McKinsey"
    tags: ["ví", "dụ", "có", "lời", "giải", "sme", "tập", "đoàn", "gia", "đình", "sbu", "ge"]
    text: |-
      name: 'SME: tập đoàn gia đình 3 SBU - GE-McKinsey'
      inputs: 'Trọng số cả hai trục [0,30; 0,25; 0,25; 0,20]. SBU A (chuỗi giao hàng): hấp dẫn [4,4,3,4], vị thế [4,3,4,4]; SBU B (xưởng bao bì): [3,3,3,2], [3,3,3,3]; SBU C (kho cho thuê cũ): [2,2,3,2], [2,2,3,2].'
      steps:
      - 'Hấp dẫn: A = 0,3x4+0,25x4+0,25x3+0,2x4 = 3,75; B = 0,9+0,75+0,75+0,4 = 2,80; C = 0,6+0,5+0,75+0,4 = 2,25.'
      - 'Vị thế: A = 0,3x4+0,25x3+0,25x4+0,2x4 = 3,75; B = 3,00; C = 2,25.'
      - 'Ô: A cao/cao (3,75>3,67) = Invest/Grow; B TB/TB = chọn lọc/duy trì bảo vệ; C thấp/thấp = thu hoạch/bán.'
      - 'Độ nhạy: A sát ngưỡng 3,67 (3,75), kiểm tra bằng cách giảm điểm một yếu tố 1 bậc: nếu < 3,67 thì xếp chọn lọc, không rót mạnh.'
      - 'Hành động: dồn vốn vào A; giữ B, tối ưu chi phí; bán/ngừng C, giải phóng vốn.'
      result: A đầu tư tăng trưởng; B duy trì; C thoái vốn.
  - id: "m04-worked_examples-4"
    title: "Ví dụ có lời giải: Kiểm tra số liệu VinFast trong nguồn"
    tags: ["ví", "dụ", "có", "lời", "giải", "kiểm", "tra", "số", "liệu", "vinfast", "trong", "nguồn"]
    text: |-
      name: Kiểm tra số liệu VinFast trong nguồn
      inputs: Trọng số và điểm trong nguồn cho hai trục.
      steps:
      - Hấp dẫn = 0,3x5 + 0,15x5 + 0,2x5 + 0,2x2 + 0,15x3 = 4,10.
      - Vị thế = 0,2x2 + 0,25x4 + 0,2x3 + 0,15x3 + 0,2x4 = 3,25.
      result: 4,1 và 3,25 (nguồn đã sửa cho khớp).
  - id: "m04-practice_questions-1"
    title: "Câu hỏi luyện tập: Công ty có thị phần 18%, đối thủ lớn nhất 36%, thị trường tăng 12%/năm. Phân ô BCG thế nào?"
    tags: ["câu", "hỏi", "luyện", "tập", "công", "ty", "có", "thị", "phần", "18", "đối", "thủ"]
    text: |-
      q: Công ty có thị phần 18%, đối thủ lớn nhất 36%, thị trường tăng 12%/năm. Phân ô BCG thế nào?
      a: 'RMS = 18/36 = 0,5 < 1; tăng trưởng 12% >= 10%: Question Mark. Cần quyết định đầu tư chọn lọc hay loại.'
  - id: "m04-practice_questions-2"
    title: "Câu hỏi luyện tập: Nếu bạn là số 1 với thị phần 40% và số 2 là 30%, RMS bằng bao nhiêu?"
    tags: ["câu", "hỏi", "luyện", "tập", "nếu", "bạn", "là", "số", "với", "thị", "phần", "40"]
    text: |-
      q: Nếu bạn là số 1 với thị phần 40% và số 2 là 30%, RMS bằng bao nhiêu?
      a: 40/30 = 1,33 (mẫu số là đối thủ lớn nhất, ở đây là số 2).
  - id: "m04-practice_questions-3"
    title: "Câu hỏi luyện tập: Quán ăn đang đông giờ trưa, vắng chiều. Hướng Ansoff nào đầu tiên?"
    tags: ["câu", "hỏi", "luyện", "tập", "quán", "ăn", "đang", "đông", "giờ", "trưa", "vắng", "chiều"]
    text: |-
      q: Quán ăn đang đông giờ trưa, vắng chiều. Hướng Ansoff nào đầu tiên?
      a: 'Market Penetration: tăng tần suất/giá trị đơn buổi chiều (combo, giảm giá giờ thấp điểm, giao hàng), vì dùng công suất nhàn rỗi, rủi ro thấp.'
  - id: "m04-practice_questions-4"
    title: "Câu hỏi luyện tập: Chủ cửa hàng thời trang muốn mở xưởng sản xuất vải. Đây là gì trong Ansoff và nên làm sao?"
    tags: ["câu", "hỏi", "luyện", "tập", "chủ", "cửa", "hàng", "thời", "trang", "muốn", "mở", "xưởng"]
    text: |-
      q: Chủ cửa hàng thời trang muốn mở xưởng sản xuất vải. Đây là gì trong Ansoff và nên làm sao?
      a: 'Diversification (SP mới + khách mới là nhà may); qua cổng đa dạng hóa: nếu thiếu năng lực và vốn thì không làm hoặc partnership/gia công thử nhỏ.'
  - id: "m04-practice_questions-5"
    title: "Câu hỏi luyện tập: Hấp dẫn ngành: trọng số [0,4; 0,3; 0,3], điểm [4,3,2]. Tính điểm và mức."
    tags: ["câu", "hỏi", "luyện", "tập", "hấp", "dẫn", "ngành", "trọng", "số", "điểm", "tính", "và"]
    text: |-
      q: 'Hấp dẫn ngành: trọng số [0,4; 0,3; 0,3], điểm [4,3,2]. Tính điểm và mức.'
      a: 1,6 + 0,9 + 0,6 = 3,1 -> mức trung bình (2,33-3,67).
  - id: "m04-practice_questions-6"
    title: "Câu hỏi luyện tập: Điểm Hấp dẫn 4,0; Vị thế 2,0. Hành động theo GE?"
    tags: ["câu", "hỏi", "luyện", "tập", "điểm", "hấp", "dẫn", "vị", "thế", "hành", "động", "theo"]
    text: |-
      q: Điểm Hấp dẫn 4,0; Vị thế 2,0. Hành động theo GE?
      a: 'Ngành Cao, vị thế Thấp: chọn lọc đầu tư (nâng vị thế) hoặc rút nếu không thể cải thiện; cần mô hình tài chính.'
  - id: "m04-practice_questions-7"
    title: "Câu hỏi luyện tập: Vì sao BCG dùng thị phần tương đối?"
    tags: ["câu", "hỏi", "luyện", "tập", "vì", "sao", "bcg", "dùng", "thị", "phần", "tương", "đối"]
    text: |-
      q: Vì sao BCG dùng thị phần tương đối?
      a: 'Vì đường kinh nghiệm: số 1 có chi phí đơn vị thấp nhất; so với số 1 mới phản ánh lợi thế chi phí.'
  - id: "m04-practice_questions-8"
    title: "Câu hỏi luyện tập: Tăng trưởng thị trường từ 8.000 lên 11.000 tỷ trong 3 năm là bao nhiêu %/năm?"
    tags: ["câu", "hỏi", "luyện", "tập", "tăng", "trưởng", "thị", "trường", "từ", "000", "lên", "11"]
    text: |-
      q: Tăng trưởng thị trường từ 8.000 lên 11.000 tỷ trong 3 năm là bao nhiêu %/năm?
      a: (11000/8000)^(1/3)-1 = 1,375^(0,3333)-1 ≈ 11,2%/năm.
