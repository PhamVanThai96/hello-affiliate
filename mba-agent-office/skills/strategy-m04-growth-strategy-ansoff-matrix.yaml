  - id: "m04-sme_vn_guidance-1"
    title: "Lưu ý SME Việt Nam: Với SME 1 sản phẩm/1 cửa hàng: dùng Ansoff, bắt đầu bằng Penetration (combo, thẻ thành viên, giờ th…"
    tags: ["lưu", "sme", "việt", "nam", "với", "sản", "phẩm", "cửa", "hàng", "dùng", "ansoff", "bắt"]
    text: |-
      Với SME 1 sản phẩm/1 cửa hàng: dùng Ansoff, bắt đầu bằng Penetration (combo, thẻ thành viên, giờ thấp điểm, giao hàng qua app). BCG/GE chỉ có ý nghĩa khi có >= 3 dòng sản phẩm/chi nhánh.
  - id: "m04-sme_vn_guidance-2"
    title: "Lưu ý SME Việt Nam: Market Development phổ biến ở SME VN: mở thêm quận/tỉnh, bán qua TikTok Shop/Shopee/GrabFood/ZaloSh…"
    tags: ["lưu", "sme", "việt", "nam", "market", "development", "phổ", "biến", "vn", "mở", "thêm", "quận"]
    text: |-
      Market Development phổ biến ở SME VN: mở thêm quận/tỉnh, bán qua TikTok Shop/Shopee/GrabFood/ZaloShop, B2B (văn phòng, trường học, khách sạn), xuất khẩu qua Alibaba/Amazon. Cần tính chi phí sàn (phí cố định + dịch vụ + vận chuyển) vào biên - cần xác nhận biểu phí hiện hành của từng sàn.
  - id: "m04-sme_vn_guidance-3"
    title: "Lưu ý SME Việt Nam: Product Development: bắt đầu bằng sản phẩm bổ sung (combo, topping, đóng gói mang đi) tận dụng bếp/…"
    tags: ["lưu", "sme", "việt", "nam", "product", "development", "bắt", "đầu", "bằng", "sản", "phẩm", "bổ"]
    text: |-
      Product Development: bắt đầu bằng sản phẩm bổ sung (combo, topping, đóng gói mang đi) tận dụng bếp/nhân sự sẵn có trước khi đầu tư dây chuyền mới.
  - id: "m04-sme_vn_guidance-4"
    title: "Lưu ý SME Việt Nam: Đa dạng hóa ở SME dễ nhất khi related (cùng khách, cùng kênh): ví dụ quán ăn -> bán đồ ăn đóng gói,…"
    tags: ["lưu", "sme", "việt", "nam", "đa", "dạng", "hóa", "dễ", "nhất", "khi", "related", "cùng"]
    text: |-
      Đa dạng hóa ở SME dễ nhất khi related (cùng khách, cùng kênh): ví dụ quán ăn -> bán đồ ăn đóng gói, catering. Unrelated (nhà hàng -> BĐS, kinh doanh vàng) là rủi ro lớn khi vốn nhỏ.
  - id: "m04-sme_vn_guidance-5"
    title: "Lưu ý SME Việt Nam: Mở thêm chi nhánh: tính lại NPV/payback từng điểm, lưu ý mặt bằng tăng giá thuê (cần xác nhận hợp đ…"
    tags: ["lưu", "sme", "việt", "nam", "mở", "thêm", "chi", "nhánh", "tính", "lại", "npv", "payback"]
    text: |-
      Mở thêm chi nhánh: tính lại NPV/payback từng điểm, lưu ý mặt bằng tăng giá thuê (cần xác nhận hợp đồng), nhân sự quản lý, và 'ăn lẫn khách' của chính mình (cannibalization).
  - id: "m04-sme_vn_guidance-6"
    title: "Lưu ý SME Việt Nam: Khi vay ngân hàng/gọi vốn: trình bày hướng tăng trưởng theo Ansoff + dòng tiền + NPV; ngân hàng qua…"
    tags: ["lưu", "sme", "việt", "nam", "khi", "vay", "ngân", "hàng", "gọi", "vốn", "trình", "bày"]
    text: |-
      Khi vay ngân hàng/gọi vốn: trình bày hướng tăng trưởng theo Ansoff + dòng tiền + NPV; ngân hàng quan tâm dòng tiền trả nợ hơn ma trận.
  - id: "m04-sme_vn_guidance-7"
    title: "Lưu ý SME Việt Nam: Dữ liệu thị trường VN: Tổng cục Thống kê, báo cáo ngành (Euromonitor, Statista, Nielsen/Kantar, Vie…"
    tags: ["lưu", "sme", "việt", "nam", "dữ", "liệu", "thị", "trường", "vn", "tổng", "cục", "thống"]
    text: |-
      Dữ liệu thị trường VN: Tổng cục Thống kê, báo cáo ngành (Euromonitor, Statista, Nielsen/Kantar, Vietdata), báo cáo của hiệp hội ngành; đánh dấu 'cần xác nhận' khi dùng ước lượng nội bộ.
  - id: "m04-sme_vn_guidance-8"
    title: "Lưu ý SME Việt Nam: Công cụ: Google Sheets/Excel (SUMPRODUCT cho điểm GE), bubble chart; không cần phần mềm riêng."
