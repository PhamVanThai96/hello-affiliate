  - id: "m09-case_lessons-1"
    title: "Bài học case: Disney + Pixar (2006)"
    tags: ["bài", "học", "case", "disney", "pixar", "2006"]
    text: |-
      name: Disney + Pixar (2006)
      type: success
      setup: Disney mua Pixar ~7,4 tỷ USD toàn bằng cổ phiếu khi Disney Animation sa sút, hợp đồng phân phối sắp hết. CEO Iger, Steve Jobs vào board; Pixar giữ độc lập, Catmull và Lasseter điều hành cả Disney Animation. Premium thấp.
      key_calculations:
      - 'Value created = Synergies - Premium: premium nhỏ nên chỉ cần synergies dương là có lời.'
      - 'ROI chỉ báo giả định giá trị 50 tỷ USD: (50-7,4)/7,4 = 576%; kể cả giá trị chỉ 1/5 (~10 tỷ) vẫn dương.'
      - Doanh thu phòng vé (Pixar >10 tỷ USD, Disney Animation hồi sinh >8 tỷ USD) không phải giá trị tạo ra.
      lesson: 'Doanh nghiệp sáng tạo: mua và giữ độc lập có kiểm soát, giữ nhân tài, đưa người của target dẫn dắt, luận điểm chiến lược rõ, giá hợp lý so với giá trị chiến lược. Revenue synergy có logic cụ thể (phân phối + sáng tạo) khác với ''bán chéo'' chung chung.'
      data_reliability: illustrative
  - id: "m09-case_lessons-2"
    title: "Bài học case: AOL + Time Warner (2000)"
    tags: ["bài", "học", "case", "aol", "time", "warner", "2000"]
    text: |-
      name: AOL + Time Warner (2000)
      type: failure
      setup: AOL (vốn hóa ~163 tỷ USD, đỉnh dot-com) mua Time Warner (~83 tỷ USD) ~182 tỷ USD bằng cổ phiếu, premium ~71%, 'merger of equals'.
      key_calculations:
      - Premium trả = 83 x 0,71 = ~59 tỷ USD; cần NPV synergies >59 tỷ mới tạo giá trị.
      - 'Vốn hóa kết hợp ~280 -> ~72 tỷ USD: bốc hơi ~208 tỷ.'
      - Write-down goodwill ~99 tỷ USD (2002).
      lesson: Stock deal ở đỉnh thị trường nguy hiểm; synergy phải cụ thể bằng tiền; văn hóa; kế hoạch tích hợp trước khi ký; không mua sửa mô hình hỏng (dial-up); hubris; merger of equals là nói dối.
      data_reliability: unverified
