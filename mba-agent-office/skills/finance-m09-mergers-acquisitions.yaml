      - m09_nopat: NOPAT
      - m09_fcf: Dòng tiền tự do
      - m09_gordon_dcf: DCF tăng trưởng đều (Gordon)
      - m09_premium: Premium mua lại
      - m09_synergy_value: Giá trị synergies
      - m09_value_created: Giá trị tạo ra cho bên mua
      - m09_walk_away: Giá tối đa chấp nhận được
      - m09_cost_synergy_pv: PV cost synergies (5 năm + vĩnh viễn)
      - m09_revenue_synergy_pv: PV revenue synergies điều chỉnh xác suất
      - m09_npv_syn_net: NPV synergies ròng
      - m09_breakeven_realization: Tỷ lệ thực hiện cost synergies hòa vốn
      - m09_new_shares: Số cổ phần phát hành mới
      - m09_after_tax_financing: Chi phí tài trợ sau thuế
      - m09_eps_pro_forma: EPS pro forma
      - m09_quick_test: Quick Test accretion
      - m09_goodwill: Lợi thế thương mại
      - m09_lbo_returns: LBO: MoM và IRR
      - m09_lbo_attribution: Phân rã giá trị LBO
      - m09_leverage_cover: Nợ/EBITDA và hệ số bảo vệ lãi vay
      - m09_roi_indicator: ROI chỉ báo thương vụ

      Kho tra cứu của module: Khái niệm 23, Công thức 23, Quy trình 5, Quy tắc quyết định 16, Chuẩn so sánh 18, Lỗi thường gặp 14, Lưu ý SME Việt Nam 11, Bài học case 3, Ví dụ có lời giải 9, Câu hỏi luyện tập 7, Checklist 9, Mẫu Excel/Sheets 2. Tra bằng skill_search với từ khoá chủ đề (vd "ví dụ NPV", "lỗi thường gặp WACC").
  - id: "m09-concepts-1"
    title: "Khái niệm: Sáp nhập"
    tags: ["khái", "niệm", "sáp", "nhập"]
    text: |-
      term_vi: Sáp nhập
      term_en: Merger
      definition: Hai công ty hợp nhất thành một thực thể mới (A + B = C); cả hai pháp nhân cũ chấm dứt.
      why_it_matters: Thực tế hầu hết 'merger of equals' vẫn là acquisition được rebrand; luôn có một bên nắm quyền, giả vờ ngược lại gây hỗn loạn (AOL-Time Warner).
  - id: "m09-concepts-2"
    title: "Khái niệm: Mua lại"
    tags: ["khái", "niệm", "mua", "lại"]
    text: |-
      term_vi: Mua lại
      term_en: Acquisition
      definition: Công ty A mua và kiểm soát công ty B; B có thể tồn tại như công ty con.
      why_it_matters: Là dạng phổ biến nhất; mọi phân tích định giá/premium áp dụng cho bên mua.
  - id: "m09-concepts-3"
    title: "Khái niệm: Phân loại M&A"
    tags: ["khái", "niệm", "phân", "loại"]
    text: |-
      term_vi: Phân loại M&A
      term_en: Types of M&A
      definition: |
        Theo quan hệ kinh doanh: Horizontal (cùng ngành, vd Facebook-Instagram), Vertical (khác khâu chuỗi giá trị, vd Amazon-Whole Foods), Conglomerate (khác ngành). Theo thái độ: Friendly vs Hostile (tender offer, proxy fight). Theo thanh toán: Stock, Cash, Mixed, LBO. Theo đối tượng: Share deal (kế thừa mọi nghĩa vụ ẩn) vs Asset deal (chọn lọc tài sản, tránh nợ ẩn nhưng thủ tục chuyển nhượng phức tạp).
      why_it_matters: Loại thương vụ quyết định nguồn synergies, rủi ro pháp lý (chống độc quyền với horizontal) và rủi ro thừa kế nợ ẩn.
  - id: "m09-concepts-4"
    title: "Khái niệm: Động lực M&A"
    tags: ["khái", "niệm", "động", "lực"]
    text: |-
      term_vi: Động lực M&A
      term_en: M&A motives
      definition: |
        Synergies, tăng trưởng nhanh, sức mạnh thị trường, đa dạng hóa, công nghệ/IP, nhân tài (acqui-hire), lợi ích thuế (NOL), xây đế chế (empire building), mua target bị định giá thấp.
      why_it_matters: |
        Chỉ synergies, công nghệ và mua rẻ có thể tạo giá trị thật. Đa dạng hóa (cổ đông tự đa dạng hóa rẻ hơn) và empire building chủ yếu phục vụ ban lãnh đạo và thường phá hủy giá trị.
  - id: "m09-concepts-5"
    title: "Khái niệm: Làn sóng M&A"
    tags: ["khái", "niệm", "làn", "sóng"]
    text: |-
      term_vi: Làn sóng M&A
      term_en: Merger waves
      definition: |
        1890s-1904 sáp nhập ngang/độc quyền (Sherman 1890, Clayton 1914); 1916-1929 sáp nhập dọc; 1960s conglomerate; 1980s hostile, LBO, junk bond (RJR Nabisco 1988 ~25 tỷ USD, KKR); 1990s-2000 xuyên biên giới/công nghệ (kết thúc bằng dot-com); 2003-nay private equity, thương vụ công nghệ/AI.
      why_it_matters: Làn sóng đi cùng thị trường chứng khoán nóng và tín dụng rẻ; khi cổ phiếu đắt người ta dùng cổ phiếu để mua, bong bóng vỡ thì lộ ra trả quá cao.
  - id: "m09-concepts-6"
    title: "Khái niệm: Giả thuyết kiêu ngạo và lời nguyền người thắng thầu"
    tags: ["khái", "niệm", "giả", "thuyết", "kiêu", "ngạo", "và", "lời", "nguyền", "người", "thắng", "thầu"]
    text: |-
      term_vi: Giả thuyết kiêu ngạo và lời nguyền người thắng thầu
      term_en: Hubris hypothesis and winner's curse
      definition: 'Roll (1986): nhà quản lý tin mình định giá chính xác hơn thị trường nên trả quá cao. Winner''s curse (Capen, Clapp, Campbell 1971, đấu giá dầu khí): bên thắng thường là bên ước lượng lạc quan nhất.'
      why_it_matters: Giải thích vì sao phải chốt walk-away price trước đàm phán và rời đi khi giá vượt.
  - id: "m09-concepts-7"
    title: "Khái niệm: Tỷ lệ thành công M&A"
    tags: ["khái", "niệm", "tỷ", "lệ", "thành", "công"]
    text: |-
      term_vi: Tỷ lệ thành công M&A
      term_en: M&A success statistics
      definition: |
        Số liệu tổng hợp thường dẫn (thay đổi theo mẫu): ~60-70% thương vụ không tạo giá trị cho cổ đông acquirer; giá acquirer giảm nhẹ 1-3% khi công bố; premium trung bình 20-30%+; synergies thực hiện chỉ ~50-70% dự kiến; tích hợp kéo dài gấp 2-3 lần kế hoạch.
      why_it_matters: Giá trị thường chảy về phía target; bên mua chỉ lời nếu synergies > premium. Dùng làm lý do thận trọng, không phải để bỏ M&A.
  - id: "m09-concepts-8"
    title: "Khái niệm: Giá trị doanh nghiệp"
    tags: ["khái", "niệm", "giá", "trị", "doanh", "nghiệp"]
    text: |-
      term_vi: Giá trị doanh nghiệp
      term_en: Enterprise Value (EV)
      definition: Giá thật sự để sở hữu toàn bộ hoạt động kinh doanh = vốn hóa + nợ vay - tiền mặt.
      why_it_matters: 'Khi mua cả công ty ta gánh nợ và được hưởng tiền mặt, nên EV không phụ thuộc cách tài trợ, so sánh được giữa công ty có cơ cấu vốn khác nhau. Bước hay quên: từ EV phải trừ nợ ròng để ra giá trị vốn chủ.'
  - id: "m09-concepts-9"
    title: "Khái niệm: Các phương pháp định giá M&A"
    tags: ["khái", "niệm", "các", "phương", "pháp", "định", "giá"]
    text: |-
      term_vi: Các phương pháp định giá M&A
      term_en: DCF, Comparable Companies, Precedent Transactions
      definition: |
        DCF (nội tại: PV của FCF, nhạy với g và WACC); Comps (bội số công ty cùng ngành đang niêm yết, phản ánh tâm lý thị trường hiện tại); Precedent (bội số thương vụ M&A đã xảy ra, đã gồm control premium nên thường cao hơn Comps).
      why_it_matters: Mỗi phương pháp trả lời một câu hỏi khác và mắc sai số khác; kết hợp thành một khoảng giá (Football Field) để không dựa vào một giả định duy nhất.
  - id: "m09-concepts-10"
    title: "Khái niệm: Football Field"
    tags: ["khái", "niệm", "football", "field"]
    text: |-
      term_vi: Football Field
      term_en: Football Field chart
      definition: 'Biểu đồ thanh ngang chồng nhau biểu diễn khoảng giá (low-mid-high) của từng phương pháp: 52-week trading, DCF, Comps, Precedent.'
      why_it_matters: Vùng chồng lấn của nhiều phương pháp là vùng giá an toàn nhất; offer range nằm giữa giá trị nội tại và premium thị trường chấp nhận.
  - id: "m09-concepts-11"
    title: "Khái niệm: Phần bù kiểm soát"
    tags: ["khái", "niệm", "phần", "bù", "kiểm", "soát"]
    text: |-
      term_vi: Phần bù kiểm soát
      term_en: Control premium
      definition: Phần giá cao hơn giá cổ phiếu chưa bị ảnh hưởng (unaffected price, trước tin đồn thâu tóm), điển hình 20-50%.
      why_it_matters: Giá sàn là giá cổ đông thiểu số; người mua có quyền thay ban lãnh đạo, cắt chi phí, đổi chiến lược - phải chia một phần giá trị đó cho cổ đông cũ để họ bán.
  - id: "m09-concepts-12"
    title: "Khái niệm: Hiệp lực"
    tags: ["khái", "niệm", "hiệp", "lực"]
    text: |-
      term_vi: Hiệp lực
      term_en: Synergies
      definition: V_combined - (V_A + V_B). Gồm cost, revenue, financial, operational synergies.
      why_it_matters: Là lý do duy nhất hợp lý để trả cao hơn giá thị trường. Phải đủ lớn để bù premium.
  - id: "m09-concepts-13"
    title: "Khái niệm: Chi phí tích hợp"
    tags: ["khái", "niệm", "chi", "phí", "tích", "hợp"]
    text: |-
      term_vi: Chi phí tích hợp
      term_en: Integration cost
      definition: 'Chi phí một lần: sa thải, di dời, hợp nhất hệ thống, đổi bao bì; thường 1-1,5 lần cost synergies hàng năm.'
      why_it_matters: Hay bị quên khiến NPV synergies bị thổi phồng; luôn trừ ở t=0.
  - id: "m09-concepts-14"
    title: "Khái niệm: Giá tối đa"
    tags: ["khái", "niệm", "giá", "tối", "đa"]
    text: |-
      term_vi: Giá tối đa
      term_en: Walk-away price
      definition: Giá cao nhất bên mua có thể trả mà không phá hủy giá trị = stand-alone + NPV synergies (đã trừ chi phí tích hợp).
      why_it_matters: Chốt trước khi đàm phán để không bị cuốn vào đấu giá (winner's curse).
  - id: "m09-concepts-15"
    title: "Khái niệm: Earn-out"
    tags: ["khái", "niệm", "earn", "out"]
    text: |-
      term_vi: Earn-out
      term_en: Earn-out
      definition: Phần giá trả sau, gắn với kết quả (giữ khách hàng, giữ nhân sự then chốt, đạt doanh thu/EBITDA).
      why_it_matters: Chuyển một phần rủi ro synergies/key-man sang người bán; giữ giá cơ sở thấp hơn walk-away có biên an toàn.
  - id: "m09-concepts-16"
    title: "Khái niệm: Trả tiền mặt vs cổ phiếu"
    tags: ["khái", "niệm", "trả", "tiền", "mặt", "vs", "cổ", "phiếu"]
    text: |-
      term_vi: Trả tiền mặt vs cổ phiếu
      term_en: Cash vs Stock deal
      definition: |
        Cash: bên bán chịu thuế ngay, acquirer gánh toàn bộ rủi ro, không pha loãng, tín hiệu tự tin (cổ phiếu mình đang rẻ). Stock: có thể hoãn thuế cho bên bán, chia sẻ rủi ro, pha loãng EPS, tín hiệu cổ phiếu mình đắt, không cần tiền.
      why_it_matters: 'Hệ quả của thông tin bất cân xứng (Pecking Order, Myers & Majluf): phát hành cổ phiếu để mua bị thị trường hiểu là cổ phiếu đang đắt nên giá thường giảm; cổ phiếu hợp khi synergies chưa chắc chắn vì chia sẻ rủi ro tích hợp.'
  - id: "m09-concepts-17"
    title: "Khái niệm: Mua lại bằng đòn bẩy"
    tags: ["khái", "niệm", "mua", "lại", "bằng", "đòn", "bẩy"]
    text: |-
      term_vi: Mua lại bằng đòn bẩy
      term_en: Leveraged Buyout (LBO)
      definition: |
        Dùng nợ (Senior Debt, Mezzanine) cộng ít vốn chủ quỹ PE để mua target, dùng dòng tiền/tài sản target trả nợ, thoái vốn sau 3-7 năm. Khởi nguồn thập niên 1960-70 (bootstrap acquisition), bùng nổ 1980s với KKR (thành lập 1976).
      why_it_matters: 'Giải quyết việc quỹ thiếu vốn tự có: mỗi đồng vốn chủ kiểm soát nhiều tài sản hơn, khuếch đại IRR; nhưng cũng khuếch đại lỗ (EBITDA -30% với đòn bẩy 70% có thể xóa vốn chủ).'
  - id: "m09-concepts-18"
    title: "Khái niệm: Tăng/Pha loãng EPS"
    tags: ["khái", "niệm", "tăng", "pha", "loãng", "eps"]
    text: |-
      term_vi: Tăng/Pha loãng EPS
      term_en: Accretion/Dilution
      definition: Accretive nếu EPS_pro forma > EPS stand-alone; dilutive nếu thấp hơn.
      why_it_matters: 'Thị trường và ban lãnh đạo ám ảnh EPS. Nhưng accretion không đồng nghĩa tạo giá trị: có thể chỉ do nợ rẻ hoặc P/E acquirer cao; luôn đối chiếu bằng NPV (synergies - premium).'
  - id: "m09-concepts-19"
    title: "Khái niệm: Lợi thế thương mại"
    tags: ["khái", "niệm", "lợi", "thế", "thương", "mại"]
    text: |-
      term_vi: Lợi thế thương mại
      term_en: Goodwill
      definition: Giá mua - giá trị hợp lý (FV) tài sản ròng xác định được. Không khấu hao theo IFRS/US GAAP (chỉ kiểm tra impairment hàng năm); theo VAS thường phân bổ dần (cần xác nhận quy định hiện hành).
      why_it_matters: Dấu vết kế toán của premium; tỷ trọng goodwill/giá mua cao nghĩa là phụ thuộc synergies, rủi ro ghi giảm lớn (AOL Time Warner write-down ~99 tỷ USD).
  - id: "m09-concepts-20"
    title: "Khái niệm: Quy trình M&A và thẩm định"
    tags: ["khái", "niệm", "quy", "trình", "và", "thẩm", "định"]
    text: |-
      term_vi: Quy trình M&A và thẩm định
      term_en: M&A process and Due Diligence
      definition: |
        Sell-side 6 giai đoạn: Chuẩn bị (4-6 tuần: advisor, Information Memo, 50-100 người mua, data room) -> Tiếp thị (4-6 tuần: teaser, NDA, IM, IOI, shortlist 5-10) -> Thẩm định (4-8 tuần: binding bids) -> Đàm phán và ký SPA (2-4 tuần, fairness opinion) -> Closing (4-12 tuần: chống độc quyền, cổ đông) -> Tích hợp PMI (6-24 tháng). Due diligence: Financial, Legal, Commercial, Operational, Tax, HR, IT, Environmental.
      why_it_matters: Người bán biết nhiều hơn người mua (bất cân xứng); DD thu hẹp khoảng cách, tìm 'quả mìn' (nợ ẩn, kiện tụng, khách rời bỏ) để chỉnh giá hoặc bỏ. Thành bại do giai đoạn tích hợp.
  - id: "m09-concepts-21"
    title: "Khái niệm: Chiến thuật phòng thủ"
    tags: ["khái", "niệm", "chiến", "thuật", "phòng", "thủ"]
    text: |-
      term_vi: Chiến thuật phòng thủ
      term_en: Defensive tactics
      definition: |
        Poison Pill (cổ đông hiện hữu mua giá chiết khấu 50% nếu kẻ thâu tóm nắm >15%), Staggered Board (mỗi năm bầu lại 1/3), White Knight, Crown Jewel Defense, Pac-Man Defense, Golden Parachute, Shark Repellent (siêu đa số 80%+).
      why_it_matters: Tăng chi phí/kéo dài thời gian để board tìm giá tốt hơn, nhưng cũng có thể bị lạm dụng bảo vệ ghế lãnh đạo (xung đột đại diện).
  - id: "m09-concepts-22"
    title: "Khái niệm: Chất lượng lợi nhuận"
    tags: ["khái", "niệm", "chất", "lượng", "lợi", "nhuận"]
    text: |-
      term_vi: Chất lượng lợi nhuận
      term_en: Quality of Earnings (QoE)
      definition: 'Điều chỉnh EBITDA SME: chi phí cá nhân chủ qua công ty, lương quản lý dưới thị trường, doanh thu chưa xuất hóa đơn, công nợ khó đòi.'
      why_it_matters: Với SME VN, QoE quan trọng hơn mô hình định giá vì báo cáo thường chưa chuẩn, có thể hai sổ; EBITDA trên giấy sai thì mọi bội số sai.
  - id: "m09-concepts-23"
    title: "Khái niệm: Rủi ro người then chốt và chiết khấu thanh khoản"
    tags: ["khái", "niệm", "rủi", "ro", "người", "then", "chốt", "và", "chiết", "khấu", "thanh", "khoản"]
    text: |-
      term_vi: Rủi ro người then chốt và chiết khấu thanh khoản
      term_en: Key man risk, discount for lack of marketability (DLOM)
      definition: SME phụ thuộc chủ sở hữu (chủ đi khách đi), tập trung 1-3 khách lớn; chiết khấu thiếu thanh khoản 20-30%.
      why_it_matters: Giải thích bội số SME thấp (3-6x vs 8-12x niêm yết) và nhu cầu earn-out, giữ chân nhân sự.
  - id: "m09-formulas-1"
    title: "Công thức: m09_ev — Giá trị doanh nghiệp"
    tags: ["công", "thức", "m09_ev", "giá", "trị", "doanh", "nghiệp"]
    text: |-
      id: m09_ev
      name_vi: Giá trị doanh nghiệp
      name_en: Enterprise Value
      expression_latex: EV = \text{Vốn hóa} + \text{Nợ vay} - \text{Tiền mặt}
      expression_python: ev = market_cap + debt - cash
      excel: =B1+B2-B3
      variables:
      - symbol: market_cap
        meaning: Vốn hóa thị trường (hoặc giá trị vốn chủ)
        unit: tiền tệ
      - symbol: debt
        meaning: Nợ vay
        unit: tiền tệ
      - symbol: cash
        meaning: Tiền mặt và tương đương
        unit: tiền tệ
      when_to_use: Khi cần giá thực để sở hữu toàn bộ hoạt động; so sánh công ty khác cơ cấu vốn.
      why_it_works: Mua cả công ty = trả cho cổ đông + gánh nợ - nhận tiền mặt; loại bỏ ảnh hưởng cách tài trợ.
      assumptions:
      - Nợ và tiền mặt theo giá trị thị trường/sổ sách hợp lý
      - Bỏ qua cổ phiếu ưu đãi, lợi ích cổ đông thiểu số, nợ ngoài bảng nếu không nêu
      pitfalls:
      - Quên nợ ngoài bảng/thuê tài chính
      - Dùng giá cổ phiếu thay EV khi so bội số
      interpretation: EV là mẫu số/đối tượng của bội số EV/EBITDA.
      example:
        inputs:
          market_cap: 18500
          debt: 2000
          cash: 500
        steps:
        - EV = 18.500 + 2.000 - 500 = 20.000
        result: EV = 20.000 triệu
  - id: "m09-formulas-2"
    title: "Công thức: m09_equity_from_ev — Giá trị vốn chủ từ EV"
    tags: ["công", "thức", "m09_equity_from_ev", "giá", "trị", "vốn", "chủ", "từ", "ev"]
    text: |-
      id: m09_equity_from_ev
      name_vi: Giá trị vốn chủ từ EV
      name_en: Equity Value from EV
      expression_latex: Equity = EV - (\text{Nợ vay} - \text{Tiền mặt})
      expression_python: equity = ev - (debt - cash)
      excel: =EV-(Nợ-Tiền)
      variables:
      - symbol: ev
        meaning: Enterprise Value
        unit: tiền tệ
      - symbol: debt
        meaning: Nợ vay
        unit: tiền tệ
      - symbol: cash
        meaning: Tiền mặt
        unit: tiền tệ
      when_to_use: Sau khi ra EV từ bội số hoặc DCF, để biết giá trả cho chủ sở hữu.
      why_it_works: Giá trị hoạt động thuộc về cả chủ nợ và cổ đông; trừ nợ ròng còn phần của cổ đông.
      assumptions:
      - Giá mua là mua 100% vốn chủ
      pitfalls:
      - 'Bước hay bị quên: so EV với giá chủ đòi (giá vốn chủ) làm sai lệch cả nợ ròng'
      interpretation: So sánh với giá chào của người bán (là giá vốn chủ).
      example:
        inputs:
          ev: 20800
          debt: 2000
          cash: 500
        steps:
        - Nợ ròng = 2.000 - 500 = 1.500
        - Equity = 20.800 - 1.500 = 19.300
        result: Equity = 19.300 triệu
  - id: "m09-formulas-3"
    title: "Công thức: m09_ev_ebitda — Bội số EV/EBITDA và EV ngầm định"
    tags: ["công", "thức", "m09_ev_ebitda", "bội", "số", "ev", "ebitda", "và", "ngầm", "định"]
    text: |-
      id: m09_ev_ebitda
      name_vi: Bội số EV/EBITDA và EV ngầm định
      name_en: EV/EBITDA multiple
      expression_latex: EV/EBITDA = \frac{EV}{EBITDA}\;;\quad EV = \text{multiple}\times EBITDA
      expression_python: multiple = ev / ebitda; ev_implied = multiple * ebitda
      excel: =EV/EBITDA
      variables:
      - symbol: ev
        meaning: Enterprise Value
        unit: tiền tệ
      - symbol: ebitda
        meaning: Lợi nhuận trước lãi, thuế, khấu hao
        unit: tiền tệ
      - symbol: multiple
        meaning: Bội số EV/EBITDA
        unit: lần
      when_to_use: Định giá nhanh bằng Comps/Precedent; so sánh giữa các công ty.
      why_it_works: EBITDA loại ảnh hưởng của lãi vay, thuế, khấu hao (khác nhau theo công ty) nên ngang tầm được. Với ngành nặng tài sản cần kiểm tra EV/EBIT hoặc FCF vì EBITDA bỏ qua capex.
      assumptions:
      - Công ty so sánh thật sự tương đương ngành, quy mô, tăng trưởng
      - EBITDA đã điều chỉnh (QoE)
      pitfalls:
      - Dùng bội số công ty niêm yết 8-12x cho SME (nên 3-6x)
      - EBITDA SME chưa điều chỉnh
      - Bỏ qua capex
      interpretation: Niêm yết điển hình 8-12x; SME VN 3-6x (chiết khấu thanh khoản/quy mô). Precedent thường cao hơn Comps vì có control premium.
      example:
        inputs:
          ev: 20000
          ebitda: 4000
          multiple: 5.0
          debt: 2000
          cash: 500
        steps:
        - EV = 5 x 4.000 = 20.000
        - Nợ ròng = 1.500
        - Equity = 18.500
        - 'Precedent 5,5x: EV = 22.000, Equity = 20.500'
        result: 'Comps: equity 18.500; Precedent: equity 20.500'
  - id: "m09-formulas-4"
    title: "Công thức: m09_nopat — NOPAT"
    tags: ["công", "thức", "m09_nopat", "nopat"]
    text: |-
      id: m09_nopat
      name_vi: NOPAT
      name_en: Net Operating Profit After Tax
      expression_latex: NOPAT = EBIT\,(1-t)
      expression_python: nopat = ebit * (1 - t)
      excel: =EBIT*(1-t)
      variables:
      - symbol: ebit
        meaning: Lợi nhuận hoạt động
        unit: tiền tệ
      - symbol: t
        meaning: Thuế suất TNDN
        unit: tỷ lệ
      when_to_use: Bước đầu tính FCF để định giá DCF.
      why_it_works: Lợi nhuận hoạt động sau thuế như thể công ty không vay, tách khỏi quyết định tài trợ.
      assumptions:
      - Thuế suất ổn định (VN TNDN phổ thông 20%, cần xác nhận)
      pitfalls:
      - Dùng lợi nhuận sau lãi vay rồi lại trừ nợ ròng
      interpretation: Lợi nhuận tạo ra bởi hoạt động cốt lõi.
      example:
        inputs:
          ebit: 3400
          t: 0.2
        steps:
        - NOPAT = 3.400 x 0,8 = 2.720
        result: 2.720 triệu
  - id: "m09-formulas-5"
    title: "Công thức: m09_fcf — Dòng tiền tự do"
    tags: ["công", "thức", "m09_fcf", "dòng", "tiền", "tự", "do"]
    text: |-
      id: m09_fcf
      name_vi: Dòng tiền tự do
      name_en: Free Cash Flow (FCFF)
      expression_latex: FCF = NOPAT + \text{Khấu hao} - Capex - \Delta NWC
      expression_python: fcf = nopat + dep - capex - d_nwc
      excel: =NOPAT+Dep-Capex-dNWC
      variables:
      - symbol: nopat
        meaning: NOPAT
        unit: tiền tệ
      - symbol: dep
        meaning: Khấu hao
        unit: tiền tệ
      - symbol: capex
        meaning: Chi đầu tư TSCĐ
        unit: tiền tệ
      - symbol: d_nwc
        meaning: Tăng vốn lưu động
        unit: tiền tệ
      when_to_use: Đầu vào DCF/Gordon.
      why_it_works: Tiền thật còn lại sau khi duy trì và tăng trưởng hoạt động; cộng lại khấu hao vì không phải chi tiền.
      assumptions:
      - Capex và NWC đại diện cho trạng thái ổn định
      pitfalls:
      - Bỏ capex
      - Capex thấp hơn khấu hao kéo dài
      interpretation: Dòng tiền thuộc cả chủ nợ và cổ đông.
      example:
        inputs:
          nopat: 2720
          dep: 600
          capex: 500
          d_nwc: 20
        steps:
        - FCF = 2.720 + 600 - 500 - 20 = 2.800
        result: 2.800 triệu
  - id: "m09-formulas-6"
    title: "Công thức: m09_gordon_dcf — DCF tăng trưởng đều (Gordon)"
    tags: ["công", "thức", "m09_gordon_dcf", "dcf", "tăng", "trưởng", "đều", "gordon"]
    text: |-
      id: m09_gordon_dcf
      name_vi: DCF tăng trưởng đều (Gordon)
      name_en: Gordon Growth DCF
      expression_latex: EV = \frac{FCF\,(1+g)}{WACC - g}
      expression_python: ev = fcf * (1 + g) / (wacc - g)
      excel: =FCF*(1+g)/(WACC-g)
      variables:
      - symbol: fcf
        meaning: FCF năm hiện tại
        unit: tiền tệ
      - symbol: g
        meaning: Tăng trưởng vĩnh viễn
        unit: tỷ lệ
      - symbol: wacc
        meaning: Chi phí vốn bình quân
        unit: tỷ lệ
      when_to_use: Giá trị nội tại của target ổn định.
      why_it_works: Tổng chuỗi dòng tiền tăng đều vĩnh viễn hội tụ về FCF1/(WACC-g).
      assumptions:
      - g < WACC và g bền vững
      - 'WACC của SME cao hơn doanh nghiệp lớn (rủi ro, thiếu thanh khoản): 18% trong case'
      pitfalls:
      - Cực nhạy với g và WACC
      - g xấp xỉ WACC cho ra giá trị vô lý
      interpretation: Kẹp với Comps và Precedent trong Football Field.
      example:
        inputs:
          fcf: 2800
          g: 0.04
          wacc: 0.18
        steps:
        - EV = 2.800 x 1,04 / (0,18 - 0,04) = 2.912 / 0,14 = 20.800
        - Equity = 20.800 - 1.500 = 19.300
        result: EV = 20.800 triệu
  - id: "m09-formulas-7"
    title: "Công thức: m09_premium — Premium mua lại"
    tags: ["công", "thức", "m09_premium", "premium", "mua", "lại"]
    text: |-
      id: m09_premium
      name_vi: Premium mua lại
      name_en: Acquisition Premium
      expression_latex: Premium\% = \frac{P_{offer} - P_{market}}{P_{market}}\;;\quad Premium_{abs} = P_{offer} - P_{market}
      expression_python: premium_abs = offer - market; premium_pct = premium_abs / market
      excel: =(Chào-ThịTrường)/ThịTrường
      variables:
      - symbol: offer
        meaning: Giá chào mua
        unit: tiền tệ
      - symbol: market
        meaning: Giá thị trường chưa bị ảnh hưởng (hoặc giá stand-alone)
        unit: tiền tệ
      when_to_use: Đo phần thưởng trả cho cổ đông target; đầu vào Value created.
      why_it_works: Premium là phần giá trị chuyển cho người bán; bên mua chỉ lời nếu synergies lớn hơn.
      assumptions:
      - Cơ sở so sánh thống nhất (unaffected price)
      pitfalls:
      - Đo premium trên giá đã gồm tin đồn
      - Premium so với DCF khác so với Comps - nêu rõ cơ sở
      interpretation: Điển hình 20-50% công ty niêm yết; SME thường thấp hơn.
      example:
        inputs:
          offer: 20500
          market: 19300
        steps:
        - Premium = 1.200
        - '% = 1.200/19.300 = 6,2% so với DCF'
        result: Premium = 1.200 triệu (6,2%)
  - id: "m09-formulas-8"
    title: "Công thức: m09_synergy_value — Giá trị synergies"
    tags: ["công", "thức", "m09_synergy_value", "giá", "trị", "synergies"]
    text: |-
      id: m09_synergy_value
      name_vi: Giá trị synergies
      name_en: Value of Synergies
      expression_latex: V_{syn} = V_{AB} - (V_A + V_B)
      expression_python: v_syn = v_ab - (v_a + v_b)
      excel: =VAB-(VA+VB)
      variables:
      - symbol: v_ab
        meaning: Giá trị kết hợp
        unit: tiền tệ
      - symbol: v_a
        meaning: Giá trị A stand-alone
        unit: tiền tệ
      - symbol: v_b
        meaning: Giá trị B stand-alone
        unit: tiền tệ
      when_to_use: Định nghĩa khái niệm; trong thực tế tính bằng PV từng dòng synergy.
      why_it_works: Lý do duy nhất để trả cao hơn thị trường là tổng kết hợp lớn hơn tổng riêng lẻ.
      assumptions:
      - V_A, V_B định giá nhất quán
      pitfalls:
      - Đếm synergies chưa chiết khấu rủi ro
      - Quên chi phí tích hợp
      interpretation: Dương và đủ lớn so với premium thì mới nên mua.
      example:
        inputs:
          v_ab: 240
          v_a: 100
          v_b: 120
        steps:
        - V_syn = 240 - 220 = 20
        result: 20 (đơn vị bất kỳ)
  - id: "m09-formulas-9"
    title: "Công thức: m09_value_created — Giá trị tạo ra cho bên mua"
    tags: ["công", "thức", "m09_value_created", "giá", "trị", "tạo", "ra", "cho", "bên", "mua"]
    text: |-
      id: m09_value_created
      name_vi: Giá trị tạo ra cho bên mua
      name_en: Value created for acquirer
      expression_latex: Value\;created = NPV_{syn} - Premium\;paid
      expression_python: value_created = npv_syn - premium
      excel: =NPV_syn-Premium
      variables:
      - symbol: npv_syn
        meaning: NPV synergies (đã trừ chi phí tích hợp nếu có)
        unit: tiền tệ
      - symbol: premium
        meaning: Premium tuyệt đối
        unit: tiền tệ
      when_to_use: Kiểm tra quyết định mua/không mua; điều kiện sống còn.
      why_it_works: Acquirer trả premium cho target và nhận synergies; chênh lệch là lãi/lỗ cho cổ đông acquirer.
      assumptions:
      - Giá thị trường/stand-alone của target phản ánh đúng giá trị riêng
      pitfalls:
      - Chỉ nhìn EPS thay vì dòng này
      - Synergies tính theo 100% xác suất
      interpretation: 'Synergies > Premium: tạo giá trị; < Premium: phá hủy giá trị.'
      example:
        inputs:
          npv_syn: 5000
          premium: 3000
        steps:
        - Target 10 tỷ USD, premium 30% = 3 tỷ
        - 'Value created = 5 - 3 = 2 tỷ (Nếu synergies = 2 tỷ: -1 tỷ)'
        result: +2.000 triệu USD
  - id: "m09-formulas-10"
    title: "Công thức: m09_walk_away — Giá tối đa chấp nhận được"
    tags: ["công", "thức", "m09_walk_away", "giá", "tối", "đa", "chấp", "nhận", "được"]
    text: |-
      id: m09_walk_away
      name_vi: Giá tối đa chấp nhận được
      name_en: Walk-away price
      expression_latex: P_{max} = V_{standalone} + NPV(Synergies) - \text{Chi phí tích hợp}
      expression_python: p_max = v_standalone + pv_syn_risk_adj - integration_cost
      excel: =Standalone+NPV_syn-ChiPhiTichHop
      variables:
      - symbol: v_standalone
        meaning: Giá trị vốn chủ stand-alone
        unit: tiền tệ
      - symbol: pv_syn_risk_adj
        meaning: PV synergies sau thuế, revenue đã chiết khấu xác suất
        unit: tiền tệ
      - symbol: integration_cost
        meaning: Chi phí tích hợp một lần
        unit: tiền tệ
      when_to_use: Chốt trước đàm phán; so với giá người bán đòi.
      why_it_works: Trả đúng bằng mức này thì toàn bộ synergies chảy sang người bán, bên mua hòa vốn (value created = 0); trả thêm là phá hủy giá trị.
      assumptions:
      - Synergies đã chiết khấu rủi ro
      - Chi phí tích hợp tính ở t=0
      pitfalls:
      - Dùng walk-away có cả revenue synergy làm giá mục tiêu (không có biên an toàn)
      - Quên stress test
      interpretation: 'Nếu giá đòi > Pmax: từ chối hoặc cấu trúc giá cơ sở thấp + earn-out. Giá mục tiêu nên thấp hơn nhiều walk-away.'
      example:
        inputs:
          v_standalone: 200
          pv_syn_risk_adj: 55
          integration_cost: 25
        steps:
        - PV synergies = 40 + 30 x 50% = 55
        - Pmax = 200 + 55 - 25 = 230
        result: 230 tỷ; chủ đòi 240 tỷ vượt 10 tỷ
  - id: "m09-formulas-11"
    title: "Công thức: m09_cost_synergy_pv — PV cost synergies (5 năm + vĩnh viễn)"
    tags: ["công", "thức", "m09_cost_synergy_pv", "pv", "cost", "synergies", "năm", "vĩnh", "viễn"]
    text: |-
      id: m09_cost_synergy_pv
      name_vi: PV cost synergies (5 năm + vĩnh viễn)
      name_en: PV of cost synergies with terminal value
      expression_latex: PV = \sum_{k=1}^{5}\frac{S_k (1-t)}{(1+r)^k} + \frac{S_{\infty}(1-t)}{r\,(1+r)^5}
      expression_python: pv = sum(s[k-1]*(1-t)/(1+r)**k for k in range(1,6)) + s_perp*(1-t)/r/(1+r)**5
      excel: =NPV(r,dòng tiền sau thuế)+TV/(1+r)^5
      variables:
      - symbol: s
        meaning: Danh sách cost synergies trước thuế năm 1..5
        unit: tiền tệ/năm
      - symbol: s_perp
        meaning: Cost synergies hằng năm từ năm 6 (không tăng trưởng)
        unit: tiền tệ/năm
      - symbol: t
        meaning: Thuế suất
        unit: tỷ lệ
      - symbol: r
        meaning: Tỷ lệ chiết khấu
        unit: tỷ lệ
      when_to_use: Định lượng cost synergies (nguồn tin cậy nhất, 70-80% xác suất).
      why_it_works: Tiết kiệm trước thuế phải qua thuế; vĩnh viễn không tăng trưởng = S(1-t)/r, chiết khấu về t=0.
      assumptions:
      - Giữ vĩnh viễn, không tăng trưởng (thận trọng)
      - Dòng tiền cuối năm
      pitfalls:
      - Quên thuế
      - Vĩnh viễn kèm tăng trưởng gây thổi phồng
      - Quên chi phí tích hợp 1-1,5 lần synergies năm
      interpretation: Thường chiếm phần lớn NPV synergies của thương vụ hợp lý.
      example:
        inputs:
          s:
          - 300
          - 600
          - 600
          - 600
          - 600
          s_perp: 600
          t: 0.2
          r: 0.18
        steps:
        - PV 5 năm = 1.297,7
        - TV cuối năm 5 = 480/0,18 = 2.666,7, PV = 1.165,6
        - Tổng = 2.463,3
        result: 2.463,3 triệu
  - id: "m09-formulas-12"
    title: "Công thức: m09_revenue_synergy_pv — PV revenue synergies điều chỉnh xác suất"
    tags: ["công", "thức", "m09_revenue_synergy_pv", "pv", "revenue", "synergies", "điều", "chỉnh", "xác", "suất"]
    text: |-
      id: m09_revenue_synergy_pv
      name_vi: PV revenue synergies điều chỉnh xác suất
      name_en: Risk-adjusted PV of revenue synergies
      expression_latex: PV = \sum_{k=a}^{b}\frac{E\cdot p\,(1-t)}{(1+r)^k}
      expression_python: pv = sum(e*p*(1-t)/(1+r)**k for k in range(a, b+1))
      excel: =NPV(r,...)
      variables:
      - symbol: e
        meaning: EBITDA tăng thêm hằng năm
        unit: tiền tệ/năm
      - symbol: p
        meaning: Xác suất/hệ số chiết khấu (0,5 = giảm 50%)
        unit: tỷ lệ
      - symbol: a
        meaning: Năm bắt đầu
        unit: năm
      - symbol: b
        meaning: Năm kết thúc
        unit: năm
      - symbol: t
        meaning: Thuế suất
        unit: tỷ lệ
      - symbol: r
        meaning: Tỷ lệ chiết khấu
        unit: tỷ lệ
      when_to_use: Mọi revenue synergy; quy tắc chiết khấu ít nhất 50%.
      why_it_works: Revenue synergy phụ thuộc hành vi khách hàng và đối thủ (xác suất thực hiện 30-50%) nên không phải thứ mình quyết định một mình.
      assumptions:
      - Giai đoạn hữu hạn trong ví dụ (năm 2-5)
      pitfalls:
      - Tin 100% cross-sell
      - Làm trụ cột của giá
      interpretation: Chỉ nên là phần thưởng; giá phải đứng được khi revenue = 0.
      example:
        inputs:
          e: 500
          p: 0.5
          t: 0.2
          r: 0.18
          a: 2
          b: 5
        steps:
        - Dòng sau thuế mỗi năm = 500 x 0,5 x 0,8 = 200
        - PV năm 2-5 = 455,9
        result: 455,9 triệu
  - id: "m09-formulas-13"
    title: "Công thức: m09_npv_syn_net — NPV synergies ròng"
    tags: ["công", "thức", "m09_npv_syn_net", "npv", "synergies", "ròng"]
    text: |-
      id: m09_npv_syn_net
      name_vi: NPV synergies ròng
      name_en: Net NPV of synergies
      expression_latex: NPV_{syn} = PV_{cost} + PV_{rev,adj} - IntegrationCost
      expression_python: npv_syn = pv_cost + pv_rev_adj - integration_cost
      excel: =PV_cost+PV_rev-ChiPhiTichHop
      variables:
      - symbol: pv_cost
        meaning: PV cost synergies
        unit: tiền tệ
      - symbol: pv_rev_adj
        meaning: PV revenue synergies điều chỉnh
        unit: tiền tệ
      - symbol: integration_cost
        meaning: Chi phí tích hợp
        unit: tiền tệ
      when_to_use: Tổng hợp trước khi so với premium.
      why_it_works: Hoàn tất bức tranh lợi ích trừ chi phí một lần.
      assumptions:
      - Các thành phần cùng tỷ lệ chiết khấu
      pitfalls:
      - Chiết khấu sai tỷ lệ cho phần revenue rủi ro cao
      interpretation: Là trần premium; phải lớn hơn premium với biên an toàn.
      example:
        inputs:
          pv_cost: 2463.28
          pv_rev_adj: 455.94
          integration_cost: 1200
        steps:
        - NPV_syn = 2.463,3 + 455,9 - 1.200 = 1.719,2
        result: 1.719,2 triệu
  - id: "m09-formulas-14"
    title: "Công thức: m09_breakeven_realization — Tỷ lệ thực hiện cost synergies hòa vốn"
    tags: ["công", "thức", "m09_breakeven_realization", "tỷ", "lệ", "thực", "hiện", "cost", "synergies", "hòa", "vốn"]
    text: |-
      id: m09_breakeven_realization
      name_vi: Tỷ lệ thực hiện cost synergies hòa vốn
      name_en: Breakeven cost-synergy realization
      expression_latex: x^{*} = \frac{Premium + IntegrationCost}{PV_{cost}}
      expression_python: x_star = (premium + integration_cost) / pv_cost
      excel: =(Premium+ChiPhiTichHop)/PV_cost
      variables:
      - symbol: premium
        meaning: Premium tuyệt đối
        unit: tiền tệ
      - symbol: integration_cost
        meaning: Chi phí tích hợp
        unit: tiền tệ
      - symbol: pv_cost
        meaning: PV cost synergies kế hoạch
        unit: tiền tệ
      when_to_use: Đo biên an toàn khi revenue synergies = 0.
      why_it_works: Giải x sao cho x x PV_cost - IC - Premium = 0.
      assumptions:
      - Revenue synergies = 0; chi phí tích hợp cố định
      pitfalls:
      - Hiểu nhầm số gần 100% là tốt
      interpretation: x* gần 100% = biên an toàn rất mỏng (case 97,4%). Mục tiêu x* thấp (vd <70%).
      example:
        inputs:
          premium: 1200
          integration_cost: 1200
          pv_cost: 2463.28
        steps:
        - x* = 2.400 / 2.463,3 = 97,4%
        result: 97,4%
  - id: "m09-formulas-15"
    title: "Công thức: m09_new_shares — Số cổ phần phát hành mới"
    tags: ["công", "thức", "m09_new_shares", "số", "cổ", "phần", "phát", "hành", "mới"]
    text: |-
      id: m09_new_shares
      name_vi: Số cổ phần phát hành mới
      name_en: New shares issued
      expression_latex: N_{new} = \frac{\text{Giá trị trả bằng cổ phiếu}}{P_{acquirer}}
      expression_python: n_new = stock_consideration / price_acquirer
      excel: =GiáTrịCP/GiáCP
      variables:
      - symbol: stock_consideration
        meaning: Giá trị thanh toán bằng cổ phiếu
        unit: tiền tệ
      - symbol: price_acquirer
        meaning: Giá cổ phiếu acquirer
        unit: tiền tệ/cổ phần (cùng đơn vị)
      when_to_use: Khi thanh toán toàn bộ/một phần bằng cổ phiếu.
      why_it_works: Số cổ phần = giá trị cần trả / giá mỗi cổ phần.
      assumptions:
      - Giá phát hành bằng giá thị trường/nội bộ 24.000 đ/cp
      pitfalls:
      - Lẫn đơn vị (triệu đồng / nghìn cổ phần / đồng)
      interpretation: Tỷ lệ sở hữu của chủ cũ target = N_new/(N_old+N_new).
      example:
        inputs:
          stock_consideration: 6000
          price_acquirer: 24
        steps:
        - 'Đơn vị: 6.000 triệu / 24 nghìn đồng = 250 nghìn cổ phần'
        - Tỷ lệ = 250/1.250 = 20%
        result: 250 nghìn cổ phần (20%)
  - id: "m09-formulas-16"
    title: "Công thức: m09_after_tax_financing — Chi phí tài trợ sau thuế"
    tags: ["công", "thức", "m09_after_tax_financing", "chi", "phí", "tài", "trợ", "sau", "thuế"]
    text: |-
      id: m09_after_tax_financing
      name_vi: Chi phí tài trợ sau thuế
      name_en: After-tax financing cost
      expression_latex: C = \big(D_{new}\,i_d + Cash_{used}\,i_c\big)(1-t)
      expression_python: c = (d_new*i_d + cash_used*i_c)*(1-t)
      excel: =(Vay*LS_vay+Tiền*LS_tiền)*(1-t)
      variables:
      - symbol: d_new
        meaning: Vay mới
        unit: tiền tệ
      - symbol: i_d
        meaning: Lãi vay
        unit: tỷ lệ/năm
      - symbol: cash_used
        meaning: Tiền mặt sử dụng
        unit: tiền tệ
      - symbol: i_c
        meaning: Lãi tiền gửi bị mất
        unit: tỷ lệ/năm
      - symbol: t
        meaning: Thuế suất
        unit: tỷ lệ
      when_to_use: Đầu vào EPS pro forma; Quick Test.
      why_it_works: Lãi vay được khấu trừ thuế; dùng tiền mặt mất lãi tiền gửi (chi phí cơ hội).
      assumptions:
      - Lãi vay 11%, tiền gửi 5%, thuế 20% (giả định case)
      pitfalls:
      - Quên chi phí cơ hội của tiền mặt dư
      interpretation: Lãi vay sau thuế 8,8%; tiền mặt 4,0%.
      example:
        inputs:
          d_new: 6500
          i_d: 0.11
          cash_used: 8000
          i_c: 0.05
          t: 0.2
        steps:
        - (715 + 400) x 0,8 = 892
        result: 892 triệu
  - id: "m09-formulas-17"
    title: "Công thức: m09_eps_pro_forma — EPS pro forma"
    tags: ["công", "thức", "m09_eps_pro_forma", "eps", "pro", "forma"]
    text: |-
      id: m09_eps_pro_forma
      name_vi: EPS pro forma
      name_en: Pro forma EPS (accretion/dilution)
      expression_latex: EPS_{pf} = \frac{NI_A + NI_B + Syn_{(1-t)} - FinCost_{(1-t)}}{N_A + N_{new}}
      expression_python: eps_pf = (ni_a + ni_b + syn_after_tax - fin_cost_after_tax) / (n_a + n_new); change = eps_pf / (ni_a / n_a) - 1
      excel: =(NI_A+NI_B+Syn-Phí)/(CP_A+CP_mới)
      variables:
      - symbol: ni_a
        meaning: LNST acquirer
        unit: tiền tệ
      - symbol: ni_b
        meaning: LNST target
        unit: tiền tệ
      - symbol: syn_after_tax
        meaning: Synergies sau thuế trong năm
        unit: tiền tệ
      - symbol: fin_cost_after_tax
        meaning: Chi phí tài trợ sau thuế
        unit: tiền tệ
      - symbol: n_a
        meaning: Số cổ phần acquirer hiện tại
        unit: cổ phần
      - symbol: n_new
        meaning: Số cổ phần phát hành mới
        unit: cổ phần
      when_to_use: Đo tác động lên EPS cho từng phương án tài trợ, năm 1 và năm 3.
      why_it_works: Lợi nhuận kết hợp trừ chi phí tài trợ chia cho tổng số cổ phần mới.
      assumptions:
      - 'Chưa tính chi phí tích hợp một lần (nếu tính, EPS báo cáo năm 1 giảm: case A -7,5%)'
      - Không điều chỉnh khấu hao tài sản đánh giá lại
      pitfalls:
      - 'Ra quyết định chỉ bằng EPS: nợ làm EPS đẹp nhất nhưng giá trị tạo ra như nhau'
      - Nhầm EPS điều chỉnh với EPS báo cáo
      interpretation: Accretive nếu EPS_pf > EPS gốc. Đối chiếu bằng value created và rủi ro tài chính.
      example:
        inputs:
          ni_a: 3000
          ni_b: 2560
          syn_after_tax: 0
          fin_cost_after_tax: 892
          n_a: 1000
          n_new: 250
        steps:
        - LNST kết hợp = 3.000 + 2.560 - 892 = 4.668
        - EPS = 4.668 / 1.250 = 3,7344 (3.734 đ)
        - +24,5% so với 3.000 đ
        result: EPS Y1 = 3.734 đ, +24,5% (phương án A)
  - id: "m09-formulas-18"
    title: "Công thức: m09_quick_test — Quick Test accretion"
    tags: ["công", "thức", "m09_quick_test", "quick", "test", "accretion"]
    text: |-
      id: m09_quick_test
      name_vi: Quick Test accretion
      name_en: Earnings yield test
      expression_latex: E/P_{target} = \frac{NI_B}{Price_{paid}} \gtrless \text{Chi phí tài trợ sau thuế}
      expression_python: ey_target = ni_b / price_paid; accretive = ey_target > financing_cost_rate
      excel: =NI_B/Giá
      variables:
      - symbol: ni_b
        meaning: LNST target
        unit: tiền tệ
      - symbol: price_paid
        meaning: Giá mua
        unit: tiền tệ
      - symbol: financing_cost_rate
        meaning: Chi phí tài trợ sau thuế (lãi vay sau thuế, hoặc E/P acquirer = 1/PE nếu trả cổ phiếu)
        unit: tỷ lệ
      when_to_use: Kiểm tra nhanh dấu của accretion/dilution.
      why_it_works: 'Earnings yield là lợi suất mỗi đồng bỏ mua; lớn hơn chi phí của đồng đó thì EPS tăng. Trả cổ phiếu: acquirer P/E cao hơn target P/E thì accretive.'
      assumptions:
      - Chưa tính synergies và chi phí một lần
      pitfalls:
      - Hiểu accretion là tạo giá trị
      interpretation: Bằng nhau thì trung lập.
      example:
        inputs:
          ni_b: 2560
          price_paid: 20500
          financing_cost_rate: 0.125
        steps:
        - E/P target = 2.560/20.500 = 12,49%
        - 'E/P acquirer = 1/8 = 12,5%: gần bằng nên EPS Y1 trung lập (2.999 đ)'
        result: Trung lập (12,49% vs 12,5%)
  - id: "m09-formulas-19"
    title: "Công thức: m09_goodwill — Lợi thế thương mại"
    tags: ["công", "thức", "m09_goodwill", "lợi", "thế", "thương", "mại"]
    text: |-
      id: m09_goodwill
      name_vi: Lợi thế thương mại
      name_en: Goodwill
      expression_latex: Goodwill = P_{purchase} - FV_{\text{tài sản ròng xác định}}\;;\quad \text{tỷ trọng} = \frac{Goodwill}{P_{purchase}}
      expression_python: goodwill = price - fv_net_assets; share = goodwill / price
      excel: =Giá-FV_TSròng
      variables:
      - symbol: price
        meaning: Giá mua
        unit: tiền tệ
      - symbol: fv_net_assets
        meaning: Giá trị hợp lý tài sản ròng xác định được (sổ sách + đánh giá lại)
        unit: tiền tệ
      when_to_use: Ghi nhận kế toán và đánh giá rủi ro ghi giảm.
      why_it_works: Premium vượt tài sản hữu hình/xác định được chuyển thành goodwill.
      assumptions:
      - Đánh giá lại tài sản (thương hiệu, thiết bị) đã thực hiện
      pitfalls:
      - Dùng giá trị sổ sách thay FV
      - Quên impairment test (IFRS) hoặc phân bổ (VAS)
      interpretation: Tỷ trọng cao (gần 50%) nghĩa là phụ thuộc synergies, ghi giảm lớn nếu thất bại.
      example:
        inputs:
          price: 20500
          fv_net_assets: 10500
        steps:
        - Vốn chủ sổ sách 9.000 + đánh giá lại 1.500 = 10.500
        - Goodwill = 10.000, 48,8% giá mua
        result: 10.000 triệu (48,8%)
  - id: "m09-formulas-20"
    title: "Công thức: m09_lbo_returns — LBO: MoM và IRR"
    tags: ["công", "thức", "m09_lbo_returns", "lbo", "mom", "và", "irr"]
    text: |-
      id: m09_lbo_returns
      name_vi: 'LBO: MoM và IRR'
      name_en: LBO returns (MoM, IRR)
      expression_latex: MoM = \frac{Equity_{exit}}{Equity_{entry}}\;;\quad IRR = MoM^{1/n}-1\;;\quad Equity_{exit}= m_{exit}\cdot EBITDA_{exit} - Debt_{exit}
      expression_python: equity_exit = exit_mult*ebitda_exit - debt_exit; mom = equity_exit/equity_entry; irr = mom**(1/n) - 1
      excel: =(Thoái/Vào)^(1/n)-1  hoặc =IRR(dòng tiền)
      variables:
      - symbol: exit_mult
        meaning: Bội số EV/EBITDA lúc thoái
        unit: lần
      - symbol: ebitda_exit
        meaning: EBITDA lúc thoái
        unit: tiền tệ
      - symbol: debt_exit
        meaning: Nợ còn lại
        unit: tiền tệ
      - symbol: equity_entry
        meaning: Vốn chủ góp ban đầu
        unit: tiền tệ
      - symbol: n
        meaning: Số năm giữ
        unit: năm
      when_to_use: Đánh giá thương vụ mua bằng đòn bẩy của quỹ PE; mục tiêu IRR 20-25%+.
      why_it_works: Một dòng vào, một dòng ra (không cổ tức trung gian) nên IRR = căn bậc n của MoM trừ 1. Nợ nhỏ mà EV tăng nên đòn bẩy khuếch đại lợi suất vốn chủ.
      assumptions:
      - Không có dòng tiền trung gian cho vốn chủ
      - Chi phí giao dịch bỏ qua
      pitfalls:
      - Đòn bẩy cũng khuếch đại lỗ
      - Dựa vào mở rộng bội số (may mắn thị trường)
      interpretation: 'LBO lành mạnh: lợi nhuận từ EBITDA tăng và trả nợ. Đóng góp điển hình: tăng EBITDA 30-40%, trả nợ 30-40%, mở rộng bội số 20-30% (khoảng minh họa).'
      example:
        inputs:
          exit_mult: 8
          ebitda_exit: 17.5
          debt_exit: 35
          equity_entry: 30
          n: 5
        steps:
        - EV thoái = 8 x 17,5 = 140
        - Vốn chủ thu về = 140 - 35 = 105
        - MoM = 3,5x
        - IRR = 3,5^(1/5) - 1 = 28,5%
        result: MoM 3,5x, IRR 28,5%
  - id: "m09-formulas-21"
    title: "Công thức: m09_lbo_attribution — Phân rã giá trị LBO"
    tags: ["công", "thức", "m09_lbo_attribution", "phân", "rã", "giá", "trị", "lbo"]
    text: |-
      id: m09_lbo_attribution
      name_vi: Phân rã giá trị LBO
      name_en: LBO value creation attribution
      expression_latex: ΔEquity = (EBITDA_{exit}-EBITDA_{entry})\,m_{entry} + (Debt_{entry}-Debt_{exit}) + (m_{exit}-m_{entry})\,EBITDA_{exit}
      expression_python: d_equity = (e_exit-e_entry)*m_entry + (debt_entry-debt_exit) + (m_exit-m_entry)*e_exit
      excel: ''
      variables:
      - symbol: e_entry
        meaning: EBITDA vào
        unit: tiền tệ
      - symbol: e_exit
        meaning: EBITDA thoái
        unit: tiền tệ
      - symbol: m_entry
        meaning: Bội số vào
        unit: lần
      - symbol: m_exit
        meaning: Bội số thoái
        unit: lần
      - symbol: debt_entry
        meaning: Nợ vào
        unit: tiền tệ
      - symbol: debt_exit
        meaning: Nợ thoái
        unit: tiền tệ
      when_to_use: Biết lãi đến từ vận hành, trả nợ hay may mắn bội số.
      why_it_works: Equity = m x EBITDA - Debt, phân rã thay đổi thành ba phần (EBITDA, nợ, bội số).
      assumptions:
      - Phân rã tuần tự; thứ tự khác cho số khác một chút khi có hiệu ứng chéo
      pitfalls:
      - Bỏ phần hiệu ứng chéo
      interpretation: Phần mở rộng bội số bằng 0 là LBO lành mạnh.
      example:
        inputs:
          e_entry: 12.5
          e_exit: 17.5
          m_entry: 8
          m_exit: 8
          debt_entry: 70
          debt_exit: 35
        steps:
        - 'EBITDA: (17,5-12,5) x 8 = 40'
        - 'Trả nợ: 70 - 35 = 35'
        - 'Bội số: 0'
        - Tổng 75 = 105 - 30
        result: '75'
  - id: "m09-formulas-22"
    title: "Công thức: m09_leverage_cover — Nợ/EBITDA và hệ số bảo vệ lãi vay"
    tags: ["công", "thức", "m09_leverage_cover", "nợ", "ebitda", "và", "hệ", "số", "bảo", "vệ", "lãi", "vay"]
    text: |-
      id: m09_leverage_cover
      name_vi: Nợ/EBITDA và hệ số bảo vệ lãi vay
      name_en: Net-debt/EBITDA and Interest Coverage Ratio
      expression_latex: Debt/EBITDA = \frac{D}{EBITDA}\;;\quad ICR = \frac{EBIT}{Interest}
      expression_python: lev = debt/ebitda; icr = ebit/interest
      excel: =Nợ/EBITDA ; =EBIT/Lãi
      variables:
      - symbol: debt
        meaning: Tổng nợ sau thương vụ
        unit: tiền tệ
      - symbol: ebitda
        meaning: EBITDA kết hợp
        unit: tiền tệ
      - symbol: ebit
        meaning: EBIT kết hợp
        unit: tiền tệ
      - symbol: interest
        meaning: Lãi vay kết hợp
        unit: tiền tệ
      when_to_use: Kiểm tra khả năng chịu đòn bẩy và stress test.
      why_it_works: Đo số năm EBITDA trả hết nợ và số lần lợi nhuận hoạt động phủ lãi.
      assumptions:
      - 'Stress test: EBITDA giảm, EBIT = EBITDA mới - khấu hao kết hợp 2.350, lãi cố định'
      pitfalls:
      - Chỉ nhìn kịch bản cơ sở
      interpretation: 'Nợ/EBITDA <3-4x an toàn; ICR >3x. Case A: 0,89x và 7,8x; EBITDA -40% vẫn ICR 3,7x.'
      example:
        inputs:
          debt: 8500
          ebitda: 9500
          ebit: 7150
          interest: 915
        steps:
        - Nợ/EBITDA = 8.500/9.500 = 0,89x
        - ICR = 7.150/915 = 7,8x
        - 'EBITDA -40%: EBIT 3.350, ICR 3,7x, Nợ/EBITDA 1,49x'
        result: 0,89x; 7,8x
  - id: "m09-formulas-23"
    title: "Công thức: m09_roi_indicator — ROI chỉ báo thương vụ"
    tags: ["công", "thức", "m09_roi_indicator", "roi", "chỉ", "báo", "thương", "vụ"]
    text: |-
      id: m09_roi_indicator
      name_vi: ROI chỉ báo thương vụ
      name_en: Indicative deal ROI
      expression_latex: ROI = \frac{Value - Price}{Price}
      expression_python: roi = (value - price) / price
      excel: =(Giá trị-Giá)/Giá
      variables:
      - symbol: value
        meaning: Giá trị kinh tế ước tính quy về hiện tại
        unit: tiền tệ
      - symbol: price
        meaning: Giá đã trả
        unit: tiền tệ
      when_to_use: Đánh giá định tính hậu kiểm (case Disney-Pixar).
      why_it_works: Tỷ lệ lãi trên vốn bỏ ra.
      assumptions:
      - Giá trị là ước tính, không phải doanh thu gộp
      pitfalls:
      - Lẫn doanh thu phòng vé với giá trị tạo ra
      interpretation: Chỉ báo định tính, không phải số liệu tài chính chính xác.
      example:
        inputs:
          value: 50
          price: 7.4
        steps:
        - (50 - 7,4)/7,4 = 5,76 = 576%
        result: 576% (illustrative)
  - id: "m09-procedures-1"
    title: "Quy trình: m09_proc_full_valuation — Quy trình đánh giá một thương vụ mua (từ đầu đến cuối)"
    tags: ["quy", "trình", "m09_proc_full_valuation", "đánh", "giá", "một", "thương", "vụ", "mua", "từ", "đầu", "đến"]
    text: |-
      id: m09_proc_full_valuation
      name: Quy trình đánh giá một thương vụ mua (từ đầu đến cuối)
      steps:
      - '1. Làm rõ luận điểm chiến lược: synergy cụ thể nào bằng tiền? Không diễn đạt được thì dừng.'
      - '2. Chuẩn hóa số liệu target (Quality of Earnings): điều chỉnh EBITDA cho chi phí cá nhân chủ, lương dưới thị trường, doanh thu chưa xuất hóa đơn, nợ khó đòi.'
      - '3. Định giá stand-alone: EV/EBITDA Comps, Precedent (đã có control premium), DCF (NOPAT -> FCF -> Gordon). Từ EV trừ nợ ròng ra Equity. Lập Football Field, chọn giá trị neo trong vùng chồng lấn.'
      - '4. Định lượng synergies: cost (sau thuế, vĩnh viễn nếu hợp lý), revenue (chiết khấu >=50%), trừ chi phí tích hợp (1-1,5 lần cost synergies năm).'
      - 5. Tính walk-away = Stand-alone + NPV synergies ròng; và walk-away chỉ-cost-synergies (không revenue).
      - '6. So sánh giá chủ đòi: nếu vượt walk-away thì từ chối; nếu giữa hai walk-away thì cấu trúc giá cơ sở + earn-out.'
      - 7. Value created = NPV_syn - Premium; stress test với cost 50%, revenue 0, chi phí tích hợp +50%; tính tỷ lệ cost synergy hòa vốn.
      - '8. Chọn cấu trúc thanh toán: tính EPS Y1 và Y3 cho các phương án; đối chiếu bằng value created và rủi ro.'
      - '9. Kiểm tra đòn bẩy: Nợ/EBITDA, ICR, stress test EBITDA -20%, -30%, -40%.'
      - 10. Goodwill, cơ cấu sở hữu (nếu phát hành cổ phiếu), due diligence, kế hoạch PMI 100 ngày.
      outputs: Football Field, bảng synergies, walk-away, đề xuất giá cơ sở + earn-out, bảng EPS, bảng stress, khuyến nghị mua/không mua.
  - id: "m09-procedures-2"
    title: "Quy trình: m09_proc_eps_compare — So sánh phương án tài trợ bằng EPS"
    tags: ["quy", "trình", "m09_proc_eps_compare", "so", "sánh", "phương", "án", "tài", "trợ", "bằng", "eps"]
    text: |-
      id: m09_proc_eps_compare
      name: So sánh phương án tài trợ bằng EPS
      steps:
      - 1. Đổi mọi số về cùng đơn vị (triệu đồng, nghìn cổ phần).
      - 2. Tính chi phí tài trợ sau thuế = (vay x lãi vay + tiền x lãi mất) x (1-t); lãi vay sau thuế = lãi x (1-t).
      - 3. Cổ phần mới = giá trị trả cổ phiếu / giá cổ phiếu.
      - 4. EPS Y1 (chưa có synergies); EPS Y3 cộng cost synergies sau thuế.
      - 5. Lập bảng EPS và % thay đổi; tính riêng EPS có/không có chi phí tích hợp.
      - 6. Quick Test E/P target vs chi phí tài trợ; nhắc rằng accretion không bằng value.
      outputs: Bảng phương án (A hỗn hợp, B cổ phiếu, C tiền+vay) với EPS Y1, Y3 và khuyến nghị.
  - id: "m09-procedures-3"
    title: "Quy trình: m09_proc_lbo — Đánh giá LBO"
    tags: ["quy", "trình", "m09_proc_lbo", "đánh", "giá", "lbo"]
    text: |-
      id: m09_proc_lbo
      name: Đánh giá LBO
      steps:
      - '1. Nguồn vốn: vốn chủ, senior debt, mezzanine; EV vào = bội số x EBITDA.'
      - 2. Dự phóng EBITDA, dòng tiền trả nợ, nợ còn lại năm n.
      - 3. EV thoái = bội số thoái x EBITDA thoái; Vốn chủ thoái = EV - nợ.
      - 4. MoM và IRR; phân rã nguồn lợi (EBITDA, trả nợ, bội số).
      - '5. Stress: EBITDA -30%, bội số thoái thấp hơn; kiểm ICR/Nợ-EBITDA.'
      outputs: IRR, MoM, phân rã, mức nhạy.
  - id: "m09-procedures-4"
    title: "Quy trình: m09_proc_dd_process — Quy trình giao dịch và thẩm định"
    tags: ["quy", "trình", "m09_proc_dd_process", "giao", "dịch", "và", "thẩm", "định"]
    text: |-
      id: m09_proc_dd_process
      name: Quy trình giao dịch và thẩm định
      steps:
      - '1. Chuẩn bị: advisor, Information Memo, danh sách người mua, data room (6 tuần).'
      - '2. Tiếp thị: teaser -> NDA -> IM -> IOI -> shortlist.'
      - 3. Thẩm định tài chính, pháp lý, thương mại, vận hành, thuế, nhân sự, IT, môi trường; nhận binding bids.
      - 4. Đàm phán SPA, board duyệt, fairness opinion, ký.
      - '5. Closing: chống độc quyền, cổ đông, điều kiện tiên quyết.'
      - '6. PMI 6-24 tháng: kế hoạch 100 ngày, theo dõi synergies hàng quý, giữ nhân tài.'
      outputs: Timeline 3-6 tháng đến closing, danh mục DD, kế hoạch PMI.
  - id: "m09-procedures-5"
    title: "Quy trình: m09_proc_sme_seller_prep — SME làm bên bán (chuẩn bị 12-24 tháng)"
    tags: ["quy", "trình", "m09_proc_sme_seller_prep", "sme", "làm", "bên", "bán", "chuẩn", "bị", "12", "24", "tháng"]
    text: |-
      id: m09_proc_sme_seller_prep
      name: SME làm bên bán (chuẩn bị 12-24 tháng)
      steps:
      - 1. Chuẩn hóa sổ sách, tách chi phí cá nhân, xuất hóa đơn đầy đủ.
      - 2. Giảm tập trung khách hàng và phụ thuộc chủ.
      - 3. Chuẩn bị QoE và data room Google Drive/Dropbox phân quyền.
      - 4. Chấp nhận earn-out và giữ vai trò chuyển giao.
      outputs: Hồ sơ bán sẵn sàng, giá kỳ vọng thực tế.
  - id: "m09-decision_rules-1"
    title: "Quy tắc quyết định: Nếu NPV synergies > Premium thì thương vụ tạo giá trị; nếu < thì phá hủy giá trị cho cổ đông bên mu…"
    tags: ["quy", "tắc", "quyết", "định", "nếu", "npv", "synergies", "premium", "thì", "thương", "vụ", "tạo"]
    text: |-
      Nếu NPV synergies > Premium thì thương vụ tạo giá trị; nếu < thì phá hủy giá trị cho cổ đông bên mua.
  - id: "m09-decision_rules-2"
    title: "Quy tắc quyết định: Nếu giá người bán đòi > walk-away price thì từ chối hoặc đề nghị giá cơ sở thấp + earn-out."
    tags: ["quy", "tắc", "quyết", "định", "nếu", "giá", "người", "bán", "đòi", "walk", "away", "price"]
    text: |-
      Nếu giá người bán đòi > walk-away price thì từ chối hoặc đề nghị giá cơ sở thấp + earn-out.
  - id: "m09-decision_rules-3"
    title: "Quy tắc quyết định: Nếu thương vụ chỉ có lãi khi revenue synergies thực hiện thì không dùng nó để biện minh giá; chiết …"
    tags: ["quy", "tắc", "quyết", "định", "nếu", "thương", "vụ", "chỉ", "có", "lãi", "khi", "revenue"]
    text: |-
      Nếu thương vụ chỉ có lãi khi revenue synergies thực hiện thì không dùng nó để biện minh giá; chiết khấu revenue >=50%.
  - id: "m09-decision_rules-4"
    title: "Quy tắc quyết định: Nếu tỷ lệ cost synergy hòa vốn gần 100% thì biên an toàn mỏng: giảm giá cơ sở hoặc chuyển phần giá …"
    tags: ["quy", "tắc", "quyết", "định", "nếu", "tỷ", "lệ", "cost", "synergy", "hòa", "vốn", "gần"]
    text: |-
      Nếu tỷ lệ cost synergy hòa vốn gần 100% thì biên an toàn mỏng: giảm giá cơ sở hoặc chuyển phần giá sang earn-out.
  - id: "m09-decision_rules-5"
    title: "Quy tắc quyết định: Nếu E/P target > chi phí tài trợ sau thuế thì accretive; nếu trả cổ phiếu và P/E acquirer > P/E tar…"
    tags: ["quy", "tắc", "quyết", "định", "nếu", "target", "chi", "phí", "tài", "trợ", "sau", "thuế"]
    text: |-
      Nếu E/P target > chi phí tài trợ sau thuế thì accretive; nếu trả cổ phiếu và P/E acquirer > P/E target thì accretive.
  - id: "m09-decision_rules-6"
    title: "Quy tắc quyết định: Nếu EPS accretive nhưng value created <= 0 thì vẫn từ chối (accretion không phải tạo giá trị)."
    tags: ["quy", "tắc", "quyết", "định", "nếu", "eps", "accretive", "nhưng", "value", "created", "thì", "vẫn"]
    text: |-
      Nếu EPS accretive nhưng value created <= 0 thì vẫn từ chối (accretion không phải tạo giá trị).
  - id: "m09-decision_rules-7"
    title: "Quy tắc quyết định: Nếu cổ phiếu acquirer đang bị định giá cao (đỉnh thị trường) thì cân nhắc trả cổ phiếu nhưng thị tr…"
    tags: ["quy", "tắc", "quyết", "định", "nếu", "cổ", "phiếu", "acquirer", "đang", "bị", "giá", "cao"]
    text: |-
      Nếu cổ phiếu acquirer đang bị định giá cao (đỉnh thị trường) thì cân nhắc trả cổ phiếu nhưng thị trường sẽ đọc là tín hiệu tiêu cực; nếu synergies chưa chắc chắn thì stock deal chia sẻ rủi ro.
  - id: "m09-decision_rules-8"
    title: "Quy tắc quyết định: Nếu Nợ/EBITDA > 3-4x hoặc ICR < 3x sau thương vụ thì giảm vay, tăng vốn chủ/cổ phiếu hoặc earn-out."
    tags: ["quy", "tắc", "quyết", "định", "nếu", "nợ", "ebitda", "4x", "hoặc", "icr", "3x", "sau"]
    text: |-
      Nếu Nợ/EBITDA > 3-4x hoặc ICR < 3x sau thương vụ thì giảm vay, tăng vốn chủ/cổ phiếu hoặc earn-out.
  - id: "m09-decision_rules-9"
    title: "Quy tắc quyết định: Nếu goodwill > ~50% giá mua thì xem là phụ thuộc cao vào synergies, dự phòng rủi ro ghi giảm."
    tags: ["quy", "tắc", "quyết", "định", "nếu", "goodwill", "50", "giá", "mua", "thì", "xem", "là"]
    text: |-
      Nếu goodwill > ~50% giá mua thì xem là phụ thuộc cao vào synergies, dự phòng rủi ro ghi giảm.
  - id: "m09-decision_rules-10"
    title: "Quy tắc quyết định: Nếu target là doanh nghiệp sáng tạo/con người là tài sản chính thì giữ độc lập có kiểm soát (mô hìn…"
    tags: ["quy", "tắc", "quyết", "định", "nếu", "target", "là", "doanh", "nghiệp", "sáng", "tạo", "con"]
    text: |-
      Nếu target là doanh nghiệp sáng tạo/con người là tài sản chính thì giữ độc lập có kiểm soát (mô hình Pixar), không ép tích hợp.
  - id: "m09-decision_rules-11"
    title: "Quy tắc quyết định: Nếu không diễn đạt synergy cụ thể bằng tiền thì không mua (bài học AOL)."
    tags: ["quy", "tắc", "quyết", "định", "nếu", "không", "diễn", "đạt", "synergy", "cụ", "thể", "bằng"]
    text: |-
      Nếu không diễn đạt synergy cụ thể bằng tiền thì không mua (bài học AOL).
  - id: "m09-decision_rules-12"
    title: "Quy tắc quyết định: Nếu mô hình kinh doanh cốt lõi của target đang suy tàn vì công nghệ thì M&A không sửa được."
    tags: ["quy", "tắc", "quyết", "định", "nếu", "mô", "hình", "kinh", "doanh", "cốt", "lõi", "của"]
    text: |-
      Nếu mô hình kinh doanh cốt lõi của target đang suy tàn vì công nghệ thì M&A không sửa được.
  - id: "m09-decision_rules-13"
    title: "Quy tắc quyết định: Nếu mua SME: dùng bội số 3-6x EV/EBITDA, ưu tiên Quality of Earnings và earn-out giữ chủ/nhân sự th…"
    tags: ["quy", "tắc", "quyết", "định", "nếu", "mua", "sme", "dùng", "bội", "số", "6x", "ev"]
    text: |-
      Nếu mua SME: dùng bội số 3-6x EV/EBITDA, ưu tiên Quality of Earnings và earn-out giữ chủ/nhân sự then chốt/khách lớn.
  - id: "m09-decision_rules-14"
    title: "Quy tắc quyết định: Nếu thương vụ horizontal có thị phần cao thì kiểm tra ngưỡng kiểm soát tập trung kinh tế (Luật Cạnh…"
    tags: ["quy", "tắc", "quyết", "định", "nếu", "thương", "vụ", "horizontal", "có", "thị", "phần", "cao"]
    text: |-
      Nếu thương vụ horizontal có thị phần cao thì kiểm tra ngưỡng kiểm soát tập trung kinh tế (Luật Cạnh tranh 2018).
  - id: "m09-decision_rules-15"
    title: "Quy tắc quyết định: Nếu mua cổ phần (share deal) thì thẩm định nợ ẩn kỹ hơn; nếu muốn tránh nợ ẩn thì cân nhắc asset de…"
    tags: ["quy", "tắc", "quyết", "định", "nếu", "mua", "cổ", "phần", "share", "deal", "thì", "thẩm"]
    text: |-
      Nếu mua cổ phần (share deal) thì thẩm định nợ ẩn kỹ hơn; nếu muốn tránh nợ ẩn thì cân nhắc asset deal.
  - id: "m09-decision_rules-16"
    title: "Quy tắc quyết định: Nếu giá đã được xác định trước đấu giá thì rời đi khi vượt walk-away dù bị cuốn vào cạnh tranh (win…"
    tags: ["quy", "tắc", "quyết", "định", "nếu", "giá", "đã", "được", "xác", "trước", "đấu", "thì"]
    text: |-
      Nếu giá đã được xác định trước đấu giá thì rời đi khi vượt walk-away dù bị cuốn vào cạnh tranh (winner's curse).
