sections:
  - id: "m09-tong-quan"
    title: "Tổng quan m09"
    tags: ["m09", "sáp", "nhập", "mua", "lại", "mergers", "acquisitions"]
    text: |-
      Sáp nhập & Mua lại (M&A) (Mergers & Acquisitions) — module m09

      Mục đích: Trả lời hai câu hỏi cốt lõi của mọi thương vụ: mua cái gì và vì sao (synergies có thật không), và trả bao nhiêu, bằng gì (định giá, premium, walk-away price, cấu trúc thanh toán, EPS, đòn bẩy). Về bản chất M&A là một quyết định Capital Budgeting đặc biệt: chỉ làm khi NPV > 0, tức synergies (NPV) lớn hơn premium đã trả.

      Dùng khi:
      - Có nên mua doanh nghiệp/đối thủ X không? Trả tối đa bao nhiêu (walk-away price)?
      - Chủ doanh nghiệp đòi giá Y, giá đó có hợp lý không? Premium bao nhiêu là chấp nhận được?
      - Định giá target bằng EV/EBITDA, comps, precedent, DCF; lập Football Field
      - Ước tính và chiết khấu synergies (cost/revenue), chi phí tích hợp
      - So sánh trả tiền mặt / vay / cổ phiếu / hỗn hợp; tác động EPS (accretion/dilution)
      - Phân tích LBO: IRR, MoM, nguồn gốc lợi nhuận
      - Kiểm tra khả năng chịu nợ sau thương vụ (Nợ/EBITDA, ICR, stress test)
      - Goodwill, tỷ trọng goodwill, rủi ro ghi giảm

      Nên nắm trước: - m01; - m02; - m03; - m05

      Module liên quan: - 'm10: định giá doanh nghiệp (DCF, multiples) - M&A dùng trực tiếp các phương pháp này' - 'm03: WACC làm tỷ lệ chiết khấu cho DCF và synergies' - 'm04: cơ cấu vốn, Pecking Order (Myers & Majluf) giải thích tín hiệu cash vs stock, đòn bẩy LBO' - 'm02: M&A là capital budgeting với NPV>0' - 'm05: phân tích BCTC, Quality of Earnings, ICR, Nợ/EBITDA' - 'm06: vốn lưu động trong FCF và due diligence' -…

      Công thức (tra chi tiết bằng skill_search("<id>")):
      - m09_ev: Giá trị doanh nghiệp
      - m09_equity_from_ev: Giá trị vốn chủ từ EV
