  - id: "m09-worked_examples-6"
    title: "Ví dụ có lời giải: Định giá stand-alone Hạnh Phúc Bakery"
    tags: ["ví", "dụ", "có", "lời", "giải", "định", "giá", "stand", "alone", "hạnh", "phúc", "bakery"]
    text: |-
      name: Định giá stand-alone Hạnh Phúc Bakery
      inputs:
        ebitda: 4000
        ebit: 3400
        dep: 600
        capex: 500
        d_nwc: 20
        g: 0.04
        wacc: 0.18
        debt: 2000
        cash: 500
        t: 0.2
      steps:
      - NOPAT = 3.400 x 0,8 = 2.720; FCF = 2.720 + 600 - 500 - 20 = 2.800
