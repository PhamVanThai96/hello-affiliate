    tags: ["bài", "học", "case", "bánh", "quê", "xưa", "mua", "hạnh", "phúc", "bakery"]
    text: |-
      name: Bánh Quê Xưa mua Hạnh Phúc Bakery
      type: sme
      setup: 'Acquirer: EBITDA 5.500, LNST 3.000, 1.000 nghìn cp (EPS 3.000đ), P/E 8, tiền dư 10.000, không nợ. Target: EBITDA 4.000, EBIT 3.400, nợ 2.000, tiền 500, LNST 2.560, vốn chủ sổ sách 9.000. Chủ đòi 22.000 (triệu đồng).'
      key_calculations:
      - 'Stand-alone: Comps 5x -> equity 18.500; DCF (FCF 2.800, g 4%, WACC 18%) -> EV 20.800, equity 19.300; Precedent 5,5x -> equity 20.500. Neo 19.300.'
      - NPV synergies = 2.463,3 (cost) + 455,9 (revenue 50%) - 1.200 = 1.719,2.
      - 'Walk-away = 19.300 + 1.719,2 = 21.019; chỉ cost synergies: 20.563; giá 22.000 vượt 981.'
      - 'Đề xuất 19.800 cơ sở + earn-out 700 = 20.500; premium 1.200; value created 519,2 (giá cơ sở 19.800: 1.219,2).'
      - 'Stress: revenue=0 +63,3; cost 50% -1.168,4; chi phí tích hợp 1.800 -536,7; cost synergy hòa vốn 97,4%.'
      - 'EPS Y1: A hỗn hợp 3.734 (+24,5%), B cổ phiếu 2.999 (~0%), C tiền+vay 4.140 (+38%); Y3: +37,3%, +8,6%, +54%. Chi phí tích hợp 1.200 vào Y1 phương án A: -7,5%.'
      - 'A: Nợ/EBITDA 0,89x, ICR 7,8x, chịu được EBITDA -40% (ICR 3,7x). Goodwill 10.000 = 48,8% giá mua; chủ cũ nhận 20% cổ phần.'
      lesson: 'Giá trị nằm ở cost synergies, không ở EPS; EPS cao nhất (C) không tạo thêm giá trị; biên an toàn giữa giá trả và walk-away quyết định thương vụ; earn-out giải rủi ro; rủi ro thật là giá/synergies chứ không phải đòn bẩy. Lưu ý: nguồn có chỗ premium 10,8% so với Comps 18.500 (tính (20.500-18.500)/18.500) và 6,2% so DCF 19.300.'
      data_reliability: illustrative
  - id: "m09-worked_examples-1"
    title: "Ví dụ có lời giải: Walk-away price và so sánh với giá đòi (Bài 4)"
    tags: ["ví", "dụ", "có", "lời", "giải", "walk", "away", "price", "và", "so", "sánh", "với"]
    text: |-
      name: Walk-away price và so sánh với giá đòi (Bài 4)
      inputs:
        v_standalone: 200
        pv_cost_after_tax: 40
        pv_revenue_expected: 30
        confidence: 0.5
        integration_cost: 25
        ask: 240
      steps:
      - Revenue điều chỉnh = 30 x 50% = 15
      - NPV synergies ròng = 40 + 15 - 25 = 30
      - Walk-away = 200 + 30 = 230 tỷ
      - Giá đòi 240 vượt 10 tỷ; từ chối hoặc đề nghị giá cơ sở thấp + earn-out
      result: Walk-away 230 tỷ; không trả 240
  - id: "m09-worked_examples-2"
    title: "Ví dụ có lời giải: Premium và value created (Bài 1)"
    tags: ["ví", "dụ", "có", "lời", "giải", "premium", "và", "value", "created", "bài"]
    text: |-
      name: Premium và value created (Bài 1)
      inputs:
        market_cap: 500
        premium_pct: 0.3
        npv_syn: 120
      steps:
      - Premium = 500 x 0,3 = 150 tỷ
      - Value created = 120 - 150 = -30 tỷ (phá hủy)
      - Giá tối đa = 500 + 120 = 620 tỷ, premium tối đa 120 tỷ (24%)
      result: -30 tỷ; trần 620 tỷ
  - id: "m09-worked_examples-3"
    title: "Ví dụ có lời giải: Accretion/dilution trả 100% cổ phiếu (Bài 2)"
    tags: ["ví", "dụ", "có", "lời", "giải", "accretion", "dilution", "trả", "100", "cổ", "phiếu", "bài"]
    text: |-
      name: Accretion/dilution trả 100% cổ phiếu (Bài 2)
      inputs:
        ni_a: 100
        shares_a: 50
        price: 20000
        ni_b: 30
        price_b: 400
      steps:
      - Cổ phần mới = 400 tỷ / 20.000 = 20 triệu; tổng 70 triệu
      - EPS trước = 100 tỷ / 50 triệu = 2.000 đ
      - EPS sau = 130 tỷ / 70 triệu = 1.857 đ (giảm 7,1%)
      - 'Quick Test: E/P target = 30/400 = 7,5% < E/P acquirer 10% -> dilutive, khớp'
      result: Dilutive -7,1%
  - id: "m09-worked_examples-4"
    title: "Ví dụ có lời giải: LBO đơn giản (Bài 3)"
    tags: ["ví", "dụ", "có", "lời", "giải", "lbo", "đơn", "giản", "bài"]
    text: |-
      name: LBO đơn giản (Bài 3)
      inputs:
        ebitda_entry: 16
        multiple: 5
        equity: 40
        debt: 40
        ebitda_exit: 22
        debt_exit: 20
        n: 4
      steps:
      - EV vào = 5 x 16 = 80; EV thoái = 5 x 22 = 110
      - Vốn chủ thu về = 110 - 20 = 90; MoM = 2,25x
      - IRR = 2,25^(1/4) - 1 = 22,5%/năm
      result: MoM 2,25x; IRR 22,5%
