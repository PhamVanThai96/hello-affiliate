  - id: "readme-file_index"
    title: "README bộ skill — file_index"
    tags: ["file_index"]
    text: |-
      - file: 00-README.yaml
        role: Điểm vào, hướng dẫn nạp skill
      - file: SCHEMA.yaml
        role: Định nghĩa cấu trúc dữ liệu
      - file: 01-agent-profile.yaml
        role: Vai trò Strategist, phạm vi, nguyên tắc, workflow, disclaimer
      - file: 02-decision-router.yaml
        role: Định tuyến câu hỏi sang module và playbook, chuỗi module cho bài toán đa chiều
      - file: 03-playbooks.yaml
        role: 10 kịch bản giải quyết vấn đề chiến lược end-to-end
      - file: 04-report-templates.yaml
        role: Mẫu báo cáo/bảng biểu đầu ra
      - file: 05-glossary.yaml
        role: Thuật ngữ Việt-Anh và ký hiệu
      - file: 06-formulas-index.yaml
        role: Registry công thức và thang điểm (sinh tự động từ modules)
      - file: modules/m01-external-environment.yaml
        role: PESTEL và Năm lực lượng Porter
      - file: modules/m02-internal-analysis.yaml
        role: SWOT/TOWS, VRIO, Chuỗi giá trị
      - file: modules/m03-competitive-strategy.yaml
        role: Chiến lược cạnh tranh chung Porter (chi phí thấp, khác biệt hóa, tập trung)
      - file: modules/m04-growth-strategy.yaml
        role: Ansoff, BCG, GE-McKinsey, hướng tăng trưởng
      - file: modules/m05-blue-ocean-strategy.yaml
        role: 'Đại dương xanh: Strategy Canvas, ERRC, Four Actions'
      - file: modules/m06-balanced-scorecard.yaml
        role: Thẻ điểm cân bằng, bản đồ chiến lược, KPI
      - file: modules/m07-scenario-planning.yaml
        role: Lập kế hoạch theo kịch bản, bất định then chốt
      - file: modules/m08-case-the-coffee-house.yaml
        role: Case The Coffee House tích hợp nhiều framework
      - file: modules/m09-strategic-case-studies-part1.yaml
        role: Cẩm nang case chiến lược tích hợp phần 1
      - file: modules/m10-strategic-case-studies-part2.yaml
        role: Cẩm nang case chiến lược tích hợp phần 2
  - id: "readme-skill"
    title: "README bộ skill — skill"
    tags: ["skill"]
    text: |-
      id: strategic-agent-skill
      version: 1.0
      language: vi (thuật ngữ Anh trong ngoặc)
      created: 2026-11-07
      purpose: |
        Bộ tri thức đã chắt lọc từ giáo trình "Quản trị chiến lược doanh nghiệp" (MBA ứng dụng SME Việt Nam) để một agent Strategist tư vấn, giải đáp, phân tích, lập bảng biểu/báo cáo và đề xuất phương án cho mọi vấn đề chiến lược kinh doanh: phân tích môi trường ngoài, năng lực nội bộ, chiến lược cạnh tranh, hướng tăng trưởng, đại dương xanh, thẻ điểm cân bằng, lập kế hoạch kịch bản và phân tích case study.
      source_material: |
        Các file markdown trong thư mục cha 1-strategic-management (01-phan-tich-moi-truong-ben-ngoai.md ... 08-CASE-STUDY-The-Coffee-House.md và các case tích hợp). Skill này tự đủ (self-contained): agent không cần đọc file markdown gốc để làm việc; markdown gốc chỉ để tham chiếu sâu thêm nếu có.
      portability: |
        Chỉ gồm YAML (+ 1 script Python tùy chọn). Copy nguyên thư mục strategic-agent-skill/ sang máy khác là dùng được. Không có đường dẫn tuyệt đối, không phụ thuộc phần mềm ngoài. Script kiểm tra cần python3 + pyyaml.
