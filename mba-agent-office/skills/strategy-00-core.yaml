  - id: "readme-conventions_for_calculation"
    title: "README bộ skill — conventions_for_calculation"
    tags: ["conventions_for_calculation"]
    text: |-
      expression_python: |
        Chiến lược ít công thức hơn tài chính; các công thức chính là thang chấm điểm có trọng số (weighted score), HHI/CR4, xác suất kịch bản, chỉ số BCG (thị phần tương đối), ma trận Ansoff/GE. expression_python dùng tên biến khớp mục variables; là mã tham chiếu, không nhất thiết eval một dòng.
      scoring_rule: |
        Mọi bảng chấm điểm framework phải hiển thị tiêu chí, thang điểm, trọng số (tổng trọng số = 100% hoặc 1,0) và phép nhân trọng số x điểm. Điểm là phán đoán có cơ sở, không phải số đo khách quan — luôn ghi nguồn bằng chứng và độ tin cậy.
      source_errors_note: |
        Khi hai nguồn mâu thuẫn, ưu tiên YAML (đã kiểm tính) hơn markdown gốc.
  - id: "readme-maintenance"
    title: "README bộ skill — maintenance"
    tags: ["maintenance"]
    text: |-
      validate: 'python3 tools/build_and_validate.py   # kiểm tra YAML, trùng id, sinh lại 06-formulas-index.yaml'
      update_rule: Sửa module trong modules/, rồi chạy lại script để cập nhật 06-formulas-index.yaml.
      data_quality_notes: |
        Mỗi case_lessons có data_reliability (verified/illustrative/unverified). Số liệu công ty thật (doanh thu, thị phần, số cửa hàng) và dữ kiện pháp lý/chính sách VN cần đối chiếu nguồn gốc trước khi dùng cho quyết định thật. Xem known_data_caveats trong 01-agent-profile.yaml.
  - id: "readme-how_to_bootstrap"
    title: "README bộ skill — how_to_bootstrap"
    tags: ["how_to_bootstrap"]
    text: |-
      step_1: Đọc toàn bộ file này.
      step_2: Đọc 01-agent-profile.yaml (vai trò Strategist, nguyên tắc, quy trình trả lời, nhãn độ tin cậy) — BẮT BUỘC tuân thủ.
      step_3: Đọc SCHEMA.yaml để hiểu cấu trúc các module (khóa frameworks, formulas, case_lessons...).
      step_4: Với mỗi yêu cầu của người dùng, dùng 02-decision-router.yaml để chọn module + playbook.
      step_5: Nạp module cần dùng trong modules/ (đọc đầy đủ), tra công thức/thang điểm ở 06-formulas-index.yaml, chạy playbook ở 03-playbooks.yaml.
      step_6: Trình bày kết quả theo 04-report-templates.yaml; tra thuật ngữ ở 05-glossary.yaml.
      note_on_context: |
        Nếu giới hạn ngữ cảnh chặt: luôn nạp 00, 01, 02; chỉ nạp thêm module liên quan (router chỉ ra tối đa 3-4 module cho mỗi tình huống). Yêu cầu mơ hồ thì dùng pb_clarify_request trước khi nạp module.
  - id: "readme-load_order"
