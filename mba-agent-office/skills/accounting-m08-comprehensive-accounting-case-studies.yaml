    title: "Ví dụ có lời giải: m08_we_transition — Bảng chuyển đổi VAS sang IFRS GreenPack (Case 2)"
    tags: ["ví", "dụ", "có", "lời", "giải", "m08_we_transition", "bảng", "chuyển", "đổi", "vas", "sang", "ifrs"]
    text: |-
      id: m08_we_transition
      title: Bảng chuyển đổi VAS sang IFRS GreenPack (Case 2)
      inputs:
        adj_revenue: -150
        adj_impair: -400
