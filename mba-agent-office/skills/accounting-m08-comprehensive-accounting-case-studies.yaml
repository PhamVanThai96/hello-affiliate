sections:
  - id: "m08-tong-quan"
    title: "Tổng quan m08"
    tags: ["m08", "cẩm", "nang", "case", "study", "kế", "toán", "tích", "hợp", "comprehensive", "accounting", "studies"]
    text: |-
      Cẩm nang case study kế toán tích hợp (Comprehensive Accounting Case Studies Manual) — module m08

      Mục đích: Tích hợp kế toán tài chính, quản trị, giá thành, ngân sách, chênh lệch và tỷ số vào 7 tình huống doanh nghiệp (F&B, sản xuất gọi vốn, bán lẻ thất bại, công nghệ chế tạo, xe điện, sữa, SME rang cà phê). Dạy chuỗi: bối cảnh -> số liệu -> tính từng bước -> diễn giải -> bài học, kèm kiểm tra nhất quán (Bảng cân đối cân, dòng tiền khớp tiền mặt, tổng phân bổ = tổng chi phí).

      Dùng khi:
      - Bài toán đa chiều cần phối hợp nhiều module kế toán (ví dụ vừa tính giá thành ABC vừa lập ngân sách tiền mặt vừa phân tích chênh lệch).
      - Cần phân bổ chi phí bộ phận hỗ trợ phục vụ lẫn nhau (trực tiếp / bậc thang / tương hỗ) hoặc giải hệ phương trình tương hỗ.
      - Chuyển báo cáo VAS sang IFRS, ghi nhận doanh thu đa cấu phần (IFRS 15), vốn hóa thuê (IFRS 16), vốn hóa R&D (IAS 38), kiểm tra suy giảm (IAS 36), thuế hoãn lại…
      - Chủ SME hỏi 'lãi mà sao cạn tiền' - cần dựng 3 báo cáo khớp nhau và giải thích dòng tiền.
      - Phát hiện dấu hiệu gian lận/che giấu số liệu (red flags): doanh thu ký gửi, thiếu dự phòng tồn kho, thuê ngoài bảng, thiếu báo cáo phân khúc, ngân sách lạc qua…
      - Cần sàng lọc nguy cơ phá sản (Altman Z') hoặc kiểm tra tính nhất quán của một bộ số liệu giả định.

      Nên nắm trước: - m01; - m02; - m03; - m04; - m05; - m06

      Module liên quan: - 'm01 - Kế toán tài chính: VAS/IFRS, ghi nhận doanh thu, thuê, nền của IFRS 15/16, IAS 2/12/36/37/38 (ở đây chỉ nêu ứng dụng số).' - 'm02 - Kế toán quản trị: CVP, hòa vốn, biên an toàn, DOL, đa sản phẩm (m02_weighted_cm_bep), Menu Engineering.' - 'm03 - Giá thành: Job costing, ABC, TDABC, chi phí chưa hấp thụ (m03_under_over_applied), phân bổ lại overhead.' - 'm04 - Ngân sách và dự báo: Master B…

      Công thức (tra chi tiết bằng skill_search("<id>")):
      - m08_reciprocal_allocation: Phân bổ chi phí hỗ trợ theo phương pháp tương hỗ
      - m08_stepdown_allocation: Phân bổ bậc thang và trực tiếp
      - m08_ifrs15_ssp_allocation: Phân bổ giá giao dịch theo giá bán độc lập (SSP)
      - m08_ifrs16_pv: Nợ thuê tài sản (PV các khoản thuê cố định)
      - m08_ias36_recoverable: Giá trị sử dụng, giá trị thu hồi và tổn thất tài sản
      - m08_altman_z: Altman Z' (doanh nghiệp sản xuất không niêm yết)
      - m08_deferred_tax_transition: Điều chỉnh chuyển đổi VAS sang IFRS kèm thuế hoãn lại
      - m08_nrv_provision: Dự phòng giảm giá hàng tồn kho theo NRV
      - m08_under_absorbed: Chi phí sản xuất chung chưa hấp thụ
      - m08_shadow_price: Giá bóng của nguồn lực nút cổ chai
      - m08_variable_consideration_revenue: Doanh thu thuần sau yếu tố biến đổi (trả hàng, thưởng, trưn…

      Kho tra cứu của module: Khái niệm 7, Công thức 11, frameworks 5, Quy trình 6, Quy tắc quyết định 16, Chuẩn so sánh 7, Lỗi thường gặp 13, Lưu ý SME Việt Nam 8, Bài học case 7, Ví dụ có lời giải 12, Câu hỏi luyện tập 12, Checklist 14, Mẫu Excel/Sheets 6. Tra bằng skill_search với từ khoá chủ đề (vd "ví dụ định khoản", "lỗi thường gặp khấu hao").
  - id: "m08-concepts-1"
    title: "Khái niệm: Tính nhất quán số liệu (kỷ luật Balance/Reconcile)"
    tags: ["khái", "niệm", "tính", "nhất", "quán", "số", "liệu", "kỷ", "luật", "balance", "reconcile"]
    text: |-
      term_vi: Tính nhất quán số liệu (kỷ luật Balance/Reconcile)
      term_en: Numerical consistency discipline
      definition: 'Mọi bộ số tự dựng phải tự khớp: Tài sản = Nợ + Vốn chủ; tiền cuối kỳ trên CFS = tiền trên Bảng cân đối; tổng chi phí phân bổ = tổng chi phí gốc; tổng chênh lệch thành phần = chênh lệch tổng; tổng lãi + giảm gốc nợ thuê = tổng tiền thuê.'
      why_it_matters: Bản cũ của cẩm nang có nhiều lỗi (CFS không khớp, ROE tính sai, bảng điều chỉnh không cân). Một lỗi cộng nhỏ trong hồ sơ gọi vốn làm mất uy tín. Agent luôn chạy lại bằng Python trước khi trình bày.
  - id: "m08-concepts-2"
    title: "Khái niệm: Đo lường lại thay vì dịch báo cáo (VAS -> IFRS)"
    tags: ["khái", "niệm", "đo", "lường", "lại", "thay", "vì", "dịch", "báo", "cáo", "vas", "ifrs"]
    text: |-
      term_vi: Đo lường lại thay vì dịch báo cáo (VAS -> IFRS)
      term_en: Re-measurement, not translation
      definition: VAS thiên về hình thức pháp lý/chứng từ/giá gốc; IFRS thiên về bản chất kinh tế (chuyển giao quyền kiểm soát, giá trị thu hồi, nghĩa vụ thuê). Chuyển đổi lần đầu (IFRS 1) điều chỉnh vào lợi nhuận giữ lại đầu kỳ, kèm thuế hoãn lại (IAS 12).
      why_it_matters: Nhà đầu tư ngoại đọc EBITDA, nợ ròng, ROE theo IFRS. Điều chỉnh làm lợi nhuận giữ lại giảm nhưng tránh bị hạ định giá khi thẩm định. Quy định áp dụng tại VN cần xác nhận hiện hành.
  - id: "m08-concepts-3"
    title: "Khái niệm: Giá trị có thể thu hồi (max của bán và dùng)"
    tags: ["khái", "niệm", "giá", "trị", "có", "thể", "thu", "hồi", "max", "của", "bán", "và"]
    text: |-
      term_vi: Giá trị có thể thu hồi (max của bán và dùng)
      term_en: Recoverable amount = max(FVLCD, VIU)
      definition: Số tiền cao hơn giữa giá trị hợp lý trừ chi phí thanh lý (bán) và giá trị sử dụng (PV dòng tiền tương lai). Tài sản/CGU không được ghi sổ cao hơn mức này.
      why_it_matters: 'Chủ sở hữu hợp lý chọn phương án có lợi hơn. Nếu FVLCD > VIU thì bán còn hơn dùng: tín hiệu chiến lược thanh lý/thuê ngoài, không chỉ là bút toán.'
  - id: "m08-concepts-4"
    title: "Khái niệm: Front-loading của IFRS 16"
    tags: ["khái", "niệm", "front", "loading", "của", "ifrs", "16"]
    text: |-
      term_vi: Front-loading của IFRS 16
      term_en: Lease expense front-loading
      definition: Chi phí thuê = khấu hao ROU (đều) + lãi trên dư nợ giảm dần, nên cao ở đầu hợp đồng và thấp ở cuối; tổng cả kỳ bằng tổng tiền thuê. EBITDA tăng đúng bằng tiền thuê, EBIT tăng ít hơn.
      why_it_matters: So sánh công ty đã/chưa áp IFRS 16 phải điều chỉnh tương thích (nợ ròng gồm nợ thuê, EV/EBITDA nhất quán). Ngoài bảng thuê = che đòn bẩy (Case 3).
  - id: "m08-concepts-5"
    title: "Khái niệm: Lãi kế toán khác tiền"
    tags: ["khái", "niệm", "lãi", "kế", "toán", "khác", "tiền"]
    text: |-
      term_vi: Lãi kế toán khác tiền
      term_en: Profit is not cash
      definition: Lợi nhuận bị giữ lại trong phải thu, tồn kho, TSCĐ; tiền còn chịu chia lợi tức và trả nợ. CFO = NI + D&A - ΔAR - ΔInv + ΔAP.
      why_it_matters: 'Case 7: lãi 220,8 triệu nhưng tiền giảm 150 -> 80,8. Chủ chỉ chia lợi tức từ dòng tiền tự do sau đầu tư và trả nợ, giữ quỹ đệm >= 1 tháng chi phí.'
  - id: "m08-concepts-6"
    title: "Khái niệm: Bù chéo ngầm giữa sản phẩm/điểm bán"
    tags: ["khái", "niệm", "bù", "chéo", "ngầm", "giữa", "sản", "phẩm", "điểm", "bán"]
    text: |-
      term_vi: Bù chéo ngầm giữa sản phẩm/điểm bán
      term_en: Hidden cross-subsidisation
      definition: Phân bổ cào bằng hoặc báo cáo hợp nhất che việc đơn hàng/điểm bán lãi đang nuôi đơn hàng/điểm bán lỗ.
      why_it_matters: 'GreenPack: Job X lãi 23,5% nuôi Y,Z (~10%); TechMart: 2 flagship +24 tỷ nuôi 8 showroom lỗ -28 tỷ. ABC và báo cáo phân khúc là thuốc chữa.'
  - id: "m08-concepts-7"
    title: "Khái niệm: Dấu hiệu cảnh báo kế toán"
    tags: ["khái", "niệm", "dấu", "hiệu", "cảnh", "báo", "kế", "toán"]
    text: |-
      term_vi: Dấu hiệu cảnh báo kế toán
      term_en: Accounting red flags (forensic)
      definition: CFO thấp hơn lợi nhuận kéo dài, DSO/DIO tăng, tồn kho cũ giữ giá gốc, hợp đồng thuê ngoài bảng, ngân sách lệch bất lợi nhiều kỳ không hành động.
      why_it_matters: TechMart không sụp vì thương mại điện tử đơn thuần mà vì hệ thống kế toán che điểm yếu. Phát hiện sớm bằng phép tính cụ thể.
  - id: "m08-formulas-1"
    title: "Công thức: m08_reciprocal_allocation — Phân bổ chi phí hỗ trợ theo phương pháp tương hỗ"
    tags: ["công", "thức", "m08_reciprocal_allocation", "phân", "bổ", "chi", "phí", "hỗ", "trợ", "theo", "phương", "pháp"]
    text: |-
      id: m08_reciprocal_allocation
      name_vi: Phân bổ chi phí hỗ trợ theo phương pháp tương hỗ
      name_en: Reciprocal method (linear algebra)
      expression_latex: S_i = C_i + \sum_j a_{ji} S_j \;\Rightarrow\; \mathbf{S} = (\mathbf{I}-\mathbf{A}^{T})^{-1}\mathbf{C}
      expression_python: np.linalg.solve(np.eye(n) - A.T, C)
      excel: =MMULT(MINVERSE(I - TRANSPOSE(A)), C)
      variables:
      - symbol: C_i
        meaning: chi phí gốc của bộ phận hỗ trợ i
        unit: VNĐ
      - symbol: a_ji
        meaning: tỷ lệ dịch vụ bộ phận j cấp cho i (hàng j, cột i; a_ii = 0)
        unit: tỷ lệ
      - symbol: S_i
        meaning: tổng chi phí sau khi tính phục vụ chéo
        unit: VNĐ
      when_to_use: Hai bộ phận hỗ trợ (kho - đội xe, IT - bảo trì) phục vụ lẫn nhau đáng kể (hơn khoảng 10%) và kết quả ảnh hưởng quyết định (thứ hạng kênh, giá thành).
      why_it_works: Chi phí A phụ thuộc chi phí B và ngược lại - vòng lặp vô hạn. Thay vì lặp tay, giải hệ phương trình một lần. Phần chuyển ra bộ phận sản xuất của i là (1 - tổng a_ij) x S_i; cộng lại phải bằng tổng chi phí gốc.
      assumptions:
      - Tỷ lệ dịch vụ ổn định và đo được
      - Chi phí gốc đã gom đúng bộ phận
      pitfalls:
      - Dùng I - A thay vì I - A chuyển vị (nhầm hàng/cột) cho hệ nghiệm sai - bản cũ của nguồn mắc lỗi này.
      - S1+S2+S3 lớn hơn tổng chi phí gốc (đếm hai lần phần qua lại); chỉ phần chuyển ra sản xuất mới vào giá thành.
      - 'Không dùng nếu dịch vụ lẫn nhau không đáng kể: tốn công mà kết quả gần như bậc thang.'
      interpretation: 'Chính xác duy nhất, không phụ thuộc thứ tự. Kiểm tra: tổng phân bổ cho sản xuất/kênh = tổng chi phí gốc.'
      example:
        inputs:
          C:
          - 600
          - 400
          K_to_X: 0.2
          X_to_K: 0.1
          K_to_GT: 0.5
          K_to_MT: 0.3
          X_to_GT: 0.4
          X_to_MT: 0.5
        steps:
        - K = 600 + 0,10 X; X = 400 + 0,20 K -> K = 640/0,98 = 653,06; X = 530,61
        - GT = 0,5x653,06 + 0,4x530,61 = 538,78; MT = 0,3x653,06 + 0,5x530,61 = 461,22
        result: Tổng 1.000 khớp 600+400; GT 538,78 và MT 461,22 (triệu VNĐ).
  - id: "m08-formulas-2"
    title: "Công thức: m08_stepdown_allocation — Phân bổ bậc thang và trực tiếp"
    tags: ["công", "thức", "m08_stepdown_allocation", "phân", "bổ", "bậc", "thang", "và", "trực", "tiếp"]
    text: |-
      id: m08_stepdown_allocation
      name_vi: Phân bổ bậc thang và trực tiếp
      name_en: Step-down and direct allocation
      expression_latex: Alloc_{j\to i}=Cost_j\times share_{ji}; \quad direct:\; share_{ji}/\sum_{i\in prod}share_{ji}
      expression_python: cost_j * share_ji
      excel: =B2*C2
      variables:
      - symbol: Cost_j
        meaning: chi phí bộ phận j (đã cộng phần nhận từ bộ phận trước)
        unit: VNĐ
      - symbol: share_ji
        meaning: tỷ lệ dịch vụ j cấp cho i
        unit: tỷ lệ
      when_to_use: 'Cần cách gần đúng đơn giản: trực tiếp (bỏ qua phục vụ lẫn nhau), bậc thang (một chiều, bộ phận đã đóng sổ không nhận lại).'
      why_it_works: Bậc thang ghi nhận một phần phục vụ lẫn nhau. Xếp bộ phận phục vụ nhiều bộ phận hỗ trợ khác nhất lên trước để giảm sai lệch.
      assumptions:
      - Thứ tự phân bổ cố định
      pitfalls:
      - Đổi thứ tự cho kết quả khác
      - Thứ hạng lợi nhuận hai kênh có thể đảo chiều giữa 3 phương pháp (Case 6)
      interpretation: Dùng so sánh độ nhạy với phương pháp tương hỗ; chênh nhỏ thì chấp nhận bậc thang.
      example:
        inputs:
          S1: 160
          S2: 240
          S1_share:
          - 0.2
          - 0.5
          - 0.3
          S2_share_to_P:
          - 0.6
          - 0.3
        steps:
        - S1 160 -> S2 32, P1 80, P2 48; S2 = 240 + 32 = 272 -> P1 181,33, P2 90,67
        result: P1 261,33; P2 138,67 (tổng 400). Tương hỗ cùng dữ liệu cho P1 260,41; P2 139,59.
  - id: "m08-formulas-3"
    title: "Công thức: m08_ifrs15_ssp_allocation — Phân bổ giá giao dịch theo giá bán độc lập (SSP)"
    tags: ["công", "thức", "m08_ifrs15_ssp_allocation", "phân", "bổ", "giá", "giao", "dịch", "theo", "bán", "độc", "lập"]
    text: |-
      id: m08_ifrs15_ssp_allocation
      name_vi: Phân bổ giá giao dịch theo giá bán độc lập (SSP)
      name_en: IFRS 15 transaction price allocation by relative SSP
      expression_latex: Rev_i = Price \times \frac{SSP_i}{\sum_k SSP_k}
      expression_python: price * ssp_i / sum(ssp)
      excel: =Price*SSP_i/SUM(SSP)
      variables:
      - symbol: Price
        meaning: giá giao dịch của hợp đồng gói
        unit: VNĐ
      - symbol: SSP_i
        meaning: giá bán độc lập của nghĩa vụ thực hiện i
        unit: VNĐ
      when_to_use: Hợp đồng gói gồm phần cứng giao ngay + phần mềm/bảo trì nhiều năm.
      why_it_works: Nếu không phân bổ theo SSP, toàn bộ chiết khấu gói dồn vào một nghĩa vụ; ghi 100% khi giao phần cứng kéo doanh thu tương lai về hiện tại, năm đầu phình năm sau rỗng.
      assumptions:
      - Các cấu phần tách biệt được
      - SSP quan sát/ước tính tin cậy
      pitfalls:
      - Phần dịch vụ phải ghi theo thời gian (đường thẳng), không ghi một lần
      - Quên doanh thu chưa thực hiện (contract liability) trên bảng cân đối
      interpretation: Năm 1 = phần cứng + 1/3 dịch vụ; phần còn lại là Deferred Revenue.
      example:
        inputs:
          price: 100
          ssp:
          - 60
          - 30
          - 30
        steps:
        - HW 50; SW 25; MT 25
        - Năm 1 = 50 + 8,33 + 8,33 = 66,67; chưa thực hiện 33,33
        result: Doanh thu 66,67 / 16,67 / 16,67 (triệu VNĐ).
  - id: "m08-formulas-4"
    title: "Công thức: m08_ifrs16_pv — Nợ thuê tài sản (PV các khoản thuê cố định)"
    tags: ["công", "thức", "m08_ifrs16_pv", "nợ", "thuê", "tài", "sản", "pv", "các", "khoản", "cố", "định"]
    text: |-
      id: m08_ifrs16_pv
      name_vi: Nợ thuê tài sản (PV các khoản thuê cố định)
      name_en: IFRS 16 lease liability PV (level and growing)
      expression_latex: PV = PMT\frac{1-(1+r)^{-n}}{r} \;;\; PV_g = PMT_1\frac{1-\left(\frac{1+g}{1+r}\right)^{n}}{r-g}
      expression_python: 'pmt*(1-(1+r)**-n)/r  # tăng g: pmt1*(1-((1+g)/(1+r))**n)/(r-g)'
      excel: =PV(r,n,-PMT)
      variables:
      - symbol: PMT
        meaning: tiền thuê cố định mỗi kỳ (cuối kỳ)
        unit: tiền tệ
      - symbol: r
        meaning: lãi suất vay cận biên (IBR)
        unit: '%/năm'
      - symbol: g
        meaning: tăng cố định hằng năm của tiền thuê
        unit: '%/năm'
      - symbol: n
        meaning: số năm
        unit: năm
      when_to_use: Thuê dài hạn không hủy ngang (nhà xưởng, showroom, đội xe).
      why_it_works: Cam kết thuê là nghĩa vụ trả tiền cố định giống khoản vay; nợ = PV các khoản phải trả, ROU = nợ ban đầu (giả định không chi phí trực tiếp/ưu đãi).
      assumptions:
      - Trả cuối kỳ
      - Khoản tăng theo CPI chỉ tính theo chỉ số tại ngày bắt đầu (phần biến động sau là biến phí)
      pitfalls:
      - Dùng lãi vay nhầm IBR
      - 'Quên nợ thuê khi tính D/E (Case 3: 2,0 -> 2,92)'
      interpretation: Nợ tăng ngay khi ký; EBITDA tăng bằng tiền thuê; EBIT tăng ít.
      example:
        inputs:
          pmt: 150
          r: 0.1
          n: 5
        steps:
        - PV = 150 x 3,7908 = 568,62
        - KH ROU = 113,72/năm; lãi năm 1 = 56,86; chi phí P&L năm 1 = 170,59
        result: Nợ thuê 568,62 triệu; chi phí năm 1 170,59 so với 150 tiền thuê.
  - id: "m08-formulas-5"
    title: "Công thức: m08_ias36_recoverable — Giá trị sử dụng, giá trị thu hồi và tổn thất tài sản"
    tags: ["công", "thức", "m08_ias36_recoverable", "giá", "trị", "sử", "dụng", "thu", "hồi", "và", "tổn", "thất"]
    text: |-
      id: m08_ias36_recoverable
      name_vi: Giá trị sử dụng, giá trị thu hồi và tổn thất tài sản
      name_en: VIU, recoverable amount and impairment loss
      expression_latex: VIU=\sum_t \frac{FCF_t}{(1+r)^t}+\frac{FCF_n(1+g)}{(r-g)(1+r)^n};\; RA=\max(FVLCD,VIU);\; Loss=CA-RA
      expression_python: max(fvlcd, viu); loss = max(0, carrying - max(fvlcd, viu))
      excel: =NPV(r,FCF)+TV/(1+r)^n
      variables:
      - symbol: FCF_t
        meaning: dòng tiền dự kiến của CGU
        unit: tiền tệ
      - symbol: r
        meaning: tỷ suất chiết khấu (IAS 36 yêu cầu nhất quán trước thuế)
        unit: '%'
      - symbol: g
        meaning: tăng trưởng dài hạn
        unit: '%'
      - symbol: CA
        meaning: giá trị ghi sổ của CGU
        unit: tiền tệ
      when_to_use: Có dấu hiệu suy giảm (công suất giảm, thị trường xấu) hoặc kiểm tra goodwill hằng năm.
      why_it_works: Tài sản không được cao hơn số tiền thu về được; chọn phương án có lợi hơn (bán hoặc dùng). Kiểm tra theo CGU vì dòng tiền chỉ phát sinh khi tài sản hoạt động cùng nhau.
      assumptions:
      - Dòng tiền và tỷ suất cùng cơ sở thuế
      - TV theo Gordon
      pitfalls:
      - Không 'ấn định' VIU - phải tái lập được từ dòng tiền (bản cũ nguồn mắc lỗi).
      - 'TV chiếm 61% VIU: rất nhạy với g và r, phải chạy dải kịch bản.'
      - Goodwill đã ghi giảm không được hoàn nhập; tài sản khác có thể hoàn nhập.
      - 'Nguồn gọi dòng tiền là ''tự do'' nhưng không nêu rõ trước/sau thuế: cần xác nhận.'
      interpretation: Tổn thất phân bổ goodwill trước, phần còn lại theo tỷ lệ giá trị ghi sổ. FVLCD > VIU nghĩa là nên xem xét thanh lý.
      example:
        inputs:
          fcf:
          - 300
          - 320
          - 340
          - 350
          - 360
          g: 0.01
          r: 0.12
          fvlcd: 3200
          carrying: 4500
        steps:
        - PV(1-5) = 1.191,67; TV = 3.305,45; PV(TV) = 1.875,60
        - VIU = 3.067,27; RA = max(3.200; 3.067,27) = 3.200; tổn thất 1.300
        result: Goodwill -300; máy móc -714,29; nhà xưởng -285,71 (tỷ VNĐ).
  - id: "m08-formulas-6"
    title: "Công thức: m08_altman_z — Altman Z' (doanh nghiệp sản xuất không niêm yết)"
    tags: ["công", "thức", "m08_altman_z", "altman", "doanh", "nghiệp", "sản", "xuất", "không", "niêm", "yết"]
    text: |-
      id: m08_altman_z
      name_vi: Altman Z' (doanh nghiệp sản xuất không niêm yết)
      name_en: Altman Z-Score (Z' variant)
      expression_latex: Z' = 0.717X_1 + 0.847X_2 + 3.107X_3 + 0.420X_4 + 0.998X_5
      expression_python: 0.717*x1 + 0.847*x2 + 3.107*x3 + 0.420*x4 + 0.998*x5
      excel: =0.717*X1+0.847*X2+3.107*X3+0.42*X4+0.998*X5
      variables:
      - symbol: X1
        meaning: vốn lưu động / tổng tài sản
        unit: tỷ lệ
      - symbol: X2
        meaning: lợi nhuận giữ lại / tổng tài sản
        unit: tỷ lệ
      - symbol: X3
        meaning: EBIT / tổng tài sản
        unit: tỷ lệ
      - symbol: X4
        meaning: vốn chủ sổ sách / nợ phải trả
        unit: tỷ lệ
      - symbol: X5
        meaning: doanh thu / tổng tài sản
        unit: lần
      when_to_use: Sàng lọc nhanh rủi ro phá sản doanh nghiệp sản xuất không niêm yết.
      why_it_works: Edward Altman (1968) dùng phân tích phân biệt trên doanh nghiệp phá sản và không phá sản để gán trọng số cho 5 tỷ số thanh khoản, tích lũy, sinh lời, đòn bẩy, hoạt động. Hệ số và ngưỡng cần đối chiếu nguồn.
      assumptions:
      - Đúng mô hình theo ngành (bán lẻ/dịch vụ dùng bản khác)
      pitfalls:
      - Chỉ là công cụ sàng lọc, không thay phân tích dòng tiền
      - Nguồn dùng số TechMart 2022 tự đặt (vốn lưu động -30, RE -40, EBIT -10) không truy ra từ số Case 3
      interpretation: Z' < 1,23 vùng nguy hiểm; 1,23-2,90 vùng xám; > 2,90 an toàn.
      example:
        inputs:
          x1: -0.09
          x2: -0.12
          x3: -0.03
          x4: 0.286
          x5: 0.9
        steps:
        - 'Đóng góp: -0,065; -0,102; -0,093; 0,120; 0,898'
        result: Z' = 0,759 < 1,23 -> vùng nguy hiểm.
  - id: "m08-formulas-7"
    title: "Công thức: m08_deferred_tax_transition — Điều chỉnh chuyển đổi VAS sang IFRS kèm thuế hoãn lại"
    tags: ["công", "thức", "m08_deferred_tax_transition", "điều", "chỉnh", "chuyển", "đổi", "vas", "sang", "ifrs", "kèm", "thuế"]
    text: |-
      id: m08_deferred_tax_transition
      name_vi: Điều chỉnh chuyển đổi VAS sang IFRS kèm thuế hoãn lại
      name_en: VAS-to-IFRS transition adjustment with deferred tax
      expression_latex: DTA = t \times \sum \text{pre-tax deductible differences};\; \Delta RE = \sum adj_{pre\text{-}tax} + DTA
      expression_python: dta = t*sum(diffs); d_re = sum(adj) + dta
      excel: =t*SUM(diffs)
      variables:
      - symbol: t
        meaning: thuế suất thuế TNDN (giả định 20%)
        unit: '%'
      - symbol: diffs
        meaning: các chênh lệch tạm thời được khấu trừ trước thuế
        unit: tiền tệ
      when_to_use: Chuyển lần đầu sang IFRS (IFRS 1) hoặc lập bảng đối chiếu VAS-IFRS.
      why_it_works: Mỗi điều chỉnh làm thay đổi tài sản/nợ nhưng cơ sở tính thuế giữ nguyên, tạo chênh lệch tạm thời. Điều chỉnh vào lợi nhuận giữ lại đầu kỳ và kiểm tra phần điều chỉnh tự cân.
      assumptions:
      - Chênh lệch đều được khấu trừ
      - Có lợi nhuận tính thuế tương lai để thu hồi DTA
      pitfalls:
      - Điều chỉnh thuê (ROU = nợ thuê) không đổi lợi nhuận giữ lại ngày đầu
      - Bản cũ ghi -320 sai; đúng là -440
      interpretation: Tăng tài sản điều chỉnh = tăng nợ điều chỉnh + thay đổi vốn chủ.
      example:
        inputs:
          adj:
          - -150
          - -400
          t: 0.2
        steps:
        - DTA = 0,2 x 550 = 110
        - Delta RE = -150 - 400 + 110 = -440; LN giữ lại 3.500 -> 3.060
        result: Tài sản +1.479,7 = nợ +1.919,7 - 440 (khớp).
  - id: "m08-formulas-8"
    title: "Công thức: m08_nrv_provision — Dự phòng giảm giá hàng tồn kho theo NRV"
    tags: ["công", "thức", "m08_nrv_provision", "dự", "phòng", "giảm", "giá", "hàng", "tồn", "kho", "theo", "nrv"]
    text: |-
      id: m08_nrv_provision
      name_vi: Dự phòng giảm giá hàng tồn kho theo NRV
      name_en: Inventory write-down to net realisable value
      expression_latex: NRV = P_{est} - C_{sell};\; Provision = \max(0, Cost - NRV);\; \Delta NI = Provision(1-t)
      expression_python: prov = max(0, cost - (price_est - sell_cost)); d_ni = prov*(1-t)
      excel: =MAX(0,Cost-(Price-SellCost))
      variables:
      - symbol: Cost
        meaning: giá gốc lô hàng
        unit: tiền tệ
      - symbol: P_est
        meaning: giá bán ước tính
        unit: tiền tệ
      - symbol: C_sell
        meaning: chi phí bán ước tính
        unit: tiền tệ
      when_to_use: Hàng điện tử/thời trang lỗi mốt, tồn kho cũ.
      why_it_works: 'Thận trọng: tồn kho ghi theo giá thấp hơn giữa giá gốc và NRV; giữ giá gốc là chuyển khoản lỗ chưa thừa nhận sang tương lai.'
      assumptions:
      - Giá bán ước tính đáng tin cậy
      pitfalls:
      - Dồn lỗ vào một kỳ khi bị buộc xả kho
      interpretation: Theo dõi inventory ageing, DIO tăng.
      example:
        inputs:
          cost: 36
          price_est: 16
          sell_cost: 1.6
          t: 0.2
        steps:
        - NRV = 14,4; dự phòng 21,6; sau thuế 17,28
        result: LNST báo cáo 38,4 chỉ còn 21,12 (-45%).
  - id: "m08-formulas-9"
    title: "Công thức: m08_under_absorbed — Chi phí sản xuất chung chưa hấp thụ"
    tags: ["công", "thức", "m08_under_absorbed", "chi", "phí", "sản", "xuất", "chung", "chưa", "hấp", "thụ"]
    text: |-
      id: m08_under_absorbed
      name_vi: Chi phí sản xuất chung chưa hấp thụ
      name_en: Under-absorbed fixed overhead (normal capacity)
      expression_latex: SR = \frac{F}{Q_{normal}};\; Absorbed=Q_{act}\times SR;\; Under = F - Absorbed
      expression_python: under = f - q_act*(f/q_normal)
      excel: =F-Qact*(F/Qnormal)
      variables:
      - symbol: F
        meaning: định phí sản xuất chung
        unit: VNĐ
      - symbol: Q_normal
        meaning: công suất bình thường
        unit: đơn vị
      - symbol: Q_act
        meaning: sản lượng thực tế
        unit: đơn vị
      when_to_use: Công suất thực tế thấp hơn bình thường.
      why_it_works: 'IAS 2: định phí phân bổ theo công suất bình thường; phần chưa hấp thụ vào giá vốn kỳ này, không biến công suất nhàn rỗi thành tài sản tồn kho. Sản lượng vượt bình thường: giảm đơn giá để không vượt chi phí thực tế. Xem thêm m03_under_over_applied.'
      assumptions:
      - Công suất bình thường xác định hợp lý
      pitfalls:
      - Dồn hết định phí vào ít sản phẩm làm giá thành và tồn kho phình
      interpretation: Chưa hấp thụ là chi phí công suất nhàn rỗi.
      example:
        inputs:
          f: 500000000
          q_normal: 10000
          q_act: 8000
        steps:
        - SR = 50.000; hấp thụ 400 triệu; chưa hấp thụ 100 triệu (20%)
        result: Nợ 154 400 triệu; Nợ 632 100 triệu; Có 627 500 triệu (tài khoản tham chiếu, cần xác nhận).
  - id: "m08-formulas-10"
    title: "Công thức: m08_shadow_price — Giá bóng của nguồn lực nút cổ chai"
    tags: ["công", "thức", "m08_shadow_price", "giá", "bóng", "của", "nguồn", "lực", "nút", "cổ", "chai"]
    text: |-
      id: m08_shadow_price
      name_vi: Giá bóng của nguồn lực nút cổ chai
      name_en: Shadow price / contribution per bottleneck hour
      expression_latex: CM/\text{giờ máy}=\frac{CM_i}{h_i};\; \text{xếp ưu tiên giảm dần}; \; \lambda=\frac{CM}{h}\text{ của SP cận biên}
      expression_python: cm_i / hours_i
      excel: =CM/Hours
      variables:
      - symbol: CM_i
        meaning: biên đóng góp đơn vị sản phẩm i
        unit: VNĐ
      - symbol: h_i
        meaning: giờ máy nút cổ chai mỗi đơn vị
        unit: giờ
      when_to_use: Công suất một hoạt động bị giới hạn, chọn cơ cấu sản phẩm tối đa hóa lợi nhuận (LP trong ABC).
      why_it_works: Khi một nguồn lực khan hiếm, sản phẩm xếp theo CM trên đơn vị nguồn lực; giá bóng là mức tối đa nên trả để có thêm một đơn vị nguồn lực.
      assumptions:
      - Cầu tối đa mỗi sản phẩm biết trước
      - Tuyến tính
      pitfalls:
      - Xếp theo CM/đơn vị thay vì CM/giờ máy
      interpretation: Đơn hàng dùng nhiều giờ nút cổ chai phải có giá bù được giá bóng.
      example:
        inputs:
          A:
            cm: 500
            h: 0.1
            max: 600
          B:
            cm: 1200
            h: 0.4
            max: 300
          cap: 100
        steps:
        - A 5.000/giờ; B 3.000/giờ
        - Làm 600 A (60 giờ), còn 40 giờ -> 100 B
        - CM = 300.000 + 120.000 = 420.000
        result: Giá bóng = 3.000 VNĐ/giờ máy.
  - id: "m08-formulas-11"
    title: "Công thức: m08_variable_consideration_revenue — Doanh thu thuần sau yếu tố biến đổi (trả hàng, thưởng, trưng bày)"
    tags: ["công", "thức", "m08_variable_consideration_revenue", "doanh", "thu", "thuần", "sau", "yếu", "tố", "biến", "đổi", "trả"]
    text: |-
      id: m08_variable_consideration_revenue
      name_vi: Doanh thu thuần sau yếu tố biến đổi (trả hàng, thưởng, trưng bày)
      name_en: IFRS 15 net revenue after variable consideration
      expression_latex: Rev = Invoice - Returns - Rebates - Slotting;\; COGS = Cost(1-ret\%)
      expression_python: rev = invoice - returns - rebates - slotting
      excel: =Invoice-Returns-Rebates-Slotting
      variables:
      - symbol: Invoice
        meaning: giá hóa đơn
        unit: VNĐ
      - symbol: Returns
        meaning: ước tính trả hàng (refund liability)
        unit: VNĐ
      - symbol: Rebates
        meaning: chiết khấu thưởng doanh số ước tính
        unit: VNĐ
      - symbol: Slotting
        meaning: phí trưng bày coi như giảm giá (nếu không đổi lấy dịch vụ riêng)
        unit: VNĐ
      when_to_use: Bán qua siêu thị/đại lý có quyền trả hàng và chiết khấu theo doanh số.
      why_it_works: Doanh thu là số tiền kỳ vọng nhận được; ghi 100% rồi đảo ngược làm nhiễu lợi nhuận. Hàng có thể trả ghi thêm quyền thu hồi hàng bằng giá vốn.
      assumptions:
      - Ước tính trả hàng từ lịch sử
      pitfalls:
      - Ước tính sai tạo giải phóng dự phòng hoặc điều chỉnh giảm kỳ sau
      interpretation: Biên gộp thực thấp hơn biên trên hóa đơn (36,7% so với 40%).
      example:
        inputs:
          invoice: 10000
          cost: 6000
          ret_est: 500
          rebate: 200
          slot: 300
          ret_actual: 300
        steps:
        - Ban đầu 9.000; giải phóng 200 -> 9.200
        - Giá vốn 5.700 + 120 = 5.820
        result: LN gộp 3.380 (36,7%); tiền thuần 9.200 khớp doanh thu.
  - id: "m08-frameworks-1"
    title: "Frameworks: m08_consistency_framework — Khung kiểm tra nhất quán số liệu kế toán"
    tags: ["frameworks", "m08_consistency_framework", "khung", "kiểm", "tra", "nhất", "quán", "số", "liệu", "kế", "toán"]
    text: |-
      id: m08_consistency_framework
      name_vi: Khung kiểm tra nhất quán số liệu kế toán
      name_en: Numerical consistency framework
      origin: 'Đúc kết từ các lỗi của bản cũ cẩm nang (CFS không khớp, ROE sai, bảng điều chỉnh không cân, PV lệch). Yêu cầu của CLAUDE.md: mọi số tự dựng phải chạy Python.'
      components:
      - 'Cân đối: A = L + E'
      - 'Khớp tiền: CFS = BS'
      - Bảo toàn phân bổ
      - Tổng chênh lệch thành phần = tổng
      - Lịch trả nợ về 0
      when_to_use: Trước khi trình bày bất kỳ case/hồ sơ nào.
      how_to_apply:
      - Dựng số bằng Python, không tính nhẩm.
      - Kiểm tra từng đẳng thức ở trên.
      - Ghi 'giả định minh họa' cho số tự đặt; 'cần đối chiếu nguồn' cho số công ty thật.
      how_to_read_results: Mọi đẳng thức phải khớp (sai số làm tròn dưới 1 đơn vị).
      pitfalls:
      - Chỉ tin vào tính nhẩm
      - Quên kiểm tra phần điều chỉnh chuyển đổi cũng phải cân
      example: 'Case 7: tài sản 970,8 = nguồn vốn 970,8; tiền cuối 80,8 trên cả CFS lẫn BS.'
  - id: "m08-frameworks-2"
    title: "Frameworks: m08_ifrs_standard_map — Bản đồ chuẩn mực trong cẩm nang"
    tags: ["frameworks", "m08_ifrs_standard_map", "bản", "đồ", "chuẩn", "mực", "trong", "cẩm", "nang"]
    text: |-
      id: m08_ifrs_standard_map
      name_vi: Bản đồ chuẩn mực trong cẩm nang
      name_en: Standards map (IFRS 15/16, IAS 2/12/36/37/38)
      origin: 'IFRS 15 (IASB 2014, hiệu lực 2018); IFRS 16 (2016, hiệu lực 2019); IAS 36, IAS 38, IAS 2, IAS 12, IAS 37. Áp dụng tại VN theo lộ trình IFRS/VAS: cần xác nhận hiện hành.'
      components:
      - 'IFRS 15: 5 bước, phân bổ theo SSP, yếu tố biến đổi.'
      - 'IFRS 16: ROU + nợ thuê, chi phí = KH + lãi.'
      - 'IAS 36: so sánh ghi sổ với giá trị thu hồi.'
      - 'IAS 38: nghiên cứu ghi chi phí; phát triển vốn hóa nếu đủ 6 điều kiện.'
      - 'IAS 2: giá thấp hơn của giá gốc và NRV; định phí theo công suất bình thường.'
      - 'IAS 12: thuế hoãn lại.'
      - 'IAS 37: dự phòng khi có nghĩa vụ hiện tại đáng tin cậy.'
      when_to_use: Khi chuẩn bị báo cáo cho nhà đầu tư/IPO hoặc đọc báo cáo IFRS.
      how_to_apply:
      - Xác định giao dịch thuộc chuẩn mực nào.
      - Đo lường theo chuẩn, lập bút toán.
      - Đối chiếu với sổ VAS (dual ledger) nếu cần.
      how_to_read_results: EBITDA IFRS 16 cao hơn nhưng nợ ròng gồm nợ thuê; tổn thất tài sản là khoản không tiền.
      pitfalls:
      - Dùng VAS 19 cho chi phí phát triển (VAS 19 là hợp đồng bảo hiểm; liên quan là VAS 04)
      - Bắt buộc/không bắt buộc áp dụng tại VN cần kiểm tra
      example: 'Case 5: R&D 500 tỷ = 200 chi phí + 300 vốn hóa (KH 60 tỷ/năm).'
  - id: "m08-frameworks-3"
    title: "Frameworks: m08_ias38_six_conditions — 6 điều kiện vốn hóa chi phí phát triển (IAS 38)"
    tags: ["frameworks", "m08_ias38_six_conditions", "điều", "kiện", "vốn", "hóa", "chi", "phí", "phát", "triển", "ias", "38"]
    text: |-
      id: m08_ias38_six_conditions
      name_vi: 6 điều kiện vốn hóa chi phí phát triển (IAS 38)
      name_en: IAS 38 development cost capitalisation criteria
      origin: IAS 38 phân biệt nghiên cứu (chưa chắc có lợi ích) và phát triển (đã áp dụng kiến thức vào thiết kế cụ thể), để ghép chi phí với doanh thu (matching).
      components:
      - Khả thi kỹ thuật
      - Ý định hoàn thành
      - Khả năng dùng/bán
      - Chứng minh lợi ích kinh tế tương lai
      - Đủ nguồn lực hoàn tất
      - Đo lường đáng tin cậy chi phí
      when_to_use: Doanh nghiệp công nghệ/chế tạo có R&D lớn.
      how_to_apply:
      - Phân tách chi phí theo giai đoạn
      - Kiểm 6 điều kiện, lưu bằng chứng
      - Vốn hóa vào XDCB dở dang, nghiệm thu thì chuyển TSCĐ vô hình, khấu hao
      how_to_read_results: Theo dõi tỷ lệ R&D vốn hóa / tổng R&D; tăng bất thường là cờ đỏ vốn hóa quá tay.
      pitfalls:
      - Vốn hóa quá tay để làm đẹp lợi nhuận
      - Thiếu bằng chứng đủ 6 điều kiện
      example: Ghi chi phí 200; vốn hóa 300; 3 tháng đầu lợi nhuận giảm 200 + 15 = 215 thay vì 500; tài sản vô hình 285.
  - id: "m08-frameworks-4"
    title: "Frameworks: m08_dual_ledger — Hệ thống sổ đôi song song VAS/IFRS"
    tags: ["frameworks", "m08_dual_ledger", "hệ", "thống", "sổ", "đôi", "song", "vas", "ifrs"]
    text: |-
      id: m08_dual_ledger
      name_vi: Hệ thống sổ đôi song song VAS/IFRS
      name_en: Dual-ledger (parallel ledgers)
      origin: ERP hiện đại ghi một giao dịch gốc, hai cách đo lường, để tránh làm lại cuối năm.
      components:
      - Giao dịch gốc
      - Sổ VAS (Thông tư 200 - cần xác nhận)
      - Sổ IFRS
      - Bảng đối chiếu hằng tháng
      when_to_use: Tập đoàn có cổ đông ngoại hoặc chuẩn bị IPO.
      how_to_apply:
      - Cấu hình hai ledger
      - Ghi giao dịch một lần
      - Đối chiếu hằng tháng chênh lệch và nguồn gốc
      how_to_read_results: 'Ví dụ: VAS 10.000 so với IFRS 9.000 = trả hàng 500 + thưởng 200 + trưng bày 300.'
      pitfalls:
      - Dữ liệu gốc bẩn
      - Cấu hình sai chính sách
      example: Case 6 phase 3 và phụ lục H (Universal Journal ACDOCA).
  - id: "m08-frameworks-5"
    title: "Frameworks: m08_sustainability_eabc — Kế toán bền vững và chi phí môi trường (E-ABC)"
    tags: ["frameworks", "m08_sustainability_eabc", "kế", "toán", "bền", "vững", "và", "chi", "phí", "môi", "trường", "abc"]
    text: |-
      id: m08_sustainability_eabc
      name_vi: Kế toán bền vững và chi phí môi trường (E-ABC)
      name_en: Sustainability accounting / environmental ABC
      origin: 'Nhà đầu tư và đối tác xuất khẩu yêu cầu ESG (GRI, ISSB IFRS S1/S2; CBAM của EU). Lộ trình áp dụng tại VN: cần đối chiếu.'
      components:
      - Nhóm hoạt động môi trường (khí thải, nước thải, bao bì)
      - 'Động lực: kg CO2e, m3 nước thải, kg nhựa'
      - Dự phòng IAS 37 nếu có nghĩa vụ hiện tại
      when_to_use: Doanh nghiệp xuất khẩu hoặc sản phẩm có chi phí môi trường đáng kể.
      how_to_apply:
      - Tách chi phí môi trường khỏi chi phí chung
      - Phân bổ theo động lực
      - Đánh giá điều kiện ghi nhận dự phòng
      how_to_read_results: Sản phẩm bao bì nhựa một lần gánh chi phí cao hơn bao bì sinh học.
      pitfalls:
      - Ghi dự phòng khi chưa có nghĩa vụ hiện tại đáng tin cậy
      - Dùng số minh họa 120 triệu như thật
      example: 'Bút toán minh họa: Nợ chi phí chứng chỉ carbon 120 triệu; Có dự phòng phải trả 120 triệu (nếu đủ điều kiện).'
  - id: "m08-procedures-1"
    title: "Quy trình: m08_proc_ledger_build — Dựng ba báo cáo khớp nhau cho SME"
    tags: ["quy", "trình", "m08_proc_ledger_build", "dựng", "ba", "báo", "cáo", "khớp", "nhau", "cho", "sme"]
    text: |-
      id: m08_proc_ledger_build
      name: Dựng ba báo cáo khớp nhau cho SME
      steps:
      - Lấy BS đầu kỳ (cân), P&L năm, các giao dịch lớn (mua TSCĐ, trả nợ, chia lợi tức), số dư cuối kỳ của phải thu, tồn kho, phải trả.
      - CFO = NI + D&A - ΔAR - ΔInv + ΔAP; CFI = -mua TSCĐ; CFF = -trả nợ - chia lợi tức.
      - Tiền cuối = tiền đầu + CFO + CFI + CFF.
      - 'BS cuối: TSCĐ = đầu + mua - KH; vay = đầu - trả; LN giữ lại = đầu + LNST - cổ tức.'
      - Kiểm tra A = L + E và tiền BS = tiền CFS; sau đó tính thanh toán, DSO/DIO/DPO/CCC, DuPont.
      outputs: BS, P&L, CFS khớp + giải thích tiền đi đâu + 3 hành động quản trị.
  - id: "m08-procedures-2"
    title: "Quy trình: m08_proc_ifrs_transition — Chuyển đổi VAS sang IFRS"
    tags: ["quy", "trình", "m08_proc_ifrs_transition", "chuyển", "đổi", "vas", "sang", "ifrs"]
    text: |-
      id: m08_proc_ifrs_transition
      name: Chuyển đổi VAS sang IFRS
      steps:
      - 'Liệt kê các khoản đo lường khác nhau: doanh thu chưa chuyển giao, tài sản suy giảm, thuê dài hạn, hoãn thuế.'
      - Lập bút toán điều chỉnh từng khoản vào lợi nhuận giữ lại đầu kỳ.
      - Tính PV nợ thuê bằng IBR (ROU = nợ thuê).
      - Tính DTA = thuế suất x chênh lệch được khấu trừ.
      - Lập bảng chuyển đổi VAS - Điều chỉnh - IFRS; kiểm tra phần điều chỉnh cân.
      - Xác nhận các điểm VAS/Thông tư 200 với kế toán trưởng/kiểm toán.
      outputs: Bảng chuyển đổi và nhận xét ảnh hưởng EBITDA, nợ ròng, vốn chủ.
  - id: "m08-procedures-3"
    title: "Quy trình: m08_proc_job_abc_margin — Giá thành đơn hàng ABC và lợi nhuận từng đơn"
    tags: ["quy", "trình", "m08_proc_job_abc_margin", "giá", "thành", "đơn", "hàng", "abc", "và", "lợi", "nhuận", "từng"]
    text: |-
      id: m08_proc_job_abc_margin
      name: Giá thành đơn hàng ABC và lợi nhuận từng đơn
      steps:
      - Gom overhead thành các nhóm hoạt động với động lực (setup, kiểm định, giờ thiết kế).
      - Đơn giá mỗi động lực = chi phí nhóm / tổng lượng động lực.
      - Overhead/job = tổng (lượng động lực x đơn giá); chia sản lượng ra đơn vị.
      - So sánh với phân bổ cào bằng, tính biên lợi nhuận hai cách.
      - Tăng giá/đặt số lượng tối thiểu/phí setup cho đơn tùy biến; kiểm tra độ co giãn cầu.
      outputs: Bảng biên lợi nhuận theo job, danh sách đơn đang được trợ cấp ngầm.
  - id: "m08-procedures-4"
    title: "Quy trình: m08_proc_redflag_scan — Quét dấu hiệu cảnh báo (forensic)"
    tags: ["quy", "trình", "m08_proc_redflag_scan", "quét", "dấu", "hiệu", "cảnh", "báo", "forensic"]
    text: |-
      id: m08_proc_redflag_scan
      name: Quét dấu hiệu cảnh báo (forensic)
      steps:
      - So CFO với lợi nhuận và DSO nhiều kỳ.
      - Kiểm tuổi hàng tồn, so giá gốc với NRV.
      - Liệt kê hợp đồng thuê dài hạn, tính D/E gồm nợ thuê.
      - Dựng báo cáo biên đóng góp từng điểm bán.
      - Theo dõi chênh lệch ngân sách; nếu lệch bất lợi hai kỳ liên tiếp vượt ngưỡng thì cập nhật dự báo và kích hoạt phương án chi phí.
      - Chạy DuPont (biên - vòng quay - đòn bẩy) và Altman Z'.
      outputs: Bảng cờ đỏ với con số và hành động.
  - id: "m08-procedures-5"
    title: "Quy trình: m08_proc_support_allocation — Chọn và chạy phương pháp phân bổ bộ phận hỗ trợ"
    tags: ["quy", "trình", "m08_proc_support_allocation", "chọn", "và", "chạy", "phương", "pháp", "phân", "bổ", "bộ", "phận"]
    text: |-
      id: m08_proc_support_allocation
      name: Chọn và chạy phương pháp phân bổ bộ phận hỗ trợ
      steps:
      - Lập ma trận tỷ lệ dịch vụ (hàng cấp, cột nhận).
      - 'Nếu phục vụ lẫn nhau nhỏ: trực tiếp. Vừa: bậc thang (bộ phận phục vụ nhiều bộ phận hỗ trợ nhất đứng trước). Đáng kể: tương hỗ.'
      - Giải hệ (I - A chuyển vị) S = C bằng np.linalg.solve.
      - Kiểm tra tổng phân bổ cho sản xuất/kênh = tổng chi phí gốc.
      - So thứ hạng lợi nhuận giữa các phương pháp để biết quyết định có nhạy không.
      outputs: Chi phí phân bổ từng kênh/sản phẩm và độ nhạy.
  - id: "m08-procedures-6"
    title: "Quy trình: m08_proc_master_budget_q — Ngân sách quý: doanh thu - mua hàng - tiền mặt"
    tags: ["quy", "trình", "m08_proc_master_budget_q", "ngân", "sách", "quý", "doanh", "thu", "mua", "hàng", "tiền", "mặt"]
    text: |-
      id: m08_proc_master_budget_q
      name: 'Ngân sách quý: doanh thu - mua hàng - tiền mặt'
      steps:
      - Doanh thu = sản lượng x giá.
      - Nhu cầu nguyên liệu = sản lượng x định mức; cần mua = nhu cầu + tồn cuối mong muốn - tồn đầu.
      - Tiền chi NCC theo chính sách trả (60% tháng mua, 40% tháng sau) + nợ đầu kỳ.
      - Ngân sách tiền = đầu + thu - chi NCC - lương/vận hành - đầu tư.
      - Giữ quỹ đệm 1-2 tháng chi phí vận hành; nhớ chưa tính thuế/lãi vay.
      outputs: Bảng tiền mặt 3 tháng và quỹ khả dụng cho chi nhánh mới.
  - id: "m08-decision_rules-1"
    title: "Quy tắc quyết định: Nếu hai bộ phận hỗ trợ phục vụ lẫn nhau trên khoảng 10% và quyết định nhạy với thứ hạng kênh thì dù…"
    tags: ["quy", "tắc", "quyết", "định", "nếu", "hai", "bộ", "phận", "hỗ", "trợ", "phục", "vụ"]
    text: |-
      Nếu hai bộ phận hỗ trợ phục vụ lẫn nhau trên khoảng 10% và quyết định nhạy với thứ hạng kênh thì dùng tương hỗ; nếu nhỏ thì bậc thang hoặc trực tiếp.
  - id: "m08-decision_rules-2"
    title: "Quy tắc quyết định: Nếu hợp đồng gói có phần dịch vụ nhiều kỳ thì phân bổ theo SSP và ghi dịch vụ theo thời gian, phần …"
    tags: ["quy", "tắc", "quyết", "định", "nếu", "hợp", "đồng", "gói", "có", "phần", "dịch", "vụ"]
    text: |-
      Nếu hợp đồng gói có phần dịch vụ nhiều kỳ thì phân bổ theo SSP và ghi dịch vụ theo thời gian, phần chưa giao là contract liability.
  - id: "m08-decision_rules-3"
    title: "Quy tắc quyết định: Nếu có hàng ký gửi/đại lý có quyền trả thì chỉ ghi doanh thu phần đã bán cho người cuối."
    tags: ["quy", "tắc", "quyết", "định", "nếu", "có", "hàng", "ký", "gửi", "đại", "lý", "quyền"]
    text: |-
      Nếu có hàng ký gửi/đại lý có quyền trả thì chỉ ghi doanh thu phần đã bán cho người cuối.
  - id: "m08-decision_rules-4"
    title: "Quy tắc quyết định: Nếu FVLCD lớn hơn VIU thì bán còn hơn tiếp tục dùng: xem xét thanh lý/thuê ngoài; tổn thất phân bổ …"
    tags: ["quy", "tắc", "quyết", "định", "nếu", "fvlcd", "lớn", "hơn", "viu", "thì", "bán", "còn"]
    text: |-
      Nếu FVLCD lớn hơn VIU thì bán còn hơn tiếp tục dùng: xem xét thanh lý/thuê ngoài; tổn thất phân bổ goodwill trước.
  - id: "m08-decision_rules-5"
    title: "Quy tắc quyết định: Nếu CGU/tài sản có dấu hiệu suy giảm (công suất giảm, thị trường xấu) thì kiểm tra giá trị thu hồi …"
    tags: ["quy", "tắc", "quyết", "định", "nếu", "cgu", "tài", "sản", "có", "dấu", "hiệu", "suy"]
    text: |-
      Nếu CGU/tài sản có dấu hiệu suy giảm (công suất giảm, thị trường xấu) thì kiểm tra giá trị thu hồi trước khi trình bày báo cáo.
  - id: "m08-decision_rules-6"
    title: "Quy tắc quyết định: Nếu cơ cấu bán hàng tính theo số lượng thì quy về gói (WACM) rồi mới tính hòa vốn; không chia doanh…"
    tags: ["quy", "tắc", "quyết", "định", "nếu", "cơ", "cấu", "bán", "hàng", "tính", "theo", "số"]
    text: |-
      Nếu cơ cấu bán hàng tính theo số lượng thì quy về gói (WACM) rồi mới tính hòa vốn; không chia doanh thu hòa vốn theo cơ cấu số lượng.
  - id: "m08-decision_rules-7"
    title: "Quy tắc quyết định: Nếu ABC đảo chiều biên lợi nhuận so với cào bằng thì tăng giá/điều kiện cho đơn phức tạp, đẩy đơn đ…"
    tags: ["quy", "tắc", "quyết", "định", "nếu", "abc", "đảo", "chiều", "biên", "lợi", "nhuận", "so"]
    text: |-
      Nếu ABC đảo chiều biên lợi nhuận so với cào bằng thì tăng giá/điều kiện cho đơn phức tạp, đẩy đơn đơn giản; kiểm tra co giãn cầu trước.
  - id: "m08-decision_rules-8"
    title: "Quy tắc quyết định: Nếu chênh lệch giá thuận lợi nhưng lượng bất lợi thì không thưởng cả chi nhánh: tách trách nhiệm th…"
    tags: ["quy", "tắc", "quyết", "định", "nếu", "chênh", "lệch", "giá", "thuận", "lợi", "nhưng", "lượng"]
    text: |-
      Nếu chênh lệch giá thuận lợi nhưng lượng bất lợi thì không thưởng cả chi nhánh: tách trách nhiệm thu mua và bếp; kiểm tra chất lượng thịt.
  - id: "m08-decision_rules-9"
    title: "Quy tắc quyết định: Nếu chênh lệch khối lượng cố định lớn thì trách nhiệm kinh doanh/kế hoạch (thiếu đơn), không phải x…"
    tags: ["quy", "tắc", "quyết", "định", "nếu", "chênh", "lệch", "khối", "lượng", "cố", "lớn", "thì"]
    text: |-
      Nếu chênh lệch khối lượng cố định lớn thì trách nhiệm kinh doanh/kế hoạch (thiếu đơn), không phải xưởng.
  - id: "m08-decision_rules-10"
    title: "Quy tắc quyết định: Nếu chênh lệch ngân sách bất lợi hai kỳ liên tiếp vượt ngưỡng (ví dụ 10%) thì cập nhật dự báo, chạy…"
    tags: ["quy", "tắc", "quyết", "định", "nếu", "chênh", "lệch", "ngân", "sách", "bất", "lợi", "hai"]
    text: |-
