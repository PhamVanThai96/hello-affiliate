  - id: "m08-case_lessons-1"
    title: "Bài học case: Case 1 - Chuỗi F&B Phở Việt Chain (CVP, ABC, Master Budget, chênh lệch)"
    tags: ["bài", "học", "case", "chuỗi", "phở", "việt", "chain", "cvp", "abc", "master", "budget", "chênh"]
    text: |-
      name: Case 1 - Chuỗi F&B Phở Việt Chain (CVP, ABC, Master Budget, chênh lệch)
      type: sme
      setup: 'Chuỗi 8 quán phở, doanh thu khoảng 30 tỷ/năm, chuẩn bị gọi vốn và nhượng quyền thêm 5 chi nhánh. Cần: hòa vốn một quán, món nào thật sự lãi, ngân sách tiền Q1, kiểm soát hao hụt thịt.'
      key_calculations:
      - 'CVP: P 80.000, V 32.000, F 120 triệu -> CM 48.000 (60%); hòa vốn 2.500 tô/tháng (83,3/ngày; 46,3% công suất 180 khách/ngày); doanh thu hòa vốn 200 triệu.'
      - 'ABC: R_prep 1.066,67/điểm; R_QC 246,91/phút; R_waste 749,06/đơn vị; Wagyu overhead 19.201 so với cào bằng 9.000 -> biên Wagyu 33,0% (thay vì 39,4%); đồ uống 80,3% (thay vì 49,0%).'
      - 'Menu Engineering: ngưỡng ưa chuộng 14%; CM bình quân gia quyền khoảng 41.100 (nguồn ghi 41.099); Star: phở bò TT, Wagyu, phở gà; Plow Horse: bún bò; Dog: đồ uống.'
      - 'Master budget: cần mua thịt 1.866/2.184/2.424 kg, chi 335,88/393,12/436,32 triệu; tiền cuối Q1 1.829,21 triệu.'
      - 'Variance Bình Thạnh: MPV = (175.000-180.000) x 1.350 = -6,75 triệu (F); MQV = (1.350-1.200) x 180.000 = +27 triệu (U); tổng +20,25 triệu (U).'
      lesson: 'ABC không đổi tổng chi phí, chỉ phân phối lại cho đúng nơi tiêu dùng nguồn lực và có thể đảo chiều nhận định. CM% cao đi cùng đòn bẩy hoạt động cao. Giá mua tốt không bù được bếp lãng phí. Dòng tiền ngân sách chưa phải lợi nhuận. Lưu ý: nhãn ''biên đóng góp ABC'' thực chất là biên sau phân bổ overhead.'
      data_reliability: illustrative
  - id: "m08-case_lessons-2"
    title: "Bài học case: Case 2 - GreenPack gọi vốn Series A (VAS -> IFRS, Job costing + ABC, P&L 5 năm)"
    tags: ["bài", "học", "case", "greenpack", "gọi", "vốn", "series", "vas", "ifrs", "job", "costing", "abc"]
    text: |-
      name: Case 2 - GreenPack gọi vốn Series A (VAS -> IFRS, Job costing + ABC, P&L 5 năm)
      type: sme
      setup: Sản xuất bao bì sinh học, tăng 40%/năm, gọi 3 triệu USD. Quỹ ngoại yêu cầu báo cáo IFRS và giá thành theo đơn hàng.
      key_calculations:
      - 'Chuyển đổi 1/1/2025: doanh thu chưa chuyển giao ảnh hưởng -500+350 = -150; tổn thất máy ép 600-200 = -400; nợ thuê PV = 365 x 3,8897 = 1.419,7; DTA = 20% x 550 = 110.'
      - 'LN giữ lại 3.500 -> 3.060 (-440); phần điều chỉnh cân: tài sản +1.479,7 = nợ +1.919,7 - 440.'
      - 'ABC: R_setup 3.846.154/lần; R_test 857.143/lần; R_design 4.444.444/giờ; overhead/sp X 142, Y 2.107, Z 3.313 (cào bằng 741).'
      - 'Biên: X 2,1% -> 23,5%; Y 31,7% -> 10,7%; Z 36,4% -> 9,3%. Tăng giá Y 20% (7.800) -> 25,6%; Z 20% (11.400) -> 24,4%.'
      - 'P&L Năm 1: EBIT = 7,20 - 0,50 - 2,00 - 0,80 - 2,20 = 1,70; EBITDA 2,90; Năm 5 EBIT margin 28,2%.'
      lesson: 'Chuyển IFRS là đo lường lại, làm vốn chủ giảm nhưng minh bạch; kiểm tra phần điều chỉnh tự cân. ABC phơi bày bù chéo: đơn hàng lớn đơn giản đang trợ cấp đơn tùy biến. Dự phóng biên gộp tăng phải đến từ chỉnh giá/cơ cấu, và cần kịch bản thận trọng.'
      data_reliability: illustrative
  - id: "m08-case_lessons-3"
    title: "Bài học case: Case 3 - TechMart (thất bại): 5 sai lầm kế toán và DuPont đảo ngược"
    tags: ["bài", "học", "case", "techmart", "thất", "bại", "sai", "lầm", "kế", "toán", "và", "dupont"]
    text: |-
      name: 'Case 3 - TechMart (thất bại): 5 sai lầm kế toán và DuPont đảo ngược'
      type: failure
      setup: Chuỗi điện máy 15 showroom, doanh thu đỉnh 500 tỷ năm 2019, 2023 vỡ nợ kỹ thuật, đóng 10 cửa hàng. Hệ thống kế toán bị dùng để che điểm yếu.
      key_calculations:
      - 'Ký gửi: xuất 80 tỷ, bán 70% = 56 tỷ; LN gộp sai 16 tỷ so với đúng 11,2 -> thổi phồng 4,8 tỷ/quý (30%).'
      - 'Tồn kho: NRV = 16 - 1,6 = 14,4; dự phòng 21,6; sau thuế 17,28; LNST 38,4 -> 21,12 (-45%).'
      - 'Thuê: PV = 15 x 6,1446 = 92,17; D/E 2,0 -> 2,92.'
      - 'Phân khúc: +24 +10 -28 = +6 tỷ toàn chuỗi; 8 showroom tỉnh lẻ lỗ gấp 4,7 lần lợi nhuận chung; đóng chúng đạt 34 tỷ (chưa tính phí đóng cửa).'
      - 'Ngân sách 40 tỷ, thực tế 36/33/30/27: lệch lũy kế -34 tỷ sau 4 tháng.'
      - 'DuPont: 2019 ROE = 4% x 2,2 x 1,7 = 14,96%; 2022 = -8% x 0,9 x 4,5 = -32,4%. Altman Z'' 2022 = 0,759.'
      lesson: 'Cờ đỏ: CFO dưới lợi nhuận, DSO/DIO tăng, thuê ngoài bảng, báo cáo hợp nhất che lỗ điểm bán, ngân sách tăng dần không hành động. Khi biên ròng âm, đòn bẩy cao khuếch đại lỗ cho cổ đông.'
      data_reliability: illustrative
  - id: "m08-case_lessons-4"
    title: "Bài học case: Case 4 - S-Tech (IoT): IFRS 15/16, bậc thang, CVP đa sản phẩm, 4-Variance, DuPont 5, CCC"
    tags: ["bài", "học", "case", "tech", "iot", "ifrs", "15", "16", "bậc", "thang", "cvp", "đa"]
    text: |-
      name: 'Case 4 - S-Tech (IoT): IFRS 15/16, bậc thang, CVP đa sản phẩm, 4-Variance, DuPont 5, CCC'
      type: success
      setup: Tập đoàn công nghệ chế tạo doanh thu 1.200 tỷ năm 2025, chuẩn bị IPO quốc tế cuối 2027; tái cấu trúc hệ thống kế toán theo 6 hướng.
      key_calculations:
      - 'IFRS 15: SSP 60/30/30 -> HW 50, SW 25, MT 25; năm 1 ghi 66,67, chưa thực hiện 33,33.'
      - 'IFRS 16: PV = 150 x 3,7908 = 568,62; KH ROU 113,72; chi phí năm 1 170,59 -> năm 5 127,36; tổng 750; EBITDA tăng 150, EBIT tăng 36,28 (năm 1).'
      - 'Bậc thang: P1 261,33; P2 138,67 (tương hỗ cùng dữ liệu: P1 260,41; P2 139,59).'
      - 'CVP đa sản phẩm: gói 2 IoT + 3 Sensor, CM gói 8,4; WACM% 52,5%; hòa vốn 50 gói = 800 triệu (IoT 100 bộ, Sensor 150).'
      - '4-Variance: chi tiêu +12, hiệu năng +18, ngân sách +15, khối lượng +60 = +105 (U) = 585 - 480.'
      - 'DuPont 5: ROE 14,05% -> 23,85%; đòn bẩy giảm 2,10 -> 1,60; CCC 85 -> 25 ngày, giải phóng khoảng 166 tỷ.'
      lesson: IFRS 16 làm EBITDA tăng nhưng nợ tăng; bậc thang phụ thuộc thứ tự; CVP đa sản phẩm phải quy về gói theo số lượng; chênh lệch khối lượng 57% tổng thuộc về kinh doanh; ROE tăng khi đòn bẩy giảm nghĩa là chất lượng cao.
      data_reliability: illustrative
  - id: "m08-case_lessons-5"
    title: "Bài học case: Case 5 - Hãng xe điện (bối cảnh VinFast): IAS 38, IAS 36, IFRS 16"
    tags: ["bài", "học", "case", "hãng", "xe", "điện", "bối", "cảnh", "vinfast", "ias", "38", "36"]
    text: |-
      name: 'Case 5 - Hãng xe điện (bối cảnh VinFast): IAS 38, IAS 36, IFRS 16'
      type: success
      setup: R&D lớn (nền tảng xe điện, ADAS), xưởng dập khuôn cũ giảm công suất, thuê showroom nước ngoài dài hạn. Toàn bộ số liệu là giả định, không phải số của công ty.
      key_calculations:
      - 'R&D: nghiên cứu 200 ghi chi phí; phát triển 300 vốn hóa, KH 5 năm = 60 tỷ/năm = 5 tỷ/tháng; 3 tháng đầu LN giảm 215, tài sản vô hình 285.'
      - 'IAS 36: VIU = 1.191,67 + 1.875,60 = 3.067,27; FVLCD 3.200 -> thu hồi 3.200; tổn thất 4.500 - 3.200 = 1.300; goodwill -300; máy -714,29; nhà xưởng -285,71; TV = 61% VIU.'
      - 'Thuê: PV = 500.000 x 7,5501 = 3.775.067 USD; KH 377.507; lãi năm 1 302.005; chi phí P&L 679.512 so với tiền 500.000 (cao hơn 36%); dư nợ cuối năm 1 = 3.577.072.'
      lesson: Kỷ luật 6 điều kiện vốn hóa; thu hồi là max(bán, dùng); tổn thất phân bổ goodwill trước; FVLCD > VIU là tín hiệu thanh lý; nợ thuê đưa vào nợ ròng. Số thật phải lấy từ báo cáo kiểm toán.
      data_reliability: illustrative
  - id: "m08-case_lessons-6"
    title: "Bài học case: Case 6 - Công ty sữa (bối cảnh Vinamilk): doanh thu đa kênh, phân bổ tương hỗ, sổ đôi"
    tags: ["bài", "học", "case", "công", "ty", "sữa", "bối", "cảnh", "vinamilk", "doanh", "thu", "đa"]
    text: |-
      name: 'Case 6 - Công ty sữa (bối cảnh Vinamilk): doanh thu đa kênh, phân bổ tương hỗ, sổ đôi'
      type: success
      setup: Bán qua kênh truyền thống (GT) và hiện đại (MT) với trả hàng, thưởng doanh số, phí trưng bày; kho và đội xe phục vụ lẫn nhau. Số liệu giả định.
      key_calculations:
      - Doanh thu ban đầu 10.000 - 500 - 200 - 300 = 9.000; cuối 9.200; giá vốn 5.820; LN gộp 3.380 = 36,7% (so với 40% theo hóa đơn).
      - 'Tương hỗ: K = 640/0,98 = 653,06; X = 530,61; GT 538,78; MT 461,22 (tổng 1.000).'
      - 'Lợi nhuận sau hậu cần: trực tiếp GT 647,22 / MT 652,78 (MT nhỉnh hơn); bậc thang 668,89 / 631,11; tương hỗ 661,22 / 638,78 (GT hơn): thứ hạng đảo chiều.'
      lesson: Doanh thu IFRS 15 là số kỳ vọng nhận sau yếu tố biến đổi, tiền thuần thu = doanh thu cuối là kiểm tra tự nhiên. Phương pháp phân bổ có thể đổi cả thứ hạng kênh. Sổ đôi giúp hai báo cáo nói cùng câu chuyện.
      data_reliability: illustrative
  - id: "m08-case_lessons-7"
    title: "Bài học case: Case 7 - Xưởng rang xay Núi Lửa (Đắk Lắk): ba báo cáo, hòa vốn, chênh lệch rang, lãi mà cạn tiền"
    tags: ["bài", "học", "case", "xưởng", "rang", "xay", "núi", "lửa", "đắk", "lắk", "ba", "báo"]
    text: |-
      name: 'Case 7 - Xưởng rang xay Núi Lửa (Đắk Lắk): ba báo cáo, hòa vốn, chênh lệch rang, lãi mà cạn tiền'
      type: sme
      setup: SME TNHH doanh thu 3,6 tỷ, LNST 220,8 triệu nhưng tiền từ 150 xuống 80,8; đồng thời hụt sản lượng rang tháng 12.
      key_calculations:
      - CFO = 220,8 + 80 - 70 - 50 + 50 = 230,8; CFI -150; CFF -150; tiền -69,2 -> 80,8.
      - 'BS cuối: TSCĐ 470; LN giữ lại 230,8; tổng 970,8 hai phía (cân).'
      - 'Chỉ số: current 1,47; quick 0,80; DSO 19,3; DIO 33,3; DPO 27,5; CCC 25,1; ROE 35,0% = 6,13% x 3,71 x 1,54.'
      - 'Hòa vốn: CM 30%; F = 804; doanh thu hòa vốn 2.680 (223,3/tháng); biên an toàn 25,6%; DOL 3,6 (mất 15% doanh thu -> EBIT -54%, còn khoảng 138).'
      - 'Chênh lệch: SQ = 1.428 kg; MPV +4,428 triệu; MQV +4,56 triệu; tổng +8,988 triệu (U); thu hồi 81,3% so với chuẩn 84,0%.'
      lesson: 'Lãi không phải tiền: vốn lưu động nuốt 70, đầu tư 150, chia lợi tức và trả nợ 150. Hòa vốn và DOL đo độ mong manh; tách giá (khó kiểm soát) và lượng/hao hụt rang (kiểm soát được). 9 triệu/tháng kéo dài cả năm khoảng 108 triệu.'
      data_reliability: illustrative
