    title: "Câu hỏi luyện tập: Cần reach 30.000 người, frequency 3, CPM 50.000. Chi phí paid?"
    tags: ["câu", "hỏi", "luyện", "tập", "cần", "reach", "30", "000", "người", "frequency", "cpm", "50"]
    text: |-
      q: Cần reach 30.000 người, frequency 3, CPM 50.000. Chi phí paid?
