  - id: "m08-notes_source_issues-1"
    title: "Notes source issues: PESO Analysis nêu '25M+ Facebook followers (+870%)' trong khi bảng Kết quả nêu '25M+ FB followers m…"
    tags: ["notes", "source", "issues", "peso", "analysis", "nêu", "25m", "facebook", "followers", "870", "trong", "khi"]
    text: |-
      PESO Analysis nêu '25M+ Facebook followers (+870%)' trong khi bảng Kết quả nêu '25M+ FB followers mới'. Hai cách đọc mâu thuẫn: nếu 25 triệu là tổng và tăng 870 phần trăm thì cơ sở trước đó ~2,58 triệu (25/9,7); nếu 25 triệu là follower mới thì tổng lớn hơn nhiều. Số 870 cũng trùng với '870+ media placements'. Trong thực tế chiến dịch, con số được báo cáo thường là Facebook traffic hoặc fan tăng; coi là chưa xác minh.
  - id: "m08-notes_source_issues-2"
    title: "Notes source issues: 'ROI ước tính 10:1' không nêu rõ là ROAS (doanh thu/chi phí) hay ROI lợi nhuận; không có chi phí ch…"
    tags: ["notes", "source", "issues", "roi", "ước", "tính", "10", "không", "nêu", "rõ", "là", "roas"]
    text: |-
      'ROI ước tính 10:1' không nêu rõ là ROAS (doanh thu/chi phí) hay ROI lợi nhuận; không có chi phí chiến dịch trong nguồn nên không tính lại được. Earned media value 7M USD là ước tính PR, không so được với doanh thu.
