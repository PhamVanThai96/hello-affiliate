  - id: "m08-tong-quan"
    title: "Tổng quan m08"
    tags: ["m08", "truyền", "thông", "marketing", "tích", "hợp", "imc", "integrated", "communications"]
    text: |-
      Truyền thông Marketing Tích hợp (IMC) (Integrated Marketing Communications) — module m08

      Mục đích: Phối hợp mọi công cụ và kênh truyền thông (quảng cáo, PR, khuyến mãi, bán hàng cá nhân, direct, digital/social, content, sự kiện, influencer) thành MỘT thông điệp nhất quán xuyên suốt hành trình khách hàng. Module giúp lập kế hoạch IMC 8 bước, đặt mục tiêu truyền thông theo DAGMAR, chọn mix Paid-Owned-Earned-Shared (PESO), chia ngân sách và đo lường hiệu quả.

      Dùng khi:
      - Chủ SME hỏi 'nên chạy kênh nào, ngân sách bao nhiêu, làm sao để các kênh không rời rạc?'
      - Cần lập kế hoạch truyền thông cho khai trương, ra mắt sản phẩm, chiến dịch mùa vụ, tái định vị.
      - Cần chia ngân sách marketing (theo % doanh thu, objective-task, competitive parity, affordable).
      - Cần đặt mục tiêu và KPI truyền thông theo giai đoạn nhận biết - hiểu - tin - hành động.
      - Thông điệp trên website, Facebook, TikTok, cửa hàng, nhân viên sale đang mâu thuẫn/không đồng nhất.
      - Cần tính reach, frequency, GRP, CPM, CPA, ROAS, ROI, share of voice cho một chiến dịch.
      - Cần đánh giá một campaign tích hợp mẫu (Share a Coke) và rút bài học cho SME.

      Nên nắm trước: - 'm01 - STP: persona mục tiêu và định vị là đầu vào Bước 1 và 3 của IMC'

      Module liên quan: - 'm01 - STP: xác định đối tượng và định vị mà thông điệp IMC phải nói lên' - 'm02 - Marketing Mix: Promotion (P thứ 4) chính là IMC; Price/Product/Place phải khớp thông điệp' - 'm03 - CLV: ngân sách trần cho acquisition (CAC) và retention suy ra từ CLV' - 'm04 - Brand Management: identity, voice, brand equity là ''một giọng nói'' cần nhất quán' - 'm05 - Digital Marketing: chi tiết SEO/SEM/social…

      Công thức (tra chi tiết bằng skill_search("<id>")):
      - m08_budget_pct_revenue: Ngân sách truyền thông theo % doanh thu
      - m08_objective_task_budget: Ngân sách theo Mục tiêu - Nhiệm vụ
      - m08_cpm: Chi phí trên một nghìn lượt hiển thị
      - m08_grp_reach_frequency: Điểm tiếp cận tổng hợp: Reach, Frequency, GRP
      - m08_funnel_cost: Chi phí trên mỗi hành động theo phễu
      - m08_roas_roi: ROAS và ROI chiến dịch truyền thông
      - m08_share_of_voice: Thị phần tiếng nói
      - m08_media_value_ratio: Tỷ lệ giá trị truyền thông kiếm được trên chi phí

      Kho tra cứu của module: Khái niệm 9, frameworks 7, Công thức 8, Quy trình 4, Quy tắc quyết định 14, Chuẩn so sánh 9, Lỗi thường gặp 11, notes_source_issues 6, Lưu ý SME Việt Nam 10, Bài học case 3, Ví dụ có lời giải 4, Câu hỏi luyện tập 10, Checklist 15, Mẫu Excel/Sheets 6. Tra bằng skill_search với từ khoá chủ đề (vd "ví dụ CLV", "lỗi thường gặp định giá").
  - id: "m08-concepts-1"
    title: "Khái niệm: Truyền thông Marketing Tích hợp"
    tags: ["khái", "niệm", "truyền", "thông", "marketing", "tích", "hợp"]
    text: |-
      term_vi: Truyền thông Marketing Tích hợp
      term_en: Integrated Marketing Communications (IMC)
      definition: |
        Quá trình lập kế hoạch, thực thi và đánh giá các hoạt động truyền thông được phối hợp, bảo đảm mọi kênh truyền tải một thông điệp nhất quán tới khách hàng mục tiêu (one voice, one look, one message).
      why_it_matters: |
        Trước IMC mỗi bộ phận (PR, quảng cáo, digital, sự kiện) chạy riêng với thông điệp riêng nên khách hàng nhận 5-6 thông điệp khác nhau và bối rối. Don Schultz (Northwestern University, khoảng 1993, cùng Tannenbaum và Lauterborn) hệ thống hóa IMC khi truyền thông phân mảnh (nhiều kênh, nhiều agency) làm lãng phí ngân sách; tích hợp tạo synergy: nhất quán thì nhớ lâu, tin cao hơn.
  - id: "m08-concepts-2"
    title: "Khái niệm: Một ý tưởng lớn xuyên suốt"
    tags: ["khái", "niệm", "một", "tưởng", "lớn", "xuyên", "suốt"]
    text: |-
      term_vi: Một ý tưởng lớn xuyên suốt
      term_en: Big Idea
      definition: Một ý tưởng sáng tạo duy nhất làm trục cho mọi kênh; mỗi kênh thể hiện khác nhau nhưng cùng nói một điều.
      why_it_matters: Nhất quán không có nghĩa là lặp lại giống hệt (consistency is not boring). Big idea cho phép tùy biến theo kênh mà vẫn một thông điệp (key message nên dưới 10 từ, dễ nhớ).
  - id: "m08-concepts-3"
    title: "Khái niệm: Hỗn hợp công cụ IMC"
    tags: ["khái", "niệm", "hỗn", "hợp", "công", "cụ", "imc"]
    text: |-
      term_vi: Hỗn hợp công cụ IMC
      term_en: IMC Mix / Promotion Mix
      definition: 'Tập các công cụ truyền thông có thể kết hợp: Advertising, PR/Publicity, Sales Promotion, Personal Selling, Direct Marketing, Digital/Social, Content Marketing, Sponsorship/Events, Influencer (KOL/KOC).'
      why_it_matters: Mỗi công cụ có vai trò và điểm yếu khác nhau; mix phải bù trừ cho nhau (ads tạo reach, PR/review tạo tin, promotion tạo hành động).
  - id: "m08-concepts-4"
    title: "Khái niệm: Truyền thông sở hữu - trả tiền - kiếm được - chia sẻ"
    tags: ["khái", "niệm", "truyền", "thông", "sở", "hữu", "trả", "tiền", "kiếm", "được", "chia", "sẻ"]
    text: |-
      term_vi: Truyền thông sở hữu - trả tiền - kiếm được - chia sẻ
      term_en: PESO (Paid, Earned, Shared, Owned media)
      definition: |
        Paid: trả tiền để xuất hiện (ads, sponsored). Earned: người khác tự nói về mình (PR, review, truyền miệng). Shared: nền tảng xã hội, UGC. Owned: kênh mình kiểm soát (website, blog, email, app).
      why_it_matters: Biến câu hỏi 'chọn kênh nào' thành 'cân bằng 4 loại media thế nào'. Paid đẩy nhanh, Owned giữ tài sản dài hạn, Earned/Shared mang uy tín và viral gần như miễn phí nhưng khó kiểm soát. Mô hình PESO phổ biến hóa bởi Gini Dietrich (khoảng 2014); nguồn dùng tên 'Earned, Owned, Paid, Shared' cho cùng ý.
  - id: "m08-concepts-5"
    title: "Khái niệm: Mục tiêu truyền thông"
    tags: ["khái", "niệm", "mục", "tiêu", "truyền", "thông"]
    text: |-
      term_vi: Mục tiêu truyền thông
      term_en: Communication Objectives (DAGMAR)
      definition: 'Mục tiêu đo được theo 4 giai đoạn: Awareness (biết) - Comprehension (hiểu) - Conviction (tin) - Action (mua).'
      why_it_matters: DAGMAR (Russell Colley, 1961, 'Defining Advertising Goals for Measured Advertising Results') ra đời vì quảng cáo thời đó bị đo bằng doanh số, vốn chịu nhiều yếu tố khác. Tách mục tiêu truyền thông khỏi mục tiêu bán hàng thì đo đúng việc truyền thông làm được.
  - id: "m08-concepts-6"
    title: "Khái niệm: Hiệp lực"
    tags: ["khái", "niệm", "hiệp", "lực"]
    text: |-
      term_vi: Hiệp lực
      term_en: Synergy
      definition: Hiệu quả tổng hợp của nhiều kênh cùng thông điệp lớn hơn tổng từng kênh riêng (nguồn mô tả '1+1=3').
      why_it_matters: 'Là lý do kinh tế của IMC: chi cùng ngân sách nhưng recall và niềm tin cao hơn. ''1+1=3'' là ẩn dụ, không phải số đo; cần đo thực tế bằng test.'
  - id: "m08-concepts-7"
    title: "Khái niệm: Sản phẩm là phương tiện truyền thông"
    tags: ["khái", "niệm", "sản", "phẩm", "là", "phương", "tiện", "truyền", "thông"]
    text: |-
      term_vi: Sản phẩm là phương tiện truyền thông
      term_en: Product = Media
      definition: Bao bì, cửa hàng, sản phẩm, hóa đơn, nhân viên đều là touchpoint truyền thông.
      why_it_matters: 'Bài học Share a Coke: lon Coca-Cola mang tên người dùng trở thành media. SME có sẵn nhiều touchpoint miễn phí (ly, túi, bàn, hóa đơn, tin nhắn) cần thống nhất.'
  - id: "m08-concepts-8"
    title: "Khái niệm: Truyền thông tạo bởi người dùng"
    tags: ["khái", "niệm", "truyền", "thông", "tạo", "bởi", "người", "dùng"]
    text: |-
      term_vi: Truyền thông tạo bởi người dùng
      term_en: User-Generated Content (UGC)
      definition: Nội dung do khách hàng tạo (ảnh, video, review) thay vì thương hiệu.
      why_it_matters: Đáng tin hơn quảng cáo và gần như miễn phí; IMC hiện đại phải THIẾT KẾ để khách hàng muốn tự đăng (tên riêng, góc check-in, hashtag).
  - id: "m08-concepts-9"
    title: "Khái niệm: Phân bổ chuyển đổi theo kênh"
    tags: ["khái", "niệm", "phân", "bổ", "chuyển", "đổi", "theo", "kênh"]
    text: |-
      term_vi: Phân bổ chuyển đổi theo kênh
      term_en: Cross-channel Attribution
      definition: Cách ghi công cho từng touchpoint trong hành trình dẫn tới mua.
      why_it_matters: 'Là nhược điểm lớn của IMC: khách thấy ads, đọc review rồi mua trực tiếp. Chọn mô hình gán công (last-click, first-touch, linear...) và thống nhất trước khi đo.'
  - id: "m08-frameworks-1"
    title: "Frameworks: m08_imc_8_steps — Quy trình lập kế hoạch IMC 8 bước"
    tags: ["frameworks", "m08_imc_8_steps", "quy", "trình", "lập", "kế", "hoạch", "imc", "bước"]
    text: |-
      id: m08_imc_8_steps
      name_vi: Quy trình lập kế hoạch IMC 8 bước
      name_en: 8-step IMC Planning Process
      origin: |
        Quy trình tổng hợp trong giáo trình IMC (Schultz 1993; Belch & Belch 'Advertising and Promotion: An IMC Perspective'; Kotler & Keller). Ra đời để đi từ chiến lược (STP) xuống thực thi theo thứ tự mục tiêu -> thông điệp -> kênh -> tiền, tránh sai lầm phổ biến là chọn kênh/ngân sách trước rồi mới nghĩ thông điệp.
      components:
      - 'Bước 1 Target Audience: từ STP chuyển thành persona cụ thể'
      - 'Bước 2 Communication Objectives: awareness / consideration / conversion / loyalty (DAGMAR)'
      - 'Bước 3 Key Message: một thông điệp/big idea xuyên suốt'
      - 'Bước 4 Creative Strategy: Insight -> Big Idea -> Execution'
      - 'Bước 5 IMC mix và channel: Paid + Owned + Earned + Shared'
      - Bước 6 Budget Allocation
      - Bước 7 Timeline và implementation
      - Bước 8 Đo lường và tối ưu (KPI tracking)
      when_to_use: Mọi chiến dịch truyền thông có từ 2 kênh trở lên hoặc có ngân sách đáng kể; đặc biệt khai trương, ra mắt, tái định vị.
      how_to_apply:
      - 'B1: Lấy phân khúc mục tiêu từ STP, viết persona (tuổi, nghề, hành vi, kênh thường dùng, nỗi đau).'
      - 'B2: Chọn giai đoạn DAGMAR đang yếu nhất của thương hiệu, đặt mục tiêu có số (vd reach 40% trong bán kính 3 km, 500 lượt ghé/tháng).'
      - 'B3: Viết key message dưới 10 từ từ định vị; kiểm tra mọi kênh nói được câu này.'
      - 'B4: Tìm insight khách hàng (điều họ thật sự quan tâm), phát triển big idea, rồi chỉ định cách thể hiện cho từng kênh.'
      - 'B5: Chọn kênh theo vai trò: ai tạo reach, ai tạo tin, ai chốt hành động (xem PESO và bảng IMC mix).'
      - 'B6: Chia ngân sách (xem framework Budget Allocation); dành một phần cho đo lường.'
      - 'B7: Lập timeline có mốc; tất cả kênh khởi chạy cùng khung thời gian để cộng hưởng.'
      - 'B8: Thiết lập KPI từng kênh và tổng thể, mô hình attribution, dashboard, rồi post-campaign review ghi lại bài học.'
      how_to_read_results: Chiến dịch tích hợp tốt khi mọi kênh nhắc cùng một câu, KPI từng giai đoạn funnel tăng liên tục (reach -> recall -> consideration -> action) và chi phí mỗi hành động giảm so với chạy rời rạc.
      pitfalls:
      - Nhảy thẳng sang Bước 5-6 (chọn kênh, chia tiền) khi chưa có Bước 2-3.
      - Big idea chỉ nằm trong slide, không đi vào thực thi và nhân viên.
      - Không có người/nhóm 'chỉ huy' toàn bộ IMC nên các bộ phận quay lại làm riêng.
      - Copy-paste cùng một creative cho mọi kênh thay vì tùy biến theo đặc thù kênh.
      example: |
        Quán cà phê specialty khai trương: B1 nhân viên văn phòng 25-35 tuổi trong bán kính 2 km; B2 awareness 40% người trong vùng; B3 'Cà phê thật, giá thật'; B5 Paid (Facebook geo-target) + Owned (Zalo OA, Google Maps) + Earned (review blogger local) + Shared (hashtag, góc check-in); B8 đo lượt ghé đầu tiên bằng mã giảm giá riêng cho từng kênh.
  - id: "m08-frameworks-2"
    title: "Frameworks: m08_imc_mix — Hỗn hợp công cụ IMC (IMC Mix)"
    tags: ["frameworks", "m08_imc_mix", "hỗn", "hợp", "công", "cụ", "imc", "mix"]
    text: |-
      id: m08_imc_mix
      name_vi: Hỗn hợp công cụ IMC (IMC Mix)
      name_en: IMC Mix / Promotion Tools
      origin: |
        Từ khung Promotion Mix cổ điển của McCarthy (4P, 1960) mở rộng thành các công cụ hiện đại (digital, content, influencer). Mục đích: nhận ra mỗi công cụ có vai trò và đánh đổi riêng nên phải kết hợp thay vì chọn một.
      components:
      - 'Advertising: reach rộng, xây awareness. Ưu: kiểm soát message, scale. Nhược: đắt, một chiều.'
      - 'PR / Publicity: xây uy tín, earned media. Ưu: đáng tin hơn ads. Nhược: khó kiểm soát.'
      - 'Sales Promotion: thúc đẩy hành động ngắn hạn. Ưu: nhanh, đo được. Nhược: lạm dụng làm giảm brand equity.'
      - 'Personal Selling: quan hệ sâu, B2B, giá trị cao. Ưu: cá nhân hóa, xử lý phản đối. Nhược: đắt, khó scale.'
      - 'Direct Marketing: nhắm cụ thể, cá nhân hóa. Ưu: targeted, đo được. Nhược: rủi ro spam.'
      - 'Digital / Social: tương tác, cộng đồng, viral. Ưu: chi phí hiệu quả, hai chiều, real-time. Nhược: thay đổi nhanh, rủi ro khủng hoảng.'
      - 'Content Marketing: giáo dục, tạo giá trị, SEO. Ưu: xây niềm tin dài hạn. Nhược: chậm thấy kết quả.'
      - 'Sponsorship / Events: gắn thương hiệu với trải nghiệm. Ưu: kết nối cảm xúc. Nhược: đắt, khó đo ROI.'
      - 'Influencer (KOL/KOC): Ưu: tự nhiên, nhắm đúng tệp. Nhược: rủi ro danh tiếng.'
      when_to_use: Bước 5 của IMC khi chọn công cụ theo mục tiêu DAGMAR.
      how_to_apply:
      - Gán mỗi công cụ một vai trò theo giai đoạn funnel (reach, hiểu, tin, hành động, giữ chân).
      - Loại công cụ có nhược điểm trùng ràng buộc của bạn (vd ngân sách nhỏ thì loại TV, sponsorship lớn).
      - Chọn 2-4 công cụ chính bổ trợ nhau, không dàn trải 9 công cụ.
      - Đặt KPI riêng cho từng công cụ.
      how_to_read_results: Công cụ nào cho chi phí trên mỗi hành động thấp nhất ở đúng giai đoạn thì tăng tỷ trọng; công cụ chỉ tốt ở một giai đoạn không nên bị đánh giá bằng KPI giai đoạn khác (PR không đo bằng doanh số tức thì).
      pitfalls:
      - Dùng khuyến mãi liên tục để kéo doanh số làm khách quen chờ giảm giá, hại brand equity.
      - Đánh giá PR/Content bằng doanh số tháng này (chậm tác động).
      - Thuê influencer mà không kiểm tra độ phù hợp giá trị thương hiệu.
      example: 'Phở modern ngân sách 20 triệu/tháng: Digital/Social + Promotion theo giờ thấp điểm + Content video ngắn + Direct (Zalo) cho khách cũ; bỏ Advertising truyền thống và sponsorship.'
  - id: "m08-frameworks-3"
    title: "Frameworks: m08_peso — Mô hình PESO (Paid, Earned, Shared, Owned)"
    tags: ["frameworks", "m08_peso", "mô", "hình", "peso", "paid", "earned", "shared", "owned"]
    text: |-
      id: m08_peso
      name_vi: Mô hình PESO (Paid, Earned, Shared, Owned)
      name_en: PESO Model
      origin: |
        Gini Dietrich (Arment Dietrich, khoảng 2014) hệ thống hóa từ mô hình POEM của Forrester (Paid/Owned/Earned) bằng cách thêm Shared do mạng xã hội. Ra đời vì quảng cáo trả tiền suy giảm hiệu quả/đắt dần, cần cân bằng với tài sản tự sở hữu và uy tín tự có.
      components:
      - 'Paid: ads, sponsored content (nhanh, kiểm soát, tốn tiền).'
      - 'Earned: PR, truyền miệng, review (uy tín cao, khó kiểm soát).'
      - 'Shared: mạng xã hội, UGC (viral, tương tác).'
      - 'Owned: website, blog, email, app (tài sản dài hạn, chậm xây).'
      when_to_use: Bước 5-6 của IMC khi cần cân bằng nhiều loại media và phân bổ ngân sách giữa chúng.
      how_to_apply:
      - Liệt kê hiện trạng 4 loại media của thương hiệu (có gì, mạnh yếu thế nào).
      - Dùng Paid để đẩy reach/kéo traffic về Owned; Owned phải sẵn sàng (website, Google Maps, Zalo OA) trước khi chi Paid.
      - Thiết kế cơ chế khiến khách tạo Shared (tên riêng, ưu đãi đăng ảnh, góc check-in).
      - Chủ động xin Earned (mời review, gửi PR cho báo local, xin đánh giá Google/Foody) thay vì chờ.
      - 'Đo mỗi loại: Paid (CPM, CPA), Owned (traffic, subscriber), Earned (số lượt đề cập, review), Shared (số UGC, tương tác).'
      how_to_read_results: Nếu Paid chiếm gần như 100% mà Earned/Shared/Owned ~0 thì thương hiệu thuê khách; ngừng chi là biến mất. Mix lành mạnh đang dịch dần tỷ trọng sang Owned/Earned theo thời gian.
      pitfalls:
      - Chi Paid trước khi Owned sẵn sàng (landing page, Google Maps không chuẩn).
      - 'Coi Earned là miễn phí: thực ra cần sản phẩm/chương trình đủ đáng nói và công quan hệ.'
      - Nhầm Shared với Paid influencer; Shared đúng nghĩa là khách tự đăng.
      example: |
        Case Share a Coke: Paid (TV, outdoor, digital) reach 70%+ target; Earned 870+ media placements, PR value ước $7M+; Shared #ShareACoke hơn 500.000 ảnh; Owned website tạo lon ảo, kiosk in-store (số liệu từ nguồn, xem case_lessons về độ tin cậy).
  - id: "m08-frameworks-4"
    title: "Frameworks: m08_dagmar — Mô hình mục tiêu truyền thông DAGMAR"
    tags: ["frameworks", "m08_dagmar", "mô", "hình", "mục", "tiêu", "truyền", "thông", "dagmar"]
    text: |-
      id: m08_dagmar
      name_vi: Mô hình mục tiêu truyền thông DAGMAR
      name_en: DAGMAR (Defining Advertising Goals for Measured Advertising Results)
      origin: |
        Russell H. Colley, 1961, báo cáo cho Hiệp hội Quảng cáo Hoa Kỳ (ANA). Bối cảnh: các nhà quảng cáo bị yêu cầu chứng minh hiệu quả bằng doanh số, nhưng doanh số bị chi phối bởi giá, phân phối, đối thủ. Colley đề xuất đặt mục tiêu truyền thông đo được theo thang ACCA (Awareness - Comprehension - Conviction - Action) để biết quảng cáo làm được gì.
      components:
      - 'Awareness: KH biết thương hiệu. KPI: reach, impressions, brand recall. Kênh: TV, display, social, PR.'
      - 'Comprehension: KH hiểu sản phẩm. KPI: message recall, understanding. Kênh: content, blog, video, infographic.'
      - 'Conviction: KH tin sản phẩm tốt. KPI: preference, consideration, intent. Kênh: review, testimonial, demo.'
      - 'Action: KH mua. KPI: conversion, sales, leads. Kênh: promo, CTA, retargeting, sales.'
      when_to_use: Bước 2 (đặt mục tiêu) và Bước 8 (đo) của IMC; mỗi giai đoạn cần KPI và kênh khác nhau.
      how_to_apply:
      - 'Chẩn đoán điểm nghẽn: khảo sát nhanh 30-50 khách tiềm năng để xem họ dừng ở bước nào (không biết / biết nhưng không hiểu / hiểu nhưng chưa tin / tin nhưng chưa mua).'
      - 'Đặt mục tiêu DAGMAR theo mẫu: ''tăng [chỉ số] từ [x] lên [y] trong [nhóm mục tiêu] trong [thời gian]''.'
      - Chọn kênh theo cột 'Kênh' của bước đó.
      - Đo bằng KPI đúng cột; chỉ đo doanh số ở bước Action.
      - Khi bước hiện tại đạt, dịch ngân sách sang bước kế tiếp.
      how_to_read_results: Phễu rò ở bước nào thì tăng ngân sách ở bước đó. Awareness cao nhưng conviction thấp nghĩa là cần review/demo, không cần thêm ads reach.
      pitfalls:
      - Chỉ có mục tiêu 'tăng doanh số' mà không có mục tiêu giữa phễu.
      - Dùng một kênh cho mọi giai đoạn.
      - Đo awareness bằng lượt thích trang thay vì brand recall thật.
      example: 'Tiệm bánh mới: 80% khách nghe tên nhưng chỉ 20% hiểu ''bánh ít đường'' -> ưu tiên Comprehension (video 30 giây, bảng thành phần) hơn là thêm reach.'
  - id: "m08-frameworks-5"
    title: "Frameworks: m08_budget_allocation — Các phương pháp xác định ngân sách truyền thông"
    tags: ["frameworks", "m08_budget_allocation", "các", "phương", "pháp", "xác", "định", "ngân", "sách", "truyền", "thông"]
    text: |-
      id: m08_budget_allocation
      name_vi: Các phương pháp xác định ngân sách truyền thông
      name_en: Budget Allocation Methods
      origin: |
        Bộ 4 phương pháp kinh điển trong Belch & Belch/Kotler: percentage of sales, objective-and-task, competitive parity, affordable. Ra đời vì ngân sách marketing là quyết định nhiều rủi ro: chi thiếu thì không đạt ngưỡng hiệu quả, chi thừa thì lãng phí. Objective-Task bắt nguồn từ tư tưởng DAGMAR (mục tiêu trước, tiền sau).
      components:
      - '% of Revenue: 5-15% doanh thu cho marketing (nguồn).'
      - 'Objective-Task: tính theo mục tiêu cụ thể; nguồn khuyến nghị đây là cách chiến lược nhất.'
      - 'Competitive Parity: chi tương đương đối thủ (ngành cạnh tranh cao).'
      - 'Affordable: chi phần ''đủ khả năng'' (startup, DN nhỏ).'
      when_to_use: Bước 6 của IMC.
      how_to_apply:
      - Dùng % doanh thu làm trần/sàn tham chiếu nhanh (công thức m08_budget_pct_revenue).
      - 'Dùng Objective-Task cho ngân sách chính thức: mục tiêu -> nhiệm vụ -> đơn giá -> cộng lại (m08_objective_task_budget).'
      - Kiểm tra chéo với đối thủ bằng Share of Voice (m08_share_of_voice) nếu ngành cạnh tranh gay gắt.
      - Nếu tổng Objective-Task vượt khả năng chi trả (affordable), thu hẹp mục tiêu (nhóm mục tiêu nhỏ hơn, bán kính hẹp hơn), không cắt đều mọi kênh.
      - Giữ 5-10% ngân sách cho đo lường/test (chuẩn thực hành gợi ý, confidence low).
      how_to_read_results: Nếu % doanh thu thấp hơn nhiều sàn ngành thì dễ không đạt ngưỡng nhận biết; nếu cao hơn trần mà doanh thu không tăng thì kiểm tra thông điệp/kênh trước khi chi thêm.
      pitfalls:
      - 'Chỉ dùng % doanh thu: doanh thu giảm thì cắt marketing, càng giảm tiếp (vòng xoáy).'
      - Competitive parity khi không biết ngân sách thật của đối thủ.
      - 'Affordable mà không cân mục tiêu: có thể chi quá ít để thấy được kết quả.'
      - Không phân biệt chi phí khai trương (một lần) với chi phí duy trì.
      example: Quán doanh thu 400 triệu/tháng, 5% = 20 triệu/tháng (sàn tham chiếu); objective-task cho đợt khai trương tính ra 9,6 triệu cho Facebook geo-target (xem worked_examples).
  - id: "m08-frameworks-6"
    title: "Frameworks: m08_creative_strategy — Chiến lược sáng tạo: Insight - Big Idea - Execution"
    tags: ["frameworks", "m08_creative_strategy", "chiến", "lược", "sáng", "tạo", "insight", "big", "idea", "execution"]
    text: |-
      id: m08_creative_strategy
      name_vi: 'Chiến lược sáng tạo: Insight - Big Idea - Execution'
      name_en: Creative Strategy (Insight -> Big Idea -> Execution)
      origin: 'Thực hành chuẩn của ngành quảng cáo (Bernbach, Ogilvy, 1960s) trong IMC: đi từ sự thật khách hàng tới ý tưởng lớn rồi mới tới sản phẩm sáng tạo, để các kênh khác nhau cùng suy ra từ một gốc.'
      components:
      - 'Insight: sự thật về khách hàng khiến họ hành động.'
      - 'Big Idea: ý tưởng xuyên kênh, đơn giản, mở rộng được.'
      - 'Execution: cách thể hiện theo từng kênh (TV, outdoor, social, PR, event, digital, direct, influencer, product).'
      when_to_use: Bước 4 của IMC.
      how_to_apply:
      - Phỏng vấn/quan sát khách để tìm insight (vd 'người 18-25 muốn cảm giác kết nối bạn bè', như Share a Coke).
      - Viết big idea trong một câu; thử xem có mở rộng được ra ít nhất 3 kênh khác nhau.
      - Lập bảng kênh x vai trò x thể hiện (xem bảng của Share a Coke), tùy biến format nhưng giữ big idea.
      - Thử nghiệm nhỏ (A/B) trước khi triển khai rộng.
      how_to_read_results: Big idea tốt khi người ngoài đoán được thông điệp chỉ sau khi thấy 2 touchpoint bất kỳ, và khách tự tạo nội dung (UGC) mà không cần thưởng.
      pitfalls:
      - Ý tưởng nói về tính năng sản phẩm thay vì cảm xúc/quan hệ.
      - Consistency bị hiểu nhầm là lặp nguyên bản; kết quả nhàm chán.
      - Big idea chỉ đúng ở một kênh.
      example: 'Quán hải sản bình dân: insight ''gia đình ngại bị chặt chém'' -> big idea ''Giá gốc cộng 30 phần trăm, ghi rõ trên bảng'' -> thể hiện: bảng giá minh bạch tại quán, video bóc giá trên TikTok, Zalo gửi giá chợ buổi sáng.'
  - id: "m08-frameworks-7"
    title: "Frameworks: m08_coke_case_framework — Khung phân tích một chiến dịch IMC mẫu (bảng kênh - vai trò - thực thi)"
    tags: ["frameworks", "m08_coke_case_framework", "khung", "phân", "tích", "một", "chiến", "dịch", "imc", "mẫu", "bảng", "kênh"]
    text: |-
      id: m08_coke_case_framework
      name_vi: Khung phân tích một chiến dịch IMC mẫu (bảng kênh - vai trò - thực thi)
      name_en: Channel-Role-Execution Matrix (Share a Coke)
      origin: 'Cách trình bày case Share a Coke trong nguồn: mỗi kênh gán một vai trò (visibility, engagement, credibility...) và cách thực thi; sau đó gom về một thông điệp.'
      components:
      - 'Product (packaging): trung tâm, trở thành media.'
      - 'TV: awareness rộng, cảm xúc.'
      - 'Outdoor: visibility, tên phổ biến theo thành phố.'
      - 'Social: engagement và viral (#ShareACoke).'
      - 'Digital: cá nhân hóa (tạo lon ảo bất kỳ tên).'
      - 'PR: uy tín và buzz.'
      - 'Events: trải nghiệm (kiosk in tên tại chỗ).'
      - 'Direct: email/SMS gắn tên KH.'
      - 'Influencer: khuếch đại (celeb, KOL).'
      when_to_use: 'Thiết kế hoặc kiểm toán một chiến dịch tích hợp: kênh nào đóng vai gì.'
      how_to_apply:
      - Viết big idea ở giữa; vẽ các kênh xung quanh.
      - 'Mỗi kênh một dòng: vai trò, thực thi, KPI.'
      - Kiểm tra mọi dòng đều dẫn về cùng một thông điệp.
      - Phân loại các dòng theo PESO để thấy thiếu loại nào.
      how_to_read_results: Nếu một kênh không có vai trò riêng hoặc đi lệch thông điệp thì cắt bỏ; nếu vai trò nào chưa có kênh phụ trách thì bổ sung.
      pitfalls:
      - Sao chép nguyên si bối cảnh Coca-Cola (ngân sách hàng chục triệu USD) cho SME.
      - 'Quên mặt trái: tên hiếm khách thấy bị bỏ rơi; sales bump tạm thời.'
      example: 'SME: tiệm trà sữa in tên khách lên ly (product = media), story Instagram của khách (shared), Zalo gửi ''ly có tên bạn'' (direct), báo local (earned).'
  - id: "m08-formulas-1"
    title: "Công thức: m08_budget_pct_revenue — Ngân sách truyền thông theo % doanh thu"
    tags: ["công", "thức", "m08_budget_pct_revenue", "ngân", "sách", "truyền", "thông", "theo", "doanh", "thu"]
    text: |-
      id: m08_budget_pct_revenue
      name_vi: Ngân sách truyền thông theo % doanh thu
      name_en: Percentage-of-Revenue Budget
      expression_latex: B = r \times R
      expression_python: B = r * R
      excel: =R*r
      variables:
      - symbol: B
        meaning: Ngân sách marketing/truyền thông
        unit: VND
      - symbol: r
        meaning: Tỷ lệ % doanh thu dành cho marketing (nguồn nêu 5-15%)
        unit: tỷ lệ (0-1)
      - symbol: R
        meaning: Doanh thu kỳ tham chiếu (dự kiến hoặc kỳ trước)
        unit: VND
      when_to_use: Ước lượng nhanh ngân sách tham chiếu cho DN ổn định, so benchmark ngành.
      why_it_works: Gắn chi tiêu với khả năng tạo tiền; dễ tính và dễ kiểm soát. Nhưng nguyên nhân-kết quả bị đảo (doanh thu quyết định chi tiêu thay vì ngược lại), nên chỉ làm khung tham chiếu.
      assumptions:
      - Doanh thu ổn định và dự báo được.
      - Tỷ lệ 5-15% chỉ là khoảng tham chiếu chung; ngành F&B, bán lẻ, SaaS khác nhau.
      pitfalls:
      - Doanh thu giảm thì cắt marketing và sụt thêm.
      - Dùng r của tập đoàn lớn cho SME (SME mới mở cần r cao hơn để tạo nhận biết).
      interpretation: r dưới 5% thường chỉ đủ duy trì; 5-15% tăng trưởng bình thường; trên 15% giai đoạn khai trương/giành thị phần (khoảng tham chiếu, confidence low).
      example:
        inputs:
          R: 400000000
          r: 0.05
        steps:
        - B = 0.05 * 400,000,000 = 20,000,000 VND/tháng
        result: Ngân sách tham chiếu 20 triệu VND/tháng (đã verify bằng python).
  - id: "m08-formulas-2"
    title: "Công thức: m08_objective_task_budget — Ngân sách theo Mục tiêu - Nhiệm vụ"
    tags: ["công", "thức", "m08_objective_task_budget", "ngân", "sách", "theo", "mục", "tiêu", "nhiệm", "vụ"]
    text: |-
      id: m08_objective_task_budget
      name_vi: Ngân sách theo Mục tiêu - Nhiệm vụ
      name_en: Objective-and-Task Budget
      expression_latex: B = \sum_{i=1}^{n} q_i \times c_i
      expression_python: B = sum(q * c for q, c in tasks)
      excel: =SUMPRODUCT(q_range, c_range)
      variables:
      - symbol: tasks
        meaning: Danh sách cặp (q_i, c_i) cho từng nhiệm vụ
        unit: list
      - symbol: q_i
        meaning: Số lượng đơn vị công việc/phân phối của nhiệm vụ i (vd số nghìn impression, số bài PR, số buổi event)
        unit: đơn vị
      - symbol: c_i
        meaning: Đơn giá một đơn vị của nhiệm vụ i
        unit: VND/đơn vị
      when_to_use: Ngân sách chính thức cho chiến dịch; nguồn khuyến nghị là phương pháp chiến lược nhất.
      why_it_works: Đi từ mục tiêu (cần làm những việc gì để đạt) nên mọi đồng chi đều gắn với một kết quả; tránh chi theo cảm tính.
      assumptions:
      - Có thể quy mục tiêu thành khối lượng công việc đo được.
      - Đơn giá ổn định trong kỳ (CPM thay đổi theo mùa, đối thủ).
      pitfalls:
      - Ước lượng sai quan hệ giữa khối lượng và kết quả (frequency cần thiết).
      - Quên chi phí sản xuất nội dung và đo lường.
      interpretation: Nếu tổng B vượt ngân sách khả thi thì thu hẹp mục tiêu thay vì cắt đều mọi hạng mục.
      example:
        inputs:
          tasks:
          - - 160
            - 60000
        steps:
        - 'Nhiệm vụ: 160.000 impressions = 160 nghìn, đơn giá CPM 60.000 VND'
        - B = 160 * 60,000 = 9,600,000 VND
        result: 9,6 triệu VND cho nhiệm vụ Facebook geo-target (đã verify).
  - id: "m08-formulas-3"
    title: "Công thức: m08_cpm — Chi phí trên một nghìn lượt hiển thị"
    tags: ["công", "thức", "m08_cpm", "chi", "phí", "trên", "một", "nghìn", "lượt", "hiển", "thị"]
    text: |-
      id: m08_cpm
      name_vi: Chi phí trên một nghìn lượt hiển thị
      name_en: CPM (Cost Per Mille)
      expression_latex: \text{CPM} = \frac{\text{Cost}}{\text{Impressions}} \times 1000
      expression_python: CPM = cost / impressions * 1000
      excel: =cost/impressions*1000
      variables:
      - symbol: cost
        meaning: Chi phí quảng cáo
        unit: VND
      - symbol: impressions
        meaning: Số lượt hiển thị
        unit: lượt
      when_to_use: So sánh giá các kênh paid để xây dựng ngân sách Objective-Task.
      why_it_works: Chuẩn hóa chi phí về 1.000 lượt hiển thị để so sánh các kênh khác quy mô; 'mille' là nghìn theo thuật ngữ in ấn/báo.
      assumptions:
      - Impression tính theo cách của nền tảng (có thể lặp lại cùng một người).
      pitfalls:
      - CPM rẻ nhưng không đúng tệp là lãng phí.
      - Nhầm impressions với reach (người duy nhất).
      interpretation: Chỉ so sánh CPM trong cùng loại kênh và đối tượng; CPM thực tế VN phụ thuộc ngành, giờ, đấu thầu (confidence low).
      example:
        inputs:
          cost: 9600000
          impressions: 160000
        steps:
        - CPM = 9,600,000 / 160,000 * 1000 = 60,000 VND
        result: CPM = 60.000 VND (đã verify).
  - id: "m08-formulas-4"
    title: "Công thức: m08_grp_reach_frequency — Điểm tiếp cận tổng hợp: Reach, Frequency, GRP"
    tags: ["công", "thức", "m08_grp_reach_frequency", "điểm", "tiếp", "cận", "tổng", "hợp", "reach", "frequency", "grp"]
    text: |-
      id: m08_grp_reach_frequency
      name_vi: 'Điểm tiếp cận tổng hợp: Reach, Frequency, GRP'
      name_en: Reach x Frequency = GRP; Impressions
      expression_latex: \text{GRP} = \text{Reach\%} \times \bar{f}, \quad \text{Impressions} = P \times \text{Reach\%} \times \bar{f}
      expression_python: GRP = reach_pct * f; impressions = P * reach_pct / 100 * f
      excel: =reach_pct*f ; =P*reach_pct/100*f
      variables:
      - symbol: reach_pct
        meaning: Tỷ lệ phần trăm nhóm mục tiêu được tiếp cận ít nhất 1 lần
        unit: phần trăm (0-100)
      - symbol: f
        meaning: Tần suất trung bình mỗi người được tiếp cận
        unit: lần
      - symbol: P
        meaning: Quy mô nhóm mục tiêu
        unit: người
      when_to_use: Đặt mục tiêu Awareness và quy đổi sang số impression cần mua.
      why_it_works: Reach cho biết 'bao nhiêu người', frequency cho biết 'bao nhiêu lần'. Thông điệp cần lặp (thường nhiều lần) mới nhớ, nên GRP = reach x frequency đo áp lực truyền thông tổng. GRP xuất phát từ đo lường TV/radio.
      assumptions:
      - Tần suất trung bình, thực tế phân phối lệch (một số xem quá nhiều lần, số khác 1 lần).
      - Mức tần suất hiệu quả (vd 3-5) là quy tắc kinh nghiệm, không phải hằng số (confidence low).
      pitfalls:
      - 'Tối đa hóa reach mà frequency 1 lần: không tạo recall.'
      - Frequency quá cao gây ad fatigue.
      interpretation: GRP 160 (reach 40 phần trăm x frequency 4) là áp lực vừa phải cho chiến dịch địa phương; so với mục tiêu recall đo được sau chiến dịch.
      example:
        inputs:
          P: 100000
          reach_pct: 40
          f: 4
        steps:
        - Reach người = 100,000 * 0.40 = 40,000
        - GRP = 40 * 4 = 160
        - Impressions = 40,000 * 4 = 160,000
        result: GRP 160; cần 160.000 impressions (đã verify).
  - id: "m08-formulas-5"
    title: "Công thức: m08_funnel_cost — Chi phí trên mỗi hành động theo phễu"
    tags: ["công", "thức", "m08_funnel_cost", "chi", "phí", "trên", "mỗi", "hành", "động", "theo", "phễu"]
    text: |-
      id: m08_funnel_cost
      name_vi: Chi phí trên mỗi hành động theo phễu
      name_en: Funnel Conversion and Cost per Action (CTR, CPC, CPA)
      expression_latex: \text{Clicks} = I \times \text{CTR},\; \text{Actions} = \text{Clicks} \times \text{CVR},\; \text{CPA} = \frac{\text{Cost}}{\text{Actions}}
      expression_python: clicks = impressions * ctr; actions = clicks * cvr; cpa = cost / actions
      excel: =cost/(impressions*ctr*cvr)
      variables:
      - symbol: impressions
        meaning: Số lượt hiển thị
        unit: lượt
      - symbol: ctr
        meaning: Tỷ lệ click trên impression
        unit: tỷ lệ
      - symbol: cvr
        meaning: Tỷ lệ chuyển đổi click sang hành động (ghé quán, đặt hàng, đăng ký)
        unit: tỷ lệ
      - symbol: cost
        meaning: Chi phí chiến dịch
        unit: VND
      when_to_use: Quy đổi mục tiêu hành động (Action trong DAGMAR) sang impression cần mua và ngược lại; so sánh kênh bằng CPA.
      why_it_works: Mỗi tầng phễu giữ lại một phần nhỏ, nhân các tỷ lệ cho ra kết quả cuối; nhìn ra tầng nào rò rỉ nhất.
      assumptions:
      - CTR, CVR ổn định trong thời gian ngắn và đại diện được.
      - Hành động đo được (mã giảm giá, UTM, Zalo ID).
      pitfalls:
      - CTR cao nhưng CVR thấp (clickbait).
      - Không phân biệt CPA lần đầu và CPA khách trung thành (so với CLV).
      interpretation: CPA phải thấp hơn lợi nhuận gộp một khách (hoặc nhỏ hơn 1/3 CLV theo quy tắc LTV:CAC trên 3, xem m03).
      example:
        inputs:
          impressions: 160000
          ctr: 0.012
          cvr: 0.25
          cost: 9600000
        steps:
        - Clicks = 160,000 * 0.012 = 1,920
        - Actions (ghé quán) = 1,920 * 0.25 = 480
        - CPA = 9,600,000 / 480 = 20,000 VND
        result: 480 lượt ghé với CPA 20.000 VND (đã verify; CTR và CVR giả định minh họa).
  - id: "m08-formulas-6"
    title: "Công thức: m08_roas_roi — ROAS và ROI chiến dịch truyền thông"
    tags: ["công", "thức", "m08_roas_roi", "roas", "và", "roi", "chiến", "dịch", "truyền", "thông"]
    text: |-
      id: m08_roas_roi
      name_vi: ROAS và ROI chiến dịch truyền thông
      name_en: ROAS and Campaign ROI
      expression_latex: \text{ROAS} = \frac{\text{Revenue}_{inc}}{\text{Cost}}, \quad \text{ROI} = \frac{\text{Revenue}_{inc}\times GM - \text{Cost}}{\text{Cost}}
      expression_python: roas = rev_inc / cost; roi = (rev_inc * gm - cost) / cost
      excel: =rev_inc/cost ; =(rev_inc*gm-cost)/cost
      variables:
      - symbol: rev_inc
        meaning: Doanh thu tăng thêm nhờ chiến dịch (incremental), không phải tổng doanh thu
        unit: VND
      - symbol: gm
        meaning: Biên lợi nhuận gộp
        unit: tỷ lệ
      - symbol: cost
        meaning: Tổng chi phí chiến dịch (media + sản xuất + influencer)
        unit: VND
      when_to_use: Đánh giá hiệu quả sau chiến dịch; so sánh ROI giữa kênh.
      why_it_works: 'ROAS trả lời ''mỗi đồng chi ra thu về bao nhiêu doanh thu''; ROI cuối cùng phải tính trên lợi nhuận gộp vì doanh thu chưa trừ giá vốn. Nguồn nêu ROI ''ước tính 10:1'' cho Share a Coke mà không nói rõ là doanh thu hay lợi nhuận: nên hiểu là ROAS ước tính.'
      assumptions:
      - Tách được doanh thu tăng thêm khỏi doanh thu nền (baseline), thường qua so sánh vùng đối chứng hoặc kỳ trước.
      pitfalls:
      - Tính ROI trên tổng doanh thu thay vì phần tăng thêm.
      - Gán toàn bộ đơn hàng cho kênh cuối (last-click) bỏ qua vai trò awareness.
      - Bỏ chi phí nhân sự/sản xuất.
      - Khuyến mãi làm doanh thu tăng nhưng lợi nhuận âm.
      interpretation: ROI dương nghĩa là chiến dịch tạo lãi ngay trong kỳ; ROI âm có thể vẫn chấp nhận nếu mục tiêu là awareness và CLV khách mới cao (xem m03).
      example:
        inputs:
          rev_inc: 34000000
          gm: 0.65
          cost: 20000000
        steps:
        - ROAS = 34,000,000 / 20,000,000 = 1.7
        - Lợi nhuận gộp tăng thêm = 34,000,000 * 0.65 = 22,100,000
        - ROI = (22,100,000 - 20,000,000) / 20,000,000 = 0.105
        result: ROAS 1,7; ROI 10,5 phần trăm (đã verify). Chiến dịch hòa vốn nhẹ trong kỳ; giá trị khách quay lại là phần lời thêm.
  - id: "m08-formulas-7"
    title: "Công thức: m08_share_of_voice — Thị phần tiếng nói"
    tags: ["công", "thức", "m08_share_of_voice", "thị", "phần", "tiếng", "nói"]
    text: |-
      id: m08_share_of_voice
      name_vi: Thị phần tiếng nói
      name_en: Share of Voice (SOV)
      expression_latex: \text{SOV} = \frac{S_{brand}}{\sum S_{category}}
      expression_python: sov = s_brand / s_category_total
      excel: =s_brand/s_category_total
      variables:
      - symbol: s_brand
        meaning: Chi tiêu truyền thông (hoặc lượt nhắc đến) của thương hiệu
        unit: VND hoặc lượt
      - symbol: s_category_total
        meaning: Tổng của toàn ngành/đối thủ cạnh tranh trực tiếp
        unit: cùng đơn vị
      when_to_use: Kiểm tra chéo ngân sách theo Competitive Parity; theo dõi cạnh tranh về mức độ hiện diện.
      why_it_works: 'Hiện diện tương đối quan trọng hơn tuyệt đối trong ngành cạnh tranh: nếu đối thủ chiếm phần lớn tiếng nói thì thông điệp bạn bị lấn át. Kết hợp với thị phần thật cho ý tưởng excess SOV (SOV cao hơn market share thường thúc đẩy tăng trưởng; không có trong nguồn, bổ sung từ thực hành ngành, confidence medium).'
      assumptions:
      - Có ước lượng ngân sách đối thủ (từ Meta Ad Library, quan sát).
      pitfalls:
      - Số liệu ngân sách đối thủ thường là phỏng đoán.
      - Chỉ so ngân sách mà không so chất lượng creative.
      interpretation: SOV thấp hơn thị phần dự kiến thì dễ mất thị phần; SOV cao hơn thị phần thì có thể giành thị phần.
      example:
        inputs:
          s_brand: 10
          s_category_total: 50
        steps:
        - Ngân sách quán 10 triệu, hai đối thủ 25 và 15 triệu. Tổng = 50 triệu
        - SOV = 10 / 50 = 0.20
        result: SOV 20 phần trăm (đã verify).
  - id: "m08-formulas-8"
    title: "Công thức: m08_media_value_ratio — Tỷ lệ giá trị truyền thông kiếm được trên chi phí"
    tags: ["công", "thức", "m08_media_value_ratio", "tỷ", "lệ", "giá", "trị", "truyền", "thông", "kiếm", "được", "trên"]
    text: |-
      id: m08_media_value_ratio
      name_vi: Tỷ lệ giá trị truyền thông kiếm được trên chi phí
      name_en: Earned Media Value Ratio (EMV ratio)
      expression_latex: \text{EMV ratio} = \frac{\text{EMV}}{\text{Cost}}
      expression_python: emv_ratio = emv / cost
      excel: =emv/cost
      variables:
      - symbol: emv
        meaning: Giá trị ước tính của earned media nếu phải mua bằng quảng cáo
        unit: VND hoặc USD
      - symbol: cost
        meaning: Chi phí chiến dịch
        unit: cùng đơn vị với EMV
      when_to_use: Mô tả tỷ lệ earned/paid khi báo cáo PR; không dùng làm thước đo lợi nhuận.
      why_it_works: Quy đổi lượt nhắc/bài báo thành tiền để so với paid; nhưng EMV là ước tính chủ quan (không phải tiền thật thu về).
      assumptions:
      - Quy đổi giá trị theo bảng giá quảng cáo tương đương.
      pitfalls:
      - Nhầm EMV với doanh thu thật.
      - Nguồn nêu EMV 7M USD cho Share a Coke mà không nêu chi phí nên không thể tính tỷ lệ; chỉ minh họa.
      interpretation: Tỷ lệ cao nghĩa là chiến dịch tạo nhiều earned/shared so với số tiền paid; chỉ dùng so sánh nội bộ cùng phương pháp quy đổi.
      example:
        inputs:
          emv: 7000000
          cost: 700000
        steps:
        - Giả định minh họa chi phí PR 0,7 triệu USD (không có trong nguồn)
        - EMV ratio = 7,000,000 / 700,000 = 10
        result: Tỷ lệ 10 (chỉ minh họa; xem pitfalls).
  - id: "m08-procedures-1"
    title: "Quy trình: m08_proc_imc_plan — Lập kế hoạch IMC từ đầu đến cuối cho SME"
    tags: ["quy", "trình", "m08_proc_imc_plan", "lập", "kế", "hoạch", "imc", "từ", "đầu", "đến", "cuối", "cho"]
    text: |-
      id: m08_proc_imc_plan
      name: Lập kế hoạch IMC từ đầu đến cuối cho SME
      steps:
      - 'Hỏi đầu vào: (1) sản phẩm/dịch vụ và điểm khác biệt, (2) khách mục tiêu (từ STP; nếu chưa có, chuyển m01), (3) mục tiêu 90 ngày (khai trương, tăng khách giờ thấp điểm, ra món mới...), (4) ngân sách và thời gian, (5) kênh đang có (Fanpage, Zalo, Google Maps, nhân sự), (6) doanh thu và biên lợi nhuận gộp, (7) đối thủ chính.'
      - 'Bước 1 Audience: viết 1-2 persona (tuổi, nghề, nơi sống, kênh dùng, nỗi đau, thời điểm quyết định).'
      - 'Bước 2 Objectives: chẩn đoán giai đoạn DAGMAR yếu nhất (khảo sát 30-50 khách); đặt mục tiêu có số.'
      - 'Bước 3 Key message: câu dưới 10 từ từ định vị và USP; kiểm tra có đúng với sản phẩm, giá, trải nghiệm thật.'
      - 'Bước 4 Creative: tìm insight, viết big idea, quyết định ''sản phẩm là media'' (ly, túi, bàn, hóa đơn) và cơ chế UGC.'
      - 'Bước 5 Mix: chọn 2-4 công cụ + cân PESO; Owned phải sẵn sàng trước Paid (Google Maps, Zalo OA, landing).'
      - 'Bước 6 Budget: lấy % doanh thu làm tham chiếu, tính Objective-Task bằng m08_grp_reach_frequency, m08_cpm, m08_funnel_cost; kiểm tra khả năng chi trả (affordable) và SOV nếu cạnh tranh cao.'
      - 'Bước 7 Timeline: lịch 4-12 tuần (teaser - launch - sustain - review); các kênh khởi chạy cùng tuần; phân vai người chịu trách nhiệm.'
      - 'Bước 8 Measure: KPI mỗi kênh và tổng, mã giảm giá/UTM riêng từng kênh, ghi baseline trước chiến dịch, dashboard hàng tuần, post-campaign review.'
      - 'Điều chỉnh: tuần 2 và tuần 4 chuyển ngân sách từ kênh CPA cao sang CPA thấp (giữ big idea).'
      outputs: 'Tài liệu IMC 1-2 trang: persona, mục tiêu DAGMAR, key message, big idea, bảng kênh-vai trò-thực thi-KPI-ngân sách, timeline, mô hình đo, rủi ro.'
  - id: "m08-procedures-2"
    title: "Quy trình: m08_proc_budget — Chia ngân sách truyền thông"
    tags: ["quy", "trình", "m08_proc_budget", "chia", "ngân", "sách", "truyền", "thông"]
    text: |-
      id: m08_proc_budget
      name: Chia ngân sách truyền thông
      steps:
      - 'Tính tham chiếu: B_ref = r x R (m08_budget_pct_revenue) với r theo giai đoạn (duy trì thấp, khai trương cao).'
      - 'Tính Objective-Task: mục tiêu reach, frequency -> impressions (m08_grp_reach_frequency) -> chi phí = impressions/1000 x CPM (m08_cpm).'
      - 'Cộng các hạng mục (paid media, sản xuất nội dung, event, promotion, đo lường): B_task = tổng (m08_objective_task_budget).'
      - So sánh B_task với B_ref và khả năng chi trả. Nếu B_task lớn hơn nhiều, thu hẹp mục tiêu hoặc kéo dài thời gian.
      - 'Chia theo PESO (gợi ý sơ bộ, điều chỉnh theo thực tế: Paid 40, Shared 30, Owned 15, Earned 15 phần trăm cho chiến dịch khai trương cần viral; confidence low).'
      - Kiểm tra chéo với SOV nếu ngành cạnh tranh gay gắt.
      - Giữ dự phòng 10 phần trăm để chuyển sang kênh thắng sau 2 tuần.
      outputs: Bảng ngân sách theo kênh/PESO/giai đoạn DAGMAR, giả định (CPM, CTR, CVR) và quy tắc chuyển ngân sách.
  - id: "m08-procedures-3"
    title: "Quy trình: m08_proc_audit_consistency — Kiểm tra tính nhất quán thông điệp (IMC audit)"
    tags: ["quy", "trình", "m08_proc_audit_consistency", "kiểm", "tra", "tính", "nhất", "quán", "thông", "điệp", "imc", "audit"]
    text: |-
      id: m08_proc_audit_consistency
      name: Kiểm tra tính nhất quán thông điệp (IMC audit)
      steps:
      - 'Liệt kê mọi touchpoint: biển hiệu, menu, bao bì, website, Fanpage, TikTok, Zalo, Google Maps, nhân viên, hóa đơn, email, sale.'
      - Chụp hoặc sao chép thông điệp, hình ảnh, giọng điệu của từng touchpoint.
      - 'Chấm 3 tiêu chí 1-5: một thông điệp (key message), một diện mạo (logo, màu, ảnh), một giọng (tone of voice).'
      - Gạch đỏ chỗ mâu thuẫn (vd website cao cấp, Facebook liên tục giảm giá).
      - Lập danh sách sửa trong 30 ngày với người phụ trách.
      outputs: Bảng audit điểm nhất quán và danh sách sửa ưu tiên.
  - id: "m08-procedures-4"
    title: "Quy trình: m08_proc_post_campaign — Đánh giá sau chiến dịch (post-campaign analysis)"
    tags: ["quy", "trình", "m08_proc_post_campaign", "đánh", "giá", "sau", "chiến", "dịch", "post", "campaign", "analysis"]
    text: |-
      id: m08_proc_post_campaign
      name: Đánh giá sau chiến dịch (post-campaign analysis)
      steps:
      - Thu KPI từng kênh và tổng theo DAGMAR so với mục tiêu đã đặt.
      - Tách doanh thu tăng thêm khỏi baseline; tính ROAS và ROI (m08_roas_roi).
      - 'Phân tích attribution: so sánh last-click với first-touch/linear để thấy vai trò từng kênh.'
      - 'Ghi bài học: kênh nào hiệu quả, thông điệp nào gây UGC, sai sót vận hành.'
      - 'Kiểm tra hiệu ứng tạm thời: sau chiến dịch doanh số có về mức cũ không (bài học Share a Coke).'
      outputs: Báo cáo bài học và đề xuất cho chiến dịch kế tiếp.
  - id: "m08-decision_rules-1"
    title: "Quy tắc quyết định: Nếu mỗi kênh đang nói một thông điệp khác nhau thì dừng mở kênh mới, làm IMC audit và chốt key mess…"
    tags: ["quy", "tắc", "quyết", "định", "nếu", "mỗi", "kênh", "đang", "nói", "một", "thông", "điệp"]
    text: |-
      Nếu mỗi kênh đang nói một thông điệp khác nhau thì dừng mở kênh mới, làm IMC audit và chốt key message trước.
  - id: "m08-decision_rules-2"
    title: "Quy tắc quyết định: Nếu chưa có persona/định vị (STP) thì quay về m01 trước khi lập IMC."
    tags: ["quy", "tắc", "quyết", "định", "nếu", "chưa", "có", "persona", "vị", "stp", "thì", "quay"]
    text: |-
      Nếu chưa có persona/định vị (STP) thì quay về m01 trước khi lập IMC.
  - id: "m08-decision_rules-3"
    title: "Quy tắc quyết định: Nếu mục tiêu là biết đến (Awareness) thì ưu tiên reach (Paid social, outdoor, PR); nếu là tin (Conv…"
    tags: ["quy", "tắc", "quyết", "định", "nếu", "mục", "tiêu", "là", "biết", "đến", "awareness", "thì"]
    text: |-
      Nếu mục tiêu là biết đến (Awareness) thì ưu tiên reach (Paid social, outdoor, PR); nếu là tin (Conviction) thì review, testimonial, demo; nếu là mua (Action) thì promo, CTA, retargeting, sales.
  - id: "m08-decision_rules-4"
    title: "Quy tắc quyết định: Nếu khách biết nhưng không mua thì đừng tăng reach; tăng bằng chứng (review, thử miễn phí)."
    tags: ["quy", "tắc", "quyết", "định", "nếu", "khách", "biết", "nhưng", "không", "mua", "thì", "đừng"]
    text: |-
      Nếu khách biết nhưng không mua thì đừng tăng reach; tăng bằng chứng (review, thử miễn phí).
  - id: "m08-decision_rules-5"
    title: "Quy tắc quyết định: Nếu ngân sách nhỏ (dưới vài chục triệu/tháng) thì tập trung 2-3 kênh trong bán kính địa phương, ưu …"
