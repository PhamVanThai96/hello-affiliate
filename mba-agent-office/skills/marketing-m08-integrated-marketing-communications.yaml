  - id: "m08-case_lessons-1"
    title: "Bài học case: Coca-Cola Share a Coke (Úc, 2011, rồi 80+ quốc gia)"
    tags: ["bài", "học", "case", "coca", "cola", "share", "coke", "úc", "2011", "rồi", "80", "quốc"]
    text: |-
      name: Coca-Cola Share a Coke (Úc, 2011, rồi 80+ quốc gia)
      type: success
      setup: |
        Coke Úc thấy tiêu thụ giảm ở nhóm 18-25; thay logo trên lon/chai bằng 150 tên phổ biến nhất ('Share a Coke with [tên]'), phối hợp product, TV, outdoor, social (#ShareACoke), website tạo lon ảo, PR, kiosk tại điểm bán, email/SMS và influencer.
      key_calculations:
      - Paid reach 70 phần trăm+ nhóm mục tiêu; earned 870+ media placements (PR value ước 7M USD+).
      - 'Shared: 500.000+ ảnh; tiêu thụ +7 phần trăm trong ngành đang giảm; mở rộng 80+ quốc gia (2012-2015).'
      - ROI ước tính 10:1 (không rõ cách tính, xem notes_source_issues).
      lesson: |
        (1) Product = Media. (2) UGC đáng tin hơn nội dung thương hiệu: thiết kế để khách tự đăng. (3) Cá nhân hóa quy mô lớn. (4) Cảm xúc quan hệ ('chia sẻ') hơn chức năng. (5) Nhất quán không nhàm: một ý tưởng, nhiều thể hiện. (6) Earned lớn khi ý tưởng đáng nói. Hạn chế: khó lặp lại, tên hiếm bị bỏ rơi, sales bump tạm thời. Với SME: bắt chước cơ chế (tên riêng/cá nhân hóa, check-in) chứ không bắt chước ngân sách.
      data_reliability: unverified
  - id: "m08-case_lessons-2"
    title: "Bài học case: Mô hình silo trước IMC (minh họa trong nguồn)"
    tags: ["bài", "học", "case", "mô", "hình", "silo", "trước", "imc", "minh", "họa", "trong", "nguồn"]
    text: |-
      name: Mô hình silo trước IMC (minh họa trong nguồn)
      type: failure
      setup: TV, báo in, PR, email, sự kiện, social mỗi bộ phận một thông điệp A-F; khách nhận 6 thông điệp khác nhau.
      key_calculations:
      - 6 thông điệp / 6 kênh -> 0 thông điệp được nhớ vì bị phân tán (định tính).
      lesson: Ngân sách chia cho nhiều kênh nhưng không có trục chung sẽ không tích lũy recall; nguyên nhân thường là tổ chức silo, không phải thiếu tiền.
      data_reliability: illustrative
  - id: "m08-case_lessons-3"
    title: "Bài học case: Tiệm trà sữa 'Mây Chiều' (SME giả định) tích hợp thông điệp 'Ly này có tên bạn'"
    tags: ["bài", "học", "case", "tiệm", "trà", "sữa", "mây", "chiều", "sme", "giả", "định", "tích"]
    text: |-
      name: Tiệm trà sữa 'Mây Chiều' (SME giả định) tích hợp thông điệp 'Ly này có tên bạn'
      type: sme
      setup: Tiệm trà sữa quận Thanh Khê, Đà Nẵng, doanh thu 250 triệu/tháng, định vị học sinh-sinh viên; trước đó Fanpage khuyến mãi, bảng hiệu nói cao cấp, nhân viên báo giá khác.
      key_calculations:
      - Ngân sách 7% doanh thu = 17,5 triệu/tháng.
      - 'In tên khách lên ly: chi phí thêm 300 VND/ly x 6.000 ly = 1,8 triệu.'
      - Mục tiêu 800 ảnh UGC/tháng; nếu 8 phần trăm khách đăng thì cần 10.000 ly bán ra (10.000 x 0,08).
      lesson: Một insight (bạn bè tặng nhau) + cơ chế tên riêng + QR ưu đãi khi đăng ảnh tạo UGC với chi phí rất thấp; nhất quán bảng hiệu, giá, kịch bản nhân viên trước khi chạy Paid.
      data_reliability: illustrative
  - id: "m08-worked_examples-1"
    title: "Ví dụ có lời giải: m08_we_cafe_opening — Ngân sách khai trương quán cà phê specialty theo Objective-Task"
    tags: ["ví", "dụ", "có", "lời", "giải", "m08_we_cafe_opening", "ngân", "sách", "khai", "trương", "quán", "cà"]
    text: |-
      id: m08_we_cafe_opening
      title: Ngân sách khai trương quán cà phê specialty theo Objective-Task
      situation: Quán specialty Quận 1, doanh thu dự kiến 400 triệu/tháng; nhóm mục tiêu 100.000 nhân viên văn phòng quanh bán kính 2 km; mục tiêu awareness 40 phần trăm, tần suất 4, CPM 60.000 VND.
      inputs:
        R: 400000000
        r: 0.05
        P: 100000
        reach_pct: 40
        f: 4
        cpm: 60000
        ctr: 0.012
        cvr: 0.25
      steps:
      - B tham chiếu = 5 phần trăm x 400 triệu = 20 triệu/tháng
      - Reach người = 100.000 x 40 phần trăm = 40.000
      - GRP = 40 x 4 = 160
      - Impressions = 40.000 x 4 = 160.000
      - Chi phí Paid = 160.000/1000 x 60.000 = 9,6 triệu
      - Clicks = 160.000 x 0,012 = 1.920; lượt ghé = 1.920 x 0,25 = 480
      - CPA = 9,6 triệu / 480 = 20.000 VND mỗi lượt ghé
      result: Paid 9,6 triệu (48 phần trăm ngân sách tham chiếu 20 triệu); phần còn lại 10,4 triệu cho nội dung, KOC, event, đo lường. CTR/CVR giả định (đã verify tính toán bằng python).
  - id: "m08-worked_examples-2"
    title: "Ví dụ có lời giải: m08_we_roi — ROAS và ROI của chiến dịch khuyến mãi giờ thấp điểm cho nhà hàng phở"
    tags: ["ví", "dụ", "có", "lời", "giải", "m08_we_roi", "roas", "và", "roi", "của", "chiến", "dịch"]
    text: |-
      id: m08_we_roi
      title: ROAS và ROI của chiến dịch khuyến mãi giờ thấp điểm cho nhà hàng phở
      situation: Chi 20 triệu cho Facebook + Zalo, thêm 400 đơn, AOV 85.000, biên lợi nhuận gộp 65 phần trăm.
      inputs:
        cost: 20000000
        orders: 400
        aov: 85000
        gm: 0.65
      steps:
      - Doanh thu tăng thêm = 400 x 85.000 = 34 triệu
      - ROAS = 34/20 = 1,7
      - Lợi nhuận gộp = 34 x 0,65 = 22,1 triệu
      - ROI = (22,1 - 20)/20 = 10,5 phần trăm; chi phí mỗi đơn = 20 triệu / 400 = 50.000 VND
      result: ROAS 1,7 nhìn tốt nhưng ROI chỉ 10,5 phần trăm; giá trị nằm ở khách quay lại (so CAC 50.000 với CLV, xem m03). Đã verify.
  - id: "m08-worked_examples-3"
    title: "Ví dụ có lời giải: m08_we_peso_split — Chia ngân sách PESO 30 triệu cho tiệm bánh"
    tags: ["ví", "dụ", "có", "lời", "giải", "m08_we_peso_split", "chia", "ngân", "sách", "peso", "30", "triệu"]
    text: |-
      id: m08_we_peso_split
      title: Chia ngân sách PESO 30 triệu cho tiệm bánh
      situation: Tiệm bánh ít đường Hà Nội ra mắt, ngân sách 30 triệu cho 2 tháng đầu, chưa có website, đã có Fanpage 1.200 follower.
      inputs:
        B: 30000000
        split:
          paid: 0.4
          shared: 0.3
          owned: 0.15
          earned: 0.15
      steps:
      - Paid = 30 x 0,40 = 12 triệu (Meta Ads, TikTok Ads geo-target)
      - Shared = 30 x 0,30 = 9 triệu (hashtag, UGC, quà tặng cho người đăng, KOC nano)
      - Owned = 30 x 0,15 = 4,5 triệu (Google Maps tối ưu, Zalo OA, landing page, ảnh sản phẩm)
      - Earned = 30 x 0,15 = 4,5 triệu (gửi bánh dùng thử cho blogger, báo local)
      - 'Kiểm tra: 0,40+0,30+0,15+0,15 = 1,00'
      result: Paid 12, Shared 9, Owned 4,5, Earned 4,5 triệu VND; tuần 4 chuyển 10 phần trăm sang kênh có CPA thấp nhất. Tỷ lệ chỉ gợi ý, đã verify tổng.
  - id: "m08-worked_examples-4"
    title: "Ví dụ có lời giải: m08_we_audit_sov — Share of Voice và kiểm tra nhất quán cho quán hải sản"
    tags: ["ví", "dụ", "có", "lời", "giải", "m08_we_audit_sov", "share", "of", "voice", "và", "kiểm", "tra"]
    text: |-
      id: m08_we_audit_sov
      title: Share of Voice và kiểm tra nhất quán cho quán hải sản
      situation: Quán hải sản bình dân chi 10 triệu/tháng; hai đối thủ lân cận chi khoảng 25 và 15 triệu (ước lượng).
      inputs:
        s_brand: 10
        competitors:
        - 25
        - 15
      steps:
      - SOV = 10 / (10+25+15) = 20 phần trăm
      - 'Nếu thị phần dự kiến 25 phần trăm thì SOV thấp hơn: cần tăng hoặc khác biệt hóa thay vì đua giá'
      - 'Audit: bảng hiệu (giá gốc + 30 phần trăm), Fanpage (khuyến mãi liên tục), nhân viên (báo giá thời giá): mâu thuẫn ở 2/3 -> chốt message ''Giá gốc cộng 30 phần trăm, ghi rõ'''
      result: SOV 20 phần trăm; ưu tiên sửa nhất quán (chi phí thấp) trước khi tăng ngân sách. Đã verify.
  - id: "m08-practice_questions-1"
    title: "Câu hỏi luyện tập: IMC khác gì với việc đăng cùng một nội dung lên Facebook, TikTok và Zalo?"
    tags: ["câu", "hỏi", "luyện", "tập", "imc", "khác", "gì", "với", "việc", "đăng", "cùng", "một"]
    text: |-
      q: IMC khác gì với việc đăng cùng một nội dung lên Facebook, TikTok và Zalo?
      a: IMC bảo đảm một thông điệp/big idea nhưng tùy biến thể hiện theo vai trò và đặc thù từng kênh (hình thức, giọng, định dạng). Sao chép nguyên văn là copy-paste, bỏ qua khác biệt kênh và hành vi người dùng.
