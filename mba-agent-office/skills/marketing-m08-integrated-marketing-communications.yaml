  - id: "m08-practice_questions-4"
    title: "Câu hỏi luyện tập: Thương hiệu có 80 phần trăm người biết tên nhưng ít người mua. Nên làm gì theo DAGMAR?"
    tags: ["câu", "hỏi", "luyện", "tập", "thương", "hiệu", "có", "80", "phần", "trăm", "người", "biết"]
    text: |-
      q: Thương hiệu có 80 phần trăm người biết tên nhưng ít người mua. Nên làm gì theo DAGMAR?
      a: Awareness đã cao; điểm nghẽn ở Comprehension/Conviction/Action. Bổ sung nội dung giải thích, review, thử nghiệm miễn phí và promo có điều kiện thay vì tăng reach.
  - id: "m08-practice_questions-5"
    title: "Câu hỏi luyện tập: Giải thích PESO và cho một ví dụ cho tiệm cà phê."
    tags: ["câu", "hỏi", "luyện", "tập", "giải", "thích", "peso", "và", "cho", "một", "ví", "dụ"]
    text: |-
      q: Giải thích PESO và cho một ví dụ cho tiệm cà phê.
      a: 'Paid: Meta Ads. Earned: review blogger, báo local. Shared: ảnh check-in khách đăng. Owned: Fanpage, Zalo OA, Google Maps. Dùng Paid kéo traffic về Owned và tạo cơ chế để Shared/Earned tăng.'
  - id: "m08-practice_questions-6"
    title: "Câu hỏi luyện tập: Chiến dịch chi 20 triệu, doanh thu tăng thêm 50 triệu, biên gộp 60 phần trăm. ROAS và ROI?"
    tags: ["câu", "hỏi", "luyện", "tập", "chiến", "dịch", "chi", "20", "triệu", "doanh", "thu", "tăng"]
    text: |-
      q: Chiến dịch chi 20 triệu, doanh thu tăng thêm 50 triệu, biên gộp 60 phần trăm. ROAS và ROI?
      a: ROAS = 2,5. Lợi nhuận gộp = 30 triệu; ROI = (30-20)/20 = 50 phần trăm.
  - id: "m08-practice_questions-7"
    title: "Câu hỏi luyện tập: Vì sao ROI 10:1 của Share a Coke nên đọc thận trọng?"
    tags: ["câu", "hỏi", "luyện", "tập", "vì", "sao", "roi", "10", "của", "share", "coke", "nên"]
    text: |-
      q: Vì sao ROI 10:1 của Share a Coke nên đọc thận trọng?
      a: Nguồn không nêu cách tính (doanh thu hay lợi nhuận), không có chi phí chiến dịch, EMV là ước tính; chưa kiểm chứng.
  - id: "m08-practice_questions-8"
    title: "Câu hỏi luyện tập: Nêu 3 hạn chế của Share a Coke khi áp cho SME."
    tags: ["câu", "hỏi", "luyện", "tập", "nêu", "hạn", "chế", "của", "share", "coke", "khi", "áp"]
    text: |-
      q: Nêu 3 hạn chế của Share a Coke khi áp cho SME.
      a: Khó lặp lại (once-in-a-decade), khách có tên hiếm bị bỏ rơi, sales bump tạm thời; đồng thời ngân sách/quy mô khác xa SME.
  - id: "m08-practice_questions-9"
    title: "Câu hỏi luyện tập: Khi nào dùng Objective-Task và khi nào dùng Affordable?"
    tags: ["câu", "hỏi", "luyện", "tập", "khi", "nào", "dùng", "objective", "task", "và", "affordable"]
    text: |-
      q: Khi nào dùng Objective-Task và khi nào dùng Affordable?
      a: Objective-Task cho chiến dịch có mục tiêu rõ (khuyến nghị). Affordable khi startup rất hạn chế, nhưng nên đối chiếu với mục tiêu để tránh chi dưới ngưỡng hiệu quả.
  - id: "m08-practice_questions-10"
    title: "Câu hỏi luyện tập: SOV của quán 12 triệu so với đối thủ 18 và 20 triệu?"
    tags: ["câu", "hỏi", "luyện", "tập", "sov", "của", "quán", "12", "triệu", "so", "với", "đối"]
    text: |-
      q: SOV của quán 12 triệu so với đối thủ 18 và 20 triệu?
      a: 12/(12+18+20) = 24 phần trăm.
