  - id: "m10-excel_google_sheets_templates-1"
    title: "Mẫu Excel/Sheets: Mô hình DCF tối thiểu cho SME (8 sheet)"
    tags: ["mẫu", "excel", "sheets", "mô", "hình", "dcf", "tối", "thiểu", "cho", "sme", "sheet"]
    text: |-
      name: Mô hình DCF tối thiểu cho SME (8 sheet)
      structure:
      - 'Sheet 1 Inputs: tăng trưởng, biên, capex, NWC, thuế, WACC, g'
      - 'Sheet 2 Historical: 3 năm quá khứ đã chuẩn hóa (Normalized EBITDA)'
      - 'Sheet 3 FCFF: dự phóng 5 năm Revenue -> EBIT -> NOPAT -> FCFF'
      - 'Sheet 4 WACC: CAPM build-up (rf, ERP, beta relevered, size premium)'
      - 'Sheet 5 DCF: chiết khấu, TV, EV -> Equity bridge'
      - 'Sheet 6 Comps: bảng peer, median, áp chiết khấu'
      - 'Sheet 7 Sensitivity: Data Table WACC x g'
      - 'Sheet 8 Football: tổng hợp, biểu đồ thanh'
      formulas:
      - 'Hệ số chiết khấu: =1/(1+WACC)^năm'
      - 'NPV dòng tiền: =NPV(WACC,FCFF_Y1:FCFF_Y5)'
      - 'Terminal Value Gordon: =FCFF_Y5*(1+g)/(WACC-g)'
      - 'Median multiple: =MEDIAN(range)'
      - 'Bảng độ nhạy: Data > What-If Analysis > Data Table'
      - 'Beta relever: =BetaU*(1+(1-T)*D/E)'
  - id: "m10-excel_google_sheets_templates-2"
    title: "Mẫu Excel/Sheets: Football Field"
    tags: ["mẫu", "excel", "sheets", "football", "field"]
    text: |-
      name: Football Field
      structure:
      - 'Cột: Phương pháp | Low | Mid | High | Trọng số (DCF 40-60%, Comps 20-30%, Precedent 20-30%)'
      - 'Giá trị khuyến nghị: =SUMPRODUCT(Mid, Trọng số); vẽ biểu đồ thanh ngang (Low-High)'
