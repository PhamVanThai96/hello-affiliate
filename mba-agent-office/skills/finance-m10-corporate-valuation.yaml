  - id: "m10-practice_questions-5"
    title: "Câu hỏi luyện tập: Vì sao WACC giảm 11% -> 10% (g=3%) làm TV tăng ~14%?"
    tags: ["câu", "hỏi", "luyện", "tập", "vì", "sao", "wacc", "giảm", "11", "10", "làm", "tv"]
    text: |-
      q: Vì sao WACC giảm 11% -> 10% (g=3%) làm TV tăng ~14%?
      a: 'TV tỷ lệ 1/(WACC-g): 1/0.08=12.5 và 1/0.07=14.29, tăng 14.3%.'
