  - id: "m10-case_lessons-1"
    title: "Bài học case: Microsoft mua LinkedIn (26.2 tỷ USD, 2016)"
    tags: ["bài", "học", "case", "microsoft", "mua", "linkedin", "26", "tỷ", "usd", "2016"]
    text: |-
      name: Microsoft mua LinkedIn (26.2 tỷ USD, 2016)
      type: success
      setup: Microsoft mua LinkedIn ~196 USD/cổ phiếu, phụ trội ~50% so với giá trước thông báo; LinkedIn doanh thu 2015 ~3.0 tỷ USD (tăng ~35%), lỗ GAAP do SBC; 433 triệu thành viên.
      key_calculations:
      - Equity/Revenue = 26.2/3.0 = 8.7x; EV (net cash ~2.5) = 23.7 -> EV/Revenue ≈ 7.9x
      - 'EV/EBITDA: 26.2/0.45 ≈ 58x (EBITDA sau SBC); với EBITDA điều chỉnh 0.78: 26.2/0.78 ≈ 33.6x - định nghĩa EBITDA đổi cảm nhận về giá'
      - Giá trước thông báo ≈ 26.2/1.49 = 17.58; phụ trội ≈ 8.62 tỷ USD
      - Synergy 2.3 tỷ doanh thu/năm x 30% x 0.8 = 0.552; PV = 0.552/(0.09-0.03) = 9.2 tỷ > 8.62 -> giá trị tạo ra ≈ +0.58 tỷ, biên mỏng
      - 'Hậu kiểm: doanh thu ~16 tỷ năm 2024, CAGR (16/3)^(1/8)-1 = 23.3%; EV/Rev 5x -> 80 tỷ -> IRR 15.0%; cần 52.2 tỷ (3.3x) để đạt 9%'
      lesson: Đọc multiple cùng tăng trưởng; giá trị chiến lược trong hệ sinh thái; quy tắc PV synergy >= premium; vốn kiên nhẫn; biên an toàn mỏng thì thực thi quyết định.
      data_reliability: illustrative
  - id: "m10-case_lessons-2"
    title: "Bài học case: HP mua Autonomy (11.1 tỷ USD, 2011-2012)"
    tags: ["bài", "học", "case", "hp", "mua", "autonomy", "11", "tỷ", "usd", "2011", "2012"]
    text: |-
      name: HP mua Autonomy (11.1 tỷ USD, 2011-2012)
      type: failure
      setup: HP mua ~42.11 USD/cổ phiếu, phụ trội ~64%; sau ~1 năm ghi giảm 8.8 tỷ USD (~79% giá mua), cáo buộc phóng đại doanh thu; số liệu 'thực' do HP đưa ra, một phần còn tranh tụng.
      key_calculations:
      - EV/Revenue công bố = 11.1/1.0 = 11.1x; theo HP = 11.1/0.7 ≈ 15.9x
      - EV/EBITDA công bố = 11.1/0.40 = 27.8x; thực = 11.1/(0.7x25%) = 11.1/0.175 ≈ 63x
      - 'Với 4-6x doanh thu thực: giá trị 2.8-4.2 tỷ, trả thừa 6.9-8.3 tỷ, gần khoản ghi giảm 8.8 tỷ'
      - Ghi giảm/giá mua = 8.8/11.1 = 79.3%
      lesson: Kiểm chứng chất lượng doanh thu; DD độc lập; không trả phụ trội khi không có synergy cụ thể; red flags (biên 40%+, doanh thu phần cứng bán lại, khách hàng tập trung, chuẩn kế toán khác, phụ trội 64%); chạy Comps với multiple thận trọng là thấy ngay; kỷ luật walk away; HĐQT không đóng dấu trong vài tuần.
      data_reliability: illustrative
  - id: "m10-case_lessons-3"
    title: "Bài học case: Bao Bì Xanh Việt (Bình Dương) - chủ bán 100% cho tập đoàn"
    tags: ["bài", "học", "case", "bao", "bì", "xanh", "việt", "bình", "dương", "chủ", "bán", "100"]
    text: |-
      name: Bao Bì Xanh Việt (Bình Dương) - chủ bán 100% cho tập đoàn
      type: sme
      setup: 'Công ty giả định: doanh thu 80,000 triệu, EBIT 7,600, D&A 2,400, EBITDA 10,000, nợ 20,000 (9.5%), tiền 5,000, LNST 4,560, 1,000,000 cổ phần; bên mua chào 48,000 triệu cho vốn chủ. Số liệu hoàn toàn giả định.'
      key_calculations:
      - βL = 0.85 x [1 + 0.8 x 0.3/0.7] = 1.1414; Ke = 3% + 1.1414x8% + 3% = 15.13%; WACC = 30%x10%x0.8 + 70%x15.13% = 12.99%
      - FCFF Y1 = 7,168 + 2,688 - 4,032 - 1,728 = 4,096; PV 5 năm = 21,532
      - FCFF6 chuẩn hóa = 9,176; TV = 9,176/(0.1299-0.04) ≈ 102,040; PV(TV) ≈ 55,403; EV = 76,935 (7.7x EBITDA); Equity = 76,935 - 20,000 + 5,000 = 61,935; TV chiếm 72%
      - RR = 17.0%, ROIC ngụ ý = 4%/17% ≈ 23.6% (cao, thử kịch bản thận trọng)
      - 'Độ nhạy WACC ±1%, g=4%: Equity 53,663 - 72,305'
      - 'Comps: median 7.2x, chiết khấu 15% -> 6.12x; EV 61,200; Equity 46,200; range 35,150 - 61,500'
      - 'Precedent: median 7.15x -> EV 71,500; Equity 56,500; range 45,000 - 67,000'
      - Khuyến nghị 0.5x61,935 + 0.25x46,200 + 0.25x56,500 = 56,643 (~7.2x EBITDA, 56,643 VND/cổ phần); chào 48,000 thấp hơn 15.3%
      lesson: Chuẩn hóa EBITDA trước; dùng >=2 phương pháp; WACC có size premium; bảng độ nhạy là công cụ đàm phán (mức chào thấp hơn đáy bảng); giá chào ~66-72 tỷ, mục tiêu ~57-62 tỷ, walk away ~52 tỷ; key person -> earn-out, ở lại tư vấn.
      data_reliability: illustrative
  - id: "m10-case_lessons-4"
    title: "Bài học case: Ví dụ DCF công ty công nghệ (tỷ VND)"
    tags: ["bài", "học", "case", "ví", "dụ", "dcf", "công", "ty", "nghệ", "tỷ", "vnd"]
    text: |-
      name: Ví dụ DCF công ty công nghệ (tỷ VND)
      type: success
      setup: Doanh thu Y1 1,000 -> Y5 1,580; biên EBIT 20% -> 25%; T 20%; D&A 5%, CAPEX 7% doanh thu; ΔNWC 3% ΔDT; WACC 11%; g 3%; nợ ròng 300; 100 triệu cổ phiếu.
      key_calculations:
      - FCFF 140.0, 165.7, 198.3, 233.3, 280.5; PV tổng 725.8
      - TV = 280.5x1.03/0.08 = 3,611; PV(TV) = 2,143; EV = 2,869; Equity = 2,569; 25,690 VND/cổ phiếu
      - TV/EBITDA5 = 3,611/474 = 7.6x; PV(TV)/EV = 74.7%
      lesson: Gần 3/4 giá trị nằm ở giả định sau năm 5; bảng độ nhạy cho 17,981 - 42,606 VND.
      data_reliability: illustrative
  - id: "m10-case_lessons-5"
    title: "Bài học case: Mây Xanh - chuỗi trà sữa 3 cửa hàng"
    tags: ["bài", "học", "case", "mây", "xanh", "chuỗi", "trà", "sữa", "cửa", "hàng"]
    text: |-
      name: Mây Xanh - chuỗi trà sữa 3 cửa hàng
      type: sme
      setup: EBITDA báo cáo 1,200 triệu; chủ không nhận lương (lương thị trường ~240/năm); nợ 600; tiền 200; multiple tham khảo 3.5x EBITDA; bên mua chào 2,500.
      key_calculations:
      - EBITDA chuẩn hóa = 1,200 - 240 = 960
      - EV = 960 x 3.5 = 3,360; Equity = 3,360 - 600 + 200 = 2,960
      - Chào 2,500 thấp hơn 2,960 khoảng 15.5% (2,500/2,960 - 1 = -15.5%)
      lesson: Không chấp nhận ngay; thêm DCF/kịch bản để thương lượng; nhớ trừ lương quản lý thị trường khi chủ không nhận lương.
      data_reliability: illustrative
  - id: "m10-worked_examples-1"
    title: "Ví dụ có lời giải: DCF đầy đủ công ty công nghệ"
    tags: ["ví", "dụ", "có", "lời", "giải", "dcf", "đầy", "đủ", "công", "ty", "nghệ"]
    text: |-
      name: DCF đầy đủ công ty công nghệ
      inputs:
        revenue:
        - 1000
        - 1150
        - 1300
        - 1450
        - 1580
        ebit_margin:
        - 0.2
        - 0.21
        - 0.22
        - 0.23
        - 0.25
        tax: 0.2
        da_pct: 0.05
        capex_pct: 0.07
        nwc_pct_of_delta_rev: 0.03
        wacc: 0.11
        g: 0.03
        net_debt: 300
        shares_million: 100
      steps:
      - 'Y1: EBIT 200, NOPAT 160, D&A 50, CAPEX 70, ΔNWC 0 -> FCFF 140; PV 126.1'
      - 'Y2: EBIT 241.5, NOPAT 193.2, D&A 57.5, CAPEX 80.5, ΔNWC 4.5 -> FCFF 165.7; PV 134.5'
      - 'Y3: FCFF 198.3; PV 145.0. Y4: FCFF 233.3; PV 153.7. Y5: FCFF 280.5; PV 166.5. Tổng PV = 725.8'
      - TV = 280.5 x 1.03 / 0.08 = 3,611.4; PV(TV) = 3,611.4 / 1.11^5 = 2,143.2
      - EV = 725.8 + 2,143.2 = 2,869.0; Equity = 2,869.0 - 300 = 2,569.0; Value/share = 2,569.0 / 100 triệu = 25,690 VND
      - 'Cross-check: TV/EBITDA5 = 3,611.4/474 = 7.6x; PV(TV)/EV = 74.7%'
      - 'Độ nhạy: WACC 9% g 4% = 42,606; WACC 13% g 2% = 17,981'
      result: EV ≈ 2,869 tỷ; Equity ≈ 2,569 tỷ; giá nội tại ≈ 25,690 VND/cổ phiếu (khoảng 17,981 - 42,606 trong bảng độ nhạy)
  - id: "m10-worked_examples-2"
    title: "Ví dụ có lời giải: Định giá SME bán 100% (Bao Bì Xanh Việt) từ DCF đến khuyến nghị"
    tags: ["ví", "dụ", "có", "lời", "giải", "định", "giá", "sme", "bán", "100", "bao", "bì"]
    text: |-
      name: Định giá SME bán 100% (Bao Bì Xanh Việt) từ DCF đến khuyến nghị
      inputs:
        ebitda: 10000
        net_debt: 15000
        wacc: 0.12992
        g: 0.04
        fcff_5y:
        - 4096
        - 5188
        - 6883
        - 7543
        - 8187
        fcff6: 9176
        offer: 48000
      steps:
      - 'Beta/WACC: βL 1.1414; Ke 15.13%; WACC 12.99%'
      - PV FCFF 5 năm = 21,532; TV = 9,176/0.08992 = 102,040; PV(TV) = 55,403
      - EV = 76,935; Equity DCF = 76,935 - 20,000 + 5,000 = 61,935; TV share 72.0%
      - 'Comps: 7.2x x 0.85 = 6.12x; EV 61,200; Equity 46,200'
      - 'Precedent: median 7.15x; EV 71,500; Equity 56,500'
      - Khuyến nghị = 0.5x61,935 + 0.25x46,200 + 0.25x56,500 = 56,642.5; EV = 71,642.5 (7.16x EBITDA)
      - Offer gap = 48,000/56,642.5 - 1 = -15.3%; mức chào thấp hơn đáy DCF sensitivity (53,663)
      result: Equity khuyến nghị ≈ 56,643 triệu (~56,643 VND/cổ phần); chào cao 66-72 tỷ, mục tiêu 57-62 tỷ, walk away ~52 tỷ
  - id: "m10-worked_examples-3"
    title: "Ví dụ có lời giải: Comps và Precedent cho công ty thương mại điện tử (EBITDA 400 tỷ, Revenue 5,000 tỷ)"
    tags: ["ví", "dụ", "có", "lời", "giải", "comps", "và", "precedent", "cho", "công", "ty", "thương"]
    text: |-
      name: Comps và Precedent cho công ty thương mại điện tử (EBITDA 400 tỷ, Revenue 5,000 tỷ)
      inputs:
        peers_ev_revenue:
        - 0.8
        - 0.5
        - 2.5
        - 1.5
        peers_ev_ebitda:
        - 10.5
        - 8.2
        - 25.0
        precedent_ev_ebitda:
        - 12.0
        - 11.5
        - 14.0
        - 10.0
      steps:
      - Median EV/Revenue (4 giá trị) = (0.8+1.5)/2 = 1.15x; EV = 5,000 x 1.15 = 5,750
      - Median EV/EBITDA (3 giá trị hợp lệ, loại NM của Tokopedia/GoTo) = 10.5x; EV = 400 x 10.5 = 4,200
      - 'Chênh 5,750/4,200 - 1 = 36.9%: biên EBITDA 8% thấp hơn peer, nên không dựa một multiple'
      - Precedent median EV/EBITDA = (11.5+12.0)/2 = 11.75x; EV = 400 x 11.75 = 4,700 (đã gồm control premium, cao hơn Comps hợp lý)
      result: Comps 4,200 - 5,750 tỷ; Precedent 4,700 tỷ (peer là số minh họa)
  - id: "m10-worked_examples-4"
    title: "Ví dụ có lời giải: Kiểm tra phụ trội: Microsoft - LinkedIn"
    tags: ["ví", "dụ", "có", "lời", "giải", "kiểm", "tra", "phụ", "trội", "microsoft", "linkedin"]
    text: |-
      name: 'Kiểm tra phụ trội: Microsoft - LinkedIn'
      inputs:
        price: 26.2
        premium_pct: 0.49
        rev_syn: 2.3
        margin: 0.3
        tax: 0.2
        wacc: 0.09
        g: 0.03
      steps:
      - Vốn hóa trước = 26.2/1.49 = 17.58; phụ trội = 26.2 - 17.58 = 8.62
      - Lợi nhuận sau thuế synergy = 2.3 x 0.3 x 0.8 = 0.552/năm
      - PV synergy = 0.552/0.06 = 9.2
      - Giá trị tạo ra = 9.2 - 8.62 = +0.58 tỷ USD
      result: 'PV synergy 9.2 > premium 8.62: hợp lý nhưng biên an toàn mỏng (~6.7% của premium)'
  - id: "m10-worked_examples-5"
    title: "Ví dụ có lời giải: Equity Bridge và giá/cổ phiếu"
    tags: ["ví", "dụ", "có", "lời", "giải", "equity", "bridge", "và", "giá", "cổ", "phiếu"]
    text: |-
      name: Equity Bridge và giá/cổ phiếu
      inputs:
        ev: 3000
        debt: 800
        cash: 200
        minority: 100
        diluted_shares: 50000000
      steps:
      - Equity = 3,000 - 800 + 200 - 100 = 2,300 tỷ
      - Giá/cổ phiếu = 2,300 tỷ / 50 triệu = 46,000 VND
      result: 46,000 VND/cổ phiếu
  - id: "m10-worked_examples-6"
    title: "Ví dụ có lời giải: Pre-money / Post-money"
    tags: ["ví", "dụ", "có", "lời", "giải", "pre", "money", "post"]
    text: |-
      name: Pre-money / Post-money
      inputs:
        pre_money: 40
        investment: 10
      steps:
      - Post = 40 + 10 = 50 tỷ
      - Nhà đầu tư = 10/50 = 20%; chủ cũ 80%; kiểm tra 80% x 50 = 40
      result: Nhường 20% cổ phần
  - id: "m10-worked_examples-7"
    title: "Ví dụ có lời giải: Terminal Value và độ nhạy (bài tập 2 và 5)"
    tags: ["ví", "dụ", "có", "lời", "giải", "terminal", "value", "và", "độ", "nhạy", "bài", "tập"]
    text: |-
      name: Terminal Value và độ nhạy (bài tập 2 và 5)
      inputs:
        fcff5: 320
        wacc: 0.11
        g: 0.03
      steps:
      - TV = 320 x 1.03/0.08 = 4,120; PV(TV) = 4,120/1.11^5 = 2,445
      - 'WACC 10%: mẫu số 0.07; TV/TV_old = 0.08/0.07 = 1.143 (+14.3%)'
      result: TV 4,120 tỷ; PV 2,445 tỷ; giảm WACC 1% làm TV tăng 14.3%
  - id: "m10-practice_questions-1"
