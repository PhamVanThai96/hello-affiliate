  - id: "m02-tong-quan"
    title: "Tổng quan m02"
    tags: ["m02", "hoạch", "định", "ngân", "sách", "vốn", "thẩm", "dự", "án", "đầu", "tư", "capital"]
    text: |-
      Hoạch định ngân sách vốn (Thẩm định dự án đầu tư) (Capital Budgeting) — module m02

      Mục đích: Quy trình đánh giá và chọn các dự án đầu tư dài hạn (thường trên 1 năm) để phân bổ vốn khan hiếm sao cho tối đa hóa giá trị doanh nghiệp. Trả lời bằng con số câu hỏi: mua máy này, mở chi nhánh kia hay không làm gì, dựa trên dòng tiền tăng thêm sau thuế chiết khấu theo chi phí vốn (NPV, IRR, MIRR, PI, Payback, DPP, EAA) kèm phân tích rủi ro (độ nhạy, kịch bản, hòa vốn, real options).

      Dùng khi:
      - Có nên mua máy, mở chi nhánh, thay thiết bị, nâng cấp ERP/IT, ra sản phẩm mới? Tính NPV/IRR/Payback
      - Chọn 1 trong 2 phương án loại trừ nhau (máy A vs máy B) và NPV, IRR cho kết luận ngược nhau
      - Ngân sách/hạn mức vay có hạn, nhiều dự án tốt - cần chọn tổ hợp (capital rationing)
      - So sánh phương án có vòng đời khác nhau (máy bền 3 năm vs 5 năm)
      - Lập bảng dòng tiền dự án sau thuế: khấu hao, thuế, NWC, giá trị thu hồi, chi phí cơ hội, chi phí chìm
      - Phân tích rủi ro dự án: độ nhạy, kịch bản, hòa vốn (Goal Seek), real options, tiêu chí dừng
      - Dự án bắt buộc (luật môi trường, PCCC): chọn phương án chi phí hiện tại ròng thấp nhất

      Nên nắm trước: - m01

      Module liên quan: - 'm01: giá trị thời gian của tiền (PV, FV, niên kim, hàm NPV/IRR nền tảng)' - 'm03: chi phí vốn WACC/CAPM là tỷ suất chiết khấu r của NPV' - 'm04: cấu trúc vốn; SME thường dùng lãi vay + phần bù rủi ro làm r' - 'm05: phân tích BCTC để lấy EBITDA, thuế, lịch sử dự báo' - 'm06: vốn lưu động (NWC) - khoản dòng tiền hay bị quên' - 'm08: rủi ro và suất sinh lời để điều chỉnh r theo rủi ro dự án' - 'm…

      Công thức (tra chi tiết bằng skill_search("<id>")):
      - m02_ocf: Dòng tiền hoạt động sau thuế
      - m02_tax_shield: Lá chắn thuế khấu hao
      - m02_initial_outlay: Vốn đầu tư ban đầu (năm 0)
      - m02_terminal_cf: Dòng tiền kết thúc dự án
      - m02_npv: Giá trị hiện tại ròng
      - m02_irr: Tỷ suất hoàn vốn nội bộ
      - m02_mirr: IRR điều chỉnh
      - m02_pp: Thời gian hoàn vốn
      - m02_dpp: Hoàn vốn có chiết khấu
      - m02_pi: Chỉ số sinh lời
      - m02_eaa: Dòng tiền tương đương hằng năm
      - m02_annuity_factor: Hệ số hiện giá niên kim
      - m02_incremental_irr: IRR gia tăng / điểm giao
      - m02_expected_npv: NPV kỳ vọng theo kịch bản
      - m02_sd_npv: Độ lệch chuẩn NPV
      - m02_breakeven_ebitda: EBITDA hòa vốn (NPV = 0) và biên an toàn
      - m02_breakeven_units: Dòng tiền ròng hằng năm cần để hòa vốn / số đơn vị hòa vốn
      - m02_strategic_npv: NPV chiến lược và giá trị quyền chọn
      - m02_breakeven_prob: Xác suất hòa vốn của quyền chọn
      - m02_digital_npv: NPV thời đại số (khung điều chỉnh)
      - m02_sensitivity: Độ nhạy NPV

      Kho tra cứu của module: Khái niệm 31, Công thức 21, Quy trình 6, Quy tắc quyết định 18, Chuẩn so sánh 8, Lỗi thường gặp 14, Lưu ý SME Việt Nam 10, Bài học case 3, Ví dụ có lời giải 8, Câu hỏi luyện tập 8, Checklist 13, Mẫu Excel/Sheets 6. Tra bằng skill_search với từ khoá chủ đề (vd "ví dụ NPV", "lỗi thường gặp WACC").
  - id: "m02-concepts-1"
    title: "Khái niệm: Hoạch định ngân sách vốn"
    tags: ["khái", "niệm", "hoạch", "định", "ngân", "sách", "vốn"]
    text: |-
      term_vi: Hoạch định ngân sách vốn
      term_en: Capital Budgeting
      definition: Quy trình đánh giá và lựa chọn dự án đầu tư dài hạn để phân bổ nguồn vốn khan hiếm, nhằm tối đa hóa giá trị doanh nghiệp/tài sản chủ sở hữu.
      why_it_matters: 'Quyết định tiền lớn, khó đảo ngược (máy chuyên dụng bán lại rất rẻ), tác động 5-20 năm, có chi phí cơ hội, định hình lợi thế cạnh tranh. Buffett: quyết định quan trọng nhất của CEO là phân bổ vốn. Thay cảm tính bằng con số.'
  - id: "m02-concepts-2"
    title: "Khái niệm: Nguồn gốc lý thuyết"
    tags: ["khái", "niệm", "nguồn", "gốc", "lý", "thuyết"]
    text: |-
      term_vi: Nguồn gốc lý thuyết
      term_en: Theoretical origins
      definition: 'Irving Fisher và Jack Hirshleifer (1930s-1950s): nền tảng NPV, tách quyết định đầu tư khỏi quyết định tài trợ. Joel Dean (1951): sách Capital Budgeting hệ thống hóa. Lorie và Savage (1955): đa nghiệm IRR, capital rationing. Stewart Myers (1977): tư duy Real Options. Các mốc năm theo cách giáo trình thường trích, cần đối chiếu bản gốc khi dùng học thuật.'
      why_it_matters: 'Trước thập niên 1950 doanh nghiệp dùng kinh nghiệm và Payback thô (coi 1 đồng hôm nay bằng 1 đồng sau 5 năm, bỏ qua dòng tiền sau hoàn vốn). Nguyên tắc hiện đại: dự án đáng làm nếu giá trị hiện tại ròng dương. Từ đó sinh NPV (đo trực tiếp), IRR (diễn đạt thành tỷ suất), PI (xếp hạng khi thiếu vốn), mỗi công cụ vá một lỗ hổng của công cụ trước.'
  - id: "m02-concepts-3"
    title: "Khái niệm: Các loại dự án"
    tags: ["khái", "niệm", "các", "loại", "dự", "án"]
    text: |-
      term_vi: Các loại dự án
      term_en: Project types
      definition: 'Theo mục đích: Expansion (mở rộng), Replacement (thay thế), Mandatory (bắt buộc pháp lý), R&D/Innovation, M&A, Strategic/Exploratory (pilot, thử thị trường). Theo quan hệ: Independent (độc lập), Mutually exclusive (loại trừ lẫn nhau), Contingent (phụ thuộc: B chỉ làm được nếu có A).'
      why_it_matters: 'Quy tắc ra quyết định đổi theo loại. Độc lập: NPV>0 là làm. Loại trừ: so sánh và chọn NPV cao nhất (nơi NPV và IRR xung đột). Bắt buộc: NPV có thể âm nhưng vẫn phải làm, bài toán là chọn phương án chi phí hiện tại ròng thấp nhất.'
  - id: "m02-concepts-4"
    title: "Khái niệm: Quy trình 7 bước"
    tags: ["khái", "niệm", "quy", "trình", "bước"]
    text: |-
      term_vi: Quy trình 7 bước
      term_en: 7-step capital budgeting process
      definition: 1 Idea generation; 2 Preliminary screening (loại dự án lệch chiến lược); 3 Cash flow estimation; 4 Financial analysis (NPV, IRR, Payback, PI); 5 Project selection (ràng buộc vốn, chiến lược, rủi ro); 6 Implementation (milestone, kiểm soát ngân sách); 7 Post-audit (thực tế vs dự phóng).
      why_it_matters: Post-audit là bước duy nhất giúp doanh nghiệp học; thiếu nó, người dự báo luôn lạc quan quá mức (optimism bias) mà không bị hiệu chỉnh. Nhiều tập đoàn bắt người đề xuất chịu trách nhiệm với dự phóng của mình qua post-audit hằng quý.
  - id: "m02-concepts-5"
    title: "Khái niệm: Dòng tiền tăng thêm"
    tags: ["khái", "niệm", "dòng", "tiền", "tăng", "thêm"]
    text: |-
      term_vi: Dòng tiền tăng thêm
      term_en: Incremental cash flow
      definition: 'Chỉ phần dòng tiền THAY ĐỔI do dự án: CF có dự án trừ CF không có dự án.'
      why_it_matters: Quyết định hướng về tương lai; chỉ những gì thay đổi theo quyết định mới liên quan.
  - id: "m02-concepts-6"
    title: "Khái niệm: Chi phí chìm"
    tags: ["khái", "niệm", "chi", "phí", "chìm"]
    text: |-
      term_vi: Chi phí chìm
      term_en: Sunk cost
      definition: Chi phí đã chi, không thu hồi được dù làm hay không làm dự án (ví dụ 500 triệu nghiên cứu đã chi, 40 triệu khảo sát) - phải LOẠI khỏi phân tích.
      why_it_matters: 'Gốc của ngụy biện chi phí chìm khiến Iridium tiếp tục đổ tiền. Câu hỏi kiểm tra: nếu chưa chi gì, hôm nay tôi có làm không?'
  - id: "m02-concepts-7"
    title: "Khái niệm: Chi phí cơ hội"
    tags: ["khái", "niệm", "chi", "phí", "cơ", "hội"]
    text: |-
      term_vi: Chi phí cơ hội
      term_en: Opportunity cost
      definition: Giá trị của phương án tốt nhất bị bỏ qua khi dùng tài sản/nhân sự sẵn có cho dự án (ví dụ xưởng trống đang cho thuê 60 triệu/năm thì 60 triệu là chi phí của dự án).
      why_it_matters: Tài sản sẵn có không miễn phí; bỏ sót làm đánh giá quá cao dự án.
  - id: "m02-concepts-8"
    title: "Khái niệm: Ngoại tác / ăn mòn doanh số"
    tags: ["khái", "niệm", "ngoại", "tác", "ăn", "mòn", "doanh", "số"]
    text: |-
      term_vi: Ngoại tác / ăn mòn doanh số
      term_en: Externalities / Cannibalization
      definition: Tác động phụ của dự án lên dự án/sản phẩm khác (sản phẩm mới ăn doanh số sản phẩm cũ) phải đưa vào dòng tiền tăng thêm.
      why_it_matters: Nếu bỏ qua, dòng tiền gia tăng bị thổi phồng.
  - id: "m02-concepts-9"
    title: "Khái niệm: Không tính dòng tiền tài trợ"
    tags: ["khái", "niệm", "không", "tính", "dòng", "tiền", "tài", "trợ"]
    text: |-
      term_vi: Không tính dòng tiền tài trợ
      term_en: Ignore financing cash flows
      definition: Không trừ lãi vay, trả gốc nợ trong dòng tiền dự án; chi phí vốn nằm trong tỷ suất chiết khấu (WACC).
      why_it_matters: Vừa trừ lãi trong dòng tiền vừa chiết khấu WACC là phạt dự án hai lần (double counting). Đây cũng là tách bạch investment và financing của Fisher.
  - id: "m02-concepts-10"
    title: "Khái niệm: Dòng tiền thay vì lợi nhuận kế toán"
    tags: ["khái", "niệm", "dòng", "tiền", "thay", "vì", "lợi", "nhuận", "kế", "toán"]
    text: |-
      term_vi: Dòng tiền thay vì lợi nhuận kế toán
      term_en: Cash flow vs accounting profit
      definition: Thẩm định dùng dòng tiền tự do sau thuế của dự án, không dùng lợi nhuận kế toán.
      why_it_matters: Lợi nhuận kế toán chứa khoản không phải tiền (khấu hao) và ghi nhận dồn tích (bán chịu chưa thu tiền). Nhà đầu tư chỉ tiêu được tiền thật, và tiền nhận sớm quý hơn.
  - id: "m02-concepts-11"
    title: "Khái niệm: Cấu trúc dòng tiền dự án"
    tags: ["khái", "niệm", "cấu", "trúc", "dòng", "tiền", "dự", "án"]
    text: |-
      term_vi: Cấu trúc dòng tiền dự án
      term_en: Initial / Operating / Terminal cash flows
      definition: 'Initial (năm 0): CAPEX + lắp đặt/vận chuyển/chạy thử + thu từ bán tài sản cũ - thuế trên lãi bán (hoặc + tiết kiệm thuế nếu lỗ) + tăng NWC. Operating (năm 1..n): EBIT(1-T)+Dep - dNWC - maintenance CAPEX. Terminal (năm cuối): salvage value - thuế trên chênh lệch (giá bán - giá trị sổ sách) + thu hồi NWC.'
      why_it_matters: NWC là tiền kẹt thật ở đầu dự án (tồn kho, công nợ phải thu) và thu hồi khi kết thúc. SME quên khoản này nên thiếu tiền mặt tháng thứ 3 dù dự án có lãi trên giấy.
  - id: "m02-concepts-12"
    title: "Khái niệm: Lá chắn thuế khấu hao"
    tags: ["khái", "niệm", "lá", "chắn", "thuế", "khấu", "hao"]
    text: |-
      term_vi: Lá chắn thuế khấu hao
      term_en: Depreciation tax shield
      definition: 'Khoản thuế tiết kiệm được nhờ khấu hao làm giảm lợi nhuận chịu thuế: Dep x T.'
      why_it_matters: Khấu hao không phải tiền nhưng làm tăng NPV; khấu hao nhanh hơn thì lá chắn đến sớm hơn nên PV lớn hơn.
  - id: "m02-concepts-13"
    title: "Khái niệm: Giá trị hiện tại ròng"
    tags: ["khái", "niệm", "giá", "trị", "hiện", "tại", "ròng"]
    text: |-
      term_vi: Giá trị hiện tại ròng
      term_en: Net Present Value (NPV)
      definition: Tổng dòng tiền chiết khấu về hiện tại theo chi phí vốn r, trừ vốn đầu tư. Dương thì dự án tạo thêm giá trị.
      why_it_matters: Tiêu chuẩn vàng vì trả lời trực tiếp 'tôi giàu thêm bao nhiêu đồng (tiền hôm nay)'. Có tính cộng được (NPV(A+B)=NPV(A)+NPV(B)) nên cộng dự án ra giá trị công ty, đặc tính IRR không có.
  - id: "m02-concepts-14"
    title: "Khái niệm: Tỷ suất hoàn vốn nội bộ"
    tags: ["khái", "niệm", "tỷ", "suất", "hoàn", "vốn", "nội", "bộ"]
    text: |-
      term_vi: Tỷ suất hoàn vốn nội bộ
      term_en: Internal Rate of Return (IRR)
      definition: Mức chiết khấu làm NPV bằng 0; chi phí vốn tối đa mà dự án chịu được.
      why_it_matters: 'Quản lý và ngân hàng quen nghĩ theo tỷ lệ %; IRR diễn đạt chất lượng dự án thành tỷ suất so thẳng với lãi vay/chi phí vốn. Nhược: mù quy mô, ngầm giả định tái đầu tư ở IRR, có thể đa nghiệm.'
  - id: "m02-concepts-15"
    title: "Khái niệm: Đa nghiệm IRR"
    tags: ["khái", "niệm", "đa", "nghiệm", "irr"]
    text: |-
      term_vi: Đa nghiệm IRR
      term_en: Multiple IRR
      definition: Khi dòng tiền đổi dấu nhiều lần (bỏ vốn, thu lợi, rồi chi lớn phục hồi môi trường) phương trình IRR có thể có nhiều nghiệm. Ví dụ CF -100, +230, -132 cho IRR 10% và 20%.
      why_it_matters: Không biết tin nghiệm nào; giải pháp là dùng NPV hoặc MIRR.
  - id: "m02-concepts-16"
    title: "Khái niệm: IRR điều chỉnh"
    tags: ["khái", "niệm", "irr", "điều", "chỉnh"]
    text: |-
      term_vi: IRR điều chỉnh
      term_en: Modified IRR (MIRR)
      definition: IRR giả định dòng dương tái đầu tư ở chi phí vốn (thực tế), dòng âm chiết khấu ở lãi vay; luôn ra một nghiệm.
      why_it_matters: IRR thường ngầm giả định tái đầu tư ở chính IRR (phi thực tế khi IRR 40%). MIRR sửa điều này nên thấp hơn IRR và đáng tin hơn.
  - id: "m02-concepts-17"
    title: "Khái niệm: Thời gian hoàn vốn"
    tags: ["khái", "niệm", "thời", "gian", "hoàn", "vốn"]
    text: |-
      term_vi: Thời gian hoàn vốn
      term_en: Payback Period (PP)
      definition: Số năm để dòng tiền tích lũy chưa chiết khấu bù lại vốn đầu tư.
      why_it_matters: 'Thước đo thanh khoản và rủi ro của SME: hoàn vốn nhanh thì ít thời gian cho rủi ro xảy ra, tiền giải phóng sớm. Chỉ nên là bộ lọc phụ, vì bỏ qua TVM, bỏ qua dòng tiền sau hoàn vốn, ngưỡng tùy ý.'
  - id: "m02-concepts-18"
    title: "Khái niệm: Hoàn vốn có chiết khấu"
    tags: ["khái", "niệm", "hoàn", "vốn", "có", "chiết", "khấu"]
    text: |-
      term_vi: Hoàn vốn có chiết khấu
      term_en: Discounted Payback Period (DPP)
      definition: Như PP nhưng chiết khấu từng dòng tiền về hiện tại trước khi tích lũy.
      why_it_matters: Khắc phục lỗ hổng TVM của PP (DPP luôn >= PP) nhưng vẫn bỏ qua dòng tiền sau hoàn vốn nên không thay được NPV.
  - id: "m02-concepts-19"
    title: "Khái niệm: Chỉ số sinh lời"
    tags: ["khái", "niệm", "chỉ", "số", "sinh", "lời"]
    text: |-
      term_vi: Chỉ số sinh lời
      term_en: Profitability Index (PI)
      definition: PV dòng tiền tương lai chia vốn ban đầu = 1 + NPV/C0; mỗi đồng vốn tạo bao nhiêu đồng giá trị hiện tại.
      why_it_matters: NPV không cho biết hiệu quả trên mỗi đồng vốn. Khi thiếu vốn (rất phổ biến ở SME) PI là công cụ xếp hạng tự nhiên.
  - id: "m02-concepts-20"
    title: "Khái niệm: Hạn chế vốn"
    tags: ["khái", "niệm", "hạn", "chế", "vốn"]
    text: |-
      term_vi: Hạn chế vốn
      term_en: Capital rationing
      definition: Tổng vốn giới hạn nên phải chọn tổ hợp dự án tối đa hóa tổng NPV trong ngân sách.
      why_it_matters: Xếp theo NPV tuyệt đối có thể kém hơn xếp theo PI; tổ hợp phức tạp cần quy hoạch nguyên (Solver, biến nhị phân).
  - id: "m02-concepts-21"
    title: "Khái niệm: Dòng tiền tương đương hằng năm"
    tags: ["khái", "niệm", "dòng", "tiền", "tương", "đương", "hằng", "năm"]
    text: |-
      term_vi: Dòng tiền tương đương hằng năm
      term_en: Equivalent Annual Annuity (EAA)
      definition: Chuyển NPV thành niên kim đều hằng năm tương đương để so phương án khác vòng đời.
      why_it_matters: So NPV của dự án 3 năm với 5 năm là bất công vì dự án dài cộng thêm năm dòng tiền. Giả định có thể thay máy với cùng điều kiện khi hết vòng đời (replacement chain).
  - id: "m02-concepts-22"
    title: "Khái niệm: Xung đột NPV và IRR"
    tags: ["khái", "niệm", "xung", "đột", "npv", "và", "irr"]
    text: |-
      term_vi: Xung đột NPV và IRR
      term_en: NPV vs IRR conflict
      definition: 'Dự án độc lập, dòng tiền thông thường: NPV và IRR luôn cùng kết luận. Dự án loại trừ có thể xung đột do (1) quy mô khác nhau, (2) thời điểm dòng tiền khác nhau (giả định tái đầu tư).'
      why_it_matters: NPV là phán quyết cuối; công cụ chẩn đoán là IRR gia tăng (IRR của dòng tiền chênh lệch dự án lớn trừ dự án nhỏ) so với chi phí vốn. Điểm giao hai đường NPV (crossover) chính là IRR gia tăng.
  - id: "m02-concepts-23"
    title: "Khái niệm: Đồ thị NPV"
    tags: ["khái", "niệm", "đồ", "thị", "npv"]
    text: |-
      term_vi: Đồ thị NPV
      term_en: NPV profile / Crossover rate
      definition: 'Đồ thị NPV theo mức chiết khấu r. Hai đường NPV cắt nhau tại crossover rate (= IRR gia tăng): r thấp hơn thì dự án lớn thắng, cao hơn thì dự án nhỏ thắng.'
      why_it_matters: Cho thấy kết luận phụ thuộc chi phí vốn và độ nhạy của dự án với r.
  - id: "m02-concepts-24"
    title: "Khái niệm: Phân tích độ nhạy"
    tags: ["khái", "niệm", "phân", "tích", "độ", "nhạy"]
    text: |-
      term_vi: Phân tích độ nhạy
      term_en: Sensitivity analysis
      definition: Đổi MỘT biến (giữ các biến khác) xem NPV đổi bao nhiêu để tìm biến nhạy nhất.
      why_it_matters: Dòng tiền là dự báo; một NPV duy nhất trông chính xác nhưng che độ bất định. Dồn nguồn lực dự báo cho biến nhạy nhất (thường CAPEX và doanh thu).
  - id: "m02-concepts-25"
    title: "Khái niệm: Phân tích kịch bản"
    tags: ["khái", "niệm", "phân", "tích", "kịch", "bản"]
    text: |-
      term_vi: Phân tích kịch bản
      term_en: Scenario analysis
      definition: Đổi đồng thời nhiều biến theo kịch bản nhất quán (tốt/cơ sở/xấu) với xác suất, tính E[NPV] và độ lệch chuẩn.
      why_it_matters: Biến phối hợp với nhau; độ lệch chuẩn lớn so với kỳ vọng nghĩa là kết quả dao động mạnh, cần xét khả năng chịu lỗ của doanh nghiệp.
  - id: "m02-concepts-26"
    title: "Khái niệm: Phân tích hòa vốn / biên an toàn"
    tags: ["khái", "niệm", "phân", "tích", "hòa", "vốn", "biên", "an", "toàn"]
    text: |-
      term_vi: Phân tích hòa vốn / biên an toàn
      term_en: Break-even analysis / Margin of safety
      definition: Tìm giá trị biến đầu vào (doanh thu, EBITDA, sản lượng) làm NPV=0. Khoảng cách giữa dự báo và điểm hòa vốn là biên an toàn.
      why_it_matters: Biến câu hỏi 'NPV bao nhiêu' thành 'dự báo phải sai bao nhiêu thì dự án thua'. Iridium cho thấy phép hòa vốn đơn giản đã lộ vấn đề (cần gấp 12 lần thuê bao thực tế).
  - id: "m02-concepts-27"
    title: "Khái niệm: Quyền chọn thực"
    tags: ["khái", "niệm", "quyền", "chọn", "thực"]
    text: |-
      term_vi: Quyền chọn thực
      term_en: Real Options
      definition: 'Giá trị của linh hoạt quản trị: Expand (mở rộng nếu thành công), Delay (chờ thông tin), Abandon (dừng và bán tài sản), Switch (chuyển sản phẩm/công nghệ). Strategic NPV = Traditional NPV + Option Value.'
      why_it_matters: NPV truyền thống giả định đóng đinh kế hoạch; thực tế nhà quản lý có thể thích ứng. Quyền đó có giá trị, nhất là khi bất định cao; lợi nhuận bất đối xứng (lỗ có giới hạn, lãi không giới hạn trên).
  - id: "m02-concepts-28"
    title: "Khái niệm: NPV thời đại số"
    tags: ["khái", "niệm", "npv", "thời", "đại", "số"]
    text: |-
      term_vi: NPV thời đại số
      term_en: Digital NPV
      definition: 'Digital NPV = NPV truyền thống + NPV hiệu ứng mạng + NPV tài sản dữ liệu + Option Value. Đặc điểm số: tăng trưởng hàm mũ/đường S, tài sản vô hình, thị trường chưa tồn tại, winner-take-most, chân trời 10-15+ năm, nặng OPEX (cloud, thuê bao).'
      why_it_matters: NPV truyền thống định giá thấp nền tảng số; nhưng các thành phần mới là khung định tính, rất dễ bị thổi phồng để biện minh dự án - phải đặt giả định minh bạch và kiểm bằng kịch bản.
  - id: "m02-concepts-29"
    title: "Khái niệm: Thiên lệch lạc quan"
    tags: ["khái", "niệm", "thiên", "lệch", "lạc", "quan"]
    text: |-
      term_vi: Thiên lệch lạc quan
      term_en: Optimism bias
      definition: Người đề xuất có xu hướng thổi phồng dự phóng để dự án được duyệt.
      why_it_matters: 'Biện pháp: giảm doanh thu 10-20%, CAPEX dự phòng 10-15%, rà soát độc lập, post-audit, tiêu chí dừng.'
  - id: "m02-concepts-30"
    title: "Khái niệm: Ưu và nhược điểm của capital budgeting"
    tags: ["khái", "niệm", "ưu", "và", "nhược", "điểm", "của", "capital", "budgeting"]
    text: |-
      term_vi: Ưu và nhược điểm của capital budgeting
      term_en: Pros and cons
      definition: 'Ưu: ra quyết định có hệ thống, tối đa hóa giá trị, phân bổ hiệu quả, trách nhiệm giải trình (post-audit), nhận diện rủi ro, kỷ luật. Nhược: dòng tiền dài hạn khó ước lượng, r không chắc, bỏ yếu tố vô hình, optimism bias, bỏ sót real options, áp lực ngắn hạn (ưa Payback), tư duy silo bỏ qua hiệu ứng danh mục.'
      why_it_matters: 'Biết giới hạn để dùng đúng: phương pháp chỉ tốt bằng chất lượng giả định đầu vào.'
  - id: "m02-concepts-31"
    title: "Khái niệm: Bảng so sánh phương pháp"
    tags: ["khái", "niệm", "bảng", "so", "sánh", "phương", "pháp"]
    text: |-
      term_vi: Bảng so sánh phương pháp
      term_en: Method comparison
      definition: 'NPV: có TVM, rủi ro, quy mô, khó hơn một chút, hạng 1. IRR: TVM, rủi ro, KHÔNG quy mô, dễ hiểu, hạng 2. MIRR: như IRR, hạng 2.5. PI: TVM, quy mô tương đối, hạng 3. Payback: KHÔNG TVM, không rủi ro, không quy mô, rất dễ hiểu, bổ trợ. DPP: có TVM, bổ trợ.'
      why_it_matters: Dùng NPV làm chính, các chỉ số khác bổ trợ cho giao tiếp (IRR), thiếu vốn (PI), thanh khoản (PP/DPP).
  - id: "m02-formulas-1"
    title: "Công thức: m02_ocf — Dòng tiền hoạt động sau thuế"
    tags: ["công", "thức", "m02_ocf", "dòng", "tiền", "hoạt", "động", "sau", "thuế"]
    text: |-
      id: m02_ocf
      name_vi: Dòng tiền hoạt động sau thuế
      name_en: Operating Cash Flow (OCF)
      expression_latex: OCF = EBIT\times(1-T)+Dep = (Revenue-COGS-OpEx-Dep)(1-T)+Dep = EBITDA(1-T)+Dep\cdot T
      expression_python: (ebitda - dep) * (1 - tax) + dep
      excel: =(EBITDA-Dep)*(1-T)+Dep
      variables:
      - symbol: ebitda
        meaning: EBITDA tăng thêm của dự án (đã trừ nhân công, nguyên liệu, chi phí cơ hội; chưa trừ khấu hao)
        unit: triệu đồng/năm
      - symbol: dep
        meaning: Khấu hao hằng năm
        unit: triệu đồng/năm
      - symbol: tax
        meaning: Thuế suất TNDN
        unit: tỷ lệ
      when_to_use: Mỗi năm vận hành của dự án không có lãi vay. Trừ thêm dNWC và maintenance CAPEX để ra FCF.
      why_it_works: Khấu hao làm giảm lợi nhuận chịu thuế (được hưởng lá chắn thuế) nhưng không có tiền chảy ra trong năm (tiền đã chi năm 0) nên phải cộng lại khi tính tiền.
      assumptions:
      - Khấu hao đường thẳng
      - Không có lãi vay trong dòng tiền (chi phí vốn nằm trong r)
      - EBIT dương đủ để dùng hết lá chắn thuế
      pitfalls:
      - Quên cộng lại khấu hao
      - Trừ lãi vay (đếm hai lần chi phí vốn)
      - Dùng lợi nhuận kế toán thay dòng tiền
      - Quên trừ dNWC và maintenance CAPEX
      interpretation: Dòng tiền tiền mặt thật dự án sinh ra mỗi năm; hai dạng công thức phải cho cùng kết quả (dùng làm kiểm tra chéo).
      example:
        inputs:
          ebitda: 520
          dep: 300
          tax: 0.2
        steps:
        - EBIT = 520-300 = 220
        - Thuế = 220x0,2 = 44; NOPAT = 176
        - OCF = 176+300 = 476
        - 'Kiểm: 520x0,8 + 300x0,2 = 416+60 = 476'
        result: OCF = 476 triệu (Máy A, Minh Tâm)
  - id: "m02-formulas-2"
    title: "Công thức: m02_tax_shield — Lá chắn thuế khấu hao"
    tags: ["công", "thức", "m02_tax_shield", "lá", "chắn", "thuế", "khấu", "hao"]
    text: |-
      id: m02_tax_shield
      name_vi: Lá chắn thuế khấu hao
      name_en: Depreciation Tax Shield
      expression_latex: TaxShield = Dep\times T
      expression_python: dep * tax
      excel: =Dep*T
      variables:
      - symbol: dep
        meaning: Khấu hao hằng năm
        unit: triệu đồng
      - symbol: tax
        meaning: Thuế suất TNDN
        unit: tỷ lệ
      when_to_use: Đo giá trị thuế tiết kiệm từ khấu hao; so sánh phương pháp/thời gian khấu hao.
      why_it_works: Khấu hao giảm lợi nhuận chịu thuế đúng Dep nên thuế nộp giảm Dep x T; đó là dòng tiền thật thuộc dự án.
      assumptions:
      - Doanh nghiệp có lợi nhuận chịu thuế đủ để hấp thụ khấu hao
      pitfalls:
      - Coi khấu hao là dòng tiền (chỉ phần thuế tiết kiệm mới là tiền)
      interpretation: Khấu hao nhanh hơn thì lá chắn đến sớm hơn nên PV cao hơn, NPV cao hơn.
      example:
        inputs:
          dep: 200
          tax: 0.2
        steps:
        - Máy 1 tỷ khấu hao 5 năm = 200 triệu/năm
        - Tax shield = 200x20% = 40
        result: 40 triệu/năm tiết kiệm thuế
  - id: "m02-formulas-3"
    title: "Công thức: m02_initial_outlay — Vốn đầu tư ban đầu (năm 0)"
    tags: ["công", "thức", "m02_initial_outlay", "vốn", "đầu", "tư", "ban", "năm"]
    text: |-
      id: m02_initial_outlay
      name_vi: Vốn đầu tư ban đầu (năm 0)
      name_en: Initial Investment (Total Initial Outflow)
      expression_latex: C_0 = CAPEX + Install - Proceeds_{old} + Tax_{gain\,on\,old} + \Delta NWC_0
      expression_python: capex + install - proceeds_old + tax_on_old_gain + d_nwc
      excel: =CAPEX+Install-Proceeds+TaxGain+dNWC
      variables:
      - symbol: capex
        meaning: Giá mua tài sản/xây dựng
        unit: triệu đồng
      - symbol: install
        meaning: Lắp đặt, vận chuyển, chạy thử
        unit: triệu đồng
      - symbol: proceeds_old
        meaning: Thu từ bán tài sản cũ (dự án thay thế)
        unit: triệu đồng
      - symbol: tax_on_old_gain
        meaning: Thuế trên lãi bán tài sản cũ (âm nếu lỗ vì tiết kiệm thuế)
        unit: triệu đồng
      - symbol: d_nwc
        meaning: Tăng vốn lưu động ròng ban đầu
        unit: triệu đồng
      when_to_use: Xác định CF0 mọi dự án mở rộng/thay thế.
      why_it_works: Tiền thực chi ra ở thời điểm 0 gồm cả chi phí phụ trợ và vốn lưu động kẹt lại; bán tài sản cũ thu tiền nhưng chịu thuế trên lãi.
      assumptions:
      - Chi phí chìm đã loại
      - Giá bán tài sản cũ ước lượng hợp lý
      pitfalls:
      - Quên NWC
      - Quên chi phí lắp đặt/chạy thử
      - Tính cả chi phí chìm (khảo sát đã chi)
      interpretation: 'CF0 = -C0. Ví dụ Máy A: 1.500 + 100 NWC = 1.600.'
      example:
        inputs:
          capex: 1500
          install: 0
          proceeds_old: 0
          tax_on_old_gain: 0
          d_nwc: 100
        steps:
        - 1.500 + 0 - 0 + 0 + 100 = 1.600
        result: C0 = 1.600 triệu (Máy A)
  - id: "m02-formulas-4"
    title: "Công thức: m02_terminal_cf — Dòng tiền kết thúc dự án"
    tags: ["công", "thức", "m02_terminal_cf", "dòng", "tiền", "kết", "thúc", "dự", "án"]
    text: |-
      id: m02_terminal_cf
      name_vi: Dòng tiền kết thúc dự án
      name_en: Terminal Cash Flow
      expression_latex: TCF = Salvage-(Salvage-BookValue)\times T + NWC_{recovered}
      expression_python: salvage - (salvage - book) * tax + nwc
      excel: =Salvage-(Salvage-Book)*T+NWC
      variables:
      - symbol: salvage
        meaning: Giá bán lại/thu hồi tài sản cuối dự án
        unit: triệu đồng
      - symbol: book
        meaning: Giá trị sổ sách cuối kỳ
        unit: triệu đồng
      - symbol: tax
        meaning: Thuế suất
        unit: tỷ lệ
      - symbol: nwc
        meaning: NWC thu hồi
        unit: triệu đồng
      when_to_use: Năm cuối của dự án; cộng vào OCF năm đó.
      why_it_works: Chênh lệch giá bán trên sổ sách là lãi chịu thuế (hoặc lỗ được khấu trừ); NWC được giải phóng trở lại thành tiền.
      assumptions:
      - Giá trị sổ sách đã tính theo khấu hao đã áp dụng
      pitfalls:
      - Quên thuế trên lãi thanh lý
      - Quên thu hồi NWC
      - 'Với lỗ thanh lý: thuế âm nghĩa là tiết kiệm thuế, chỉ đúng nếu có lợi nhuận để khấu trừ'
      interpretation: Cộng vào dòng tiền năm cuối.
      example:
        inputs:
          salvage: 150
          book: 0
          tax: 0.2
          nwc: 100
        steps:
        - 150 - (150-0)x0,2 = 120
        - + 100 NWC = 220
        result: Terminal CF máy A = 220 triệu
  - id: "m02-formulas-5"
    title: "Công thức: m02_npv — Giá trị hiện tại ròng"
    tags: ["công", "thức", "m02_npv", "giá", "trị", "hiện", "tại", "ròng"]
    text: |-
      id: m02_npv
      name_vi: Giá trị hiện tại ròng
      name_en: Net Present Value
      expression_latex: NPV=\sum_{t=0}^{n}\frac{CF_t}{(1+r)^t}=-C_0+\frac{CF_1}{(1+r)}+\dots+\frac{CF_n}{(1+r)^n}
      expression_python: sum(c / (1 + r) ** t for t, c in enumerate(cf))
      excel: =NPV(r, CF1:CFn)+CF0 (NPV của Excel coi giá trị đầu là cuối năm 1 nên CF0 cộng riêng); XNPV(r, values, dates) khi ngày không đều
      variables:
      - symbol: cf
        meaning: Danh sách dòng tiền ròng cf[0..n], cf[0] âm là vốn đầu tư
        unit: triệu đồng
      - symbol: r
        meaning: Tỷ suất chiết khấu = chi phí vốn của dự án (WACC điều chỉnh rủi ro)
        unit: tỷ lệ/năm
      when_to_use: Tiêu chí chính cho mọi quyết định; dự án loại trừ chọn NPV cao nhất.
      why_it_works: Quy dòng tiền về hiện tại (1 đồng sau thấp giá hơn do cơ hội và rủi ro) rồi trừ vốn bỏ ra; dương nghĩa là dự án sinh ra nhiều hơn mức tối thiểu nhà đầu tư đòi. Có tính cộng được.
      assumptions:
      - Dòng tiền cuối kỳ
      - r đúng và không đổi
      - Dòng tiền tái đầu tư ở r
      pitfalls:
      - Chọn r sai (kết quả nhạy với r)
      - Dòng tiền dài hạn khó dự báo
      - Dùng hàm NPV Excel mà quên cộng CF0
      - Dùng lãi suất tiết kiệm làm r
      interpretation: NPV>0 đầu tư; <0 từ chối; =0 hòa vốn kinh tế (vừa đủ trả chi phí vốn). Con số là lượng giá trị tạo ra theo tiền hôm nay.
      example:
        inputs:
          cf:
          - -1600
          - 476
          - 476
          - 476
          - 476
          - 696
          r: 0.12
        steps:
        - PV năm 1-5 = 425,00 / 379,46 / 338,81 / 302,51 / 394,93; tổng 1.840,71
        - NPV = 1.840,71 - 1.600 = 240,71
        result: NPV Máy A = +240,71 triệu
  - id: "m02-formulas-6"
    title: "Công thức: m02_irr — Tỷ suất hoàn vốn nội bộ"
    tags: ["công", "thức", "m02_irr", "tỷ", "suất", "hoàn", "vốn", "nội", "bộ"]
    text: |-
      id: m02_irr
      name_vi: Tỷ suất hoàn vốn nội bộ
      name_en: Internal Rate of Return
      expression_latex: 0=-C_0+\sum_{t=1}^{n}\frac{CF_t}{(1+IRR)^t}
      expression_python: 'brentq(lambda x: sum(c / (1 + x) ** t for t, c in enumerate(cf)), -0.9, 5)'
      excel: =IRR(CF0:CFn, guess)
      variables:
      - symbol: cf
        meaning: Dòng tiền cf[0..n]
        unit: triệu đồng
      when_to_use: Giao tiếp chất lượng dự án bằng %, so với lãi vay/WACC; dự án độc lập, dòng tiền thông thường.
      why_it_works: Là r làm NPV=0, tức chi phí vốn tối đa dự án chịu được; IRR lớn hơn chi phí vốn thì còn dư địa tạo giá trị.
      assumptions:
      - Dòng tiền đổi dấu một lần (thông thường)
      - Tái đầu tư ở IRR (ngầm)
      pitfalls:
      - Đa nghiệm khi dòng tiền đổi dấu nhiều lần
      - Mù quy mô (dự án nhỏ lãi cao có thể kém dự án lớn)
      - Giả định tái đầu tư ở IRR phi thực tế khi IRR cao
      - Không có công thức đóng, cần thử-sai/Excel/Python
      interpretation: 'IRR > WACC thì đầu tư. SME: IRR >= WACC + 3-5% làm dư địa sai số dự báo. Dự án loại trừ không dùng IRR để chọn, dùng NPV.'
      example:
        inputs:
          cf:
          - -1600
          - 476
          - 476
          - 476
          - 476
          - 696
        steps:
        - 'Giải NPV(x)=0 bằng brentq: x = 0,17598'
        - 'Kiểm: tại 15% NPV=+105,0; tại 18% NPV=-15,3'
        result: IRR Máy A = 17,60%
  - id: "m02-formulas-7"
    title: "Công thức: m02_mirr — IRR điều chỉnh"
    tags: ["công", "thức", "m02_mirr", "irr", "điều", "chỉnh"]
    text: |-
      id: m02_mirr
      name_vi: IRR điều chỉnh
      name_en: Modified IRR
      expression_latex: MIRR=\left(\frac{FV_{+}\text{ (ghép lãi ở tỷ suất tái đầu tư)}}{PV_{-}\text{ (chiết khấu ở lãi vay)}}\right)^{1/n}-1
      expression_python: (sum(c * (1 + rr) ** (len(cf) - 1 - t) for t, c in enumerate(cf) if c > 0) / (-sum(c / (1 + fr) ** t for t, c in enumerate(cf) if c < 0))) ** (1 / (len(cf) - 1)) - 1
      excel: =MIRR(CF0:CFn, lãi_vay, tỷ_suất_tái_đầu_tư)
      variables:
      - symbol: cf
        meaning: Dòng tiền cf[0..n]
        unit: triệu đồng
      - symbol: fr
        meaning: Lãi suất tài trợ/chiết khấu dòng âm
        unit: tỷ lệ
      - symbol: rr
        meaning: Tỷ suất tái đầu tư dòng dương (thường chi phí vốn)
        unit: tỷ lệ
      when_to_use: Khi IRR cao quá (phi thực tế) hoặc dòng tiền đổi dấu nhiều lần (multiple IRR).
      why_it_works: Tái đầu tư ở chi phí vốn thực tế hơn ở IRR; gộp dòng dương thành một giá trị tương lai và dòng âm thành một giá trị hiện tại nên chỉ có một nghiệm.
      assumptions:
      - Tỷ suất tái đầu tư và lãi vay đã biết
      pitfalls:
      - Vẫn mù quy mô như IRR
      - Kết quả phụ thuộc rr, fr chọn
      interpretation: MIRR > WACC thì đầu tư; thường thấp hơn IRR.
      example:
        inputs:
          cf:
          - -1000
          - 400
          - 500
          - 600
          fr: 0.1
          rr: 0.1
        steps:
        - FV dương = 400x1,1^2 + 500x1,1 + 600 = 484+550+600 = 1.634
        - PV âm = 1.000
        - MIRR = (1,634)^(1/3) - 1 = 17,78%
        - IRR thường = 21,65% (cao hơn)
        result: MIRR = 17,78%
  - id: "m02-formulas-8"
    title: "Công thức: m02_pp — Thời gian hoàn vốn"
    tags: ["công", "thức", "m02_pp", "thời", "gian", "hoàn", "vốn"]
    text: |-
      id: m02_pp
      name_vi: Thời gian hoàn vốn
      name_en: Payback Period
      expression_latex: PP = t_{last\,neg} + \frac{|\text{cumulative CF}_{t}|}{CF_{t+1}}
      expression_python: next(t - 1 + (-sum(cf[:t])) / cf[t] for t in range(1, len(cf)) if sum(cf[:t + 1]) >= 0)
      excel: Cột CF tích lũy rồi nội suy thủ công
      variables:
      - symbol: cf
        meaning: Dòng tiền cf[0..n]
        unit: triệu đồng
      when_to_use: Bộ lọc thanh khoản/rủi ro phụ cho SME; không phải tiêu chí quyết định chính.
      why_it_works: Phần nguyên là năm cuối tích lũy còn âm; phần lẻ là số tiền còn thiếu chia dòng tiền năm kế (giả định dòng tiền đều trong năm).
      assumptions:
      - Dòng tiền phân bố đều trong năm
      pitfalls:
      - Bỏ qua TVM
      - Bỏ qua dòng tiền sau hoàn vốn (loại oan dự án dài hạn giá trị cao)
      - Ngưỡng chấp nhận tùy ý
      interpretation: So với ngưỡng nội bộ; không đủ để chấp nhận dự án, chỉ để lọc thanh khoản.
      example:
        inputs:
          cf:
          - -500
          - 150
          - 150
          - 150
          - 150
        steps:
        - 'Tích lũy: -500, -350, -200, -50, +100'
        - PP = 3 + 50/150 = 3,33
        result: PP = 3,33 năm
  - id: "m02-formulas-9"
    title: "Công thức: m02_dpp — Hoàn vốn có chiết khấu"
    tags: ["công", "thức", "m02_dpp", "hoàn", "vốn", "có", "chiết", "khấu"]
    text: |-
      id: m02_dpp
      name_vi: Hoàn vốn có chiết khấu
      name_en: Discounted Payback Period
      expression_latex: DPP = t_{last\,neg} + \frac{|\text{cumulative PV}_{t}|}{PV_{t+1}}
      expression_python: next(t - 1 + (-sum(c / (1 + r) ** i for i, c in enumerate(cf[:t]))) / (cf[t] / (1 + r) ** t) for t in range(1, len(cf)) if sum(c / (1 + r) ** i for i, c in enumerate(cf[:t + 1])) >= 0)
      excel: Cột PV tích lũy rồi nội suy
      variables:
      - symbol: cf
        meaning: Dòng tiền cf[0..n]
        unit: triệu đồng
      - symbol: r
        meaning: Tỷ suất chiết khấu
        unit: tỷ lệ
      when_to_use: Bộ lọc thanh khoản có tính TVM; SME đặt ngưỡng DPP <= 50-60% vòng đời tài sản.
      why_it_works: Chiết khấu từng dòng về hiện tại trước khi tích lũy nên DPP >= PP.
      assumptions:
      - r đúng
      - Dòng tiền đều trong năm
      pitfalls:
      - Vẫn bỏ qua dòng tiền sau hoàn vốn nên không thay NPV
      interpretation: Dự án vẫn có NPV dương nhưng phải sống ít nhất DPP năm mới hòa vốn thật sự.
      example:
        inputs:
          cf:
          - -500
          - 150
          - 150
          - 150
          - 150
          - 150
          r: 0.1
        steps:
        - 'PV tích lũy: -500; -363,64; -239,67; -126,97; -24,52; +68,62'
        - DPP = 4 + 24,52/93,14 = 4,26
        result: DPP = 4,26 năm (PP = 3,33)
  - id: "m02-formulas-10"
    title: "Công thức: m02_pi — Chỉ số sinh lời"
    tags: ["công", "thức", "m02_pi", "chỉ", "số", "sinh", "lời"]
    text: |-
      id: m02_pi
      name_vi: Chỉ số sinh lời
      name_en: Profitability Index
      expression_latex: PI=\frac{PV\,of\,future\,CF}{Initial\,Investment}=1+\frac{NPV}{C_0}
      expression_python: 1 + npv / c0
      excel: =1+NPV/C0
      variables:
      - symbol: npv
        meaning: NPV của dự án
        unit: triệu đồng
      - symbol: c0
        meaning: Vốn đầu tư ban đầu (dương)
        unit: triệu đồng
      when_to_use: Xếp hạng khi vốn giới hạn (capital rationing).
      why_it_works: Mỗi đồng vốn tạo PI đồng giá trị hiện tại; xếp PI giảm dần là chuẩn hóa theo vốn.
      assumptions:
      - Dự án chia nhỏ được hoặc kiểm tra tổ hợp
      - Hạn chế vốn chỉ một kỳ
      pitfalls:
      - Mù quy mô khi chọn dự án loại trừ
      - Greedy theo PI có thể không tối ưu do vốn nguyên khối (cần kiểm tổ hợp/Solver)
      interpretation: PI > 1 tương đương NPV > 0; SME ngưỡng tham khảo > 1,1.
      example:
        inputs:
          npv: 240.7074
          c0: 1600
        steps:
        - PI = 1 + 240,71/1.600 = 1,150
        result: PI Máy A = 1,150 (B = 1,139)
  - id: "m02-formulas-11"
    title: "Công thức: m02_eaa — Dòng tiền tương đương hằng năm"
    tags: ["công", "thức", "m02_eaa", "dòng", "tiền", "tương", "đương", "hằng", "năm"]
    text: |-
      id: m02_eaa
      name_vi: Dòng tiền tương đương hằng năm
      name_en: Equivalent Annual Annuity
      expression_latex: EAA=\frac{NPV}{PVIFA(r,n)}=NPV\times\frac{r}{1-(1+r)^{-n}}
      expression_python: npv * r / (1 - (1 + r) ** -n)
      excel: =PMT(r, n, -NPV)
      variables:
      - symbol: npv
        meaning: NPV của phương án
        unit: triệu đồng
      - symbol: r
        meaning: Chi phí vốn
        unit: tỷ lệ
      - symbol: n
        meaning: Vòng đời (năm)
        unit: năm
      when_to_use: So phương án loại trừ có vòng đời khác nhau.
      why_it_works: Quy NPV thành dòng đều hằng năm để so 'mỗi năm tạo bao nhiêu' khi giả định thay thế lặp lại.
      assumptions:
      - Có thể thay phương án với cùng điều kiện khi hết vòng đời (replacement chain)
      pitfalls:
      - Không đúng nếu công nghệ/giá thay đổi mạnh theo thời gian
      interpretation: Chọn phương án EAA cao nhất (hoặc EAC thấp nhất nếu chỉ có chi phí).
      example:
        inputs:
          npv: 162.812
          r: 0.12
          n: 5
        steps:
        - 'Máy 2: NPV = 170x3,6048 - 450 = 162,81'
        - EAA = 162,81x0,2774 = 45,17; Máy 1 (3 năm, NPV 60,27) EAA = 25,10
        result: Máy 2 EAA 45,17 > Máy 1 25,10
  - id: "m02-formulas-12"
    title: "Công thức: m02_annuity_factor — Hệ số hiện giá niên kim"
    tags: ["công", "thức", "m02_annuity_factor", "hệ", "số", "hiện", "giá", "niên", "kim"]
    text: |-
      id: m02_annuity_factor
      name_vi: Hệ số hiện giá niên kim
      name_en: PVIFA
      expression_latex: PVIFA(r,n)=\frac{1-(1+r)^{-n}}{r}
      expression_python: (1 - (1 + r) ** -n) / r
      excel: =PV(r, n, -1)
      variables:
      - symbol: r
        meaning: Tỷ suất chiết khấu
        unit: tỷ lệ
      - symbol: n
        meaning: Số kỳ
        unit: năm
      when_to_use: Chiết khấu dòng tiền đều; tính EAA; tính dòng tiền hòa vốn.
      why_it_works: Tổng cấp số nhân của các hệ số chiết khấu.
      assumptions:
      - Dòng tiền đều, cuối kỳ
      pitfalls:
      - Dùng cho dòng tiền không đều
      interpretation: PV của 1 đồng/năm trong n năm.
      example:
        inputs:
          r: 0.15
          n: 10
        steps:
        - (1-1,15^-10)/0,15 = 5,0188
        result: PVIFA(15%,10) = 5,0188
  - id: "m02-formulas-13"
    title: "Công thức: m02_incremental_irr — IRR gia tăng / điểm giao"
    tags: ["công", "thức", "m02_incremental_irr", "irr", "gia", "tăng", "điểm", "giao"]
    text: |-
      id: m02_incremental_irr
      name_vi: IRR gia tăng / điểm giao
      name_en: Incremental IRR (Crossover rate)
      expression_latex: 0=\sum_{t=0}^{n}\frac{CF^{big}_t-CF^{small}_t}{(1+IRR_{inc})^t}
      expression_python: 'brentq(lambda x: sum((b - a) / (1 + x) ** t for t, (a, b) in enumerate(zip(cf_small, cf_big))), -0.9, 5)'
      excel: =IRR(dòng tiền chênh lệch)
      variables:
      - symbol: cf_small
        meaning: Dòng tiền dự án nhỏ
        unit: triệu đồng
      - symbol: cf_big
        meaning: Dòng tiền dự án lớn
        unit: triệu đồng
      when_to_use: NPV và IRR cho kết luận ngược nhau giữa dự án loại trừ.
      why_it_works: Coi dự án lớn = dự án nhỏ + khoản đầu tư thêm; nếu khoản thêm có IRR > chi phí vốn thì đáng làm nên chọn dự án lớn. Cũng là điểm giao hai đường NPV.
      assumptions:
      - Dòng tiền chênh lệch thông thường (một lần đổi dấu)
      pitfalls:
      - Quên NPV của dòng chênh lệch bằng chênh lệch NPV hai dự án (dùng kiểm chứng)
      - Bị đa nghiệm nếu chênh lệch đổi dấu nhiều lần
      interpretation: IRR gia tăng > r thì chọn dự án lớn; r nằm dưới điểm giao thì dự án lớn thắng, trên điểm giao thì dự án nhỏ thắng.
      example:
        inputs:
          cf_small:
          - -1600
          - 476
          - 476
          - 476
          - 476
          - 696
          cf_big:
          - -2550
          - 752
          - 752
          - 752
          - 752
          - 1094
        steps:
        - 'Chênh lệch: -950; 276 x4; 398'
        - NPV chênh lệch ở 12% = +114,14 (= 354,85 - 240,71)
        - IRR gia tăng = 16,50%
        result: IRR gia tăng 16,50% > 12% nên chọn Máy B
  - id: "m02-formulas-14"
    title: "Công thức: m02_expected_npv — NPV kỳ vọng theo kịch bản"
    tags: ["công", "thức", "m02_expected_npv", "npv", "kỳ", "vọng", "theo", "kịch", "bản"]
    text: |-
      id: m02_expected_npv
      name_vi: NPV kỳ vọng theo kịch bản
      name_en: Expected NPV
      expression_latex: E[NPV]=\sum_i p_i\,NPV_i
      expression_python: sum(p * v for p, v in zip(probs, npvs))
      excel: =SUMPRODUCT(probs, npvs)
      variables:
      - symbol: probs
        meaning: Xác suất các kịch bản (tổng = 1)
        unit: tỷ lệ
      - symbol: npvs
        meaning: NPV từng kịch bản
        unit: triệu đồng
      when_to_use: Khi có nhiều kịch bản nhất quán với xác suất chủ quan.
      why_it_works: Trung bình có trọng số xác suất.
      assumptions:
      - Xác suất chủ quan hợp lý, kịch bản bao phủ
      pitfalls:
      - Xác suất bịa; chỉ nhìn kỳ vọng mà bỏ qua kịch bản xấu
      interpretation: Kỳ vọng dương chưa đủ, phải so với độ lệch chuẩn và khả năng chịu lỗ.
      example:
        inputs:
          probs:
          - 0.25
          - 0.5
          - 0.25
          npvs:
          - 350
          - 124
          - -80
        steps:
        - 87,5 + 62 - 20 = 129,5
        result: E[NPV] = 129,5 triệu
  - id: "m02-formulas-15"
    title: "Công thức: m02_sd_npv — Độ lệch chuẩn NPV"
    tags: ["công", "thức", "m02_sd_npv", "độ", "lệch", "chuẩn", "npv"]
    text: |-
      id: m02_sd_npv
      name_vi: Độ lệch chuẩn NPV
      name_en: Standard deviation of NPV
      expression_latex: \sigma_{NPV}=\sqrt{\sum_i p_i(NPV_i-E[NPV])^2}
      expression_python: sum(p * (v - sum(a * b for a, b in zip(probs, npvs))) ** 2 for p, v in zip(probs, npvs)) ** 0.5
      excel: =SQRT(SUMPRODUCT(probs,(npvs-E)^2))
      variables:
      - symbol: probs
        meaning: Xác suất
        unit: tỷ lệ
      - symbol: npvs
        meaning: NPV từng kịch bản
        unit: triệu đồng
      when_to_use: Đo mức dao động/rủi ro của NPV.
      why_it_works: Độ lệch bình phương trung bình có trọng số.
      assumptions:
      - Rời rạc vài kịch bản
      pitfalls:
      - Ít kịch bản nên ước lượng thô
      interpretation: Độ lệch chuẩn lớn hơn cả kỳ vọng (152,1 vs 129,5) nghĩa là dao động mạnh, cần xét khả năng chịu kịch bản xấu (-80).
      example:
        inputs:
          probs:
          - 0.25
          - 0.5
          - 0.25
          npvs:
          - 350
          - 124
          - -80
        steps:
        - 0,25x(220,5)^2 + 0,5x(-5,5)^2 + 0,25x(-209,5)^2 = 23.141,4
        - căn = 152,1
        result: sigma = 152,1 triệu
  - id: "m02-formulas-16"
    title: "Công thức: m02_breakeven_ebitda — EBITDA hòa vốn (NPV = 0) và biên an toàn"
    tags: ["công", "thức", "m02_breakeven_ebitda", "ebitda", "hòa", "vốn", "npv", "và", "biên", "an", "toàn"]
    text: |-
      id: m02_breakeven_ebitda
      name_vi: EBITDA hòa vốn (NPV = 0) và biên an toàn
      name_en: Break-even EBITDA and margin of safety
      expression_latex: EBITDA^{*}=\frac{C_0-PV(TCF)-PV(Dep\cdot T)}{(1-T)\cdot PVIFA(r,n)},\quad MoS=1-\frac{EBITDA^{*}}{EBITDA_{forecast}}
      expression_python: (c0 - tcf / (1 + r) ** n - dep * tax * (1 - (1 + r) ** -n) / r) / ((1 - tax) * (1 - (1 + r) ** -n) / r)
      excel: 'Goal Seek: đặt NPV = 0 bằng cách đổi EBITDA'
      variables:
      - symbol: c0
        meaning: Vốn ban đầu gồm NWC
        unit: triệu đồng
      - symbol: tcf
        meaning: Terminal CF năm n
        unit: triệu đồng
      - symbol: dep
        meaning: Khấu hao hằng năm
        unit: triệu đồng
      - symbol: tax
        meaning: Thuế suất
        unit: tỷ lệ
      - symbol: r
        meaning: Chi phí vốn
        unit: tỷ lệ
      - symbol: n
        meaning: Vòng đời
        unit: năm
      when_to_use: Biến NPV thành 'dự báo phải sai bao nhiêu thì dự án thua'; thường dùng Goal Seek.
      why_it_works: Giải ngược NPV(EBITDA)=0; NPV tuyến tính theo EBITDA đều hằng năm.
      assumptions:
      - EBITDA đều các năm
      - Khấu hao đường thẳng
      - Các biến khác giữ nguyên
      pitfalls:
      - Chỉ đúng khi EBITDA đều hằng năm
      interpretation: Biên an toàn SME nên >= 10-15%.
      example:
        inputs:
          c0: 1600
          tcf: 220
          dep: 300
          tax: 0.2
          r: 0.12
          n: 5
        steps:
        - PV(Terminal) = 220/1,12^5 = 124,83
        - PV(Dep x T) = 60 x 3,6048 = 216,29
        - EBITDA* = (1.600-124,83-216,29)/(0,8x3,6048) = 436,53
        - MoS = 1-436,53/520 = 16,1%
        result: EBITDA hòa vốn Máy A = 436,5; biên an toàn 16,1%
  - id: "m02-formulas-17"
    title: "Công thức: m02_breakeven_units — Dòng tiền ròng hằng năm cần để hòa vốn / số đơn vị hòa vốn"
    tags: ["công", "thức", "m02_breakeven_units", "dòng", "tiền", "ròng", "hằng", "năm", "cần", "để", "hòa", "vốn"]
    text: |-
      id: m02_breakeven_units
      name_vi: Dòng tiền ròng hằng năm cần để hòa vốn / số đơn vị hòa vốn
      name_en: Required annual net cash flow and break-even volume
      expression_latex: CF_{need}=\frac{C_0}{PVIFA(r,n)},\quad N_{units}=\frac{CF_{need}}{CF_{per\,unit}}
      expression_python: capital / ((1 - (1 + r) ** -n) / r) / cf_per_unit
      excel: =PMT(r,n,-C0)/CF_per_unit
      variables:
      - symbol: capital
        meaning: Tổng vốn
        unit: triệu đồng
      - symbol: r
        meaning: Chi phí vốn
        unit: tỷ lệ
      - symbol: n
        meaning: Vòng đời
        unit: năm
      - symbol: cf_per_unit
        meaning: Dòng tiền ròng mỗi khách/đơn vị mỗi năm
        unit: triệu đồng
      when_to_use: Kiểm tra nhanh quy mô thị trường cần thiết trước khi đầu tư (bài học Iridium).
      why_it_works: Vốn bằng PV niên kim của dòng tiền đều cần có.
      assumptions:
      - Dòng tiền đều, vòng đời xác định, không giá trị thanh lý
      pitfalls:
      - Bỏ qua sụt giá/thay đổi công nghệ
      interpretation: So với số khách thực tế khả thi; nếu gấp nhiều lần thì cảnh báo.
      example:
        inputs:
          capital: 5000
          r: 0.15
          n: 10
          cf_per_unit: 0.0015
        steps:
        - PVIFA = 5,0188
        - Dòng tiền cần = 5.000/5,0188 = 996,3 triệu USD/năm
        - Số thuê bao = 996,3/0,0015 = 664.000
        - Thực tế 55.000 nên gấp khoảng 12 lần
        result: Cần khoảng 664.000 thuê bao (minh họa)
  - id: "m02-formulas-18"
    title: "Công thức: m02_strategic_npv — NPV chiến lược và giá trị quyền chọn"
    tags: ["công", "thức", "m02_strategic_npv", "npv", "chiến", "lược", "và", "giá", "trị", "quyền", "chọn"]
    text: |-
      id: m02_strategic_npv
      name_vi: NPV chiến lược và giá trị quyền chọn
      name_en: Strategic NPV / Option value
      expression_latex: StrategicNPV=NPV_{trad}+OptionValue;\quad OptionValue\approx p\cdot\frac{V_{expand}}{(1+r)^k}\ (\text{trừ chi phí pilot đã nằm trong }NPV_{trad})
      expression_python: npv_trad + p * v_expand / (1 + r) ** k
      excel: =NPV_trad + p*V/(1+r)^k
      variables:
      - symbol: npv_trad
        meaning: NPV độc lập của giai đoạn đầu (cam kết chi phí)
        unit: triệu đồng
      - symbol: p
        meaning: Xác suất kịch bản thuận lợi
        unit: tỷ lệ
      - symbol: v_expand
        meaning: Giá trị mở rộng nếu thuận lợi (tại thời điểm k)
        unit: triệu đồng
      - symbol: r
        meaning: Chiết khấu
        unit: tỷ lệ
      - symbol: k
        meaning: Số năm đến thời điểm quyết định mở rộng
        unit: năm
      when_to_use: Dự án pilot, thị trường bất định, đầu tư theo giai đoạn (option to expand/delay/abandon/switch).
      why_it_works: Lỗ giới hạn ở chi phí giai đoạn đầu, lãi mở rộng không giới hạn trên (bất đối xứng) nên chi phí đầu là giá mua quyền chọn.
      assumptions:
      - Xác suất và giá trị mở rộng là giả định minh bạch
      - Có thể dừng ở cổng quyết định
      pitfalls:
      - Dùng để biện minh mọi dự án (survivorship bias)
      - Giá trị quyền chọn bị thổi phồng khi giả định xác suất lạc quan
      interpretation: Xác suất hòa vốn của quyền chọn = chi phí / PV giá trị mở rộng; cược đáng làm nếu xác suất thực lớn hơn ngưỡng này.
      example:
        inputs:
          npv_trad: -3000
          p: 0.3
          v_expand: 20000
          r: 0.12
          k: 4
        steps:
        - PV mở rộng = 20.000/1,12^4 = 12.710
        - E = -3.000 + 0,3x12.710 = +813
        - Xác suất hòa vốn = 3.000/12.710 = 23,6%
        result: Strategic NPV = +813 triệu USD (minh họa AWS)
  - id: "m02-formulas-19"
    title: "Công thức: m02_breakeven_prob — Xác suất hòa vốn của quyền chọn"
    tags: ["công", "thức", "m02_breakeven_prob", "xác", "suất", "hòa", "vốn", "của", "quyền", "chọn"]
    text: |-
      id: m02_breakeven_prob
      name_vi: Xác suất hòa vốn của quyền chọn
      name_en: Break-even probability of option
      expression_latex: p^{*}=\frac{Cost}{PV(V_{expand})}
      expression_python: cost / (v_expand / (1 + r) ** k)
      excel: =Cost/(V/(1+r)^k)
      variables:
      - symbol: cost
        meaning: Chi phí giai đoạn đầu (lỗ tối đa)
        unit: triệu đồng
      - symbol: v_expand
        meaning: Giá trị mở rộng nếu thành công
        unit: triệu đồng
      - symbol: r
        meaning: Chiết khấu
        unit: tỷ lệ
      - symbol: k
        meaning: Năm quyết định
        unit: năm
      when_to_use: Kiểm tra mức xác suất thành công tối thiểu để đặt cược pilot.
      why_it_works: p x PV(V) = cost là điểm E=0.
      assumptions:
      - Như m02_strategic_npv
      pitfalls:
      - Xác suất thực tế khó ước lượng
      interpretation: Thấp (vd 7,5-24%) và niềm tin thị trường cao hơn thì nên thử.
      example:
        inputs:
          cost: 3000
          v_expand: 20000
          r: 0.12
          k: 4
        steps:
        - 3.000/12.710 = 0,236
        result: p* = 23,6%
  - id: "m02-formulas-20"
    title: "Công thức: m02_digital_npv — NPV thời đại số (khung điều chỉnh)"
    tags: ["công", "thức", "m02_digital_npv", "npv", "thời", "đại", "số", "khung", "điều", "chỉnh"]
    text: |-
      id: m02_digital_npv
      name_vi: NPV thời đại số (khung điều chỉnh)
      name_en: Digital NPV
      expression_latex: DigitalNPV=NPV_{traditional}+NPV_{network\,effects}+NPV_{data\,asset}+OptionValue
      expression_python: npv_trad + npv_network + npv_data + option_value
      excel: =Tổng bốn thành phần
      variables:
      - symbol: npv_trad
        meaning: NPV dòng tiền thấy được
        unit: triệu đồng
      - symbol: npv_network
        meaning: Giá trị hiệu ứng mạng
        unit: triệu đồng
      - symbol: npv_data
        meaning: Giá trị tài sản dữ liệu dùng lại
        unit: triệu đồng
      - symbol: option_value
        meaning: Giá trị quyền chọn mở rộng
        unit: triệu đồng
      when_to_use: Đánh giá nền tảng/dự án số có hiệu ứng mạng và dữ liệu.
      why_it_works: NPV truyền thống chỉ đếm dòng tiền thấy được nên định giá thấp dự án làm tăng giá trị dự án khác.
      assumptions:
      - Giả định từng thành phần minh bạch, kiểm bằng kịch bản
      pitfalls:
      - Rất dễ thổi phồng để biện minh; là khung định tính
      interpretation: Chỉ chấp nhận khi từng thành phần có giả định kiểm chứng được.
      example:
        inputs:
          npv_trad: -100
          npv_network: 60
          npv_data: 40
          option_value: 50
        steps:
        - -100+60+40+50 = 50
        result: Digital NPV = 50 (số minh họa cách cộng)
  - id: "m02-formulas-21"
    title: "Công thức: m02_sensitivity — Độ nhạy NPV"
    tags: ["công", "thức", "m02_sensitivity", "độ", "nhạy", "npv"]
    text: |-
      id: m02_sensitivity
      name_vi: Độ nhạy NPV
      name_en: Sensitivity of NPV
      expression_latex: \Delta NPV=NPV(x\cdot(1\pm\delta))-NPV_{base}
      expression_python: npv_shocked - npv_base
      excel: Data Table một hoặc hai biến
      variables:
      - symbol: npv_shocked
        meaning: NPV khi đổi một biến
        unit: triệu đồng
      - symbol: npv_base
        meaning: NPV cơ sở
        unit: triệu đồng
      when_to_use: Xác định biến nhạy nhất để dồn nguồn lực dự báo.
      why_it_works: Đổi một biến cô lập ảnh hưởng của nó.
      assumptions:
      - Các biến khác giữ nguyên (khác kịch bản)
      pitfalls:
      - Bỏ qua tương quan giữa các biến
      interpretation: Biến có |dNPV| lớn nhất là biến rủi ro chính (thường CAPEX, doanh thu).
      example:
        inputs:
          npv_shocked: 90.7487
          npv_base: 240.7074
        steps:
        - 'EBITDA -10% (468): NPV = +90,75; dNPV = -149,96'
        result: dNPV = -149,96 triệu (Máy A, EBITDA -10%)
  - id: "m02-procedures-1"
    title: "Quy trình: m02_proc_full_appraisal — Thẩm định một dự án từ đầu đến cuối"
    tags: ["quy", "trình", "m02_proc_full_appraisal", "thẩm", "định", "một", "dự", "án", "từ", "đầu", "đến", "cuối"]
    text: |-
      id: m02_proc_full_appraisal
      name: Thẩm định một dự án từ đầu đến cuối
      steps:
      - 'Sàng lọc: dự án có phù hợp chiến lược, thuộc loại nào (mở rộng/thay thế/bắt buộc/độc lập/loại trừ)?'
      - 'Thu thập dữ kiện: vốn máy, lắp đặt, NWC, EBITDA tăng thêm từng năm, vòng đời, khấu hao, thuế T, giá bán lại, chi phí cơ hội, r.'
      - Loại chi phí chìm; thêm chi phí cơ hội và ngoại tác (cannibalization); bỏ lãi vay/tài trợ.
      - 'Năm 0: C0 = CAPEX + lắp đặt - bán tài sản cũ + thuế lãi bán + NWC.'
      - 'Năm 1..n: Dep = Vốn/n; EBIT = EBITDA-Dep; NOPAT = EBIT(1-T); OCF = NOPAT+Dep; trừ dNWC và maintenance CAPEX.'
      - 'Năm n: cộng Terminal CF = Salvage - thuế (Salvage - book) + thu hồi NWC.'
      - Lập bảng FCF năm 0..n; chiết khấu theo r; tính NPV, IRR, MIRR, PI, PP, DPP.
      - 'Kiểm tra: NPV hàm = tổng PV; tổng khấu hao = vốn máy; Terminal CF đã gồm NWC; hai công thức OCF khớp.'
      - 'Rủi ro: độ nhạy (doanh thu, CAPEX, r, chi phí), kịch bản + xác suất, hòa vốn EBITDA (Goal Seek) và biên an toàn, real options.'
      - Quyết định theo decision_rules; nêu kill criteria và kế hoạch post-audit.
      outputs: Bảng FCF năm 0-n, NPV/IRR/PI/PP/DPP, bảng độ nhạy/kịch bản, EBITDA hòa vốn, khuyến nghị và tiêu chí dừng.
  - id: "m02-procedures-2"
    title: "Quy trình: m02_proc_mutually_exclusive — Chọn giữa hai dự án loại trừ nhau (NPV vs IRR xung đột)"
    tags: ["quy", "trình", "m02_proc_mutually_exclusive", "chọn", "giữa", "hai", "dự", "án", "loại", "trừ", "nhau", "npv"]
    text: |-
      id: m02_proc_mutually_exclusive
      name: Chọn giữa hai dự án loại trừ nhau (NPV vs IRR xung đột)
      steps:
      - Tính NPV, IRR, PI, PP, DPP cho từng dự án.
      - Nếu NPV và IRR (hoặc PI) chọn khác nhau, lập dòng tiền chênh lệch (lớn - nhỏ).
      - Tính NPV chênh lệch (phải bằng chênh lệch NPV hai dự án) và IRR gia tăng.
      - 'So IRR gia tăng với r: lớn hơn thì chọn dự án lớn.'
      - Lập đồ thị/bảng NPV theo r để thấy điểm giao (crossover).
      - Chạy độ nhạy và hòa vốn cho cả hai; dự án lớn thường có đòn bẩy hoạt động cao hơn.
      - 'Khuyến nghị có điều kiện: chọn lớn nếu có đơn hàng/hợp đồng chống lưng EBITDA và huy động được vốn thêm với chi phí < IRR gia tăng; nếu chưa chắc, chọn nhỏ và giữ option to expand.'
      outputs: Quyết định có giải thích vì sao IRR 'sai', điều kiện chuyển đổi.
  - id: "m02-procedures-3"
    title: "Quy trình: m02_proc_capital_rationing — Chọn tổ hợp khi vốn giới hạn"
    tags: ["quy", "trình", "m02_proc_capital_rationing", "chọn", "tổ", "hợp", "khi", "vốn", "giới", "hạn"]
    text: |-
      id: m02_proc_capital_rationing
      name: Chọn tổ hợp khi vốn giới hạn
      steps:
      - Loại dự án NPV <= 0; tính PI = 1 + NPV/Vốn cho phần còn lại.
      - Xếp PI giảm dần, chọn lần lượt đến khi hết vốn (heuristic).
      - Do vốn nguyên khối, liệt kê mọi tổ hợp thỏa ngân sách (n nhỏ) hoặc dùng Solver (biến nhị phân, mục tiêu max tổng NPV, ràng buộc tổng vốn <= ngân sách).
      - Chọn tổ hợp có tổng NPV cao nhất; báo vốn còn dư (có thể dùng cho dự án khác/giữ tiền).
      outputs: Danh sách dự án chọn, tổng vốn, tổng NPV, so sánh với heuristic.
  - id: "m02-procedures-4"
    title: "Quy trình: m02_proc_unequal_lives — So phương án khác vòng đời"
    tags: ["quy", "trình", "m02_proc_unequal_lives", "so", "phương", "án", "khác", "vòng", "đời"]
    text: |-
      id: m02_proc_unequal_lives
      name: So phương án khác vòng đời
      steps:
      - Tính NPV từng phương án trên vòng đời riêng.
      - EAA = NPV x r/(1-(1+r)^-n) (hoặc PMT(r,n,-NPV)).
      - Chọn EAA cao nhất (hoặc chi phí hằng năm tương đương thấp nhất nếu chỉ có chi phí); nêu giả định thay thế lặp lại.
      outputs: Bảng NPV, EAA và lựa chọn.
  - id: "m02-procedures-5"
    title: "Quy trình: m02_proc_risk — Phân tích rủi ro dự án"
    tags: ["quy", "trình", "m02_proc_risk", "phân", "tích", "rủi", "ro", "dự", "án"]
    text: |-
      id: m02_proc_risk
      name: Phân tích rủi ro dự án
      steps:
      - 'Độ nhạy: đổi từng biến (doanh thu, CAPEX, chi phí, r, giá bán lại) một mức nhất định, ghi NPV; xếp biến theo |dNPV|.'
      - 'Kịch bản: tốt/cơ sở/xấu thay đồng thời nhiều biến, gán xác suất, tính E[NPV] và sigma.'
      - 'Hòa vốn: Goal Seek EBITDA/doanh thu/sản lượng làm NPV=0; tính biên an toàn.'
      - 'Real options: dự án có thể chia giai đoạn/dừng/mở rộng không? Tính xác suất hòa vốn của quyền chọn.'
      - 'Phản biện: đối thủ phản ứng, công nghệ thay thế, optimism bias; có reviewer độc lập.'
      outputs: Bảng độ nhạy, kịch bản, EBITDA hòa vốn, kill criteria.
  - id: "m02-procedures-6"
    title: "Quy trình: m02_proc_replacement — Thay thế thiết bị cũ bằng thiết bị mới"
    tags: ["quy", "trình", "m02_proc_replacement", "thay", "thế", "thiết", "bị", "cũ", "bằng", "mới"]
    text: |-
      id: m02_proc_replacement
      name: Thay thế thiết bị cũ bằng thiết bị mới
      steps:
      - 'C0 = giá máy mới + lắp đặt + dNWC - giá bán máy cũ + thuế trên lãi bán (hoặc - tiết kiệm thuế nếu lỗ: thuế = (giá bán - sổ sách) x T).'
      - Dòng tiền gia tăng hằng năm = tiết kiệm chi phí/doanh thu tăng thêm sau thuế + chênh lệch lá chắn thuế khấu hao (Dep_mới - Dep_cũ) x T.
      - 'Terminal: chênh lệch giá trị thanh lý sau thuế (máy mới - máy cũ nếu giữ) + thu hồi NWC.'
      - Chiết khấu, tính NPV/IRR/DPP gia tăng; độ nhạy cho tiết kiệm nhân công và giá máy.
      outputs: NPV gia tăng của việc thay thế và khuyến nghị.
  - id: "m02-decision_rules-1"
    title: "Quy tắc quyết định: Nếu dự án độc lập và NPV > 0 thì chấp nhận; NPV < 0 thì từ chối; NPV = 0 thì hòa vốn kinh tế."
    tags: ["quy", "tắc", "quyết", "định", "nếu", "dự", "án", "độc", "lập", "và", "npv", "thì"]
    text: |-
      Nếu dự án độc lập và NPV > 0 thì chấp nhận; NPV < 0 thì từ chối; NPV = 0 thì hòa vốn kinh tế.
  - id: "m02-decision_rules-2"
    title: "Quy tắc quyết định: Nếu dự án loại trừ lẫn nhau thì chọn NPV cao nhất (sau khi kiểm tra rủi ro), không chọn theo IRR/PI."
    tags: ["quy", "tắc", "quyết", "định", "nếu", "dự", "án", "loại", "trừ", "lẫn", "nhau", "thì"]
    text: |-
      Nếu dự án loại trừ lẫn nhau thì chọn NPV cao nhất (sau khi kiểm tra rủi ro), không chọn theo IRR/PI.
  - id: "m02-decision_rules-3"
    title: "Quy tắc quyết định: Nếu NPV và IRR xung đột thì tính IRR gia tăng; IRR gia tăng > r thì chọn dự án lớn, ngược lại chọn …"
    tags: ["quy", "tắc", "quyết", "định", "nếu", "npv", "và", "irr", "xung", "đột", "thì", "tính"]
    text: |-
      Nếu NPV và IRR xung đột thì tính IRR gia tăng; IRR gia tăng > r thì chọn dự án lớn, ngược lại chọn dự án nhỏ.
  - id: "m02-decision_rules-4"
    title: "Quy tắc quyết định: Nếu r < điểm giao NPV profile thì dự án lớn thắng; r > điểm giao thì dự án nhỏ thắng."
    tags: ["quy", "tắc", "quyết", "định", "nếu", "điểm", "giao", "npv", "profile", "thì", "dự", "án"]
    text: |-
      Nếu r < điểm giao NPV profile thì dự án lớn thắng; r > điểm giao thì dự án nhỏ thắng.
  - id: "m02-decision_rules-5"
    title: "Quy tắc quyết định: Nếu dòng tiền đổi dấu nhiều lần thì không dùng IRR; dùng NPV hoặc MIRR."
    tags: ["quy", "tắc", "quyết", "định", "nếu", "dòng", "tiền", "đổi", "dấu", "nhiều", "lần", "thì"]
    text: |-
      Nếu dòng tiền đổi dấu nhiều lần thì không dùng IRR; dùng NPV hoặc MIRR.
  - id: "m02-decision_rules-6"
    title: "Quy tắc quyết định: Nếu IRR rất cao (vd 40%) thì nghi ngờ giả định tái đầu tư, kiểm bằng MIRR."
    tags: ["quy", "tắc", "quyết", "định", "nếu", "irr", "rất", "cao", "vd", "40", "thì", "nghi"]
    text: |-
      Nếu IRR rất cao (vd 40%) thì nghi ngờ giả định tái đầu tư, kiểm bằng MIRR.
  - id: "m02-decision_rules-7"
    title: "Quy tắc quyết định: Nếu vốn bị giới hạn thì xếp theo PI và kiểm tra mọi tổ hợp/Solver; không xếp theo NPV tuyệt đối."
    tags: ["quy", "tắc", "quyết", "định", "nếu", "vốn", "bị", "giới", "hạn", "thì", "xếp", "theo"]
    text: |-
      Nếu vốn bị giới hạn thì xếp theo PI và kiểm tra mọi tổ hợp/Solver; không xếp theo NPV tuyệt đối.
  - id: "m02-decision_rules-8"
    title: "Quy tắc quyết định: Nếu vòng đời khác nhau thì so EAA, không so NPV thuần."
    tags: ["quy", "tắc", "quyết", "định", "nếu", "vòng", "đời", "khác", "nhau", "thì", "so", "eaa"]
    text: |-
      Nếu vòng đời khác nhau thì so EAA, không so NPV thuần.
  - id: "m02-decision_rules-9"
    title: "Quy tắc quyết định: Nếu dự án bắt buộc (luật) thì chọn phương án chi phí hiện tại ròng thấp nhất, dù NPV âm."
    tags: ["quy", "tắc", "quyết", "định", "nếu", "dự", "án", "bắt", "buộc", "luật", "thì", "chọn"]
    text: |-
      Nếu dự án bắt buộc (luật) thì chọn phương án chi phí hiện tại ròng thấp nhất, dù NPV âm.
  - id: "m02-decision_rules-10"
    title: "Quy tắc quyết định: Nếu chỉ dựa vào Payback thì cảnh báo; dùng PP/DPP như bộ lọc thanh khoản cùng NPV > 0 (vd NPV > 0 V…"
    tags: ["quy", "tắc", "quyết", "định", "nếu", "chỉ", "dựa", "vào", "payback", "thì", "cảnh", "báo"]
    text: |-
      Nếu chỉ dựa vào Payback thì cảnh báo; dùng PP/DPP như bộ lọc thanh khoản cùng NPV > 0 (vd NPV > 0 VÀ DPP <= 60% vòng đời).
  - id: "m02-decision_rules-11"
    title: "Quy tắc quyết định: Nếu chi phí đã chi không thu hồi được thì loại khỏi phân tích (sunk cost); chỉ đánh giá NPV hướng t…"
    tags: ["quy", "tắc", "quyết", "định", "nếu", "chi", "phí", "đã", "không", "thu", "hồi", "được"]
    text: |-
      Nếu chi phí đã chi không thu hồi được thì loại khỏi phân tích (sunk cost); chỉ đánh giá NPV hướng tới tương lai.
  - id: "m02-decision_rules-12"
    title: "Quy tắc quyết định: Nếu dùng tài sản/nhân sự sẵn có thì tính chi phí cơ hội theo giá thuê/thị trường."
    tags: ["quy", "tắc", "quyết", "định", "nếu", "dùng", "tài", "sản", "nhân", "sự", "sẵn", "có"]
    text: |-
      Nếu dùng tài sản/nhân sự sẵn có thì tính chi phí cơ hội theo giá thuê/thị trường.
  - id: "m02-decision_rules-13"
    title: "Quy tắc quyết định: Nếu có lãi vay trong dòng tiền và chiết khấu bằng WACC thì sửa: loại lãi vay khỏi dòng tiền."
    tags: ["quy", "tắc", "quyết", "định", "nếu", "có", "lãi", "vay", "trong", "dòng", "tiền", "và"]
