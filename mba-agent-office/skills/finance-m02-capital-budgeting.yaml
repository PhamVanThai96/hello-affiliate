      Dữ liệu thiếu, phần lớn dựa ước tính của chủ doanh nghiệp: giảm doanh thu dự báo 10-20%, tăng CAPEX dự phòng 10-15%, tìm đơn hàng/hợp đồng khung làm bằng chứng.
  - id: "m02-sme_vn_guidance-2"
    title: "Lưu ý SME Việt Nam: Chi phí vốn r: thường lấy lãi vay ngân hàng hiện hành (tài sản thế chấp, lãi suất cao hơn tập đoàn)…"
