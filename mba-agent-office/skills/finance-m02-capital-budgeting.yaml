  - id: "m02-case_lessons-1"
    title: "Bài học case: Amazon AWS - đầu tư táo bạo vào hạ tầng đám mây"
    tags: ["bài", "học", "case", "amazon", "aws", "đầu", "tư", "táo", "bạo", "vào", "hạ", "tầng"]
    text: |-
      name: Amazon AWS - đầu tư táo bạo vào hạ tầng đám mây
      type: success
      setup: Đầu-giữa thập niên 2000 Amazon đầu tư hàng tỷ USD vào hạ tầng điện toán đám mây (S3 ra mắt 2006) cho thị trường gần như chưa tồn tại, thay vì chỉ tập trung thương mại điện tử. Bảng dòng tiền trong nguồn là mô hình giả lập minh họa, không phải số nội bộ.
      key_calculations:
      - Giai đoạn đầu CAPEX 3.000 triệu USD (NPV độc lập khoảng -3.000)
      - PV mở rộng = 20.000/1,12^4 = 12.710 triệu USD
      - E = 0,30 x 12.710 - 3.000 = +813 triệu USD
      - Xác suất hòa vốn = 3.000/12.710 = 23,6%
      - 'Thực tế công khai (làm tròn, ~FY2024): doanh thu AWS khoảng $100 tỷ+, lợi nhuận hoạt động $37-40 tỷ (biên ~37%), thị phần khoảng 30%'
      lesson: 'Cấu trúc quyết định như mua quyền chọn: lỗ tối đa có giới hạn, lãi không giới hạn trên (bất đối xứng); NPV truyền thống bảo thủ có thể âm nhưng Strategic NPV dương; đầu tư theo giai đoạn, kiểm chứng nhu cầu nội bộ trước (Amazon.com), post-audit liên tục. Cẩn trọng survivorship bias: bài học là cách cấu trúc quyết định, không phải cứ liều là thắng.'
      data_reliability: illustrative
  - id: "m02-case_lessons-2"
    title: "Bài học case: Iridium Satellite - thất bại 5 tỷ USD"
    tags: ["bài", "học", "case", "iridium", "satellite", "thất", "bại", "tỷ", "usd"]
    text: |-
      name: Iridium Satellite - thất bại 5 tỷ USD
      type: failure
      setup: Motorola và đối tác đầu tư khoảng 5 tỷ USD vào chòm 66 vệ tinh LEO (cuối 1980s-1998) cho điện thoại toàn cầu; mạng di động mặt đất lan nhanh và rẻ hơn dự kiến. Số liệu dự phóng không thống nhất giữa các nguồn nên chỉ dùng minh họa.
      key_calculations:
      - CAPEX ~3,4 tỷ dự kiến thành ~5 tỷ thực (+47%)
      - Thuê bao thực khoảng 55.000 so với mục tiêu hàng triệu (thường trích ~5 triệu)
      - PVIFA(15%,10) = 5,0188; dòng tiền cần = 5.000/5,0188 = 996 triệu USD/năm
      - Nếu mỗi thuê bao 1.500 USD/năm thì cần 664.000 thuê bao, gấp khoảng 12 lần 55.000
      - 'Kết quả: phá sản 1999, tài sản bán khoảng 25 triệu USD (~0,5% chi phí); Motorola xóa sổ khoảng 2,6 tỷ'
      lesson: 'Nguyên nhân: bỏ qua thay đổi công nghệ, ngụy biện chi phí chìm, không phân tích kịch bản, vượt CAPEX không dự phòng, nghiên cứu thị trường yếu, thiếu linh hoạt (cam kết cứng 66 vệ tinh), optimism bias. Biện pháp: stage-gate, real options (quyền dừng), xét phản ứng đối thủ/công nghệ thay thế, kỷ luật chi phí chìm, post-audit hằng quý, rà soát độc lập, kiểm tra hòa vốn đơn giản. So với AWS: thị trường đúng thời điểm vs sai, mô-đun vs cam kết cứng, vốn theo giai đoạn vs khóa $5B, kiểm chứng nhu cầu nội bộ vs không. Lưu ý $3.000 là giá máy chứ không phải doanh thu/tháng.'
      data_reliability: unverified
  - id: "m02-case_lessons-3"
    title: "Bài học case: Công ty In ấn và Bao bì Minh Tâm (Long An) chọn máy in A vs B"
    tags: ["bài", "học", "case", "công", "ty", "in", "ấn", "và", "bao", "bì", "minh", "tâm"]
    text: |-
      name: Công ty In ấn và Bao bì Minh Tâm (Long An) chọn máy in A vs B
      type: sme
      setup: 'Hai dự án loại trừ nhau, vòng đời 5 năm, khấu hao đường thẳng về 0, T = 20%, r = 12%, khảo sát 40 triệu là chi phí chìm (bỏ qua). Máy A: vốn 1.500, NWC 100, EBITDA 520/năm, bán lại 150. Máy B: vốn 2.400, NWC 150, EBITDA 820/năm, bán lại 240. Đơn vị triệu đồng.'
      key_calculations:
      - 'C0: A = 1.600; B = 2.550'
      - 'Khấu hao: A 300, B 480; EBIT: A 220, B 340; thuế 44 và 68; OCF: A 476, B 752 (kiểm: 520x0,8+300x0,2 = 476; 820x0,8+480x0,2 = 752)'
      - 'Terminal: A = 150x0,8+100 = 220; B = 240x0,8+150 = 342'
      - NPV A = +240,71; NPV B = +354,85 (B hơn 114,14)
      - IRR A 17,60% > IRR B 17,19% (xung đột); PI A 1,150 > PI B 1,139
      - PP A 3,36 năm, B 3,39 năm; DPP A 4,39, B 4,43
      - 'Dòng chênh lệch B-A: -950; 276 x4; 398; NPV chênh = +114,14; IRR gia tăng = 16,50% > 12%'
      - 'Độ nhạy EBITDA -10%: A +90,8 B +118,4; EBITDA -20%: A -59,2 B -118,1; CAPEX +20%: A -16,0 B -55,9; không bán lại: A +172,6 B +245,9; r = 15%: A +105,0 B +140,9; r = 18%: A -15,3 B -48,9'
      - 'EBITDA hòa vốn: A 436,5 (thấp hơn dự báo 16,1%); B 697,0 (thấp hơn 15,0%)'
      lesson: 'IRR và PI cao hơn của A chỉ vì A nhỏ hơn; khoản đầu tư thêm 950 triệu có IRR 16,5% > 12% nên chọn Máy B (NPV +114 triệu). Điểm giao ~16,5%: r thấp hơn thì B thắng, cao hơn thì A thắng. B có đòn bẩy hoạt động cao hơn nên nhạy hơn (EBITDA -20%: -118 vs -59). Khuyến nghị: chọn B nếu có đơn hàng/hợp đồng khung cho EBITDA >= ~700 và huy động thêm 950 với chi phí < 16,5%; nếu chưa chắc sản lượng, chọn A và giữ option to expand. Phương pháp: NPV là tiêu chí cuối, luôn tính IRR gia tăng khi mâu thuẫn, luôn chạy độ nhạy và hòa vốn.'
      data_reliability: illustrative
  - id: "m02-worked_examples-1"
    title: "Ví dụ có lời giải: Dòng tiền và NPV/IRR/PI/PP/DPP của Máy A và B (Minh Tâm)"
    tags: ["ví", "dụ", "có", "lời", "giải", "dòng", "tiền", "và", "npv", "irr", "pi", "pp"]
    text: |-
      name: Dòng tiền và NPV/IRR/PI/PP/DPP của Máy A và B (Minh Tâm)
      inputs:
        A:
          capex: 1500
          nwc: 100
          ebitda: 520
          salvage: 150
        B:
          capex: 2400
          nwc: 150
          ebitda: 820
          salvage: 240
        common:
          life: 5
          tax: 0.2
          r: 0.12
      steps:
      - 'Khấu hao: A 1.500/5 = 300; B 2.400/5 = 480'
      - 'OCF = EBITDA(1-T)+Dep.T: A 416+60 = 476; B 656+96 = 752'
      - 'Terminal: A 150x0,8+100 = 220; B 240x0,8+150 = 342'
      - 'CF A: -1.600; 476 x4; 696. CF B: -2.550; 752 x4; 1.094'
      - 'NPV 12%: A +240,71; B +354,85. IRR: A 17,60%; B 17,19%. PI: A 1,150; B 1,139'
      result: NPV chọn B, IRR/PI chọn A; xung đột do quy mô, giải quyết bằng IRR gia tăng.
  - id: "m02-worked_examples-2"
    title: "Ví dụ có lời giải: Giải xung đột bằng IRR gia tăng và NPV profile"
    tags: ["ví", "dụ", "có", "lời", "giải", "xung", "đột", "bằng", "irr", "gia", "tăng", "và"]
    text: |-
      name: Giải xung đột bằng IRR gia tăng và NPV profile
      inputs:
        delta_cf:
        - -950
        - 276
        - 276
        - 276
        - 276
        - 398
        r: 0.12
      steps:
      - NPV chênh lệch 12% = -950 + 276x(0,8929+0,7972+0,7118+0,6355) + 398x0,5674 = +114,14 (bằng 354,85 - 240,71)
      - IRR gia tăng = 16,50% > 12%
      - 'NPV profile: r=0%: A 1.000,0 B 1.552,0; 5%: 633,2 vs 973,7; 10%: 341,0 vs 513,0; 15%: 105,0 vs 140,9; 20%: -88,1 vs -163,6; giao tại ~16,5%'
      result: Chọn B vì chi phí vốn 12% thấp hơn điểm giao 16,5%.
  - id: "m02-worked_examples-3"
    title: "Ví dụ có lời giải: Phân bổ vốn khi ngân sách 3.000 (X, Y, Z, W)"
    tags: ["ví", "dụ", "có", "lời", "giải", "phân", "bổ", "vốn", "khi", "ngân", "sách", "000"]
    text: |-
