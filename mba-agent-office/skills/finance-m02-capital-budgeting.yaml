  - id: "m02-worked_examples-5"
    title: "Ví dụ có lời giải: Kịch bản NPV kỳ vọng và độ lệch chuẩn"
    tags: ["ví", "dụ", "có", "lời", "giải", "kịch", "bản", "npv", "kỳ", "vọng", "và", "độ"]
    text: |-
      name: Kịch bản NPV kỳ vọng và độ lệch chuẩn
      inputs:
        scenarios:
          best:
          - 0.25
          - 350
          base:
          - 0.5
          - 124
          worst:
          - 0.25
          - -80
      steps:
      - E[NPV] = 87,5+62-20 = 129,5
      - sigma = căn(0,25x220,5^2 + 0,5x5,5^2 + 0,25x209,5^2) = 152,1
      result: Kỳ vọng 129,5, sigma 152,1 > kỳ vọng nên dao động rất mạnh; kịch bản xấu -80 cần chịu được.
  - id: "m02-worked_examples-6"
    title: "Ví dụ có lời giải: MIRR vs IRR"
    tags: ["ví", "dụ", "có", "lời", "giải", "mirr", "vs", "irr"]
    text: |-
      name: MIRR vs IRR
      inputs:
        cf:
        - -1000
        - 400
        - 500
        - 600
        reinvest: 0.1
      steps:
      - IRR = 21,65%
      - FV dương = 484+550+600 = 1.634; MIRR = 1,634^(1/3)-1 = 17,78%
      result: MIRR 17,78% thấp hơn IRR vì tái đầu tư ở 10% thay vì 21,65%.
  - id: "m02-worked_examples-7"
    title: "Ví dụ có lời giải: PP và DPP"
    tags: ["ví", "dụ", "có", "lời", "giải", "pp", "và", "dpp"]
    text: |-
      name: PP và DPP
      inputs:
        cf:
        - -500
        - 150
        - 150
        - 150
        - 150
        - 150
        r: 0.1
      steps:
      - PP = 3 + 50/150 = 3,33
      - PV tích lũy tới năm 4 = -24,52; PV năm 5 = 93,14; DPP = 4 + 24,52/93,14 = 4,26
      result: PP 3,33 năm; DPP 4,26 năm.
  - id: "m02-worked_examples-8"
    title: "Ví dụ có lời giải: Real option (pilot rồi mở rộng) kiểu AWS"
