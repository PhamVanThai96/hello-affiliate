  - id: "m02-practice_questions-1"
    title: "Câu hỏi luyện tập: Quán cà phê: vốn 800 triệu; dòng tiền ròng sau thuế 250/năm x 5 năm; r = 12%. Tính NPV, PI, PP, DPP."
