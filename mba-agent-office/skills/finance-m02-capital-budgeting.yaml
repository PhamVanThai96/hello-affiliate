      Nếu có lãi vay trong dòng tiền và chiết khấu bằng WACC thì sửa: loại lãi vay khỏi dòng tiền.
  - id: "m02-decision_rules-14"
    title: "Quy tắc quyết định: Nếu NPV chỉ dương nhờ một biến lạc quan (doanh thu, CAPEX nhạy nhất) thì dồn nguồn lực dự báo biến …"
    tags: ["quy", "tắc", "quyết", "định", "nếu", "npv", "chỉ", "dương", "nhờ", "một", "biến", "lạc"]
    text: |-
      Nếu NPV chỉ dương nhờ một biến lạc quan (doanh thu, CAPEX nhạy nhất) thì dồn nguồn lực dự báo biến đó; biên an toàn < 10% thì chưa nên làm.
  - id: "m02-decision_rules-15"
    title: "Quy tắc quyết định: Nếu bất định cao và có thể chia giai đoạn thì chọn pilot/stage-gate, tính xác suất hòa vốn của quyề…"
    tags: ["quy", "tắc", "quyết", "định", "nếu", "bất", "cao", "và", "có", "thể", "chia", "giai"]
    text: |-
      Nếu bất định cao và có thể chia giai đoạn thì chọn pilot/stage-gate, tính xác suất hòa vốn của quyền chọn; đặt kill criteria trước.
  - id: "m02-decision_rules-16"
    title: "Quy tắc quyết định: Nếu đã trót chi nhiều (Iridium) thì hỏi 'nếu chưa chi gì, hôm nay có làm không?'; nếu giả định cốt …"
    tags: ["quy", "tắc", "quyết", "định", "nếu", "đã", "trót", "chi", "nhiều", "iridium", "thì", "hỏi"]
    text: |-
      Nếu đã trót chi nhiều (Iridium) thì hỏi 'nếu chưa chi gì, hôm nay có làm không?'; nếu giả định cốt lõi sai (thuê bao << dự phóng) thì DỪNG.
  - id: "m02-decision_rules-17"
    title: "Quy tắc quyết định: Nếu kỳ vọng NPV dương nhưng sigma lớn hơn kỳ vọng và kịch bản xấu vượt khả năng chịu lỗ thì giảm qu…"
    tags: ["quy", "tắc", "quyết", "định", "nếu", "kỳ", "vọng", "npv", "dương", "nhưng", "sigma", "lớn"]
    text: |-
      Nếu kỳ vọng NPV dương nhưng sigma lớn hơn kỳ vọng và kịch bản xấu vượt khả năng chịu lỗ thì giảm quy mô/phân kỳ.
  - id: "m02-decision_rules-18"
    title: "Quy tắc quyết định: Nếu dự án số có hiệu ứng mạng/dữ liệu thì có thể cộng thêm thành phần, nhưng chỉ khi giả định minh …"
    tags: ["quy", "tắc", "quyết", "định", "nếu", "dự", "án", "số", "có", "hiệu", "ứng", "mạng"]
    text: |-
      Nếu dự án số có hiệu ứng mạng/dữ liệu thì có thể cộng thêm thành phần, nhưng chỉ khi giả định minh bạch và kiểm kịch bản.
