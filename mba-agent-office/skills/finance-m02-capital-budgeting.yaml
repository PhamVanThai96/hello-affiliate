    text: |-
      q: 'Quán cà phê: vốn 800 triệu; dòng tiền ròng sau thuế 250/năm x 5 năm; r = 12%. Tính NPV, PI, PP, DPP.'
      a: 'NPV = +101,19; PI = 1,126 (PV dòng tương lai 901,19/800); PP = 800/250 = 3,2 năm; DPP: PV tích lũy tới năm 4 = -40,66, PV năm 5 = 141,85, DPP = 4,29 năm; IRR 16,99%. Đáng đầu tư.'
  - id: "m02-practice_questions-2"
    title: "Câu hỏi luyện tập: Giải thích vì sao (a) không trừ lãi vay, (b) khấu hao làm tăng NPV, (c) 30 triệu nghiên cứu thị trư…"
    tags: ["câu", "hỏi", "luyện", "tập", "giải", "thích", "vì", "sao", "không", "trừ", "lãi", "vay"]
    text: |-
      q: Giải thích vì sao (a) không trừ lãi vay, (b) khấu hao làm tăng NPV, (c) 30 triệu nghiên cứu thị trường đã trả có tính không.
      a: '(a) WACC đã gồm chi phí nợ, trừ lãi nữa là đếm hai lần. (b) Khấu hao tạo lá chắn thuế Dep x T là tiền thật. (c) Không: chi phí chìm.'
  - id: "m02-practice_questions-3"
    title: "Câu hỏi luyện tập: Máy 1,2 tỷ khấu hao 6 năm về 0; EBITDA +400/năm; T 20%; NWC +80 thu hồi cuối kỳ; bán lại 100 cuối n…"
    tags: ["câu", "hỏi", "luyện", "tập", "máy", "tỷ", "khấu", "hao", "năm", "về", "ebitda", "400"]
    text: |-
      q: Máy 1,2 tỷ khấu hao 6 năm về 0; EBITDA +400/năm; T 20%; NWC +80 thu hồi cuối kỳ; bán lại 100 cuối năm 6. Lập CF, tax shield, NPV r = 11%.
      a: Dep = 200; tax shield = 40/năm; OCF = 400x0,8+200x0,2 = 360; CF0 = -1.280; năm 1-5 = 360; năm 6 = 360 + 100x0,8 + 80 = 520; NPV = +328,54; IRR 19,11%.
  - id: "m02-practice_questions-4"
    title: "Câu hỏi luyện tập: P: -100, +60, +60; Q: -500, 0, +630; r = 10%. NPV, IRR, IRR gia tăng; chọn dự án nào nếu loại trừ?"
    tags: ["câu", "hỏi", "luyện", "tập", "100", "60", "500", "630", "10", "npv", "irr", "gia"]
    text: |-
      q: 'P: -100, +60, +60; Q: -500, 0, +630; r = 10%. NPV, IRR, IRR gia tăng; chọn dự án nào nếu loại trừ?'
      a: NPV P = +4,13, IRR 13,07%; NPV Q = +20,66, IRR 12,25% nên NPV và IRR xếp hạng ngược nhau. Dòng chênh Q-P = -400, -60, +570 có NPV +16,53, IRR gia tăng 12,11% > 10% nên chọn Q (NPV cao hơn).
  - id: "m02-practice_questions-5"
    title: "Câu hỏi luyện tập: Ngân sách 2.000; A (800/160), B (700/154), C (600/90), D (900/171) (vốn/NPV). Chọn tổ hợp."
    tags: ["câu", "hỏi", "luyện", "tập", "ngân", "sách", "000", "800", "160", "700", "154", "600"]
    text: |-
      q: Ngân sách 2.000; A (800/160), B (700/154), C (600/90), D (900/171) (vốn/NPV). Chọn tổ hợp.
      a: 'PI: A 1,20; B 1,22; C 1,15; D 1,19. Greedy PI chọn B+A = 1.500 (NPV 314), phần còn 500 không vừa C hay D. Tối ưu là A+D = 1.700 vốn, NPV 331 (B+D = 325, C+D = 261). Bài học: greedy PI không luôn tối ưu, kiểm tổ hợp.'
  - id: "m02-practice_questions-6"
    title: "Câu hỏi luyện tập: Xưởng may Hòa Bình: thay 10 máy cũ bằng máy mới. Cần có những khoản dòng tiền gia tăng nào?"
    tags: ["câu", "hỏi", "luyện", "tập", "xưởng", "may", "hòa", "bình", "thay", "10", "máy", "cũ"]
    text: |-
      q: 'Xưởng may Hòa Bình: thay 10 máy cũ bằng máy mới. Cần có những khoản dòng tiền gia tăng nào?'
      a: Giá máy mới + lắp đặt + đào tạo + dNWC; bán máy cũ và thuế trên lãi/lỗ sổ sách; tiết kiệm nhân công và giảm phế phẩm sau thuế; chênh lệch lá chắn thuế khấu hao; terminal CF; sau đó NPV, IRR, DPP, độ nhạy tiết kiệm nhân công ±20% và giá máy +15%, khuyến nghị với kill criteria.
  - id: "m02-practice_questions-7"
    title: "Câu hỏi luyện tập: Pilot trà sữa: vốn 600 (NPV độc lập -150); thành công 40% thì nhân rộng 10 cửa hàng NPV +2.000. Giá…"
    tags: ["câu", "hỏi", "luyện", "tập", "pilot", "trà", "sữa", "vốn", "600", "npv", "độc", "lập"]
    text: |-
      q: 'Pilot trà sữa: vốn 600 (NPV độc lập -150); thành công 40% thì nhân rộng 10 cửa hàng NPV +2.000. Giá trị kỳ vọng và xác suất hòa vốn?'
      a: E = -150 + 0,4x2.000 = +650 triệu (so với NPV truyền thống -150 nên bị từ chối); p* = 150/2.000 = 7,5%. Nên thử vì lỗ có giới hạn.
