            support: 35
        hoc_phi:
          phi: 36
          thang: 12
          ngay_thu: 01/10
          hoc_vien: 50
      steps:
      - 'Phần mềm: tổng SSP = 120; license 100 x 50/120 = 41,67; triển khai 29,17; support 29,16 (tổng 100).'
      - 'Ghi nhận: license khi giao 41,67; triển khai theo tiến độ 2 tháng 29,17; support 29,16/12 = 2,43 triệu/tháng.'
      - 'Bút toán khi nhận 100 tiền: Nợ 112 = 100 / Có 3387 (hoặc 131 dư Có) = 100; sau đó chuyển dần sang Có 511 khi thực hiện nghĩa vụ.'
      - 'Học phí: 36/12 = 3 triệu/tháng; từ 01/10 đến 31/12 là 3 tháng -> doanh thu 9 triệu/học viên.'
      - 'Bút toán 01/10: Nợ 112 = 36 / Có 3387 = 36; cuối mỗi tháng Nợ 3387 / Có 511 = 3; đến 31/12 doanh thu 9, 3387 còn 27.'
      - '50 học viên: doanh thu năm 450; tiền thu 1.800; doanh thu chưa thực hiện 1.350; kiểm tra 450 + 1.350 = 1.800.'
      result: Phần mềm 41,67 / 29,17 / 29,16 triệu; học phí doanh thu 450, chưa thực hiện 1.350 triệu.
  - id: "m01-worked_examples-6"
    title: "Ví dụ có lời giải: 6. Bảng cân đối tìm LNCPP và LNST; lưu chuyển tiền gián tiếp nhanh (triệu VNĐ, giả định minh họa)"
