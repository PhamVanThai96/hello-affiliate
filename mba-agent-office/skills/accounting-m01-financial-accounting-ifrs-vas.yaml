    title: "Quy tắc quyết định: Nếu cần quyết định có kiểm toán hay không thì xem đối tượng bắt buộc (niêm yết, vốn nước ngoài...) …"
    tags: ["quy", "tắc", "quyết", "định", "nếu", "cần", "có", "kiểm", "toán", "hay", "không", "thì"]
