  - id: "m01-case_lessons-1"
    title: "Bài học case: Vinamilk - minh bạch tài chính làm giảm chi phí vốn"
    tags: ["bài", "học", "case", "vinamilk", "minh", "bạch", "tài", "chính", "làm", "giảm", "chi", "phí"]
    text: |-
      name: Vinamilk - minh bạch tài chính làm giảm chi phí vốn
      type: success
      setup: 'Vinamilk (VNM) thường được nhắc là ví dụ minh bạch: BCTC theo VAS kèm công bố bổ sung, kiểm toán quốc tế uy tín, công bố đúng hạn, IR quốc tế, cổ tức tiền mặt đều. Thông tin định tính cần đối chiếu báo cáo thường niên và BCTC kiểm toán chính thức.'
      key_calculations:
      - Gordon P0 = D1/(ke - g) với D1 = 1.000, g = 5%.
      - 'Kém minh bạch ke = 14%: 1.000/0,09 = 11.111 đồng.'
      - 'Minh bạch ke = 13%: 1.000/0,08 = 12.500 đồng; 12.500/11.111 - 1 = 12,5%.'
      lesson: Minh bạch làm giảm phần bù rủi ro thông tin nên giảm chi phí vốn, tăng giá trị mà dòng tiền hoạt động không đổi. SME xây hệ thống kế toán chuẩn từ sớm, không đợi gọi vốn (sửa sổ lúc đó tốn kém và bị trừ điểm khi due diligence). Mức giảm 1 điểm % chỉ là giả định minh họa, không phải số đo thực của Vinamilk.
      data_reliability: illustrative
  - id: "m01-case_lessons-2"
    title: "Bài học case: Enron (2001) - gian lận kế toán lớn nhất lịch sử"
    tags: ["bài", "học", "case", "enron", "2001", "gian", "lận", "kế", "toán", "lớn", "nhất", "lịch"]
    text: |-
      name: Enron (2001) - gian lận kế toán lớn nhất lịch sử
      type: failure
      setup: Công ty năng lượng Mỹ doanh thu khoảng 101 tỷ USD (2000), phá sản cuối 2001 với tài sản khoảng 63,4 tỷ USD; Arthur Andersen vừa kiểm toán vừa tư vấn; CFO Fastow và CEO Skilling bị kết án. Số liệu lịch sử cần đối chiếu hồ sơ tòa án và SEC.
      key_calculations:
      - 'SPE (giả định): tài sản 1.000, nợ 400, vốn 600; giấu 300 nợ: D/E 400/600 = 0,67 thay vì 700/600 = 1,17 (thấp hơn 42,9%).'
      - 'Mark-to-Market (giả định): 10 triệu USD/năm x 10 năm, 10%: PV = 61,45 ghi ngay trong khi tiền thực nhận = 0.'
      - 'Round-trip: bán 100 rồi mua lại 100 -> lợi nhuận 0 nhưng doanh thu +100.'
      - 'Vốn hóa chi phí 50 khấu hao 5 năm: lợi nhuận kỳ đầu chỉ giảm 10 thay vì 50, thổi phồng 40.'
      lesson: 'Năm bài học: kiểm toán phải độc lập; soi giao dịch ngoài bảng và bên liên quan; lợi nhuận tăng mà CFO không tăng là cờ đỏ; ''quá tốt để là thật'' thường không thật; quản trị yếu là thảm họa. Hệ quả: SOX 2002.'
      data_reliability: unverified
  - id: "m01-case_lessons-3"
    title: "Bài học case: Nắng Mai - lập và đọc bộ báo cáo từng bước (SME VN)"
    tags: ["bài", "học", "case", "nắng", "mai", "lập", "và", "đọc", "bộ", "báo", "cáo", "từng"]
    text: |-
      name: Nắng Mai - lập và đọc bộ báo cáo từng bước (SME VN)
      type: sme
      setup: 'Công ty TNHH bán đồ gia dụng, chủ Lan ''lãi mà không có tiền''. BS đầu năm cân 1.400. Năm N: doanh thu 5.000, giá vốn 3.500, CP bán 500, CP quản lý 400 (khấu hao 100), lãi vay 60, thuế 20%, mua TSCĐ 150, trả nợ DH 60, cổ tức 150. Giả định minh họa, đã verify bằng sổ cái giả lập.'
      key_calculations:
      - 'P&L: GP 1.500; EBIT 600; EBT 540; thuế 108; NI 432; biên 30% / 12% / 8,64%.'
      - 'BS cuối năm: tài sản 382 + 260 + 480 + 550 = 1.672; nợ 300 + 200 + 240 = 740; vốn 500 + 432 = 932; cân.'
      - CFO gián tiếp 432 + 100 - 60 - 80 + 50 = 442; CFI -150; CFF -210; thay đổi +82; tiền 300 -> 382.
      - 'Trực tiếp: 4.940 - 3.530 - 800 - 60 - 108 = 442 (khớp).'
      - 140 (60 + 80) nằm trong phải thu và tồn kho; nếu NCC không cho nợ thêm 50 thì CFO 392 (< lợi nhuận 40).
      - FCF 292; payout 34,7%; current 2,24; quick 1,28; DSO 19; DIO 50; DPO 31; CCC 38; ROE 46,4%; D/E 0,79.
      - 'Giảm DIO 50 -> 45 ngày: 3.500/365 x 5 ≈ 48 triệu.'
      lesson: 'Ba báo cáo phải khớp. Chủ DN không chỉ nhìn lãi: giải phóng tiền bằng thu hồi công nợ và giảm tồn kho; theo dõi phụ thuộc tín dụng nhà cung cấp (50 ≈ 11,3% CFO); lập báo cáo hằng quý.'
      data_reliability: illustrative
  - id: "m01-case_lessons-4"
    title: "Bài học case: Xưởng in - cơ sở tiền vs dồn tích"
    tags: ["bài", "học", "case", "xưởng", "in", "cơ", "sở", "tiền", "vs", "dồn", "tích"]
    text: |-
      name: Xưởng in - cơ sở tiền vs dồn tích
      type: sme
      setup: Xưởng in giao lô hàng 200 triệu ngày 28/12, khách trả 10/01; chi phí 140 đã trả tháng 12. Giả định minh họa.
      key_calculations:
      - 'Cash: tháng 12 = 0 - 140 = -140; tháng 1 = +200.'
      - 'Accrual: tháng 12 = 200 - 140 = +60; tháng 1 = 0.'
      - Tổng hai tháng đều 60.
      lesson: Cơ sở tiền làm chủ DN đánh giá sai hiệu quả từng tháng; dồn tích phản ánh đúng, khoản chưa thu nằm ở Phải thu khách hàng.
      data_reliability: illustrative
  - id: "m01-case_lessons-5"
    title: "Bài học case: Công ty phần mềm - hợp đồng 100 triệu ba nghĩa vụ"
    tags: ["bài", "học", "case", "công", "ty", "phần", "mềm", "hợp", "đồng", "100", "triệu", "ba"]
    text: |-
      name: Công ty phần mềm - hợp đồng 100 triệu ba nghĩa vụ
      type: sme
      setup: License + triển khai 2 tháng + support 12 tháng, giá 100; giá bán độc lập 50 / 35 / 35 (tổng 120). Giả định minh họa.
      key_calculations:
      - License 100 x 50/120 = 41,67; triển khai 29,17; support 29,16.
      - Support rải đều 29,16/12 = 2,43 triệu/tháng.
      lesson: Tiền nhận 1 lần nhưng doanh thu rải nhiều kỳ; phần chưa ghi nhận nằm trên BS là doanh thu chưa thực hiện.
      data_reliability: illustrative
  - id: "m01-case_lessons-6"
    title: "Bài học case: Trung tâm tiếng Anh - học phí trọn khóa"
    tags: ["bài", "học", "case", "trung", "tâm", "tiếng", "anh", "phí", "trọn", "khóa"]
    text: |-
      name: Trung tâm tiếng Anh - học phí trọn khóa
      type: sme
      setup: Học phí 36 triệu/học viên/12 tháng thu ngày 01/10; kỳ kế toán năm dương lịch; 50 học viên. Giả định minh họa.
      key_calculations:
      - 3 triệu/tháng x 3 tháng = 9 triệu doanh thu/học viên; 27 triệu doanh thu chưa thực hiện.
      - '50 học viên: doanh thu 450; tiền thu 1.800; doanh thu chưa thực hiện 1.350; 450 + 1.350 = 1.800.'
      lesson: Tiền thu lớn hơn doanh thu vì nhận trước khi cung cấp dịch vụ; doanh thu chưa thực hiện là nghĩa vụ phải phục vụ (và hoàn tiền nếu khách bỏ học).
      data_reliability: illustrative
  - id: "m01-worked_examples-1"
    title: "Ví dụ có lời giải: 1. Cửa hàng mới: 5 bút toán, tổng tài sản = nợ + vốn chủ (triệu VNĐ, giả định minh họa)"
    tags: ["ví", "dụ", "có", "lời", "giải", "cửa", "hàng", "mới", "bút", "toán", "tổng", "tài"]
    text: |-
      name: '1. Cửa hàng mới: 5 bút toán, tổng tài sản = nợ + vốn chủ (triệu VNĐ, giả định minh họa)'
      inputs:
        gop_von: 300
        vay: 100
        mua_chiu: 80
        ban_thu_tien: 150
        gia_von: 60
      steps:
      - 'Bút toán 1: Nợ 112 / Có 411 = 300 (chủ góp vốn).'
      - 'Bút toán 2: Nợ 112 / Có 341 = 100 (vay ngân hàng).'
      - 'Bút toán 3: Nợ 156 / Có 331 = 80 (mua hàng chưa trả).'
      - 'Bút toán 4: Nợ 111 / Có 511 = 150 (bán thu tiền ngay).'
      - 'Bút toán 5: Nợ 632 / Có 156 = 60 (ghi giá vốn).'
      - Tiền = 300 + 100 + 150 = 550; Hàng hóa = 80 - 60 = 20; Tổng tài sản = 570.
      - Nợ phải trả = vay 100 + phải trả người bán 80 = 180.
      - Vốn chủ = vốn góp 300 + lợi nhuận (150 - 60 = 90) = 390.
      - 'Kiểm tra: 180 + 390 = 570 = tổng tài sản. Tổng số bên Nợ = tổng bên Có = 300 + 100 + 80 + 150 + 60 = 690.'
      result: Tài sản 570 = Nợ 180 + Vốn chủ 390 (cân).
  - id: "m01-worked_examples-2"
    title: "Ví dụ có lời giải: 2. Nắng Mai: lập P&L, BS, CFS và các kiểm tra chéo (triệu VNĐ, giả định minh họa, thuế 20%)"
    tags: ["ví", "dụ", "có", "lời", "giải", "nắng", "mai", "lập", "bs", "cfs", "và", "các"]
    text: |-
      name: '2. Nắng Mai: lập P&L, BS, CFS và các kiểm tra chéo (triệu VNĐ, giả định minh họa, thuế 20%)'
      inputs:
        bs_dau_nam:
          tien: 300
          phai_thu: 200
          ton_kho: 400
          tscd_nbv: 500
          phai_tra: 250
          vay_ngan_han: 200
          vay_dai_han: 300
          von_gop: 500
          lncpp: 150
        trong_nam:
          doanh_thu: 5000
          gia_von: 3500
          cp_ban: 500
          cp_quan_ly: 400
          khau_hao_trong_cp_quan_ly: 100
          lai_vay: 60
          mua_tscd: 150
          tra_no_dai_han: 60
          co_tuc: 150
        cuoi_nam:
          phai_thu: 260
          ton_kho: 480
          phai_tra: 300
      steps:
      - 'Kiểm tra BS đầu năm: 300 + 200 + 400 + 500 = 1.400; 250 + 200 + 300 + 500 + 150 = 1.400 (cân).'
      - 'P&L: GP = 5.000 - 3.500 = 1.500; EBIT = 1.500 - 500 - 400 = 600; EBT = 600 - 60 = 540; thuế 20% = 108; NI = 432.'
      - 'Biên: 30% / 12% / 8,64%; CP bán + quản lý = 900/5.000 = 18%.'
      - 'BS cuối năm: TSCĐ NBV = 500 + 150 - 100 = 550; vay dài hạn = 300 - 60 = 240; vay ngắn hạn 200; LNCPP = 150 + 432 - 150 = 432.'
      - CFO gián tiếp = 432 + 100 - (260 - 200) - (480 - 400) + (300 - 250) = 442.
      - CFI = -150. CFF = -60 - 150 = -210. Thay đổi tiền = 442 - 150 - 210 = +82; tiền cuối = 300 + 82 = 382.
      - 'BS cuối năm: tài sản 382 + 260 + 480 + 550 = 1.672; nợ 300 + 200 + 240 = 740; vốn chủ 500 + 432 = 932; 740 + 932 = 1.672 (cân).'
      - 'Đối chiếu trực tiếp: thu KH 5.000 - 60 = 4.940; mua hàng = 3.500 + 80 = 3.580, chi NCC = 3.580 - 50 = 3.530; chi phí tiền = 500 + 400 - 100 = 800; lãi 60; thuế 108; CFO = 4.940 - 3.530 - 800 - 60 - 108 = 442 (khớp).'
      - 'Bút toán điều chỉnh/kết chuyển: Nợ 642 / Có 214 = 100; Nợ 911 / Có 632, 641, 642, 635, 821; Nợ 511 / Có 911 = 5.000; Nợ 911 / Có 421 = 432 (lãi); cổ tức Nợ 421 / Có 112 = 150 (qua 3388 nếu tuyên bố trước).'
      - 'Mô phỏng sổ cái đầy đủ cho số dư cuối: tiền 382, phải thu 260, tồn kho 480, TSCĐ gốc 950 - hao mòn 400 = 550, phải trả 300, vay 440, vốn 500, LNCPP 432; tổng Nợ = tổng Có.'
      - 'Phân tích: lợi nhuận 432 nhưng 140 (60 + 80) kẹt ở phải thu và tồn kho; CFO 442 chỉ nhờ khấu hao 100 và NCC cho nợ thêm 50; không có 50 đó CFO chỉ còn 392.'
      - 'Tỷ số: FCF 442 - 150 = 292; payout 150/432 = 34,7%; current 1.122/500 = 2,24; quick 642/500 = 1,28; DSO 19; DIO 50; DPO 31; CCC 38; ROE 432/932 = 46,4%; D/E 740/932 = 0,79.'
      - 'Khuyến nghị: giảm DIO còn 45 ngày giải phóng 3.500/365 x 5 ≈ 48 triệu; giữ DSO dưới 20 ngày; lập báo cáo hằng quý.'
      result: NI 432; CFO 442; tiền cuối năm 382; BS cân 1.672; ba báo cáo khớp.
  - id: "m01-worked_examples-3"
    title: "Ví dụ có lời giải: 3. FIFO và bình quân gia quyền: hai bài (VNĐ, giả định minh họa)"
    tags: ["ví", "dụ", "có", "lời", "giải", "fifo", "và", "bình", "quân", "gia", "quyền", "hai"]
    text: |-
      name: '3. FIFO và bình quân gia quyền: hai bài (VNĐ, giả định minh họa)'
      inputs:
        bai_a:
          lo1: 100 x 50.000
          lo2: 100 x 60.000
          ban: 150 x 80.000
        bai_b:
          lo1: 200 x 30.000
          lo2: 300 x 36.000
          ban: 350 x 50.000
      steps:
      - 'Bài A - FIFO: COGS = 100 x 50.000 + 50 x 60.000 = 8.000.000; tồn cuối 50 x 60.000 = 3.000.000; doanh thu 12.000.000; lãi gộp 4.000.000.'
      - 'Bài A - Bình quân: (5.000.000 + 6.000.000)/200 = 55.000; COGS 150 x 55.000 = 8.250.000; tồn 2.750.000; lãi gộp 3.750.000.'
      - 'Bài A - kiểm tra: COGS + tồn = 11.000.000 cho cả hai phương pháp (= tổng mua 5 + 6 triệu).'
      - Bài B - doanh thu = 350 x 50.000 = 17.500.000.
      - 'Bài B - FIFO: COGS = 200 x 30.000 + 150 x 36.000 = 6.000.000 + 5.400.000 = 11.400.000; tồn 150 x 36.000 = 5.400.000; lãi gộp 6.100.000.'
      - 'Bài B - Bình quân: (6.000.000 + 10.800.000)/500 = 33.600; COGS 350 x 33.600 = 11.760.000; tồn 150 x 33.600 = 5.040.000; lãi gộp 5.740.000.'
      - 'Bài B - kiểm tra: mỗi phương pháp COGS + tồn = 16.800.000 (tổng chi phí mua).'
      - 'Bút toán COGS: Nợ 632 / Có 156 theo số tính được.'
      result: Giá tăng nên FIFO có lãi gộp cao hơn (4,00 vs 3,75 triệu; 6,10 vs 5,74 triệu) nhưng tiền thực không đổi.
  - id: "m01-worked_examples-4"
    title: "Ví dụ có lời giải: 4. Khấu hao: ba phương pháp (triệu VNĐ, giả định minh họa)"
    tags: ["ví", "dụ", "có", "lời", "giải", "khấu", "hao", "ba", "phương", "pháp", "triệu", "vnđ"]
    text: |-
      name: '4. Khấu hao: ba phương pháp (triệu VNĐ, giả định minh họa)'
      inputs:
        may_a:
          nguyen_gia: 500
          gtth: 50
          nam: 5
          ty_le_db: 0.4
        may_dong_goi:
          nguyen_gia: 240
          gtth: 30
          nam: 5
          tong_san_luong: 1000000
          san_luong_nam_1: 180000
          ty_le_db: 0.4
      steps:
      - 'Máy A đường thẳng: (500 - 50)/5 = 90 triệu/năm, 5 năm tổng 450.'
      - 'Máy A số dư giảm dần 40%: năm 1: 500 x 40% = 200 (còn 300); năm 2: 120 (180); năm 3: 72 (108); năm 4: 43,2 (64,8); năm 5: min(25,92 ; 64,8 - 50) = 14,8 (50). Tổng 450.'
      - 'So sánh: DB làm khấu hao năm 1 là 200 so với 90 nên lợi nhuận năm 1 thấp hơn 110; tổng như nhau; thuế chỉ chấp nhận theo khung quy định (cần xác nhận hiện hành).'
      - 'Máy đóng gói đường thẳng: (240 - 30)/5 = 42 triệu/năm.'
      - 'Máy đóng gói theo sản lượng năm 1: 210/1.000.000 x 180.000 = 37,8 triệu.'
      - 'Máy đóng gói DB 40%: năm 1 = 240 x 40% = 96 (còn 144); năm 2 = 144 x 40% = 57,6 (bỏ qua giới hạn GTTH).'
      - 'Bút toán hằng năm: Nợ 642 / Có 214 theo số khấu hao; CFO gián tiếp cộng lại số này.'
      result: 'Máy A: SL 90/năm; DB 200-120-72-43,2-14,8; Máy đóng gói: 42; 37,8; 96 và 57,6.'
  - id: "m01-worked_examples-5"
    title: "Ví dụ có lời giải: 5. Ghi nhận doanh thu: gói phần mềm và học phí trọn khóa (triệu VNĐ, giả định minh họa)"
    tags: ["ví", "dụ", "có", "lời", "giải", "ghi", "nhận", "doanh", "thu", "gói", "phần", "mềm"]
    text: |-
      name: '5. Ghi nhận doanh thu: gói phần mềm và học phí trọn khóa (triệu VNĐ, giả định minh họa)'
      inputs:
        phan_mem:
          gia_hd: 100
