  - id: "m01-practice_questions-4"
    title: "Câu hỏi luyện tập: Tiền 120, phải thu 80, tồn kho 150, TSCĐ 400; phải trả 130, vay 250, vốn góp 200. Tìm LNCPP; nếu LN…"
    tags: ["câu", "hỏi", "luyện", "tập", "tiền", "120", "phải", "thu", "80", "tồn", "kho", "150"]
    text: |-
      q: Tiền 120, phải thu 80, tồn kho 150, TSCĐ 400; phải trả 130, vay 250, vốn góp 200. Tìm LNCPP; nếu LNCPP năm trước 100, cổ tức 40 thì NI?
      a: Tài sản 750; nợ + vốn góp 580; LNCPP 170; 170 = 100 + NI - 40 nên NI = 110.
  - id: "m01-practice_questions-5"
    title: "Câu hỏi luyện tập: LNST 300; khấu hao 60; phải thu tăng 40; tồn kho giảm 30; phải trả tăng 20. Tính CFO. Chi mua TSCĐ …"
    tags: ["câu", "hỏi", "luyện", "tập", "lnst", "300", "khấu", "hao", "60", "phải", "thu", "tăng"]
    text: |-
      q: LNST 300; khấu hao 60; phải thu tăng 40; tồn kho giảm 30; phải trả tăng 20. Tính CFO. Chi mua TSCĐ 200, vay thêm 100, tiền đầu 50, tiền cuối?
      a: CFO = 300 + 60 - 40 + 30 + 20 = 370. Thay đổi tiền = 370 - 200 + 100 = 270; tiền cuối 320.
  - id: "m01-practice_questions-6"
    title: "Câu hỏi luyện tập: Học phí 36 triệu/12 tháng thu 01/10, năm dương lịch. (a) doanh thu năm; (b) doanh thu chưa thực hiệ…"
    tags: ["câu", "hỏi", "luyện", "tập", "học", "phí", "36", "triệu", "12", "tháng", "thu", "01"]
    text: |-
      q: Học phí 36 triệu/12 tháng thu 01/10, năm dương lịch. (a) doanh thu năm; (b) doanh thu chưa thực hiện 31/12; (c) 50 học viên.
      a: 3 triệu/tháng. (a) 9 triệu/học viên; (b) 27 triệu; (c) doanh thu 450, tiền thu 1.800, chưa thực hiện 1.350 (450 + 1.350 = 1.800). Tiền thu lớn hơn doanh thu vì nhận trước khi phục vụ.
  - id: "m01-practice_questions-7"
    title: "Câu hỏi luyện tập: Vì sao hai DN cùng giá nhập, cùng bán nhưng dùng FIFO và bình quân báo lợi nhuận khác nhau? Tiền th…"
    tags: ["câu", "hỏi", "luyện", "tập", "vì", "sao", "hai", "dn", "cùng", "giá", "nhập", "bán"]
    text: |-
      q: Vì sao hai DN cùng giá nhập, cùng bán nhưng dùng FIFO và bình quân báo lợi nhuận khác nhau? Tiền thực có khác không?
      a: Phương pháp chia lại tổng chi phí giữa COGS và tồn cuối kỳ; COGS + tồn = tổng mua nên tiền thực không khác. Giá tăng thì FIFO COGS thấp hơn nên lợi nhuận và thuế cao hơn.
  - id: "m01-practice_questions-8"
    title: "Câu hỏi luyện tập: Lợi nhuận tăng mà CFO giảm nhiều kỳ cho thấy điều gì? Liên hệ Enron."
    tags: ["câu", "hỏi", "luyện", "tập", "lợi", "nhuận", "tăng", "mà", "cfo", "giảm", "nhiều", "kỳ"]
    text: |-
      q: Lợi nhuận tăng mà CFO giảm nhiều kỳ cho thấy điều gì? Liên hệ Enron.
      a: 'Tiền không theo lợi nhuận: doanh thu ghi sớm/ảo, phải thu phình, tồn kho tăng, vốn hóa chi phí hoặc Mark-to-Market. Enron ghi lợi nhuận ảo (PV 61,45 trong ví dụ) trong khi tiền thực bằng 0; đây là cờ đỏ kinh điển.'
  - id: "m01-practice_questions-9"
    title: "Câu hỏi luyện tập: SME 15 nhân viên nên chọn chế độ kế toán và phần mềm nào?"
    tags: ["câu", "hỏi", "luyện", "tập", "sme", "15", "nhân", "viên", "nên", "chọn", "chế", "độ"]
    text: |-
      q: SME 15 nhân viên nên chọn chế độ kế toán và phần mềm nào?
      a: 'Thường DNNVV áp TT133/2016 (cần xác nhận hiện hành) và phần mềm đám mây tích hợp hóa đơn điện tử, ngân hàng, POS (MISA/Fast...). Tiêu chí: phù hợp thông tư, tích hợp, xuất dữ liệu, hỗ trợ, tổng chi phí. Giá cần báo cụ thể.'
  - id: "m01-practice_questions-10"
    title: "Câu hỏi luyện tập: Nắng Mai: vì sao lợi nhuận 432 nhưng tiền chỉ tăng 82?"
    tags: ["câu", "hỏi", "luyện", "tập", "nắng", "mai", "vì", "sao", "lợi", "nhuận", "432", "nhưng"]
    text: |-
      q: 'Nắng Mai: vì sao lợi nhuận 432 nhưng tiền chỉ tăng 82?'
      a: 'CFO 442 nhưng chi đầu tư 150, trả nợ gốc 60, cổ tức 150: 442 - 150 - 60 - 150 = 82. Trong lợi nhuận, 140 kẹt ở phải thu (60) và tồn kho (80) được bù một phần bởi khấu hao 100 và NCC cho nợ thêm 50.'
  - id: "m01-practice_questions-11"
    title: "Câu hỏi luyện tập: Vì sao quick ratio loại tồn kho?"
    tags: ["câu", "hỏi", "luyện", "tập", "vì", "sao", "quick", "ratio", "loại", "tồn", "kho"]
    text: |-
      q: Vì sao quick ratio loại tồn kho?
      a: Tồn kho khó và chậm chuyển thành tiền, có thể phải giảm giá khi thanh lý nên coi thanh khoản thấp; quick ratio chỉ tính tiền và phải thu.
  - id: "m01-practice_questions-12"
    title: "Câu hỏi luyện tập: Giả sử Nắng Mai có thêm nợ ngoài bảng 300 (SPE). D/E đúng là bao nhiêu và đẹp giả bao nhiêu %?"
    tags: ["câu", "hỏi", "luyện", "tập", "giả", "sử", "nắng", "mai", "có", "thêm", "nợ", "ngoài"]
    text: |-
      q: Giả sử Nắng Mai có thêm nợ ngoài bảng 300 (SPE). D/E đúng là bao nhiêu và đẹp giả bao nhiêu %?
      a: Đúng (740 + 300)/932 = 1,12; báo cáo 740/932 = 0,79; thấp hơn khoảng 29%. (Tính mở rộng từ số liệu Nắng Mai, không có trong nguồn.)
  - id: "m01-practice_questions-13"
    title: "Câu hỏi luyện tập: Doanh thu giao 28/12, thu 10/01, chi phí 140 đã trả. Lợi nhuận tháng 12 theo cash và dồn tích?"
    tags: ["câu", "hỏi", "luyện", "tập", "doanh", "thu", "giao", "28", "12", "10", "01", "chi"]
    text: |-
      q: Doanh thu giao 28/12, thu 10/01, chi phí 140 đã trả. Lợi nhuận tháng 12 theo cash và dồn tích?
      a: 'Cash -140; dồn tích +60; tháng 1: cash +200, dồn tích 0; tổng hai tháng 60.'
