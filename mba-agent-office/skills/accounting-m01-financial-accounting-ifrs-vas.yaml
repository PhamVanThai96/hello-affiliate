  - id: "m01-decision_rules-14"
    title: "Quy tắc quyết định: Nếu chủ DN dùng tiền DN cho cá nhân thì tách tài khoản, trả lương/rút lợi nhuận theo quy định; báo …"
    tags: ["quy", "tắc", "quyết", "định", "nếu", "chủ", "dn", "dùng", "tiền", "cho", "cá", "nhân"]
    text: |-
      Nếu chủ DN dùng tiền DN cho cá nhân thì tách tài khoản, trả lương/rút lợi nhuận theo quy định; báo cáo méo và khó vay.
  - id: "m01-decision_rules-15"
    title: "Quy tắc quyết định: Nếu báo cáo thuế khác BCTC thì lập bảng đối chiếu chênh lệch giải thích được."
    tags: ["quy", "tắc", "quyết", "định", "nếu", "báo", "cáo", "thuế", "khác", "bctc", "thì", "lập"]
