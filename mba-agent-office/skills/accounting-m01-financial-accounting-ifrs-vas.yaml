  - id: "m01-worked_examples-8"
    title: "Ví dụ có lời giải: 8. Mini-case Enron: bốn thủ thuật bằng số (giả định minh họa)"
    tags: ["ví", "dụ", "có", "lời", "giải", "mini", "case", "enron", "bốn", "thủ", "thuật", "bằng"]
    text: |-
      name: '8. Mini-case Enron: bốn thủ thuật bằng số (giả định minh họa)'
