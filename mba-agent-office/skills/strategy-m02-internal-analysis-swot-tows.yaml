sections:
  - id: "m02-tong-quan"
    title: "Tổng quan m02"
    tags: ["m02", "phân", "tích", "nội", "bộ", "swot", "tows", "vrio", "và", "chuỗi", "giá", "trị"]
    text: |-
      Phân tích nội bộ: SWOT/TOWS, VRIO và Chuỗi giá trị (Internal Analysis: SWOT/TOWS, VRIO and Value Chain) — module m02

      Mục đích: Đánh giá năng lực nội tại của doanh nghiệp để biết (1) mình mạnh/yếu gì so với cơ hội/đe dọa bên ngoài (SWOT/TOWS), (2) điểm mạnh nào thực sự tạo lợi thế cạnh tranh bền vững (VRIO), (3) lợi thế/bất lợi đó nằm ở hoạt động nào của chuỗi giá trị và chi phí/giá trị phân bổ ra sao (Value Chain). Ba công cụ nối thành một chuỗi: SWOT nhận diện -> VRIO sàng lọc -> Value Chain định vị -> chiến lược.

      Dùng khi:
      - Chủ SME hỏi: 'Doanh nghiệp tôi mạnh/yếu ở đâu? Nên làm gì tiếp?'
      - Cần lọc xem điểm mạnh nào là lợi thế thật (khó bị đối thủ sao chép) để đầu tư/bảo vệ.
      - Cần tìm chỗ cắt chi phí hoặc chỗ đầu tư để tạo khác biệt; quyết định tự làm hay thuê ngoài (outsource).
      - Chuẩn bị đầu vào cho chọn chiến lược cạnh tranh (m03) hoặc tăng trưởng (m04).
      - Sau khi có kết quả PESTEL/5 Forces (m01), cần ghép với năng lực nội bộ.

      Nên nắm trước: - m01

      Module liên quan: - 'm01: cung cấp O và T (PESTEL, 5 Forces) cho SWOT/TOWS; VRIO và Value Chain chỉ nhìn bên trong nên phải ghép với m01.' - 'm03: kết quả Value Chain (nguồn lợi thế chi phí vs khác biệt) quyết định chọn Cost Leadership/Differentiation/Focus.' - 'm04: TOWS/VRIO cho biết hướng tăng trưởng nào (Ansoff) khả thi với nguồn lực hiện có.' - 'm06: các hoạt động then chốt tìm được ở Value Chain/VRIO biến th…

      Công thức (tra chi tiết bằng skill_search("<id>")):
      - m02_swot_weighted_score: Điểm SWOT có trọng số (cho từng nhóm S, W, O hoặc T)
      - m02_swot_net_position: Vị thế ròng nội bộ và bên ngoài (định hướng quadrant TOWS)
      - m02_vrio_classify: Phân loại kết quả VRIO
      - m02_value_chain_margin: Biên lợi nhuận chuỗi giá trị
      - m02_value_cost_ratio: Tỷ số giá trị/chi phí của hoạt động
      - m02_tows_priority: Điểm ưu tiên chiến lược TOWS

      Kho tra cứu của module: Khái niệm 8, Công thức 6, frameworks 6, Quy trình 4, Quy tắc quyết định 16, Chuẩn so sánh 8, Lỗi thường gặp 12, Lưu ý SME Việt Nam 9, Bài học case 5, Ví dụ có lời giải 4, Câu hỏi luyện tập 9, Checklist 14, Mẫu Excel/Sheets 5. Tra bằng skill_search với từ khoá chủ đề (vd "ví dụ SWOT", "lỗi thường gặp BSC").
  - id: "m02-concepts-1"
    title: "Khái niệm: Yếu tố nội bộ và bên ngoài"
    tags: ["khái", "niệm", "yếu", "tố", "nội", "bộ", "và", "bên", "ngoài"]
    text: |-
      term_vi: Yếu tố nội bộ và bên ngoài
      term_en: Internal vs External factors
      definition: |
        Nội bộ (S, W) là thứ doanh nghiệp kiểm soát/thay đổi được (nhân sự, vốn, quy trình, thương hiệu). Bên ngoài (O, T) là thứ doanh nghiệp không kiểm soát, chỉ thích ứng (thị trường, đối thủ, luật, công nghệ).
      why_it_matters: 'Phân loại sai (ví dụ ghi ''đối thủ mạnh'' là Weakness) làm TOWS cho ra chiến lược vô nghĩa. Quy tắc thử: ''Nếu mình tự quyết định được thì là S/W; nếu không thì là O/T''.'
  - id: "m02-concepts-2"
    title: "Khái niệm: Quan điểm dựa trên nguồn lực"
    tags: ["khái", "niệm", "quan", "điểm", "dựa", "trên", "nguồn", "lực"]
    text: |-
      term_vi: Quan điểm dựa trên nguồn lực
      term_en: Resource-Based View (RBV)
      definition: Lý thuyết cho rằng lợi thế cạnh tranh bền vững đến từ nguồn lực/năng lực bên trong có giá trị, hiếm, khó bắt chước, chứ không chỉ từ vị thế ngành.
      why_it_matters: 'Trước RBV, chiến lược chủ yếu nhìn ngành (Porter - nhìn ra ngoài). RBV (Wernerfelt 1984, Barney 1991) bổ sung góc nhìn ngược lại: vì sao hai công ty cùng ngành lại lãi khác nhau - do nguồn lực bên trong khác nhau.'
  - id: "m02-concepts-3"
    title: "Khái niệm: Nguồn lực và năng lực"
    tags: ["khái", "niệm", "nguồn", "lực", "và", "năng"]
    text: |-
      term_vi: Nguồn lực và năng lực
      term_en: Resources vs Capabilities
      definition: |
        Nguồn lực hữu hình (tài chính, thiết bị, mặt bằng, công nghệ), vô hình (thương hiệu, văn hóa, bản quyền, kiến thức) và năng lực (quy trình, kỹ năng phối hợp, khả năng đổi mới - khả năng BIẾN nguồn lực thành kết quả).
      why_it_matters: Nguồn lực đứng riêng hiếm khi tạo lợi thế; năng lực tổ chức khai thác nó mới tạo ra giá trị. Đây là lý do VRIO có chữ O.
  - id: "m02-concepts-4"
    title: "Khái niệm: Lợi thế cạnh tranh bền vững"
    tags: ["khái", "niệm", "lợi", "thế", "cạnh", "tranh", "bền", "vững"]
    text: |-
      term_vi: Lợi thế cạnh tranh bền vững
      term_en: Sustained Competitive Advantage
      definition: Lợi thế mà đối thủ không thể sao chép hoặc thay thế trong thời gian dài, giúp doanh nghiệp duy trì lợi nhuận vượt trội.
      why_it_matters: Mục tiêu cuối của VRIO. Phân biệt với lợi thế tạm thời (đối thủ copy được) để tránh đổ tiền vào thứ sớm bị san bằng.
  - id: "m02-concepts-5"
    title: "Khái niệm: Biên lợi nhuận trong chuỗi giá trị"
    tags: ["khái", "niệm", "biên", "lợi", "nhuận", "trong", "chuỗi", "giá", "trị"]
    text: |-
      term_vi: Biên lợi nhuận trong chuỗi giá trị
      term_en: Margin (Value Chain)
      definition: Margin = Giá trị tạo ra cho khách hàng (giá khách chịu trả) trừ tổng chi phí thực hiện các hoạt động.
      why_it_matters: 'Biến lợi nhuận thành bài toán hoạt động: muốn tăng margin chỉ có hai đường - tăng giá trị khách cảm nhận (khác biệt) hoặc giảm chi phí hoạt động (chi phí thấp).'
  - id: "m02-concepts-6"
    title: "Khái niệm: Hoạt động chính và hoạt động hỗ trợ"
    tags: ["khái", "niệm", "hoạt", "động", "chính", "và", "hỗ", "trợ"]
    text: |-
      term_vi: Hoạt động chính và hoạt động hỗ trợ
      term_en: Primary vs Support Activities
      definition: Hoạt động chính trực tiếp tạo, bán, giao, phục vụ sản phẩm (5 loại); hoạt động hỗ trợ (4 loại) cung cấp đầu vào/hạ tầng cho mọi hoạt động chính.
      why_it_matters: Lợi thế thường nằm ở hoạt động hỗ trợ (công nghệ, nhân sự, thu mua) chứ không phải chỉ ở sản xuất; nhiều SME bỏ sót mảng này.
  - id: "m02-concepts-7"
    title: "Khái niệm: Liên kết giữa các hoạt động"
    tags: ["khái", "niệm", "liên", "kết", "giữa", "các", "hoạt", "động"]
    text: |-
      term_vi: Liên kết giữa các hoạt động
      term_en: Linkages / system optimization
      definition: Hiệu quả tổng thể đến từ cách các hoạt động phối hợp, không phải từng hoạt động riêng lẻ tốt nhất.
      why_it_matters: Zara không dẫn đầu từng khâu riêng lẻ nhưng tối ưu cả chuỗi để đạt tốc độ nhanh; vì liên kết khó nhìn thấy nên đối thủ khó sao chép (nguồn của tính I trong VRIO).
  - id: "m02-concepts-8"
    title: "Khái niệm: Bất lợi / Ngang bằng / Tạm thời / Chưa khai thác / Bền vững"
    tags: ["khái", "niệm", "bất", "lợi", "ngang", "bằng", "tạm", "thời", "chưa", "khai", "thác", "bền"]
    text: |-
      term_vi: Bất lợi / Ngang bằng / Tạm thời / Chưa khai thác / Bền vững
      term_en: Disadvantage / Parity / Temporary / Unused / Sustained advantage
      definition: Năm kết quả của VRIO tùy nguồn lực đạt tới tiêu chí nào (xem formula m02_vrio_classify).
      why_it_matters: Mỗi kết quả kéo theo hành động khác nhau (sửa/loại bỏ, duy trì tối thiểu, khai thác nhanh, tổ chức lại, bảo vệ-đầu tư).
  - id: "m02-formulas-1"
    title: "Công thức: m02_swot_weighted_score — Điểm SWOT có trọng số (cho từng nhóm S, W, O hoặc T)"
    tags: ["công", "thức", "m02_swot_weighted_score", "điểm", "swot", "có", "trọng", "số", "cho", "từng", "nhóm", "hoặc"]
    text: |-
      id: m02_swot_weighted_score
      name_vi: Điểm SWOT có trọng số (cho từng nhóm S, W, O hoặc T)
      name_en: Weighted SWOT group score
      expression_latex: Score_{group} = \sum_{i=1}^{n} w_i \cdot s_i,\quad \sum w_i = 1,\ s_i \in [1,5]
      expression_python: sum(w*s for w, s in zip(weights, scores))
      excel: =SUMPRODUCT(weights_range, scores_range)
      variables:
      - symbol: weights
        meaning: Trọng số quan trọng của từng yếu tố trong nhóm (tổng = 1)
        unit: tỷ lệ
      - symbol: scores
        meaning: Điểm mức độ tác động của từng yếu tố (1 thấp - 5 cao)
        unit: điểm 1-5
      when_to_use: Khi cần ưu tiên và so sánh các nhóm S/W/O/T thay vì liệt kê ngang nhau (khắc phục nhược điểm 'không ưu tiên, không định lượng' của SWOT).
      why_it_works: SWOT gốc coi mọi dòng như nhau. Trọng số buộc người phân tích tự trả lời 'yếu tố nào quan trọng hơn', điểm 1-5 buộc đánh giá mức tác động; kết quả là số so sánh được giữa các nhóm và các lần phân tích. Đây là bước 3 'Đánh giá' trong quy trình SWOT 5 bước. Chỉ là heuristic quản trị, không phải công thức khoa học.
      assumptions:
      - Trọng số và điểm do workshop đồng thuận, vẫn mang tính chủ quan
      - Mỗi nhóm giữ 5-7 yếu tố, độc lập tương đối
      pitfalls:
      - Không chuẩn hóa trọng số về tổng 1 làm điểm không so sánh được
      - Chấm điểm S theo cảm tính, không có chứng cứ/số liệu
      - Điểm số cao tạo ảo giác chính xác; vẫn phải kiểm chứng bằng dữ liệu
      interpretation: Điểm nhóm gần 5 = nhóm đó chi phối bức tranh; so sánh S-W (nội bộ) và O-T (bên ngoài) để chọn quadrant TOWS trội (xem m02_swot_net_position).
      example:
        inputs:
          weights:
          - 0.4
          - 0.35
          - 0.25
          scores:
          - 4
          - 5
          - 3
        steps:
        - 0.4*4 = 1.6
        - 0.35*5 = 1.75
        - 0.25*3 = 0.75
        - Tổng = 1.6+1.75+0.75 = 4.1
        result: Điểm S = 4.1
  - id: "m02-formulas-2"
    title: "Công thức: m02_swot_net_position — Vị thế ròng nội bộ và bên ngoài (định hướng quadrant TOWS)"
    tags: ["công", "thức", "m02_swot_net_position", "vị", "thế", "ròng", "nội", "bộ", "và", "bên", "ngoài", "định"]
    text: |-
      id: m02_swot_net_position
      name_vi: Vị thế ròng nội bộ và bên ngoài (định hướng quadrant TOWS)
      name_en: SWOT net position
      expression_latex: Net_{int} = S - W,\quad Net_{ext} = O - T
      expression_python: (S - W, O - T)
      excel: =S-W ; =O-T
      variables:
      - symbol: S
        meaning: Điểm có trọng số nhóm Strengths
        unit: điểm
      - symbol: W
        meaning: Điểm có trọng số nhóm Weaknesses
        unit: điểm
      - symbol: O
        meaning: Điểm có trọng số nhóm Opportunities
        unit: điểm
      - symbol: T
        meaning: Điểm có trọng số nhóm Threats
        unit: điểm
      when_to_use: Sau khi chấm 4 nhóm, để chọn nhóm chiến lược TOWS nên ưu tiên (SO/ST/WO/WT).
      why_it_works: Nội bộ mạnh hơn yếu (Net_int > 0) và môi trường thuận lợi hơn bất lợi (Net_ext > 0) -> chiến lược tấn công; các tổ hợp còn lại tương ứng ST (phòng thủ), WO (cải thiện), WT (sinh tồn). Lấy hiệu để thấy 'bên nào trội' một cách trực quan; là quy tắc tham khảo, không thay thế phán đoán.
      assumptions:
      - Hai nhóm được chấm cùng thang điểm 1-5 và chuẩn hóa trọng số
      pitfalls:
      - Chênh lệch rất nhỏ (|Net| < 0.3) không đủ để kết luận; xét cả 4 quadrant
      - Dùng một con số duy nhất che mất yếu tố sống còn (ví dụ T là quy định cấm kinh doanh)
      interpretation: Net_int>0 & Net_ext>0 -> ưu tiên SO; Net_int>0 & Net_ext<0 -> ST; Net_int<0 & Net_ext>0 -> WO; cả hai <0 -> WT. Gần 0 -> làm cân bằng 2-3 chiến lược.
      example:
        inputs:
          S: 4.1
          W: 3.3
          O: 4.3
          T: 3.6
        steps:
        - Net_int = 4.1 - 3.3 = 0.8
        - Net_ext = 4.3 - 3.6 = 0.7
        - Cả hai dương -> ưu tiên chiến lược SO (tấn công)
        result: (0.8, 0.7) -> SO
  - id: "m02-formulas-3"
    title: "Công thức: m02_vrio_classify — Phân loại kết quả VRIO"
    tags: ["công", "thức", "m02_vrio_classify", "phân", "loại", "kết", "quả", "vrio"]
    text: |-
      id: m02_vrio_classify
      name_vi: Phân loại kết quả VRIO
      name_en: VRIO classification
      expression_latex: result = f(V,R,I,O)\ \text{(kiểm tra tuần tự, dừng ở tiêu chí đầu tiên không đạt)}
      expression_python: ('disadvantage' if not V else 'parity' if not R else 'temporary' if not I else 'unused' if not O else 'sustained')
      excel: =IF(NOT(V),"disadvantage",IF(NOT(R),"parity",IF(NOT(I),"temporary",IF(NOT(O),"unused","sustained"))))
      variables:
      - symbol: V
        meaning: Có giá trị (True/False)
        unit: boolean
      - symbol: R
        meaning: Hiếm (True/False)
        unit: boolean
      - symbol: I
        meaning: Khó bắt chước (True/False)
        unit: boolean
      - symbol: O
        meaning: Doanh nghiệp được tổ chức để khai thác (True/False)
        unit: boolean
      when_to_use: Khi phân loại từng nguồn lực/năng lực đã liệt kê (mỗi nguồn lực một dòng).
      why_it_works: 'Bốn câu hỏi xếp thành thang cumulative: không có giá trị thì chẳng cần xét tiếp (bất lợi); có giá trị nhưng ai cũng có thì chỉ ngang bằng; hiếm nhưng copy được thì lợi thế chỉ tạm thời; hiếm + khó copy nhưng không có hệ thống khai thác thì lãng phí tiềm năng; đủ bốn mới bền vững. Tính tuần tự là lý do ''các ô sau chữ không đạt đều là dấu gạch''.'
      assumptions:
      - Đánh giá V,R,I,O so với đối thủ cụ thể trong cùng thị trường, không phải so với 'trung bình chung'
      - Chỉ xét một nguồn lực mỗi lần
      pitfalls:
      - Đánh giá R,I khi chưa liệt kê đối thủ so sánh -> chủ quan
      - Gộp nhiều nguồn lực vào một dòng (ví dụ 'đội ngũ' nói chung)
      - Quên rằng V thay đổi theo thời gian/công nghệ (Kodak)
      interpretation: disadvantage = sửa hoặc loại bỏ; parity = duy trì tối thiểu cần thiết, không coi là điểm mạnh; temporary = khai thác nhanh trong cửa sổ cơ hội và đầu tư để thành I; unused = tổ chức lại để khai thác (cơ hội lớn nhất, đầu tư rẻ nhất); sustained = bảo vệ và đầu tư tiếp.
      example:
        inputs:
          V: true
          R: true
          I: true
          O: false
        steps:
        - V đạt, R đạt, I đạt
        - O không đạt -> 'unused'
        result: unused (lợi thế chưa khai thác)
  - id: "m02-formulas-4"
    title: "Công thức: m02_value_chain_margin — Biên lợi nhuận chuỗi giá trị"
    tags: ["công", "thức", "m02_value_chain_margin", "biên", "lợi", "nhuận", "chuỗi", "giá", "trị"]
    text: |-
      id: m02_value_chain_margin
      name_vi: Biên lợi nhuận chuỗi giá trị
      name_en: Value Chain margin
      expression_latex: Margin = V_{customer} - \sum_{a} C_a,\quad Margin\% = Margin / V_{customer}
      expression_python: price - sum(costs.values())
      excel: =Price-SUM(cost_range)
      variables:
      - symbol: price
        meaning: Giá/giá trị khách hàng sẵn sàng trả cho một đơn vị (hoặc 100 làm chuẩn)
        unit: VND hoặc chỉ số 100
      - symbol: costs
        meaning: Chi phí của từng hoạt động chính + hỗ trợ cho cùng đơn vị đó
        unit: VND hoặc chỉ số
      when_to_use: Khi dựng bảng chi phí theo hoạt động để thấy lợi nhuận bị 'ăn' ở khâu nào.
      why_it_works: Porter (1985) đặt lợi nhuận là chênh lệch giữa giá trị khách nhận và chi phí tạo ra giá trị. Tách chi phí theo hoạt động (thay vì theo khoản mục kế toán) cho thấy khâu nào tạo giá trị, khâu nào chỉ tốn tiền.
      assumptions:
      - Phân bổ được chi phí chung (overhead) hợp lý cho từng hoạt động
      - Giá trị khách hàng xấp xỉ giá bán thực tế/giá khách chịu trả
      pitfalls:
      - Phân bổ chi phí chung tùy tiện làm sai kết luận
      - Bỏ sót hoạt động hỗ trợ (HR, công nghệ, hạ tầng)
      - Dùng giá bán thay cho giá trị khách cảm nhận trong khi khách sẵn sàng trả cao hơn (thặng dư chưa khai thác)
      interpretation: Margin dương mới tạo lợi nhuận; so margin% với đối thủ/benchmark ngành; xem khâu nào chiếm tỷ trọng chi phí cao hơn tỷ trọng giá trị (xem m02_value_cost_ratio).
      example:
        inputs:
          price: 100
          costs:
            inbound: 12
            operations: 28
            outbound: 8
            marketing_sales: 22
            service: 6
            support: 12
        steps:
        - Tổng chi phí = 12+28+8+22+6+12 = 88
        - Margin = 100 - 88 = 12
        - Margin% = 12%
        result: Margin = 12 (12%)
  - id: "m02-formulas-5"
    title: "Công thức: m02_value_cost_ratio — Tỷ số giá trị/chi phí của hoạt động"
    tags: ["công", "thức", "m02_value_cost_ratio", "tỷ", "số", "giá", "trị", "chi", "phí", "của", "hoạt", "động"]
    text: |-
      id: m02_value_cost_ratio
      name_vi: Tỷ số giá trị/chi phí của hoạt động
      name_en: Activity value-to-cost ratio
      expression_latex: R_a = \frac{V_a / \sum V}{C_a / \sum C}
      expression_python: (value_a / sum(values.values())) / (cost_a / sum(costs.values()))
      excel: =(Va/SUM(V))/(Ca/SUM(C))
      variables:
      - symbol: value_a
        meaning: Điểm/tỷ trọng giá trị khách hàng gán cho hoạt động a (khảo sát khách, tổng 100)
        unit: điểm
      - symbol: cost_a
        meaning: Chi phí hoạt động a
        unit: VND hoặc chỉ số
      - symbol: values
        meaning: Dict giá trị của mọi hoạt động
        unit: điểm
      - symbol: costs
        meaning: Dict chi phí của mọi hoạt động
        unit: VND hoặc chỉ số
      when_to_use: 'Khi muốn ưu tiên cắt giảm/đầu tư: hoạt động nào khách coi trọng nhưng ta chi ít (R lớn) hoặc chi nhiều mà khách không quan tâm (R nhỏ).'
      why_it_works: 'Công cụ thực dụng (không phải công thức của Porter): so sánh ''khách coi trọng bao nhiêu'' với ''ta tiêu bao nhiêu'' của từng khâu. Đây là cách định lượng bước 2 của quy trình (''hoạt động nào khách sẵn sàng trả tiền?''), khắc phục nhược điểm ''khó đo giá trị''.'
      assumptions:
      - Điểm giá trị lấy từ khảo sát khách (tối thiểu 20-30 khách) hoặc phỏng vấn nhân viên tiếp xúc khách
      - Hoạt động độc lập tương đối
      pitfalls:
      - Điểm giá trị lấy từ ý kiến chủ quán thay vì khách
      - Cắt khâu R nhỏ nhưng nó là điều kiện cần (hygiene factor)
      - Bỏ qua liên kết giữa các hoạt động
      interpretation: R<0.8 = tiêu nhiều hơn mức khách coi trọng -> ứng viên cắt/tối ưu/thuê ngoài; R trong 0.8-1.2 = cân bằng; R>1.2 = khách coi trọng hơn ta đầu tư -> ứng viên tăng đầu tư, tiềm năng khác biệt (ngưỡng là quy tắc kinh nghiệm).
      example:
        inputs:
          values:
            inbound: 8
            operations: 30
            outbound: 7
            marketing_sales: 15
            service: 25
            support: 15
          costs:
            inbound: 12
            operations: 28
            outbound: 8
            marketing_sales: 22
            service: 6
            support: 12
          activity: service
        steps:
        - Tổng V = 100; tổng C = 88
        - Tỷ trọng giá trị của Service = 25/100 = 0.25
        - Tỷ trọng chi phí của Service = 6/88 = 0.0682
        - R = 0.25/0.0682 = 3.67
        result: R(service) = 3.67 -> đầu tư thêm vào dịch vụ
  - id: "m02-formulas-6"
    title: "Công thức: m02_tows_priority — Điểm ưu tiên chiến lược TOWS"
    tags: ["công", "thức", "m02_tows_priority", "điểm", "ưu", "tiên", "chiến", "lược", "tows"]
    text: |-
      id: m02_tows_priority
      name_vi: Điểm ưu tiên chiến lược TOWS
      name_en: TOWS action priority score
      expression_latex: P = Impact \times Feasibility
      expression_python: impact * feasibility
      excel: =Impact*Feasibility
      variables:
      - symbol: impact
        meaning: Tác động kỳ vọng lên kết quả kinh doanh (1-5)
        unit: điểm
      - symbol: feasibility
        meaning: Khả thi với nguồn lực/thời gian hiện có (1-5)
        unit: điểm
      when_to_use: 'Bước 5 quy trình SWOT: chọn 2-3 chiến lược khả thi nhất từ danh sách SO/ST/WO/WT.'
      why_it_works: TOWS dễ tạo ra rất nhiều ý tưởng; nhân tác động với khả thi (như ma trận ưu tiên Impact-Effort) loại ý tưởng hay nhưng không làm nổi, tránh dàn trải. Heuristic của quản trị, không phải công thức học thuật.
      assumptions:
      - Hai điểm đánh giá độc lập, cùng thang 1-5
      pitfalls:
      - Dồn chiến lược vào một quadrant
      - Chọn >3 chiến lược dẫn tới không làm được gì
      interpretation: P tối đa 25; chọn top 2-3, thường P >= 12; cần chủ sở hữu và hạn chót cho mỗi chiến lược.
      example:
        inputs:
          impact: 5
          feasibility: 4
        steps:
        - P = 5*4 = 20
        result: P = 20 (ưu tiên cao)
  - id: "m02-frameworks-1"
    title: "Frameworks: m02_swot — Phân tích SWOT"
    tags: ["frameworks", "m02_swot", "phân", "tích", "swot"]
    text: |-
      id: m02_swot
      name_vi: Phân tích SWOT
      name_en: SWOT Analysis
      origin: |
        Thường gắn với Albert Humphrey (Stanford Research Institute, thập niên 1960; nguồn gốc chính xác còn tranh cãi). Ra đời để đánh giá tại sao các kế hoạch công ty lớn thất bại: người ta thiếu một cách nhìn chung nhưng cấu trúc, đặt nội lực và môi trường lên cùng bàn. Trở thành công cụ chiến lược phổ biến nhất vì đơn giản, ai cũng làm được.
      components:
      - 'Strengths (Điểm mạnh): nội bộ, tích cực - làm gì tốt hơn đối thủ? (thương hiệu, tài chính, công nghệ, nhân sự, phân phối, chi phí thấp, văn hóa, quan hệ khách hàng)'
      - 'Weaknesses (Điểm yếu): nội bộ, tiêu cực - yếu ở đâu? (thương hiệu yếu, thiếu vốn/dòng tiền, công nghệ lạc hậu, thiếu nhân sự, sản phẩm thiếu khác biệt, phụ thuộc ít khách hàng, quy trình thiếu số hóa)'
      - 'Opportunities (Cơ hội): bên ngoài, tích cực - thị trường mới, công nghệ có lợi, quy định thuận lợi, xu hướng xã hội, đối thủ suy yếu, nhu cầu mới'
      - 'Threats (Đe dọa): bên ngoài, tiêu cực - đối thủ mới, sản phẩm thay thế, quy định bất lợi, suy thoái, thị hiếu đổi, tỷ giá/lạm phát, thiên tai/dịch bệnh'
      when_to_use: Khởi đầu phân tích chiến lược, mọi quy mô (doanh nghiệp, dự án, sản phẩm, cá nhân); workshop 1-2 giờ; bước tổng hợp sau PESTEL/5 Forces.
      how_to_apply:
      - 'Bước 1 Brainstorm: workshop nhóm liên chức năng; liệt kê tất cả S, W, O, T. Nguồn S/W: dữ liệu nội bộ, so với đối thủ. Nguồn O/T: kết quả PESTEL/5 Forces (m01).'
      - 'Bước 2 Sàng lọc: giữ 5-7 yếu tố quan trọng nhất mỗi mục; mỗi yếu tố viết cụ thể, kèm số liệu/chứng cứ.'
      - 'Bước 3 Đánh giá: gán trọng số và điểm tác động 1-5 (m02_swot_weighted_score).'
      - 'Bước 4 TOWS: ghép cặp để tạo chiến lược SO, ST, WO, WT (framework m02_tows).'
      - 'Bước 5 Ưu tiên: chọn 2-3 chiến lược khả thi nhất (m02_tows_priority), gán chủ sở hữu, hạn chót, KPI.'
      how_to_read_results: Không dừng ở danh sách. Bức tranh mạnh+cơ hội nhiều -> tăng trưởng; mạnh+đe dọa -> bảo vệ vị thế; yếu+cơ hội -> sửa nội lực để chớp cơ hội; yếu+đe dọa -> thu gọn/tìm ngách.
      pitfalls:
      - 'Hời hợt: dừng ở liệt kê, mọi dòng ngang nhau, không định lượng.'
      - Chủ quan, thiếu điểm mù khi chỉ phân tích từ góc nhìn nội bộ.
      - Lẫn nội bộ với bên ngoài; viết chung chung ('thương hiệu tốt') không so với đối thủ.
      - Không dùng TOWS nên không ra hành động.
      - Quá nhiều yếu tố (>7 mỗi mục) làm loãng ưu tiên.
      example: |
        Quán cà phê rang xay 2 chi nhánh ở Đà Nẵng: S = hạt rang riêng, khách quen cao; W = phụ thuộc 1 người rang; O = du lịch tăng; T = chuỗi lớn mở gần. Sau chấm điểm xem worked example m02_we1.
  - id: "m02-frameworks-2"
    title: "Frameworks: m02_tows — Ma trận TOWS"
    tags: ["frameworks", "m02_tows", "ma", "trận", "tows"]
    text: |-
      id: m02_tows
      name_vi: Ma trận TOWS
      name_en: TOWS Matrix
      origin: |
        Heinz Weihrich (1982, bài "The TOWS Matrix - A Tool for Situational Analysis"). Ra đời vì SWOT chỉ liệt kê chứ không cho ra chiến lược; Weihrich đảo thành TOWS (Threats/Opportunities đứng trước) để nhấn mạnh phân tích môi trường rồi ghép với nội lực thành hành động.
      components:
      - 'SO - Maxi-Maxi (tấn công): dùng điểm mạnh để tận dụng cơ hội'
      - 'ST - Maxi-Mini (phòng thủ): dùng điểm mạnh để giảm thiểu đe dọa'
      - 'WO - Mini-Maxi (cải thiện): khắc phục điểm yếu để tận dụng cơ hội'
      - 'WT - Mini-Mini (sinh tồn): giảm điểm yếu để né đe dọa (thu hẹp, tập trung ngách, cắt giảm)'
      when_to_use: Ngay sau SWOT đã chấm điểm; cần chuyển phân tích thành kế hoạch hành động.
      how_to_apply:
      - 'Vẽ ma trận 2x2: hàng S/W, cột O/T; điền các yếu tố chính đã sàng lọc.'
      - 'Với mỗi ô giao nhau, hỏi: ''Dùng yếu tố S_i để làm gì với O_j?'' (SO) / ''Làm sao S_i chặn T_j?'' (ST) / ''Sửa W_i thế nào để chớp O_j?'' (WO) / ''Giảm W_i thế nào để né T_j?'' (WT).'
      - Viết mỗi chiến lược thành hành động cụ thể (ai, làm gì, khi nào, kết quả đo được) - không dừng ở 'có điểm mạnh này và cơ hội này'.
      - Chấm Impact và Feasibility (m02_tows_priority), chọn 2-3 hành động; cân đối giữa các quadrant theo m02_swot_net_position.
      how_to_read_results: Quadrant có nhiều chiến lược điểm cao cho biết trạng thái chiến lược của doanh nghiệp (tấn công/phòng thủ/cải thiện/sinh tồn).
      pitfalls:
      - Chiến lược mơ hồ ('tăng marketing'); không có chủ sở hữu hay KPI.
      - Nhồi 15-20 chiến lược; không ưu tiên.
      - Chỉ làm SO (dễ chịu), né WT (khó chịu nhưng đôi khi sống còn).
      example: 'Grab: SO = dùng dữ liệu+mạng lưới merchant cho fintech; WO = bù lỗ bằng quảng cáo (GrabAds); WT = cắt giảm chi phí/nhân sự khi lãi suất tăng. Đảnh Năm (Đà Nẵng): SO = giá rẻ + mặt bằng sở hữu để hút khách du lịch tiết kiệm qua review thật.'
  - id: "m02-frameworks-3"
    title: "Frameworks: m02_vrio — Phân tích VRIO"
    tags: ["frameworks", "m02_vrio", "phân", "tích", "vrio"]
    text: |-
      id: m02_vrio
      name_vi: Phân tích VRIO
      name_en: VRIO Framework
      origin: |
        Jay Barney. Bản gốc VRIN (Valuable, Rare, Inimitable, Non-substitutable) trong bài "Firm Resources and Sustained Competitive Advantage" (1991); VRIO (Value, Rarity, Imitability, Organization) hoàn thiện trong sách "Gaining and Sustaining Competitive Advantage" (1997). Dựa trên RBV (Wernerfelt 1984). Ra đời vì mô hình ngành của Porter không giải thích được vì sao các công ty cùng ngành lãi khác nhau; Barney quay vào nguồn lực nội bộ. Chữ O thêm vào vì có nguồn lực tốt mà tổ chức kém vẫn lãng phí.
      components:
      - 'V - Valuable: nguồn lực có giúp tận dụng cơ hội hoặc giảm đe dọa (tạo giá trị cho khách/giảm chi phí)?'
      - 'R - Rare: ít đối thủ hiện tại và tiềm năng sở hữu?'
      - 'I - Inimitable: đối thủ sao chép/thay thế có khó hoặc đắt không? Bốn lý do (CHIP): Causal ambiguity (mơ hồ nhân quả, vd văn hóa Southwest Airlines), Historical conditions (hoàn cảnh lịch sử, vd vị trí đất vàng), Imperfect imitability/social complexity (tích lũy lâu dài, vd Coca-Cola 130+ năm), Patents/Legal (bằng sáng chế, bản quyền).'
      - 'O - Organized: cơ cấu, quy trình, hệ thống thưởng, văn hóa có sẵn để khai thác hết nguồn lực?'
      - 'Kết quả: Bất lợi (không V) -> Ngang bằng (V không R) -> Tạm thời (V,R không I) -> Chưa khai thác (V,R,I không O) -> Bền vững (đủ 4).'
      when_to_use: Sau khi SWOT liệt kê điểm mạnh, để biết cái nào là lợi thế thật; khi quyết định đầu tư bảo vệ nguồn lực nào, loại bỏ nguồn lực nào.
      how_to_apply:
      - 'Bước 1 Liệt kê nguồn lực: hữu hình (vốn, thiết bị, mặt bằng, công nghệ), vô hình (thương hiệu, văn hóa, bản quyền, dữ liệu), năng lực (quy trình, kỹ năng, đổi mới). Lấy điểm mạnh từ SWOT làm danh sách khởi đầu. Một dòng = một nguồn lực.'
      - Bước 2 Chọn đối thủ so sánh (2-3 đối thủ chính) và hỏi lần lượt V-R-I-O kèm chứng cứ (Yes/No và vì sao).
      - Bước 3 Dùng m02_vrio_classify để gán kết quả cho từng nguồn lực.
      - 'Bước 4 Chiến lược: bảo vệ và phát triển nguồn lực bền vững; khai thác nhanh nguồn lực tạm thời và đầu tư để tăng khó bắt chước; tổ chức lại để mở khóa nguồn lực ''chưa khai thác''; cải thiện hoặc loại bỏ nguồn lực không có giá trị; không coi ''ngang bằng'' là điểm mạnh.'
      - Bước 5 Đặt lịch rà soát lại (6-12 tháng) vì giá trị nguồn lực thay đổi.
      how_to_read_results: Chỉ nguồn lực đạt cả 4 (V,R,I,O) mới là lợi thế bền vững. Nhiều 'điểm mạnh' trong SWOT thực chất chỉ ngang bằng hoặc tạm thời.
      pitfalls:
      - Chủ quan khi đánh giá hiếm/khó bắt chước, thiếu tiêu chuẩn.
      - 'Tĩnh: nguồn lực mất giá trị theo thời gian (Kodak và bằng sáng chế phim).'
      - Gộp nguồn lực, khó tách vì chúng liên kết.
      - Chỉ nhìn nội bộ; phải ghép với PESTEL/5 Forces.
      - 'Startup chưa có nhiều nguồn lực để phân tích: nên đánh giá năng lực sáng lập và tài sản vô hình tiềm năng.'
      example: 'Xưởng may (m02_we2): hệ thống quản lý chất lượng riêng đạt V,R,I nhưng chưa O -> ''unused''; máy may thông dụng chỉ ''parity''.'
  - id: "m02-frameworks-4"
    title: "Frameworks: m02_value_chain — Chuỗi giá trị của Porter"
    tags: ["frameworks", "m02_value_chain", "chuỗi", "giá", "trị", "của", "porter"]
    text: |-
      id: m02_value_chain
      name_vi: Chuỗi giá trị của Porter
      name_en: Value Chain (Porter)
      origin: |
        Michael Porter, sách "Competitive Advantage" (1985). Ra đời vì kế toán chi phí truyền thống tính theo khoản mục (lương, nguyên liệu) không cho biết HOẠT ĐỘNG nào tạo giá trị hay tốn chi phí; Porter tách doanh nghiệp thành các hoạt động chiến lược để tìm nguồn chi phí thấp hoặc khác biệt.
      components:
      - 'Hoạt động chính (5): Inbound Logistics (nhận, lưu trữ, kiểm tra đầu vào); Operations (chế biến, sản xuất, kiểm soát chất lượng); Outbound Logistics (lưu kho, phân phối, giao hàng); Marketing & Sales (quảng cáo, định giá, kênh bán); Service (bảo hành, hỗ trợ, hậu mãi).'
      - 'Hoạt động hỗ trợ (4): Firm Infrastructure (tài chính, kế toán, pháp lý, quản trị); Human Resource Management (tuyển dụng, đào tạo, lương thưởng, văn hóa); Technology Development (R&D, IT, tự động hóa); Procurement (đàm phán, mua nguyên liệu).'
      - Margin = giá trị khách hàng - chi phí thực hiện hoạt động (m02_value_chain_margin).
      when_to_use: Khi cần tìm nguồn chi phí/giá trị chi tiết; so sánh từng khâu với đối thủ; quyết định tối ưu, đầu tư khác biệt hay thuê ngoài; truy lợi thế VRIO về hoạt động cụ thể.
      how_to_apply:
      - 'Bước 1 Vẽ chuỗi giá trị của doanh nghiệp: liệt kê 5 hoạt động chính và 4 hỗ trợ, với SME dịch vụ đổi tên cho phù hợp (vd Inbound = mua nguyên liệu/nhập hàng; Operations = pha chế/chế biến/phục vụ).'
      - Bước 2 Gán chi phí cho từng hoạt động (tỷ lệ % trên giá bán hoặc VND/đơn vị). Phân bổ chi phí chung theo tiêu chí hợp lý (m02_value_chain_margin).
      - 'Bước 3 Xác định hoạt động tạo giá trị: khách chịu trả tiền cho khâu nào? Khâu nào tạo khác biệt? Tính m02_value_cost_ratio nếu có dữ liệu khảo sát khách.'
      - 'Bước 4 So sánh với đối thủ (benchmarking): họ mạnh/yếu ở khâu nào, ta có lợi thế chi phí ở đâu. Điền cột ''Lợi thế vs đối thủ''.'
      - 'Bước 5 Tối ưu: Cost Leadership (giảm chi phí khâu giá trị thấp), Differentiation (đầu tư thêm khâu khách coi trọng), Outsource (thuê ngoài khâu không phải lõi và không tạo khác biệt).'
      - Bước 6 Kiểm tra liên kết giữa các hoạt động (vd mua theo lô nhỏ + sản xuất linh hoạt như Zara) trước khi cắt/đầu tư từng khâu riêng lẻ.
      how_to_read_results: Khâu có tỷ trọng chi phí cao nhưng giá trị thấp = ứng viên tối ưu/thuê ngoài; khâu giá trị cao + lợi thế vs đối thủ = bảo vệ và mở rộng; khâu giá trị cao + yếu hơn đối thủ = ưu tiên đầu tư.
      pitfalls:
      - Cần dữ liệu chi phí chi tiết, tốn thời gian; chi phí chung phân bổ tùy tiện.
      - Thiên về sản xuất, khó áp dụng nguyên bản cho dịch vụ/nền tảng số (cần chỉnh tên hoạt động).
      - Giả định tuyến tính; thực tế hoạt động chồng chéo.
      - Bỏ qua hệ sinh thái đối tác; mô hình 1985 chưa phản ánh đầy đủ digital value chain.
      - Chi phí dễ đo nhưng giá trị khách hàng khó đo.
      - Tối ưu từng khâu mà phá liên kết cả chuỗi.
      example: 'Tiệm bánh (m02_we3): Service chiếm 25% giá trị khách nhưng chỉ 6/88 chi phí -> R=3.67, tăng đầu tư chăm sóc; Marketing & Sales tốn 22 nhưng khách chỉ đánh giá 15 -> R=0.68, tối ưu kênh.'
  - id: "m02-frameworks-5"
    title: "Frameworks: m02_combined_process — Quy trình kết hợp SWOT - VRIO - Value Chain - Chiến lược"
    tags: ["frameworks", "m02_combined_process", "quy", "trình", "kết", "hợp", "swot", "vrio", "value", "chain", "chiến", "lược"]
    text: |-
      id: m02_combined_process
      name_vi: Quy trình kết hợp SWOT - VRIO - Value Chain - Chiến lược
      name_en: Integrated internal analysis flow
      origin: 'Cách ghép của tài liệu nguồn: mỗi công cụ bù đắp hạn chế của công cụ trước (SWOT hời hợt -> VRIO sâu -> Value Chain chi tiết).'
      components:
      - '1. SWOT: nhận diện điểm mạnh/yếu nổi bật (rộng).'
      - '2. VRIO: kiểm tra điểm mạnh nào là lợi thế BỀN VỮNG (sâu).'
      - '3. Value Chain: lợi thế đó nằm ở hoạt động NÀO, chi phí/giá trị ra sao (chi tiết).'
      - '4. Chiến lược: đầu tư/bảo vệ hoạt động tạo lợi thế bền vững; cải thiện hoạt động còn yếu; cắt/thuê ngoài hoạt động không giá trị.'
      - 'So sánh: SWOT = tổng quan nội+ngoại, hạn chế hời hợt; VRIO = chiều sâu lợi thế, hạn chế chỉ nội bộ; Value Chain = chi phí/giá trị từng hoạt động, hạn chế phức tạp cần nhiều dữ liệu.'
      when_to_use: Khi cần một bản phân tích nội bộ hoàn chỉnh dẫn tới quyết định chiến lược (vd chọn chiến lược cạnh tranh ở m03).
      how_to_apply:
      - Chạy theo thứ tự 1-4; chuyển điểm mạnh từ SWOT sang danh sách nguồn lực của VRIO; chuyển nguồn lực 'bền vững/chưa khai thác' sang Value Chain để định vị hoạt động.
      - Đối chiếu kết luận cuối với bên ngoài (m01) để tránh chỉ nhìn nội bộ.
      how_to_read_results: 'Đầu ra: danh sách <=3 lợi thế bền vững + hoạt động chứa chúng + 2-3 hành động ưu tiên.'
      pitfalls:
      - Chạy riêng lẻ ba công cụ, không nối kết quả
      - Bỏ qua bước đối chiếu với môi trường bên ngoài
      example: 'Đảnh Năm: mặt bằng sở hữu (V,R,I đạt; O chưa trọn) -> Marketing & Sales là khâu yếu cần đầu tư; xem case_lessons.'
  - id: "m02-frameworks-6"
    title: "Frameworks: m02_bcg_pointer — Ma trận BCG (tham chiếu bổ sung cho SWOT)"
    tags: ["frameworks", "m02_bcg_pointer", "ma", "trận", "bcg", "tham", "chiếu", "bổ", "sung", "cho", "swot"]
    text: |-
      id: m02_bcg_pointer
      name_vi: Ma trận BCG (tham chiếu bổ sung cho SWOT)
      name_en: BCG Matrix (pointer)
      origin: Bruce Henderson, Boston Consulting Group, đầu thập niên 1970, để phân bổ vốn giữa các mảng kinh doanh. Tài liệu nguồn chỉ nhắc tới như công cụ bổ sung khi SWOT không cho biết nên ưu tiên mảng nào.
      components:
      - 'Trục: thị phần tương đối và tốc độ tăng trưởng thị trường'
      - 'Bốn nhóm: Stars, Question Marks, Cash Cows, Dogs'
      when_to_use: 'Doanh nghiệp đa mảng (vd Grab: gọi xe, đồ ăn, fintech) cần quyết định đầu tư/duy trì/loại bỏ.'
      how_to_apply:
      - Xác định thị phần tương đối và tăng trưởng từng mảng
      - Xếp vào 4 nhóm; Stars và Question Marks có triển vọng -> đầu tư, Cash Cows -> vắt dòng tiền, Dogs -> cân nhắc rút
      how_to_read_results: Chỉ định hướng phân bổ vốn; không thay SWOT/VRIO.
      pitfalls:
      - Chi tiết xem tài liệu BCG/portfolio ngoài module này (nguồn chỉ giới thiệu)
      example: Grab dùng BCG để quyết định ưu tiên giữa ride-hailing, food, fintech.
  - id: "m02-procedures-1"
    title: "Quy trình: m02_proc_full_internal_analysis — Làm phân tích nội bộ đầy đủ cho một doanh nghiệp (SWOT -> VRIO -> Value Chain -> TOWS)"
    tags: ["quy", "trình", "m02_proc_full_internal_analysis", "làm", "phân", "tích", "nội", "bộ", "đầy", "đủ", "cho", "một"]
    text: |-
      id: m02_proc_full_internal_analysis
      name: Làm phân tích nội bộ đầy đủ cho một doanh nghiệp (SWOT -> VRIO -> Value Chain -> TOWS)
      steps:
      - '0. Intake - hỏi chủ doanh nghiệp: ngành/mô hình, doanh thu, biên lợi nhuận, số nhân sự, 2-3 đối thủ chính, khách hàng mục tiêu, vấn đề cần giải (tăng trưởng? lỗ? định giá? mở rộng?). Nếu thiếu dữ liệu, nêu giả định rõ ràng và ghi ''illustrative''.'
      - '1. Thu thập bên ngoài: chạy hoặc lấy kết quả PESTEL/5 Forces (m01) làm đầu vào O và T.'
      - '2. SWOT: brainstorm, sàng 5-7 mục/nhóm, viết cụ thể có số liệu, chấm trọng số + điểm 1-5 (m02_swot_weighted_score), tính m02_swot_net_position.'
      - '3. VRIO: lấy điểm mạnh làm danh sách nguồn lực, thêm nguồn lực/năng lực bỏ sót (3 loại); với mỗi nguồn lực so với 2-3 đối thủ, trả lời V,R,I,O kèm chứng cứ, phân loại (m02_vrio_classify).'
      - '4. Value Chain: dựng bảng 9 hoạt động; gán chi phí %; gán giá trị theo khách; tính margin và m02_value_cost_ratio; so sánh đối thủ; đặt các nguồn lực VRIO ''bền vững/chưa khai thác/tạm thời'' vào hoạt động tương ứng.'
      - '5. TOWS: ghép SO/ST/WO/WT; mỗi chiến lược cụ thể (ai, làm gì, khi nào, KPI); chấm m02_tows_priority; chọn 2-3.'
      - '6. Rà soát chéo: lợi thế bền vững tìm được có khớp với khâu giá trị cao trong Value Chain? Có mâu thuẫn với T/O bên ngoài không? Nếu có, quay lại bước tương ứng.'
      - '7. Báo cáo: tóm tắt 1 trang + bảng chi tiết + kế hoạch 90 ngày; nêu giới hạn (chủ quan, số liệu giả định) và bước kiểm chứng tiếp theo.'
      outputs: 'Báo cáo gồm: bảng SWOT có điểm; bảng VRIO có kết quả từng nguồn lực; bảng Value Chain (chi phí, giá trị, tỷ số, lợi thế vs đối thủ, hành động); ma trận TOWS với 2-3 chiến lược ưu tiên; kế hoạch hành động.'
  - id: "m02-procedures-2"
    title: "Quy trình: m02_proc_swot_tows_workshop — Chạy workshop SWOT + TOWS 1-2 giờ"
    tags: ["quy", "trình", "m02_proc_swot_tows_workshop", "chạy", "workshop", "swot", "tows", "giờ"]
    text: |-
      id: m02_proc_swot_tows_workshop
      name: Chạy workshop SWOT + TOWS 1-2 giờ
      steps:
      - 'Chuẩn bị: mời 5-8 người từ các chức năng (bán hàng, vận hành, tài chính, nhân sự); gửi trước kết quả PESTEL/5 Forces và số liệu thật.'
      - '20 phút: viết ý tưởng độc lập trên giấy note (tránh bị ảnh hưởng bởi người nói trước), mỗi người 3-5 mục cho mỗi nhóm.'
      - '20 phút: gom nhóm, gộp trùng, kiểm tra lẫn nội bộ/bên ngoài, giữ 5-7 mục/nhóm.'
      - '15 phút: bỏ phiếu trọng số, chấm 1-5, tính điểm.'
      - '30 phút: ghép TOWS, mỗi cặp ghi một hành động; chấm Impact x Feasibility.'
      - '15 phút: chốt top 2-3, giao chủ sở hữu và deadline.'
      outputs: Một trang SWOT có điểm + 2-3 hành động có chủ sở hữu và hạn chót.
  - id: "m02-procedures-3"
    title: "Quy trình: m02_proc_vrio_assessment — Đánh giá VRIO cho từng nguồn lực"
    tags: ["quy", "trình", "m02_proc_vrio_assessment", "đánh", "giá", "vrio", "cho", "từng", "nguồn", "lực"]
    text: |-
      id: m02_proc_vrio_assessment
      name: Đánh giá VRIO cho từng nguồn lực
      steps:
      - Liệt kê 8-15 nguồn lực/năng lực (hữu hình, vô hình, năng lực); tách riêng từng cái.
      - Chọn đối thủ so sánh.
      - 'V: nguồn lực có tăng doanh thu/giảm chi phí hoặc giúp chớp O/giảm T không? Dẫn chứng bằng số.'
      - 'R: nếu >=3 đối thủ có thì không hiếm.'
      - 'I: kiểm tra 4 lý do CHIP; nếu đối thủ copy được trong <12 tháng với chi phí hợp lý thì không khó bắt chước.'
      - 'O: kiểm tra có người chịu trách nhiệm, quy trình, chỉ số, thưởng, văn hóa để khai thác; nếu không -> chưa khai thác.'
      - Phân loại bằng m02_vrio_classify, ghi hành động cho từng loại.
      outputs: Bảng VRIO (nguồn lực, V, R, I, O, kết quả, hành động) và danh sách <=3 lợi thế bền vững cần bảo vệ.
  - id: "m02-procedures-4"
    title: "Quy trình: m02_proc_value_chain_analysis — Phân tích chuỗi giá trị và quyết định tối ưu/outsource"
    tags: ["quy", "trình", "m02_proc_value_chain_analysis", "phân", "tích", "chuỗi", "giá", "trị", "và", "quyết", "định", "tối"]
    text: |-
      id: m02_proc_value_chain_analysis
      name: Phân tích chuỗi giá trị và quyết định tối ưu/outsource
      steps:
      - 'Đặt đơn vị phân tích: một sản phẩm/dịch vụ/phân khúc (vd 1 ly cà phê, 1 đơn hàng) để chi phí cộng lại bằng giá bán.'
      - Liệt kê 9 hoạt động và đổi tên theo ngành.
      - Gán chi phí trực tiếp; phân bổ chi phí chung theo tiêu chí (doanh thu, giờ công, diện tích).
      - 'Khảo sát 20-30 khách: chia 100 điểm cho các hoạt động theo mức khách coi trọng; hoặc phỏng vấn nhân viên tiếp xúc khách.'
      - Tính margin và m02_value_cost_ratio cho từng khâu.
      - Benchmark 2-3 đối thủ (bảng giá, menu, review, công khai) để điền cột lợi thế/bất lợi.
      - 'Quyết định: R<0.8 và không phải khâu lõi/không tạo khác biệt -> tối ưu hoặc thuê ngoài; R>1.2 và đối thủ yếu -> đầu tư; khâu hygiene giữ mức tối thiểu.'
      - Kiểm tra liên kết giữa các khâu trước khi thực hiện.
      outputs: Bảng Value Chain đầy đủ + 3 hành động tối ưu/đầu tư kèm ước tính tiết kiệm hoặc doanh thu tăng thêm.
  - id: "m02-decision_rules-1"
    title: "Quy tắc quyết định: Nếu một mục SWOT không so sánh được với đối thủ hoặc không có số liệu thì viết lại cụ thể hoặc loại…"
    tags: ["quy", "tắc", "quyết", "định", "nếu", "một", "mục", "swot", "không", "so", "sánh", "được"]
    text: |-
      Nếu một mục SWOT không so sánh được với đối thủ hoặc không có số liệu thì viết lại cụ thể hoặc loại bỏ.
  - id: "m02-decision_rules-2"
    title: "Quy tắc quyết định: Nếu mục nằm dưới 'điểm mạnh' nhưng đối thủ cũng có thì VRIO sẽ cho 'ngang bằng' - đừng đưa nó vào đ…"
    tags: ["quy", "tắc", "quyết", "định", "nếu", "mục", "nằm", "dưới", "điểm", "mạnh", "nhưng", "đối"]
    text: |-
      Nếu mục nằm dưới 'điểm mạnh' nhưng đối thủ cũng có thì VRIO sẽ cho 'ngang bằng' - đừng đưa nó vào định vị chiến lược.
  - id: "m02-decision_rules-3"
    title: "Quy tắc quyết định: Nếu nguồn lực không có giá trị (V=0) thì sửa hoặc loại bỏ; không đầu tư thêm."
    tags: ["quy", "tắc", "quyết", "định", "nếu", "nguồn", "lực", "không", "có", "giá", "trị", "thì"]
    text: |-
      Nếu nguồn lực không có giá trị (V=0) thì sửa hoặc loại bỏ; không đầu tư thêm.
  - id: "m02-decision_rules-4"
    title: "Quy tắc quyết định: Nếu nguồn lực V nhưng không R thì chỉ duy trì mức tối thiểu cần thiết."
    tags: ["quy", "tắc", "quyết", "định", "nếu", "nguồn", "lực", "nhưng", "không", "thì", "chỉ", "duy"]
    text: |-
      Nếu nguồn lực V nhưng không R thì chỉ duy trì mức tối thiểu cần thiết.
  - id: "m02-decision_rules-5"
    title: "Quy tắc quyết định: Nếu V,R nhưng I=0 thì khai thác nhanh trong cửa sổ thời gian và đầu tư để thành khó bắt chước (thươ…"
    tags: ["quy", "tắc", "quyết", "định", "nếu", "nhưng", "thì", "khai", "thác", "nhanh", "trong", "cửa"]
    text: |-
      Nếu V,R nhưng I=0 thì khai thác nhanh trong cửa sổ thời gian và đầu tư để thành khó bắt chước (thương hiệu, dữ liệu, tích lũy tri thức, hợp đồng độc quyền).
  - id: "m02-decision_rules-6"
    title: "Quy tắc quyết định: Nếu V,R,I nhưng O=0 thì ưu tiên số 1: tổ chức lại (người phụ trách, quy trình, KPI, thưởng) vì đầu …"
    tags: ["quy", "tắc", "quyết", "định", "nếu", "nhưng", "thì", "ưu", "tiên", "số", "tổ", "chức"]
    text: |-
      Nếu V,R,I nhưng O=0 thì ưu tiên số 1: tổ chức lại (người phụ trách, quy trình, KPI, thưởng) vì đầu tư thấp mà lợi ích lớn.
  - id: "m02-decision_rules-7"
