  - id: "m02-case_lessons-1"
    title: "Bài học case: Grab tại Đông Nam Á - SWOT/TOWS (2020-2024)"
    tags: ["bài", "học", "case", "grab", "tại", "đông", "nam", "swot", "tows", "2020", "2024"]
    text: |-
      name: Grab tại Đông Nam Á - SWOT/TOWS (2020-2024)
      type: success
      setup: Grab cạnh tranh Gojek/GoTo và đối thủ địa phương (Be, Xanh SM tại VN) trong khi lỗ lớn, phụ thuộc nhà đầu tư và đối mặt lãi suất tăng.
      key_calculations:
      - 'S: thương hiệu #1 ride-hailing ĐNÁ, super app (ride/food/pay/invest), dữ liệu lớn, mạng lưới merchant, niêm yết NASDAQ qua SPAC 2021.'
      - 'W: lỗ nhiều năm, phụ thuộc SoftBank, chất lượng tài xế không đều, biên mỏng, chi phí khuyến mãi.'
      - 'SO: dữ liệu + merchant -> fintech (GrabPay, GrabInvest). ST: brand -> chống đối thủ địa phương (GrabUnlimited, khuyến mãi). WO: bù lỗ bằng quảng cáo (GrabAds). WT: cắt chi phí, giảm khoảng 1,000+ nhân sự năm 2023.'
      lesson: 'SWOT giúp chuyển từ ''tăng trưởng bằng mọi giá'' sang ''tăng trưởng có lãi''; WT đau nhưng cần. Hạn chế: SWOT không xếp hạng mảng nào ưu tiên -> cần BCG; không cho biết nguồn lực nào tạo lợi thế bền vững -> cần VRIO. Lưu ý số liệu: tài liệu nguồn đã sửa ''có lãi Q4/2023'' thành Adjusted EBITDA dương từ Q2/2023; số user 300M+ và thị trường số ĐNÁ $360B (2025) cần kiểm chứng.'
      data_reliability: unverified
  - id: "m02-case_lessons-2"
    title: "Bài học case: Samsung Electronics - VRIO"
    tags: ["bài", "học", "case", "samsung", "electronics", "vrio"]
    text: |-
      name: Samsung Electronics - VRIO
      type: success
      setup: Đánh giá 6 nguồn lực của Samsung bằng VRIO để phân biệt điểm mạnh với lợi thế bền vững.
      key_calculations:
      - 'Thương hiệu, chip bán dẫn (foundry), màn hình AMOLED: V,R,I,O đều đạt -> bền vững.'
      - 'Hệ sinh thái sản phẩm (TV+phone+appliance): V đạt nhưng R không (LG, Xiaomi) -> ngang bằng.'
      - 'OS Tizen: V không đạt -> bất lợi (Samsung chuyển sang Wear OS cho smartwatch).'
      - 'Mạng lưới sản xuất VN: V,R đạt nhưng I không (đối thủ có thể xây tương tự) -> tạm thời.'
      lesson: Không phải mọi điểm mạnh là lợi thế cạnh tranh; chỉ nguồn lực đạt cả 4 tiêu chí mới bền vững. Samsung tập trung bảo vệ 3 nguồn lực bền vững và bỏ nguồn lực bất lợi. Số liệu minh họa của nguồn (vd $230B R&D, 80% thị phần AMOLED) cần kiểm chứng.
      data_reliability: unverified
  - id: "m02-case_lessons-3"
    title: "Bài học case: Zara (Inditex) - Value Chain"
    tags: ["bài", "học", "case", "zara", "inditex", "value", "chain"]
    text: |-
      name: Zara (Inditex) - Value Chain
      type: success
      setup: Zara đưa sản phẩm từ thiết kế đến cửa hàng trong 2-3 tuần (ngành khoảng 6 tháng) bằng cách tối ưu cả chuỗi giá trị.
      key_calculations:
      - 'Inbound: khoảng 60% vải mua gần Tây Ban Nha, lô nhỏ. Operations: khoảng 60% sản xuất in-house, lô nhỏ.'
      - 'Outbound: trung tâm logistics tại Arteixo, giao 2 lần/tuần đến mọi cửa hàng. Marketing: quảng cáo 0.3% doanh thu (so 3-4% của H&M), dùng vị trí cửa hàng.'
      - 'Technology: RFID, dự báo xu hướng, kết nối cửa hàng-HQ; HRM: nhân viên cửa hàng báo cầu khách về HQ.'
      lesson: 'Không dẫn đầu từng khâu riêng lẻ mà tối ưu cả chuỗi -> tốc độ; vertical integration là nguồn lợi thế; mô hình test-and-respond giảm rủi ro tồn kho (tài liệu nguồn nêu 85%, chưa kiểm chứng). Trade-off có chủ đích: chi phí lao động cao hơn đối thủ sản xuất châu Á.'
      data_reliability: unverified
  - id: "m02-case_lessons-4"
    title: "Bài học case: Thế Giới Di Động - Value Chain minh họa 9 hoạt động"
    tags: ["bài", "học", "case", "thế", "giới", "di", "động", "value", "chain", "minh", "họa", "hoạt"]
    text: |-
      name: Thế Giới Di Động - Value Chain minh họa 9 hoạt động
      type: success
      setup: Dùng MWG để minh họa từng hoạt động trong Value Chain (nhập hàng từ hãng, kho trung tâm, hệ thống cửa hàng, trade-in, bảo hành 1 đổi 1, ERP/POS, AI dự báo tồn kho).
      key_calculations:
      - 'Bảng mẫu: Inbound 15%, Operations 25%, Outbound 20%, Marketing & Sales 30%, Service 10% (minh họa kết cấu bảng, không phải số liệu MWG thật).'
      - Số cửa hàng 5,000+, nhân viên 60,000+ trích trong nguồn; cần kiểm chứng.
      lesson: Cho thấy cách điền bảng chi phí/giá trị/lợi thế vs đối thủ/hành động để từ đó chọn hành động (duy trì, mở rộng, tăng digital).
      data_reliability: illustrative
  - id: "m02-case_lessons-5"
    title: "Bài học case: Nhà hàng hải sản Đảnh Năm (Thọ Quang, Đà Nẵng) - SWOT + VRIO + Value Chain"
    tags: ["bài", "học", "case", "nhà", "hàng", "hải", "sản", "đảnh", "năm", "thọ", "quang", "đà"]
    text: |-
      name: Nhà hàng hải sản Đảnh Năm (Thọ Quang, Đà Nẵng) - SWOT + VRIO + Value Chain
      type: sme
      setup: Quán bình dân 400 m2, đất sở hữu, trong hẻm nhỏ ô tô không vào được, chưa có quảng cáo, chủ yếu khách địa phương/truyền miệng; du lịch Đà Nẵng đang tăng; nhiều nhà hàng hải sản mới dọc biển và quán bình dân mặt đường cạnh tranh.
      key_calculations:
      - 'SWOT: S = giá rẻ (vd 90k đĩa nghêu/tôm/điệp, nước đồng giá 16k) + đất sở hữu không tiền thuê; W = 1 mặt bằng, hẻm nhỏ, ít chỗ đỗ xe, không quảng cáo; O = du lịch tăng; T = nguồn cung hải sản bị nhà hàng lớn đẩy giá, review đặt hàng, quán bình dân mọc nhiều.'
      - 'VRIO: giá rẻ = V đạt, mô hình bình dân dễ sao chép (R/I không); mặt bằng sở hữu = V,R,I đạt nhưng O chưa trọn (chưa khai thác khách du lịch) -> chưa khai thác.'
      - 'Value Chain: Marketing & Sales yếu nhất (chưa có chiến lược), Outbound chỉ ăn tại chỗ, Service cơ bản.'
      lesson: 'Lợi thế thật của quán là cấu trúc chi phí cố định thấp từ đất sở hữu; điểm yếu cần xử lý trước là Marketing & Sales và khả năng tiếp cận (hẻm, đỗ xe), không phải mở rộng sản xuất. TOWS đề xuất: dùng chi phí thấp thu hút khách du lịch tiết kiệm bằng review thật, lập kênh quảng cáo tối thiểu, giữ giá niêm yết minh bạch.'
      data_reliability: illustrative
  - id: "m02-worked_examples-1"
    title: "Ví dụ có lời giải: m02_we1 — SWOT có trọng số + TOWS cho quán cà phê rang xay Đà Nẵng (giả định)"
    tags: ["ví", "dụ", "có", "lời", "giải", "m02_we1", "swot", "trọng", "số", "tows", "cho", "quán"]
    text: |-
      id: m02_we1
      name: SWOT có trọng số + TOWS cho quán cà phê rang xay Đà Nẵng (giả định)
      inputs:
        S:
          weights:
          - 0.4
          - 0.35
          - 0.25
          scores:
          - 4
          - 5
          - 3
          items:
          - Hạt rang riêng, chất lượng ổn định
          - Khách quen cao (tỷ lệ quay lại 55%)
          - Giá vốn thấp nhờ nhập trực tiếp từ nông hộ
        W:
          weights:
          - 0.5
          - 0.3
          - 0.2
          scores:
          - 4
          - 3
          - 2
          items:
          - Phụ thuộc 1 người rang
          - Chưa có kênh online
          - Mặt bằng thuê, hợp đồng 2 năm
        O:
          weights:
          - 0.5
          - 0.3
          - 0.2
          scores:
          - 5
          - 4
          - 3
          items:
          - Du lịch tăng
          - Xu hướng specialty
          - Giao hàng app mở rộng
        T:
          weights:
          - 0.6
          - 0.4
          scores:
          - 4
          - 3
          items:
          - Chuỗi lớn mở gần
          - Giá hạt tăng
      steps:
      - S = 0.4*4 + 0.35*5 + 0.25*3 = 1.6+1.75+0.75 = 4.1
      - W = 0.5*4 + 0.3*3 + 0.2*2 = 2.0+0.9+0.4 = 3.3
      - O = 0.5*5 + 0.3*4 + 0.2*3 = 2.5+1.2+0.6 = 4.3
      - T = 0.6*4 + 0.4*3 = 2.4+1.2 = 3.6
      - Net_int = 4.1-3.3 = 0.8; Net_ext = 4.3-3.6 = 0.7 -> cả hai dương -> ưu tiên SO, nhưng W (3.3) cao -> thêm 1 hành động WO.
      - 'TOWS: SO1 ''Gói quà hạt rang + tour tham quan xưởng rang cho khách du lịch'' Impact 5 x Feasibility 4 = 20. SO2 ''Ra thêm 2 dòng specialty'' 4x4 = 16. WO1 ''Đào tạo thêm 1 người rang (giảm phụ thuộc)'' 4x5 = 20. ST1 ''Thẻ thành viên giữ khách quen'' 3x4 = 12.'
      - 'Chọn top 3 (P>=16): SO1, WO1, SO2; ST1 làm sau.'
      result: S=4.1, W=3.3, O=4.3, T=3.6; ưu tiên SO (tấn công) kèm 1 hành động WO; chọn 3 chiến lược P=20,20,16.
      reliability: illustrative
  - id: "m02-worked_examples-2"
    title: "Ví dụ có lời giải: m02_we2 — VRIO cho xưởng may gia công 120 công nhân (giả định)"
    tags: ["ví", "dụ", "có", "lời", "giải", "m02_we2", "vrio", "cho", "xưởng", "may", "gia", "công"]
    text: |-
      id: m02_we2
      name: VRIO cho xưởng may gia công 120 công nhân (giả định)
      inputs:
        resources:
        - name: Máy may thông dụng
          V: true
          R: false
          I: false
          O: true
        - name: Hệ thống kiểm soát chất lượng tự xây dựng (tỷ lệ lỗi 1.2% so với ngành 3%)
          V: true
          R: true
          I: true
          O: false
        - name: Đội thợ lành nghề gắn bó trên 8 năm
          V: true
          R: true
          I: false
          O: true
        - name: Quan hệ đơn hàng dài hạn với 2 nhãn hàng Nhật
          V: true
          R: true
          I: true
          O: true
        - name: Phần mềm quản lý sản xuất lỗi thời
          V: false
          R: false
          I: false
          O: false
      steps:
      - 'Máy may thông dụng: V đạt, R không -> parity (ngang bằng).'
      - 'Hệ thống QC: V,R,I đạt (khó sao chép vì tích lũy 6 năm), nhưng O không (chỉ 1 quản lý hiểu, chưa chuẩn hóa thành quy trình) -> unused.'
      - 'Thợ lành nghề: V,R đạt; I không (thợ có thể bị chào mời chuyển xưởng) -> temporary.'
      - 'Quan hệ nhãn Nhật: đủ 4 -> sustained.'
      - 'Phần mềm lỗi thời: V không -> disadvantage.'
      - 'Hành động: QC -> chuẩn hóa SOP, đào tạo 2 người, KPI chất lượng và thưởng (tổ chức lại để khai thác, dùng làm điểm bán với nhãn mới). Thợ -> hợp đồng giữ chân, chia sẻ lợi nhuận. Nhãn Nhật -> bảo vệ, tránh phụ thuộc hoàn toàn (giữ 60-70% công suất). Phần mềm -> thay hoặc thuê ngoài.'
      result: 1 bền vững (quan hệ nhãn Nhật), 1 chưa khai thác (QC - cơ hội lớn nhất), 1 tạm thời (thợ), 1 ngang bằng (máy), 1 bất lợi (phần mềm).
      reliability: illustrative
  - id: "m02-worked_examples-3"
    title: "Ví dụ có lời giải: m02_we3 — Value Chain cho tiệm bánh 'Bếp Nhà Lan' (giả định, đơn vị = 100 điểm giá bán)"
    tags: ["ví", "dụ", "có", "lời", "giải", "m02_we3", "value", "chain", "cho", "tiệm", "bánh", "bếp"]
    text: |-
      id: m02_we3
      name: Value Chain cho tiệm bánh 'Bếp Nhà Lan' (giả định, đơn vị = 100 điểm giá bán)
      inputs:
        price: 100
        costs:
          inbound: 12
          operations: 28
          outbound: 8
          marketing_sales: 22
          service: 6
          support: 12
        values:
          inbound: 8
          operations: 30
          outbound: 7
          marketing_sales: 15
          service: 25
          support: 15
        survey: Khảo sát 30 khách chia 100 điểm cho 6 nhóm hoạt động (trung bình)
      steps:
      - Tổng chi phí = 12+28+8+22+6+12 = 88; Margin = 100-88 = 12 (12%).
      - 'Tỷ trọng chi phí: inbound 13.6%, operations 31.8%, outbound 9.1%, marketing 25.0%, service 6.8%, support 13.6%.'
      - 'Tỷ số R = tỷ trọng giá trị / tỷ trọng chi phí: inbound 0.08/0.136 = 0.59; operations 0.30/0.318 = 0.94; outbound 0.07/0.091 = 0.77; marketing 0.15/0.25 = 0.60; service 0.25/0.068 = 3.67; support 0.15/0.136 = 1.10.'
      - 'Đọc: Service R=3.67 (khách rất coi trọng, ta đầu tư rất ít) -> tăng đầu tư (tin nhắn nhắc lịch, đặt trước, bảo hành bánh). Marketing R=0.60 và Inbound R=0.59 -> tối ưu (thay quảng cáo trả phí bằng Zalo/referral; gom đơn nhập nguyên liệu).'
      - 'Giả thiết: cắt Marketing 22->17 (tiết kiệm 5), Inbound 12->10 (tiết kiệm 2), tăng Service 6->10 (thêm 4): chi phí mới = 88-5-2+4 = 85, Margin = 15 (15%).'
      result: Margin 12% -> 15% (giả định) nhờ chuyển chi phí từ khâu giá trị thấp sang khâu giá trị cao; Service là điểm khác biệt chính.
      reliability: illustrative
  - id: "m02-worked_examples-4"
    title: "Ví dụ có lời giải: m02_we4 — Kết hợp SWOT-VRIO-Value Chain cho một công ty phần mềm POS cho quán cà phê (giả định)"
    tags: ["ví", "dụ", "có", "lời", "giải", "m02_we4", "kết", "hợp", "swot", "vrio", "value", "chain"]
    text: |-
      id: m02_we4
      name: Kết hợp SWOT-VRIO-Value Chain cho một công ty phần mềm POS cho quán cà phê (giả định)
      inputs:
        context: '12 nhân sự, doanh thu 4.8 tỷ/năm, 300 khách; đối thủ: KiotViet, Sapo'
      steps:
      - 'SWOT: S = tích hợp giao hàng nội địa + hỗ trợ tại chỗ nhanh; W = ít vốn, thương hiệu yếu; O = quán cà phê chuyển số; T = đối thủ lớn giảm giá.'
      - 'VRIO cho S: hỗ trợ tại chỗ nhanh (V đạt; R: ít đối thủ làm 24/7 -> đạt; I: đối thủ có thể thuê thêm nhân sự -> không) -> temporary. Dữ liệu vận hành 300 quán (V,R đạt; I đạt vì tích lũy; O chưa có đội phân tích) -> unused.'
      - 'Value Chain: khâu Service là nơi tạo giá trị lớn; dữ liệu nằm ở Technology Development -> lập đội phân tích dữ liệu, tạo báo cáo benchmark cho quán.'
      - 'TOWS: SO = bán gói ''báo cáo benchmark'' cho quán (từ dữ liệu); ST = hợp đồng 2 năm giữ khách chống giảm giá; WO = hợp tác ngân hàng/đối tác giới thiệu để mở rộng.'
      result: Chọn tập trung khai thác dữ liệu (nguồn lực unused) thay vì đua giảm giá; tổ chức lại tại Technology Development và Service.
      reliability: illustrative
  - id: "m02-practice_questions-1"
    title: "Câu hỏi luyện tập: Phân biệt S/W với O/T bằng quy tắc nào? 'Giá nguyên liệu tăng 15%' nên đặt vào nhóm nào?"
    tags: ["câu", "hỏi", "luyện", "tập", "phân", "biệt", "với", "bằng", "quy", "tắc", "nào", "giá"]
    text: |-
      q: Phân biệt S/W với O/T bằng quy tắc nào? 'Giá nguyên liệu tăng 15%' nên đặt vào nhóm nào?
      a: S/W là yếu tố nội bộ doanh nghiệp kiểm soát được; O/T là bên ngoài không kiểm soát. Giá nguyên liệu tăng là Threat (bên ngoài); 'chưa có hợp đồng nhập dài hạn' mới là Weakness.
  - id: "m02-practice_questions-2"
    title: "Câu hỏi luyện tập: SWOT có điểm S=3.8, W=2.5, O=3.0, T=4.2. Nên ưu tiên quadrant nào?"
    tags: ["câu", "hỏi", "luyện", "tập", "swot", "có", "điểm", "nên", "ưu", "tiên", "quadrant", "nào"]
    text: |-
      q: SWOT có điểm S=3.8, W=2.5, O=3.0, T=4.2. Nên ưu tiên quadrant nào?
      a: 'Net_int = 1.3 > 0; Net_ext = 3.0 - 4.2 = -1.2 < 0 -> ST (phòng thủ): dùng điểm mạnh để chống đe dọa, vd tăng khách trung thành, khác biệt hóa.'
  - id: "m02-practice_questions-3"
    title: "Câu hỏi luyện tập: Một nguồn lực: có giá trị, hiếm, đối thủ chỉ mất 6 tháng để sao chép. Kết quả VRIO và hành động?"
    tags: ["câu", "hỏi", "luyện", "tập", "một", "nguồn", "lực", "có", "giá", "trị", "hiếm", "đối"]
    text: |-
      q: 'Một nguồn lực: có giá trị, hiếm, đối thủ chỉ mất 6 tháng để sao chép. Kết quả VRIO và hành động?'
      a: V=1, R=1, I=0 -> Lợi thế tạm thời. Khai thác nhanh trong cửa sổ thời gian, đầu tư tạo rào cản (thương hiệu, hợp đồng độc quyền, tích lũy dữ liệu).
  - id: "m02-practice_questions-4"
    title: "Câu hỏi luyện tập: Quán có thương hiệu local nổi tiếng nhưng không có ai chịu trách nhiệm marketing/CRM. VRIO?"
    tags: ["câu", "hỏi", "luyện", "tập", "quán", "có", "thương", "hiệu", "local", "nổi", "tiếng", "nhưng"]
    text: |-
      q: Quán có thương hiệu local nổi tiếng nhưng không có ai chịu trách nhiệm marketing/CRM. VRIO?
      a: 'Nếu V,R,I đạt nhưng O không -> Lợi thế chưa khai thác. Hành động: giao trách nhiệm, xây CRM, KPI, ngân sách.'
  - id: "m02-practice_questions-5"
    title: "Câu hỏi luyện tập: Tính margin với giá 100 và chi phí hoạt động 15, 30, 12, 20, 8, 10."
    tags: ["câu", "hỏi", "luyện", "tập", "tính", "margin", "với", "giá", "100", "và", "chi", "phí"]
    text: |-
      q: Tính margin với giá 100 và chi phí hoạt động 15, 30, 12, 20, 8, 10.
      a: Tổng chi phí = 95; Margin = 5 (5%). Ở biên mỏng, cần kiểm tra khâu có R<0.8 để cắt hoặc tăng giá trị khách.
  - id: "m02-practice_questions-6"
    title: "Câu hỏi luyện tập: Tính R của khâu Marketing nếu giá trị = 15 điểm trên tổng 100 và chi phí = 22 trên tổng 88."
    tags: ["câu", "hỏi", "luyện", "tập", "tính", "của", "khâu", "marketing", "nếu", "giá", "trị", "15"]
    text: |-
      q: Tính R của khâu Marketing nếu giá trị = 15 điểm trên tổng 100 và chi phí = 22 trên tổng 88.
      a: (15/100)/(22/88) = 0.15/0.25 = 0.60 -> khâu tiêu nhiều hơn mức khách coi trọng, ứng viên tối ưu.
  - id: "m02-practice_questions-7"
    title: "Câu hỏi luyện tập: Vì sao Zara không sao chép được bằng cách copy từng khâu?"
    tags: ["câu", "hỏi", "luyện", "tập", "vì", "sao", "zara", "không", "chép", "được", "bằng", "cách"]
    text: |-
      q: Vì sao Zara không sao chép được bằng cách copy từng khâu?
      a: Lợi thế đến từ liên kết giữa các khâu (mua vải lô nhỏ gần, sản xuất in-house, logistics 2 lần/tuần, dữ liệu cửa hàng-HQ); liên kết nhân quả mơ hồ và tích lũy lâu -> I (khó bắt chước). Copy một khâu không cho tốc độ.
  - id: "m02-practice_questions-8"
    title: "Câu hỏi luyện tập: Vì sao SWOT dễ bị chỉ trích và TOWS giải quyết gì?"
    tags: ["câu", "hỏi", "luyện", "tập", "vì", "sao", "swot", "dễ", "bị", "chỉ", "trích", "và"]
    text: |-
      q: Vì sao SWOT dễ bị chỉ trích và TOWS giải quyết gì?
      a: SWOT chỉ liệt kê, không ưu tiên, không định lượng, không ra hành động. TOWS ghép S/W với O/T thành 4 loại chiến lược SO/ST/WO/WT, ưu tiên bằng Impact x Feasibility.
  - id: "m02-practice_questions-9"
    title: "Câu hỏi luyện tập: Khi nào chiến lược WT hợp lý? Ví dụ?"
    tags: ["câu", "hỏi", "luyện", "tập", "khi", "nào", "chiến", "lược", "wt", "hợp", "lý", "ví"]
    text: |-
      q: Khi nào chiến lược WT hợp lý? Ví dụ?
      a: 'Khi nội bộ yếu và môi trường bất lợi: tập trung ngách, cắt giảm, giữ dòng tiền (Grab cắt giảm chi phí khi lãi suất tăng; quán thương hiệu yếu tập trung phân khúc nhỏ).'
