      Nếu BCTC quá phức tạp, nhiều SPE/giao dịch bên liên quan, hoặc kiểm toán đồng thời tư vấn thì tăng mức hoài nghi.
  - id: "m05-decision_rules-19"
    title: "Quy tắc quyết định: Nếu DN gọi vốn quốc tế hoặc so với công ty IFRS thì lưu ý khác biệt VAS/IFRS (lease, doanh thu, fai…"
