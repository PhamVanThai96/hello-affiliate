    text: |-
      Nếu SME trộn lẫn tiền cá nhân và công ty hoặc không trích khấu hao thì dặn tách bạch/chuẩn hóa sổ sách trước khi tin các tỷ số.
  - id: "m05-decision_rules-18"
    title: "Quy tắc quyết định: Nếu BCTC quá phức tạp, nhiều SPE/giao dịch bên liên quan, hoặc kiểm toán đồng thời tư vấn thì tăng …"
