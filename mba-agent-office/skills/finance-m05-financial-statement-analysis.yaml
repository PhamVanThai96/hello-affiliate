  - id: "m05-case_lessons-1"
    title: "Bài học case: Nội Thất Gỗ Việt - có lãi nhưng âm tiền"
    tags: ["bài", "học", "case", "nội", "thất", "gỗ", "việt", "có", "lãi", "nhưng", "âm", "tiền"]
    text: |-
      name: Nội Thất Gỗ Việt - có lãi nhưng âm tiền
      type: failure
      setup: Bán 500tr nội thất cho chuỗi khách sạn, trả chậm 90 ngày; COGS 350tr đã trả trước; opex 80tr trả ngay; tiền đầu kỳ 200tr.
      key_calculations:
      - NI = 500 - 350 - 80 = +70tr
      - Dòng tiền ròng = 0 - 350 - 80 = -430tr; OCF theo gián tiếp = NI 70 - ΔAR 500 = -430
      - Tiền cuối kỳ = 200 - 430 = -230tr (không đủ trả lương, nợ)
      lesson: Lợi nhuận dồn tích không phải tiền; bán chịu dài làm AR phình, DN lãi vẫn có thể phá sản (growing broke). Cần CFS và theo dõi thanh khoản, chính sách tín dụng và hạn mức vốn lưu động.
      data_reliability: illustrative
  - id: "m05-case_lessons-2"
    title: "Bài học case: Apple FY2023 - ROE 171% không phải tốt nhất"
    tags: ["bài", "học", "case", "apple", "fy2023", "roe", "171", "không", "phải", "tốt", "nhất"]
    text: |-
      name: Apple FY2023 - ROE 171% không phải tốt nhất
      type: success
      setup: Mô hình capital-light; Revenue 383B, NI 97B, Total Assets ~333B, Equity ~57B sau hơn 600B USD buyback; ROIC 55-60%; WACC ~10%.
      key_calculations:
      - Net Margin = 97/383 = 25.3%
      - Asset Turnover = 383/333 = 1.15x
      - Equity Multiplier = 333/57 = 5.84x (nguồn ghi 5.87)
      - ROE = 25.3% x 1.15 x 5.87 = ~171%
      - 'Nếu Equity 150B: EM = 333/150 = 2.22; ROE giả định = 25.3% x 1.15 x 2.22 = 64.6%'
      lesson: Phần chênh lớn giữa 171% và 64.6% đến từ buyback làm co Equity (đòn bẩy), không phải cải thiện vận hành. Dùng ROIC để đánh giá năng lực vận hành; luôn hỏi 'ROE đến từ đâu'.
      data_reliability: unverified
  - id: "m05-case_lessons-3"
    title: "Bài học case: Enron - gian lận BCTC (2001)"
    tags: ["bài", "học", "case", "enron", "gian", "lận", "bctc", "2001"]
    text: |-
      name: Enron - gian lận BCTC (2001)
      type: failure
      setup: 'Công ty năng lượng Mỹ phá sản 12/2001; Arthur Andersen sụp đổ; ra đời Sarbanes-Oxley 2002. Số liệu theo nguồn (chưa kiểm chứng): doanh thu 2000 báo cáo $101B, nợ trên BS $13B vs thực $38B+, NI báo cáo $979 triệu nhưng thực lỗ nặng.'
      key_calculations:
      - 'Mark-to-market: ghi nhận lợi nhuận ước tính cả hợp đồng 20-30 năm ngay năm ký, dựa dự báo giá tự đưa ra.'
      - '>3,000 SPE đưa $30B+ nợ ra ngoài Balance Sheet (cần bên thứ ba góp tối thiểu 3% vốn để không hợp nhất); CFO Fastow hưởng lợi cá nhân.'
      - 'Phí Arthur Andersen: $25 triệu kiểm toán + $27 triệu tư vấn (độc lập bị nghi ngờ).'
      lesson: 'Red flags: Revenue tăng mạnh nhưng OCF đi ngang/âm; BCTC phức tạp khó hiểu; off-balance sheet; giao dịch bên liên quan; thưởng gắn giá cổ phiếu; né câu hỏi; nhân sự cấp cao nghỉ đột ngột; kiểm toán đồng thời tư vấn. Bài học: OCF so NI, đọc Thuyết minh, hỏi ai hưởng lợi, độc lập kiểm toán, quản trị với HĐQT độc lập.'
      data_reliability: unverified
  - id: "m05-case_lessons-4"
    title: "Bài học case: Masan/Bách Hóa Xanh - vòng quay nhanh, biên mỏng"
    tags: ["bài", "học", "case", "masan", "bách", "hóa", "xanh", "vòng", "quay", "nhanh", "biên", "mỏng"]
    text: |-
      name: Masan/Bách Hóa Xanh - vòng quay nhanh, biên mỏng
      type: success
      setup: 'Chuỗi siêu thị mini giả định: vốn chủ 10 tỷ, nợ NCC 10 tỷ, Total Assets 20 tỷ, Net Margin 1.5%, Asset Turnover 9.'
      key_calculations:
      - Revenue = 20 x 9 = 180 tỷ
      - NI = 180 x 1.5% = 2.7 tỷ
      - 'ROE = 2.7/10 = 27%; DuPont: 1.5% x 9 x 2 = 27%'
      - CCC = DSO 2 + DIO 25 - DPO 35 = -8 ngày
      lesson: Bán lẻ kiếm lời nhờ quay vòng (turnover) và đòn bẩy miễn phí từ nhà cung cấp, không nhờ margin dày; CCC âm là lợi thế cấu trúc. So sánh với mô hình biên dày vòng quay chậm (BĐS, luxury) có rủi ro thanh khoản và lãi vay. Số liệu giả định minh họa; margin 1.3-1.5% của Masan/WinCommerce chưa xác minh.
      data_reliability: illustrative
  - id: "m05-case_lessons-5"
    title: "Bài học case: Làn Gió Mới Coffee - SME Việt Nam A-Z"
    tags: ["bài", "học", "case", "làn", "gió", "mới", "coffee", "sme", "việt", "nam"]
    text: |-
      name: Làn Gió Mới Coffee - SME Việt Nam A-Z
      type: sme
      setup: 'Quán cà phê specialty Q.3 TP.HCM, năm thứ 2: Revenue 2,400, COGS 720, EBIT 300, lãi vay 40, thuế 20%, NI 208; Total Assets 900, Equity 470, nợ vay 320; chủ rút 126. Đơn vị triệu VNĐ, số liệu minh họa nhưng nhất quán (BS cân, CFS khớp).'
      key_calculations:
      - Gross 1680/2400 = 70%; Operating 300/2400 = 12.5%; Net 208/2400 = 8.67%; ROE 208/470 = 44.3%; ROA 208/900 = 23.1%
      - Current 250/190 = 1.32x; Quick (250-60)/190 = 1.0x; Cash 150/190 = 0.79x
      - D/E (80+240)/470 = 0.68x; Debt/Assets 430/900 = 47.8%; Interest Coverage 300/40 = 7.5x
      - Inventory Turnover 720/52.5 = 13.7 (DIO ~26.6); DSO ~3.8; DPO ~35.5; CCC ~ -5.07 (nguồn -4.6); Asset Turnover 2.67x
      - 'DuPont: 8.67% x 2.67 x 1.915 = 44.3%'
      - OCF = 208 + 100 - 10 - 15 - 2 + 20 + 5 = 306; ΔCash = 306 - 40 - 206 = +60; Cash 90 -> 150
      - 'RE: -112 + 208 - 126 = -30'
      lesson: 'Sức khỏe tốt, ROE chất lượng (cân bằng ba thành phần, Interest Coverage 7.5x, OCF 306 > NI 208). Cải thiện: Current Ratio 1.32 hơi thấp, nên giữ lại lợi nhuận thay vì rút 126; CCC âm cho phép mở chi nhánh ít vốn; theo dõi AR (+50%) và Inventory (+33%) mỗi quý dù tuyệt đối nhỏ; dùng Interest Coverage đàm phán vay, ROE thu hút nhà đầu tư.'
      data_reliability: illustrative
  - id: "m05-case_lessons-6"
    title: "Bài học case: Công ty Y - mini case phát hiện red flags"
    tags: ["bài", "học", "case", "công", "ty", "mini", "phát", "hiện", "red", "flags"]
    text: |-
      name: Công ty Y - mini case phát hiện red flags
      type: failure
      setup: Doanh thu 100/130/170 tỷ; NI 10/15/22; OCF 9/8/3; AR 15/28/55; Inventory 10/12/14.
      key_calculations:
      - Revenue +30%, +30.8%; NI +50%, +46.7%; AR +86.7%, +96.4%
      - OCF/NI = 0.90, 0.53, 0.14
      lesson: 'OCF giảm khi NI tăng và AR vọt gấp 2-3 lần tốc độ doanh thu: nghi bán chịu quá mức/channel stuffing/ghi nhận doanh thu sớm; cần điều tra chất lượng AR trước khi tin lợi nhuận.'
      data_reliability: illustrative
  - id: "m05-worked_examples-1"
    title: "Ví dụ có lời giải: Tính bộ tỷ số thanh khoản cho cửa hàng"
    tags: ["ví", "dụ", "có", "lời", "giải", "tính", "bộ", "tỷ", "số", "thanh", "khoản", "cho"]
    text: |-
      name: Tính bộ tỷ số thanh khoản cho cửa hàng
      inputs:
        current_assets: 300
        inventory: 100
        current_liabilities: 200
      steps:
      - Current Ratio = 300 / 200 = 1.5
      - Quick Ratio = (300 - 100) / 200 = 1.0
      result: CR 1.5x (ở ngưỡng tốt 1.5-2.5), QR 1.0x (đạt tối thiểu an toàn); thanh khoản ổn nhưng phụ thuộc 1/3 tài sản ngắn hạn là tồn kho.
  - id: "m05-worked_examples-2"
    title: "Ví dụ có lời giải: DuPont ngược từ Net Margin, Turnover, Total Assets, Equity"
    tags: ["ví", "dụ", "có", "lời", "giải", "dupont", "ngược", "từ", "net", "margin", "turnover", "total"]
    text: |-
      name: DuPont ngược từ Net Margin, Turnover, Total Assets, Equity
      inputs:
        net_margin: 0.05
        asset_turnover: 1.2
        total_assets: 1000
        equity: 500
      steps:
      - EM = 1000 / 500 = 2
      - Revenue = 1.2 x 1000 = 1200
      - NI = 5% x 1200 = 60
      - 'ROE = 5% x 1.2 x 2 = 12% (kiểm: 60/500 = 12%)'
      result: Revenue 1,200 triệu; NI 60 triệu; EM 2x; ROE 12%.
  - id: "m05-worked_examples-3"
    title: "Ví dụ có lời giải: CCC trước và sau đàm phán DPO"
    tags: ["ví", "dụ", "có", "lời", "giải", "ccc", "trước", "và", "sau", "đàm", "phán", "dpo"]
    text: |-
      name: CCC trước và sau đàm phán DPO
      inputs:
        dio: 45
        dso: 30
        dpo_old: 20
        dpo_new: 50
      steps:
      - CCC cũ = 30 + 45 - 20 = 55 ngày
      - CCC mới = 30 + 45 - 50 = 25 ngày
      - Giảm 30 ngày vốn lưu động phải tự ứng
      result: CCC từ 55 xuống 25 ngày; nhu cầu vốn lưu động tự có giảm, giải phóng tiền cho mở rộng/trả nợ. Lưu ý rủi ro quan hệ NCC.
  - id: "m05-worked_examples-4"
    title: "Ví dụ có lời giải: Phân tích ROE Làn Gió Mới từ Balance Sheet và IS"
    tags: ["ví", "dụ", "có", "lời", "giải", "phân", "tích", "roe", "làn", "gió", "mới", "từ"]
    text: |-
      name: Phân tích ROE Làn Gió Mới từ Balance Sheet và IS
      inputs:
        ni: 208
        revenue: 2400
        total_assets: 900
        equity: 470
        ebit: 300
        interest: 40
      steps:
      - Net Margin = 208/2400 = 8.67%
      - Asset Turnover = 2400/900 = 2.667
      - EM = 900/470 = 1.915
      - ROE = 8.67% x 2.667 x 1.915 = 44.3% (=208/470)
      - Interest Coverage = 300/40 = 7.5x nên đòn bẩy 1.915 an toàn
      result: 'ROE 44.3% chất lượng cao: cân bằng margin, turnover và đòn bẩy vừa phải.'
  - id: "m05-worked_examples-5"
    title: "Ví dụ có lời giải: Dựng CFS Làn Gió Mới và đối chiếu tiền"
    tags: ["ví", "dụ", "có", "lời", "giải", "dựng", "cfs", "làn", "gió", "mới", "và", "đối"]
    text: |-
      name: Dựng CFS Làn Gió Mới và đối chiếu tiền
      inputs:
        ni: 208
        dep: 100
        d_ar: 10
        d_inv: 15
        d_prepaid: 2
        d_ap: 20
        d_accrued: 5
        capex: 40
        debt_repay: 80
        owner_draw: 126
        cash_begin: 90
      steps:
      - OCF = 208 + 100 - 10 - 15 - 2 + 20 + 5 = 306
      - Investing = -40
      - Financing = -80 - 126 = -206
      - ΔCash = 306 - 40 - 206 = +60; Cash cuối = 150 khớp BS
      - 'Kiểm RE: -112 + 208 - 126 = -30; kiểm BS: 900 = 430 + 470'
      result: Tiền 90 -> 150; OCF 306 > NI 208; 3 báo cáo nhất quán.
