  - id: "m05-worked_examples-7"
    title: "Ví dụ có lời giải: Bán lẻ ROE 27% từ margin 1.5%"
    tags: ["ví", "dụ", "có", "lời", "giải", "bán", "lẻ", "roe", "27", "từ", "margin"]
    text: |-
      name: Bán lẻ ROE 27% từ margin 1.5%
      inputs:
        equity: 10
        supplier_credit: 10
