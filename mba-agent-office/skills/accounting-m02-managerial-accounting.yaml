      Nếu sản phẩm 'lỗ sau phân bổ' thì KHÔNG dừng ngay; so CM với định phí tránh được; dừng chỉ khi CM < định phí tránh được và công suất không có cách dùng tốt hơn.
  - id: "m02-decision_rules-3"
    title: "Quy tắc quyết định: Nếu giá chào đơn đặc biệt <= biến phí tăng thêm thì từ chối; nếu > biến phí tăng thêm, còn công suấ…"
