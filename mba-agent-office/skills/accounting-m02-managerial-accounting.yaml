  - id: "m02-case_lessons-1"
    title: "Bài học case: Amazon - kế toán quản trị hỗ trợ quyết định chiến lược"
    tags: ["bài", "học", "case", "amazon", "kế", "toán", "quản", "trị", "hỗ", "trợ", "quyết", "định"]
    text: |-
      name: Amazon - kế toán quản trị hỗ trợ quyết định chiến lược
      type: success
      setup: |
        Amazon thập niên 1990-2000 chấp nhận lãi mỏng/lỗ để tăng trưởng; nhìn BCTC thì kém nhưng ban lãnh đạo dùng unit economics, segment P&L, LTV khách Prime, phân tích incremental khi vào cloud (AWS), transfer pricing nội bộ, và nhấn mạnh Free Cash Flow trên mỗi cổ phiếu thay vì EPS (thư cổ đông của Bezos).
      key_calculations:
      - 'Unit economics = doanh thu/đơn trừ mọi biến phí/đơn (fulfillment, ship, returns): dương và cải thiện thì quy mô pha loãng định phí.'
      - 'Segment P&L: AWS biên cao bị che lấp trong lãi ròng toàn công ty nếu không tách.'
      lesson: 'Doanh nghiệp có thể lỗ theo BCTC nhưng đang xây nền tảng lãi lớn nếu unit economics đúng hướng. SME: nhìn lãi/lỗ trên mỗi đơn, sản phẩm, kênh, không chỉ cuối tháng.'
      data_reliability: unverified
  - id: "m02-case_lessons-2"
    title: "Bài học case: WeWork - kế toán quản trị bị méo mó"
    tags: ["bài", "học", "case", "wework", "kế", "toán", "quản", "trị", "bị", "méo", "mó"]
    text: |-
      name: WeWork - kế toán quản trị bị méo mó
      type: failure
      setup: |
        Startup coworking định giá khoảng 47 tỷ USD (2019), IPO thất bại sau S-1; dùng "Community Adjusted EBITDA" loại marketing, G&A, khấu hao, cổ phiếu thưởng nên che mức lỗ (khoảng 1,9 tỷ USD/năm); cam kết thuê nhiều năm bị trình bày như đầu tư tăng trưởng; unit economics tuyên bố mỗi địa điểm có lãi nhưng bỏ ramp-up và chi phí chung.
      key_calculations:
      - Định giá giảm khoảng 47 tỷ xuống khoảng 8 tỷ USD (mất khoảng 83%).
      - 'Thuê 10-15 năm là định phí cứng, doanh thu ngắn hạn, DOL cực cao: doanh thu -20-30% (COVID) khiến lợi nhuận sụt nhiều lần.'
      - Nộp Chapter 11 năm 2023.
      lesson: |
        Chỉ tiêu phi chuẩn mực phải có ý nghĩa kinh tế và tính đủ chi phí; unit economics phải thật (gồm overhead, chi phí vốn); cẩn trọng định phí dài hạn (DOL tăng vọt); kế toán quản trị phải trung thực, đối chiếu với kế toán tài chính và dòng tiền; tránh ngụy biện chi phí chìm.
      data_reliability: unverified
  - id: "m02-case_lessons-3"
    title: "Bài học case: Xưởng bánh Hương Quê - Đà Nẵng (giữ hay dừng dòng bánh C, hòa vốn đa sản phẩm)"
    tags: ["bài", "học", "case", "xưởng", "bánh", "hương", "quê", "đà", "nẵng", "giữ", "hay", "dừng"]
    text: |-
      name: Xưởng bánh Hương Quê - Đà Nẵng (giữ hay dừng dòng bánh C, hòa vốn đa sản phẩm)
      type: sme
      setup: |
        Công ty TNHH 12 nhân sự, 3 dòng: A bông lan trứng muối (3.000 cái, 60k, biến phí 36k, FC trực tiếp 15 triệu), B bánh mì ngọt (5.000, 30k, 21k, 8 triệu), C bánh sinh nhật (2.000, 80k, 70k, 12 triệu); định phí chung 40 triệu/tháng phân bổ theo doanh thu; kế toán thấy C lỗ.
      key_calculations:
      - 'CM: A 72, B 45, C 20 triệu (tổng 137); CM ratio 40%, 30%, 12,5%, bình quân 27,96%.'
      - 'Segment margin: 57, 37, 8 (tổng 102); lợi nhuận hoạt động = 102 - 40 = 62 triệu.'
      - 'Phân bổ chung theo doanh thu: 14,69; 12,24; 13,06 -> C = 8 - 13,06 = -5,06 triệu (chỉ do phân bổ).'
      - 'Dừng C: lợi nhuận 62 - 8 = 54 triệu (giảm 8). Chuyển công suất sang A: 700 x 24.000 = 16,8 triệu > 8 triệu (giả định). Tăng giá C lên 88.000: segment margin 24 triệu.'
      - BEP = 75/0,2796 = 268,2 triệu; MoS 45,3%; target 80 triệu cần 554,4 triệu; DOL = 137/62 = 2,21.
      - 'Đơn đặc biệt 1.000 bánh B giá 24k, biến phí 22k: +2 triệu. Hộp giấy: mua 3.800 vs tự làm 3.200 + 4 triệu/tháng; Q* = 6.667 hộp.'
      lesson: Không dừng C chỉ vì lỗ sau phân bổ; tăng giá hoặc chuyển công suất; theo dõi mix hàng tháng; nhận đơn đặc biệt chỉ khi công suất dư; tự làm hộp khi >6.667 hộp/tháng.
      data_reliability: illustrative
  - id: "m02-worked_examples-1"
    title: "Ví dụ có lời giải: m02_we_cafe_cvp — Quán cà phê: CVP, độ nhạy, MoS, DOL"
    tags: ["ví", "dụ", "có", "lời", "giải", "m02_we_cafe_cvp", "quán", "cà", "phê", "cvp", "độ", "nhạy"]
    text: |-
      id: m02_we_cafe_cvp
      name: 'Quán cà phê: CVP, độ nhạy, MoS, DOL'
      inputs:
        P: 50000
        V: 15000
        FC: 70000000
        actual_units: 3000
      steps:
      - CM = 35.000; CM ratio = 70%.
      - BEP = 2.000 ly (66,7/ngày); BEP doanh thu = 100 triệu.
      - 'Muốn lãi 30 triệu: (70+30) triệu / 35.000 = 2.857 ly (95/ngày).'
      - 'Bán 3.000 ly: lợi nhuận 35 triệu; MoS 33,3%; DOL = 105/35 = 3,0.'
      - 'Độ nhạy BEP: V 18k -> 2.188; FC 85 triệu -> 2.429; giá 45k -> 2.333; giá 55k -> 1.750.'
      - 'Bán +10% (3.300 ly): lợi nhuận 45,5 triệu (+30%).'
      result: BEP 2.000 ly; lợi nhuận 35 triệu; MoS 33,3%; DOL 3,0; giảm giá 10% làm BEP +16,7%, tăng giá 10% làm BEP -12,5%.
  - id: "m02-worked_examples-2"
    title: "Ví dụ có lời giải: m02_we_high_low — Tách chi phí điện hỗn hợp và đưa vào CVP"
    tags: ["ví", "dụ", "có", "lời", "giải", "m02_we_high_low", "tách", "chi", "phí", "điện", "hỗn", "hợp"]
    text: |-
      id: m02_we_high_low
      name: Tách chi phí điện hỗn hợp và đưa vào CVP
      inputs:
        Y_high: 5900000
        X_high: 3600
        Y_low: 4300000
        X_low: 2000
      steps:
      - b = (5,9-4,3 triệu)/(3.600-2.000) = 1.000đ/ly.
      - a = 5.900.000 - 3.600.000 = 2.300.000/tháng.
      - 'Kiểm tra: 2.300.000 + 2.000.000 = 4.300.000 (khớp).'
      - 'Cập nhật: biến phí/ly +1.000; định phí/tháng +2,3 triệu rồi tính lại BEP.'
      result: Điện = 2,3 triệu + 1.000đ/ly
  - id: "m02-worked_examples-3"
    title: "Ví dụ có lời giải: m02_we_absorption_variable — Absorption vs Variable costing kèm bút toán"
    tags: ["ví", "dụ", "có", "lời", "giải", "m02_we_absorption_variable", "absorption", "vs", "variable", "costing", "kèm", "bút"]
    text: |-
      id: m02_we_absorption_variable
      name: Absorption vs Variable costing kèm bút toán
      inputs:
        Q_prod: 10000
        Q_sold: 8000
        P: 100000
        V: 60000
        FOH: 200000000
        SGA_fixed: 50000000
      steps:
      - 'Absorption: Doanh thu 800; giá vốn = 8.000 x (60.000+20.000) = 640; lãi gộp 160; trừ 50 = 110 triệu.'
      - 'Variable: CM = 800 - 480 = 320; trừ FOH 200 và SGA 50 = 70 triệu.'
      - Chênh 40 = 2.000 x 20.000 (định phí nằm trong tồn kho).
      - 'Bút toán tham chiếu TT200 (cần xác nhận hiện hành): Nợ 154 / Có 621, 622, 627 (tập hợp chi phí SX kỳ: 600 triệu biến phí + 200 triệu FOH = 800 triệu); Nợ 155 / Có 154 (nhập kho 10.000 SP giá thành đơn vị 80.000); Nợ 632 / Có 155 (xuất bán 8.000 SP x 80.000 = 640 triệu); Nợ 131 hoặc 111/112 / Có 511 (doanh thu 800 triệu) và thuế GTGT đầu ra (Có 3331) theo quy định thuế; chi phí bán hàng/quản lý Nợ 641/642 / Có 111/112/334.'
      - Tồn kho cuối kỳ = 2.000 x 80.000 = 160 triệu (gồm 40 triệu định phí SX).
      result: Absorption 110 triệu, Variable 70 triệu, chênh 40 triệu = định phí SX trong tồn kho 2.000 SP
  - id: "m02-worked_examples-4"
    title: "Ví dụ có lời giải: m02_we_huong_que_segment — Hương Quê: segment margin, phân bổ, BEP đa sản phẩm, DOL"
    tags: ["ví", "dụ", "có", "lời", "giải", "m02_we_huong_que_segment", "hương", "quê", "segment", "margin", "phân", "bổ"]
    text: |-
      id: m02_we_huong_que_segment
      name: 'Hương Quê: segment margin, phân bổ, BEP đa sản phẩm, DOL'
      inputs:
        rev:
        - 180
        - 150
        - 160
        cm:
        - 72
        - 45
        - 20
        fc_direct:
        - 15
        - 8
        - 12
        fc_common: 40
      steps:
      - Tổng CM 137; ratio 27,96%; segment margin 57/37/8; tổng 102; LN hoạt động 62.
      - 'Phân bổ chung theo doanh thu: 14,69/12,24/13,06; lợi nhuận sau phân bổ 42,31/24,76/-5,06.'
      - 'Dừng C: LN = 62 - 8 = 54 triệu < 62 nên không dừng; tăng giá C 10% lên 88.000: segment margin 24 triệu.'
      - FC tổng = 35 + 40 = 75; BEP = 268,2 triệu; MoS 45,3%; target 80 -> 554,4 triệu.
      - 'DOL = 137/62 = 2,21; doanh thu +10%: LN = 150,7 - 75 = 75,7 triệu (+22,1%); -10%: 48,3 triệu.'
      result: Giữ C; BEP 268,2 triệu/tháng; MoS 45,3%; DOL 2,21
  - id: "m02-worked_examples-5"
    title: "Ví dụ có lời giải: m02_we_make_buy_box — Tự làm hộp hay mua ngoài"
    tags: ["ví", "dụ", "có", "lời", "giải", "m02_we_make_buy_box", "tự", "làm", "hộp", "hay", "mua", "ngoài"]
    text: |-
      id: m02_we_make_buy_box
      name: Tự làm hộp hay mua ngoài
      inputs:
        P_buy: 3800
        V: 3200
        FC_av: 4000000
        volume: 10000
      steps:
      - Q* = 4.000.000 / 600 = 6.667 hộp.
      - 'Bảng: 6.000 hộp -> 3.867 (mua rẻ hơn); 8.000 -> 3.700; 10.000 -> 3.600 (tự làm).'
      - Ở 10.000 hộp tiết kiệm (3.800-3.600) x 10.000 = 2 triệu/tháng; nếu <6.667 thì chuyển sang mua.
      result: Tự làm nếu >6.667 hộp/tháng
  - id: "m02-worked_examples-6"
    title: "Ví dụ có lời giải: m02_we_special_order_capacity — Đơn đặc biệt có giới hạn công suất"
    tags: ["ví", "dụ", "có", "lời", "giải", "m02_we_special_order_capacity", "đơn", "đặc", "biệt", "giới", "hạn", "công"]
    text: |-
      id: m02_we_special_order_capacity
      name: Đơn đặc biệt có giới hạn công suất
      inputs:
        capacity: 10000
        sold: 8000
        P: 100000
        V: 62000
        q: 3000
        P_sp: 75000
        pack: 3000
      steps:
      - CM thường = 38.000; CM đơn đặc biệt = 75.000 - 62.000 - 3.000 = 10.000.
      - 'Công suất dư 2.000; nhận 3.000 phải bỏ 1.000 bán thường: lợi 30 triệu - mất 38 triệu = -8 triệu.'
      - 'Nhận 2.000: +20 triệu.'
      - 'Bút toán bán đơn: Nợ 131 / Có 511, Có 3331; giá vốn Nợ 632 / Có 155 (TT200, cần xác nhận hiện hành).'
      result: Chỉ nhận 2.000 SP (+20 triệu)
  - id: "m02-worked_examples-7"
    title: "Ví dụ có lời giải: m02_we_discontinue_two_scenarios — Chuỗi 3 sản phẩm: dừng SP C theo hai kịch bản"
    tags: ["ví", "dụ", "có", "lời", "giải", "m02_we_discontinue_two_scenarios", "chuỗi", "sản", "phẩm", "dừng", "sp", "theo"]
    text: |-
      id: m02_we_discontinue_two_scenarios
      name: 'Chuỗi 3 sản phẩm: dừng SP C theo hai kịch bản'
      inputs:
        rev:
        - 500
        - 300
        - 200
        vc:
        - 250
        - 180
        - 150
        fc_alloc:
        - 150
        - 100
        - 80
      steps:
      - 'CM: 250/120/50 = 420; lợi nhuận sau phân bổ: 100/20/-30 = 90.'
      - 'Kịch bản 1 (định phí C không tránh được): LN = 420-50-330 = 40 < 90, giữ C.'
      - 'Kịch bản 2 (80 tránh được): LN = 370 - 250 = 120 > 90, dừng C.'
      result: 'Quy tắc: dừng khi CM_C (50) < định phí tránh được (80)'
  - id: "m02-practice_questions-1"
    title: "Câu hỏi luyện tập: Trà sữa: giá 40.000, biến phí 14.000, định phí 52 triệu. Tính CM, ratio, BEP, số ly để lãi 20 triệu."
    tags: ["câu", "hỏi", "luyện", "tập", "trà", "sữa", "giá", "40", "000", "biến", "phí", "14"]
    text: |-
      q: 'Trà sữa: giá 40.000, biến phí 14.000, định phí 52 triệu. Tính CM, ratio, BEP, số ly để lãi 20 triệu.'
      a: 'CM = 26.000, ratio 65%; BEP = 2.000 ly = 80 triệu; để lãi 20 triệu: 72.000.000/26.000 = 2.769 ly.'
  - id: "m02-practice_questions-2"
    title: "Câu hỏi luyện tập: Doanh thu 800 triệu, biến phí 480 triệu, định phí 240 triệu. Tính CM, lợi nhuận, DOL; doanh thu +15…"
    tags: ["câu", "hỏi", "luyện", "tập", "doanh", "thu", "800", "triệu", "biến", "phí", "480", "định"]
    text: |-
      q: Doanh thu 800 triệu, biến phí 480 triệu, định phí 240 triệu. Tính CM, lợi nhuận, DOL; doanh thu +15% thì lợi nhuận +%?
      a: CM 320, lợi nhuận 80, DOL 4,0; +15% doanh thu thì lợi nhuận = 320x1,15-240 = 128 (+60%).
  - id: "m02-practice_questions-3"
    title: "Câu hỏi luyện tập: SP X: DT 400, VC 240, FC trực tiếp 60, chung phân bổ 50. Y: 300, 270, 20, 40. Z: 200, 90, 30, 30. T…"
    tags: ["câu", "hỏi", "luyện", "tập", "sp", "dt", "400", "vc", "240", "fc", "trực", "tiếp"]
    text: |-
      q: 'SP X: DT 400, VC 240, FC trực tiếp 60, chung phân bổ 50. Y: 300, 270, 20, 40. Z: 200, 90, 30, 30. Tính CM, segment margin, lợi nhuận sau phân bổ; nên dừng Y không (trực tiếp tránh được, chung không)?'
      a: 'CM 160/30/110; segment margin 100/10/80; LN sau phân bổ 50/-30/50 (tổng 70). Dừng Y: LN = 70 - 10 = 60 < 70, không dừng trừ khi công suất tạo hơn 10 triệu CM chỗ khác.'
  - id: "m02-practice_questions-4"
    title: "Câu hỏi luyện tập: Công suất 10.000 SP, bán 8.000 giá 100.000, biến phí 62.000. Khách đề nghị 3.000 SP giá 75.000, thê…"
    tags: ["câu", "hỏi", "luyện", "tập", "công", "suất", "10", "000", "sp", "bán", "giá", "100"]
    text: |-
      q: Công suất 10.000 SP, bán 8.000 giá 100.000, biến phí 62.000. Khách đề nghị 3.000 SP giá 75.000, thêm bao bì 3.000. Nhận hết hay một phần?
      a: CM đơn = 10.000/SP; nhận 3.000 phải bỏ 1.000 SP thường (mất 38 triệu) nên lợi 30 - 38 = -8 triệu. Nhận 2.000 (+20 triệu).
  - id: "m02-practice_questions-5"
    title: "Câu hỏi luyện tập: Chi tiết mua 27.000/cái; tự làm biến phí 24.000 + định phí tránh được 18 triệu/tháng. Q* và quyết đ…"
    tags: ["câu", "hỏi", "luyện", "tập", "chi", "tiết", "mua", "27", "000", "cái", "tự", "làm"]
    text: |-
      q: Chi tiết mua 27.000/cái; tự làm biến phí 24.000 + định phí tránh được 18 triệu/tháng. Q* và quyết định ở 4.000, 6.000, 8.000 cái?
      a: 'Q* = 18 triệu/3.000 = 6.000. Chi phí tự làm/cái: 28.500 (mua), 27.000 (hòa), 26.250 (tự làm).'
  - id: "m02-practice_questions-6"
    title: "Câu hỏi luyện tập: Sản xuất 10.000, bán 8.000, giá 100.000, biến phí 60.000, định phí SX 200 triệu, bán hàng và quản l…"
    tags: ["câu", "hỏi", "luyện", "tập", "sản", "xuất", "10", "000", "bán", "giá", "100", "biến"]
    text: |-
      q: Sản xuất 10.000, bán 8.000, giá 100.000, biến phí 60.000, định phí SX 200 triệu, bán hàng và quản lý cố định 50 triệu. Lợi nhuận theo hai phương pháp?
      a: Absorption 110 triệu; Variable 70 triệu; chênh 40 triệu = 2.000 SP tồn kho tăng x 20.000đ.
  - id: "m02-practice_questions-7"
    title: "Câu hỏi luyện tập: Mô hình A (FC 100 triệu, V 10k) vs B (FC 30 triệu, V 40k), giá 50k. Ở lợi nhuận 20 triệu, DOL mỗi m…"
    tags: ["câu", "hỏi", "luyện", "tập", "mô", "hình", "fc", "100", "triệu", "10k", "vs", "30"]
    text: |-
      q: Mô hình A (FC 100 triệu, V 10k) vs B (FC 30 triệu, V 40k), giá 50k. Ở lợi nhuận 20 triệu, DOL mỗi mô hình?
      a: 'A: 3.000 SP, CM 120, DOL 6,0. B: 5.000 SP, CM 50, DOL 2,5.'
  - id: "m02-practice_questions-8"
    title: "Câu hỏi luyện tập: Tại sao tăng giá 10% giảm BEP ít hơn mức giảm giá 10% làm tăng BEP?"
    tags: ["câu", "hỏi", "luyện", "tập", "tại", "sao", "tăng", "giá", "10", "giảm", "bep", "ít"]
    text: |-
      q: Tại sao tăng giá 10% giảm BEP ít hơn mức giảm giá 10% làm tăng BEP?
      a: BEP = FC/CM; giá 55k tăng CM từ 35k lên 40k (BEP -12,5%), giá 45k giảm CM xuống 30k (BEP +16,7%); mẫu số nhỏ lại thì tăng tỷ lệ mạnh hơn (hàm nghịch đảo).
  - id: "m02-practice_questions-9"
    title: "Câu hỏi luyện tập: Hóa đơn điện: tháng cao 3.600 ly 5,9 triệu, tháng thấp 2.000 ly 4,3 triệu. Tách a và b?"
    tags: ["câu", "hỏi", "luyện", "tập", "hóa", "đơn", "điện", "tháng", "cao", "600", "ly", "triệu"]
    text: |-
      q: 'Hóa đơn điện: tháng cao 3.600 ly 5,9 triệu, tháng thấp 2.000 ly 4,3 triệu. Tách a và b?'
      a: b = 1.000đ/ly; a = 2,3 triệu.
