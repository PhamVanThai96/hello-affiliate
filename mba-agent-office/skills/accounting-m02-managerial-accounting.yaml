    text: |-
      Nếu giá chào đơn đặc biệt <= biến phí tăng thêm thì từ chối; nếu > biến phí tăng thêm, còn công suất dư thật, và không ảnh hưởng giá thị trường thì nhận.
  - id: "m02-decision_rules-4"
    title: "Quy tắc quyết định: Nếu đơn đặc biệt vượt công suất dư thì cộng chi phí cơ hội (CM thường bị mất) và nhận phần vừa công…"
