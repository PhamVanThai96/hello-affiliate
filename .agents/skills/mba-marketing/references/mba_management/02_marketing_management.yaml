stp_strategic_engine:
  segmentation:
    bases: ["Geographic", "Demographic", "Psychographic (Values/Lifestyles)", "Behavioral (Usage rate, Loyalty status, Benefits sought)"]
    segment_viability_criteria:
      measurable: "Size, purchasing power, and profile characteristics can be quantified."
      accessible: "Segment can be effectively reached and served via existing marketing channels."
      substantial: "Segment is large and profitable enough to justify custom marketing investments."
      differentiable: "Conceptually distinguishable and responds differently to marketing mix elements."
      actionable: "Effective programs can be designed for attracting and serving the segments."
  targeting_strategies:
    undifferentiated: "Mass market approach ignoring segment differences (Standard commodities)."
    differentiated: "Targeting multiple distinct segments with customized offerings (e.g., Toyota/Lexus)."
    concentrated_niche: "Focusing dominant resources on one specific underserved submarket."
    micromarketing: "Hyper-customization at individual or local postal code level."
  positioning_formula:
    canonical_syntax: "For [Target Customer Segment], who [Specific Need/Problem], our [Brand/Product] is a [Product Category] that [Core Benefit / Differentiator], unlike [Primary Competitor], because [Reason to Believe / Proof Points]."

marketing_mix_paradigms:
  goods_4p: ["Product (Design, Quality, Features)", "Price (List, Discounts, Credit)", "Place (Channels, Coverage, Logistics)", "Promotion (Ads, PR, Content, Sales Promo)"]
  services_extended_7p:
    people: "Selection, training, and customer-facing service culture of staff."
    process: "Service blueprinting, customer journey flow, queue management."
    physical_evidence: "Store design, ambient smells/lighting, digital UI/UX, packaging."
  digital_4c_translation:
    customer_solution: "Replacing generic Product with solved problems and tailored value."
    cost_to_customer: "Total cost of ownership including switching frictions and search time."
    convenience: "Frictionless digital/physical omnichannel buying anytime, anywhere."
    communication: "Two-way social dialogue and community co-creation replacing 1-way promo."

pricing_strategies_taxonomy:
  1_value_based: "Price set according to perceived value extracted by customer, independent of cost."
  2_cost_plus: "Unit cost + fixed markup percentage (Ensures baseline margin, ignores demand elasticity)."
  3_price_skimming: "High initial entry price targeting early adopters, subsequently lowered to capture mass."
  4_penetration_pricing: "Deliberately low entry price to capture market share rapidly and achieve scale."
  5_freemium: "Core feature set free forever; premium features/capacity monetized."
  6_dynamic_pricing: "Algorithmic real-time adjustment based on supply-demand fluctuations (e.g. Grab, Airlines)."
  7_psychological_pricing: "Charm pricing ($99 ending), prestige pricing, artificial price anchors."
  8_bundle_pricing: "Packaging complementary products at lower combined cost (Increases AOV)."
  9_loss_leader: "Selling item below cost to drive retail foot traffic for profitable cross-sells."
  10_economy_pricing: "Minimalist production and marketing to sustain rock-bottom prices."

brand_equity_cbbe_pyramid_keller:
  level_1_salience: "Brand Awareness -> Deep and broad brand recognition and recall at purchase moments."
  level_2_meaning:
    brand_performance: "How well product satisfies functional needs, reliability, and serviceability."
    brand_imagery: "Social and psychological associations (Heritage, personality, aesthetic)."
  level_3_response:
    brand_judgments: "Quality assessment, brand credibility, consideration set inclusion."
    brand_feelings: "Warmth, fun, excitement, security, social approval, self-respect."
  level_4_resonance: "Intense, active brand loyalty; psychological attachment; community advocacy."

consumer_behavior_and_behavioral_nudges:
  kahneman_dual_system:
    system_1: "Fast, automatic, effortless, associative, emotional (Governs 90%+ daily buying choices)."
    system_2: "Slow, deliberate, effortful, analytical, calculating (Activated by high risk/price)."
  heuristic_biases:
    anchoring: "Initial number seen dictates subsequent willingness-to-pay judgements."
    loss_aversion: "Pain of losing $100 is psychologically 2x stronger than pleasure of gaining $100."
    social_proof: "Under uncertainty, humans emulate actions of similar peers."
    decoy_effect: "Introducing an asymmetrically dominated third option shifts choice toward target option."

growth_hacking_aarrr_framework:
  acquisition: "Attracting relevant qualified traffic to the ecosystem."
  activation: "The 'Aha!' moment when user first experiences core product value."
  retention: "Keeping users active over weekly/monthly cohorts (Foundation of growth)."
  referral: "Organic and incentivized viral loops (K-factor > 1.0 indicates viral growth)."
  revenue: "Monetization efficiency, average order value, conversion to paid."

marketing_research_process:
  definition: "Systematic collection, analysis, and interpretation of market, customer, competitor, and environmental information for marketing decisions."
  research_types:
    exploratory: "Problem-framing and early-insight discovery; common methods: focus group, in-depth interview, observation."
    descriptive: "Market/customer description and measurement; common methods: survey, secondary data, panel data."
    causal: "Cause-effect validation; common methods: experiment and A/B testing."
  data_types:
    primary_data:
      definition: "Data collected directly for the current objective."
      examples: ["Survey", "Interview", "A/B test"]
      tradeoff: "High relevance; higher time and cost."
    secondary_data:
      definition: "Existing data collected by external or prior sources."
      examples: ["Industry report", "Google Trends", "Government statistics"]
      tradeoff: "Fast and cheap; may be outdated or misaligned."
  six_step_process:
    1_define_problem_and_objectives: "Specify what must be known and which decision it will support."
    2_design_methodology: "Choose exploratory/descriptive/causal and qualitative/quantitative design."
    3_collect_data: "Gather data via survey, interview, observation, experiment, or digital analytics."
    4_analyze_data: "Apply statistical, thematic, or AI-assisted analysis."
    5_present_findings: "Convert findings into report, dashboard, and recommendation set."
    6_decide_and_act: "Translate findings into marketing actions."
  method_stack:
    qualitative:
      in_depth_interview: "1:1 motivation and pain-point discovery."
      focus_group: "Small-group concept and perception exploration."
      ethnography: "Behavior observation in natural context."
      netnography: "Online community and conversation analysis."
    quantitative:
      survey: "Standardized attitude, preference, and satisfaction measurement."
      experiment: "Controlled causal testing; includes A/B testing."
      panel_data: "Repeated observation of the same customer cohort over time."
      big_data_analytics: "Large-scale predictive and pattern analysis."
  digital_research_tools:
    google_analytics: "Traffic, conversion, and user-flow analysis."
    google_trends: "Search-interest and seasonality detection."
    meta_audience_insights: "Audience demographic and interest profiling."
    semrush_ahrefs: "Competitor, keyword, and SEO research."
    surveymonkey_typeform: "Online survey deployment."
    hotjar_clarity: "Heatmap and session-recording UX research."
    brandwatch_sprout: "Social listening and sentiment tracking."
    ai_tools: "Insight synthesis and report summarization."
  traditional_vs_digital:
    speed: "Traditional: weeks-months; Digital: hours-days."
    cost: "Traditional: high; Digital: low-to-medium."
    sample_size: "Traditional: hundreds-thousands; Digital: millions+."
    data_quality_pattern: "Traditional: controlled; Digital: broad but messy."
    real_time_capability: "Traditional: low; Digital: live dashboard capable."
    bias_risks: ["Traditional: survey bias, leading questions", "Digital: selection bias, bot traffic"]
  decision_rules:
    revealed_preference_priority: "Observed behavior usually outranks self-reported preference."
    continuity_principle: "Research is continuous capability, not one-off project."
  strengths:
    - "Supports data-driven decisions and risk reduction."
    - "Improves customer and competitor understanding."
    - "Validates ideas before major investment."
    - "Enables continuous performance tracking."
    - "Improves trend detection and prediction."
  limitations:
    - "Can slow decisions when overextended."
    - "High-quality research can be expensive."
    - "Excess data can create analysis paralysis."
    - "Poor input data produces misleading insight."
    - "Historical data does not guarantee future behavior."
    - "Stated preference can diverge from revealed preference."

integrated_marketing_communications_imc:
  definition: "Planning, execution, and evaluation of coordinated communications so all channels deliver one consistent message to the target audience."
  core_principle: "One voice, one look, one message; channel-specific execution."
  imc_mix:
    advertising: "Mass reach and controlled message delivery."
    pr_publicity: "Credibility and earned attention generation."
    sales_promotion: "Short-term action trigger."
    personal_selling: "High-touch objection handling for high-value or B2B sales."
    direct_marketing: "Targeted and personalized response generation."
    digital_social: "Real-time interaction, community, and virality."
    content_marketing: "Education, SEO, and long-term trust building."
    sponsorship_events: "Experience-based brand association."
    influencer: "Authentic reach via creator trust transfer."
  peso_model:
    paid: ["Ads", "Sponsored content"]
    earned: ["PR", "Word of mouth", "Reviews"]
    shared: ["Social media", "UGC"]
    owned: ["Website", "Blog", "Email", "App"]
  planning_process:
    1_target_audience: "Translate STP into audience definition and persona."
    2_objectives: "Set communication objective by funnel stage."
    3_key_message: "Choose one central message or big idea."
    4_creative_strategy: "Map insight -> big idea -> execution."
    5_channel_mix: "Select Paid + Owned + Earned + Shared combination."
    6_budget_allocation: "Match budget to objective and task."
    7_timeline_execution: "Synchronize channel launch and implementation sequence."
    8_measure_optimize: "Track KPIs and adjust cross-channel performance."
  dagmar_objectives:
    awareness: "Make the brand or offer known."
    comprehension: "Make the offer understood."
    conviction: "Build belief, preference, and intent."
    action: "Drive conversion, purchase, or lead submission."
  budget_allocation_methods:
    percentage_of_revenue: "Fixed share of revenue; simple, stable, less strategic."
    objective_task: "Budget derived from required outcomes and tasks; preferred."
    competitive_parity: "Spend relative to competitor intensity."
    affordable: "Spend only what cash allows; common in small firms and startups."
  strengths:
    - "Creates cross-channel synergy."
    - "Improves message consistency and recall."
    - "Reduces waste from conflicting communications."
    - "Aligns communications with customer journey instead of team silos."
    - "Supports cross-channel measurement and optimization."
    - "Builds trust through consistency."
  limitations:
    - "Complex to coordinate across teams, agencies, and channels."
    - "Organizational silos block integration."
    - "Cross-channel attribution is difficult."
    - "Planning cycle can be slow."
    - "Requires central orchestration ownership."
    - "Over-standardization can reduce channel flexibility."

product_life_cycle_plc:
  definition: "Model describing revenue and profit evolution from product development through market exit."
  stages:
    development:
      economics: "No sales; development cost only."
      objective: "Build and validate the offer before launch."
    introduction:
      economics: "Low sales; profit often negative."
      customers: "Innovators."
      objective: "Build awareness and trial."
      mix_guidelines:
        product: "Basic version focused on core benefit."
        price: "Use skimming or penetration depending on adoption strategy."
        place: "Selective distribution."
        promotion: "Heavy awareness, demo, PR, seeding, influencer education."
    growth:
      economics: "Rapid sales and profit increase."
      customers: ["Early Adopters", "Early Majority"]
      objective: "Maximize share while differentiating from new entrants."
      mix_guidelines:
        product: "Improve features and add variants."
        price: "Maintain or reduce slightly to widen market."
        place: "Expand channels and geography."
        promotion: "Brand building plus differentiation."
    maturity:
      economics: "Peak sales; profit pressure from competition."
      customers: "Late Majority."
      objective: "Defend share and maximize profit."
      mix_guidelines:
        product: "Refresh, diversify, or extend the line."
        price: "Compete on price and promotions selectively."
        place: "Intensive distribution and omnichannel coverage."
        promotion: "Loyalty, CRM, and share defense."
    decline:
      economics: "Sales and profit fall."
      customers: "Laggards."
      objective: "Harvest, maintain, divest, or discontinue."
      mix_guidelines:
        product: "Prune weak variants and retain core demand pockets."
        price: "Clear inventory or preserve niche pricing."
        place: "Narrow distribution footprint."
        promotion: "Cut spend and target loyal residual users."
  maturity_extension_strategies:
    market_modification: "Find new segments, usage occasions, or frequency drivers."
    product_modification: "Upgrade quality, features, or style."
    marketing_mix_modification: "Adjust price, channel, or promotion model."
  decline_strategy_options:
    maintain: "Hold position and wait for weaker rivals to exit."
    harvest: "Cut investment and extract remaining cash flow."
    divest: "Sell the business or brand."
    discontinue: "Terminate the product."
  stage_diagnostics:
    sales_growth: "Introduction <10%; Growth >20%; Maturity 0-5%; Decline negative."
    market_share_pattern: "Low -> rising -> stable -> falling."
    competitor_pattern: "Few -> increasing -> peak intensity -> exit."
    margin_pattern: "Negative -> rising -> peak then pressured -> low or negative."
  technology_adoption_curve:
    innovators: "2.5%"
    early_adopters: "13.5%"
    early_majority: "34%"
    late_majority: "34%"
    laggards: "16%"
    the_chasm: "Gap between Early Adopters and Early Majority where many tech products fail."
  strengths:
    - "Simple strategic planning lens."
    - "Maps marketing mix changes to lifecycle stage."
    - "Supports product portfolio allocation."
    - "Helps anticipate next-stage resource needs."
    - "Useful for deciding where to invest or cut."
  limitations:
    - "Can become self-fulfilling if managers prematurely declare decline."
    - "Not every product follows a clean S-curve."
    - "Stage boundaries are hard to identify precisely."
    - "Stage duration is unpredictable."
    - "Scope ambiguity: product, brand, or category."
    - "Disruption can collapse the curve abruptly."

marketing_mix_4c_digital:
  definition: "Marketing 4.0 reinterpretation of the mix from seller control toward peer-to-peer, platform, and community dynamics."
  model_lineage:
    lauterborn_customer_4c: ["Customer Solution", "Customer Cost", "Convenience", "Communication"]
    kotler_marketing_4_0_4c: ["Co-creation", "Currency", "Communal Activation", "Conversation"]
  4p_to_4c_shift:
    product_to_co_creation: "Customers participate in ideation, testing, and customization."
    price_to_currency: "Price becomes dynamic and context-responsive."
    place_to_communal_activation: "Distribution shifts toward platform-enabled peer-to-peer access."
    promotion_to_conversation: "Broadcast promotion is replaced by multi-directional dialogue."
  components:
    co_creation:
      definition: "Brand and customer jointly shape the offer."
      mechanisms: ["Crowdsourcing", "Public beta testing", "Open design", "Configurable modules"]
    currency:
      definition: "Flexible pricing adjusted by real-time demand context."
      formula: "Price = f(Demand, Supply, Time, User Profile)"
      applications: ["Ride-hailing surge pricing", "Airfare/hotel dynamic pricing", "SaaS pay-as-you-go"]
    communal_activation:
      definition: "Community assets and peer networks replace fully owned distribution."
      applications: ["Sharing economy platforms", "Social commerce", "Peer-to-peer matching"]
    conversation:
      definition: "Brand meaning is co-created through two-way and many-to-many dialogue."
      applications: ["Online communities", "UGC", "Ratings and reviews", "Social discussion threads"]
  strategic_guardrails:
    openness_vs_control: "Open participation requires firm control over brand core, safety, and quality gates."
    pricing_integrity: "Dynamic pricing requires transparency, privacy protection, and ethical constraints."
    integration_with_4p_7p: "Digital 4C extends rather than replaces operational 4P/7P foundations."
    social_listening: "Real-time monitoring is mandatory to detect emerging conversation risk."
  strengths:
    - "Higher customer centricity through direct participation."
    - "Better yield management via flexible pricing."
    - "Strong network effects and lower acquisition cost potential."
    - "Deeper loyalty through co-ownership psychology."
  limitations:
    - "Lower message control in open communities."
    - "High operational and data-science complexity."
    - "Large platform and security investment requirement."
    - "Ethical and privacy backlash risk."

marketing_case_studies:
  - company: "Netflix"
    industry: "Streaming / Entertainment"
    key_decision: "Built research around behavioral tracking, continuous A/B testing, and predictive analytics; greenlit House of Cards without pilot."
    outcome: "Improved personalization, optimized thumbnail CTR, and de-risked original-content expansion."
    lesson: "Behavioral data and continuous experimentation outperform intuition-only decisions."
  - company: "Coca-Cola"
    industry: "Beverages"
    key_decision: "Turned packaging into the campaign core with personalized names across coordinated IMC channels."
    outcome: "Sales lifted, UGC surged, and the campaign scaled globally."
    lesson: "One big idea becomes stronger when product, paid, earned, shared, and owned media align."
  - company: "Apple iPhone"
    industry: "Consumer Electronics"
    key_decision: "Extended maturity through line extensions, feature upgrades, trade-in programs, and service bundling."
    outcome: "Revenue resilience despite slower unit growth and a maturing smartphone category."
    lesson: "PLC maturity can be prolonged by market, product, and marketing-mix modification."
  - company: "LEGO"
    industry: "Toys"
    key_decision: "Opened ideation through LEGO Ideas with community voting and internal approval gates."
    outcome: "Created commercially successful fan-originated sets and revived community energy."
    lesson: "Co-creation works when open contribution is paired with expert screening."
  - company: "Xiaomi"
    industry: "Consumer Electronics"
    key_decision: "Used Mi Fan feedback loops, weekly updates, and flash-sale direct distribution."
    outcome: "Scaled rapidly with strong community advocacy and minimal mass-media dependence."
    lesson: "Communal activation and conversation can substitute for expensive traditional distribution and promotion."
  - company: "Quirky"
    industry: "Consumer Hardware"
    key_decision: "Relied on crowd-selected invention ideas without sufficient feasibility and commercialization filters."
    outcome: "Inventory, cost, and demand mismatch exhausted cash and ended in bankruptcy."
    lesson: "Co-creation without viability gates destroys economics."
  - company: "Uber"
    industry: "Ride-hailing"
    key_decision: "Allowed surge-pricing logic to operate during crisis events."
    outcome: "Backlash framed dynamic pricing as exploitative and unethical."
    lesson: "Currency models require ethics controls and emergency kill switches."
  - company: "Biti's Hunter"
    industry: "Footwear"
    key_decision: "Re-segmented toward urban youth and repositioned as accessible streetwear."
    outcome: "Brand rejuvenation and strong sell-through followed the repositioning."
    lesson: "STP succeeds when product, price, place, and promotion reinforce the new position."
  - company: "Soya Garden"
    industry: "F&B"
    key_decision: "Scaled a premium soy-beverage concept around an overstated healthy-lifestyle segment."
    outcome: "Low repeat demand and high fixed costs forced major store closures."
    lesson: "Interest in a category is not proof of willingness to pay at premium price."
  - company: "Starbucks"
    industry: "Coffee Retail"
    key_decision: "Integrated 7P around the Third Place experience."
    outcome: "Premium pricing held because service, space, process, and product formed a coherent system."
    lesson: "Premium brands need consistency across all service-mix elements, not product alone."
  - company: "The Coffee House / Ten Coffee"
    industry: "Coffee Retail"
    key_decision: "Shifted an experience-led brand into kiosk and grab-and-go format while keeping premium pricing logic."
    outcome: "Value perception broke and the kiosk experiment was withdrawn."
    lesson: "Removing core physical evidence and service warmth requires a full 7P reset."
  - company: "Spotify"
    industry: "Music Streaming"
    key_decision: "Reduced churn through personalization and family-plan lock-in."
    outcome: "Retention improved and CLV economics strengthened materially."
    lesson: "Retention levers can create larger enterprise value than acquisition volume alone."
  - company: "MoviePass"
    industry: "Entertainment Subscription"
    key_decision: "Priced unlimited cinema access below variable ticket cost."
    outcome: "Subscriber growth accelerated losses and ended in bankruptcy."
    lesson: "Growth is fatal when contribution margin is structurally negative."
  - company: "Apple"
    industry: "Consumer Technology"
    key_decision: "Built brand meaning from salience to resonance through design, ecosystem, and identity signaling."
    outcome: "Created extreme loyalty and reduced price sensitivity."
    lesson: "Brand resonance converts functional products into identity assets."
  - company: "New Coke"
    industry: "Beverages"
    key_decision: "Replaced the classic formula based on blind taste-test results."
    outcome: "Consumer revolt forced a rapid return of Coca-Cola Classic."
    lesson: "Research that ignores emotional brand equity misreads the real product."
  - company: "Dropbox"
    industry: "Cloud Storage"
    key_decision: "Embedded double-sided referral rewards directly into the product flow."
    outcome: "User growth accelerated organically while effective CAC collapsed."
    lesson: "Product-led virality beats paid acquisition when incentive and friction design are correct."
  - company: "Quibi"
    industry: "Mobile Video Streaming"
    key_decision: "Blocked screenshots and clip-sharing to protect content control."
    outcome: "Conversation and sharing were suppressed, churn spiked, and the platform shut down."
    lesson: "Digital products that block social circulation weaken their own discovery loop."
  - company: "Airbnb"
    industry: "Hospitality Platform"
    key_decision: "Activated idle community assets through P2P matching, review systems, and dynamic pricing."
    outcome: "Scaled global lodging supply without owning rooms."
    lesson: "Communal activation plus trust infrastructure can outscale asset-heavy incumbents."
  - company: "Pepsi Kendall Jenner"
    industry: "Beverages"
    key_decision: "Used protest imagery in a major ad to trigger positive social conversation."
    outcome: "Social backlash forced ad withdrawal and public apology."
    lesson: "Conversation cannot be scripted when the cultural read is wrong."

user_generated_content_ugc:
  definition: "Content created by customers or consumers rather than by the brand."
  common_formats:
    - "Reviews and comments"
    - "Real-world photos and videos"
    - "Blog or forum posts"
    - "Podcast discussions"
    - "Livestream mentions"
  strategic_value:
    authenticity: "Peer-created proof is typically trusted more than polished brand advertising."
    conversion_support: "Product-page social proof reduces purchase anxiety and lifts conversion confidence."
    cost_efficiency: "Community-created assets reduce production burden while increasing output volume."
    seo_lift: "Reviews and discussions generate natural keyword coverage and search visibility."
  role_comparison:
    influencer:
      primary_value: "Reach borrowed from the creator's own audience."
      publishing_channel: "Creator-owned channel."
    ugc_creator:
      primary_value: "Native-looking creative assets for brand reuse."
      publishing_channel: "Brand-owned channel after creator delivery."
  activation_tactics:
    branded_hashtag: "Create a discoverable submission mechanic."
    rewards_and_contests: "Offer vouchers or prizes for high-quality contributions."
    website_integration: "Embed customer photos, reviews, or social posts on product pages."
  governance:
    permission_and_credit: "Obtain permission and credit the original creator before reposting."

