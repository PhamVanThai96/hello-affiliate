- id: m02_value_area
  module: m02
  name_vi: POC, Value Area (VAH/VAL) bằng mở rộng từ POC
  name_en: POC and Value Area expansion algorithm
  expression_latex: POC = \arg\max_b V_b;\quad \text{mở rộng } [l, r] \text{ từ } POC \text{ cho tới } \frac{\sum_{b=l}^{r}
    V_b}{\sum V} \ge 0.70
  expression_python: "def value_area(bin_volume, edges, pct=0.70):\n    n = len(bin_volume); poc = max(range(n), key=lambda\
    \ i: (bin_volume[i], -i))\n    left = right = poc; inc = bin_volume[poc]; tot = sum(bin_volume)\n    while tot > 0 and\
    \ inc / tot < pct and (left > 0 or right < n - 1):\n        lv = bin_volume[left - 1] if left > 0 else -1.0\n        rv\
    \ = bin_volume[right + 1] if right < n - 1 else -1.0\n        if rv >= lv: right += 1; inc += bin_volume[right]\n    \
    \    else: left -= 1; inc += bin_volume[left]\n    return {'poc': (edges[poc] + edges[poc + 1]) / 2, 'vah': edges[right\
    \ + 1], 'val': edges[left], 'pct': inc / tot}\n"
  excel: Không có hàm sẵn; dùng cột POC = INDEX(giá, MATCH(MAX(vol), vol, 0)) rồi cộng dần bin lớn hơn hai bên thủ công.
  variables:
  - bin_volume
  - edges
  - pct
  when_to_use: Xác định vùng giá trị và biên VAH/VAL của một cửa sổ quan sát.
