- id: m02_vwap_sigma
  module: m02
  name_vi: Độ lệch chuẩn VWAP có trọng số khối lượng (dải sigma)
  name_en: Volume-weighted standard deviation of VWAP (running)
  expression_latex: \sigma_t = \sqrt{\frac{\sum_{i \le t} V_i\,(TP_i - VWAP_i)^2}{\sum_{i \le t} V_i}},\quad Band_k = VWAP_t
    \pm k\,\sigma_t
  expression_python: "def vwap_sigma(tp, vol):\n    cv = ctp = cd = 0.0; out = []\n    for t, v in zip(tp, vol):\n       \
    \ cv += v; ctp += t * v; vw = ctp / cv\n        cd += (t - vw) ** 2 * v\n        out.append((vw, (cd / cv) ** 0.5))\n\
    \    return out\n"
  excel: 'Dùng cột phụ: Dev2Vol = (TP - VWAP_t)^2 * Vol, cộng dồn rồi chia cộng dồn Vol, lấy căn.'
  variables:
  - tp
  - vol
  - k
  when_to_use: Vẽ dải quanh VWAP trong ngày để đánh dấu vùng 'quá đà'.
- id: m02_weighted_skew_kurt
  module: m02
  name_vi: Skewness và excess kurtosis có trọng số khối lượng của profile
  name_en: Volume-weighted skewness and excess kurtosis of the profile
  expression_latex: w_b = \frac{V_b}{\sum V},\ \mu = \sum w_b\, b,\ \sigma^2 = \sum w_b (b-\mu)^2,\ S = \sum w_b \left(\frac{b-\mu}{\sigma}\right)^3,\
    K = \sum w_b \left(\frac{b-\mu}{\sigma}\right)^4 - 3
  expression_python: '(lambda w, i: (lambda m: (lambda s: (m, s, sum(w * ((i - m) / s) ** 3), sum(w * ((i - m) / s) ** 4)
    - 3.0))((sum(w * (i - m) ** 2)) ** 0.5))(sum(i * w)))(np.array(bin_volume, float) / np.sum(bin_volume), np.arange(len(bin_volume)))

    '
  excel: 'Dùng SUMPRODUCT: mu = SUMPRODUCT(idx,w); sigma = SQRT(SUMPRODUCT(w,(idx-mu)^2)); S = SUMPRODUCT(w,((idx-mu)/sigma)^3);
    K = SUMPRODUCT(w,((idx-mu)/sigma)^4)-3.'
  variables:
  - bin_volume
  - w
  when_to_use: Phân loại hình D/P/b một cách tái lập được.
