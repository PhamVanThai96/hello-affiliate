- id: m01_trend_score
  module: m01
  name_vi: Điểm xu hướng thuần, điều chỉnh chế độ và nhóm
  name_en: Raw trend score, regime-signed score, bucket
  expression_latex: raw=\frac{clip(\frac{C/MA_{50}-1}{0.10})+clip(\frac{ROC_{20}}{0.10})+clip(\frac{ROC_{60}}{0.20})+2(pos_{60}-0.5)}{4};\
    score=raw\cdot(\pm1);\ bucket\in\{0..4\}\ \text{theo biên}\ [-1.01,-0.45,-0.15,0.15,0.45,1.01]
  expression_python: '(lambda cl: (cl(c_ma50/0.10) + cl(roc20/0.10) + cl(roc60/0.20) + (pos60-0.5)*2)/4)(lambda x: max(-1,
    min(1, x)))'
  excel: =(MEDIAN(-1,1,x1)+MEDIAN(-1,1,x2)+MEDIAN(-1,1,x3)+(pos60-0.5)*2)/4  (x1=(C/MA50-1)/0.10; x2=ROC20/0.10; x3=ROC60/0.20)
  variables:
  - c_ma50
  - roc20, roc60
  - pos60
  when_to_use: Tính điểm để tra bảng tần suất hiệu chuẩn. Chế độ UP giữ dấu, chế độ DOWN đảo dấu (hồi quy).
