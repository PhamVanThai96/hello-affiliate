- id: m01_atr_pct
  module: m01
  name_vi: ATR(14) và ATR phần trăm
  name_en: Average True Range and ATR%
  expression_latex: TR_t=\max(H_t-L_t,\ |H_t-C_{t-1}|,\ |L_t-C_{t-1}|);\quad ATR=\frac{1}{n}\sum_{i=t-n+1}^{t}TR_i;\quad ATR\%=\frac{ATR}{C_t}
  expression_python: float(np.mean([max(h[i]-l[i], abs(h[i]-c[i-1]), abs(l[i]-c[i-1])) for i in range(len(h)-n, len(h))])
    / c[-1])
  excel: =AVERAGE(TR_range)/Close  (TR = MAX(H-L, ABS(H-Cprev), ABS(L-Cprev)))
  variables:
  - h, l, c
  - n
  when_to_use: Đo độ rộng biến động thường ngày để dựng vùng biến động, mức cắt lỗ theo ATR và kích thước vị thế.
- id: m01_rsi_wilder
  module: m01
  name_vi: RSI(14) làm trơn Wilder
  name_en: Relative Strength Index (Wilder smoothing)
  expression_latex: RS=\frac{AvgGain}{AvgLoss};\quad RSI=100-\frac{100}{1+RS};\quad Avg_t=\frac{13\cdot Avg_{t-1}+x_t}{14}
  expression_python: '(lambda d: float((100 - 100/(1 + d.clip(lower=0).ewm(alpha=1/14, min_periods=14, adjust=False).mean()
    / (-d.clip(upper=0)).ewm(alpha=1/14, min_periods=14, adjust=False).mean())).iloc[-1]))(pd.Series(closes).diff())'
  excel: 'Tính AvgGain/AvgLoss đệ quy: =(Prev*13+Gain)/14; RSI =100-100/(1+AvgGain/AvgLoss)'
  variables:
  - closes
  when_to_use: Đo độ mạnh tương đối của các phiên tăng so với phiên giảm; trong công cụ chỉ dùng làm thông tin và bộ lọc nhãn
    (RSI < 65).
- id: m01_mfi
  module: m01
  name_vi: Chỉ số dòng tiền MFI(14)
  name_en: Money Flow Index
  expression_latex: TP=\frac{H+L+C}{3};\ MF=TP\cdot V;\ MFR=\frac{\sum_{TP\uparrow}MF}{\sum_{TP\downarrow}MF};\ MFI=100-\frac{100}{1+MFR}
  expression_python: '(lambda tp: 100 - 100/(1 + sum(tp[i]*v[i] for i in range(1, len(tp)) if tp[i] > tp[i-1]) / sum(tp[i]*v[i]
    for i in range(1, len(tp)) if tp[i] < tp[i-1])))([(a+b+d)/3 for a, b, d in zip(h, l, c)])'
  excel: =100-100/(1+SUMIF(TPup,MF)/SUMIF(TPdown,MF)) trên cửa sổ 14 phiên
  variables:
  - h, l, c, v
  when_to_use: Mô tả dòng tiền vào/ra có tính khối lượng (RSI có trọng số khối lượng).
- id: m01_bollinger
  module: m01
  name_vi: Dải Bollinger (20, 2)
  name_en: Bollinger Bands
  expression_latex: Mid=SMA_{20}(C);\ Upper=Mid+2\sigma_{20};\ Lower=Mid-2\sigma_{20};\ \%B=\frac{C-Lower}{Upper-Lower}
  expression_python: '(lambda s: (float(s.mean()), float(s.mean()+2*s.std()), float(s.mean()-2*s.std()), float((s.iloc[-1]-(s.mean()-2*s.std()))/(4*s.std()))))(pd.Series(closes).tail(20))'
  excel: =AVERAGE(range) +/- 2*STDEV.S(range)
  variables:
  - closes
  when_to_use: Mô tả độ rộng dải biến động và vị trí giá trong dải (squeeze khi dải hẹp).
- id: m01_channel_offsets
  module: m01
  name_vi: 'Kênh hồi quy v3: đường giữa và biên phân vị'
  name_en: Recent-regime regression channel with quantile edges
  expression_latex: C_t\approx a+bt;\ r_t^{H}=H_t-(a+bt);\ r_t^{L}=L_t-(a+bt);\ Upper=a+bt+Q_{0.99}(r^H);\ Lower=a+bt+Q_{0.01}(r^L)
  expression_python: '(lambda fit: (float(np.quantile(np.array(high)-fit, q)), float(np.quantile(np.array(low)-fit, 1-q))))(np.polyval(np.polyfit(np.arange(len(close)),
    close, 1), np.arange(len(close))))'
  excel: =SLOPE/INTERCEPT cho đường giữa; biên = PERCENTILE.INC(High-fit, 0.99) và PERCENTILE.INC(Low-fit, 0.01)
  variables:
