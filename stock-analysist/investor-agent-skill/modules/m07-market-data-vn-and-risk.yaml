pitfalls:
  - "Hard-code lãi suất, Rf, ERP, P/E thị trường có thời hạn; luôn dùng ảnh chụp có ngày."
  - "Đưa tín hiệu SHORT hoặc bán khống cho cổ phiếu cá nhân VN."
  - "Coi nhãn MUA/BÁN theo bộ lọc (MA200, kênh, RSI) là lời khuyên hay dự báo hướng; kiểm chứng cho thấy gần như không dự báo được."
  - "Dùng mẫu nến, hộp tích lũy, hỗ trợ/kháng cự cực trị làm tín hiệu vào/ra chắc chắn (kiểm chứng không ủng hộ)."
  - "Bắt đáy; trung bình giá xuống khi giá dưới MA200."
  - "Đặt stop mà không tính khả năng kịch sàn, gap, T+2."
  - "Coi stop luôn khớp đúng giá."
  - "Quên làm tròn xuống lô 100 hoặc quên bước giá khi đặt lệnh."
  - "Dùng margin tăng tỷ trọng mà không tính giá xử lý margin và lãi vay."
  - "Đa dạng hóa giả: nhiều mã cùng ngành tương quan cao."
  - "Tin dữ liệu yfinance mà không kiểm tra độ trễ/thiếu/điều chỉnh; dùng dữ liệu intraday mã .VN."
  - "Gọi rổ đại diện là VN-Index."
  - "Ước lượng p và b từ mẫu nhỏ rồi dùng Kelly đầy đủ."
  - "Quên chi phí giao dịch/thuế và trượt giá khi tính hòa vốn."
  - "Giả vờ chắc chắn và thiếu disclaimer, nhãn độ tin cậy, mức vô hiệu hóa."
sme_vn_guidance:
  - "Chủ SME không nên đưa vốn lưu động hoặc tiền trả lương/thuế vào cổ phiếu hay margin; tách vốn nhàn rỗi sau quỹ dự phòng (xem m06)."
  - "Tài khoản chứng khoán: mở ở công ty chứng khoán có giấy phép; phí giao dịch, phí margin, danh mục margin khác nhau - cần tra bảng phí hiện hành của từng công ty (cần xác nhận)."
  - "Thuế: hiện thường nhắc thuế thu nhập cá nhân 0,1% giá trị bán cổ phiếu; cổ tức bằng tiền/cổ phiếu có quy định riêng - cần xác nhận với cơ quan thuế/công ty chứng khoán."
  - "Nếu doanh nghiệp (pháp nhân) đầu tư chứng khoán thì hạch toán và thuế khác cá nhân - cần tham vấn kế toán (cần xác nhận)."
  - "Dùng Google Sheets: ô nhập vốn, r%, entry, stop -> tự tính số cổ phiếu, R:R, tỷ trọng, tổng rủi ro mở; thêm ô 'ngày dữ liệu' cho mọi thông số thị trường."
  - "Bắt đầu với vị thế nhỏ, rủi ro 0,5%-1% vốn mỗi lệnh khi chưa có sổ ghi chép kết quả."
  - "Ghi nhật ký giao dịch: lý do, kịch bản, stop, kết quả; tự ước lượng p và R:R thật sau tối thiểu vài chục lệnh trước khi tin Kelly/kỳ vọng."
case_lessons:
  - name: "Kiểm chứng ngoài mẫu công cụ phân tích kỹ thuật trên 12 cổ phiếu Việt Nam"
    type: "sme"
    setup: "Tại mỗi ngày T chỉ dùng dữ liệu đến T, chấm bằng diễn biến thật 5/10/20 phiên sau; tách train (trước 2020) và test (từ 2020); 12 mã MSN, VRE, HPG, VNM, FPT, MWG, STB, VCB, SSI, PNJ, TCB, ACB; so với mức nền."
    key_calculations:
      - "Mũi tên cũ đúng ~47,6% ở 10 phiên (kém đồng xu)"
      - "Nhận định v3 đúng ~52,0% trên 1.576 ngày vs nền 50,8%; tỷ lệ đúng từng năm 19%-86%"
      - "Vùng biến động 80% phủ thực tế 82,7%"
      - "Kênh cũ chứa 31%, kênh v3 chứa 77%"
      - "Phá vỡ giả: 57-67% quay lại trong kênh trong 5 phiên"
      - "Mua cạnh dưới hộp vượt nền -1,11% / -0,77%; bắt đáy nến vượt nền -0,74% / -0,82%"
    lesson: "Giá trị của công cụ nằm ở đo biên độ rủi ro và kỷ luật quản trị vị thế, không phải ở dự báo hướng. Vì vậy agent trình bày kịch bản, vùng biến động, stop, R:R và độ tin cậy thay vì khuyến nghị."
    data_reliability: "verified"
  - name: "Minh họa vị thế 1% rủi ro: thua nhiều lần vẫn sống sót"
    type: "illustrative"
    setup: "Vốn 500 triệu; rủi ro 1% mỗi lệnh; chuỗi 10 lệnh thua liên tiếp (giả định minh họa)."
    key_calculations:
      - "Mỗi lệnh thua mất 1% vốn hiện tại: sau 10 lệnh vốn còn 0,99^10 = 0,9044, tức -9,56%"
      - "Nếu rủi ro 10% mỗi lệnh: sau 10 lệnh còn 0,9^10 = 0,3487, tức -65,1%"
      - "Cần lãi 1/0,3487 - 1 = 186,8% để hồi phục"
    lesson: "Kích thước vị thế nhỏ là cơ chế sống sót khi p thực thấp hơn kỳ vọng; vì kiểm chứng cho thấy lợi thế dự báo rất mỏng nên kỷ luật quan trọng hơn độ chính xác dự báo."
    data_reliability: "illustrative"
  - name: "Margin và kẹt kịch sàn"
    type: "failure"
    setup: "Giả định nhà đầu tư vay 50% giá trị vị thế, ngưỡng xử lý 30% vốn tự có (số minh họa), cổ phiếu HOSE biên 7%."
    key_calculations:
      - "Giá xử lý = 21.429 khi mua ở 30.000: cần giảm 28,6%"
      - "Kịch sàn 4 phiên liên tiếp: 0,93^4 = 0,748, tức giảm 25,2% - sát ngưỡng"
    lesson: "Biên độ 7% khiến lỗ vượt dần qua nhiều phiên và có thể không thoát được; đòn bẩy làm vốn tự có mỏng nhanh. Bài học LTCM trong m08 áp dụng ở quy mô nhỏ."
    data_reliability: "illustrative"
worked_examples:
  - name: "Kế hoạch vị thế đầy đủ cho một kịch bản giả định"
    inputs: {C: 500000000, r: 1, E: 50000, S: 46500, TP: 57000, lot: 100, fee: 0.15, tax_sell: 0.1}
    steps:
      - "Khoảng cách stop = 50.000 - 46.500 = 3.500 (7,0% - đúng trần)"
      - "N = floor(5.000.000 / 3.500 / 100) x 100 = 1.400 cp; giá trị 70 triệu = 14% vốn"
      - "R:R = (57.000 - 50.000) / 3.500 = 2,0; p hòa vốn = 33,3%"
      - "Chi phí vòng 0,40% giá trị: p hòa vốn thực tế cao hơn chút do phí"
      - "Kết luận dạng kịch bản: đạt bộ lọc R:R tối thiểu, stop đúng trần 7%, kèm nhãn độ tin cậy thấp-trung bình và disclaimer"
    result: "1.400 cp, R:R 2,0, lỗ tối đa khoảng 4,9 triệu (0,98% vốn), chưa tính phí và rủi ro gap"
  - name: "Stop theo ATR và kích thước vị thế"
    inputs: {C: 300000000, r: 0.75, E: 32000, ATR: 900, k: 2, lot: 100}
    steps:
      - "S = 32.000 - 2 x 900 = 30.200"
      - "Khoảng cách = 1.800 (5,6%)"
      - "Rủi ro cho phép = 300.000.000 x 0,75% = 2.250.000"
      - "N thô = 2.250.000 / 1.800 = 1.250 cp; làm tròn xuống bội số 100 = 1.200 cp (1.250 không phải bội số của 100)"
      - "Giá trị = 1.200 x 32.000 = 38,4 triệu = 12,8% vốn"
    result: "Stop 30.200; mua 1.200 cp; tỷ trọng 12,8% vốn (giả định minh họa)"
  - name: "Kỳ vọng, hòa vốn và Kelly thận trọng"
    inputs: {p: 0.45, W: 2, L: 1, lam: 0.25}
    steps:
      - "Kỳ vọng = 0,45 x 2 - 0,55 x 1 = +0,35R"
      - "p hòa vốn với RR=2 là 33,3%; p=0,45 vượt 11,7 điểm phần trăm"
      - "f* = 0,45 - 0,55/2 = 0,175; 1/4 Kelly = 4,375%"
      - "Phản biện: kiểm chứng thực tế cho tỷ lệ đúng 46-59% với nền 50-53% - nếu p thật 0,33 thì kỳ vọng = 0,33 x 2 - 0,67 = -0,01R (gần 0)"
      - "Trần rủi ro thực tế vẫn dùng 1-2% mỗi lệnh dù Kelly cao hơn"
    result: "+0,35R mỗi lệnh nếu p=0,45; p thật rất nhạy; Kelly 1/4 = 4,4% chỉ là trần tham chiếu"
  - name: "Margin: giá xử lý và đệm giảm giá"
    inputs: {L: 150000000, N: 10000, m: 0.3, P0: 30000}
    steps:
      - "P_call = 150.000.000 / (10.000 x 0,7) = 21.428,6"
      - "Đệm giảm = 1 - 21.428,6/30.000 = 28,6%"
      - "4 phiên kịch sàn HOSE liên tiếp: 30.000 x 0,93^4 = 22.442 - chỉ còn đệm khoảng 4,5% trước ngưỡng"
    result: "Giá xử lý khoảng 21.429; 4 phiên kịch sàn đưa giá về ~22.442, sát ngưỡng (giả định minh họa)"
  - name: "Bảng ảnh chụp thị trường (mẫu, KHÔNG phải số thật)"
    inputs: {Rf_nominal: 5.0, CPI: 3.5, ERP: 7.0, beta: 1.2}
    steps:
      - "Dòng bắt buộc: giá trị, nguồn, ngày dữ liệu, ngày tra, độ tin cậy, hạn dùng"
      - "Giả định minh họa: Re = 5,0 + 1,2 x 7,0 = 13,4%"
      - "Rf thực = (1,05 / 1,035 - 1) = 1,45%"
      - "Chạy độ nhạy: Re từ 12,4% đến 14,4% khi ERP ±1%/beta ±0,1 (giả định)"
      - "Ghi chú: các số trên chỉ minh họa phương pháp; agent thật phải tra lại"
    result: "Re = 13,4% (giả định minh họa) kèm độ nhạy; mọi số thật phải đến từ lúc chạy"
practice_questions:
  - q: "Vốn 400 triệu, rủi ro 1% mỗi lệnh, mua ở 40.000, stop 37.000. Mua tối đa bao nhiêu cổ phiếu (lô 100)? Tỷ trọng?"
    a: "Rủi ro = 4.000.000; khoảng cách 3.000; N thô = 1.333; làm tròn 1.300 cp; giá trị 52 triệu = 13% vốn."
  - q: "R:R = 1,5. Win-rate tối thiểu để hòa vốn? Nếu win-rate thực 45%, kỳ vọng mỗi lệnh?"
    a: "p hòa vốn = 1/2,5 = 40%. Kỳ vọng = 0,45 x 1,5 - 0,55 = +0,125R."
  - q: "Lỗ 40% cần lãi bao nhiêu để về hòa vốn?"
    a: "1/0,6 - 1 = 66,7%."
  - q: "Người dùng muốn 'short' cổ phiếu HPG vì thấy xu hướng giảm. Agent trả lời thế nào?"
    a: "Cá nhân không bán khống cổ phiếu cơ sở (cần xác nhận); chỉ có thể không mua, giảm tỷ trọng hoặc đứng ngoài; có thể nêu kịch bản giảm và mức vô hiệu hóa; không khuyến nghị."
  - q: "Cần Rf để tính Re. Có được dùng một con số 'Rf = 4,58%' nhớ từ prompt cũ không?"
    a: "Không. Số có thời hạn; phải tra lợi suất TPCP 10 năm lúc chạy, ghi nguồn và ngày dữ liệu, đối chiếu hai nguồn."
  - q: "Vay 200 triệu, giữ 8.000 cổ phiếu, ngưỡng xử lý 30%. Giá xử lý? Nếu mua ở 50.000, đệm giảm?"
    a: "P_call = 200.000.000/(8.000 x 0,7) = 35.714; đệm = 1 - 35.714/50.000 = 28,6%."
  - q: "ATR 14 phiên = 1.500, giá vào 60.000, k=2. Stop và % khoảng cách? Có vượt trần 7%?"
    a: "S = 57.000; khoảng cách 5,0%; không vượt 7%."
  - q: "Kênh v3 chứa 77% các phiên kế tiếp. Giá đóng cửa vượt biên trên. Nên diễn giải thế nào?"
    a: "Không tự động là breakout: 57-67% trường hợp quay lại trong kênh trong 5 phiên (phá vỡ giả); nêu kịch bản breakout kèm khối lượng và xác nhận, và kịch bản phá vỡ giả."
  - q: "Người dùng hỏi 'nên mua STB hôm nay không và giá mục tiêu?'"
    a: "Không đưa lời khuyên hay giá mục tiêu chắc chắn. Đưa trạng thái có ngày, kịch bản, mức vô hiệu hóa, độ tin cậy và disclaimer; hỏi lại khẩu vị rủi ro, khung thời gian, tỷ trọng, có dùng margin không."
  - q: "5 mã đều là ngân hàng, mỗi mã rủi ro 1%. Rủi ro tổng là bao nhiêu?"
    a: "Về danh nghĩa 5%; nhưng vì tương quan cao nên hành xử như một vị thế rủi ro gần 5%: không có hiệu quả đa dạng hóa; cần giảm r% mỗi mã hoặc đa dạng ngành."
checklist:
  - "□ Đã xác định sàn của mã (HOSE/HNX/UPCoM) và biên độ giá tương ứng, đã ghi 'cần xác nhận' các quy định chưa kiểm tra"
  - "□ Không có tín hiệu SHORT; chỉ dùng 'không mua / giảm tỷ trọng / đứng ngoài'"
  - "□ Dữ liệu yfinance đã qua cổng chất lượng (đủ phiên, độ trễ, nhảy giá, khối lượng, giá điều chỉnh)"
  - "□ Không dùng dữ liệu trong ngày mã .VN làm kết luận"
  - "□ Nếu cần Rf/ERP/beta/lãi suất/P/E: đã lập ảnh chụp thị trường có nguồn và ngày dữ liệu; không hard-code"
  - "□ Đã chạy độ nhạy cho tham số phụ thuộc ảnh chụp"
  - "□ Stop đã tính (ATR hoặc cấu trúc), không vượt trần 7%, và có cảnh báo gap/kịch sàn/T+2"
  - "□ R:R, p hòa vốn, chi phí giao dịch đã tính"
  - "□ Kích thước vị thế theo r% vốn, làm tròn lô 100; kiểm tra tỷ trọng và tổng rủi ro mở"
  - "□ Đã xét tương quan/ngành; đa dạng hóa thật không phải giả"
  - "□ Nếu dùng margin: đã tính giá xử lý, đệm giảm giá, lãi vay"
  - "□ Đã xét quỹ dự phòng và vốn nhàn rỗi; hỏi lại khẩu vị rủi ro, khung thời gian, tỷ trọng nếu thiếu"
  - "□ Đầu ra là kịch bản kèm xác suất định tính/tần suất có nguồn, mức vô hiệu hóa, nhãn độ tin cậy, data_reliability"
  - "□ Không có giá mục tiêu chắc chắn hay lời khuyên mua/bán/giữ; có disclaimer"
  - "□ Công thức đã chạy python3 và số liệu minh họa gắn nhãn 'giả định minh họa'"
excel_google_sheets_templates:
  - "Sheet 'Position_Sizer': nhập C, r, E, S, lot -> N = ROUNDDOWN((C*r/100)/(E-S)/lot,0)*lot; tỷ trọng = N*E/C; lỗ tối đa = N*(E-S)."
  - "Sheet 'RR_Expectancy': nhập TP, E, S, p, phí -> R:R, p hòa vốn = 1/(1+RR), kỳ vọng = p*RR-(1-p), cảnh báo nếu R:R < 2 hoặc SL% > 7."
  - "Sheet 'Margin_Check': nhập L, N, m, P0 -> P_call = L/(N*(1-m)); đệm giảm = 1-P_call/P0; mô phỏng k phiên kịch sàn = P0*(1-b)^k."
  - "Sheet 'Market_Snapshot': cột Tham số | Giá trị | Đơn vị | Nguồn (URL) | Ngày dữ liệu | Ngày tra | Độ tin cậy | Hạn dùng; ô tô đỏ khi ngày tra quá hạn."
  - "Sheet 'Trade_Journal': ngày, mã, kịch bản, entry, stop, kích thước, kết quả theo R; tự tính p thực, R:R thực, kỳ vọng để so với giả định."
