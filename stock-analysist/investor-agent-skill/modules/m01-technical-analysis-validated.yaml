  - {metric: "Nhận định hiệu chuẩn v3 (10 phiên)", value: "đúng ~52,0% trên 1.576 ngày có nhận định; nền 'luôn tăng' 50,8%", context: "không khác biệt có ý nghĩa; xác suất theo nhóm dao động 47-59%", confidence: "high"}
  - {metric: "Bảng hiệu chuẩn hiện hành: p_up theo (chế độ|nhóm)", value: "UP: 49,2/46,5/51,3/50,7/55,2%; DOWN: 50,4/52,6/54,4/52,7/54,2%", context: "outlook_calibration.json, 48.083 mẫu, 15 mã, nền 0,5192; nhóm 0..4; n từ 1.663 đến 12.742", confidence: "medium"}
  - {metric: "Hệ số thông tin IC", value: "+0,10 (thị trường trên MA200); -0,13 (dưới MA200)", context: "đổi dấu theo chế độ, hiệu chuẩn không bền (đúng từng năm 19%-86%)", confidence: "medium"}
  - {metric: "Vùng biến động 80% (k = 0,974)", value: "phủ thực tế 82,7% ngoài mẫu", context: "ATR% x sqrt(h) x k; tương quan ATR% với |lợi suất tương lai| ~0,22", confidence: "high"}
  - {metric: "Kênh cũ vs kênh v3 chứa 10 phiên kế tiếp", value: "31% vs 77%; bề rộng 15-17% giá; hiệu quả 3,3 vs 5,8", context: "kênh cũ báo phá vỡ ~26% số ngày", confidence: "high"}
