  - {metric: "Giới hạn biên độ ngày", value: "HOSE +-7%, HNX +-10%, UPCoM +-15%; T+2", context: "ràng buộc thị trường VN", confidence: "high"}

pitfalls:
  - "Mua đáy vì nến búa/nhấn chìm: kiểm chứng cho vượt nền âm ~0,7-0,8%/10 phiên."
  - "Bán vì nến sao băng/nhấn chìm giảm ở vùng cao: giá vẫn tăng tiếp."
  - "Mua cạnh dưới hộp tích lũy hoặc ở vùng hỗ trợ >= 3 chạm: không tốt hơn ngẫu nhiên."
  - "Mua đuổi khi giá vượt biên kênh: 57-67% phá vỡ giả."
  - "Hiểu nhãn BÁN (giá < MA200) là tín hiệu bán ngắn hạn: giá vẫn tăng ~50%."
  - "So tỷ lệ đúng với 0 hoặc 50% mà quên mức nền (51-53%); coi 52% là thành tích."
  - "Phán chắc chắn về hướng giá 10-20 phiên; thiếu xác suất và vùng biến động."
  - "Quá khớp tham số (đẹp trên quá khứ); quên train/test."
  - "Tin vào các tuyên bố trong skills/references (VD 'confluence nâng xác suất thắng lên 75-80%', 'hỗ trợ cứng nếu >= 3 chạm', 'mua đáy hộp khi có nến từ chối giá'): không có bằng chứng hoặc bị bác bỏ."
  - "Dùng --as-of rồi coi là chứng minh: bảng hiệu chuẩn là trong mẫu; một ví dụ không chứng minh gì."
  - "Bỏ qua bề rộng kênh: 77% chứa là với kênh rộng 15-17% giá."
  - "Đặt cắt lỗ theo nến/kháng cự thay vì theo ATR; không tính giá sàn HOSE hay T+2."
  - "Đề xuất bán khống cho nhà đầu tư cá nhân VN."
  - "Bỏ qua cơ bản và định giá: kỹ thuật chỉ giúp quy mô vị thế và mức vô hiệu hoá."
  - "Dùng dữ liệu yfinance trễ/thiếu như dữ liệu thời gian thực; nhầm giá điều chỉnh với giá khớp thật."
  - "Tự tính lại kênh bằng phương pháp cũ (compute_trend_channel_legacy) rồi báo 'phá vỡ' (chỉ chứa 31%)."

sme_vn_guidance:
  - "Đối tượng: nhà đầu tư cá nhân VN (không phải SME doanh nghiệp). Không bán khống: mọi 'tín hiệu giảm' chỉ chuyển thành không mua mới/giảm tỷ trọng/đứng ngoài."
  - "Biên độ giá: HOSE +-7%, HNX +-10%, UPCoM +-15%. Cắt lỗ lệnh chờ có thể không khớp khi giá sàn; giảm vị thế thay vì kỳ vọng khớp đúng mức."
  - "Chu kỳ thanh toán T+2 (thường T+1,5 thực tế): cổ phiếu mới mua chưa bán được ngay; không thể cắt lỗ trong những phiên đầu. Cần xác nhận quy định hiện hành của công ty chứng khoán."
  - "Phiên khớp lệnh định kỳ ATO/ATC; nghỉ trưa 11:30-13:00. Công cụ chỉ dùng khung ngày."
  - "yfinance: giá điều chỉnh, có thể trễ/thiếu, không có ^VNINDEX (dùng rổ 7 mã); luôn đối chiếu với giá trên ứng dụng chứng khoán trước khi đặt lệnh."
  - "Phí giao dịch và thuế bán chứng khoán: chưa có trong tài liệu nguồn; cần xác nhận mức hiện hành trước khi tính R:R sau phí."
  - "Mã UPCoM/thanh khoản thấp: kiểm chứng chỉ trên 12 mã thanh khoản lớn; kết luận có thể không áp dụng cho mã nhỏ."
  - "Công cụ gọi bằng: python3 tools/stock_cli.py <MÃ>.VN từ thư mục mba-agent-office; cần Python, kết nối Internet; cần người dùng cho phép chạy lệnh."
  - "Không khuyến nghị cá nhân hoá: luôn có disclaimer và xác suất/vùng biến động."

case_lessons:
  - name: "Kiểm chứng ngoài mẫu hướng giá 10 phiên (mũi tên cũ vs nhận định v3)"
    type: "success"
    setup: "12 mã (MSN, VRE, HPG, VNM, FPT, MWG, STB, VCB, SSI, PNJ, TCB, ACB), tại mỗi ngày T chỉ dùng dữ liệu <= T, chấm 5/10/20 phiên sau, train < 2020, test >= 2020."
    key_calculations:
      - "Mũi tên cũ: đúng ~47,6% (10 phiên, 2020+)"
      - "Nhận định v3: đúng ~52,0% trên 1.576 ngày; nền 'luôn tăng' 50,8%"
      - "Xác suất theo nhóm 47-59%; vùng biến động 80% phủ 82,7%"
      - "IC +0,10 (UP) và -0,13 (DOWN); tỷ lệ đúng từng năm 19%-86%"
    lesson: "Hướng 10-20 phiên gần như không dự báo được từ giá; biên độ dự báo được. Vì vậy công cụ chuyển từ mũi tên sang xác suất + vùng biến động."
    data_reliability: "verified"
  - name: "Kênh giá cũ (12 tháng) vs kênh v3 (giai đoạn gần nhất)"
    type: "success"
    setup: "Cùng bộ 12 mã; đo tỷ lệ kênh chứa 10 phiên kế tiếp và tần suất báo phá vỡ."
    key_calculations:
      - "Kênh cũ: chứa 31%, báo phá vỡ ~26% số ngày"
      - "Kênh v3: chứa 77% với bề rộng 15-17% giá; hiệu quả chứa/bề rộng ~5,8 vs 3,3"
      - "Vượt biên trên (~2% số ngày): 57-67% quay lại trong 5 phiên"
    lesson: "Đổi từ hồi quy xuyên nhiều giai đoạn sang giai đoạn gần nhất cải thiện mạnh độ bao phủ; nhưng 'vượt biên' vẫn không là tín hiệu mua."
    data_reliability: "verified"
  - name: "Mẫu hình nến Nhật không có giá trị dự báo"
    type: "failure"
    setup: "Quét toàn bộ mẫu nến Nison trên 12 mã, đo tỷ lệ tăng và lợi suất vượt nền 10 phiên."
    key_calculations:
      - "Mật độ 0,49 mẫu/ngày"
      - "Tỷ lệ tăng 0,46-0,60 so nền 0,51-0,53"
      - "Hanging Man: -0,65% (train) / +0,59% (test); Rising Window: +0,75% / -0,60%"
      - "Bullish reversal ở vùng thấp: -0,74% (train) / -0,82% (test)"
    lesson: "Lợi suất vượt nền đổi dấu giữa hai giai đoạn: nhiễu. Chỉ dùng nến để mô tả."
    data_reliability: "verified"
  - name: "Hộp tích lũy: mua đáy hộp vs breakout có khối lượng"
    type: "failure"
    setup: "Hộp = cửa sổ 12 phiên biên độ <= 8%."
    key_calculations:
      - "Mua gần đáy hộp (<= 25%): -0,77% (test), -1,11% (train), tăng 45-49%"
      - "Breakout + khối lượng >= 2x TB20: +0,99% (train), +0,34% (test), tăng ~53-55% (n=198-302)"
      - "Breakdown: -1,24% (train), -0,29% (test): không nhất quán"
    lesson: "'Mua cạnh dưới hộp' sai trên dữ liệu; breakout có khối lượng chỉ nhỉnh nền nhẹ."
    data_reliability: "verified"
  - name: "Hỗ trợ/kháng cự cực trị (>= 3 lần chạm)"
    type: "failure"
    setup: "Gom cụm đỉnh/đáy fractal; đo tỷ lệ không thủng -3% trong 10 phiên sau khi chạm hỗ trợ mạnh."
    key_calculations:
      - "61-66% giữ so với mức giá ngẫu nhiên 62-67%"
      - "Lợi suất 10 phiên sau chạm hỗ trợ -0,15% (nền +0,6-0,9%)"
    lesson: "Đó là 'nơi giá từng đảo chiều' chứ không phải điểm tựa đáng tin."
    data_reliability: "verified"
  - name: "Value Area khung ngày: trên VAH, dưới VAL, hồi về POC"
    type: "success"
    setup: "Value Area 60 phiên trước, num_bins=40."
    key_calculations:
      - "Trên VAH: tăng 10 phiên 55-56%, +1,2% đến +1,5% (nền +0,5-0,9%)"
      - "Dưới VAL: 48-52%, +0,0% đến +0,1%"
      - "Hồi về POC trong 10 phiên khi ngoài VA: 41-50%"
    lesson: "Chỉ quán tính trên VAH có lợi thế nhẹ nhất quán; dưới VAL và hồi về POC không được ủng hộ."
    data_reliability: "verified"
  - name: "Nhãn BÁN khi giá < MA200"
    type: "failure"
    setup: "Nhãn BÁN của generate_recommendation_v2 chiếm ~52% số nhận định."
    key_calculations: ["Sau nhãn BÁN, tỷ lệ tăng vẫn ~50%"]
    lesson: "Giá dưới MA200 là mô tả xu hướng dài hạn, không phải tín hiệu bán ngắn hạn."
    data_reliability: "verified"
  - name: "Minh họa HPG giả định: đọc kết quả CLI trung thực"
    type: "sme"
    setup: "Nhà đầu tư cá nhân hỏi 'HPG có nên mua?'. Số liệu minh họa (không phải số thật)."
    key_calculations:
      - "Close 26.000, chế độ UP, điểm 0,30 -> nhóm 4 (UP|3) p_up 50,66% n 6.344 -> CHƯA RÕ"
      - "Cone 80% 10 phiên: 24.295-28.139 (ATR% 2,4%)"
      - "Vị thế 500 triệu, rủi ro 1%: 4.000 cp, cắt lỗ 24.752"
    lesson: "Trả lời thành thật: hướng chưa rõ; chỉ quản trị biên độ và quy mô vị thế."
    data_reliability: "illustrative"

worked_examples:
  - id: "m01_ex_atr_cone"
    name: "Tính vùng biến động 10 phiên"
    data_reliability: "illustrative"
    inputs: {close: 26000, atr_pct: 0.024, k: 0.974, h: 10, drift_nhom_UP4: 0.01342}
    steps:
      - "sigma_h = 0,024 x sqrt(10) x 0,974 = 0,0739 (7,39%)"
      - "Với drift = 0: thấp = 26.000 x (1 - 0,0739) = 24.078; cao = 26.000 x (1 + 0,0739) = 27.922"
      - "Với drift nhóm UP|4 = +1,342%: thấp 24.427; cao 28.271"
    result: "Vùng 80% 10 phiên khoảng 24.100-27.900 (không drift) hoặc 24.427-28.271 (có drift); chênh drift nhỏ so với bề rộng."
    interpretation: "Chiều rộng ±7,4% tức khoảng ±1.920 đồng quanh 26.000; một phiên HOSE biến động tối đa ±7%, nên vùng 10 phiên không phải đảm bảo."
  - id: "m01_ex_position_size"
    name: "Kích thước vị thế theo ATR"
    data_reliability: "illustrative"
    inputs: {capital: 500000000, risk_pct: 0.01, m: 2, atr_pct: 0.024, price: 26000, lot: 100, target: 28500}
    steps:
      - "ATR = 26.000 x 0,024 = 624 đồng; khoảng cắt lỗ = 2 x 624 = 1.248; cắt lỗ = 24.752 (4,8% < 7% nên không bị chặn)"
      - "Rủi ro tiền = 500.000.000 x 1% = 5.000.000"
      - "Số cp = 5.000.000/1.248 = 4.006 -> lô 100 -> 4.000 cp; giá trị 104.000.000 (20,8% vốn)"
      - "Lỗ nếu chạm cắt lỗ ~ 4.000 x 1.248 = 4.992.000 (~1% vốn)"
      - "R:R tới 28.500 = 2.500/1.248 = 2,003"
    result: "Mua 4.000 cp, cắt lỗ 24.752, R:R = 2,0 (mục tiêu 28.500 chỉ là giả định)"
    interpretation: "Vị thế 20,8% vốn nằm trong trần 20-25% tự đặt; nếu ATR% tăng gấp đôi thì số cp giảm một nửa."
  - id: "m01_ex_read_cli"
    name: "Đọc một đầu ra CLI mẫu (HPG.VN, số giả định minh họa)"
    data_reliability: "illustrative"
    inputs:
      cli_sample: |
        {"ticker":"HPG.VN","as_of":"2026-11-10","close":26000,"bars":251,
         "trend_state":{"structure":"TĂNG (giá > MA50 > MA200)","ma50":25200,"ma200":23800,"roc20_pct":4.0,"pos60_pct":68},
         "outlook":{"direction":0,"label":"CHƯA RÕ HƯỚNG","regime":"UP","p_up":0.5066,"n":6344,"score":0.30,"mean_ret":0.00833,"horizon":10,"cone_low":24295,"cone_high":28139,"sigma_h_pct":7.39},
         "channel":{"channel_type":"Ascending (Kênh tăng)","window":90,"width_pct":14.6},
         "channel_edges_now":{"upper":28100,"lower":24300,"median":26200},
         "support_resistance":{"nearest_support":{"level":25100,"touches":4},"nearest_resistance":{"level":27200,"touches":3}},
         "value_area":{"window":60,"poc":25800,"vah":26600,"val":25000,"position":"trong Value Area"},
         "patterns_info_only":[{"pattern":"Hammer"}],
         "rule_filter":{"label":"THEO DÕI","reasons":["Giá đang lơ lửng giữa kênh"]}}
    steps:
      - "Trạng thái: giá 26.000 > MA50 25.200 > MA200 23.800 -> cấu trúc TĂNG; ROC20 +4%; vị trí 68% biên 60 phiên."
      - "Nhận định: regime UP, score 0,30 -> nhóm 4 (UP|3): p_up 50,66% (n=6.344). |0,5066 - 0,5| = 0,0066 < 0,045 -> direction 0 = CHƯA RÕ. So nền 52%: không khác."
      - "Vùng biến động: 24.295-28.139 (sigma_h 7,39%; drift +0,833%): kiểm tra 26.000 x (1+0,00833-0,0739) = 24.295 và x (1+0,00833+0,0739) = 28.139."
      - "Kênh: tăng, rộng 14,6% (gần khoảng 15-17% điển hình); giá 26.000 ở vị trí (26.000-24.300)/(28.100-24.300) = 44,7% -> gần giữa kênh, không có biên nào gần."
      - "Hỗ trợ/kháng cự: 25.100 (4 chạm), 27.200 (3 chạm): chỉ là nơi giá từng đảo chiều."
      - "Value Area: trong vùng giá trị -> không có quán tính; 26.000 gần POC 25.800."
      - "Nến Hammer: mô tả; không dùng làm tín hiệu (kiểm chứng: không dự báo)."
      - "Nhãn luật THEO DÕI: không thuận cũng không nghịch."
    result: "Báo cáo trung thực: 'Xu hướng đang tăng, nhưng hướng 10 phiên tới không rõ (50,7%, như tung đồng xu). Vùng dao động 80% khoảng 24.300-28.100. Mức vô hiệu hoá của kịch bản tích cực: đóng cửa dưới 24.752 (2 ATR).'"
    interpretation: "Không có điểm mua rõ; hướng không có thiên hướng; hãy bàn về kích thước vị thế và kế hoạch chứ không bàn 'mua hay bán ngay'."
  - id: "m01_ex_channel_old_new"
    name: "So sánh kênh cũ (toàn bộ 12 tháng) và kênh v3 (dữ liệu tổng hợp)"
    data_reliability: "illustrative"
    inputs: {du_lieu: "Chuỗi tổng hợp seed numpy 7: 150 phiên tăng 20.000->34.000, sau đó 100 phiên giảm nhẹ 34.000->31.000, nhiễu 1,2% giá đóng cửa; T = phiên 230; đo 10 phiên kế tiếp"}
    steps:
      - "Kênh hồi quy toàn bộ 230 phiên (kiểu cũ): độ dốc +59 đồng/phiên (do đa số dữ liệu là xu hướng tăng), bề rộng 25,7% giá; 6/10 phiên kế tiếp nằm trong kênh (60%)."
      - "Kênh v3 hồi quy 90 phiên cuối: độ dốc -27 đồng/phiên (giai đoạn giảm nhẹ), bề rộng 7,2% giá; 10/10 phiên kế tiếp nằm trong kênh."
      - "Kênh 60 phiên cuối: độ dốc -34 đồng/phiên, bề rộng 5,9%; 9/10 phiên kế tiếp nằm trong kênh."
    result: "Kênh toàn bộ lệch hướng (độ dốc dương trong khi giai đoạn hiện tại đang giảm) và rộng gấp 3,5 lần; kênh gần nhất vừa sát vừa đúng hướng."
    interpretation: "Chỉ minh họa cơ chế một mẫu tổng hợp. Bằng chứng thật: kênh cũ chứa 31%, v3 chứa 77% (12 mã)."
  - id: "m01_ex_outlook_regime"
    name: "Cùng điểm xu hướng, hai chế độ thị trường"
    data_reliability: "illustrative"
    inputs: {c_ma50: 0.06, roc20: 0.04, roc60: 0.10, pos60: 0.8}
    steps:
      - "raw = 0,525 (xem m01_trend_score)"
      - "Chế độ UP: score +0,525 -> nhóm 5 (UP|4): p_up 55,23% (n=12.742) -> NGHIÊNG TĂNG (nhẹ)"
      - "Chế độ DOWN: score -0,525 -> nhóm 1 (DOWN|0): p_up 50,38% (n=2.122) -> CHƯA RÕ"
      - "Sai số: p_up 55,23% - nền 51,92% = 3,31 điểm %; sai số chuẩn nếu mẫu độc lập 0,44 điểm % (tự tính), nếu số mẫu hiệu dụng ~n/10 thì ~1,4 điểm %"
    result: "Một giá mạnh có thể là 'nghiêng tăng nhẹ' ở thị trường tốt và 'chưa rõ' ở thị trường xấu."
    interpretation: "Dấu thiên hướng phụ thuộc chế độ; không bền theo năm (19%-86%): không nên đặt cược lớn."

practice_questions:
  - q: "Mã giá 40.000, ATR% 3%, k = 0,974, h = 10, drift = 0. Vùng biến động 80% 10 phiên là gì?"
    a: "sigma_h = 0,03 x sqrt(10) x 0,974 = 0,0924 (9,24%); vùng 40.000 x (1 -/+ 0,0924) = 36.304 đến 43.696. Còn ~20% khả năng thoát ra ngoài."
  - q: "Vốn 200 triệu, rủi ro 0,5%/lệnh, giá 50.000, ATR% 2%, m = 2. Mua bao nhiêu cp? Lỗ tối đa lý thuyết?"
    a: "Rủi ro tiền = 1.000.000; khoảng cắt lỗ = 2 x 0,02 x 50.000 = 2.000; số cp = 500 (đã chia hết lô 100); cắt lỗ 48.000; giá trị vị thế 25 triệu (12,5% vốn); lỗ lý thuyết 1 triệu."
  - q: "Thị trường chung DOWN, raw score = -0,30. Nhóm nào? Có thiên hướng không?"
    a: "score = +0,30 (đảo dấu) -> nhóm 4 (0,15-0,45) = DOWN|3: p_up 52,65% (n=2.095), nằm trong dải 0,455-0,545 -> CHƯA RÕ."
  - q: "Nhóm có p_up = 53%, n = 250. Thiên hướng gì?"
    a: "CHƯA RÕ vì n < 300 (MIN_BUCKET_N) và |0,53-0,5| = 0,03 < 0,045."
  - q: "Giá xuất hiện nến Hammer sát đáy 20 phiên, dưới MA50. Có nên mua không?"
    a: "Không nên chỉ vì nến: bullish reversal ở vùng giá thấp vượt nền -0,74% (train)/-0,82% (test), bắt đáy theo nến thường sai. Chỉ mô tả; nếu muốn mua phải dựa vào luận điểm cơ bản và quản trị rủi ro."
  - q: "Giá đóng cửa vượt biên trên kênh v3. Chiến lược mua đuổi có hợp lý không?"
    a: "Không: 57-67% quay lại trong kênh trong 5 phiên, lợi suất 10 phiên sau không hơn nền. Chờ khối lượng và phiên xác nhận."
  - q: "Nhãn rule_filter = BÁN vì giá < MA200. Nhà đầu tư đang giữ cổ phiếu nên làm gì?"
    a: "Nhãn không có giá trị dự báo ngắn hạn (sau đó vẫn tăng ~50%). Không bán chỉ vì nhãn; xem lại luận điểm đầu tư và kích thước vị thế/cắt lỗ; không mua thêm bình quân giá xuống dưới MA200 (kỷ luật)."
  - q: "Tại sao vùng biến động dự báo tốt hơn hướng giá?"
    a: "Biến động có tính tụ cụm (tương quan ATR% với |lợi suất tương lai| ~0,22) nên biên độ gần đây dự báo biên độ sắp tới; hướng giá gần như bước ngẫu nhiên (IC 0,05-0,1, đổi dấu theo chế độ). Vùng 80% phủ 82,7% ngoài mẫu."
  - q: "Người dùng muốn bán khống mã đang giảm. Trả lời thế nào?"
    a: "Nhà đầu tư cá nhân VN không bán khống; 'SHORT' không khả thi. Chỉ có không mua/giảm tỷ trọng/đứng ngoài. Hơn nữa nhãn giảm không dự báo được hướng ngắn hạn."
  - q: "Chạy --as-of 2025-05-29 và diễn biến sau đó khớp vùng 80%. Có chứng minh công cụ đúng không?"
    a: "Không. Một mẫu không chứng minh gì; vùng 80% vẫn có 20% sót; và bảng hiệu chuẩn p_up tính trên mọi năm nên đó là trong mẫu."

checklist:
  - "Đã xác nhận mã (.VN), ngày as_of và nguồn dữ liệu (yfinance, có thể trễ)?"
  - "Đã xin phép người dùng trước khi chạy lệnh/cài thư viện?"
  - "Đã báo xác suất tăng 10 phiên kèm n và so với nền ~52%, không phán chắc chắn?"
  - "Đã kèm vùng biến động 80% và nhắc 20% thoát vùng?"
  - "Đã hạ cấp mẫu hình nến, hỗ trợ/kháng cự, hộp tích lũy, nhãn BÁN về 'mô tả' kèm số liệu kiểm chứng?"
  - "Nếu vượt biên kênh: đã cảnh báo phá vỡ giả 57-67%?"
  - "Nếu người dùng muốn mua: đã có cắt lỗ theo m x ATR (<= 7%), số cp theo % vốn, R:R, mức vô hiệu hoá?"
  - "Đã nhắc giới hạn VN: không bán khống, biên độ ngày, T+2?"
  - "Đã nêu rõ nhãn MUA/BÁN chưa chứng minh dự báo và chưa có mô phỏng giao dịch MUA?"
  - "Đã đính kèm chart_path và disclaimer?"
  - "Đã kiểm tra dữ liệu (đủ >= 80 phiên, không thiếu phiên bất thường)?"
  - "Đã tránh dùng số bịa; mọi số lấy từ JSON hoặc VERIFICATION_FINDINGS?"

excel_google_sheets_templates:
  - "Sheet ATR: cột Date, High, Low, Close, TR = MAX(H-L, ABS(H-Close_prev), ABS(L-Close_prev)), ATR14 = AVERAGE(14 dòng TR), ATR% = ATR14/Close."
  - "Sheet Vùng biến động: Close, ATR%, k = 0,974, h = 10, Low = Close*(1+drift-k*ATR%*SQRT(h)), High = Close*(1+drift+k*ATR%*SQRT(h))."
  - "Sheet Kích thước vị thế: Vốn, r%, m, ATR%, Giá -> Cắt lỗ = MAX(Giá - m*Giá*ATR%, 0,93*Giá); Số cp = FLOOR(Vốn*r/(Giá-Cắt lỗ),100); R:R = (TP-Giá)/(Giá-Cắt lỗ)."
  - "Sheet Kênh: SLOPE/INTERCEPT trên Close 90 phiên; phần dư High/Low; PERCENTILE.INC(0,99) và (0,01) cho biên."
  - "Sheet Nhật ký kiểm chứng: Ngày tín hiệu, tín hiệu, giá, giá sau 10 phiên, lợi suất, nền cùng giai đoạn, vượt nền; tách train/test."

