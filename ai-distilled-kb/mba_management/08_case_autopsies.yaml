case_autopsy_cards:
  soya_garden_failure_analysis:
    entity: "Soya Garden (Vietnam F&B Startup)"
    core_thesis: "Premium organic soy milk cafes funded by Shark Tank venture capital."
    fatal_failure_modes:
      1_unit_economics_mismatch: "Charged 45,000 - 65,000 VND for soy milk (traditionally perceived by Vietnamese mass consumers as a 5,000 - 10,000 VND street drink); product lacked sufficient symbolic/functional differentiation to justify a 5x-10x price premium."
      2_excessive_fixed_capex_and_rent: "Opened massive 200-300m2 flagship locations on prime high-rent street corners (high Operating Leverage DOL), making break-even volume unachievable during foot-traffic dips."
      3_premature_scaling: "Scaled to 50+ stores before achieving profitable single-store unit economics in tier-2 locations."
    strategic_takeaway: "Never scale operations when unit contribution margin cannot absorb real estate fixed costs; respect consumer price perception elasticity."

  mixue_supply_chain_empire:
    entity: "Mixue Ice Cream & Tea (蜜雪冰城)"
    true_business_model: "B2B Supply Chain & Manufacturing Conglomerate disguised as a B2C Beverage Franchise."
    strategic_and_financial_catalysts:
      1_revenue_source: "> 95% of corporate revenue derived from selling ingredients, packaging, and commercial machinery to franchisees, NOT retail drinks to consumers."
      2_negative_cash_conversion_cycle: "Franchisees pay 100% upfront for supplies; Mixue secures 60-90 day credit terms from raw agricultural suppliers -> creates enormous interest-free cash float."
      3_extreme_upstream_integration: "Owns tea plantations, lemon farms, and proprietary processing factories, establishing an insurmountable cost barrier (Economy Pricing model)."
      4_snow_king_ip: "Viral brand character lowers customer acquisition cost and drives organic social advocacy."
    strategic_takeaway: "True competitive advantage in low-price retail lies in upstream supply chain ownership, not downstream marketing glitz."

  bach_hoa_xanh_turnaround:
    entity: "Bách Hóa Xanh (MWG Grocery Chain)"
    crisis_phase: "Aggressive store count expansion without centralized distribution led to high inventory shrinkage, logistics inefficiencies, and heavy quarterly operating losses."
    restructuring_playbook:
      1_drastic_store_rationalization: "Closed hundreds of underperforming sub-scale stores; consolidated footprints into standardized high-density layouts."
      2_centralized_dc_logistics: "Revamped automated Distribution Centers; integrated direct sourcing with agricultural producers to cut intermediary markup."
      3_fresh_food_hero_engine: "Positioned fresh meat and leafy produce as low-margin traffic drivers (Loss Leaders), monetizing through packaged FMCG basket fillers."
    financial_outcome: "Reached operational store-level EBITDA break-even and positive net cash contribution."
    strategic_takeaway: "Pruning unprofitable capacity (subordinating volume to quality) is necessary to save high-debt retail chains."

  vinfast_market_penetration:
    entity: "VinFast (Vingroup Automotive)"
    strategic_thrust: "Rapid global transition from Internal Combustion Engines (ICE) to 100% Electric Vehicles (EV)."
    market_entry_tactics:
      1_battery_subscription_model: "Separated battery cost from vehicle price, lowering initial purchase sticker price to parity with gasoline vehicles."
      2_ecosystem_synergy: "Leveraged Vingroup real estate network to rapidly deploy nationwide EV charging stations, erecting high switching barriers."
      3_financial_restructuring: "Divested legacy manufacturing assets, accessed international capital markets via US SPAC listing."
    strategic_takeaway: "Aggressive market entry against entrenched incumbents requires non-linear business model innovation (unbundling key cost components)."

  seven_eleven_retail_physics:
    entity: "7-Eleven Global Convenience Retail"
    operational_excellence_pillars:
      1_tanpin_kanri_item_by_item_control: "Store managers analyze hourly POS weather and event data to place micro-orders daily, eliminating stockouts and perishable food waste."
      2_cluster_dominance_strategy: "Opens 10+ stores in a tightly concentrated geographic radius to maximize regional brand recognition and share delivery truck routes."
      3_combined_temperature_delivery: "Suppliers consolidate ambient, chilled, and frozen goods into unified fleet runs, dropping store deliveries from 70 to 12 trucks/day."
    strategic_takeaway: "Granular inventory velocity and logistics density create sustainable micro-monopolies."
