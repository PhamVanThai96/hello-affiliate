case_autopsy_cards:
  soya_garden_failure_analysis:
    entity: "Soya Garden (Vietnam F&B Startup)"
    core_thesis: "Premium organic soy milk cafes funded by Shark Tank venture capital."
    fatal_failure_modes:
      1_unit_economics_mismatch: "Charged 45,000 - 65,000 VND for soy milk (traditionally perceived by Vietnamese mass consumers as a 5,000 - 10,000 VND street drink); product lacked sufficient symbolic/functional differentiation to justify a 5x-10x price premium."
      2_excessive_fixed_capex_and_rent: "Opened massive 200-300m2 flagship locations on prime high-rent street corners (high Operating Leverage DOL), making break-even volume unachievable during foot-traffic dips."
      3_premature_scaling: "Scaled to 50+ stores before achieving profitable single-store unit economics in tier-2 locations."
    strategic_takeaway: "Never scale operations when unit contribution margin cannot absorb real estate fixed costs; respect consumer price perception elasticity."

  mixue_supply_chain_empire:
    entity: "Mixue Ice Cream & Tea (蜜雪冰城)"
    true_business_model: "B2B Supply Chain & Manufacturing Conglomerate disguised as a B2C Beverage Franchise."
    strategic_and_financial_catalysts:
      1_revenue_source: "> 95% of corporate revenue derived from selling ingredients, packaging, and commercial machinery to franchisees, NOT retail drinks to consumers."
      2_negative_cash_conversion_cycle: "Franchisees pay 100% upfront for supplies; Mixue secures 60-90 day credit terms from raw agricultural suppliers -> creates enormous interest-free cash float."
      3_extreme_upstream_integration: "Owns tea plantations, lemon farms, and proprietary processing factories, establishing an insurmountable cost barrier (Economy Pricing model)."
      4_snow_king_ip: "Viral brand character lowers customer acquisition cost and drives organic social advocacy."
    strategic_takeaway: "True competitive advantage in low-price retail lies in upstream supply chain ownership, not downstream marketing glitz."

  bach_hoa_xanh_turnaround:
    entity: "Bách Hóa Xanh (MWG Grocery Chain)"
    crisis_phase: "Aggressive store count expansion without centralized distribution led to high inventory shrinkage, logistics inefficiencies, and heavy quarterly operating losses."
    restructuring_playbook:
      1_drastic_store_rationalization: "Closed hundreds of underperforming sub-scale stores; consolidated footprints into standardized high-density layouts."
      2_centralized_dc_logistics: "Revamped automated Distribution Centers; integrated direct sourcing with agricultural producers to cut intermediary markup."
      3_fresh_food_hero_engine: "Positioned fresh meat and leafy produce as low-margin traffic drivers (Loss Leaders), monetizing through packaged FMCG basket fillers."
    financial_outcome: "Reached operational store-level EBITDA break-even and positive net cash contribution."
    strategic_takeaway: "Pruning unprofitable capacity (subordinating volume to quality) is necessary to save high-debt retail chains."

  vinfast_market_penetration:
    entity: "VinFast (Vingroup Automotive)"
    strategic_thrust: "Rapid global transition from Internal Combustion Engines (ICE) to 100% Electric Vehicles (EV)."
    market_entry_tactics:
      1_battery_subscription_model: "Separated battery cost from vehicle price, lowering initial purchase sticker price to parity with gasoline vehicles."
      2_ecosystem_synergy: "Leveraged Vingroup real estate network to rapidly deploy nationwide EV charging stations, erecting high switching barriers."
      3_financial_restructuring: "Divested legacy manufacturing assets, accessed international capital markets via US SPAC listing."
    strategic_takeaway: "Aggressive market entry against entrenched incumbents requires non-linear business model innovation (unbundling key cost components)."

  seven_eleven_retail_physics:
    entity: "7-Eleven Global Convenience Retail"
    operational_excellence_pillars:
      1_tanpin_kanri_item_by_item_control: "Store managers analyze hourly POS weather and event data to place micro-orders daily, eliminating stockouts and perishable food waste."
      2_cluster_dominance_strategy: "Opens 10+ stores in a tightly concentrated geographic radius to maximize regional brand recognition and share delivery truck routes."
      3_combined_temperature_delivery: "Suppliers consolidate ambient, chilled, and frozen goods into unified fleet runs, dropping store deliveries from 70 to 12 trucks/day."
    strategic_takeaway: "Granular inventory velocity and logistics density create sustainable micro-monopolies."

  the_coffee_house_repositioning_crisis:
    company: "The Coffee House"
    industry: "Vietnam branded coffee retail"
    key_decision: "Scaled large-format 'third place' stores, broadened menu/format experiments, then had to pivot toward App and O2O execution."
    outcome: "Differentiation in space and experience was copied; rent pressure increased; the brand was squeezed between mass coffee and specialty coffee."
    lesson: "Do not keep a high-fixed-cost format after the original VRIO advantage erodes; reuse CRM/App data as the new strategic core."

  vingroup_vinfast_international_pestel:
    company: "Vingroup / VinFast"
    industry: "Electric vehicles"
    key_decision: "Used PESTEL signals to support building a U.S. factory instead of relying only on exports."
    outcome: "Captured policy logic around EV incentives, but market adoption lagged because brand-awareness assumptions were too optimistic."
    lesson: "Macro attractiveness is not enough; pair PESTEL with customer and competitive analysis before a capital-heavy market entry."

  vietnam_coffee_industry_five_forces:
    company: "Vietnam coffee chain industry"
    industry: "Foodservice / coffee chains"
    key_decision: "Compete in a high-rivalry market where ecosystem leverage and strong brand matter more than simple store rollout."
    outcome: "Industry attractiveness is weak for new entrants because rivalry and buyer power are high despite abundant supply."
    lesson: "In fragmented retail, win through differentiation or distribution ecosystem advantage, not generic expansion."

  vinfast_ev_us_entry_module_case:
    company: "VinFast EV"
    industry: "Electric vehicles in North America"
    key_decision: "Responded to IRA policy, financing pressure, trust barriers, and technology gaps with local factory investment, leasing, warranty, and partnerships."
    outcome: "The company found that direct price war with incumbents was untenable in a brutally competitive market."
    lesson: "Late entrants need niche differentiation and superior after-sales trust, not cost-parity imitation."

  grab_sea_profitable_growth_shift:
    company: "Grab"
    industry: "Ride-hailing, delivery, and fintech"
    key_decision: "Shifted from growth-at-all-costs to profitable growth using TOWS logic, ads monetization, fintech expansion, and cost cuts."
    outcome: "The restructuring supported a move toward profitability after years of subsidy-heavy expansion."
    lesson: "A super app needs monetization discipline; scale without profit architecture becomes a strategic weakness."

  samsung_electronics_vrio_focus:
    company: "Samsung Electronics"
    industry: "Consumer electronics and semiconductors"
    key_decision: "Protected the few resources that truly met VRIO standards: brand, semiconductor capability, and AMOLED leadership."
    outcome: "Those resources remained the durable backbone, while weaker assets such as Tizen were deprioritized."
    lesson: "Not every strength is strategic; invest behind the capabilities that are valuable, rare, hard to imitate, and organizationally supported."

  zara_value_chain_speed_system:
    company: "Zara (Inditex)"
    industry: "Fast fashion"
    key_decision: "Built a tightly integrated value chain with nearby sourcing, in-house production, rapid logistics, store feedback, and low-ad spend."
    outcome: "Zara converted speed into lower markdown risk and faster response to demand shifts."
    lesson: "Sustainable advantage can come from cross-chain coordination, not from excellence in only one isolated function."

  vinamilk_closed_loop_value_chain:
    company: "Vinamilk"
    industry: "Dairy"
    key_decision: "Locked in a closed value chain around farms, manufacturing, brand, and mass distribution coverage."
    outcome: "The integrated system created durable barriers that competitors could not easily replicate."
    lesson: "When vertical assets reinforce brand and distribution together, value-chain control becomes a defensible moat."

  vietjet_cost_leadership_engine:
    company: "Vietjet Air"
    industry: "Aviation"
    key_decision: "Pursued cost leadership through a single aircraft family, high utilization, fast turnarounds, direct sales, and ancillary revenue."
    outcome: "The airline undercut legacy pricing and reached domestic leadership while preserving a viable profit model."
    lesson: "Low price works only when the operating system, not just the ticket, is structurally cheaper."

  apple_differentiation_ecosystem:
    company: "Apple"
    industry: "Consumer technology"
    key_decision: "Differentiated through an integrated ecosystem, proprietary OS/chips, privacy positioning, premium retail, and brand symbolism."
    outcome: "The ecosystem created premium pricing power and high customer lock-in."
    lesson: "Differentiation is strongest when products, software, service, and identity reinforce one another."

  rolls_royce_ultra_luxury_focus:
    company: "Rolls-Royce Motor Cars"
    industry: "Ultra-luxury automobiles"
    key_decision: "Focused narrowly on ultra-wealthy buyers with bespoke, handmade, low-volume production and private-client service."
    outcome: "The brand sustained exceptional pricing, backlog strength, and luxury prestige without mass advertising."
    lesson: "Deep segment understanding can outperform broad-market scale when exclusivity itself is the value proposition."

  apple_xiaomi_positioning_contrast:
    company: "Apple vs Xiaomi"
    industry: "Smartphones"
    key_decision: "Apple stayed in premium differentiation while Xiaomi optimized value-for-money cost leadership."
    outcome: "Both clear positions held, while Nokia and BlackBerry collapsed after losing a coherent strategic position."
    lesson: "Strategic clarity beats being stuck in the middle during category disruption."

  vingroup_diversification_retreat:
    company: "Vingroup"
    industry: "Conglomerate strategy"
    key_decision: "Expanded aggressively across unrelated and related businesses, then exited weaker bets to refocus resources."
    outcome: "Diversification produced both ecosystem wins and costly failures such as Vsmart and abandoned airline plans."
    lesson: "Capital can fund experimentation, but unrelated diversification still fails without transferable core capabilities."

  unilever_bcg_portfolio_reallocation:
    company: "Unilever"
    industry: "Consumer packaged goods"
    key_decision: "Used BCG logic to harvest mature cash generators, back growth brands, and divest declining businesses."
    outcome: "Portfolio pruning freed capital for stronger growth platforms, though not every question mark converted into a star."
    lesson: "Portfolio tools help allocate cash, but they do not remove execution risk in fast-changing categories."

  samsung_group_ge_mckinsey_allocation:
    company: "Samsung Group"
    industry: "Diversified industrial and technology portfolio"
    key_decision: "Allocated investment selectively across SBUs based on industry attractiveness and competitive strength."
    outcome: "Capital flowed disproportionately to semiconductors and display rather than being spread evenly across businesses."
    lesson: "Portfolio discipline matters most when a group contains both structural winners and structural laggards."

  netflix_self_cannibalization_bcg:
    company: "Netflix"
    industry: "Media and streaming"
    key_decision: "Cannibalized its profitable DVD business to fund streaming and later original content."
    outcome: "The firm escaped physical-media decline and built a new growth engine while legacy rivals hesitated."
    lesson: "Harvest declining cash cows early if they fund the next platform before incumbents react."

  cirque_du_soleil_blue_ocean:
    company: "Cirque du Soleil"
    industry: "Live entertainment"
    key_decision: "Removed expensive circus conventions and created an adult-oriented theatrical experience with premium pricing."
    outcome: "It created a new value curve rather than fighting in the shrinking traditional circus market."
    lesson: "Blue Ocean works when cost reduction and value innovation happen simultaneously."

  nintendo_wii_noncustomer_expansion:
    company: "Nintendo Wii"
    industry: "Video game consoles"
    key_decision: "Ignored the graphics arms race and targeted families and non-gamers with motion control and accessible play."
    outcome: "The Wii outsold contemporaries by opening demand beyond hardcore gamers."
    lesson: "Noncustomers can be a larger opportunity than incumbent users if the experience barrier is redesigned."

  vinfast_vf_e34_blue_ocean_attempt:
    company: "VinFast VF e34"
    industry: "Electric vehicles in Vietnam"
    key_decision: "Used battery subscription, charging infrastructure, and a local EV narrative to open the domestic category."
    outcome: "The move looked blue-ocean-like in Vietnam, but the same offer would face red-ocean conditions in export markets."
    lesson: "Blue Ocean validity is market-specific; a first-mover advantage at home does not transfer automatically abroad."

  spotify_freemium_value_innovation:
    company: "Spotify"
    industry: "Digital music"
    key_decision: "Reframed music value from ownership to always-on access via freemium subscriptions and algorithmic discovery."
    outcome: "The model expanded legal consumption and built a compelling alternative to piracy and per-track purchasing."
    lesson: "Category reinvention often comes from changing the unit of value, not just the price level."

  fpt_balanced_scorecard_alignment:
    company: "FPT Corporation"
    industry: "Technology services"
    key_decision: "Applied Balanced Scorecard to connect talent development, delivery capability, global clients, and financial growth."
    outcome: "The framework aligned a large workforce around the go-global strategy."
    lesson: "BSC is most useful when learning metrics visibly feed process, customer, and financial results."

  starbucks_bsc_people_to_profit:
    company: "Starbucks"
    industry: "Global coffee retail"
    key_decision: "Used Balanced Scorecard to connect partner experience, digital engagement, service speed, sourcing, and same-store growth."
    outcome: "The system supported scale and brand consistency, but labor disputes showed scorecards can diverge from frontline reality."
    lesson: "Measurement systems must be tested against lived employee experience, not only dashboard targets."

  s_tech_bsc_ipo_alignment:
    company: "S-Tech"
    industry: "Technology manufacturing"
    key_decision: "Built a multi-perspective BSC to tie IoT talent, dashboard adoption, product cycle time, retention, and ROE targets together."
    outcome: "The framework reduced goal ambiguity and coordinated the organization around an IPO-oriented strategy."
    lesson: "BSC adds value when causal links between capability building and financial ambition are explicit."

  royal_dutch_shell_scenario_advantage:
    company: "Royal Dutch Shell"
    industry: "Oil and gas"
    key_decision: "Used scenario planning to prepare for an OPEC-driven supply shock while peers assumed stable oil prices."
    outcome: "Shell reacted faster during the 1973 crisis and materially improved its competitive position."
    lesson: "Scenario planning is for preparedness, not precise prediction."

  maersk_integrated_logistics_pivot:
    company: "Maersk"
    industry: "Shipping and logistics"
    key_decision: "Planned for both globalization and de-globalization futures by expanding into integrated logistics."
    outcome: "Logistics diversification softened exposure when ocean-freight conditions weakened."
    lesson: "Robust strategy is one that remains useful across multiple structurally different futures."

  r_estate_group_scenario_response:
    company: "R-Estate Group"
    industry: "Real estate"
    key_decision: "Mapped strategy to four scenarios defined by legal approvals and interest-rate conditions."
    outcome: "The framework clarified when to accelerate land plays, shift to M&A exits, hibernate, or rely on rental cash flow."
    lesson: "Scenario planning is actionable only when each future has pre-mapped financial and operating responses."

