motivation_theories_engine:
  herzberg_dual_factor_hygiene_motivation:
    hygiene_factors:
      elements: ["Base Salary", "Company Policies", "Job Security", "Physical Work Conditions", "Supervisory Quality"]
      mechanics: "Adequacy merely eliminates dissatisfaction; improvements DO NOT create positive motivation or high performance."
    motivator_factors:
      elements: ["Achievement", "Recognition", "Intrinsic Nature of Work", "Responsibility", "Career Advancement"]
      mechanics: "Directly drive job satisfaction and discretionary effort."
  vroom_expectancy_theory:
    formula: "Motivation_Force = Expectancy * Instrumentality * Valence"
    multiplicative_rule: "If any single component is zero, total motivational force drops to zero."
    components:
      expectancy: "Belief that effort will lead to successful performance (E -> P)."
      instrumentality: "Belief that successful performance will be rewarded (P -> R)."
      valence: "Subjective value the individual places on the promised reward."
  self_determination_theory_sdt:
    triad_of_intrinsic_needs:
      autonomy: "Perception of volition, agency, and ownership over one's work."
      competence: "Feeling effective and capable of mastering challenging tasks."
      relatedness: "Sense of belonging, mutual connection, and care within a team."

leadership_and_team_dynamics:
  situational_leadership_hersey_blanchard:
    readiness_matching_matrix:
      R1_unable_and_unwilling: "Use S1 Directing / Telling (High Task, Low Relationship)."
      R2_unable_but_willing: "Use S2 Coaching / Selling (High Task, High Relationship)."
      R3_able_but_unwilling: "Use S3 Supporting / Participating (Low Task, High Relationship)."
      R4_able_and_willing: "Use S4 Delegating (Low Task, Low Relationship)."
  tuckman_stages_of_team_evolution:
    forming: "Polite orientation, ambiguity around roles, high dependency on leader."
    storming: "Conflict over leadership, goals, and working styles; critical bottleneck stage."
    norming: "Consensus on norms, role clarity, group cohesion, shared identity established."
    performing: "Autonomous execution, high synergy, task orientation, mutual support."
    adjourning: "Wrap-up, assessment, celebration, transition."
  lencioni_five_dysfunctions_pyramid:
    1_absence_of_trust: "Fear of vulnerability; team members conceal weaknesses and mistakes."
    2_fear_of_conflict: "Artificial harmony; absence of unfiltered constructive ideological debate."
    3_lack_of_commitment: "Feigned buy-in resulting in ambiguity and delayed execution."
    4_avoidance_of_accountability: "Reluctance to call out peers on subpar performance."
    5_inattention_to_results: "Prioritizing individual ego, department silos, or career over team goals."

organizational_culture_schein_framework:
  three_levels_of_culture:
    level_1_artifacts: "Visible structures, office architecture, dress codes, rituals, slogans (Easily observed, hard to decipher)."
    level_2_espoused_values: "Stated strategies, corporate missions, ethical charters (What people claim guides their behavior)."
    level_3_basic_underlying_assumptions: "Unconscious, taken-for-granted beliefs about human nature, truth, time, and environment (The true operational driver of organizational reality)."

conflict_management_thomas_kilmann_tki:
  modes_by_assertiveness_and_cooperativeness:
    competing: "High Assertive, Low Cooperative -> Decisive action in emergencies, unpopular vital decisions."
    collaborating: "High Assertive, High Cooperative -> Win-win integrative solution when both concerns too important to compromise."
    compromising: "Moderate Assertive, Moderate Cooperative -> Expedient intermediate settlement under time pressure."
    avoiding: "Low Assertive, Low Cooperative -> Trivial issues, cooling off emotional outbursts."
    accommodating: "Low Assertive, High Cooperative -> Preserving harmony, yielding when issue is far more vital to the other party."

change_management_kotter_8_steps:
  phase_1_creating_climate_for_change:
    1_create_urgency: "Demonstrate existential commercial risk or massive upside to counter complacency."
    2_build_guiding_coalition: "Assemble influential cross-functional team with formal authority and credibility."
    3_form_strategic_vision: "Clear picture of future state and achievable roadmap."
  phase_2_engaging_and_enabling_organization:
    4_enlist_volunteer_army: "Communicate vision across all channels by factor of 10x."
    5_enable_action_by_removing_barriers: "Eliminate bureaucratic obstacles, misaligned incentives, and toxic detractors."
    6_generate_short_term_wins: "Deliver visible, unambiguous quick wins within 30-90 days."
  phase_3_implementing_and_sustaining:
    7_sustain_acceleration: "Consolidate gains and drive deeper structural transformation."
    8_institute_change: "Anchor new behaviors into promotion criteria, succession planning, and culture."

power_and_politics_frameworks:
  power_authority_influence_distinction:
    power: "Capacity to alter another party's behavior or outcomes, with or without formal position."
    authority: "Formally granted right to decide or direct inside the hierarchy."
    influence: "Ability to shift beliefs or action through persuasion, credibility, or relationships."
    rule_of_thumb: "Authority grants permission; power creates leverage; influence creates voluntary follow-through."
  french_and_raven_bases_of_power:
    legitimate_power: "Compliance from formal role, title, or sanctioned hierarchy."
    reward_power: "Compliance from control over pay, promotion, recognition, or scarce benefits."
    coercive_power: "Compliance from fear of punishment, exclusion, or loss."
    expert_power: "Influence derived from recognized knowledge, judgment, or technical mastery."
    referent_power: "Influence derived from admiration, identification, trust, or charisma."
    informational_power: "Leverage created by privileged access to critical facts, context, or timing."
    connection_power: "Leverage borrowed from relationships with influential actors or networks."
    rule_of_thumb: "Default to expert + referent; reserve coercive power for safety, fraud, or non-negotiable compliance."
  power_dynamics:
    power_distance_hofstede:
      high_pdi_pattern: "Deference to hierarchy, top-down decisions, low upward challenge."
      low_pdi_pattern: "More challenge, consultation, and legitimacy from competence."
    power_asymmetry: "Unequal leverage creates dependency, compliance pressure, and uneven bargaining outcomes."
    dependency_theory_emerson:
      formula: "Power_A_over_B rises as B's dependence on A rises."
      dependence_drivers:
        resource_value: "How critical A's resource is to B."
        substitute_availability: "How easily B can obtain the same resource elsewhere."
      leverage_moves:
        increase_power: ["Control higher-value resources", "Reduce substitutes", "Build unique expertise or access"]
        reduce_opponent_power: ["Create alternatives", "Diversify dependence", "Form counter-coalitions"]
    rule_of_thumb: "Map who depends on whom before using formal authority."
  organizational_politics:
    definition: "Informal behavior used to secure resources, protect interests, or shape decisions under ambiguity."
    structural_drivers:
      scarce_resources: "Competition intensifies when money, positions, or strategic projects are limited."
      ambiguous_goals: "Unclear success criteria invite rival interpretations and influence contests."
      technological_complexity: "Opaque expertise creates informational dependence."
      organizational_change: "Restructuring and leadership turnover raise threat perception and political maneuvering."
    modes:
      functional_politics: "Uses coalition, negotiation, and advocacy in ways still defensible as organizationally useful."
      dark_side_politics: "Uses deception, sabotage, intimidation, or concealment for asymmetric personal gain."
    rule_of_thumb: "Assume politics exists wherever stakes are high and rules are incomplete."
  political_tactics:
    coalition_building: "Aggregate allies around shared interests to increase bargaining power."
    networking: "Accumulate future leverage through broad, maintained relationships."
    alliance_forming: "Create more explicit, longer-term cooperative arrangements with defined mutual benefit."
    information_control: "Shape decisions by withholding, filtering, delaying, or overcomplicating information."
    impression_management: "Engineer favorable perceptions through visible signals, presentation, and selective storytelling."
    image_building: "Sustain a long-horizon personal brand that reinforces influence claims."
    scapegoating: "Shift blame to weaker actors to protect position or legitimacy."
    cooptation: "Neutralize resistance by inviting skeptics into the process and binding them to ownership."
    legitimating: "Invoke rules, precedent, delegated authority, or expert backing to justify action."
    rational_persuasion: "Use evidence and logic to convert support."
    personal_appeals: "Draw on personal loyalty or reciprocity rather than formal case-building."
    exchange: "Trade resources, support, or concessions for cooperation."
    defensive_moves:
      - "Document facts and decision trails."
      - "Build independent relationships before conflict starts."
      - "Ask for source data when claims seem filtered."
      - "Counter scapegoating with evidence, not emotion."
    rule_of_thumb: "Use coalition + rational persuasion first; treat information control and scapegoating as red flags."
  cialdini_influence_principles:
    reciprocity: "Giving first raises the odds of later compliance."
    commitment_and_consistency: "Small public commitments increase follow-through on larger asks."
    social_proof: "People infer correctness from visible adoption by others."
    authority: "Perceived expertise or status increases compliance."
    liking: "Similarity, warmth, and affinity increase persuasion."
    scarcity: "Perceived rarity or deadline raises urgency."
    unity: "Shared identity increases trust and willingness to cooperate."
    rule_of_thumb: "Match the principle to audience psychology; avoid stacking principles in manipulative ways."
  stakeholder_power_interest_grid:
    axes:
      power: "Ability to block, enable, fund, or redirect the initiative."
      interest: "Attention level and consequence exposure."
    quadrants:
      high_power_high_interest: "Manage closely with frequent engagement and expectation alignment."
      high_power_low_interest: "Keep satisfied with concise, risk-focused updates."
      low_power_high_interest: "Keep informed and convert into advocates where possible."
      low_power_low_interest: "Monitor lightly; escalate communication only on material change."
    rule_of_thumb: "Spend most stakeholder time on high-power actors, but never ignore high-interest groups."
  yukl_tracey_influence_tactics:
    rational_persuasion: "Lead with evidence."
    inspirational_appeals: "Connect action to values, identity, or vision."
    consultation: "Invite input to create ownership."
    ingratiation: "Build goodwill before the ask."
    personal_appeals: "Use relationship capital."
    exchange: "Offer a reciprocal benefit."
    coalition: "Signal broader support."
    legitimating: "Reference role, rule, or mandate."
    pressure: "Use insistence or threat only for urgent edge cases."
    rule_of_thumb: "For durable support, prefer rational persuasion + consultation + inspiration over pressure."
  ethical_politics_screen_velasquez:
    criteria:
      utility: "Does the action improve net outcomes beyond narrow self-interest?"
      rights: "Does it respect others' autonomy and access to truthful information?"
      justice: "Are burdens and benefits allocated fairly?"
      virtues: "Is the behavior consistent with honesty, courage, and integrity?"
      care: "Does it account for relationship and human impact?"
    rule_of_thumb: "If a tactic fails transparency, fairness, or truthfulness tests, classify it as unethical politics."

emotional_intelligence_models:
  goleman_5_components:
    self_awareness: "Accurately recognize one's own emotions, triggers, strengths, and limits."
    self_regulation: "Manage impulses and remain composed under pressure."
    motivation: "Sustain intrinsic drive toward goals, mastery, and progress."
    empathy: "Read others' emotions and perspectives without immediate judgment."
    social_skills: "Build trust, influence, resolve conflict, and coordinate action."
    rule_of_thumb: "Self-awareness is upstream; weak self-awareness degrades every other EQ capability."
  goleman_4_domains_12_competencies:
    self_awareness:
      competencies: ["Emotional self-awareness", "Accurate self-assessment", "Self-confidence"]
    self_management:
      competencies: ["Emotional self-control", "Adaptability", "Achievement orientation", "Positive outlook"]
    social_awareness:
      competencies: ["Empathy", "Organizational awareness"]
    relationship_management:
      competencies: ["Influence", "Coaching and mentoring", "Conflict management", "Teamwork and collaboration", "Inspirational leadership"]
    rule_of_thumb: "Sequence capability as notice self -> regulate self -> read context -> lead relationships."
  comparative_eq_models:
    bar_on_eq_i:
      structure: "5 composites, 15 subscales across intrapersonal, interpersonal, adaptability, stress management, and general mood."
      distinctive_feature: "Includes optimism and happiness as explicit components."
      best_fit: "Broad assessment, HR, counseling, self-report contexts."
    mayer_salovey_caruso_msceit:
      structure: ["Perceive emotion", "Use emotion", "Understand emotion", "Manage emotion"]
      distinctive_feature: "Ability model with objective-style scoring."
      best_fit: "Research, selection, and tighter construct validity."
    trait_ei_petrides:
      structure: "Treats EI primarily as a personality-like disposition."
      distinctive_feature: "Stability is emphasized more than trainable skill."
      best_fit: "Trait profiling rather than leadership development."
    rule_of_thumb: "Use Goleman for leadership coaching, Bar-On for broad profiling, MSCEIT for ability testing."
  leadership_styles_linked_to_eq:
    visionary: "Sets direction through confidence, meaning, and influence."
    coaching: "Develops people through empathy, patience, and feedback."
    affiliative: "Repairs trust and cohesion through care and relational sensitivity."
    democratic: "Uses listening and inclusion to improve buy-in and decision quality."
    pacesetting: "Pushes speed and standards; high output, high burnout risk."
    commanding: "Uses directive control; effective in crisis, corrosive if normalized."
    rule_of_thumb: "Rely most on visionary, coaching, affiliative, and democratic; use pacesetting and commanding sparingly."
  neuroscience_and_regulation:
    amygdala_hijack: "Threat response can bypass reflective control and trigger impulsive action."
    prefrontal_reengagement: "Pause, breathing, and reframing restore deliberate control."
    mirror_neurons: "Emotion spreads socially; leader mood becomes team mood."
    vagal_tone: "Faster physiological recovery supports better regulation and social connection."
    rule_of_thumb: "Insert a short pause before replying under stress; speed without regulation usually lowers decision quality."
  eq_measurement_and_development:
    measurement_tools:
      esci: "360-degree assessment aligned to Goleman's competency model; strongest for leadership development."
      eq_i_2_0: "Self-report inventory aligned to Bar-On; lower cost, broader accessibility."
      msceit: "Ability-oriented test aligned to Mayer-Salovey-Caruso."
    development_practices:
      mindfulness: "Raises emotion detection and lowers reactivity."
      emotional_journaling: "Improves trigger recognition and reflection accuracy."
      body_scan: "Links physiological cues to early emotion detection."
      compassion_practice: "Expands empathy and reduces threat-driven reactions."
      coaching_and_360: "External feedback accelerates behavioral change and calibration."
    rule_of_thumb: "Measure first, improve one or two weak competencies at a time, and reinforce with repeated feedback."
  eq_in_leadership_context:
    psychological_safety_link: "High-EQ leaders increase candor, error reporting, and learning behavior."
    vietnam_culture_notes:
      collectivism: "EQ is often expressed through group harmony and duty consciousness."
      high_power_distance: "Emotion expression and dissent are filtered through hierarchy."
      face_saving: "Feedback often needs tact and indirectness."
    rule_of_thumb: "Adapt EQ expression to local culture without sacrificing clarity or honesty."

decision_making_models:
  decision_taxonomy:
    programmed_vs_non_programmed:
      programmed: "Routine, rule-based, repeatable decisions."
      non_programmed: "Novel, ambiguous, higher-risk decisions requiring judgment."
    strategic_tactical_operational:
      strategic: "Long-horizon, enterprise-wide, high-resource decisions."
      tactical: "Mid-horizon resource allocation and capability decisions."
      operational: "Short-cycle execution and exception handling."
    individual_vs_group:
      individual: "Faster and clearer accountability, but narrower perspective."
      group: "Better perspective diversity and buy-in, but slower and bias-prone."
    rule_of_thumb: "Match decision process complexity to decision stakes and reversibility."
  classical_rational_decision_model:
    assumptions:
      - "Goals are clear and stable."
      - "Information is sufficiently available and reliable."
      - "Alternatives can be generated and compared."
      - "Decision-maker can optimize expected value."
    steps:
      - "Identify problem"
      - "Clarify objectives"
      - "Generate alternatives"
      - "Evaluate alternatives"
      - "Select best option"
      - "Implement"
      - "Monitor and gather feedback"
      - "Evaluate results"
    rule_of_thumb: "Use the full rational sequence for high-cost, low-reversibility decisions."
  bounded_rationality_simon:
    core_claim: "Decision-makers optimize rarely; they satisfice under cognitive, informational, and time constraints."
    limits:
      cognitive: "Working memory and processing capacity constrain comparison depth."
      information: "Data is incomplete, costly, asymmetric, or excessive."
      time: "Delay can destroy option value."
    satisficing_vs_maximizing:
      satisficing: "Choose the first option that clears a good-enough threshold."
      maximizing: "Search broadly for the theoretical best option."
    common_heuristics:
      availability: "Judge likelihood by recall ease."
      anchoring: "Overweight the first salient number or narrative."
      representativeness: "Infer probability from pattern similarity, not base rate."
      confirmation_bias: "Seek evidence that preserves the current belief."
      sunk_cost_fallacy: "Continue because past investment feels unrecoverable."
    rule_of_thumb: "For fast markets, a timely satisficing choice usually beats a late optimal one."
  intuitive_decision_making_rpd:
    recognition_primed_decision_steps:
      - "Recognize a familiar pattern"
      - "Mentally simulate the likely outcome"
      - "Select the first workable action"
      - "Act and update"
    success_conditions:
      - "High domain experience"
      - "Fast feedback loops"
      - "Stable pattern environment"
    failure_conditions:
      - "Novel domains"
      - "Slow or noisy feedback"
      - "High ego or high bias load"
    rule_of_thumb: "Trust intuition only where repeated experience has built pattern quality."
  kahneman_systems_and_biases:
    system_1: "Fast, automatic, low-effort, pattern-based thinking."
    system_2: "Slow, deliberate, high-effort analytical thinking."
    high_impact_biases:
      anchoring: "Initial numbers distort later estimates."
      availability: "Vivid cases outweigh base rates."
      confirmation: "Existing beliefs filter evidence intake."
      overconfidence: "Forecast certainty exceeds actual accuracy."
      loss_aversion: "Potential loss weighs more than equivalent gain."
      framing: "Equivalent options produce different choices when wording changes."
      status_quo: "Inaction feels safer than justified change."
      recency: "Recent signals crowd out longer history."
      halo_effect: "One salient trait contaminates broader evaluation."
      dunning_kruger: "Low competence inflates self-confidence."
    rule_of_thumb: "When stakes are high, force a System 2 review using alternative frames and base rates."
  group_decision_dynamics:
    groupthink:
      definition: "Harmony seeking overrides realistic evaluation of options and risks."
      symptoms:
        - "Illusion of invulnerability"
        - "Collective rationalization"
        - "Belief in inherent morality"
        - "Stereotyped out-group views"
        - "Pressure on dissenters"
        - "Self-censorship"
        - "Illusion of unanimity"
        - "Mindguards filtering contradiction"
      prevention:
        - "Assign a devil's advocate."
        - "Run dialectical inquiry across opposing options."
        - "Hold a second-chance review before commitment."
        - "Use multiple independent groups or red teams."
        - "Bring in external review."
    related_risks:
      group_polarization: "Discussion pushes the final choice toward a more extreme position."
      social_loafing: "Individual effort drops when accountability diffuses."
      abilene_paradox: "Groups agree to an option that no individual actually wants."
    rule_of_thumb: "If everyone agrees too quickly, add structured dissent before deciding."
  decision_techniques_toolkit:
    brainstorming: "Generate options rapidly under a no-judgment rule."
    nominal_group_technique: "Collect ideas individually first, then discuss and rank."
    delphi_method: "Use anonymous multi-round expert estimates to converge forecast ranges."
    six_thinking_hats: "Force distinct passes for facts, emotion, caution, upside, creativity, and process."
    devil_s_advocate: "Explicitly stress-test the preferred option."
    pre_mortem: "Assume failure in advance and backtrack probable causes."
    decision_tree: "Map options, probabilities, and expected value branches."
    cost_benefit_analysis: "Compare quantified gains, costs, and downside adjustments."
    rule_of_thumb: "Use pre-mortem plus one structured scoring method for major decisions."
  situational_and_governance_frameworks:
    ooda_loop:
      stages: ["Observe", "Orient", "Decide", "Act"]
      use_case: "Rapid adaptation in fluid competitive environments."
    cynefin:
      clear: "Apply SOPs: sense-categorize-respond."
      complicated: "Use expert analysis: sense-analyze-respond."
      complex: "Experiment and learn: probe-sense-respond."
      chaotic: "Stabilize first: act-sense-respond."
      disorder: "Diagnose the domain before picking the method."
    rapid:
      roles: ["Recommend", "Agree", "Perform", "Input", "Decide"]
      use_case: "Clarify who proposes, who must consent, who executes, and who owns the final call."
    daci_raci: "Alternative role-clarity frameworks for decision ownership and contribution."
    vroom_yetton_jago_styles:
      ai: "Leader decides alone using available information."
      aii: "Leader gathers input, then decides alone."
      ci: "Leader consults individuals, then decides."
      cii: "Leader consults the group, then decides."
      gii: "Group decides by facilitated consensus."
    eisenhower_matrix:
      q1_urgent_important: "Do now."
      q2_not_urgent_important: "Schedule and protect."
      q3_urgent_not_important: "Delegate or constrain."
      q4_not_urgent_not_important: "Eliminate."
    rule_of_thumb: "First classify the problem type, then assign decision rights, then choose the speed."
  behavioral_economics_and_choice_architecture:
    prospect_theory: "Choices are evaluated relative to a reference point; losses loom larger than gains."
    nudge_and_choice_architecture: "Defaults and environment design shift behavior without removing choice."
    rule_of_thumb: "Check whether the current framing or default is driving the choice more than the economics."
