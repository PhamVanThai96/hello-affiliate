  - "content-frame/02-MODULE-2-CHIEN-LUOC-NOI-DUNG.md"
  - "content-frame/09-TAI-LIEU-BO-SUNG-CONG-CU-TEMPLATE.md"
  - "course-docs/04-PHAN-4-CHIEN-LUOC-QUAN-TRI.md"
