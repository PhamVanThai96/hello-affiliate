copywriting_formulas:
  aida:
    full_name: "Attention - Interest - Desire - Action"
    execution:
      attention: "Provocative hook, disruptive visual, or startling statistic."
      interest: "Connect hook to relatable problem; elaborate on relevance."
      desire: "Paint vivid picture of transformation; demonstrate social proof & benefits."
      action: "Direct, frictionless call to action (click, register, purchase)."
    best_use: "Sales pages, direct response ads, email sequences, landing pages."
  pas:
    full_name: "Problem - Agitate - Solution"
    execution:
      problem: "Pinpoint exact pain point customer experiences."
      agitate: "Intensify emotional and financial cost of leaving problem unsolved."
      solution: "Introduce product/method as the definitive relief."
    best_use: "Problem-solving products, healthcare, B2B software, service businesses."
  fab:
    full_name: "Feature - Advantage - Benefit"
    execution:
      feature: "What the product has or is (technical specification)."
      advantage: "What that feature does better than alternatives."
      benefit: "What meaningful emotional or tangible value the user extracts."
    mental_test: "Append 'So that you can...' to every feature statement."
    best_use: "Consumer electronics, SaaS specs, physical products, FMCG."
  bab:
    full_name: "Before - After - Bridge"
    execution:
      before: "Current world characterized by frustration and limitation."
      after: "Desired idealized future state where problem is resolved."
      bridge: "The specific product or process that takes you from Before to After."
    best_use: "Fitness transformations, coaching, career development, case studies."
  storybrand_sb7:
    full_name: "Donald Miller 7-Part StoryBrand Framework"
    axioms:
      - "The Customer is the Hero, NOT the Brand."
      - "The Brand is the Guide (with Empathy and Authority)."
    steps:
      1_hero: "A character wants something."
      2_problem: "Hero encounters external, internal, and philosophical problems."
      3_guide: "Hero meets a guide who expresses empathy and demonstrates competence."
      4_plan: "Guide gives hero a simple 3-4 step plan to eliminate confusion."
      5_call_to_action: "Guide challenges hero to take direct or transitional action."
      6_avoid_failure: "Explicit consequences if hero chooses inaction."
      7_success: "Vivid depiction of how hero's life is transformed."

short_form_video_engineering:
  temporal_pacing_architecture:
    0_to_3s_hook:
      objective: "Halt thumb scroll; defeat initial drop-off."
      tactics: ["Pattern interrupt", "Fast on-screen text", "Shocking question", "Contrarian truth"]
      fatal_flaw: "Logos, self-introductions, slow speech, silence."
    3_to_15s_retention_setup:
      objective: "Establish narrative stakes and relatable tension."
      tactics: ["Introduce context", "Show before state", "Tease unexpected twist"]
    15_to_45s_core_value_delivery:
      objective: "Deliver educational or entertainment payoff without bloat."
      tactics: ["Cut visual angle every 2.0-3.0s", "Dynamic captions", "Sound effects for emphasis"]
    45_to_60s_frictionless_cta:
      objective: "Channel engagement into conversion."
      tactics: ["Single explicit action: Comment keyword / Link in bio / Save for reference"]
  scoring_and_audit_algorithm:
    formula: "Composite_Score = (0.35 * Engagement) + (0.10 * Growth) + (0.55 * Retention_Quality)"
    critical_thresholds:
      stop_rate_3s: "Target > 65% (below 50% = immediate hook failure)"
      completion_rate: "Target > 30% for 30s video; > 20% for 60s video"
      save_to_like_ratio: "Target > 0.15 indicates high utility/evergreen value"

native_platform_formatting_matrix:
  tiktok:
    algorithm_driver: "Watch time completion, shares, replays."
    production_aesthetic: "Lo-fi, authentic, smartphone camera, jump-cuts, trending audio."
  facebook:
    algorithm_driver: "Comment threads, emotional shares, meaningful social interactions."
    production_aesthetic: "Community-driven, square/vertical video, emotional storytelling, carousels."
  linkedin:
    algorithm_driver: "Dwell time, substantive comments from industry professionals."
    production_aesthetic: "Document PDF carousels, text frameworks, contrarian career insights."
  email_marketing:
    algorithm_driver: "Inbox deliverability, open rate, single-click CTR."
    production_aesthetic: "Plain text appearance, conversational tone, 1 primary hyperlink CTA above fold."
