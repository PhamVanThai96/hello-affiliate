axioms_and_definitions:
  content_marketing:
    definition: "Strategic creation and distribution of valuable, relevant, and consistent content to attract, acquire, and engage a clearly defined target audience—driving profitable customer action."
    primary_objective: "Build long-term digital asset equity and trust; drive indirect conversion through customer lifecycle nurturing."
  differentiation_matrix:
    copywriting:
      focus: "Direct immediate action / transactional response."
      time_horizon: "Short-term (immediate click, sign-up, checkout)."
      format: "Sales pages, PPC ad copy, BOFU landing pages, email subject lines."
    content_marketing:
      focus: "Value exchange, education, narrative engagement, brand retention."
      time_horizon: "Medium to long-term compound growth."
      format: "Guides, pillar articles, podcasts, video series, educational carousels."
    advertising:
      focus: "Paid interruption to capture rented audience attention."
      time_horizon: "Transient (stops when budget is depleted)."
    pr_public_relations:
      focus: "Third-party credibility, corporate reputation, crisis management."
      gatekeepers: "Media editors, institutional stakeholders."
    branding:
      focus: "Identity, perceptual positioning, emotional promise, design language."

three_value_layers_engine:
  concept: "Hierarchical product value decomposition determining content angles per audience segment."
  layers:
    1_functional_value:
      scope: "Physical attributes, technical specifications, ingredients, mechanics."
      customer_cognitive_question: "What does it do and does it work for me?"
      content_angle: "How-to tutorials, ingredient breakdown, feature comparison specs, unboxing."
      best_for: "Low-awareness or price-sensitive functional buyers."
    2_emotional_value:
      scope: "Psychological relief, reduced anxiety, joy, sensory satisfaction, peace of mind."
      customer_cognitive_question: "How do I feel while and after using this?"
      content_angle: "Before-after emotional states, stress-relief narratives, customer comfort stories."
      best_for: "Consideration phase, competitive alternatives comparison."
    3_symbolic_value:
      scope: "Identity expression, moral stance, subcultural affiliation, socio-economic status."
      customer_cognitive_question: "What does using this product say about who I am to the world?"
      content_angle: "Manifesto, sustainable ethics, community belonging, luxury aesthetic."
      best_for: "Brand advocates, high customer retention, price-inelastic premium segments."

marketing_evolution_paradigms:
  marketing_1_0:
    focus: "Product-centric (Industrial Revolution) -> 4P transactional selling."
  marketing_2_0:
    focus: "Customer-centric (Information Age) -> STP segmentation and relationship marketing."
  marketing_3_0:
    focus: "Human-centric (Values-driven) -> Mission, vision, corporate social responsibility."
  marketing_4_0:
    focus: "Digital connectivity -> Kotler 5A customer journey, omnichannel, social advocacy."
  marketing_5_0:
    focus: "Technology for Humanity -> AI, NLP, sensor data, Martech automation augmented by human empathy."

competency_framework_3x3:
  strategic_mindset:
    - "Customer Journey & Funnel Architecture Mapping"
    - "Competitor Content Intelligence & Gap Auditing"
    - "Content Strategy & KPI/OKRs Alignment"
  creative_production:
    - "High-Conversion Multi-channel Copywriting"
    - "Short-Form Video Scripting & Pacing (TikTok/Reels)"
    - "Visual Hierarchy & Native Formatting (Carousels/Infographics)"
  data_and_technology:
    - "Search Engine Optimization (On-Page, E-E-A-T, Intent Mapping)"
    - "Performance Analytics (GA4, Meta Insight, CRO)"
    - "AI Workflow Engineering (LLM Prompting, Programmatic Content)"

additional_synthesis_notes:
  content_market_fit_diagnostics:
    readability_watchability_matrix: "Score category-level willingness to read vs willingness to watch before choosing content depth, format, and channel mix."
    category_examples:
      fashion_low_readability: "Low appetite for long-form educational reading; stronger dependence on visual/social/influencer discovery."
      education_high_readability: "Supports deeper educational articles plus explanatory video."
  strategy_positioning_extensions:
    three_c_model: "Consumer problem + Company solution + Competitor solution -> isolate point of difference and point of parity."
    strategy_canvas: "Plot brand vs competitors across decision criteria to identify defensible messaging territory."
    value_matrix_formula: "Best-fit segment + specific pain + product value = key message."
  lead_generation_content_filters:
    mirage_content_risk: "Generic high-volume topics can drive awareness traffic without qualified lead generation."
    qualifying_rule: "Specific customer + specific pain + explicit USP/CTA outperform broad advice content."
    content_mapping_purpose: "Map stage-specific content, channel coverage, and content gaps across the funnel."
  platform_and_campaign_notes:
    facebook_distribution_basics: "Optimize timing/frequency; concentrate seeding, cross-sharing, and comment response in the first 2 hours."
    tiktok_distribution_basics: "Early watch time, completion, rewatch, comment, and share signals control multi-stage reach expansion; test early format variants to find audience fit."
    threads_organic_pattern: "Short reflective posts and open questions benefit from recency + comment/repost signals."
    imc_role: "IMC is primarily an awareness/positioning system inside Promotion/Communication of the 6P mix."
  message_development_logic:
    from_insight_to_message: "Translate communication task and raw product truth into campaign idea plus concise key message."
    phase_design_rule: "Use 1, 2, or 3 communication phases based on budget, campaign length, and awareness/consideration/conversion objective mix."
